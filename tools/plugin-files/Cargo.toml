[package]
name = "paperpaw-plugin-files"
description = "PaperPaw's own plugins that the store offers, as native plugin files (ADR 0024): built, packed and signed by the release pipeline for every release"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as a plugin's repository is: its files must fit
# the firmware built in shells/xteink, with the same compiler and SDK.
[workspace]

[[bin]]
name = "news"
path = "src/bin/news.rs"
test = false
bench = false

[[bin]]
name = "picture-home"
path = "src/bin/picture-home.rs"
test = false
bench = false

[[bin]]
name = "vocabulary"
path = "src/bin/vocabulary.rs"
test = false
bench = false

[dependencies]
paperpaw-sdk = { path = "../../crates/paperpaw-sdk" }
paperpaw-plugin-picture-home = { path = "../../plugins/picture-home" }
paperpaw-plugin-news = { path = "../../plugins/news" }
paperpaw-plugin-vocabulary = { path = "../../plugins/vocabulary", default-features = false }

# As the firmware is built: small code, one unit, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Lines in the ELF, for naming the functions of a crash's calls.
debug = "line-tables-only"
