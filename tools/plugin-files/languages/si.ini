core.usb-drive.title = USB ධාවකය
core.usb-drive.text = USB ධාවකයක් ලෙස සම්බන්ධ කර ඇත: කාඩ්පත පරිගණකයේ ඇත. එය ආපසු ලබා ගැනීමට එහිදී ධාවකය පිට කරන්න, නැතහොත් ආපසු ඔබන්න; ඉන්පසු හරි ඔබන්න. ඔබ පිටපත් කළ ගොනු පසුව පුස්තකාලයේ දිස් වේ.
core.usb-link.title = USB සංවර්ධක මෙවලම්වලට ඉඩ දෙන්නද?
core.usb-link.text = USB කේබලයට සම්බන්ධ පරිගණකයකට බොත්තම් එබීමට, තිර රූ ගැනීමට, සහ පොත් හා ප්ලගින ගොනු කියවීමට හා ලිවීමට හැකි වේ. එයට රහස් කියවීමට හෝ කේත ස්ථාපනය කිරීමට නොහැක. උපාංගය නැවත ආරම්භ වූ විට හෝ නින්දට ගිය විට, කේබලය ගැලවූ විට, හෝ ඔබ මෙහිදී එය අක්‍රිය කළ විට එය නතර වේ.
