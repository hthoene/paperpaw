about.plugin.name = පිළිබඳ
about.plugin.description = PaperPaw අනුවාදය සහ බලපත්‍ර.
about.plugin.how = "පිළිබඳ මගින් ඔබ සතු PaperPaw අනුවාදය, එහි මූලාශ්‍ර කේතය ඇති තැන, සහ එය ලැබෙන බලපත්‍ර පෙන්වයි.\n\nඑය සැකසීම්වල අවසානයේ, PaperPaw පිළිබඳ ලෙස ඇත. ඊතල බොත්තම් සහ තෝරන්න මගින් පේළියක් තෝරන්න, නැතහොත් එය තට්ටු කරන්න. ස්ථිරාංගයේ ඇතුළත් ප්ලගින ද, කේත සහිත ප්ලගින පූරණය කරන උපාංගවල එවැනි ප්ලගින සෑදිය යුතු ඇඟිලි සලකුණ ද එහි ලැයිස්තුගත වේ.\n\nබලපත්‍ර කියවීමේදී පෙළක් ලෙස විවෘත වන බැවින් ඔබ එය පොතක් මෙන් පෙරළයි. එහි PaperPaw හි බලපත්‍රය සහ එය සමඟ එන අකුරු වර්ග, අයිකන සහ පද බෙදීමේ රටාවල බලපත්‍ර ඇත. තේමාවක කර්තෘ වැනි තමන්ගේම පේළියක් ප්ලගිනවලට එක් කළ හැක."
about.version.beta = {version} බීටා {number}
