setup.plugin.how = "පිහිටුවීම යනු PaperPaw පළමු වරට ආරම්භ වන විට එක් වරක් පමණක් පෙන්වන, වැදගත් සැකසීම් හරහා කෙටි මඟපෙන්වීමකි. එක් එක් පිටුව භාෂාව, බොත්තම්, පෙළ ප්‍රමාණය, වේලා කලාපය, Wi-Fi හෝ එක් කළ යුතු ප්ලගින කිහිපයක් වැනි එක් දෙයක් අසයි; සුදුසු පිළිතුරක් දැනටමත් තෝරා ඇති බැවින් “ඊළඟ” සැමවිටම නිවැරදියි. මෙම උපාංගයට අවශ්‍ය නැති පියවර මඟ හැරේ.\n\nබොත්තම් තට්ටු කරන්න, නැතහොත් ඉහළ සහ පහළ බොත්තම් සහ තෝරන්න භාවිත කරන්න. පළමු පිටුවේ “මඟ හරින්න” පිහිටුවීමෙන් වහාම ඉවත් වේ. අවසන් පිටුව ඔබේ පොත් පැමිණෙන්නේ කොහෙන්දැයි කියයි.\n\nඑය නැවත ධාවනය කිරීමට, සැකසීම් විවෘත කර “PaperPaw පිහිටුවන්න” තෝරන්න. මෙහි තෝරන සියල්ල පසුව සැකසීම්වල වෙනස් කළ හැක."
