update.plugin.description = කාඩ්පතෙන් හෝ අන්තර්ජාලයෙන් බාගත් ස්ථිරාංග යාවත්කාලීන ස්ථාපනය කරයි.
update.plugin.how = "යාවත්කාලීනය, X4 වැනි PaperPaw ස්ථිරාංගය වන උපාංගවල නව ස්ථිරාංග ස්ථාපනය කරයි. එය සැකසීම්වල යාවත්කාලීනය ලෙස ඇත.\n\nසබැඳිව සොයන්න යාවත්කාලීන සේවාදායකයෙන් නව PaperPaw එකක් ඉල්ලා බාගනී; Wi-Fi හරහා විනාඩි කිහිපයක් ගත වේ. නැතහොත් යාවත්කාලීන ගොනුවක් (.bin, paperpaw.org වෙතින්) කාඩ්පතේ updates ෆෝල්ඩරයට පිටපත් කරන්න, උදා. Wi-Fi හුවමාරුවෙන්. ස්ථාපනය කරන්න විනාඩියක් පමණ ගෙන උපාංගය නැවත ආරම්භ කරයි; පොත්, සැකසීම් සහ කියවූ ස්ථාන පවතී.\n\nයාවත්කාලීන සොයන්න සක්‍රිය නම් (සැකසීම්වල, මුලින් අක්‍රිය), උපාංගය සතියකට වරක් පමණ ස්වයංක්‍රීයව අසයි, Wi-Fi සක්‍රියව ඇති විට හෝ ආරෝපණය වන විට පමණි. හමු වූ නව PaperPaw මෙහි රැඳේ; ඔබේ කියවීමට බාධා නොවේ. සෙවීමක් උපාංගය ධාවනය කරන දේ පමණක් යවයි, නමක් හෝ අංකයක් නොවේ; උපාංග ගණන් කිරීමට, ඔබ ඇසුවාද සහ එය දිනයේ, සතියේ හෝ මාසයේ පළමු සෙවීමද යන්නද යවයි.\n\nඔබ භාවිත කරන ප්ලගිනවලට නව නිකුතුව සඳහා අනුවාදයක් තවම නැත්නම්, යාවත්කාලීනය ඒවා එනතුරු රැඳේ. පැරණි අනුවාදයක් ස්ථාපනය වන්නේ ඔබ එය තෝරන්නේ නම් පමණි.\n\nCrossPoint වැනි වෙනත් ස්ථිරාංගයක් ද මෙතැනින් ස්ථාපනය වේ: එහි ගොනුව (.bin) updates ෆෝල්ඩරයට දමා යාවත්කාලීනය විවෘත කරන්න. PaperPaw එය මෙම උපාංගයට සම්පූර්ණ, හානි නොවූ ස්ථිරාංගයක්දැයි පරීක්ෂා කරයි, නමුත් අත්සන් කර නැති බැවින් සෑදුවේ කවුදැයි කිව නොහැක. කෙසේ හෝ ස්ථාපනය කරන්න එය ෆ්ලෑෂ් මතකයේ අනෙක් භාගයට ලියා ආරම්භ කරයි; එම ස්ථිරාංගය ඒ මත යමක් ස්ථාපනය කරන තුරු PaperPaw එහි භාගයේ පවතී. පසුව PaperPaw වෙත ආපසු යාමට, අනෙක් ස්ථිරාංගයේ මෙනුවෙන් (උදා. CrossPoint හි SD firmware update) paperpaw-<device>-<version>-install.bin ස්ථාපනය කරන්න."
