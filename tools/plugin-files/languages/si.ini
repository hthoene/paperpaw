files.plugin.name = ගොනු බ්‍රව්සරය
files.plugin.description = උපාංගයේ පොත් සහ ෆෝල්ඩර ලැයිස්තුගත කර ඒවා විවෘත කරයි.
files.plugin.how = "පුස්තකාලය ඔබේ පුස්තකාල ෆෝල්ඩරයේ පොත් ලැයිස්තුගත කරයි, එක් එක් පොතේ කවරය, මාතෘකාව, කර්තෘ සහ ඔබ කොපමණ කියවා ඇත්ද යන්න සමඟ. ඔබ අවසන් වරට කියවූ පොත ඉහළින්ම කාඩ්පතක් ලෙස ඇත, එබැවින් දිගටම කියවීමට එක් තට්ටුවක් හෝ තෝරන්න එක් වරක් එබීම ප්‍රමාණවත්. පුස්තකාලය පොත් සොයන අතරතුර, මෙතෙක් කීයක් හමු වූවාදැයි පවසයි.\n\nපොත්වලට ඉහළින් පෙන්වන දේ තෝරන්න: සියල්ල, කියවමින් පවතින, නොකියවූ හෝ කියවා අවසන් පොත්, නැතහොත් රාක්ක (කර්තෘ, මාලාව, ටැගය, ප්‍රියතම, ඔබ ආරම්භ කළ එක් එක් මාලාවේ ඊළඟ පොත අනුව). කියවීමට පොතක් තට්ටු කරන්න; එය විවෘත කිරීමට, කියවා අවසන් හෝ නොකියවූ ලෙස සලකුණු කිරීමට, එහි තොරතුරු බැලීමට, සංරක්ෂණයට ගෙන යාමට හෝ මැකීමට එය අල්ලාගෙන සිටින්න (බොත්තම් සමඟ තෝරන්න අල්ලාගෙන සිටින්න). පුස්තකාල මෙනුව සඳහා මාතෘකාව තට්ටු කරන්න: පොත් අනුපිළිවෙළ සහ පෙන්වීම, සෙවීම, පුස්තකාල ෆෝල්ඩරය සහ සැකසීම්.\n\nපුස්තකාල ෆෝල්ඩරය සැකසීම්වල පුස්තකාලය යටතේ පුස්තකාල ෆෝල්ඩරය ලෙස සකසනු ලැබේ; එහිදී පොත් කවර ජාලකයක් ලෙස ද පෙන්විය හැක. අනෙක් සියලු ගොනු සඳහා මෙවලම් මෙනුවේ ගොනු භාවිත කරන්න."
