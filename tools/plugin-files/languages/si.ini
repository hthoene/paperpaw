translate.plugin.description = තෝරාගත් පෙළ DeepL සමඟ සබැඳිව පරිවර්තනය කරයි.
translate.plugin.how = "පරිවර්තනය, තෝරාගත් පෙළ DeepL සමඟ සබැඳිව පරිවර්තනය කරයි. පොතක පෙළ තෝරා, තෝරාගත් පෙළේ මෙනුවේ පරිවර්තනය කරන්න තෝරන්න: පරිවර්තනය ශබ්දකෝෂ ප්‍රවේශයක් මෙන් පිටුව මත දිස් වේ. පිටු බොත්තම් හෝ තට්ටු කිරීම් එය අනුචලනය කරයි, තෝරන්න හෝ එහි අවසානයේ තට්ටු කිරීමක් එය වසයි.\n\nඑයට ජාලයක් සහ ඔබේම DeepL API යතුරක් අවශ්‍යයි, deepl.com හි නොමිලේ (DeepL API Free, මසකට අක්ෂර 500,000ක් පමණ). ඔබ එය ඇතුළත් කරන තුරු පැනලය එය පවසන අතර, තට්ටු කිරීමක් එය ඉල්ලයි.\n\nසැකසීම්වල, කියවීම යටතේ, පරිවර්තනය කොටසේ, පරිවර්තනය කරන භාෂාව භාෂාව සකසයි; මුලින් එය PaperPaw හි භාෂාවයි."
