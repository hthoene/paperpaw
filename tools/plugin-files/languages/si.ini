power.plugin.name = බලය
power.plugin.description = බල ප්‍රකාරය අතින් හෝ බැටරිය අනුව තෝරයි: සාමාන්‍ය, ඉතිරි කිරීම, නොබැඳි.
power.plugin.how = "PaperPaw බැටරිය වැය කරන ආකාරය බලය තෝරයි: සාමාන්‍ය, ඉතිරි කිරීම හෝ නොබැඳි. ඉතිරි කිරීම, රැඳී සිටිය හැකි දේ වඩා සුදුසු මොහොතක කරයි; නොබැඳි රේඩියෝව අක්‍රියව තබයි. ස්වයංක්‍රීය බැටරිය අනුව තෝරයි.\n\nප්‍රකාරය ඉක්මන් පැනලයේ (එහි බලය ප්‍රකාර පැත්තෙන් පැත්තට පෙන්වයි) හෝ සැකසීම්හි බලය යටතේ වෙනස් කරන්න. ස්වයංක්‍රීය, ඉතිරි කිරීමට සහ නොබැඳි ප්‍රකාරයට මාරු වන මට්ටම් සහ ආරෝපණය වන විට සාමාන්‍ය ලෙස පවතීද යන්නද එහිදී සකසන්න.\n\nතත්ත්ව තීරුවල බල ප්‍රකාරය, ඉතිරි කිරීමේදී කොළයක් ද නොබැඳි විට කපා හැරි Wi-Fi ලකුණක් ද පෙන්වයි; සාමාන්‍ය විට කිසිවක් නැත.\n\nකුඩා මෙනුවක් සඳහා බල බොත්තම අල්ලාගෙන සිටින්න: නින්ද, ක්‍රියාවිරහිත කරන්න (PaperPaw හට හැකි තැන), නැවත ආරම්භ කරන්න, සහ ස්පර්ශ උපාංගවල ස්පර්ශය අගුළු දමන්න හෝ ස්පර්ශය අගුළු හරින්න. කෙටි එබීමක් තවමත් උපාංගය නින්දට යවයි. ආපසු මෙනුවෙන් ඉවත් වේ."
