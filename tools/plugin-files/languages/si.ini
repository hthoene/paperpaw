news.plugin.how = "“පුවත්” RSS හෝ Atom සංග්‍රහ පොත් බවට පත් කරයි. සෑම සංග්‍රහයක්ම පුස්තකාලයේ News ෆෝල්ඩරයේ එක් පොතක් වන අතර, එහි නවතම ලිපි සරල පෙළ ලෙස ඇත; වෙනත් ඕනෑම පොතක් මෙන් කියවන්න.\n\nමෙවලම් මෙනුවෙන් “පුවත්” විවෘත කර “සංග්‍රහයක් එක් කරන්න” තෝරන්න; එහි ලිපිනය පුවත්පතේ හෝ බ්ලොගයේ වෙබ් අඩවියේ ඇත. “පුවත් ලබා ගන්න” සියලු සංග්‍රහ ලබා ගෙන පෙර පොත් ප්‍රතිස්ථාපනය කරයි. සංග්‍රහයක් තනිව ලබා ගැනීමට හෝ ඉවත් කිරීමට එය අල්ලාගෙන සිටින්න (බොත්තම්වලින්, “තෝරන්න” අල්ලාගෙන සිටින්න). ඉවත් කළ සංග්‍රහයක පොත පුස්තකාලයේ පවතී.\n\nලබා ගැනීමට ජාලයක් අවශ්‍යයි. “සංග්‍රහයකට ලිපි” (සැකසීම්, පුස්තකාලය) එක් එක් පොතේ ලිපි ගණන සකසයි. “පුවත් සිරස්තල” විජට් ඒවා මුල් තිරයේ පෙන්වයි."
