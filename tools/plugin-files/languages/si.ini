aids.plugin.name = කියවීමේ ආධාර
aids.plugin.description = තද වචන ආරම්භ, ප්‍රතිස්ථාපිත වචන, පින්තූර: ඔබට අවශ්‍ය ලෙස පෙළ.
aids.plugin.how = "කියවීමේ ආධාර ඔබ කියවන විට පොතක පෙළ පෙනෙන ආකාරය වෙනස් කරයි. ඒවා සෑම පොතකටම යෙදේ. තද වචන ආරම්භ සහ වචන ප්‍රතිස්ථාපනය මුලින් අක්‍රියයි.\n\nඒවා සැකසීම්, කියවීම යටතේ, කියවීමේ ආධාර කොටසේ ඇත. තද වචන ආරම්භ එක් එක් වචනයේ පළමු භාගය තද අකුරින් පෙන්වයි; සමහරුන්ට එය අනුගමනය කිරීමට පහසුය. වචන ප්‍රතිස්ථාපනය “colour = color; Mr. = Mister” ලෙස, තිත් කොමාවලින් වෙන් කළ යුගල ගනී.\n\nප්‍රතිස්ථාපනය වන්නේ ඔබ ලියූ ආකාරයටම සම්පූර්ණ වචන පමණි, එබැවින් “color” කිසිදා දිගු වචනයක කොටසක් වෙනස් නොකරයි. පොත් ගොනුව වෙනස් නොවේ.\n\nපොත්වල පින්තූර පෙන්විය හැක (මුලින් මෙන්), පින්තූරයේ විස්තරය භාවිත කරන “[පින්තූරය: මුහුදේ නැවක්]” වැනි කෙටි පේළියක් බවට පත් කළ හැක, නැතහොත් ඉවත් කළ හැක. එවිට පිටුවක පෙළට වැඩි ඉඩක් ඇති අතර නොපෙන්වන පින්තූර විකේතනය නොවන බැවින් පිටු වේගයෙන් පෙරළේ. කොමික් සහ පින්තූර වලින් සෑදූ වෙනත් පොත් වෙනස් නොවේ."
