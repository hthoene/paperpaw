opds.plugin.description = OPDS නාමාවලි පිරික්සයි, ඒවායේ පොත් බාගනී සහ ෆෝල්ඩර ඒවා සමඟ සමමුහුර්තව තබයි.
opds.plugin.how = "OPDS නාමාවලි යනු Project Gutenberg, Calibre-Web, Kavita හෝ Komga වැනි සබැඳි පුස්තකාලයි. මෙම ප්ලගිනය ඒවා ෆෝල්ඩර මෙන් පිරික්සා සොයන අතර ඒවායේ පොත් පුස්තකාලයට බාගනී.\n\nමෙවලම් මෙනුවෙන් නාමාවලි විවෘත කර නාමාවලිය එක් කරන්න තෝරන්න: ලිපිනයක් සහ, නාමාවලියට ගිණුමක් අවශ්‍ය නම්, පරිශීලක නාමයක් සහ මුරපදයක්. නාමාවලියක් පිරික්සීමට එය තට්ටු කරන්න; එය සමමුහුර්ත කිරීමට, සංස්කරණය කිරීමට හෝ ඉවත් කිරීමට එය අල්ලාගෙන සිටින්න (බොත්තම් සමඟ, තෝරන්න අල්ලාගෙන සිටින්න).\n\nමෙම නාමාවලිය සමමුහුර්ත කරන්න සක්‍රිය විට, නාමාවලි සමමුහුර්ත කරන්න එහි නව පොත් එහි ෆෝල්ඩරයට බාගනී. සමමුහුර්තයකට පොත් මගින් එක් සමමුහුර්තයක් ලබා ගන්නා ගණන සීමා කරයි, එවිට විශාල නාමාවලියක් උපාංගය පුරවන්නේ නැත. නාමාවලියක් වෙනුවට වලාකුළු ෆෝල්ඩරයක් (WebDAV) ද ක්‍රියා කරයි."
