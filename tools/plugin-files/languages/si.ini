transfer.plugin.description = එකම ජාලයේ ඇති බ්‍රව්සරයකින් උපාංගයට පොත් සහ වෙනත් ගොනු දමන්න.
transfer.plugin.how = "Wi-Fi හුවමාරුව, කේබලයක් හෝ යෙදුමක් නොමැතිව, එකම ජාලයේ ඇති බ්‍රව්සරයකින් උපාංගයට පොත් සහ වෙනත් ගොනු දමයි. ඔබට ගොනු ලබා ගැනීමට, ෆෝල්ඩර සෑදීමට සහ මැකීමටද හැක.\n\nමෙවලම් වෙතින් එය විවෘත කරන්න. තිරය ලිපිනයක් පෙළ ලෙස සහ QR කේතයක් ලෙස පෙන්වයි: එය දුරකථනයක හෝ පරිගණකයක බ්‍රව්සරයකින් විවෘත කරන්න, නැතහොත් කේතය ස්කෑන් කරන්න. ලිපිනයේ සෑම වරම අලුතින් සාදන යතුරක් ඇති බැවින් ජාලයේ අන් අයට ඔබේ ගොනු වෙත ළඟා විය නොහැක. තිරය විවෘතව ඇති තාක් හුවමාරුව ක්‍රියා කරයි.\n\nX4 වැනි, PaperPaw විසින්ම Wi-Fi ධාවනය කරන තැන්වල, පහළ ඇති රවුටරයක් නොමැතිව උපාංගයේම ජාලයක් විවෘත කරයි; දුරකථනය කේතයක් ස්කෑන් කර එයට සම්බන්ධ වේ."
