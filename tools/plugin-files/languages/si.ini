format-txt.plugin.name = සරල පෙළ
format-txt.plugin.description = සරල පෙළ ගොනු (.txt) විවෘත කරයි.
format-txt.plugin.how = "සරල පෙළ ගොනු (.txt) වෙනත් ඕනෑම පොතක් මෙන් පුස්තකාලයෙන් විවෘත වේ; කිසිවක් සැකසීමට අවශ්‍ය නැත. ප්ලගිනය UTF-8, UTF-16 සහ Windows-1252 පෙළ කියවන අතර කේතනය තනිවම හඳුනා ගනී.\n\nඡේද ගොනුවේ හිස් පේළි අනුගමනය කරයි; ගොනුවක හිස් පේළි නැත්නම් එක් එක් පේළිය ඡේදයකි. Project Gutenberg ගොනුවල ආරම්භයේ සහ අවසානයේ ඇති බලපත්‍ර පෙළ ඉවත් කර, මාතෘකාව සහ කතුවරයා ශීර්ෂයෙන් ගනු ලැබේ.\n\nගොනුව කිසි විටෙක සම්පූර්ණයෙන් පූරණය නොකරන බැවින් ඉතා විශාල පෙළ ද කුඩා උපාංගවල විවෘත වේ."
format-txt.title = සරල පෙළ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC සහ XTCH පොත් විවෘත කරයි: Xteink කියවනයන් සඳහා කලින් සකසා ඇති පිටු.
format-xtc.plugin.how = "XTC සහ XTCH ගොනු යනු Xteink කියවනයන් සඳහා පරිවර්තක මගින් සාදන, පිටු දැනටමත් පින්තූර ලෙස සකසා ඇති පොත් ය. ඒවා වෙනත් ඕනෑම පොතක් මෙන් පුස්තකාලයෙන් විවෘත වේ.\n\nසෑම පිටුවක්ම ස්ථිර පින්තූරයක් බැවින් පෙළේ ප්‍රමාණය හෝ අකුරු වර්ගය වෙනස් කළ නොහැක. පිටු කළු සහ සුදු හෝ අළු පැහැ හතරකින් යුක්ත වේ. සෑම පිටුවක්ම පෙන්වන විට පමණක් විකේතනය කරන බැවින් X4 හි පවා මතකය ස්වල්පයක් අවශ්‍ය වේ.\n\nගොනුවේ ඇත්නම් මාතෘකාව, කතුවරයා සහ පරිච්ඡේද එයින් ගනු ලැබේ."
format-xtc.title = XTC පිටු
help.plugin.name = ඉඟි
help.plugin.description = තිරයක් පළමු වරට විවෘත වන විට එහි පාලන කරන දේ පෙන්වයි.
help.plugin.how = "තිරයක් පළමු වරට විවෘත වන විට, ඊට ඉහළින් කෙටි සටහනක් එහි පාලන කරන දේ පවසයි: තට්ටු කිරීමක් යන තිරයේ කොටස්, රාමු කර, සහ බොත්තම් කරන දේ.\n\nතට්ටු කිරීමක් හෝ ඕනෑම බොත්තමක් සටහන වසයි; එම තිරය සඳහා එය නැවත නොඑයි. “තවත් ඉඟි එපා” ඒවා සියල්ල අක්‍රිය කරයි.\n\nසැකසීම්හි “පද්ධතිය” යටතේ “ඉඟි” ඒවා සක්‍රිය හෝ අක්‍රිය කරන අතර “ඉඟි නැවත පෙන්වන්න” සෑම තිරයකම සටහන තවත් වරක් පෙන්වයි."
