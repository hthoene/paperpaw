update.not-dual.warning = "එවිට PaperPaw මෙහි යාවත්කාලීන ස්ථාපනය කරයි. කෙසේ වෙතත් මෙම උපාංගයේ වෙනත් ස්ථිරාංගයක් ස්ථාපිත නම්, යාවත්කාලීනයකින් එය උඩින් ලියැවිය හැක. මෙය යෙදීමට PaperPaw නැවත ආරම්භ වේ.\nපසුව මෙය අහෝසි කිරීමට: යාවත්කාලීන, “ද්විත්ව ආරම්භය නැවත හඳුනාගන්න”, හෝ paperpaw.ini හි dual-boot = auto."
