core.secrets-unreadable = {file} කියවිය නොහැකි වූ බැවින් මුරපද සහ යතුරු සුරැකෙන්නේ නැත. පරිගණකයකදී ගොනුව නිවැරදි කරන්න හෝ ඉවත් කරන්න.
core.secrets-unopened = මෙම කාඩ්පතේ සුරැකි සමහර මුරපද සහ යතුරු මෙහි විවෘත කළ නොහැක: ඒවා වෙනත් උපාංගයක සුරැකිණි, නැතහොත් මෙම උපාංගයේ යතුර නැති විය. ප්ලගිනයක් ඒවා ඉල්ලන තැනදී නැවත ඇතුළත් කරන්න.
core.secrets-unsupported = මෙම උපාංගයට තවම මුරපද සුරැකිය නොහැක. paperpaw.org හි වෙබ් ෆ්ලෑෂරය මගින් PaperPaw එක් වරක් නැවත ස්ථාපනය කරන්න, එවිට එය ක්‍රියා කරයි.
core.card.missing = මතක කාඩ්පතක් හමු නොවූ බැවින් කිසිවක් සුරැකෙන්නේ නැත. FAT32 කාඩ්පතක් ඇතුළු කර නැවත ආරම්භ කරන්න.
