wifi.plugin.description = අවශ්‍ය විට Wi-Fi ජාලවලට සම්බන්ධ වී, පසුව රේඩියෝව අක්‍රිය කරයි.
wifi.plugin.how = "ප්ලගිනයකට අන්තර්ජාලය අවශ්‍ය විට (නාමාවලියක්, සමමුහුර්තයක්, වෙළඳසැල, හුවමාරුවක්) Wi-Fi ජාලයකට සම්බන්ධ වන අතර, බැටරිය සහ මතකය ඉතිරි කිරීමට, කිසිවක් එය භාවිත නොකරන විට මිනිත්තුවකට පසු, නැතහොත් මුල් පිටුව හෝ පොතක් පෙන්වූ වහාම, රේඩියෝව නැවත අක්‍රිය කරයි.\n\nසැකසීම්වලින්, හෝ තත්ත්ව තීරුවේ Wi-Fi අයිතමයෙන් Wi-Fi විවෘත කරන්න. “ජාල” පරාසය තුළ ඇති ජාල පෙන්වයි; එකක් තෝරා එහි මුරපදය ටයිප් කරන්න, නැතහොත් “දුරකථනයෙන් පිහිටුවන්න” තෝරා, නම සහ මුරපදය උපාංගය වෙනුවට ඔබේ දුරකථනයේ බ්‍රවුසරයේ ටයිප් කරන්න. “අමතක කරන්න” මගින් සුරැකි ජාලයක් ඉවත් කරයි.\n\nමුරපද කාඩ්පතේ ආරක්ෂිතව තබා ඇති අතර, ඒවා නැවත කිසිදා නොපෙන්වයි. “අවශ්‍ය විට සම්බන්ධ වන්න” යටතේ, අවසන් භාවිතයෙන් පසු Wi-Fi කොපමණ වේලාවක් සක්‍රියව තිබේද, ආරෝපණය වන අතරතුර සක්‍රියව තිබේද, සහ ජාල කිහිපයක් පරාසය තුළ ඇති විට කුමන සුරැකි ජාලය මුලින්ම එන්නේද යන්න සකසන්න."
