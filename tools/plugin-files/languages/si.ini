menu.plugin.description = ක්‍රියා සහ සැකසීම් සහිත, තිරයේ පහළින් ඇති මෙනුව.
menu.plugin.how = "මෙනුව ඔබට කළ හැකි සහ සැකසිය හැකි දේ ලැයිස්තුගත කරයි. එය විවෘත වී ඇති ඕනෑම දෙයකට ඉහළින්, තිරයේ පහළින් විවෘත වේ: කියවන අතරතුර තිරයේ මැද තට්ටු කරන්න හෝ “තෝරන්න” ඔබන්න. ඇතුළත් කිරීමක් ක්‍රියාත්මක කිරීමට එය තට්ටු කරන්න හෝ තෝරන්න.\n\nමෙනුවේ සැකසීම් ඒවායේ අගය පෙන්වන අතර එතැනම වෙනස් වේ, එබැවින් මෙනුව විවෘතව පවතී. තවත් ඇතුළත් කිරීම් ඇති ඇතුළත් කිරීමක් උප මෙනුවක් විවෘත කරයි.\n\nඉක්මන් පැනලය සඳහා ඉහළ දාරයේ සිට පහළට ස්වයිප් කරන්න: ඔබ නිතර වෙනස් කරන දේ, බොත්තම් ලෙස. බොත්තමක් මාරු කිරීමට එය තට්ටු කරන්න, එහි සැකසීම් සඳහා අල්ලාගෙන සිටින්න. බොත්තම් පමණක් ඇති විට ඊතල බොත්තම් තෝරයි, “තෝරන්න” මාරු කරයි, “ආපසු” වසයි. “පෙනුම” යටතේ “මෙනු” මෙනු ලැයිස්තුවක් ලෙස හෝ ටයිල් ලෙස පෙන්වයි."
