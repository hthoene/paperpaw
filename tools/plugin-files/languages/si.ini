home.plugin.name = මුල් තිරය
home.plugin.description = ආරම්භක පිටුව: කියවන පොත සහ මෙවලම් වැනි විජට් සහිත පිටු.
home.plugin.how = "මුල් තිරය පිටුවලින් සැදී ඇත; එක් එක් පිටුව දුරකථනයක මෙන් විජට් සහ මෙවලම් ජාලකයකි. මුලින් ඔරලෝසුව, ඔබ කියවන පොත සහ මෑතදී කියවූ පොත් එක් පිටුවක ද, සියලු මෙවලම් ඊළඟ පිටුවේ ද ඇත.\n\nඅයිතමයක් විවෘත කිරීමට එය තට්ටු කරන්න; පිටු මාරු කිරීමට ස්වයිප් කරන්න හෝ පිටු බොත්තම් භාවිත කරන්න. බොත්තම් පමණක් ඇති විට ඊතල බොත්තම් එක් අයිතමයකින් ඊළඟට යයි, “තෝරන්න” එය විවෘත කරයි.\n\nනැවත සැකසීමට මුල් තිරය අල්ලාගෙන සිටින්න, පිටුවට පහළ පැන්සල තට්ටු කරන්න හෝ මෙනුවේ “මුල් තිරය සංස්කරණය කරන්න” තෝරන්න. අයිතම ගෙන යාමට ඒවා අදින්න, නැතහොත් විකල්ප සඳහා එකක් තට්ටු කරන්න (බොත්තම්වලින් ද). “විජට් එක් කරන්න” ද එහි ඇත. “තීරු” සහ “පේළි” සැකසීම්හි “පෙනුම” යටතේ “මුල් තිරය” කොටසේ ඇත.\n\nතිරය හරවා ඇති විට මුල් තිරය එම අයිතමම වැඩි තීරු සමඟ පෙන්වයි; කාඩ්පත් 110 මි.මී. පමණකට වඩා පළල් නොවේ, සිරස්ව සැකසූ දේ වෙනස් නොවේ. තිරස්ව සැකසුවොත් එම පිරිසැලසුම එම දිශානතියට වෙනම තබා ගනී; නව විජට් දෙකටම එක් වේ. සංස්කරණයේදී “එක් කරන්න” තුළ ඇති “තිරස් පිරිසැලසුම යළි සකසන්න” ස්වයංක්‍රීය පිරිසැලසුමට ආපසු යයි. එක් දිශානතියකින් ඉවත් කළ විජට් හෝ මෙවලම අනෙකින් ඉවත් නොවේ."
