notes-vault.plugin.name = සටහන් ගබඩාව
notes-vault.plugin.description = Markdown සටහන් ෆෝල්ඩරයක් ෆෝල්ඩර, ටැග් සහ නවතම වෙනස්කම් අනුව කියවයි, මුල් තිරය සඳහා විජට් සමඟ. Obsidian vault සමඟ ක්‍රියා කරයි.
notes-vault.plugin.how = "සටහන් ගබඩාව Markdown සටහන් ෆෝල්ඩරයක් කියවයි (සටහන් යෙදුම් තබා ගන්නා පරිදි සරල .md ගොනු). එය Obsidian vault සමඟ ක්‍රියා කරයි.\n\nගබඩාවේ ෆෝල්ඩරය සැකසීම්වලදී, හෝ මෙවලම්හි ගබඩාවේ පිටුවේදී තෝරන්න. එවිට පිටුව කාඩ්පතේ ඇති පරිදි ෆෝල්ඩර, අවසන් වරට වෙනස් කළ සටහන්, ටැග්, සහ සටහන් මාතෘකාවල සෙවීමක් පිරිනමයි.\n\nපළමු වරට, ගබඩාවේ පිටුව විවෘතව ඇති අතරතුර එය පසුබිමේ සුචිගත කෙරේ; සටහන් දහස් ගණනක ගබඩාවකට විනාඩි කිහිපයක් ගතවේ, ඉන්පසු එය වහාම විවෘත වේ. සුචිය කාඩ්පතේ තබා ඇති අතර, පැය කිහිපයකට පසු ගබඩාවේ පිටුව විවෘත වූ විට හෝ ඔබ යාවත්කාලීන කරන්න තේරූ විට නැවත සාදනු ලැබේ.\n\nසටහනක් කියවීමේදී විවෘත වේ. වෙනත් සටහන්වලට සබැඳි ([[සටහන]], [[සටහන|වචන]], [[සටහන#ශීර්ෂය]]) ගබඩාවේ ඕනෑම තැනක සටහනේ නමින් සොයා ගැනේ; එකක් අනුගමනය කිරීමෙන් එම සටහන විවෘත වන අතර, ආපසු පෙර සටහනට ගෙන යයි.\n\nගබඩාවේ කිසිවක් කිසිදා වෙනස් නොකෙරේ. මුල් තිරය සඳහා විජට් (මෑත සටහන්, ඇමිණූ සටහනක්, දවසේ සටහන, අහඹු සටහනක්, ටැග්, සෙවීම) මුල් තිරයේ සංස්කාරකයේදී එක් කෙරේ. විජට් එකකට එක් ෆෝල්ඩරයකින් පමණක් සටහන් ගත හැක: කාඩ්පතේ මූලයේ සිට ෆෝල්ඩරයේ මාර්ගය (උදා. Notes/Work) විජට් එකේ සැකසීම්වල ලියන්න; හිස්ව තැබුවොත් එය ගබඩාවේ සියලු සටහන් ගනී."
