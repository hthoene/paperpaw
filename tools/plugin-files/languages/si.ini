lock.plugin.description = උපාංගය අවදි වන විට PIN, රටාවක් හෝ මුරපදයක්; කියවන අතරතුර ස්පර්ශය අගුළු දැමීම.
lock.plugin.how = "PaperPaw ආරම්භ වන විට සහ උපාංගය අවදි වන විට තිර අගුල PIN, රටාවක් හෝ මුරපදයක් ඉල්ලයි. මුලින් එය අක්‍රියයි. එය නිකම් භාවිතය පමණක් වළක්වයි: කේතය සහ වැරදි උත්සාහ ගණන SD කාඩ්පතේ තබන බැවින්, කාඩ්පත ඉවත් කරන, සංස්කරණය කරන හෝ මාරු කරන ඕනෑම අයෙකුට අගුල මඟ හැරිය හැක.\n\nඑය සැකසීම්හි “උපාංගය”, “තිර අගුල” යටතේ සකසන්න: භාවිතයේ ඇති කේතය (ඇත්නම්) ඇතුළත් කර, වර්ගය තෝරා, නව කේතය දෙවරක් ඇතුළත් කරන්න. රටාව ස්පර්ශ තිරවල පමණි.\n\nවැරදි උත්සාහ පහකට පසු ඊළඟ එක තත්පර 30ක් රැඳේ. “දැන් අගුළු දමන්න” වහාම අගුළු දමන අතර බොත්තමකට, ඉංගිතයකට හෝ රීතියකට දැමිය හැක. “අවදි වූ පසු අගුළු දමන්න” අක්‍රිය කළ හැක; එවිට සැබෑ ආරම්භයක් (බලය සක්‍රිය කිරීම හෝ නැවත ආරම්භය) පමණක් අගුළු දමයි, බැටරියෙන් ක්‍රියා කරන X4 වැනි, සෑම අවදි වීමක්ම ආරම්භයක් වන තැන හැර.\n\nස්පර්ශ අගුල: ඉක්මන් පැනලයේ සහ කියවීමේ මෙනුවේ “ස්පර්ශය අගුළු දමන්න” තට්ටු කිරීම්, ස්වයිප් කිරීම් සහ පෑන අක්‍රිය කරයි, බොත්තම් තවමත් ක්‍රියා කරයි. අගුල හැරීමට එක් ඇඟිල්ලකින් දෙවරක් තට්ටු කර එය මොහොතක් තබාගෙන සිටින්න; බල බොත්තම අල්ලාගෙන සිටීමෙන් බල මෙනුව විවෘත වේ, එහි “ස්පර්ශ අගුල හරින්න” බොත්තම්වලින් එය කරයි; X4 Pro හි මුල් පිටු යතුර අල්ලාගෙන සිටීමෙන් වහාම අගුල හැරේ."
