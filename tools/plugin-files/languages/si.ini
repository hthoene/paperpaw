core.clean-up.text = ඒවායේ කියවූ ස්ථානය, පිටු සලකුණු, උද්දීපන සහ සටහන් සදහටම මැකී යයි. පරිගණකයකදී නම වෙනස් කළ හෝ වෙනත් තැනකට ගෙන ගිය පොතක්, හෝ ඇතුළු කර නැති මතක කාඩ්පතක ඇති පොතක් ද සොයාගත නොහැක.
