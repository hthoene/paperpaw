edge-light.plugin.name = දාර ආලෝකය
edge-light.plugin.description = ඉදිරිපස ආලෝකය සැකසීමට තිරයේ දාරය දිගේ ස්වයිප් කරන්න: එක් පැත්තක දීප්තිය, අනෙක් පැත්තේ උණුසුම.
