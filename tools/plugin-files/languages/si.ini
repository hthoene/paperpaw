profiles.plugin.name = කියවීමේ පැතිකඩ
profiles.plugin.description = නමක් සහිත කියවීමේ සහ සංදර්ශක සැකසීම් කට්ටල, තට්ටුවකින් මාරු කෙරේ.
profiles.plugin.how = "පැතිකඩක් ඔබේ කියවීමේ සැකසීම්, සංදර්ශක සැකසීම් සහ තත්ත්ව තීරු රාත්‍රිය හෝ විශාල අකුරු වැනි නමක් යටතේ තබාගෙන, තට්ටුවකින් ඒවා නැවත ගෙනෙයි.\n\nකියවීමේ මෙනුවේ තවත් යටතේ, හෝ සැකසීම්හි අභිරුචිකරණය යටතේ පැතිකඩ විවෘත කරන්න. පැතිකඩක් භාවිත කිරීමට එය තට්ටු කරන්න; භාවිතයේ ඇති එක සලකුණු කර ඇත. වත්මන් සැකසීම් එහි සුරැකීමට, නම වෙනස් කිරීමට හෝ ඉවත් කිරීමට එය අල්ලාගෙන සිටින්න (බොත්තම් සමඟ, තෝරන්න අල්ලාගෙන සිටින්න). නව පැතිකඩක් ලෙස සුරකින්න දැන් සකසා ඇති දේ තබා ගනී.\n\nඊළඟ පැතිකඩ ලැයිස්තුවේ ඊළඟ එකට මාරු වේ; එය බොත්තමකට හෝ නීතියකට යොදන්න."
