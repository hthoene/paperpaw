file-sync.setting.when.help = ඔබ ඉල්ලූ විට පමණක්, චාජරය සම්බන්ධ කළ විට ද (උපරිම පැය හයකට වරක්), නැතහොත් Wi-Fi සක්‍රිය විට ද (උපරිම දිනකට වරක්). උපාංගය අවදි කිරීමෙන් කිසිවිට Wi-Fi ක්‍රියාත්මක නොවේ.
