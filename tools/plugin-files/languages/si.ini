wallabag.setup-needed = Wallabag සඳහා පළමුව සේවාදායකය, පරිශීලක නාමය, මුරපදය සහ API සේවාලාභියෙකු අවශ්‍යයි.
wallabag.bad-login = Wallabag පිවිසුම පිළිගත්තේ නැත. පරිශීලක නාමය, මුරපදය සහ API සේවාලාභියා පරීක්ෂා කරන්න.
wallabag.no-network = Wallabag සඳහා ජාලයක් අවශ්‍යයි.
wallabag.unreachable = Wallabag වෙත ළඟා විය නොහැක. Wi-Fi සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.
wallabag.unreadable = Wallabag හට මෙම උපාංගයේ ලබා ගත් ලිපි ලැයිස්තුව කියවිය නොහැකි බැවින් කිසිවක් වෙනස් කළේ නැත.
wallabag.not-kept = Wallabag හට මුරපදය හෝ රහස තබා ගත නොහැකි විය. එය ඉතා දිග නොවේදැයි පරීක්ෂා කර නැවත උත්සාහ කරන්න.
weather.plugin.name = කාලගුණය
weather.plugin.description = දැන් සහ ඉදිරි දිනවල කාලගුණය විජට් ලෙස, Open-Meteo වෙතින්.
weather.plugin.how = "කාලගුණය මුල් තිරය සඳහා විජට් ලෙස දැන් සහ ඉදිරි දිනවල කාලගුණය පෙන්වයි, ගිණුමක් හෝ යතුරක් අවශ්‍ය නොවන Open-Meteo වෙතින්. දැන් කාලගුණය උෂ්ණත්වය, තත්ත්වය සහ තෝරා ගත හැකි තවත් දේ පෙන්වයි; පුරෝකථනය ඉදිරි දින පේළියක හෝ ලැයිස්තුවක පෙන්වයි.\n\nපළමුව ස්ථානයක් තෝරන්න: සැකසීම් තුළ, කාලගුණය යටතේ, ස්ථානය (නමක් ටයිප් කර, හමු වූ ස්ථාන අතරින් එය තෝරන්න). එහි ඛණ්ඩාංක පමණක් යවනු ලැබේ, එසේම කාලගුණ විජට් එකක් පෙන්වන අතරතුර පමණි. මුල් තිරය සංස්කරණය කර විජට් එක් කරන්න.\n\nකාලගුණය ලබා ගන්නේ “උපරිම වශයෙන් යාවත්කාලීන කරන්නේ” හි සඳහන් වාර ගණන නොඉක්මවා, ජාලයක් ඇති විට පමණි: එය කිසි විටෙක තනිවම Wi-Fi සක්‍රිය නොකරයි.\n\nකාලගුණ දත්ත Open-Meteo.com (https://open-meteo.com) වෙතින්, Creative Commons Attribution 4.0 බලපත්‍රය (CC BY 4.0) යටතේ."
