format-cbz.plugin.description = චිත්‍ර කතා සංරක්ෂිත (.cbz) විවෘත කරයි, පිටුවකට එක් පින්තූරයක්.
format-cbz.plugin.how = "චිත්‍ර කතා සංරක්ෂිත (.cbz) විවෘත කරයි: පිටුවකට එක් පින්තූරයක්, තිරයට ගැළපෙන සේ, ඒවායේ නම්වල අනුපිළිවෙළට (2, 10ට පෙර).\n\nඒවා පුස්තකාල ෆෝල්ඩරයට දමා පුස්තකාලයෙන් විවෘත කරන්න; ඕනෑම පොතක මෙන් පිටු පෙරළන්න. විශාල පින්තූරවලට පළමු වරට මොහොතක් ගතවේ, X4 හි වෙනත් තැන්වලට වඩා වැඩියෙන්.\n\nකියවීමේ සැකසීම් (සැකසීම්, කියවීම): “පැනලයෙන් පැනලයට” පිටුවක එක් පැනලයක් බැගින්, තිරයට හැකි තරම් විශාලව පෙන්වයි, පිටු පෙරළීම් ඒවා හරහා ගමන් කරයි; පැනල නැති පිටුවක් සම්පූර්ණයෙන් පෙන්වයි. “චිත්‍ර කතා පිටු දිශාව” manga සඳහා පිටු පෙරළීම් ප්‍රතිබිම්බනය කරයි (දකුණේ සිට වමට); පොතේම ComicInfo.xml එය ඉබේම පවසයි. පුස්තකාලය ComicInfo.xml වෙතින් පොතේ මාතෘකාව, මාලාව සහ අංකය පෙන්වයි."
format-cbz.title = චිත්‍ර කතා (CBZ)
format-cbz.setting.direction = චිත්‍ර කතා පිටු දිශාව
format-cbz.setting.direction.help = Manga: පිටු පෙරළීම් ප්‍රතිබිම්බනය වේ.
format-cbz.direction.book = පොත පවසන පරිදි
format-cbz.direction.ltr = වමේ සිට දකුණට
format-cbz.direction.rtl = දකුණේ සිට වමට
format-cbz.setting.panels = පැනලයෙන් පැනලයට
format-cbz.setting.panels.help = වරකට එක් පැනලයක්, පිටු පෙරළීම් ඒවා හරහා ගමන් කරයි.
format-docx.plugin.name = DOCX ලේඛන
format-docx.plugin.description = Word සහ වෙනත් වැඩසටහන් සුරකින .docx ගොනු විවෘත කරයි.
format-docx.plugin.how = "පටුනක් සහිත ශීර්ෂ, ලැයිස්තු, වගු, තද සහ ඇල අකුරු, සබැඳි සහ පින්තූර (JPEG, PNG, GIF) සමඟ .docx ලේඛන පොත් ලෙස විවෘත කරයි.\n\nගොනු පුස්තකාල ෆෝල්ඩරයට දමා පුස්තකාලයෙන් විවෘත කරන්න. මාතෘකාව සහ කර්තෘ ලේඛනයේ ගුණාංගවලින් ලැබේ. පාද සටහන්, ශීර්ෂක සහ පාදක, සහ අදහස් පෙන්වන්නේ නැත."
format-docx.title = DOCX ලේඛනය
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB පොත් ඒවායේ හැඩතල, පටුන සහ රූප සමඟ විවෘත කරයි.
format-epub.plugin.how = "EPUB පොත් ඕනෑම පොතක් මෙන් පුස්තකාලයෙන් විවෘත වේ, ඒවායේ පටුන, රූප සහ ප්‍රකාශකයාගේ හැඩතල සමඟ. වෙබ් පිටු (HTML), Markdown, FictionBook (.fb2) සහ චිත්‍ර කතා සංරක්ෂිත (.cbz) ද එලෙසම විවෘත වේ, එක් එක් වෙනම ප්ලගිනයක් ලෙස.\n\nපරිච්ඡේදයක් ඔබ පළමු වරට විවෘත කරන විට පරිවර්තනය කර ප්ලගිනයේ හැඹිලියේ තබා ගැනේ, එබැවින් පසුව එය වේගවත් වන අතර විශාල පොත් කුඩා උපාංගවල ද ක්‍රියා කරයි. පටුන කියවීමේ මෙනුවේ පටුන යටතේ ඇත. පොතේම හැඩතල යෙදේද යන්න කියවීම යටතේ ඇති ප්‍රකාශකයාගේ හැඩතල සැකසුමයි."
format-epub.title = EPUB ඉ-පොත
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook පොත් (.fb2, zip කළ ඒවා ද) විවෘත කරයි.
format-fb2.plugin.how = "රුසියානු සහ වෙනත් පොත් සඳහා සුලබ FictionBook පොත් (.fb2), zip කළ ඒවා (.fb2.zip) ද, ඒවායේ මාතෘකාව, කතුවරුන්, කවරය සහ පරිච්ඡේද සමඟ විවෘත කරයි.\n\nඒවා පුස්තකාල ෆෝල්ඩරයට දමන්න; ඒවා පුස්තකාලයේ පෙන්වන අතර ඕනෑම පොතක් මෙන් විවෘත වේ."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ගොනු ලෙස සුරැකි වෙබ් පිටු විවෘත කරයි, කියවිය යුතු දේ පමණක් පෙන්වමින්.
format-html.plugin.how = "ගොනු ලෙස සුරැකි වෙබ් පිටු (.html, .htm, .xhtml) පොත් ලෙස විවෘත කරයි: වටා ඇති මෙනු, දැන්වීම් ආදිය නොමැතිව, කියවිය යුතු දේ පමණි.\n\nගොනුව පුස්තකාල ෆෝල්ඩරයට දමා ඕනෑම පොතක් මෙන් පුස්තකාලයෙන් විවෘත කරන්න. පිටුව තුළ සබැඳි ක්‍රියා කරයි; පින්තූර ගොනුවේ ඒවා ඇති තැන පෙන්වයි."
format-html.title = වෙබ් පිටුව (HTML)
format-images.plugin.name = පින්තූර
format-images.plugin.description = පින්තූර (.jpg, .png, .gif) පොත් ලෙස විවෘත කරයි, එක් එක් පිටුවක.
format-images.plugin.how = "පින්තූර (.jpg, .png, .gif) පොත් මෙන් පුස්තකාලයෙන් විවෘත වේ, පිටුවකට එක් පින්තූරයක්, තිරයට ගැළපෙන සේ.\n\nපින්තූර ෆෝල්ඩරයක් සම්පූර්ණයෙන් කියවීමට, එහි පළමු පින්තූරය විවෘත කරන්න: ෆෝල්ඩරයේ ඊට පසු ඇති පින්තූර ඒවායේ නම්වල අනුපිළිවෙළට (2, 10ට පෙර) පසුව එයි. ෆෝල්ඩරයේ පසුව ඇති පින්තූරයක් එතැනින් ආරම්භ වේ; එක් එක් එකේ ස්ථානය වෙන වෙනම මතක තබා ගැනේ. ඔබ විවෘත කරන පින්තූරයේ සිට පින්තූර 300ක් දක්වා කියවේ.\n\nපින්තූරයක් නොවන හෝ විශාල වැඩි ගොනුවක් ඒ වෙනුවට එහි නම පෙන්වයි. තමන්ගේම මාතෘකාවක් සහිත බොහෝ පින්තූර ඇති පොතකට චිත්‍ර කතා සංරක්ෂිතයක් (.cbz) වඩා සුදුසුය."
format-images.title = පින්තූරය
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ගොනු (.md), උදා. සටහන්, විවෘත කරයි.
format-markdown.plugin.how = "Markdown ගොනු (.md), සටහන් වැනි, පොත් ලෙස විවෘත කරයි: ශීර්ෂ, ලැයිස්තු, උපුටා දැක්වීම් සහ අවධාරණය සංකේත ලෙස නොව අදහස් කළ පරිදි.\n\nගොනු පුස්තකාල ෆෝල්ඩරයට දමා පුස්තකාලයෙන් විවෘත කරන්න. පළමු ශීර්ෂය එහි මාතෘකාවයි; ගොනුව අසල ඇති පින්තූර පෙළ ඒවා සඳහන් කරන තැන පෙන්වයි."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI පොත්
format-mobi.plugin.description = DRM නොමැති .mobi සහ .azw ගොනු විවෘත කරයි.
format-mobi.plugin.how = "MOBI පොත් (.mobi, .azw) වෙනත් ඕනෑම පොතක් මෙන් පුස්තකාලයෙන් විවෘත වේ; කිසිවක් සැකසීමට අවශ්‍ය නැත. මාතෘකාව, කතුවරුන්, භාෂාව සහ කවරය පොතෙන්ම ලැබෙන අතර පටුන එහි ශීර්ෂවලින් සාදනු ලැබේ.\n\nපළමු වරට විවෘත කරන විට පොත පරිවර්තනය වේ; දිගු පොතකට තත්පර කිහිපයක් ගතවේ. ඉන්පසු එය වහාම විවෘත වේ. පෙළ, ශීර්ෂ, තද සහ ඇල අකුරු, සබැඳි සහ පින්තූර පෙන්වයි.\n\nDRM සහිත පොත් (සාප්පුවකින් මිලදී ගත් බොහෝ පොත්), Huffman සම්පීඩනය සහිත පොත් හෝ නව KF8 ආකෘතියේ (.azw3) පොත් විවෘත කළ නොහැක: විවෘත කරන විට PaperPaw එය පවසයි. Calibre වැනි මෙවලමකින් සාදන EPUB පිටපතක් සැමවිටම විවෘත වේ."
