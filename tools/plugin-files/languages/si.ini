tasks.plugin.description = නියමිත දින සහ ප්‍රමුඛතා සහිත කළ යුතු දේ ලැයිස්තු, උපාංගයේ හෝ ඔබේ CalDAV සේවාදායකය සමඟ සමමුහුර්තව, මුල් තිර විජට් සමඟ.
tasks.plugin.how = "ඔබේ උපාංගයේ කළ යුතු දේ ලැයිස්තු: නියමිත දිනයක් සහ ප්‍රමුඛතාවක් සහිත කාර්ය. සැකසීමක් හෝ ජාලයක් නොමැතිව ක්‍රියා කරයි; CalDAV සේවාදායකයක් (Nextcloud, Radicale, Baïkal, Fastmail ආදිය) සමඟ සමමුහුර්ත කළ හැක.\n\nමෙවලම් මෙනුවෙන් කාර්ය විවෘත කරන්න. පළමු පේළිය පෙන්වන ලැයිස්තුව නම් කරයි; වෙනත් ලැයිස්තුවකට, අද සහ ප්‍රමාද වූ දේට, නව ලැයිස්තුවකට, සමමුහුර්ත කිරීමට හෝ ගිණුමට එය තෝරන්න. කාර්යයක් එක් කරන්න යතුරුපුවරුව විවෘත කරයි. කාර්යයක් මත තෝරන්න එය නිම කළ ලෙස සලකුණු කරයි (නැවත: නිම නැත). මාතෘකාව, නියමිත දිනය (අද, හෙට, සතියකින්, හෝ 2026-12-24 වැනි දිනයක්), ප්‍රමුඛතාව වෙනස් කිරීමට හෝ ඉවත් කිරීමට කාර්යය අල්ලාගෙන සිටින්න හෝ මෙනුව ඔබන්න. නිම වූ කාර්ය සතියක් (සැකසීම්, කාර්ය) අවසානයේ රැඳී පසුව ඉවත් වේ.\n\nමුල් තිර විජට් (මුල් තිරය අල්ලාගෙන විජට් එක් කරන්න): අද කාර්ය, කාර්ය ලැයිස්තුව, විවෘත කාර්ය (ගණන) සහ ඊළඟ කාර්යය. විජට් එකක කාර්යයක් තට්ටු කිරීම එය නිම කරයි; ශීර්ෂයක් තට්ටු කිරීම ලැයිස්තු විවෘත කරයි.\n\nසමමුහුර්ත කිරීමට, ලැයිස්තු පේළියෙන් CalDAV ගිණුම තෝරා සේවාදායකයේ ලිපිනය (උදා. cloud.example.com/remote.php/dav), පරිශීලක නාමය සහ මුරපදයක් (යෙදුම් මුරපදයක් වඩා හොඳයි) ඇතුළත් කරන්න. සේවාදායකයේ සෑම කාර්ය ලැයිස්තුවක්ම උපාංගයේ ලැයිස්තුවක් වේ. කාර්ය විවෘත කරන විට, දැන් සමමුහුර්ත කරන්න සමඟ සහ ජාලය සක්‍රිය විට සමමුහුර්ත වේ; ජාලය නොමැතිව කළ වෙනස්කම් පසුව යවයි. කාර්යයක් දෙතැනකම වෙනස් වූයේ නම්, සේවාදායකයේ අනුවාදය ගෙන ඔබේ එක නව කාර්යයක් ලෙස තබයි. පුනරාවර්තන කාර්ය වෙනස් කරන්න ඒවා සෑදූ තැනදී. උපාංගයට ලැයිස්තු 12ක කාර්ය 200ක් දක්වා තබා ගත හැක."
