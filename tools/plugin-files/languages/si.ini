keys.plugin.description = සෑම බොත්තමක්ම, තට්ටු කලාපයක්ම සහ ස්වයිප් කිරීමක්ම කරන දේ, උපාංගයේදීම වෙනස් කළ හැක.
keys.plugin.how = "“බොත්තම් සහ ඉංගිත” සෑම බොත්තමක්ම, තට්ටු කලාපයක්ම සහ ස්වයිප් කිරීමක්ම කරන දේ පෙන්වන අතර එය උපාංගයේදීම වෙනස් කිරීමට ඉඩ දෙයි.\n\nඑය සැකසීම්හි “උපාංගය” යටතේ විවෘත කරන්න. පළමුව වෙනසක් අදාළ වන තැන තෝරන්න: “සෑම තැනම”, “කියවන අතරතුර”, “මුල් තිරයේ”, “පුස්තකාලයේ” හෝ එක් මෙවලමක. ඉන්පසු අල්ලාගෙන සිටින බොත්තමක් හෝ දාරයක සිට ඇතුළට ස්වයිප් කිරීමක් වැනි ආදානයක් තෝරා, සෙවිය හැකි ලැයිස්තුවෙන් ක්‍රියාවක් තෝරන්න. “සම්මත ලෙස” ප්ලගින සහ බොත්තම් පිරිසැලසුම සකසන දේ නැවත ලබා දෙයි.\n\nX4 හි, තේරීමට, ආපසු යාමට හෝ ඉදිරියට යාමට බොත්තමක් ඉතිරි නොකරන වෙනසක් ප්‍රතික්ෂේප කෙරේ. අවසානයේ ඇති “බොත්තම් සහ ඉංගිත යළි සකසන්න” සියලු වෙනස්කම් ආපසු ගනී."
