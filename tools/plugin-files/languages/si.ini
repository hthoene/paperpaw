koreader.plugin.description = දෙකෙහිම කියවන පොත් සඳහා පිටු සලකුණු සහ උද්දීපන KOReader සමඟ බෙදා ගනී.
koreader.plugin.how = "මෙම ප්ලගිනය එකම උපාංගයක හෝ උපාංග අතර සමමුහුර්ත කළ පුස්තකාල ෆෝල්ඩරයක, ඔබ දෙකෙහිම කියවන පොත් සඳහා පිටු සලකුණු සහ උද්දීපන KOReader සමඟ බෙදා ගනී. කිසිවක් සැකසීමට අවශ්‍ය නැත.\n\nKOReader ද විවෘත කළ පොතක් PaperPaw විවෘත කරන විට සහ ඔබ එහි පිටු සලකුණු හෝ උද්දීපන වෙනස් කරන විට, පොත අසල ඇති KOReader දත්තවලින් අලුත් දේ ලබා ගන්නා අතර මෙහි අලුත් දේ KOReader ඊළඟ වරට පොත විවෘත කරන විට ලබා ගැනීමට තබයි. ඉවත් කළ සලකුණු සහ වෙනස් කළ සටහන් ද එලෙස යයි.\n\nමෙය EPUB පොත් සඳහා පමණක් ක්‍රියා කරයි. එක් පැත්තක ගොනුව කියවිය නොහැකි නම්, එය කියවිය හැකි වන තුරු කිසිදු පැත්තක කිසිවක් වෙනස් නොවේ."
koreader.removed-there = KOReader ගොනුවේ තවදුරටත් උද්දීපන නැත. ඒවා මෙතැනින් ද ඉවත් කරන්නද?
koreader.removed-there.text = ඒවා KOReader හි ඉවත් කර තිබිය හැක, නැතහොත් එහි ගොනුව වෙනත් උපාංගයකින් පැමිණියා විය හැක. “තබා ගන්න” ඒවා මෙහි තබා KOReader වෙත නැවත ලබා දෙයි.
koreader.removed-there.remove = ඉවත් කරන්න
koreader.removed-there.keep = තබා ගන්න
kosync.plugin.name = ප්‍රගති සමමුහුර්තය
