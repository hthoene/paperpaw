read-later-cloud.from.help = Readwise Reader හි ලිපි ගන්නා තැන: ඔබ පසුවට (Later) සුරැකි ඒවා, හෝ ඔබේ එන ලිපි (Inbox) තුළ ඇති ඒවා.
read-later-cloud.help = ඔබේ ප්‍රවේශ ටෝකනය ඇතුළත් කරන්න (readwise.io/access_token). ලිපි පින්තූර නොමැතිව පොත් ලෙස “Reader” ෆෝල්ඩරයට පැමිණේ; අවසානය දක්වා කියවූ ඒවා ඊළඟ ලබා ගැනීමේදී සංරක්ෂණය කෙරේ.
read-later-cloud.fetching = Readwise Reader වෙතින් ලිපි ලබා ගනිමින්…
read-later-cloud.done = Reader: නව {fetched}, සංරක්ෂිත {archived}.
read-later-cloud.done-failed = Reader: නව {fetched}, සංරක්ෂිත {archived}, අසාර්ථක {failed}.
read-later-cloud.setup-needed = පළමුව ඔබේ Readwise Reader ප්‍රවේශ ටෝකනය ඇතුළත් කරන්න.
read-later-cloud.bad-token = Readwise ප්‍රවේශ ටෝකනය පිළිගත්තේ නැත. readwise.io/access_token හි එය පරීක්ෂා කරන්න.
read-later-cloud.wait = Readwise මඳක් රැඳී සිටින ලෙස ඉල්ලයි. විනාඩියකින් නැවත ලබා ගන්න.
