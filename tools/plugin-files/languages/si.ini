reader.plugin.name = කියවීම
reader.plugin.description = පොත් පිටුවෙන් පිටුව, පටුන සහ කියවීමේ සැකසීම් සමඟ පෙන්වයි.
reader.plugin.how = "කියවීම පොත් පිටුවෙන් පිටුව පෙන්වයි. පුස්තකාලයෙන් පොතක් විවෘත කරන්න; අවසන් පොත ආරම්භයේදී නැවත විවෘත විය හැක (සැකසීම: ආරම්භයේදී අවසන් පොත විවෘත කරන්න).\n\nපිටු පෙරළීමට තිරයේ වම හෝ දකුණ තට්ටු කරන්න, නැතහොත් පිටු බොත්තම් භාවිත කරන්න. කියවීමේ මෙනුවට මැද තට්ටු කරන්න හෝ තෝරන්න ඔබන්න: පටුන, සොයන්න, පිටුවට යන්න, අකුරු සහ පිරිසැලසුම, පිටු සලකුණු සහ උද්දීපන ආදිය. ඉහළ දාරයේ සිට පහළට ඇදීම ඉක්මන් පැනලය විවෘත කරයි; පහළ දාරයේ සිට ඉහළට ඇදීම හෝ ආපසු අල්ලාගෙන සිටීම මුල් තිරයට යයි.\n\nපින්තූරයක් සම්පූර්ණ තිරයෙන් බැලීමට තෝරන්න (හෝ පින්තූරය) අල්ලාගෙන සිටින්න: වම/දකුණ පිටුවේ පින්තූර අතර යයි, තෝරන්න 2x, 3x විශාලනය කරයි (ස්පර්ශයේ ද්විත්ව තට්ටුව); විශාලනය කළ විට වම/දකුණ සහ පිටු බොත්තම් පින්තූරය චලනය කරයි. ආපසු ගැළපීමට, පසුව පිටුවට යයි. පිටු සලකුණක් සඳහා ඉහළ දකුණු කෙළවර තට්ටු කරන්න. උද්දීපනයට වචනයක් අල්ලාගෙන සිටින්න. බොත්තම් සමඟ වම අල්ලාගෙන සිටින්න: වම/දකුණ වචනයෙන්, පිටු බොත්තම් පේළියෙන් ගෙන යයි; තෝරන්න උද්දීපන තීරුව විවෘත කරයි, එය අල්ලාගෙන සිටීම තේරීම වාක්‍යයට සහ ඡේදයට පුළුල් කරයි. Markdown ලෙස අපනයනය ඔබේ සටහන් සුරකියි."
