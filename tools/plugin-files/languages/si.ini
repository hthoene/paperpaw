vocabulary.plugin.how = "කියවන අතරතුර ඔබ සොයා බලන වචන, ඒවායේ වාක්‍ය සමඟ, වචන මාලාව තබා ගනී. ලැයිස්තුව මෙවලම් තුළ ඇත, නවතම මුලින්; වචනයක් තෝරා එය නැවත සොයා බලන්න. අවසාන පේළිය, අපනයනය කරන්න, ඒවා Anki වැනි යෙදුම් සඳහා සුරකියි. නවතම වචන 2,000 පමණක් රැඳේ: සියල්ල තබා ගැනීමට පළමුව අපනයනය කරන්න.\n\nෆ්ලෑෂ් කාඩ්පත් (මෙවලම් තුළ) පරතර පුනරාවර්තනයෙන් ඔබෙන් අසයි: පිළිතුර පෙන්වන්න පසු සෑම කාඩ්පතක්ම නැවත, අමාරු, හොඳයි හෝ පහසු ලෙස ඇගයීමෙන් එය නැවත එන දිනය තීරණය වේ. කට්ටල සාදන්න: දුරකථනයෙන් සංස්කරණය කරන්න, එම Wi-Fi හි දුරකථනයකින් කේතය ස්කෑන් කර කාඩ්පත් ටයිප් කරන්න, නැතහොත් කට්ටලයක් විවෘත කර එකවර කාඩ්පත් රැසක් තෝරා CSV, TSV හෝ TXT ගොනුවක්, ලැයිස්තුවක් හෝ Anki කට්ටලයක් (.apkg, “Support older Anki versions” සමඟ අපනයනය කළ) එක් කරන්න.\n\nනැතහොත් SD කාඩ්පත: එක් එක් කට්ටලයට CSV, TSV, TXT හෝ .apkg ගොනුවක් Flashcards ෆෝල්ඩරයට දමන්න (Spanish.tsv = Spanish කට්ටලය; පේළියකට: ඉදිරිපස, පසුපස, උදාහරණය; UTF-8; පළමු පේළියට front, back, example තීරු නම් කළ හැක). ෆ්ලෑෂ් කාඩ්පත් තුළ SD කාඩ්පතේ කාඩ්පත් තෝරන්න, නැතහොත් විවෘත කරන විට එය සිදු වේ. කට්ටල ප්‍රගතිය සමඟ උපාංගයේ රැඳේ; නව හෝ වෙනස් වූ ගොනුවක් එහි කට්ටලයට ඒකාබද්ධ වේ: පසුපස හෝ උදාහරණය වෙනස් කළොත් ප්‍රගතිය රැඳේ; ඉදිරිපස වෙනස් කළොත් එය නව කාඩ්පතකි. මකන පේළියක් කාඩ්පත මකන්නේ නැත, එම කට්ටලයට “ගොනුවේ නැති කාඩ්පත්” ඉවත් කරන්න ලෙස සැකසුවොත් මිස. කාඩ්පතට සුරකින්න මගින් කට්ටලය id තීරුව සමඟ ගොනුවට ලියයි, එවිට පරිගණකයේ ඉදිරිපස වෙනස් කළත් ප්‍රගතිය රැඳේ; පැරණි ගොනුව පළමු වරට _name.bak.tsv වෙත පිටපත් වේ. 4 MiB හෝ පේළි 20,000 ඉක්මවූ ගොනු කියවෙන්නේ නැත; UTF-16 නොව CSV UTF-8 ලෙස සුරකින්න.\n\nසැකසීම් › කියවීම › සොයා බැලූ වචනවලින් කාඩ්පත් සාදන්න: සෑම වචනයක්ම “සොයා බැලූ” කට්ටලයට යයි."
