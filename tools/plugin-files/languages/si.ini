picture-home.plugin.how = "පින්තූර මුල් තිරය සක්‍රිය අතරතුර එය මුල් තිරය ප්‍රතිස්ථාපනය කරයි: විජට් පිටුපස ඔබේම පින්තූරයක්, සහ ඔබ සකසන විජට් සහ මෙවලම් පිටු. එය ප්ලගින කළමනාකරුගෙන් අක්‍රිය කළ විට, ගොඩනඟන ලද මුල් තිරය එහිම පිටු සමඟ නැවත පැමිණේ.\n\nකාඩ්පතේ ෆෝල්ඩරයකට (පෙරනිමියෙන් wallpapers) පින්තූර (JPEG, PNG හෝ GIF) දමා, සැකසීම් › අභිරුචිකරණය › පින්තූර මුල් තිරය හි එකක් තෝරන්න. ගැළපීම එය තිරය පුරවන ආකාරය (පුරවන්න, සම්පූර්ණ පින්තූරය, දිගු කරන්න, මුල් ප්‍රමාණය, ටයිල්), පිහිටීම ඉතිරි වන කොටස, විශාලනය කොපමණ විශාලද, සහ පින්තූරය ලා කරන්න කොපමණ ලා පැහැද යන්න කියයි: ලා පින්තූරයක් විජට් කියවීම පහසු කරයි. පින්තූරය එක් එක් තිර ප්‍රමාණය සඳහා එක් වරක් සූදානම් කෙරේ, එයට මොහොතක් ගතවේ.\n\nවිජට් පින්තූරය මත තල මත පිහිටයි. ගොඩනඟන ලද මුල් තිරයේ මෙන් පිටුව සකසන්න: පිටුවට පහළ ඇති පැන්සල, හෝ මෙනුවේ මුල් තිරය සංස්කරණය කරන්න.\n\nතත්ත්ව තීරුව (වේලාව, Wi-Fi, බැටරිය, හෝ ඔබ තෝරන දේ) සක්‍රිය, අක්‍රිය හෝ ස්වයංක්‍රීය විය හැක; ඉහළ හෝ පහළ, සම්පූර්ණ පළලින් හෝ වම, මැද හෝ දකුණේ කුඩා කැප්සියුලයක් ලෙස; ලා, තද හෝ අළු තලයක් මත හෝ පින්තූරය මතම. බොත්තම් නම් කරන පේළිය (X4 මත) ද සක්‍රිය, අක්‍රිය හෝ ස්වයංක්‍රීය විය හැක. ස්වයංක්‍රීය යනු බොත්තමක් එබීමෙන් ඒවා තත්පර කිහිපයකට පෙන්වීමයි; එම එබීම වෙන කිසිවක් නොකරයි.\n\nපින්තූර විදැහුම පින්තූරය අඳින ආකාරය කියයි: අළු මට්ටම් තිරයේ ඇති සියලු අළු පැහැවලින් (X4 මත සෙමින්), තිත් රටාව කළු සහ සුදු තිත්වලින් (වේගවත්), හෝ ස්වයංක්‍රීය, ගොඩනඟන ලද මුල් තිරය මෙන්: තිරය අඳින විට අළු මට්ටම්, පළමු වෙනසෙන් පසු තිත්. අළු මට්ටම් නැති තිරයක, අළු මට්ටම් තිත් බවට පත් වේ."
