edge-light.setting.width.help = එක් එක් දාරය දිගේ ඇති තීරුවේ පළල, තිරයේ පළලෙහි කොටසක් ලෙස. එහි ආරම්භ වන ස්වයිප් ආලෝකය සකසයි; අන් සෑම තැනකම ඒවා සුපුරුදු පරිදි ක්‍රියා කරයි.
