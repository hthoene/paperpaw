menu.help.panel-buttons = ඊතල බොත්තම්: තෝරයි. “තෝරන්න”: මාරු කරයි. “ආපසු”: වසයි.
menu-editor.plugin.name = මෙනු සංස්කාරකය
menu-editor.plugin.description = සෑම මෙනුවකම ඇතුළත් කිරීම් නැවත පිළිවෙළ කරයි, ඉවත් කරයි සහ එක් කරයි.
menu-editor.plugin.how = "මෙනු සංස්කාරකය මෙනුවල අඩංගු දේ වෙනස් කරයි: ඇතුළත් කිරීම් ඉහළට හෝ පහළට ගෙන යන්න, ඉවත් කරන්න, නැතහොත් නව ඒවා එක් කරන්න.\n\nඑය සැකසීම්හි “අභිරුචිකරණය” යටතේ “මෙනු අභිරුචිකරණය” ලෙස ඇත. මෙනුවක් තෝරා, ගෙන යාමට හෝ ඉවත් කිරීමට ඇතුළත් කිරීමක් තෝරන්න; “ඇතුළත් කිරීමක් එක් කරන්න” නව එකක් දමයි. වෙනස්කම් වහාම අදාළ වේ. “මෙම මෙනුව යළි සකසන්න” මෙනුවක් එහි ප්ලගින නිර්වචනය කරන ආකාරයට ආපසු ගෙන එයි, “සියලු මෙනු යළි සකසන්න” සියල්ලටම එසේ කරයි.\n\nඔබට ඔබවම අගුළු දමා ගත නොහැක: සැකසීම් වෙත යන මාර්ගය වන ඇතුළත් කිරීමක්, ඔබ ඒවාට තවත් මාර්ගයක් එක් කරන තුරු පවතී."
