wallabag.secret.password = Wallabag මුරපදය
wallabag.secret.client = Wallabag සේවාලාභී රහස
wallabag.help = Wallabag හි “API clients management” යටතේ API සේවාලාභියෙකු සාදා එහි ID සහ රහස මෙහි ඇතුළත් කරන්න. නොකියවූ ලිපි “Wallabag” ෆෝල්ඩරයට පැමිණේ; අවසානය දක්වා කියවූ ඒවා ඊළඟ ලබා ගැනීමේදී සංරක්ෂණය වේ.
