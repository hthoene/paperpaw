anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ඔබේ පරිගණකයේ Anki හි නියමිත කාඩ්පත් අධ්‍යයනය කර, AnkiConnect ඇඩෝනය හරහා ඔබේ පිළිතුරු ආපසු යවයි.
anki.plugin.how = "Anki මගින් ඔබේ පරිගණකයේ Anki හි නියමිත කාඩ්පත් උපාංගයේ අධ්‍යයනය කර පිළිතුරු ආපසු යැවිය හැක. එය නොමිලේ ලැබෙන AnkiConnect ඇඩෝනය (කේතය 2055492159) භාවිත කරයි, AnkiWeb කිසිදා නොවේ. මුලින් අක්‍රියයි: ප්ලගින වෙළඳසැලෙන් එක් කරන්න.\n\nපරිගණකයේ: Anki තුළ AnkiConnect ස්ථාපනය කරන්න (Tools, Add-ons, Get Add-ons) සහ Anki නැවත ආරම්භ කරන්න. සමමුහුර්ත කරන විට Anki විවෘතව තිබිය යුතුය.\n\nසාමාන්‍යයෙන් AnkiConnect පිළිතුරු දෙන්නේ එය ක්‍රියා කරන පරිගණකයට (127.0.0.1) පමණි. Tools, Add-ons, AnkiConnect, Config විවෘත කර “webBindAddress” “0.0.0.0” ලෙස සකසන්න. වරාය “webBindPort” 8765 වේ. එහි “apiKey” සැකසුවේ නම්, එම යතුරම මෙහි ඇතුළත් කරන්න. පසුව Anki නැවත ආරම්භ කර, ඉල්ලුවහොත් ෆයර්වෝලය හරහා Anki හට ඉඩ දෙන්න. ඔබ විශ්වාස කරන ජාලයක පමණක් භාවිත කරන්න; යතුරක් යොදන්න.\n\nඋපාංගයේ: මෙවලම් වෙතින් Anki විවෘත කර, පරිගණකය යටතේ පරිගණකයේ ලිපිනය (උදා. 192.168.1.20), වරාය 8765 නොවේ නම් එය, සහ API යතුර ඇතුළත් කරන්න. කට්ටලයක් තෝරන්න, නැතහොත් සියලු කට්ටල සඳහා හිස්ව තබන්න. Wi-Fi සමඟ Anki සමඟ සමමුහුර්ත කරන්න තෝරන්න: රැඳී ඇති පිළිතුරු පළමුව යවා, නියමිත කාඩ්පත් (සහ ඔබ සැකසූ නව කාඩ්පත්) උපරිම 50ක් ගෙන එයි. ජාලයකින් තොරව ඒවා හරහා යාමට අධ්‍යයනය තෝරන්න: පිළිතුර පෙන්වා නැවත, අමාරුයි, හොඳයි හෝ පහසුයි ලෙස ඇගයීම් කරන්න. පිළිතුරු උපාංගයේ තබා, ඊළඟ සමමුහුර්තයේදී Anki වෙත යයි. කාඩ්පතක් නැවත එන්නේ කවදාද යන්න Anki තීරණය කරයි.\n\nසැකසීම්වල Anki විවෘත වන විට සමමුහුර්ත කරන්න, තිරය විවෘත කරන සෑම විටම සමමුහුර්ත කරයි. බොත්තමක් එබීමෙන් ජාලය භාවිත නොවේ."
