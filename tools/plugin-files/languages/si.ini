end-of-book.setting.mark.help = අවසාන පිටුව දක්වා කියවූ පොතක් කියවා අවසන් ලෙස ගැනේ.
end-of-book.rating = ශ්‍රේණිගත කිරීම
file-manager.plugin.name = ගොනු කළමනාකරු
file-manager.plugin.description = උපාංගයේ සියලු ෆෝල්ඩර සහ ගොනු: ඒවා විවෘත කරන්න, නැවත නම් කරන්න, ගෙන යන්න, පිටපත් කරන්න සහ මකන්න.
file-manager.plugin.how = "ගොනු කළමනාකරු ඔබේ පොත් පමණක් නොව උපාංගයේ ආචයනයේ සියලු ෆෝල්ඩර සහ ගොනු පෙන්වයි; ඒවා විවෘත කිරීමට, නැවත නම් කිරීමට, ගෙන යාමට, පිටපත් කිරීමට, මැකීමට සහ නව ෆෝල්ඩර සෑදීමට ඉඩ දෙයි.\n\nමෙවලම් මෙනුවෙන් ගොනු විවෘත කරන්න. ෆෝල්ඩරයකට යාමට එය තට්ටු කරන්න; ආපසු ඉහළ ෆෝල්ඩරයට යයි. ගොනුවක් තට්ටු කරන්න, නැතහොත් ඕනෑම අයිතමයක් අල්ලාගෙන සිටින්න (බොත්තම් සමඟ තෝරන්න අල්ලාගෙන සිටින්න), එය සමඟ කළ හැකි දේ බැලීමට. ගෙන යන්න සහ පිටපත් කරන්න අයිතමය තෝරා ගනී: එය යා යුතු ෆෝල්ඩරයට ගොස් පහළ තීරුවේ මෙහි අලවන්න තෝරන්න. බොත්තම් සමඟ, තීරුවට යාමට අවසාන අයිතමයේ සිට පහළ ඔබන්න.\n\nPaperPaw හි දත්ත වැනි තිතකින් ආරම්භ වන ගොනු සහ ෆෝල්ඩර සඟවා ඇත. ඒවා බැලීමට සැකසීම්වල පුස්තකාලය යටතේ සැඟවුණු ගොනු සක්‍රිය කරන්න."
