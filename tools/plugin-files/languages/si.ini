widgets.plugin.how = "විජට් පැකේජය මුල් තිරයට විජට් රැසක් එක් කරයි: ඔරලෝසු (ඇනලොග්, වචන, ටයිල්, ලෝක), දින දර්ශනයක්, මෙතෙක් ගත වූ වසර, ගණන් කිරීමක්, සඳේ කලාව, සහ දිනය හා සතියේ දිනය; දවසේ උපුටා දැක්වීමක්, සටහන්, කළ යුතු දේ, පින්තූර, සුබපැතුමක් සහ PaperPaw ලාංඡනය; පොත් සඳහා, දැන් කියවන, ප්‍රගතිය, ඊළඟට, මාලා, ප්‍රියතම, උද්දීපනයක් සහ අංකවලින් පුස්තකාලය. බැටරි විජට් එකක් ද ඇත.\n\nමෙනුවේ මුල් තිරය සංස්කරණය කරන්න (හෝ මුල් තිරය දිගු වේලාවක් ඔබා) මගින්, ඉන්පසු විජට් එකක් එක් කරන්න මගින් ඒවා එක් කරන්න. එක් එක් විජට් එකට රාමුව, ප්‍රමාණය සහ පෙළගැස්ම වැනි තමන්ගේම සැකසීම් ඇත. දවසේ උපුටා දැක්වීම වැනි වෙනස් වන විජට් එකක් තේරීමෙන් ඊළඟ එක පෙන්වයි. ඔබේම උපුටා දැක්වීම් කාඩ්පතේ .paperpaw/plugins/widgets හි quotes.txt වෙත යයි, එක් එක් පේළිය පෙළ | කතුවරයා ලෙස. වේලාව පෙන්වන විජට් සඳහා ඔරලෝසුව සැකසිය යුතුය; Wi-Fi එය සකසයි."
