diagnostics.check.screen.help = සෑම අළු මට්ටමක්ම වෙනම තීරුවක් ලෙස පෙනිය යුතුය. රටාව කිහිප වරක් පෙරළන්න: පෙර රටාවෙන් ඉතිරි වන දෙය අවතාර රූපයයි (ghosting). පූර්ණ නැවුම් කිරීමකින් එය ඉවත් විය යුතුය.
