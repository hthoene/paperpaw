vocabulary.sd.save.full = කාඩ්පත පිරී ඇති බැවින් කිසිවක් ලියා නැත. ඉඩ කිහිපයක් නිදහස් කර නැවත උත්සාහ කරන්න.
vocabulary.sd.save.too-large = මෙම කට්ටලය එක් ගොනුවකට ඉතා විශාලයි (4 MiB, යාවත්කාලීනයක් කියවන උපරිමය). කාඩ්පතේ ගොනුව නොවෙනස්ව ඇත.
vocabulary.sd.save.failed = ගොනුව ලිවිය නොහැකි විය. කාඩ්පතේ ගොනුව නොවෙනස්ව ඇත. කාඩ්පත පරීක්ෂා කර නැවත උත්සාහ කරන්න.
vocabulary.sd.save.not-updated = සුරැකුණේ නැත: කාඩ්පතේ ගොනුව පළමුව කියවිය නොහැකි වූ අතර, කට්ටලයේ තවම නැති වෙනස්කම් එහි තිබිය හැක. ගොනුව නිවැරදි කර නැවත උත්සාහ කරන්න.
vocabulary.sd.save.left-out = සුරැකුණේ නැත: ගොනුවේ සමහර පේළි කියවිය නොහැකි වූ අතර, සුරැකීමෙන් ඒවා නැති වේ. ගොනුව නිවැරදි කර, යාවත්කාලීන කර, නැවත උත්සාහ කරන්න.
vocabulary.sd.save.anki = {file} Anki ගොනුවකි: එය කියවනවා පමණි, කිසි විටෙක ලියන්නේ නැත.
vocabulary.sd.save.anki-refused = සුරැකුණේ නැත: {file} Anki කට්ටලයකි, PaperPaw එය කියවනවා පමණි. එය යාවත්කාලීන කිරීමට Anki වෙතින් කට්ටලය නැවත අපනයනය කරන්න.
vocabulary.sd.removal-held = කිසිදු කාඩ්පතක් ඉවත් කළේ නැත: සමහර පේළි කියවිය නොහැකි විය.
vocabulary.sd.skipped.one = පේළි {count}ක් මඟ හැරිණි
vocabulary.sd.skipped.other = පේළි {count}ක් මඟ හැරිණි
vocabulary.sd.skipped-notes.one = සටහන් {count}ක් මඟ හැරිණි: එය ඉතා දිගයි (උදා. රූපයක් සහිතව)
vocabulary.sd.skipped-notes.other = සටහන් {count}ක් මඟ හැරිණි: ඒවා ඉතා දිගයි (උදා. රූප සහිතව)
vocabulary.sd.no-room = පේළි {count}ක් ඇතුළත් කළ නොහැකි විය: කට්ටලයකට උපරිම කාඩ්පත් 20,000.
vocabulary.sd.outcome.same = අවසන් යාවත්කාලීනයෙන් පසු වෙනස් වී නැත.
vocabulary.sd.outcome.unreadable = මෙම ගොනුව කියවිය නොහැකි විය. කාඩ්පත පරීක්ෂා කර නැවත උත්සාහ කරන්න.
vocabulary.sd.outcome.too-many = දැනටමත් කට්ටල 50ක් ඇති බැවින් මෙම ගොනුව කියවූයේ නැත. පළමුව කට්ටලයක් මකන්න.
vocabulary.sd.outcome.crowded = බොහෝ කාඩ්පත්වල ඉදිරිපස සමාන බැවින් මෙම ගොනුව කියවූයේ නැත. ඉදිරිපස එකිනෙකට වෙනස් කරන්න.
vocabulary.sd.outcome.no-cards = කාඩ්පත් හමු නොවීය. කාඩ්පතක් යනු ඉදිරිපස පෙළක් සහිත පේළියකි; ඉදිරිපස පළමු තීරුවයි.
vocabulary.sd.outcome.too-large = මෙම ගොනුව ඉතා විශාලයි: උපරිම 4 MiB සහ පේළි 20,000. එය ගොනු කිහිපයකට බෙදන්න.
vocabulary.sd.outcome.utf16 = මෙම ගොනුව UTF-16 ලෙස සුරැකී ඇත. එය නැවත CSV UTF-8 ලෙස සුරකින්න (පැතුරුම්පතක: CSV UTF-8).
vocabulary.sd.outcome.no-notes = සටහන් හමු නොවීය: මෙය Anki කට්ටලයක් නොවේ, නැතහොත් එහි සටහන් නැත. Anki වෙතින් එය Anki කට්ටල පැකේජයක් (.apkg) ලෙස අපනයනය කරන්න.
vocabulary.sd.outcome.newer-anki = මෙම කට්ටලය නවතම Anki ආකෘතියේ ඇත. “Support older Anki versions” සලකුණු කර එය නැවත අපනයනය කරන්න.
vocabulary.sd.outcome.deck-too-large = මෙම Anki කට්ටලය මෙහි කියවීමට ඉතා විශාලයි: උපරිම ගොනු 4,000, සටහන් 4 MiB සහ සටහන් 20,000. මාධ්‍ය සහ කාලසටහන් නොමැතිව එය අපනයනය කරන්න, නැතහොත් බෙදන්න.
vocabulary.sd.line = පේළිය {line}
vocabulary.sd.fault.no-front = ඉදිරිපස තීරුවේ පෙළ නැත. වචනය එහි දමන්න.
vocabulary.sd.fault.not-utf8 = UTF-8 පෙළ නොවේ. ගොනුව UTF-8 ලෙස සුරකින්න (පැතුරුම්පතක: CSV UTF-8).
vocabulary.sd.fault.too-long = 8 KiB ට වඩා දිගයි. කාඩ්පත කෙටි කරන්න.
vocabulary.sd.fault.open-quote = උද්ධෘත ලකුණක් විවෘත කර වසා නැත. එය වසන්න හෝ ඉවත් කරන්න.
vocabulary.setting.sd-auto = විවෘත කරන විට කාඩ්පතෙන් කට්ටල යාවත්කාලීන කරන්න
vocabulary.setting.sd-auto.help = ෆ්ලෑෂ් කාඩ්පත් ෆෝල්ඩරයේ නව හෝ වෙනස් වූ ගොනු කියවයි.
vocabulary.setting.sd-folder = කට්ටල ගොනු සඳහා ෆෝල්ඩරය
vocabulary.setting.sd-folder.help = SD කාඩ්පතේ: එහි ඇති CSV, TSV හෝ Anki ගොනුවක් කට්ටලයකි.
vocabulary.sd.readme = "ගොනුවලින් ෆ්ලෑෂ් කාඩ්පත්\n\nඑක් එක් කට්ටලයට ගොනුවක් මෙහි දමන්න: Spanish.tsv මගින් Spanish කට්ටලය සෑදේ.\nගොනු: .tsv, .csv හෝ .txt (UTF-8 ලෙස සුරැකි), හෝ .apkg: “Support older Anki versions” සලකුණු කර අපනයනය කළ Anki කට්ටලයක්. එහි සටහන්වල පළමු ක්ෂේත්‍ර තුන ඉදිරිපස, පසුපස සහ උදාහරණය වේ; කාලසටහන සහ මාධ්‍ය කියවෙන්නේ නැත, PaperPaw කිසි විටෙක Anki ගොනුවක් ලියන්නේ නැත.\n\nපේළියකට එක් කාඩ්පතක්: ඉදිරිපස, පසුපස සහ උදාහරණයක් (විකල්ප), ටැබ්, කොමාව හෝ අර්ධ විරාමයෙන් වෙන් කර. පළමු පේළියට තීරු නම් කළ හැක: front, back, example. උදාහරණය:\n\nKatze\tcat\tDie Katze schläft.\n\nඉන්පසු ෆ්ලෑෂ් කාඩ්පත් › SD කාඩ්පතේ කාඩ්පත් › කට්ටල යාවත්කාලීන කරන්න තෝරන්න.\n\nදැනගත යුතු දේ:\n- කට්ටල ඔබේ ප්‍රගතිය සමඟ උපාංගයේ රැඳේ. නව හෝ වෙනස් වූ ගොනුවක කාඩ්පත් කට්ටලයට එක් වේ හෝ එහි වෙනස් වේ.\n- ගොනුවේ කාඩ්පතක පසුපස හෝ උදාහරණය වෙනස් කළොත්: කාඩ්පත වෙනස් වන අතර ඔබේ ප්‍රගතිය රැඳේ.\n- ඉදිරිපස පෙළ වෙනස් කළොත් එය නව කාඩ්පතක් ලෙස ගැනේ, පැරණි එක මුල සිට ආරම්භ වේ. කාඩ්පත් ඉදිරිපස පෙළෙන් හඳුනා ගැනේ; හිස්තැන් සහ කැපිටල් අකුරු ගණන් නොගැනේ. කට්ටලයක් ගොනුවකට සුරැකූ විට (SD කාඩ්පතේ කාඩ්පත්, කාඩ්පතට සුරකින්න) සෑම කාඩ්පතකටම id තීරුවේ අංකයක් ලැබේ: එහි ඉදිරිපස වෙනස් කර, ගොනුවේ පළමු පේළි දෙක එලෙසම තැබුවොත් කාඩ්පතේ ප්‍රගතිය රැඳේ.\n- සුරැකීමෙන් කට්ටලයේ කාඩ්පත් ලියයි. ගොනුවේ තිබූ කාඩ්පතක් නොවන දේ (ඉදිරිපසක් නැති පේළියක්) රැඳෙන්නේ නැත; පැරණි ගොනුව _name.bak.tsv වෙත පිටපත් වේ.\n- ගොනුව CSV UTF-8 ලෙස සුරකින්න (UTF-16 හෝ පැතුරුම්පතේ ආකෘතිය නොවේ). 4 MiB හෝ පේළි 20,000 ඉක්මවූ ගොනුවක් කියවෙන්නේ නැත: එය බෙදන්න.\n- ගොනුවේ මකන පේළියක් කට්ටලයේ කාඩ්පත මකන්නේ නැත, එම කට්ටලයට නැති කාඩ්පත් ඉවත් කිරීම සක්‍රිය කළොත් මිස. එවිට කාඩ්පත ප්‍රගතිය සමඟ ඉවත් වේ.\n- නම _ න් ආරම්භ වන ගොනු කියවෙන්නේ නැත.\n"
