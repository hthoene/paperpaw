plugin-manager.code.no-room-flash = එහි කේතයට ඉඩ ඉතිරිව නැත. කේතය සහිත වෙනත් ප්ලගිනයක් අක්‍රිය කරන්න, නැතහොත් වෙබ් ෆ්ලෑෂරය (paperpaw.org) මගින් සම්පූර්ණ පිරිසැලසුම ෆ්ලෑෂ් කරන්න: කිහිප ගුණයක ඉඩක් ලැබේ.
