mail.plugin.name = තැපෑල
mail.plugin.description = මුරපදයකින් හෝ යෙදුම් මුරපදයකින් (IMAP සහ SMTP) ඊ-තැපැල් කියවා යවයි, බ්‍රවුසර පුරනයකින් තොරව.
mail.plugin.how = "“තැපෑල” IMAP සහ SMTP හරහා ඊ-තැපැල් කියවා යවයි. එය ඔබගේ ලිපිනය සහ මුරපදයකින් පුරනය වේ (බ්‍රවුසර පුරනයක් නැත), එබැවින් එයට ඉඩ දෙන ඕනෑම සපයන්නෙකු සමඟ ක්‍රියා කරයි.\n\nසැකසීම්, “තැපෑල” යටතේ ගිණුමක් සකසන්න: සපයන්නා තෝරා, ලිපිනය සහ මුරපදය ටයිප් කරන්න. බොහෝ සපයන්නන්ට යෙදුම් මුරපදයක් අවශ්‍යයි: එය ඔබගේ ගිණුමේ ආරක්ෂක සැකසීම්හි සාදා මෙහි භාවිත කරන්න. එය ඔබගේ සපයන්නාගේ සේවාදායකයට හැර වෙනත් තැනකට නොයන අතර මුරපද සහ යතුරු සමඟ තබා ගනී.\n\nමෙවලම්වලින් “තැපෑල” විවෘත කරන්න. “තැපෑල පරීක්ෂා කරන්න” නවතම තැපැල් සහ ෆෝල්ඩර ලබා ගනී. තැපැල් කාඩ්පතේ තබන බැවින් ජාලයක් නැතිව කියවිය හැක. Wi-Fi සක්‍රිය වන්නේ මොහොතකට පමණි.\n\nඔබගේ සපයන්නා ලැයිස්තුවේ නැත්නම් “ස්වකීය සේවාදායක” තෝරා, උසස් සැකසීම්හි සේවාදායක නම්, පෝට් සහ ආරක්ෂාව සකසන්න. කිසිදු අධිකාරියක් සහතික නොකරන සහතිකයක් ඇති සේවාදායකයක් විශ්වාස කරන්නේද යන්න එක් වරක් අසයි; ඇඟිලි සලකුණ ඔබගේ සපයන්නා පෙන්වන දේ සමඟ සසඳන්න.\n\nපොතක් (EPUB, PDF ආදී, 2 MB දක්වා) අමුණා ඇති තැපෑලකට පහළින් “පොත විවෘත කරන්න” ඇත: එය ගොනුව ලබා, පුස්තකාලයට දමා විවෘත කරයි.\n\n“තැපෑල” විවෘත නොකර නව තැපැල් දැකීමට, සැකසීම්, “තැපෑල” යටතේ “පසුබිමේ නව තැපැල් පරීක්ෂා කරන්න” සක්‍රිය කර වාර ගණන තෝරන්න (විනාඩි 15, 30 හෝ 60). එවිට උපාංගය අවදිව සහ සබැඳිව සිටින විට ආරක්ෂිත සම්බන්ධතාවකින් ගිණුම් එකින් එක පරීක්ෂා කර මුල් තිරයේ නොකියවූ ගණන යාවත්කාලීන කරයි. එය බැටරිය ටිකක් භාවිත කරයි.\n\nමුල් තිරයේ විජට් නොකියවූ ගණන, නවතම සහ තරු ලකුණු කළ තැපැල්, තැපැල් පෙට්ටියක් සහ තැපෑලක් ලිවීමට කෙටිමඟක් පෙන්වයි."
