launcher-simple.plugin.name = සරල මුල් තිරය
launcher-simple.plugin.description = සන්සුන් ආරම්භක තිරයක්: විශාල ඔරලෝසුවක්, කාඩ්පත්, ඩොක් එකක් සහ රවුම් ස්විච සහිත ඉක්මන් පැනලයක්.
launcher-simple.plugin.how = "“සරල මුල් තිරය” මූලික දේ පමණක් අවශ්‍ය අය සඳහා සන්සුන් ආරම්භක තිරයකි: විශාල ඔරලෝසුවක්, ඔබ කියවන පොත, පුස්තකාලය සහ වෙළඳසැල විශාල කාඩ්පත් ලෙස, සහ පහළින් අයිකන තුනක ඩොක් එකක්. සැකසුමක් අවශ්‍ය නැත.\n\nඑය සැකසීම්හි මුල් තිරය යටතේ තෝරන්න. එහි ඉක්මන් පැනලයේ (එය ද සැකසීම්හි පැනලය ලෙස තෝරන්න) විශාල රවුම් ස්විච, ඉදිරිපස ආලෝකය සඳහා තීරුවක් (උපාංගයේ ඇත්නම්) සහ පෙළ ප්‍රමාණය සඳහා තීරුවක් ඇත. බොත්තම්වලින්: ඊතල යතුරු අවධානය ගෙන යයි, “තෝරන්න” කොටස පවසන දේ කරයි; තීරුවක එය දහයෙන් එකක් එක් කරයි, අවසානයේ සිට ආරම්භයට යයි. ස්පර්ශයෙන්: කොටසක් තට්ටු කරන්න, නැතහොත් තීරුවේ අවශ්‍ය තැන තට්ටු කරන්න.\n\nපුස්තකාලය ඔබගේ පොත් කාඩ්පත් ලෙස, අවසන් වරට විවෘත කළ පොත පළමුව, වරකට පිටුවක් පෙන්වන අතර සාමාන්‍ය කියවනය විවෘත කරයි.\n\nසැකසීම්හි “සරල මුල් තිරය” යටතේ එය ඔබට ගැළපෙන සේ සකසන්න: ප්‍රධාන මෙනුව මෙන් සංස්කරණය කරන ලැයිස්තු තුනක්. කාඩ්පත්: පෙන්වන කාඩ්පත් සහ අනුපිළිවෙළ. ඩොක්: ඩොක් එකේ අයිකන, ඕනෑම ප්ලගිනයක ඕනෑම ක්‍රියාවක්. ඉක්මන් පැනලය: පෙන්වන ස්විච සහ තීරු. තිරයේ ඉඩ නැති කාඩ්පත් අවසානයේ සිට ඉවත් කෙරේ. දිනය සහ බැටරිය පෙන්වන්නේද යන්න ද එහිදී තෝරන්න."
