store.plugin.how = "ප්ලගින වෙළඳසැල අන්තර්ජාලයෙන් මෙම උපාංගයට ප්ලගින සොයා ස්ථාපනය, යාවත්කාලීන සහ ඉවත් කරයි. මෙවලම් වෙතින් විවෘත කරන්න; Wi-Fi අවශ්‍යයි.\n\nආරම්භයේ නිර්දේශිත, නව සහ ජනප්‍රිය ප්ලගින, පසුව කාණ්ඩ ඇත. කාණ්ඩයක ප්ලගින දිනපතා වෙනස් වන සාධාරණ මිශ්‍රණයකින් පෙන්වයි; A-Z, නවතම හෝ අවසන් යාවත්කාලීනය අනුව පෙළගස්වන්න. ප්ලගිනයක පිටුව එහි ප්‍රමාණය සහ මතකය පෙන්වයි; එහිදී ස්ථාපනය, යාවත්කාලීන හෝ ඉවත් කරන්න. සියල්ල යාවත්කාලීන කරන්න සියලු ස්ථාපිත ප්ලගින යාවත්කාලීන කරයි.\n\nකේත ප්ලගිනවලට උපාංගයට පූර්ණ ප්‍රවේශය ඇත: වෙළඳසැල පළමුව අසයි, ඒවා නැවත ආරම්භයෙන් පසු ක්‍රියා කරයි. එකක් වැරදුණොත් PaperPaw කේත ප්ලගින නොමැතිව ආරම්භ වී එය කුමක්දැයි කියයි. ලැයිස්තුව එන තැන ප්ලගින පුස්තකාලය සකසයි.\n\nසැකසීම්, පද්ධතිය හි ප්‍රජා ප්ලගින, අන් අය GitHub හි පළ කළ ප්ලගින ද පෙන්වයි. ඒවා කිසිවෙක් සමාලෝචනය කර නැත: කේත ප්ලගිනයක පිටුව එය අත්සන් කළ යතුර පෙන්වයි, වෙනත් යතුරකින් අත්සන් කළ යාවත්කාලීනයක් ස්ථාපනය නොවේ.\n\nමූලාශ්‍ර (ආරම්භයේ අවසන් පේළිය) අන් අයගේ ප්ලගින ලැයිස්තු ලිපිනයෙන් (https://…/plugins.json) එක් කරයි, PaperPaw ලැයිස්තුව වෙනුවට එකක් පෙන්වයි, හෝ ඉවත් කරයි. ටයිප් කිරීම වෙනුවට, පේළියකට එක් ලිපිනය බැගින් sources.txt ගොනුවක් කාඩ්පතේ .paperpaw/plugins/store තුළ තබන්න. PaperPaw මූලාශ්‍ර පරීක්ෂා නොකරයි. මූලාශ්‍රයක් එහි ලැයිස්තුව අත්සන් කරයි; උපාංගය පළමු ලැයිස්තුවේ යතුර මතක තබාගෙන ඉන්පසු එම යතුරෙන් අත්සන් කළ දේ පමණක් ගනී. ප්ලගිනයකට යාවත්කාලීන ලැබෙන්නේ එය ස්ථාපනය කළ මූලාශ්‍රයෙන් පමණි. PaperPaw පුස්තකාලය සැමවිට ඇත; වෙළඳසැලෙන් ඉවත් වූ විට එයට ආපසු යයි."
