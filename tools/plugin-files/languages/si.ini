sleep.plugin.description = උපාංගය නිදන අතරතුර නිදන පූසෙක්, පොතේ කවරය, ඔබේ පින්තූර හෝ පණිවිඩයක් පෙන්වයි.
sleep.plugin.how = "උපාංගය නිදන අතරතුර තිරය පෙන්වන දේ නින්දේ තිරය තීරණය කරයි. E-ink බලය නැතිව පින්තූරය රඳවා ගනී.\n\nඑය සැකසීම්වල, උපාංගය, නින්දේ තිරය යටතේ, “පෙන්වන්න” මගින් තෝරන්න: නිදන පූසෙක් (පෙරනිමිය), පොතේ කවරය, මගේ පින්තූර, ලාංඡනය සහ “නිදයි”, විජට්, පිටුව එලෙසම, හෝ පින්තූරයක් සහිත පිටුව. “මගේ පින්තූර” පින්තූර ෆෝල්ඩරයේ ගොනු එකින් එක පෙන්වයි.\n\nකවරයක් හෝ පින්තූරයක් නැතිනම් පූසා පෙන්වයි. පද්ධතිය විසින්ම නින්දේ තිරය අඳින තැන්වල මෙම සැකසීම් සැඟවේ.\n\nක්‍රියාවිරහිත තිරය (“ක්‍රියාවිරහිත කළ විට පෙන්වන්න”) උපාංගය ක්‍රියාවිරහිත වන විට, බල මෙනුවෙන් හෝ “නින්දෙන් පසු ක්‍රියාවිරහිත කරන්න” කාලයෙන් පසු, එක් වරක් අඳිනු ලැබේ (අඩු බැටරිය බලය කපා හරින විට නොවේ). ඔබ ලාංඡනය සහ “ක්‍රියාවිරහිතයි”, පූසා, කවරය හෝ මගේ පින්තූර තෝරා නැතිනම් එය නින්දේ තිරය මෙනි. වෙනත් ප්ලගිනයකට ඒ සඳහා තිරයක් ලබා දිය හැක.\n\nආරම්භක සහ නැවත ආරම්භක තිර (“ආරම්භ වන විට පෙන්වන්න”, “නැවත ආරම්භ වන විට පෙන්වන්න”) වෙනත් ප්ලගිනයක් තිරයක් ලබා නොදෙන්නේ නම් උපාංගයේම ඒවා වේ. උපාංගය ආරම්භ වන විට ප්ලගින තවම ක්‍රියා නොකරයි: ආරම්භය සඳහා තෝරාගත් තිරය උපාංගය ක්‍රියාවිරහිත වන හෝ නැවත ආරම්භ වන විට කලින් අඳිනු ලබන අතර ඊළඟ ආරම්භයේදී පෙන්වයි. නියමිත වේලාවට සූදානම් නොවන තිරයක් හෝ හානි වූ පින්තූරයක් වෙනුවට උපාංගයේම තිරය පෙන්වයි; කෙසේ වෙතත් උපාංගය ක්‍රියාවිරහිත වේ හෝ නැවත ආරම්භ වේ."
