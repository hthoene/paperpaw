dictionary.plugin.how = "ශබ්දකෝෂය පොතක වචනයක් StarDict ශබ්දකෝෂවල සොයා බලා, තිරයේ පහළ කොටසට ඉහළින් පැනලයක අර්ථ දැක්වීම් පෙන්වයි.\n\nකියවන විට වචනයක් අල්ලාගෙන සිට සොයා බලන්න තෝරන්න; බොත්තම් සමඟ, තවත් යටතේ පෙළ තෝරන්න භාවිත කරන්න. ශබ්දකෝෂ ෆෝල්ඩර (.ifo, .idx සහ .dict ගොනු සමඟ) උපාංගයේ “dictionaries” ෆෝල්ඩරයට පිටපත් කරන්න (උප ෆෝල්ඩර ද ඇතුළුව), නැතහොත් සැකසීම්වල කියවීම යටතේ ශබ්දකෝෂ ෆෝල්ඩරය ලෙස වෙනත් ෆෝල්ඩරයක් තෝරන්න (උසස් සැකසුමකි). පළමු සෙවීම එක් එක් ශබ්දකෝෂය සඳහා කුඩා සුචියක් සකසයි, එයට මොහොතක් ගතවේ.\n\nපැනලයේ පිටු බොත්තම් හෝ ඉහළ සහ පහළ දිගු අර්ථ දැක්වීම් අනුචලනය කරයි, ආපසු එය වසයි. ස්පර්ශයෙන්, වැසීමට එයින් පිටත තට්ටු කරන්න."
