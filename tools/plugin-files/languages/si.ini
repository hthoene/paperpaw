calibre.plugin.name = රැහැන් රහිත පුස්තකාලය
calibre.plugin.description = ජාලය හරහා පොත් ලබා ගනී. calibre සඳහා රැහැන් රහිත උපාංගයක් ලෙස ක්‍රියා කරයි.
calibre.plugin.how = "රැහැන් රහිත පුස්තකාලය මගින් ඔබේ පරිගණකයේ Calibre තුළ මෙම උපාංගය රැහැන් රහිත උපාංගයක් ලෙස පෙනේ. එවිට Calibre හට එයට පොත් යැවීමට, ඒවා ලැයිස්තුගත කිරීමට සහ මැකීමට හැක. පොත් පුස්තකාලයට යයි.\n\nඋපාංගය සහ පරිගණකය එකම Wi-Fi ජාලයේ තිබියදී, මෙවලම් මෙනුවෙන් රැහැන් රහිත පුස්තකාලය විවෘත කරන්න. Calibre හි Connect/share, පසුව Start wireless device connection තෝරන්න. උපාංගය ඔබේ පරිගණකය සොයාගත් විට එහි නම පෙන්වයි; සම්බන්ධ කරන්න තට්ටු කරන්න (බොත්තම් සමඟ තෝරන්න ඔබන්න). Calibre හට මෙහි පොත් එක් කිරීමට සහ මැකීමට හැකි බැවින් ඔබේම පරිගණකයට පමණක් සම්බන්ධ වන්න. තිරය වැසීමෙන් සම්බන්ධතාව අවසන් වේ.\n\nCalibre ස්වයංක්‍රීයව හමු නොවේ නම්, සැකසීම්වල පුස්තකාලය යටතේ, Calibre කොටසේ ලිපිනය ලෙස එහි පරිගණකයේ ලිපිනය ඇතුළත් කරන්න. Calibre 9090 හැර වෙනත් පෝට් එකක් භාවිත කරයි නම්, එය :පෝට් ලෙස එක් කරන්න, උදා. 192.168.1.20:9091."
