pomodoro.plugin.name = පොමොඩෝරෝ
pomodoro.plugin.description = වැඩ සහ විවේක වට, විජට් සහ දෛනික ගණනක් සහිත අවධාන ටයිමරයක්.
pomodoro.plugin.how = "පොමොඩෝරෝ ටයිමරයක්: අවධානයෙන් යුතු වට වශයෙන් වැඩ කර, පසුව විවේක ගන්න. සැකසීමක් අවශ්‍ය නැත: විනාඩි 25 අවධානය, 5 විවේකය, වට හතරකට පසු විනාඩි 15 දිගු විවේකයක්.\n\nමෙවලම් මෙනුවෙන් පොමොඩෝරෝ විවෘත කර ආරම්භ කරන්න ඔබන්න, නැතහොත් එහි විජට් මුල් තිරයට එක් කරන්න (මුල් තිරය අල්ලාගෙන සිට, විජට් එක් කරන්න): පොමොඩෝරෝ ටයිමරය අදියර සහ ඉතිරි විනාඩි පෙන්වයි, පොමොඩෝරෝ ආරම්භය/විරාමය බොත්තමකි, අද පොමොඩෝරෝ ඔබ නිම කළ වට දෛනික ඉලක්කය සමඟ ගණන් කරයි. ටයිමරය තට්ටු කිරීමෙන් එය ආරම්භ හෝ විරාම වේ; සම්පූර්ණ තිරය සඳහා අල්ලාගෙන සිටින්න.\n\nතිරයෙන් ඉවත් වූ විටද ටයිමරය ක්‍රියා කරයි, නැවත ආරම්භයකින් පසු ඔරලෝසුව අනුව දිගටම යයි. උපාංගය නින්දේ ඇති විට කිසිවක් ක්‍රියා නොකරයි: ඒ අතරතුර අවසන් වූ අදියරක් අවදි වූ විට දන්වයි. අදියරක් අවසන් වූ විට දැනුම්දීමක් ලැබේ. බැටරිය ඉතිරි කිරීමට ඔරලෝසුව විනාඩියකට වරක් යාවත්කාලීන වේ (සම්පූර්ණ තිරයේ අවසන් විනාඩියේ තත්පර 10කට වරක්), උපාංගය කිසිවිට අවදියෙන් තබා නොගනී.\n\nසැකසීම්හි පොමොඩෝරෝ යටතේ කාල දිග, කට්ටලයක වට ගණන සහ ඊළඟ අදියර ස්වයංක්‍රීයව ආරම්භ වේද යන්න සකසන්න. තවත් යටතේ: අදියරක් අවසානයේ තිරය දැල්වීම හෝ ඉදිරි ආලෝකය නිවී දැල්වීම, සහ දෛනික ඉලක්කයක්."
