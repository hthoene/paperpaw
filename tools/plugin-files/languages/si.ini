update.dual-boot.help = PaperPaw මෙම උපාංගය වෙනත් ස්ථිරාංගයක් සමඟ බෙදා ගන්නා බැවින්, මෙහි යාවත්කාලීන ස්ථාපනය නොකරයි. මෙය සැකසීමට ඔබ භාවිත කළ මෙවලමෙන් PaperPaw යාවත්කාලීන කරන්න. මෙම උපාංගයේ දෙවන ස්ථිරාංගයක් නැද්ද? පහත බොත්තමෙන් එය කියන්න, නැතහොත් paperpaw.org/flash හි USB හරහා PaperPaw නැවත ෆ්ලෑෂ් කරන්න.
