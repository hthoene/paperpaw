battery.plugin.description = බැටරිය සටහන් කර එය කොපමණ කල් පවතීද යන්න පෙන්වයි.
battery.plugin.how = "බැටරි භාවිතය උපාංගය අවදිව සිටින විට විනාඩියකට වරක් පමණ ආරෝපණය සහ එය කළ දේ (තිර නැවුම් කිරීම්, පෙරළූ පිටු) සටහන් කරයි. ඉන් පැයක අවදි කාලයකට සහ පිටු 100කට කොපමණ වැය වේද, එම වේගයෙන් බැටරිය කොපමණ කල් පවතීද යන්න ගණනය කරයි.\n\nමෙවලම් මෙනුවෙන් බැටරිය විවෘත කරන්න. එය දැන් ආරෝපණය, මෙවර අවදි කාලය, මෙතෙක් බැටරියෙන් භාවිතය සහ මෑත අවදි කාල පෙන්වයි. පිටු බොත්තම්වලින් හෝ ඉහළ ඊතල තට්ටු කිරීමෙන් පිටු පෙරළේ.\n\nඅගයන් අර්ථවත් වීමට පෙර බැටරියෙන් යම් කාලයක් කියවිය යුතුය. සටහන් කිරීම සාමාන්‍යයෙන් සක්‍රිය වන අතර සැකසීම්, උපාංගය, බලය යටතේ බැටරි භාවිතය සටහන් කරන්න ලෙස අක්‍රිය කළ හැක."
