puzzles.plugin.name = ප්‍රහේලිකා
puzzles.plugin.description = සුඩෝකු, හරස්පද සහ චෙස් ප්‍රහේලිකා, නොබැඳිව, දවසේ ප්‍රහේලිකාවක් සමඟ.
puzzles.plugin.how = "දුම්රියට සහ පොරොත්තු කාමරයට ප්‍රහේලිකා, සියල්ල නොබැඳිව: සුඩෝකු, හරස්පද සහ චෙස් ප්‍රහේලිකා. මෙවලම් මෙනුවෙන් ප්‍රහේලිකා විවෘත කරන්න, නැතහොත් දවසේ ප්‍රහේලිකාව විජට් එක මුල් තිරයට එක් කරන්න: එය අද සුඩෝකුවේ ප්‍රගතිය පෙන්වයි, තට්ටුවකින් විවෘත වේ.\n\nසුඩෝකු: වම/දකුණ කොටුවෙන් කොටුව, ඉහළ/පහළ (පිටු බොත්තම්) පේළියෙන් පේළිය ගෙන යයි. තෝරන්න ඉලක්කම් විවෘත කරයි: එකක් තෝරා නැවත තෝරන්න, නැතහොත් හිස් කරන්න. පුවරුවට යටින් ඇති බොත්තම් සඳහා තෝරන්න (හෝ මෙනුව) අල්ලාගෙන සිටින්න: සටහන් (පැන්සල් ලකුණු), පරීක්ෂා කරන්න, අහෝසි කරන්න, නව (පහසු, මධ්‍යම, අපහසු). ක්‍රීඩාව සුරැකේ. ස්පර්ශ තිරයේ කොටුවක් තට්ටු කරන්න.\n\nහරස්පද: .puz (Across Lite) හෝ .ipuz ගොනු මතක කාඩ්පතේ “puzzles” ෆෝල්ඩරයට දමන්න. කොටුවක් තෝරා යතුරුපුවරුවෙන් වචනය ටයිප් කරන්න (_ කොටුවක් හිස්ව තබයි). බොත්තම්: හරහට/පහළට, හෝඩුවා, පරීක්ෂාව, හෙළි කිරීම. සංකේතනය කළ .puz ගොනු විවෘත කළ නොහැක.\n\nචෙස්: Lichess දත්ත ගබඩාවෙන් (CC0) කුඩා කට්ටලයක්. වම/දකුණ කැබැල්ලෙන් කැබැල්ලට යයි; කැබැල්ල තෝරා, වම/දකුණෙන් ගමනාන්තය සොයා නැවත තෝරන්න. වැරදි පියවරක් ආපසු ගැනේ. ඉඟිය ගෙන යා යුතු කැබැල්ල සලකුණු කරයි."
