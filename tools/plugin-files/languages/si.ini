joplin.plugin.name = පොත් සටහන් සමමුහුර්තය
joplin.plugin.description = සෑම පොතකම උද්දීපන සහ සටහන් එක් සටහනක තබා ගනී. Joplin (Joplin Cloud, Joplin Server හෝ WebDAV) සමඟ ක්‍රියා කරයි.
joplin.title = පොත් සටහන් සමමුහුර්තය
joplin.send = Joplin වෙත යවන්න
joplin.send.help = අපනයනය කළ සටහන් වහාම යවනු ලැබේ. යැවිය නොහැකි වූ සටහන් රැඳී සිට ඊළඟ අපනයනය සමඟ, මෙයින්, හෝ රීතියකින් යයි.
joplin.service = සමමුහුර්ත කරන්නේ
joplin.service.help = Joplin හි සකසා ඇති පරිදි Joplin සමමුහුර්ත කරන්නේ කුමක් සමඟද: Joplin Cloud, ඔබගේම Joplin Server, හෝ Nextcloud වැනි WebDAV ෆෝල්ඩරයක්. කිසිදු පරිගණකයක් ක්‍රියාත්මක වීම අවශ්‍ය නැත.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = ලිපිනය
joplin.address.help = Joplin Server: එහි ලිපිනය, උදා. joplin.example.org. WebDAV: Joplin සමමුහුර්ත කරන ෆෝල්ඩරය, එහි සැකසීම්හි මෙන්, උදා. dav.example.org/Joplin.
joplin.email = ඊ-තැපෑල
joplin.user = පරිශීලක නාමය
joplin.user.help = Joplin Cloud සහ Joplin Server: ඔබ පුරනය වන ඊ-තැපෑල (ද්වි-සාධක පුරනය තවම භාවිත කළ නොහැක). WebDAV: ෆෝල්ඩරයේ පරිශීලක නාමය.
joplin.password = මුරපදය
joplin.password.help = මෙම උපාංගයේ අනෙක් මුරපද සහ යතුරු සමඟ තබා ගනී. Nextcloud සඳහා යෙදුම් මුරපදයක් ද ක්‍රියා කරයි.
joplin.secret = Joplin මුරපදය
joplin.not-kept = මුරපදය මෙම උපාංගයේ තබා ගත නොහැකි විය.
joplin.notebook = සටහන් පොත
joplin.notebook.help = PaperPaw Joplin හි සාදන සටහන් පොත, සෑම පොතකටම සටහනක් සමඟ. නැවත අපනයනය කිරීම සටහන යාවත්කාලීන කරයි, වෙනත් සටහන් පොතකට ගෙන ගිය එකක් ද.
joplin.idle = අපනයනය කළ සටහන් වහාම Joplin වෙත යවනු ලැබේ.
joplin.waiting.one = පොතක සටහන් යැවීමට රැඳී ඇත.
joplin.waiting.other = පොත් {count}ක සටහන් යැවීමට රැඳී ඇත.
joplin.sent.one = පොතක සටහන් Joplin හි ඇත.
joplin.sent.other = පොත් {count}ක සටහන් Joplin හි ඇත.
joplin.some-failed = Joplin වෙත යැවූ: {sent}. නොයැවූ: {failed}; ඒවා පසුව නැවත යවනු ලැබේ.
joplin.apart.one = සටහනක් Joplin හි වෙනස් කර තිබූ බැවින් ඒ අසල නව සටහනක් සාදන ලදී.
joplin.apart.other = සටහන් {count}ක් Joplin හි වෙනස් කර තිබූ බැවින් ඒවා අසල නව සටහන් සාදන ලදී.
joplin.nothing = Joplin වෙත යැවීමට කිසිදු සටහනක් රැඳී නැත.
joplin.no-network = Joplin වෙත යැවීමට ජාලයක් අවශ්‍යයි. සටහන් රැඳී සිට පසුව යවනු ලැබේ.
joplin.setup-needed = පළමුව Joplin සකසන්න: එය සමමුහුර්ත කරන තැන, ඔබගේ ගිණුම සහ මුරපදය.
joplin.no-time = වේලාව තවම නොදනී. සටහන් රැඳී සිට පසුව යවනු ලැබේ.
joplin.unreachable = Joplin වෙත ළඟා විය නොහැක. සටහන් රැඳී සිට පසුව යවනු ලැබේ.
joplin.failed = Joplin දෝෂයකින් පිළිතුරු දුන්නේය ({status}). සටහන් රැඳී සිට පසුව යවනු ලැබේ.
joplin.bad-login = Joplin ඊ-තැපෑල, පරිශීලක නාමය හෝ මුරපදය පිළිගත්තේ නැත. Joplin සැකසුමේදී ඒවා පරීක්ෂා කරන්න.
joplin.no-server = මෙම ලිපිනයේ Joplin Server එකක් නැත. Joplin සැකසුමේදී එය පරීක්ෂා කරන්න.
joplin.bad-address = මෙම ලිපිනය PaperPaw හට භාවිත කළ හැකි එකක් නොවේ. Joplin සැකසුමේදී එය පරීක්ෂා කරන්න.
joplin.no-data = මෙම ලිපිනයේ Joplin සටහන් නැත. එය පරීක්ෂා කරන්න, නැතහොත් පළමුව Joplin එය සමඟ සමමුහුර්ත කරන්න.
joplin.encrypted = Joplin හි අන්ත-සිට-අන්ත සංකේතනය සක්‍රියයි. PaperPaw හට සටහන් සංකේතනය කළ නොහැකි බැවින් එය කිසිවක් නොයවයි.
joplin.newer-target = Joplin එහි සටහන් මෙම PaperPaw නොදන්නා නව ආකෘතියකින් තබයි. ඒවා යැවීමට PaperPaw යාවත්කාලීන කරන්න.
joplin.older-target = Joplin එහි සටහන් පැරණි ආකෘතියකින් තබයි. එය උත්ශ්‍රේණි කිරීමට Joplin විවෘත කර, නැවත යවන්න.
joplin.upgrading = Joplin මේ මොහොතේ එහි සටහන් උත්ශ්‍රේණි කරමින් සිටී. ඒවා රැඳී සිට පසුව යවනු ලැබේ.
joplin.no-memory = සටහන් යැවීමට මතකය ප්‍රමාණවත් නැත. නැවත ආරම්භ කර නැවත උත්සාහ කරන්න.
keyboard.plugin.name = යතුරුපුවරුව
keyboard.plugin.description = ස්පර්ශයෙන් හෝ බොත්තම්වලින් තිරයේ පෙළ ඇතුළත් කරයි.
keyboard.plugin.how = "යමකට පෙළ අවශ්‍ය වූ විට යතුරුපුවරුව විවෘත වේ: සෙවුමක්, මුරපදයක්, සටහනක් හෝ සැකසීමක්. එය ස්පර්ශයෙන් සහ බොත්තම් පමණක් ද ක්‍රියා කරයි.\n\nබොත්තම්වලින්: වම සහ දකුණ පේළියක් දිගේ (රවුමට) යයි, පිටු බොත්තම් පේළි අතර යයි, ඉහළ සහ පහළ ඔබගේ තීරුවේම රැඳේ; “තෝරන්න” යතුරක් ඔබයි, “ආපසු” අවලංගු කරයි. Shift ඊළඟ අකුර කැපිටල් කරයි; සියල්ල සඳහා දෙවරක් ද, නැවැත්වීමට තවත් වරක් ද ඔබන්න. අකුරක් අල්ලාගෙන සිටීමෙන් (බොත්තම්වලින්: එය මත “තෝරන්න” අල්ලාගෙන සිටින්න) එහි කැපිටල් අකුර සහ é, è වැනි උච්චාරණ ලකුණු ලැබේ; ජර්මන් භාෂාවේ ä, ö, ü, ß ද a, o, u, s වලින් එලෙස ලැබේ. OK අවසන් කරයි; බොත්තම්වලින් ඕනෑම තැනක සිට අවසන් කිරීමට “ආපසු” අල්ලාගෙන සිටින්න, නැතහොත් අකුරක් නොවන යතුරක් මත “තෝරන්න” අල්ලාගෙන සිටින්න. “අලවන්න” පසුරු පුවරුවේ පෙළ ඇතුළු කරයි; “දුරකථනය” ඇති තැන ඔබගේ දුරකථනයෙන් ටයිප් කිරීමට ඉඩ දෙයි.\n\nසැකසීම්හි “උපාංගය”, “යතුරුපුවරුව” යටතේ: “යතුරුපුවරු පිරිසැලසුම්” පිරිසැලසුම් තෝරයි (පෙරනිමිය මෙනු භාෂාවයි; කිහිපයක් ඇත්නම් යතුරකින් මාරු වේ). “උම්ලවුට් යතුරු” ä, ö, ü, ß සඳහා වෙනම යතුරු දෙයි. “ප්‍රමාණය” යතුරු සහ අකුරු විශාල කරයි. ස්පර්ශ තිරවල “යතුරු හැඩය” යතුරුවල පෙනුම වෙනස් කරයි. “ස්වයංක්‍රීය කැපිටල්” සෑම වාක්‍යයක්ම කැපිටල් අකුරකින් අරඹයි."
