home.setup.layout.help = ආරම්භ කිරීමට සූදානම් පිරිසැලසුමක් තෝරන්න. පසුව මෙනුවේ “මුල් තිරය සංස්කරණය කරන්න” මගින් සියල්ල වෙනස් කළ හැක.
