anki.help = ඔබේ පරිගණකයේ Anki කාඩ්පත් අධ්‍යයනය කරන්න: සමමුහුර්තය නියමිත කාඩ්පත් ගෙන එමින් ඔබේ පිළිතුරු ආපසු යවයි. AnkiConnect ඇඩෝනය සමඟ Anki එහි විවෘතව තිබිය යුතුය; එය ක්‍රියා කරන ආකාරය බලන්න.
