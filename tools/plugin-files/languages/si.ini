end-of-book.plugin.name = පොතේ අවසානය
end-of-book.plugin.description = පොතක අවසානයේ තිරයක්: මාලාවේ ඊළඟ පොත, ශ්‍රේණිගත කිරීමක්, කියවා අවසන්ද නැද්ද.
end-of-book.plugin.how = ඔබ පොතක අවසාන පිටුවට ළඟා වූ විට, තිරයක් එහි මාලාවේ ඊළඟ පොත (හෝ පුස්තකාලය) පිරිනමයි, පොතට තරු එකේ සිට පහ දක්වා දීමට ඉඩ දෙයි, සහ එය කියවා අවසන් ලෙස සලකුණු කර ඇත්දැයි පෙන්වයි. අවසාන පිටුවට ආපසු යාමට ආපසු ඔබන්න.
