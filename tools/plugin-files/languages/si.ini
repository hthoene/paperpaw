smart-home.plugin.name = ස්මාර්ට් නිවස
smart-home.plugin.description = ඔබේම Home Assistant හි අගයන් සහ ස්විච, උපකරණ පුවරුවක සහ මුල් තිරයේ විජට් ලෙස. ඔබේ නිවසේ ජාලයේ ඇති Home Assistant සමඟ ක්‍රියා කරයි.
smart-home.plugin.how = "ස්මාර්ට් නිවස ඔබේම Home Assistant හි අගයන් සහ ස්විච පෙන්වයි: උෂ්ණත්වය, ආර්ද්‍රතාවය, බලශක්තිය, දොර සහ ජනෙල්, පහන්, ස්විච සහ දර්ශන. එය නිවසේ ජාලය තුළ REST API හරහා ඔබේ සේවාදායකයට කතා කරයි; වෙනත් සේවාවක් හරහා කිසිවක් නොයයි.\n\nමෙවලම් මෙනුවෙන් ස්මාර්ට් නිවස විවෘත කර, පසුව “සම්බන්ධතාවය”: ඔබේ Home Assistant හි ලිපිනය (උදා. http://homeassistant.local:8123) සහ දිගුකාලීන ප්‍රවේශ ටෝකනයක් (ඔබේ Home Assistant පැතිකඩ පිටුවේ පහළින් සාදන්න) ටයිප් කරන්න. ටෝකනය සැකසීම් ගොනුවක නොව, මුරපද සහ යතුරු අතර සුරැකේ. සාමාන්‍ය http භාවිත වන්නේ නිවසේ ජාලයේ ලිපින සඳහා පමණි; පිටත සේවාදායකයක් සඳහා සැකසීම්වල “නිවසේ ජාලයෙන් පිටත සේවාදායක” සක්‍රිය කර වලංගු සහතිකයක් සහිත https භාවිත කරන්න.\n\n“ඒකක තෝරන්න” සේවාදායකයේ ඇති දේ ලැයිස්තුගත කරයි: නමෙන් හෝ id මගින් සොයා, පෙන්වීමට ඒකකයක් තෝරන්න (ඉවත් කිරීමට එය නැවත තෝරන්න). එයට කාමරයක් දිය හැක; එය උපකරණ පුවරුවේ සහ කාමර විජට්වල කණ්ඩායම් කරයි. ඒකක 24ක් දක්වා තබා ගනී. උපකරණ පුවරුවේ පහනක්, ස්විචයක් හෝ දර්ශනයක් මාරු කිරීමට එය තෝරන්න: පේළිය සේවාදායකයේ පිළිතුර පෙන්වයි. තෝරන සංවේදකයක් නැවත කියවේ.\n\nවිජට් (මුල් තිරය අල්ලාගෙන, විජට් එක් කරන්න): “ස්මාර්ට් නිවස අගය” එක් කියවීමක් විශාලව පෙන්වයි, “කණ්ඩායම” කාමරයක ඒකක ලැයිස්තුගත කරයි, “ස්විචය” එක් පහනක් හෝ ස්විචයක් සඳහා බොත්තමකි, “කාමරය” කාමරයක කියවීම් සහ ස්විච සහිත කාඩ්පතකි. එක් එක් විජට්හි සැකසීම්වල එය පෙන්වන ඒකකය හෝ කාමරය ඇත.\n\nපුවරුව විවෘත කරන විට, ඔබ ඉල්ලන විට (“දැන් නැවුම් කරන්න” පේළිය හෝ අගය හෝ කණ්ඩායම් විජට් තට්ටු කිරීම), Wi-Fi දැනටමත් සක්‍රිය තැනක උපාංගය අවදි වන විට, සහ ආරෝපකය සම්බන්ධ කර ඇති අතරතුර ඔබ සකසන කාලසටහනට අනුව නිවස කියවේ. එය කිසි විටෙක Wi-Fi ඉබේම සක්‍රිය නොකරයි, සක්‍රියව තබා ද නොගනී."
