plugin-manager.plugin.name = ප්ලගින කළමනාකරු
plugin-manager.plugin.description = ප්ලගින ලැයිස්තුගත කර ඒවා සක්‍රිය සහ අක්‍රිය කරයි.
plugin-manager.plugin.how = "ප්ලගින කළමනාකරු සෑම ප්ලගිනයක්ම එහි අනුවාදය සහ විස්තරය සමඟ පෙන්වා, ප්ලගින සක්‍රිය සහ අක්‍රිය කරයි.\n\nඑය සැකසීම්හි ප්ලගින කළමනාකරණය ලෙස ඇත. ප්ලගින සැකසීම් යනු එක් එක් ප්ලගිනයේ ජාල භාවිතය වැනි මනාප සඳහා වෙනම පිටුවකි. ප්ලගිනයක් සක්‍රිය හෝ අක්‍රිය කිරීමට එය තට්ටු කරන්න (බොත්තම් සමඟ, එය තෝරන්න). වෙනස බලපාන්නේ නැවත ආරම්භයකින් පසුවය: එවිට පහළ තීරුව දැන් නැවත ආරම්භ කරන්න පෙන්වයි. ප්ලගිනයක් ක්‍රියා කරන ආකාරය කියවීමට එය අල්ලාගෙන සිටින්න (බොත්තම් සමඟ, තෝරන්න අල්ලාගෙන සිටින්න).\n\nසැමවිට සක්‍රිය ලෙස සලකුණු කළ ප්ලගිනයක් අක්‍රිය කළ නොහැක. අවශ්‍ය ලෙස සලකුණු කළ එකක් අක්‍රිය කළ හැක්කේ වෙනත් ප්ලගිනයක් එහි කාර්යය කරන විට පමණි, නැතහොත් PaperPaw හට ආපසු යාමට මගක් නොමැත. තිර යටතේ, ප්ලගින කිහිපයක් පිරිනමන ස්ථානයක් පෙන්වන ප්ලගිනය ඔබ තෝරයි."
