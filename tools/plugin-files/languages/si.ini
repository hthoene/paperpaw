settings.plugin.description = සෑම ප්ලගිනයකම සැකසීම්වලින් සැදූ සැකසීම් පිටු.
settings.plugin.how = "සැකසීම් මගින් PaperPaw සහ එහි ප්ලගිනවල සැකසිය හැකි සියල්ල පිටු වශයෙන් පෙන්වයි. ප්ලගිනවලට තමන්ගේම තිරයක් අවශ්‍ය නැත: ඒවා ප්‍රකාශ කරන දේ මෙහි කණ්ඩායම් වශයෙන්, එක් එක් සැකසීමට පහළින් එහි විස්තරය සමඟ දිස් වේ.\n\nමෙනුවේ “සැකසීම්” මගින් එය විවෘත කරන්න. කණ්ඩායමක් විවෘත කිරීමට එය තට්ටු කරන්න, පසුව සැකසීමක් මාරු කිරීමට හෝ තේරීමට එය තට්ටු කරන්න; අංකවලට − සහ + බොත්තම් ඇත. බොත්තම් සමඟ, සැකසීමකට ගොස් තෝරන්න ඔබන්න: වම සහ දකුණ අංකයක් වෙනස් කරයි, තෝරන්න එය තබා ගනී, ආපසු කලින් අගයට යයි.\n\nවෙනස්කම් වහාම අදාළ වේ. “සොයන්න” වචන මගින් සැකසීමක් සොයයි, “උසස් සැකසීම්” කලාතුරකින් අවශ්‍ය ඒවා ද පෙන්වයි. “පෙරනිමි වෙත යළි සකසන්න” සහ “සියල්ල යළි සකසන්න” පළමුව විමසයි."
