calendar.plugin.description = ඔබේ දින දර්ශන උපාංගයේ: CalDAV, iCal සහ ගොනුවලින් කාලසටහන, දින, සති සහ මාස දසුන්, සම්බන්ධතාවලින් උපන්දින, මුල් තිරයේ විජට් සහ නින්ද තිරයක්.
calendar.plugin.how = "CalDAV දින දර්ශන (Nextcloud, Radicale, Baïkal, Fastmail ආදිය), iCal ලිපින (.ics, webcal://), කාඩ්පතේ දින දර්ශන ගොනු සහ සම්බන්ධතාවල (CardDAV) උපන්දින හා සංවත්සර, කාලසටහනක්, දිනයක්, සතියක් හෝ මාසයක් ලෙස පෙන්වයි. උපාංගය දින දර්ශන කියවයි පමණි, කිසිවිට වෙනස් නොකරයි.\n\nමෙවලම් මෙනුවෙන් දින දර්ශනය විවෘත කරන්න. පළමු පේළිය තෝරන්න, නැතහොත් පේළියක් අල්ලාගෙන සිටින්න හෝ මෙනුව ඔබන්න: දසුන මාරු කිරීමට, දින දර්ශන එක් කිරීමට හෝ සමමුහුර්ත කිරීමට. දිනය සහ සතිය තුළ පළමු පේළි දෙක සහ පිටු බොත්තම් පෙර හෝ ඊළඟ දිනයට/සතියට යයි; මාසය තුළ ඊතල දිනය ද, පිටු බොත්තම් මාසය ද මාරු කරයි. සිදුවීමක් මත තෝරන්න එය සම්පූර්ණයෙන් පෙන්වයි. ආපසු එක් පියවරක් ආපසු යයි.\n\nමෙනුවේ හෝ සැකසීම්වල “දින දර්ශන” යටතේ දින දර්ශනයක් එක් කරන්න: CalDAV ගිණුමක් (සේවාදායකයේ ලිපිනය ප්‍රමාණවත්), iCal ලිපිනයක්, කාඩ්පතේ ගොනුවක් හෝ සම්බන්ධතා (CardDAV). ලිපිනය, ගිණුමකට පරිශීලක නාමය සහ මුරපදය (යෙදුම් මුරපදයක් වඩාත් හොඳයි) සහ නමක් ඇතුළත් කරන්න. එක් එක් දින දර්ශනයට වෙනස් කළ හැකි සලකුණක් ඇත; දින දර්ශන 6ක් දක්වා.\n\nපුනරාවර්තන, දවස පුරා සහ වෙනත් වේලා කලාපවල සිදුවීම් උපාංගයේ වේලාවෙන් පෙන්වයි. අදට පෙර සහ පසු දින 60 බැගින් සිදුවීම් (උපරිම 240) ජාලය නැතිව ද පෙන්වයි.\n\nදින දර්ශනය විවෘත කරන විට (උපරිම විනාඩි 5කට වරක්), “දැන් සමමුහුර්ත කරන්න” තෝරන විට, සහ සැකසීම් අනුව ජාලය සක්‍රිය විට හෝ ආරෝපණය ආරම්භ වන විට කියවේ. ඒ සඳහා පමණක් Wi-Fi ක්‍රියාත්මක නොවේ.\n\nමුල් තිරයේ විජට් (මුල් තිරය අල්ලාගෙන සිට විජට් එක් කරන්න): අද, ඊළඟ සිදුවීම, කාලසටහන, මාසය සහ උපන්දින. නින්ද තිරයට අද කාලසටහන පෙන්විය හැක: සැකසීම්වල නින්ද තිරය යටතේ දින දර්ශනය තෝරන්න."
