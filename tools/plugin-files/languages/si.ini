reading-goal.plugin.name = කියවීමේ ඉලක්කය
reading-goal.plugin.description = දිනකට කියවිය යුතු විනාඩි, සහ අද කියවීමට අනුව මනෝභාවය වෙනස් වන, මුල් තිරයේ පූසෙක්.
reading-goal.plugin.how = "ඔබේ මුල් තිරයේ පූසෙක් අද කියවීම කෙසේ දැයි පෙන්වයි: තවම කියවා නැති විට දුකින්, ටිකක් කියවූ පසු එසේ මෙසේ, දෛනික ඉලක්කයෙන් අඩක සිට සෑහීමෙන්, ඉලක්කය සපුරා ගත් පසු සතුටින්.\n\nමුල් තිරයට “කියවන පූසා” විජට් එක එක් කරන්න (මුල් තිරය අල්ලාගෙන සිට, විජට් එකක් එක් කරන්න), නැතහොත් නින්දේ තිරය ලෙස “අද කියවීමේ පූසා” තෝරන්න. පූසා තට්ටු කිරීමෙන් දෛනික ඉලක්කය විවෘත වේ; එය ඔබ කියවන විනාඩි ගණන් කරන කියවීමේ සංඛ්‍යාලේඛනවල ඉලක්කයයි.\n\nසැකසීම්වල, කියවීම යටතේ, “සෑහීම සිට” සහ “සතුට සිට” මගින් පූසා සෑහීමෙන් හෝ සතුටින් සිටින්නේ ඉලක්කයේ කුමන කොටසක සිටද යන්න සකසයි, “ස්වකීය පින්තූර” මගින් පූසන් වෙනුවට පෙන්වීමට පින්තූර ෆෝල්ඩරයක් (sad, meh, content සහ happy). පින්තූර PNG හෝ JPEG ගොනු වේ; ෆෝල්ඩරයක් නැතිනම් පූසන් පෙන්වයි."
