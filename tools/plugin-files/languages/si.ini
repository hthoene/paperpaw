fonts-browser.plugin.how = "තවත් අකුරු අන්තර්ජාලයේ අකුරු එකතුවක ඇති අකුරු වර්ග, එක් එක් නම එම අකුරෙන්ම ලියා පෙන්වා, ඔබට අවශ්‍ය ඒවා බාගනී. එයට Wi-Fi අවශ්‍යයි.\n\nසැකසීම්වල කියවීම යටතේ අකුරු වර්ගය ලැයිස්තුවේ අවසානයේ එය ඇත; තත්ත්ව තීරුවල අකුරු සඳහා ද එයම ඇත. අකුරක් තට්ටු කරන්න (බොත්තම් සමඟ තෝරන්න ඔබන්න), නියැදියක් සමඟ විශාලව බලා, බාගන්න තෝරන්න. බාගන්නා අතරතුර පිටුවෙන් ඉවත් විය හැක. අවසන් වූ පසු, අකුරේ නමින් කියවන්න හෝ තත්ත්ව තීරු සඳහා භාවිත කරන්න තෝරන්න. යාවත්කාලීන කරන්න නව අනුවාදයක් ගෙනෙයි, ඉවත් කරන්න එය මකයි.\n\nඔබේම අකුරු\n\nඔබේම අකුරක් යනු .ttf හෝ .otf ගොනුවකි (උදා. Google Fonts වෙතින්).\n\nAndroid සහ අකුරු ගොනු අඳින උපාංගවල: ගොනුව fonts ෆෝල්ඩරයට (Android හි: බෙදාගත් ආචයනයේ PaperPaw/fonts) පිටපත් කර, PaperPaw නැවත ආරම්භ කර, අකුරු වර්ගය ලෙස තෝරන්න.\n\nXteink X4 සහ X4 Pro අකුරු ගොනු නොව අකුරු පැකේජ කියවයි. පරිගණකයක paperpaw-fontgen මගින් එකක් සාදන්න (regular අවශ්‍යයි):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nඑවිට සෑදෙන plugins/font-my-font ෆෝල්ඩරය මතක කාඩ්පතේ plugins ෆෝල්ඩරයට පිටපත් කර, නැවත ආරම්භ කර, My Font තෝරන්න. --chars latin,cyrillic,greek ලිපි එක් කරයි; ඔබේ පොතේ අකුරු නැති අකුරු වර්ගයකට ඒවා පෙන්විය නොහැක. තවත් අකුරු වෙතින් ලැබෙන අකුරුවලට පරිගණකයක් අවශ්‍ය නැත.\n\nකුඩා පෙළ වඩා පැහැදිලි වීමට --hinting light එක් කරන්න; --hinting normal සහ mono වඩා තදින් ගළපයි. සිංහල, අරාබි හෝ දේවනාගරී වැනි ලකුණු සහිත අකුරුවලට එය නොමැතිව වඩා හොඳයි."
