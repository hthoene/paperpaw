bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = දුරස්ථ පාලක, යතුරු පුවරු සහ සංවේදක යුගල කර සම්බන්ධ කරයි.
bluetooth.plugin.how = "Bluetooth ඇති තැන (X4 Pro), Bluetooth මගින් දුරස්ථ පාලක, යතුරු පුවරු සහ සංවේදක උපාංගය සමඟ යුගල කරයි.\n\nඋපාංගයක් එක් කරන්න ළඟ ඇති දේ සොයයි; පළමුව එම උපාංගය යුගල කිරීමේ ප්‍රකාරයට දමන්න. එය තෝරා, මෙහි තහවුරු කරන්න (අංකයක් පෙන්වන්නේ නම් එය සසඳන්න). එවිට දුරස්ථ පාලකයක හෝ යතුරු පුවරුවක බොත්තම් පිටු පෙරළා මෙනු හරහා ගමන් කරයි; එක් එක් බොත්තම කරන දේ පාලන යටතේ වෙනස් කරන්න.\n\nදුරස්ථ පාලක මගින් ඒවායේ බොත්තම් ක්‍රියා කරන්නේ කවදාද යන්න කියයි: මෙහි සක්‍රිය කළ විට, කියවන විට (පොතක් විවෘතව ඇති විට සම්බන්ධයි, බැටරිය ඉතිරි කරයි), හෝ සැමවිටම. මෙනු බොත්තම හෝ උපාංගයක් මත දිගු එබීම එය අමතක කරයි.\n\nසංවේදකයක් ප්ලගින සඳහාය: එය භාවිත කළ හැකි ප්ලගිනය සක්‍රිය කරන්න. කිසිවක් එය භාවිත නොකරන විට Bluetooth අක්‍රියයි."
