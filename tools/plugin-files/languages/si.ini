rules.plugin.name = නීති
rules.plugin.description = යමක් සිදු වූ විට යමක් කරයි: උදා. 22:00ට රාත්‍රී ප්‍රකාරය.
rules.plugin.how = "නීතියක් යමක් සිදු වූ විට ඉබේම යමක් කරයි: සෑම දිනකම 22:00ට රාත්‍රී ප්‍රකාරය සක්‍රිය කිරීම, නැතහොත් PaperPaw ආරම්භ වන විට නාමාවලි සමමුහුර්ත කිරීම.\n\nනීති ඇත්තේ සැකසීම්වල, අභිරුචිකරණය යටතේ, “නීති” ලෙසයි. “නීතිය එක් කරන්න” මගින් “කවදාද?” (PaperPaw ආරම්භය, දවසේ වේලාවක්, පොතක් විවෘත කිරීම හෝ වැසීම, බැටරිය, ආරෝපණය, ස්විචයක් සහ තවත්) සහ “එවිට කුමක්ද?” (ක්‍රියාවක් ධාවනය, ස්විචයක් සක්‍රිය හෝ අක්‍රිය කිරීම, අංකයක් සැකසීම, පණිවිඩයක් පෙන්වීම) අසයි. නීතියක් විරාම කිරීමට එය තට්ටු කරන්න; “දවසේ වේලාවන් දෙකක් අතර” වැනි කොන්දේසියක් සඳහා හෝ ඉවත් කිරීමට එය අල්ලාගෙන සිටින්න (බොත්තම් සමඟ: තෝරන්න අල්ලාගෙන සිටින්න).\n\nතේරිය හැකි ක්‍රියා, ස්විච සහ අංක ප්ලගින අනුව පෙළගැසී ඇත: ප්ලගිනය තෝරා, පසුව එය ගෙනෙන දේ තෝරන්න; ආපසු නැවත පිටතට යයි. පෙන්වන තිරය මත ක්‍රියා කරන ක්‍රියාවක්, උදා. ආපසු හෝ ඊළඟ පිටුව, එහිදී එබූ විට කරන දේම කරයි.\n\nකුමන තිරය විවෘතව තිබුණද වේලාවන් අදාළ වේ. එකිනෙක අහෝසි කරන නීති දෙකක් පියවර කිහිපයකට පසු නතර වේ."
