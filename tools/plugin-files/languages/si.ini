notes-overview.plugin.name = සියලු සටහන්
notes-overview.plugin.description = සියලු පොත්වල පිටු සලකුණු සහ උද්දීපන එක් ලැයිස්තුවක, සහ My Clippings.txt ලෙස අපනයනයක්.
notes-overview.plugin.how = "සියලු සටහන් මගින් ඔබ පිටු සලකුණක් හෝ උද්දීපනයක් කළ සෑම පොතක්ම, ඒවායේ ගණන සමඟ ලැයිස්තුගත කරයි. එය මෙවලම්හි විවෘත කරන්න. පොතක සටහන් බැලීමට එය තෝරන්න, සහ පොත එම ස්ථානයෙන් විවෘත කිරීමට සටහනක් තෝරන්න.\n\nලැයිස්තුවේ අවසානයේ ඇති My Clippings.txt ලෙස අපනයනය කරන්න මගින් සියලු සටහන් එක් ගොනුවකට, පුස්තකාලය අසල ඇති Exports ෆෝල්ඩරයට, Kindle භාවිත කරන ආකෘතියෙන් (UTF-8) ලියයි. Kindle එකක My Clippings.txt කියවන යෙදුම්වලට එය කියවිය හැක. උද්දීපනයක සටහනක් Kindle එකේ මෙන් වෙනම ඇතුළත් කිරීමකි. මෙහි පොත්වලට Kindle ස්ථාන නැති බැවින්, “location” යනු සටහන පොතේ කොපමණ දුරක ඇත්දැයි ප්‍රතිශතයෙනි. ගොනුව සෑම විටම නැවත ලියනු ලැබේ; එය පෙර ගොනුව ප්‍රතිස්ථාපනය කරයි."
