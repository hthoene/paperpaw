diagnostics.plugin.how = "දෝෂ විනිශ්චය යනු උපාංගයක් පරීක්ෂා කිරීමට පරීක්ෂණ තිරයකි: පැනලයට පෙන්විය හැකි සෑම අළු මට්ටමක්ම, බොත්තම් සහ ස්පර්ශය අත්හදා බැලීමට කොටු හතරක්, සහ නැවුම් කිරීමේ ප්‍රකාර සැසඳීමට ප්‍රගති තීරුවක් සහිත පිටු ගණකයක් පෙන්වයි.\n\nපරීක්ෂණ තිරයට මෙනු ඇතුළත් කිරීමක් නැත. වෙනත් ප්ලගිනයක් මුල් තිරයක් නොදෙන විට, හෝ ප්ලගින කළමනාකරුගේ තිර යටතේ මුල් තිරය ස්ථානය සඳහා එය තෝරන විට පමණක් එය මුල් තිරය වේ.\n\nතෝරන්න නාභිගත කොටුව සලකුණු කරයි, ඊතල බොත්තම් කොටු අතර ගෙන යයි; ස්පර්ශයෙන් කොටුවක් තට්ටු කරන්න. පිටු බොත්තම් පරීක්ෂණ පිටු පෙරළයි. නැවත ආරම්භ කිරීමට තෝරන්න හෝ තිරය මත ඇඟිල්ල අල්ලාගෙන සිටින්න.\n\nPaperPaw උපාංගයේ ස්ථිරාංගය වන විට මෙවලම් යටතේ ඇති උපාංග පරීක්ෂාව, එක් පිටුවකට එක බැගින් සෑම කොටසක්ම පරීක්ෂා කරයි: තිරය, බොත්තම්, ස්පර්ශය, ඉදිරිපස ආලෝකය, බැටරිය, කාඩ්පත, ඔරලෝසුව, Wi-Fi, නින්ද සහ මතකය. සෑම පිටුවක්ම අසමත්, මඟ හරින්න සහ සමත් සමඟ අවසන් වේ; මිනුම් යෝජනා කරන පිළිතුර තෝරා ඇත. උපාංගයේ නැති කොටස් මඟ හැරේ. සෑම පිළිතුරකින් පසුම pull request එකකට ඇලවීම සඳහා .paperpaw/plugins/diagnostics/device-check.txt වෙත වාර්තාවක් ලියයි. ආපසු එයින් ඉවත් වේ; නැවත විවෘත කළ විට නැවැත්වූ තැනින් ඉදිරියට යයි. බොත්තම් පමණක් ඇති උපාංගයක පළමුව බොත්තම් පිටුවේ ආරම්භ කරන්න තෝරන්න; ඒ දක්වා ඊතල, තෝරන්න සහ ආපසු සෑම පිටුවක මෙන් ක්‍රියා කරයි."
