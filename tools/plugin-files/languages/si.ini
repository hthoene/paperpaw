stats.plugin.description = ඔබ කොපමණ කාලයක් සහ කොපමණ කියවනවාද යන්න, දින දර්ශනයක් සහ සෑම පොතකම අංක සමඟ සටහන් කරයි.
stats.plugin.how = "කියවීමේ සංඛ්‍යාලේඛන ඔබ එක් එක් පිටුව කොපමණ කාලයක් කියවනවාද යන්න සටහන් කරයි. ඔබට එය අද, සතිය සහ ඔබේ අඛණ්ඩ දින සහිත දළ විශ්ලේෂණයක් ලෙස, දින දර්ශනයක් ලෙස සහ සෑම පොතකම අංක සමඟ පෙනේ.\n\nඑය මෙවලම් වලින්, හෝ කියවීමේදී “තවත්” වලින් විවෘත කරන්න. සැකසීම්වල, කියවීමේ සංඛ්‍යාලේඛන යටතේ, ඔබට “කියවීම සටහන් කරන්න” අක්‍රිය කිරීමට, “දෛනික ඉලක්කය” සැකසීමට, සහ ගණන් ගන්නා “කෙටිම පිටුව” සහ “දිගම පිටුව” සැකසීමට හැක; එවිට පිටු පෙරළා බැලීම හෝ විවෘතව තැබූ පොතක් අංක විකෘති නොකරයි.\n\n“KOReader සමඟ සමමුහුර්ත කරන්න” WebDAV ෆෝල්ඩරයක් හරහා KOReader සමඟ සංඛ්‍යාලේඛන බෙදා ගනී. එය එම උපාංගයේම KOReader හි සංඛ්‍යාලේඛන ද ලබා ගනී. සටහන් කිරීමට ඔරලෝසුව සකසා තිබිය යුතුය: එසේ නැතිනම් එක් වරක් Wi-Fi වෙත සම්බන්ධ වන්න."
