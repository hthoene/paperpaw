puzzles.plugin.name = Amaphazili
puzzles.plugin.description = Amaphazili e-sudoku, amagama anqamulayo ne-chess, ngaphandle kwenethiwekhi, nephazili losuku.
puzzles.plugin.how = "Amaphazili esitimeleni nasegumbini lokulinda, wonke ngaphandle kwenethiwekhi: i-sudoku, amagama anqamulayo namaphazili e-chess. Vula Amaphazili kumenyu yamathuluzi, noma wengeze iwijethi Iphazili losuku esikrinini sasekhaya (bamba isikrini sasekhaya, bese wengeza iwijethi): ibonisa ukuthi i-sudoku yanamuhla ifinyelele kuphi, futhi ukuthinta kuyayivula. I-sudoku yosuku iyafana usuku lonke.\n\nI-Sudoku: kwesobunxele nakwesokudla kuhambisa ikhesa isikwele ngesikwele, phezulu naphansi (izinkinobho zekhasi) umugqa. Khetha ivula amadijithi: khetha elilodwa bese ukhetha futhi ukulifaka, noma Sula ukuze ungenise isikwele. Bamba Khetha (noma Imenyu) ukuze ufinyelele ezinkinobhweni ngezansi kwebhodi: Amanothi aguqula amadijithi abe yimikhondo yepensela, Hlola kumaka izikwele ezingalungile, Hlehlisa ubuyisela ukunyakaza kokugcina, Entsha iqala iphazili yezinga olikhethayo (Lula, Aphakathi, Linzima). Iphazili ngalinye linesixazululo esisodwa kuphela. Umdlalo ugcinwa uma uphuma. Esikrinini esithintwayo thinta isikwele.\n\nAmagama anqamulayo: beka amafayela e-.puz (Across Lite) noma e-.ipuz efolda ethi \"puzzles\" ekhadini lenkumbulo; akukho okufakiwe. Hamba egridini, bese ukhetha ukuthayipha igama elingaphansi kwekhesa ekhibhodini (isigcizelelo ngaphansi sishiya isikwele singenalutho). Izinkinobho ziyashintsha phakathi kweceleni naphansi, zibonisa uhlu lwezeluleko, zihlola izinhlamvu futhi zembula igama. Izinhlamvu zigcinwa kufayela ngalinye. Amafayela e-.puz ahlanganisiwe awakwazi ukuvulwa.\n\nAmaphazili e-chess: isethi encane evela kudathabheyisi yamaphazili ye-Lichess (CC0). Kwesobunxele nakwesokudla kugxuma kusuka entweni eyodwa kuya kwenye, khetha ucezu ofuna ukulihambisa, bese kwesobunxele nakwesokudla kuya lapho lingahamba khona, bese ukhetha futhi. Ukunyakaza okungalungile kuyahlehliswa. Iseluleko simaka ucezu okufanele luhanjiswe, Elandelayo iya kuphazili elandelayo.\n\nIbhodi idweba kabusha kuphela izikwele ezishintshayo. Izibalo zibala amaphazili owaxazululile."
