dictionary.plugin.name = Isichazamazwi
dictionary.plugin.description = Sibheka amagama ezichazamazwini ze-StarDict.
dictionary.plugin.how = "Isichazamazwi sibheka igama elivela encwadini ezichazamazwini ze-StarDict futhi sibonisa izincazelo epaneleni phezu kwengxenye engezansi yesikrini.\n\nEsifundini, bamba igama bese ukhetha Bheka; ngezinkinobho, sebenzisa Khetha umbhalo ngaphansi kwe-Okuningi. Kopisha amafolda ezichazamazwi (anamafayela e-.ifo, .idx ne-.dict) efolda ethi \"dictionaries\" kudivayisi, kufaka namafolda angaphansi, noma ukhethe enye ifolda ku-Izilungiselelo, ngaphansi kwe-Ukufunda, njenge-Ifolda yesichazamazwi (isilungiselelo esithuthukile). Ukubheka kokuqala kulungisa inkomba encane yesichazamazwi ngasinye, okuthatha isikhashana.\n\nEpaneleni, izinkinobho zekhasi noma Phezulu naPhansi zidonsa izincazelo ezide, futhi Emuva liyavala. Ngokuthinta, thinta ngaphandle kwalo ukuze uvale."
