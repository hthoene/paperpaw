file-manager.plugin.name = Umphathi wamafayela
file-manager.plugin.description = Zonke izifolda namafayela kudivayisi: zivule, uziqambe kabusha, uzihambise, uzikopishe uzicishe.
file-manager.plugin.how = "Umphathi wamafayela ubonisa zonke izifolda namafayela esikhaleni sedivayisi, hhayi izincwadi zakho kuphela, futhi ukuvumela ukuthi uvule, uqambe kabusha, uhambise, ukopishe futhi ucishe, wenze nezifolda ezintsha.\n\nVula Amafayela kumenyu Yamathuluzi. Thinta ifolda ukuze ungene kuyo; Emuva liya efolda engenhla. Thinta ifayela, noma ubambe noma yisiphi isibalo (ngezinkinobho, bamba Khetha), ukubona ukuthi yini engenziwa ngalo. Hambisa noma Kopisha kuthatha isibalo: yana efolda eyakhe bese ukhetha Namathisela lapha ebhaleni elingezansi. Ngezinkinobho, cindezela Phansi kusukela esibalweni sokugcina ukuze ufike ebhaleni.\n\nAmafayela nezifolda eziqala ngechashazi, njengedatha ye-PaperPaw uqobo, zifihliwe. Ukuzibona, vula Amafayela afihliwe ku-Izilungiselelo, ngaphansi kwe-Umtapo."
