format-cbz.plugin.name = Izincwadi zamahlaya
format-cbz.plugin.description = Ivula iziqondiso zezincwadi zamahlaya (.cbz), isithombe ikhasi ngalinye.
format-cbz.plugin.how = "Ivula iziqondiso zezincwadi zamahlaya (.cbz): isithombe ikhasi ngalinye, silingana nesikrini, ngokulandelana kwamagama azo (2 ngaphambi kwa-10).\n\nZibeke efolda yomtapo bese uzivula emtapweni; phendula amakhasi njengakunoma iyiphi incwadi. Izithombe ezinkulu zithatha isikhashana ngesikhathi sokuqala, ku-X4 kakhulu kunakwenye indawo.\n\nIzilungiselelo zokufunda (Izilungiselelo, Ukufunda): \"Ipaneli ngepaneli\" ibonisa ipaneli elilodwa lekhasi ngesikhathi, elikhulu ngokusavumela isikrini, futhi ukuphenduka kwekhasi kudlula kuwo; ikhasi elingenamapaneli libonisiwe lonke. \"Amakhasi amahlaya ahamba\" aphendukisa ukuphenduka kwekhasi kwe-manga (kusuka kwesokudla kuya kwesobunxele); i-ComicInfo.xml yencwadi uqobo ikusho yodwa. Umtapo ubonisa isihloko sencwadi nochungechunge nenombolo yayo kusukela ku-ComicInfo.xml."
format-cbz.title = Incwadi yamahlaya (CBZ)
format-cbz.setting.direction = Amakhasi amahlaya ahamba
format-cbz.setting.direction.help = Manga: ukuphenduka kwekhasi kuyaphendukiswa.
