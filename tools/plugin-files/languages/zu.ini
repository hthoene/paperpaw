setup.plugin.name = Ukusetha
setup.plugin.description = Umhlahlandlela omfushane ngezilungiselelo ezibalulekile, ekuqaleni kokuqala.
setup.plugin.how = "Ukusetha kuwumhlahlandlela omfushane ngezilungiselelo ezibalulekile, obonisiwe kanye, ngesikhathi sokuqala i-PaperPaw iqala. Ikhasi ngalinye libuza into eyodwa, efana nolimi, izinkinobho, usayizi wombhalo, indawo yesikhathi, i-Wi-Fi noma izengezo ezimbalwa okufanele zengezwe, ngempendulo ebonakala ilungile esevele ikhethiwe, ngakho Okulandelayo kuhlala kulungile. Izinyathelo ezingadingwa yile divayisi ziyashiywa.\n\nThinta izinkinobho, noma usebenzise izinkinobho zephezulu naphansi ne-Khetha. Yeqa ekhasini lokuqala liyayishiya ukusetha ngokushesha. Ikhasi lokugcina lisho lapho izincwadi zakho zivela khona.\n\nUkuyisebenzisa futhi, vula izilungiselelo ukhethe Setha i-PaperPaw. Konke okukhethwe lapha kungashintshwa ezilungiselelweni kamuva."
