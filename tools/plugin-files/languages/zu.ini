home.plugin.name = Isikrini sasekhaya
home.plugin.description = Ikhasi lokuqala: amakhasi amawijethi, njengencwadi efundwayo namathuluzi.
home.plugin.how = "Isikrini sasekhaya sakhiwe ngamakhasi, ngalinye ligridi yamawijethi namathuluzi njengefoni. Ekuqaleni iwashi, incwadi oyifundayo nezincwadi ezifundwe kamuva zisekhasini elilodwa, kanti wonke amathuluzi alandelayo.\n\nThinta into ukuyivula, futhi uswayiphe noma usebenzise izinkinobho zekhasi ukuze ushintshe amakhasi. Ngezinkinobho kuphela, izinkinobho zemitshezo ziyahamba kusuka entweni eyodwa ziye kwelandelayo futhi Khetha iyayivula.\n\nUkuze uyihlele kabusha, bamba isikrini sasekhaya, thinta ipensela ngezansi kwekhasi noma ukhethe Hlela isikrini sasekhaya kumenyu. Donsa izinto ukuzihambisa noma uthinte eyodwa ukuthola okukhethwa kuyo, nangezinkinobho. Engeza iwijethi nakho kukhona. Amakholomu Nemigqa kusezilungiselelweni, ngaphansi kwe-Ukubukeka, esigabeni se-Isikrini sasekhaya.\n\nEsikrinini esifulelwe eceleni, isikrini sasekhaya sibonisa izinto ezifanayo ngamakholomu amaningi, ikhasi ngalinye ligcwala ngaphambi kwelilandelayo, namakhadi angabanzi kakhulu kuno-110 mm; akukho okuhleliwe okuqondile okushintshwayo. Yihlele eceleni futhi leyo ndlela ihleliwe igcinelwa leyo ndlela yodwa: amawijethi amasha engezwa kokubili. Setha kabusha ukuhleleka okuvundlile ku-Engeza (ngenkathi uhlela) kubuyela kokuthathwe. Ukususa iwijethi noma ithuluzi kolunye uhlangothi akukususi kolunye."
