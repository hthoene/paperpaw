battery.plugin.name = Ukusetshenziswa kwebhethri
battery.plugin.description = Irekhoda ibhethri futhi ibonise ukuthi lihlala isikhathi esingakanani.
battery.plugin.how = "Ukusetshenziswa kwebhethri kuqaphela izinga lamandla cishe kanye ngomzuzu ngenkathi idivayisi ivuliwe, kanye nalokho eyakwenza: ukuvuselela isikrini namakhasi aphendukile. Kusuka lapho ibala ukuthi ihora elivuliwe namakhasi ayi-100 athatha malini, nokuthi ibhethri lihlala isikhathi esingakanani ngalesi sivinini.\n\nVula Ibhethri kumenyu Yamathuluzi. Libonisa izinga lamandla manje, lesi sikhathi sokuvuliwe, ukusetshenziswa ebhethrini kuze kube manje nezikhathi zakho zakamuva zokuvuliwe. Lidlula ngezinkinobho zamakhasi, noma ngokuthinta imitshezo ngaphezulu.\n\nLidinga isikhathi sokufunda ebhethrini ngaphambi kokuba izibalo zibe nencazelo. Ukurekhoda kuvuliwe ngokuzenzakalelayo futhi kungavalwa ku-Izilungiselelo, ngaphansi kwe-Idivayisi, Amandla, njengo-Rekhoda ukusetshenziswa kwebhethri."
