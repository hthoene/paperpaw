calibre.plugin.name = Umtapo ongenazintambo
calibre.plugin.description = Wamukela izincwadi ngenethiwekhi. Usebenza njengedivayisi engenazintambo ye-Calibre.
calibre.plugin.how = "Umtapo ongenazintambo uvumela idivayisi ibonakale ku-Calibre ekhompyutheni yakho njengedivayisi engenazintambo. I-Calibre ingathumela izincwadi kuyo, izidwebe futhi izisuse. Izincwadi zingena emtapweni.\n\nVula Umtapo ongenazintambo kumenyu Yamathuluzi, idivayisi nekhompyutha kunethiwekhi ye-Wi-Fi efanayo. Ku-Calibre khetha Connect/share, bese Start wireless device connection. Lapho idivayisi isitholile ikhompyutha yakho ibonisa igama layo; thinta Xhuma (ngezinkinobho, cindezela Khetha). I-Calibre ingengeza futhi isuse izincwadi lapha, ngakho xhuma kuphela ekhompyutheni yakho. Ukuvala isikrini kuqeda uxhumano.\n\nUma i-Calibre ingatholakali yodwa, faka ikheli lekhompyutha yayo ku-Izilungiselelo, ngaphansi kwe-Umtapo, njenge-Ikheli engxenyeni ye-Calibre. Uma i-Calibre isebenzisa imbobo engeyona i-9090, yengeze njengo-:imbobo, isb. 192.168.1.20:9091."
