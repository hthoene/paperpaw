diagnostics.plugin.name = Ukuxilonga
diagnostics.plugin.description = Isikrini sokuhlola nokuhlola okuqondisiwe kwayo yonke ingxenye yedivayisi.
diagnostics.plugin.how = "Ukuxilonga yisikrini sokuhlola sokuhlola idivayisi: sibonisa wonke amazinga empunga ipaneli engawabonisa, amabhokisi amane okuzama izinkinobho nokuthinta, nesibali sekhasi nebha yenqubekelaphambili ukuqhathanisa izindlela zokuvuselela.\n\nIsikrini sokuhlola asinayo into yemenyu. Siyisikrini sasekhaya kuphela uma kungekho esinye isengezo esinikezayo, noma uma usikhetha ngaphansi kwe-Izikrini kumphathi wezengezo endaweni ethi Isikrini sasekhaya.\n\nKhetha uphawe ibhokisi eligxilisiwe, futhi izinkinobho zemitshezo zihamba phakathi kwamabhokisi; ngokuthinta, thinta ibhokisi. Izinkinobho zekhasi ziphendula amakhasi okuhlola. Bamba Khetha, noma ubambe umunwe esikrinini, ukuze uqale kabusha.\n\nUkuhlola idivayisi, ngaphansi kwe-Amathuluzi lapho i-PaperPaw iyi-firmware yedivayisi, kuhamba kuzo zonke izingxenye zedivayisi ikhasi elilodwa ngesikhathi: isikrini, izinkinobho, ukuthinta, ukukhanya kwangaphambili, ibhethri, ikhadi, iwashi, i-Wi-Fi, ukulala nenkumbulo. Ikhasi ngalinye liphela nge-Hlulekile, Yeqa ne-Dlulile, impendulo eyaphakanyiswa yizilinganiso zalo ikhethiwe; izingxenye idivayisi engenazo ziyeqiwa. Ngemva kwempendulo ngayinye ibhala umbiko ku-.paperpaw/plugins/diagnostics/device-check.txt, ukuze unamathisele ku-pull request. Emuva liyaphuma, futhi liqhubeka lapho lalikhona uma livulwa futhi. Kudivayisi yezinkinobho kuphela, khetha Qala kuqala ekhasini lezinkinobho; kuze kube yilapho imitshezo, Khetha ne-Emuva zisebenza njengakuwo wonke amakhasi."
