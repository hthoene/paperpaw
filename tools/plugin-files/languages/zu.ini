smart-home.plugin.name = Ikhaya elihlakaniphile
smart-home.plugin.description = Amanani namaswishi avela ku-Home Assistant yakho kudeshibhodi nanjengamawijethi esikrini sasekhaya. Isebenza ne-Home Assistant kunethiwekhi yakho yasekhaya.
smart-home.plugin.how = "Ikhaya elihlakaniphile libonisa amanani namaswishi avela ku-Home Assistant yakho: izinga lokushisa, umswakama, amandla, iminyango namawindi, izibani, amaswishi nezigcawu. Ikhuluma neseva yakho nge-REST API yayo kunethiwekhi yakho yasekhaya; akukho okudlula kunoma yiluphi olunye usizo.\n\nVula Ikhaya elihlakaniphile kumenyu yamathuluzi, bese Uxhumano: thayipha ikheli le-Home Assistant yakho (isibonelo http://homeassistant.local:8123) nethokheni yokufinyelela esebenza isikhathi eside (yenze ekugcineni kwekhasi lephrofayili le-Home Assistant yakho). Ithokheni igcinwa phakathi kwamaphasiwedi nezikhiye, akusoze igcinwa efayeleni lezilungiselelo. I-http ejwayelekile isetshenziswa kuphela kumakheli kunethiwekhi yakho yasekhaya; kuseva kwenye indawo vula “Amaseva angaphandle kwenethiwekhi yasekhaya” ezilungiselelweni bese usebenzisa i-https nesitifiketi esivumelekile.\n\nKhetha izinto ivula uhlu lwalokho iseva yakho enakho: sesha ngegama noma i-id bese ukhetha into ukuyibonisa (yikhethe futhi ukuze uyisuse). Ungayinika igumbi, eliyihlanganisa kudeshibhodi nasemawijethi egumbi. Zigcinwa izinto ezifika kuma-24. Kudeshibhodi khetha isibani, iswishi noma isigcawu ukuyishintsha: umugqa ubonisa impendulo yeseva. Inzwa oyikhethile iyafundwa futhi.\n\nAmawijethi (bamba isikrini sasekhaya, bese wengeza iwijethi): Inani lekhaya elihlakaniphile libonisa ukufunda okukodwa kukhulu, iqembu lidwebe izinto zegumbi, iswishi inkinobho yesibani esisodwa noma iswishi, futhi igumbi ikhadi elinokufunda namaswishi egumbi. Izilungiselelo zewijethi ngayinye zisho ukuthi iyiphi into noma igumbi ebonisayo.\n\nIkhaya lifundwa uma uvula ideshibhodi, uma ucela (umugqa we-Vuselela noma ukuthinta ewijethini yenani noma yeqembu), uma isifundi sivuka lapho i-Wi-Fi isivele iphezulu, nangohlelo osisethile ngenkathi isishaja sifakiwe. Ayivuli irediyo yodwa futhi ayihlali ivuliwe."
