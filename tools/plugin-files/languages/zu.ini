news.plugin.name = Izindaba
news.plugin.description = Ilanda izikhukhula zezindaba (RSS, Atom) njengezincwadi zokufunda.
news.plugin.how = "Izindaba zenza izikhukhula ze-RSS noma ze-Atom zibe izincwadi. Isikhukhula ngasinye siba yincwadi eyodwa efolda yeZindaba yomtapo, ngezindatshana zaso zakamuva njengombhalo olula, ukuze zifundwe njengakunoma iyiphi enye incwadi.\n\nVula Izindaba kumenyu Yamathuluzi bese ukhetha Engeza isikhukhula; ikheli laso lisesayithini lephephandaba noma lebhulogi. Landa izindaba kulanda zonke izikhukhula bese kubuyisela izincwadi zangaphambili. Bamba isikhukhula (ngezinkinobho, bamba Khetha) ukuze usilande noma usisuse sodwa. Isikhukhula esisusiwe sishiya incwadi yaso emtapweni.\n\nUkulanda kudinga inethiwekhi. Izindatshana ngesikhukhula (Izilungiselelo, Umtapo) isetha ukuthi zingaki izindatshana incwadi ngayinye ezibambayo. Iwijethi Yezihloko zezindaba izibonisa esikrinini sasekhaya."
