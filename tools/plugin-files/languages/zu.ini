menu-editor.plugin.name = Umhleli wamamenyu
menu-editor.plugin.description = Uhlela kabusha, ususe futhi wengeze izibalo zemenyu ngayinye.
menu-editor.plugin.how = "Umhleli wamamenyu ushintsha okuqukethwe yimenyu: hambisa izibalo phezulu noma phansi, uzisuse, noma wengeze ezintsha.\n\nUmtholela ku-Izilungiselelo ngaphansi kwe-Enza ngendlela yakho, njenge-Enza amamenyu ngendlela yakho. Khetha imenyu, bese uthi isibalo ukuze usihambise noma usisuse; Engeza isibalo ifaka esisha. Izinguquko zisebenza ngokushesha. Setha kabusha le menyu ibuyisela imenyu ekutheni izengezo zayo zichaza kanjani, Setha kabusha onke amamenyu kwenza njalo kuwo wonke.\n\nAwukwazi ukuzikhiya ngaphandle: isibalo okuyindlela eya ezilungiselelweni sihlala kuze kube yilapho wengeza enye indlela eya kuzo."
