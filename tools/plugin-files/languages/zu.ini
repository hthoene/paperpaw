transfer.plugin.name = Ukudlulisa
transfer.plugin.description = Beka izincwadi namanye amafayela kudivayisi usuka kusiphequluli kunethiwekhi efanayo.
transfer.plugin.how = "Ukudlulisa nge-Wi-Fi kubeka izincwadi namanye amafayela kudivayisi usuka kusiphequluli kunethiwekhi efanayo, ngaphandle kwentambo noma uhlelo. Ungalanda namafayela, wenze izifolda futhi ucishe.\n\nKuvule kuma-Amathuluzi. Isikrini sibonisa ikheli njengombhalo nanjengekhodi ye-QR: livule kusiphequluli efonini noma ekhompyutheni, noma uskene ikhodi. Ikheli liqukethe isikhiye esenziwa kabusha njalo, ukuze abanye kunethiwekhi bangafinyeleli kumafayela akho. Ukudlulisa kusebenza ngenkathi isikrini sivuliwe.\n\nLapho i-PaperPaw iqhuba i-Wi-Fi uqobo, njengakuX4, Ngaphandle kwerutha ezansi ivula inethiwekhi yedivayisi uqobo, efonini ijoyina ngokuskena ikhodi."
