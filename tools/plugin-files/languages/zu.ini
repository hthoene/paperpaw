about.plugin.name = Mayelana
about.plugin.description = Inguqulo nezimvume ze-PaperPaw.
about.plugin.how = "Mayelana kubonisa ukuthi yiyiphi inguqulo ye-PaperPaw onayo, lapho itholakala khona ikhodi yayo yomthombo, nokuthi iza ngaphansi kwamalayisense amaphi.\n\nUyitholela ekugcineni kwezilungiselelo, ethi Mayelana ne-PaperPaw. Khetha umugqa ngezinkinobho zemitshezo ne-Khetha, noma uwuthinte. Izengezo ezakhelwe ku-firmware nakumadivayisi alayisha izengezo ngekhodi, isigxivizo somunwe okufanele izengezo ezinjalo zakhelwe sona, nazo ziyatholakala.\n\nAmalayisense avuleka njengombhalo esifundini, ngakho udlulisa amakhasi njengencwadi. Aqukethe ilayisense ye-PaperPaw uqobo neyamafonti, izithonjana namaphethini okuhlukanisa amagama eza nawo. Izengezo zingangeza umugqa walo, njengombhali wetimu."
