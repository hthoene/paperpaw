notes-vault.plugin.name = Indawo yamanothi
notes-vault.plugin.description = Ifunda ifolda yamanothi e-Markdown ngezifolda, amathegi nezinguquko zakamuva, namawijethi esikrini sasekhaya. Isebenza nezindawo ze-Obsidian.
notes-vault.plugin.how = "Indawo yamanothi ifunda ifolda yamanothi e-Markdown (amafayela e-.md alula, njengoba izinhlelo zamanothi zigcina). Isebenza nezindawo ze-Obsidian.\n\nKhetha ifolda yendawo ezilungiselelweni, noma ekhasini lendawo emathuluzini. Ikhasi bese linikeza izifolda njengoba zinjalo ekhadini, amanothi ashintshe kokugcina, amathegi, nokusesha ezihlokweni zamanothi.\n\nNgesikhathi sokuqala, indawo ikhonjwa ngasemuva ngenkathi ikhasi layo livuliwe; indawo yamanothi ayizinkulungwane ithatha imizuzu embalwa, bese ivuleka ngokushesha. Inkomba igcinwa ekhadini futhi yenziwe futhi uma ikhasi lendawo livuleka ngemva kwamahora athile, noma uma ukhetha Buyekeza.\n\nInothi livuleka esifundini. Izixhumanisi ezinothini ezinye ([[Note]], [[Note|words]], [[Note#Heading]]) zitholakala ngegama lenothi noma yikuphi endaweni; ukulandela eyodwa kuvula leli nothi, futhi Emuva libuyela enothini langaphambilini.\n\nAkukho okushintshwayo endaweni. Amawijethi esikrini sasekhaya (amanothi akamuva, inothi elibhinyiwe, inothi losuku, inothi elingahleliwe, amathegi, usesho) engezwa kumhleli wesikrini sasekhaya. Iwijethi ingathatha amanothi ayo kufolda eyodwa kuphela: bhala indlela yefolda kusukela empandeni yekhadi (isibonelo Notes/Work) ezilungiselelweni zewijethi; uma ishiywe ingenalutho, ithatha wonke amanothi endawo."
