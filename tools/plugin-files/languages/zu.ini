reader.plugin.name = Isifundi
reader.plugin.description = Ibonisa izincwadi ikhasi ngekhasi, ngethebula lokuqukethwe nezilungiselelo zokufunda.
reader.plugin.how = "Isifundi sibonisa izincwadi ikhasi ngekhasi. Vula incwadi emtapweni; incwadi yokugcina ingavuleka kabusha ekuqaleni (isilungiselelo Vula incwadi yokugcina ekuqaleni).\n\nThinta kwesobunxele noma kwesokudla kwesikrini, noma usebenzise izinkinobho zekhasi, ukuze uphendule amakhasi. Thinta maphakathi noma ucindezele Khetha ukuze ubone imenyu yokufunda: Okuqukethwe, Sesha, Yana ekhasini, Ifonti nokuhleleka, Amabhukhimakhi nokugqamisiwe nokunye. Phansi usuka emphethweni ongaphezulu kuvula ipaneli esheshayo, phezulu usuka emphethweni ongezansi kuya ekhaya; kanjalo nokubamba Emuva.\n\nBamba Khetha (noma ubambe isithombe) ukuze ubone isithombe sigcwele isikrini: Kwesobunxele nakwesokudla kudlula ezithombeni zekhasi. Khetha kusondeza ku-2x, 3x futhi kubuye (ukuthinta kabili ngokuthinta); kusondeziwe, Kwesobunxele nakwesokudla kudonsa eceleni, izinkinobho zekhasi (noma ukuswayipha) ziyaqhubeka ngaphesheya naphansi. Emuva libuyela ekulinganeni, bese ekhasini (bamba ukuze uphume ngokuthinta). Thinta ikhoneni eliphezulu kwesokudla ukuze uthole ibhukhimakhi. Bamba igama ukuze uligqamise. Ngezinkinobho, bamba Kwesobunxele: Kwesobunxele nakwesokudla kuhamba ngegama, izinkinobho zekhasi ngomugqa, ukuzibamba kuya ekugcineni kwekhasi nangephuzu; Khetha ivula ibha yokugqamisa yegama, ukubamba Khetha kuyayibanzisa ibe umusho nephuzu (bese Kwesobunxele nakwesokudla kuhambisa ukuphela, ukuzibamba kuhambisa ukuqala). Ukukhetha kuqhubeka ngokuphenduka kwekhasi. Thumela njenge-Markdown kugcina amanothi akho."
