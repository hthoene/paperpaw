aids.plugin.name = Usizo lokufunda
aids.plugin.description = Ukuqala kwamagama ngokugqamile, amagama afakelwe, izithombe: umbhalo njengoba ufuna.
aids.plugin.how = "Usizo lokufunda lushintsha indlela umbhalo wencwadi obukeka ngayo ngenkathi ufunda. Lusebenza kuzo zonke izincwadi. Ukuqala kwamagama ngokugqamile nokufaka amagama kuvaliwe ekuqaleni.\n\nUlutholela ku-Izilungiselelo, ngaphansi kwe-Ukufunda, esigabeni se-Usizo lokufunda. Ukuqala kwamagama ngokugqamile kubeka ingxenye yokuqala yegama ngalinye ngokugqamile, okunye abantu abanye abakuthola kulula ukukulandela. Ukufaka amagama kuthatha izibhangqa ezibhalwe njengo-\"ibhayisikili = ibhasikili; Mnu. = Umnumzane\", zihlukaniswe ngamakholoni amancane.\n\nKufakwa kuphela amagama aphelele, kanye njengoba uwabhalile, ngakho \"ibhasikili\" ayiguquli ingxenye yegama elide. Ifayela lencwadi uqobo alishintshwa.\n\nIzithombe ezincwadini zingabonisiwe (njengasekuqaleni), zenziwe umugqa omfushane onjengo-\"[Isithombe: umkhumbi olwandle]\" osebenzisa incazelo yesithombe, noma zishiywe. Ikhasi bese linesikhala esiningi sombhalo, futhi akukho okuhlolwayo esithombeni esingabonisiwe, okwenza amakhasi aphenduke ngokushesha. Amahlaya nezinye izincwadi ezakhiwe ngezithombe azishintshwa."
