bluetooth.plugin.how = "I-Bluetooth ihlanganisa amarimothi, amakhibhodi nezinzwa nesifundi, lapho sinayo i-Bluetooth (i-X4 Pro).\n\nEngeza idivayisi ifuna okusondele; beka kuqala idivayisi kumodi yokuhlanganisa. Yikhethe, futhi uqinisekise esifundini (qhathanisa inombolo lapho kukhona okubonisiwe). Izikhiye zerimothi noma zekhibhodi zibe sezijika amakhasi futhi zihambe kumamenyu; shintsha lokho isikhiye ngasinye esikwenzayo ngaphansi kwe-Ukulawula.\n\nAmarimothi athi izikhiye zawo zisebenza nini: uma kuvuliwe lapha, ngenkathi ufunda (kuxhunyiwe ngenkathi incwadi ivuliwe, kugcina ibhethri), noma njalo. Inkinobho yemenyu noma ukucindezela isikhathi eside kudivayisi kuyikhohlwa.\n\nInzwa ingeyezengezo: vula ukuthi yisiphi isengezo esingayisebenzisa. I-Bluetooth ivaliwe noma nini lapho kungekho okuyisebenzisayo."
