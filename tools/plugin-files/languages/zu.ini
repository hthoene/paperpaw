pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Isibali sikhathi sokugxila esinemijikelezo yomsebenzi nekhefu, amawijethi nesibalo sosuku.
pomodoro.plugin.how = "Isibali sikhathi se-Pomodoro: sebenza ngemijikelezo egxilile, bese uphumula. Asidingi ukusethwa: imizuzu engu-25 yokugxila, emi-5 yokuphumula, futhi ngemva kwemijikelezo emine ikhefu elide elingu-15.\n\nVula i-Pomodoro kumenyu yamathuluzi bese ucindezela Qala, noma wengeze amawijethi ayo esikrinini sasekhaya (bamba isikrini sasekhaya, bese wengeza iwijethi): Isibali sikhathi se-Pomodoro sibonisa isigaba nemizuzu esele, i-Pomodoro qala/misa inkinobho, futhi i-Pomodoro namuhla ibala imijikelezo oyiqedile, nenhloso yakho yansuku zonke. Ukuthinta isibali sikhathi kuyasiqala noma kusimise; sibambe ukuze uvule isikrini esigcwele.\n\nIsibali sikhathi siqhubeka sisebenza uma ushiya isikrini, futhi siyaqhubeka ngewashi ngemva kokuqala kabusha. Ngenkathi isifundi silele akukho okusebenzayo: isigaba esiphelele phakathi kwalokho sibikwa uma sivuka. Isaziso sikutshela uma isigaba siphelile. Ukonga ibhethri iwashi libuyekezwa kanye ngomzuzu (njalo ngemizuzwana eyishumi emzuzwini wokugcina esikrinini esigcwele) futhi alilokothi lishiye isifundi sivuliwe.\n\nNgaphansi kwe-Pomodoro ezilungiselelweni usetha ubude nemijikelezo yesethi, nokuthi isigaba esilandelayo siqala sodwa yini. Ngaphansi kwe-Okuningi: ukukhanya kwesikrini noma ukucwayiza kokukhanya kwangaphambili lapho isigaba siphela nenhloso yansuku zonke."
