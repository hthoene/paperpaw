keyboard.plugin.name = Ikhibhodi
keyboard.plugin.description = Ifaka umbhalo esikrinini, ngokuthinta noma ngezinkinobho.
keyboard.plugin.how = "Ikhibhodi ivuleka noma nini lapho okuthile kudinga umbhalo: usesho, iphasiwedi, inothi noma isilungiselelo. Isebenza ngokuthinta nangezinkinobho kuphela.\n\nNgezinkinobho, kwesobunxele nakwesokudla kuhamba emgqeni, izinkinobho zekhasi zihamba phakathi kwemigqa, Khetha icindezela isikhiye futhi Emuva likhansela; kwesobunxele nakwesokudla kuzungeza umugqa, futhi phezulu naphansi kugcina ikholomu yakho. I-Shift yenza uhlamvu olulandelayo lube ngolukhulu; yicindezele kabili ukuze zibe zonke ezinkulu, futhi kanye futhi ukuze uyeke. Bamba uhlamvu (ngezinkinobho: bamba Khetha kulo) ukuze uthole ulukhulu lwalo, olukhethiwe ngokushesha, nezinhlamvu ezinezimpawu ezifana ne-é ne-è; ngesi-Jalimane, ä, ö, ü ne-ß zivela kanjalo ku-a, o, u ne-s (ngezinkinobho, ikhibhodi ikusho kulezo zinhlamvu). Kulungile iyaqeda; ngezinkinobho, bamba Emuva ukuze uqede noma kuphi (Emuva kuyodwa likhansela), noma ubambe Khetha esikhiye esingesona uhlamvu. Namathisela ifaka umbhalo webhodi lokunamathisela, futhi Ifoni, lapho inikezwa, ikuvumela ukuthi uthayiphe efonini yakho kunalokho.\n\nEzilungiselelweni ngaphansi kwe-Idivayisi, Ikhibhodi: Izakhiwo zekhibhodi zikhetha izakhiwo. Ngokuzenzakalelayo ilandela ulimi lwemenyu; ngezimbalwa, isikhiye siyashintshanisa phakathi kwazo. Izikhiye ze-umlaut zinikeza izikhiye ze-ä, ö, ü ne-ß zazo esikhundleni. Usayizi wenza izikhiye nezinhlamvu zibe zinkulu; ngezinkinobho kuphela, imigqa ihlala ingeyekhibhodi yekhompyutha. Ezikrinini ezithintwayo, Ukubukeka kwesikhiye kushintsha ukubukeka kwezikhiye. Izinhlamvu ezinkulu ezizenzakalelayo ziqala umusho ngamunye ngohlamvu olukhulu."
