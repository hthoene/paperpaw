calendar.plugin.name = Ikhalenda
calendar.plugin.description = Amakhalenda akho esifundini: ukubuka i-ajenda, usuku, iviki nenyanga kusuka ku-CalDAV, i-iCal namafayela, usuku lokuzalwa kokuxhumana nabo, amawijethi asekhaya nesikrini sokulala.
calendar.plugin.how = "Amakhalenda akho esifundini: i-ajenda yezinsuku ezilandelayo, usuku, iviki nenyanga, nezehlakalo zamakhalenda e-CalDAV (Nextcloud, Radicale, Baïkal, Fastmail nabanye), amakheli e-iCal (.ics, webcal://), amafayela amakhalenda asekhadini nezinsuku zokuzalwa nezikhumbuzo zabantu obaziyo (CardDAV). Isifundi sifunda kuphela amakhalenda; asishintshi.\n\nVula Ikhalenda kumenyu yamathuluzi. Umugqa wokuqala uqamba ukubuka; wukhethe, noma ubambe noma yimuphi umugqa noma ucindezele Imenyu, ukuze ushintshe phakathi kwe-Ajenda, Usuku, Iviki, Inyanga nezinsuku zokuzalwa, ukwengeza amakhalenda noma ukuvumelanisa. Kuyo Usuku ne-Iviki imigqa emibili yokuqala iya osukwini noma ivikini langaphambili nelilandelayo (izikhiye zekhasi nazo); kuyo Inyanga imitshezo ihambisa usuku, izikhiye zekhasi inyanga, futhi Khetha kuvula usuku. Khetha esehlakalweni kuyasibonisa sonke: ngobani nini, kuphi, yikhalenda liphi nokuthi siphindeka kanjani. Emuva kubuyela emuva isinyathelo esisodwa.\n\nEngeza ikhalenda ngaphansi kwe-Amakhalenda (kumenyu, noma Ikhalenda ezilungiselelweni). Khetha uhlobo lwalo: akhawunti ye-CalDAV (ikheli leseva lonke lanele, isb. cloud.example.com/remote.php/dav; wonke amakhalenda anezehlakalo aba yingxenye yokubuka), ikheli le-iCal (ikhalenda eshicilelwe njenge-.ics), ifayela lekhalenda esekhadini, noma abaxhumana nabo (incwadi yamakheli ye-CardDAV: isifundi sibonisa izinsuku zokuzalwa nezikhumbuzo ezigciniwe kubo). Faka ikheli, ku-akhawunti igama lakho lomsebenzisi nephasiwedi (kungcono iphasiwedi yohlelo; igcinwa namaphasiwedi esifundi), negama. Ikhalenda ngalinye linophawu (ichashazi, indandatho, ichashazi elimpunga noma isikwele) ongaluguqula, ukuze uwahlukanise; kuze kube ngamakhalenda ayisithupha.\n\nIzehlakalo eziphindwayo (nsuku zonke, evikini, enyangeni, onyakeni, ngezinsuku zeviki, ngezibalo, ngezinsuku zokuphela nezinsuku ezishiyiwe), izehlakalo zosuku lonke nezehlakalo ezindaweni ezinye zesikhathi zibonisiwe ngewashi lesifundi uqobo. Isifundi sigcina izehlakalo kusukela ezinsukwini ezingamashumi ayisithupha ngaphambi kuze kube ngamashumi ayisithupha ngemva kwanamuhla, ezingu-240 kakhulu, futhi siyazibonisa ngaphandle kwenethiwekhi. Imithetho esingayifundi ibonisa isehlakalo sayo kanye.\n\nAmakhalenda afundwa uma uvula ikhalenda (kuze kube njalo ngemizuzu emihlanu), uma ukhetha Vumelanisa manje, futhi, njengoba usetha ngaphansi kwe-Ikhalenda ezilungiselelweni, uma inethiwekhi isivuliwe noma uma kuqala ukushaja. Isifundi asivuli irediyo yaso ngenxa yalokhu, ngaphandle kokuba ucele Vumelanisa manje.\n\nAmawijethi esikrini sasekhaya (bamba isikrini sasekhaya, bese wengeza iwijethi): Namuhla ibonisa usuku nalokho usuku olunakho, Isehlakalo esilandelayo isehlakalo esilandelayo, I-ajenda izinsuku ezilandelayo, Inyanga inyanga enechashazi ngaphansi kwezinsuku ezinezehlakalo, kanti Izinsuku zokuzalwa zibonisa izinsuku zokuzalwa ezilandelayo. Ukuthinta isehlakalo kuyasivula, ukuthinta usuku lwenyanga kuvula lolo suku. Isikrini sokulala singabonisa i-ajenda yanamuhla: khetha Ikhalenda ngaphansi kwe-Isikrini sokulala ezilungiselelweni."
