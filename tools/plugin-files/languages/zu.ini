weather.plugin.name = Isimo sezulu
weather.plugin.description = Isimo sezulu manje nezinsuku ezilandelayo njengamawijethi, kusuka ku-Open-Meteo.
weather.plugin.how = "Isimo sezulu sibonisa isimo sezulu manje nezinsuku ezilandelayo njengamawijethi esikrini sasekhaya, kusuka ku-Open-Meteo, engadingi i-akhawunti noma isikhiye. Isimo sezulu manje sibonisa izinga lokushisa, isimo nokunye okungakhethwa; Isibikezelo sibonisa izinsuku ezilandelayo emgqeni noma ohlwini.\n\nKuqala khetha indawo: ezilungiselelweni, ngaphansi kwe-Isimo sezulu, Indawo (thayipha igama, bese ulikhetha ezindaweni ezitholiwe). Ngamakhodinethi ayo kuphela athunyelwayo, futhi kuphela ngenkathi iwijethi yesimo sezulu ibonisiwe. Engeza amawijethi ngokuhlela isikrini sasekhaya.\n\nIsimo sezulu silandwa kangaka okuningi njengoba Buyekeza okungenani njalo kusho, futhi kuphela ngenkathi kunenethiwekhi: asilokothi sivule i-Wi-Fi sodwa.\n\nIdatha yesimo sezulu ivela ku-Open-Meteo.com (https://open-meteo.com), ngaphansi kwelayisense ye-Creative Commons Attribution 4.0 (CC BY 4.0)."
