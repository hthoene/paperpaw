format-docx.plugin.name = Amadokhumenti e-DOCX
format-docx.plugin.description = Ivula amafayela e-.docx, njengoba egciniwe yi-Word nezinye izinhlelo.
format-docx.plugin.how = "Ivula amadokhumenti e-.docx njengezincwadi: izihloko nethebula lokuqukethwe, uhlu, amatafula, okugqamile nokuncikile, izixhumanisi nezithombe (JPEG, PNG, GIF).\n\nZibeke amafayela efolda yomtapo bese uwavula emtapweni. Isihloko nombhali kuvela ezindlalweni zedokhumenti. Amanothi angezansi, izihloko nezansi, nezimpendulo azibonisiwe."
format-docx.title = Idokhumenti ye-DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Ivula izincwadi ze-EPUB ngezitayela zazo, ithebula lokuqukethwe nezithombe.
format-epub.plugin.how = "Izincwadi ze-EPUB zivulwa emtapweni njengakunoma iyiphi enye incwadi, ngethebula lazo lokuqukethwe, izithombe nesitayela somshicileli. Amakhasi ewebhu (HTML), i-Markdown, i-FictionBook (.fb2) neziqondiso zezincwadi zamahlaya (.cbz) zivulwa ngendlela efanayo, ngayinye njengesengezo saso.\n\nUsahluko luguqulwa ngesikhathi sokuqala uluvula futhi lugcinwe kukheshi yesengezo, ngakho luyashesha ngemva kwalokho futhi izincwadi ezinkulu zisebenza emadivayisini amancane. Thola ithebula lokuqukethwe ngaphansi kwe-Okuqukethwe kumenyu yokufunda. Ukuthi isitayela sencwadi uqobo siyasebenza yini kuyisilungiselelo se-Ukufomethwa komshicileli, ngaphansi kwe-Ukufunda."
format-epub.title = Incwadi ye-EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Ivula izincwadi ze-FictionBook (.fb2, nazo zingu-zip).
format-fb2.plugin.how = "Ivula izincwadi ze-FictionBook (.fb2), ezijwayelekile ezincwadini zesi-Russian nezinye, nazo zingu-zip (.fb2.zip), ngesihloko sazo, ababhali, ikhava nezahluko.\n\nZibeke efolda yomtapo; zibonakala emtapweni futhi zivulwa njengakunoma iyiphi enye incwadi."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Ivula amakhasi ewebhu agcinwe njengamafayela, ibonisa kuphela okufanele kufundwe.
format-html.plugin.how = "Ivula amakhasi ewebhu agcinwe njengamafayela (.html, .htm, .xhtml) njengezincwadi: kuphela okukhona ukuthi kufundwe, ngaphandle kwamamenyu, izikhangiso nokunjalo okuzungezile.\n\nBeka ifayela efolda yomtapo bese uyivula emtapweni njengakunoma iyiphi incwadi. Izixhumanisi ezikhasini ziyasebenza; izithombe zibonakala lapho zikhona efayeleni."
format-html.title = Ikhasi lewebhu (HTML)
format-images.plugin.name = Izithombe
format-images.plugin.description = Ivula izithombe (.jpg, .png, .gif) njengezincwadi, ikhasi ngalinye.
format-images.plugin.how = "Izithombe (.jpg, .png, .gif) zivulwa emtapweni njengezincwadi, isithombe esisodwa ekhasini, silingana nesikrini.\n\nUkufunda ifolda yonke yezithombe, vula isithombe sayo sokuqala: izithombe ezilandela efolda ziyalandela, ngokulandelana kwamagama azo (2 ngaphambi kwa-10). Isithombe esikude efolda siqala lapho; indawo ngayinye iyakhunjulwa ngokuhlukile. Ifolda eyizithombe ezifika kuma-300 ifundwa kusukela kulesi ovula.\n\nIfayela elingeyona isithombe, noma elikhulu kakhulu, libonisa igama lalo esikhundleni. Kwincwadi yezithombe eziningi enesihloko sayo, iziqondiso zezincwadi zamahlaya (.cbz) yinkambo engcono."
format-images.title = Isithombe
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Ivula amafayela e-Markdown (.md), isb. amanothi.
format-markdown.plugin.how = "Ivula amafayela e-Markdown (.md), afana namanothi, njengezincwadi: izihloko, uhlu, izicaphuno nokugcizelela njengoba kuhlosiwe, hhayi njengezimpawu.\n\nBeka amafayela efolda yomtapo bese uwavula emtapweni. Isihloko sokuqala siyisihloko sayo; izithombe eduze kwefayela zibonakala lapho umbhalo uzibiza khona."
format-markdown.title = Markdown
format-mobi.plugin.name = Izincwadi ze-MOBI
format-mobi.plugin.description = Ivula amafayela e-.mobi ne-.azw angenayo i-DRM.
format-mobi.plugin.how = "Izincwadi ze-MOBI (.mobi, .azw) zivulwa emtapweni njengakunoma iyiphi incwadi, ngaphandle kokusetha lutho. Isihloko, ababhali, ulimi nekhava kuvela encwadini, futhi uhlu lokuqukethwe lwakhiwa ngezihloko zayo.\n\nIncwadi iguqulwa ngesikhathi sokuqala uyivula, okuthatha imizuzwana embalwa kweyinde; ngemva kwalokho ivuleka ngokushesha. Umbhalo, izihloko, okugqamile nokuncikile, izixhumanisi nezithombe kuyabonisiwe.\n\nIzincwadi ezine-DRM (eziningi ezithengwe esitolo) azikwazi ukuvulwa, futhi nezincwadi ezinokucindezelwa kwe-Huffman noma ngohlobo olusha lwe-KF8 (.azw3): i-PaperPaw ikusho uma uzivula. Ikhophi ye-EPUB, eyenziwe ngethuluzi elifana ne-Calibre, ihlala ivuleka."
format-mobi.title = Izincwadi ze-MOBI
format-rtf.plugin.name = Amadokhumenti e-RTF
format-rtf.plugin.description = Ivula amafayela e-.rtf njengezincwadi.
format-rtf.title = Amadokhumenti e-RTF
format-txt.plugin.name = Umbhalo olula
format-txt.plugin.description = Ivula amafayela ombhalo olula (.txt).
format-txt.plugin.how = "Amafayela ombhalo olula (.txt) avulwa emtapweni njengakunoma iyiphi incwadi, ngaphandle kokusetha lutho. Isengezo sifunda umbhalo we-UTF-8, UTF-16 ne-Windows-1252 futhi sizithole yodwa izinhlamvu.\n\nAmaphuzu alandela imigqa engenalutho efayeleni; uma ifayela lingenayo, umugqa ngamunye uyiphuzu. Kumafayela e-Project Gutenberg umbhalo welayisense ekuqaleni nasekugcineni ushiywa ngaphandle, futhi isihloko nombhali kuthathwa kuhlokwana.\n\nIfayela alilayishwa lonke, ngakho imibhalo emikhulu kakhulu ivuleka namadivayisini amancane."
format-txt.title = Umbhalo olula
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Ivula izincwadi ze-XTC ne-XTCH, amakhasi adwetshwe kusengaphambili ezifundi ze-Xteink.
format-xtc.plugin.how = "Amafayela e-XTC ne-XTCH yizincwadi okudwetshwe amakhasi azo njengezithombe, njengoba enziwa abaguquli bezifundi ze-Xteink. Zivulwa emtapweni njengakunoma iyiphi incwadi.\n\nNgenxa yokuthi ikhasi ngalinye lisithombe esimiswe, umbhalo awukwazi ukushintshwa usayizi noma usethwe ngenye ifonti. Amakhasi amnyama namhlophe noma anamazinga amane empunga. Ikhasi ngalinye lihlolwa lapho libonisiwe, ngakho kudingeka inkumbulo encane, nakuyo i-X4.\n\nIsihloko, umbhali nezahluko kuthathwa efayeleni uma linakho."
format-xtc.title = Amakhasi e-XTC
help.plugin.name = Izeluleko
help.plugin.description = Ibonisa ukuthi izilawuli zesikrini zenzani, ngesikhathi sokuqala sivuleka.
help.plugin.how = "Ngesikhathi sokuqala isikrini sivuleka, inothi elifushane phezu kwaso lisho ukuthi izilawuli zaso zenzani: izingxenye zesikrini lapho ukuthinta kuya khona, zinohlaka, nalokho izinkinobho ezikwenzayo.\n\nUkuthinta noma iyiphi inkinobho kuyalivala inothi, futhi alibuyi kuleso sikrini. Azisekho izeluleko ziyazivala zonke.\n\nEzilungiselelweni, ngaphansi kwe-Isistimu, Izeluleko ziyazivula noma ziyazivala, futhi Bonisa izeluleko futhi inikeza isikrini ngasinye inothi laso kanye futhi."
