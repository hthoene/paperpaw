mail.plugin.name = Imeyili
mail.plugin.description = Ifunda futhi ithumele i-imeyili ngephasiwedi noma iphasiwedi yohlelo (IMAP ne-SMTP), ngaphandle kokungena kusiphequluli.
mail.plugin.how = "Imeyili ifunda futhi ithumele i-imeyili nge-IMAP ne-SMTP. Isayina ngekheli lakho nephasiwedi, ngaphandle kokungena kusiphequluli, ngakho isebenza nanoma yimuphi umhlinzeki ovumela lokho.\n\nSetha i-akhawunti ngaphansi kwe-Izilungiselelo, Imeyili. Khetha umhlinzeki wakho, thayipha ikheli lakho nephasiwedi. Abahlinzeki abaningi bafuna iphasiwedi yohlelo: yenze ezilungiselelweni zokuphepha ze-akhawunti yakho bese uyisebenzisa lapha. Iphasiwedi yakho ejwayelekile ngokuvamile ayisebenzi, futhi ayiyindawo ngaphandle kweseva yomhlinzeki wakho. Igcinwa namaphasiwedi nezikhiye.\n\nVula Imeyili emathuluzini. Hlola i-imeyili ilanda ama-imeyili akamuva nezifolda. Ama-imeyili agcinwa ekhadini, ngakho ungawafunda ngaphandle kwenethiwekhi. Idivayisi iyaxhuma, ilande bese iyanqamula, ngakho i-Wi-Fi ivuliwe isikhashana nje.\n\nUma umhlinzeki wakho engekho ohlwini, khetha Amaseva akho bese usetha amagama eseva, izimbobo nokuphepha ngaphansi kwezilungiselelo ezithuthukile. Iseva engenasitifiketi esiqinisekiswa yiziphathimandla ibuza kanye ukuthi iyathenjwa yini; qhathanisa isigxivizo somunwe nalokho umhlinzeki wakho akubonisa.\n\nI-imeyili enencwadi enamathiselwe (EPUB, PDF nokunjalo, kuze kube ngu-2 MB) inayo Vula incwadi ngezansi kwayo: ilanda ifayela, iyibeke emtapweni wakho bese iyivula.\n\nUkubona i-imeyili entsha ngaphandle kokuvula Imeyili, vula Hlola i-imeyili entsha ngasemuva ngaphansi kwe-Izilungiselelo, Imeyili, bese ukhetha ukuthi kangaki (njalo ngemizuzu eyi-15, 30 noma 60). Ivaliwe uze uyivule. Isifundi bese siyaxhuma ngezikhathi ezithile ngoxhumano oluphephile ngenkathi sivuliwe futhi sikuku-inthanethi, i-akhawunti eyodwa emva kwenye, futhi sibuyekeza inani elingafundiwe ku-Ekhaya. Sisebenzisa ibhethri elithile. Ukuvula Imeyili kumisa ukuhlola okuqhubekayo.\n\nAmawijethi esikrini sasekhaya abonisa inani elingafundiwe, ama-imeyili amasha nawo anenkanyezi, ibhokisi elilodwa leposi, nesinqamuleli sokubhala i-imeyili."
