fonts-browser.plugin.name = Amafonti engeziwe
fonts-browser.plugin.description = Ibonisa amafonti avela ku-inthanethi, ngalinye lanesampula, futhi iwalanda ukuze ufunde ngawo.
fonts-browser.plugin.how = "Amafonti engeziwe adwebe amafonti avela emtapweni wamafonti ku-inthanethi, igama ngalinye lisethwe ngefonti yalo, futhi alanda lawo ofuna ukufunda ngawo.\n\nUyitholela ekugcineni kohlu lwamafonti lapho ifonti yokufunda ikhethwa khona, ku-Izilungiselelo, ngaphansi kwe-Ukufunda, njenge-Ifonti; imigqa yesimo inalowo mbhalo ofanayo wefonti yayo. Thinta ifonti (ngezinkinobho, cindezela Khetha) ukuze uyibone inkulu nomusho wesampula, bese ukhetha Landa. Ungashiya ikhasi ngenkathi ilanda. Uma kuphelile, khetha Funda nge-(igama lefonti), noma Sebenzisa emigqeni yesimo. Buyekeza ilanda inguqulo entsha, Susa icisha ifonti kudivayisi.\n\nIdinga i-Wi-Fi.\n\nAMAFONTI AKHO\n\neduze kwe-Amafonti engeziwe, uhlu olufanayo lunalo Amafonti akho, abonisa le ngxenye yosizo. Ifonti yakho iyifayela le-.ttf noma le-.otf, isibonelo elivela ku-Google Fonts.\n\nKu-Android nakwamanye amadivayisi adweba amafayela efonti: kopishela ifayela efolda yamafonti (ku-Android: PaperPaw/fonts esikhaleni esabelwane), qala kabusha i-PaperPaw bese ukhetha ifonti ku-Izilungiselelo, ngaphansi kwe-Ukufunda, njenge-Ifonti.\n\nKu-Xteink X4 ne-X4 Pro: lezi zifundi zifunda amaphakethe amafonti, hhayi amafayela efonti, ngoba amafayela efonti ngeke ahambisane nenkumbulo yazo. Yenza iphakethe ekhompyutheni nge-paperpaw-fontgen, ngesitayela ngasinye onaso (esejwayelekile siyadingeka):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nLokhu kwenza ifolda plugins/font-my-font. Yikopishele efolda yezengezo ekhadini lenkumbulo, qala kabusha, bese ukhetha My Font njenge-Ifonti. Iphakethe lesitayela esisodwa lingaba uhhafu wamegabhayithi ezinhlamvwini zesi-Latin; izitayela ozishiyayo zidwetshwa ngesejwayelekile. Ithuluzi lithi zingaki izinhlamvu ozicelayo ifonti onazo (--chars latin,cyrillic,greek yengeza izikripthi): ifonti engenazo izinhlamvu zencwadi yakho ayikwazi ukuzibonisa, ngakho funa eyodwa ethwala isikripthi sayo.\n\nAmafonti avela ku-Amafonti engeziwe asebenza ngendlela efanayo futhi awadingi ikhompyutha.\n\nUkuze umbhalo omncane ucace kakhulu epanelini le-e-ink, engeza --hinting light kumyalo: ulinganisa izinhlamvu egridini yamapikseli, njengoba amafonti ajwayelekile enziwa. Ngaphandle kwalokho izinhlamvu zidwetshwa njengoba umklami wefonti azidwebile; --hinting normal ne---hinting mono zizilinganisa ngokuqinile. Amafonti anezimpawu, njenge-Arabic noma i-Devanagari, kungcono ashiywe ngaphandle."
