widgets.plugin.name = Iphakethe lamawijethi
widgets.plugin.description = Amawijethi amaningi kakhulu esikrini sasekhaya: amawashi, ikhalenda, izicaphuno, izincwadi, amanothi nokunye.
widgets.plugin.how = "Iphakethe lamawijethi lengeza amawijethi amaningi esikrini sasekhaya: amawashi (e-analogue, amagama, amathayela, omhlaba), ikhalenda, unyaka kuze kube manje, isibali sokubala emuva, isigaba senyanga, nosuku nedethi; isicaphuno sosuku, amanothi, imisebenzi, izithombe, isibingelelo nelogo ye-PaperPaw; futhi ezincwadini, okufundwayo manje, inqubekelaphambili, okulandelayo, uchungechunge, izintandokazi, okugqamisiwe nomtapo ngezinombolo. Iwijethi yebhethri nayo isemo.\n\nZengeze nge-Hlela isikrini sasekhaya kumenyu (noma ukucindezela isikhathi eside esikrinini sasekhaya), bese Engeza iwijethi. Ngayinye inezilungiselelo zayo, ezifana nohlaka, usayizi nokuqondanisa. Ukukhetha iwijethi eshintshayo, njengesicaphuno sosuku, kubonisa elandelayo. Izicaphuno zakho zingena ku-quotes.txt ku-.paperpaw/plugins/widgets ekhadini, umugqa ngamunye njengombhalo | umbhali. Amawijethi esikhathi adinga iwashi lisethiwe; i-Wi-Fi iyalisetha."
