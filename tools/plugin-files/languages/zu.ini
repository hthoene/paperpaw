stats.plugin.name = Izibalo zokufunda
stats.plugin.description = Irekhoda ukuthi ufunda isikhathi esingakanani nokuthi kangakanani, ngekhalenda nezinombolo zencwadi ngayinye.
stats.plugin.how = "Izibalo zokufunda zirekhoda ukuthi ufunda ikhasi ngalinye isikhathi esingakanani. Uzibona njengokubuka konke nanamuhla, iviki nochungechunge lwakho, njengekhalenda, nangezinombolo zencwadi ngayinye.\n\nZivule kuma-Amathuluzi, noma ku-Okuningi esifundini. Ezilungiselelweni, ngaphansi kwe-Izibalo zokufunda, ungavala Rekhoda ukufunda, usethe Inhloso yansuku zonke, futhi usethe Ikhasi elifushane kunawo wonke nelide kunawo wonke elibalwayo, ukuze ukuphenya noma incwadi esele ivuliwe kungaphambukisi izinombolo.\n\nVumelanisa ne-KOReader yabelana ngezibalo ne-KOReader ngefolda ye-WebDAV. Ithatha nezibalo ze-KOReader kudivayisi efanayo. Ukurekhoda kudinga iwashi lisethiwe: lapho lingekho, xhuma ku-Wi-Fi kanye."
