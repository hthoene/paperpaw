profiles.plugin.name = Amaphrofayili okufunda
profiles.plugin.description = Amasethi aqanjwe amagama ezilungiselelo zokufunda nokubonisa, ashintshwa ngokuthinta.
profiles.plugin.how = "Iphrofayili igcina izilungiselelo zakho zokufunda, ezokubonisa nemigqa yesimo ngaphansi kwegama, elifana no-Ubusuku noma Ukuphrinta okukhulu, futhi izibuyisa ngokuthinta.\n\nVula Amaphrofayili kumenyu yokufunda ngaphansi kwe-Okuningi, noma ku-Izilungiselelo ngaphansi kwe-Enza ngendlela yakho. Thinta iphrofayili ukuyisebenzisa; leyo esetshenziswayo imakiwe. Yibambe (ngezinkinobho, bamba Khetha) ukuze ugcine izilungiselelo zamanje kuyo, uyiqambe kabusha noma uyisuse. Gcina njengephrofayili entsha igcina okusethiwe manje.\n\nIphrofayili elandelayo ishintshela kweyilandelayo ohlwini; yibeke enkinobheni noma emthethweni."
