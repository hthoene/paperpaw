koreader.plugin.name = Ukwabelana ngokugqamisiwe
koreader.plugin.description = Yabelana ngamabhukhimakhi nokugqamisiwe ne-KOReader ezincwadini ezifundwa kokubili.
koreader.plugin.how = "Lesi sengezo sabelana ngamabhukhimakhi nokugqamisiwe ne-KOReader ezincwadini ozifunda kokubili, kudivayisi eyodwa noma efolda yomtapo evumelaniswe phakathi kwamadivayisi. Akukho okufanele kusethwe.\n\nUma i-PaperPaw ivula incwadi ne-KOReader ibivule, futhi uma ushintsha amabhukhimakhi noma okugqamisiwe kwayo, ithatha okusha kudatha ye-KOReader eduze kwencwadi futhi ishiye okusha lapha ukuze i-KOReader ikuthathe ngesikhathi esilandelayo ivula incwadi. Izimpawu ezisusiwe namanothi ashintshiwe nawo ayadlula.\n\nLokhu kusebenza ezincwadini ze-EPUB kuphela. Uma ifayela lohlangothi olulodwa lingafundeki, akukho okushintshayo kolunye lwezinhlangothi uze ukwazi."
