vocabulary.setting.sd-folder.help = Ekhadini le-SD: ifayela le-CSV, TSV noma le-Anki kuyo liyidekhi.
vocabulary.sd.readme = "Amakhadi okufunda avela kumafayela\n\nBeka ifayela lidekhi ngalinye lapha: i-Spanish.tsv yenza idekhi i-Spanish.\nAmafayela: .tsv, .csv noma .txt, agcinwe njenge-UTF-8, noma .apkg: idekhi le-Anki, elithunyelwe nge-Support older Anki versions ihlolwe. Izinkambu zalo ezintathu zokuqala zamanothi ziba ngaphambili, emuva nesibonelo; ukuhlela kwalo nemidiya akufundwa, futhi i-PaperPaw ayilokothi ibhale ifayela le-Anki.\n\nIkhadi elilodwa emgqeni ngamunye: ngaphambili, emuva nesibonelo (okungakhethwa), kuhlukaniswe ngethebhu, ikhefana noma ikholoni elincane. Umugqa wokuqala ungaqamba amakholomu: ngaphambili, emuva, isibonelo. Isibonelo:\n\nKatze\tikati\tDie Katze schläft.\n\nBese uvula Amakhadi okufunda esifundini, ukhetha Amakhadi ekhadini le-SD bese Buyekeza amadekhi kusuka ekhadini.\n\nOkuhle ukukwazi:\n- Amadekhi ahlala esifundini, nalokho owakufunde. Ifayela lifundwa uma lisha noma lishintshiwe, futhi amakhadi alo engezwa kudekhi noma ashintshwe lapho.\n- Shintsha emuva noma isibonelo sekhadi efayeleni: ikhadi lishintsha futhi ligcina inqubekelaphambili yakho.\n- Shintsha umbhalo wangaphambili wekhadi: ubalwa njengekhadi elisha, futhi elidala liqala kabusha. Amakhadi ahambisana ngombhalo wawo wangaphambili, izikhala nezinhlamvu ezinkulu azibalwa. Gcina idekhi efayeleni (Amakhadi ekhadini le-SD, Gcina idekhi ekhadini) futhi ikhadi ngalinye linenombolo ekholomini le-id: shintsha ngaphambili lapho, gcina imigqa emibili yokuqala yefayela injalo, futhi ikhadi ligcina lokho owakufunde.\n- Ukugcina kubhala amakhadi edekhi. Lokho okwakusefayeleni futhi kungeyona ikhadi (umugqa ongenaphambili) akugcinwa; ifayela elalikhona likopishelwa ku-_name.bak.tsv.\n- Gcina ifayela njenge-CSV UTF-8 (hhayi i-UTF-16, hhayi ifomethi ye-spreadsheet uqobo). Ifayela elingaphezu kwe-4 MiB noma imigqa engu-20,000 alifundwa: lihlukanise.\n- Umugqa ocisha efayeleni awucishi ikhadi edekhini, ngaphandle kokuba uvule Susa amakhadi angekho kuleli dekhi. Ikhadi bese lihamba nalokho owakufunde.\n- Amafayela aqala ngamagama ane-_ awafundwa.\n"
