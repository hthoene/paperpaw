notes-overview.plugin.name = Wonke amanothi
notes-overview.plugin.description = Amabhukhimakhi nokugqamisiwe kwazo zonke izincwadi ohlwini olulodwa, nokuthunyelwa njenge-My Clippings.txt.
notes-overview.plugin.how = "Wonke amanothi adwebe wonke incwadi othe kuyo wenza ibhukhimakhi noma wagqamisa, nokuthi mingaki. Vula kuma-Amathuluzi. Khetha incwadi ukuze ubone amanothi ayo, nenothi ukuvula incwadi kuleyo ndawo.\n\nEkugcineni kohlu, Thumela njenge-My Clippings.txt ibhala wonke amanothi efayeleni elilodwa, efolda ethi Exports eduze komtapo, ngefomu i-Kindle eyisebenzisayo (UTF-8). Izinhlelo ezifunda i-My Clippings.txt ye-Kindle ziyakwazi ukuyifunda. Inothi elikokugqamisiwe liyisibalo salo, njengakuKindle. Ngoba incwadi lapha ayinazo izindawo ze-Kindle, \"indawo\" ukuthi inothi lingakanani ngaphakathi encwadini, ngamaphesenti. Ifayela libhalwa futhi ngokuphindelela; lithatha indawo yangaphambilini."
