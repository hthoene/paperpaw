wifi.plugin.name = Wi-Fi
wifi.plugin.description = Ixhuma kumanethiwekhi e-Wi-Fi uma kudingeka bese ivala irediyo ngemva kwalokho.
wifi.plugin.how = "I-Wi-Fi ixhuma kunethiwekhi uma isengezo sidinga i-inthanethi (ikhathalogi, ukuvumelanisa, isitolo, ukudlulisa) bese ivala irediyo futhi ngemva komzuzu kungekho okuyisebenzisayo, noma ngokushesha uma Ekhaya noma incwadi ibonakala, ukuze konge ibhethri nenkumbulo.\n\nVula i-Wi-Fi ezilungiselelweni, noma entweni ye-Wi-Fi emugqeni wesimo. Amanethiwekhi abonisa lawo aseduze; khetha elilodwa bese uthayipha iphasiwedi yalo, noma khetha Setha ngefoni bese uthayipha igama nephasiwedi kusiphequluli sefoni yakho esikhundleni sokuthayipha kudivayisi. Khohlwa isusa inethiwekhi egciniwe.\n\nAmaphasiwedi ahlala ekhadini, egcinwe ngokuphephile, futhi awaphinde aboniswe. Ngaphansi kwe-Xhuma uma kudingeka usetha ukuthi i-Wi-Fi ihlala ivuliwe isikhathi esingakanani ngemva kokusetshenziswa kokugcina, ukuthi ihlala ivuliwe yini ngenkathi ishaja, nokuthi iyiphi inethiwekhi egciniwe eza kuqala uma eziningi ziseduze."
