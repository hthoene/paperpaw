opds.plugin.name = Amakhathalogi e-OPDS
opds.plugin.description = Iphequlula amakhathalogi e-OPDS, ilanda izincwadi zawo futhi igcine amafolda evumelaniswa nawo.
opds.plugin.how = "Amakhathalogi e-OPDS yimitapo ku-inthanethi efana ne-Project Gutenberg, i-Calibre-Web, i-Kavita noma i-Komga. Lesi sengezo siyawaphequlula futhi siyawasesha njengezifolda futhi silande izincwadi zawo emtapweni.\n\nVula Amakhathalogi kumenyu Yamathuluzi bese ukhetha Engeza ikhathalogi: ikheli futhi, uma ikhathalogi idinga i-akhawunti, igama lomsebenzisi nephasiwedi. Thinta ikhathalogi ukuyiphequlula; yibambe (ngezinkinobho, bamba Khetha) ukuyivumelanisa, uyihlele noma uyisuse.\n\nNge-Vumelanisa le khathalogi ivuliwe, Vumelanisa amakhathalogi alanda izincwadi zayo ezintsha efolda yayo. Izincwadi ngokuvumelanisa ngakunye zinciphisa ukuthi zingaki ezilandwa ukuvumelanisa kwakanye, ukuze ikhathalogi enkulu ingagcwalisi idivayisi. Ifolda yefu (WebDAV) isebenza esikhundleni sekhathalogi."
