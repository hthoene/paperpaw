menu.plugin.name = Imenyu
menu.plugin.description = Imenyu ephansi kwesikrini, enezenzo nezilungiselelo.
menu.plugin.how = "Imenyu idwebe lokho ongakwenza nokukusetha. Ivuleka ezansi kwesikrini, ngaphezu kwanoma yini evuliwe: ngenkathi ufunda, thinta maphakathi nesikrini noma ucindezele Khetha. Thinta noma ukhethe isibalo ukuze usisebenzise.\n\nIzilungiselelo kumenyu zibonisa inani lazo futhi zishintsha lapho zikhona, ngakho imenyu ihlala ivuliwe. Isibalo esinezinye izibalo sivula imenyu engaphansi.\n\nSwayipha phansi usuka emphethweni ongaphezulu ukuze ubone ipaneli esheshayo: lokho oshintsha njalo, njengezinkinobho. Thinta inkinobho ukuyishintsha, uyibambe ukuze uthole izilungiselelo zayo. Ngezinkinobho kuphela, izinkinobho zemitshezo ziyakhetha, Khetha uyashintsha futhi Emuva liyavala. Ngaphansi kwe-Ukubukeka, Amamenyu abonisa amamenyu njengohlu noma njengamathayela."
