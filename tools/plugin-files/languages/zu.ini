lock.plugin.name = Ukukhiya isikrini
lock.plugin.description = I-PIN, iphethini noma iphasiwedi lapho idivayisi ivuka; ukuthinta kukhiyiwe ngenkathi ufunda.
lock.plugin.how = "Ukukhiya isikrini kucela i-PIN, iphethini noma iphasiwedi lapho i-PaperPaw iqala nalapho idivayisi ivuka. Ivaliwe ekuqaleni. Ivimbela kuphela ukusetshenziswa okungahlosiwe: ikhodi nenani lemizamo engalungile kugcinwa ekhadini le-SD, ngakho noma ubani okhipha ikhadi, alihlele noma alishintshe udlula ekhiyweni.\n\nLisethe ezilungiselelweni, ngaphansi kwe-Idivayisi, Ukukhiya isikrini: faka ikhodi esetshenziswayo uma ikhona, khetha uhlobo, bese ukhodi entsha kabili. Iphethini inikezwa ezikrinini ezithintwayo kuphela.\n\nNgemva kwemizamo emihlanu engalungile owolandelayo ulinda isigamu somzuzu. Khiya manje likhiya ngokushesha futhi lingabekwa enkinobheni, ekuswayipheni noma kumthetho. Khiya ngemva kokuvuka kungavalwa, ukuze kuphela ukuqala kweqiniso (ukuvula amandla noma ukuqala kabusha) kukhiye, ngaphandle lapho ukuvuka ngakunye kuyisiqalo, njengakuX4 ebhethrini.\n\nUkukhiya ukuthinta, eduze kwalo: Khiya ukuthinta epaneleni elishesha nasemenyu yokufunda kwenza ukuthinta, ukuswayipha nepeni akwenzi lutho kuyilapho izinkinobho zisasebenza, isb. ukufunda unesandla esikrinini. Ukuze uvule, thinta kabili ngomunwe owodwa ubuthathe isikhashana; ukubamba inkinobho yamandla kuvula imenyu Yamandla, lapho Vula ukuthinta kukwenza ngezinkinobho; ku-X4 Pro, ukubamba isikhiye sasekhaya kuvula ngokushesha."
