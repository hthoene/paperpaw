files.plugin.name = Isiphequluli samafayela
files.plugin.description = Sidwebe izincwadi nezifolda kudivayisi futhi sizivule.
files.plugin.how = "Umtapo udwebe izincwadi esifolda somtapo wakho, nganye nekhava yayo, isihloko, umbhali nokuthi usifunde kangakanani. Incwadi owayifunda kokugcina ime phezulu njengekhadi, ngakho ukuqhubeka nokufunda kuthatha ukuthinta okukodwa, noma ukucindezela Khetha kanye. Ngenkathi umtapo ufuna izincwadi, uthi zingaki ezitholile kuze kube manje.\n\nKhetha lokho okubonisiwe ngaphezu kwezincwadi: zonke, lezo ozifundayo, ezingafundiwe noma eziqediwe, noma amashalofu (ngombhali, uchungechunge, ithegi, izintandokazi, incwadi elandelayo yochungechunge ngalunye oluqalile). Thinta incwadi ukuyifunda; yibambe (ngezinkinobho, bamba Khetha) ukuyivula, uyimake iqediwe noma ingafundiwe, ubone ulwazi lwayo, uyihambisele kugcino noma uyicishe. Thinta isihloko ukuze ubone imenyu yomtapo: ukuthi izincwadi ziqoqiwe futhi zibonisiwe kanjani, ukusesha, ifolda yomtapo nezilungiselelo.\n\nIfolda yomtapo isethwa ku-Izilungiselelo, ngaphansi kwe-Umtapo, njenge-Ifolda yomtapo; lapho ungabonisa nezincwadi njengegridi yezikhava. Kunoma yiliphi elinye ifayela, sebenzisa Amafayela kumenyu Yamathuluzi."
