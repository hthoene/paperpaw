picture-home.plugin.name = Isikrini sasekhaya esinesithombe
picture-home.plugin.description = Isikrini sasekhaya esinesithombe sakho ngemuva kwamawijethi, nebha yesimo oyisethayo.
picture-home.plugin.how = "Isikrini sasekhaya esinesithombe sithatha isikhundla sesikrini sasekhaya ngenkathi sivuliwe: isithombe sakho ngemuva kwamawijethi, namakhasi amawijethi namathuluzi owahlelayo. Sivale kumphathi wezengezo bese isikrini sasekhaya esakhelwe ngaphakathi sibuya, namakhasi aso.\n\nBeka izithombe (JPEG, PNG noma GIF) efolda ekhadini (wallpapers ngokuzenzakalelayo), bese ukhetha eyodwa ku-Izilungiselelo, Enza ngendlela yakho, Isikrini sasekhaya esinesithombe. Linganisa kusho ukuthi sigcwalisa kanjani isikrini (gcwalisa, lonke isithombe, nweba, usayizi wokuqala, thayela), Indawo ukuthi iyiphi ingxenye ehlala, Sondeza ukuthi sikhulu kangakanani, futhi Khanyisa isithombe ukuthi sinsundu kangakanani: isithombe esimpofu senza amawijethi alula ukufundeka. Isithombe silungiswa kanye usayizi wesikrini ngamunye, okuthatha isikhashana.\n\nAmawijethi ahlala ezipuleni ngaphezu kwesithombe. Hlela ikhasi njengakusikrini sasekhaya esakhelwe ngaphakathi: ipensela ngezansi kwekhasi, noma Hlela isikrini sasekhaya kumenyu.\n\nIbha yesimo (isikhathi, i-Wi-Fi, ibhethri, noma lokho okukhethayo) ingavuliwe, ivaliwe noma izenzakalele, ngaphezulu noma ngezansi, ububanzi obuphelele noma ipilisi elincane kwesobunxele, maphakathi noma kwesokudla, epuleni elikhanyayo, elimnyama noma elimpunga noma esithombeni uqobo. Umugqa oqamba izinkinobho (ku-X4) nawo ungavuliwe, uvaliwe noma uzenzakalele. Okuzenzakalelayo kusho ukuthi ukucindezela inkinobho kuzibonisa imizuzwana ethile; lokho kucindezela akwenzi okunye.\n\nUkudweba isithombe kusho ukuthi isithombe sidwetshwa kanjani: Amazinga empunga kuyo yonke impunga isikrini esinayo (kancane ku-X4), Okunamachashazi emnyama nemhlophe (ngokushesha), noma Okuzenzakalelayo, njengesikrini sasekhaya esakhelwe ngaphakathi: amazinga empunga lapho isikrini sidwetshwa, amachashazi ngemva kokushintsha kokuqala. Lapho isikrini singenawo amazinga empunga, amazinga empunga abuyela kumachashazi."
