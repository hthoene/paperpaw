sleep.plugin.description = Sibonisa ikati elilele, ikhava yencwadi, izithombe zakho noma umlayezo ngenkathi idivayisi ilele.
sleep.plugin.how = "Isikrini sokulala sinquma ukuthi isikrini sibonisani ngenkathi idivayisi ilele. I-e-ink igcina isithombe ngaphandle kwamandla.\n\nSikhethe ezilungiselelweni, ngaphansi kwe-Idivayisi, Isikrini sokulala, nge-Bonisa: ikati elilele (okuzenzakalelayo), ikhava yencwadi, izithombe zami, ilogo ne-“Kulele”, amawijethi, ikhasi njengoba linjalo, noma ikhasi elinesithombe. Izithombe zami zibonisa amafayela efolda yezithombe eyodwa emva kwenye.\n\nNgaphandle kwekhava noma isithombe ikati liyabonisa. Lapho isistimu uqobo idweba isikrini sokulala, lezi zilungiselelo ziyafihlwa.\n\nIsikrini esivaliwe, Bonisa uma kuvaliwe, sidwetshwa kanye njengoba idivayisi ivalwa, kumenyu yamandla noma ngemva kwesikhathi sika-Vala ngemva kokulala (hhayi uma ibhethri eliphansi linqamula amandla). Siwesikrini sokulala ngaphandle kokuba ukhethe ilogo ne-“Kuvaliwe”, ikati, ikhava noma izithombe zami. Elinye isengezo lingaluletha isikrini salo.\n\nIsikrini sokuqala nesokuqala kabusha, Bonisa uma kuqala ne-Bonisa uma kuqala kabusha, siyeso sedivayisi ngaphandle kokuba elinye isengezo linikeze isikrini salo. Izengezo aziqali ukusebenza ngenkathi idivayisi iqala: isikrini esikhethelwe ukuqala sidwetshwa kusengaphambili, njengoba idivayisi ivalwa noma iqala kabusha, futhi sibonisiwe ekuqaleni okulandelayo. Isikrini esingalungile ngesikhathi, noma isithombe esonakele, sinikeza indlela esesedivayisi; idivayisi iyavala noma iqala kabusha noma kunjalo."
