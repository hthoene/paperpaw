translate.plugin.description = Ihumusha umbhalo okhethiwe ku-inthanethi, nge-DeepL.
translate.plugin.how = "Ukuhumusha kuhumusha umbhalo okhethiwe ku-inthanethi nge-DeepL. Khetha umbhalo encwadini bese ukhetha Humusha kumenyu yombhalo okhethiwe: ukuhumusha kubonakala phezu kwekhasi njengesiqeshana sesichazamazwi. Izinkinobho zekhasi noma ukuthinta kuyakudonsa, futhi Khetha noma ukuthinta ekugcineni kwakho kuyakuvala.\n\nKudinga inethiwekhi nesikhiye se-DeepL API sakho, samahhala ku-deepl.com (DeepL API Free, cishe izinhlamvu ezingu-500,000 ngenyanga). Uze usifake, ipaneli lisho kanjalo, futhi ukuthinta kucela.\n\nEzilungiselelweni, ngaphansi kwe-Ukufunda, esigabeni se-Ukuhumusha, Humusha uye ku-setha ulimi; ekuqaleni kungolwe-PaperPaw uqobo."
