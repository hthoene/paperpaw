anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Ifunda amakhadi e-Anki asedlulile ekhompyutheni yakho futhi ithumele izimpendulo zakho emuva, ngesengezo se-AnkiConnect.
anki.plugin.how = "I-Anki ikuvumela ukuthi ufunde esifundini amakhadi asedlulile ku-Anki ekhompyutheni yakho, bese ithumela izimpendulo zakho emuva. Isebenzisa isengezo samahhala i-AnkiConnect (ikhodi yesengezo 2055492159) futhi ayisebenzisi i-AnkiWeb. Ivaliwe ekuqaleni: yengeze esitolo Sezengezo.\n\nEkhompyutheni: faka i-AnkiConnect ku-Anki (Tools, Add-ons, Get Add-ons) bese uqala kabusha i-Anki. I-Anki kufanele ivuliwe ngenkathi uvumelanisa.\n\nNgokuzenzakalelayo i-AnkiConnect iphendula kuphela ikhompyutha esebenza kuyo (127.0.0.1), ngakho isifundi asikwazi ukuyifinyelela. Vula Tools, Add-ons, AnkiConnect, Config bese usetha \"webBindAddress\" ibe \"0.0.0.0\" (lalela kunethiwekhi yasekhaya). Imbobo, \"webBindPort\", ingu-8765 ngaphandle kokuba uyishintshe. Uma usetha \"apiKey\" lapho, faka isikhiye esifanayo lapha. Qala kabusha i-Anki ngemva kokushintsha ukuhlela, bese uvumela i-Anki ku-firewall yekhompyutha uma ibuza. Lokhu sebenzisa kuphela kunethiwekhi oyethembayo: noma ubani kuyo angafinyelela i-AnkiConnect, ngakho isikhiye siyisinqumo esihle.\n\nEsifundini: vula i-Anki kokuthi Amathuluzi, bese ufaka ikheli lekhompyutha (isibonelo 192.168.1.20) ngaphansi kwe-Ikhompyutha, imbobo uma ingeyona u-8765, nesikhiye se-API uma usisethile. Khetha Idekhi, noma uyishiye ingenalutho kuwo wonke amadekhi. Bese ukhetha Vumelanisa ne-Anki, nge-Wi-Fi evuliwe: izimpendulo zakho ezilindile zithunyelwa kuqala, bese kulandwa amakhadi asedlulile (nenani lamakhadi amasha owasethile), kuze kube ngu-50. Khetha Funda ukuwadlula, ngaphandle kwenethiwekhi: bonisa impendulo uyinikeze izinga elithi Futhi, Kunzima, Kuhle noma Kulula. Izimpendulo zakho zigcinwa esifundini, nangaphandle kwe-Wi-Fi, bese ziya ku-Anki ngokuvumelanisa okulandelayo. I-Anki inquma ukuthi ikhadi libuya nini: ikhadi owaphendula ngokuthi Futhi lilandwa futhi ngokuvumelanisa okulandelayo uma i-Anki isithi lisedlulile.\n\nVumelanisa uma i-Anki ivuleka, ezilungiselelweni, ivumelanisa njalo uma uvula isikrini. Akukho okusebenzisa inethiwekhi uma ucindezela isikhiye."
