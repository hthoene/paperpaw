tasks.plugin.name = Imisebenzi
tasks.plugin.description = Uhlu lwemisebenzi enezinsuku zokuphela nezinto ezibalulekile, esifundini noma evumelanisiwe neseva yakho ye-CalDAV, namawijethi esikrini sasekhaya.
tasks.plugin.how = "Uhlu lwemisebenzi esifundini sakho: imisebenzi enosuku lokuphela nokubaluleka, ehlolwe uma yenziwe. Isebenza ngaphandle kokusetha nenethiwekhi, futhi ingagcinwa ihambisana neseva ye-CalDAV (Nextcloud, Radicale, Baïkal, Fastmail nabanye), ukuze izinhlu ezifanayo zibe sefonini yakho nasekhompyutheni.\n\nVula Imisebenzi kumenyu yamathuluzi. Umugqa wokuqala uqamba uhlu olubonisiwe; ukhethe uhlu olunye, Namuhla nezedlulile kuzo zonke izinhlu, uhlu olusha, ukuvumelanisa, noma ukusetha i-akhawunti. Engeza umsebenzi uvula ikhibhodi. Khetha emsebenzini uyawuhlola (futhi: awenziwanga). Bamba umsebenzi noma ucindezele Imenyu ukushintsha isihloko sawo, usuku lokuphela (namuhla, kusasa, ngeviki, noma usuku olulithayipha olufana no-2026-12-24) noma ukubaluleka kwawo, noma ukuwususa. Imisebenzi evulekile ihamba kuqala, ngosuku lwayo bese ngokubaluleka; eyenziwe ihlala ekugcineni iviki (kusethwa ngaphansi kwe-Imisebenzi ezilungiselelweni), bese ishiya isifundi.\n\nAmawijethi esikrini sasekhaya (bamba isikrini sasekhaya, bese wengeza iwijethi): Imisebenzi yanamuhla ibonisa okufanele kwenziwe namuhla noma okwedlule, Uhlu lwemisebenzi lubonisa uhlu olulodwa, Imisebenzi evulekile iyabala, futhi Umsebenzi olandelayo ubonisa lowo okufanele wenziwe olandelayo. Ukuthinta umsebenzi ewijethini kuyawuhlola; ukuthinta isihloko kuvula izinhlu.\n\nUkuze uvumelanise, khetha I-akhawunti ye-CalDAV emgqeni wohlu bese ufaka ikheli leseva, igama lakho lomsebenzisi nephasiwedi (kungcono iphasiwedi yohlelo). Ikheli leseva lanele, isb. cloud.example.com/remote.php/dav; isifundi sithola izinhlu zakho zemisebenzi kusuka lapho. Uhlu ngalunye lwemisebenzi yeseva luba uhlu esifundini. Isifundi sivumelanisa uma uvula Imisebenzi, uma ukhetha Vumelanisa manje, futhi uma inethiwekhi isivuliwe; lokho oshintsha ngaphandle kwenethiwekhi kuyalinda futhi kuthunyelwa kamuva. Uma umsebenzi ushintshwe esifundini kwenye indawo ngaso leso sikhathi, inguqulo yeseva iyathathwa kanti eyakho igcinwa njengomsebenzi omusha eduze, ngakho akukho okulahlekayo. Amanothi, ama-alamu nakho konke okunye umsebenzi onakho kuseva kuhlala kunjalo. Imisebenzi ephindwayo ibonisiwe kodwa ishintshwa lapho wayenza khona. Isifundi siphatha kuze kube yimisebenzi engu-200 ezinhlwini ezingu-12."
