update.plugin.name = Isibuyekezo
update.plugin.description = Ifaka izibuyekezo ze-firmware, ezivela ekhadini noma ezilandwe ku-inthanethi.
update.plugin.how = "Isibuyekezo sifaka i-firmware entsha, kumadivayisi lapho i-PaperPaw iyi-firmware, njenge-X4. Uyitholela ezilungiselelweni, njengo-Isibuyekezo.\n\nSesha ku-inthanethi kubuza iseva yezibuyekezo i-PaperPaw entsha futhi kuyilande, okuthatha imizuzu embalwa nge-Wi-Fi. Noma kopisha ifayela lesibuyekezo (eliephela nge-.bin, kusuka ku-paperpaw.org) efolda ethi updates ekhadini, isibonelo nge-Ukudlulisa nge-Wi-Fi. Faka bese kuthatha cishe umzuzu futhi idivayisi iqala kabusha; izincwadi, izilungiselelo nezindawo zokufunda ziyahlala.\n\nNge-Hlola izibuyekezo ivuliwe (ezilungiselelweni, ivaliwe ekuqaleni), idivayisi ibuza cishe kanye ngeviki yodwa, kuphela ngenkathi i-Wi-Fi isivuliwe noma ishaja. I-PaperPaw entsha ekutholile ilinde lapha; akukho okuphazamisa ukufunda kwakho. Usesho luthumela lokho idivayisi ekusebenzisayo, ingekho igama noma inombolo yayo; ukuze kubalwe amadivayisi, nokuthi ucele yini nokuthi ingabe kungusesho lwayo lokuqala losuku, iviki noma inyanga. \n\nUma izengezo ozisebenzisayo zingenayo inguqulo yohlelo olusha, isibuyekezo siyazilindela. Inguqulo endala ifakwa kuphela uma uyikhetha.\n\nEnye i-firmware, efana ne-CrossPoint, ifakwa lapha nayo: beka ifayela layo (eliephela nge-.bin) efolda ethi updates, bese uvula Isibuyekezo. I-PaperPaw ihlola ukuthi iyi-firmware ephelele yale divayisi, engonakalile, kodwa ayikwazi ukusho ukuthi ngubani oyenzile, njengoba ingasayiniwe. Faka noma kunjalo iyibhala engxenyeni yesibili yeflash, futhi idivayisi iyiqalise; i-PaperPaw ihlala engxenyeni yayo uze lowo firmware ufake okuthile phezu kwayo. Ukubuyela ku-PaperPaw kamuva, faka ifayela layo lokufaka (paperpaw-<device>-<version>-install.bin) kumenyu yenye i-firmware, njengesibuyekezo se-firmware ye-SD ye-CrossPoint."
