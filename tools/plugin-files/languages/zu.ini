settings.plugin.name = Izilungiselelo
settings.plugin.description = Amakhasi ezilungiselelo, akhiwe ngezilungiselelo zazo zonke izengezo.
settings.plugin.how = "Izilungiselelo zibonisa konke okungasethwa ku-PaperPaw nasezengezweni zayo, ngamakhasi. Izengezo azidingi isikrini saso: lokho ezikuvezayo kubonakala lapha, ngamaqembu, ngencazelo yesilungiselelo ngasinye ngezansi kwaso.\n\nVula nge-Izilungiselelo kumenyu. Thinta iqembu ukuze uliveule, bese isilungiselelo ukuze usishintshe noma usikhethe; izinombolo zinezinkinobho ze-− ne-+. Ngezinkinobho, hamba esilungiselelweni bese ucindezela Khetha: kwesobunxele nakwesokudla kushintsha inombolo, Khetha iyigcina, Emuva libuyela kunani langaphambilini.\n\nIzinguquko zisebenza ngokushesha. Sesha sithola isilungiselelo ngamagama futhi Izilungiselelo ezithuthukile zengeza ezidingeka kancane. Setha kabusha ukuzenzakalela futhi Setha kabusha konke kubuza kuqala."
