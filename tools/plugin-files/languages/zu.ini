keys.plugin.name = Izinkinobho nokuswayipha
keys.plugin.description = Lokho inkinobho ngayinye, indawo yokuthinta nokuswayipha kukwenzayo, kushintshwa kudivayisi.
keys.plugin.how = "Izinkinobho nokuswayipha kubonisa ukuthi inkinobho ngayinye, indawo yokuthinta nokuswayipha kwenzani, futhi kukuvumela ukuthi ukushintshe kudivayisi.\n\nLivule ezilungiselelweni, ngaphansi kwe-Idivayisi. Kuqala khetha lapho ushintsho lusebenza khona: Yonke indawo, Ngenkathi ufunda, Esikrinini sasekhaya, Emtapweni noma ethuluzini elilodwa. Bese ukhetha okokufaka, njengenkinobho ebanjiwe noma ukuswayipha kusuka emphethweni, bese ukhetha isenzo ohlwini, ongasesha kulo. Njengokujwayelekile kubuyisela lokho izengezo nesakhiwo sezinkinobho okusethe.\n\nKu-X4, ushintsho olwalingashiyi inkinobho yokukhetha, yokubuyela emuva noma yokuqhubeka ngayo luyenqatshwa. Setha kabusha izinkinobho nokuswayipha ekugcineni kuhoxisa wonke ushintsho."
