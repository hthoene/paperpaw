reading-goal.plugin.name = Inhloso yokufunda
reading-goal.plugin.description = Imizuzu yokufunda ngosuku, nekati esikrinini sasekhaya isimo salo silandela ukufunda kwanamuhla.
reading-goal.plugin.how = "Ikati esikrinini sakho sasekhaya libonisa ukuthi ukufunda kwanamuhla kuhamba kanjani: lidabukile ngenkathi ungakafundi, linjalo nje ngemva kokuncane, liyaneliseka kusuka ohlangothini lwenhloso yakho yansuku zonke, lijabule uma usulifinyelele.\n\nEngeza iwijethi Ikati lokufunda esikrinini sasekhaya (bamba isikrini sasekhaya, bese wengeza iwijethi), noma ukhethe Ikati lokufunda lanamuhla njengesikrini sokulala. Ukuthinta ikati kuvula inhloso yansuku zonke; iyinhloso yezibalo zokufunda, ezibala imizuzu oyifundayo.\n\nEzilungiselelweni, ngaphansi kwe-Ukufunda, “Liyaneliseka kusukela ku-” ne-“Lijabule kusukela ku-” kusetha ukuthi kusukela kuliphi iphesenti lenhloso ikati liyaneliseka noma lijabule, futhi “Izithombe zakho” kusetha ifolda yezithombe (sad, meh, content ne-happy) ezibonisiwe esikhundleni samakati. Izithombe zingamafayela e-PNG noma e-JPEG; uma ingekho ifolda, amakati ayabonisa."
