plugin-manager.plugin.name = Umphathi wezengezo
plugin-manager.plugin.description = Udwebe izengezo futhi uzivule noma uzivale.
plugin-manager.plugin.how = "Umphathi wezengezo udwebe wonke isengezo nenguqulo yaso nencazelo, futhi uvula noma uvale izengezo.\n\nUmtholela ku-Izilungiselelo, njenge-Phatha izengezo. Izilungiselelo zezengezo yikhasi elihlukile lezinto ezikhethwayo ezifana nokusetshenziswa kwenethiwekhi kwesengezo ngasinye. Thinta isengezo ukuze usivule noma usivale (ngezinkinobho, sikhethe). Ushintsho lusebenza ngemva kokuqala kabusha: ibha engezansi bese inikeza Qala kabusha manje. Bamba isengezo (ngezinkinobho, bamba Khetha) ukuze ufunde ukuthi sisebenza kanjani.\n\nIsengezo esimakwe Sihlala sivuliwe asikwazi ukuvalwa, futhi esimakwe Siyadingeka kuphela uma esinye isengezo senza umsebenzi waso, noma i-PaperPaw ngeke ibe nendlela yokubuya. Ngaphansi kwe-Izikrini ukhetha ukuthi yisiphi isengezo esibonisa indawo ezinikezwa yizinye eziningana."
