vocabulary.plugin.name = Isichazamazwi samagama
vocabulary.plugin.description = Igcina amagama owabheke, ngemisho yawo, futhi ihlola amakhadi okufunda ngokuphindaphinda ngezikhathi ezibekiwe, enziwe efonini yakho.
vocabulary.plugin.how = "Isichazamazwi samagama sigcina amagama owabhekayo ngenkathi ufunda, ngalinye nomusho walo, ukuze uwadlule kamuva. Uthola uhlu kuma-Amathuluzi, elisha kakhulu kuqala; khetha igama ukuze ulibheke futhi. Umugqa wokugcina, Thumela, uwagcina kuzinhlelo zamakhadi okufunda ezifana ne-Anki. Uhlu lugcina amagama angu-2,000 amasha kakhulu: ngale kwalokho, amadala ayahamba, ngakho awathumele kuqala ukuze uwagcine wonke.\n\nAmakhadi okufunda, nawo kuma-Amathuluzi, akubuza ngokuphindaphinda ngezikhathi ezibekiwe: ngemva kwe-Bonisa impendulo uhlola ikhadi ngalinye Futhi, Kunzima, Kuhle noma Kulula, futhi lokho kunquma ukuthi libuya nini. Yenza amadekhi nge-Hlela ngefoni yakho: skena ikhodi ngefoni kuwo lowo Wi-Fi, bese uthayipha amakhadi noma wengeze amaningi ngesikhathi esisodwa: vula idekhi lapho, khetha Amakhadi amaningi ngesikhathi esisodwa bese ukhetha ifayela le-CSV, TSV noma TXT (ikhadi emgqeni ngamunye: ngaphambili, emuva, isibonelo; UTF-8), unamathisele uhlu, noma lethe idekhi le-Anki (.apkg, elithunyelwe nge-Support older Anki versions). \n\nNoma sebenzisa amafayela ekhadini le-SD: beka ifayela le-CSV, TSV noma TXT, noma idekhi le-Anki (.apkg, elithunyelwe nge-Support older Anki versions), kuyo yonke idekhi efolda ethi Flashcards (i-Spanish.tsv yenza idekhi i-Spanish; ikhadi elilodwa emgqeni ngamunye: ngaphambili, emuva, isibonelo; igcinwe njenge-UTF-8; umugqa wokuqala ungaqamba amakholomu ngaphambili, emuva, isibonelo). Khetha Amakhadi ekhadini le-SD ku-Amakhadi okufunda, noma uyeke kwenzeke uma uvula Amakhadi okufunda. Amadekhi ahlala esifundini nalokho owakufunde, futhi ifayela lihlanganiswa nedekhi lalo noma nini lapho lisha noma lishintshiwe: shintsha emuva noma isibonelo sekhadi efayeleni futhi ikhadi lishintsha futhi ligcine inqubekelaphambili yalo; shintsha umbhalo wangaphambili futhi ubalwa njengekhadi elisha, elidala liqala kabusha (amakhadi ahlukaniswa ngombhalo wangaphambili; izikhala nezinhlamvu ezinkulu azibalwa); umugqa ocisha awucishi ikhadi (ngaphandle kokuba usethe \"amakhadi angekho efayeleni\" abe Susa kuleyo dekhi: bese ikhadi lisuswa ekubuyekezweni okulandelayo nenqubekelaphambili yalo, unomphela, futhi akukho okususwayo ngenkathi omunye umugqa wefayela ungafundeki). Gcina idekhi kufayela lalo nge-Gcina ekhadini: ifayela lithola izinombolo zamakhadi (ikholomu ye-id), ukuze uhlele ukuqala kwamakhadi ekhompyutheni futhi amakhadi agcine lokho owakufunde; ifayela ligcina kuphela i-id, ngaphambili, emuva nesibonelo (amanye amakholomu, amazwana nokulandelana kwemigqa akugcinwa), futhi ukugcina kuyenqatshwa ngenkathi omunye umugqa wefayela ungakwazanga ukufundwa; ifayela elalikhona likopishelwa ku-_name.bak.tsv ngesikhathi sokuqala (ukugcina kwakamuva akuthathi indawo yaleyo khophi). Ifayela elingaphezu kwe-4 MiB noma imigqa engu-20,000 aliyifundwa, futhi kufanele ligcinwe njenge-CSV UTF-8, hhayi i-UTF-16. Ngesikhathi sokuqala, isifundi senza ifolda nenothi ngokuthi isebenza kanjani.\n\nEzilungiselelweni, ngaphansi kwe-Ukufunda, Amagama abhekiwe aba amakhadi afaka igama ngalinye elibhekiwe edekhini elithi Abhekiwe."
