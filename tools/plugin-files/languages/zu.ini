rules.plugin.name = Imithetho
rules.plugin.description = Uma kwenzeka okuthile, kwenza okuthile: isb. imodi yasebusuku ngo-22:00.
rules.plugin.how = "Umthetho wenza okuthile uqobo uma kwenzeka okuthile: imodi yasebusuku ivulwe nsuku zonke ngo-22:00, noma amakhathalogi avumelaniswe lapho i-PaperPaw iqala.\n\nImithetho isezilungiselelweni ngaphansi kwe-Enza ngendlela yakho, njenge-Imithetho. Engeza umthetho ubuza Nini? (i-PaperPaw iqala, isikhathi sosuku, incwadi ivuliwe noma ivaliwe, ibhethri, ukushaja, iswishi nokunye) ne-Bese kwenzekani? (sebenzisa isenzo, vula noma vala iswishi, setha inombolo, bonisa umlayezo). Thinta umthetho ukuyimisa; wubambe (ngezinkinobho, bamba Khetha) ukuze uthole imibandela efana no-Phakathi kwezikhathi ezimbili zosuku, noma ukuyisusa.\n\nIzenzo, amaswishi nezinombolo zokukhetha kuzo kuza ngesengezo: khetha isengezo, bese lokho esikuletha; emuva liphuma kuso futhi. Isenzo esisebenza esikrinini esibonisiwe, njenge-Emuva noma i-Ikhasi elilandelayo, senza lokho esingakwenza uma sicindezelwe lapho.\n\nIzikhathi zisebenza noma yisiphi isikrini esivuliwe. Imithetho emibili ehlala ihoxisana iyama ngemva kwezinyathelo ezimbalwa."
