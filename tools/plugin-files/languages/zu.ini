power.plugin.description = Ikhetha imodi yamandla, ngesandla noma ngebhethri: Okujwayelekile, Ukonga, Okungaxhunyiwe.
power.plugin.how = "Amandla akhetha ukuthi i-PaperPaw isisebenzisa kanjani isibhethri: Okujwayelekile, Ukonga noma Okungaxhunyiwe. Ukonga kwenza okungalindela ngezikhathi ezingcono; Okungaxhunyiwe kugcina irediyo ivaliwe. Okuzenzakalelayo kukhetha ngebhethri.\n\nShintsha imodi epaneleni elishesha, lapho Amandla abonisa izindlela eceleni, noma ku-Izilungiselelo ngaphansi kwe-Amandla. Lapho usetha namazinga lapho Okuzenzakalelayo kushintshela ku-Ukonga nasekungaxhunyiwe, nokuthi kuhlala Okujwayelekile ngenkathi kushaja.\n\nEmigqeni yesimo, Imodi yamandla ibonisa ileli ngenkathi konga nesibonakaliso se-Wi-Fi esichibiyelwe ngenkathi ingaxhunyiwe, futhi akukho lutho ku-Okujwayelekile.\n\nBamba inkinobho yamandla ukuze uvule imenyu encane: Lala, Vala (lapho i-PaperPaw ingakwenza), Qala kabusha, nakumadivayisi athintwayo Khiya ukuthinta noma Vula ukuthinta. Ukucindezela okufushane kusalalisa idivayisi. Emuva liyayishiya imenyu."
