store.plugin.name = Isitolo sezengezo
store.plugin.description = Sithola, sifake, sibuyekeze futhi sisuse izengezo zale divayisi.
store.plugin.how = "Isitolo sezengezo sithola izengezo zale divayisi ku-inthanethi futhi sifake, sibuyekeze futhi sisuse. Sivule kuma-Amathuluzi; sidinga i-Wi-Fi.\n\nIsiqalo sibonisa lokho umtapo ukunconywa, okusha noma okudumile manje, bese amaqembu. Iqembu lidwebe izengezo zalo ngokuxubana okufanele okushintsha nsuku zonke, ukuze isengezo ngasinye sibonwe; ziqambe ukusuka ku-A kuya ku-Z, ngokusha noma ngokubuyekezwa kokugcina, futhi uye ohlamvwini ohlwini olude. Vula esisodwa ukubona ikhasi laso, nosayizi walo nenkumbulo ethathayo, bese ukhetha Faka, Buyekeza noma Susa. Buyekeza zonke ibuyisela wonke amasengezo afakiwe esikhathini.\n\nIzengezo zekhodi zisebenza zinokufinyelela okuphelele kudivayisi: isitolo sikusho futhi sibuze kuqala, futhi ziqala ngemva kokuqala kabusha. Uma esinye siphutha, i-PaperPaw iqala ngaphandle kwezengezo zekhodi futhi isho ukuthi yiziphi. Umtapo wezengezo usetha lapho uhlu luvela khona.\n\nIzengezo zomphakathi, ku-Izilungiselelo, Isistimu, nazo zidwebe izengezo ezishicilelwe abanye ku-GitHub. Akekho obuyekeze: zimakwe Ezingabuyekeziwe, ikhasi lesengezo sekhodi libonisa isikhiye sisayinwe ngaso, nesibuyekezo esisayinwe ngesinye isikhiye asifakwa.\n\nImithombo, umugqa wokugcina wesiqalo, wengeza izinhlu zezengezo zabanye ngekheli lazo (https://…/plugins.json), uhlu olulodwa lwazo esikhundleni sokwe-PaperPaw, noma usisuse. Esikhundleni sokuthayipha, beka ifayela sources.txt linekheli elilodwa emgqeni ngamunye ku-.paperpaw/plugins/store ekhadini: amakheli abonakala ngaphansi kwe-Imithombo njengamasha. I-PaperPaw ayihloli umthombo noma izengezo zawo, futhi idivayisi iyaxhumana neseva yomthombo. Umthombo usayina uhlu lwawo; idivayisi igcina isikhiye soluhlu lokuqala olufundayo bese kusukela lapho ithatha kuphela izinhlu nezengezo zekhodi ezisayinwe ngaleso sikhiye. Isengezo sithola izibuyekezo zaso kuphela kumthombo esafakwa kuwo. Umtapo we-PaperPaw uqobo uhlala ukhona futhi awukwazi ukususwa; ukushiya isitolo kubuyela kuwo."
