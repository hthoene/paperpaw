files.plugin.name = Fájlböngésző
files.plugin.description = Felsorolja és megnyitja az eszközön lévő könyveket és mappákat.
files.plugin.how = "A könyvtár a könyvtármappában lévő könyveket mutatja a borítójukkal, címükkel, szerzőjükkel és az olvasási előrehaladással. A legutóbb olvasott könyv felül, kártyaként jelenik meg, így egy koppintással vagy az OK gomb megnyomásával folytathatod. Amíg a könyvtár könyveket keres, jelzi az eddig megtalált könyvek számát.\n\nA könyvek fölött választhatod ki, mi jelenjen meg: az összes könyv, az éppen olvasott, az olvasatlan vagy a befejezett könyvek, illetve a polcok (szerző, sorozat, címke, kedvencek, a megkezdett sorozatok következő kötete). Koppints egy könyvre az olvasáshoz; tartsd nyomva (gombokkal az OK gombot), hogy megnyisd, befejezettnek vagy olvasatlannak jelöld, megnézd az adatait, archiváld vagy töröld. A címre koppintva nyílik a könyvtár menüje: rendezés és nézet, keresés, könyvtármappa és beállítások.\n\nA könyvtármappát a Beállítások Könyvtár részében, a Könyvtármappa pontban adhatod meg; itt választhatod a borítórácsos nézetet is. Minden más fájlhoz használd az Eszközök menü Fájlok pontját."
