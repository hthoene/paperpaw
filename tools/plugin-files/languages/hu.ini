update.plugin.name = Frissítés
update.plugin.description = Firmware-frissítések telepítése a kártyáról vagy az internetről letöltve.
update.plugin.how = "A Frissítés új firmware-t telepít olyan készülékeken, amelyeken a PaperPaw maga a firmware, például az X4-en. A beállítások Frissítés pontjában találod.\n\nAz Online keresés újabb PaperPaw-t kér a frissítési szervertől, és letölti; ez Wi-Fi-n néhány perc. Vagy másolj egy frissítési fájlt (.bin végződéssel, a paperpaw.org oldalról) a kártya updates mappájába, például Wi-Fi-átvitellel. A Telepítés ezután körülbelül egy perc, majd a készülék újraindul; a könyvek, beállítások és olvasási helyek megmaradnak.\n\nHa a Frissítések keresése be van kapcsolva (a beállításokban, kezdetben kikapcsolva), a készülék nagyjából hetente magától keres, csak ha a Wi-Fi amúgy is be van kapcsolva, vagy a készülék töltődik. A talált újabb PaperPaw itt vár; semmi sem szakítja meg az olvasást. A keresés elküldi a futó szoftver adatait, a készülék nevét és számát nem; a készülékek számlálásához azt is, hogy te kérted-e a keresést, és ez volt-e az első az adott napon, héten vagy hónapban.\n\nHa az általad használt bővítményeknek még nincs az új kiadáshoz való változata, a frissítés megvárja őket. Régebbi verzió csak akkor települ, ha kiválasztod.\n\nMás firmware, például CrossPoint is telepíthető innen: tedd a fájlját (.bin végződéssel) az updates mappába, és nyisd meg a Frissítést. A PaperPaw ellenőrzi, hogy teljes, sértetlen firmware-e ehhez a készülékhez, de aláírás híján nem tudja megállapítani, ki készítette. A Telepítés mégis a flashmemória másik felébe írja, és a készülék elindítja; a PaperPaw a saját felében marad, amíg az a firmware nem telepít rá valamit. A PaperPaw-hoz visszatéréshez később telepítsd a telepítőfájlját (paperpaw-<device>-<version>-install.bin) a másik firmware menüjéből, például a CrossPoint SD firmware update pontjából."
