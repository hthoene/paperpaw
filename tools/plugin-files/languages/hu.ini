vocabulary.sd.readme = "Tanulókártyák fájlokból\n\nTegyél ide paklinként egy fájlt: a Spanish.tsv fájlból Spanish nevű pakli készül.\nFájlok: .tsv, .csv vagy .txt UTF-8-ként mentve, vagy .apkg: Ankiból exportált pakli a Support older Anki versions bejelölésével. A jegyzetek első három mezőjéből lesz az előlap, hátlap és példa; az ütemezést és médiát nem olvassa, és a PaperPaw sosem ír Anki-fájlt.\n\nSoronként egy kártya: előlap, hátlap és példa (nem kötelező), tabulátorral, vesszővel vagy pontosvesszővel elválasztva. Az első sor tartalmazhatja az oszlopneveket: front, back, example. Példa:\n\nKatze\tcat\tDie Katze schläft.\n\nEzután nyisd meg a Tanulókártyákat az olvasón, válaszd a Kártyák az SD-kártyán, majd a Paklik frissítése a kártyáról pontot.\n\nJó tudni:\n- A paklik az olvasón maradnak a tanulási előzményeiddel együtt. A fájlt akkor olvassa be, ha új vagy módosult, és a kártyáit hozzáadja a paklihoz, vagy módosítja benne.\n- Ha a fájlban módosítod egy kártya hátlapját vagy példáját, a kártya megváltozik, és megőrzi a tanulási előzményeidet.\n- Ha az előlap szövegét módosítod, az új kártyának számít, és a régi elölről indul. A kártyákat az előlap szövege alapján azonosítja, a szóközök és nagybetűk nem számítanak. Ha fájlba mented a paklit (Kártyák az SD-kártyán, Pakli mentése a kártyára), minden kártya számot kap az id oszlopban: ha ott módosítasz előlapot, és a fájl első két sorát változatlanul hagyod, a kártya megőrzi a tanulási előzményeidet.\n- A mentés a pakli kártyáit írja ki. Ami a fájlban volt, de nem kártya (előlap nélküli sor), nem marad meg; a korábbi fájlt az _name.bak.tsv fájlba másolja.\n- A fájlt CSV UTF-8-ként mentsd (ne UTF-16-ként vagy a táblázatkezelő saját formátumában). A 4 MiB-nál vagy 20 000 sornál nagyobb fájlt nem olvassa: bontsd részekre.\n- A fájlból törölt sor nem törli a kártyát a pakliból, kivéve ha a paklinál bekapcsolod a Hiányzó kártyák eltávolítása lehetőséget. Ekkor a kártya a tanulási előzményeiddel együtt eltűnik.\n- A _ kezdetű fájlneveket nem olvassa.\n"
