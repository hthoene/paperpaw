koreader.plugin.name = Pagbabahagi ng mga highlight
koreader.plugin.description = Ibinabahagi ang mga bookmark at highlight sa KOReader para sa mga aklat na binabasa sa pareho.
koreader.plugin.how = "Ibinabahagi ng plugin na ito ang mga bookmark at highlight sa KOReader para sa mga aklat na binabasa mo sa pareho, sa iisang device o sa folder ng aklatan na naka-sync sa pagitan ng mga device. Walang kailangang i-set up.\n\nKapag binuksan ng PaperPaw ang aklat na binuksan din ng KOReader, at kapag binago mo ang mga bookmark o highlight nito, kinukuha nito ang bago mula sa data ng KOReader na katabi ng aklat at iniiwan ang bago rito para kunin ng KOReader sa susunod na buksan nito ang aklat. Sumasama rin ang mga inalis na marka at binagong tala.\n\nGumagana ito sa mga EPUB na aklat lang. Kung hindi mabasa ang file ng isang panig, walang magbabago sa alinmang panig hanggang mabasa ito."
