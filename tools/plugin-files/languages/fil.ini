file-manager.plugin.name = File manager
file-manager.plugin.description = Bawat folder at file sa device: buksan, palitan ang pangalan, ilipat, kopyahin at burahin ang mga ito.
file-manager.plugin.how = "Ipinapakita ng file manager ang bawat folder at file sa storage ng device, hindi lang ang mga aklat mo, at hinahayaan kang buksan, palitan ang pangalan, ilipat, kopyahin at burahin ang mga ito at gumawa ng mga bagong folder.\n\nBuksan ang Mga File mula sa menu ng Mga Tool. Mag-tap ng folder para pumasok dito; pupunta sa itaas na folder ang Bumalik. Mag-tap ng file, o pindutin nang matagal ang anumang entry (sa mga button, pindutin nang matagal ang Piliin), para makita kung ano ang puwedeng gawin dito. Pinipili ng Ilipat at Kopyahin ang entry: pumunta sa folder kung saan ito dapat mapunta at piliin ang I-paste dito sa bar sa ibaba. Sa mga button, pindutin ang Pababa mula sa huling entry para makarating sa bar.\n\nAng mga file at folder na nagsisimula sa tuldok, gaya ng sariling data ng PaperPaw, ay nakatago. Para makita ang mga ito, i-on ang Mga nakatagong file sa Mga Setting, sa ilalim ng Aklatan."
