rules.plugin.name = Mga Rule
rules.plugin.description = Kapag may nangyari, may gagawin: hal. night mode sa 22:00.
rules.plugin.how = "Ang rule ay kusang gumagawa ng isang bagay kapag may nangyari: night mode tuwing 22:00, o ang mga catalog ay nasi-sync kapag nagsimula ang PaperPaw.\n\nNasa Mga Setting ang mga rule sa ilalim ng I-customize, bilang Mga Rule. Itinatanong ng Magdagdag ng rule ang Kailan? (nagsimula ang PaperPaw, oras ng araw, aklat na binuksan o isinara, ang baterya, pagcha-charge, isang switch at iba pa) at Ano ang gagawin? (magpatakbo ng aksyon, i-on o i-off ang switch, magtakda ng numero, magpakita ng mensahe). I-tap ang rule para i-pause ito; pindutin ito nang matagal (sa mga button, pindutin nang matagal ang Piliin) para sa kondisyon gaya ng Sa pagitan ng dalawang oras ng araw, o para alisin ito.\n\nAng mga aksyon, switch at numerong mapipili ay nakaayos ayon sa plugin: piliin ang plugin, pagkatapos ay kung ano ang dala nito; lumalabas dito muli ang bumalik. Ang aksyong gumagana sa ipinapakitang screen, gaya ng Bumalik o Susunod na pahina, ay ginagawa ang gagawin nito kung pinindot doon.\n\nNag-a-apply ang mga oras anuman ang nakabukas na screen. Ang dalawang rule na nagpapawalang-bisa sa isa't isa ay humihinto pagkatapos ng ilang hakbang."
