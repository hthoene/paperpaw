vocabulary.plugin.name = Bokabularyo
vocabulary.plugin.description = Iniingatan ang mga salitang hinanap mo, kasama ang kanilang mga pangungusap, at nire-review ang mga flash card gamit ang spaced repetition, na ginawa sa telepono mo.
vocabulary.plugin.how = "Iniingatan ng Bokabularyo ang mga salitang hinahanap mo habang nagbabasa, bawat isa kasama ang pangungusap nito, para balikan mamaya. Makikita mo ang listahan sa Mga Tool, pinakabago muna; pumili ng salita para hanapin itong muli. Ang huling hanay, I-export, ay nagse-save ng mga ito para sa mga flash card app gaya ng Anki. Iniingatan ng listahan ang pinakabagong 2,000 salita: lampas doon, nawawala ang pinakaluma, kaya i-export muna ang mga ito para mapanatili lahat.\n\nAng mga flash card, nasa Mga Tool din, ay nagku-quiz sa iyo gamit ang spaced repetition: pagkatapos ng Ipakita ang sagot, ire-rate mo ang bawat card ng Ulitin, Mahirap, Mabuti o Madali, at iyon ang nagpapasya kung kailan ito babalik. Gumawa ng mga deck gamit ang I-edit gamit ang telepono mo: i-scan ang code gamit ang telepono sa iisang Wi-Fi, pagkatapos ay mag-type ng mga card o magdagdag ng marami nang sabay-sabay: magbukas ng deck doon, piliin ang Maraming card nang sabay-sabay at pumili ng CSV, TSV o TXT file (isang card bawat linya: harap, likod, halimbawa; UTF-8), mag-paste ng listahan, o magdala ng Anki deck (.apkg, na-export na may Support older Anki versions). \n\nO gumamit ng mga file sa SD card: maglagay ng CSV, TSV o TXT file, o Anki deck (.apkg, na-export na may Support older Anki versions), para sa bawat deck sa folder na Flashcards (ang Spanish.tsv ay gumagawa ng deck na Spanish; isang card bawat linya: harap, likod, halimbawa; naka-save bilang UTF-8; ang unang linya ay puwedeng magpangalan sa mga column na front, back, example). Piliin ang Mga card sa SD card sa Mga flash card, o hayaang mangyari ito kapag binuksan mo ang Mga flash card. Nananatili sa reader ang mga deck kasama ang natutunan mo, at ang file ay isinasama sa deck nito tuwing bago o nabago ito: baguhin ang likod o halimbawa ng card sa file at magbabago ang card at pananatilihin ang progreso nito; baguhin ang text sa harap at ituturing itong bagong card, magsisimulang muli ang luma (nakikilala ang mga card ayon sa text sa harap; hindi binibilang ang mga espasyo at malalaking titik); ang linyang buburahin mo ay hindi nagbubura ng card (maliban kung itinakda mo ang “mga card na wala sa file” sa Alisin para sa deck na iyon: aalisin na ang card sa susunod na update kasama ang progreso nito, nang tuluyan, at walang aalisin habang may linya ng file na hindi mabasa). I-save ang deck sa file nito gamit ang I-save sa card: tatanggap ang file ng mga numero ng mga card (ang id column), kaya maaari mong i-edit ang mga harap sa computer at mapapanatili ng mga card ang natutunan mo; id, harap, likod at halimbawa lang ang pinananatili ng file (hindi pinananatili ang ibang column, komento at pagkakasunod ng mga linya), at tinatanggihan ang pag-save habang may linya ng file na hindi nabasa; ang file na nandoon ay kinokopya sa _name.bak.tsv sa unang pagkakataon (hindi pinapalitan ng susunod na pag-save ang kopyang iyon). Ang file na higit sa 4 MiB o 20,000 linya ay hindi binabasa, at dapat itong i-save bilang CSV UTF-8, hindi UTF-16. Sa unang pagkakataon, ginagawa ng reader ang folder na may paalala kung paano ito gumagana.\n\nSa mga setting, sa ilalim ng Pagbabasa, inilalagay ng Ang mga salitang hinanap ay nagiging mga card ang bawat hinanap na salita sa deck na Hinanap."
