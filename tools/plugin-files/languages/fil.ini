help.got-it = Nakuha ko
help.no-more = Wala nang hint
help.section = Mga hint
help.setting.show = Mga hint
help.setting.show.help = Sa unang beses na bumukas ang screen, may maikling paalala na nagsasabi kung ano ang ginagawa ng mga kontrol nito.
