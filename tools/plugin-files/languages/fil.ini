diagnostics.plugin.name = Diagnostics
diagnostics.plugin.description = Isang test screen at gabay na pagsusuri ng bawat bahagi ng device.
diagnostics.plugin.how = "Ang Diagnostics ay isang test screen para suriin ang device: ipinapakita nito ang bawat antas ng abo na kayang ipakita ng panel, apat na kahon para subukan ang mga button at touch, at isang page counter na may progress bar para ihambing ang mga refresh mode.\n\nWalang entry sa menu ang test screen. Home screen lang ito habang walang ibang plugin na nag-aalok nito, o kapag pinili mo ito sa Mga Screen sa plugin manager para sa puwestong Home screen.\n\nMinamarkahan ng Piliin ang naka-focus na kahon, at ang mga arrow button ang gumagalaw sa pagitan ng mga kahon; sa touch, i-tap ang kahon. Ang mga page button ang nagpapalit ng mga test page. Pindutin nang matagal ang Piliin, o ang daliri sa screen, para magsimula muli.\n\nAng pagsusuri ng device, sa ilalim ng Mga Tool kung saan ang PaperPaw ang firmware ng device, ay dinadaanan ang bawat bahagi ng device isang pahina bawat beses: ang screen, mga button, touch, front light, baterya, card, orasan, Wi-Fi, sleep at memorya. Nagtatapos ang bawat pahina sa Bumagsak, Laktawan at Pumasa, na napili na ang sagot na iminumungkahi ng mga sukat nito; nilalaktawan ang mga bahaging wala sa device. Pagkatapos ng bawat sagot, nagsusulat ito ng ulat sa .paperpaw/plugins/diagnostics/device-check.txt, para i-paste sa isang pull request. Lumalabas ang Bumalik, at nagpapatuloy ito kung saan ito huminto kapag binuksan muli. Sa device na may mga button lang, piliin muna ang Simulan sa pahina ng mga button; hanggang doon, gumagana ang mga arrow, Piliin at Bumalik gaya sa bawat pahina."
