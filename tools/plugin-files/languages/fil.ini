aids.plugin.name = Mga gabay sa pagbabasa
aids.plugin.description = Bold na simula ng salita, mga pinalitang salita, mga larawan: text ayon sa gusto mo.
aids.plugin.how = "Binabago ng Mga gabay sa pagbabasa ang hitsura ng text ng aklat habang nagbabasa ka. Nag-a-apply ang mga ito sa bawat aklat. Naka-off sa simula ang Bold na simula ng salita at ang Palitan ang mga salita.\n\nMakikita mo ang mga ito sa Mga Setting, sa ilalim ng Pagbabasa, sa seksyong Mga gabay sa pagbabasa. Ginagawang bold ng Bold na simula ng salita ang unang kalahati ng bawat salita, na mas madaling sundan ng ilan. Tumatanggap ang Palitan ang mga salita ng mga pares na isinulat bilang “kompyuter = computer; Gng. = Ginang”, pinaghihiwalay ng semicolon.\n\nBuong salita lang ang pinapalitan, eksakto ayon sa pagkakasulat mo, kaya hindi kailanman nababago ang bahagi ng mas mahabang salita. Hindi binabago ang mismong file ng aklat.\n\nAng mga larawan sa mga aklat ay puwedeng ipakita (gaya sa simula), gawing maikling linya gaya ng “[Larawan: isang barko sa dagat]” na gumagamit ng paglalarawan ng larawan, o alisin. Mas maraming espasyo na ang pahina para sa text, at walang dina-decode para sa larawang hindi ipinapakita, kaya mas mabilis ang pagpapalit ng pahina. Hindi binabago ang mga komiks at iba pang aklat na gawa sa mga larawan."
