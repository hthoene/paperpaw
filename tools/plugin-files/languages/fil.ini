transfer.plugin.name = Transfer
transfer.plugin.description = Maglagay ng mga aklat at iba pang file sa device mula sa browser sa iisang network.
transfer.plugin.how = "Naglalagay ang Wi-Fi transfer ng mga aklat at iba pang file sa device mula sa browser sa iisang network, nang walang cable o app. Puwede ka ring kumuha ng mga file, gumawa ng mga folder at magbura.\n\nBuksan ito mula sa Mga Tool. Nagpapakita ang screen ng address bilang text at bilang QR code: buksan ito sa browser sa telepono o computer, o i-scan ang code. May hawak ang address na key na ginagawang bago sa bawat pagkakataon, kaya hindi maaabot ng iba sa network ang mga file mo. Tumatakbo ang transfer habang bukas ang screen.\n\nKung saan ang PaperPaw mismo ang nagpapatakbo ng Wi-Fi, gaya sa X4, ang Walang router sa ibaba ay nagbubukas ng sariling network ng device, na sinasalihan ng telepono sa pag-scan ng code."
