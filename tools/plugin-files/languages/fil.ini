plugin-manager.plugin.name = Plugin manager
plugin-manager.plugin.description = Inililista ang mga plugin at ino-on at ino-off ang mga ito.
plugin-manager.plugin.how = "Inililista ng plugin manager ang bawat plugin kasama ang bersyon at paglalarawan nito, at ino-on at ino-off ang mga plugin.\n\nMakikita ito sa Mga Setting, bilang Pamahalaan ang mga plugin. Ang Mga setting ng plugin ay hiwalay na pahina para sa mga kagustuhan gaya ng paggamit ng network ng bawat plugin. I-tap ang plugin para i-on o i-off ito (sa mga button, piliin ito). Nag-a-apply ang pagbabago pagkatapos ng restart: iaalok ng bar sa ibaba ang I-restart ngayon. Pindutin nang matagal ang plugin (sa mga button, pindutin nang matagal ang Piliin) para mabasa kung paano ito gumagana.\n\nAng plugin na may markang Laging naka-on ay hindi puwedeng i-off, at ang may markang Kailangan ay kapag nagawa na lang ng ibang plugin ang trabaho nito, o mawawalan ng daan pabalik ang PaperPaw. Sa Mga Screen, pipiliin mo kung aling plugin ang magpapakita ng isang puwestong inaalok ng ilan."
