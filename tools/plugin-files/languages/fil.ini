menu-editor.plugin.name = Menu editor
menu-editor.plugin.description = Inaayos muli, inaalis at idinadagdag ang mga entry ng bawat menu.
menu-editor.plugin.how = "Binabago ng menu editor ang laman ng mga menu: ilipat pataas o pababa ang mga entry, alisin ang mga ito, o magdagdag ng bago.\n\nMakikita ito sa Mga Setting sa ilalim ng I-customize, bilang I-customize ang mga menu. Pumili ng menu, pagkatapos ay entry para ilipat o alisin ito; naglalagay ng bago ang Magdagdag ng entry. Agad na nag-a-apply ang mga pagbabago. Ibinabalik ng I-reset ang menu na ito ang menu sa kung paano ito binibigyang-kahulugan ng mga plugin nito, ginagawa ito ng I-reset ang lahat ng menu para sa bawat isa.\n\nHindi ka makakakulong sa labas: ang entry na daan patungo sa mga setting ay mananatili hanggang magdagdag ka ng ibang daan patungo sa mga ito."
