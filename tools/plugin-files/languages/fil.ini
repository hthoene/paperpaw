notes-vault.plugin.name = Notes vault
notes-vault.plugin.description = Nagbabasa ng folder ng mga Markdown na tala ayon sa mga folder, tag at huling pagbabago, na may mga widget para sa home screen. Gumagana sa mga Obsidian vault.
notes-vault.plugin.how = "Nagbabasa ang Notes vault ng folder ng mga Markdown na tala (payak na .md file, gaya ng pag-iingat ng mga notes app). Gumagana ito sa mga Obsidian vault.\n\nPiliin ang folder ng vault sa mga setting, o sa pahina ng vault sa mga tool. Iaalok ng pahina ang mga folder ayon sa nasa card, ang mga huling nabagong tala, ang mga tag, at paghahanap sa mga pamagat ng mga tala.\n\nSa unang beses, ini-index ang vault sa background habang bukas ang pahina nito; ang vault na may libu-libong tala ay tumatagal ng ilang minuto, pagkatapos ay agad na bumubukas. Itinatago ang index sa card at ginagawa muli kapag nagbukas ang pahina ng vault pagkalipas ng ilang oras, o kapag pinili mo ang I-update.\n\nBumubukas sa reader ang tala. Ang mga link sa ibang tala ([[Note]], [[Note|words]], [[Note#Heading]]) ay hinahanap ayon sa pangalan ng tala saanman sa vault; ang pagsunod sa isa ay magbubukas ng tala na iyon, at ibinabalik ka ng Bumalik sa naunang tala.\n\nWalang kailanman binabago sa vault. Idinadagdag ang mga widget para sa home screen (mga kamakailang tala, naka-pin na tala, tala ng araw, random na tala, mga tag, paghahanap) sa editor ng home screen. Maaaring kumuha ang widget ng mga tala nito mula sa isang folder lang: isulat ang path ng folder mula sa ugat ng card (halimbawa Notes/Work) sa mga setting ng widget; kung walang laman, kinukuha nito ang lahat ng tala ng vault."
