notes-overview.plugin.name = Lahat ng tala
notes-overview.plugin.description = Ang mga bookmark at highlight ng lahat ng aklat sa isang listahan, at pag-export bilang My Clippings.txt.
notes-overview.plugin.how = "Inililista ng Lahat ng tala ang bawat aklat na may ginawa kang bookmark o highlight, kasama ang bilang. Buksan ito sa Mga Tool. Pumili ng aklat para makita ang mga tala nito, at ng tala para buksan ang aklat sa puwestong iyon.\n\nSa dulo ng listahan, isinusulat ng I-export bilang My Clippings.txt ang lahat ng tala sa isang file, sa folder na Exports sa tabi ng aklatan, sa anyong ginagamit ng Kindle (UTF-8). Mababasa ito ng mga app na nagbabasa ng My Clippings.txt ng Kindle. Ang tala sa isang highlight ay hiwalay na entry, gaya sa Kindle. Dahil walang Kindle location ang aklat dito, ang “location” ay kung gaano kalayo sa aklat ang tala, sa porsiyento. Isinusulat muli ang file sa bawat pagkakataon; pinapalitan nito ang nauna."
