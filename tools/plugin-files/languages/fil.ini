format-docx.plugin.name = Mga dokumentong DOCX
format-docx.plugin.description = Nagbubukas ng mga .docx file, gaya ng sine-save ng Word at iba pang programa.
format-docx.plugin.how = "Nagbubukas ng mga .docx na dokumento bilang aklat: mga heading na may talaan ng nilalaman, listahan, talahanayan, bold at italic, link at larawan (JPEG, PNG, GIF).\n\nIlagay ang mga file sa folder ng aklatan at buksan mula sa aklatan. Galing sa mga property ng dokumento ang pamagat at may-akda. Hindi ipinapakita ang mga talababa, header at footer, at komento."
format-docx.title = Dokumentong DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Nagbubukas ng mga EPUB na aklat kasama ang mga istilo, talaan ng nilalaman at larawan nila.
format-epub.plugin.how = "Nagbubukas mula sa aklatan ang mga EPUB na aklat gaya ng anumang aklat, kasama ang talaan ng nilalaman, mga larawan at istilo ng publisher. Ganoon din ang pagbubukas ng mga web page (HTML), Markdown, FictionBook (.fb2) at mga comic book archive (.cbz), bawat isa ay bilang sariling plugin.\n\nKino-convert ang isang kabanata sa unang beses na buksan mo ito at itinatago sa cache ng plugin, kaya mas mabilis ito pagkatapos at gumagana ang malalaking aklat sa maliliit na device. Makikita ang talaan ng nilalaman sa Nilalaman sa menu ng pagbabasa. Ang setting na Pag-format ng publisher, sa ilalim ng Pagbabasa, ang nagpapasya kung mag-a-apply ang sariling istilo ng aklat."
format-epub.title = EPUB e-book
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Nagbubukas ng mga FictionBook na aklat (.fb2, pati naka-zip).
format-fb2.plugin.how = "Nagbubukas ng mga FictionBook na aklat (.fb2), karaniwan sa mga aklat na Ruso at iba pa, pati naka-zip (.fb2.zip), kasama ang pamagat, mga may-akda, cover at mga kabanata nila.\n\nIlagay ang mga ito sa folder ng aklatan; lalabas ang mga ito sa aklatan at bubukas gaya ng anumang aklat."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Nagbubukas ng mga web page na naka-save bilang file, na ipinapakita lang ang babasahin.
format-html.plugin.how = "Nagbubukas ng mga web page na naka-save bilang file (.html, .htm, .xhtml) bilang aklat: ang babasahin lang, nang walang mga menu, patalastas at iba pang gaya nito sa paligid.\n\nIlagay ang file sa folder ng aklatan at buksan mula sa aklatan gaya ng anumang aklat. Gumagana ang mga link sa loob ng pahina; lumalabas ang mga larawan kung nasaan sila sa file."
