about.plugin.name = Tungkol
about.plugin.description = Bersyon at mga lisensya ng PaperPaw.
about.plugin.how = "Ipinapakita ng Tungkol kung aling bersyon ng PaperPaw ang mayroon ka, kung nasaan ang source code nito, at sa ilalim ng aling mga lisensya ito inilabas.\n\nMakikita mo ito sa dulo ng Mga Setting, bilang Tungkol sa PaperPaw. Pumili ng hanay gamit ang mga arrow button at Piliin, o i-tap ito. Nakalista rin ang mga plugin na built in sa firmware at, sa mga device na nagla-load ng mga plugin na may code, ang fingerprint na dapat pagbatayan ng pagkakagawa ng mga naturang plugin.\n\nNagbubukas ang Mga Lisensya bilang text sa reader, kaya magpapalit ka ng pahina na parang aklat. Dala nito ang sariling lisensya ng PaperPaw at ang sa mga font, icon at hyphenation pattern na kasama nito. Puwedeng magdagdag ng sariling linya ang mga plugin, gaya ng may-akda ng tema."
