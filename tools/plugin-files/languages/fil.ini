update.plugin.name = Update
update.plugin.description = Nag-i-install ng mga firmware update, mula sa card o na-download mula sa internet.
update.plugin.how = "Nag-i-install ang Update ng bagong firmware, sa mga device kung saan ang PaperPaw ang firmware, gaya ng X4. Makikita mo ito sa mga setting, bilang Update.\n\nTinatanong ng Maghanap online ang update server para sa mas bagong PaperPaw at dina-download ito, na tumatagal ng ilang minuto sa Wi-Fi. O kopyahin ang update file (nagtatapos sa .bin, mula sa paperpaw.org) sa folder na updates sa card, halimbawa gamit ang Wi-Fi transfer. Ang pag-install ay tumatagal ng mga isang minuto at magre-restart ang device; mananatili ang mga aklat, setting at puwesto sa pagbabasa.\n\nKapag naka-on ang Maghanap ng mga update (sa mga setting, naka-off sa simula), nagtatanong ang device nang mga isang beses kada linggo nang kusa, habang naka-on na rin ang Wi-Fi o nagcha-charge lang. Ang mas bagong PaperPaw na makita nito ay naghihintay rito; walang makakaabala sa pagbabasa mo. Ipinapadala ng paghahanap kung ano ang pinapatakbo ng device, walang pangalan o numero nito; para mabilang ang mga device, pati kung ikaw ang humiling at kung ito ang unang paghahanap nito sa araw, linggo o buwan.\n\nKung wala pang bersyon para sa bagong release ang mga plugin na ginagamit mo, naghihintay ang update para sa mga ito. Ang mas lumang bersyon ay mai-install lang kung pipiliin mo.\n\nAng ibang firmware, gaya ng CrossPoint, ay ini-install din mula rito: ilagay ang file nito (nagtatapos sa .bin) sa folder na updates, at buksan ang Update. Sinusuri ng PaperPaw na buong firmware ito para sa device na ito, hindi sira, pero hindi nito masasabi kung sino ang gumawa nito, dahil hindi ito pirmado. Isinusulat ito ng Mag-install pa rin sa kabilang kalahati ng flash, at sinisimulan ito ng device; nananatili ang PaperPaw sa kalahati nito hanggang may i-install ang firmware na iyon sa ibabaw nito. Para bumalik sa PaperPaw mamaya, i-install ang install file nito (paperpaw-<device>-<version>-install.bin) mula sa menu ng ibang firmware, gaya ng SD firmware update ng CrossPoint."
