setup.plugin.name = Setup
setup.plugin.description = Isang maikling gabay sa mga mahahalagang setting, sa unang pagsisimula.
setup.plugin.how = "Ang Setup ay isang maikling gabay sa mga mahahalagang setting, ipinapakita nang isang beses, sa unang pagsisimula ng PaperPaw. Isang bagay ang itinatanong ng bawat pahina, gaya ng wika, mga button, laki ng text, time zone, Wi-Fi o ilang plugin na idaragdag, na may makatwirang sagot nang napili, kaya laging tama ang Susunod. Iniiwan ang mga hakbang na hindi kailangan ng device na ito.\n\nI-tap ang mga button, o gamitin ang pataas at pababang button at Piliin. Agad na iniiwan ng Laktawan sa unang pahina ang setup. Sinasabi ng huling pahina kung saan nanggagaling ang mga aklat mo.\n\nPara patakbuhin itong muli, buksan ang mga setting at piliin ang I-set up ang PaperPaw. Lahat ng pinili rito ay mababago sa mga setting mamaya."
