profiles.plugin.name = Mga profile sa pagbabasa
profiles.plugin.description = Mga may-pangalang set ng mga setting sa pagbabasa at display, nililipatan sa isang tap.
profiles.plugin.how = "Iniingatan ng profile ang mga setting mo sa pagbabasa, mga setting ng display at mga status line sa ilalim ng isang pangalan, gaya ng Gabi o Malaking print, at ibinabalik ang mga ito sa isang tap.\n\nBuksan ang Mga Profile sa menu ng pagbabasa sa ilalim ng Iba pa, o sa Mga Setting sa ilalim ng I-customize. I-tap ang profile para gamitin ito; may marka ang ginagamit. Pindutin ito nang matagal (sa mga button, pindutin nang matagal ang Piliin) para i-save ang mga kasalukuyang setting dito, palitan ang pangalan nito o alisin ito. Pinananatili ng I-save bilang bagong profile ang kasalukuyang naka-set.\n\nLumilipat ang Susunod na profile sa kasunod sa listahan; ilagay ito sa isang button o sa isang rule."
