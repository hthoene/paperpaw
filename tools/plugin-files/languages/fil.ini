calibre.plugin.name = Wireless na aklatan
calibre.plugin.description = Tumatanggap ng mga aklat sa network. Gumagana bilang wireless device para sa calibre.
calibre.plugin.how = "Hinahayaan ng Wireless na aklatan na lumabas ang device sa Calibre sa computer mo bilang wireless device. Makakapagpadala na ng mga aklat dito ang Calibre, ilista ang mga ito at burahin. Napupunta ang mga aklat sa aklatan.\n\nBuksan ang Wireless na aklatan mula sa menu ng Mga Tool, na nasa iisang Wi-Fi network ang device at computer. Sa Calibre, piliin ang Connect/share, pagkatapos ay Start wireless device connection. Kapag nahanap na ng device ang computer mo, ipinapakita nito ang pangalan; i-tap ang Kumonekta (sa mga button, pindutin ang Piliin). Makakapagdagdag at makakapagbura ng mga aklat dito ang Calibre, kaya kumonekta lang sa sarili mong computer. Tinatapos ng pagsara ng screen ang koneksyon.\n\nKung hindi kusang mahanap ang Calibre, ilagay ang address ng computer nito sa Mga Setting, sa ilalim ng Aklatan, bilang Address sa bahagi ng Calibre. Kung iba sa 9090 ang port na ginagamit ng Calibre, idagdag ito bilang :port, hal. 192.168.1.20:9091."
