anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Pinag-aaralan ang mga due na card ng Anki sa computer mo at ibinabalik ang mga sagot mo, sa pamamagitan ng AnkiConnect add-on.
anki.plugin.how = "Hinahayaan ka ng Anki na pag-aralan sa reader ang mga card na due sa Anki sa computer mo, at ibinabalik ang mga sagot mo. Ginagamit nito ang libreng add-on na AnkiConnect (add-on code 2055492159) at hindi kailanman ang AnkiWeb. Naka-off ito sa simula: idagdag ito mula sa Plugin store.\n\nSa computer: i-install ang AnkiConnect sa Anki (Tools, Add-ons, Get Add-ons) at i-restart ang Anki. Dapat nakabukas ang Anki habang nagsa-sync ka.\n\nSa default, ang computer lang na pinagtatakbuhan nito (127.0.0.1) ang sinasagot ng AnkiConnect, kaya hindi ito maaabot ng reader. Buksan ang Tools, Add-ons, AnkiConnect, Config at itakda ang “webBindAddress” sa “0.0.0.0” (makinig sa home network). Ang port, “webBindPort”, ay 8765 maliban kung babaguhin mo. Kung nagtakda ka roon ng “apiKey”, ilagay dito ang parehong key. I-restart ang Anki pagkatapos baguhin ang configuration, at payagan ang Anki sa firewall ng computer kung magtanong ito. Gamitin lang ito sa network na pinagkakatiwalaan mo: maaabot ng sinuman doon ang AnkiConnect, kaya magandang ideya ang key.\n\nSa reader: buksan ang Anki mula sa Mga Tool, pagkatapos ilagay ang address ng computer (halimbawa 192.168.1.20) sa Computer, ang port kung hindi ito 8765, at ang API key kung nagtakda ka. Pumili ng Deck, o iwanang walang laman para sa lahat ng deck. Pagkatapos piliin ang Mag-sync sa Anki, habang naka-on ang Wi-Fi: unang ipapadala ang mga naghihintay mong sagot, pagkatapos ay kukunin ang mga due na card (at ang bilang ng mga bagong card na itinakda mo), hanggang 50. Piliin ang Mag-aral para daanan ang mga ito, nang walang network: ipakita ang sagot at i-rate ito ng Ulitin, Mahirap, Mabuti o Madali. Nananatili sa reader ang mga sagot mo, kahit walang Wi-Fi, at mapupunta sa Anki sa susunod na sync. Ang Anki ang nagpapasya kung kailan babalik ang isang card: ang card na sinagot mo ng Ulitin ay kukunin muli ng susunod na sync kapag sinabi ng Anki na due na ito.\n\nAng Mag-sync kapag nagbukas ang Anki, sa mga setting, ay nagsa-sync tuwing bubuksan mo ang screen. Walang gumagamit ng network kapag nagpindot ka ng key."
