reader.plugin.name = Reader
reader.plugin.description = Nagpapakita ng mga aklat nang pahina por pahina, na may talaan ng nilalaman at mga setting sa pagbabasa.
reader.plugin.how = "Ipinapakita ng reader ang mga aklat nang pahina por pahina. Magbukas ng aklat mula sa aklatan; maaaring mabuksan muli sa pagsisimula ang huling aklat (setting na Buksan ang huling aklat sa pagsisimula).\n\nMag-tap sa kaliwa o kanan ng screen, o gamitin ang mga page button, para magpalit ng pahina. I-tap ang gitna o pindutin ang Piliin para sa menu ng pagbabasa: Nilalaman, Hanapin, Pumunta sa pahina, Font at layout, Mga bookmark at highlight at iba pa. Ang pababa mula sa itaas na gilid ay nagbubukas ng mabilisang panel, ang pataas mula sa ibabang gilid ay papunta sa home; ganoon din ang pagpindot nang matagal sa Bumalik.\n\nPindutin nang matagal ang Piliin (o pindutin nang matagal ang larawan) para makita ang larawan nang buong screen: ang Kaliwa at Kanan ay dumadaan sa mga larawan ng pahina. Nag-zoom ang Piliin sa 2x, 3x at pabalik (double tap sa touch); kapag naka-zoom, nagpa-pan nang patagilid ang Kaliwa at Kanan, ang mga page button (o swipe) ay lumilipat pahalang at pababa. Bumabalik sa fit ang Bumalik, pagkatapos ay sa pahina (pindutin nang matagal para lumabas sa touch). I-tap ang kanang itaas na sulok para sa bookmark. Pindutin nang matagal ang salita para i-highlight ito. Sa mga button, pindutin nang matagal ang Kaliwa: gumagalaw ang Kaliwa at Kanan ayon sa salita, ang mga page button ayon sa linya, ang pagpindot sa mga ito nang matagal ay pumupunta sa mga dulo ng pahina at ayon sa talata; binubuksan ng Piliin ang highlight bar para sa salita, pinalalawak ito ng matagal na pagpindot sa Piliin sa pangungusap at talata (pagkatapos ay ginagalaw ng Kaliwa at Kanan ang dulo, ng matagal na pagpindot sa mga ito ang simula). Nagpapatuloy ang napili sa pagpapalit ng pahina. Sine-save ng I-export bilang Markdown ang mga tala mo."
