bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Nagpa-pair ng mga remote, keyboard at sensor, at ikinokonekta ang mga ito.
bluetooth.plugin.how = "Nagpa-pair ang Bluetooth ng mga remote, keyboard at sensor sa reader, kung may Bluetooth ito (ang X4 Pro).\n\nHinahanap ng Magdagdag ng device ang mga nasa abot; ilagay muna ang device sa pairing mode. Piliin ito, at kumpirmahin sa reader (ihambing ang numero kung may lumabas). Pagkatapos, ang mga key ng remote o keyboard ay magpapalit ng pahina at gagalaw sa mga menu; baguhin kung ano ang ginagawa ng bawat key sa Mga kontrol.\n\nSinasabi ng Mga remote kung kailan gumagana ang mga key nila: kapag naka-on dito, habang nagbabasa (nakakonekta habang nakabukas ang aklat, nakakatipid ng baterya), o palagi. Nakakalimutan ng menu button o ng matagal na pindot sa isang device ang device na iyon.\n\nAng sensor ay para sa mga plugin: i-on kung aling plugin ang puwedeng gumamit nito. Naka-off ang Bluetooth hangga't walang gumagamit nito."
