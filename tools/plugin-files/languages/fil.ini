opds.plugin.name = Mga OPDS catalog
opds.plugin.description = Nagba-browse ng mga OPDS catalog, dina-download ang mga aklat nila at pinananatiling naka-sync ang mga folder sa kanila.
opds.plugin.how = "Ang mga OPDS catalog ay mga online na aklatan gaya ng Project Gutenberg, Calibre-Web, Kavita o Komga. Ang plugin na ito ay nagba-browse at naghahanap sa mga ito na parang mga folder at dina-download ang mga aklat nila sa aklatan.\n\nBuksan ang Mga Catalog mula sa menu ng Mga Tool at piliin ang Magdagdag ng catalog: isang address at, kung kailangan ng catalog ng account, user name at password. I-tap ang catalog para i-browse ito; pindutin ito nang matagal (sa mga button, pindutin nang matagal ang Piliin) para i-sync, i-edit o alisin ito.\n\nKapag naka-on ang I-sync ang catalog na ito, dina-download ng I-sync ang mga catalog ang mga bagong aklat nito sa folder nito. Nililimitahan ng Mga aklat kada sync kung ilan ang kukunin ng isang sync, para hindi mapuno ng malaking catalog ang device. Gumagana ang Cloud folder (WebDAV) bilang kapalit ng catalog."
