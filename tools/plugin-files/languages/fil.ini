format-images.plugin.name = Mga larawan
format-images.plugin.description = Nagbubukas ng mga larawan (.jpg, .png, .gif) bilang aklat, isang pahina bawat isa.
format-images.plugin.how = "Nagbubukas mula sa aklatan ang mga larawan (.jpg, .png, .gif) gaya ng mga aklat, isang larawan bawat pahina, iniakma sa screen.\n\nPara basahin ang buong folder ng mga larawan, buksan ang unang larawan nito: susunod ang mga larawang kasunod nito sa folder, ayon sa pagkakasunod ng mga pangalan nila (2 bago ang 10). Ang larawang nasa dakong huli ng folder ay doon nagsisimula; hiwalay na natatandaan ang puwesto sa bawat isa. Binabasa ang folder na hanggang 300 larawan mula sa binuksan mo.\n\nAng file na hindi larawan, o masyadong malaki, ay ipinapakita ang pangalan nito. Para sa aklat na maraming larawan na may sariling pamagat, mas mainam na anyo ang comic book archive (.cbz)."
format-images.title = Larawan
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Nagbubukas ng mga Markdown file (.md), hal. mga tala.
format-markdown.plugin.how = "Nagbubukas ng mga Markdown file (.md), gaya ng mga tala, bilang aklat: mga heading, listahan, sipi at diin ayon sa nakalaan, hindi bilang mga simbolo.\n\nIlagay ang mga file sa folder ng aklatan at buksan mula sa aklatan. Ang unang heading ang pamagat nito; lumalabas ang mga larawang katabi ng file kung saan binabanggit ang mga ito ng text."
format-markdown.title = Markdown
format-mobi.plugin.name = Mga aklat na MOBI
format-mobi.plugin.description = Nagbubukas ng mga .mobi at .azw na file na walang DRM.
format-mobi.plugin.how = "Nagbubukas mula sa aklatan ang mga MOBI na aklat (.mobi, .azw) gaya ng anumang aklat, na walang kailangang i-set up. Galing sa aklat ang pamagat, mga may-akda, wika at cover, at ginagawa ang listahan ng nilalaman mula sa mga heading nito.\n\nKino-convert ang aklat sa unang beses na buksan mo ito, na tumatagal ng ilang segundo para sa mahaba; pagkatapos nito, agad na itong bumubukas. Ipinapakita ang text, mga heading, bold at italic, link at larawan.\n\nHindi mabubuksan ang mga aklat na may DRM (karamihan ng mga aklat na binili sa tindahan), ni ang mga aklat na may Huffman compression o nasa mas bagong anyong KF8 (.azw3): sasabihin ito ng PaperPaw kapag binuksan mo ang mga ito. Laging bumubukas ang kopya bilang EPUB, na ginawa gamit ang tool gaya ng Calibre."
format-mobi.title = Mga aklat na MOBI
format-rtf.plugin.name = Mga dokumentong RTF
format-rtf.plugin.description = Nagbubukas ng mga .rtf na file bilang aklat.
format-rtf.title = Mga dokumentong RTF
format-txt.plugin.name = Payak na text
format-txt.plugin.description = Nagbubukas ng mga payak na text file (.txt).
format-txt.plugin.how = "Nagbubukas mula sa aklatan ang mga payak na text file (.txt) gaya ng anumang aklat, na walang kailangang i-set up. Binabasa ng plugin ang text na UTF-8, UTF-16 at Windows-1252 at kusang hinahanap ang encoding.\n\nSinusunod ng mga talata ang mga blangkong linya sa file; kung wala ang file nito, bawat linya ay isang talata. Sa mga file ng Project Gutenberg, iniiwan ang text ng lisensya sa simula at sa dulo, at kinukuha ang pamagat at may-akda mula sa header.\n\nHindi kailanman nilo-load nang buo ang file, kaya bumubukas din ang napakalalaking text sa maliliit na device."
format-txt.title = Payak na text
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Nagbubukas ng mga XTC at XTCH na aklat, ang mga pre-rendered na pahina ng mga Xteink reader.
format-xtc.plugin.how = "Ang mga XTC at XTCH na file ay mga aklat na ang mga pahina ay naka-render na bilang mga larawan, gaya ng gawa ng mga converter para sa mga Xteink reader. Bumubukas ang mga ito mula sa aklatan gaya ng anumang aklat.\n\nDahil nakapirming larawan ang bawat pahina, hindi mapapalitan ang laki ng text o mailalagay sa ibang font. Itim at puti ang mga pahina o may apat na abo. Dina-decode ang bawat pahina kapag ipinapakita ito, kaya kaunting memorya lang ang kailangan, pati sa X4.\n\nKinukuha ang pamagat, may-akda at mga kabanata mula sa file kapag mayroon ito."
format-xtc.title = Mga pahinang XTC
help.plugin.name = Mga hint
help.plugin.description = Ipinapakita kung ano ang ginagawa ng mga kontrol ng screen, sa unang beses na bumukas ito.
help.plugin.how = "Sa unang beses na bumukas ang isang screen, may maikling paalala sa ibabaw nito na nagsasabi kung ano ang ginagawa ng mga kontrol nito: ang mga bahagi ng screen na pinupuntahan ng tap, may frame, at kung ano ang ginagawa ng mga button.\n\nSinasara ng tap o anumang button ang paalala, at hindi na ito babalik para sa screen na iyon. Pinapatay ng Wala nang hint ang lahat ng ito.\n\nSa mga setting, sa ilalim ng System, ino-on o ino-off ng Mga hint ang mga ito, at ipinapakita muli ng Ipakita muli ang mga hint ang paalala ng bawat screen nang isang beses pa."
