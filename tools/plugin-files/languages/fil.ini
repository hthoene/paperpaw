keyboard.plugin.name = Keyboard
keyboard.plugin.description = Nagpapasok ng text sa screen, sa pamamagitan ng touch o ng mga button.
keyboard.plugin.how = "Nagbubukas ang keyboard tuwing may kailangang text: paghahanap, password, tala o setting. Gumagana ito sa touch at sa mga button lang.\n\nSa mga button, gumagalaw sa hanay ang kaliwa at kanan, gumagalaw sa pagitan ng mga hanay ang mga page button, pinipindot ng Piliin ang key at kinakansela ng Bumalik; umiikot sa hanay ang kaliwa at kanan, at nananatili sa column mo ang pataas at pababa. Ginagawang malaking titik ng Shift ang susunod na titik; pindutin ito nang dalawang beses para sa lahat ng malalaking titik, at isa pa para huminto. Pindutin nang matagal ang isang titik (sa mga button: pindutin nang matagal ang Piliin dito) para sa malaking titik nito, na agad na napipili, at mga accent gaya ng é at è; sa German, ang ä, ö, ü at ß ay nakukuha mula sa a, o, u at s (sa mga button, sinasabi ito ng keyboard sa mga titik na iyon). Tinatapos ng OK; sa mga button, pindutin nang matagal ang Bumalik para tapusin mula saanman (kinakansela ng Bumalik lang), o pindutin nang matagal ang Piliin sa key na hindi titik. Inilalagay ng I-paste ang text sa clipboard, at hinahayaan ka ng Telepono, kung inaalok, na mag-type sa telepono mo.\n\nSa mga setting sa ilalim ng Device, Keyboard: pinipili ng Mga layout ng keyboard ang mga layout. Sa default, sinusunod nito ang wika ng menu; kung marami, may key na nagpapalit sa pagitan ng mga ito. Nagbibigay ang Mga umlaut key ng sariling key para sa ä, ö, ü at ß. Pinalalaki ng Laki ang mga key at titik; sa mga button lang, nananatili ang mga hanay na gaya ng sa keyboard ng computer. Sa mga touch screen, binabago ng Hugis ng key ang hitsura ng mga key. Sinisimulan ng Awtomatikong malaking titik ang bawat pangungusap sa malaking titik."
