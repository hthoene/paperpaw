reading-goal.plugin.name = Target sa pagbabasa
reading-goal.plugin.description = Mga minutong babasahin bawat araw, at isang pusa sa home screen na ang mood ay sumusunod sa pagbabasa ngayon.
reading-goal.plugin.how = "Ipinapakita ng pusa sa home screen mo kung kumusta ang pagbabasa ngayon: malungkot habang hindi ka pa nagbabasa, so-so pagkatapos ng kaunti, kuntento mula sa kalahati ng pang-araw-araw mong target, masaya kapag naabot mo na ito.\n\nIdagdag ang widget na Pusang nagbabasa sa home screen (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget), o piliin ang Pusa ng pagbabasa ngayon bilang sleep screen. Ang pag-tap sa pusa ay nagbubukas ng pang-araw-araw na target; ito ang target ng mga estadistika sa pagbabasa, na nagbibilang ng mga minutong nagbasa ka.\n\nSa mga setting, sa ilalim ng Pagbabasa, itinatakda ng Kuntento mula sa at Masaya mula sa kung mula sa anong bahagi ng target kuntento o masaya ang pusa, at ng Sariling mga larawan ang folder ng mga larawan (malungkot, so-so, kuntento at masaya) na ipapakita sa halip na ang mga pusa. Ang mga larawan ay mga PNG o JPEG na file; kung walang folder, lalabas ang mga pusa."
