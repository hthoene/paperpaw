settings.plugin.name = Mga Setting
settings.plugin.description = Ang mga pahina ng setting, binuo mula sa mga setting ng bawat plugin.
settings.plugin.how = "Ipinapakita ng Mga Setting ang lahat ng maitatakda sa PaperPaw at sa mga plugin nito, sa mga pahina. Hindi kailangan ng mga plugin ng sariling screen: ang idineklara nila ay lumalabas dito, sa mga grupo, na may paglalarawan ng bawat setting sa ilalim nito.\n\nBuksan ito gamit ang Mga Setting sa menu. I-tap ang grupo para buksan ito, pagkatapos ay ang setting para i-switch o piliin ito; may mga button na − at + ang mga numero. Sa mga button, pumunta sa setting at pindutin ang Piliin: binabago ng kaliwa at kanan ang numero, pinananatili ito ng Piliin, ibinabalik ng Bumalik ang naunang halaga.\n\nAgad na nag-a-apply ang mga pagbabago. Hinahanap ng Hanapin ang setting ayon sa mga salita at idinadagdag ng Mga advanced na setting ang mga bihirang kailanganin. Nagtatanong muna ang I-reset sa mga default at I-reset ang lahat."
