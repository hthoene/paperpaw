weather.plugin.name = Panahon
weather.plugin.description = Ang panahon ngayon at sa mga susunod na araw bilang mga widget, mula sa Open-Meteo.
weather.plugin.how = "Ipinapakita ng Panahon ang lagay ng panahon ngayon at sa mga susunod na araw bilang mga widget para sa home screen, mula sa Open-Meteo, na hindi nangangailangan ng account o key. Ipinapakita ng Panahon ngayon ang temperatura, ang kondisyon at iba pang mapipili; ipinapakita ng Forecast ang mga susunod na araw sa isang hanay o listahan.\n\nPumili muna ng lugar: sa mga setting, sa ilalim ng Panahon, Lugar (mag-type ng pangalan, pagkatapos ay piliin ito mula sa mga nahanap na lugar). Mga coordinate lang nito ang ipinapadala, at habang may ipinapakitang weather widget lang. Idagdag ang mga widget sa pag-edit ng home screen.\n\nKinukuha ang panahon nang hindi mas madalas kaysa sa sinasabi ng Mag-update nang hindi mas madalas kada, at habang may network lang: hindi nito kusang bubuksan ang Wi-Fi.\n\nData ng panahon mula sa Open-Meteo.com (https://open-meteo.com), sa ilalim ng Creative Commons Attribution 4.0 licence (CC BY 4.0)."
