widgets.plugin.name = Widget pack
widgets.plugin.description = Maraming iba pang widget para sa home screen: mga orasan, kalendaryo, sipi, aklat, tala at iba pa.
widgets.plugin.how = "Nagdaragdag ang widget pack ng maraming widget para sa home screen: mga orasan (analog, salita, tile, mundo), kalendaryo, ang taon hanggang ngayon, countdown, yugto ng buwan, at araw at petsa; sipi ng araw, mga tala, to-do, mga larawan, pagbati at ang logo ng PaperPaw; at para sa mga aklat, kasalukuyang binabasa, progreso, susunod, serye, mga paborito, highlight at ang aklatan sa mga numero. May widget din ng baterya.\n\nIdagdag ang mga ito gamit ang I-edit ang home screen sa menu (o matagal na pindot sa home screen), pagkatapos ay Magdagdag ng widget. May sariling mga setting ang bawat isa, gaya ng frame, laki at pagkakahanay. Ang pagpili sa widget na nagbabago, gaya ng sipi ng araw, ay nagpapakita ng susunod. Ang sarili mong mga sipi ay mapupunta sa quotes.txt sa .paperpaw/plugins/widgets sa card, bawat linya bilang text | may-akda. Kailangan ng mga time widget na nakatakda ang orasan; itinatakda ito ng Wi-Fi."
