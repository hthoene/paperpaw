puzzles.plugin.name = Mga Puzzle
puzzles.plugin.description = Sudoku, crossword at chess puzzle, offline, na may puzzle ng araw.
puzzles.plugin.how = "Mga puzzle para sa biyahe at sa waiting room, lahat ay offline: sudoku, crossword at chess puzzle. Buksan ang Mga Puzzle mula sa menu ng mga tool, o idagdag ang widget na Puzzle ng araw sa home screen (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget): ipinapakita nito kung gaano na kalayo ang sudoku ngayon, at binubuksan ito ng tap. Iisa ang sudoku ng araw buong araw.\n\nSudoku: ang kaliwa at kanan ay gumagalaw ng cursor nang parisukat-parisukat, ang pataas at pababa (ang mga page button) ay isang hanay. Binubuksan ng Piliin ang mga digit: pumili ng isa at piliin muli para ilagay ito, o Burahin para alisin ang laman ng parisukat. Pindutin nang matagal ang Piliin (o Menu) para marating ang mga button sa ilalim ng board: ginagawang pencil mark ng Mga tala ang mga digit, minamarkahan ng Suriin ang mga maling parisukat, binabawi ng Bawiin ang huling galaw, nagsisimula ang Bago ng puzzle ng antas na pipiliin mo (Madali, Katamtaman, Mahirap). May eksaktong isang solusyon ang bawat puzzle. Iniingatan ang laro kapag umalis ka. Sa touch screen, i-tap ang parisukat.\n\nMga crossword: maglagay ng mga .puz (Across Lite) o .ipuz na file sa folder na “puzzles” sa memory card; walang kasama. Gumalaw sa grid, pagkatapos ay piliin para i-type ang salita sa ilalim ng cursor sa keyboard (ang underscore ay nag-iiwan ng parisukat na walang laman). Ang mga button ay nagpapalit ng pahalang at pababa, nagpapakita ng listahan ng mga clue, sumusuri sa mga titik at naglalantad ng salita. Iniingatan ang mga titik para sa bawat file. Hindi mabubuksan ang mga scrambled na .puz file.\n\nMga chess puzzle: isang maliit na set mula sa Lichess puzzle database (CC0). Tumatalon ang kaliwa at kanan mula piyesa hanggang piyesa, piliin ang piyesang gusto mong ilipat, pagkatapos ay kaliwa at kanan sa mga puwede nitong puntahan, at piliin muli. Binabawi ang maling galaw. Minamarkahan ng Hint ang piyesang ililipat, pumupunta ang Susunod sa susunod na puzzle.\n\nMga parisukat lang na nagbabago ang iginuguhit muli ng board. Binibilang ng Mga Estadistika ang mga puzzle na nalutas mo."
