files.plugin.name = File browser
files.plugin.description = Inililista ang mga aklat at folder sa device at binubuksan ang mga ito.
files.plugin.how = "Inililista ng aklatan ang mga aklat sa folder ng aklatan mo, bawat isa ay may cover, pamagat, may-akda at kung gaano na kalayo ang nabasa mo. Nasa itaas, bilang card, ang huli mong binasang aklat, kaya isang tap lang, o isang pindot ng Piliin, ang pagpapatuloy ng pagbabasa. Habang naghahanap ng mga aklat ang aklatan, sinasabi nito kung ilan na ang nakita nito.\n\nPiliin kung ano ang ipapakita sa itaas ng mga aklat: lahat ng mga ito, ang mga binabasa mo, mga hindi pa nababasa o mga tapos na, o ang mga shelf (ayon sa may-akda, serye, tag, mga paborito, ang susunod na aklat ng bawat seryeng nasimulan mo). Mag-tap ng aklat para basahin ito; pindutin ito nang matagal (sa mga button, pindutin nang matagal ang Piliin) para buksan ito, markahan itong tapos na o hindi pa nababasa, makita ang impormasyon nito, ilipat ito sa archive o burahin ito. I-tap ang pamagat para sa menu ng aklatan: kung paano inaayos at ipinapakita ang mga aklat, paghahanap, ang folder ng aklatan at mga setting.\n\nItinatakda ang folder ng aklatan sa Mga Setting, sa ilalim ng Aklatan, bilang Folder ng aklatan; doon mo rin maipapakita ang mga aklat bilang grid ng mga cover. Para sa bawat ibang file, gamitin ang Mga File sa menu ng Mga Tool."
