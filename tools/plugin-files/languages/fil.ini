news.plugin.name = Balita
news.plugin.description = Kumukuha ng mga news feed (RSS, Atom) bilang mga aklat na babasahin.
news.plugin.how = "Ginagawang aklat ng Balita ang mga RSS o Atom na feed. Ang bawat feed ay nagiging isang aklat sa folder na News ng aklatan, na ang mga pinakabagong artikulo nito ay payak na text, para basahin gaya ng anumang aklat.\n\nBuksan ang Balita mula sa menu ng Mga Tool at piliin ang Magdagdag ng feed; nasa website ng pahayagan o blog ang address nito. Kinukuha ng Kunin ang balita ang lahat ng feed at pinapalitan ang mga naunang aklat. Pindutin nang matagal ang feed (sa mga button, pindutin nang matagal ang Piliin) para kunin o alisin ito nang mag-isa. Ang inalis na feed ay iniiwan ang aklat nito sa aklatan.\n\nNangangailangan ng network ang pagkuha. Ang Mga artikulo kada feed (Mga Setting, Aklatan) ang nagtatakda kung ilang artikulo ang hawak ng bawat aklat. Ipinapakita ng widget na Mga headline ng balita ang mga ito sa home screen."
