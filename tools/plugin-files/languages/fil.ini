wifi.plugin.name = Wi-Fi
wifi.plugin.description = Sumasali sa mga Wi-Fi network kapag kailangan at pinapatay ang radyo pagkatapos.
wifi.plugin.how = "Sumasali ang Wi-Fi sa network kapag kailangan ng plugin ang internet (catalog, sync, ang store, transfer) at pinapatay muli ang radyo isang minuto pagkatapos na walang gumamit nito, o agad kapag nagpakita ang Home o isang aklat, para makatipid ng baterya at memorya.\n\nBuksan ang Wi-Fi mula sa Mga Setting, o mula sa item na Wi-Fi sa status line. Inililista ng Mga Network ang mga nasa abot; pumili ng isa at i-type ang password nito, o piliin ang I-set up gamit ang telepono at i-type ang pangalan at password sa browser ng telepono mo sa halip na sa device. Inaalis ng Kalimutan ang naka-save na network.\n\nNananatili sa card ang mga password, iniingatan nang ligtas, at hindi na kailanman ipinapakita muli. Sa Kumonekta kapag kailangan, itinatakda mo kung gaano katagal mananatiling naka-on ang Wi-Fi pagkatapos ng huling paggamit, kung mananatili itong naka-on habang nagcha-charge, at kung aling naka-save na network ang mauuna kapag marami ang nasa abot."
