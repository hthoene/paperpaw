tasks.plugin.name = Mga Gawain
tasks.plugin.description = Mga to-do list na may due date at priyoridad, sa reader o naka-sync sa CalDAV server mo, na may mga home screen widget.
tasks.plugin.how = "Mga to-do list sa reader mo: mga gawain na may due date at priyoridad, tinatsekan kapag tapos na. Gumagana ang mga ito nang walang setup at walang network, at maaaring panatilihing kasabay ng CalDAV server (Nextcloud, Radicale, Baïkal, Fastmail at iba pa), kaya nasa telepono at computer mo rin ang parehong mga listahan.\n\nBuksan ang Mga Gawain mula sa menu ng mga tool. Ang unang hanay ang nagpapangalan sa ipinapakitang listahan; piliin ito para sa ibang listahan, para sa Ngayon at lampas na sa lahat ng listahan, para sa bagong listahan, para mag-sync, o para itakda ang account. Binubuksan ng Magdagdag ng gawain ang keyboard. Tinatsekan ng Piliin sa isang gawain ito (muli: hindi pa tapos). Pindutin nang matagal ang gawain o pindutin ang Menu para baguhin ang pamagat nito, ang due date nito (ngayon, bukas, sa isang linggo, o petsang itina-type mo gaya ng 2026-12-24) o ang priyoridad nito, o para alisin ito. Nauuna ang mga bukas na gawain, ayon sa araw nila at pagkatapos ay priyoridad; nananatili sa dulo ang mga tapos na sa loob ng isang linggo (itakda sa Mga Gawain sa mga setting), pagkatapos ay aalis na ang mga ito sa reader.\n\nMga widget para sa home screen (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget): ipinapakita ng Mga gawain ngayon ang due ngayon o lampas na, ipinapakita ng Listahan ng gawain ang isang listahan, binibilang ng Mga bukas na gawain ang mga ito, at ipinapakita ng Susunod na gawain ang susunod na gagawin. Ang pag-tap sa gawain sa widget ay nagtatsek nito; ang pag-tap sa heading ay nagbubukas ng mga listahan.\n\nPara mag-sync, piliin ang CalDAV account mula sa hanay ng listahan at ilagay ang address ng server, ang user name mo at isang password (mas mainam ang app password). Sapat na ang address ng server, hal. cloud.example.com/remote.php/dav; hinahanap ng reader ang mga listahan ng gawain mo mula roon. Ang bawat listahan ng gawain ng server ay nagiging listahan sa reader. Nagsi-sync ang reader kapag binuksan mo ang Mga Gawain, kapag pinili mo ang I-sync ngayon, at kapag naka-on na rin ang network; ang binago mo nang walang network ay naghihintay at ipapadala mamaya. Kung binago ang gawain sa reader at sa ibang lugar sa pagitan, kinukuha ang bersyon ng server at pinananatili ang sa iyo bilang bagong gawain sa tabi nito, kaya walang nawawala. Nananatili ang mga tala, alarma at lahat ng iba pang mayroon ang gawain sa server. Ang mga gawaing umuulit ay ipinapakita pero binabago kung saan mo ginawa. Kayang hawakan ng reader ang hanggang 200 gawain sa 12 listahan."
