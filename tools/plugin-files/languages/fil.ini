power.plugin.name = Power
power.plugin.description = Pumipili ng power mode, mano-mano o ayon sa baterya: Karaniwan, Pagtitipid, Offline.
power.plugin.how = "Pinipili ng Power kung paano gagastusin ng PaperPaw ang baterya: Karaniwan, Pagtitipid o Offline. Ginagawa ng Pagtitipid ang puwedeng ipagpaliban sa mas magagandang sandali; pinananatiling naka-off ng Offline ang radyo. Pumipili ang Auto ayon sa baterya.\n\nPalitan ang mode sa mabilisang panel, kung saan ipinapakita ng Power ang mga mode nang magkakatabi, o sa Mga Setting sa ilalim ng Power. Doon mo rin itinatakda ang mga antas kung saan lumilipat ang Auto sa Pagtitipid at sa Offline, at kung mananatili itong Karaniwan habang nagcha-charge.\n\nSa mga status line, ipinapakita ng Power mode ang dahon habang nagtitipid at ekis na Wi-Fi habang offline, at wala sa Karaniwan.\n\nPindutin nang matagal ang power button para magbukas ng maliit na menu: Sleep, I-off (kung kaya ng PaperPaw), I-restart, at sa mga touch device, I-lock ang touch o I-unlock ang touch. Pinapatulog pa rin ng maikling pindot ang device. Lumalabas sa menu ang Bumalik."
