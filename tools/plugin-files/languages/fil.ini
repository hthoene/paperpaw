pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Isang focus timer na may mga round ng trabaho at pahinga, mga widget at pang-araw-araw na bilang.
pomodoro.plugin.how = "Isang Pomodoro timer: magtrabaho sa mga nakatutok na round, pagkatapos ay magpahinga. Hindi ito nangangailangan ng setup: 25 minuto ng focus, 5 ng pahinga, at pagkatapos ng apat na round, mahabang pahinga na 15.\n\nBuksan ang Pomodoro mula sa menu ng mga tool at pindutin ang Simulan, o idagdag ang mga widget nito sa home screen (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget): ipinapakita ng Pomodoro timer ang yugto at ang natitirang minuto, ang Pomodoro start/pause ay isang button, at binibilang ng Pomodoro ngayon ang mga round na natapos mo, kasama ang pang-araw-araw mong target. Ang pag-tap sa timer ay nagsisimula o nagpo-pause nito; pindutin ito nang matagal para buksan ang buong screen.\n\nPatuloy na tumatakbo ang timer kapag umalis ka sa screen, at nagpapatuloy ayon sa orasan pagkatapos ng restart. Habang natutulog ang reader, walang tumatakbo: sasabihin pagkagising ang yugtong natapos sa pagitan. Sinasabi sa iyo ng isang paunawa kapag tapos na ang isang yugto. Para makatipid ng baterya, nag-a-update ang orasan isang beses kada minuto (bawat sampung segundo sa huling minuto sa buong screen) at hindi kailanman pinananatiling gising ang reader.\n\nSa Pomodoro sa mga setting, itinatakda mo ang haba at ang mga round ng isang set, at kung kusang magsisimula ang susunod na yugto. Sa Iba pa: kislap ng screen o pagkurap ng front light kapag natapos ang yugto at pang-araw-araw na target."
