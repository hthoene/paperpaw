dictionary.plugin.name = Diksyunaryo
dictionary.plugin.description = Naghahanap ng mga salita sa mga StarDict na diksyunaryo.
dictionary.plugin.how = "Hinahanap ng diksyunaryo ang isang salita mula sa aklat sa mga StarDict na diksyunaryo at ipinapakita ang mga kahulugan sa isang panel sa ibabaw ng ibabang bahagi ng screen.\n\nSa reader, pindutin nang matagal ang isang salita at piliin ang Hanapin; sa mga button, gamitin ang Pumili ng text sa ilalim ng Iba pa. Kopyahin ang mga folder ng diksyunaryo (na may mga .ifo, .idx at .dict file) sa folder na “dictionaries” sa device, kasama ang mga subfolder, o pumili ng ibang folder sa Mga Setting, sa ilalim ng Pagbabasa, bilang Folder ng diksyunaryo (isang advanced na setting). Naghahanda ang unang paghahanap ng maliit na index para sa bawat diksyunaryo, na tumatagal nang sandali.\n\nSa panel, ang mga page button o Pataas at Pababa ay nag-i-scroll ng mahahabang kahulugan, at isinasara ito ng Bumalik. Sa touch, mag-tap sa labas nito para isara."
