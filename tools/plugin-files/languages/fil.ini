fonts-browser.plugin.name = Iba pang font
fonts-browser.plugin.description = Nagpapakita ng mga font mula sa internet, bawat isa ay may sample, at dina-download ang mga ito para gamitin sa pagbabasa.
fonts-browser.plugin.how = "Inililista ng Iba pang font ang mga font mula sa isang font library sa internet, ang bawat pangalan ay nakasulat sa sarili nitong font, at dina-download ang mga gusto mong gamitin sa pagbabasa.\n\nMakikita mo ito sa dulo ng listahan ng mga font kung saan pinipili ang font sa pagbabasa, sa Mga Setting, sa ilalim ng Pagbabasa, bilang Font; may parehong entry ang mga status line para sa font nila. Mag-tap ng font (sa mga button, pindutin ang Piliin) para makita itong mas malaki na may sample na pangungusap, pagkatapos ay piliin ang I-download. Puwede mong lisanin ang pahina habang nagda-download. Kapag tapos na, piliin ang Basahin gamit ang (pangalan ng font), o Gamitin para sa mga status line. Kinukuha ng I-update ang mas bagong bersyon, binubura ng Alisin ang font sa device.\n\nKailangan nito ng Wi-Fi.\n\nMGA SARILI MONG FONT\n\nKatabi ng Iba pang font, may Mga sarili mong font ang parehong listahan, na nagpapakita ng bahaging ito ng tulong. Ang sarili mong font ay isang .ttf o .otf na file, halimbawa mula sa Google Fonts.\n\nSa Android at iba pang device na gumuguhit ng mga font file: kopyahin ang file sa folder na fonts (sa Android: PaperPaw/fonts sa shared storage), i-restart ang PaperPaw at piliin ang font sa Mga Setting, sa ilalim ng Pagbabasa, bilang Font.\n\nSa Xteink X4 at X4 Pro: nagbabasa ang mga reader na ito ng mga font pack, hindi ng mga font file, dahil hindi kakasya sa memorya nila ang mga font file. Gumawa ng pack sa computer gamit ang paperpaw-fontgen, para sa bawat istilong mayroon ka (kailangan ang regular):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nGumagawa ito ng folder na plugins/font-my-font. Kopyahin ito sa folder na plugins sa memory card, mag-restart, at piliin ang My Font bilang Font. Ang pack ng isang istilo ay mga kalahating megabyte para sa mga letrang Latin; ang mga istilong iniwan mo ay iginuguhit sa regular. Sinasabi ng tool kung ilan sa mga titik na hiniling mo ang mayroon ang font (idinadagdag ng --chars latin,cyrillic,greek ang mga script): hindi maipapakita ng font na walang mga titik ng aklat mo ang mga ito, kaya maghanap ng sumasaklaw sa script nito.\n\nGumagana nang pareho ang mga font mula sa Iba pang font at hindi nangangailangan ng computer.\n\nPara sa mas malinaw na maliit na text sa e-ink panel, idagdag ang --hinting light sa command: iniaangkop nito ang mga titik sa pixel grid, gaya ng pagkakagawa ng mga default na font. Kung wala ito, iginuguhit ang mga titik ayon sa disenyo ng font; mas matindi ang pag-aangkop ng --hinting normal at --hinting mono. Pinakamainam na huwag gamitin ito sa mga font na may mga marka, gaya ng Arabic o Devanagari."
