sleep.plugin.name = Sleep screen
sleep.plugin.description = Nagpapakita ng natutulog na pusa, ang cover ng aklat, ang mga larawan mo o isang mensahe habang natutulog ang device.
sleep.plugin.how = "Pinapasya ng sleep screen kung ano ang ipapakita ng screen habang natutulog ang device. Pinananatili ng e-ink ang larawan nang walang kuryente.\n\nPiliin ito sa mga setting, sa ilalim ng Device, Sleep screen, gamit ang Ipakita: isang natutulog na pusa (ang default), ang cover ng aklat, ang mga larawan ko, ang logo at “Natutulog”, mga widget, ang pahina kung ano ito, o ang pahina na may larawan. Ipinapakita ng Mga larawan ko ang mga file ng folder na Pictures nang isa-isa.\n\nKung walang cover o larawan, lalabas ang pusa. Kung ang system mismo ang gumuguhit ng sleep screen, nakatago ang mga setting na ito.\n\nAng off screen, Ipakita kapag in-off, ay iginuguhit nang isang beses habang ino-off ang device, mula sa power menu o pagkatapos ng oras ng I-off pagkatapos ng sleep (hindi kapag pinutol ng mahinang baterya ang kuryente). Katulad ito ng sleep screen maliban kung piliin mo ang logo at “Naka-off”, ang pusa, ang cover o ang mga larawan ko. Maaaring mag-alok ang ibang plugin ng screen para dito.\n\nAng screen ng pagsisimula at ng pag-restart, Ipakita kapag nagsisimula at Ipakita kapag nagre-restart, ay sariling screen ng device maliban kung may ibang plugin na nag-aalok ng screen para sa mga ito. Hindi pa tumatakbo ang mga plugin habang nagsisimula ang device: iginuguhit nang maaga ang screen na pinili para sa pagsisimula, habang ino-off o nire-restart ang device, at ipinapakita sa susunod na pagsisimula. Ang screen na hindi handa sa oras, o larawang sira, ay nagbibigay-daan sa sariling screen ng device; ino-off o nire-restart ang device sa anumang kaso."
