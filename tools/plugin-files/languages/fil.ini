store.plugin.name = Plugin store
store.plugin.description = Naghahanap, nag-i-install, nag-a-update at nag-aalis ng mga plugin para sa device na ito.
store.plugin.how = "Hinahanap ng Plugin store ang mga plugin para sa device na ito sa internet at ini-install, ina-update at inaalis ang mga ito. Buksan ito mula sa Mga Tool; kailangan nito ng Wi-Fi.\n\nIpinapakita ng simula ang inirerekomenda ng aklatan, ang bago o sikat ngayon, pagkatapos ay ang mga grupo. Inililista ng grupo ang mga plugin nito sa patas na halo na nagbabago araw-araw, para makita ang bawat plugin; ayusin ang mga ito mula A hanggang Z, ayon sa pinakabago o ayon sa huling update, at pumunta sa isang titik sa mahahabang listahan. Magbukas ng isa para makita ang pahina nito, kasama ang laki at ang memoryang kukunin nito, pagkatapos ay piliin ang I-install, I-update o Alisin. Ina-update ng I-update lahat ang bawat naka-install na plugin.\n\nTumatakbo ang mga code plugin na may buong access sa device: sinasabi ito ng store at nagtatanong muna, at nagsisimula ang mga ito pagkatapos ng restart. Kung may mali sa isa, nagsisimula ang PaperPaw nang walang mga code plugin at sinasabi kung alin. Itinatakda ng Plugin library kung saan galing ang listahan.\n\nInililista rin ng Mga plugin ng komunidad, sa Mga Setting, System, ang mga plugin na inilathala ng iba sa GitHub. Walang sumuri sa mga ito: minamarkahan ang mga ito ng Hindi nasuri, ipinapakita ng pahina ng code plugin ang key na ipinirma rito, at hindi ini-install ang update na pinirmahan ng ibang key.\n\nAng Mga Pinagmulan, ang huling hanay ng simula, ay nagdaragdag ng mga listahan ng plugin ng iba ayon sa address nila (https://…/plugins.json), naglilista ng isa sa mga ito kapalit ng sa PaperPaw, o nag-aalis nito. Sa halip na mag-type, maglagay ng file na sources.txt na may isang address sa bawat linya sa .paperpaw/plugins/store sa card: lalabas ang mga address sa Mga Pinagmulan bilang bago. Hindi sinusuri ng PaperPaw ang pinagmulan o ang mga plugin nito, at kinokontak ng device ang server ng pinagmulan. Pinipirmahan ng pinagmulan ang listahan nito; itinatago ng device ang key ng unang listahang binabasa nito at mula noon ay tumatanggap lang ng mga listahan at code plugin na pinirmahan ng key na iyon. Ang plugin ay nakakakuha lang ng mga update mula sa pinagmulang pinag-installan nito. Laging nandoon ang sariling library ng PaperPaw at hindi ito maaalis; ang paglabas sa store ay bumabalik dito."
