home.plugin.name = Home screen
home.plugin.description = Ang panimulang pahina: mga pahina ng widget, gaya ng binabasang aklat at mga tool.
home.plugin.how = "Binubuo ng mga pahina ang home screen, bawat isa ay grid ng mga widget at tool tulad sa telepono. Sa simula, nasa isang pahina ang orasan, ang binabasa mong aklat at ang mga kamakailang nabasang aklat, at nasa susunod ang lahat ng tool.\n\nMag-tap ng item para buksan ito, at mag-swipe o gamitin ang mga page button para magpalit ng pahina. Sa mga button lang, inililipat ng mga arrow button mula sa isang item patungo sa susunod at binubuksan ito ng Piliin.\n\nPara ayusin ito, pindutin nang matagal ang home screen, i-tap ang lapis sa ilalim ng pahina o piliin ang I-edit ang home screen sa menu. I-drag ang mga item para ilipat ang mga ito o mag-tap ng isa para sa mga opsyon nito, pati sa mga button. Nandoon din ang Magdagdag ng widget. Nasa mga setting ang Mga Column at Mga Hanay, sa ilalim ng Hitsura, sa seksyong Home screen.\n\nSa screen na nakatagilid, ipinapakita ng home screen ang parehong mga item na may mas maraming column, napupuno ang bawat pahina bago ang susunod, at ang mga card ay hindi hihigit sa mga 110 mm ang lapad; walang binabago sa inayos mo nang patayo. Ayusin ito nang nakatagilid at pinananatili ang layout na iyon para sa oryentasyong iyon nang mag-isa: idinadagdag sa pareho ang mga bagong widget. Ibinabalik ng I-reset ang landscape layout sa Idagdag (habang nag-e-edit) ang hinango. Ang pag-alis ng widget o tool sa isang oryentasyon ay hindi nag-aalis nito sa isa pa."
