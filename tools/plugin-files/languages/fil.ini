calendar.plugin.name = Kalendaryo
calendar.plugin.description = Ang mga kalendaryo mo sa reader: agenda, araw, linggo at buwan mula sa CalDAV, iCal at mga file, mga kaarawan mula sa mga contact, mga home widget at sleep screen.
calendar.plugin.how = "Ang mga kalendaryo mo sa reader: agenda ng mga susunod na araw, isang araw, isang linggo at isang buwan, kasama ang mga event ng mga kalendaryong CalDAV (Nextcloud, Radicale, Baïkal, Fastmail at iba pa), ng mga iCal address (.ics, webcal://), ng mga calendar file sa card at ng mga kaarawan at anibersaryo ng mga contact mo (CardDAV). Nagbabasa lang ng mga kalendaryo ang reader; hindi nito binabago ang mga ito.\n\nBuksan ang Kalendaryo mula sa menu ng mga tool. Ang unang hanay ang nagpapangalan sa view; piliin ito, o pindutin nang matagal ang anumang hanay o pindutin ang Menu, para magpalit sa pagitan ng Agenda, Araw, Linggo, Buwan at Mga Kaarawan, para magdagdag ng mga kalendaryo o para mag-sync. Sa Araw at Linggo, ang unang dalawang hanay ay lumilipat sa araw o linggo bago at pagkatapos (ganoon din ang mga page key); sa Buwan, ginagalaw ng mga arrow key ang araw, ng mga page key ang buwan, at binubuksan ng Piliin ang araw. Ipinapakita nang buo ng Piliin sa isang event: kailan, saan, aling kalendaryo at kung paano ito umuulit. Bumabalik nang isang hakbang ang Bumalik.\n\nMagdagdag ng kalendaryo sa Mga Kalendaryo (sa menu, o Kalendaryo sa mga setting). Piliin ang uri nito: isang CalDAV account (sapat na ang address ng server, hal. cloud.example.com/remote.php/dav; bawat kalendaryong may mga event ay nagiging bahagi ng view), isang iCal address (kalendaryong inilathala bilang .ics), isang calendar file sa card, o mga contact (isang CardDAV address book: ipinapakita ng reader ang mga kaarawan at anibersaryong nakasave sa mga ito). Ilagay ang address, para sa account ang user name at password mo (mas mainam ang app password; iniingatan ito kasama ng mga password ng reader), at isang pangalan. May marka ang bawat kalendaryo (tuldok, bilog, abong tuldok o parisukat) na puwede mong baguhin, para makilala mo ang mga ito; hanggang anim na kalendaryo.\n\nAng mga umuulit na event (araw-araw, lingguhan, buwanan, taunan, na may mga araw ng linggo, bilang, petsa ng pagtatapos at mga laktaw na araw), mga event na buong araw at mga event sa ibang time zone ay ipinapakita ayon sa sariling orasan ng reader. Pinapanatili ng reader ang mga event mula animnapung araw bago hanggang animnapung araw pagkatapos ng ngayon, hanggang 240, at ipinapakita ang mga ito nang walang network. Ang mga rule na hindi nito mabasa ay ipinapakita ang event nito nang isang beses.\n\nBinabasa ang mga kalendaryo kapag binuksan mo ang kalendaryo (hanggang isang beses bawat limang minuto), kapag pinili mo ang I-sync ngayon, at, ayon sa itinakda mo sa Kalendaryo sa mga setting, kapag naka-on na rin ang network o kapag nagsimulang mag-charge. Hindi kailanman bubuksan ng reader ang radyo nito para rito, maliban kung hihilingin mo ang I-sync ngayon.\n\nMga widget para sa home screen (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget): ipinapakita ng Ngayon ang petsa at ang laman ng araw, ng Susunod na event ang susunod na event, ng Agenda ang mga susunod na araw, ng Buwan ang isang buwan na may tuldok sa ilalim ng mga araw na may event, at ng Mga Kaarawan ang mga susunod na kaarawan. Binubuksan ng pag-tap sa event ang event, binubuksan ng pag-tap sa araw ng buwan ang araw na iyon. Maaaring ipakita ng sleep screen ang agenda ngayon: piliin ang Kalendaryo sa Sleep screen sa mga setting."
