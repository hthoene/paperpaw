lock.plugin.name = Screen lock
lock.plugin.description = Isang PIN, pattern o password kapag nagising ang device; naka-lock ang touch habang nagbabasa.
lock.plugin.how = "Humihingi ang screen lock ng PIN, pattern o password kapag nagsimula ang PaperPaw at kapag nagising ang device. Naka-off ito sa simula. Pinipigilan lang nito ang kaswal na paggamit: nasa SD card ang code at ang bilang ng maling subok, kaya sinumang kumuha ng card, mag-edit nito o magpalit nito ay nakalalampas sa lock.\n\nItakda ito sa mga setting, sa ilalim ng Device, Screen lock: ilagay ang code na ginagamit kung mayroon, piliin ang uri, pagkatapos ay ang bagong code nang dalawang beses. Sa mga touch screen lang inaalok ang pattern.\n\nPagkatapos ng limang maling subok, maghihintay ng kalahating minuto ang susunod. Agad na nila-lock ng I-lock ngayon at puwede itong ilagay sa button, galaw o rule. Puwedeng i-off ang I-lock pagkatapos magising, para tunay na pagsisimula lang (pag-on o restart) ang nagla-lock, maliban kung simula ang bawat paggising, gaya ng X4 sa baterya.\n\nTouch lock, kasama nito: ang I-lock ang touch sa mabilisang panel at menu ng pagbabasa ay nagpapawalang-bisa sa mga tap, swipe at pen habang gumagana pa rin ang mga button, hal. para magbasa nang nakapatong ang kamay sa screen. Para i-unlock, mag-tap nang dalawang beses gamit ang isang daliri at panatilihin itong nakadiin sandali; ang pagpindot nang matagal sa power button ay nagbubukas ng menu ng Power, kung saan ginagawa ito ng I-unlock ang touch gamit ang mga button; sa X4 Pro, agad na nag-a-unlock ang pagpindot nang matagal sa home key."
