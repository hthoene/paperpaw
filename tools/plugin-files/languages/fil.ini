stats.plugin.name = Mga estadistika sa pagbabasa
stats.plugin.description = Nire-record kung gaano katagal at kung gaano karami ang binasa mo, may kalendaryo at mga numero ng bawat aklat.
stats.plugin.how = "Nire-record ng Mga estadistika sa pagbabasa kung gaano katagal mong binasa ang bawat pahina. Makikita mo ito bilang pangkalahatang-tanaw na may ngayon, linggo at streak mo, bilang kalendaryo, at may mga numero ng bawat aklat.\n\nBuksan ito mula sa Mga Tool, o mula sa Iba pa sa reader. Sa mga setting, sa ilalim ng Mga estadistika sa pagbabasa, puwede mong i-off ang I-record ang pagbabasa, magtakda ng Pang-araw-araw na target, at itakda ang Pinakamaikling pahina at Pinakamahabang pahina na mabibilang, para hindi masira ang mga numero ng pagpapalipat-lipat o ng aklat na naiwang bukas.\n\nIbinabahagi ng Sync sa KOReader ang mga estadistika sa KOReader sa pamamagitan ng WebDAV folder. Kinukuha rin nito ang mga estadistika ng KOReader sa parehong device. Kailangang nakatakda ang orasan para makapag-record: kung hindi, kumonekta minsan sa Wi-Fi."
