mail.plugin.name = Mail
mail.plugin.description = Nagbabasa at nagpapadala ng e-mail gamit ang password o app password (IMAP at SMTP), walang pag-login sa browser.
mail.plugin.how = "Nagbabasa at nagpapadala ng e-mail ang Mail sa IMAP at SMTP. Nagsa-sign in ito gamit ang address at password mo, nang walang pag-login sa browser, kaya gumagana ito sa anumang provider na nagpapahintulot nito.\n\nMag-set up ng account sa Mga Setting, Mail. Piliin ang provider mo, i-type ang address at ang password. Karamihan ng provider ay humihingi ng app password: gumawa nito sa mga setting ng seguridad ng account mo at gamitin iyon dito. Madalas na hindi gumagana ang karaniwan mong password, at hindi ito napupunta kahit saan maliban sa server ng provider mo. Itinatago ito kasama ng mga password at key.\n\nBuksan ang Mail sa mga tool. Kinukuha ng Tingnan ang mail ang pinakabagong mga mail at ang mga folder. Itinatago sa card ang mga mail, kaya mababasa mo ang mga ito nang walang network. Kumokonekta ang device, kumukuha at nadidiskonekta, kaya sandali lang naka-on ang Wi-Fi.\n\nKung wala sa listahan ang provider mo, piliin ang Sariling mga server at itakda ang mga pangalan ng server, port at seguridad sa mga advanced na setting. Ang server na ang certificate ay walang awtoridad na nagpapatunay ay magtatanong nang isang beses kung pagkakatiwalaan ito; ihambing ang fingerprint sa ipinapakita ng provider mo.\n\nAng mail na may nakalakip na aklat (EPUB, PDF at iba pa, hanggang 2 MB) ay may Buksan ang aklat sa ilalim nito: kinukuha nito ang file, inilalagay sa aklatan mo at binubuksan ito.\n\nPara makita ang bagong mail nang hindi binubuksan ang Mail, i-on ang Tingnan ang bagong mail sa background sa Mga Setting, Mail, at piliin kung gaano kadalas (bawat 15, 30 o 60 minuto). Naka-off ito hanggang i-on mo. Pagkatapos ay kumokonekta ang reader paminsan-minsan sa ligtas na koneksyon habang gising ito at online, isang account pagkatapos ng isa, at ina-update ang bilang ng hindi pa nababasa sa Home. Gumagamit ito ng kaunting baterya. Itinitigil ng pagbubukas ng Mail ang tumatakbong pagsusuri.\n\nIpinapakita ng mga widget sa home screen ang bilang ng hindi pa nababasa, ang pinakabago at ang mga may bituing mail, isang mailbox, at isang shortcut para sumulat ng mail."
