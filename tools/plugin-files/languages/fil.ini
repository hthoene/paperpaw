keys.plugin.name = Mga button at galaw
keys.plugin.description = Ang ginagawa ng bawat button, tap zone at swipe, na mababago sa device.
keys.plugin.how = "Ipinapakita ng Mga button at galaw kung ano ang ginagawa ng bawat button, tap zone at swipe, at hinahayaan kang baguhin ito sa device.\n\nBuksan ito sa mga setting, sa ilalim ng Device. Piliin muna kung saan mag-a-apply ang pagbabago: Saanman, Habang nagbabasa, Sa home screen, Sa aklatan o sa isang tool. Pagkatapos ay pumili ng input, gaya ng button na pinindot nang matagal o swipe papasok mula sa gilid, at pumili ng aksyon mula sa listahan, na puwede mong hanapin. Ibinabalik ng Ayon sa standard ang itinakda ng mga plugin at ng layout ng button.\n\nSa X4, tinatanggihan ang pagbabagong mag-iiwan ng walang button na pampili, pambalik o pang-usad. Binabawi ng I-reset ang mga button at galaw sa dulo ang bawat pagbabago."
