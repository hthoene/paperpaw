picture-home.plugin.name = Home screen na may larawan
picture-home.plugin.description = Isang home screen na may sarili mong larawan sa likod ng mga widget, at status bar na ikaw ang nagko-configure.
picture-home.plugin.how = "Pinapalitan ng Home screen na may larawan ang home screen habang naka-on ito: ang sarili mong larawan sa likod ng mga widget, at ang mga pahina ng widget at tool na inaayos mo. I-off ito sa plugin manager at babalik ang built-in na home screen, kasama ang sarili nitong mga pahina.\n\nMaglagay ng mga larawan (JPEG, PNG o GIF) sa folder sa card (wallpapers bilang default), pagkatapos ay pumili ng isa sa Mga Setting, I-customize, Home screen na may larawan. Sinasabi ng Akma kung paano nito pupunan ang screen (punan, buong larawan, iunat, orihinal na laki, tile), ng Posisyon kung aling bahagi ang mananatili, ng Zoom kung gaano kalaki, at ng Paliwanagin ang larawan kung gaano ito kaputla: mas madaling basahin ang mga widget sa mas maputlang larawan. Inihahanda nang isang beses ang larawan para sa bawat laki ng screen, na tumatagal nang sandali.\n\nNakalagay ang mga widget sa mga plate sa ibabaw ng larawan. Ayusin ang pahina gaya sa built-in na home screen: ang lapis sa ilalim ng pahina, o I-edit ang home screen sa menu.\n\nAng status bar (oras, Wi-Fi, baterya, o ang piliin mo) ay puwedeng naka-on, naka-off o awtomatiko, sa itaas o sa ibaba, buong lapad o maliit na pill sa kaliwa, gitna o kanan, sa maliwanag, madilim o abong plate o sa mismong larawan. Puwede ring naka-on, naka-off o awtomatiko ang hanay na nagpapangalan sa mga button (sa X4). Ang awtomatiko ay nangangahulugang ipinapakita ito ng pindot sa button nang ilang segundo; walang ibang ginagawa ang pindot na iyon.\n\nSinasabi ng Pag-render ng larawan kung paano iginuguhit ang larawan: Antas ng abo sa bawat abong mayroon ang screen (mas mabagal sa X4), May dither sa mga itim at puting tuldok (mabilis), o Awtomatiko, gaya ng ginagawa ng built-in na home screen: antas ng abo kapag iginuguhit ang screen, mga tuldok pagkatapos ng unang pagbabago. Kung walang antas ng abo ang screen, bumabalik sa mga tuldok ang antas ng abo."
