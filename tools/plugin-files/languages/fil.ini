vocabulary.sd.readme = "Mga flash card mula sa mga file\n\nMaglagay rito ng file para sa bawat deck: ang Spanish.tsv ay gumagawa ng deck na Spanish.\nMga file: .tsv, .csv o .txt, naka-save bilang UTF-8, o .apkg: isang Anki deck, na-export na naka-tick ang Support older Anki versions. Ang unang tatlong field ng mga tala nito ay nagiging harap, likod at halimbawa; hindi binabasa ang scheduling at media nito, at hindi kailanman nagsusulat ng Anki file ang PaperPaw.\n\nIsang card bawat linya: harap, likod at halimbawa (opsyonal), pinaghihiwalay ng tab, kuwit o semicolon. Ang unang linya ay puwedeng magpangalan sa mga column: front, back, example. Halimbawa:\n\nPusa\tcat\tNatutulog ang pusa.\n\nPagkatapos ay buksan ang Mga flash card sa reader, piliin ang Mga card sa SD card at pagkatapos ay I-update ang mga deck mula sa card.\n\nMabuting malaman:\n- Nananatili sa reader ang mga deck, kasama ang natutunan mo. Binabasa ang file kapag bago o nabago ito, at idinaragdag ang mga card nito sa deck o binabago roon.\n- Baguhin ang likod o ang halimbawa ng card sa file: magbabago ang card at pananatilihin ang progreso mo.\n- Baguhin ang text sa harap ng card: ituturing itong bagong card, at magsisimulang muli ang luma. Itinutugma ang mga card ayon sa text sa harap, hindi binibilang ang mga espasyo at malalaking titik. I-save ang deck sa file (Mga card sa SD card, I-save ang deck sa card) at may numero ang bawat card sa id column: baguhin doon ang harap, panatilihin kung ano ang unang dalawang linya ng file, at mapapanatili ng card ang natutunan mo.\n- Isinusulat ng pag-save ang mga card ng deck. Ang nasa file na hindi card (linyang walang harap) ay hindi pinananatili; ang file na nandoon ay kinokopya sa _name.bak.tsv.\n- I-save ang file bilang CSV UTF-8 (hindi UTF-16, hindi sariling format ng spreadsheet). Ang file na higit sa 4 MiB o 20,000 linya ay hindi binabasa: hatiin ito.\n- Ang linyang buburahin mo sa file ay hindi nagbubura ng card sa deck, maliban kung i-on mo ang Alisin ang mga card na wala para sa deck na iyon. Pagkatapos ay mawawala ang card kasama ang natutunan mo.\n- Hindi binabasa ang mga file na nagsisimula ang pangalan sa _.\n"
