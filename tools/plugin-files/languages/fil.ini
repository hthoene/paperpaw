battery.plugin.name = Paggamit ng baterya
battery.plugin.description = Nire-record ang baterya at ipinapakita kung gaano ito katagal.
battery.plugin.how = "Itinatala ng Paggamit ng baterya ang charge mga isang beses kada minuto habang gising ang device, kasama ang ginawa nito: mga pag-refresh ng screen at napalitang pahina. Mula rito, kinakalkula nito kung gaano karami ang nagagamit sa isang oras na gising at sa 100 pahina, at kung gaano katagal tatagal ang baterya sa bilis na iyon.\n\nBuksan ang Baterya mula sa menu ng Mga Tool. Ipinapakita nito ang charge ngayon, ang pagkakagising na ito, ang paggamit sa baterya hanggang ngayon at ang mga huli mong oras na gising. Nagpapalit ito ng pahina gamit ang mga page button, o sa pag-tap sa mga arrow sa itaas.\n\nKailangan ng ilang oras ng pagbabasa sa baterya bago magkaroon ng saysay ang mga numero. Naka-on bilang default ang pagre-record at puwedeng i-off sa Mga Setting, sa ilalim ng Device, Power, bilang I-record ang paggamit ng baterya."
