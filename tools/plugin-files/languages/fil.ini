menu.plugin.how = "Inililista ng menu ang mga puwede mong gawin at itakda. Bumubukas ito sa ibaba ng screen, sa ibabaw ng anumang nakabukas: habang nagbabasa, i-tap ang gitna ng screen o pindutin ang Piliin. I-tap o piliin ang isang entry para patakbuhin ito.\n\nIpinapakita ng mga setting sa menu ang halaga nila at nagbabago sa mismong lugar, kaya nananatiling bukas ang menu. Ang entry na may mga karagdagang entry ay nagbubukas ng submenu.\n\nMag-swipe pababa mula sa itaas na gilid para sa mabilisang panel: ang madalas mong binabago, bilang mga button. I-tap ang button para i-switch ito, pindutin ito nang matagal para sa mga setting nito. Sa mga button lang, pumipili ang mga arrow button, nag-i-switch ang Piliin at nagsasara ang Bumalik. Sa Hitsura, ipinapakita ng Mga Menu ang mga menu bilang listahan o bilang mga tile."
