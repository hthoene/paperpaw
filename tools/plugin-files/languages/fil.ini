format-cbz.plugin.name = Mga komiks
format-cbz.plugin.description = Nagbubukas ng mga comic book archive (.cbz), isang larawan bawat pahina.
format-cbz.plugin.how = "Nagbubukas ng mga comic book archive (.cbz): isang larawan bawat pahina, iniakma sa screen, ayon sa pagkakasunod ng mga pangalan nila (2 bago ang 10).\n\nIlagay ang mga ito sa folder ng aklatan at buksan mula sa aklatan; magpalit ng pahina gaya sa anumang aklat. Medyo natatagalan ang malalaking larawan sa unang beses, mas matagal sa X4 kaysa sa iba.\n\nMga setting sa pagbabasa (Mga Setting, Pagbabasa): ipinapakita ng “Panel kada panel” ang isang panel ng pahina bawat beses, kasinlaki ng pinapayagan ng screen, at dinadaanan ang mga ito ng pagpapalit ng pahina; ipinapakita nang buo ang pahinang walang panel. Binabaligtad ng “Takbo ng mga pahina ng komiks” ang pagpapalit ng pahina para sa manga (kanan pakaliwa); kusa itong sinasabi ng sariling ComicInfo.xml ng aklat. Ipinapakita ng aklatan ang pamagat ng aklat at ang serye at numero nito mula sa ComicInfo.xml."
