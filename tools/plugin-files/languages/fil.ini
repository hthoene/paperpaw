translate.plugin.description = Isinasalin online ang napiling text, gamit ang DeepL.
translate.plugin.how = "Isinasalin ng Pagsasalin online ang napiling text gamit ang DeepL. Pumili ng text sa aklat at piliin ang Isalin sa menu ng napiling text: lilitaw ang salin sa ibabaw ng pahina na parang entry sa diksyunaryo. Ini-scroll ito ng mga page button o tap, at isinasara ito ng Piliin o tap sa dulo nito.\n\nKailangan nito ng network at sarili mong DeepL API key, libre sa deepl.com (DeepL API Free, mga 500,000 character kada buwan). Hangga't hindi mo ito nailalagay, sinasabi ito ng panel, at humihingi nito ang tap.\n\nSa mga setting, sa ilalim ng Pagbabasa, sa seksyong Pagsasalin, itinatakda ng Isalin sa ang wika; sa simula, ito ay ang wika ng PaperPaw."
