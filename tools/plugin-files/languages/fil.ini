smart-home.plugin.name = Smart home
smart-home.plugin.description = Mga halaga at switch mula sa sarili mong Home Assistant sa isang dashboard at bilang mga home screen widget. Gumagana sa Home Assistant sa home network mo.
smart-home.plugin.how = "Ipinapakita ng Smart home ang mga halaga at switch mula sa sarili mong Home Assistant: temperatura, halumigmig, enerhiya, pinto at bintana, ilaw, switch at eksena. Nakikipag-usap ito sa server mo sa pamamagitan ng REST API nito sa home network mo; walang dumadaan sa anumang ibang serbisyo.\n\nBuksan ang Smart home mula sa menu ng mga tool, pagkatapos ay Koneksyon: i-type ang address ng Home Assistant mo (halimbawa http://homeassistant.local:8123) at isang long-lived access token (gumawa nito sa ibaba ng profile page ng Home Assistant mo). Itinatago ang token kasama ng mga password at key, hindi kailanman sa settings file. Ginagamit lang ang payak na http para sa mga address sa home network mo; para sa server sa ibang lugar, i-on ang “Mga server sa labas ng home network” sa mga setting at gumamit ng https na may wastong certificate.\n\nBinubuksan ng Pumili ng mga entity ang listahan ng nasa server mo: maghanap ayon sa pangalan o id at piliin ang entity para ipakita ito (piliin itong muli para alisin). Puwede mo itong bigyan ng kuwarto, na nagpapangkat dito sa dashboard at sa mga widget ng kuwarto. Hanggang 24 na entity ang itinatago. Sa dashboard, piliin ang ilaw, switch o eksena para i-switch ito: ipinapakita ng hanay ang sagot ng server. Binabasa muli ang sensor na pinili mo.\n\nMga widget (pindutin nang matagal ang home screen, pagkatapos ay magdagdag ng widget): ipinapakita nang malaki ng Smart home value ang isang pagbasa, inililista ng group ang mga entity ng isang kuwarto, ang switch ay button para sa isang ilaw o switch, at ang room ay card na may mga pagbasa at switch ng isang kuwarto. Sinasabi ng mga setting ng bawat widget kung aling entity o kuwarto ang ipinapakita nito.\n\nBinabasa ang bahay kapag binuksan mo ang dashboard, kapag hiniling mo (ang hanay na I-refresh o tap sa value o group widget), kapag nagising ang reader kung nakabukas na ang Wi-Fi, at ayon sa iskedyul na itinakda mo habang nakasaksak ang charger. Hindi nito kusang bubuksan ang radyo at hindi ito pananatilihing bukas."
