update.dual-boot.help = PaperPaw dùng chung thiết bị này với một firmware khác, nên không cài cập nhật tại đây. Hãy cập nhật PaperPaw bằng công cụ bạn đã dùng để thiết lập. Thiết bị không có firmware thứ hai? Hãy cho biết bằng nút bên dưới, hoặc nạp lại PaperPaw qua USB tại paperpaw.org/flash.
