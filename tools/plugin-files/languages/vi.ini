files.plugin.name = Trình duyệt tệp
files.plugin.description = Liệt kê sách và thư mục trên thiết bị và mở chúng.
files.plugin.how = "Thư viện liệt kê các sách trong thư mục thư viện của bạn, kèm bìa, tiêu đề, tác giả và tiến độ đọc. Cuốn bạn đọc gần nhất nằm trên cùng dưới dạng thẻ, nên đọc tiếp chỉ cần chạm một lần hoặc nhấn Chọn một lần. Khi thư viện đang tìm sách, nó cho biết đã tìm thấy bao nhiêu cuốn.\n\nChọn nội dung hiển thị phía trên các sách: tất cả, sách đang đọc, chưa đọc hoặc đã đọc xong, hoặc các giá sách (theo tác giả, bộ sách, thẻ, yêu thích, cuốn kế tiếp của mỗi bộ sách bạn đã bắt đầu). Chạm vào sách để đọc; nhấn giữ (với nút bấm, giữ Chọn) để mở, đánh dấu đã đọc xong hoặc chưa đọc, xem thông tin, chuyển vào kho lưu trữ hoặc xóa. Chạm vào tiêu đề để mở menu thư viện: cách sắp xếp và hiển thị sách, tìm kiếm, thư mục thư viện và cài đặt.\n\nThư mục thư viện được đặt trong Cài đặt, mục Thư viện, ở Thư mục thư viện; tại đó bạn cũng có thể hiển thị sách dưới dạng lưới bìa. Với mọi tệp khác, hãy dùng Tệp trong menu Công cụ."
