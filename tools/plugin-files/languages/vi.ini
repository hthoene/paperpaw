vocabulary.sd.readme = "Thẻ ghi nhớ từ tệp\n\nHãy đặt mỗi bộ thẻ một tệp ở đây: Spanish.tsv tạo bộ thẻ Spanish.\nTệp: .tsv, .csv hoặc .txt, lưu dưới dạng UTF-8, hoặc .apkg: bộ thẻ Anki, xuất với Support older Anki versions được chọn. Ba trường đầu tiên của ghi chú trở thành mặt trước, mặt sau và ví dụ; lịch ôn và phương tiện không được đọc, và PaperPaw không bao giờ ghi tệp Anki.\n\nMỗi dòng một thẻ: mặt trước, mặt sau và ví dụ (không bắt buộc), phân tách bằng dấu tab, dấu phẩy hoặc dấu chấm phẩy. Dòng đầu có thể là tên các cột: front, back, example. Ví dụ:\n\nKatze\tcat\tDie Katze schläft.\n\nSau đó mở Thẻ ghi nhớ trên thiết bị, chọn Thẻ ghi nhớ trên thẻ SD rồi chọn Cập nhật các bộ thẻ.\n\nCần biết:\n- Các bộ thẻ nằm trên thiết bị, cùng với tiến độ học của bạn. Tệp được đọc khi mới hoặc đã thay đổi, và các thẻ của nó được thêm vào bộ thẻ hoặc được sửa ở đó.\n- Sửa mặt sau hoặc ví dụ của thẻ trong tệp: thẻ thay đổi và giữ nguyên tiến độ học của bạn.\n- Sửa văn bản mặt trước của thẻ: nó được tính là thẻ mới, và thẻ cũ bắt đầu lại từ đầu. Thẻ được nhận diện theo văn bản mặt trước, khoảng trắng và chữ hoa không được tính. Hãy lưu bộ thẻ vào tệp (Thẻ ghi nhớ trên thẻ SD, Lưu bộ thẻ vào thẻ SD) và mỗi thẻ sẽ có một số trong cột id: sửa mặt trước ở đó, giữ nguyên hai dòng đầu của tệp, và thẻ vẫn giữ tiến độ học.\n- Khi lưu, các thẻ của bộ thẻ được ghi ra. Những gì có trong tệp mà không phải thẻ (dòng không có mặt trước) sẽ không được giữ lại; tệp có sẵn trước đó được sao chép thành _name.bak.tsv.\n- Hãy lưu tệp dưới dạng CSV UTF-8 (không phải UTF-16, không phải định dạng riêng của bảng tính). Tệp trên 4 MiB hoặc 20.000 dòng sẽ không được đọc: hãy chia nhỏ.\n- Dòng bạn xóa trong tệp không xóa thẻ trong bộ thẻ, trừ khi bạn bật Xóa thẻ bị thiếu cho bộ thẻ đó. Khi đó thẻ biến mất cùng tiến độ học.\n- Tệp có tên bắt đầu bằng _ không được đọc.\n"
