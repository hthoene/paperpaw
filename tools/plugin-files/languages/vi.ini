update.plugin.name = Cập nhật
update.plugin.description = Cài đặt bản cập nhật firmware từ thẻ nhớ hoặc tải về từ internet.
update.plugin.how = "Cập nhật cài firmware mới, trên các thiết bị mà PaperPaw là firmware, chẳng hạn X4. Bạn thấy mục này trong phần cài đặt, với tên Cập nhật.\n\nTìm trực tuyến sẽ hỏi máy chủ cập nhật xem có bản PaperPaw mới hơn không và tải về, mất vài phút qua Wi-Fi. Hoặc sao chép tệp cập nhật (đuôi .bin, từ paperpaw.org) vào thư mục updates trên thẻ nhớ, chẳng hạn bằng truyền qua Wi-Fi. Việc cài đặt sau đó mất khoảng một phút và thiết bị khởi động lại; sách, cài đặt và vị trí đọc vẫn được giữ.\n\nKhi bật Tìm bản cập nhật (trong phần cài đặt, lúc đầu tắt), thiết bị tự hỏi khoảng một lần mỗi tuần, chỉ khi Wi-Fi vốn đang bật hoặc khi đang sạc. Bản PaperPaw mới tìm được sẽ chờ ở đây; không có gì làm gián đoạn việc đọc của bạn. Mỗi lần tìm chỉ gửi phiên bản đang chạy trên thiết bị, không gửi tên hay số hiệu của thiết bị; để đếm số thiết bị, còn gửi thêm việc bạn có chủ động tìm hay không và đó có phải lần tìm đầu tiên trong ngày, tuần hoặc tháng hay không.\n\nNếu plugin bạn dùng chưa có phiên bản cho bản phát hành mới, bản cập nhật sẽ chờ chúng. Phiên bản cũ hơn chỉ được cài khi bạn chọn.\n\nFirmware khác, chẳng hạn CrossPoint, cũng có thể cài từ đây: đặt tệp của nó (đuôi .bin) vào thư mục updates rồi mở Cập nhật. PaperPaw kiểm tra xem đó có phải firmware đầy đủ, không bị hỏng, dành cho thiết bị này hay không, nhưng không thể biết ai đã tạo ra nó vì nó không được ký. Vẫn cài sẽ ghi nó vào nửa còn lại của bộ nhớ flash, và thiết bị sẽ khởi động nó; PaperPaw vẫn nằm ở nửa của mình cho đến khi firmware đó cài thứ gì đó đè lên. Để quay lại PaperPaw sau này, hãy cài tệp cài đặt của nó (paperpaw-<device>-<version>-install.bin) từ menu của firmware kia, chẳng hạn mục cập nhật firmware từ thẻ SD của CrossPoint."
