pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Agogon mayar da hankali da zagayen aiki da hutu, widget da ƙidaya ta kowace rana.
pomodoro.plugin.how = "Agogon Pomodoro: a yi aiki a zagaye na mayar da hankali, sannan a huta. Ba ya buƙatar saiti: minti 25 na mayar da hankali, 5 na hutu, kuma bayan zagaye huɗu dogon hutu na 15.\n\nBuɗe Pomodoro daga menu na kayan aiki kuma danna Fara, ko ƙara widget ɗinsa a allon gida (riƙe allon gida, sannan ƙara widget): Agogon Pomodoro yana nuna mataki da mintunan da suka rage, Fara/dakata Pomodoro maɓalli ne, kuma Pomodoro yau yana ƙidaya zagayen da kuka gama, tare da burinku na yini. Taɓa agogon yana fara shi ko dakatar da shi; riƙe shi don buɗe cikakken allo.\n\nAgogon yana ci gaba da aiki idan kuka bar allon, kuma yana ci gaba bisa agogo bayan sake farawa. Yayin da na'urar ke barci babu abin da ke aiki: ana sanar da matakin da ya ƙare a lokacin idan ta farka. Sanarwa tana gaya muku lokacin da mataki ya ƙare. Don tanadin batir, agogon yana sabuntawa sau ɗaya a minti (kowace daƙiƙa goma a minti na ƙarshe a cikakken allo) kuma ba ya taɓa hana na'urar barci.\n\nA ƙarƙashin Pomodoro a saituna kuna saita tsawon lokuta da zagayen rukuni ɗaya, da ko mataki na gaba zai fara da kansa. A ƙarƙashin Ƙari: walƙiyar allo ko ƙiftawar hasken gaba idan mataki ya ƙare, da burin yini."
