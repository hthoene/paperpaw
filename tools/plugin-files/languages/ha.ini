format-cbz.plugin.name = Littattafan zane-zane
format-cbz.plugin.description = Yana buɗe taskokin littattafan zane-zane (.cbz), hoto ɗaya a kowane shafi.
format-cbz.plugin.how = "Yana buɗe taskokin littattafan zane-zane (.cbz): hoto ɗaya a kowane shafi, an daidaita shi da allo, bisa jerin sunayensu (2 kafin 10).\n\nSaka su a foldar laburare sannan buɗe su daga laburare; juya shafuka kamar a kowane littafi. Manyan hotuna suna ɗaukar ɗan lokaci a karon farko, a X4 fiye da sauran wurare.\n\nSaitunan karatu (Saituna, Karatu): “Hoto bayan hoto” yana nuna akwatin hoto ɗaya na shafi a lokaci guda, da girma gwargwadon yadda allo ya yarda, kuma juya shafi yana bi ta cikinsu ɗaya bayan ɗaya; shafin da ba shi da akwatunan hoto ana nuna shi duka. “Alƙiblar shafuka” tana juya alƙiblar juya shafi don manga (daga dama zuwa hagu); fayil ɗin ComicInfo.xml na littafin yana faɗin haka da kansa. Laburare yana nuna taken littafi da jerinsa da lambarsa daga ComicInfo.xml."
format-cbz.title = Littafin zane-zane (CBZ)
format-cbz.setting.direction = Alƙiblar shafuka
format-cbz.setting.direction.help = Manga: ana juya alƙiblar juya shafi.
format-cbz.direction.book = Yadda littafin ya ce
format-cbz.direction.ltr = Daga hagu zuwa dama
format-cbz.direction.rtl = Daga dama zuwa hagu
format-cbz.setting.panels = Hoto bayan hoto
format-cbz.setting.panels.help = Akwatin hoto ɗaya a lokaci guda, juya shafi yana bi ta cikinsu.
format-docx.plugin.name = Takardun DOCX
format-docx.plugin.description = Yana buɗe fayilolin .docx, kamar yadda Word da sauran shirye-shirye ke ajiye su.
format-docx.plugin.how = "Yana buɗe takardun .docx a matsayin littattafai: kanun rubutu tare da jerin abubuwan ciki, jeruka, tebura, rubutu mai kauri da karkatacce, mahaɗai da hotuna (JPEG, PNG, GIF).\n\nSaka fayilolin a foldar laburare sannan buɗe su daga laburare. Take da marubuci suna fitowa daga bayanan takardar. Ba a nuna bayanan ƙasa, kanun shafi da ƙasan shafi, da sharhi."
format-docx.title = Takardar DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Yana buɗe littattafan EPUB tare da salonsu, abubuwan ciki da hotuna.
format-epub.plugin.how = "Littattafan EPUB suna buɗewa daga laburare kamar kowane littafi, tare da abubuwan cikinsu, hotuna da tsarin mawallafi. Shafukan yanar gizo (HTML), Markdown, FictionBook (.fb2) da taskokin littattafan zane-zane (.cbz) suna buɗewa haka, kowanne a matsayin plugin nasa.\n\nAna canza babi a karon farko da kuka buɗe shi kuma ana ajiye shi a ma'ajiyar wucin gadi ta plugin ɗin, don haka yana sauri daga baya kuma manyan littattafai suna aiki a ƙananan na'urori. Nemo jerin abubuwan ciki a ƙarƙashin Abubuwan ciki a menu na karatu. Ko salon littafin na kansa yana aiki, saitin Tsarin mawallafi ne ke yanke shi, ƙarƙashin Karatu."
format-epub.title = Littafin EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Yana buɗe littattafan FictionBook (.fb2, har da waɗanda aka matsa a zip).
format-fb2.plugin.how = "Yana buɗe littattafan FictionBook (.fb2), waɗanda suka zama ruwan dare ga littattafan Rasha da wasu, har da waɗanda aka matsa a zip (.fb2.zip), tare da take, marubuta, bango da babukansu.\n\nSaka su a foldar laburare; suna bayyana a laburare kuma suna buɗewa kamar kowane littafi."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Yana buɗe shafukan yanar gizo da aka ajiye a matsayin fayiloli, yana nuna abin da za a karanta kawai.
format-html.plugin.how = "Yana buɗe shafukan yanar gizo da aka ajiye a matsayin fayiloli (.html, .htm, .xhtml) a matsayin littattafai: abin da za a karanta kawai, ba tare da menu, tallace-tallace da makamantansu da ke kewaye da shi ba.\n\nSaka fayil ɗin a foldar laburare sannan buɗe shi daga laburare kamar kowane littafi. Mahaɗai a cikin shafin suna aiki; hotuna suna bayyana a inda suke a cikin fayil ɗin."
format-html.title = Shafin yanar gizo (HTML)
format-images.plugin.name = Hotuna
format-images.plugin.description = Yana buɗe hotuna (.jpg, .png, .gif) a matsayin littattafai, shafi ɗaya ga kowanne.
format-images.plugin.how = "Hotuna (.jpg, .png, .gif) suna buɗewa daga laburare kamar littattafai, hoto ɗaya a kowane shafi, an daidaita su da allo.\n\nDon karanta dukan foldar hotuna, buɗe hotonta na farko: hotunan da ke bayansa a foldar suna biyo baya, bisa jerin sunayensu (2 kafin 10). Idan aka buɗe hoto na gaba a foldar, karatu yana farawa daga can; ana tuna wurin karatu na kowanne daban. Ana karanta har hotuna 300 na foldar daga wanda kuka buɗe.\n\nFayil da ba hoto ba ne, ko wanda ya yi girma sosai, yana nuna sunansa maimakon haka. Don littafi mai hotuna da yawa tare da takensa, taskar littafin zane-zane (.cbz) ita ce mafi dacewa."
format-images.title = Hoto
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Yana buɗe fayilolin Markdown (.md), misali bayanan kula.
format-markdown.plugin.how = "Yana buɗe fayilolin Markdown (.md), kamar bayanan kula, a matsayin littattafai: kanun rubutu, jeruka, ƙaulai da jaddadawa kamar yadda aka nufa, ba a matsayin alamomi ba.\n\nSaka fayilolin a foldar laburare sannan buɗe su daga laburare. Kanu na farko shi ne take; hotunan da ke kusa da fayil ɗin suna bayyana a inda rubutun ya ambace su."
format-markdown.title = Markdown
format-mobi.plugin.name = Littattafan MOBI
format-mobi.plugin.description = Yana buɗe fayilolin .mobi da .azw marasa DRM.
format-mobi.plugin.how = "Littattafan MOBI (.mobi, .azw) suna buɗewa daga laburare kamar kowane littafi, ba tare da wani saiti ba. Take, marubuta, harshe da bango suna fitowa daga littafin, kuma ana yin jerin abubuwan ciki daga kanun labaransa.\n\nAna canza littafin a karon farko da aka buɗe shi, abin da ke ɗaukar ƴan daƙiƙoƙi idan littafin dogo ne; bayan haka yana buɗewa nan take. Ana nuna rubutu, kanun labarai, rubutu mai kauri da mai karkata, mahaɗai da hotuna.\n\nBa za a iya buɗe littattafai masu DRM ba (yawancin littattafan da aka saya a shago), ko masu matsawar Huffman, ko na sabon tsarin KF8 (.azw3): PaperPaw yana faɗin haka idan aka buɗe su. Kwafin EPUB, wanda aka yi da kayan aiki kamar Calibre, yana buɗewa koyaushe."
format-mobi.title = Littattafan MOBI
format-rtf.plugin.name = Takardun RTF
format-rtf.plugin.description = Yana buɗe fayilolin .rtf a matsayin littattafai.
format-rtf.title = Takardun RTF
format-txt.plugin.name = Rubutu kawai
format-txt.plugin.description = Yana buɗe fayilolin rubutu kawai (.txt).
format-txt.plugin.how = "Fayilolin rubutu kawai (.txt) suna buɗewa daga laburare kamar kowane littafi, ba tare da wani saiti ba. Plugin ɗin yana karanta rubutun UTF-8, UTF-16 da Windows-1252, kuma yana gano tsarin haruffa da kansa.\n\nSakin layi yana bin layukan da babu komai a cikin fayil ɗin; idan fayil ba shi da su, kowane layi sakin layi ne. A fayilolin Project Gutenberg ana barin rubutun lasisi na farko da na ƙarshe, kuma ana ɗaukar take da marubuci daga kan fayil ɗin.\n\nBa a taɓa loda fayil ɗin gaba ɗaya ba, don haka rubutu masu girma sosai ma suna buɗewa a ƙananan na'urori."
format-txt.title = Rubutu kawai
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Yana buɗe littattafan XTC da XTCH, shafukan da aka riga aka shirya don na'urorin karatu na Xteink.
format-xtc.plugin.how = "Fayilolin XTC da XTCH littattafai ne waɗanda aka riga aka shirya shafukansu a matsayin hotuna, kamar yadda masu canza fayil don na'urorin karatu na Xteink suke yi. Suna buɗewa daga laburare kamar kowane littafi.\n\nDomin kowane shafi hoto ne kafaffe, ba za a iya canza girman rubutun ko saka shi a wani nau'in rubutu ba. Shafukan baƙi da fari ne ko suna da launukan toka huɗu. Ana buɗe kowane shafi lokacin da aka nuna shi, don haka ana buƙatar ƙwaƙwalwa kaɗan, har ma a kan X4.\n\nAna ɗaukar take, marubuci da babuka daga fayil ɗin idan yana da su."
format-xtc.title = Shafukan XTC
help.plugin.name = Shawarwari
help.plugin.description = Yana nuna abin da sarrafawar allo ke yi, a karon farko da ya buɗe.
help.plugin.how = "A karon farko da allo ya buɗe, wani gajeren bayani a kansa yana faɗin abin da sarrafawarsa ke yi: sassan allon da taɓawa ke zuwa, a cikin firam, da abin da maɓallai ke yi.\n\nTaɓawa ko kowane maɓalli yana rufe bayanin, kuma ba zai sake fitowa ga wannan allon ba. Babu ƙarin shawarwari yana kashe dukkansu.\n\nA saituna, ƙarƙashin Tsari, Shawarwari yana kunna su ko kashe su, kuma Sake nuna shawarwari yana sa a sake nuna bayanin kowane allo sau ɗaya."
