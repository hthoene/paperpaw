update.plugin.name = Sabuntawa
update.plugin.description = Yana shigar da sabuntawar firmware, daga katin ko wadda aka sauke daga intanet.
update.plugin.how = "Sabuntawa yana shigar da sabon firmware, a na'urorin da PaperPaw shi ne firmware ɗinsu, kamar X4. Za ku same shi a saituna, a matsayin Sabuntawa.\n\nNema a intanet yana tambayar sabar sabuntawa ko akwai sabon PaperPaw kuma yana sauke shi, wanda ke ɗaukar ƴan mintuna ta Wi-Fi. Ko ku kwafi fayil ɗin sabuntawa (mai ƙarewa da .bin, daga paperpaw.org) zuwa foldar updates a katin, misali ta Tura ta Wi-Fi. Shigar zai ɗauki kusan minti ɗaya sannan na'urar ta sake farawa; littattafai, saituna da wuraren karatu suna nan.\n\nIdan Nemi sabuntawa yana a kunne (a saituna, a kashe da farko), na'urar tana tambaya kusan sau ɗaya a mako da kanta, sai dai idan Wi-Fi a kunne take ko yaya ko tana caji. Sabon PaperPaw da ta samu yana jira a nan; babu abin da ke katse karatunku. Nema yana aika abin da na'urar ke gudanarwa, ba sunanta ko lambarta ba; don ƙirga na'urori, yana kuma aika ko ku kuka nema da kuma ko wannan ne nemanta na farko a ranar, makon ko watan.\n\nIdan plugin da kuke amfani da su ba su da siga don sabon sakin tukuna, sabuntawar tana jiran su. Tsohuwar siga tana shiga ne kawai idan kun zaɓe ta.\n\nWani firmware, kamar CrossPoint, ma yana shiga daga nan: saka fayil ɗinsa (mai ƙarewa da .bin) a foldar updates, sannan buɗe Sabuntawa. PaperPaw yana dubawa cewa cikakken firmware ne na wannan na'urar, ba tare da lahani ba, amma ba zai iya sanin wanda ya yi shi ba, tun da ba a sa masa hannu ba. Shigar duk da haka yana rubuta shi a ɗayan rabin flash, kuma na'urar tana fara shi; PaperPaw yana zama a rabinsa har sai wannan firmware ya shigar da wani abu a kansa. Don komawa PaperPaw daga baya, shigar da fayil ɗin shigarwarsa (paperpaw-<device>-<version>-install.bin) daga menu na ɗayan firmware ɗin, kamar SD firmware update na CrossPoint."
