about.plugin.name = Game da
about.plugin.description = Sigar PaperPaw da lasisoshinsa.
about.plugin.how = "Game da yana nuna sigar PaperPaw da kuke da ita, inda lambar tushensa take, da kuma lasisin da yake ƙarƙashinsu.\n\nKuna samunsa a ƙarshen Saituna, a matsayin Game da PaperPaw. Zaɓi layi da maɓallan kibiya da Zaɓi, ko taɓa shi. Plugin da aka gina a cikin firmware, kuma a na'urorin da ke loda plugin masu lamba, sawun yatsan da dole a gina irin waɗannan plugin dominsa, su ma ana jera su.\n\nLasisi yana buɗewa a matsayin rubutu a mai karatu, don haka kuna juya shafuka kamar littafi. Yana ɗauke da lasisin PaperPaw da kansa da na nau'ukan rubutu, gumaka da tsarin raba kalmomi da suka zo tare da shi. Plugin za su iya ƙara layi nasu, kamar marubucin jigo."
