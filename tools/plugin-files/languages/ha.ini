reading-goal.plugin.name = Burin karatu
reading-goal.plugin.description = Mintunan karatu a rana, da kyanwa a allon gida wadda yanayinta ke bin karatun yau.
reading-goal.plugin.how = "Kyanwa a allon gidanku tana nuna yadda karatun yau ke tafiya: tana baƙin ciki idan ba ku karanta ba tukuna, haka-haka bayan ɗan kaɗan, ta gamsu daga rabin burinku na rana, tana farin ciki da zarar kun cim ma shi.\n\nƘara widget Kyanwar karatu a allon gida (riƙe allon gida, sannan ƙara widget), ko zaɓi Kyanwar karatun yau a matsayin allon barci. Taɓa kyanwar yana buɗe burin rana; shi ne burin Ƙididdigar karatu, wadda ke ƙirga mintunan da kuke karantawa.\n\nA saituna, ƙarƙashin Karatu, Gamsuwa daga da Farin ciki daga suna saita daga wane kaso na burin kyanwar take gamsuwa ko farin ciki, Hotunan kaina kuma folda ce ta hotuna (sad, meh, content da happy) da za a nuna maimakon kyanwoyin. Hotunan fayilolin PNG ko JPEG ne; idan babu folda, kyanwoyin ne ke bayyana."
