tasks.plugin.name = Ayyuka
tasks.plugin.description = Jerin ayyuka masu ranar ƙarshe da fifiko, a na'urar karatu ko daidaitacce da sabar CalDAV ɗinku, tare da widget na allon gida.
tasks.plugin.how = "Jerin ayyuka a na'urar karatunku: ayyuka masu ranar ƙarshe da fifiko, waɗanda ake yi wa alamar an gama idan an kammala su. Suna aiki ba tare da wani saiti ko intanet ba, kuma ana iya daidaita su da sabar CalDAV (Nextcloud, Radicale, Baïkal, Fastmail da sauransu), don jerin guda su kasance a wayarku da kwamfutarku.\n\nBuɗe Ayyuka daga menu na kayan aiki. Layin farko yana ambaton jerin da ake nunawa; zaɓe shi don wani jeri, don Yau da waɗanda suka wuce lokaci daga dukkan jeri, don sabon jeri, don daidaitawa, ko don saita asusun. Ƙara aiki yana buɗe allon rubutu. Zaɓi a kan aiki yana yi masa alamar an gama (sake: ba a gama ba). Riƙe aiki ko danna Menu don canza takensa, ranar ƙarshensa (yau, gobe, cikin mako ɗaya, ko kwanan wata da kuka rubuta kamar 2026-12-24) ko fifikonsa, ko don cire shi. Ayyukan da ba a gama ba suna farko, bisa ranarsu sannan bisa fifiko; waɗanda aka gama suna zama a ƙarshe na mako ɗaya (ana saita wannan a ƙarƙashin Ayyuka a saituna), sannan su bar na'urar karatu.\n\nWidget na allon gida (riƙe allon gida, sannan ƙara widget): Ayyukan yau yana nuna abin da ranar ƙarshensa yau ce ko ta wuce, Jerin ayyuka yana nuna jeri ɗaya, Ayyukan da ba a gama ba yana ƙirga su, kuma Aiki na gaba yana nuna wanda za a yi na gaba. Taɓa aiki a widget yana yi masa alamar an gama; taɓa kanun rubutu yana buɗe jerin.\n\nDon daidaitawa, zaɓi Asusun CalDAV daga layin jerin kuma shigar da adireshin sabar, sunan mai amfani da kalmar sirri (zai fi kyau kalmar sirri ta manhaja). Adireshin sabar ya isa, misali cloud.example.com/remote.php/dav; na'urar karatu za ta nemo jerin ayyukanku daga can. Kowane jerin ayyuka na sabar zai zama jeri a na'urar karatu. Na'urar karatu tana daidaitawa idan kun buɗe Ayyuka, idan kun zaɓi Daidaita yanzu, da kuma idan intanet a kunne take ko yaya; abin da kuka canza ba tare da intanet ba yana jira kuma za a aika shi daga baya. Idan an canza aiki a na'urar karatu da kuma a wani wuri a halin yanzu, ana ɗaukar sigar sabar kuma ana adana naku a matsayin sabon aiki a gefensa, don kada wani abu ya ɓace. Bayanan kula, ƙararrawa da duk wani abu da aiki yake da shi a sabar suna nan yadda suke. Ana nuna ayyukan da ke maimaituwa amma ana canza su a inda kuka ƙirƙira su. Na'urar karatu tana ɗaukar ayyuka har 200 a cikin jeri 12."
