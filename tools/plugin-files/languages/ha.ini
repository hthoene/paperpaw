file-manager.plugin.name = Manajan fayil
file-manager.plugin.description = Kowace folda da fayil a na'urar: buɗe, sake suna, matsar, kwafa da goge su.
file-manager.plugin.how = "Manajan fayil yana nuna kowace folda da fayil a ma'ajiyar na'urar, ba littattafanku kaɗai ba, kuma yana ba ku damar buɗe su, sake musu suna, matsar da su, kwafa da goge su, da yin sababbin foldoji.\n\nBuɗe Fayiloli daga menu na Kayan aiki. Taɓa folda don shiga cikinta; Baya yana komawa foldar da ke sama. Taɓa fayil, ko riƙe kowace shigarwa (da maɓallai, riƙe Zaɓi), don ganin abin da za a iya yi da ita. Matsar da Kwafa suna ɗaukar shigarwar: je foldar da ya kamata ta shiga sannan zaɓi Liƙa a nan a sandar ƙasa. Da maɓallai, danna Ƙasa daga shigarwar ƙarshe don isa sandar.\n\nFayiloli da foldoji da suka fara da ɗigo, kamar bayanan PaperPaw na kansa, a ɓoye suke. Don ganinsu, kunna Fayiloli masu ɓoye a Saituna, ƙarƙashin Laburare."
