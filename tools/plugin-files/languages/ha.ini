home.plugin.name = Allon gida
home.plugin.description = Shafin farko: shafukan widget, kamar littafin da ake karantawa da kayan aiki.
home.plugin.how = "Allon gida yana da shafuka, kowanne jadawalin widget da kayan aiki kamar a waya. Da farko agogo, littafin da kuke karantawa da littattafan da aka karanta kwanan nan suna kan shafi ɗaya, kuma dukkan kayan aiki a na gaba.\n\nTaɓa abu don buɗe shi, kuma shafa ko yi amfani da maɓallan shafi don canza shafi. Da maɓallai kawai, maɓallan kibiya suna matsawa daga wani abu zuwa na gaba, kuma Zaɓi yana buɗe shi.\n\nDon sake tsara shi, riƙe allon gida, taɓa fensir ɗin da ke ƙasan shafin ko zaɓi Gyara allon gida a menu. Ja abubuwa don matsar da su ko taɓa ɗaya don zaɓuɓɓukansa, har ma da maɓallai. Ƙara widget ma yana can. Ginshiƙai da Jeruka suna cikin saituna, ƙarƙashin Kamanni, a sashen Allon gida.\n\nA kan allo da aka juya a kwance, allon gida yana nuna abubuwa iri ɗaya da ƙarin ginshiƙai, kowane shafi yana cika kafin na gaba, kuma katuna ba su fi kusan mm 110 faɗi ba; ba a canza komai da kuka tsara a tsaye ba. Idan kuka tsara shi a kwance, ana ajiye wannan shimfiɗar don wannan juyawa kaɗai: ana ƙara sabbin widget a duka biyun. Maido da shimfiɗar kwance a cikin Ƙara (lokacin gyara) yana komawa ga wadda aka samo. Cire widget ko kayan aiki a wani juyawa ba ya cire shi daga ɗayan."
