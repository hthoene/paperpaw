calendar.plugin.name = Kalanda
calendar.plugin.description = Kalandarku a na'urar karatu: ajanda, rana, mako da wata daga CalDAV, iCal da fayiloli, ranakun haihuwa daga lambobin sadarwa, widget na allon gida da allon barci.
calendar.plugin.how = "Kalandarku a na'urar karatu: ajandar kwanaki masu zuwa, rana, mako da wata, tare da taruka daga kalandar CalDAV (Nextcloud, Radicale, Baïkal, Fastmail da sauransu), daga adireshin iCal (.ics, webcal://), daga fayilolin kalanda a katin, da ranakun haihuwa da ranakun tunawa na lambobin sadarwarku (CardDAV). Na'urar tana karanta kalanda ne kawai; ba ta taɓa canza su.\n\nBuɗe Kalanda daga menu na Kayan aiki. Layin farko yana nuna yanayin kallo; zaɓe shi, ko riƙe kowane layi ko danna Menu, don sauyawa tsakanin Ajanda, Rana, Mako, Wata da Ranakun haihuwa, don ƙara kalanda ko don daidaitawa. A Rana da Mako, layuka biyu na farko suna zuwa ranar ko makon da ya gabata da na gaba (maɓallan shafi ma haka); a Wata, maɓallan kibiya suna matsar da rana, maɓallan shafi suna canza wata, kuma Zaɓi yana buɗe ranar. Zaɓi a kan taro yana nuna shi gaba ɗaya: yaushe, ina, wace kalanda da yadda yake maimaituwa. Baya yana komawa mataki ɗaya.\n\nƘara kalanda a ƙarƙashin “Kalanda” (a menu, ko Kalanda a saituna). Zaɓi irinta: asusun CalDAV (adireshin sabar ya isa, misali cloud.example.com/remote.php/dav; kowace kalanda mai taruka za ta shiga kallon), adireshin iCal (kalandar da aka wallafa a matsayin .ics), fayil ɗin kalanda a katin, ko lambobin sadarwa (littafin adireshi na CardDAV: na'urar tana nuna ranakun haihuwa da ranakun tunawa da aka ajiye a ciki). Shigar da adireshin, da sunan mai amfani da kalmar sirri idan asusu ne (gara kalmar sirrin manhaja; ana ajiye ta tare da kalmomin sirrin na'urar), da suna. Kowace kalanda tana da alama (ɗigo, zobe, ɗigo mai toka ko murabba'i) wadda za ku iya canzawa, don ku bambanta su; har kalanda shida.\n\nTaruka masu maimaituwa (kullum, kowane mako, kowane wata, kowace shekara, tare da ranakun mako, adadi, ranakun ƙarshe da ranakun da aka tsallake), taruka na yini guda da taruka a wasu yankunan lokaci suna bayyana bisa agogon na'urar. Na'urar tana riƙe da taruka daga kwanaki sittin kafin yau zuwa kwanaki sittin bayan yau, iyaka 240, kuma tana nuna su ba tare da intanet ba. Ƙa'idodin da ba ta iya karantawa suna nuna tarukansu sau ɗaya.\n\nAna karanta kalanda idan kun buɗe kalandar (ba fiye da sau ɗaya a cikin minti biyar ba), idan kun zaɓi Daidaita yanzu, kuma, kamar yadda kuka saita a ƙarƙashin Kalanda a saituna, idan intanet yana kunne tuni ko idan caji ya fara. Na'urar ba ta taɓa kunna rediyonta saboda wannan, sai idan kun zaɓi Daidaita yanzu.\n\nWidget na allon gida (riƙe allon gida, sannan ƙara widget): Yau yana nuna kwanan wata da abin da ranar ke ɗauke da shi, Taro na gaba yana nuna taron da ke tafe, Ajanda kwanaki masu zuwa, Wata yana nuna wata da ɗigo a ƙarƙashin ranakun da ke da taruka, Ranakun haihuwa kuma ranakun haihuwa masu zuwa. Taɓa taro yana buɗe shi, taɓa ranar wata yana buɗe ranar. Allon barci zai iya nuna ajandar yau: zaɓi Kalanda a ƙarƙashin Allon barci a saituna."
