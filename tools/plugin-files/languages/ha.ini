reader.plugin.name = Mai karatu
reader.plugin.description = Yana nuna littattafai shafi bayan shafi, da abubuwan ciki da saitunan karatu.
reader.plugin.how = "Mai karatu yana nuna littattafai shafi bayan shafi. Buɗe littafi daga laburare; littafin ƙarshe zai iya sake buɗewa lokacin farawa (saitin Buɗe littafin ƙarshe lokacin farawa).\n\nTaɓa hagu ko dama na allo, ko yi amfani da maɓallan shafi, don juya shafuka. Taɓa tsakiya ko danna Zaɓi don menu na karatu: Abubuwan ciki, Nema, Je zuwa shafi, Rubutu da shimfiɗa, Alamomin shafi da haskakawa da ƙari. Ja ƙasa daga gefen sama yana buɗe saurin shiga, ja sama daga gefen ƙasa yana komawa gida; haka ma riƙe Baya.\n\nRiƙe Zaɓi (ko riƙe hoto) don ganin hoto a cikakken allo: Hagu da Dama suna bi ta hotunan shafin. Zaɓi yana zuƙowa zuwa 2x, 3x kuma ya koma (taɓa sau biyu a allon taɓawa); idan an zuƙo, Hagu da Dama suna matsar da shi gefe, maɓallan shafi (ko shafawa) suna ci gaba a kwance sannan zuwa ƙasa. Baya yana komawa girman da ya dace, sannan zuwa shafin (riƙe don fita a allon taɓawa). Taɓa kusurwar sama ta dama don alamar shafi. Riƙe kalma don haskaka ta. Da maɓallai, riƙe Hagu: Hagu da Dama suna matsawa kalma-kalma, maɓallan shafi layi-layi, riƙe su yana zuwa ƙarshen shafin da sakin layi-sakin layi; Zaɓi yana buɗe sandar haskakawa don kalmar, riƙe Zaɓi yana faɗaɗa ta zuwa jumla da sakin layi (sannan Hagu da Dama suna matsar da ƙarshe, riƙe su kuma farko). Zaɓi yana ci gaba bayan juya shafi. Fitar a matsayin Markdown yana ajiye bayanan kula naku."
