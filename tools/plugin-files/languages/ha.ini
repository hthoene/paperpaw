launcher-simple.plugin.name = Gida mai sauƙi
launcher-simple.plugin.description = Allon farawa mai natsuwa: babban agogo, katuna, sandar alamomi da saurin shiga mai maɓallan kunnawa masu zagaye.
launcher-simple.plugin.how = "Gida mai sauƙi allon farawa ne mai natsuwa ga waɗanda ke buƙatar muhimman abubuwa kawai: babban agogo, littafin da kuke karantawa, laburare da shago a matsayin manyan katuna, da sandar alamomi uku a ƙasa. Ba ya buƙatar saiti.\n\nZaɓi shi a Saituna, ƙarƙashin allon gida. Saurin shigarsa (zaɓi shi a matsayin sashe a Saituna ma) yana da manyan maɓallan kunnawa masu zagaye, sanda don hasken gaba inda na'urar take da shi da sanda don girman rubutu. Da maɓallai, maɓallan kibiya suna matsar da zaɓi kuma Zaɓi yana yin abin da ɓangaren ya ce; a kan sanda yana ƙara kashi ɗaya cikin goma, kuma daga ƙarshe yana komawa farko. Da taɓawa, taɓa ɓangare, ko taɓa sanda inda kuke so.\n\nLaburare yana jera littattafanku a matsayin katuna, wanda aka buɗe na ƙarshe a farko, shafi ɗaya a lokaci ɗaya, kuma yana buɗe mai karatu na al'ada.\n\nMai da shi naku a Saituna, ƙarƙashin Gida mai sauƙi: jeruka uku da kuke gyarawa kamar yadda kuke gyara babban menu. Katuna: waɗanne katuna gida ke nunawa kuma a wane tsari. Sandar alamomi: waɗanne alamomi sandar take ɗauke da su, kowane aiki na kowane plugin. Saurin shiga: waɗanne maɓallan kunnawa da sanduna yake nunawa. Katin da allon ba shi da wuri gare shi ana barin sa, daga ƙarshe. Ƙarƙashin Gida mai sauƙi kuma kuna zaɓar ko kwanan wata da batir za su bayyana."
