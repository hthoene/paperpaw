power.plugin.name = Wuta
power.plugin.description = Yana zaɓar yanayin wuta, da hannu ko bisa batir: Na al'ada, Tanadi, Babu intanet.
power.plugin.how = "Wuta tana zaɓar yadda PaperPaw ke kashe batir: Na al'ada, Tanadi ko Babu intanet. Tanadi yana yin abin da zai iya jira a lokuta mafi dacewa; Babu intanet yana bar rediyo a kashe. Atomatik yana zaɓa bisa batir.\n\nCanza yanayin a kwamitin gaggawa, inda Wuta ke nuna yanayoyin gefe da gefe, ko a Saituna a ƙarƙashin Wuta. A can kuma kuke saita matakan da Atomatik ke komawa Tanadi da Babu intanet, da ko zai zauna a Na al'ada yayin caji.\n\nA layukan matsayi, Yanayin wuta yana nuna ganye yayin tanadi da Wi-Fi da aka ketare yayin babu intanet, kuma babu komai a Na al'ada.\n\nRiƙe maɓallin wuta don buɗe ƙaramin menu: Barci, Kashe (inda PaperPaw zai iya), Sake farawa, kuma a na'urorin taɓawa Kulle taɓawa ko Buɗe taɓawa. Ɗan dannawa har yanzu yana sa na'urar barci. Baya yana fita daga menu."
