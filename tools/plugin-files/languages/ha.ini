weather.plugin.name = Yanayi
weather.plugin.description = Yanayin yanzu da na kwanaki masu zuwa a matsayin widget, daga Open-Meteo.
weather.plugin.how = "Yanayi yana nuna yanayin yanzu da na kwanaki masu zuwa a matsayin widget na allon gida, daga Open-Meteo, wanda ba ya buƙatar asusu ko maɓalli. Yanayin yanzu yana nuna zafin yanayi, yadda yanayi yake da wasu abubuwan da za a zaɓa; Hasashen yanayi yana nuna kwanaki masu zuwa gefe da gefe ko a jeri.\n\nDa farko zaɓi wuri: a saituna, ƙarƙashin Yanayi, Wuri (rubuta suna, sannan zaɓe shi daga wuraren da aka samu). Lambobin wurin kawai ake aikawa, kuma sai lokacin da ake nuna widget na yanayi. Ƙara widget ɗin ta hanyar gyara allon gida.\n\nAna ɗauko yanayi ba fiye da yadda Sabunta sau ɗaya a cikin ya ce ba, kuma sai lokacin da akwai intanet: ba ya taɓa kunna Wi-Fi da kansa.\n\nBayanan yanayi daga Open-Meteo.com (https://open-meteo.com), ƙarƙashin lasisin Creative Commons Attribution 4.0 (CC BY 4.0)."
