vocabulary.sd.readme = "Katunan koyo daga fayiloli\n\nSaka fayil a nan ga kowane tari: Turanci.tsv yana yin tarin Turanci.\nFayiloli: .tsv, .csv ko .txt, an ajiye a matsayin UTF-8, ko .apkg: tarin Anki, wanda aka fitar tare da yi wa “Support older Anki versions” alama. Filaye uku na farko na bayanansa suna zama gaba, baya da misali; ba a karanta jadawalinsa da media ɗinsa, kuma PaperPaw ba ya taɓa rubuta fayil na Anki.\n\nKati ɗaya a kowane layi: gaba, baya da misali (na zaɓi), an raba su da tab, waƙafi ko waƙafi mai digo. Layin farko na iya ambaton ginshiƙai: front, back, example. Misali:\n\ncat\tmage\tThe cat is sleeping.\n\nSannan buɗe Katunan koyo a na'urar karatu, zaɓi Katuna a katin SD sannan Sabunta tarukan.\n\nAbin da ya kamata a sani:\n- Tarukan suna zama a na'urar karatu, tare da abin da kuka koya. Ana karanta fayil idan sabo ne ko an canza shi, kuma ana ƙara katunansa a tarin ko a canza su a can.\n- Canza baya ko misalin kati a fayil: katin zai canza kuma ya riƙe ci gabanku.\n- Canza rubutun gaban kati: za a ɗauke shi sabon kati, kuma tsohon zai fara daga farko. Ana gane katuna da rubutun gabansu; tazara da manyan haruffa ba su da tasiri. Ajiye tari a fayil (Katuna a katin SD, Ajiye ... a katin) kuma kowane kati zai sami lamba a ginshiƙin id: canza gaba a can, bar layuka biyu na farko na fayil yadda suke, kuma katin zai riƙe abin da kuka koya.\n- Ajiyewa yana rubuta katunan tarin. Abin da ke cikin fayil kuma ba kati ba ne (layi ba tare da gaba ba) ba a riƙe shi; ana kwafa fayil ɗin da ke can zuwa _suna.bak.tsv.\n- Ajiye fayil ɗin a matsayin CSV UTF-8 (ba UTF-16 ba, ba tsarin spreadsheet na kansa ba). Ba a karanta fayil da ya wuce 4 MiB ko layuka 20,000: raba shi.\n- Layin da kuka goge a fayil ba ya goge katin a tarin, sai dai idan kun saita “katunan da babu su a fayil” zuwa Cire ga wannan tarin. Sannan katin zai tafi tare da abin da kuka koya.\n- Ba a karanta fayilolin da sunayensu suka fara da _ ba.\n"
