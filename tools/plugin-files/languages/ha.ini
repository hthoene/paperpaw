settings.plugin.name = Saituna
settings.plugin.description = Shafukan saituna, waɗanda aka gina daga saitunan kowane plugin.
settings.plugin.how = "Saituna suna nuna duk abin da za a iya saitawa a PaperPaw da plugin ɗinsa, a shafuka. Plugin ba sa buƙatar allo nasu: abin da suka bayyana yana fitowa a nan, a rukunoni, da bayanin kowane saiti a ƙarƙashinsa.\n\nBuɗe su da Saituna a menu. Taɓa rukuni don buɗe shi, sannan saiti don kunna ko zaɓar shi; lambobi suna da maɓallan − da +. Da maɓallai, matsa zuwa saiti sannan danna Zaɓi: hagu da dama suna canza lamba, Zaɓi yana riƙe ta, Baya yana mayar da ƙimar da ta gabata.\n\nCanje-canje suna aiki nan take. Nema yana samun saiti ta kalmomi, kuma Saituna na ci gaba suna ƙara waɗanda ba a cika buƙata ba. Mayar da na asali da Mayar da duka suna tambaya tukuna."
