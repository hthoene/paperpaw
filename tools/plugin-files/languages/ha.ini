transfer.plugin.name = Tura fayiloli
transfer.plugin.description = Saka littattafai da sauran fayiloli a na'urar daga burauza a cikin hanyar sadarwa ɗaya.
transfer.plugin.how = "Tura ta Wi-Fi yana saka littattafai da sauran fayiloli a na'urar daga burauza a cikin hanyar sadarwa ɗaya, ba tare da kebul ko manhaja ba. Kuna kuma iya ɗauko fayiloli, ƙirƙirar folda da gogewa.\n\nBuɗe shi daga Kayan aiki. Allon yana nuna adireshi a matsayin rubutu da kuma lambar QR: buɗe shi a burauza a waya ko kwamfuta, ko duba lambar. Adireshin yana ɗauke da maɓallin da ake sake yinsa kowane lokaci, don kada wasu a cikin hanyar sadarwar su iya kaiwa ga fayilolinku. Turawar tana aiki muddin allon yana buɗe.\n\nInda PaperPaw ke sarrafa Wi-Fi da kansa, kamar a X4, Ba tare da router ba a ƙasa yana buɗe hanyar sadarwa ta na'urar kanta, wadda waya ke shiga ta hanyar duba lamba."
