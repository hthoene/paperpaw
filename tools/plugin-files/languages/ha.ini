anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Yana nazarin katunan Anki da lokacinsu ya yi a kwamfutarku kuma yana mayar da amsoshinku, ta hanyar ƙarin AnkiConnect.
anki.plugin.how = "Anki yana ba ku damar nazarin katunan da lokacinsu ya yi a Anki na kwamfutarku a na'urar karatu, kuma yana mayar da amsoshinku. Yana amfani da ƙarin AnkiConnect na kyauta (lambar ƙari 2055492159), ba AnkiWeb ba ko kaɗan. A kashe yake da farko: ƙara shi daga Shagon plugin.\n\nA kwamfuta: shigar da AnkiConnect a Anki (Tools, Add-ons, Get Add-ons) sannan sake kunna Anki. Dole Anki ya kasance a buɗe yayin daidaitawa.\n\nA asali AnkiConnect yana amsa kwamfutar da yake aiki a kanta kawai (127.0.0.1), don haka na'urar karatu ba za ta iya kai masa ba. Buɗe Tools, Add-ons, AnkiConnect, Config sannan saita \"webBindAddress\" zuwa \"0.0.0.0\" (sauraro a intanet na gida). Tashar, \"webBindPort\", 8765 ce sai dai idan kun canza ta. Idan kun saita \"apiKey\" a can, shigar da maɓalli iri ɗaya a nan. Sake kunna Anki bayan canza saitin, kuma ku ba Anki izini ta katangar tsaro ta kwamfutar idan ta tambaya. Yi amfani da wannan a intanet da kuka amince da shi kawai: kowa a cikinsa zai iya kai wa AnkiConnect, don haka maɓalli abu ne mai kyau.\n\nA na'urar karatu: buɗe Anki daga Kayan aiki, sannan shigar da adireshin kwamfutar (misali 192.168.1.20) a ƙarƙashin Kwamfuta, tashar idan ba 8765 ba ce, da maɓallin API idan kun saita ɗaya. Zaɓi Tarin katuna, ko bar shi babu komai don dukkan tarin. Sannan zaɓi Daidaita da Anki, da Wi-Fi a kunne: ana fara aika amsoshinku da ke jira, sannan a ɗauko katunan da lokacinsu ya yi (da adadin sababbin katunan da kuka saita), 50 a mafi yawa. Zaɓi Nazari don bi ta kansu, ba tare da intanet ba: nuna amsar sannan ku auna ta da Sake, Da wuya, Da kyau ko Mai sauƙi. Ana ajiye amsoshinku a na'urar karatu, ko babu Wi-Fi, kuma suna zuwa Anki tare da daidaitawa ta gaba. Anki ne ke yanke shawarar lokacin da kati zai dawo: katin da kuka amsa da Sake, daidaitawa ta gaba za ta sake ɗauko shi da zarar Anki ya ce lokacinsa ya yi.\n\nDaidaita idan Anki ya buɗe, a saituna, yana daidaitawa duk lokacin da kuka buɗe allon. Babu abin da ke amfani da intanet idan kun danna maɓalli."
