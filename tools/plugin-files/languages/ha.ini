wifi.plugin.name = Wi-Fi
wifi.plugin.description = Yana haɗa cibiyoyin sadarwar Wi-Fi idan ana buƙata, sannan ya kashe rediyo bayan haka.
wifi.plugin.how = "Wi-Fi yana haɗa cibiyar sadarwa idan wani plugin yana buƙatar intanet (kundi, daidaitawa, shago, canja wuri), sannan ya sake kashe rediyo minti ɗaya bayan babu abin da ke amfani da shi, ko nan take idan Gida ko littafi ya bayyana, don adana batir da ƙwaƙwalwa.\n\nBuɗe Wi-Fi daga Saituna, ko daga abin Wi-Fi a layin matsayi. Cibiyoyin sadarwa yana lissafa waɗanda ke kusa; zaɓi ɗaya sannan rubuta kalmar sirrinta, ko zaɓi Saita da waya sannan rubuta suna da kalmar sirri a burauzar wayarku maimakon a na'urar. Manta yana cire cibiyar sadarwa da aka ajiye.\n\nKalmomin sirri suna nan a katin, an ajiye su lafiya, kuma ba za a sake nuna su ba. A ƙarƙashin Haɗa idan ana buƙata kuna saita tsawon lokacin da Wi-Fi ke kasancewa a kunne bayan amfani na ƙarshe, ko yana kasancewa a kunne yayin caji, da wace cibiyar sadarwa da aka ajiye ke zuwa farko idan da yawa suna kusa."
