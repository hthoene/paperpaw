koreader.plugin.name = Raba haskakawa
koreader.plugin.description = Yana raba alamomin shafi da haskakawa da KOReader ga littattafan da aka karanta a duka biyun.
koreader.plugin.how = "Wannan plugin yana raba alamomin shafi da haskakawa da KOReader ga littattafan da kuke karantawa a duka biyun, a na'ura ɗaya ko a foldar laburare da ake daidaitawa tsakanin na'urori. Babu abin da za a saita.\n\nIdan PaperPaw ya buɗe littafin da KOReader ma ya buɗe, da kuma lokacin da kuka canza alamomin shafi ko haskakawarsa, yana ɗaukar abin da ke sabo daga bayanan KOReader da ke kusa da littafin, kuma yana barin abin da ke sabo a nan don KOReader ya ɗauka a lokaci na gaba da ya buɗe littafin. Alamomin da aka cire da bayanan kula da aka canza ma suna tafiya.\n\nWannan yana aiki ga littattafan EPUB kawai. Idan ba a iya karanta fayil na wani ɓangare ba, babu abin da ke canzawa a kowane ɓangare har sai an iya."
