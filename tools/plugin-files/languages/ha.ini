keyboard.plugin.name = Madannai
keyboard.plugin.description = Yana shigar da rubutu a allo, ta taɓawa ko da maɓallai.
keyboard.plugin.how = "Madannai yana buɗewa duk lokacin da wani abu yake buƙatar rubutu: nema, kalmar sirri, bayanin kula ko saiti. Yana aiki ta taɓawa da kuma da maɓallai kaɗai.\n\nDa maɓallai, hagu da dama suna tafiya a kan jere, maɓallan shafi suna matsawa tsakanin jeruka, Zaɓi yana danna maɓalli kuma Baya yana sokewa; hagu da dama suna zagaya jere, sama da ƙasa kuma suna tsayawa a ginshiƙinku. Shift yana mai da harafi na gaba babba; danna shi sau biyu don dukkan manyan haruffa, kuma sau ɗaya kuma don dainawa. Riƙe harafi (da maɓallai: riƙe Zaɓi a kansa) don babban harafinsa, wanda aka zaɓa nan take, da alamomi kamar é da è; a Jamusanci, ä, ö, ü da ß suna fitowa haka daga a, o, u da s (da maɓallai, madannai yana faɗin haka a kan waɗannan haruffa). To yana gamawa; da maɓallai, riƙe Baya don gamawa daga ko'ina (Baya kaɗai yana sokewa), ko riƙe Zaɓi a kan maɓallin da ba harafi ba. Liƙa yana saka rubutun da aka kwafa, kuma Waya, inda aka bayar, tana ba ku damar rubutu a wayarku maimakon haka.\n\nA saituna ƙarƙashin Na'ura, Madannai: Shimfiɗun madannai yana zaɓar shimfiɗun. Na asali yana bin harshen menu; idan akwai da yawa, wani maɓalli yana sauyawa tsakaninsu. Maɓallan umlaut yana ba ä, ö, ü da ß maɓallansu na kansu maimakon haka. Girma yana ƙara girman maɓallai da haruffa; da maɓallai kaɗai, jerukan suna zama na madannan kwamfuta. A allon taɓawa, Siffar maɓalli tana canza kamannin maɓallai. Manyan haruffa atomatik yana fara kowace jumla da babban harafi."
