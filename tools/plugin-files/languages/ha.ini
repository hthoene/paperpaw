store.plugin.name = Shagon plugin
store.plugin.description = Yana nemo, shigarwa, sabuntawa da cire plugin na wannan na'urar.
store.plugin.how = "Shagon plugin yana nemo plugin na wannan na'urar a intanet, yana shigar da su, sabunta su da cire su. Buɗe shi daga Kayan aiki; yana buƙatar Wi-Fi.\n\nShafin farko yana nuna abin da laburaren ke ba da shawara, abin da yake sabo ko shahararre yanzu, sannan rukunoni. Rukuni yana jera plugin ɗinsa a gauraye bisa adalci da ke canzawa kowace rana, don a ga kowane plugin; jera su daga A zuwa Z, ta mafi sabo ko ta sabuntawa ta ƙarshe, kuma a dogayen jeri ku je zuwa wani harafi. Buɗe ɗaya don ganin shafinsa, tare da girmansa da ƙwaƙwalwar da yake ɗauka, sannan zaɓi Shigar, Sabunta ko Cire. Sabunta duka yana sabunta kowane plugin da aka shigar zuwa sabuwar siga.\n\nPlugin na code suna aiki da cikakken iko a kan na'urar: shagon yana faɗin haka kuma yana tambaya tukuna, kuma suna farawa bayan sake farawa. Idan ɗaya ya samu matsala, PaperPaw zai fara ba tare da plugin na code ba kuma ya faɗi wanne ne. Laburaren plugin yana saita inda jerin yake fitowa.\n\nPlugin na al'umma, a Saituna, Tsari, yana kuma jera plugin da wasu suka wallafa a GitHub. Babu wanda ya bita su: ana yi musu alamar Ba a bita ba, shafin plugin na code yana nuna maɓallin da aka sa masa hannu da shi, kuma ba a shigar da sabuntawar da wani maɓalli daban ya sa wa hannu.\n\nMajiyoyi, layin ƙarshe na shafin farko, yana ƙara jerin plugin na wasu ta adireshinsu (https://…/plugins.json), yana nuna ɗaya daga cikinsu a madadin na PaperPaw, ko yana cire shi. Maimakon rubutawa, saka fayil sources.txt mai adireshi ɗaya a kowane layi a cikin .paperpaw/plugins/store a katin: adiresoshin za su bayyana a ƙarƙashin Majiyoyi a matsayin sababbi. PaperPaw ba ya duba majiya ko plugin ɗinta, kuma na'urar tana tuntuɓar sabar majiyar. Majiya tana sa hannu a jerinta; na'urar tana riƙe maɓallin jerin farko da ta karanta, kuma daga nan tana karɓar jeri da plugin na code da aka sa wa hannu da wannan maɓallin kaɗai. Plugin yana samun sabuntawarsa daga majiyar da aka shigar da shi daga gare ta kaɗai. Laburaren PaperPaw na kansa yana nan koyaushe kuma ba za a iya cire shi ba; barin shagon yana mayar da shi."
