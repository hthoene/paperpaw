dictionary.plugin.name = Ƙamus
dictionary.plugin.description = Yana duba kalmomi a ƙamusun StarDict.
dictionary.plugin.how = "Ƙamus yana duba kalma daga littafi a ƙamusun StarDict kuma yana nuna ma'anoni a wani faifai a kan ɓangaren ƙasa na allo.\n\nA wurin karatu, riƙe kalma sannan zaɓi Duba ma'ana; da maɓallai, yi amfani da Zaɓi rubutu ƙarƙashin Ƙari. Kwafi foldojin ƙamus (masu fayilolin .ifo, .idx da .dict) zuwa folda \"dictionaries\" a na'urar, har da ƙananan foldoji, ko zaɓi wata folda a Saituna, ƙarƙashin Karatu, a matsayin Foldar ƙamus (saiti na ci gaba). Duba na farko yana shirya ƙaramin fihirisa ga kowane ƙamus, wanda ke ɗaukar ɗan lokaci.\n\nA cikin faifan, maɓallan shafi ko Sama da Ƙasa suna gungura dogayen ma'anoni, kuma Baya yana rufe shi. Da taɓawa, taɓa wajensa don rufe shi."
