battery.plugin.name = Amfani da batir
battery.plugin.description = Yana rubuta batir kuma yana nuna tsawon lokacin da yake ɗauka.
battery.plugin.how = "Amfani da batir yana rubuta cajin kusan sau ɗaya a minti yayin da na'urar ke farke, tare da abin da ta yi: wartsakewar allo da shafukan da aka juya. Daga nan yana lissafa nawa awa ɗaya a farke da shafuka 100 ke ci, da tsawon lokacin da batir zai ɗauka a wannan saurin.\n\nBuɗe Batir daga menu na Kayan aiki. Yana nuna cajin yanzu, wannan lokacin a farke, amfani a kan batir zuwa yanzu da lokutanku na baya-bayan nan a farke. Yana juya shafi da maɓallan shafi, ko ta taɓa kibiyoyin da ke sama.\n\nYana buƙatar ɗan lokaci na karatu a kan batir kafin lambobin su yi ma'ana. Rubutawa a kunne take a asali kuma za a iya kashe ta a Saituna, ƙarƙashin Na'ura, Wuta, a matsayin Rubuta amfani da batir."
