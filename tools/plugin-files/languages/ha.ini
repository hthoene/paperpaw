picture-home.plugin.name = Allon gida mai hoto
picture-home.plugin.description = Allon gida mai hotonku a bayan widget, da sandar matsayi da kuke tsarawa.
picture-home.plugin.how = "Allon gida mai hoto yana maye gurbin allon gida yayin da yake a kunne: hotonku a bayan widget, da shafukan widget da kayan aiki da kuke tsarawa. Kashe shi a manajan plugin, sai allon gida na asali ya dawo, da shafukansa.\n\nSaka hotuna (JPEG, PNG ko GIF) a wata folda a katin (wallpapers ta asali), sannan zaɓi ɗaya a Saituna, Keɓancewa, Allon gida mai hoto. Daidaitawa tana faɗin yadda yake cika allo (cika, cikakken hoto, miƙa, girman asali, maimaitawa), Matsayi wane sashe ne zai zauna, Zuƙowa girmansa, kuma Haskaka hoto yadda zai yi fari: hoto mai ƙarin fari yana sa widget su fi sauƙin karantawa. Ana shirya hoton sau ɗaya ga kowane girman allo, wanda ke ɗaukar ɗan lokaci.\n\nWidget suna zaune a kan bango a saman hoton. Tsara shafin kamar a allon gida na asali: fensir da ke ƙarƙashin shafin, ko Gyara allon gida a menu.\n\nSandar matsayi (lokaci, Wi-Fi, batir, ko abin da kuka zaɓa) za ta iya kasancewa a kunne, a kashe ko atomatik, a sama ko a ƙasa, cikakken faɗi ko ƙaramar ƙwaya a hagu, tsakiya ko dama, a kan bango mai haske, mai duhu ko toka, ko a kan hoton kansa. Layin da ke faɗin sunayen maɓallai (a X4) shi ma zai iya kasancewa a kunne, a kashe ko atomatik. Atomatik yana nufin danna maɓalli yana nuna su na 'yan daƙiƙoƙi; wannan dannawar ba ta yin wani abu dabam.\n\nZanen hoto yana faɗin yadda ake zana hoton: Matakan toka a dukan launukan toka da allon yake da su (a hankali a X4), Ɗigo-ɗigo da ɗigon baƙi da fari (da sauri), ko Atomatik, kamar allon gida na asali: matakan toka idan aka zana allon, ɗigo bayan canji na farko. Inda allo ba shi da matakan toka, matakan toka suna komawa ɗigo."
