stats.plugin.name = Ƙididdigar karatu
stats.plugin.description = Yana rubuta tsawon lokaci da yawan karatunku, tare da kalanda da alƙaluman kowane littafi.
stats.plugin.how = "Ƙididdigar karatu tana rubuta tsawon lokacin da kuke karanta kowane shafi. Kuna ganinta a matsayin taƙaitawa mai yau, mako da jerin kwanakinku, a matsayin kalanda, da kuma tare da alƙaluman kowane littafi.\n\nBuɗe ta daga Kayan aiki, ko daga Ƙari a cikin karatu. A saituna, ƙarƙashin Ƙididdigar karatu, kuna iya kashe Rubuta karatu, saita Burin kullum, kuma saita Shafi mafi gajarta da Shafi mafi tsawo da ake ƙirgawa, don kada jujjuya shafuka ko littafin da aka bar a buɗe ya karkatar da alƙaluma.\n\nDaidaita da KOReader yana raba ƙididdiga da KOReader ta foldar WebDAV. Yana kuma ɗauko ƙididdigar KOReader a wannan na'urar. Rubutawa tana buƙatar a saita agogo: inda ba a saita ba, haɗa da Wi-Fi sau ɗaya."
