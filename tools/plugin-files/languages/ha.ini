files.plugin.name = Mai lilon fayiloli
files.plugin.description = Yana jera littattafai da foldoji a na'urar kuma yana buɗe su.
files.plugin.how = "Laburare yana jera littattafan da ke foldar laburarenku, kowanne da bangonsa, takensa, marubucinsa da iyakar da kuka karanta. Littafin da kuka karanta na ƙarshe yana tsaye a sama a matsayin kati, don haka ci gaba da karatu yana buƙatar taɓawa ɗaya, ko danna Zaɓi sau ɗaya. Yayin da laburare ke neman littattafai, yana faɗin nawa ya samu ya zuwa yanzu.\n\nZaɓi abin da ake nunawa a saman littattafan: dukansu, waɗanda kuke karantawa, waɗanda ba a karanta ba ko waɗanda aka gama, ko shiryayyu (ta marubuci, jeri, lakabi, waɗanda aka fi so, littafi na gaba na kowane jerin da kuka fara). Taɓa littafi don karanta shi; riƙe shi (da maɓallai, riƙe Zaɓi) don buɗe shi, yi masa alamar an gama ko ba a karanta ba, ganin bayanansa, matsar da shi zuwa taska ko goge shi. Taɓa take don menu na laburare: yadda ake jera da nuna littattafai, nema, foldar laburare da saituna.\n\nAna saita foldar laburare a Saituna, ƙarƙashin Laburare, a matsayin Foldar laburare; a can kuma za ku iya nuna littattafai a matsayin grid na bangwaye. Don kowane fayil daban, yi amfani da Fayiloli a menu na Kayan aiki."
