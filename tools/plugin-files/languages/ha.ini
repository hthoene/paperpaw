lock.plugin.name = Kulle allo
lock.plugin.description = PIN, zane ko kalmar sirri idan na'urar ta farka; kulle taɓawa lokacin karatu.
lock.plugin.how = "Kulle allo yana neman PIN, zane ko kalmar sirri idan PaperPaw ya fara da kuma idan na'urar ta farka. Yana a kashe da farko. Yana hana amfani na kwatsam kawai: ana ajiye lambar da adadin gwaje-gwajen da ba daidai ba a katin SD, don haka duk wanda ya fitar da katin, ya gyara shi ko ya musanya shi zai wuce kullen.\n\nSaita shi a saituna, ƙarƙashin Na'ura, Kulle allo: shigar da lambar da ake amfani da ita idan akwai, zaɓi nau'i, sannan sabuwar lamba sau biyu. Ana bayar da zane a allon taɓawa kawai.\n\nBayan gwaji biyar da ba daidai ba, na gaba yana jira rabin minti. Kulle yanzu yana kullewa nan take kuma ana iya sanya shi a maɓalli, ishara ko doka. Ana iya kashe Kulle bayan farkawa, ta yadda farawa ta gaske kawai (kunnawa ko sake farawa) ke kullewa, sai dai inda kowace farkawa farawa ce, kamar a kan X4 mai amfani da batir.\n\nKulle taɓawa, a gefensa: Kulle taɓawa a saurin shiga da menu na karatu yana sa taɓawa, shafawa da alƙalami kada su yi komai yayin da maɓallai ke aiki har yanzu, misali don karatu da hannu a kan allo. Don buɗewa, taɓa sau biyu da yatsa ɗaya kuma ku riƙe shi ƙasa na ɗan lokaci; riƙe maɓallin wuta yana buɗe menu na Wuta, inda Buɗe taɓawa ke yin haka da maɓallai; a kan X4 Pro, riƙe maɓallin gida yana buɗewa nan take."
