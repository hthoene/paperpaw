notes-vault.plugin.name = Ma'ajiyar bayanan kula
notes-vault.plugin.description = Yana karanta foldar bayanan kula na Markdown ta folda, lakabi da sababbin canje-canje, tare da widget don allon gida. Yana aiki da ma'ajiyar Obsidian.
notes-vault.plugin.how = "Ma'ajiyar bayanan kula tana karanta foldar bayanan kula na Markdown (fayilolin .md na yau da kullum, kamar yadda manhajojin bayanan kula ke ajiye su). Tana aiki da ma'ajiyar Obsidian.\n\nZaɓi foldar ma'ajiyar a saituna, ko a shafin ma'ajiyar a kayan aiki. Shafin zai nuna foldoji kamar yadda suke a katin, bayanan kula da aka canza na ƙarshe, lakabai, da neman a cikin taken bayanan kula.\n\nA karon farko, ana tsara fihirisar ma'ajiyar a bayan fage yayin da shafinta yake a buɗe; ma'ajiya mai dubban bayanan kula tana ɗaukar 'yan mintuna, sannan tana buɗewa nan take. Ana ajiye fihirisar a katin kuma a sake yin ta idan shafin ma'ajiyar ya buɗe bayan wasu awanni, ko idan kuka zaɓi Sabunta.\n\nBayanin kula yana buɗewa a mai karatu. Ana samun hanyoyin haɗi zuwa wasu bayanan kula ([[Note]], [[Note|words]], [[Note#Heading]]) ta sunan bayanin kula a ko'ina a ma'ajiyar; bin ɗaya yana buɗe wannan bayanin kula, kuma Baya yana komawa bayanin kula na baya.\n\nBa a taɓa canza komai a ma'ajiyar ba. Ana ƙara widget na allon gida (bayanan kula na kwanan nan, bayanin kula da aka maƙala, bayanin kula na yini, bayanin kula na bazata, lakabai, nema) a editan allon gida. Widget zai iya ɗaukar bayanan kulansa daga folda ɗaya kawai: rubuta hanyar foldar daga tushen katin (misali Notes/Work) a saitunan widget ɗin; idan babu komai, yana ɗaukar dukan bayanan kula na ma'ajiyar."
