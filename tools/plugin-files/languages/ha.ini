mail.plugin.name = Imel
mail.plugin.description = Yana karantawa da aika imel da kalmar sirri ko kalmar sirrin manhaja (IMAP da SMTP), ba tare da shiga ta burauza ba.
mail.plugin.how = "Imel yana karantawa da aika imel ta IMAP da SMTP. Yana shiga da adireshinku da kalmar sirri, ba tare da shiga ta burauza ba, don haka yana aiki da duk mai bada sabis da ya yarda da haka.\n\nSaita asusu ƙarƙashin Saituna, Imel. Zaɓi mai bada sabis ɗinku, rubuta adireshinku da kalmar sirri. Yawancin masu bada sabis suna son kalmar sirrin manhaja: ku ƙirƙiri ɗaya a saitunan tsaro na asusunku kuma ku yi amfani da ita a nan. Kalmar sirrinku ta al'ada sau da yawa ba ta aiki, kuma ba ta zuwa ko'ina sai sabar mai bada sabis ɗinku. Ana ajiye ta tare da kalmomin sirri da maɓallai.\n\nBuɗe Imel a kayan aiki. Duba imel yana ɗauko sabbin saƙonni da foldoji. Ana ajiye saƙonni a katin, don haka kuna iya karanta su ba tare da intanet ba. Na'urar tana haɗawa, ɗauko, sannan cire haɗi, don haka Wi-Fi yana a kunne na ɗan lokaci kawai.\n\nIdan mai bada sabis ɗinku ba ya cikin jerin, zaɓi Sabobin kaina kuma saita sunayen sabobi, port da tsaro ƙarƙashin saitunan ci-gaba. Sabar da babu wata hukuma da ke tabbatar da takardar shaidarta tana tambaya sau ɗaya ko za a amince da ita; kwatanta zanen yatsan da abin da mai bada sabis ɗinku ke nunawa.\n\nSaƙo mai littafi a haɗe (EPUB, PDF da makamantansu, har zuwa 2 MB) yana da Buɗe littafi a ƙasansa: yana ɗauko fayil ɗin, ya saka shi a laburarenku kuma ya buɗe shi.\n\nDon ganin sabbin saƙonni ba tare da buɗe Imel ba, kunna Duba sabon imel a bango ƙarƙashin Saituna, Imel, kuma zaɓi sau nawa (kowane minti 15, 30 ko 60). Yana a kashe har sai kun kunna shi. Na'urar karatu za ta riƙa haɗawa lokaci zuwa lokaci ta amintaccen haɗi yayin da take a farke kuma tana kan intanet, asusu ɗaya bayan ɗaya, kuma tana sabunta adadin saƙonnin da ba a karanta ba a Gida. Yana amfani da ɗan batir. Buɗe Imel yana dakatar da dubawar da ke gudana.\n\nWidget na allon gida suna nuna adadin saƙonnin da ba a karanta ba, sabbin saƙonni da masu tauraro, akwatin saƙo ɗaya, da gajeriyar hanya don rubuta saƙo."
