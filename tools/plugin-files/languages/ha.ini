menu.plugin.name = Menu
menu.plugin.description = Menu a ƙasan allo, tare da ayyuka da saituna.
menu.plugin.how = "Menu yana jera abin da za ku iya yi da saitawa. Yana buɗewa a ƙasan allo, a saman duk abin da ke buɗe: lokacin karatu, taɓa tsakiyar allo ko danna Zaɓi. Taɓa ko zaɓi abu don gudanar da shi.\n\nSaituna a menu suna nuna ƙimarsu kuma suna canzawa a wurin, don haka menu yana zama a buɗe. Abu mai ƙarin abubuwa yana buɗe ƙaramin menu.\n\nShafa ƙasa daga gefen sama don saurin shiga: abin da kuke canzawa sau da yawa, a matsayin maɓallai. Taɓa maɓalli don kunna ko kashe shi, riƙe shi don saitunansa. Da maɓallai kawai, maɓallan kibiya suna zaɓa, Zaɓi yana kunnawa ko kashewa kuma Baya yana rufewa. Ƙarƙashin Kamanni, Menu yana nuna menu a matsayin jeri ko akwatuna."
