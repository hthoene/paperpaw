plugin-manager.plugin.name = Manajan plugin
plugin-manager.plugin.description = Yana jera plugin kuma yana kunnawa da kashe su.
plugin-manager.plugin.how = "Manajan plugin yana jera kowane plugin tare da sigarsa da bayaninsa, kuma yana kunnawa da kashe plugin.\n\nZa a same shi a Saituna, a matsayin Sarrafa plugin. Saitunan plugin shafi ne na daban don zaɓuɓɓuka kamar amfanin intanet na kowane plugin. Taɓa plugin don kunna ko kashe shi (da maɓallai, zaɓe shi). Canjin yana aiki bayan sake farawa: sandar da ke ƙasa za ta ba da Sake farawa yanzu. Riƙe plugin (da maɓallai, riƙe Zaɓi) don karanta yadda yake aiki.\n\nPlugin da aka yi wa alama Kullum a kunne ba za a iya kashe shi ba, kuma wanda aka yi wa alama Ana buƙata sai bayan wani plugin ya ɗauki aikinsa, in ba haka ba PaperPaw ba zai sami hanyar komawa ba. A ƙarƙashin Allo, kuna zaɓar wane plugin ne zai nuna wurin da plugin da yawa ke bayarwa."
