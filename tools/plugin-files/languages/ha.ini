smart-home.plugin.name = Gida mai wayo
smart-home.plugin.description = Ƙima da makunnai daga Home Assistant naku a kan allon bayani da kuma a matsayin widget na allon gida. Yana aiki da Home Assistant a cibiyar sadarwar gidanku.
smart-home.plugin.how = "Gida mai wayo yana nuna ƙima da makunnai daga Home Assistant naku: yanayin zafi, danshi, makamashi, ƙofofi da tagogi, fitilu, makunnai da fage. Yana magana da sabarku ta REST API ɗinta a cibiyar sadarwar gidanku; babu abin da ke wucewa ta wani sabis.\n\nBuɗe Gida mai wayo daga menu na kayan aiki, sannan Haɗi: rubuta adireshin Home Assistant naku (misali http://homeassistant.local:8123) da alamar shiga (token) mai dogon zango (ƙirƙira ɗaya a ƙasan shafin bayanin martaba na Home Assistant naku). Ana ajiye alamar shiga cikin kalmomin sirri da maɓallai, ba a fayil na saituna ba. Ana amfani da http kawai don adiresoshi a cibiyar sadarwar gidanku; don sabar da ke wani wuri kunna “Sabobi a wajen cibiyar sadarwar gida” a saituna kuma yi amfani da https tare da takardar shaida mai inganci.\n\nZaɓi na'urori yana buɗe jerin abin da sabarku ke da shi: nema da suna ko id kuma zaɓi na'ura don nuna ta (sake zaɓar ta yana cire ta). Kuna iya ba ta ɗaki, wanda ke haɗa ta a rukuni a allon bayani da cikin widget na ɗaki. Ana ajiye na'urori har 24. A allon bayani zaɓi fitila, makunni ko fage don kunnawa ko kashewa: layin yana nuna amsar sabar. Sensa da kuka zaɓa ana sake karanta ta.\n\nWidget (riƙe allon gida, sannan ƙara widget): Ƙimar gida mai wayo tana nuna karatu ɗaya babba, rukuni yana jera na'urorin ɗaki, makunni maɓalli ne don fitila ɗaya ko makunni ɗaya, kuma ɗaki kati ne mai karatu da makunnan ɗaki. Saitunan kowane widget suna faɗin wace na'ura ko wane ɗaki yake nunawa.\n\nAna karanta gidan lokacin da kuka buɗe allon bayani, lokacin da kuka nema (layin Sabunta yanzu ko taɓa widget na ƙima ko na rukuni), lokacin da na'urar ta farka inda Wi-Fi ke a haɗe, da kuma bisa jadawalin da kuka saita yayin da caja ke a haɗe. Ba ya taɓa kunna rediyo da kansa kuma ba ya taɓa barin sa a kunne."
