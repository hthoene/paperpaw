calibre.plugin.name = Laburare mara waya
calibre.plugin.description = Yana karɓar littattafai ta intanet. Yana aiki a matsayin na'ura mara waya ga Calibre.
calibre.plugin.how = "Laburare mara waya yana sa na'urar ta bayyana a Calibre a kwamfutarku a matsayin na'ura mara waya. Daga nan Calibre zai iya aika mata littattafai, ya jera su kuma ya goge su. Littattafan suna shiga laburare.\n\nBuɗe Laburare mara waya daga menu na Kayan aiki, na'urar da kwamfutar suna cikin cibiyar Wi-Fi ɗaya. A Calibre zaɓi “Connect/share”, sannan “Start wireless device connection”. Idan na'urar ta sami kwamfutarku za ta nuna sunanta; taɓa Haɗa (da maɓallai, danna Zaɓi). Calibre zai iya ƙara da goge littattafai a nan, don haka ku haɗa da kwamfutarku kawai. Rufe allon yana kawo ƙarshen haɗin.\n\nIdan ba a sami Calibre da kansa ba, shigar da adireshin kwamfutarsa a Saituna, ƙarƙashin Laburare, a matsayin Adireshi a sashen Calibre. Idan Calibre yana amfani da wani port ba 9090 ba, ƙara shi a matsayin :port, misali 192.168.1.20:9091."
