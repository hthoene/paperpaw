help.setting.show.help = A karon farko da allo ya buɗe, gajeren bayani yana faɗin abin da sarrafawarsa ke yi.
help.setting.again = Sake nuna shawarwari
help.setting.again.help = Shawarwarin kowane allo za su sake fitowa sau ɗaya, a lokaci na gaba da ya buɗe.
