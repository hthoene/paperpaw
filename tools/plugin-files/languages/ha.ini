setup.plugin.name = Saitawa
setup.plugin.description = Gajeren jagora ta saitunan da suke da muhimmanci, a farawa ta farko.
setup.plugin.how = "Saitawa gajeren jagora ce ta saitunan da suke da muhimmanci, wadda ake nunawa sau ɗaya, a karon farko da PaperPaw ya fara. Kowane shafi yana tambayar abu ɗaya, kamar harshe, maɓallai, girman rubutu, yankin lokaci, Wi-Fi ko wasu plugin da za a ƙara, tare da amsa mai ma'ana da aka riga aka zaɓa, don haka Na gaba koyaushe daidai ne. Matakan da wannan na'urar ba ta buƙata an bar su.\n\nTaɓa maɓallan allo, ko yi amfani da maɓallan sama da ƙasa da Zaɓi. Tsallake a shafin farko yana barin saitawa nan take. Shafin ƙarshe yana faɗin inda littattafanku ke fitowa.\n\nDon sake gudanar da ita, buɗe saituna kuma zaɓi Saita PaperPaw. Duk abin da aka zaɓa a nan ana iya canza shi a saituna daga baya."
