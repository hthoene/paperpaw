aids.plugin.name = Taimakon karatu
aids.plugin.description = Farkon kalmomi da kauri, kalmomin da aka maye, hotuna: rubutu yadda kuke so.
aids.plugin.how = "Taimakon karatu yana canza yadda rubutun littafi yake yayin da kuke karatu. Yana shafar kowane littafi. Farkon kalmomi da kauri da Maye kalmomi a kashe suke da farko.\n\nKuna samun su a Saituna, ƙarƙashin Karatu, a sashen Taimakon karatu. Farkon kalmomi da kauri yana sa rabin farko na kowace kalma da kauri, wanda wasu ke ganin yana sauƙaƙa bin rubutu. Maye kalmomi yana karɓar nau'i-nau'i da aka rubuta kamar \"colour = color; Mr. = Mister\", an raba su da waƙafin ɗigo.\n\nCikakkun kalmomi kawai ake maye, daidai yadda kuka rubuta su, don haka \"color\" ba ya taɓa canza wani sashe na kalma mafi tsawo. Ba a canza fayil ɗin littafin kansa ba.\n\nHotuna a littattafai za a iya nuna su (kamar da farko), a mayar da su gajeren layi kamar \"[Hoto: jirgin ruwa a teku]\" da ke amfani da bayanin hoton, ko a bar su. Shafi zai sami ƙarin wuri don rubutu, kuma ba a buɗe komai don hoton da ba a nuna ba, wanda ke sa shafuka su juya da sauri. Ba a canza zane-zanen barkwanci da sauran littattafan da aka yi da hotuna ba."
