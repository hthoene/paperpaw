fonts-browser.plugin.name = Ƙarin nau'ukan rubutu
fonts-browser.plugin.description = Yana nuna nau'ukan rubutu daga intanet, kowanne da misali, kuma yana sauke su don karatu da su.
fonts-browser.plugin.how = "Ƙarin nau'ukan rubutu yana jera nau'ukan rubutu daga wani laburaren nau'ukan rubutu a intanet, kowane suna a cikin nau'in rubutunsa, kuma yana sauke waɗanda kuke so ku yi karatu da su.\n\nZa ku same shi a ƙarshen jerin nau'ukan rubutu inda ake zaɓar nau'in rubutun karatu, a Saituna, ƙarƙashin Karatu, a matsayin Nau'in rubutu; layukan matsayi suna da shigarwa iri ɗaya don nau'in rubutunsu. Taɓa nau'in rubutu (da maɓallai, danna Zaɓi) don ganinsa da girma tare da jumlar misali, sannan zaɓi Sauke. Kuna iya barin shafin yayin da yake saukewa. Idan ya gama, zaɓi Karanta da (sunan nau'in rubutun), ko Yi amfani don layukan matsayi. Sabunta yana kawo sabuwar siga, Cire yana goge nau'in rubutun daga na'urar.\n\nYana buƙatar Wi-Fi.\n\nNAU'UKAN RUBUTUNKU\n\nKusa da Ƙarin nau'ukan rubutu, jerin yana da Nau'ukan rubutunku, wanda ke nuna wannan sashe na taimako. Nau'in rubutunku fayil ne na .ttf ko .otf, misali daga Google Fonts.\n\nA kan Android da sauran na'urori masu zana fayilolin nau'in rubutu: kwafi fayil ɗin cikin foldar fonts (a Android: PaperPaw/fonts a ma'ajiyar da aka raba), sake kunna PaperPaw sannan zaɓi nau'in rubutun a Saituna, ƙarƙashin Karatu, a matsayin Nau'in rubutu.\n\nA kan Xteink X4 da X4 Pro: waɗannan na'urorin karatu suna karanta fakitin nau'in rubutu, ba fayilolin nau'in rubutu ba, domin fayilolin nau'in rubutu ba za su ishe ƙwaƙwalwarsu ba. Yi fakiti a kwamfuta da paperpaw-fontgen, don kowane salon da kuke da shi (ana buƙatar --regular):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nWannan yana yin foldar plugins/font-my-font. Kwafi ta cikin foldar plugins a katin ƙwaƙwalwa, sake kunnawa, sannan zaɓi My Font a matsayin Nau'in rubutu. Fakitin salo ɗaya kusan rabin megabyte ne don haruffan Latin; salon da kuka bari ana zana su da na --regular. Kayan aikin yana faɗin nawa daga cikin haruffan da kuka nema nau'in rubutun yake da su (--chars latin,cyrillic,greek yana ƙara wasu rubutun haruffa): nau'in rubutu da ba shi da haruffan littafinku ba zai iya nuna su ba, don haka nemi wanda ya ƙunshi rubutun haruffan littafin.\n\nNau'ukan rubutu daga Ƙarin nau'ukan rubutu suna aiki haka kuma ba sa buƙatar kwamfuta.\n\nDon ƙananan rubutu masu kaifi a allon e-ink, ƙara --hinting light a umarnin: yana daidaita haruffa da grid na pixel, kamar yadda aka yi nau'ukan rubutu na asali. Ba tare da shi ba, ana zana haruffa yadda mai zanen nau'in rubutun ya tsara su; --hinting normal da --hinting mono suna daidaita su da ƙarfi. Nau'ukan rubutu masu alamomi a sama ko ƙasan haruffa, kamar Larabci ko Devanagari, gara a bar su ba tare da shi ba."
