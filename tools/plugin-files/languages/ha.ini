notes-overview.plugin.name = Duk bayanan kula
notes-overview.plugin.description = Alamomin shafi da haskakawar dukan littattafai a jeri ɗaya, da fitarwa a matsayin My Clippings.txt.
notes-overview.plugin.how = "Duk bayanan kula yana jera kowane littafi da kuka sa masa alamar shafi ko haskakawa, tare da yawansu. Buɗe shi a Kayan aiki. Zaɓi littafi don ganin bayanan kulansa, da bayanin kula don buɗe littafin a wurin.\n\nA ƙarshen jerin, Fitar a matsayin My Clippings.txt yana rubuta dukan bayanan kula a fayil ɗaya, a cikin folda Exports kusa da laburare, a tsarin da Kindle ke amfani da shi (UTF-8). Manhajojin da ke karanta My Clippings.txt na Kindle za su iya karanta shi. Bayanin kula a kan haskakawa shigarwa ce ta daban, kamar a Kindle. Saboda littafi a nan ba shi da wuraren Kindle, “location” shi ne nisan da bayanin kula yake a cikin littafin, a kashi cikin ɗari. Ana sake rubuta fayil ɗin kowane lokaci; yana maye gurbin na baya."
