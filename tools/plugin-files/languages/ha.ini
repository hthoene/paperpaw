vocabulary.plugin.description = Yana adana kalmomin da kuke dubawa, tare da jumlolinsu, kuma yana bitar katunan koyo da maimaitawa bisa tazara, waɗanda kuka yi a wayarku.
vocabulary.plugin.how = "Jerin kalmomi yana adana kalmomin da kuke dubawa yayin karatu, kowace da jumlarta, don ku sake duba su daga baya. Jerin yana cikin Kayan aiki, sababbi a farko; zaɓi kalma don sake duba ma'anarta. Layi na ƙarshe, Fitar, yana ajiye su don manhajojin katunan koyo kamar Anki. Jerin yana riƙe sababbin kalmomi 2,000: bayan haka, tsofaffi suna tafiya, don haka ku fitar da su tukuna idan kuna son riƙe su duka.\n\nKatunan koyo, su ma a Kayan aiki, suna tambayarku da maimaitawa bisa tazara: bayan Nuna amsa kuna ba kowane kati maki Sake, Da wuya, Da kyau ko Da sauƙi, kuma wannan ne ke tantance lokacin da zai dawo. Ƙirƙiri tarukan katuna da Gyara da waya: duba lambar da waya a cikin Wi-Fi ɗaya, sannan rubuta katuna ko ƙara da yawa lokaci ɗaya: buɗe tari a can, zaɓi Katuna da yawa lokaci ɗaya sannan zaɓi fayil na CSV, TSV ko TXT (kati ɗaya a kowane layi: gaba, baya, misali; UTF-8), liƙa jeri, ko kawo tarin Anki (.apkg, wanda aka fitar da “Support older Anki versions”).\n\nKo yi amfani da fayiloli a katin SD: saka fayil na CSV, TSV ko TXT, ko tarin Anki (.apkg, wanda aka fitar da “Support older Anki versions”), ga kowane tari a folda Flashcards (Turanci.tsv yana yin tarin Turanci; kati ɗaya a kowane layi: gaba, baya, misali; an ajiye a matsayin UTF-8; layin farko na iya ambaton ginshiƙan front, back, example). Zaɓi Katuna a katin SD a Katunan koyo, ko bari ya faru idan kun buɗe Katunan koyo. Tarukan suna zama a na'urar tare da abin da kuka koya, kuma ana haɗa fayil da tarinsa duk lokacin da yake sabo ko an canza shi: canza baya ko misalin kati a fayil ɗin, katin zai canza kuma ya riƙe ci gabansa; canza rubutun gaba, za a ɗauke shi sabon kati, tsohon kuma zai fara daga farko (ana bambanta katuna da rubutun gaba; tazara da manyan haruffa ba su da tasiri); layin da kuka goge ba ya goge katin (sai dai idan kun saita “katunan da babu su a fayil” zuwa Cire ga wannan tarin: sannan za a cire katin a sabuntawa ta gaba tare da ci gabansa, har abada, kuma ba a cire komai muddin ba a iya karanta wani layi na fayil ɗin ba). Ajiye tari a fayil ɗinsa da Ajiye a katin: fayil ɗin yana samun lambobin katunan (ginshiƙin id), don ku iya gyara gaba a kwamfuta kuma katunan su riƙe abin da kuka koya; fayil ɗin yana riƙe id, gaba, baya da misali kawai (ba a riƙe sauran ginshiƙai, sharhi da jerin layuka), kuma ana ƙin ajiyewa muddin ba a iya karanta wani layi na fayil ɗin ba; ana kwafa fayil ɗin da ke can zuwa _suna.bak.tsv a karon farko (ajiyewa ta gaba ba ta maye gurbin wannan kwafin). Ba a karanta fayil da ya wuce 4 MiB ko layuka 20,000, kuma dole a ajiye shi a matsayin CSV UTF-8, ba UTF-16 ba. A karon farko, na'urar tana ƙirƙirar foldar tare da bayanin yadda take aiki.\n\nA saituna, ƙarƙashin Karatu, Yi katuna daga kalmomin da aka duba yana saka kowace kalmar da aka duba cikin tarin Kalmomin da aka duba."
