puzzles.plugin.name = Wuyar warwarewa
puzzles.plugin.description = Sudoku, kalmomin gicciye da wuyar dara, ba tare da intanet ba, da wuyar warwarewa ta yau.
puzzles.plugin.how = "Wuyar warwarewa don jirgi da ɗakin jira, duk ba tare da intanet ba: sudoku, kalmomin gicciye da wuyar dara. Buɗe Wuyar warwarewa daga menu na kayan aiki, ko ƙara widget ɗin Wuyar warwarewa ta yau a allon gida (riƙe allon gida, sannan ƙara widget): yana nuna yadda sudoku na yau ya kai, kuma taɓawa tana buɗe shi. Sudoku na yau iri ɗaya ne yini guda.\n\nSudoku: Hagu da Dama suna matsar da mai nuni akwati-akwati, Sama da Ƙasa (maɓallan shafi) layi ɗaya. Zaɓi yana buɗe lambobi: zaɓi ɗaya sannan sake Zaɓi don saka ta, ko Share don wofintar da akwatin. Riƙe Zaɓi (ko Menu) don isa ga maɓallan da ke ƙarƙashin allon wasa: Bayanan kula yana mayar da lambobi alamun fensir, Duba yana yi wa akwatunan da ba daidai ba alama, Warware yana mayar da motsi na ƙarshe, Sabo yana fara sabon wasa na matakin da kuka zaɓa (Mai sauƙi, Matsakaici, Mai wuya). Kowane wasa yana da amsa ɗaya tak. Ana ajiye wasan idan kuka fita. A allon taɓawa, taɓa akwati.\n\nKalmomin gicciye: saka fayilolin .puz (Across Lite) ko .ipuz a folda “puzzles” a katin ƙwaƙwalwa; ba a haɗa ko ɗaya ba. Matsa a kan akwatunan, sannan Zaɓi don rubuta kalmar da ke ƙarƙashin mai nuni a madannai (layin ƙasa _ yana bar akwati babu komai). Maɓallan suna sauyawa tsakanin kwance da tsaye, suna nuna jerin tambayoyi, suna duba haruffa kuma suna bayyana kalmar. Ana ajiye haruffan kowane fayil. Ba za a iya buɗe fayilolin .puz da aka ɓoye ba.\n\nWuyar dara: ƙaramin tarin daga ma'ajiyar wuyar dara ta Lichess (CC0). Hagu da Dama suna tsallakawa daga ɗan dara zuwa wani, zaɓi ɗan darar da kuke son motsawa, sannan Hagu da Dama ta wuraren da zai iya zuwa, kuma sake Zaɓi. Ana mayar da motsi mara daidai. Alama tana nuna ɗan darar da za a motsa, Na gaba yana zuwa wuyar warwarewa ta gaba.\n\nAllon wasa yana sake zana akwatunan da suka canza kawai. Ƙididdiga tana ƙidaya wasannin da kuka warware."
