bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Yana haɗa remot, allon rubutu da na'urorin ji, kuma yana haɗa su.
bluetooth.plugin.how = "Bluetooth yana haɗa remot, allon rubutu da na'urorin ji da na'urar karatu, inda take da Bluetooth (X4 Pro).\n\nƘara na'ura yana neman abin da ke kusa; da farko sa na'urar a yanayin haɗawa. Zaɓe ta, sannan tabbatar a na'urar karatu (kwatanta lambar inda aka nuna ɗaya). Daga nan maɓallan remot ko allon rubutu suna juya shafuka da motsawa cikin menu; canza abin da kowane maɓalli ke yi a ƙarƙashin Sarrafawa.\n\nRemot yana faɗin lokacin da maɓallansu ke aiki: idan an kunna a nan, yayin karatu (a haɗe yayin da littafi ke buɗe, don adana batir), ko kullum. Maɓallin menu ko dogon dannawa a kan na'ura yana mantawa da ita.\n\nNa'urar ji don plugin ce: kunna plugin da zai iya amfani da ita. Bluetooth yana kashe duk lokacin da babu abin da ke amfani da shi."
