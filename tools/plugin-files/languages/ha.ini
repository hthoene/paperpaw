keys.plugin.name = Maɓallai da isharori
keys.plugin.description = Abin da kowane maɓalli, yankin taɓawa da shafawa ke yi, ana canzawa a na'urar.
keys.plugin.how = "Maɓallai da isharori yana nuna abin da kowane maɓalli, yankin taɓawa da shafawa ke yi, kuma yana ba ku damar canza shi a na'urar.\n\nBuɗe shi a saituna, ƙarƙashin Na'ura. Da farko zaɓi inda canji zai yi aiki: Ko'ina, Lokacin karatu, A allon gida, A laburare ko a wani kayan aiki ɗaya. Sannan zaɓi shigarwa, kamar maɓallin da aka riƙe ko shafawa daga gefe, kuma zaɓi aiki daga jerin, wanda za ku iya bincika. Na asali yana maido da abin da plugin da tsarin maɓallai suka saita.\n\nA kan X4, ana ƙin canjin da zai bar babu maɓallin zaɓi, komawa baya ko ci gaba. Maido da maɓallai da isharori a ƙarshe yana janye kowane canji."
