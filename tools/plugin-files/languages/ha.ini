translate.plugin.name = Fassara
translate.plugin.description = Yana fassara rubutun da aka zaɓa a intanet, da DeepL.
translate.plugin.how = "Fassara yana fassara rubutun da aka zaɓa a intanet da DeepL. Zaɓi rubutu a littafi kuma zaɓi Fassara a menu na rubutun da aka zaɓa: fassarar tana bayyana a kan shafin kamar shigarwar ƙamus. Maɓallan shafi ko taɓawa suna gungura ta, kuma Zaɓi ko taɓawa a ƙarshenta yana rufe ta.\n\nYana buƙatar intanet da maɓallin DeepL API naku na kanku, kyauta a deepl.com (DeepL API Free, kusan haruffa 500,000 a wata). Kafin ku shigar da shi, allon yana faɗin haka, kuma taɓawa tana neman sa.\n\nA saituna, a ƙarƙashin Karatu, a sashen Fassara, Fassara zuwa yana saita harshen; da farko harshen PaperPaw ne."
