diagnostics.plugin.name = Gwaje-gwaje
diagnostics.plugin.description = Allon gwaji da binciken kowane ɓangare na na'ura mataki-mataki.
diagnostics.plugin.how = "Gwaje-gwaje allon gwaji ne don duba na'ura: yana nuna kowane matakin toka da allon zai iya nunawa, akwatuna huɗu don gwada maɓallai da taɓawa, da ƙidayar shafi tare da sandar ci gaba don kwatanta hanyoyin sabunta allo.\n\nAllon gwajin ba shi da shigarwa a menu. Yana zama allon gida ne kawai idan babu wani plugin da ke bayar da ɗaya, ko idan kun zaɓe shi ƙarƙashin Allo a manajan plugin don wurin Allon gida.\n\nZaɓi yana yi wa akwatin da aka mayar da hankali alama, kuma maɓallan kibiya suna motsawa tsakanin akwatunan; da taɓawa, taɓa akwati. Maɓallan shafi suna juya shafukan gwaji. Riƙe Zaɓi, ko riƙe yatsa a kan allo, don farawa daga farko.\n\nDuba na'ura, ƙarƙashin Kayan aiki inda PaperPaw ne firmware na na'urar, yana bin kowane ɓangare na na'ura shafi ɗaya bayan ɗaya: allo, maɓallai, taɓawa, hasken gaba, batir, kati, agogo, Wi-Fi, barci da ƙwaƙwalwa. Kowane shafi yana ƙarewa da Ya kasa, Tsallake da Ya yi aiki, an riga an zaɓi amsar da ma'aunansa suka nuna; ana tsallake ɓangarorin da na'ura ba ta da su. Bayan kowace amsa yana rubuta rahoto a .paperpaw/plugins/diagnostics/device-check.txt, don liƙawa cikin pull request. Baya yana fita daga ciki, kuma yana ci gaba daga inda yake idan an sake buɗe shi. A na'urar da ke da maɓallai kawai, fara zaɓar Fara a shafin maɓallai; har zuwa lokacin kibiyoyi, Zaɓi da Baya suna aiki kamar a kowane shafi."
