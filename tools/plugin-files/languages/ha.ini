opds.plugin.name = Kundayen OPDS
opds.plugin.description = Yana bincika kundayen OPDS, yana sauke littattafansu kuma yana daidaita foldoji da su.
opds.plugin.how = "Kundayen OPDS laburaren intanet ne kamar Project Gutenberg, Calibre-Web, Kavita ko Komga. Wannan plugin yana bincika su kuma yana nema a cikinsu kamar foldoji, yana sauke littattafansu zuwa laburare.\n\nBuɗe Kundaye daga menu Kayan aiki kuma zaɓi Ƙara kundi: adireshi kuma, idan kundin yana buƙatar asusu, sunan mai amfani da kalmar sirri. Taɓa kundi don bincika shi; riƙe shi (da maɓallai, riƙe Zaɓi) don daidaitawa, gyarawa ko cire shi.\n\nIdan Daidaita wannan kundin yana a kunne, Daidaita kundaye yana sauke sababbin littattafansa zuwa foldarsa. Littattafai a kowace daidaitawa yana iyakance yawan da daidaitawa ɗaya ke samowa, don kada babban kundi ya cika na'urar. Folda ta girgije (WebDAV) tana aiki a madadin kundi."
