menu-editor.plugin.name = Gyaran menu
menu-editor.plugin.description = Yana sake tsarawa, cirewa da ƙara abubuwan kowane menu.
menu-editor.plugin.how = "Gyaran menu yana canza abin da ke cikin menu: matsar da abubuwa sama ko ƙasa, cire su, ko ƙara sababbi.\n\nKuna samunsa a Saituna ƙarƙashin Keɓancewa, a matsayin Keɓance menu. Zaɓi menu, sannan abu don matsar ko cire shi; Ƙara abu yana saka sabo. Canje-canje suna aiki nan take. Maido da wannan menu yana mayar da menu yadda plugin ɗinsa suka tsara shi, Maido da dukkan menu yana yin haka ga kowanne.\n\nBa za ku iya kulle kanku a waje ba: abin da ke hanyar zuwa saituna yana zama har sai kun ƙara wata hanya zuwa gare su."
