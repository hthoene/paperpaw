profiles.plugin.name = Bayanan martaba na karatu
profiles.plugin.description = Rukunin saitunan karatu da nuni masu suna, ana sauyawa da taɓawa ɗaya.
profiles.plugin.how = "Bayanin martaba yana ajiye saitunan karatu, saitunan nuni da layukan matsayi naku a ƙarƙashin suna, kamar Dare ko Babban rubutu, kuma yana dawo da su da taɓawa ɗaya.\n\nBuɗe Bayanan martaba a menu na karatu a ƙarƙashin Ƙari, ko a Saituna a ƙarƙashin Keɓancewa. Taɓa bayanin martaba don amfani da shi; wanda ake amfani da shi yana da alama. Riƙe shi (da maɓallai, riƙe Zaɓi) don ajiye saitunan yanzu a cikinsa, sake masa suna ko cire shi. Ajiye a matsayin sabon bayanin martaba yana ajiye abin da aka saita yanzu.\n\nBayanin martaba na gaba yana sauyawa zuwa na gaba a jerin; sa shi a maɓalli ko a ƙa'ida."
