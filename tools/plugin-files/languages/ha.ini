news.plugin.name = Labarai
news.plugin.description = Yana ɗauko tashoshin labarai (RSS, Atom) a matsayin littattafan karantawa.
news.plugin.how = "Labarai yana mai da tashoshin RSS ko Atom littattafai. Kowace tasha tana zama littafi ɗaya a foldar Labarai ta laburare, da sabbin maƙalolinta a matsayin rubutu kawai, don a karanta kamar kowane littafi.\n\nBuɗe Labarai daga menu na Kayan aiki kuma zaɓi Ƙara tasha; adireshinta yana kan shafin yanar gizo na jaridar ko bulogin. Ɗauko labarai yana ɗauko dukkan tashoshi kuma yana maye gurbin littattafan da suka gabata. Riƙe tasha (da maɓallai, riƙe Zaɓi) don ɗauko ta ko cire ta ita kaɗai. Tashar da aka cire tana barin littafinta a laburare.\n\nƊaukowa yana buƙatar intanet. Maƙaloli a kowace tasha (Saituna, Laburare) yana saita maƙaloli nawa kowane littafi ke ɗauke da su. Widget ɗin kanun labarai na Labarai yana nuna su a allon gida."
