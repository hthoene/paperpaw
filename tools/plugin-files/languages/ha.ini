rules.plugin.name = Ƙa'idoji
rules.plugin.description = Idan wani abu ya faru, yana yin wani abu: misali yanayin dare da ƙarfe 22:00.
rules.plugin.how = "Ƙa'ida tana yin wani abu da kanta idan wani abu ya faru: kunna yanayin dare kowace rana da ƙarfe 22:00, ko daidaita kundaye idan PaperPaw ya fara.\n\nƘa'idoji suna cikin Saituna ƙarƙashin Keɓancewa, a matsayin Ƙa'idoji. Ƙara ƙa'ida yana tambaya Yaushe? (PaperPaw ya fara, wani lokaci na rana, an buɗe ko rufe littafi, batir, caji, makunni da sauransu) da Me za a yi? (gudanar da aiki, kunna ko kashe makunni, saita lamba, nuna saƙo). Taɓa ƙa'ida don dakatar da ita; riƙe ta (da maɓallai, riƙe Zaɓi) don sharaɗi kamar Tsakanin lokuta biyu na rana, ko don cire ta.\n\nAyyuka, makunnai da lambobin da za a zaɓa an jera su bisa plugin: zaɓi plugin ɗin, sannan abin da ya kawo; Baya yana sake fita daga ciki. Aikin da ke aiki a kan allon da ake nunawa, kamar Baya ko Shafi na gaba, yana yin abin da zai yi idan an danna shi a can.\n\nLokuta suna aiki ko wane allo ne a buɗe. Ƙa'idoji biyu da ke ci gaba da warware juna suna tsayawa bayan ƴan matakai."
