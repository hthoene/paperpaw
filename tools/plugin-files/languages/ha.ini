sleep.plugin.name = Allon barci
sleep.plugin.description = Yana nuna mage mai barci, bangon littafi, hotunanku ko saƙo yayin da na'urar ke barci.
sleep.plugin.how = "Allon barci yana yanke abin da allo zai nuna yayin da na'urar ke barci. E-ink yana riƙe hoton ba tare da wuta ba.\n\nZaɓe shi a saituna, ƙarƙashin Na'ura, Allon barci, a Nuna: mage mai barci (na asali), bangon littafi, hotunana, tambari da “Barci”, widget, shafin yadda yake, ko shafin da hoto. Hotunana yana nuna fayilolin foldar hotuna ɗaya bayan ɗaya.\n\nIdan babu bango ko hoto, mage yana bayyana. Inda tsarin ke zana allon barci da kansa, waɗannan saituna suna ɓoye.\n\nAllon kashewa, Nuna lokacin kashewa, ana zana shi sau ɗaya yayin da ake kashe na'urar, daga menu na wuta ko bayan lokacin Kashe bayan barci (ba lokacin da batir ya ƙare ya yanke wuta ba). Yana kamar allon barci sai dai idan kun zaɓi tambari da “An kashe”, mage, bango ko hotunana. Wani plugin na iya ba da allo don shi.\n\nAllon farawa da na sake farawa, Nuna lokacin farawa da Nuna lokacin sake farawa, na na'urar ne sai dai idan wani plugin ya ba da allo don su. Plugin ba sa aiki tukuna yayin da na'urar ke farawa: ana zana allon da aka zaɓa don farawa tun kafin lokaci, yayin da na'urar ke kashewa ko sake farawa, kuma ana nuna shi a farawa ta gaba. Allon da bai shirya a kan lokaci ba, ko hoton da ya lalace, yana ba da wuri ga na na'urar; na'urar tana kashewa ko sake farawa ko ta yaya."
