widgets.plugin.name = Kunshin widget
widgets.plugin.description = Ƙarin widget masu yawa don allon gida: agogo, kalanda, zantuka, littattafai, bayanan kula da ƙari.
widgets.plugin.how = "Kunshin widget yana ƙara widget masu yawa don allon gida: agogo (mai allura, na kalmomi, a tayal, na duniya), kalanda, Shekara zuwa yanzu, ƙidayar kwanaki, matakin wata, da rana da kwanan wata; Zancen rana, bayanan kula, abubuwan yi, hotuna, gaisuwa da tambarin PaperPaw; kuma don littattafai, Ana karantawa yanzu, ci gaban littafi, Na gaba, silsila, waɗanda aka fi so, haskakawa da laburare a lambobi. Akwai kuma widget na batir.\n\nƘara su da Gyara allon gida a menu (ko riƙe allon gida), sannan Ƙara widget. Kowanne yana da saitunansa, kamar iyaka, girma da jeri. Zaɓar widget mai canzawa, kamar Zancen rana, yana nuna na gaba. Zantukanku suna shiga quotes.txt a .paperpaw/plugins/widgets a kan katin, kowane layi a matsayin rubutu | marubuci. Widget na lokaci suna buƙatar an saita agogo; Wi-Fi yana saita shi."
