diagnostics.plugin.name = Baaritaan
diagnostics.plugin.description = Shaashad tijaabo iyo hubin hagaysa oo qayb kasta oo qalabka ah.
diagnostics.plugin.how = "Baaritaanku waa shaashad tijaabo oo qalab lagu hubiyo: wuxuu muujiyaa heer kasta oo cawlan oo shaashaddu soo bandhigi karto, afar sanduuq oo lagu tijaabiyo badhamada iyo taabashada, iyo tiriyaha bogagga oo leh xariiq horumar si loo barbar dhigo habab cusboonaysiinta.\n\nShaashadda tijaabadu ma laha menu gelitaan. Waa shaashadda hore oo keliya inta aan plugin kale bixin mid, ama marka aad doorato Shaashadaha maareeyaha plugin-ka meesha Shaashadda hore.\n\nDooro wuxuu calaamadiyaa sanduuqa la xoojiyay, badhamada fallaadhaha ayaa u dhaqaaqa sanduuqyada dhexdooda; taabashada, taabo sanduuq. Badhamada bogga waxay rogaan boggagga tijaabada. Hay Dooro, ama hay far shaashadda, si aad dib uga bilowdo.\n\nHubinta qalabka, hoostiisa Qalab meesha PaperPaw uu yahay firmware-ka qalabka, waxay marta qayb kasta oo qalabka ah hal bog hal mar: shaashadda, badhamada, taabashada, iftiinka hore, batariga, kaarka, saacadda, Wi-Fi, hurdada iyo xusuusta. Bog kasta wuxuu ku dhammaadaa Fashil, Ka bood iyo Gudub, jawaabta cabbirradiisu soo jeediyaan ayaa la doortay; qaybaha qalabku aanu lahayn waa la ka booda. Jawaab kasta ka dib wuxuu qoraa warbixin .paperpaw/plugins/diagnostics/device-check.txt, si loogu dhejiyo pull request. Dib wuxuu ka baxaa, wuxuuna ku sii socdaa meeshii uu joogay marka mar kale la furo. Qalabka badhamada oo keliya, marka hore dooro Bilow bogga badhamada; ilaa markaas fallaadhaha, Dooro iyo Dib way shaqeeyaan sida bog kasta."
