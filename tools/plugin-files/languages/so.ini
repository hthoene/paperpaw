home.plugin.name = Shaashadda hore
home.plugin.description = Bogga bilawga: boggag widget-yo ah, sida buugga la akhrinayo iyo qalabka.
home.plugin.how = "Shaashadda hore waxay ka samaysan tahay boggag, mid kastaa shabaq widget-yo iyo qalab ah sida taleefan. Marka hore saacadda, buugga aad akhrinayso iyo buugagta dhawaan la akhriyay waxay ku yaalliin hal bog, qalabka oo dhan bogga xiga.\n\nTaabo shay si aad u furto, oo jiid ama isticmaal badhamada bogga si aad boggagga u beddesho. Badhamada oo keliya, badhamada fallaadhaha waxay ka dhaqaaqaan shay ilaa kan xiga Dooro wuuna furaa.\n\nSi aad dib u habayso, hay shaashadda hore, taabo qalinka bogga hoostiisa ama dooro Wax ka beddel shaashadda hore menu-ga. Jiid shay si aad u dhaqaajiso ama taabo mid si aad u hesho ikhtiyaaraadkiisa, sidoo kale badhamada. Ku dar widget sidoo kale halkaas ayuu ku yaal. Tiirarka iyo Safafka waxay ku yaalliin dejinta, hoosta Muuqaalka, qaybta Shaashadda hore.\n\nShaashad dhinac loo rogay, shaashadda horuhu waxay muujisaa isla shayada oo tiirar ka badan, bog kasta oo la buuxiyo kan xiga ka hor, iyo kaararka aan ka weynayn qiyaastii 110 mm; waxa aad taagnaan u habaysay waxba lama beddelo. Dhinaca ku habee oo qaabkaas waa la hayaa dhinacaas oo keliya: widget-yada cusub labadaba waa lagu daraa. Dib u dhig qaabka dhinaca ee Ku dar (inta wax la bedelayo) wuxuu ku laabtaa kii laga soo qaaday. Ka saarista widget ama qalab hal dhinac ma ka saarto dhinaca kale."
