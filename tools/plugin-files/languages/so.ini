format-cbz.plugin.name = Majaajilo
format-cbz.plugin.description = Wuxuu furaa kaydadka majaajilada (.cbz), sawir bog kasta.
format-cbz.plugin.how = "Wuxuu furaa kaydadka majaajilada (.cbz): sawir bog kasta, shaashadda lagu habeeyay, sida magacyadooda u kala horreeyaan (2 ka hor 10).\n\nKu dhig galka maktabadda oo ka fur maktabadda; rog boggagga sida buug kasta. Sawirro waaweyn waxay qaadataan daqiiqad marka ugu horreysa, X4 ka badan meelo kale.\n\nDejinta akhriska (Dejinta, Akhris): “Qayb-qayb” wuxuu muujiyaa hal qayb oo bog ah mar kasta, intii ugu weyneyd ee shaashaddu oggol tahay, bog rogiduna wuxuu dhex maraa; bog aan qaybo lahayn dhammaantiis ayaa la muujiyaa. “Boggagga majaajiladu waxay u socdaan” wuxuu muraayad ka dhigaa bog rogista manga (midig ilaa bidix); ComicInfo.xml ee buugga laftiisa ayaa tan laftiisa sheegta. Maktabaddu waxay muujisaa cinwaanka buugga iyo taxanihiisa iyo lambarkiisa ComicInfo.xml."
format-cbz.title = Majaajilo (CBZ)
format-cbz.setting.direction = Boggagga majaajiladu waxay u socdaan
format-cbz.setting.direction.help = Manga: bog rogista waa la muraayad-ka-dhigaa.
format-cbz.direction.book = Sida buuggu yidhaahdo
format-cbz.direction.ltr = Bidix ilaa midig
format-cbz.direction.rtl = Midig ilaa bidix
format-cbz.setting.panels = Qayb-qayb
format-cbz.setting.panels.help = Hal qayb mar kasta, bog rogistu way dhex marto.
format-docx.plugin.name = Dukumentiyada DOCX
format-docx.plugin.description = Wuxuu furaa faylasha .docx, sida Word iyo barnaamijyo kale u kaydiyaan.
format-docx.plugin.how = "Wuxuu furaa dukumentiyada .docx sida buugag: cinwaanno leh tusmo, liisas, jadwallo, dhumuc weyn iyo xagal, isku-xidhyo iyo sawirro (JPEG, PNG, GIF).\n\nKu dhig faylasha galka maktabadda oo ka fur maktabadda. Cinwaanka iyo qoraagu waxay ka yimaadaan sifooyinka dukumentiga. Xaashiyaha hoose, madaxyada iyo cagaha, iyo faallooyinka lama muujiyo."
format-docx.title = Dukumenti DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Wuxuu furaa buugagta EPUB iyagoo leh qaabkooda, tusmadooda iyo sawirradooda.
format-epub.plugin.how = "Buugagta EPUB waxay ka furmaan maktabadda sida buug kasta oo kale, iyagoo leh tusmadooda, sawirradooda iyo qaabka daabacaadda. Bogagga webka (HTML), Markdown, FictionBook (.fb2) iyo kaydadka majaajilada (.cbz) sidaas oo kale ayay u furmaan, mid kastaana plugin u gaar ah.\n\nCutub waa la beddelaa markii ugu horreysay ee aad furto oo waxaa lagu kaydiyaa kaydka plugin-ka, sidaas darteed daqiiqad ka dib wuu dhakhso badan yahay, buugagta waaweynuna waxay ka shaqeeyaan qalabka yaryar. Tusmada ka hel Tusmo menu-ga akhriska. Haddii qaabka buugga laftiisa la isticmaalo waa dejinta Qaabka daabacaaduhu, hoosta Akhris."
format-epub.title = Buug elektaroonig ah EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Wuxuu furaa buugagta FictionBook (.fb2, sidoo kale la isku xidhay).
format-fb2.plugin.how = "Wuxuu furaa buugagta FictionBook (.fb2), caan u ah buugagta Ruush iyo kuwa kale, sidoo kale kuwa zip ah (.fb2.zip), iyagoo leh cinwaankooda, qorayaashooda, jaldigooda iyo cutubyadooda.\n\nKu dhig galka maktabadda; waxay ka muuqdaan maktabadda oo waxay u furmaan sida buug kasta."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Wuxuu furaa bogagga webka ee loo kaydiyay sida faylal, wuxuuna muujiyaa kaliya waxa la akhrinayo.
format-html.plugin.how = "Wuxuu furaa bogagga webka ee loo kaydiyay sida faylal (.html, .htm, .xhtml) sida buugag: waxa la akhrinayo oo keliya, menu-yo, xayeysiisyo iyo waxyaabo la mid ah la'aantood.\n\nKu dhig faylka galka maktabadda oo ka fur maktabadda sida buug kasta. Isku-xidhyada bogga dhexdiisa way shaqeeyaan; sawirrada waxay ka muuqdaan meesha ay faylka ku yaallaan."
format-html.title = Bog web (HTML)
format-images.plugin.name = Sawirro
format-images.plugin.description = Wuxuu furaa sawirro (.jpg, .png, .gif) sida buugag, bog mid kasta.
format-images.plugin.how = "Sawirrada (.jpg, .png, .gif) waxay ka furmaan maktabadda sida buugag, hal sawir bog kasta, shaashadda lagu habeeyay.\n\nSi aad u akhrido gal sawirro oo dhan, fur sawirkiisa ugu horreeya: sawirrada ka dambeeya galka ayaa raaca, sida magacyadooda u kala horreeyaan (2 ka hor 10). Sawir galka ka dambeeya halkaas ayuu ka bilaabmaa; meesha mid kasta lagu joogo si gooni ah ayaa loo xusuustaa. Gal ilaa 300 sawir ah ayaa laga akhriyaa kii aad furto.\n\nFayl aan sawir ahayn, ama aad u weyn, wuxuu muujiyaa magaciisa. Buug sawirro badan leh oo cinwaan u gaar ah leh, kayd majaajilo (.cbz) ayaa qaab ka wanaagsan."
format-images.title = Sawir
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Wuxuu furaa faylasha Markdown (.md), tusaale xusuus-qorro.
format-markdown.plugin.how = "Wuxuu furaa faylasha Markdown (.md), sida xusuus-qorro, sida buugag: cinwaanno, liisas, xigashooyin iyo xoojin sida loogu talagalay, ma aha sida calaamado.\n\nKu dhig faylasha galka maktabadda oo ka fur maktabadda. Cinwaanka ugu horreeya waa cinwaanka; sawirrada faylka agtiisa ku jira waxay ka muuqdaan meesha qoraalku magacaabo."
format-markdown.title = Markdown
format-mobi.plugin.name = Buugagta MOBI
format-mobi.plugin.description = Wuxuu furaa faylasha .mobi iyo .azw oo DRM aan lahayn.
format-mobi.plugin.how = "Buugagta MOBI (.mobi, .azw) waxay ka furmaan maktabadda sida buug kasta, wax la dejinayo ma jiro. Cinwaanka, qorayaasha, luqadda iyo jaldiga waxay ka yimaadaan buugga, liiska tusmadana waxaa laga sameeyaa cinwaannadiisa.\n\nBuugga waa la beddelaa markii ugu horreysay ee aad furto, taasoo qaadata dhowr ilbiriqsi mid dheer; kadib isla markiiba ayuu furmaa. Qoraalka, cinwaannada, dhumuc weyn iyo xagal, isku-xidhyada iyo sawirrada waa la muujiyaa.\n\nBuugagta DRM leh (buugagta dukaanka laga iibsaday intooda badan) lama furi karo, sidoo kale buugagta cadaadis Huffman leh ama qaabka KF8 ee cusub (.azw3): PaperPaw wuu sheegayaa marka aad furto. Nuqul EPUB ah, oo lagu sameeyay qalab sida Calibre, had iyo jeer wuu furmaa."
format-mobi.title = Buugagta MOBI
format-rtf.plugin.name = Dukumentiyada RTF
format-rtf.plugin.description = Wuxuu furaa faylasha .rtf sida buugag.
format-rtf.title = Dukumentiyada RTF
format-txt.plugin.name = Qoraal cad
format-txt.plugin.description = Wuxuu furaa faylasha qoraalka cad (.txt).
format-txt.plugin.how = "Faylasha qoraalka cad (.txt) waxay ka furmaan maktabadda sida buug kasta, wax la dejinayo ma jiro. Plugin-ku wuxuu akhriyaa qoraalka UTF-8, UTF-16 iyo Windows-1252 oo laftiisa ayuu ogaadaa koodhaynta.\n\nBaaragaraafyadu waxay raacaan sadarrada madhan ee faylka; haddii fayl aanu lahayn, sadar kasta waa baaragaraaf. Faylasha Project Gutenberg qoraalka shatiga bilawga iyo dhammaadka waa laga tagaa, cinwaanka iyo qoraagana waxaa laga qaadaa madaxa.\n\nFaylka marnaba dhammaantiis lama shubo, sidaas darteed qoraallo aad u waaweyn ayaa sidoo kale ka furmaya qalabka yaryar."
format-txt.title = Qoraal cad
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Wuxuu furaa buugagta XTC iyo XTCH, boggagga hore loo sawiray ee akhriyayaasha Xteink.
format-xtc.plugin.how = "Faylasha XTC iyo XTCH waa buugag boggagoodu horeba loo sawiray sida sawirro, sida beddelayaasha akhriyayaasha Xteink u sameeyaan. Waxay ka furmaan maktabadda sida buug kasta.\n\nSababtoo ah bog kasta waa sawir go'an, qoraalka lama weyneyn karo lamana dhigi karo far kale. Boggagga waa madow-cad ama waxay leeyihiin afar midab oo cawlan. Bog kasta waa la furfuraa marka la muujiyo, sidaas darteed xusuus yar ayaa loo baahan yahay, xitaa X4.\n\nCinwaanka, qoraaga iyo cutubyada waxaa laga qaadaa faylka marka uu leeyahay."
format-xtc.title = Boggagga XTC
help.plugin.name = Tilmaamo
help.plugin.description = Wuxuu muujiyaa waxa xakamaynta shaashaddu sameeyaan, markii ugu horreysay ee la furo.
help.plugin.how = "Markii ugu horreysay ee shaashad furmo, qoraal gaaban oo dushiisa ah wuxuu sheegaa waxa xakamayntiisu sameeyaan: qaybaha shaashadda ee taabashadu aaddo, oo la qaabeeyay, iyo waxa badhamadu sameeyaan.\n\nTaabasho ama badhan kasta ayaa xidha qoraalka, mar dambena shaashaddaas kuma soo noqdo. Tilmaamo dambe ma jiraan wuxuu dami dhammaantood.\n\nDejinta, hoosta Nidaam, Tilmaamo waa shidaan ama waa damiyaan, Mar kale muuji tilmaamaha wuxuu mar kale muujiyaa qoraalka shaashad kasta."
