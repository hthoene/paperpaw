reading-goal.plugin.name = Hadafka akhriska
reading-goal.plugin.description = Daqiiqadaha maalintii la akhriyo, iyo bisad shaashadda hore ku taal oo niyaddeedu raacdo akhriska maanta.
reading-goal.plugin.how = "Bisad shaashadda horaha ku taal waxay muujisaa sida akhriska maanta u socdo: murugaysan inta aadan weli akhrin, dhexdhexaad wax yar kadib, qancisan laga bilaabo badhka hadafkaaga maalinlaha ah, faraxsan marka aad gaarto.\n\nKu dar widget-ka Bisadda akhriska shaashadda hore (hay shaashadda hore, kadibna ku dar widget), ama dooro Bisadda akhriska maanta sida shaashadda hurdada. Taabasho bisadda ayaa furaysa hadafka maalinlaha ah; waa hadafka tirokoobka akhriska, kaasoo tiriya daqiiqadaha aad akhrido.\n\nDejinta, hoosta Akhris, Qancisan laga bilaabo iyo Faraxsan laga bilaabo waxay dejiyaan qayb ka mid ah hadafka bisaddu ay qancisan ama faraxsan tahay, iyo Sawirro u gaar ah galka sawirro (murugaysan, dhexdhexaad, qancisan iyo faraxsan) oo la muujiyo halkii bisadaha. Sawirradu waa faylal PNG ama JPEG; gal la'aan, bisadaha ayaa la muujiyaa."
