battery.plugin.name = Isticmaalka batariga
battery.plugin.description = Wuxuu diiwaangeliyaa batariga oo muujiyaa intee le'eg ayuu sii adkaysanayo.
battery.plugin.how = "Isticmaalka batariga wuxuu xusuustaa dallacaadda qiyaastii daqiiqad kasta inta qalabku toosan yahay, isaga oo la socda waxa uu sameeyay: cusboonaysiinta shaashadda iyo boggagga la rogay. Intaas wuxuu ka xisaabiyaa intee le'eg ayay qaadataa saac toosnaan iyo 100 bog, iyo intee le'eg ayuu batarigu sii adkaysan karaa xawaarahaas.\n\nKa fur Batari menu-ga Qalabka. Wuxuu muujiyaa dallacaadda hadda, waqtigan toosnaanta, isticmaalka batariga ilaa hadda iyo waqtiyadii dhawaa ee toosnaanta. Wuxuu u rogayaa badhamada bogga, ama adigoo taabanaya fallaarahaha dusha ku yaal.\n\nWuxuu u baahan yahay in muddo ah la akhriyo batariga, ka hor inta aan tirooyinku micno yeelan. Diiwaangelintu waa shidan tahay si caadi ah waxaana lagu dami karaa Dejinta, hoosta Qalab, Awood, sida Diiwaangeli isticmaalka batariga."
