wifi.plugin.how = "Wi-Fi wuxuu ku xidhmaa shabakad marka plugin u baahdo internetka (katalog, waafajin, dukaanka, wareejin), wuxuuna damiyaa raadiyaha daqiiqad kadib marka aan waxba isticmaalin, ama isla markiiba marka Bogga hore ama buug muuqdo, si loo badbaadiyo batariga iyo xusuusta.\n\nWi-Fi ka fur Dejinta, ama shayga Wi-Fi ee xariiqda xaaladda. Shabakadaha wuxuu taxaa kuwa u dhow; dooro mid oo qor erayga sirta ah, ama dooro Ku dejiso taleefan oo magaca iyo erayga sirta ah ku qor browser-ka taleefankaaga halkii aad qalabka ku qori lahayd. Hilmaamo wuxuu ka saaraa shabakad la kaydiyay.\n\nErayada sirta ah waxay ku jiraan kaarka, si ammaan ah ayaa loo hayaa, marnaba mar kale lama muujiyo. Hoosta Ku xidh marka loo baahdo waxaad ku dejisaa inta Wi-Fi shidnaanayo isticmaalkiisii ugu dambeeyay kadib, haddii uu shidnaado inta la dallacayo, iyo shabakadda la kaydiyay ee hore u imanaysa marka dhowr u dhow yihiin."
