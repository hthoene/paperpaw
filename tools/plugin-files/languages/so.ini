power.plugin.name = Awood
power.plugin.description = Wuxuu doortaa habka awoodda, gacanta ama batariga: Caadi, Kaydin, Offline.
power.plugin.how = "Awoodu waxay doorataa sida PaperPaw u isticmaalo batariga: Caadi, Kaydin ama Offline. Kaydin wuxuu sameeyaa waxa sugi kara wakhtiyo ka habboon; Offline wuxuu raadiyaha ka dansan yahay. Toos wuxuu doortaa batariga awgiis.\n\nBeddel habka guddiga degdega ah, halkaas Awoodu waxay muujisaa habab la kala sooc ah, ama Dejinta hoosteeda Awood. Halkaas waxaad kaloo dejisaa heerarka Toos ugu beddelo Kaydin iyo Offline, iyo haddii uu Caadi ku sii jiro inta la dallacayo.\n\nXariiqaha xaaladda, Habka awoodda wuxuu muujiyaa caleen inta la kaydinayo iyo Wi-Fi la khadeeyay inta offline, iyo waxba Caadi.\n\nHay badhanka awoodda si aad u furto menu yar: Hurdo, Dami (meesha PaperPaw awoodo), Dib u bilow, iyo qalabka taabashada Quful taabashada ama Fur taabashada. Riixid gaaban wali qalabka ayay seexisaa. Dib wuxuu ka baxaa menu-ga."
