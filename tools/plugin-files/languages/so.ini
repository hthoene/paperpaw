menu-editor.plugin.name = Tifaftiraha menu-ga
menu-editor.plugin.description = Wuxuu dib u habeeyaa, ka saaraa oo ku daraa gelitaannada menu kasta.
menu-editor.plugin.how = "Tifaftiraha menu-gu wuxuu beddelaa waxa menu-yadu ka koobanyihiin: u dhaqaaji gelitaannada kor ama hoos, ka saar, ama ku dar kuwo cusub.\n\nKa hel Dejinta hoosteeda Habee, sida Habee menu-yada. Dooro menu, kadibna gelitaan si aad u dhaqaajiso ama ka saarto; Ku dar gelitaan wuxuu geliyaa mid cusub. Isbeddellada isla markiiba ayay khuseeyaan. Dib u dhig menu-gan wuxuu menu ku celiyaa sida plugin-yadiisu u qeexeen, Dib u dhig dhammaan menu-yada wuxuu sidaas yeelaa mid kasta.\n\nKa xidhmi kartid adigu: gelitaan ah waddada dejinta wuu sii jiraa ilaa aad ku darto waddo kale."
