smart-home.plugin.name = Guri caqli leh
smart-home.plugin.description = Qiimayaal iyo furayaal Home Assistant-kaaga ee u gaarka ah oo guddi ah iyo widget-yo shaashadda hore. Wuxuu la shaqeeyaa Home Assistant shabakadda gurigaaga.
smart-home.plugin.how = "Guri caqli leh wuxuu muujiyaa qiimayaal iyo furayaal Home Assistant-kaaga u gaarka ah: heerkulka, huurka, tamarta, albaabbada iyo daaqadaha, nalalka, furayaasha iyo muuqaallada. Wuxuu la hadlaa serverkaaga REST API shabakadda gurigaaga; waxba adeeg kale kuma gudbaan.\n\nKa fur Guri caqli leh menu-ga qalabka, kadibna Xidhiidh: qor cinwaanka Home Assistant-kaaga (tusaale http://homeassistant.local:8123) iyo token gelitaan muddo dheer (samee mid hoosta bogga profile-kaaga Home Assistant). Token-ka waxaa lagu kaydiyaa erayada sirta ah iyo furayaasha, marnaba faylka dejinta. http cad waxaa loo isticmaalaa cinwaannada shabakadda gurigaaga oo keliya; server meel kale ah shid “Serverada shabakadda gurigaaga ka baxsan” dejinta oo isticmaal https leh shahaado sax ah.\n\nDooro qalabka wuxuu furaa liis waxa serverkaagu leeyahay: ka raadi magac ama id oo dooro qalab si aad u muujiso (mar kale dooro si aad u saarto). Waad siin kartaa qol, kaasoo ku kooxeeya guddiga iyo widget-yada qolka. Ilaa 24 qalab ayaa la hayaa. Guddiga dooro nal, fure ama muuqaal si aad u beddesho: safku wuxuu muujiyaa jawaabta serverka. Dareeme aad doorato mar kale ayaa la akhriyaa.\n\nWidget-yo (hay shaashadda hore, kadibna ku dar widget): Qiimaha guriga caqli leh wuxuu muujiyaa hal akhris oo weyn, kooxdu waxay liisteysaa qalabka qol, furuhu waa badhan hal nal ama fure, qolkuna waa kaar leh akhrisyada iyo furayaasha qol. Dejinta widget kasta waxay sheegtaa qalabka ama qolka uu muujiyo.\n\nGuriga waa la akhriyaa marka aad furto guddiga, marka aad weydiiso (safka Cusboonaysii ama taabasho widget qiime ama koox), marka akhriyuhu toosiyo meesha Wi-Fi horeba shidan yahay, iyo jadwalka aad dejisay inta dallaciyaha la geliyay. Marnaba ma shido raadiyaha laftiisa marnabana ma sii shido."
