file-manager.plugin.name = Maareeyaha faylasha
file-manager.plugin.description = Gal kasta iyo fayl kasta oo qalabka ku jira: fur, magac bedel, dhaqaaji, koobiyee oo tirtir.
file-manager.plugin.how = "Maareeyaha faylasha wuxuu muujiyaa gal kasta iyo fayl kasta oo kaydka qalabka ku jira, ma aha buugaagtaada oo keliya, wuxuuna kuu ogolaanayaa inaad furto, magac bedesho, dhaqaajiso, koobiyeyso oo tirtirto, iyo inaad samayso galal cusub.\n\nKa fur Faylal menu-ga Qalabka. Taabo gal si aad u gasho; Dib wuxuu aadaa galka kor ku yaal. Taabo fayl, ama hay gelitaan kasta (badhamada, hay Dooro), si aad u aragto waxa lagu samayn karo. Dhaqaaji iyo Koobiyee waxay doortaan gelitaanka: tag galka uu ku habboon yahay oo dooro Halkan dhig xariiqda hoose. Badhamada, riix Hoos laga bilaabo gelitaankii ugu dambeeyay si aad u gaarto xariiqda.\n\nFaylasha iyo galalka ku bilaabma dhibic, sida xogta PaperPaw laftiisa, waa la qariyaa. Si aad u aragto, shid Faylasha qarsoon Dejinta, hoosta Maktabad."
