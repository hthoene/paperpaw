weather.plugin.name = Cimilada
weather.plugin.description = Cimilada hadda iyo maalmaha soo socda sida widget-yo, Open-Meteo.
weather.plugin.how = "Cimiladu waxay muujisaa cimilada hadda iyo maalmaha soo socda sida widget-yo shaashadda hore, Open-Meteo, oo akoon ama fure u baahna. Cimilada hadda waxay muujisaa heerkulka, xaaladda iyo wax kale oo la dooran karo; Saadaasha waxay muujisaa maalmaha soo socda safka ama liis.\n\nMarka hore dooro meel: dejinta, hoosta Cimilada, Meesha (qor magac, kadibna ka dooro meelaha la helay). Isku-xigeenadeeda oo keliya ayaa la diraa, oo keliya inta widget cimilo la muujinayo. Ku dar widget-yada adigoo wax ka beddelaya shaashadda hore.\n\nCimilada waxaa la keenaa ugu badnaan sida Cusboonaysii ugu badnaan mid kasta u sheegto, oo keliya inta shabakad jirto: marnaba ma shido Wi-Fi laftiisa.\n\nXogta cimilada waxaa bixiyay Open-Meteo.com (https://open-meteo.com), shatiga Creative Commons Attribution 4.0 (CC BY 4.0)."
