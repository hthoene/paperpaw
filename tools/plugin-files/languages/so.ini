fonts-browser.plugin.name = Far dheeraad ah
fonts-browser.plugin.description = Wuxuu muujiyaa far internetka ka timid, mid kasta oo leh tusaale, wuxuuna soo dejiyaa si wax loogu akhriyo.
fonts-browser.plugin.how = "Far dheeraad ah wuxuu liisteeyaa far ka timid maktabad far oo internetka ku jirta, magac kasta oo farteeda ku qoran, wuxuuna soo dejiyaa kuwa aad rabto inaad wax ku akhrido.\n\nWaxaad ka heli kartaa dhammaadka liiska farta meesha farta akhriska la doorto, Dejinta, hoosta Akhris, sida Far; xariiqaha xaaladdu waxay leeyihiin isla gelitaankaas farahooda. Taabo far (badhamada, riix Dooro) si aad uga aragto weyn oo leh jumlad tusaale ah, kadibna dooro Soo deji. Waad ka bixi kartaa bogga inta la soo dejinayo. Marka uu dhammaado, dooro Ku akhri (magaca farta), ama Isticmaal xariiqaha xaaladda. Cusboonaysii wuxuu keenaa nooc cusub, Ka saar wuxuu farta ka tirtiraa qalabka.\n\nWaxay u baahan tahay Wi-Fi.\n\nFARAHAAGA U GAARKA AH\n\nMeesha Far dheeraad ah, isla liiskaas wuxuu leeyahay Farahaaga u gaarka ah, kaasoo muujiya qaybtan caawinta. Farahaaga u gaarka ah waa fayl .ttf ama .otf ah, tusaale Google Fonts.\n\nAndroid iyo qalabka kale ee sawira faylasha farta: koobiyee faylka galka fonts (Android: PaperPaw/fonts kaydka wadaagga ah), dib u bilow PaperPaw oo dooro farta Dejinta, hoosta Akhris, sida Far.\n\nXteink X4 iyo X4 Pro: akhriyayaashani waxay akhriyaan xirmooyin far, ma aha faylal far, sababtoo ah faylasha farta xusuustooda kuma gelayaan. Samee xirmo kombuyuutar adigoo isticmaalaya paperpaw-fontgen, qaab kasta oo aad leedahay (caadi ayaa loo baahan yahay):\n\npaperpaw-fontgen --family \"Farta Aan\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nTani waxay samaysaa galka plugins/font-my-font. Koobiyee galka plugins ee kaarka xusuusta, dib u bilow, oo dooro Farta Aan sida Far. Xirmo hal qaab ah waa qiyaastii badh megabyte xarfaha Laatiinka; qaababka aad ka tagto waxaa lagu sawiraa kan caadiga ah. Qalabku wuxuu sheegaa imisa xaraf oo aad weydiisay farta leedahay (--chars latin,cyrillic,greek wuxuu ku daraa far qoraal): farta aan lahayn xarfaha buuggaaga ma muujin karto, sidaas darteed raadi mid xardhan qoraalkiisa.\n\nFarta ka timid Far dheeraad ah si isku mid ah ayay u shaqaysaa oo kombuyuutar looma baahna.\n\nQoraal yar oo ka fiiqan shaashadda e-ink, ku dar --hinting light amarka: wuxuu xarfaha ku habeeyaa shabaqa pixel-ka, sida farta caadiga ah loo sameeyay. La'aanteed xarfaha waxaa loo sawiraa sida farta loo naqshadeeyay; --hinting normal iyo --hinting mono waxay ku habeeyaan si xoog badan. Farta leh calaamado, sida Carabi ama Devanagari, ugu fiican in aan lahayn."
