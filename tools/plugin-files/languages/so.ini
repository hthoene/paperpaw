puzzles.plugin.name = Xujooyin
puzzles.plugin.description = Sudoku, ereyo-isdhaafsi iyo xujooyin shaxda, offline, oo leh xujo maalinta.
puzzles.plugin.how = "Xujooyin tareenka iyo qolka sugitaanka, dhammaantood offline: sudoku, ereyo-isdhaafsi iyo xujooyin shaxda. Ka fur Xujooyin menu-ga qalabka, ama ku dar widget-ka Xujada maalinta shaashadda hore (hay shaashadda hore, kadibna ku dar widget): wuxuu muujiyaa intee le'eg ayuu sudoku-ga maanta yahay, taabashana way furaysaa. Sudoku-ga maalintu waa isku mid maalinta oo dhan.\n\nSudoku: bidix iyo midig waxay u dhaqaajiyaan tilmaame sanduuq sanduuq, kor iyo hoos (badhamada bogga) saf. Dooro wuxuu furaa tirooyinka: dooro mid oo mar kale dooro si aad u gasho, ama Tirtir si aad sanduuqa u madhisay. Hay Dooro (ama Menu) si aad u gaarto badhamada ku yaal xariiqda hoose: Xusuus-qorro tirooyinka ka dhigaa calaamado qalin, Hubi wuxuu calaamadiyaa sanduuqyada khaldan, Ka noqo wuxuu ka noqdaa dhaqdhaqaaqii ugu dambeeyay, Cusub wuxuu bilaabaa xujo heerka aad doorato (Fudud, Dhexdhexaad, Adag). Xujo kasta waxay leedahay hal xal oo keliya. Ciyaarta waa la hayaa marka aad ka baxdo. Shaashadda taabashada taabo sanduuq.\n\nEreyo-isdhaafsi: ku dhig faylasha .puz (Across Lite) ama .ipuz galka “puzzles” ee kaarka xusuusta; midna lama bixiyo. Ku dhaqaaq shabaqa, kadibna dooro si aad u qorto erayga tilmaamaha hoostiisa kiiboodhka (xariiq hoose wuxuu sanduuq madhan ka tagaa). Badhamadu waxay u beddelaan dhinac iyo hoos, muujiyaan liiska tilmaamaha, hubiyaan xarfaha oo muujiyaan erayga. Xarfaha waa la hayaa fayl kasta. Faylasha .puz ee isku qasan lama furi karo.\n\nXujooyin shaxda: koox yar oo ka timid kaydka xujooyinka Lichess (CC0). Bidix iyo midig waxay ka boodaan gabal ilaa gabal, dooro gabalka aad dhaqaajinayso, kadibna bidix iyo midig meelaha uu aadi karo, oo mar kale dooro. Dhaqdhaqaaq khaldan waa laga noqdaa. Tilmaan wuxuu calaamadiyaa gabalka la dhaqaajinayo, Xiga wuxuu aadaa xujada xigta.\n\nShaxdu wuxuu mar kale sawiraa sanduuqyada isbeddelaya oo keliya. Tirokoobku wuxuu tiriyaa xujooyinka aad xallisay."
