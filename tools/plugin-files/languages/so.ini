sleep.plugin.name = Shaashadda hurdada
sleep.plugin.description = Wuxuu muujiyaa bisad hurda, jaldiga buugga, sawirradaada ama farriin inta qalabku hurdo.
sleep.plugin.how = "Shaashadda hurdadu waxay go'aamisaa waxa shaashaddu muujiso inta qalabku hurdo. E-ink wuxuu sawirka ku hayaa korontada la'aanteed.\n\nDooro dejinta, hoosta Qalab, Shaashadda hurdada, oo leh Muuji: bisad hurda (caadiga ah), jaldiga buugga, sawirradayda, astaanta iyo “Hurdo”, widget-yo, bogga sida uu yahay, ama bogga oo sawir leh. Sawirradayda wuxuu muujiyaa faylasha galka Sawirrada mid mid.\n\nJaldi ama sawir la'aan bisaddu way muuqataa. Meesha nidaamku laftiisu sawiro shaashadda hurdada, dejintan waa la qariyaa.\n\nShaashadda damiska, Muuji marka la damiyo, waxaa mar la sawiraa marka qalabka la damiyo, menu-ga awoodda ama kadib waqtiga Dami hurdada kadib (ma aha marka batari yar korontada goyso). Waa sida shaashadda hurdada ilaa aad doorato astaanta iyo “La damiyay”, bisadda, jaldiga ama sawirradayda. Plugin kale ayaa u bixin kara shaashad.\n\nShaashadda bilawga iyo dib u bilaabidda, Muuji marka la bilaabayo iyo Muuji marka dib la bilaabayo, waa kuwa qalabka u gaar ah ilaa plugin kale uu u bixiyo shaashad. Plugin-yadu weli ma shaqeeyaan marka qalabku bilaabmayo: shaashadda bilawga la doortay waa la sawiraa hore, marka qalabku damayo ama dib u bilaabmayo, waxaana la muujiyaa bilawga xiga. Shaashad aan waqtiga ku diyaarsanayn, ama sawir xumaaday, wuxuu u daayaa kan qalabka; qalabku wuu damaa ama dib u bilaabmaa si kastaba."
