notes-vault.plugin.name = Qasnadda xusuus-qorrada
notes-vault.plugin.description = Wuxuu akhriyaa gal xusuus-qorro Markdown ah galal, calaamado iyo isbeddelladii ugu dambeeyay, oo leh widget-yo shaashadda hore. Wuxuu la shaqeeyaa qasnadaha Obsidian.
notes-vault.plugin.how = "Qasnadda xusuus-qorradu waxay akhriyaan gal xusuus-qorro Markdown ah (faylal .md oo cad, sida barnaamijyada xusuus-qorradu u kaydiyaan). Wuxuu la shaqeeyaa qasnadaha Obsidian.\n\nDooro galka qasnadda dejinta, ama bogga qasnadda qalabka. Bogga markaas wuxuu bixiyaa galalka sida ay kaarka ugu yaallaan, xusuus-qorrada ugu dambeeyay ee la beddelay, calaamadaha, iyo raadin cinwaannada xusuus-qorrada.\n\nMarka ugu horreysay, qasnadda waxaa gadaasha lagu tusmeeyaa inta bogga la furan yahay; qasnad kumanaan xusuus-qor leh waxay qaadataa dhowr daqiiqo, kadibna isla markiiba ayay furmaa. Tusmada waxaa lagu kaydiyaa kaarka oo mar kale waa la sameeyaa marka bogga qasnadda la furo dhowr saac kadib, ama marka aad doorato Cusboonaysii.\n\nXusuus-qor akhriyaha ayuu ku furmaa. Isku-xidhyada xusuus-qorrada kale ([[Xusuus-qor]], [[Xusuus-qor|erayo]], [[Xusuus-qor#Cinwaan]]) waxaa lagu helaa magaca xusuus-qorka meel kasta qasnadda; raacistiisu waxay furaysaa xusuus-qorkaas, Dib-na wuxuu ku celiyaa kii hore.\n\nQasnadda waxba lama beddelo marnaba. Widget-yada shaashadda hore (xusuus-qorrada dhowaanta, xusuus-qor la xidhay, xusuus-qorka maalinta, xusuus-qor aan kala sooc lahayn, calaamado, raadin) waxaa lagu daraa tifaftiraha shaashadda hore. Widget wuxuu xusuus-qorradiisa ka qaadan karaa hal gal oo keliya: qor waddada galka laga bilaabo xididka kaarka (tusaale Xusuus-qorro/Shaqo) dejinta widget-ka; haddii madhan la reebo, wuxuu qaataa dhammaan xusuus-qorrada qasnadda."
