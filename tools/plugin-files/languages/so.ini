aids.plugin.name = Caawiyayaasha akhriska
aids.plugin.description = Bilawga erayada oo dhumuc weyn, erayo la beddelay, sawirro: qoraal sida aad rabto.
aids.plugin.how = "Caawiyayaasha akhriska waxay beddelaan sida qoraalka buugga u eg yahay marka aad akhrinayso. Waxay khuseeyaan buug kasta. Bilawga erayada oo dhumuc weyn iyo Beddel erayada waa dansan yihiin marka hore.\n\nWaxaad ka heli kartaa Dejinta, hoosta Akhris, qaybta Caawiyayaasha akhriska. Bilawga erayada oo dhumuc weyn wuxuu dhigaa badhka hore ee eray kasta mid dhumuc weyn, taasoo qaar ay ku fududaato inay raacaan. Beddel erayada wuxuu qaataa lammaane sida “midab = midab; Mr. = Mister”, oo ay kala soocaan semicolon-yo.\n\nErayada dhammaystiran oo keliya ayaa la beddelaa, sida aad u qortay oo kale, sidaas darteed “midab” marnaba ma beddesho qayb ka mid ah eray ka dheer. Faylka buugga laftiisa lama beddelo.\n\nSawirrada buugagta waa la muujin karaa (sida marka hore), waxaa laga dhigi karaa sadar gaaban sida “[Sawir: markab badda ku jira]” oo isticmaala sharaxaadda sawirka, ama waa laga tagi karaa. Bog ayaa markaas leh meel qoraal ka badan, mana jiro wax la furfuro sawir aan la muujin, taasoo bogagga dhakhso u rogta. Majaajiladda iyo buugagta kale ee sawirro ka samaysan lama beddelo."
