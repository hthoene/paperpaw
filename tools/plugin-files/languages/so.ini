calibre.plugin.name = Maktabadda wireless
calibre.plugin.description = Waxay buugag ka qaadataa shabakadda. Waxay u shaqaysaa sida qalab wireless ah ee calibre.
calibre.plugin.how = "Maktabadda wireless waxay qalabka uga dhigtaa mid ka muuqda Calibre kombuyuutarkaaga sida qalab wireless ah. Calibre ayaa markaas u diri kara buugag, liis ka sameyn kara oo tirtiri kara. Buugagtu waxay galaan maktabadda.\n\nKa fur Maktabadda wireless menu-ga Qalabka, qalabka iyo kombuyuutarka oo isla shabakadda Wi-Fi ku jira. Calibre dooro Ku xidh/wadaag, kadibna Bilow xidhiidhka qalabka wireless. Marka qalabku helo kombuyuutarkaaga wuxuu muujiyaa magaciisa; taabo Ku xidh (badhamada, riix Dooro). Calibre halkan buugag ayuu ku dari karaa oo ka tirtiri karaa, sidaas darteed ku xidh kombuyuutarkaaga oo keliya. Xidhista shaashaddu xidhiidhka way soo afjartaa.\n\nHaddii Calibre aan lagu helin si toos ah, geli cinwaanka kombuyuutarkiisa Dejinta, hoosta Maktabad, sida Cinwaan qaybta Calibre. Haddii Calibre isticmaalo deked aan ahayn 9090, ku dar sida :deked, tusaale 192.168.1.20:9091."
