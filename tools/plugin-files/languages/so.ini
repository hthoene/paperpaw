menu.plugin.name = Menu
menu.plugin.description = Menu-ga hoose ee shaashadda, oo leh ficilo iyo dejin.
menu.plugin.how = "Menu-gu wuxuu liisteeyaa waxa aad samayn karto oo dejin karto. Wuxuu ka furmaa hoosta shaashadda, wax kasta oo furan dushiisa: inta wax la akhrinayo, taabo dhexda shaashadda ama riix Dooro. Taabo ama dooro gelitaan si aad u fuliso.\n\nDejinta menu-ga waxay muujiyaan qiimahooda oo meesha ay yaallaan ayay ku beddelmaan, sidaas darteed menu-gu wuu furan yahay. Gelitaan leh gelitaano kale wuxuu furaa menu hoose.\n\nHoos ka jiid geesta sare si aad u hesho boodhka degdega ah: waxa aad inta badan beddesho, sida badhamo. Taabo badhan si aad u beddesho, hay si aad u hesho dejintiisa. Badhamada oo keliya, badhamada fallaadhaha ayaa doortaa, Dooro wuu beddelaa Dib-na wuu xidhaa. Hoosta Muuqaalka, Menu-yada wuxuu muujiyaa menu-yada sida liis ama sida shaxan."
