mail.plugin.name = Iimayl
mail.plugin.description = Wuxuu akhriyaa oo diraa iimayl erayga sirta ah ama erayga sirta ah ee app-ka (IMAP iyo SMTP), gelitaan browser la'aan.
mail.plugin.how = "Iimaylku wuxuu akhriyaa oo diraa iimayl IMAP iyo SMTP. Wuxuu ku galaa cinwaankaaga iyo erayga sirta ah, gelitaan browser la'aan, sidaas darteed wuxuu la shaqeeyaa bixiye kasta oo taas oggola.\n\nDejiso akoon Dejinta, Iimayl. Dooro bixiyahaaga, qor cinwaankaaga iyo erayga sirta ah. Bixiyeyaasha badankoodu waxay rabaan erayga sirta ah ee app-ka: samee mid dejinta amniga akoonkaaga oo halkan isticmaal. Erayga sirta ah ee caadiga ah inta badan ma shaqeeyo, marnaba meel kale ma tagaan ee serverka bixiyahaaga ma ahayn. Waxaa lagu kaydiyaa erayada sirta ah iyo furayaasha.\n\nKa fur Iimayl qalabka. Hubi iimayl wuxuu keenaa iimaylada ugu dambeeya iyo galalka. Iimaylada waxaa lagu kaydiyaa kaarka, sidaas darteed waad akhrin kartaa shabakad la'aan. Qalabku wuu ku xidhmaa, wuu soo qaadaa oo wuu goostaa, sidaas darteed Wi-Fi waa shidan yahay wax yar oo keliya.\n\nHaddii bixiyahaagu liiska ku jirin, dooro Servero u gaar ah oo dejiso magacyada serverada, dekedaha iyo amniga hoostooda dejinta horumarsan. Server shahaadadiisa aan hay'ad cidi damaanad qaadin wuxuu mar weydiiyaa inuu aamino; barbar dhig faraha-gacmeedka waxa bixiyahaagu muujiyo.\n\nIimayl buug lifaaqan leh (EPUB, PDF iyo kuwa la mid ah, ilaa 2 MB) wuxuu hoostiisa leeyahay Fur buugga: wuxuu keenaa faylka, ku dhigaa maktabaddaada oo furaa.\n\nSi aad u aragto iimayl cusub adigoon Iimayl furin, shid Hubi iimayl cusub gadaasha hoostiisa Dejinta, Iimayl, oo dooro sida inta badan (15, 30 ama 60 daqiiqo kasta). Waa dansan yahay ilaa aad shido. Akhriyuhu markaas wuxuu mar mar ku xidhmaa xidhiidh ammaan ah inta uu toosan yahay oo khadka ku jiro, akoon mid mid, wuxuuna cusboonaysiiyaa tirada aan la akhrin ee Bogga hore. Wuxuu isticmaalaa batari yar. Furista Iimayl waxay joojisaa hubin socota.\n\nWidget-yada shaashadda hore waxay muujiyaan tirada aan la akhrin, iimaylada ugu dambeeya iyo kuwa xiddigta leh, hal sanduuq-iimayl, iyo gaaban si aad iimayl u qorto."
