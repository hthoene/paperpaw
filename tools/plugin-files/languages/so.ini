tasks.plugin.name = Hawlo
tasks.plugin.description = Liisaska hawlaha oo leh taariikhaha dhammaadka iyo mudnaanta, akhriyaha ama la waafajiyay serverkaaga CalDAV, oo leh widget-yo shaashadda hore.
tasks.plugin.how = "Liisaska hawlaha akhriyahaaga: hawlo leh taariikh dhammaad iyo mudnaan, oo la calaamadiyo marka la qabto. Waxay shaqeeyaan dejin la'aan iyo shabakad la'aan, waxaana lagu hayn karaa isku heer server CalDAV (Nextcloud, Radicale, Baïkal, Fastmail iyo kuwa kale), sidaas darteed isla liisaskaas ayaa taleefankaaga iyo kombuyuutarkaaga ku jira.\n\nKa fur Hawlo menu-ga qalabka. Safka ugu horreeya wuxuu magacaabaa liiska la muujiyay; dooro liis kale, Maanta iyo kuwa dhaafay liisaska oo dhan, liis cusub, si aad u waafajiso, ama si aad akoonka u dejiso. Ku dar hawl wuxuu furaa kiiboodhka. Dooro hawl waa calaamadeyn (mar kale: lama qabin). Hay hawl ama riix Menu si aad u beddesho cinwaankeeda, taariikhda dhammaadka (maanta, berri, todobaad kadib, ama taariikh aad qorto sida 2026-12-24) ama mudnaanteeda, ama si aad uga saarto. Hawlaha furan way horreeyaan, maalintooda iyo kadibna mudnaanta; kuwa la qabtay waxay ku sii jiraan dhammaadka todobaad (hoostiisa Hawlo dejinta), kadibna akhriyaha way ka baxaan.\n\nWidget-yada shaashadda hore (hay shaashadda hore, kadibna ku dar widget): Hawlaha maanta wuxuu muujiyaa waxa maanta la gaadhayo ama dhaafay, Liiska hawlaha wuxuu muujiyaa hal liis, Hawlaha furan way tiriyaan, Hawsha xigta wuxuu muujiyaa tan xigta ee la qaban doono. Taabasho hawl widget-ka ayaa calaamadaysa; taabasho cinwaan wuxuu furaa liisaska.\n\nSi loo waafajiyo, ka dooro Akoon CalDAV safka liiska oo geli cinwaanka serverka, magaca isticmaalahaaga iyo erayga sirta ah (ugu fiican erayga sirta ah ee app-ka). Cinwaanka serverka ayaa ku filan, tusaale cloud.example.com/remote.php/dav; akhriyuhu halkaas wuxuu ka helaa liisaska hawlahaaga. Liis kasta oo hawlo ah oo serverka ku jira wuxuu noqdaa liis akhriyaha. Akhriyuhu wuu waafajiyaa marka aad furto Hawlo, marka aad doorato Hadda waafaji, iyo marka shabakadda la shido si kastaba; waxa aad beddesho shabakad la'aan way sugaan oo mar dambe ayaa la diraa. Haddii hawl akhriyaha laga beddelay iyo meel kale isla markaas, nooca serverka ayaa la qaataa kaaguna wuxuu u hadhayaa sida hawl cusub agtiisa, sidaas darteed waxba ma lumo. Xusuus-qorrada, alarmka iyo wax kasta oo hawl ku leedahay serverka sidooda ayay ku hadhaan. Hawlaha soo noqnoqda waa la muujiyaa laakiin waxaa lagu beddelaa meesha aad ku samaysay. Akhriyuhu wuxuu qaataa ilaa 200 hawlood 12 liis ah."
