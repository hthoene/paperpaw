translate.plugin.name = Tarjumaad
translate.plugin.description = Wuxuu khadka ku tarjumaa qoraalka la doortay, DeepL.
translate.plugin.how = "Tarjumaadu waxay khadka ku tarjumaysaa qoraalka la doortay DeepL. Dooro qoraal buug oo menu-ga qoraalka la doortay ka dooro Tarjun: tarjumaaddu waxay ka muuqataa bogga dushiisa sida gelitaan qaamuus. Badhamada bogga ama taabashada ayaa rogaya, Dooro ama taabasho dhammaadkeeda ayaa xidhaya.\n\nWaxay u baahan tahay shabakad iyo furaha API ee DeepL ee kaaga, oo bilaash ah deepl.com (DeepL API Free, qiyaastii 500,000 xaraf bishii). Ilaa aad gelisid, guddigu taas wuu sheegayaa, taabashadu way weydiisaa.\n\nDejinta, hoosta Akhris, qaybta Tarjumaad, Ku tarjun wuxuu dejiyaa luqadda; marka hore waa tan PaperPaw laftiisa."
