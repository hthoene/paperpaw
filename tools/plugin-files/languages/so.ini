widgets.plugin.description = Widget-yo badan oo shaashadda hore ah: saacado, kalandar, xigashooyin, buugag, xusuus-qorro iyo wax kale.
widgets.plugin.how = "Xirmada widget-yadu waxay ku daraysaa widget-yo badan shaashadda hore: saacado (gacmo, erayo, shaxanno, adduun), kalandar, sannadka ilaa hadda, tirinta dib-u-dhaca, weynaanta dayaxa, iyo maalin iyo taariikh; xigasho maalinta, xusuus-qorro, hawlo, sawirro, salaan iyo astaanta PaperPaw; iyo buugagta, hadda la akhrinayo, horumar, kan xiga, taxane, kuwa la jecel yahay, iftiimin iyo maktabadda tirooyin ahaan. Widget batari ayaa sidoo kale ku jira.\n\nKu dar iyaga Wax ka beddel shaashadda hore menu-ga (ama riixid dheer shaashadda hore), kadibna Ku dar widget. Mid kastaa wuxuu leeyahay dejin u gaar ah, sida qaab, cabbir iyo toosin. Dooridda widget isbeddelaya, sida xigashada maalinta, wuxuu muujiyaa kan xiga. Xigashooyinkaaga u gaarka ah waxay galaan quotes.txt .paperpaw/plugins/widgets kaarka, sadar kasta sida qoraal | qoraa. Widget-yada waqtigu waxay u baahan yihiin saacadda oo la dejiyay; Wi-Fi ayaa dejiya."
