vocabulary.sd.readme = "Kaararka xusuusta ee faylasha\n\nHalkan ku dhig fayl xidhmo kasta: Isbaanish.tsv wuxuu sameeyaa xidhmada Isbaanish.\nFaylasha: .tsv, .csv ama .txt, loo kaydiyay UTF-8, ama .apkg: xidhmo Anki, la dhoofiyay oo leh Taageer noocyada Anki ee duqda la calaamadiyay. Saddexda goob ee ugu horreeya ee xusuus-qorradiisa waxay noqdaan hore, dambe iyo tusaale; jadwalkiisa iyo warbaahintiisa lama akhriyo, PaperPaw na marnaba ma qoro fayl Anki.\n\nHal kaar sadar kasta: hore, dambe iyo tusaale (ikhtiyaari), oo lagu kala saaray tab, hakad ama semicolon. Sadarka ugu horreeya wuxuu magacaabi karaa tiirarka: front, back, example. Tusaale:\n\nKatze\tcat\tDie Katze schläft.\n\nKadibna ka fur Kaararka xusuusta akhriyaha, dooro Kaararka kaarka SD kadibna Cusboonaysii xidhmooyinka kaarka.\n\nWaxaa fiican in la ogaado:\n- Xidhmooyinku waxay ku sii jiraan akhriyaha, oo leh waxa aad barato. Fayl waa la akhriyaa marka uu cusub yahay ama isbeddelay, kaararkiisana waxaa lagu daraa xidhmada ama halkaas waa laga beddelaa.\n- Beddel dambaha ama tusaalaha kaar faylka dhexdiisa: kaarku wuu isbeddelaa oo wuxuu hayaa horumarkaaga.\n- Beddel qoraalka hore ee kaar: wuxuu u tirsan yahay kaar cusub, kii hore dib ayuu u bilaabmaa. Kaararka waxaa lagu qaabilaa qoraalkooda hore, meel bannaan iyo xarfo waaweyn ma tirsanaan. Ku kaydi xidhmo fayl (Kaararka kaarka SD, Ku kaydi xidhmada kaarka) oo kaar kasta wuxuu leeyahay lambar tiirka id: halkaas ka beddel hore, sadarrada labada ugu horreeya ee faylka sidooda ku hay, kaarkuna wuxuu hayaa waxa aad barateen.\n- Kaydintu waxay qortaa kaararka xidhmada. Waxa faylka ku jiray oo kaar ahayn (sadar hore la'aan) lama hayo; faylkii halkaas ku jiray waxaa loo koobiyeeyay _name.bak.tsv.\n- U kaydi faylka sida CSV UTF-8 (ma aha UTF-16, ma aha qaabka xisaabtaan u gaar ah). Fayl ka weyn 4 MiB ama 20,000 sadar lama akhriyo: u qeybi.\n- Sadar aad faylka ka tirtirto kaarka xidhmada ma tirtirto, ilaa aad shido Ka saar kaararka maqan xidhmadaas. Kaarku markaas wuxuu la baxaa waxa aad barato.\n- Faylasha magacyadoodu ku bilaabmaan _ lama akhriyo.\n"
