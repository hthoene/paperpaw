store.plugin.name = Dukaanka plugin-yada
store.plugin.description = Wuxuu helaa, rakibaa, cusboonaysiiyaa oo ka saaraa plugin-yada qalabkan.
store.plugin.how = "Dukaanka plugin-yadu wuxuu internetka ka helaa plugin-yada qalabkan, wuxuuna rakibaa, cusboonaysiiyaa oo ka saaraa. Ka fur Qalabka; wuxuu u baahan yahay Wi-Fi.\n\nBilawgu wuxuu muujiyaa waxa maktabaddu kula talisay, waxa cusub ama hadda caan ah, kadibna kooxaha. Koox wuxuu liisteeyaa plugin-yadiisa isku dhafan cad oo maalin kasta isbeddela, si plugin kasta loo arko; u kala sooc A ilaa Z, kuwa ugu cusub ama cusboonaysiintii ugu dambeysay, oo u tag xaraf liisaska dhaadheer. Fur mid si aad u aragto bogga, oo leh cabbirkiisa iyo xusuusta uu qaato, kadibna dooro Rakib, Cusboonaysii ama Ka saar. Cusboonaysii dhammaan wuxuu cusboonaysiiyaa plugin kasta oo la rakibay.\n\nPlugin-yada koodhku waxay ku shaqeeyaan gelitaan buuxa oo qalabka: dukaanku taas wuu sheegayaa oo marka hore wuu weydiiyaa, waxayna bilaabmaan dib u bilaabid kadib. Haddii mid khaldamo, PaperPaw wuxuu ku bilaabmaa plugin-yo koodh la'aan wuxuuna sheegayaa kuwa. Maktabadda plugin-yadu waxay dejisaa meesha liiska ka yimaado.\n\nPlugin-yada bulshada, Dejinta, Nidaam, waxay sidoo kale liisteeyaan plugin-yada kuwa kale ay ku daabaceen GitHub. Cidna ma dib u eegin: waxaa lagu calaamadiyay Aan la dib u eegin, bogga plugin koodh waxay muujisaa furaha lagu saxiixay, cusboonaysiin lagu saxiixay fure kale lama rakibo.\n\nIlaha, safka ugu dambeeya ee bilawga, waxay ku daraan liisaska plugin-yada kuwa kale cinwaankooda (https://…/plugins.json), liis mid ka mid ah ku isticmaala halkii kan PaperPaw, ama ka saaraan. Halkii qorid, ku dhig fayl sources.txt oo leh hal cinwaan sadar kasta .paperpaw/plugins/store kaarka: cinwaannadu waxay hoostooda Ilaha ka muuqdaan sida cusub. PaperPaw ma hubiyo il ama plugin-yadiisa, qalabkuna wuxuu la xiriiraa serverka ilaha. Il wuxuu saxiixaa liiskiisa; qalabku wuxuu hayaa furaha liiska ugu horreeya ee uu akhriyo oo laga bilaabo wuxuu qaataa liisas iyo plugin-yo koodh oo lagu saxiixay furahaas oo keliya. Plugin wuxuu cusboonaysiintiisa ka helaa ilaha laga rakibay oo keliya. Maktabadda PaperPaw laftiisu had iyo jeer way joogtaa oo lama saari karo; ka bixidda dukaanku wuxuu ku celiyaa."
