news.plugin.name = Warar
news.plugin.description = Wuxuu keenaa feed-yada wararka (RSS, Atom) sida buugag la akhriyo.
news.plugin.how = "Wararku wuxuu feed-yada RSS ama Atom ka dhigaa buugag. Feed kasta wuxuu noqdaa hal buug galka Warar ee maktabadda, oo leh maqaalladiisa ugu cusub sida qoraal cad, si loo akhriyo sida buug kasta oo kale.\n\nKa fur Warar menu-ga Qalabka oo dooro Ku dar feed; cinwaankiisa waxaa laga helaa bogga webka ee wargeyska ama blog-ka. Keen wararka wuxuu keenaa dhammaan feed-yada oo wuxuu bedelaa buugagtii hore. Hay feed (badhamada, hay Dooro) si aad keligiis u keento ama u saarto. Feed laga saaray buuggiisa wuxuu ku reebaa maktabadda.\n\nKeenistu waxay u baahan tahay shabakad. Maqaallada feed (Dejinta, Maktabad) wuxuu dejiyaa imisa maqaal ayuu buug kasta hayaa. Widget-ka Cinwaannada wararka wuxuu ku muujiyaa shaashadda hore."
