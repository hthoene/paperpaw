opds.plugin.name = Kataloogyada OPDS
opds.plugin.description = Wuxuu daalacaa kataloogyada OPDS, soo dejiyaa buugagtooda oo galalka la waafajiyaa.
opds.plugin.how = "Kataloogyada OPDS waa maktabado khadka ah sida Project Gutenberg, Calibre-Web, Kavita ama Komga. Plugin-kani wuxuu daalacaa oo ka raadiyaa sida galalka wuxuuna buugagtooda soo dejiyaa maktabadda.\n\nKa fur Kataloogyada menu-ga Qalabka oo dooro Ku dar katalogga: cinwaan iyo, haddii katalogku akoon u baahan yahay, magaca isticmaale iyo erayga sirta ah. Taabo katalog si aad u daalacdo; hay (badhamada, hay Dooro) si aad u waafajiso, wax uga beddesho ama ka saarto.\n\nMarka Waafaji katalogga la shido, Waafaji kataloogyada wuxuu soo dejiyaa buugagtiisa cusub galkiisa. Buugagta waafajin kasta wuxuu xaddidaa imisa buug ayuu hal waafajin keenaa, si katalog weyn aanu qalabka u buuxin. Gal Cloud (WebDAV) ayaa u shaqeeya halkii katalog."
