reader.plugin.name = Akhriye
reader.plugin.description = Wuxuu muujiyaa buugagta bog bog, oo leh tusmo iyo dejinta akhriska.
reader.plugin.how = "Akhriyuhu wuxuu muujiyaa buugagta bog bog. Ka fur buug maktabadda; buugga ugu dambeeyay wuxuu mar kale ka furmi karaa bilawga (dejinta Ka fur buugga ugu dambeeyay bilawga).\n\nTaabo bidixda ama midigta shaashadda, ama isticmaal badhamada bogga, si aad boggagga u rogto. Taabo dhexda ama riix Dooro menu-ga akhriska: Tusmo, Raadi, U tag bog, Far iyo qaab, Calaamado iyo iftiimino iyo wax kale. Hoos ka jiid geesta sare si aad u furto boodhka degdega ah, kor ka jiid geesta hoose si aad u gasho bogga hore; sidoo kale hayida Dib. \n\nHay Dooro (ama hay sawir) si aad sawir u aragto shaashad buuxda: Bidix iyo Midig waxay dhex marayaan sawirrada bogga. Dooro wuxuu weyneeyaa 2x, 3x oo dib u celiyaa (laba taabasho shaashadda taabashada); marka la weyneeyay, Bidix iyo Midig waxay dhinac u wareejiyaan, badhamada bogga (ama jiidashooyin) waxay u dhaqaajiyaan dhinac iyo hoos. Dib wuxuu ku celiyaa habaynta, kadibna bogga (hay si aad uga baxdo taabashada). Taabo geeska midig ee sare si aad u calaamadiso. Hay eray si aad u iftiimiso. Badhamada, hay Bidix: Bidix iyo Midig waxay dhaqaajiyaan eray eray, badhamada bogga sadar sadar, hayidoodu wuxuu u aadaa dhammaadka bogga iyo baaragaraaf baaragaraaf; Dooro wuxuu furaa xariiqda iftiiminta ee erayga, hayida Dooro waxay u ballaarisaa jumladda iyo baaragaraafka (kadibna Bidix iyo Midig waxay dhaqaajiyaan dhammaadka, hayidoodu bilawga). Dooridu wuu sii socdaa bog rogid kadib. Dhoofi sida Markdown wuxuu kaydiyaa xusuus-qorradaada."
