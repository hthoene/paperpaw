about.plugin.name = Ku saabsan
about.plugin.description = Nooca PaperPaw iyo shatiyada.
about.plugin.how = "Ku saabsan wuxuu muujiyaa nooca PaperPaw ee aad haysato, meesha koodhkiisa isha ay ku yaallo, iyo shatiyada uu ku yimaado.\n\nWaxaad ka heli kartaa dhammaadka Dejinta, sida Ku saabsan PaperPaw. Dooro saf adigoo isticmaalaya badhamada fallaarta iyo Dooro, ama taabo. Plugin-yada ku dhex jira firmware-ka iyo, qalabka ku shubta plugin-yo koodh leh, faraha-gacmeedka ay plugin-yadaas u dhisan tahay waa la liisteeyay sidoo kale.\n\nShatiyada waxay ku furmaan sida qoraal akhriyaha dhexdiisa, sidaas darteed waxaad u rogtaa sida buug. Wuxuu leeyahay shatiga PaperPaw laftiisa iyo kuwa farta, astaamaha iyo qaababka kala goynta erayada ee la socda. Plugin-yadu waxay ku dari karaan sadar u gaar ah, sida qoraha mawduuc."
