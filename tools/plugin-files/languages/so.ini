files.plugin.name = Daalacaha faylasha
files.plugin.description = Wuxuu liisteeyaa buugagta iyo galalka qalabka ku jira oo furaa.
files.plugin.how = "Maktabaddu waxay liisteysaa buugagta galkaaga maktabadda, mid kasta oo leh jaldigiisa, cinwaankiisa, qoraygiisa iyo intee la le'eg ayaad akhriday. Buugga aad ugu dambeysay akhriday wuxuu ku yaal kor sida kaar, sidaas darteed sii akhriska wuxuu qaadanayaa hal taabasho, ama hal riix oo Dooro ah. Inta maktabaddu buugag raadinayso, waxay sheegtaa imisa ayay hadda ka hor heshay.\n\nDooro waxa lagu muujiyo buugagta dushooda: dhammaan, kuwa aad akhrinayso, kuwa aan la akhrin ama la dhammeeyay, ama shelfyada (qoraa, taxane, calaamad, kuwa aad jeceshahay, buugga xiga ee taxane kasta oo aad bilowday). Taabo buug si aad u akhrido; hay (badhamada, hay Dooro) si aad u furto, u calaamadiso la dhammeeyay ama aan la akhrin, aad u aragto macluumaadkiisa, aad kaydka ugu dhaqaajiso ama aad tirtirto. Taabo cinwaanka menu-ga maktabadda: sida buugagta loo kala saaro oo loo muujiyo, raadinta, galka maktabadda iyo dejinta.\n\nGalka maktabadda waxaa lagu dejiyaa Dejinta, hoosta Maktabad, sida Galka maktabadda; halkaas waxaad kaloo ku muujin kartaa buugagta sida shabaq jaldiyo ah. Fayl kasta oo kale, isticmaal Faylal menu-ga Qalabka."
