dictionary.plugin.how = "Qaamuuska wuxuu ka raadiyaa eray buug ka mid ah qaamuusyada StarDict, wuxuuna muujiyaa qeexitaannada guddi ku yaal qaybta hoose ee shaashadda.\n\nAkhriyaha, hay eray oo dooro Raadi; badhamada, isticmaal Dooro qoraalka hoostiisa Intaa dheer. Koobiyee galalka qaamuusyada (oo leh faylasha .ifo, .idx iyo .dict) galka \"dictionaries\" ee qalabka, galalka hoose la socdo, ama dooro gal kale Dejinta, hoosta Akhris, sida Galka qaamuuska (dejin horumarsan). Raadinta ugu horreysa waxay u diyaarisaa tusmo yar qaamuus kasta, taasoo daqiiqad qaadata.\n\nGuddiga, badhamada bogga ama Kor iyo Hoos waxay rogaan qeexitaanno dhaadheer, Dib wuuna xidhaa. Taabashada, taabo dibadda si aad u xidho."
