stats.plugin.name = Tirokoobka akhriska
stats.plugin.description = Wuxuu diiwaangeliyaa intee le'eg iyo imisa aad akhrido, oo leh kalandar iyo tirooyinka buug kasta.
stats.plugin.how = "Tirokoobka akhriska wuxuu diiwaangeliyaa intee le'eg ayaad bog kasta akhrido. Waxaad u aragtaa sida guudmar oo leh maanta, todobaadka iyo xiriirkaaga, sida kalandar, iyo tirooyinka buug kasta.\n\nKa fur Qalabka, ama Intaa dheer ee akhriyaha. Dejinta, hoosta Tirokoobka akhriska, waad damin kartaa Diiwaangeli akhriska, dejin Hadaf maalinle ah, oo dejin Bogga ugu gaaban iyo Bogga ugu dheer ee la tiriyo, si dhex marista ama buug furan loo daayay aanay tirooyinka u weecin.\n\nWaafaji KOReader wuxuu tirokoobka la wadaagaa KOReader gal WebDAV. Wuxuu sidoo kale qaataa tirokoobka KOReader ee isla qalabka. Diiwaangelintu waxay u baahan tahay in saacadda la dejiyo: meesha aan la dejin, mar ku xidh Wi-Fi."
