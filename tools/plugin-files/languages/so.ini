transfer.plugin.name = Wareejin
transfer.plugin.description = Ku dhig buugag iyo faylal kale qalabka browser isla shabakadda ku jira.
transfer.plugin.how = "Wareejinta Wi-Fi waxay buugag iyo faylal kale ku dhigtaa qalabka browser isla shabakadda ku jira, xadhig iyo app la'aan. Waxaad kaloo soo dejin kartaa faylal, samayn kartaa galal oo tirtiri kartaa.\n\nKa fur Qalabka. Shaashaddu waxay muujisaa cinwaan sida qoraal iyo sida koodh QR: ka fur browser taleefan ama kombuyuutar, ama skaan garee koodhka. Cinwaanku wuxuu hayaa fure mar kasta si cusub loo sameeyo, sidaas darteed kuwa kale ee shabakadda ku jira faylashaada ma gaari karaan. Wareejintu waxay socotaa inta shaashaddu furan tahay.\n\nMeesha PaperPaw laftiisu socodsiiyo Wi-Fi, sida X4, Router la'aan hoostiisa ayaa furaa shabakad qalabka u gaar ah, taleefankuna ku biiro adigoo skaan gareynaya koodh."
