koreader.plugin.name = Wadaagista iftiiminta
koreader.plugin.description = Wuxuu la wadaagaa calaamadaha iyo iftiiminta KOReader buugagta labadaba lagu akhriyo.
koreader.plugin.how = "Plugin-kan wuxuu la wadaagaa calaamadaha iyo iftiiminta KOReader buugagta aad labadaba ku akhrido, hal qalab ama gal maktabad oo qalabka dhexdooda la waafajiyo. Wax la dejinayo ma jiro.\n\nMarka PaperPaw furo buug KOReader sidoo kale furay, iyo marka aad beddesho calaamadaha ama iftiiminta, wuxuu qaadaa waxa cusub ee xogta KOReader ee buugga agtiisa ku jirta wuxuuna reebaa waxa halkan ku cusub si KOReader u qaado marka xigta ee uu buugga furo. Calaamadaha la saaray iyo xusuus-qorrada la beddelay sidoo kale way gudbaan.\n\nTani waxay u shaqaysaa buugagta EPUB oo keliya. Haddii faylka dhinac lama akhrin karo, labada dhinacba waxba ma beddelmaan ilaa la akhrin karo."
