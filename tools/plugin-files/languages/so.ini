pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Saacad xoogayn oo leh wareegyo shaqo iyo nasasho, widget-yo iyo tiro maalinle ah.
pomodoro.plugin.how = "Saacadda Pomodoro: ku shaqee wareegyo xoogaysan, kadibna nasasho. Dejin looma baahna: 25 daqiiqo xoogayn, 5 nasasho, iyo afar wareeg kadib nasasho dheer oo 15 ah.\n\nKa fur Pomodoro menu-ga qalabka oo riix Bilow, ama ku dar widget-yadiisa shaashadda hore (hay shaashadda hore, kadibna ku dar widget): Saacadda Pomodoro waxay muujisaa heerka iyo daqiiqadaha hadhay, Pomodoro bilow/hakad waa badhan, Pomodoro maanta waxay tirisaa wareegyada aad dhammaysay, iyo hadafkaaga maalinlaha ah. Taabasho saacadda ayaa bilaabaysa ama hakinaysa; hay si aad u furto shaashadda buuxda.\n\nSaacaddu way sii socotaa marka aad shaashadda ka baxdo, waxayna sii socotaa saacadda dib u bilaabid kadib. Inta akhriyuhu hurdo wax ma socdaan: heer inta dhammaaday ayaa la sheegayaa marka uu toosiyo. Ogeysiis ayaa kuu sheegaya marka heer dhammaado. Si batariga loo badbaadiyo saacaddu waxay cusboonaysiisaa hal mar daqiiqad kasta (toban ilbiriqsi kasta daqiiqada ugu dambeysa shaashadda buuxda) mana sii toosiso akhriyaha.\n\nHoosta Pomodoro dejinta waxaad dejisaa dhererka iyo wareegyada urur, iyo haddii heerka xiga isagu bilaabmo. Hoosta Intaa dheer: iftiin shaashadda ama dhalaal iftiinka hore marka heer dhammaado iyo hadaf maalinle ah."
