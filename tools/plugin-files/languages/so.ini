bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Waxay isku xidhaa rimootyada, kiiboodhada iyo dareemayaasha, kadibna ku xidhaa.
bluetooth.plugin.how = "Bluetooth wuxuu isku xidhaa rimootyada, kiiboodhada iyo dareemayaasha akhriyaha, meesha uu Bluetooth leeyahay (X4 Pro).\n\nKu dar qalab wuxuu raadiyaa waxa meel u dhow jira; marka hore qalabka ku dhig habka isku xidhka. Dooro, oo ku xaqiiji akhriyaha (barbar dhig lambarka meesha uu ka muuqdo). Badhamada rimootka ama kiiboodhka ayaa markaas bogagga rogaya oo menu-yada dhex marayaa; beddel waxa badhan kastaa sameeyo hoostiisa Xakamaynta.\n\nRimootyadu waxay sheegaan goorta badhamadooda ay shaqeeyaan: marka halkan la shido, inta wax la akhrinayo (waa la xidhaa marka buug furan yahay, batarigu wuu badbaadaa), ama had iyo jeer. Badhanka menu-ga ama riixid dheer qalabka ayaa halmaamaysa.\n\nDareemuhu waa plugin-yada: shid kuwa plugin-ka isticmaali kara. Bluetooth waa dansan yahay marka aan waxba isticmaalin."
