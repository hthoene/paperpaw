setup.plugin.name = Dejin bilow
setup.plugin.description = Hage gaaban oo dejinta muhiimka ah, bilawga ugu horreeya.
setup.plugin.how = "Dejin bilowku waa hage gaaban oo dejinta muhiimka ah, oo la muujiyo hal mar, markii ugu horreysay ee PaperPaw bilaabmo. Bog kasta wuxuu weydiiyaa hal shay, sida luqadda, badhamada, cabbirka qoraalka, aagga waqtiga, Wi-Fi ama dhowr plugin oo la dari karo, jawaab macquul ah oo horeba la doortay, sidaas darteed Xiga had iyo jeer waa sax. Tallaabooyinka qalabkani u baahnayn waa laga tagayaa.\n\nTaabo badhamada, ama isticmaal badhamada kor iyo hoos iyo Dooro. Ka bood bogga koowaad wuxuu isla markiiba ka baxaa dejinta. Bogga ugu dambeeya wuxuu sheegayaa meesha buugagtaadu ka imaanayaan.\n\nSi aad mar kale u socodsiiso, fur dejinta oo dooro Dejiso PaperPaw. Wax kasta oo halkan la doorto waa lagu beddeli karaa dejinta mar dambe."
