calendar.plugin.name = Kalandar
calendar.plugin.description = Kalandarradaada akhriyaha: muuqaalada ajandaha, maalinta, todobaadka iyo bisha ee CalDAV, iCal iyo faylasha, dhalashada xiriirrada, widget-yada shaashadda hore iyo shaashadda hurdada.
calendar.plugin.how = "Kalandarradaada akhriyaha: ajanda maalmaha soo socda, maalin, todobaad iyo bil, oo leh dhacdooyinka kalandarrada CalDAV (Nextcloud, Radicale, Baïkal, Fastmail iyo kuwa kale), cinwaannada iCal (.ics, webcal://), faylasha kalandarka ee kaarka iyo dhalashooyinka iyo sannad-guuradii xiriirradaada (CardDAV). Akhriyuhu kalandarrada wuu akhriyaa oo keliya; marnaba ma beddelo.\n\nKa fur Kalandar menu-ga qalabka. Safka ugu horreeya wuxuu magacaabaa muuqaalka; dooro, ama hay saf kasta ama riix Menu, si aad ugu beddesho Ajanda, Maalin, Todobaad, Bil iyo Dhalashooyin, si aad kalandarro ugu darto ama aad u waafajiso. Maalinta iyo Todobaadka labada safood ee ugu horreeya waxay u gudbaan maalinta ama todobaadka ka hor iyo ka dambeeya (badhamada bogguna sidaas bay yeelaan); Bisha badhamada fallaadhaha waxay dhaqaajiyaan maalinta, badhamada bogga bisha, Dooro wuxuu furaa maalinta. Dooro dhacdo wuxuu muujiyaa dhammaan: goorta, meesha, kalandarka iyo sida ay u soo noqnoqoto. Dib wuxuu ku celiyaa hal tillaabo.\n\nKu dar kalandar hoostiisa Kalandarrada (menu-ga, ama Kalandar dejinta). Dooro nooca: akoon CalDAV (cinwaanka serverka ayaa ku filan, tusaale cloud.example.com/remote.php/dav; kalandar kasta oo dhacdooyin leh wuxuu noqdaa qayb ka mid ah muuqaalka), cinwaan iCal (kalandar loo daabacay sida .ics), fayl kalandar oo kaarka ku yaal, ama xiriirro (buug cinwaan CardDAV: akhriyuhu wuxuu muujiyaa dhalashooyinka iyo sannad-guuradii ay la kaydsan yihiin). Geli cinwaanka, akoon ahaan magaca isticmaale iyo erayga sirta ah (ugu fiicnaan erayga sirta ah ee app-ka; waxaa lagu kaydiyaa erayada sirta ah ee akhriyaha), iyo magac. Kalandar kasta wuxuu leeyahay calaamad (dhibic, giraan, dhibic cawlan ama labajibbaaran) aad beddeli karto si aad u kala garatid; ilaa lix kalandar.\n\nDhacdooyinka soo noqnoqda (maalin kasta, todobaad kasta, bil kasta, sannad kasta, oo leh maalmaha todobaadka, tirooyin, taariikhaha dhammaadka iyo maalmo laga reebay), dhacdooyinka maalinta oo dhan iyo dhacdooyinka aagagga waqtiga kale waxaa lagu muujiyaa saacadda akhriyaha. Akhriyuhu wuxuu hayaa dhacdooyinka lixdan maalin ka hor ilaa lixdan maalin ka dib maanta, ugu badnaan 240, oo wuxuu muujiyaa iyagoo shabakad la'aan ah. Xeerarka uusan akhrin karin waxay muujiyaan dhacdadooda hal mar.\n\nKalandarrada waa la akhriyaa marka aad furto kalandarka (ugu badnaan shan daqiiqo kasta), marka aad doorato Hadda waafaji, iyo, sida aad ugu dejisay Kalandar dejinta, marka shabakadda la shido si kastaba ama marka dallacaaddu bilaabato. Akhriyuhu marnaba ma shido raadiyihiisa, marka laga reebo marka aad weydiiso Hadda waafaji.\n\nWidget-yada shaashadda hore (hay shaashadda hore, kadibna ku dar widget): Maanta wuxuu muujiyaa taariikhda iyo waxa maalintu leedahay, Dhacdada xigta dhacdada xigta, Ajanda maalmaha soo socda, Bisha bil leh dhibic hoosta maalmaha dhacdooyinka leh, iyo Dhalashooyin dhalashooyinka xiga. Taabasho dhacdo ayaa furaysa, taabasho maalin bisha ayaa furaysa maalintaas. Shaashadda hurdada waxay muujin kartaa ajandaha maanta: dooro Kalandar hoostiisa Shaashadda hurdada ee dejinta."
