picture-home.plugin.name = Shaashadda hore ee sawirka
picture-home.plugin.description = Shaashad hore oo leh sawirkaaga u gaar ah widget-yada gadaashooda, iyo xariiq xaalad aad dejiso.
picture-home.plugin.how = "Shaashadda hore ee sawirku waxay bedeshaa shaashadda hore inta ay shidan tahay: sawirkaaga u gaarka ah widget-yada gadaashooda, iyo boggagga widget-yada iyo qalabka aad habayso. Ka dami maareeyaha plugin-ka oo shaashadda hore ee ku dhex dhisan ayaa soo noqonaysa, oo leh boggagga u gaarka ah.\n\nKu dhig sawirro (JPEG, PNG ama GIF) gal kaarka (wallpapers sida caadiga ah), kadibna dooro mid Dejinta, Habee, Shaashadda hore ee sawirka. Habaynta waxay sheegtaa sida uu shaashadda u buuxiyo (buuxi, sawirka oo dhan, kala bixi, cabbirka asalka ah, shaxan), Meesha qaybta la hayo, Soo dhawee intee le'eg, iyo Iftiimi sawirka intee le'eg: sawir iftiin ah wuxuu fududeeyaa akhriska widget-yada. Sawirka waxaa mar loo diyaariyaa cabbir shaashad kasta, taasoo daqiiqad qaadata.\n\nWidget-yadu waxay saaran yihiin saxan sawirka dushiisa. Bogga habee sida shaashadda hore ee ku dhex dhisan: qalinka bogga hoostiisa, ama Wax ka beddel shaashadda hore menu-ga.\n\nXariiqda xaaladda (waqtiga, Wi-Fi, batariga, ama waxa aad doorato) waxay noqon kartaa shidan, dansan ama toos, kore ama hoose, ballaadh buuxa ama kaniini yar bidix, dhexe ama midig, saxan iftiin, madow ama cawlan ah ama sawirka laftiisa. Safka magacaabaya badhamada (X4) waxaa sidoo kale noqon kara shidan, dansan ama toos. Toos waxay la micno tahay riixitaanka badhan oo ku muujiya ilbiriqsiyo yar; riixitaankaas waxba kale ma sameeyo.\n\nSawiridda sawirka waxay sheegtaa sida sawirka loo sawiro: Heerarka cawlan midab cawlan kasta oo shaashaddu leedahay (gaabis X4), Dhibco-dhibco dhibco madow iyo cad (degdeg), ama Toos, sida shaashadda hore ee ku dhex dhisan: heerarka cawlan marka shaashadda la sawiro, dhibco kadib isbeddelka ugu horreeya. Meesha shaashaddu aanay lahayn heerar cawlan, heerarka cawlan waxay ku soo laabtaan dhibco."
