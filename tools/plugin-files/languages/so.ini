lock.plugin.name = Qufulka shaashadda
lock.plugin.description = PIN, qaab ama erayga sirta ah marka qalabku toosiyo; taabashada oo xidhan inta wax la akhrinayo.
lock.plugin.how = "Qufulka shaashaddu wuxuu weydiiyaa PIN, qaab ama erayga sirta ah marka PaperPaw bilaabmo iyo marka qalabku toosiyo. Marka hore waa dansan yahay. Wuxuu ka ilaaliyaa isticmaalka caadiga ah oo keliya: koodhka iyo tirada isku dayada khaldan waxay ku kaydsan yihiin kaarka SD, sidaas darteed qofkii kaarka saara, wax ka beddela ama beddesha wuu ka gudbaa qufulka.\n\nKu dejiso dejinta, hoosta Qalab, Qufulka shaashadda: geli koodhka la isticmaalayo haddii uu jiro, dooro nooca, kadibna koodhka cusub laba jeer. Qaabka waxaa la bixiyaa shaashadaha taabashada oo keliya.\n\nShan isku day oo khaldan kadib mid xiga wuxuu sugaa badh daqiiqo. Hadda quful wuu qufulaa isla markiiba wuxuuna lagu dhigi karaa badhan, dhaqdhaqaaq ama xeer. Quful marka la toosiyo waa la damin karaa, si bilow runta ah (shid ama dib u bilaabid) oo keliya u qufulo, marka laga reebo meesha toosin kasta bilow tahay, sida X4 batariga.\n\nQufulka taabashada, agtiisa: Quful taabashada guddiga degdega ah iyo menu-ga akhriska waxay ka dhigaan taabasho, jiidasho iyo qalinku inay waxba samayn, badhamaduna way shaqeeyaan, tusaale in lagu akhriyo gacan shaashadda saaran. Si aad u furto, ku taabo laba jeer hal far oo muddo yar hoos ku hay; hayida badhanka awooddu wuxuu furaa menu-ga Awoodda, halkaas Fur taabashada ayaa ku furaa badhamada; X4 Pro, hayida furaha bogga hore isla markiiba wuu furaa."
