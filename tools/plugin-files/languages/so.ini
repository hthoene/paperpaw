profiles.plugin.name = Profile-yada akhriska
profiles.plugin.description = Kooxo magac leh oo dejinta akhriska iyo muuqaalka ah, oo lagu beddelo taabasho.
profiles.plugin.how = "Profile wuxuu kaydiyaa dejintaada akhriska, dejinta muuqaalka iyo xariiqaha xaaladda magac hoostiis, sida Habeen ama Daabacaad weyn, wuxuuna soo celiyaa taabasho.\n\nKa fur Profile-yada menu-ga akhriska hoostiisa Intaa dheer, ama Dejinta hoosteeda Habee. Taabo profile si aad u isticmaasho; kan la isticmaalayo waa la calaamadiyay. Hay (badhamada, hay Dooro) si aad ugu kaydiso dejinta hadda, magac u beddesho ama ka saarto. Ku kaydi profile cusub wuxuu hayaa waxa hadda la dejiyay.\n\nProfile-ka xiga wuxuu u beddelaa kan xiga liiska; ku dhig badhan ama xeer."
