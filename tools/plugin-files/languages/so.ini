rules.plugin.name = Xeerar
rules.plugin.description = Marka wax dhacaan, wax ayuu sameeyaa: tusaale habka habeenka 22:00.
rules.plugin.how = "Xeer wuxuu wax isagu sameeyaa marka wax dhaco: habka habeenka maalin kasta 22:00, ama kataloogyada la waafajiyo marka PaperPaw bilaabmo.\n\nXeerarku waxay ku yaalliin Dejinta hoosteeda Habee, sida Xeerar. Ku dar xeer wuxuu weydiiyaa Goorma? (PaperPaw wuu bilaabmaa, waqti maalinta ah, buug la furay ama la xidhay, batari, dallacaad, fure iyo wax kale) iyo Kadibna? (fuli ficil, shid ama dami fure, dejiso lambar, muuji farriin). Taabo xeer si aad u hakisid; hay (badhamada, hay Dooro) si aad u hesho shuruud sida Laba waqti oo maalinta ah dhexdooda, ama si aad uga saarto.\n\nFicilada, furayaasha iyo tirooyinka la dooran karo waxay ku imaadaan plugin-ka: dooro plugin-ka, kadibna waxa uu keeno; dib wuxuu kaaga baxaa mar kale. Ficil ku shaqeeya shaashadda la muujiyay, sida Dib ama Bogga xiga, wuxuu sameeyaa waxa uu samayn lahaa haddii halkaas la riixo.\n\nWaqtiyadu way khuseeyaan shaashad kasta oo furan. Laba xeer oo is-ka-noqonaya way joogsadaan dhowr tallaabo kadib."
