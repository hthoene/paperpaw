update.plugin.name = Cusboonaysiin
update.plugin.description = Wuxuu rakibaa cusboonaysiinta firmware, kaarka ama internetka laga soo dejiyay.
update.plugin.how = "Cusboonaysiintu waxay rakibtaa firmware cusub, qalabka PaperPaw uu firmware yahay, sida X4. Waxaad ka heli kartaa dejinta, sida Cusboonaysiin.\n\nRaadi khadka wuxuu weydiiyaa serverka cusboonaysiinta PaperPaw cusub oo soo dejiyaa, taasoo dhowr daqiiqo qaadata Wi-Fi. Ama koobiyee faylka cusboonaysiinta (ku dhammaada .bin, paperpaw.org) galka updates ee kaarka, tusaale Wareejinta Wi-Fi. Rakib markaas wuxuu qaataa qiyaastii daqiiqad oo qalabku dib ayuu u bilaabmaa; buugagta, dejinta iyo meelaha akhriska way sii jiraan.\n\nMarka Raadi cusboonaysiin la shido (dejinta, marka hore waa dansan yahay), qalabku isagu wuxuu weydiiyaa qiyaastii todobaad kasta, inta Wi-Fi si kastaba shidan yahay ama la dallacayo oo keliya. PaperPaw cusub oo uu helo halkan ayuu ku sugaa; waxba akhriskaaga ma jaro. Raadintu waxay dirtaa waxa qalabku socodsiiyo, magac ama lambar qalabka ma ahan; si loo tiriyo qalabka, sidoo kale haddii aad weydiisay iyo haddii ay tahay raadintiisa ugu horreysa maalinta, todobaadka ama bisha.\n\nHaddii plugin-yada aad isticmaasho aysan weli lahayn nooc isla soo saarkan, cusboonaysiintu way sugaysaa. Nooc ka duq weyn wuu rakibmaa haddii aad doorato oo keliya.\n\nFirmware kale, sida CrossPoint, halkan ayuu ka rakibmaa sidoo kale: ku dhig faylkiisa (ku dhammaada .bin) galka updates, oo fur Cusboonaysiin. PaperPaw wuxuu hubiyaa inay tahay firmware dhammaystiran oo qalabkan u habboon, aan xumaan, laakiin ma oga cidda sameysay, maadaama aan la saxiixin. Rakib si kastaba wuxuu ku qoraa badhka kale ee flash-ka, qalabkuna wuu bilaabaa; PaperPaw wuxuu ku sii jiraa badhkiisa ilaa firmware-kaas wax dushiisa rakibo. Si aad ugu noqoto PaperPaw mar dambe, rakib faylkiisa rakibaadda (paperpaw-<device>-<version>-install.bin) menu-ga firmware-ka kale, sida cusboonaysiinta firmware-ka SD ee CrossPoint."
