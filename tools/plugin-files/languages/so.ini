vocabulary.plugin.name = Erayo
vocabulary.plugin.description = Wuxuu hayaa erayada aad raadiso, iyo jumladahooda, wuxuuna dib u eegaa kaararka xusuusta isagoo u kala dhex-dhigaya muddo, oo laga sameeyay taleefankaaga.
vocabulary.plugin.how = "Erayadu waxay hayaan erayada aad raadiso inta aad akhrinayso, mid kasta oo leh jumladiisa, si dambe loo dib u eego. Liiska ka hel Qalabka, kuwa ugu cusub marka hore; dooro eray si aad mar kale u raadiso. Safka ugu dambeeya, Dhoofi, wuxuu u kaydiyaa barnaamijyada kaararka xusuusta sida Anki. Liisku wuxuu hayaa 2,000 eray ee ugu cusub: wixii ka badan, kuwa ugu da'da weyn ayaa baxaya, sidaas darteed marka hore dhoofi si aad dhammaan u haysato.\n\nKaararka xusuustu, sidoo kale Qalabka, waxay ku imtixaamaan muddo kala dhex-dhigan: kadib Muuji jawaabta waxaad qiimeysaa kaar kasta Mar kale, Adag, Wanaagsan ama Fudud, taasoo go'aamisa goorta uu soo noqonayo. Samee xidhmooyin adigoo Ku tifaftir taleefankaaga: skaan garee koodhka taleefan isla Wi-Fi-ga ku jira, kadibna qor kaarar ama ku dar badan mar: halkaas ka fur xidhmo, dooro Kaarar badan mar oo dooro fayl CSV, TSV ama TXT ah (kaar sadar kasta: hore, dambe, tusaale; UTF-8), dheji liis, ama keen xidhmo Anki (.apkg, la dhoofiyay oo leh Taageer noocyada Anki ee duqda).\n\nAma isticmaal faylasha kaarka SD: ku dhig fayl CSV, TSV ama TXT ah, ama xidhmo Anki (.apkg, la dhoofiyay oo leh Taageer noocyada Anki ee duqda), xidhmo kasta galka Flashcards (Isbaanish.tsv wuxuu sameeyaa xidhmada Isbaanish; kaar sadar kasta: hore, dambe, tusaale; loo kaydiyay UTF-8; sadarka ugu horreeya wuxuu magacaabi karaa tiirarka front, back, example). Dooro Kaararka kaarka SD ee Kaararka xusuusta, ama ha dhaco marka aad furto Kaararka xusuusta. Xidhmooyinku waxay ku sii jiraan akhriyaha iyo waxa aad barato, faylkuna waxaa lagu daraa xidhmadiisa mar kasta oo uu cusub yahay ama isbeddelay: beddel dambaha ama tusaalaha kaar faylka dhexdiisa kaarku wuu isbeddelaa oo wuxuu hayaa horumarkiisa; beddel qoraalka hore wuxuu u tirsan yahay kaar cusub, kii hore dib ayuu u bilaabmaa (kaararka waxaa lagu kala garaa qoraalka hore; meel bannaan iyo xarfo waaweyn ma tirsanaan); sadar aad tirtirto kaarka ma tirtirto (ilaa aad dejiso “kaararka faylka ka maqan” Ka saar xidhmadaas: kaarkaas markaas waa laga saaraa cusboonaysiinta xigta oo leh horumarkiisa, weligii, waxbana lama saaro inta sadar fayl ka mid ah aan la akhrin karin). Ku kaydi xidhmo faylkeeda Ku kaydi kaarka: faylku wuxuu helaa lambarrada kaararka (tiirka id), sidaas darteed waad ka beddeli kartaa qoraallada hore kombuyuutar kaararkuna waxay hayaan waxa aad barateen; faylku wuxuu hayaa id, hore, dambe iyo tusaale oo keliya (tiirarka kale, faallooyinka iyo nidaamka sadarrada lama hayo), kaydintuna waa la diidaa inta sadar fayl ka mid ah aan la akhrin karin; faylkii halkaas ku jiray waxaa loo koobiyeeyay _name.bak.tsv markii ugu horreysay (kaydin dambe nuqulkaas ma bedelo). Fayl ka weyn 4 MiB ama 20,000 sadar lama akhriyo, waana in loo kaydiyaa CSV UTF-8, ma aha UTF-16. Markii ugu horreysay, akhriyuhu wuxuu sameeyaa galka oo leh xusuus ku saabsan sida uu u shaqeeyo.\n\nDejinta, hoosta Akhris, Erayada la raadiyay waxay noqdaan kaarar wuxuu eray kasta oo la raadiyay geliyaa xidhmada La raadiyay."
