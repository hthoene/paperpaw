keys.plugin.name = Badhamada iyo dhaqdhaqaaqyada
keys.plugin.description = Waxa badhan kasta, aagga taabashada iyo jiidasho kasta sameeyaan, oo laga beddelay qalabka.
keys.plugin.how = "Badhamada iyo dhaqdhaqaaqyadu waxay muujiyaan waxa badhan kasta, aagga taabashada iyo jiidasho kasta sameeyaan, oo kuu ogolaanaya inaad ka beddesho qalabka.\n\nKa fur dejinta, hoosta Qalab. Marka hore dooro meesha isbeddelku khuseeyo: Meel kasta, Inta wax la akhrinayo, Shaashadda hore, Maktabadda ama hal qalab. Kadibna dooro gelin, sida badhan la hayo ama jiidasho geesta ka soo gala, oo ka dooro ficil liiska, kaasoo aad raadin karto. Sida caadiga ahi wuxuu soo celiyaa waxa plugin-yada iyo habaynta badhamadu dejiyeen.\n\nX4, isbeddel aan ka tagayn badhan lagu doorto, lagu laabto ama lagu sii socdo waa la diidaa. Dib u dhig badhamada iyo dhaqdhaqaaqyada dhammaadka wuxuu ka noqdaa isbeddel kasta."
