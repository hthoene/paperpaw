settings.plugin.name = Dejinta
settings.plugin.description = Boggagga dejinta, oo laga dhisay dejinta plugin kasta.
settings.plugin.how = "Dejintu waxay muujisaa wax kasta oo lagu dejin karo PaperPaw iyo plugin-yadiisa, boggag ahaan. Plugin-yadu shaashad u gaar ah uma baahna: waxa ay ku dhawaaqaan halkan ayuu ka muuqdaa, koox-koox, oo leh sharraxaadda dejin kasta hoosteeda.\n\nKa fur Dejinta menu-ga. Taabo koox si aad u furto, kadibna dejin si aad u beddesho ama u dooratid; tirooyinku waxay leeyihiin badhamada − iyo +. Badhamada, u gudub dejin oo riix Dooro: bidix iyo midig waxay beddelaan lambar, Dooro wuu hayaa, Dib wuxuu ku celiyaa qiimihii hore.\n\nIsbeddellada isla markiiba way khuseeyaan. Raadi wuxuu helaa dejin erayo ahaan Dejinta horumarsan wuxuu ku daraa kuwa dhif ah loo baahdo. Dib u dhig caadiga ah iyo Dib u dhig dhammaan marka hore way weydiiyaan."
