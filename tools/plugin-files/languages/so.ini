anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Waxay barataa kaararka Anki ee kombuyuutarkaaga ee waqtigoodu yahay oo jawaabahaaga dib u dirta, iyada oo loo marayo add-on-ka AnkiConnect.
anki.plugin.how = "Anki wuxuu kuu ogolaanayaa inaad akhriyaha ku barato kaararka Anki ee kombuyuutarkaaga ee waqtigoodu yahay, oo wuxuu dib u diraa jawaabahaaga. Wuxuu isticmaalaa add-on-ka bilaashka ah ee AnkiConnect (koodhka add-on 2055492159) marnaba AnkiWeb. Marka hore waa dansan yahay: ka dar Dukaanka plugin-yada.\n\nKombuyuutarka: ku rakib AnkiConnect Anki (Tools, Add-ons, Get Add-ons) oo dib u bilow Anki. Anki waa inuu furan yahay inta aad waafajiso.\n\nSida caadiga ah AnkiConnect wuxuu jawaabaa kombuyuutarka uu ka shaqeeyo oo keliya (127.0.0.1), sidaas darteed akhriyuhu ma gaari karo. Fur Tools, Add-ons, AnkiConnect, Config oo dhig “webBindAddress” “0.0.0.0” (dhegeyso shabakadda guriga). Dekedda, “webBindPort”, waa 8765 haddii aadan beddelin. Haddii aad halkaas ku dhigto “apiKey”, geli isla furahaas halkan. Dib u bilow Anki kadib beddelka habaynta, oo u oggolow Anki firewall-ka kombuyuutarka haddii uu weydiiyo. Tan isticmaal shabakad aad aamintid oo keliya: qof kasta oo ku jira wuu gaari karaa AnkiConnect, sidaas darteed fure waa fikrad wanaagsan.\n\nAkhriyaha: ka fur Anki Qalabka, kadibna geli cinwaanka kombuyuutarka (tusaale 192.168.1.20) hoosta Kombuyuutar, dekedda haddii aanay ahayn 8765, iyo furaha API haddii aad dhigatay. Dooro Xidhmo, ama ka tag madhan dhammaan xidhmooyinka. Kadib dooro Waafaji Anki, adigoo Wi-Fi shidan: jawaabahaaga sugaya marka hore ayaa la diraa, kadibna kaararka waqtigoodu yahay (iyo tirada kaararka cusub ee aad dejisay) ayaa la soo qaadaa, ugu badnaan 50. Dooro Baro si aad ugu gudubto, shabakad la'aan: muuji jawaabta oo qiimee Mar kale, Adag, Wanaagsan ama Fudud. Jawaabahaaga waxay ku kaydsan yihiin akhriyaha, xitaa Wi-Fi la'aan, waxayna aadaan Anki waafajinta xiga. Anki ayaa go'aamiya goorta kaarku soo laabanayo: kaarka aad ku jawaabtay Mar kale ayaa waafajin dambe mar kale la soo qaadayaa marka Anki yidhaahdo waqtigiisa yahay.\n\nWaafaji marka Anki furmo, ee dejinta, wuxuu waafajiaa mar kasta oo aad shaashadda furto. Waxba shabakad ma isticmaalaan marka aad badhan riixdo."
