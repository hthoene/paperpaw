notes-overview.plugin.description = Calaamadaha iyo iftiiminta dhammaan buugagta hal liis, iyo dhoofin sida My Clippings.txt.
notes-overview.plugin.how = "Dhammaan xusuus-qorrada wuxuu liisteeyaa buug kasta oo aad ku samaysay calaamad ama iftiimin, oo leh tirada. Ka fur Qalabka. Dooro buug si aad u aragto xusuus-qorradiisa, iyo xusuus-qor si aad buugga meeshaas uga furto.\n\nDhammaadka liiska, Dhoofi sida My Clippings.txt wuxuu dhammaan xusuus-qorrada ku qoraa hal fayl, galka Exports ee maktabadda agteeda, qaabka uu Kindle isticmaalo (UTF-8). Barnaamijyada akhriya My Clippings.txt ee Kindle way akhrin karaan. Xusuus-qor iftiimin ku saabsan waa gelitaan u gaar ah, sida Kindle. Sababtoo ah buug halkan ma laha goobo Kindle, “goobta” waa intee le'eg ayay xusuus-qorku buugga ku jiraa, boqolkiiba. Faylka mar kasta dib ayaa loo qoraa; wuxuu bedelaa kii hore."
