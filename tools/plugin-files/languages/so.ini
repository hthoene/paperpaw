keyboard.plugin.name = Kiiboodh
keyboard.plugin.description = Wuxuu qoraal ku geliyaa shaashadda, taabasho ama badhamada.
keyboard.plugin.how = "Kiiboodhku wuu furmaa mar kasta oo wax qoraal u baahdaan: raadin, erayga sirta ah, xusuus-qor ama dejin. Wuxuu ku shaqeeyaa taabasho iyo badhamada oo keliya.\n\nBadhamada, bidix iyo midig waxay ku dhaqaajiyaan safka, badhamada bogga waxay u dhaqaajiyaan safafka dhexdooda, Dooro wuxuu riixaa fure Dib-na wuu joojiyaa; bidix iyo midig way ku wareegaan safka, kor iyo hoos tiirkaaga ayay ku sii jiraan. Shift wuxuu xarafka xiga ka dhigaa weyn; mar labaad riix xarfaha waaweyn oo dhan, mar kale si aad u joojiso. Hay xaraf (badhamada: hay Dooro xarafka) si aad u hesho kan weyn, isla markiiba la doortay, iyo calaamado sida é iyo è. OK wuu dhammeeyaa; badhamada, hay Dib si aad meel kasta uga dhammayso (Dib kaligiis wuu joojiyaa), ama hay Dooro fure aan xaraf ahayn. Dheji wuxuu geliyaa qoraalka clipboard-ka, Taleefan, marka la bixiyo, wuxuu kuu ogolaanayaa inaad taleefankaaga ku qorto.\n\nDejinta hoosteeda Qalab, Kiiboodh: Qaababka kiiboodhka wuxuu dooranayaa qaababka. Sida caadiga ah wuxuu raacaa luqadda menu-ga; marka dhowr jiraan, fure ayaa u beddela. Furayaasha calaamadaha xarafka wuxuu siiyaa furayaal u gaar ah. Cabbirku wuxuu weyneeyaa furayaasha iyo xarfaha; badhamada oo keliya, safafku waa kuwa kiiboodhka kombuyuutarka. Shaashadaha taabashada, Qaabka furaha wuxuu beddelaa sida furayaasha u eg yihiin. Xarfaha waaweyn ee toosan wuxuu jumlad kasta ku bilaabaa xaraf weyn."
