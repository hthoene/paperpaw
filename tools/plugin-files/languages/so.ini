plugin-manager.plugin.name = Maareeyaha plugin-ka
plugin-manager.plugin.description = Wuxuu liisteeyaa plugin-yada oo shidaa oo damiyaa.
plugin-manager.plugin.how = "Maareeyaha plugin-ku wuxuu liisteeyaa plugin kasta oo leh nooca iyo sharraxaadda, wuxuuna shidaa oo damiyaa plugin-yada.\n\nKa hel Dejinta, sida Maaree plugin-yada. Dejinta plugin-yada waa bog gooni ah oo loogu talagalay doorbidyada sida isticmaalka shabakadda ee plugin kasta. Taabo plugin si aad u shido ama u damiso (badhamada, dooro). Isbeddelku wuxuu khuseeyaa dib u bilaabid kadib: xariiqda hoose ayaa markaas bixisa Hadda dib u bilow. Hay plugin (badhamada, hay Dooro) si aad u akhrido sida uu u shaqeeyo.\n\nPlugin lagu calaamadiyay Had iyo jeer shidan lama damin karo, mid lagu calaamadiyay Loo baahan yahay wuxuu damaa marka plugin kale shaqadiisa qabto oo keliya, haddii kale PaperPaw ma lahaan lahayn waddo dib loogu noqdo. Hoosta Shaashadaha waxaad doorataa plugin-ka muujiya meel dhowr plugin bixiyaan."
