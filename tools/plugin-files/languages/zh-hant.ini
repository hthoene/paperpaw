files.plugin.name = 檔案瀏覽器
files.plugin.description = 列出裝置上的書與資料夾，並可開啟。
files.plugin.how = "書庫會列出書庫資料夾中的書，每本都顯示封面、書名、作者與閱讀進度。最後閱讀的書會以卡片放在最上方，所以點一下或按一下「選擇」鍵就能繼續閱讀。書庫尋找書的時候，會顯示目前已找到的數量。\n\n你可以選擇書上方顯示的內容：全部、閱讀中、未讀或已讀完的書，或是書架（依作者、系列、標籤、我的最愛，以及每個已開始系列的下一本書）。點一下書即可閱讀；長按書（使用按鍵時，長按「選擇」鍵）可開啟、標示為已讀完或未讀、查看書籍資訊、移到封存或刪除。點一下標題可開啟書庫選單：書的排序與顯示方式、搜尋、書庫資料夾與設定。\n\n書庫資料夾可在「設定」的「書庫」中的「書庫資料夾」設定；也可在那裡將書顯示為封面格狀。其他所有檔案請使用「工具」選單中的「檔案」。"
