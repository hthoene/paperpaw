vocabulary.setting.sd-folder = 牌組檔案的資料夾
vocabulary.setting.sd-folder.help = 在記憶卡上：其中的每個 CSV、TSV 或 Anki 檔案就是一個牌組。
vocabulary.sd.readme = "用檔案建立學習卡\n\n每個牌組請在這裡放一個檔案：Spanish.tsv 會建立牌組 Spanish。\n檔案格式：.tsv、.csv 或 .txt（以 UTF-8 儲存），或 .apkg：從 Anki 匯出並勾選「Support older Anki versions」的牌組。它的筆記前三個欄位會成為正面、背面和例句；排程和媒體不會讀取，PaperPaw 也絕不會寫入 Anki 檔案。\n\n每行一張卡片：正面、背面和例句（選填），用 Tab、逗號或分號分隔。第一行可以寫欄位名稱：front、back、example。範例：\n\nKatze\tcat\tDie Katze schläft.\n\n然後在閱讀器上開啟「學習卡」，選擇「記憶卡上的學習卡」，再選擇「更新牌組」。\n\n注意事項：\n- 牌組會留在閱讀器上，連同你的學習進度。檔案是新的或已變更時才會讀取，其中的卡片會加入牌組，或修改牌組中的卡片。\n- 在檔案中修改卡片的背面或例句：卡片會變更，並保留你的進度。\n- 修改卡片的正面文字：會視為新卡片，舊卡片則從頭開始。卡片是依正面文字比對，空格和大小寫不算。把牌組儲存成檔案（記憶卡上的學習卡，儲存牌組到記憶卡）後，每張卡片在 id 欄都有一個編號：在那裡修改正面，並保持檔案的前兩行不變，卡片就會保留你的學習進度。\n- 儲存會寫入牌組的卡片。檔案中原有但不是卡片的內容（沒有正面的行）不會保留；原本的檔案會複製為 _name.bak.tsv。\n- 請將檔案存成 CSV UTF-8（不要用 UTF-16，也不要用試算表自己的格式）。超過 4 MiB 或 20,000 行的檔案不會讀取：請拆開。\n- 在檔案中刪除一行，不會刪除牌組中的卡片，除非你為該牌組開啟「移除缺少的卡片」。開啟後，卡片會連同你的學習進度一起消失。\n- 檔名以 _ 開頭的檔案不會讀取。\n"
