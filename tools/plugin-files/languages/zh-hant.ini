update.plugin.name = 更新
update.plugin.description = 安裝韌體更新，可從記憶卡安裝，或從網際網路下載。
update.plugin.how = "「更新」會安裝新的韌體，適用於以 PaperPaw 作為韌體的裝置，例如 X4。你可以在設定中找到它，名稱為「更新」。\n\n「線上搜尋」會向更新伺服器詢問是否有較新的 PaperPaw 並下載，透過 Wi-Fi 約需幾分鐘。或者把更新檔（副檔名為 .bin，來自 paperpaw.org）複製到記憶卡上的 updates 資料夾，例如使用 Wi-Fi 傳輸。接著安裝約需一分鐘，完成後裝置會重新啟動；書、設定和閱讀位置都會保留。\n\n開啟「檢查更新」（在設定中，預設為關閉）後，裝置大約每週會自行詢問一次，而且只在 Wi-Fi 本來就開著或正在充電時進行。找到較新的 PaperPaw 會放在這裡等你；閱讀時不會有任何打擾。搜尋時會送出裝置上執行的版本，但不含裝置的名稱或編號；為了統計裝置數量，還會送出是否由你主動詢問，以及這是否是當天、當週或當月的第一次搜尋。\n\n如果你使用的外掛還沒有適用於新版本的版本，更新會等它們。較舊的版本只有在你自己選擇時才會安裝。\n\n其他韌體，例如 CrossPoint，也可以從這裡安裝：把它的檔案（副檔名為 .bin）放進 updates 資料夾，然後開啟「更新」。PaperPaw 會檢查它是否為適用於這台裝置、完整且未損壞的韌體，但因為沒有簽章，無法得知是誰製作的。「仍要安裝」會把它寫入快閃記憶體的另一半，然後由裝置啟動它；PaperPaw 會留在自己的那一半，直到那個韌體在上面安裝了別的東西。之後若要回到 PaperPaw，請從另一個韌體的選單安裝 PaperPaw 的安裝檔（paperpaw-<device>-<version>-install.bin），例如 CrossPoint 的 SD 韌體更新。"
