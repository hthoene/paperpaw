vocabulary.sd.uptodate = 모두 최신 상태예요.
vocabulary.sd.nomemory = 카드에 있는 파일을 읽을 메모리가 부족해요. 다시 시도하세요.
vocabulary.sd.nocard = SD 카드를 읽을 수 없어요. 카드가 꽂혀 있는지 확인하고 다시 시도하세요.
vocabulary.sd.result = 추가 {added}, 변경 {changed}, 그대로 {same}.
vocabulary.sd.result.removed = 추가 {added}, 변경 {changed}, 삭제 {removed}, 그대로 {same}.
vocabulary.sd.update = 덱 업데이트
