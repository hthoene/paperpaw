core.firmware.dual.what = 그러면 PaperPaw는 이 기기를 자기 것으로 취급해요. 다음 업데이트 때 다른 펌웨어가 지워지며, 되돌릴 수 없어요. 두 펌웨어를 설정한 도구만 되돌릴 수 있어요.
core.firmware.dual.yes = 전용으로 사용
