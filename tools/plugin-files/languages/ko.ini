vocabulary.sd.row.todo.other = {folder}에 새 파일이나 바뀐 파일이 {count}개 있어요. 이 항목을 누르면 덱을 업데이트해요.
vocabulary.sd.row.failed.one = {folder}의 파일 {count}개를 덱으로 만들지 못했어요. 이 항목을 누르면 이유를 볼 수 있어요.
vocabulary.sd.row.failed.other = {folder}의 파일 {count}개를 덱으로 만들지 못했어요. 이 항목을 누르면 이유를 볼 수 있어요.
