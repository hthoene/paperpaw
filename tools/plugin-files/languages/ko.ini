vocabulary.sd.readme = "파일로 만드는 플래시카드\n\n덱마다 파일을 하나씩 여기에 넣으세요. Spanish.tsv는 Spanish 덱을 만들어요.\n파일 형식: UTF-8로 저장한 .tsv, .csv, .txt 파일, 또는 Support older Anki versions를 선택해 내보낸 Anki 덱(.apkg)이에요. Anki 덱은 메모의 처음 세 필드가 앞면, 뒷면, 예문이 되고, 학습 기록과 미디어는 읽지 않아요. PaperPaw는 Anki 파일에 절대 쓰지 않아요.\n\n한 줄에 카드 하나를 쓰고, 앞면, 뒷면, 예문(선택)을 탭, 쉼표, 세미콜론으로 구분하세요. 첫 줄에 열 이름(front, back, example)을 적어도 돼요. 예:\n\nKatze\tcat\tDie Katze schläft.\n\n그런 다음 리더에서 플래시카드를 열고, SD 카드의 카드를 선택한 뒤 카드에서 덱 업데이트를 선택하세요.\n\n알아 두세요:\n- 덱은 학습 기록과 함께 리더에 남아요. 파일이 새로 생겼거나 바뀌었을 때 읽으며, 그 카드는 덱에 추가되거나 덱에서 바뀌어요.\n- 파일에서 카드의 뒷면이나 예문을 바꾸면 카드가 바뀌고 학습 기록은 유지돼요.\n- 카드의 앞면 글을 바꾸면 새 카드로 취급되고, 이전 카드는 처음부터 다시 시작해요. 카드는 앞면 글로 구분하며, 띄어쓰기와 대소문자는 구분하지 않아요. 덱을 파일로 저장하면(SD 카드의 카드, 덱을 카드에 저장) 모든 카드에 id 열의 번호가 생겨요. 거기서 앞면을 바꾸고 파일의 처음 두 줄을 그대로 두면 카드가 학습 기록을 유지해요.\n- 저장하면 덱의 카드를 써요. 파일에 있었지만 카드가 아닌 것(앞면이 없는 줄)은 남지 않아요. 원래 있던 파일은 _name.bak.tsv로 복사돼요.\n- 파일은 CSV UTF-8로 저장하세요(UTF-16이나 스프레드시트 고유 형식은 안 돼요). 4 MiB가 넘거나 20,000줄이 넘는 파일은 읽지 않으니 나누세요.\n- 파일에서 줄을 지워도 덱의 카드는 삭제되지 않아요. 그 덱에서 없는 카드 삭제를 켠 경우에만 삭제되고, 이때 학습 기록도 함께 사라져요.\n- 이름이 _로 시작하는 파일은 읽지 않아요.\n"
