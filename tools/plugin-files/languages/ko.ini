core.setting.night-mode.short = 야간
core.setting.speak-focus = 선택한 항목 읽어 주기
core.setting.full-refresh-interval = 전체 새로 고침
core.setting.rotation = 화면 회전
core.setting.rotation.help = 세로 또는 가로예요. “이 책만”을 켜면 그 책에만 적용돼요.
core.setting.button-hints = 버튼 안내
core.setting.button-hints.help = 화면 아래쪽 줄에 그 아래 각 버튼의 기능을 보여줘요. 읽는 중에는 표시되지 않아요.
core.setting.swap-page-buttons = 페이지 버튼 바꾸기
core.setting.swap-page-buttons.help = 읽는 중에는 페이지 버튼의 방향이 반대로 바뀌어요. 메뉴에서는 바뀌지 않아요.
core.setting.arrows-stay-on-page = 방향 버튼은 페이지 안에서만 이동
core.setting.arrows-stay-on-page.help = 페이지의 첫 항목이나 마지막 항목에서 방향 버튼은 그 페이지 안에서 순환해요. 페이지 버튼으로 페이지를 넘겨요.
core.setting.space-size = 크기
core.setting.space-size.help = 모든 공백의 높이예요.
core.setting.align = 정렬
core.setting.align.help = 위젯의 글이 자리 안에서 놓이는 위치예요. 왼쪽, 가운데, 오른쪽 중에서 고르세요.
core.setting.frame = 테두리
core.setting.frame.help = 위젯을 그리는 방식이에요. 어두운 카드는 밝은 글자를 써요.
core.setting.padding = 여백
core.setting.padding.help = 위젯의 내용과 가장자리 또는 테두리 사이의 간격이에요.
core.setting.font = 글꼴
core.setting.font.help = 이 위젯의 글꼴이에요. 카드의 글꼴로 표시하기에 너무 큰 글자는 메뉴 글꼴로 남아요.
core.setting.size = 크기
core.setting.size.help = 위젯 글자의 크기예요. 맞지 않으면 더 작게 표시돼요.
core.setting.part.help = 위젯에 이것을 표시할지 정해요. 공간이 너무 좁으면 표시되지 않을 수 있어요.
core.setting.widget-frame = 위젯 테두리
core.setting.widget-frame.help = 자체 설정에서 테두리를 고르지 않은 모든 위젯에 적용할 테두리예요.
core.setting.paper = 색상
core.setting.paper.help = 보통, 반전, 회색, 투명 중에서 골라요. 어두운 사진 위에서는 밝은 글자를 고르세요.
core.setting.ink = 글자
core.setting.ink.help = 위젯 글자의 색이에요. 자동은 읽기 좋은 쪽인 검정 또는 흰색이에요.
core.setting.widget-paper = 위젯 색상
core.setting.widget-paper.help = 자체 설정에서 색을 고르지 않은 모든 위젯의 바탕색이에요.
core.setting.widget-ink = 위젯 글자
core.setting.widget-ink.help = 자체 설정에서 글자색을 고르지 않은 모든 위젯의 글자색이에요.
core.setting.corners = 모서리
core.setting.corners.help = 위젯 모서리가 얼마나 둥근지 정해요. 자동은 나머지 인터페이스를 따라요.
core.setting.frame-line = 테두리 선
core.setting.frame-line.help = 위젯 테두리 선의 굵기예요. 자동은 인터페이스의 선을 따라요.
core.setting.shadow = 그림자
core.setting.shadow.help = 위젯의 카드나 색 아래쪽과 오른쪽에 진한 그림자를 넣어요.
core.setting.widget-corners = 위젯 모서리
core.setting.widget-corners.help = 자체 설정에서 모서리를 고르지 않은 모든 위젯의 모서리예요.
core.setting.widget-frame-line = 위젯 테두리 선
core.setting.widget-frame-line.help = 자체 설정에서 테두리 선을 고르지 않은 모든 위젯의 테두리 선이에요.
core.setting.widget-shadow = 위젯 그림자
core.setting.widget-shadow.help = 자체 설정에서 그림자를 고르지 않은 모든 위젯에 적용할 그림자예요.
core.setting.widget-padding = 위젯 안쪽 여백
core.setting.widget-padding.help = 자체 설정에서 여백을 고르지 않은 모든 위젯의 안쪽 여백이에요.
core.setting.widget-font = 위젯 글꼴
core.setting.widget-font.help = 자체 설정에서 글꼴을 고르지 않은 모든 위젯의 글꼴이에요.
core.setting.widget-gap = 위젯 사이 간격
core.setting.widget-gap.help = 홈 화면에서 위젯 사이가 얼마나 떨어져 있는지 정해요.
core.setting.text-color = 글자색
core.setting.paper-color = 종이색
core.setting.colors.help = 흰 바탕에 검정 글자보다 부드러워서 눈이 편해요. 야간 모드에서는 서로 바뀌어요.
core.setting.text-color-own = 직접 지정한 글자색
core.setting.paper-color-own = 직접 지정한 종이색
core.setting.color-own.help = #5b4636 같은 색 코드예요 (빨강, 초록, 파랑). 위에서 색을 “직접 지정”으로 골랐을 때 쓰여요.
core.setting.sleep-after = 절전까지 시간
core.setting.notice-seconds = 메시지 표시 시간
core.setting.long-press-ms = 길게 누르기
core.setting.double-tap-ms = 두 번 탭
core.setting.tap-slop = 탭 허용 범위
core.setting.swipe-distance = 스와이프 거리
core.setting.frontlight = 조명
core.setting.frontlight-warmth = 조명 색온도
core.setting.ui-size = 메뉴 글자 크기
core.setting.keymap-preset = 버튼 배치
core.setting.ui-header = 머리글
core.setting.ui-margin = 메뉴 여백
core.setting.ui-row = 줄 높이
core.setting.ui-lines = 선 굵기
core.setting.network-manager = 네트워크 관리 플러그인
core.setting.logo = 로고 사진
core.setting.ui-palette = 회색 단계
core.setting.text-curve = 글자 톤 곡선
core.setting.ui-text-curve = 인터페이스 글자 톤 곡선
core.setting.language.help = 메뉴와 메시지의 언어예요.
core.setting.device-name.help = Calibre, 공유기 등에 보이는 이름이에요. 다음 연결부터 적용돼요.
core.setting.night-mode.help = 검정 바탕에 흰 글자예요.
core.setting.night-pictures = 사진 반전
core.setting.night-pictures.help = 끄면 표지와 사진을 네거티브가 아니라 원래대로 보여줘요.
core.setting.mono-text = 글자 농도
core.setting.mono-text.help = 흑백 화면에서 글자가 얼마나 굵은지 정해요. 진하게는 옅은 화면에서 도움이 돼요.
core.setting.speak-focus.help = 버튼으로 이동한 줄이나 버튼을 읽어 줘요.
core.setting.voice = 음성
core.setting.voice.help = 자동은 시스템 음성을 쓰고, 없으면 그 언어의 플러그인 음성을 써요.
core.setting.ui-size.help = 메뉴, 목록, 상태 줄의 크기예요.
core.setting.keymap-preset.help = 기기 버튼이 하는 일을 정해요.
core.setting.full-refresh-interval.help = 페이지를 이만큼 넘길 때마다 깜박이며 새로 고쳐서 잔상을 없애요. 0이면 깜박이지 않아요.
core.setting.flash-screens = 화면 전환 시 깜박임
core.setting.flash-screens.help = 화면을 열 때 전체를 다시 그려요. 이전 화면의 흔적이 남지 않지만 더 느려요.
core.setting.ui-full-refresh-interval = 메뉴 전체 새로 고침
core.setting.ui-full-refresh-interval.help = 메뉴를 이만큼 바꿀 때마다 깜박여서 잔상을 없애요. 0이면 깜박이지 않아요.
core.setting.pictures-in-grays = 사진을 회색으로 표시
core.setting.pictures-in-grays.help = 표지 같은 사진을 회색 네 단계로 그려요. 더 섬세하지만 조금 느려요.
core.setting.sleep-after.help = 절전하기 전까지 아무 동작이 없는 시간(분)이에요. 0이면 절전하지 않아요.
core.setting.notice-seconds.help = “동기화 완료” 같은 짧은 메시지가 화면에 머무는 시간이에요.
core.setting.ui-header.help = 메뉴와 목록 맨 위의 제목 모양이에요.
core.setting.ui-corners = 모서리
core.setting.ui-corners.help = 강조된 줄, 버튼, 상자의 모서리예요.
core.setting.ui-contrast = 대비
core.setting.ui-contrast.help = 강하게를 고르면 회색 안내와 메모를 검정으로 그려요.
core.setting.ui-focus = 선택한 줄
core.setting.ui-focus.help = 선택한 줄을 표시하는 방식이에요.
core.setting.ui-shadow = 그림자
core.setting.ui-shadow.help = 시트, 대화상자, 칩에 진한 그림자를 넣을지 정해요.
core.setting.ui-frame = 테두리
core.setting.ui-frame.help = 시트, 대화상자, 칩의 테두리예요. 각각 따로 또는 모두 같게 정해요.
core.setting.ui-density = 간격
core.setting.ui-density.help = 화면의 요소 사이와 주위에 둘 공간의 크기예요.
core.setting.ui-button = 버튼
core.setting.ui-button.help = 선택하지 않은 버튼의 모양이에요: 테두리형, 채움형, 평면형.
core.setting.ui-separators = 줄 사이 선
core.setting.ui-separators.help = 밝은 선, 글자가 시작되는 곳부터 옅은 선, 또는 없음을 골라요.
core.setting.ui-groups = 목록 구역
core.setting.ui-groups.help = 목록의 구역을 그대로 또는 둥근 카드로 표시해요.
core.setting.ui-title = 제목 크기
core.setting.ui-title.help = 메뉴와 목록 맨 위 제목의 크기예요. 글자 크기에 대한 백분율이에요.
core.setting.ui-margin.help = 메뉴와 목록의 왼쪽과 오른쪽 여백이에요.
core.setting.ui-row.help = 메뉴와 목록 줄의 높이예요. 글자 크기에 비례해요.
core.setting.ui-lines.help = 선과 테두리를 얼마나 굵게 그릴지 정해요.
core.setting.network-manager.help = 고급 설정이에요. 네트워크가 필요할 때 Wi-Fi에 연결하는 플러그인이에요. 비워 두면 없음이에요.
core.setting.logo.help = PaperPaw 로고 대신 보여줄 JPEG 또는 PNG의 경로예요. 비워 두면 기본 로고예요.
core.setting.ui-palette.help = 용도별 색이에요. 예: muted=60 line=170 link=#2a6f97 (0은 검정, 255는 흰색).
core.setting.text-curve.help = 책 글자 가장자리의 톤이에요. smooth, sharp:128, 또는 0-255 숫자 16개예요.
core.setting.ui-text-curve.help = 고급 설정이에요. 메뉴와 목록에 같은 설정을 적용해요.
core.setting.long-press-ms.help = 길게 누르기로 인식하기까지 버튼이나 손가락을 누르고 있는 시간이에요.
core.setting.double-tap-ms.help = 첫 번째 탭이나 누름 뒤 두 번째가 얼마나 빨리 이어져야 하는지 정해요.
core.setting.tap-slop.help = 손가락이 얼마나 움직여도 탭으로 인식할지 정해요.
core.setting.swipe-distance.help = 스와이프로 인식하려면 손가락이 얼마나 움직여야 하는지 정해요.
core.setting.frontlight.help = 조명의 밝기예요. 0이면 꺼요.
core.setting.frontlight-warmth.help = 조명의 색온도예요: 0은 차갑게, 100은 따뜻하게.
core.setting.clock-format = 시계
core.setting.week-start = 한 주의 시작
core.setting.clock-format.help = 시간 표시 방식이에요: 14:30 또는 2:30 PM.
core.setting.week-start.help = 달력과 독서 통계에서 한 주가 시작되는 요일이에요.
core.setting.time-zone = 시간대
core.setting.time-zone.help = 자동은 시스템의 시간대를 써요. 시스템에 시간대가 있을 때만 해당돼요.
core.setting.time-zone-rule = 시간대 규칙
core.setting.time-zone-rule.help = 목록에 없는 시간대를 위한 POSIX TZ 규칙이에요. 시간대 설정보다 우선해요.
core.setting.battery-low = 배터리 부족 기준
core.setting.battery-low.help = 상태 줄에 “배터리 부족 시”가 표시되는 충전량이에요.
core.setting.awake-holds = 플러그인이 절전을 막도록 허용
core.setting.awake-holds.help = 시계나 게임은 절전을 막을 수 있어요. 색인 작업은 항상 막아요.
core.setting.reading-font = 글꼴
core.setting.status-font = 글꼴
core.setting.status-font.help = 읽는 중 상태 줄의 글꼴이에요. 메뉴와 같게, 책과 같게, 또는 따로 고를 수 있어요.
core.setting.reading-font.help = “책의 글꼴”은 기기에 기본으로 들어 있는 글꼴이에요. 기기가 책의 글꼴을 표시할 수 있으면 책 자체의 글꼴이에요.
core.setting.font-size = 글자 크기
core.setting.font-size.help = 책 본문의 글자 크기예요.
core.setting.font-size.largest = 책 본문의 글자 크기예요. 더 큰 크기는 글꼴 찾아보기에서 고르세요.
core.setting.line-spacing = 줄 간격
core.setting.margin = 여백
core.setting.justify = 양쪽 맞춤
core.setting.hyphenate = 단어 하이픈 처리
core.setting.hyphen-min-left = 하이픈 앞 글자 수
core.setting.hyphen-min-right = 하이픈 뒤 글자 수
core.setting.indent = 문단 들여쓰기
core.setting.paragraph-spacing = 문단 간격
core.setting.margin-ends = 위아래 여백
core.setting.footnotes = 각주
core.setting.reading-app = 읽기 앱
core.setting.reading-app.help = 책을 열 앱이에요. 형식, 책, 폴더마다 따로 정할 수 있어요.
core.setting.reading-app.format.help = 이 형식의 책을 열 앱이에요. 기본은 위의 읽기 앱이에요.
core.setting.widows = 위쪽에 남길 줄 수
core.setting.widows.help = 문단에서 다음 페이지 맨 위로 넘길 최소 줄 수예요.
core.setting.orphans = 아래쪽에 남길 줄 수
core.setting.orphans.help = 문단에서 페이지 맨 아래에 남길 최소 줄 수예요.
core.setting.page-frame = 페이지 틀
core.setting.page-frame.help = 글이 페이지에 놓이는 방식이에요. 플러그인으로 다른 틀을 추가할 수 있어요.
core.setting.line-spacing.help = 글꼴 크기에 비례한 줄 사이의 간격이에요.
core.setting.margin.help = 글과 화면 가장자리 사이의 간격이에요.
core.setting.justify.help = 문단을 양쪽 끝에 맞춰요.
core.setting.hyphenate.help = 책의 언어에 맞춰 긴 단어를 줄 끝에서 나눠요.
core.setting.hyphen-min-left.help = 하이픈 앞에 남길 최소 글자 수예요. 0이면 언어의 기본값이에요.
core.setting.hyphen-min-right.help = 하이픈 뒤로 넘길 최소 글자 수예요. 0이면 언어의 기본값이에요.
core.setting.indent.help = 각 문단의 첫 줄을 들여써요.
core.setting.paragraph-spacing.help = 첫 줄을 들여쓰든 아니든 문단 사이에 간격을 둬요.
core.setting.margin-ends.help = 글 위아래의 공간이에요. 바꾸기 전에는 좌우 여백과 같아요.
core.setting.footnotes.help = 각주 표시(1, [2], *)를 탭하면 페이지 위에 각주를 보여주거나 해당 위치로 이동해요.
core.setting.publisher-styles = 출판사 서식
core.setting.publisher-styles.help = 책 자체의 레이아웃을 써요. 끄면 글을 단순하게 보여줘요.
core.setting.font-weight = 글꼴 굵기
core.setting.font-weight.help = 어떤 글꼴이든 더 진하고 굵게 표시해요. 밝은 화면에서 도움이 돼요.
core.setting.smooth-text = 부드러운 글자
core.setting.smooth-text.help = 가장자리를 부드러운 회색으로 처리해요. 흑백 화면에서는 페이지마다 깜박이고 더 느려요.
core.setting.text-contrast = 글자 대비
core.setting.text-contrast.help = 글자를 얼마나 진하게 그릴지 정해요. 테마가 정한 톤 곡선이 있으면 그것이 우선해요.
core.setting.text-sharpness = 선명도
core.setting.text-sharpness.help = 글자가 얼마나 또렷해 보일지 정해요. 선명하게는 더 단단하고 깔끔하며, 부드럽게는 더 가벼워요.
core.setting.word-spacing = 단어 간격
core.setting.word-spacing.help = 단어 사이의 기본 간격이에요. 100 %는 글꼴의 기본값이에요. 양쪽 맞춤한 줄에서는 더 넓어질 수 있어요.
core.setting.book-align = 책의 정렬
core.setting.book-align.help = 가운데 정렬과 오른쪽 정렬을 책에 지정된 대로 따라요.
core.setting.book-indent = 책의 들여쓰기
core.setting.book-indent.help = 첫 줄 들여쓰기와 내어쓰기를 책에 지정된 대로 따라요.
core.setting.book-sizes = 책의 글자 크기
core.setting.book-sizes.help = 더 크거나 작은 글자를 책에 지정된 대로 따라요.
core.setting.book-spacing = 책의 간격
core.setting.book-spacing.help = 문단 주위의 간격을 책에 지정된 대로 따라요.
core.setting.book-fonts = 책의 글꼴
core.setting.book-fonts.help = 책에 들어 있는 글꼴이에요. 기기가 표시할 수 있을 때만 쓰여요.
core.setting.book-margins = 책의 여백
core.setting.book-margins.help = 인용문, 시, 목록의 들여쓰기를 책에 지정된 대로 따라요.
core.setting.book-line-height = 책의 줄 간격
core.setting.book-line-height.help = 내가 정한 줄 간격 대신 책의 줄 간격을 써요.
core.setting.line-breaking = 줄바꿈 방식
core.setting.line-breaking.help = 균형 있게는 줄 끝을 더 고르게 맞추고, 빠르게는 줄을 하나씩 바꿔요.
core.setting.korean-breaks = 한국어 줄바꿈
core.setting.korean-breaks.help = 글자 단위는 인쇄물처럼 어디서나 줄을 바꾸고, 단어 단위는 단어를 나누지 않아요. 한국어에만 적용돼요.
core.setting.hanging-punctuation = 문장 부호 내어쓰기
core.setting.hanging-punctuation.help = 따옴표, 마침표, 쉼표, 하이픈을 글 바깥쪽에 두어 가장자리가 반듯해 보이게 해요.
core.setting.letter-spacing = 글자 간격
core.setting.letter-spacing.help = 글자 사이의 간격이에요. 0 %는 글꼴의 기본값이에요.
core.setting.kerning = 커닝
core.setting.kerning.help = AV 같은 글자 쌍을 글꼴 정보에 따라 더 가깝게 놓아요.
core.setting.ligatures = 합자
core.setting.ligatures.help = 글꼴에 있으면 fi, fl, ff를 한 글자로 이어서 표시해요.
core.setting.indent-size = 들여쓰기 크기
core.setting.indent-size.help = 글꼴 크기에 비례해 첫 줄을 얼마나 들여쓸지 정해요.
core.setting.paragraph-space = 문단 간격
core.setting.paragraph-space.help = 한 줄에 비례해 문단 사이를 얼마나 띄울지 정해요.
core.setting.scope-only = 이 책만
core.setting.scope-only.help = 글꼴과 레이아웃 변경을 이 책에만 적용해요 (•로 표시).
core.setting.edge-ends = 가장자리 스와이프: 위와 아래
core.setting.edge-sides = 가장자리 스와이프: 왼쪽과 오른쪽
core.setting.edge.help = 가장자리에서 얼마나 가까워야 가장자리 스와이프로 인식할지 정해요. 0이면 꺼요.
core.setting.developer = 개발자 옵션
core.setting.library-folder = 서재 폴더
core.setting.library-folder.help = 책이 들어 있는 폴더예요.
core.setting.developer.help = 개발자용이에요. 배터리 사용량을 측정하고, 시험해 보고, 오류를 찾아요.
about.plugin.name = 정보
about.plugin.description = PaperPaw의 버전과 라이선스예요.
about.version.beta = {version} 베타 {number}
about.title = PaperPaw 정보
about.intro = 플러그인으로 만든 전자잉크 기기용 무료 전자책 리더예요. Apache License 2.0으로 배포되며, 함께 들어 있는 구성 요소의 라이선스는 다음과 같아요.
about.plugins.title = 내장 플러그인
about.plugins.help = 이 펌웨어에 코드가 들어 있는 플러그인과 그 버전이에요. 업데이트하면 같은 플러그인이 다시 들어와요. 그렇지 않은 경우에는 먼저 알려 드려요.
about.summary = 플러그인으로 만든 전자잉크 기기용 무료 전자책 리더예요.
about.source = 소스 코드
about.licences = 라이선스
about.licences.help = PaperPaw와 글꼴, 아이콘, 패턴의 라이선스예요.
about.credits = 제작 참여자
about.native.title = 코드 플러그인
