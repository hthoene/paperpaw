files.plugin.name = 파일 탐색기
files.plugin.description = 기기의 책과 폴더를 목록으로 보여 주고 열어 줘요.
files.plugin.how = "서재에는 서재 폴더의 책이 표지, 제목, 저자, 읽은 정도와 함께 나타나요. 마지막으로 읽은 책은 맨 위에 카드로 있어서 한 번 누르거나 선택 버튼을 한 번 누르면 이어서 읽을 수 있어요. 책을 찾는 동안에는 지금까지 찾은 책의 수가 표시돼요.\n\n책 위에서 보여 줄 내용을 고를 수 있어요. 모든 책, 읽는 중인 책, 읽지 않은 책, 다 읽은 책, 또는 책장(저자, 시리즈, 태그, 즐겨찾기, 시작한 시리즈의 다음 책)이 있어요. 책을 누르면 읽고, 길게 누르면(버튼은 선택 버튼을 길게 누르기) 열기, 다 읽음이나 읽지 않음 표시, 정보 보기, 보관함으로 이동, 삭제를 할 수 있어요. 제목을 누르면 서재 메뉴가 나와요. 책 정렬과 표시 방법, 검색, 서재 폴더, 설정이 있어요.\n\n서재 폴더는 설정의 서재에서 서재 폴더로 정해요. 여기서 책을 표지 격자로 볼 수도 있어요. 그 밖의 파일은 도구 메뉴의 파일을 이용하세요."
