joplin.send = Joplin으로 보내기
joplin.send.help = 내보낸 메모를 바로 보내요. 보내지 못한 메모는 기다렸다가 다음 내보내기, 이 설정, 또는 규칙에 따라 함께 보내요.
joplin.service = 동기화 대상
joplin.service.help = Joplin에서 설정한 동기화 대상이에요. Joplin Cloud, 직접 운영하는 Joplin Server, 또는 Nextcloud 같은 WebDAV 폴더예요. 컴퓨터를 켜 둘 필요가 없어요.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = 주소
joplin.address.help = Joplin Server: 서버 주소예요. 예: joplin.example.org. WebDAV: Joplin 설정에 있는 동기화 폴더예요. 예: dav.example.org/Joplin.
joplin.email = 이메일
joplin.user = 사용자 이름
joplin.user.help = Joplin Cloud와 Joplin Server: 로그인에 쓰는 이메일이에요(2단계 인증은 아직 쓸 수 없어요). WebDAV: 폴더의 사용자 이름이에요.
joplin.password = 비밀번호
joplin.password.help = 이 기기에 다른 비밀번호, 키와 함께 보관해요. Nextcloud는 앱 비밀번호도 쓸 수 있어요.
joplin.secret = Joplin 비밀번호
joplin.not-kept = 비밀번호를 이 기기에 저장할 수 없어요.
joplin.notebook = 노트북
joplin.notebook.help = PaperPaw가 Joplin에 만드는 노트북이에요. 책마다 노트가 하나씩 있어요. 다시 내보내면 다른 노트북으로 옮긴 노트도 업데이트돼요.
joplin.idle = 내보낸 메모를 Joplin으로 바로 보내요.
joplin.waiting.one = 책 {count}권의 메모가 전송을 기다려요.
joplin.waiting.other = 책 {count}권의 메모가 전송을 기다려요.
joplin.sent.one = 책 {count}권의 메모가 Joplin에 있어요.
joplin.sent.other = 책 {count}권의 메모가 Joplin에 있어요.
joplin.some-failed = Joplin으로 보냄: {sent}. 보내지 못함: {failed}. 나중에 다시 보내요.
joplin.apart.one = Joplin에서 메모 {count}개가 바뀌어서 옆에 새 메모를 만들었어요.
joplin.apart.other = Joplin에서 메모 {count}개가 바뀌어서 옆에 새 메모를 만들었어요.
joplin.nothing = Joplin으로 보낼 메모가 없어요.
joplin.no-network = Joplin으로 보내려면 네트워크가 필요해요. 메모는 기다렸다가 나중에 보내요.
joplin.setup-needed = 먼저 Joplin을 설정하세요. 동기화 대상, 계정, 비밀번호가 필요해요.
joplin.no-time = 아직 시간을 알 수 없어요. 메모는 기다렸다가 나중에 보내요.
joplin.unreachable = Joplin에 연결할 수 없어요. 메모는 기다렸다가 나중에 보내요.
joplin.failed = Joplin이 오류({status})로 응답했어요. 메모는 기다렸다가 나중에 보내요.
joplin.bad-login = Joplin이 이메일, 사용자 이름, 비밀번호를 받아들이지 않았어요. Joplin 설정에서 확인하세요.
joplin.no-server = 이 주소에 Joplin Server가 없어요. Joplin 설정에서 확인하세요.
joplin.bad-address = PaperPaw에서 쓸 수 없는 주소예요. Joplin 설정에서 확인하세요.
joplin.no-data = 이 주소에 Joplin 노트가 없어요. 주소를 확인하거나 먼저 Joplin을 동기화하세요.
joplin.encrypted = Joplin의 종단 간 암호화가 켜져 있어요. PaperPaw는 노트를 암호화할 수 없어서 아무것도 보내지 않아요.
joplin.newer-target = Joplin이 이 PaperPaw가 아는 것보다 새로운 형식으로 노트를 보관하고 있어요. 보내려면 PaperPaw를 업데이트하세요.
joplin.older-target = Joplin이 이전 형식으로 노트를 보관하고 있어요. Joplin을 열어 업그레이드한 다음 다시 보내세요.
joplin.upgrading = Joplin이 지금 노트를 업그레이드하고 있어요. 메모는 기다렸다가 나중에 보내요.
joplin.no-memory = 메모를 보내기에 메모리가 부족해요. 다시 시작한 다음 시도하세요.
