core.firmware.unsigned = 서명되지 않았어요.
core.firmware.older = 이전 버전이거나 같은 버전이에요.
core.firmware.foreign.1 = PaperPaw가 아닌 다른 펌웨어예요. PaperPaw는 저절로 다시 시작되지 않아요.
core.firmware.foreign.2 = PaperPaw에서는 이 변경을 되돌릴 수 없어요. 돌아가려면 다른 펌웨어나 플래시 도구를 써야 해요 (웹 플래셔도 가능해요).
core.firmware.foreign.3 = PaperPaw는 플래시에 남아 있고 카드의 파일은 바뀌지 않아요.
core.firmware.foreign.4 = 서명되지 않았고, 부트로더가 시작할 수 있는지만 확인해요.
core.firmware.yes = 설치
core.firmware.yes.restart = 다시 시작
core.firmware.no = 취소
