update.plugin.name = 업데이트
update.plugin.description = SD 카드나 인터넷에서 받은 펌웨어 업데이트를 설치해요.
update.plugin.how = "업데이트는 PaperPaw가 펌웨어인 기기(예: X4)에 새 펌웨어를 설치해요. 설정에서 업데이트로 찾을 수 있어요.\n\n온라인 검색은 업데이트 서버에 새 PaperPaw가 있는지 물어보고 내려받아요. Wi-Fi로 몇 분 걸려요. 또는 업데이트 파일(paperpaw.org에서 받은 .bin 파일)을 SD 카드의 updates 폴더에 복사하세요. 예를 들어 Wi-Fi 전송으로 복사할 수 있어요. 설치는 약 1분 걸리고 기기가 다시 시작돼요. 책, 설정, 읽던 위치는 그대로 남아요.\n\n설정의 업데이트 확인(처음에는 꺼짐)을 켜면 기기가 일주일에 한 번쯤 스스로 확인해요. Wi-Fi가 어차피 켜져 있거나 충전 중일 때만 확인해요. 찾은 새 PaperPaw는 여기에서 기다리고, 읽는 동안에는 아무것도 방해하지 않아요. 검색할 때는 기기에서 실행 중인 버전만 보내고, 기기의 이름이나 번호는 보내지 않아요. 기기 수를 세기 위해 직접 확인했는지, 그날이나 그 주, 그 달의 첫 검색인지도 함께 보내요.\n\n사용 중인 플러그인에 새 버전용이 아직 없으면 업데이트는 그 플러그인을 기다려요. 이전 버전은 직접 선택할 때만 설치해요.\n\nCrossPoint 같은 다른 펌웨어도 여기에서 설치할 수 있어요. 그 파일(.bin)을 updates 폴더에 넣고 업데이트를 여세요. PaperPaw는 이 기기용 전체 펌웨어이고 손상되지 않았는지는 확인하지만, 서명이 없어서 누가 만들었는지는 알 수 없어요. 그래도 설치를 누르면 플래시의 다른 영역에 쓰고 기기가 그 펌웨어로 시작해요. 그 펌웨어가 덮어쓰기 전까지 PaperPaw는 자기 영역에 남아 있어요. 나중에 PaperPaw로 돌아가려면 다른 펌웨어의 메뉴(예: CrossPoint의 SD 펌웨어 업데이트)에서 PaperPaw 설치 파일(paperpaw-<기기>-<버전>-install.bin)을 설치하세요."
