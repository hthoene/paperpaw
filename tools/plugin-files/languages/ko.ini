core.host-firmware.question = 기기 소프트웨어 {name} ({version})을(를) 설치할까요?
core.host-firmware.foreign = PaperPaw가 다른 기기 소프트웨어로 바뀌어요. PaperPaw는 저절로 다시 시작되지 않아요.
core.host-firmware.no-undo = PaperPaw에서는 이 변경을 되돌릴 수 없어요. 돌아가려면 다른 소프트웨어의 복구 기능을 쓰거나 웹 플래셔로 PaperPaw를 다시 설치하세요.
core.host-firmware.kept = PaperPaw는 기기 메모리에 남아 있어요. SD 카드의 파일은 바뀌지 않아요.
core.host-firmware.unsigned = 이 소프트웨어는 서명되지 않았어요. 파일 구조와 기기 호환성만 확인하며, 출처는 확인하지 않아요.
core.host-firmware.unknown-key = 이 소프트웨어는 알 수 없는 키로 서명되었어요. 여기에 표시된 키를 믿을 수 있을 때만 설치하세요.
core.host-firmware.downgrade = 이 이전 버전은 직전 버전을 자동으로 복원할 수 없어요. 돌아가려면 웹 플래셔로 PaperPaw를 다시 설치하세요.
core.host-firmware.early-crash = 새 소프트웨어가 시작 안전 검사 전에 멈추면 기기가 시작되지 않을 수 있어요. PaperPaw를 복원하려면 웹 플래셔가 필요해요.
core.host-remove.question = {name}을(를) 삭제할까요? 저장된 데이터는 어떻게 할까요?
core.host-remove.keep = 삭제하고 데이터 유지
core.host-remove.delete = 삭제하고 데이터도 삭제
core.host-remove.warning = 데이터를 삭제하면 저장된 설정과 파일도 함께 삭제돼요. 되돌릴 수 없어요.
core.host-wifi.join = {plugin}이(가) Wi-Fi “{network}”에 연결하려고 해요. 허용할까요?
core.host-wifi.hotspot = {plugin}이(가) Wi-Fi 핫스팟 “{network}”을(를) 시작하려고 해요. 허용할까요?
core.host-ui.phone-locked = 기기가 잠겨 있는 동안에는 휴대폰으로 입력할 수 없어요.
core.host-ui.typing-stopped = 글이 너무 길어서 실시간 업데이트가 멈췄어요. 계속 입력해도 돼요. 확인을 누르면 전체 글이 전송돼요.
core.host-ui.text-full = 글이 너무 길어요. 줄여서 다시 시도하세요. 잘려 나간 내용은 없어요.
core.host-ui.clipboard-full = 클립보드에 넣기에는 글이 너무 길어요. 더 짧게 선택해서 복사하세요. 이전 클립보드 내용은 그대로예요.
core.host-ui.clipboard-card = 클립보드를 읽거나 쓸 수 없어요. SD 카드가 들어 있고 읽을 수 있는지 확인하세요.
core.host-ui.card-full = SD 카드가 가득 찼어요. 공간을 확보한 뒤 다시 시도하세요.
core.host-ui.card-error = SD 카드에서 글을 읽거나 저장하지 못했어요. 카드를 확인하고 다시 시도하세요.
core.host-permission.library = 모든 플러그인의 서재 전체, 읽던 위치, 하이라이트와 메모를 읽고 변경할 수 있어요.
core.host-library.import-failed = 책을 서재에 추가하지 못했어요. SD 카드를 확인하고 다시 시도하세요.
core.host-library.name-taken = 같은 이름의 책이 이미 있어요. 다른 이름을 선택하세요.
core.host-library.replace-denied = 이 플러그인은 그 책을 바꿀 수 없어요. 직접 추가한 책 중 이후 옮기지 않은 책만 바꿀 수 있어요.
core.host-safe-mode.power-escape = 전원 버튼을 눌러 기기를 다시 시작하는 동안 플러그인 {plugin}이(가) 응답하지 않아서 꺼졌어요.
