vocabulary.sd.save.linked = {file}에 id, 앞면, 뒷면, 예문을 써요. 다른 열은 저장되지 않아요.
vocabulary.sd.save.new = 폴더 {folder}에 새 파일 {file}을(를) 써요.
vocabulary.sd.mirror = {deck}: 파일에 없는 카드
vocabulary.sd.mirror.on = 삭제
vocabulary.sd.mirror.off = 유지
vocabulary.sd.mirror.help = 삭제: {file}에서 지운 카드는 다음 업데이트 때 학습 기록과 함께 완전히 삭제돼요. 유지: 카드가 그대로 남아요.
vocabulary.sd.saving = {file} 저장 중
vocabulary.sd.saved.one = 카드 {count}장을 {file}에 저장했어요.
vocabulary.sd.saved.other = 카드 {count}장을 {file}에 저장했어요.
vocabulary.sd.saved.unlinked = {file}에 저장했지만 덱과의 연결을 쓰지 못했어요. 다음 업데이트 때 파일을 다시 읽어요.
vocabulary.sd.save.backup = 원래 있던 파일은 {file}(으)로 보관했어요.
vocabulary.sd.save.no-deck = 이 덱이 더 이상 없어요.
vocabulary.sd.save.unreadable = 연결된 파일 목록을 읽을 수 없어서 아무것도 쓰지 않았어요. SD 카드를 확인하고 다시 시도하세요.
vocabulary.sd.save.full = SD 카드가 가득 차서 아무것도 쓰지 않았어요. 공간을 비우고 다시 시도하세요.
vocabulary.sd.save.too-large = 이 덱은 파일 하나에 담기에는 너무 커요(업데이트가 읽을 수 있는 최대 4 MiB). SD 카드의 파일은 바뀌지 않았어요.
vocabulary.sd.save.failed = 파일을 쓰지 못했어요. SD 카드의 파일은 바뀌지 않았어요. SD 카드를 확인하고 다시 시도하세요.
vocabulary.sd.save.not-updated = 저장하지 않았어요. SD 카드의 파일을 먼저 읽지 못했는데, 덱에 아직 없는 변경 내용이 있을 수 있어요. 파일을 고친 다음 다시 시도하세요.
vocabulary.sd.save.left-out = 저장하지 않았어요. 파일의 일부 줄을 읽지 못했고, 저장하면 그 줄이 사라져요. 파일을 고치고 업데이트한 다음 다시 시도하세요.
vocabulary.sd.save.anki = {file}은(는) Anki 파일이에요. 읽기만 하고 쓰지는 않아요.
vocabulary.sd.save.anki-refused = 저장하지 않았어요. {file}은(는) PaperPaw가 읽기만 하는 Anki 덱이에요. 업데이트하려면 Anki에서 덱을 다시 내보내세요.
vocabulary.sd.removal-held = 삭제한 카드가 없어요. 일부 줄을 읽지 못했어요.
vocabulary.sd.skipped.one = {count}줄 건너뜀
vocabulary.sd.skipped.other = {count}줄 건너뜀
vocabulary.sd.skipped-notes.one = 메모 {count}개 건너뜀: 너무 길어요(예: 그림이 들어 있음)
vocabulary.sd.skipped-notes.other = 메모 {count}개 건너뜀: 너무 길어요(예: 그림이 들어 있음)
vocabulary.sd.no-room = {count}줄을 넣지 못했어요. 덱 하나에는 카드를 20,000장까지 넣을 수 있어요.
vocabulary.sd.outcome.same = 마지막 업데이트 이후 바뀌지 않았어요.
vocabulary.sd.outcome.unreadable = 이 파일을 읽을 수 없어요. SD 카드를 확인하고 다시 시도하세요.
vocabulary.sd.outcome.too-many = 덱이 이미 50개라서 이 파일을 읽지 않았어요. 먼저 덱을 하나 삭제하세요.
vocabulary.sd.outcome.crowded = 앞면이 같은 카드가 너무 많아서 이 파일을 읽지 않았어요. 앞면을 서로 다르게 바꾸세요.
vocabulary.sd.outcome.no-cards = 카드가 없어요. 카드는 앞면 글이 있는 한 줄이고, 앞면은 첫 번째 열이에요.
vocabulary.sd.outcome.too-large = 파일이 너무 커요. 최대 4 MiB, 20,000줄이에요. 여러 파일로 나누세요.
vocabulary.sd.outcome.utf16 = 이 파일은 UTF-16으로 저장되어 있어요. CSV UTF-8로 다시 저장하세요(스프레드시트에서는 CSV UTF-8).
vocabulary.sd.outcome.no-notes = 메모가 없어요. Anki 덱이 아니거나 메모가 없는 덱이에요. Anki에서 Anki 덱 패키지(.apkg)로 내보내세요.
vocabulary.sd.outcome.newer-anki = 이 덱은 최신 Anki 형식이에요. Support older Anki versions를 선택하고 다시 내보내세요.
vocabulary.sd.outcome.deck-too-large = 이 Anki 덱은 여기서 읽기에는 너무 커요. 최대 파일 4,000개, 메모 4 MiB, 메모 20,000개예요. 미디어와 학습 기록 없이 내보내거나 나누세요.
vocabulary.sd.line = {line}번째 줄
