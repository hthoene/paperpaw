core.plugin.yes = 설치
core.plugin.remove-data = 플러그인과 함께 삭제하지 않으면 데이터 폴더는 남아요.
core.plugin.yes.remove = 삭제하고 데이터 유지
core.plugin.yes.remove-data = 데이터와 함께 삭제
core.plugin.old-secrets = 이전에 이 플러그인이 저장한 비밀번호가 카드에 남아 있어요. 먼저 지워야 설치할 수 있어요.
core.plugin.yes.erase = 이전 데이터 지우고 설치
core.screen.open-failed = 이 화면을 열 수 없어요.
