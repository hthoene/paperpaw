vocabulary.sd.readme = "Dosyalardan bilgi kartları\n\nBuraya her deste için bir dosya koy: İspanyolca.tsv, İspanyolca destesini oluşturur.\nDosyalar: UTF-8 kaydedilmiş .tsv, .csv veya .txt ya da .apkg: Support older Anki versions işaretlenerek dışa aktarılmış Anki destesi. Notların ilk üç alanı ön, arka ve örnek olur; zamanlama ve medya okunmaz, PaperPaw Anki dosyasına asla yazmaz.\n\nHer satırda bir kart: sekme, virgül veya noktalı virgülle ayrılmış ön, arka ve isteğe bağlı örnek. İlk satır sütun adlarını içerebilir: front, back, example. Örnek:\n\nKatze\tkedi\tDie Katze schläft.\n\nSonra okuyucuda Bilgi kartları’nı aç, SD karttaki kartlar’ı ve ardından Karttan desteleri güncelle’yi seç.\n\nBilmen gerekenler:\n- Desteler öğrenme ilerlemenle okuyucuda kalır. Dosya yeni veya değişmişse okunur ve kartları desteye eklenir ya da orada değiştirilir.\n- Dosyada kartın arkasını veya örneğini değiştir: kart değişir ve ilerlemen kalır.\n- Ön metni değiştir: yeni kart sayılır ve eski kart baştan başlar. Kartlar ön metinlerine göre eşleştirilir; boşluklar ve büyük harfler sayılmaz. Desteyi dosyaya kaydet (SD karttaki kartlar, Desteyi karta kaydet); her kartın id sütununda numarası olur. Ön metni orada değiştir, ilk iki satırı aynı bırak ve kart öğrendiklerini korusun.\n- Kaydetmek destenin kartlarını yazar. Dosyada kart olmayan satırlar (ön metni olmayanlar) saklanmaz; önceki dosya _name.bak.tsv olarak kopyalanır.\n- Dosyayı CSV UTF-8 kaydet (UTF-16 veya hesap tablosunun kendi biçimi değil). 4 MiB veya 20.000 satır üzerindeki dosya okunmaz: böl.\n- Dosyada satır silmek destedeki kartı silmez; o deste için Eksik kartları kaldır’ı açarsan silinir. Bu durumda öğrenme ilerlemesi de gider.\n- Adı _ ile başlayan dosyalar okunmaz.\n"
