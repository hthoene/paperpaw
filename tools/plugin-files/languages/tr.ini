update.plugin.name = Güncelleme
update.plugin.description = Karttan veya internetten indirilen aygıt yazılımı güncellemelerini kurar.
update.plugin.how = "Güncelleme, X4 gibi PaperPaw’ın cihaz yazılımı olduğu cihazlarda yeni aygıt yazılımı kurar. Ayarlar’da Güncelleme olarak bulunur.\n\nÇevrimiçi ara, güncelleme sunucusundan daha yeni PaperPaw ister ve indirir; Wi-Fi ile birkaç dakika sürer. Veya bir güncelleme dosyasını (.bin uzantılı, paperpaw.org’dan) karttaki updates klasörüne örneğin Wi-Fi aktarımıyla kopyala. Kurulum yaklaşık bir dakika sürer, sonra cihaz yeniden başlar; kitaplar, ayarlar ve okuma konumları kalır.\n\nGüncellemeleri ara açıkken (ayarlarda, başlangıçta kapalı) cihaz yaklaşık haftada bir kendi kontrol eder; yalnızca Wi-Fi zaten açıkken veya şarjdayken. Bulunan yeni PaperPaw burada bekler, okuman bölünmez. Arama cihazın çalıştırdığı sürümü gönderir, adını veya numarasını değil; cihaz sayımı için aramayı senin başlatıp başlatmadığın ve günün, haftanın veya ayın ilk araması olup olmadığı da gönderilir.\n\nKullandığın eklentilerin yeni sürüme uygun sürümü yoksa güncelleme onları bekler. Eski sürüm yalnızca sen seçersen kurulur.\n\nCrossPoint gibi başka aygıt yazılımları da buradan kurulabilir: .bin dosyasını updates klasörüne koy ve Güncelleme’yi aç. PaperPaw bu cihaz için tam ve sağlam bir aygıt yazılımı olduğunu kontrol eder; imzasız olduğundan kimin yaptığını belirleyemez. Yine de kur, yazılımı flash belleğin diğer yarısına yazar ve cihaz onu başlatır; PaperPaw kendi yarısında, diğer yazılım üzerine bir şey kurana kadar kalır. Daha sonra PaperPaw’a dönmek için kurulum dosyasını (paperpaw-<device>-<version>-install.bin) diğer yazılımın menüsünden, örneğin CrossPoint’in SD firmware update seçeneğinden yükle."
