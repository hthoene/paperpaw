files.plugin.name = Dosya tarayıcısı
files.plugin.description = Cihazdaki kitapları ve klasörleri listeler ve açar.
files.plugin.how = "Kitaplık, kitaplık klasörünüzdeki kitapları kapak, başlık, yazar ve okuma ilerlemesiyle listeler. Son okuduğunuz kitap üstte bir kart olarak durur: okumaya devam etmek için dokunmanız veya Seç’e basmanız yeterli. Kitaplık kitap ararken şimdiye dek kaç kitap bulduğunu gösterir.\n\nKitapların üstünden ne gösterileceğini seçin: tümü, okunanlar, okunmamışlar, bitenler veya raflar (yazar, seri, etiket, favoriler, başladığınız her serinin sonraki kitabı). Okumak için kitaba dokunun; açmak, bitmiş veya okunmamış olarak işaretlemek, bilgilerini görmek, arşivlemek veya silmek için basılı tutun (düğmelerle Seç’i basılı tutun). Kitaplık menüsü için başlığa dokunun: sıralama, görünüm, arama, kitaplık klasörü ve ayarlar.\n\nKitaplık klasörü Ayarlar, Kitaplık, Kitaplık klasörü bölümünden seçilir; orada kitapları kapak ızgarası olarak da gösterebilirsiniz. Diğer dosyalar için Araçlar menüsündeki Dosyalar’ı kullanın."
