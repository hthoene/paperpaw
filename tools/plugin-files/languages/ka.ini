calendar.plugin.name = კალენდარი
calendar.plugin.description = თქვენი კალენდრები მოწყობილობაზე: განრიგი, დღის, კვირისა და თვის ხედი CalDAV-იდან, iCal-იდან და ფაილებიდან, დაბადების დღეები კონტაქტებიდან, ვიჯეტები და ძილის ეკრანი.
calendar.plugin.how = "თქვენი კალენდრები მოწყობილობაზე: განრიგი, დღე, კვირა და თვე CalDAV კალენდრების, iCal მისამართების (.ics, webcal://) და ბარათზე არსებული ფაილების მოვლენებით, ასევე კონტაქტების (CardDAV) დაბადების დღეებით. მოწყობილობა კალენდრებს მხოლოდ კითხულობს.\n\nგახსენით „კალენდარი“ ხელსაწყოებიდან. პირველი სტრიქონი ან „მენიუ“ ხედს ცვლის, კალენდრებს ამატებს და სინქრონიზაციას უშვებს. გვერდის ღილაკები წინა ან შემდეგ დღეზე, კვირაზე ან თვეზე გადადის; თვის ხედში ისრიანი ღილაკები დღეს ირჩევს. „არჩევა“ დღეს ან მოვლენას ხსნის, „უკან“ უკან გადადის.\n\nკალენდარი დაამატეთ „კალენდრებში“ (მენიუში ან პარამეტრებში „კალენდარი“): CalDAV ანგარიში (საკმარისია სერვერის მისამართი), iCal მისამართი, ფაილი ბარათზე ან კონტაქტები (CardDAV). შეიყვანეთ მისამართი, ანგარიშისთვის მომხმარებლის სახელი და პაროლი (სასურველია აპის პაროლი) და სახელი. სულ ექვსამდე კალენდარი, თითოეული თავისი ნიშნით.\n\nმოვლენები, განმეორებადიც, მოწყობილობის საათით ჩანს. ინახება სამოცი დღით ადრიდან სამოცი დღის შემდეგამდე (მაქსიმუმ 240) და ჩანს ქსელის გარეშეც.\n\nკალენდრები იკითხება კალენდრის გახსნისას (მაქსიმუმ ყოველ ხუთ წუთში), „ახლავე სინქრონიზაციით“ და, თუ პარამეტრებში „კალენდარი“ ასე დააყენებთ, როცა ქსელი ისედაც ჩართულია ან დატენვა იწყება. უსადენო მოდული მხოლოდ „ახლავე სინქრონიზაციისთვის“ ირთვება.\n\nვიჯეტები მთავარი ეკრანისთვის (ხანგრძლივად დააჭირეთ მთავარ ეკრანს და დაამატეთ ვიჯეტი): „დღეს“, „შემდეგი მოვლენა“, „განრიგი“, „თვე“ და „დაბადების დღეები“. ძილის ეკრანზე დღევანდელი განრიგისთვის პარამეტრებში, „ძილის ეკრანის“ ქვეშ, აირჩიეთ „კალენდარი“."
