aids.plugin.name = კითხვის დამხმარეები
aids.plugin.description = მუქი სიტყვის დასაწყისები, შეცვლილი სიტყვები, სურათები: ტექსტი ისე, როგორც გსურთ.
aids.plugin.how = "კითხვის დამხმარეები ცვლის, როგორ გამოიყურება წიგნის ტექსტი კითხვისას. ისინი ყველა წიგნზე მოქმედებს. „მუქი სიტყვის დასაწყისები“ და „სიტყვების შეცვლა“ თავდაპირველად გამორთულია.\n\nისინი პარამეტრებშია, „კითხვის“ ქვეშ, განყოფილებაში „კითხვის დამხმარეები“. „მუქი სიტყვის დასაწყისები“ ყოველი სიტყვის პირველ ნახევარს მუქად წერს, რაც ზოგიერთს კითხვას უადვილებს. „სიტყვების შეცვლა“ იღებს წყვილებს, ჩაწერილს ასე: „colour = color; Mr. = Mister“, წერტილ-მძიმით გამოყოფილს.\n\nიცვლება მხოლოდ მთლიანი სიტყვები, ზუსტად ისე, როგორც დაწერეთ, ასე რომ, „color“ გრძელი სიტყვის ნაწილს არასოდეს შეცვლის. თავად წიგნის ფაილი არ იცვლება.\n\nწიგნებში სურათები შეიძლება ჩანდეს (თავდაპირველად ასეა), შეიცვალოს მოკლე სტრიქონით, მაგ. „[სურათი: გემი ზღვაში]“, რომელიც სურათის აღწერას იყენებს, ან გამოტოვდეს. მაშინ გვერდზე ტექსტისთვის მეტი ადგილია, ხოლო სურათი, რომელიც არ ჩანს, არ დეკოდირდება, ამიტომ გვერდები უფრო სწრაფად იფურცლება. კომიქსები და სხვა სურათებისგან შემდგარი წიგნები არ იცვლება."
