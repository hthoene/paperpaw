setup.plugin.name = გამართვა
setup.plugin.description = მოკლე გზამკვლევი მნიშვნელოვან პარამეტრებში პირველი გაშვებისას.
setup.plugin.how = "გამართვა მოკლე გზამკვლევია მნიშვნელოვან პარამეტრებში, რომელიც ერთხელ ჩანს, PaperPaw-ის პირველი გაშვებისას. ყოველი გვერდი ერთ რამეს გეკითხებათ, მაგ. ენას, ღილაკებს, ტექსტის ზომას, დროის სარტყელს, Wi-Fi-ს ან რამდენიმე დასამატებელ მოდულს, და გონივრული პასუხი უკვე არჩეულია, ასე რომ „შემდეგი“ ყოველთვის სწორია. ნაბიჯები, რომლებიც ამ მოწყობილობას არ სჭირდება, გამოტოვებულია.\n\nშეეხეთ ღილაკებს, ან გამოიყენეთ ზემოთ და ქვემოთ ღილაკები და „არჩევა“. პირველ გვერდზე „გამოტოვება“ გამართვას მაშინვე ტოვებს. ბოლო გვერდი გეუბნებათ, საიდან მოდის თქვენი წიგნები.\n\nხელახლა გასაშვებად გახსენით პარამეტრები და აირჩიეთ „PaperPaw-ის გამართვა“. აქ არჩეული ყველაფერი შეგიძლიათ მოგვიანებით პარამეტრებში შეცვალოთ."
