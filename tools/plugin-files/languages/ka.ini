calibre.plugin.name = უსადენო ბიბლიოთეკა
calibre.plugin.description = წიგნებს ქსელით იღებს. მუშაობს როგორც უსადენო მოწყობილობა Calibre-ისთვის.
calibre.plugin.how = "„უსადენო ბიბლიოთეკა“ მოწყობილობას თქვენს კომპიუტერზე Calibre-ში უსადენო მოწყობილობად აჩენს. Calibre-ს შეუძლია მასზე წიგნების გაგზავნა, მათი სიის ნახვა და წაშლა. წიგნები ბიბლიოთეკაში ხვდება.\n\nგახსენით „უსადენო ბიბლიოთეკა“ ხელსაწყოების მენიუდან, როცა მოწყობილობა და კომპიუტერი ერთსა და იმავე Wi-Fi ქსელშია. Calibre-ში აირჩიეთ Connect/share, შემდეგ Start wireless device connection. როცა მოწყობილობა თქვენს კომპიუტერს იპოვის, მის სახელს აჩვენებს; შეეხეთ „დაკავშირებას“ (ღილაკებით დააჭირეთ „არჩევა“). Calibre-ს შეუძლია აქ წიგნების დამატება და წაშლა, ამიტომ დაუკავშირდით მხოლოდ საკუთარ კომპიუტერს. ეკრანის დახურვა კავშირს წყვეტს.\n\nთუ Calibre თავისით ვერ მოიძებნა, შეიყვანეთ მისი კომპიუტერის მისამართი პარამეტრებში, „ბიბლიოთეკის“ ქვეშ, Calibre-ის ნაწილში, როგორც „მისამართი“. თუ Calibre 9090-ის გარდა სხვა პორტს იყენებს, მიუწერეთ ის როგორც :პორტი, მაგ. 192.168.1.20:9091."
