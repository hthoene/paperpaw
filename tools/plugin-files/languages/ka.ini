koreader.plugin.description = უზიარებს სანიშნეებსა და მონიშვნებს KOReader-ს იმ წიგნებისთვის, რომლებსაც ორივეში კითხულობთ.
koreader.plugin.how = "ეს მოდული სანიშნეებსა და მონიშვნებს KOReader-ს უზიარებს იმ წიგნებისთვის, რომლებსაც ორივეში კითხულობთ, ერთ მოწყობილობაზე ან მოწყობილობებს შორის სინქრონიზებულ ბიბლიოთეკის საქაღალდეში. არაფრის მორგება არ არის საჭირო.\n\nროცა PaperPaw ხსნის წიგნს, რომელიც KOReader-საც გაუხსნია, და როცა მის სანიშნეებს ან მონიშვნებს ცვლით, ის წიგნის გვერდით მდებარე KOReader-ის მონაცემებიდან ახალს იღებს, აქ გაჩენილ ახალს კი KOReader-ს უტოვებს, რომ წიგნის მომდევნო გახსნისას აიღოს. წაშლილი მონიშვნები და შეცვლილი შენიშვნებიც გადადის.\n\nეს მხოლოდ EPUB წიგნებზე მუშაობს. თუ ერთ-ერთი მხარის ფაილი არ იკითხება, არცერთ მხარეს არაფერი იცვლება, სანამ ის კვლავ არ წაიკითხება."
