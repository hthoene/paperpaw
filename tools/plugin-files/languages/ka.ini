pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = ფოკუსის ტაიმერი სამუშაო და შესვენების რაუნდებით, ვიჯეტებითა და დღიური მთვლელით.
pomodoro.plugin.how = "Pomodoro ტაიმერი: იმუშავეთ კონცენტრირებული რაუნდებით, შემდეგ დაისვენეთ. მას გამართვა არ სჭირდება: 25 წუთი ფოკუსი, 5 წუთი დასვენება და ოთხი რაუნდის შემდეგ 15-წუთიანი გრძელი შესვენება.\n\nგახსენით Pomodoro ხელსაწყოების მენიუდან და დააჭირეთ „დაწყებას“, ან დაამატეთ მისი ვიჯეტები მთავარ ეკრანზე (ხანგრძლივად დააჭირეთ მთავარ ეკრანს, შემდეგ დაამატეთ ვიჯეტი): „Pomodoro ტაიმერი“ აჩვენებს ფაზას და დარჩენილ წუთებს, „Pomodoro დაწყება/პაუზა“ ღილაკია, ხოლო „Pomodoro დღეს“ ითვლის დასრულებულ რაუნდებს თქვენი დღიური მიზნით. ტაიმერზე შეხება მას იწყებს ან აჩერებს; სრულ ეკრანზე გასახსნელად ხანგრძლივად დააჭირეთ.\n\nტაიმერი აგრძელებს მუშაობას, როცა ეკრანს ტოვებთ, და გადატვირთვის შემდეგ საათის მიხედვით გრძელდება. სანამ მოწყობილობას სძინავს, არაფერი მუშაობს: ამასობაში დასრულებულ ფაზაზე გაღვიძებისას გეცნობებათ. შეტყობინება გაცნობებთ, როცა ფაზა დასრულდება. ბატარეის დასაზოგად საათი წუთში ერთხელ ახლდება (სრულ ეკრანზე ბოლო წუთში ყოველ ათ წამში) და მოწყობილობას არასდროს აფხიზლებს.\n\nპარამეტრებში, Pomodoro-ს ქვეშ, აყენებთ ხანგრძლივობებს და ერთი ციკლის რაუნდებს, და იწყება თუ არა შემდეგი ფაზა თავისით. „მეტში“: ეკრანის გაელვება ან განათების ციმციმი ფაზის დასრულებისას და დღიური მიზანი."
