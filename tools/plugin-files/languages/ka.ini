transfer.plugin.description = ატვირთეთ წიგნები და სხვა ფაილები მოწყობილობაზე ბრაუზერიდან იმავე ქსელში.
transfer.plugin.how = "Wi-Fi გადაცემით წიგნებსა და სხვა ფაილებს მოწყობილობაზე იმავე ქსელში მყოფი ბრაუზერიდან ატვირთავთ, კაბელისა და აპის გარეშე. ასევე შეგიძლიათ ფაილების ჩამოტვირთვა, საქაღალდეების შექმნა და წაშლა.\n\nგახსენით ის მენიუდან „ხელსაწყოები“. ეკრანზე ჩანს მისამართი ტექსტად და QR კოდად: გახსენით ის ტელეფონის ან კომპიუტერის ბრაუზერში, ან დაასკანერეთ კოდი. მისამართი შეიცავს ყოველ ჯერზე ახლად შექმნილ გასაღებს, ამიტომ ქსელში სხვები თქვენს ფაილებს ვერ მისწვდებიან. გადაცემა მუშაობს, სანამ ეკრანი ღიაა.\n\nსადაც Wi-Fi-ს თავად PaperPaw მართავს, მაგალითად X4-ზე, ქვემოთ ღილაკი „როუტერის გარეშე“ ხსნის მოწყობილობის საკუთარ ქსელს, რომელსაც ტელეფონი კოდის დასკანერებით უერთდება."
