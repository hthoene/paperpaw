keyboard.plugin.name = კლავიატურა
keyboard.plugin.description = ტექსტის შეყვანა ეკრანზე, შეხებით ან ღილაკებით.
keyboard.plugin.how = "კლავიატურა იხსნება ყოველთვის, როცა ტექსტია საჭირო: ძიება, პაროლი, შენიშვნა ან პარამეტრი. ის მუშაობს შეხებით და მხოლოდ ღილაკებითაც.\n\nღილაკებით მარცხნივ და მარჯვნივ რიგის გასწვრივ მოძრაობს, გვერდის ღილაკები რიგებს შორის გადადის, „არჩევა“ კლავიშს აჭერს, „უკან“ კი აუქმებს; მარცხნივ და მარჯვნივ რიგს წრიულად გადის, ზემოთ და ქვემოთ კი თქვენს სვეტში რჩება. Shift შემდეგ ასოს მთავრულს ხდის; ორჯერ დააჭირეთ ყველა მთავრულისთვის და კიდევ ერთხელ შესაწყვეტად. ხანგრძლივად დააჭირეთ ასოს (ღილაკებით: გეჭიროთ „არჩევა“ მასზე) მისი მთავრულისთვის, რომელიც მაშინვე აირჩევა, და დიაკრიტიკული ნიშნებისთვის, როგორიცაა é და è; გერმანულში ä, ö, ü და ß ასე მიიღება a, o, u და s-დან (ღილაკებით კლავიატურა ამას ამ ასოებზე მიუთითებს). OK ასრულებს შეყვანას; ღილაკებით შესასრულებლად ნებისმიერი ადგილიდან ხანგრძლივად დააჭირეთ „უკან“-ს („უკან“ მოკლედ აუქმებს), ან ხანგრძლივად დააჭირეთ „არჩევას“ კლავიშზე, რომელიც ასო არ არის. „ჩასმა“ ბუფერის ტექსტს სვამს, „ტელეფონი“ კი, სადაც შეთავაზებულია, ტელეფონზე აკრეფის საშუალებას გაძლევთ.\n\nპარამეტრებში, „მოწყობილობის“ ქვეშ, „კლავიატურა“: „კლავიატურის განლაგებები“ განლაგებებს ირჩევს. ნაგულისხმევად ის მენიუს ენას მიჰყვება; რამდენიმეს არჩევისას მათ შორის კლავიში გადართავს. „უმლაუტის კლავიშები“ ä, ö, ü და ß-ს ცალკე კლავიშებს აძლევს. „ზომა“ კლავიშებსა და ასოებს ადიდებს; მხოლოდ ღილაკებით რიგები კომპიუტერის კლავიატურის რიგებად რჩება. სენსორულ ეკრანებზე „კლავიშის ფორმა“ კლავიშების იერსახეს ცვლის. „ავტომატური მთავრული“ ყოველ წინადადებას მთავრულით იწყებს."
