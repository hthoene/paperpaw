widgets.plugin.name = ვიჯეტების ნაკრები
widgets.plugin.description = ბევრი სხვა ვიჯეტი მთავარი ეკრანისთვის: საათები, კალენდარი, ციტატები, წიგნები, შენიშვნები და სხვა.
widgets.plugin.how = "ვიჯეტების ნაკრები მთავარ ეკრანს ბევრ ვიჯეტს ამატებს: საათები (ისრიანი, სიტყვიერი, ფილებიანი, მსოფლიო), კალენდარი, წლის მსვლელობა, უკუთვლა, მთვარის ფაზა, დღე და თარიღი; დღის ციტატა, შენიშვნები, საქმეები, სურათები, მისალმება და PaperPaw-ს ლოგო; წიგნებისთვის კი: ახლა იკითხება, პროგრესი, შემდეგი, სერიები, რჩეულები, მონიშვნა და ბიბლიოთეკა ციფრებში. ბატარეის ვიჯეტიც აქაა.\n\nდაამატეთ ისინი მენიუში „მთავარი ეკრანის რედაქტირებით“ (ან მთავარ ეკრანზე ხანგრძლივი დაჭერით), შემდეგ „ვიჯეტის დამატებით“. თითოეულს საკუთარი პარამეტრები აქვს, მაგალითად ჩარჩო, ზომა და სწორება. ცვალებადი ვიჯეტის, მაგალითად დღის ციტატის, არჩევა შემდეგს აჩვენებს. საკუთარი ციტატები ჩაწერეთ ფაილში quotes.txt, საქაღალდეში .paperpaw/plugins/widgets ბარათზე, თითო სტრიქონი ასე: ტექსტი | ავტორი. დროის ვიჯეტებს დაყენებული საათი სჭირდება; მას Wi-Fi აყენებს."
