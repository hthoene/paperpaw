rules.plugin.name = წესები
rules.plugin.description = როცა რამე ხდება, რაღაცას აკეთებს: მაგ. ღამის რეჟიმი 22:00-ზე.
rules.plugin.how = "წესი თავად აკეთებს რაღაცას, როცა რამე ხდება: ყოველდღე 22:00-ზე რთავს ღამის რეჟიმს, ან PaperPaw-ის გაშვებისას ასინქრონებს კატალოგებს.\n\nწესები არის პარამეტრებში, განყოფილებაში „მორგება“, როგორც „წესები“. „წესის დამატება“ გეკითხებათ „როდის?“ (PaperPaw-ის გაშვება, დღის დრო, წიგნის გახსნა ან დახურვა, ბატარეა, დატენვა, გადამრთველი და სხვა) და „შემდეგ რა?“ (მოქმედების შესრულება, გადამრთველის ჩართვა ან გამორთვა, რიცხვის დაყენება, შეტყობინების ჩვენება). წესზე შეხება მას აჩერებს; ხანგრძლივი დაჭერა (ღილაკებით: გეჭიროთ „არჩევა“) გთავაზობთ პირობას, მაგ. „დღის ორ დროს შორის“, ან წაშლას.\n\nასარჩევი მოქმედებები, გადამრთველები და რიცხვები მოდულების მიხედვითაა დალაგებული: აირჩიეთ მოდული, შემდეგ ის, რაც მას მოაქვს; „უკან“ კვლავ გამოდის. მოქმედება, რომელიც ნაჩვენებ ეკრანზე მუშაობს, მაგ. „უკან“ ან „შემდეგი გვერდი“, აკეთებს იმას, რასაც იქ დაჭერისას გააკეთებდა.\n\nდრო მოქმედებს, რომელი ეკრანიც არ უნდა იყოს გახსნილი. ორი წესი, რომლებიც ერთმანეთს აუქმებს, რამდენიმე ნაბიჯის შემდეგ ჩერდება."
