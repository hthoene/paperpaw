vocabulary.plugin.how = "„ლექსიკა“ ინახავს კითხვისას მოძებნილ სიტყვებს, თითოეულს თავისი წინადადებით. სიას „ხელსაწყოებში“ იპოვით, უახლესი პირველია; აირჩიეთ სიტყვა, რომ ხელახლა მოძებნოთ. „ექსპორტი“ მათ სასწავლო ბარათების აპებისთვის ინახავს. სიაში რჩება უახლესი 2 000 სიტყვა, ამიტომ დროულად გააკეთეთ ექსპორტი.\n\n„სასწავლო ბარათები“, ასევე „ხელსაწყოებში“, ინტერვალური გამეორებით გამოგკითხავთ: „პასუხის ჩვენების“ შემდეგ შეაფასეთ ბარათი („ხელახლა“, „რთული“, „კარგი“ ან „მარტივი“), რაც წყვეტს, როდის დაბრუნდება ის. დასტები შექმენით „ტელეფონით რედაქტირებით“: დაასკანერეთ კოდი ტელეფონით იმავე Wi-Fi-ში და აკრიფეთ ბარათები, ან დასტაში აირჩიეთ „ბევრი ბარათი ერთად“ და მოიტანეთ CSV, TSV ან TXT ფაილი ან Anki-ს დასტა (.apkg, ექსპორტირებული პარამეტრით „Support older Anki versions“).\n\nან ჩადეთ ასეთი ფაილი თითო დასტისთვის SD ბარათზე, საქაღალდეში Flashcards (თითო სტრიქონზე ერთი ბარათი: წინა მხარე, უკანა მხარე, მაგალითი; UTF-8). „სასწავლო ბარათებში“ აირჩიეთ „ბარათები SD ბარათზე“, ან ეს თავისით მოხდება მათი გახსნისას. ახალი ან შეცვლილი ფაილი დასტას ერწყმის და პროგრესი მოწყობილობაზე რჩება: შეცვლილი უკანა მხარე ან მაგალითი ბარათს ცვლის, შეცვლილი წინა მხარე კი ახალი ბარათია. წაშლილი სტრიქონი ბარათს არ შლის, თუ ამ დასტისთვის „ფაილიდან გამქრალი ბარათები“ არ დააყენეთ „წაშლაზე“. „ბარათზე შენახვა“ დასტას თავის ფაილში წერს სვეტით id, რომ წინა მხარეები კომპიუტერზე პროგრესის დაკარგვის გარეშე შეცვალოთ; ძველი ფაილი ინახება როგორც _name.bak.tsv.\n\nპარამეტრებში, „კითხვის“ ქვეშ, „მოძებნილი სიტყვებიდან ბარათები“ თითოეულ მოძებნილ სიტყვას დასტაში „მოძებნილი“ ამატებს."
