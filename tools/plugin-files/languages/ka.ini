koreader.removed-there.text = შესაძლოა, ისინი KOReader-ში წაიშალა, ან მისი ფაილი სხვა მოწყობილობიდან მოვიდა. „დატოვება“ მათ აქ ტოვებს და KOReader-ს ხელახლა გადასცემს.
