anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = თქვენი კომპიუტერის Anki-დან სასწავლი ბარათების სწავლა და პასუხების უკან გაგზავნა AnkiConnect დამატებით.
anki.plugin.how = "Anki-ით წამკითხველზე სწავლობთ ბარათებს, რომელთა დროც დადგა კომპიუტერის Anki-ში, და პასუხებს უკან აგზავნით. ის იყენებს უფასო დამატებას AnkiConnect (კოდი 2055492159) და არასოდეს AnkiWeb-ს. თავდაპირველად გამორთულია: დაამატეთ მოდულების მაღაზიიდან.\n\nკომპიუტერზე: დააყენეთ AnkiConnect Anki-ში (Tools, Add-ons, Get Add-ons) და გადატვირთეთ Anki. სინქრონიზაციისას Anki უნდა იყოს გახსნილი.\n\nნაგულისხმევად AnkiConnect მხოლოდ საკუთარ კომპიუტერს პასუხობს (127.0.0.1), ამიტომ წამკითხველი მას ვერ მისწვდება. გახსენით Tools, Add-ons, AnkiConnect, Config და „webBindAddress“ დააყენეთ „0.0.0.0“-ზე. პორტი, „webBindPort“, არის 8765, თუ არ შეცვლით. თუ იქ „apiKey“ დააყენეთ, აქაც იგივე გასაღები შეიყვანეთ. შემდეგ გადატვირთეთ Anki და, თუ ფაიერვოლი გკითხავთ, დაუშვით Anki. გამოიყენეთ ეს მხოლოდ სანდო ქსელში: მასში ნებისმიერს შეუძლია AnkiConnect-ს მისწვდეს, ამიტომ გასაღები კარგი იდეაა.\n\nწამკითხველზე: გახსენით Anki ხელსაწყოებიდან, შემდეგ „კომპიუტერში“ შეიყვანეთ კომპიუტერის მისამართი, პორტი, თუ ის 8765 არ არის, და API გასაღები, თუ დააყენეთ. აირჩიეთ დასტა, ან დატოვეთ ცარიელი ყველა დასტისთვის. შემდეგ ჩართული Wi-Fi-ით აირჩიეთ „Anki-სთან სინქრონიზაცია“: ჯერ მოლოდინში მყოფი პასუხები იგზავნება, შემდეგ მოდის ბარათები, რომელთა დროც დადგა (და მითითებული რაოდენობის ახალი ბარათები), მაქსიმუმ 50. ქსელის გარეშე სასწავლად აირჩიეთ „სწავლა“: აჩვენეთ პასუხი და შეაფასეთ: „თავიდან“, „რთული“, „კარგი“ ან „მარტივი“. პასუხები წამკითხველზე ინახება და Anki-ში შემდეგი სინქრონიზაციით გადადის. Anki წყვეტს, როდის დაბრუნდება ბარათი.\n\nპარამეტრებში „სინქრონიზაცია Anki-ს გახსნისას“ სინქრონიზაციას აკეთებს ყოველ ჯერზე, როცა ეკრანს ხსნით. ღილაკზე დაჭერა ქსელს არასოდეს იყენებს."
