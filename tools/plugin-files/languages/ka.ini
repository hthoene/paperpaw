dictionary.plugin.description = სიტყვებს StarDict ლექსიკონებში ეძებს.
dictionary.plugin.how = "ლექსიკონი წიგნის სიტყვას StarDict ლექსიკონებში ეძებს და განმარტებებს ეკრანის ქვედა ნაწილზე გადაფარებულ პანელში აჩვენებს.\n\nკითხვისას ხანგრძლივად დააჭირეთ სიტყვას და აირჩიეთ „ძიება ლექსიკონში“; ღილაკებით გამოიყენეთ „ტექსტის მონიშვნა“, „მეტის“ ქვეშ. დააკოპირეთ ლექსიკონის საქაღალდეები (.ifo, .idx და .dict ფაილებით) მოწყობილობის საქაღალდეში „dictionaries“, ქვესაქაღალდეებიც შეიძლება, ან აირჩიეთ სხვა საქაღალდე პარამეტრებში, „კითხვის“ ქვეშ, როგორც „ლექსიკონის საქაღალდე“ (გაფართოებული პარამეტრი). პირველი ძიება თითოეული ლექსიკონისთვის პატარა ინდექსს ამზადებს, რასაც ცოტა დრო სჭირდება.\n\nპანელში გვერდის ღილაკები ან „ზემოთ“ და „ქვემოთ“ გრძელ განმარტებებს გადაახვევს, „უკან“ კი პანელს ხურავს. შეხებით დასახურად შეეხეთ პანელის გარეთ."
