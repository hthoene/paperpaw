battery.plugin.name = ბატარეის ხარჯი
battery.plugin.description = აღრიცხავს ბატარეას და აჩვენებს, რამდენ ხანს ძლებს.
battery.plugin.how = "„ბატარეის ხარჯი“ დაახლოებით წუთში ერთხელ იწერს დამუხტვის დონეს, სანამ მოწყობილობა ფხიზლადაა, იმასთან ერთად, რას აკეთებდა: ეკრანის განახლებები და გადაფურცლული გვერდები. ამის მიხედვით ითვლის, რამდენს ხარჯავს ფხიზლად ყოფნის ერთი საათი და 100 გვერდი, და რამდენ ხანს გაძლებს ბატარეა ამ ტემპით.\n\nგახსენით „ბატარეა“ მენიუდან „ხელსაწყოები“. ის აჩვენებს ახლანდელ დამუხტვას, ამჯერად ფხიზლად ყოფნას, აქამდე ბატარეაზე მუშაობის ხარჯს და ბოლო ფხიზლად ყოფნის დროებს. გვერდებს გვერდის ღილაკებით ან ზემოთ ისრებზე შეხებით ფურცლავთ.\n\nციფრებს აზრი რომ ჰქონდეს, საჭიროა ბატარეაზე გარკვეული დროით კითხვა. აღრიცხვა თავიდანვე ჩართულია და მისი გამორთვა შეიძლება პარამეტრებში, „მოწყობილობა“, „ენერგია“, როგორც „ბატარეის ხარჯის აღრიცხვა“."
