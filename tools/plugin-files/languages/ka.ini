update.plugin.name = განახლება
update.plugin.description = აყენებს მიკროპროგრამის განახლებებს ბარათიდან ან ინტერნეტიდან ჩამოტვირთულს.
update.plugin.how = "„განახლება“ აყენებს ახალ მიკროპროგრამას მოწყობილობებზე, სადაც PaperPaw თავად მიკროპროგრამაა (მაგ. X4). ის პარამეტრებშია, სახელით „განახლება“.\n\n„ონლაინ ძიება“ სერვერს PaperPaw-ის ახალ ვერსიას ეკითხება და ჩამოტვირთავს (Wi-Fi-ით რამდენიმე წუთი). ან დააკოპირეთ განახლების ფაილი (.bin, paperpaw.org-დან) ბარათის საქაღალდეში updates (მაგ. Wi-Fi გადაცემით). „დაყენებას“ დაახლოებით ერთი წუთი სჭირდება და მოწყობილობა გადაიტვირთება; წიგნები, პარამეტრები და კითხვის ადგილები რჩება.\n\nროცა „განახლებების ძიება“ ჩართულია (პარამეტრებში, თავდაპირველად გამორთულია), ის თავად კითხულობს დაახლოებით კვირაში ერთხელ, მხოლოდ როცა Wi-Fi ისედაც ჩართულია ან იტენება. ნაპოვნი ვერსია აქ დაგელოდებათ; კითხვას არ შეგიშლით. ძიებისას იგზავნება, რა მუშაობს მოწყობილობაზე, მისი სახელისა და ნომრის გარეშე; მოწყობილობების დასათვლელად — ისიც, თქვენ მოითხოვეთ თუ არა და დღის, კვირის თუ თვის პირველი ძიებაა თუ არა.\n\nთუ თქვენს მოდულებს ახალი გამოშვებისთვის ჯერ ვერსია არ აქვს, განახლება მათ ელოდება. ძველი ვერსია მხოლოდ თქვენი არჩევით დაყენდება.\n\nსხვა მიკროპროგრამაც, მაგალითად CrossPoint, აქედან დგება: ჩადეთ მისი .bin ფაილი საქაღალდეში updates და გახსენით „განახლება“. PaperPaw ამოწმებს, რომ ეს ამ მოწყობილობის სრული, დაუზიანებელი მიკროპროგრამაა, მაგრამ ვერ გეტყვით, ვინ შექმნა: ის ხელმოწერილი არ არის. „მაინც დაყენება“ მას ფლეშ-მეხსიერების მეორე ნახევარში წერს და ჩართავს; PaperPaw თავის ნახევარში რჩება, სანამ ის მიკროპროგრამა მის თავზე რამეს არ დააყენებს. PaperPaw-ზე დასაბრუნებლად დააყენეთ მისი ფაილი (paperpaw-<device>-<version>-install.bin) სხვა მიკროპროგრამის მენიუდან, მაგ. CrossPoint-ის SD firmware update-ით."
