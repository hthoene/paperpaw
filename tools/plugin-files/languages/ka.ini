tasks.plugin.name = დავალებები
tasks.plugin.description = დავალებების სიები ვადებითა და პრიორიტეტებით, მოწყობილობაზე ან თქვენს CalDAV სერვერთან სინქრონიზებული, მთავარი ეკრანის ვიჯეტებით.
tasks.plugin.how = "დავალებების სიები: დავალებები ვადითა და პრიორიტეტით, რომლებსაც შესრულებისას მონიშნავთ. მუშაობს ქსელის გარეშე და შეიძლება სინქრონიზდეს CalDAV სერვერთან (Nextcloud, Radicale, Baïkal, Fastmail და სხვა), რომ სიები ტელეფონსა და კომპიუტერზეც გქონდეთ.\n\nგახსენით „დავალებები“ ხელსაწყოებიდან. პირველ სტრიქონში სიის სახელია; აირჩიეთ ის სხვა სიის, „დღევანდელი და ვადაგადაცილებულის“, ახალი სიის, სინქრონიზაციის ან ანგარიშისთვის. „დავალების დამატება“ კლავიატურას ხსნის. „არჩევა“ დავალებას შესრულებულად მონიშნავს (ხელახლა: შეუსრულებლად). ხანგრძლივი დაჭერით ან „მენიუ“-თი შეცვალეთ სათაური, ვადა ან პრიორიტეტი, ან წაშალეთ დავალება. შეუსრულებელი პირველია, დღისა და პრიორიტეტის მიხედვით; შესრულებული ერთი კვირა რჩება ბოლოში (პარამეტრები, „დავალებები“).\n\nმთავარი ეკრანის ვიჯეტები: „დღევანდელი დავალებები“, „დავალებების სია“, „შეუსრულებელი დავალებები“ და „შემდეგი დავალება“. დავალებაზე შეხება მას მონიშნავს, სათაურზე — სიებს ხსნის.\n\nსინქრონიზაციისთვის სიის სტრიქონში აირჩიეთ „CalDAV ანგარიში“ და შეიყვანეთ სერვერის მისამართი (მაგ. cloud.example.com/remote.php/dav), მომხმარებლის სახელი და პაროლი (სასურველია აპის პაროლი); სიები თავად მოიძებნება. სინქრონიზაცია ხდება „დავალებების“ გახსნისას, „ახლავე სინქრონიზაციით“ და როცა ქსელი ისედაც ჩართულია; ქსელის გარეშე ცვლილებები მოგვიანებით გაიგზავნება. თუ დავალება ორივეგან შეიცვალა, რჩება სერვერის ვერსია, თქვენი კი ახალ დავალებად ინახება. შენიშვნები და შეხსენებები სერვერზე უცვლელი რჩება. განმეორებადი დავალებები იცვლება იქ, სადაც შექმენით. თავსდება 200-მდე დავალება 12 სიაში."
