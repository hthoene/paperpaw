smart-home.plugin.description = თქვენი Home Assistant-ის მნიშვნელობები და გადამრთველები დაფაზე და მთავარი ეკრანის ვიჯეტებად. მუშაობს Home Assistant-თან თქვენს სახლის ქსელში.
smart-home.plugin.how = "„ჭკვიანი სახლი“ აჩვენებს და მართავს თქვენს Home Assistant-ს: ტემპერატურა, ტენიანობა, ენერგია, კარები და ფანჯრები, განათება, გადამრთველები და სცენები. კავშირი REST API-ით სახლის ქსელშია; არაფერი გადის სხვა სერვისზე.\n\nგახსენით „ჭკვიანი სახლი“ ხელსაწყოების მენიუდან, შემდეგ „კავშირი“: შეიყვანეთ Home Assistant-ის მისამართი (მაგ. http://homeassistant.local:8123) და ხანგრძლივი წვდომის ტოკენი (Home Assistant-ში, პროფილის გვერდის ბოლოს). ტოკენი ინახება პაროლებსა და გასაღებებს შორის, არა პარამეტრების ფაილში. უბრალო http მხოლოდ სახლის ქსელის მისამართებისთვისაა; გარე სერვერისთვის ჩართეთ „სერვერები სახლის ქსელის გარეთ“ და გამოიყენეთ https მოქმედი სერტიფიკატით.\n\n„ობიექტების არჩევა“ სერვერის ობიექტებს ჩამოთვლის: მოძებნეთ სახელით ან id-ით და აირჩიეთ საჩვენებლად (ხელახლა არჩევა მოაშორებს). შეგიძლიათ მიუთითოთ ოთახი დაფაზე და ოთახის ვიჯეტებში დასაჯგუფებლად. ინახება 24 ობიექტამდე. დაფაზე აირჩიეთ განათება, გადამრთველი ან სცენა გადასართავად: სტრიქონში სერვერის პასუხი ჩანს; არჩეული სენსორი ხელახლა იკითხება.\n\nვიჯეტები (ხანგრძლივად დააჭირეთ მთავარ ეკრანს): „ჭკვიანი სახლის მნიშვნელობა“ ერთ მაჩვენებელს დიდად აჩვენებს, „ჯგუფი“ ოთახის ობიექტებს ჩამოთვლის, „გადამრთველი“ ერთი განათების ან გადამრთველის ღილაკია, „ოთახი“ — ბარათი ოთახის მაჩვენებლებითა და გადამრთველებით. ობიექტს ან ოთახს ვიჯეტის პარამეტრებში ირჩევთ.\n\nმონაცემები იკითხება დაფის გახსნისას, მოთხოვნით („განახლება ახლავე“ ან ვიჯეტზე შეხება), გაღვიძებისას, თუ Wi-Fi უკვე ჩართულია, და განრიგით, სანამ დამტენი შეერთებულია. რადიოს თავისით არასდროს რთავს და ჩართულს არ ტოვებს."
