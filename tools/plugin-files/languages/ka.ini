notes-vault.plugin.name = შენიშვნების საცავი
notes-vault.plugin.description = კითხულობს Markdown შენიშვნების საქაღალდეს საქაღალდეების, თეგებისა და ბოლო ცვლილებების მიხედვით, მთავარი ეკრანის ვიჯეტებით. მუშაობს Obsidian-ის საცავებთან.
notes-vault.plugin.how = "„შენიშვნების საცავი“ კითხულობს Markdown შენიშვნების საქაღალდეს (უბრალო .md ფაილები, როგორც მათ შენიშვნების აპები ინახავენ). მუშაობს Obsidian-ის საცავებთან.\n\nაირჩიეთ საცავის საქაღალდე პარამეტრებში ან საცავის გვერდზე ხელსაწყოებში. შემდეგ გვერდი გთავაზობთ საქაღალდეებს ისე, როგორც ბარათზეა, ბოლოს შეცვლილ შენიშვნებს, თეგებს და ძიებას შენიშვნების სათაურებში.\n\nპირველად საცავი ფონურ რეჟიმში ინდექსირდება, სანამ მისი გვერდი ღიაა; ათასობით შენიშვნიან საცავს რამდენიმე წუთი სჭირდება, შემდეგ კი მაშინვე იხსნება. ინდექსი ბარათზე ინახება და თავიდან იქმნება, როცა საცავის გვერდი რამდენიმე საათის შემდეგ გაიხსნება, ან როცა „განახლებას“ აირჩევთ.\n\nშენიშვნა კითხვის რეჟიმში იხსნება. ბმულები სხვა შენიშვნებზე ([[შენიშვნა]], [[შენიშვნა|სიტყვები]], [[შენიშვნა#სათაური]]) შენიშვნის სახელით მოიძებნება საცავის ნებისმიერ ადგილას; ბმულზე გადასვლა იმ შენიშვნას ხსნის, ხოლო „უკან“ წინა შენიშვნას აბრუნებს.\n\nსაცავში არაფერი იცვლება. მთავარი ეკრანის ვიჯეტები (ბოლო შენიშვნები, მიმაგრებული შენიშვნა, დღის შენიშვნა, შემთხვევითი შენიშვნა, თეგები, ძიება) მთავარი ეკრანის რედაქტორში ემატება. ვიჯეტს შეუძლია შენიშვნები მხოლოდ ერთი საქაღალდიდან აიღოს: ჩაწერეთ საქაღალდის მისამართი ბარათის ძირიდან (მაგალითად Notes/Work) ვიჯეტის პარამეტრებში; თუ ცარიელია, ის საცავის ყველა შენიშვნას იღებს."
