stats.plugin.name = კითხვის სტატისტიკა
stats.plugin.description = აღრიცხავს, რამდენ ხანს და რამდენს კითხულობთ, კალენდრით და ყოველი წიგნის მონაცემებით.
stats.plugin.how = "კითხვის სტატისტიკა აღრიცხავს, რამდენ ხანს კითხულობთ ყოველ გვერდს. მას ხედავთ მიმოხილვად (დღეს, კვირა და თქვენი სერია), კალენდრად და ყოველი წიგნის მონაცემებით.\n\nგახსენით „ხელსაწყოებიდან“ ან კითხვისას „მეტიდან“. პარამეტრებში, განყოფილებაში „კითხვის სტატისტიკა“, შეგიძლიათ გამორთოთ „კითხვის აღრიცხვა“, დააყენოთ „დღიური მიზანი“ და მიუთითოთ „უმოკლესი გვერდი“ და „უგრძესი გვერდი“, რომლებიც ითვლება, რომ ფურცვლამ ან ღიად დატოვებულმა წიგნმა მონაცემები არ დაამახინჯოს.\n\n„სინქრონიზაცია KOReader-თან“ სტატისტიკას KOReader-ს უზიარებს WebDAV საქაღალდით. ის ასევე იღებს იმავე მოწყობილობაზე არსებული KOReader-ის სტატისტიკას. აღრიცხვას დაყენებული საათი სჭირდება: თუ ასე არ არის, ერთხელ დაუკავშირდით Wi-Fi-ს."
