notes-overview.export.help = ყველა შენიშვნა ერთ ფაილში, My Clippings.txt ფორმატში, რომელსაც ელწამკითხველები იყენებენ, საქაღალდეში „Exports“ ბიბლიოთეკის გვერდით.
notes-overview.export.help.more = ყველა შენიშვნა ერთ ფაილში, My Clippings.txt ფორმატში, რომელსაც ელწამკითხველები იყენებენ, საქაღალდეში „Exports“ ბიბლიოთეკის გვერდით. სიაში 200 წიგნია, ფაილში — ყველა.
