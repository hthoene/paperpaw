reader.plugin.name = წამკითხველი
reader.plugin.description = აჩვენებს წიგნებს გვერდ-გვერდ, სარჩევითა და კითხვის პარამეტრებით.
reader.plugin.how = "წამკითხველი წიგნებს გვერდ-გვერდ აჩვენებს. გახსენით წიგნი ბიბლიოთეკიდან; ბოლო წიგნი შეიძლება გაშვებისას გაიხსნას (პარამეტრი „ბოლო წიგნის გახსნა გაშვებისას“).\n\nგვერდების გადასაფურცლად შეეხეთ ეკრანის მარცხენა ან მარჯვენა მხარეს, ან გამოიყენეთ გვერდის ღილაკები. კითხვის მენიუსთვის შეეხეთ შუა ნაწილს ან დააჭირეთ „არჩევას“: სარჩევი, ძიება, გვერდზე გადასვლა, შრიფტი და განლაგება, სანიშნეები და მონიშვნები და სხვა. ზედა კიდიდან ქვემოთ გასმა სწრაფ პანელს ხსნის, ქვედა კიდიდან ზემოთ — მთავარ ეკრანზე გადადის, ასევე „უკან“-ზე ხანგრძლივი დაჭერა.\n\nსურათის სრულ ეკრანზე სანახავად გეჭიროთ „არჩევა“ (ან სურათი): მარცხნივ და მარჯვნივ გვერდის სურათებს ათვალიერებს. „არჩევა“ ადიდებს 2x-მდე, 3x-მდე და უკან (სენსორულზე ორმაგი შეხება); გადიდებისას მარცხნივ და მარჯვნივ გვერდულად გადააადგილებს, გვერდის ღილაკები (ან გასმები) — განივად და ქვემოთ. „უკან“ ჯერ ეკრანზე მორგებას აბრუნებს, შემდეგ გვერდს (სენსორულზე გასასვლელად ხანგრძლივად დააჭირეთ). სანიშნისთვის შეეხეთ ზედა მარჯვენა კუთხეს. სიტყვის მოსანიშნად ხანგრძლივად დააჭირეთ მას. ღილაკებით გეჭიროთ მარცხენა ღილაკი: მარცხნივ და მარჯვნივ სიტყვა-სიტყვა გადაადგილდება, გვერდის ღილაკები — სტრიქონ-სტრიქონ, მათი დაჭერით გვერდის ბოლოებზე და აბზაც-აბზაც; „არჩევა“ სიტყვისთვის მონიშვნის ზოლს ხსნის, „არჩევაზე“ ხანგრძლივი დაჭერა მონიშვნას წინადადებამდე და აბზაცამდე აფართოებს (შემდეგ მარცხნივ და მარჯვნივ ბოლოს გადაადგილებს, მათი დაჭერა — დასაწყისს). მონიშვნა გვერდის გადაფურცვლისას გრძელდება. „ექსპორტი Markdown-ში“ შენიშვნებს ინახავს."
