format-txt.plugin.name = უბრალო ტექსტი
format-txt.plugin.description = ხსნის უბრალო ტექსტურ ფაილებს (.txt).
format-txt.plugin.how = "უბრალო ტექსტური ფაილები (.txt) ბიბლიოთეკიდან ისე იხსნება, როგორც ნებისმიერი წიგნი, არაფრის მორგება არ არის საჭირო. მოდული კითხულობს UTF-8, UTF-16 და Windows-1252 ტექსტს და კოდირებას თავად ადგენს.\n\nაბზაცები ფაილის ცარიელ სტრიქონებს მიჰყვება; თუ ფაილში ასეთი არ არის, თითოეული სტრიქონი ცალკე აბზაცია. Project Gutenberg-ის ფაილებში ლიცენზიის ტექსტი დასაწყისსა და ბოლოში გამოტოვებულია, სათაური და ავტორი კი თავსართიდან აიღება.\n\nფაილი არასოდეს იტვირთება მთლიანად, ამიტომ ძალიან დიდი ტექსტებიც იხსნება პატარა მოწყობილობებზე."
format-txt.title = უბრალო ტექსტი
format-xtc.plugin.name = XTC
format-xtc.plugin.description = ხსნის XTC და XTCH წიგნებს: Xteink წამკითხველების წინასწარ დახატულ გვერდებს.
format-xtc.plugin.how = "XTC და XTCH ფაილები ისეთი წიგნებია, რომელთა გვერდები უკვე სურათებადაა დახატული, როგორც მათ Xteink წამკითხველებისთვის კონვერტერები ქმნიან. ისინი ბიბლიოთეკიდან ისე იხსნება, როგორც ნებისმიერი წიგნი.\n\nრადგან ყოველი გვერდი უცვლელი სურათია, ტექსტის ზომას ვერ შეცვლით და სხვა შრიფტს ვერ დააყენებთ. გვერდები შავ-თეთრია ან ნაცრისფრის ოთხი ტონი აქვს. თითოეული გვერდი ჩვენებისას იშიფრება, ამიტომ ცოტა მეხსიერებაა საჭირო, X4-ზეც.\n\nსათაური, ავტორი და თავები ფაილიდან აიღება, თუ ის მათ შეიცავს."
format-xtc.title = XTC გვერდები
help.plugin.name = მინიშნებები
help.plugin.description = ეკრანის პირველი გახსნისას აჩვენებს, რას აკეთებს მისი მართვის ელემენტები.
help.plugin.how = "ეკრანის პირველი გახსნისას მის თავზე მოკლე შენიშვნა გამოჩნდება, რომელიც გეტყვით, რას აკეთებს მისი მართვის ელემენტები: ჩარჩოთი აღნიშნულია ეკრანის ნაწილები, სადაც შეხება მოქმედებს, და ახსნილია, რას აკეთებს ღილაკები.\n\nშეხება ან ნებისმიერი ღილაკი შენიშვნას ხურავს და ამ ეკრანზე ის აღარ გამოჩნდება. „მინიშნებები აღარ“ ყველა მათგანს გამორთავს.\n\nპარამეტრებში, „სისტემის“ ქვეშ, „მინიშნებები“ მათ რთავს ან გამორთავს, „მინიშნებების ხელახლა ჩვენება“ კი ყველა ეკრანის შენიშვნას კიდევ ერთხელ აჩვენებს."
