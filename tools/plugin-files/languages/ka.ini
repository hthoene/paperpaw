vocabulary.sd.readme = "სასწავლო ბარათები ფაილებიდან\n\nჩადეთ აქ თითო ფაილი თითოეული დასტისთვის: Spanish.tsv ქმნის დასტას Spanish.\nფაილები: .tsv, .csv ან .txt, შენახული UTF-8-ში, ან .apkg: Anki-ს დასტა, ექსპორტირებული პარამეტრით „Support older Anki versions“. მისი პირველი სამი ველი ხდება წინა მხარე, უკანა მხარე და მაგალითი; გეგმა და მედია არ იკითხება, და PaperPaw Anki-ს ფაილს არასოდეს წერს.\n\nთითო სტრიქონზე ერთი ბარათი: წინა მხარე, უკანა მხარე და მაგალითი (არასავალდებულო), გამოყოფილი ტაბით, მძიმით ან წერტილმძიმით. პირველ სტრიქონს შეუძლია სვეტებს დაარქვას: front, back, example. მაგალითი:\n\nKatze\tcat\tDie Katze schläft.\n\nშემდეგ მოწყობილობაზე გახსენით „სასწავლო ბარათები“, აირჩიეთ „ბარათები SD ბარათზე“ და შემდეგ „დასტების განახლება“.\n\nკარგია იცოდეთ:\n- დასტები პროგრესით მოწყობილობაზე რჩება. ახალი ან შეცვლილი ფაილის ბარათები დასტას ემატება ან იქ იცვლება.\n- შეცვლილი უკანა მხარე ან მაგალითი ბარათს ცვლის და პროგრესი რჩება.\n- შეცვლილი წინა მხარე ახალი ბარათია, ძველი კი თავიდან იწყება (ჰარებს და დიდ ასოებს მნიშვნელობა არ აქვს). შეინახეთ დასტა ფაილში („ბარათზე შენახვა“) და ყოველ ბარათს სვეტში id ნომერი ექნება: მაშინ შეცვალეთ წინა მხარე, პირველი ორი სტრიქონი არ შეეხოთ, და ბარათი ნასწავლს შეინარჩუნებს.\n- შენახვა მხოლოდ დასტის ბარათებს წერს; ძველი ფაილი კოპირდება როგორც _name.bak.tsv.\n- შეინახეთ CSV UTF-8-ად (არა UTF-16-ად ან ცხრილების პროგრამის ფორმატში). 4 MiB-ზე ან 20 000 სტრიქონზე დიდი ფაილი არ იკითხება: დაყავით.\n- წაშლილი სტრიქონი ბარათს არ შლის, თუ ამ დასტისთვის გამქრალი ბარათების წაშლას არ ჩართავთ; მაშინ ბარათი ნასწავლთან ერთად წაიშლება.\n- _-ით დაწყებული ფაილები არ იკითხება.\n"
