format-cbz.plugin.name = კომიქსები
format-cbz.plugin.description = ხსნის კომიქსების არქივებს (.cbz), თითო სურათი გვერდზე.
format-cbz.plugin.how = "ხსნის კომიქსების არქივებს (.cbz): თითო სურათი გვერდზე, ეკრანზე მორგებული, სახელების მიხედვით (2 10-ის წინ).\n\nჩადეთ ისინი ბიბლიოთეკის საქაღალდეში და გახსენით ბიბლიოთეკიდან; გვერდები ფურცლეთ, როგორც ნებისმიერ წიგნში. დიდ სურათებს პირველად ცოტა დრო სჭირდება, X4-ზე სხვაგან უფრო მეტი.\n\nკითხვის პარამეტრები (პარამეტრები, კითხვა): „კადრ-კადრ“ გვერდის ერთ კადრს აჩვენებს ერთდროულად, რამდენადაც ეკრანი იძლევა, და გვერდის გადაფურცვლა მათზე გადადის; კადრების გარეშე გვერდი მთლიანად ჩანს. „კომიქსის მიმართულება“ მანგისთვის გვერდის გადაფურცვლას სარკისებურად ცვლის (მარჯვნიდან მარცხნივ); წიგნის საკუთარი ComicInfo.xml ამას თავად მიუთითებს. ბიბლიოთეკა აჩვენებს წიგნის სათაურს, სერიასა და ნომერს ComicInfo.xml-იდან."
format-cbz.title = კომიქსი (CBZ)
format-cbz.setting.direction = კომიქსის მიმართულება
format-cbz.setting.direction.help = მანგა: გვერდის გადაფურცვლა სარკისებურია.
format-cbz.direction.book = როგორც წიგნშია
