news.plugin.name = სიახლეები
news.plugin.description = იღებს სიახლეების არხებს (RSS, Atom) წასაკითხ წიგნებად.
news.plugin.how = "„სიახლეები“ RSS ან Atom არხებს წიგნებად აქცევს. თითოეული არხი ბიბლიოთეკის საქაღალდე „სიახლეებში“ ერთ წიგნად იქცევა, მისი უახლესი სტატიებით უბრალო ტექსტად, რომ ის ნებისმიერი სხვა წიგნივით წაიკითხოთ.\n\nგახსენით „სიახლეები“ ხელსაწყოების მენიუდან და აირჩიეთ „არხის დამატება“; მისი მისამართი გაზეთის ან ბლოგის ვებსაიტზეა. „სიახლეების მიღება“ ყველა არხს იღებს და წინა წიგნებს ცვლის. არხის ცალკე მისაღებად ან წასაშლელად ხანგრძლივად დააჭირეთ მას (ღილაკებით გეჭიროთ „არჩევა“). წაშლილი არხის წიგნი ბიბლიოთეკაში რჩება.\n\nმიღებას ქსელი სჭირდება. „სტატიები არხიდან“ (პარამეტრები, ბიბლიოთეკა) ადგენს, რამდენი სტატია იყოს თითო წიგნში. ვიჯეტი „სიახლეების სათაურები“ მათ მთავარ ეკრანზე აჩვენებს."
