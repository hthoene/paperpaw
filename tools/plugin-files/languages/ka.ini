file-manager.plugin.name = ფაილების მენეჯერი
file-manager.plugin.description = მოწყობილობის ყველა საქაღალდე და ფაილი: გახსნა, სახელის გადარქმევა, გადატანა, კოპირება და წაშლა.
file-manager.plugin.how = "ფაილების მენეჯერი აჩვენებს მოწყობილობის მეხსიერების ყველა საქაღალდესა და ფაილს, არა მხოლოდ თქვენს წიგნებს, და საშუალებას გაძლევთ გახსნათ, გადაარქვათ სახელი, გადაიტანოთ, დააკოპიროთ და წაშალოთ ისინი, ასევე შექმნათ ახალი საქაღალდეები.\n\nგახსენით „ფაილები“ ხელსაწყოების მენიუდან. საქაღალდეში შესასვლელად შეეხეთ მას; „უკან“ ზედა საქაღალდეში გადადის. შეეხეთ ფაილს ან ხანგრძლივად დააჭირეთ ნებისმიერ ჩანაწერს (ღილაკებით ხანგრძლივად დააჭირეთ „არჩევა“), რომ ნახოთ, რისი გაკეთება შეიძლება მასთან. „გადატანა“ და „კოპირება“ ჩანაწერს იღებს: გადადით საქაღალდეში, სადაც ის უნდა მოხვდეს, და ქვედა ზოლში აირჩიეთ „აქ ჩასმა“. ღილაკებით ზოლამდე მისასვლელად ბოლო ჩანაწერიდან დააჭირეთ „ქვემოთ“.\n\nწერტილით დაწყებული ფაილები და საქაღალდეები, მაგალითად PaperPaw-ის საკუთარი მონაცემები, დამალულია. მათ სანახავად ჩართეთ „დამალული ფაილები“ პარამეტრებში, „ბიბლიოთეკის“ ქვეშ."
