picture-home.plugin.name = სურათიანი მთავარი ეკრანი
picture-home.plugin.description = მთავარი ეკრანი თქვენი სურათით ვიჯეტების უკან და სტატუსის ზოლით, რომელსაც თავად აწყობთ.
picture-home.plugin.how = "სანამ ჩართულია, „სურათიანი მთავარი ეკრანი“ ცვლის მთავარ ეკრანს: თქვენი სურათი ვიჯეტების უკან და ვიჯეტებისა და ხელსაწყოების გვერდები, რომლებსაც თავად აწყობთ. მოდულების მმართველში მისი გამორთვა ჩაშენებულ მთავარ ეკრანს აბრუნებს.\n\nმოათავსეთ სურათები (JPEG, PNG ან GIF) ბარათის საქაღალდეში (ნაგულისხმევად wallpapers) და აირჩიეთ ერთი: „პარამეტრები“ › „მორგება“ › „სურათიანი მთავარი ეკრანი“. „მორგება“ განსაზღვრავს, როგორ ავსებს სურათი ეკრანს (შევსება, მთლიანი სურათი, გაჭიმვა, ორიგინალი ზომა, ფილებად), „პოზიცია“ — რომელი ნაწილი ჩანს, „მასშტაბი“ — ზომას, „სურათის გაღიავება“ — სიმკრთალეს: მკრთალ სურათზე ვიჯეტები უკეთ იკითხება. სურათის მომზადებას ყოველი ეკრანის ზომისთვის ერთხელ ცოტა დრო სჭირდება.\n\nვიჯეტები სურათზე ფონებით დგას. გვერდებს ისე აწყობთ, როგორც ჩაშენებულ ეკრანზე: გვერდის ქვემოთ ფანქრით ან მენიუში „მთავარი ეკრანის რედაქტირებით“.\n\nსტატუსის ზოლი (დრო, Wi-Fi, ბატარეა ან სხვა) შეიძლება იყოს ჩართული, გამორთული ან ავტომატური, ზემოთ ან ქვემოთ, მთელ სიგანეზე ან კაფსულად მარცხნივ, შუაში ან მარჯვნივ, ღია, მუქ ან ნაცრისფერ ფონზე ან პირდაპირ სურათზე. ღილაკების დასახელებების ზოლიც (X4-ზე) შეიძლება იყოს ჩართული, გამორთული ან ავტომატური: ღილაკზე დაჭერა მათ მხოლოდ აჩენს რამდენიმე წამით.\n\n„სურათის გამოსახვა“: „ნაცრისფერის გრადაციები“ — ყველა ნაცრისფერი ტონით (X4-ზე ნელა), „წერტილოვანი“ — შავ-თეთრი წერტილებით (სწრაფად), ან „ავტომატური“, როგორც ჩაშენებულ ეკრანზე: გრადაციები ეკრანის დახატვისას, წერტილები პირველი ცვლილების შემდეგ. გრადაციების გარეშე ეკრანზე წერტილები გამოიყენება."
