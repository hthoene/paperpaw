menu.plugin.description = მენიუ ეკრანის ქვედა ნაწილში, მოქმედებებითა და პარამეტრებით.
menu.plugin.how = "მენიუ აჩვენებს, რისი გაკეთება და დაყენება შეგიძლიათ. ის ეკრანის ქვედა ნაწილში იხსნება, იმის თავზე, რაც ღიაა: კითხვისას შეეხეთ ეკრანის შუა ნაწილს ან დააჭირეთ „არჩევას“. ჩანაწერის შესასრულებლად შეეხეთ მას ან აირჩიეთ.\n\nმენიუში პარამეტრები თავიანთ მნიშვნელობას აჩვენებს და ადგილზევე იცვლება, ამიტომ მენიუ ღია რჩება. ჩანაწერი, რომელსაც მეტი ჩანაწერი აქვს, ქვემენიუს ხსნის.\n\nსწრაფი პანელისთვის გადაფურცლეთ ზედა კიდიდან ქვემოთ: ის, რასაც ხშირად ცვლით, ღილაკებად. ღილაკის გადასართავად შეეხეთ მას, მისი პარამეტრებისთვის ხანგრძლივად დააჭირეთ. მხოლოდ ღილაკებით ისრიანი ღილაკები ირჩევს, „არჩევა“ გადართავს, „უკან“ კი ხურავს. „იერსახის“ ქვეშ „მენიუები“ მენიუებს სიად ან ფილებად აჩვენებს."
