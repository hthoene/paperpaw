puzzles.plugin.description = სუდოკუ, კროსვორდები და შახმატის ამოცანები, ოფლაინ, დღის თავსატეხით.
puzzles.plugin.how = "ოფლაინ თავსატეხები: სუდოკუ, კროსვორდები და შახმატის ამოცანები. გახსენით „თავსატეხები“ ხელსაწყოების მენიუდან, ან დაამატეთ ვიჯეტი „დღის თავსატეხი“ მთავარ ეკრანზე (ხანგრძლივად დააჭირეთ მთავარ ეკრანს): ის აჩვენებს დღევანდელი სუდოკუს პროგრესს, შეხება კი მას ხსნის.\n\nსუდოკუ: მარცხნივ/მარჯვნივ კურსორი უჯრა-უჯრა მიდის, ზემოთ/ქვემოთ (გვერდის ღილაკები) — რიგ-რიგ. „არჩევა“ ციფრებს ხსნის: აირჩიეთ ციფრი და კვლავ „არჩევა“ ჩასაწერად, ან „გასუფთავება“ უჯრის დასაცლელად. დაფის ქვემოთ ღილაკებისთვის გეჭიროთ „არჩევა“ (ან „მენიუ“): „შენიშვნები“ ციფრებს ფანქრის ნიშნებად აქცევს, „შემოწმება“ არასწორ უჯრებს მონიშნავს, „დაბრუნება“ ბოლო სვლას აუქმებს, „ახალი“ იწყებს თავსატეხს არჩეული დონით (მარტივი, საშუალო, რთული). ყველა თავსატეხს ერთი ამოხსნა აქვს. თამაში გასვლისას ინახება. სენსორულ ეკრანზე შეეხეთ უჯრას.\n\nკროსვორდები: მოათავსეთ .puz (Across Lite) ან .ipuz ფაილები ბარათზე, საქაღალდეში „puzzles“; თან არცერთი არ მოყვება. გადაადგილდით ბადეზე და აირჩიეთ, რომ კურსორის ქვეშ სიტყვა კლავიატურით აკრიფოთ (ქვედა ტირე უჯრას ცარიელს ტოვებს). ღილაკები ცვლის ჰორიზონტალურსა და ვერტიკალურს, აჩვენებს მინიშნებებს, ამოწმებს ასოებს და ამხელს სიტყვას. ასოები ყოველი ფაილისთვის ინახება. დაშიფრული .puz ფაილები არ იხსნება.\n\nშახმატის ამოცანები: მცირე ნაკრები Lichess-ის ბაზიდან (CC0). მარცხნივ/მარჯვნივ ფიგურებზე გადადის: აირჩიეთ ფიგურა, შემდეგ იმავე ღილაკებით მისთვის დასაშვები უჯრა. არასწორი სვლა უქმდება. „მინიშნება“ მონიშნავს სავალ ფიგურას, „შემდეგი“ შემდეგ ამოცანაზე გადადის.\n\n„სტატისტიკა“ ამოხსნილ თავსატეხებს ითვლის."
