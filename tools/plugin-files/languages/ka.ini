power.plugin.name = კვება
power.plugin.description = ირჩევს კვების რეჟიმს, ხელით ან ბატარეის მიხედვით: ჩვეულებრივი, დაზოგვა, ოფლაინ.
power.plugin.how = "„კვება“ ირჩევს, როგორ ხარჯავს PaperPaw ბატარეას: ჩვეულებრივი, დაზოგვა ან ოფლაინ. „დაზოგვა“ იმას, რასაც მოცდა შეუძლია, უფრო ხელსაყრელ დროს აკეთებს; „ოფლაინ“ რადიოს გამორთულს ტოვებს. „ავტო“ ბატარეის მიხედვით ირჩევს.\n\nრეჟიმი შეცვალეთ სწრაფ პანელში, სადაც „კვება“ რეჟიმებს გვერდიგვერდ აჩვენებს, ან პარამეტრებში, „კვების“ ქვეშ. იქვე აყენებთ დონეებს, რომლებზეც „ავტო“ „დაზოგვაზე“ და „ოფლაინზე“ გადადის, და რჩება თუ არა ის „ჩვეულებრივში“ დამუხტვისას.\n\nსტატუსის ზოლებში „კვების რეჟიმი“ დაზოგვისას ფოთოლს აჩვენებს, ოფლაინ რეჟიმში — გადახაზულ Wi-Fi-ს, ხოლო „ჩვეულებრივში“ არაფერს.\n\nჩართვის ღილაკზე ხანგრძლივად დაჭერა პატარა მენიუს ხსნის: „ძილი“, „გამორთვა“ (სადაც PaperPaw-ს შეუძლია), „გადატვირთვა“ და სენსორულ მოწყობილობებზე „შეხების დაბლოკვა“ ან „შეხების განბლოკვა“. მოკლე დაჭერა კვლავ აძინებს მოწყობილობას. „უკან“ მენიუდან გამოდის."
