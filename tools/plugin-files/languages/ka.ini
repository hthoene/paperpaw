translate.plugin.name = თარგმანი
translate.plugin.description = თარგმნის მონიშნულ ტექსტს ონლაინ, DeepL-ით.
translate.plugin.how = "„თარგმანი“ მონიშნულ ტექსტს ონლაინ თარგმნის DeepL-ით. მონიშნეთ ტექსტი წიგნში და მონიშნული ტექსტის მენიუში აირჩიეთ „თარგმნა“: თარგმანი გვერდის თავზე გამოჩნდება, როგორც ლექსიკონის სტატია. გვერდის ღილაკები ან შეხებები მას ახვევს, ხოლო „არჩევა“ ან შეხება ბოლოში ხურავს.\n\nსაჭიროა ქსელი და თქვენი საკუთარი DeepL API გასაღები, რომელიც deepl.com-ზე უფასოა (DeepL API Free, დაახლოებით 500 000 სიმბოლო თვეში). სანამ მას არ შეიყვანთ, პანელი ამას გეტყვით, შეხებით კი მისი შეყვანა შეგიძლიათ.\n\nპარამეტრებში, „კითხვაში“, განყოფილებაში „თარგმანი“, „თარგმნა ენაზე“ ენას ადგენს; თავდაპირველად ეს PaperPaw-ის ენაა."
