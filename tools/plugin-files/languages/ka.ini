mail.plugin.name = ფოსტა
mail.plugin.description = კითხულობს და აგზავნის ელფოსტას პაროლით ან აპის პაროლით (IMAP და SMTP), ბრაუზერში შესვლის გარეშე.
mail.plugin.how = "„ფოსტა“ ელფოსტას IMAP-ითა და SMTP-ით კითხულობს და აგზავნის. ის მისამართითა და პაროლით შედის, ბრაუზერის გარეშე, ამიტომ მუშაობს ყველა პროვაიდერთან, რომელიც ამას უშვებს.\n\nანგარიში დააყენეთ „პარამეტრები“, „ფოსტა“-ში: აირჩიეთ პროვაიდერი, აკრიფეთ მისამართი და პაროლი. უმეტესობა აპის პაროლს ითხოვს: შექმენით ის ანგარიშის უსაფრთხოების პარამეტრებში. ჩვეულებრივი ხშირად არ მუშაობს. პაროლი მხოლოდ პროვაიდერის სერვერზე მიდის და პაროლებთან და გასაღებებთან ერთად ინახება.\n\nგახსენით „ფოსტა“ ხელსაწყოებში. „ფოსტის შემოწმება“ ბოლო წერილებსა და საქაღალდეებს იღებს. წერილები ბარათზე ინახება და ქსელის გარეშეც იკითხება. Wi-Fi მხოლოდ წამით ირთვება.\n\nთუ პროვაიდერი სიაში არ არის, აირჩიეთ „საკუთარი სერვერები“ და გაფართოებულ პარამეტრებში მიუთითეთ სერვერები, პორტები და უსაფრთხოება. დაუდასტურებელი სერტიფიკატის მქონე სერვერზე ერთხელ გკითხავთ, ენდოთ თუ არა; შეადარეთ ანაბეჭდი პროვაიდერის ნაჩვენებს.\n\nწერილს წიგნის დანართით (EPUB, PDF და მსგავსი, 2 მბ-მდე) აქვს „წიგნის გახსნა“: ის წიგნს ბიბლიოთეკაში დებს და ხსნის.\n\nახალი წერილების „ფოსტის“ გაუხსნელად სანახავად ჩართეთ „ახალი ფოსტის შემოწმება ფონურად“ („პარამეტრები“, „ფოსტა“) და აირჩიეთ სიხშირე (15, 30 ან 60 წუთი). მაშინ მოწყობილობა, სანამ ღვიძავს და ონლაინაა, დროდადრო ამოწმებს ანგარიშებს რიგრიგობით და მთავარ ეკრანზე წაუკითხავების რაოდენობას ანახლებს. ეს ბატარეას ხარჯავს. „ფოსტის“ გახსნა მიმდინარე შემოწმებას აჩერებს.\n\nმთავარი ეკრანის ვიჯეტები: წაუკითხავების რაოდენობა, ბოლო და ვარსკვლავიანი წერილები, საფოსტო ყუთი და წერილის დაწერის მალსახმობი."
