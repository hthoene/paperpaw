launcher-simple.plugin.name = მარტივი მთავარი
launcher-simple.plugin.description = მშვიდი საწყისი ეკრანი: დიდი საათი, ბარათები, დოკი და მრგვალი გადამრთველების სწრაფი პანელი.
launcher-simple.plugin.how = "„მარტივი მთავარი“ მშვიდი საწყისი ეკრანია მათთვის, ვისაც მხოლოდ მთავარი სჭირდება: დიდი საათი, წიგნი, რომელსაც კითხულობთ, ბიბლიოთეკა და მაღაზია დიდ ბარათებად, ქვემოთ კი სამი ხატულის დოკი. მორგება არ სჭირდება.\n\nაირჩიეთ ის პარამეტრებში, მთავარი ეკრანის ქვეშ. მის სწრაფ პანელს (ისიც პარამეტრებში აირჩიეთ პანელად) დიდი მრგვალი გადამრთველები აქვს, ზოლი წინა განათებისთვის, სადაც მოწყობილობას ის აქვს, და ზოლი ტექსტის ზომისთვის. ღილაკებით ისრიანი ღილაკები ფოკუსს გადააადგილებს, „არჩევა“ კი აკეთებს იმას, რაც ნაწილზე წერია; ზოლზე ის მეათედს უმატებს, ბოლოდან კი დასაწყისში ბრუნდება. შეხებით შეეხეთ ნაწილს, ან ზოლს იქ, სადაც გსურთ.\n\nბიბლიოთეკა თქვენს წიგნებს ბარათებად აჩვენებს, ბოლოს გახსნილს პირველად, თითო გვერდად, და ჩვეულებრივ წამკითხველს ხსნის.\n\nმოირგეთ ის პარამეტრებში, „მარტივი მთავარის“ ქვეშ: სამი სია, რომლებსაც ისე არედაქტირებთ, როგორც მთავარ მენიუს. „ბარათები“: რომელ ბარათებს აჩვენებს მთავარი და რა თანმიმდევრობით. „დოკი“: რომელი ხატულებია დოკში, ნებისმიერი მოდულის ნებისმიერი მოქმედება. „სწრაფი პანელი“: რომელ გადამრთველებსა და ზოლებს აჩვენებს. ბარათი, რომლისთვისაც ეკრანზე ადგილი არ არის, გამოტოვებულია, ბოლოდან. „მარტივი მთავარის“ ქვეშ ასევე ირჩევთ, ჩანდეს თუ არა თარიღი და ბატარეა."
