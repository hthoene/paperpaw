reading-goal.plugin.description = დღიური კითხვის წუთები და კატა მთავარ ეკრანზე, რომლის განწყობა დღევანდელ კითხვაზეა დამოკიდებული.
reading-goal.plugin.how = "კატა მთავარ ეკრანზე აჩვენებს, როგორ მიდის დღეს კითხვა: მოწყენილია, სანამ ჯერ არ წაგიკითხავთ; ცოტა კითხვის შემდეგ — „ასე რა“; დღიური მიზნის ნახევრიდან — კმაყოფილი; მიზნის მიღწევისთანავე — ბედნიერი.\n\nდაამატეთ ვიჯეტი „კითხვის კატა“ მთავარ ეკრანზე (ხანგრძლივად დააჭირეთ მთავარ ეკრანს და დაამატეთ ვიჯეტი), ან ძილის ეკრანად აირჩიეთ „დღევანდელი კითხვის კატა“. კატაზე შეხება ხსნის დღიურ მიზანს; ეს კითხვის სტატისტიკის მიზანია, რომელიც კითხვის წუთებს ითვლის.\n\nპარამეტრებში, განყოფილებაში „კითხვა“, „კმაყოფილი დონიდან“ და „ბედნიერი დონიდან“ განსაზღვრავს, მიზნის რა წილიდან არის კატა კმაყოფილი ან ბედნიერი, ხოლო „საკუთარი სურათები“ — საქაღალდეს სურათებით (sad, meh, content და happy), რომლებიც კატების ნაცვლად გამოჩნდება. სურათები PNG ან JPEG ფაილებია; საქაღალდის გარეშე კატები ჩანს."
