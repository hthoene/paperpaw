fonts-browser.plugin.description = აჩვენებს შრიფტებს ინტერნეტიდან, თითოეულს ნიმუშით, და ჩამოტვირთავს მათ კითხვისთვის.
fonts-browser.plugin.how = "„მეტი შრიფტი“ აჩვენებს ინტერნეტის შრიფტების ბიბლიოთეკას, თითოეულის სახელს მისივე შრიფტით, და ჩამოტვირთავს მათ, რომლებითაც კითხვა გსურთ.\n\nის შრიფტების სიის ბოლოშია: პარამეტრებში, „კითხვის“ ქვეშ, „შრიფტი“ (სტატუსის ზოლებსაც აქვთ იგივე ჩანაწერი). შეეხეთ შრიფტს (ღილაკებით: „არჩევა“) სანიმუშო წინადადებით სანახავად, შემდეგ აირჩიეთ „ჩამოტვირთვა“; ამ დროს გვერდის დატოვება შეიძლება. შემდეგ აირჩიეთ „კითხვა შრიფტით“ ან „სტატუსის ზოლებისთვის გამოყენება“. „განახლება“ ახალ ვერსიას იღებს, „წაშლა“ შრიფტს შლის.\n\nსაჭიროა Wi-Fi.\n\nთქვენი შრიფტები\n\nიმავე სიაში „თქვენი შრიფტები“ დახმარების ამ ნაწილს აჩვენებს. საკუთარი შრიფტი არის .ttf ან .otf ფაილი, მაგ. Google Fonts-იდან.\n\nAndroid-ზე და შრიფტის ფაილების მხარდამჭერ სხვა მოწყობილობებზე: დააკოპირეთ ფაილი შრიფტების საქაღალდეში (Android-ზე: PaperPaw/fonts საერთო მეხსიერებაში), გადატვირთეთ PaperPaw და აირჩიეთ ის „შრიფტში“.\n\nXteink X4-სა და X4 Pro-ზე შრიფტის ფაილები მეხსიერებაში არ ეტევა, ამიტომ ისინი შრიფტების პაკეტებს კითხულობს. შექმენით პაკეტი კომპიუტერზე paperpaw-fontgen-ით, ყველა არსებული სტილისთვის (regular აუცილებელია):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nდააკოპირეთ მიღებული plugins/font-my-font ბარათის plugins საქაღალდეში, გადატვირთეთ და აირჩიეთ My Font „შრიფტში“. ხელსაწყო გეტყვით, მოთხოვნილი ასოებიდან რამდენი აქვს შრიფტს (--chars latin,cyrillic,greek დამწერლობებს ამატებს); აირჩიეთ შრიფტი, რომელიც წიგნის დამწერლობას ფარავს.\n\n„მეტი შრიფტის“ შრიფტებს კომპიუტერი არ სჭირდება.\n\ne-ink-ზე უფრო მკვეთრი პატარა ტექსტისთვის დაუმატეთ --hinting light (ასოებს პიქსელების ბადეს არგებს). არაბულ ან დევანაგარის შრიფტებს ეს არ დაუმატოთ."
