settings.plugin.how = "„პარამეტრები“ გვერდებად აჩვენებს ყველაფერს, რისი დაყენებაც შეიძლება PaperPaw-სა და მის მოდულებში. მოდულებს საკუთარი ეკრანი არ სჭირდებათ: რასაც ისინი აცხადებენ, აქ ჩნდება ჯგუფებად, თითოეული პარამეტრის აღწერით მის ქვემოთ.\n\nგახსენით მენიუში „პარამეტრებით“. ჯგუფის გასახსნელად შეეხეთ მას, შემდეგ პარამეტრს მის გადასართავად ან ასარჩევად; რიცხვებს აქვს ღილაკები − და +. ღილაკებით გადადით პარამეტრზე და დააჭირეთ „არჩევა“: მარცხნივ და მარჯვნივ რიცხვს ცვლის, „არჩევა“ ინახავს, „უკან“ წინა მნიშვნელობას აბრუნებს.\n\nცვლილებები მაშინვე მოქმედებს. „ძიება“ პარამეტრს სიტყვებით პოულობს, „დამატებითი პარამეტრები“ კი იშვიათად საჭირო პარამეტრებსაც აჩენს. „ნაგულისხმევზე დაბრუნება“ და „ყველაფრის გადაყენება“ ჯერ გეკითხებათ."
