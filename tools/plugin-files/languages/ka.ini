home.plugin.name = მთავარი ეკრანი
home.plugin.description = საწყისი გვერდი: ვიჯეტების გვერდები, მაგალითად, მიმდინარე წიგნი და ხელსაწყოები.
home.plugin.how = "მთავარი ეკრანი გვერდებისგან შედგება, თითოეული ვიჯეტებისა და ხელსაწყოების ბადეა, როგორც ტელეფონზე. თავიდან საათი, წიგნი, რომელსაც კითხულობთ, და ბოლოს წაკითხული წიგნები ერთ გვერდზეა, ყველა ხელსაწყო კი მომდევნოზე.\n\nგასახსნელად შეეხეთ ელემენტს, გვერდის შესაცვლელად გადაფურცლეთ ან გამოიყენეთ გვერდის ღილაკები. მხოლოდ ღილაკებით ისრიანი ღილაკები ერთი ელემენტიდან მეორეზე გადადის, „არჩევა“ კი მას ხსნის.\n\nგადასალაგებლად ხანგრძლივად დააჭირეთ მთავარ ეკრანს, შეეხეთ ფანქარს გვერდის ქვემოთ ან აირჩიეთ მენიუში „მთავარი ეკრანის რედაქტირება“. ელემენტები გადასატანად გადაათრიეთ ან შეეხეთ ერთ-ერთს მისი პარამეტრებისთვის, ღილაკებითაც. იქვეა „ვიჯეტის დამატება“. „სვეტები“ და „რიგები“ პარამეტრებშია, „იერსახის“ ქვეშ, განყოფილებაში „მთავარი ეკრანი“.\n\nგვერდულად შემობრუნებულ ეკრანზე მთავარი ეკრანი იმავე ელემენტებს მეტი სვეტით აჩვენებს, ყოველი გვერდი მომდევნომდე ივსება, ბარათები კი დაახლოებით 110 მმ-ზე განიერი არ არის; ვერტიკალურად გალაგებული არაფერი იცვლება. თუ მას გვერდულად გადაალაგებთ, ეს განლაგება მხოლოდ ამ ორიენტაციისთვის შეინახება: ახალი ვიჯეტები ორივეს ემატება. „ჰორიზონტალური განლაგების ჩამოყრა“ მენიუში „დამატება“ (რედაქტირებისას) გამოყვანილ განლაგებას აბრუნებს. ვიჯეტის ან ხელსაწყოს წაშლა ერთ ორიენტაციაში მას მეორიდან არ შლის."
