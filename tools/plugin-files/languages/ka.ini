weather.plugin.description = ამინდი ახლა და მომდევნო დღეებში, ვიჯეტებად, Open-Meteo-დან.
weather.plugin.how = "„ამინდი“ მთავარი ეკრანის ვიჯეტებად აჩვენებს ამინდს ახლა და მომდევნო დღეებში, Open-Meteo-დან, რომელსაც არც ანგარიში სჭირდება და არც გასაღები. „ამინდი ახლა“ აჩვენებს ტემპერატურას, ამინდის მდგომარეობას და სხვა არჩეულ მონაცემებს; „პროგნოზი“ მომდევნო დღეებს აჩვენებს მწკრივად ან სიად.\n\nჯერ აირჩიეთ ადგილი: პარამეტრებში, „ამინდის“ ქვეშ, „ადგილი“ (აკრიფეთ სახელი, შემდეგ აირჩიეთ ნაპოვნი ადგილებიდან). იგზავნება მხოლოდ მისი კოორდინატები და მხოლოდ მაშინ, როცა ამინდის ვიჯეტი ჩანს. ვიჯეტები მთავარი ეკრანის რედაქტირებით დაამატეთ.\n\nამინდი ჩამოიტვირთება არაუმეტეს იმ სიხშირით, რაც „განახლების ინტერვალშია“ მითითებული, და მხოლოდ მაშინ, როცა ქსელია: Wi-Fi-ს თავისით არასოდეს რთავს.\n\nამინდის მონაცემები: Open-Meteo.com (https://open-meteo.com), ლიცენზია Creative Commons Attribution 4.0 (CC BY 4.0)."
