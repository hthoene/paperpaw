profiles.plugin.description = კითხვისა და ეკრანის პარამეტრების დასახელებული ნაკრებები, რომლებიც ერთი შეხებით ირთვება.
profiles.plugin.how = "პროფილი ინახავს თქვენს კითხვის პარამეტრებს, ეკრანის პარამეტრებსა და სტატუსის ზოლებს ერთი სახელით, მაგალითად „ღამე“ ან „დიდი შრიფტი“, და ერთი შეხებით აბრუნებს მათ.\n\nგახსენით „პროფილები“ კითხვის მენიუში, „მეტის“ ქვეშ, ან პარამეტრებში, „მორგების“ ქვეშ. პროფილის გამოსაყენებლად შეეხეთ მას; გამოყენებული პროფილი მონიშნულია. მიმდინარე პარამეტრების მასში შესანახად, სახელის გადასარქმევად ან წასაშლელად ხანგრძლივად დააჭირეთ მას (ღილაკებით: გეჭიროთ „არჩევა“). „ახალ პროფილად შენახვა“ ინახავს იმას, რაც ახლა არის დაყენებული.\n\n„შემდეგი პროფილი“ სიაში შემდეგ პროფილზე გადადის; მიანიჭეთ ის ღილაკს ან წესს."
