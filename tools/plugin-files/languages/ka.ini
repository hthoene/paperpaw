about.plugin.name = შესახებ
about.plugin.description = PaperPaw-ს ვერსია და ლიცენზიები.
about.plugin.how = "„შესახებ“ აჩვენებს, PaperPaw-ს რომელი ვერსია გაქვთ, სად არის მისი საწყისი კოდი და რომელი ლიცენზიებით ვრცელდება.\n\nის პარამეტრების ბოლოშია, როგორც „PaperPaw-ს შესახებ“. აირჩიეთ სტრიქონი ისრის ღილაკებით და „არჩევა“-თი, ან შეეხეთ მას. აქვეა ჩამოთვლილი PaperPaw-ს პროგრამაში ჩაშენებული მოდულები და, მოწყობილობებზე, რომლებიც კოდიან მოდულებს ტვირთავენ, ანაბეჭდი, რომლისთვისაც ასეთი მოდულები უნდა იყოს აწყობილი.\n\n„ლიცენზიები“ იხსნება როგორც ტექსტი წამკითხველში, ასე რომ, მას წიგნივით ფურცლავთ. მასშია PaperPaw-ს საკუთარი ლიცენზია და თანმხლები შრიფტების, ხატულებისა და სიტყვების გადატანის ნიმუშების ლიცენზიები. მოდულებს შეუძლიათ საკუთარი სტრიქონის დამატება, მაგ. თემის ავტორი."
