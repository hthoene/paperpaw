core.config-unreadable = ფაილის {file} წაკითხვა ვერ მოხერხდა, ამიტომ პარამეტრების ცვლილებები არ ინახება. შეასწორეთ ან წაშალეთ ფაილი კომპიუტერზე.
core.secrets-unreadable = ფაილის {file} წაკითხვა ვერ მოხერხდა, ამიტომ პაროლები და გასაღებები არ ინახება. შეასწორეთ ან წაშალეთ ფაილი კომპიუტერზე.
core.secrets-unopened = ამ ბარათზე შენახული ზოგიერთი პაროლი და გასაღები აქ ვერ გაიხსნება: ისინი სხვა მოწყობილობაზე შეინახა, ან ამ მოწყობილობის გასაღები დაიკარგა. შეიყვანეთ ისინი ხელახლა იქ, სადაც მოდული მოგთხოვთ.
core.secrets-unsupported = ამ მოწყობილობას ჯერ არ შეუძლია პაროლების შენახვა. ერთხელ ხელახლა დააყენეთ PaperPaw ვებ-ფლეშერით საიტზე paperpaw.org და ყველაფერი იმუშავებს.
core.card.missing = მეხსიერების ბარათი ვერ მოიძებნა, ამიტომ არაფერი ინახება. ჩადეთ FAT32 ბარათი და გადატვირთეთ.
core.card.unreadable = მეხსიერების ბარათი არ იკითხება, ამიტომ არაფერი ინახება. სცადეთ სხვა ბარათი.
core.card.exfat-experimental = ეს მეხსიერების ბარათი exFAT-ია. exFAT-ის მხარდაჭერა ექსპერიმენტულია; FAT32 ყველაზე უსაფრთხოა.
core.card.no-fat = მეხსიერების ბარათი FAT32 ფორმატში არ არის, ამიტომ არაფერი ინახება. დააფორმატეთ ის FAT32-ში კომპიუტერზე.
