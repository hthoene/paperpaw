diagnostics.plugin.name = დიაგნოსტიკა
diagnostics.plugin.description = სატესტო ეკრანი და მოწყობილობის ყველა ნაწილის ნაბიჯ-ნაბიჯ შემოწმება.
diagnostics.plugin.how = "„დიაგნოსტიკა“ მოწყობილობის შესამოწმებელი სატესტო ეკრანია: ის აჩვენებს ნაცრისფრის ყველა დონეს, რომელსაც ეკრანი გამოსახავს, ოთხ უჯრას ღილაკებისა და შეხების საცდელად, და გვერდების მთვლელს პროგრესის ზოლით განახლების რეჟიმების შესადარებლად.\n\nსატესტო ეკრანს მენიუში ჩანაწერი არ აქვს. ის მთავარი ეკრანია მხოლოდ მაშინ, როცა სხვა მოდული მას არ გვთავაზობს, ან როცა მოდულების მენეჯერში, „ეკრანების“ ქვეშ, მას ადგილისთვის „მთავარი ეკრანი“ აირჩევთ.\n\n„არჩევა“ მონიშნავს აქტიურ უჯრას, ისრიანი ღილაკები უჯრებს შორის გადაადგილდება; შეხებით შეეხეთ უჯრას. გვერდის ღილაკები სატესტო გვერდებს ფურცლავს. თავიდან დასაწყებად ხანგრძლივად დააჭირეთ „არჩევა“ ან თითი ეკრანზე გეჭიროთ.\n\nმოწყობილობის შემოწმება, ხელსაწყოებში (იქ, სადაც PaperPaw მოწყობილობის ჩაშენებული პროგრამაა), მოწყობილობის ყველა ნაწილს გვერდ-გვერდ ამოწმებს: ეკრანს, ღილაკებს, შეხებას, განათებას, ბატარეას, ბარათს, საათს, Wi-Fi-ს, ძილს და მეხსიერებას. ყოველი გვერდი მთავრდება ღილაკებით „ვერ გავიდა“, „გამოტოვება“ და „გავიდა“, და გაზომვების მიხედვით შესაბამისი პასუხი უკვე არჩეულია; ნაწილები, რომლებიც მოწყობილობას არ აქვს, გამოიტოვება. ყოველი პასუხის შემდეგ ანგარიში იწერება ფაილში .paperpaw/plugins/diagnostics/device-check.txt, pull request-ში ჩასასმელად. „უკან“ შემოწმებიდან გამოდის, ხელახლა გახსნისას კი ის იქიდან გრძელდება, სადაც შეჩერდა. მხოლოდ ღილაკებიან მოწყობილობაზე ღილაკების გვერდზე ჯერ აირჩიეთ „დაწყება“; მანამდე ისრები, „არჩევა“ და „უკან“ ისე მუშაობს, როგორც ყველა გვერდზე."
