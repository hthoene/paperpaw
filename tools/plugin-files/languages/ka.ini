plugin-manager.plugin.name = მოდულების მმართველი
plugin-manager.plugin.description = აჩვენებს მოდულებს და რთავს და თიშავს მათ.
plugin-manager.plugin.how = "მოდულების მმართველი აჩვენებს ყველა მოდულს ვერსიითა და აღწერით, და რთავს და თიშავს მოდულებს.\n\nის პარამეტრებში იპოვით, როგორც „მოდულების მართვა“. „მოდულების პარამეტრები“ ცალკე გვერდია ისეთი პარამეტრებისთვის, როგორიცაა თითოეული მოდულის მიერ ქსელის გამოყენება. ჩასართავად ან გამოსართავად შეეხეთ მოდულს (ღილაკებით: აირჩიეთ). ცვლილება გადატვირთვის შემდეგ მოქმედებს: ქვედა ზოლი მაშინ შემოგთავაზებთ „ახლავე გადატვირთვას“. იმის წასაკითხად, თუ როგორ მუშაობს მოდული, ხანგრძლივად დააჭირეთ მას (ღილაკებით: გეჭიროთ „არჩევა“).\n\nმოდულის გამორთვა, რომელსაც აწერია „ყოველთვის ჩართული“, შეუძლებელია, ხოლო „აუცილებელი“ მოდულისა — მხოლოდ მას შემდეგ, რაც მის საქმეს სხვა მოდული იკისრებს, თორემ PaperPaw-ს უკან დასაბრუნებელი გზა არ ექნებოდა. „ეკრანებში“ ირჩევთ, რომელმა მოდულმა აჩვენოს ადგილი, რომელსაც რამდენიმე მოდული გვთავაზობს."
