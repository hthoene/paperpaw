notes-overview.plugin.name = ყველა შენიშვნა
notes-overview.plugin.description = ყველა წიგნის სანიშნეები და მონიშვნები ერთ სიაში, და ექსპორტი ფაილში My Clippings.txt.
notes-overview.plugin.how = "„ყველა შენიშვნა“ აჩვენებს ყველა წიგნს, რომელშიც სანიშნე ან მონიშვნა გააკეთეთ, მათი რაოდენობით. გახსენით ის ხელსაწყოებში. აირჩიეთ წიგნი მისი შენიშვნების სანახავად, ხოლო შენიშვნა — წიგნის იმ ადგილზე გასახსნელად.\n\nსიის ბოლოს „ექსპორტი My Clippings.txt-ში“ ყველა შენიშვნას ერთ ფაილში წერს, საქაღალდეში Exports ბიბლიოთეკის გვერდით, იმ ფორმით, რომელსაც Kindle იყენებს (UTF-8). აპები, რომლებიც Kindle-ის My Clippings.txt-ს კითხულობენ, მასაც წაიკითხავენ. მონიშვნაზე დართული შენიშვნა ცალკე ჩანაწერია, როგორც Kindle-ზე. რადგან აქ წიგნს Kindle-ის პოზიციები არ აქვს, „location“ არის ის, თუ რა ნაწილშია შენიშვნა წიგნში, პროცენტებში. ფაილი ყოველ ჯერზე თავიდან იწერება და წინას ცვლის."
