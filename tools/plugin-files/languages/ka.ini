sleep.plugin.name = ძილის ეკრანი
sleep.plugin.description = მოწყობილობის ძილისას აჩვენებს მძინარე კატას, წიგნის ყდას, თქვენს სურათებს ან შეტყობინებას.
sleep.plugin.how = "ძილის ეკრანი წყვეტს, რას აჩვენებს ეკრანი, როცა მოწყობილობას სძინავს. ელექტრონული მელანი სურათს კვების გარეშეც ინახავს.\n\nაირჩიეთ ის პარამეტრებში, განყოფილებაში „მოწყობილობა“, „ძილის ეკრანი“, პუნქტით „ჩვენება“: მძინარე კატა (ნაგულისხმევი), წიგნის ყდა, ჩემი სურათები, ლოგო და „ძილის რეჟიმი“, ვიჯეტები, გვერდი როგორც არის, ან გვერდი სურათით. „ჩემი სურათები“ სურათების საქაღალდის ფაილებს ერთმანეთის მიყოლებით აჩვენებს.\n\nყდის ან სურათის გარეშე კატა ჩანს. სადაც ძილის ეკრანს თავად სისტემა ხატავს, ეს პარამეტრები დამალულია.\n\nგამორთვის ეკრანი („ჩვენება გამორთვისას“) ერთხელ იხატება მოწყობილობის გამორთვისას, კვების მენიუდან ან „ძილის შემდეგ გამორთვის“ დროის გასვლისას (და არა მაშინ, როცა დაცლილი ბატარეა კვებას წყვეტს). ის ძილის ეკრანის მსგავსია, თუ არ აირჩევთ ლოგოს წარწერით „გამორთულია“, კატას, ყდას ან ჩემს სურათებს. სხვა მოდულს შეუძლია ამისთვის ეკრანი შემოგთავაზოთ.\n\nგაშვებისა და გადატვირთვის ეკრანები („ჩვენება გაშვებისას“ და „ჩვენება გადატვირთვისას“) მოწყობილობის საკუთარია, თუ სხვა მოდული მათთვის ეკრანს არ გთავაზობთ. გაშვებისას მოდულები ჯერ არ მუშაობს: გაშვებისთვის არჩეული ეკრანი წინასწარ იხატება, მოწყობილობის გამორთვის ან გადატვირთვისას, და ჩანს შემდეგი გაშვებისას. ეკრანი, რომელიც დროულად არ მზადდება, ან დაზიანებული სურათი ადგილს უთმობს მოწყობილობის საკუთარს; მოწყობილობა ნებისმიერ შემთხვევაში გამოირთვება ან გადაიტვირთება."
