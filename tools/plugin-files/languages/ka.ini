keys.plugin.name = ღილაკები და ჟესტები
keys.plugin.description = რას აკეთებს ყოველი ღილაკი, შეხების ზონა და გადაფურცვლა; იცვლება მოწყობილობაზე.
keys.plugin.how = "„ღილაკები და ჟესტები“ აჩვენებს, რას აკეთებს ყოველი ღილაკი, შეხების ზონა და გადაფურცვლა, და საშუალებას გაძლევთ, ეს მოწყობილობაზე შეცვალოთ.\n\nგახსენით ის პარამეტრებში, „მოწყობილობის“ ქვეშ. ჯერ აირჩიეთ, სად მოქმედებს ცვლილება: „ყველგან“, „კითხვისას“, „მთავარ ეკრანზე“, „ბიბლიოთეკაში“ ან ერთ ხელსაწყოში. შემდეგ აირჩიეთ შეყვანა, მაგალითად, ხანგრძლივად დაჭერილი ღილაკი ან კიდიდან შიგნით გადაფურცვლა, და აირჩიეთ მოქმედება სიიდან, რომელშიც ძიება შეგიძლიათ. „სტანდარტულად“ აბრუნებს იმას, რასაც მოდულები და ღილაკების განლაგება ადგენს.\n\nX4-ზე უარყოფილია ცვლილება, რომლის შემდეგაც არ დარჩებოდა ღილაკი არჩევისთვის, უკან დასაბრუნებლად ან წინ წასასვლელად. ბოლოში „ღილაკებისა და ჟესტების ჩამოყრა“ ყველა ცვლილებას აუქმებს."
