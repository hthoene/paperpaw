wifi.plugin.name = Wi-Fi
wifi.plugin.description = საჭიროებისას უკავშირდება Wi-Fi ქსელებს და შემდეგ რადიოს გამორთავს.
wifi.plugin.how = "Wi-Fi ქსელს უკავშირდება, როცა მოდულს ინტერნეტი სჭირდება (კატალოგი, სინქრონიზაცია, მაღაზია, გადაცემა), და რადიოს გამორთავს ბოლო გამოყენებიდან ერთი წუთის შემდეგ, ან მაშინვე, როცა მთავარი ეკრანი ან წიგნი გამოჩნდება: ასე ზოგავს ბატარეას და მეხსიერებას.\n\nWi-Fi იხსნება პარამეტრებიდან ან სტატუსის ზოლში Wi-Fi-ის ელემენტიდან. „ქსელები“ აჩვენებს ხელმისაწვდომ ქსელებს; აირჩიეთ ერთ-ერთი და შეიყვანეთ მისი პაროლი, ან აირჩიეთ „დაყენება ტელეფონით“ და შეიყვანეთ სახელი და პაროლი ტელეფონის ბრაუზერში, მოწყობილობის ნაცვლად. „დავიწყება“ შენახულ ქსელს წაშლის.\n\nპაროლები ბარათზე უსაფრთხოდ ინახება და აღარასოდეს ჩანს. „დაკავშირება საჭიროებისას“ განყოფილებაში ადგენთ, რამდენ ხანს დარჩეს Wi-Fi ჩართული ბოლო გამოყენების შემდეგ, დარჩეს თუ არა ჩართული დატენვისას და რომელ შენახულ ქსელს დაუკავშირდეს პირველად, როცა რამდენიმე ხელმისაწვდომია."
