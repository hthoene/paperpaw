lock.plugin.name = ეკრანის დაბლოკვა
lock.plugin.description = PIN, ნიმუში ან პაროლი მოწყობილობის გაღვიძებისას; შეხების დაბლოკვა კითხვისას.
lock.plugin.how = "ეკრანის დაბლოკვა ითხოვს PIN-ს, ნიმუშს ან პაროლს PaperPaw-ის გაშვებისას და მოწყობილობის გაღვიძებისას. თავიდან ის გამორთულია. ის მხოლოდ შემთხვევით გამოყენებას იცავს: კოდი და არასწორი ცდების რაოდენობა SD ბარათზე ინახება, ამიტომ ვინც ბარათს ამოიღებს, შეცვლის ან გაცვლის, დაბლოკვას გვერდს აუვლის.\n\nდააყენეთ ის პარამეტრებში, „მოწყობილობის“ ქვეშ, „ეკრანის დაბლოკვა“: შეიყვანეთ მიმდინარე კოდი, თუ ასეთი არსებობს, აირჩიეთ სახეობა, შემდეგ ახალი კოდი ორჯერ. ნიმუში მხოლოდ სენსორულ ეკრანებზეა ხელმისაწვდომი.\n\nხუთი არასწორი ცდის შემდეგ მომდევნოს ნახევარი წუთი უნდა დაელოდოთ. „ახლა დაბლოკვა“ მაშინვე ბლოკავს და შეიძლება მიენიჭოს ღილაკს, ჟესტს ან წესს. „დაბლოკვა გაღვიძების შემდეგ“ შეიძლება გამოირთოს, რომ მხოლოდ ნამდვილმა გაშვებამ (ჩართვამ ან გადატვირთვამ) დაბლოკოს, გარდა იმ შემთხვევისა, როცა ყოველი გაღვიძება გაშვებაა, როგორც X4-ზე ბატარეით.\n\nშეხების დაბლოკვა, ამის გვერდით: „შეხების დაბლოკვა“ სწრაფ პანელსა და კითხვის მენიუში შეხებას, გადაფურცვლასა და კალამს უმოქმედოს ხდის, ღილაკები კი მუშაობს, მაგ. ეკრანზე ხელდადებული კითხვისთვის. განსაბლოკად ერთი თითით ორჯერ შეეხეთ და ცოტა ხანს ნუ აუშვებთ; ჩართვის ღილაკის ხანგრძლივად დაჭერა ხსნის კვების მენიუს, სადაც „შეხების განბლოკვა“ ამას ღილაკებით აკეთებს; X4 Pro-ზე მთავარი ღილაკის ხანგრძლივად დაჭერა მაშინვე განბლოკავს."
