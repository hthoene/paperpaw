store.plugin.name = მოდულების მაღაზია
store.plugin.description = პოულობს, აყენებს, ანახლებს და შლის მოდულებს ამ მოწყობილობისთვის.
store.plugin.how = "მოდულების მაღაზია ინტერნეტიდან აყენებს, ანახლებს და შლის ამ მოწყობილობის მოდულებს. გახსენით ის „ხელსაწყოებიდან“; საჭიროა Wi-Fi.\n\nსაწყის გვერდზე ჩანს რჩეულები, ახალი და პოპულარული, შემდეგ ჯგუფები. ჯგუფში რიგი ყოველდღე სამართლიანად ირევა, რომ ყველა გამოჩნდეს; დაალაგეთ ანბანურად, სიახლით ან განახლებით, გრძელ სიებში კი გადადით ასოზე. მოდულის გვერდზე ჩანს ზომა და საჭირო მეხსიერება; აირჩიეთ „დაყენება“, „განახლება“ ან „წაშლა“. „ყველას განახლება“ ყველაფერს აახლებს.\n\nკოდის მოდულებს სრული წვდომა აქვს: მაღაზია გაფრთხილებთ და ჯერ გეკითხებათ; ისინი გადატვირთვის შემდეგ ირთვება. თუ რომელიმე გაფუჭდება, PaperPaw მათ გარეშე ჩაირთვება და გეტყვით, რომელი იყო. „მოდულების ბიბლიოთეკა“ სიის წყაროს ადგენს.\n\n„საზოგადოების მოდულები“ (პარამეტრები › სისტემა) GitHub-ზე სხვების გამოქვეყნებულ მოდულებსაც აჩვენებს. ისინი მონიშნულია, როგორც „შეუმოწმებელი“; კოდის მოდულის გვერდზე ჩანს მისი გასაღები, სხვა გასაღებით ხელმოწერილი განახლება კი არ დაყენდება.\n\n„წყაროები“ (საწყისი გვერდის ბოლო სტრიქონი) ამატებს სხვების სიებს მისამართით (https://…/plugins.json), აჩვენებს ერთ-ერთს PaperPaw-ის სიის ნაცვლად ან შლის. ან ჩადეთ ბარათზე .paperpaw/plugins/store-ში ფაილი sources.txt, თითო მისამართი სტრიქონზე: ისინი „წყაროებში“ ახლად გამოჩნდება. PaperPaw წყაროებს არ ამოწმებს, მოწყობილობა კი მათ სერვერს უკავშირდება. ის იმახსოვრებს წყაროს პირველი სიის გასაღებს და შემდეგ მხოლოდ ამ გასაღებით ხელმოწერილ სიებსა და კოდის მოდულებს იღებს. მოდული განახლებებს მხოლოდ თავისი წყაროდან იღებს. PaperPaw-ის ბიბლიოთეკა ყოველთვის რჩება, არ იშლება და გასვლისას ისევ ის ჩანს."
