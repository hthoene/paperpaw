files.plugin.description = აჩვენებს მოწყობილობაზე არსებულ წიგნებსა და საქაღალდეებს და ხსნის მათ.
files.plugin.how = "ბიბლიოთეკა აჩვენებს თქვენი ბიბლიოთეკის საქაღალდის წიგნებს, თითოეულს ყდით, სათაურით, ავტორით და იმით, რამდენი გაქვთ წაკითხული. ბოლოს წაკითხული წიგნი ზემოთ ბარათად დგას, ასე რომ კითხვის გაგრძელებას ერთი შეხება ან „არჩევის“ ერთი დაჭერა სჭირდება. სანამ ბიბლიოთეკა წიგნებს ეძებს, აჩვენებს, რამდენი იპოვა აქამდე.\n\nაირჩიეთ, რა ჩანდეს წიგნების ზემოთ: ყველა, რომლებსაც კითხულობთ, წაუკითხავი ან წაკითხული, ან თაროები (ავტორის, სერიის, ჭდის, რჩეულების მიხედვით, თქვენ მიერ დაწყებული თითოეული სერიის შემდეგი წიგნი). წასაკითხად შეეხეთ წიგნს; ხანგრძლივად დააჭირეთ მას (ღილაკებით ხანგრძლივად დააჭირეთ „არჩევა“), რომ გახსნათ, მონიშნოთ წაკითხულად ან წაუკითხავად, ნახოთ მისი ინფორმაცია, გადაიტანოთ არქივში ან წაშალოთ. ბიბლიოთეკის მენიუსთვის შეეხეთ სათაურს: როგორ დალაგდეს და გამოჩნდეს წიგნები, ძიება, ბიბლიოთეკის საქაღალდე და პარამეტრები.\n\nბიბლიოთეკის საქაღალდე პარამეტრებში, „ბიბლიოთეკის“ ქვეშ, „ბიბლიოთეკის საქაღალდედ“ ყენდება; იქვე შეგიძლიათ წიგნები ყდების ბადედ აჩვენოთ. ყველა სხვა ფაილისთვის გამოიყენეთ „ფაილები“ ხელსაწყოების მენიუში."
