opds.plugin.name = OPDS კატალოგები
opds.plugin.description = ათვალიერებს OPDS კატალოგებს, ჩამოტვირთავს მათ წიგნებს და საქაღალდეებს მათთან სინქრონიზებულს ინახავს.
opds.plugin.how = "OPDS კატალოგები ონლაინ ბიბლიოთეკებია, როგორიცაა Project Gutenberg, Calibre-Web, Kavita ან Komga. ეს მოდული მათ საქაღალდეებივით ათვალიერებს და ეძებს, და მათ წიგნებს ბიბლიოთეკაში ჩამოტვირთავს.\n\nგახსენით „კატალოგები“ ხელსაწყოების მენიუდან და აირჩიეთ „კატალოგის დამატება“: მისამართი და, თუ კატალოგს ანგარიში სჭირდება, მომხმარებლის სახელი და პაროლი. კატალოგის დასათვალიერებლად შეეხეთ მას; სინქრონიზაციისთვის, რედაქტირებისთვის ან წასაშლელად ხანგრძლივად დააჭირეთ (ღილაკებით: გეჭიროთ „არჩევა“).\n\nთუ „ამ კატალოგის სინქრონიზაცია“ ჩართულია, „კატალოგების სინქრონიზაცია“ მის ახალ წიგნებს მის საქაღალდეში ჩამოტვირთავს. „წიგნები ერთ სინქრონიზაციაზე“ ზღუდავს, რამდენს ჩამოტვირთავს ერთი სინქრონიზაცია, რომ დიდმა კატალოგმა მოწყობილობა არ გაავსოს. კატალოგის ნაცვლად ღრუბლოვანი საქაღალდეც (WebDAV) გამოდგება."
