format-cbz.setting.panels.help = ერთდროულად ერთი კადრი, გადაფურცვლა მათზე გადადის.
format-docx.plugin.name = DOCX დოკუმენტები
format-docx.plugin.description = ხსნის .docx ფაილებს, როგორც მათ Word და სხვა პროგრამები ინახავს.
format-docx.plugin.how = "ხსნის .docx დოკუმენტებს წიგნებად: სათაურები სარჩევით, სიები, ცხრილები, მუქი და დახრილი, ბმულები და სურათები (JPEG, PNG, GIF).\n\nჩადეთ ფაილები ბიბლიოთეკის საქაღალდეში და გახსენით ბიბლიოთეკიდან. სათაური და ავტორი დოკუმენტის თვისებებიდან მოდის. სქოლიოები, ზედა და ქვედა კოლონტიტულები და კომენტარები არ ჩანს."
format-docx.title = DOCX დოკუმენტი
format-epub.plugin.name = EPUB
format-epub.plugin.description = ხსნის EPUB წიგნებს მათი სტილებით, სარჩევითა და სურათებით.
format-epub.plugin.how = "EPUB წიგნები ბიბლიოთეკიდან ისე იხსნება, როგორც ნებისმიერი სხვა წიგნი, მათი სარჩევით, სურათებითა და გამომცემლის გაფორმებით. ვებგვერდები (HTML), Markdown, FictionBook (.fb2) და კომიქსების არქივები (.cbz) ასევე იხსნება, თითოეული საკუთარი მოდულით.\n\nთავი პირველი გახსნისას გარდაიქმნება და მოდულის ქეშში ინახება, ამიტომ შემდეგ უფრო სწრაფად იხსნება და დიდი წიგნებიც მუშაობს პატარა მოწყობილობებზე. სარჩევი კითხვის მენიუში, „სარჩევის“ ქვეშაა. წიგნის საკუთარი გაფორმება გამოიყენება თუ არა, ამას განსაზღვრავს პარამეტრი „გამომცემლის ფორმატირება“, „კითხვის“ ქვეშ."
format-epub.title = EPUB ელწიგნი
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = ხსნის FictionBook წიგნებს (.fb2, დაარქივებულსაც).
format-fb2.plugin.how = "ხსნის FictionBook წიგნებს (.fb2), რომლებიც რუსული და სხვა წიგნებისთვის გავრცელებულია, ასევე დაარქივებულს (.fb2.zip), მათი სათაურით, ავტორებით, ყდითა და თავებით.\n\nჩადეთ ისინი ბიბლიოთეკის საქაღალდეში; ისინი ბიბლიოთეკაში გამოჩნდება და ისე გაიხსნება, როგორც ნებისმიერი სხვა წიგნი."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ხსნის ფაილებად შენახულ ვებგვერდებს და აჩვენებს მხოლოდ წასაკითხს.
format-html.plugin.how = "ხსნის ფაილებად შენახულ ვებგვერდებს (.html, .htm, .xhtml) წიგნებად: მხოლოდ იმას, რაც წასაკითხია, გარშემო მენიუების, რეკლამებისა და მსგავსის გარეშე.\n\nჩადეთ ფაილი ბიბლიოთეკის საქაღალდეში და გახსენით ბიბლიოთეკიდან, როგორც ნებისმიერი წიგნი. გვერდის შიდა ბმულები მუშაობს; სურათები იქ ჩანს, სადაც ფაილში არიან."
format-html.title = ვებგვერდი (HTML)
format-images.plugin.name = სურათები
format-images.plugin.description = ხსნის სურათებს (.jpg, .png, .gif) წიგნებად, თითოს ცალკე გვერდზე.
format-images.plugin.how = "სურათები (.jpg, .png, .gif) ბიბლიოთეკიდან წიგნებივით იხსნება, თითო სურათი გვერდზე, ეკრანზე მორგებული.\n\nსურათების მთელი საქაღალდის წასაკითხად გახსენით მისი პირველი სურათი: საქაღალდეში მის შემდეგ მყოფი სურათები მოჰყვება, სახელების მიხედვით (2 10-ის წინ). საქაღალდის შუაში მყოფი სურათი იქიდან იწყებს; ადგილი თითოეულში ცალკე ინახება. 300 სურათამდე საქაღალდე იკითხება იმ სურათიდან, რომელსაც ხსნით.\n\nფაილი, რომელიც სურათი არ არის ან ძალიან დიდია, სურათის ნაცვლად თავის სახელს აჩვენებს. მრავალსურათიანი წიგნისთვის საკუთარი სათაურით კომიქსის არქივი (.cbz) უკეთესი ფორმაა."
format-images.title = სურათი
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = ხსნის Markdown ფაილებს (.md), მაგ. შენიშვნებს.
format-markdown.plugin.how = "ხსნის Markdown ფაილებს (.md), მაგალითად შენიშვნებს, წიგნებად: სათაურები, სიები, ციტატები და გამოყოფა ისე ჩანს, როგორც ჩაფიქრებულია, და არა ნიშნებად.\n\nჩადეთ ფაილები ბიბლიოთეკის საქაღალდეში და გახსენით ბიბლიოთეკიდან. პირველი სათაური მისი სათაურია; ფაილის გვერდით მდებარე სურათები იქ ჩანს, სადაც ტექსტი მათ ასახელებს."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI წიგნები
format-mobi.plugin.description = ხსნის .mobi და .azw ფაილებს DRM-ის გარეშე.
format-mobi.plugin.how = "MOBI წიგნები (.mobi, .azw) ბიბლიოთეკიდან ისე იხსნება, როგორც ნებისმიერი წიგნი, არაფრის მორგება არ არის საჭირო. სათაური, ავტორები, ენა და ყდა წიგნიდან მოდის, სარჩევი კი მისი სათაურებისგან დგება.\n\nწიგნი პირველი გახსნისას გარდაიქმნება, რასაც გრძელ წიგნზე რამდენიმე წამი სჭირდება; ამის შემდეგ ის მაშინვე იხსნება. ნაჩვენებია ტექსტი, სათაურები, მუქი და დახრილი შრიფტი, ბმულები და სურათები.\n\nDRM-იანი წიგნები (მაღაზიაში ნაყიდი წიგნების უმეტესობა) ვერ გაიხსნება, ასევე Huffman-შეკუმშვით ან ახალი KF8 ფორმით (.azw3) შენახული წიგნები: PaperPaw ამას გახსნისას გეტყვით. EPUB ასლი, რომელიც მაგალითად Calibre-ით არის გაკეთებული, ყოველთვის იხსნება."
format-mobi.title = MOBI წიგნები
