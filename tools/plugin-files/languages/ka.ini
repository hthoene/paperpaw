menu-editor.plugin.name = მენიუს რედაქტორი
menu-editor.plugin.description = ყოველი მენიუს ჩანაწერების გადალაგება, წაშლა და დამატება.
menu-editor.plugin.how = "მენიუს რედაქტორი ცვლის მენიუების შიგთავსს: გადაიტანეთ ჩანაწერები ზემოთ ან ქვემოთ, წაშალეთ ისინი ან დაამატეთ ახლები.\n\nის პარამეტრებშია, „მორგების“ ქვეშ, როგორც „მენიუების მორგება“. აირჩიეთ მენიუ, შემდეგ ჩანაწერი მის გადასატანად ან წასაშლელად; „ჩანაწერის დამატება“ ახალს ამატებს. ცვლილებები მაშინვე მოქმედებს. „ამ მენიუს ჩამოყრა“ მენიუს იმ სახეს უბრუნებს, როგორც მისი მოდულები განსაზღვრავს, „ყველა მენიუს ჩამოყრა“ ამას ყველასთვის აკეთებს.\n\nსაკუთარ თავს ვერ ჩაკეტავთ: ჩანაწერი, რომელიც პარამეტრებისკენ მიმავალი გზაა, რჩება, სანამ მათკენ სხვა გზას არ დაამატებთ."
