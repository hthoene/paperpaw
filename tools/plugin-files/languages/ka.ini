bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = აწყვილებს და აკავშირებს პულტებს, კლავიატურებსა და სენსორებს.
bluetooth.plugin.how = "Bluetooth აწყვილებს პულტებს, კლავიატურებსა და სენსორებს წამკითხველთან, თუ მას Bluetooth აქვს (X4 Pro).\n\n„მოწყობილობის დამატება“ ეძებს იმას, რაც ახლოსაა; ჯერ მოწყობილობა დაწყვილების რეჟიმში გადაიყვანეთ. აირჩიეთ ის და დაადასტურეთ წამკითხველზე (შეადარეთ რიცხვი, თუ ჩანს). ამის შემდეგ პულტის ან კლავიატურის ღილაკები ფურცლავს გვერდებს და მენიუებში გადაადგილდება; რას აკეთებს თითოეული ღილაკი, შეცვალეთ „მართვაში“.\n\n„პულტები“ განსაზღვრავს, როდის მუშაობს მათი ღილაკები: აქ ჩართვისას, კითხვისას (დაკავშირებულია, სანამ წიგნი ღიაა, და ბატარეას ზოგავს) ან ყოველთვის. მოწყობილობაზე მენიუს ღილაკი ან ხანგრძლივი დაჭერა მას დაივიწყებს.\n\nსენსორი მოდულებისთვისაა: ჩართეთ, რომელ მოდულს შეუძლია მისი გამოყენება. Bluetooth გამორთულია, როცა მას არაფერი იყენებს."
