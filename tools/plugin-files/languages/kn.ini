transfer.plugin.name = ವರ್ಗಾವಣೆ
transfer.plugin.description = ಅದೇ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿರುವ ಬ್ರೌಸರ್ನಿಂದ ಪುಸ್ತಕಗಳು ಮತ್ತು ಇತರ ಫೈಲ್ಗಳನ್ನು ಸಾಧನಕ್ಕೆ ಹಾಕಿ.
transfer.plugin.how = "Wi-Fi ವರ್ಗಾವಣೆ ಅದೇ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿರುವ ಬ್ರೌಸರ್ನಿಂದ, ಕೇಬಲ್ ಅಥವಾ ಆಪ್ ಇಲ್ಲದೆ, ಪುಸ್ತಕಗಳು ಮತ್ತು ಇತರ ಫೈಲ್ಗಳನ್ನು ಸಾಧನಕ್ಕೆ ಹಾಕುತ್ತದೆ. ಫೈಲ್ಗಳನ್ನು ಪಡೆಯಲು, ಫೋಲ್ಡರ್ ಮಾಡಲು ಮತ್ತು ಅಳಿಸಲು ಕೂಡ ಸಾಧ್ಯ.\n\nಪರಿಕರಗಳಿಂದ ತೆರೆಯಿರಿ. ಸ್ಕ್ರೀನ್ ಒಂದು ವಿಳಾಸವನ್ನು ಪಠ್ಯವಾಗಿ ಮತ್ತು QR ಕೋಡ್ ಆಗಿ ತೋರಿಸುತ್ತದೆ: ಫೋನ್ ಅಥವಾ ಕಂಪ್ಯೂಟರ್ನ ಬ್ರೌಸರ್ನಲ್ಲಿ ಅದನ್ನು ತೆರೆಯಿರಿ, ಅಥವಾ ಕೋಡ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ. ವಿಳಾಸದಲ್ಲಿ ಪ್ರತಿ ಬಾರಿ ಹೊಸದಾಗಿ ಮಾಡುವ ಕೀ ಇರುತ್ತದೆ, ಆದ್ದರಿಂದ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿರುವ ಇತರರು ನಿಮ್ಮ ಫೈಲ್ಗಳನ್ನು ತಲುಪಲಾರರು. ಸ್ಕ್ರೀನ್ ತೆರೆದಿರುವವರೆಗೆ ವರ್ಗಾವಣೆ ನಡೆಯುತ್ತದೆ.\n\nX4 ನಂತೆ PaperPaw ತಾನೇ Wi-Fi ನಡೆಸುವಲ್ಲಿ, ಕೆಳಗಿನ ರೂಟರ್ ಇಲ್ಲದೆ ಸಾಧನದ ಸ್ವಂತ ನೆಟ್ವರ್ಕ್ ತೆರೆಯುತ್ತದೆ; ಫೋನ್ ಒಂದು ಕೋಡ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ ಅದನ್ನು ಸೇರುತ್ತದೆ."
