widgets.plugin.name = ವಿಜೆಟ್ ಪ್ಯಾಕ್
widgets.plugin.description = ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ಇನ್ನೂ ಹಲವು ವಿಜೆಟ್ಗಳು: ಗಡಿಯಾರಗಳು, ಕ್ಯಾಲೆಂಡರ್, ಉಲ್ಲೇಖಗಳು, ಪುಸ್ತಕಗಳು, ಟಿಪ್ಪಣಿಗಳು ಮತ್ತು ಇನ್ನಷ್ಟು.
widgets.plugin.how = "ವಿಜೆಟ್ ಪ್ಯಾಕ್ ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ಹಲವು ವಿಜೆಟ್ಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ: ಗಡಿಯಾರಗಳು (ಮುಳ್ಳಿನ, ಪದ, ಟೈಲ್, ವಿಶ್ವ), ಕ್ಯಾಲೆಂಡರ್, ಈ ವರ್ಷ ಇಲ್ಲಿಯವರೆಗೆ, ಕೌಂಟ್ಡೌನ್, ಚಂದ್ರನ ಕಲೆ, ದಿನ ಮತ್ತು ದಿನಾಂಕ; ಇಂದಿನ ಉಲ್ಲೇಖ, ಟಿಪ್ಪಣಿಗಳು, ಮಾಡಬೇಕಾದವು, ಚಿತ್ರಗಳು, ಶುಭಾಶಯ ಮತ್ತು PaperPaw ಲೋಗೋ; ಮತ್ತು ಪುಸ್ತಕಗಳಿಗೆ, ಈಗ ಓದುತ್ತಿರುವುದು, ಪ್ರಗತಿ, ಮುಂದಿನದು, ಸರಣಿ, ಮೆಚ್ಚಿನವು, ಒಂದು ಹೈಲೈಟ್ ಮತ್ತು ಅಂಕಿಗಳಲ್ಲಿ ಲೈಬ್ರರಿ. ಬ್ಯಾಟರಿ ವಿಜೆಟ್ ಕೂಡ ಇದೆ.\n\nಮೆನುವಿನಲ್ಲಿ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಸಂಪಾದಿಸಿ (ಅಥವಾ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಒತ್ತಿಹಿಡಿಯಿರಿ), ನಂತರ ವಿಜೆಟ್ ಸೇರಿಸಿ ಮೂಲಕ ಅವುಗಳನ್ನು ಸೇರಿಸಿ. ಪ್ರತಿಯೊಂದಕ್ಕೂ ಚೌಕಟ್ಟು, ಗಾತ್ರ, ಜೋಡಣೆಯಂತಹ ತನ್ನದೇ ಸೆಟ್ಟಿಂಗ್ಗಳಿವೆ. ಇಂದಿನ ಉಲ್ಲೇಖದಂತೆ ಬದಲಾಗುವ ವಿಜೆಟ್ ಅನ್ನು ಆಯ್ಕೆಮಾಡಿದರೆ ಮುಂದಿನದು ತೋರುತ್ತದೆ. ನಿಮ್ಮ ಸ್ವಂತ ಉಲ್ಲೇಖಗಳು ಕಾರ್ಡ್ನ .paperpaw/plugins/widgets ನಲ್ಲಿನ quotes.txt ಗೆ ಹೋಗುತ್ತವೆ, ಪ್ರತಿ ಸಾಲು ಪಠ್ಯ | ಲೇಖಕ ಆಗಿ. ಸಮಯದ ವಿಜೆಟ್ಗಳಿಗೆ ಗಡಿಯಾರ ಹೊಂದಿಸಿರಬೇಕು; Wi-Fi ಅದನ್ನು ಹೊಂದಿಸುತ್ತದೆ."
