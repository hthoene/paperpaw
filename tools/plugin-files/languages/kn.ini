update.plugin.name = ಅಪ್ಡೇಟ್
update.plugin.description = ಕಾರ್ಡ್ನಿಂದ ಅಥವಾ ಇಂಟರ್ನೆಟ್ನಿಂದ ಡೌನ್ಲೋಡ್ ಮಾಡಿದ ಫರ್ಮ್ವೇರ್ ಅಪ್ಡೇಟ್ಗಳನ್ನು ಇನ್ಸ್ಟಾಲ್ ಮಾಡುತ್ತದೆ.
update.plugin.how = "PaperPaw ಫರ್ಮ್ವೇರ್ ಆಗಿರುವ ಸಾಧನಗಳಲ್ಲಿ (ಉದಾ. X4) ಅಪ್ಡೇಟ್ ಹೊಸ ಫರ್ಮ್ವೇರ್ ಇನ್ಸ್ಟಾಲ್ ಮಾಡುತ್ತದೆ. ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಅಪ್ಡೇಟ್ ಆಗಿ ಸಿಗುತ್ತದೆ.\n\nಆನ್ಲೈನ್ನಲ್ಲಿ ಹುಡುಕಿ ಹೊಸ PaperPaw ಅನ್ನು Wi-Fi ಮೂಲಕ ಕೆಲವು ನಿಮಿಷಗಳಲ್ಲಿ ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ. ಅಥವಾ ಅಪ್ಡೇಟ್ ಫೈಲ್ (.bin, paperpaw.org ನಿಂದ) ಅನ್ನು ಕಾರ್ಡ್ನ updates ಫೋಲ್ಡರ್ಗೆ ನಕಲಿಸಿ, ಉದಾ. Wi-Fi ವರ್ಗಾವಣೆಯಿಂದ. ಇನ್ಸ್ಟಾಲ್ ಸುಮಾರು ಒಂದು ನಿಮಿಷ, ನಂತರ ಸಾಧನ ಮರುಪ್ರಾರಂಭವಾಗುತ್ತದೆ; ಪುಸ್ತಕಗಳು, ಸೆಟ್ಟಿಂಗ್ಗಳು, ಓದಿದ ಸ್ಥಾನಗಳು ಉಳಿಯುತ್ತವೆ.\n\nಅಪ್ಡೇಟ್ಗಳಿಗಾಗಿ ನೋಡಿ ಆನ್ ಇದ್ದರೆ (ಮೊದಲು ಆಫ್), ಸಾಧನ ವಾರಕ್ಕೊಮ್ಮೆ ತಾನಾಗಿ ಕೇಳುತ್ತದೆ, Wi-Fi ಆನ್ ಇದ್ದಾಗ ಅಥವಾ ಚಾರ್ಜ್ ಆಗುವಾಗ ಮಾತ್ರ. ಸಿಕ್ಕ ಹೊಸ PaperPaw ಇಲ್ಲಿ ಕಾಯುತ್ತದೆ; ಓದುವಿಕೆಗೆ ಅಡ್ಡಿಯಿಲ್ಲ. ಹುಡುಕಾಟ ಸಾಧನದಲ್ಲಿ ಚಲಿಸುವ ಆವೃತ್ತಿಯನ್ನು ಕಳುಹಿಸುತ್ತದೆ, ಸಾಧನದ ಹೆಸರು ಅಥವಾ ಸಂಖ್ಯೆ ಅಲ್ಲ; ಸಾಧನಗಳ ಎಣಿಕೆಗಾಗಿ, ನೀವು ಕೇಳಿದ್ದೀರಾ ಮತ್ತು ಇದು ದಿನ, ವಾರ ಅಥವಾ ತಿಂಗಳ ಮೊದಲ ಹುಡುಕಾಟವೇ ಎಂಬುದನ್ನೂ.\n\nನೀವು ಬಳಸುವ ಪ್ಲಗಿನ್ಗಳಿಗೆ ಹೊಸ ಆವೃತ್ತಿ ಇನ್ನೂ ಇಲ್ಲದಿದ್ದರೆ ಅಪ್ಡೇಟ್ ಕಾಯುತ್ತದೆ. ಹಳೆಯ ಆವೃತ್ತಿ ನೀವು ಆರಿಸಿದರೆ ಮಾತ್ರ ಇನ್ಸ್ಟಾಲ್ ಆಗುತ್ತದೆ.\n\nCrossPoint ನಂತಹ ಬೇರೆ ಫರ್ಮ್ವೇರ್ ಕೂಡ ಇಲ್ಲಿಂದ ಇನ್ಸ್ಟಾಲ್ ಆಗುತ್ತದೆ: ಅದರ .bin ಫೈಲ್ ಅನ್ನು updates ಗೆ ಹಾಕಿ ಅಪ್ಡೇಟ್ ತೆರೆಯಿರಿ. ಅದು ಈ ಸಾಧನಕ್ಕೆ ಪೂರ್ಣ, ಹಾಳಾಗದ ಫರ್ಮ್ವೇರ್ ಎಂದು PaperPaw ಪರಿಶೀಲಿಸುತ್ತದೆ, ಆದರೆ ಸಹಿ ಇಲ್ಲದ್ದರಿಂದ ಯಾರು ಮಾಡಿದರು ಎಂದು ಹೇಳಲಾಗದು. ಆದರೂ ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ ಅದನ್ನು ಫ್ಲ್ಯಾಶ್ನ ಇನ್ನೊಂದು ಅರ್ಧಕ್ಕೆ ಬರೆದು ಪ್ರಾರಂಭಿಸುತ್ತದೆ; ಆ ಫರ್ಮ್ವೇರ್ ಅದರ ಮೇಲೆ ಏನನ್ನಾದರೂ ಇನ್ಸ್ಟಾಲ್ ಮಾಡುವವರೆಗೆ PaperPaw ತನ್ನ ಅರ್ಧದಲ್ಲಿ ಉಳಿಯುತ್ತದೆ. PaperPaw ಗೆ ಮರಳಲು ಆ ಫರ್ಮ್ವೇರ್ನ ಮೆನುವಿನಿಂದ (ಉದಾ. CrossPoint ನ SD firmware update) paperpaw-<device>-<version>-install.bin ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ."
