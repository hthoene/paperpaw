picture-home.plugin.name = ಚಿತ್ರ ಹೋಮ್ ಸ್ಕ್ರೀನ್
picture-home.plugin.description = ವಿಜೆಟ್ಗಳ ಹಿಂದೆ ನಿಮ್ಮದೇ ಚಿತ್ರ ಮತ್ತು ನೀವು ಹೊಂದಿಸುವ ಸ್ಥಿತಿ ಪಟ್ಟಿಯೊಂದಿಗೆ ಹೋಮ್ ಸ್ಕ್ರೀನ್.
picture-home.plugin.how = "ಆನ್ ಇರುವಾಗ ಚಿತ್ರ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅನ್ನು ಬದಲಾಯಿಸುತ್ತದೆ: ವಿಜೆಟ್ಗಳ ಹಿಂದೆ ನಿಮ್ಮದೇ ಚಿತ್ರ, ನೀವು ಜೋಡಿಸುವ ವಿಜೆಟ್ಗಳು ಮತ್ತು ಪರಿಕರಗಳ ಪುಟಗಳು. ಪ್ಲಗಿನ್ ಮ್ಯಾನೇಜರ್ನಲ್ಲಿ ಆಫ್ ಮಾಡಿದರೆ ಮೂಲ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅದರ ಪುಟಗಳೊಂದಿಗೆ ಮರಳುತ್ತದೆ.\n\nಕಾರ್ಡ್ನ ಫೋಲ್ಡರ್ನಲ್ಲಿ (ಡೀಫಾಲ್ಟ್ wallpapers) JPEG, PNG ಅಥವಾ GIF ಚಿತ್ರಗಳನ್ನು ಹಾಕಿ, ಸೆಟ್ಟಿಂಗ್ಗಳು › ಕಸ್ಟಮೈಸ್ › ಚಿತ್ರ ಹೋಮ್ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಒಂದನ್ನು ಆಯ್ಕೆಮಾಡಿ. ಹೊಂದಿಕೆ: ಸ್ಕ್ರೀನ್ ಹೇಗೆ ತುಂಬುತ್ತದೆ (ತುಂಬಿಸಿ, ಪೂರ್ಣ ಚಿತ್ರ, ಹಿಗ್ಗಿಸಿ, ಮೂಲ ಗಾತ್ರ, ಟೈಲ್); ಸ್ಥಾನ: ಯಾವ ಭಾಗ ಉಳಿಯುತ್ತದೆ; ಜೂಮ್: ಎಷ್ಟು ದೊಡ್ಡದು; ಚಿತ್ರ ತಿಳಿಗೊಳಿಸಿ: ಎಷ್ಟು ತಿಳಿ (ತಿಳಿ ಚಿತ್ರದಲ್ಲಿ ವಿಜೆಟ್ಗಳು ಸುಲಭವಾಗಿ ಓದುತ್ತವೆ). ಪ್ರತಿ ಸ್ಕ್ರೀನ್ ಗಾತ್ರಕ್ಕೆ ಚಿತ್ರವನ್ನು ಒಮ್ಮೆ ಸಿದ್ಧಪಡಿಸಲಾಗುತ್ತದೆ.\n\nವಿಜೆಟ್ಗಳು ಚಿತ್ರದ ಮೇಲಿನ ಫಲಕಗಳಲ್ಲಿ ಇರುತ್ತವೆ. ಪುಟವನ್ನು ಪುಟದ ಕೆಳಗಿನ ಪೆನ್ಸಿಲ್ನಿಂದ ಅಥವಾ ಮೆನುವಿನ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಎಡಿಟ್ ಮಾಡಿ ಮೂಲಕ ಜೋಡಿಸಿ.\n\nಸ್ಥಿತಿ ಪಟ್ಟಿ (ಸಮಯ, Wi-Fi, ಬ್ಯಾಟರಿ ಅಥವಾ ನೀವು ಆರಿಸಿದ್ದು): ಆನ್, ಆಫ್ ಅಥವಾ ಸ್ವಯಂಚಾಲಿತ; ಮೇಲೆ ಅಥವಾ ಕೆಳಗೆ; ಪೂರ್ಣ ಅಗಲ ಅಥವಾ ಎಡ, ಮಧ್ಯ, ಬಲದಲ್ಲಿ ಸಣ್ಣ ಪಟ್ಟಿ; ತಿಳಿ, ಗಾಢ, ಬೂದು ಫಲಕದ ಮೇಲೆ ಅಥವಾ ಚಿತ್ರದ ಮೇಲೆಯೇ. ಬಟನ್ಗಳ ಸಾಲು (X4) ಕೂಡ ಆನ್, ಆಫ್ ಅಥವಾ ಸ್ವಯಂಚಾಲಿತ. ಸ್ವಯಂಚಾಲಿತ: ಬಟನ್ ಒತ್ತಿದಾಗ ಕೆಲವು ಸೆಕೆಂಡು ತೋರಿಸುತ್ತದೆ; ಆ ಒತ್ತುವಿಕೆ ಬೇರೇನೂ ಮಾಡುವುದಿಲ್ಲ.\n\nಚಿತ್ರ ರೆಂಡರಿಂಗ್: ಬೂದು ಛಾಯೆಗಳು (X4 ನಲ್ಲಿ ನಿಧಾನ), ಚುಕ್ಕೆಗಳಲ್ಲಿ (ಕಪ್ಪು-ಬಿಳಿ ಚುಕ್ಕೆಗಳು, ವೇಗ), ಅಥವಾ ಸ್ವಯಂಚಾಲಿತ: ಮೂಲ ಹೋಮ್ ಸ್ಕ್ರೀನ್ನಂತೆ, ಮೊದಲು ಛಾಯೆಗಳು, ಮೊದಲ ಬದಲಾವಣೆಯ ನಂತರ ಚುಕ್ಕೆಗಳು. ಬೂದು ಛಾಯೆಗಳಿಲ್ಲದ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಚುಕ್ಕೆಗಳು ಬಳಕೆಯಾಗುತ್ತವೆ."
