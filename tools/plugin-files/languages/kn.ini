dictionary.plugin.name = ನಿಘಂಟು
dictionary.plugin.description = StarDict ನಿಘಂಟುಗಳಲ್ಲಿ ಪದಗಳನ್ನು ಹುಡುಕುತ್ತದೆ.
dictionary.plugin.how = "ನಿಘಂಟು ಪುಸ್ತಕದ ಪದವನ್ನು StarDict ನಿಘಂಟುಗಳಲ್ಲಿ ಹುಡುಕಿ, ಸ್ಕ್ರೀನ್ನ ಕೆಳಭಾಗದ ಮೇಲಿನ ಪ್ಯಾನೆಲ್ನಲ್ಲಿ ಅರ್ಥಗಳನ್ನು ತೋರಿಸುತ್ತದೆ.\n\nರೀಡರ್ನಲ್ಲಿ ಪದವನ್ನು ಒತ್ತಿಹಿಡಿದು “ಅರ್ಥ ನೋಡಿ” ಆಯ್ಕೆಮಾಡಿ; ಬಟನ್ಗಳಿಂದ “ಇನ್ನಷ್ಟು” ಅಡಿಯ “ಪಠ್ಯ ಆಯ್ಕೆಮಾಡಿ” ಬಳಸಿ. ನಿಘಂಟು ಫೋಲ್ಡರ್ಗಳನ್ನು (.ifo, .idx ಮತ್ತು .dict ಫೈಲ್ಗಳೊಂದಿಗೆ) ಸಾಧನದ \"dictionaries\" ಫೋಲ್ಡರ್ಗೆ (ಉಪಫೋಲ್ಡರ್ಗಳೂ ಸರಿ) ನಕಲಿಸಿ, ಅಥವಾ ಸೆಟ್ಟಿಂಗ್ಗಳ “ಓದುವಿಕೆ” ಅಡಿಯಲ್ಲಿ “ನಿಘಂಟು ಫೋಲ್ಡರ್” (ಸುಧಾರಿತ ಸೆಟ್ಟಿಂಗ್) ಆಗಿ ಬೇರೆ ಫೋಲ್ಡರ್ ಆಯ್ಕೆಮಾಡಿ. ಮೊದಲ ಹುಡುಕಾಟವು ಪ್ರತಿ ನಿಘಂಟಿಗೆ ಸಣ್ಣ ಸೂಚಿಯನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತದೆ, ಇದಕ್ಕೆ ಸ್ವಲ್ಪ ಸಮಯ ಬೇಕು.\n\nಪ್ಯಾನೆಲ್ನಲ್ಲಿ ಪುಟ ಬಟನ್ಗಳು ಅಥವಾ “ಮೇಲೆ” ಮತ್ತು “ಕೆಳಗೆ” ದೀರ್ಘ ಅರ್ಥಗಳನ್ನು ಸ್ಕ್ರಾಲ್ ಮಾಡುತ್ತವೆ, “ಹಿಂದೆ” ಅದನ್ನು ಮುಚ್ಚುತ್ತದೆ. ಟಚ್ನಲ್ಲಿ ಮುಚ್ಚಲು ಅದರ ಹೊರಗೆ ಟ್ಯಾಪ್ ಮಾಡಿ."
