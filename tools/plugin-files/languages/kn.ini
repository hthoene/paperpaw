format-cbz.plugin.how = "ಕಾಮಿಕ್ ಪುಸ್ತಕ ಆರ್ಕೈವ್ಗಳನ್ನು (.cbz) ತೆರೆಯುತ್ತದೆ: ಪ್ರತಿ ಪುಟಕ್ಕೆ ಒಂದು ಚಿತ್ರ, ಸ್ಕ್ರೀನ್ಗೆ ಹೊಂದಿಸಿ, ಹೆಸರುಗಳ ಕ್ರಮದಲ್ಲಿ (10 ಕ್ಕಿಂತ ಮೊದಲು 2).\n\nಅವುಗಳನ್ನು ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯಿರಿ; ಯಾವುದೇ ಪುಸ್ತಕದಂತೆ ಪುಟ ತಿರುಗಿಸಿ. ದೊಡ್ಡ ಚಿತ್ರಗಳಿಗೆ ಮೊದಲ ಬಾರಿ ಸ್ವಲ್ಪ ಸಮಯ ಬೇಕು, X4 ನಲ್ಲಿ ಬೇರೆಡೆಗಿಂತ ಹೆಚ್ಚು.\n\nಓದುವ ಸೆಟ್ಟಿಂಗ್ಗಳು (ಸೆಟ್ಟಿಂಗ್ಗಳು, ಓದುವಿಕೆ): “ಪ್ಯಾನೆಲ್ ನಂತರ ಪ್ಯಾನೆಲ್” ಪುಟದ ಒಂದು ಪ್ಯಾನೆಲ್ ಅನ್ನು ಒಮ್ಮೆಗೆ, ಸ್ಕ್ರೀನ್ ಅನುಮತಿಸುವಷ್ಟು ದೊಡ್ಡದಾಗಿ ತೋರಿಸುತ್ತದೆ, ಪುಟ ತಿರುಗಿಸುವಿಕೆ ಅವುಗಳ ಮೂಲಕ ಸಾಗುತ್ತದೆ; ಪ್ಯಾನೆಲ್ಗಳಿಲ್ಲದ ಪುಟವನ್ನು ಪೂರ್ತಿ ತೋರಿಸಲಾಗುತ್ತದೆ. “ಕಾಮಿಕ್ ಪುಟಗಳ ದಿಕ್ಕು” ಮಾಂಗಾಗಾಗಿ (ಬಲದಿಂದ ಎಡಕ್ಕೆ) ಪುಟ ತಿರುಗಿಸುವಿಕೆಯನ್ನು ತಿರುವುಮುರುವು ಮಾಡುತ್ತದೆ; ಪುಸ್ತಕದ ಸ್ವಂತ ComicInfo.xml ಇದನ್ನು ತಾನಾಗಿ ತಿಳಿಸುತ್ತದೆ. ಲೈಬ್ರರಿ ComicInfo.xml ನಿಂದ ಪುಸ್ತಕದ ಶೀರ್ಷಿಕೆ, ಸರಣಿ ಮತ್ತು ಸಂಖ್ಯೆಯನ್ನು ತೋರಿಸುತ್ತದೆ."
