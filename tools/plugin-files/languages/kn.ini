opds.plugin.name = OPDS ಕ್ಯಾಟಲಾಗ್ಗಳು
opds.plugin.description = OPDS ಕ್ಯಾಟಲಾಗ್ಗಳನ್ನು ಬ್ರೌಸ್ ಮಾಡುತ್ತದೆ, ಅವುಗಳ ಪುಸ್ತಕಗಳನ್ನು ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ ಮತ್ತು ಫೋಲ್ಡರ್ಗಳನ್ನು ಅವುಗಳೊಂದಿಗೆ ಸಿಂಕ್ ಆಗಿರಿಸುತ್ತದೆ.
opds.plugin.how = "OPDS ಕ್ಯಾಟಲಾಗ್ಗಳು Project Gutenberg, Calibre-Web, Kavita ಅಥವಾ Komga ನಂತಹ ಆನ್ಲೈನ್ ಲೈಬ್ರರಿಗಳು. ಈ ಪ್ಲಗಿನ್ ಅವುಗಳನ್ನು ಫೋಲ್ಡರ್ಗಳಂತೆ ಬ್ರೌಸ್ ಮಾಡುತ್ತದೆ, ಹುಡುಕುತ್ತದೆ ಮತ್ತು ಅವುಗಳ ಪುಸ್ತಕಗಳನ್ನು ಲೈಬ್ರರಿಗೆ ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ.\n\nಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ ಕ್ಯಾಟಲಾಗ್ಗಳನ್ನು ತೆರೆದು ಕ್ಯಾಟಲಾಗ್ ಸೇರಿಸಿ ಆಯ್ಕೆಮಾಡಿ: ವಿಳಾಸ, ಮತ್ತು ಕ್ಯಾಟಲಾಗ್ಗೆ ಖಾತೆ ಬೇಕಿದ್ದರೆ ಬಳಕೆದಾರ ಹೆಸರು ಮತ್ತು ಪಾಸ್ವರ್ಡ್. ಬ್ರೌಸ್ ಮಾಡಲು ಕ್ಯಾಟಲಾಗ್ ಅನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; ಸಿಂಕ್ ಮಾಡಲು, ಎಡಿಟ್ ಮಾಡಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಅದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಲ್ಲಿ ಆಯ್ಕೆ ಒತ್ತಿಹಿಡಿಯಿರಿ).\n\nಈ ಕ್ಯಾಟಲಾಗ್ ಸಿಂಕ್ ಮಾಡಿ ಆನ್ ಇದ್ದರೆ, ಕ್ಯಾಟಲಾಗ್ಗಳನ್ನು ಸಿಂಕ್ ಮಾಡಿ ಅದರ ಹೊಸ ಪುಸ್ತಕಗಳನ್ನು ಅದರ ಫೋಲ್ಡರ್ಗೆ ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ. ದೊಡ್ಡ ಕ್ಯಾಟಲಾಗ್ ಸಾಧನವನ್ನು ತುಂಬದಂತೆ, ಪ್ರತಿ ಸಿಂಕ್ಗೆ ಪುಸ್ತಕಗಳು ಒಂದು ಸಿಂಕ್ ಎಷ್ಟು ಪಡೆಯಬಹುದು ಎಂದು ಮಿತಿಗೊಳಿಸುತ್ತದೆ. ಕ್ಯಾಟಲಾಗ್ ಬದಲು ಕ್ಲೌಡ್ ಫೋಲ್ಡರ್ (WebDAV) ಕೂಡ ಕೆಲಸ ಮಾಡುತ್ತದೆ."
