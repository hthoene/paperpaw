tasks.plugin.name = ಕಾರ್ಯಗಳು
tasks.plugin.description = ಗಡುವು ದಿನಾಂಕ ಮತ್ತು ಆದ್ಯತೆಗಳಿರುವ ಮಾಡಬೇಕಾದ ಪಟ್ಟಿಗಳು, ರೀಡರ್ನಲ್ಲಿ ಅಥವಾ ನಿಮ್ಮ CalDAV ಸರ್ವರ್ ಜೊತೆ ಸಿಂಕ್ ಮಾಡಿ, ಹೋಮ್ ಸ್ಕ್ರೀನ್ ವಿಜೆಟ್ಗಳೊಂದಿಗೆ.
tasks.plugin.how = "ರೀಡರ್ನಲ್ಲಿ ಮಾಡಬೇಕಾದ ಪಟ್ಟಿಗಳು: ಗಡುವು ಮತ್ತು ಆದ್ಯತೆ ಇರುವ ಕಾರ್ಯಗಳು, ಮುಗಿದಾಗ ಟಿಕ್ ಮಾಡಿ. ಸೆಟಪ್ ಅಥವಾ ನೆಟ್ವರ್ಕ್ ಇಲ್ಲದೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ; CalDAV ಸರ್ವರ್ (Nextcloud, Radicale, Baïkal, Fastmail ಇತ್ಯಾದಿ) ಜೊತೆ ಸಿಂಕ್ ಮಾಡಿದರೆ ಅದೇ ಪಟ್ಟಿಗಳು ಫೋನ್, ಕಂಪ್ಯೂಟರ್ನಲ್ಲೂ ಇರುತ್ತವೆ.\n\nಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ ಕಾರ್ಯಗಳು ತೆರೆಯಿರಿ. ಮೊದಲ ಸಾಲು ತೋರಿಸಿದ ಪಟ್ಟಿ; ಬೇರೆ ಪಟ್ಟಿ, ಇಂದು ಮತ್ತು ಬಾಕಿ, ಹೊಸ ಪಟ್ಟಿ, ಸಿಂಕ್ ಅಥವಾ ಖಾತೆಗಾಗಿ ಅದನ್ನು ಆಯ್ಕೆಮಾಡಿ. ಕಾರ್ಯ ಸೇರಿಸಿ ಕೀಬೋರ್ಡ್ ತೆರೆಯುತ್ತದೆ. ಕಾರ್ಯದ ಮೇಲೆ ಆಯ್ಕೆ ಅದನ್ನು ಟಿಕ್ ಮಾಡುತ್ತದೆ (ಮತ್ತೆ: ಮುಗಿದಿಲ್ಲ). ಶೀರ್ಷಿಕೆ, ಗಡುವು (ಇಂದು, ನಾಳೆ, ಒಂದು ವಾರದಲ್ಲಿ, ಅಥವಾ 2026-12-24 ನಂತಹ ದಿನಾಂಕ), ಆದ್ಯತೆ ಬದಲಿಸಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಕಾರ್ಯವನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ ಅಥವಾ ಮೆನು ಒತ್ತಿ. ತೆರೆದ ಕಾರ್ಯಗಳು ಮೊದಲು, ದಿನ ಮತ್ತು ಆದ್ಯತೆ ಪ್ರಕಾರ; ಮುಗಿದವು ಒಂದು ವಾರ ಕೊನೆಯಲ್ಲಿ ಇದ್ದು (ಸೆಟ್ಟಿಂಗ್ಗಳು, ಕಾರ್ಯಗಳು) ನಂತರ ಹೋಗುತ್ತವೆ.\n\nಹೋಮ್ ವಿಜೆಟ್ಗಳು (ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಒತ್ತಿಹಿಡಿದು ವಿಜೆಟ್ ಸೇರಿಸಿ): ಇಂದಿನ ಕಾರ್ಯಗಳು, ಕಾರ್ಯ ಪಟ್ಟಿ, ತೆರೆದ ಕಾರ್ಯಗಳು, ಮುಂದಿನ ಕಾರ್ಯ. ವಿಜೆಟ್ನಲ್ಲಿ ಕಾರ್ಯ ಟ್ಯಾಪ್ ಮಾಡಿದರೆ ಟಿಕ್ ಆಗುತ್ತದೆ; ಶೀರ್ಷಿಕೆ ಟ್ಯಾಪ್ ಮಾಡಿದರೆ ಪಟ್ಟಿಗಳು ತೆರೆಯುತ್ತವೆ.\n\nಸಿಂಕ್ಗಾಗಿ ಪಟ್ಟಿ ಸಾಲಿನಲ್ಲಿ CalDAV ಖಾತೆ ಆರಿಸಿ, ಸರ್ವರ್ ವಿಳಾಸ, ಬಳಕೆದಾರ ಹೆಸರು, ಪಾಸ್ವರ್ಡ್ (ಆಪ್ ಪಾಸ್ವರ್ಡ್ ಉತ್ತಮ) ನಮೂದಿಸಿ. ಸರ್ವರ್ ವಿಳಾಸ ಸಾಕು, ಉದಾ. cloud.example.com/remote.php/dav. ಕಾರ್ಯಗಳು ತೆರೆದಾಗ, ಈಗ ಸಿಂಕ್ ಮಾಡಿ ಆರಿಸಿದಾಗ ಮತ್ತು ನೆಟ್ವರ್ಕ್ ಆನ್ ಇದ್ದಾಗ ಸಿಂಕ್ ಆಗುತ್ತದೆ; ಆಫ್ಲೈನ್ ಬದಲಾವಣೆಗಳು ನಂತರ ಹೋಗುತ್ತವೆ. ಕಾರ್ಯ ಎರಡೂ ಕಡೆ ಬದಲಾದರೆ ಸರ್ವರ್ನ ಆವೃತ್ತಿ ಉಳಿದು ನಿಮ್ಮದು ಹೊಸ ಕಾರ್ಯವಾಗುತ್ತದೆ. ಪುನರಾವರ್ತಿತ ಕಾರ್ಯಗಳನ್ನು ಮಾಡಿದಲ್ಲೇ ಬದಲಿಸಿ. ಮಿತಿ: 12 ಪಟ್ಟಿಗಳಲ್ಲಿ 200 ಕಾರ್ಯಗಳು."
