vocabulary.plugin.description = ನೀವು ಹುಡುಕುವ ಪದಗಳನ್ನು ಅವುಗಳ ವಾಕ್ಯಗಳೊಂದಿಗೆ ಇರಿಸುತ್ತದೆ, ಮತ್ತು ಫೋನ್ನಲ್ಲಿ ಮಾಡಿದ ಫ್ಲ್ಯಾಶ್ ಕಾರ್ಡ್ಗಳನ್ನು ಅಂತರದ ಪುನರಾವರ್ತನೆಯಿಂದ ಅಭ್ಯಾಸ ಮಾಡಿಸುತ್ತದೆ.
vocabulary.plugin.how = "ಓದುವಾಗ ಹುಡುಕಿದ ಪದಗಳನ್ನು ವಾಕ್ಯದೊಂದಿಗೆ ಶಬ್ದಕೋಶ ಇರಿಸುತ್ತದೆ. ಪಟ್ಟಿ ಪರಿಕರಗಳಲ್ಲಿದೆ; ಪದವನ್ನು ಆಯ್ಕೆಮಾಡಿದರೆ ಮತ್ತೆ ಹುಡುಕುತ್ತದೆ. ರಫ್ತು ಮಾಡಿ ಸಾಲು Anki ನಂತಹ ಆಪ್ಗಳಿಗೆ ಉಳಿಸುತ್ತದೆ. ಹೊಸ 2,000 ಪದಗಳು ಮಾತ್ರ ಉಳಿಯುತ್ತವೆ: ಎಲ್ಲವನ್ನೂ ಇರಿಸಲು ಮೊದಲೇ ರಫ್ತು ಮಾಡಿ.\n\nಫ್ಲ್ಯಾಶ್ ಕಾರ್ಡ್ಗಳು (ಪರಿಕರಗಳಲ್ಲಿ): ಉತ್ತರ ತೋರಿಸಿ ನಂತರ ಮತ್ತೆ, ಕಷ್ಟ, ಉತ್ತಮ ಅಥವಾ ಸುಲಭ ಆಯ್ಕೆಮಾಡಿ; ಕಾರ್ಡ್ ಯಾವಾಗ ಮರಳುತ್ತದೆ ಎಂದು ಅದು ನಿರ್ಧರಿಸುತ್ತದೆ. ಫೋನ್ನಲ್ಲಿ ಸಂಪಾದಿಸಿ: ಅದೇ Wi-Fi ನಲ್ಲಿರುವ ಫೋನ್ನಿಂದ ಕೋಡ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ, ಕಾರ್ಡ್ಗಳನ್ನು ಟೈಪ್ ಮಾಡಿ, ಅಥವಾ ಡೆಕ್ ತೆರೆದು ಒಮ್ಮೆಗೆ ಹಲವು ಕಾರ್ಡ್ಗಳು ಆಯ್ಕೆಮಾಡಿ CSV, TSV, TXT ಫೈಲ್, ಪಟ್ಟಿ ಅಥವಾ Anki ಡೆಕ್ (.apkg, Support older Anki versions ಜೊತೆ ರಫ್ತು) ಸೇರಿಸಿ.\n\nSD ಕಾರ್ಡ್ನಲ್ಲಿ: ಪ್ರತಿ ಡೆಕ್ಗೆ ಒಂದು CSV/TSV/TXT (UTF-8) ಅಥವಾ .apkg ಫೈಲ್ ಅನ್ನು Flashcards ಫೋಲ್ಡರ್ನಲ್ಲಿ ಇಡಿ (Spanish.tsv = ಡೆಕ್ Spanish; ಪ್ರತಿ ಸಾಲು: front, back, example). SD ಕಾರ್ಡ್ನ ಕಾರ್ಡ್ಗಳು ಆಯ್ಕೆಮಾಡಿ. ಹೊಸ/ಬದಲಾದ ಫೈಲ್ ಡೆಕ್ಗೆ ಸೇರುತ್ತದೆ: ಹಿಂಭಾಗ/ಉದಾಹರಣೆ ಬದಲಿಸಿದರೆ ಪ್ರಗತಿ ಉಳಿಯುತ್ತದೆ; ಮುಂಭಾಗ ಬದಲಿಸಿದರೆ ಹೊಸ ಕಾರ್ಡ್ (ಸ್ಪೇಸ್, ದೊಡ್ಡಕ್ಷರ ಲೆಕ್ಕಕ್ಕಿಲ್ಲ). ಅಳಿಸಿದ ಸಾಲು ಕಾರ್ಡ್ ಅನ್ನು ಅಳಿಸುವುದಿಲ್ಲ (“ಫೈಲ್ನಲ್ಲಿ ಇಲ್ಲದ ಕಾರ್ಡ್ಗಳು” = ತೆಗೆದುಹಾಕಿ ಆಗದಿದ್ದರೆ). ಕಾರ್ಡ್ಗೆ ಉಳಿಸಿ id ಕಾಲಮ್ ಬರೆಯುತ್ತದೆ; ಹಳೆಯ ಫೈಲ್ _name.bak.tsv ಆಗುತ್ತದೆ. ಗರಿಷ್ಠ 4 MiB, 20,000 ಸಾಲುಗಳು, UTF-16 ಅಲ್ಲ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳು › ಓದುವಿಕೆ › ಹುಡುಕಿದ ಪದಗಳಿಂದ ಕಾರ್ಡ್ಗಳು: ಪ್ರತಿ ಪದ “ಹುಡುಕಿದ ಪದಗಳು” ಡೆಕ್ಗೆ ಹೋಗುತ್ತದೆ."
