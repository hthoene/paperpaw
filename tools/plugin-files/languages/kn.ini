files.plugin.how = "ಲೈಬ್ರರಿ ನಿಮ್ಮ ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ನಲ್ಲಿನ ಪುಸ್ತಕಗಳನ್ನು ಪಟ್ಟಿಮಾಡುತ್ತದೆ, ಪ್ರತಿಯೊಂದೂ ಮುಖಪುಟ, ಶೀರ್ಷಿಕೆ, ಲೇಖಕ ಮತ್ತು ಎಷ್ಟು ಓದಿದ್ದೀರಿ ಎಂಬುದರೊಂದಿಗೆ. ಕೊನೆಯದಾಗಿ ಓದಿದ ಪುಸ್ತಕ ಮೇಲೆ ಕಾರ್ಡ್ ಆಗಿರುತ್ತದೆ, ಆದ್ದರಿಂದ ಓದು ಮುಂದುವರಿಸಲು ಒಂದು ಟ್ಯಾಪ್ ಅಥವಾ “ಆಯ್ಕೆಮಾಡಿ” ಒಮ್ಮೆ ಒತ್ತಿದರೆ ಸಾಕು. ಪುಸ್ತಕಗಳನ್ನು ಹುಡುಕುತ್ತಿರುವಾಗ ಲೈಬ್ರರಿ ಇದುವರೆಗೆ ಎಷ್ಟು ಸಿಕ್ಕಿವೆ ಎಂದು ಹೇಳುತ್ತದೆ.\n\nಪುಸ್ತಕಗಳ ಮೇಲೆ ಏನು ತೋರಿಸಬೇಕೆಂದು ಆಯ್ಕೆಮಾಡಿ: ಎಲ್ಲವೂ, ಓದುತ್ತಿರುವವು, ಓದದವು ಅಥವಾ ಓದಿ ಮುಗಿದವು, ಅಥವಾ ಶೆಲ್ಫ್ಗಳು (ಲೇಖಕ, ಸರಣಿ, ಟ್ಯಾಗ್, ಮೆಚ್ಚಿನವು, ನೀವು ಆರಂಭಿಸಿದ ಪ್ರತಿ ಸರಣಿಯ ಮುಂದಿನ ಪುಸ್ತಕ). ಓದಲು ಪುಸ್ತಕವನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; ತೆರೆಯಲು, ಓದಿ ಮುಗಿದಿದೆ ಅಥವಾ ಓದಿಲ್ಲ ಎಂದು ಗುರುತಿಸಲು, ಮಾಹಿತಿ ನೋಡಲು, ಆರ್ಕೈವ್ಗೆ ಸರಿಸಲು ಅಥವಾ ಅಳಿಸಲು ಅದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಿಂದ “ಆಯ್ಕೆಮಾಡಿ” ಒತ್ತಿಹಿಡಿಯಿರಿ). ಲೈಬ್ರರಿ ಮೆನುವಿಗಾಗಿ ಶೀರ್ಷಿಕೆಯನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ: ಪುಸ್ತಕಗಳ ವಿಂಗಡಣೆ ಮತ್ತು ನೋಟ, ಹುಡುಕಾಟ, ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ ಮತ್ತು ಸೆಟ್ಟಿಂಗ್ಗಳು.\n\nಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ ಅನ್ನು ಸೆಟ್ಟಿಂಗ್ಗಳ “ಲೈಬ್ರರಿ” ಅಡಿಯಲ್ಲಿ “ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್” ಆಗಿ ಹೊಂದಿಸಲಾಗುತ್ತದೆ; ಅಲ್ಲಿ ಪುಸ್ತಕಗಳನ್ನು ಮುಖಪುಟಗಳ ಗ್ರಿಡ್ ಆಗಿಯೂ ತೋರಿಸಬಹುದು. ಬೇರೆ ಎಲ್ಲಾ ಫೈಲ್ಗಳಿಗೆ “ಪರಿಕರಗಳು” ಮೆನುವಿನ “ಫೈಲ್ಗಳು” ಬಳಸಿ."
