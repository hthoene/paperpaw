fonts-browser.plugin.name = ಇನ್ನಷ್ಟು ಫಾಂಟ್ಗಳು
fonts-browser.plugin.description = ಇಂಟರ್ನೆಟ್ನಿಂದ ಫಾಂಟ್ಗಳನ್ನು ಮಾದರಿಯೊಂದಿಗೆ ತೋರಿಸುತ್ತದೆ ಮತ್ತು ಓದಲು ಅವುಗಳನ್ನು ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ.
fonts-browser.plugin.how = "“ಇನ್ನಷ್ಟು ಫಾಂಟ್ಗಳು” ಇಂಟರ್ನೆಟ್ನ ಫಾಂಟ್ ಲೈಬ್ರರಿಯಿಂದ ಫಾಂಟ್ಗಳನ್ನು ಅವುಗಳದೇ ಶೈಲಿಯಲ್ಲಿ ಪಟ್ಟಿಮಾಡುತ್ತದೆ ಮತ್ತು ನೀವು ಬಯಸುವವನ್ನು ಡೌನ್ಲೋಡ್ ಮಾಡುತ್ತದೆ.\n\nಇದು ಸೆಟ್ಟಿಂಗ್ಗಳ “ಓದುವಿಕೆ” ಅಡಿಯ “ಫಾಂಟ್” ಪಟ್ಟಿಯ ಕೊನೆಯಲ್ಲಿದೆ; ಸ್ಥಿತಿ ಪಟ್ಟಿಗಳ ಫಾಂಟ್ಗೂ ಇದೇ ನಮೂದು ಇದೆ. ಮಾದರಿ ವಾಕ್ಯದೊಂದಿಗೆ ದೊಡ್ಡದಾಗಿ ನೋಡಲು ಫಾಂಟ್ ಟ್ಯಾಪ್ ಮಾಡಿ (ಬಟನ್ಗಳಿಂದ “ಆಯ್ಕೆಮಾಡಿ” ಒತ್ತಿ), ನಂತರ “ಡೌನ್ಲೋಡ್ ಮಾಡಿ”. ಡೌನ್ಲೋಡ್ ಆಗುವಾಗ ಪುಟ ಬಿಡಬಹುದು. ಮುಗಿದಾಗ “(ಹೆಸರು) ನೊಂದಿಗೆ ಓದಿ” ಅಥವಾ “ಸ್ಥಿತಿ ಪಟ್ಟಿಗಳಿಗೆ ಬಳಸಿ” ಆಯ್ಕೆಮಾಡಿ. “ಅಪ್ಡೇಟ್” ಹೊಸ ಆವೃತ್ತಿ ತರುತ್ತದೆ, “ತೆಗೆದುಹಾಕಿ” ಫಾಂಟ್ ಅಳಿಸುತ್ತದೆ. Wi-Fi ಬೇಕು.\n\nನಿಮ್ಮ ಸ್ವಂತ ಫಾಂಟ್ಗಳು\n\nಅದೇ ಪಟ್ಟಿಯ “ನಿಮ್ಮ ಸ್ವಂತ ಫಾಂಟ್ಗಳು” ಈ ಸಹಾಯ ಭಾಗವನ್ನು ತೋರಿಸುತ್ತದೆ. ಸ್ವಂತ ಫಾಂಟ್ ಎಂದರೆ .ttf ಅಥವಾ .otf ಫೈಲ್. Android ಮತ್ತು ಫಾಂಟ್ ಫೈಲ್ ಬಳಸುವ ಸಾಧನಗಳಲ್ಲಿ: ಫೈಲ್ ಅನ್ನು fonts ಫೋಲ್ಡರ್ಗೆ (Android ನಲ್ಲಿ ಹಂಚಿದ ಸಂಗ್ರಹಣೆಯ PaperPaw/fonts) ನಕಲಿಸಿ, PaperPaw ಮರುಪ್ರಾರಂಭಿಸಿ, “ಫಾಂಟ್” ನಲ್ಲಿ ಆಯ್ಕೆಮಾಡಿ.\n\nXteink X4 ಮತ್ತು X4 Pro ಮೆಮೊರಿ ಕಡಿಮೆ ಇರುವುದರಿಂದ ಫಾಂಟ್ ಪ್ಯಾಕ್ಗಳನ್ನು ಓದುತ್ತವೆ. ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ paperpaw-fontgen ನಿಂದ ಪ್ಯಾಕ್ ಮಾಡಿ (regular ಅಗತ್ಯ):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nಇದು plugins/font-my-font ಫೋಲ್ಡರ್ ರಚಿಸುತ್ತದೆ. ಅದನ್ನು ಮೆಮೊರಿ ಕಾರ್ಡ್ನ plugins ಫೋಲ್ಡರ್ಗೆ ನಕಲಿಸಿ, ಮರುಪ್ರಾರಂಭಿಸಿ, “ಫಾಂಟ್” ಆಗಿ My Font ಆಯ್ಕೆಮಾಡಿ. ಬಿಟ್ಟ ಶೈಲಿಗಳು regular ನಲ್ಲಿ ಮೂಡುತ್ತವೆ. --chars latin,cyrillic,greek ಲಿಪಿಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ; ನಿಮ್ಮ ಪುಸ್ತಕದ ಲಿಪಿ ಇರುವ ಫಾಂಟ್ ಆರಿಸಿ. “ಇನ್ನಷ್ಟು ಫಾಂಟ್ಗಳು” ಗೆ ಕಂಪ್ಯೂಟರ್ ಬೇಡ.\n\nಸಣ್ಣ ಪಠ್ಯ ಸ್ಪಷ್ಟವಾಗಿರಲು --hinting light ಸೇರಿಸಿ; ಅರೇಬಿಕ್, ದೇವನಾಗರಿಯಂತಹ ಚಿಹ್ನೆಗಳಿರುವ ಫಾಂಟ್ಗಳಿಗೆ ಬೇಡ."
