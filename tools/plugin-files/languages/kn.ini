puzzles.plugin.description = ಸುಡೋಕು, ಪದಬಂಧ ಮತ್ತು ಚೆಸ್ ಒಗಟುಗಳು, ಆಫ್ಲೈನ್, ದಿನದ ಒಗಟಿನೊಂದಿಗೆ.
puzzles.plugin.how = "ಪ್ರಯಾಣಕ್ಕೆ ಆಫ್ಲೈನ್ ಒಗಟುಗಳು: ಸುಡೋಕು, ಪದಬಂಧ, ಚೆಸ್. ಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ ಒಗಟುಗಳು ತೆರೆಯಿರಿ, ಅಥವಾ ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ದಿನದ ಒಗಟು ವಿಜೆಟ್ ಸೇರಿಸಿ: ಇಂದಿನ ಸುಡೋಕು ಎಷ್ಟು ಮುಗಿದಿದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ, ಟ್ಯಾಪ್ ಅದನ್ನು ತೆರೆಯುತ್ತದೆ. ದಿನದ ಸುಡೋಕು ದಿನವಿಡೀ ಒಂದೇ.\n\nಸುಡೋಕು: ಎಡ ಮತ್ತು ಬಲ ಕರ್ಸರ್ ಅನ್ನು ಒಂದೊಂದು ಚೌಕ, ಮೇಲೆ ಮತ್ತು ಕೆಳಗೆ (ಪುಟ ಬಟನ್ಗಳು) ಒಂದು ಸಾಲು ಸರಿಸುತ್ತವೆ. ಆಯ್ಕೆ ಅಂಕಿಗಳನ್ನು ತೆರೆಯುತ್ತದೆ: ಒಂದನ್ನು ಆರಿಸಿ ಮತ್ತೆ ಆಯ್ಕೆ ಒತ್ತಿ, ಅಥವಾ ಚೌಕ ಖಾಲಿ ಮಾಡಲು ತೆರವು. ಬೋರ್ಡ್ ಕೆಳಗಿನ ಬಟನ್ಗಳಿಗೆ ಆಯ್ಕೆ (ಅಥವಾ ಮೆನು) ಒತ್ತಿಹಿಡಿಯಿರಿ: ಟಿಪ್ಪಣಿಗಳು ಅಂಕಿಗಳನ್ನು ಪೆನ್ಸಿಲ್ ಗುರುತುಗಳಾಗಿಸುತ್ತದೆ, ಪರಿಶೀಲಿಸಿ ತಪ್ಪು ಚೌಕಗಳನ್ನು ಗುರುತಿಸುತ್ತದೆ, ರದ್ದು ಕೊನೆಯ ನಡೆ ಹಿಂತೆಗೆಯುತ್ತದೆ, ಹೊಸದು ನೀವು ಆರಿಸಿದ ಮಟ್ಟದ (ಸುಲಭ, ಮಧ್ಯಮ, ಕಠಿಣ) ಒಗಟು ಆರಂಭಿಸುತ್ತದೆ. ಪ್ರತಿ ಒಗಟಿಗೆ ಒಂದೇ ಉತ್ತರ. ಆಟ ಉಳಿಯುತ್ತದೆ. ಟಚ್ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಚೌಕ ಟ್ಯಾಪ್ ಮಾಡಿ.\n\nಪದಬಂಧ: .puz (Across Lite) ಅಥವಾ .ipuz ಫೈಲ್ಗಳನ್ನು ಮೆಮೊರಿ ಕಾರ್ಡ್ನ “puzzles” ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ; ಯಾವುದನ್ನೂ ಸೇರಿಸಿಲ್ಲ. ಗ್ರಿಡ್ನಲ್ಲಿ ಸರಿಸಿ, ಆಯ್ಕೆ ಮಾಡಿ ಕರ್ಸರ್ ಕೆಳಗಿನ ಪದವನ್ನು ಕೀಬೋರ್ಡ್ನಲ್ಲಿ ಟೈಪ್ ಮಾಡಿ (_ ಚೌಕವನ್ನು ಖಾಲಿ ಬಿಡುತ್ತದೆ). ಬಟನ್ಗಳು ಅಡ್ಡ/ಕೆಳಗೆ ಬದಲಿಸುತ್ತವೆ, ಸುಳಿವುಗಳ ಪಟ್ಟಿ ತೋರಿಸುತ್ತವೆ, ಅಕ್ಷರ ಪರಿಶೀಲಿಸುತ್ತವೆ, ಪದ ತೋರಿಸುತ್ತವೆ. ಪ್ರತಿ ಫೈಲ್ಗೆ ಅಕ್ಷರಗಳು ಉಳಿಯುತ್ತವೆ. ಲಾಕ್ ಆದ (scrambled) .puz ಫೈಲ್ಗಳು ತೆರೆಯುವುದಿಲ್ಲ.\n\nಚೆಸ್ ಒಗಟುಗಳು: Lichess ಒಗಟು ಸಂಗ್ರಹದ (CC0) ಸಣ್ಣ ಸೆಟ್. ಎಡ ಮತ್ತು ಬಲ ಕಾಯಿಯಿಂದ ಕಾಯಿಗೆ ಹಾರುತ್ತವೆ; ನಡೆಸಬೇಕಾದ ಕಾಯಿ ಆಯ್ಕೆಮಾಡಿ, ಎಡ/ಬಲದಿಂದ ಗುರಿ ಚೌಕಕ್ಕೆ ಹೋಗಿ ಮತ್ತೆ ಆಯ್ಕೆ. ತಪ್ಪು ನಡೆ ಹಿಂತೆಗೆಯಲಾಗುತ್ತದೆ. ಸುಳಿವು ನಡೆಸಬೇಕಾದ ಕಾಯಿ ಗುರುತಿಸುತ್ತದೆ, ಮುಂದೆ ಮುಂದಿನ ಒಗಟಿಗೆ.\n\nಬೋರ್ಡ್ ಬದಲಾದ ಚೌಕಗಳನ್ನು ಮಾತ್ರ ಮತ್ತೆ ಬಿಡಿಸುತ್ತದೆ. ಅಂಕಿಅಂಶಗಳು ನೀವು ಬಿಡಿಸಿದ ಒಗಟುಗಳನ್ನು ಎಣಿಸುತ್ತವೆ."
