wifi.plugin.name = Wi-Fi
wifi.plugin.description = ಅಗತ್ಯವಿದ್ದಾಗ Wi-Fi ನೆಟ್ವರ್ಕ್ಗಳಿಗೆ ಸಂಪರ್ಕಿಸುತ್ತದೆ ಮತ್ತು ನಂತರ ರೇಡಿಯೋ ಆಫ್ ಮಾಡುತ್ತದೆ.
wifi.plugin.how = "ಪ್ಲಗಿನ್ಗೆ ಇಂಟರ್ನೆಟ್ ಬೇಕಾದಾಗ (ಕ್ಯಾಟಲಾಗ್, ಸಿಂಕ್, ಸ್ಟೋರ್, ವರ್ಗಾವಣೆ) Wi-Fi ನೆಟ್ವರ್ಕ್ಗೆ ಸಂಪರ್ಕಿಸುತ್ತದೆ. ಯಾವುದೂ ಬಳಸದಿದ್ದಾಗ ಒಂದು ನಿಮಿಷದ ನಂತರ, ಅಥವಾ ಹೋಮ್ ಅಥವಾ ಪುಸ್ತಕ ಕಾಣುತ್ತಿದ್ದಂತೆ ತಕ್ಷಣ, ಬ್ಯಾಟರಿ ಮತ್ತು ಮೆಮೊರಿ ಉಳಿಸಲು ರೇಡಿಯೋವನ್ನು ಮತ್ತೆ ಆಫ್ ಮಾಡುತ್ತದೆ.\n\nWi-Fi ಅನ್ನು ಸೆಟ್ಟಿಂಗ್ಗಳಿಂದ ಅಥವಾ ಸ್ಥಿತಿ ಪಟ್ಟಿಯಲ್ಲಿನ Wi-Fi ಐಟಂನಿಂದ ತೆರೆಯಿರಿ. ನೆಟ್ವರ್ಕ್ಗಳು ವ್ಯಾಪ್ತಿಯಲ್ಲಿರುವವನ್ನು ತೋರಿಸುತ್ತದೆ; ಒಂದನ್ನು ಆಯ್ಕೆಮಾಡಿ ಅದರ ಪಾಸ್ವರ್ಡ್ ಟೈಪ್ ಮಾಡಿ, ಅಥವಾ ಫೋನ್ ಮೂಲಕ ಸೆಟಪ್ ಆಯ್ಕೆಮಾಡಿ ಸಾಧನದ ಬದಲು ನಿಮ್ಮ ಫೋನ್ನ ಬ್ರೌಸರ್ನಲ್ಲಿ ಹೆಸರು ಮತ್ತು ಪಾಸ್ವರ್ಡ್ ಟೈಪ್ ಮಾಡಿ. ಮರೆತುಬಿಡಿ ಉಳಿಸಿದ ನೆಟ್ವರ್ಕ್ ಅನ್ನು ತೆಗೆದುಹಾಕುತ್ತದೆ.\n\nಪಾಸ್ವರ್ಡ್ಗಳು ಕಾರ್ಡ್ನಲ್ಲಿ ಸುರಕ್ಷಿತವಾಗಿ ಉಳಿಯುತ್ತವೆ ಮತ್ತು ಮತ್ತೆ ಎಂದಿಗೂ ತೋರಿಸಲಾಗುವುದಿಲ್ಲ. ಅಗತ್ಯವಿದ್ದಾಗ ಸಂಪರ್ಕಿಸಿ ಎಂಬಲ್ಲಿ ಕೊನೆಯ ಬಳಕೆಯ ನಂತರ Wi-Fi ಎಷ್ಟು ಸಮಯ ಆನ್ ಇರಬೇಕು, ಚಾರ್ಜ್ ಆಗುವಾಗ ಆನ್ ಇರಬೇಕೆ, ಮತ್ತು ಹಲವು ವ್ಯಾಪ್ತಿಯಲ್ಲಿದ್ದಾಗ ಯಾವ ಉಳಿಸಿದ ನೆಟ್ವರ್ಕ್ ಮೊದಲು ಎಂಬುದನ್ನು ಹೊಂದಿಸುತ್ತೀರಿ."
