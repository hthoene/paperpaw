pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = ಕೆಲಸ ಮತ್ತು ವಿರಾಮದ ಸುತ್ತುಗಳು, ವಿಜೆಟ್ಗಳು ಮತ್ತು ದೈನಂದಿನ ಎಣಿಕೆಯೊಂದಿಗೆ ಏಕಾಗ್ರತೆ ಟೈಮರ್.
pomodoro.plugin.how = "Pomodoro ಟೈಮರ್: ಏಕಾಗ್ರತೆಯ ಸುತ್ತುಗಳಲ್ಲಿ ಕೆಲಸ ಮಾಡಿ, ನಂತರ ವಿಶ್ರಾಂತಿ. ಸೆಟಪ್ ಬೇಕಿಲ್ಲ: 25 ನಿಮಿಷ ಏಕಾಗ್ರತೆ, 5 ವಿಶ್ರಾಂತಿ, ನಾಲ್ಕು ಸುತ್ತುಗಳ ನಂತರ 15 ನಿಮಿಷದ ದೀರ್ಘ ವಿರಾಮ.\n\nಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ Pomodoro ತೆರೆದು ಪ್ರಾರಂಭಿಸಿ ಒತ್ತಿ, ಅಥವಾ ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ಅದರ ವಿಜೆಟ್ಗಳನ್ನು ಸೇರಿಸಿ: Pomodoro ಟೈಮರ್ ಹಂತ ಮತ್ತು ಉಳಿದ ನಿಮಿಷಗಳನ್ನು ತೋರಿಸುತ್ತದೆ, Pomodoro ಪ್ರಾರಂಭ/ವಿರಾಮ ಒಂದು ಬಟನ್, Pomodoro ಇಂದು ಮುಗಿಸಿದ ಸುತ್ತುಗಳನ್ನು ದೈನಂದಿನ ಗುರಿಯೊಂದಿಗೆ ಎಣಿಸುತ್ತದೆ. ಟೈಮರ್ ಟ್ಯಾಪ್ ಮಾಡಿದರೆ ಪ್ರಾರಂಭ ಅಥವಾ ವಿರಾಮ; ಒತ್ತಿಹಿಡಿದರೆ ಪೂರ್ಣ ಸ್ಕ್ರೀನ್.\n\nಸ್ಕ್ರೀನ್ ಬಿಟ್ಟರೂ ಟೈಮರ್ ಚಲಿಸುತ್ತದೆ, ಮರುಪ್ರಾರಂಭದ ನಂತರ ಗಡಿಯಾರದ ಪ್ರಕಾರ ಮುಂದುವರಿಯುತ್ತದೆ. ರೀಡರ್ ನಿದ್ರೆಯಲ್ಲಿರುವಾಗ ಏನೂ ಚಲಿಸುವುದಿಲ್ಲ: ಆ ನಡುವೆ ಮುಗಿದ ಹಂತವನ್ನು ಎಚ್ಚರವಾದಾಗ ತಿಳಿಸಲಾಗುತ್ತದೆ. ಹಂತ ಮುಗಿದಾಗ ಸೂಚನೆ ಬರುತ್ತದೆ. ಬ್ಯಾಟರಿ ಉಳಿಸಲು ಗಡಿಯಾರ ನಿಮಿಷಕ್ಕೊಮ್ಮೆ ಅಪ್ಡೇಟ್ ಆಗುತ್ತದೆ (ಪೂರ್ಣ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಕೊನೆಯ ನಿಮಿಷದಲ್ಲಿ ಹತ್ತು ಸೆಕೆಂಡಿಗೊಮ್ಮೆ) ಮತ್ತು ರೀಡರ್ ಅನ್ನು ಎಂದಿಗೂ ಎಚ್ಚರವಿರಿಸುವುದಿಲ್ಲ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳ Pomodoro ಅಡಿಯಲ್ಲಿ ಅವಧಿಗಳು, ಒಂದು ಸೆಟ್ನ ಸುತ್ತುಗಳು ಮತ್ತು ಮುಂದಿನ ಹಂತ ತಾನಾಗಿ ಆರಂಭವಾಗಬೇಕೆ ಎಂದು ಹೊಂದಿಸಿ. ಇನ್ನಷ್ಟು ಅಡಿಯಲ್ಲಿ: ಹಂತ ಮುಗಿದಾಗ ಸ್ಕ್ರೀನ್ ಮಿನುಗು ಅಥವಾ ಮುಂಬೆಳಕು ಮಿನುಗು, ಮತ್ತು ದೈನಂದಿನ ಗುರಿ."
