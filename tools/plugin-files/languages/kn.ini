battery.plugin.name = ಬ್ಯಾಟರಿ ಬಳಕೆ
battery.plugin.description = ಬ್ಯಾಟರಿಯನ್ನು ದಾಖಲಿಸುತ್ತದೆ ಮತ್ತು ಅದು ಎಷ್ಟು ಕಾಲ ಬರುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ.
battery.plugin.how = "ಸಾಧನ ಎಚ್ಚರವಾಗಿರುವಾಗ ಬ್ಯಾಟರಿ ಬಳಕೆ ಸುಮಾರು ನಿಮಿಷಕ್ಕೊಮ್ಮೆ ಚಾರ್ಜ್ ಅನ್ನು ದಾಖಲಿಸುತ್ತದೆ, ಜೊತೆಗೆ ಸಾಧನ ಏನು ಮಾಡಿತು ಎಂಬುದನ್ನೂ: ಸ್ಕ್ರೀನ್ ರಿಫ್ರೆಶ್ಗಳು ಮತ್ತು ತಿರುಗಿಸಿದ ಪುಟಗಳು. ಅದರಿಂದ ಒಂದು ಗಂಟೆ ಎಚ್ಚರ ಮತ್ತು 100 ಪುಟಗಳಿಗೆ ಎಷ್ಟು ಬೇಕು, ಮತ್ತು ಆ ವೇಗದಲ್ಲಿ ಬ್ಯಾಟರಿ ಎಷ್ಟು ಕಾಲ ಬರುತ್ತದೆ ಎಂದು ಲೆಕ್ಕ ಹಾಕುತ್ತದೆ.\n\nಪರಿಕರಗಳು ಮೆನುವಿನಿಂದ ಬ್ಯಾಟರಿ ತೆರೆಯಿರಿ. ಅದು ಈಗಿನ ಚಾರ್ಜ್, ಈ ಬಾರಿಯ ಎಚ್ಚರ, ಇದುವರೆಗಿನ ಬ್ಯಾಟರಿಯಲ್ಲಿನ ಬಳಕೆ ಮತ್ತು ನಿಮ್ಮ ಇತ್ತೀಚಿನ ಎಚ್ಚರದ ಅವಧಿಗಳನ್ನು ತೋರಿಸುತ್ತದೆ. ಪುಟ ಬಟನ್ಗಳಿಂದ, ಅಥವಾ ಮೇಲಿನ ಬಾಣಗಳನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ ಪುಟ ತಿರುಗಿಸಿ.\n\nಅಂಕಿಗಳು ಅರ್ಥಪೂರ್ಣವಾಗಲು ಬ್ಯಾಟರಿಯಲ್ಲಿ ಸ್ವಲ್ಪ ಕಾಲ ಓದಬೇಕು. ದಾಖಲಿಸುವಿಕೆ ಆರಂಭದಲ್ಲಿ ಆನ್ ಆಗಿರುತ್ತದೆ; ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸಾಧನ, ಪವರ್ ಅಡಿಯಲ್ಲಿ ಬ್ಯಾಟರಿ ಬಳಕೆ ದಾಖಲಿಸಿ ಎಂದು ಆಫ್ ಮಾಡಬಹುದು."
