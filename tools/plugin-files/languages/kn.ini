joplin.bad-address = ಈ ವಿಳಾಸವನ್ನು PaperPaw ಬಳಸಲಾಗುವುದಿಲ್ಲ. Joplin ಸೆಟಪ್ನಲ್ಲಿ ಅದನ್ನು ಪರಿಶೀಲಿಸಿ.
joplin.no-data = ಈ ವಿಳಾಸದಲ್ಲಿ Joplin ಟಿಪ್ಪಣಿಗಳಿಲ್ಲ. ಅದನ್ನು ಪರಿಶೀಲಿಸಿ, ಅಥವಾ ಮೊದಲು Joplin ಅನ್ನು ಅದರೊಂದಿಗೆ ಸಿಂಕ್ ಮಾಡಿ.
joplin.encrypted = Joplin ನ ಎಂಡ್-ಟು-ಎಂಡ್ ಎನ್ಕ್ರಿಪ್ಶನ್ ಆನ್ ಆಗಿದೆ. PaperPaw ಟಿಪ್ಪಣಿಗಳನ್ನು ಎನ್ಕ್ರಿಪ್ಟ್ ಮಾಡಲಾರದು, ಆದ್ದರಿಂದ ಏನನ್ನೂ ಕಳುಹಿಸುವುದಿಲ್ಲ.
joplin.newer-target = Joplin ಅಲ್ಲಿ ಟಿಪ್ಪಣಿಗಳನ್ನು ಈ PaperPaw ಗೆ ತಿಳಿದಿರುವುದಕ್ಕಿಂತ ಹೊಸ ಸ್ವರೂಪದಲ್ಲಿ ಇರಿಸಿದೆ. ಅವನ್ನು ಕಳುಹಿಸಲು PaperPaw ಅನ್ನು ಅಪ್ಡೇಟ್ ಮಾಡಿ.
joplin.older-target = Joplin ಅಲ್ಲಿ ಟಿಪ್ಪಣಿಗಳನ್ನು ಹಳೆಯ ಸ್ವರೂಪದಲ್ಲಿ ಇರಿಸಿದೆ. ಅದನ್ನು ಅಪ್ಗ್ರೇಡ್ ಮಾಡಲು Joplin ತೆರೆಯಿರಿ, ನಂತರ ಮತ್ತೆ ಕಳುಹಿಸಿ.
joplin.upgrading = Joplin ಈಗ ಅಲ್ಲಿನ ಟಿಪ್ಪಣಿಗಳನ್ನು ಅಪ್ಗ್ರೇಡ್ ಮಾಡುತ್ತಿದೆ. ಅವು ಕಾಯುತ್ತವೆ ಮತ್ತು ನಂತರ ಕಳುಹಿಸಲಾಗುತ್ತದೆ.
joplin.no-memory = ಟಿಪ್ಪಣಿಗಳನ್ನು ಕಳುಹಿಸಲು ಸಾಕಷ್ಟು ಮೆಮೊರಿ ಇಲ್ಲ. ಮರುಪ್ರಾರಂಭಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.
keyboard.plugin.name = ಕೀಬೋರ್ಡ್
keyboard.plugin.description = ಟಚ್ ಅಥವಾ ಬಟನ್ಗಳಿಂದ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಪಠ್ಯ ನಮೂದಿಸುತ್ತದೆ.
keyboard.plugin.how = "ಪಠ್ಯ ಬೇಕಾದಾಗಲೆಲ್ಲ ಕೀಬೋರ್ಡ್ ತೆರೆಯುತ್ತದೆ: ಹುಡುಕಾಟ, ಪಾಸ್ವರ್ಡ್, ಟಿಪ್ಪಣಿ ಅಥವಾ ಸೆಟ್ಟಿಂಗ್. ಇದು ಟಚ್ನಿಂದ ಮತ್ತು ಬಟನ್ಗಳಿಂದ ಮಾತ್ರವೂ ಕೆಲಸ ಮಾಡುತ್ತದೆ.\n\nಬಟನ್ಗಳಿಂದ: ಎಡ ಮತ್ತು ಬಲ ಸಾಲಿನಲ್ಲಿ ಸುತ್ತುತ್ತವೆ, ಪುಟ ಬಟನ್ಗಳು ಸಾಲುಗಳ ನಡುವೆ ಸರಿಯುತ್ತವೆ, ಮೇಲೆ ಮತ್ತು ಕೆಳಗೆ ನಿಮ್ಮ ಕಾಲಮ್ನಲ್ಲೇ ಇರುತ್ತವೆ; ಆಯ್ಕೆಮಾಡಿ ಕೀ ಒತ್ತುತ್ತದೆ, ಹಿಂದೆ ರದ್ದುಮಾಡುತ್ತದೆ. ಶಿಫ್ಟ್ ಮುಂದಿನ ಅಕ್ಷರವನ್ನು ದೊಡ್ಡಕ್ಷರ ಮಾಡುತ್ತದೆ; ಎರಡು ಬಾರಿ ಒತ್ತಿದರೆ ಎಲ್ಲವೂ ದೊಡ್ಡಕ್ಷರ, ಮತ್ತೊಮ್ಮೆ ಒತ್ತಿದರೆ ನಿಲ್ಲುತ್ತದೆ. ಅಕ್ಷರವನ್ನು ಒತ್ತಿಹಿಡಿದರೆ (ಬಟನ್ಗಳಿಂದ: ಅದರ ಮೇಲೆ ಆಯ್ಕೆಮಾಡಿ ಒತ್ತಿಹಿಡಿಯಿರಿ) ಅದರ ದೊಡ್ಡಕ್ಷರ ತಕ್ಷಣ ಆಯ್ಕೆಯಾಗಿ, é ಮತ್ತು è ನಂತಹ ಚಿಹ್ನೆಯುಳ್ಳ ಅಕ್ಷರಗಳು ಕಾಣಿಸುತ್ತವೆ. “ಸರಿ” ಮುಗಿಸುತ್ತದೆ; ಬಟನ್ಗಳಿಂದ ಎಲ್ಲಿಂದಲಾದರೂ ಮುಗಿಸಲು ಹಿಂದೆ ಒತ್ತಿಹಿಡಿಯಿರಿ (ಹಿಂದೆ ಮಾತ್ರ ರದ್ದುಮಾಡುತ್ತದೆ), ಅಥವಾ ಅಕ್ಷರವಲ್ಲದ ಕೀ ಮೇಲೆ ಆಯ್ಕೆಮಾಡಿ ಒತ್ತಿಹಿಡಿಯಿರಿ. “ಅಂಟಿಸಿ” ಕ್ಲಿಪ್ಬೋರ್ಡ್ ಪಠ್ಯವನ್ನು ಸೇರಿಸುತ್ತದೆ; “ಫೋನ್” (ಇದ್ದಲ್ಲಿ) ನಿಮ್ಮ ಫೋನ್ನಲ್ಲಿ ಟೈಪ್ ಮಾಡಲು ಬಿಡುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸಾಧನ › ಕೀಬೋರ್ಡ್: “ಕೀಬೋರ್ಡ್ ಲೇಔಟ್ಗಳು” ಲೇಔಟ್ಗಳನ್ನು ಆರಿಸುತ್ತದೆ; ಡೀಫಾಲ್ಟ್ ಆಗಿ ಮೆನು ಭಾಷೆಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ, ಹಲವಿದ್ದರೆ ಒಂದು ಕೀ ಅವುಗಳ ನಡುವೆ ಬದಲಿಸುತ್ತದೆ. “ಉಮ್ಲಾಟ್ ಕೀಗಳು” ä, ö, ü ಮತ್ತು ß ಗೆ ಪ್ರತ್ಯೇಕ ಕೀಗಳನ್ನು ನೀಡುತ್ತದೆ. “ಗಾತ್ರ” ಕೀಗಳು ಮತ್ತು ಅಕ್ಷರಗಳನ್ನು ದೊಡ್ಡದಾಗಿಸುತ್ತದೆ. ಟಚ್ ಸ್ಕ್ರೀನ್ಗಳಲ್ಲಿ “ಕೀ ಆಕಾರ” ಕೀಗಳ ನೋಟವನ್ನು ಬದಲಿಸುತ್ತದೆ. “ಸ್ವಯಂಚಾಲಿತ ದೊಡ್ಡಕ್ಷರ” ಪ್ರತಿ ವಾಕ್ಯವನ್ನು ದೊಡ್ಡಕ್ಷರದಿಂದ ಆರಂಭಿಸುತ್ತದೆ."
