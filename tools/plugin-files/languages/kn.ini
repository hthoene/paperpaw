core.host-firmware.foreign = ಇದು PaperPaw ಅನ್ನು ಬೇರೆ ಸಾಧನ ಸಾಫ್ಟ್ವೇರ್ನಿಂದ ಬದಲಿಸುತ್ತದೆ. PaperPaw ತಾನಾಗಿಯೇ ಮತ್ತೆ ಪ್ರಾರಂಭವಾಗುವುದಿಲ್ಲ.
core.host-firmware.no-undo = PaperPaw ಈ ಬದಲಾವಣೆಯನ್ನು ರದ್ದುಗೊಳಿಸಲಾರದು. ಹಿಂತಿರುಗಲು, ಇನ್ನೊಂದು ಸಾಫ್ಟ್ವೇರ್ನ ರಿಕವರಿ ಆಯ್ಕೆಯನ್ನು ಬಳಸಿ ಅಥವಾ ವೆಬ್ ಫ್ಲ್ಯಾಶರ್ ಮೂಲಕ PaperPaw ಅನ್ನು ಮರು-ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ.
core.host-firmware.kept = PaperPaw ಸಾಧನದ ಮೆಮೊರಿಯಲ್ಲಿ ಉಳಿಯುತ್ತದೆ. ಮೆಮೊರಿ ಕಾರ್ಡ್ನಲ್ಲಿರುವ ಫೈಲ್ಗಳು ಬದಲಾಗುವುದಿಲ್ಲ.
core.host-firmware.unsigned = ಈ ಸಾಫ್ಟ್ವೇರ್ಗೆ ಸಹಿ ಇಲ್ಲ. ಅದರ ಫೈಲ್ ರಚನೆ ಮತ್ತು ಸಾಧನ ಹೊಂದಾಣಿಕೆಯನ್ನು ಮಾತ್ರ ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ; ಅದರ ಮೂಲವನ್ನು ಪರಿಶೀಲಿಸಲಾಗುವುದಿಲ್ಲ.
core.host-firmware.unknown-key = ಈ ಸಾಫ್ಟ್ವೇರ್ಗೆ ಅಪರಿಚಿತ ಕೀಯಿಂದ ಸಹಿ ಮಾಡಲಾಗಿದೆ. ಇಲ್ಲಿ ತೋರಿಸಿದ ಕೀಯನ್ನು ನಂಬಿದರೆ ಮಾತ್ರ ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ.
core.host-firmware.downgrade = ಈ ಹಳೆಯ ಆವೃತ್ತಿಯು ಹಿಂದಿನ ಆವೃತ್ತಿಯನ್ನು ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಮರುಸ್ಥಾಪಿಸಲಾರದು. ಹಿಂತಿರುಗಲು ವೆಬ್ ಫ್ಲ್ಯಾಶರ್ ಮೂಲಕ PaperPaw ಅನ್ನು ಮರು-ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ.
core.host-firmware.early-crash = ಹೊಸ ಸಾಫ್ಟ್ವೇರ್ ತನ್ನ ಪ್ರಾರಂಭದ ಸುರಕ್ಷತಾ ಪರಿಶೀಲನೆಗೆ ಮೊದಲೇ ಕ್ರ್ಯಾಶ್ ಆದರೆ, ಸಾಧನ ಪ್ರಾರಂಭವಾಗದೇ ಇರಬಹುದು. PaperPaw ಅನ್ನು ಮರುಸ್ಥಾಪಿಸಲು ನಿಮಗೆ ವೆಬ್ ಫ್ಲ್ಯಾಶರ್ ಬೇಕಾಗುತ್ತದೆ.
