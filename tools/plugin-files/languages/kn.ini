core.usb-drive.title = USB ಡ್ರೈವ್
core.usb-drive.text = USB ಡ್ರೈವ್ ಆಗಿ ಸಂಪರ್ಕಿಸಲಾಗಿದೆ: ಕಾರ್ಡ್ ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿದೆ. ಅದನ್ನು ಮರಳಿ ಪಡೆಯಲು ಅಲ್ಲಿ ಡ್ರೈವ್ ಅನ್ನು ಎಜೆಕ್ಟ್ ಮಾಡಿ ಅಥವಾ ಹಿಂದೆ ಒತ್ತಿ; ನಂತರ ಸರಿ ಒತ್ತಿ. ನೀವು ನಕಲಿಸಿದ ಫೈಲ್ಗಳು ಬಳಿಕ ಲೈಬ್ರರಿಯಲ್ಲಿ ಕಾಣಿಸುತ್ತವೆ.
core.usb-link.title = USB ಡೆವಲಪರ್ ಪರಿಕರಗಳನ್ನು ಅನುಮತಿಸಬೇಕೆ?
core.usb-link.text = USB ಕೇಬಲ್ನಲ್ಲಿರುವ ಕಂಪ್ಯೂಟರ್ ಬಟನ್ಗಳನ್ನು ಒತ್ತಬಹುದು, ಸ್ಕ್ರೀನ್ಶಾಟ್ಗಳನ್ನು ತೆಗೆಯಬಹುದು ಮತ್ತು ಪುಸ್ತಕಗಳು ಹಾಗೂ ಪ್ಲಗಿನ್ ಫೈಲ್ಗಳನ್ನು ಓದಬಹುದು ಮತ್ತು ಬರೆಯಬಹುದು. ಅದು ರಹಸ್ಯಗಳನ್ನು ಓದಲು ಅಥವಾ ಕೋಡ್ ಇನ್ಸ್ಟಾಲ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ. ಸಾಧನ ಮರುಪ್ರಾರಂಭವಾದಾಗ ಅಥವಾ ನಿದ್ರೆಗೆ ಹೋದಾಗ, ಕೇಬಲ್ ತೆಗೆದಾಗ, ಅಥವಾ ನೀವು ಇಲ್ಲಿ ಆಫ್ ಮಾಡಿದಾಗ ಇದು ಆಫ್ ಆಗುತ್ತದೆ.
