lock.plugin.name = ಸ್ಕ್ರೀನ್ ಲಾಕ್
lock.plugin.description = ಸಾಧನ ಎಚ್ಚರಗೊಂಡಾಗ PIN, ಪ್ಯಾಟರ್ನ್ ಅಥವಾ ಪಾಸ್ವರ್ಡ್; ಓದುವಾಗ ಟಚ್ ಲಾಕ್.
lock.plugin.how = "PaperPaw ಪ್ರಾರಂಭವಾದಾಗ ಮತ್ತು ಸಾಧನ ಎಚ್ಚರಗೊಂಡಾಗ ಸ್ಕ್ರೀನ್ ಲಾಕ್ PIN, ಪ್ಯಾಟರ್ನ್ ಅಥವಾ ಪಾಸ್ವರ್ಡ್ ಕೇಳುತ್ತದೆ. ಮೊದಲಿಗೆ ಇದು ಆಫ್ ಆಗಿರುತ್ತದೆ. ಇದು ಸಾಮಾನ್ಯ ಬಳಕೆಯನ್ನು ಮಾತ್ರ ತಡೆಯುತ್ತದೆ: ಕೋಡ್ ಮತ್ತು ತಪ್ಪು ಪ್ರಯತ್ನಗಳ ಎಣಿಕೆ SD ಕಾರ್ಡ್ನಲ್ಲಿರುತ್ತವೆ, ಆದ್ದರಿಂದ ಕಾರ್ಡ್ ತೆಗೆದು, ಎಡಿಟ್ ಮಾಡಿ ಅಥವಾ ಬದಲಿಸಿದವರು ಲಾಕ್ ದಾಟಬಹುದು.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸಾಧನ › ಸ್ಕ್ರೀನ್ ಲಾಕ್ ನಲ್ಲಿ ಹೊಂದಿಸಿ: ಈಗಿನ ಕೋಡ್ ಇದ್ದರೆ ನಮೂದಿಸಿ, ಬಗೆಯನ್ನು ಆರಿಸಿ, ನಂತರ ಹೊಸ ಕೋಡ್ ಎರಡು ಬಾರಿ. ಪ್ಯಾಟರ್ನ್ ಟಚ್ ಸ್ಕ್ರೀನ್ಗಳಲ್ಲಿ ಮಾತ್ರ.\n\nಐದು ತಪ್ಪು ಪ್ರಯತ್ನಗಳ ನಂತರ ಮುಂದಿನದಕ್ಕೆ ಅರ್ಧ ನಿಮಿಷ ಕಾಯಬೇಕು. “ಈಗ ಲಾಕ್ ಮಾಡಿ” ತಕ್ಷಣ ಲಾಕ್ ಮಾಡುತ್ತದೆ; ಇದನ್ನು ಬಟನ್, ಸನ್ನೆ ಅಥವಾ ನಿಯಮಕ್ಕೆ ಹಾಕಬಹುದು. “ಎಚ್ಚರಗೊಂಡ ನಂತರ ಲಾಕ್” ಆಫ್ ಮಾಡಿದರೆ ನಿಜವಾದ ಪ್ರಾರಂಭ (ಪವರ್ ಆನ್ ಅಥವಾ ಮರುಪ್ರಾರಂಭ) ಮಾತ್ರ ಲಾಕ್ ಮಾಡುತ್ತದೆ, ಪ್ರತಿ ಎಚ್ಚರವೂ ಪ್ರಾರಂಭವಾಗಿರುವಲ್ಲಿ ಹೊರತು (ಉದಾ. ಬ್ಯಾಟರಿಯಲ್ಲಿರುವ X4).\n\nಟಚ್ ಲಾಕ್ ಬೇರೆ: ತ್ವರಿತ ಪ್ಯಾನೆಲ್ ಮತ್ತು ಓದುವ ಮೆನುವಿನ “ಟಚ್ ಲಾಕ್ ಮಾಡಿ” ಟ್ಯಾಪ್, ಸ್ವೈಪ್ ಮತ್ತು ಪೆನ್ ಅನ್ನು ನಿಷ್ಕ್ರಿಯಗೊಳಿಸುತ್ತದೆ, ಬಟನ್ಗಳು ಕೆಲಸ ಮಾಡುತ್ತವೆ, ಉದಾ. ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಕೈ ಇಟ್ಟು ಓದಲು. ಅನ್ಲಾಕ್ ಮಾಡಲು ಒಂದು ಬೆರಳಿನಿಂದ ಎರಡು ಬಾರಿ ಟ್ಯಾಪ್ ಮಾಡಿ, ಎರಡನೆಯದನ್ನು ಸ್ವಲ್ಪ ಹಿಡಿಯಿರಿ; ಪವರ್ ಬಟನ್ ಒತ್ತಿಹಿಡಿದರೆ ಪವರ್ ಮೆನು ತೆರೆಯುತ್ತದೆ, ಅಲ್ಲಿ “ಟಚ್ ಅನ್ಲಾಕ್ ಮಾಡಿ” ಬಟನ್ಗಳಿಂದ ಅನ್ಲಾಕ್ ಮಾಡುತ್ತದೆ; X4 Pro ನಲ್ಲಿ ಹೋಮ್ ಬಟನ್ ಒತ್ತಿಹಿಡಿದರೆ ತಕ್ಷಣ ಅನ್ಲಾಕ್ ಆಗುತ್ತದೆ."
