stats.plugin.description = ನೀವು ಎಷ್ಟು ಹೊತ್ತು ಮತ್ತು ಎಷ್ಟು ಓದುತ್ತೀರಿ ಎಂದು ದಾಖಲಿಸುತ್ತದೆ, ಕ್ಯಾಲೆಂಡರ್ ಮತ್ತು ಪ್ರತಿ ಪುಸ್ತಕದ ಸಂಖ್ಯೆಗಳೊಂದಿಗೆ.
stats.plugin.how = "ಓದುವ ಅಂಕಿಅಂಶಗಳು ನೀವು ಪ್ರತಿ ಪುಟವನ್ನು ಎಷ್ಟು ಹೊತ್ತು ಓದುತ್ತೀರಿ ಎಂದು ದಾಖಲಿಸುತ್ತದೆ. ಇದನ್ನು ಇಂದು, ವಾರ ಮತ್ತು ಸತತ ದಿನಗಳ ಅವಲೋಕನವಾಗಿ, ಕ್ಯಾಲೆಂಡರ್ ಆಗಿ, ಮತ್ತು ಪ್ರತಿ ಪುಸ್ತಕದ ಸಂಖ್ಯೆಗಳೊಂದಿಗೆ ನೋಡಬಹುದು.\n\n“ಪರಿಕರಗಳು” ಅಥವಾ ರೀಡರ್ನಲ್ಲಿನ “ಇನ್ನಷ್ಟು” ಯಿಂದ ತೆರೆಯಿರಿ. ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ “ಓದುವ ಅಂಕಿಅಂಶಗಳು” ಅಡಿಯಲ್ಲಿ “ಓದುವಿಕೆ ದಾಖಲಿಸಿ” ಆಫ್ ಮಾಡಬಹುದು, “ದೈನಂದಿನ ಗುರಿ” ಹೊಂದಿಸಬಹುದು, ಮತ್ತು ಎಣಿಕೆಯಾಗುವ “ಕನಿಷ್ಠ ಪುಟ ಸಮಯ” ಮತ್ತು “ಗರಿಷ್ಠ ಪುಟ ಸಮಯ” ಹೊಂದಿಸಬಹುದು, ಇದರಿಂದ ಪುಟಗಳನ್ನು ತಿರುವಿ ಹಾಕುವುದು ಅಥವಾ ತೆರೆದಿಟ್ಟ ಪುಸ್ತಕ ಸಂಖ್ಯೆಗಳನ್ನು ತಪ್ಪಿಸುವುದಿಲ್ಲ.\n\n“KOReader ಜೊತೆ ಸಿಂಕ್” WebDAV ಫೋಲ್ಡರ್ ಮೂಲಕ ಅಂಕಿಅಂಶಗಳನ್ನು KOReader ಜೊತೆ ಹಂಚಿಕೊಳ್ಳುತ್ತದೆ. ಇದು ಅದೇ ಸಾಧನದಲ್ಲಿನ KOReader ಅಂಕಿಅಂಶಗಳನ್ನೂ ಸೇರಿಸಿಕೊಳ್ಳುತ್ತದೆ. ದಾಖಲಿಸಲು ಗಡಿಯಾರ ಹೊಂದಿಸಿರಬೇಕು: ಹೊಂದಿಸದಿದ್ದರೆ ಒಮ್ಮೆ Wi-Fi ಗೆ ಸಂಪರ್ಕಿಸಿ."
