core.clean-up.text = ಅವುಗಳ ಓದಿದ ಸ್ಥಾನ, ಬುಕ್ಮಾರ್ಕ್ಗಳು, ಹೈಲೈಟ್ಗಳು ಮತ್ತು ಟಿಪ್ಪಣಿಗಳು ಶಾಶ್ವತವಾಗಿ ಅಳಿಸಿಹೋಗುತ್ತವೆ. ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ ಮರುಹೆಸರಿಸಿದ ಅಥವಾ ಸರಿಸಿದ ಪುಸ್ತಕ, ಅಥವಾ ಸೇರಿಸದ ಮೆಮೊರಿ ಕಾರ್ಡ್ನಲ್ಲಿರುವ ಪುಸ್ತಕ ಕೂಡ ಸಿಗುವುದಿಲ್ಲ.
core.clean-up.yes = ತೆಗೆದುಹಾಕಿ
core.clean-up.no = ಇರಿಸಿಕೊಳ್ಳಿ
core.clean-up-failed = ಏನನ್ನೂ ಸ್ವಚ್ಛಗೊಳಿಸಲಿಲ್ಲ: ಮೆಮೊರಿ ಕಾರ್ಡ್ನಲ್ಲಿನ ಒಂದು ಫೋಲ್ಡರ್ ಅನ್ನು ಓದಲಾಗಲಿಲ್ಲ.
core.cleaned-up = ಸ್ವಚ್ಛಗೊಳಿಸಲಾಗಿದೆ: ಈಗ ಇಲ್ಲದ ಪುಸ್ತಕಗಳ {count} ಉಳಿಕೆಗಳು
