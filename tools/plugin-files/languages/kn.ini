reader.plugin.name = ರೀಡರ್
reader.plugin.description = ಪುಸ್ತಕಗಳನ್ನು ಪುಟ ಪುಟವಾಗಿ, ಪರಿವಿಡಿ ಮತ್ತು ಓದುವಿಕೆ ಸೆಟ್ಟಿಂಗ್ಗಳೊಂದಿಗೆ ತೋರಿಸುತ್ತದೆ.
reader.plugin.how = "ರೀಡರ್ ಪುಸ್ತಕಗಳನ್ನು ಪುಟ ಪುಟವಾಗಿ ತೋರಿಸುತ್ತದೆ. ಲೈಬ್ರರಿಯಿಂದ ಪುಸ್ತಕ ತೆರೆಯಿರಿ; ಕೊನೆಯ ಪುಸ್ತಕ ಆರಂಭದಲ್ಲೇ ತೆರೆಯಬಹುದು (ಸೆಟ್ಟಿಂಗ್ ಆರಂಭದಲ್ಲಿ ಕೊನೆಯ ಪುಸ್ತಕ ತೆರೆಯಿರಿ).\n\nಪುಟ ತಿರುಗಿಸಲು ಸ್ಕ್ರೀನ್ನ ಎಡ ಅಥವಾ ಬಲ ಟ್ಯಾಪ್ ಮಾಡಿ, ಅಥವಾ ಪುಟ ಬಟನ್ಗಳನ್ನು ಬಳಸಿ. ಮಧ್ಯ ಟ್ಯಾಪ್ ಅಥವಾ ಆಯ್ಕೆ ಓದುವ ಮೆನು ತೆರೆಯುತ್ತದೆ: ಪರಿವಿಡಿ, ಹುಡುಕಿ, ಪುಟಕ್ಕೆ ಹೋಗಿ, ಫಾಂಟ್ ಮತ್ತು ಲೇಔಟ್, ಬುಕ್ಮಾರ್ಕ್ಗಳು ಮತ್ತು ಹೈಲೈಟ್ಗಳು ಇತ್ಯಾದಿ. ಮೇಲಿನ ಅಂಚಿನಿಂದ ಕೆಳಗೆ ಎಳೆದರೆ ತ್ವರಿತ ಪ್ಯಾನೆಲ್, ಕೆಳ ಅಂಚಿನಿಂದ ಮೇಲೆ ಎಳೆದರೆ ಅಥವಾ ಹಿಂದೆ ಒತ್ತಿಹಿಡಿದರೆ ಹೋಮ್.\n\nಚಿತ್ರವನ್ನು ಪೂರ್ಣ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ನೋಡಲು ಆಯ್ಕೆ (ಅಥವಾ ಚಿತ್ರ) ಒತ್ತಿಹಿಡಿಯಿರಿ: ಎಡ ಮತ್ತು ಬಲ ಪುಟದ ಚಿತ್ರಗಳ ನಡುವೆ ಸರಿಸುತ್ತವೆ. ಆಯ್ಕೆ 2x, 3x ಜೂಮ್ ಮಾಡಿ ಮರಳುತ್ತದೆ (ಟಚ್ನಲ್ಲಿ ಡಬಲ್ ಟ್ಯಾಪ್); ಜೂಮ್ನಲ್ಲಿ ಎಡ, ಬಲ ಪಕ್ಕಕ್ಕೆ ಸರಿಸುತ್ತವೆ, ಪುಟ ಬಟನ್ಗಳು (ಅಥವಾ ಸ್ವೈಪ್) ಅಡ್ಡ ಮತ್ತು ಕೆಳಗೆ ಮುಂದುವರಿಯುತ್ತವೆ. ಹಿಂದೆ ಮೊದಲು ಹೊಂದಿಕೆಗೆ, ನಂತರ ಪುಟಕ್ಕೆ (ಟಚ್ನಲ್ಲಿ ಹೊರಬರಲು ಒತ್ತಿಹಿಡಿಯಿರಿ).\n\nಬುಕ್ಮಾರ್ಕ್ಗಾಗಿ ಮೇಲಿನ ಬಲ ಮೂಲೆ ಟ್ಯಾಪ್ ಮಾಡಿ. ಹೈಲೈಟ್ ಮಾಡಲು ಪದವನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ. ಬಟನ್ಗಳಲ್ಲಿ ಎಡ ಒತ್ತಿಹಿಡಿಯಿರಿ: ಎಡ, ಬಲ ಪದದಿಂದ ಪದಕ್ಕೆ, ಪುಟ ಬಟನ್ಗಳು ಸಾಲಿನಿಂದ ಸಾಲಿಗೆ, ಒತ್ತಿಹಿಡಿದರೆ ಪುಟದ ಕೊನೆಗಳಿಗೆ ಮತ್ತು ಪ್ಯಾರಾದಿಂದ ಪ್ಯಾರಾಗೆ; ಆಯ್ಕೆ ಪದಕ್ಕೆ ಹೈಲೈಟ್ ಪಟ್ಟಿ ತೆರೆಯುತ್ತದೆ, ಆಯ್ಕೆ ಒತ್ತಿಹಿಡಿದರೆ ವಾಕ್ಯ ಮತ್ತು ಪ್ಯಾರಾಗೆ ವಿಸ್ತರಿಸುತ್ತದೆ (ಆಗ ಎಡ, ಬಲ ಕೊನೆಯನ್ನು, ಒತ್ತಿಹಿಡಿದರೆ ಆರಂಭವನ್ನು ಸರಿಸುತ್ತವೆ). ಆಯ್ಕೆ ಪುಟ ತಿರುಗಿಸಿದರೂ ಮುಂದುವರಿಯುತ್ತದೆ. Markdown ಆಗಿ ರಫ್ತು ನಿಮ್ಮ ಟಿಪ್ಪಣಿಗಳನ್ನು ಉಳಿಸುತ್ತದೆ."
