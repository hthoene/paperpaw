home.plugin.name = ಹೋಮ್ ಸ್ಕ್ರೀನ್
home.plugin.description = ಆರಂಭ ಪುಟ: ವಿಜೆಟ್ಗಳ ಪುಟಗಳು, ಉದಾ. ಓದುತ್ತಿರುವ ಪುಸ್ತಕ ಮತ್ತು ಪರಿಕರಗಳು.
home.plugin.how = "ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಪುಟಗಳಿಂದ ಕೂಡಿದೆ; ಪ್ರತಿ ಪುಟವು ಫೋನ್ನಂತೆ ವಿಜೆಟ್ಗಳು ಮತ್ತು ಪರಿಕರಗಳ ಗ್ರಿಡ್. ಮೊದಲಿಗೆ ಗಡಿಯಾರ, ನೀವು ಓದುತ್ತಿರುವ ಪುಸ್ತಕ ಮತ್ತು ಇತ್ತೀಚೆಗೆ ಓದಿದ ಪುಸ್ತಕಗಳು ಒಂದು ಪುಟದಲ್ಲಿ, ಎಲ್ಲ ಪರಿಕರಗಳು ಮುಂದಿನ ಪುಟದಲ್ಲಿ ಇರುತ್ತವೆ.\n\nಐಟಂ ತೆರೆಯಲು ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; ಪುಟ ಬದಲಿಸಲು ಸ್ವೈಪ್ ಮಾಡಿ ಅಥವಾ ಪುಟ ಬಟನ್ಗಳನ್ನು ಬಳಸಿ. ಬಟನ್ಗಳು ಮಾತ್ರ ಇದ್ದರೆ ಬಾಣದ ಬಟನ್ಗಳು ಒಂದು ಐಟಂನಿಂದ ಮುಂದಿನದಕ್ಕೆ ಸರಿಯುತ್ತವೆ, “ಆಯ್ಕೆಮಾಡಿ” ಅದನ್ನು ತೆರೆಯುತ್ತದೆ.\n\nಮರುಜೋಡಿಸಲು ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ, ಪುಟದ ಕೆಳಗಿನ ಪೆನ್ಸಿಲ್ ಟ್ಯಾಪ್ ಮಾಡಿ ಅಥವಾ ಮೆನುವಿನಲ್ಲಿ “ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಎಡಿಟ್ ಮಾಡಿ” ಆಯ್ಕೆಮಾಡಿ. ಐಟಂಗಳನ್ನು ಸರಿಸಲು ಎಳೆಯಿರಿ ಅಥವಾ ಆಯ್ಕೆಗಳಿಗಾಗಿ ಒಂದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ (ಬಟನ್ಗಳಿಂದಲೂ ಸಾಧ್ಯ); “ವಿಜೆಟ್ ಸೇರಿಸಿ” ಕೂಡ ಅಲ್ಲಿದೆ. ಕಾಲಮ್ಗಳು ಮತ್ತು ಸಾಲುಗಳು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ನೋಟ › ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅಡಿಯಲ್ಲಿವೆ.\n\nಅಡ್ಡ ತಿರುಗಿಸಿದ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅದೇ ಐಟಂಗಳನ್ನು ಹೆಚ್ಚು ಕಾಲಮ್ಗಳಲ್ಲಿ ತೋರಿಸುತ್ತದೆ, ಒಂದು ಪುಟ ತುಂಬಿದ ನಂತರ ಮುಂದಿನದು; ಕಾರ್ಡ್ಗಳು ಸುಮಾರು 110 ಮಿ.ಮೀ ಗಿಂತ ಅಗಲವಿರುವುದಿಲ್ಲ. ನೇರ ಸ್ಥಿತಿಯ ಜೋಡಣೆ ಬದಲಾಗುವುದಿಲ್ಲ. ಅಡ್ಡ ಸ್ಥಿತಿಯಲ್ಲಿ ಜೋಡಿಸಿದರೆ ಆ ಲೇಔಟ್ ಆ ದಿಕ್ಕಿಗೆ ಪ್ರತ್ಯೇಕವಾಗಿ ಉಳಿಯುತ್ತದೆ; ಹೊಸ ವಿಜೆಟ್ಗಳು ಎರಡಕ್ಕೂ ಸೇರುತ್ತವೆ. “ಸೇರಿಸಿ” (ಎಡಿಟ್ ಮಾಡುವಾಗ) ಅಡಿಯ “ಲ್ಯಾಂಡ್ಸ್ಕೇಪ್ ಲೇಔಟ್ ಮರುಹೊಂದಿಸಿ” ಮೂಲದಿಂದ ಪಡೆದ ಲೇಔಟ್ಗೆ ಹಿಂದಿರುಗಿಸುತ್ತದೆ. ಒಂದು ದಿಕ್ಕಿನಲ್ಲಿ ತೆಗೆದುಹಾಕಿದ ವಿಜೆಟ್ ಅಥವಾ ಪರಿಕರ ಇನ್ನೊಂದರಲ್ಲಿ ಉಳಿಯುತ್ತದೆ."
