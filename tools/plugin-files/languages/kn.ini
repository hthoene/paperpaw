store.plugin.name = ಪ್ಲಗಿನ್ ಸ್ಟೋರ್
store.plugin.description = ಈ ಸಾಧನಕ್ಕಾಗಿ ಪ್ಲಗಿನ್ಗಳನ್ನು ಹುಡುಕುತ್ತದೆ, ಇನ್ಸ್ಟಾಲ್ ಮಾಡುತ್ತದೆ, ಅಪ್ಡೇಟ್ ಮಾಡುತ್ತದೆ ಮತ್ತು ತೆಗೆದುಹಾಕುತ್ತದೆ.
store.plugin.how = "ಪ್ಲಗಿನ್ ಸ್ಟೋರ್ ಈ ಸಾಧನಕ್ಕಾಗಿ ಇಂಟರ್ನೆಟ್ನಲ್ಲಿ ಪ್ಲಗಿನ್ಗಳನ್ನು ಹುಡುಕಿ ಇನ್ಸ್ಟಾಲ್, ಅಪ್ಡೇಟ್ ಮಾಡುತ್ತದೆ ಮತ್ತು ತೆಗೆದುಹಾಕುತ್ತದೆ. ಪರಿಕರಗಳಿಂದ ತೆರೆಯಿರಿ; Wi-Fi ಬೇಕು.\n\nಆರಂಭದಲ್ಲಿ ಶಿಫಾರಸುಗಳು, ಹೊಸವು, ಜನಪ್ರಿಯವಾದವು, ನಂತರ ಗುಂಪುಗಳು. ಗುಂಪಿನ ಪ್ಲಗಿನ್ಗಳು ಪ್ರತಿದಿನ ಬದಲಾಗುವ ಮಿಶ್ರಣದಲ್ಲಿರುತ್ತವೆ; A-Z, ಹೊಸದು ಅಥವಾ ಇತ್ತೀಚಿನ ಅಪ್ಡೇಟ್ ಪ್ರಕಾರ ವಿಂಗಡಿಸಿ. ಒಂದನ್ನು ತೆರೆದು ಗಾತ್ರ, ಮೆಮೊರಿ ನೋಡಿ, ನಂತರ ಇನ್ಸ್ಟಾಲ್, ಅಪ್ಡೇಟ್ ಅಥವಾ ತೆಗೆದುಹಾಕಿ. ಎಲ್ಲವನ್ನೂ ಅಪ್ಡೇಟ್ ಮಾಡಿ ಎಲ್ಲವನ್ನೂ ಹೊಸದಾಗಿಸುತ್ತದೆ.\n\nಕೋಡ್ ಪ್ಲಗಿನ್ಗಳಿಗೆ ಸಾಧನದ ಪೂರ್ಣ ಪ್ರವೇಶವಿದೆ: ಸ್ಟೋರ್ ಮೊದಲು ಕೇಳುತ್ತದೆ, ಅವು ಮರುಪ್ರಾರಂಭದ ನಂತರ ಶುರುವಾಗುತ್ತವೆ. ಒಂದು ವಿಫಲವಾದರೆ PaperPaw ಕೋಡ್ ಪ್ಲಗಿನ್ಗಳಿಲ್ಲದೆ ಪ್ರಾರಂಭವಾಗಿ ಯಾವುದೆಂದು ತಿಳಿಸುತ್ತದೆ. ಪಟ್ಟಿ ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ ಎಂಬುದನ್ನು ಪ್ಲಗಿನ್ ಲೈಬ್ರರಿ ನಿರ್ಧರಿಸುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳು, ಸಿಸ್ಟಂನಲ್ಲಿರುವ ಸಮುದಾಯ ಪ್ಲಗಿನ್ಗಳು GitHub ನಲ್ಲಿ ಇತರರು ಪ್ರಕಟಿಸಿದವನ್ನೂ ತೋರಿಸುತ್ತದೆ. ಅವುಗಳನ್ನು ಯಾರೂ ಪರಿಶೀಲಿಸಿಲ್ಲ: ಅವು “ಪರಿಶೀಲಿಸದ” ಗುರುತು ಹೊಂದಿವೆ, ಕೋಡ್ ಪ್ಲಗಿನ್ನ ಪುಟ ಅದರ ಸಹಿ ಕೀಯನ್ನು ತೋರಿಸುತ್ತದೆ, ಬೇರೆ ಕೀಯ ಅಪ್ಡೇಟ್ ಇನ್ಸ್ಟಾಲ್ ಆಗುವುದಿಲ್ಲ.\n\nಮೂಲಗಳು (ಆರಂಭದ ಕೊನೆಯ ಸಾಲು) ಇತರರ ಪ್ಲಗಿನ್ ಪಟ್ಟಿಗಳನ್ನು ವಿಳಾಸದಿಂದ (https://…/plugins.json) ಸೇರಿಸುತ್ತದೆ, PaperPaw ನ ಪಟ್ಟಿಯ ಬದಲು ತೋರಿಸುತ್ತದೆ ಅಥವಾ ತೆಗೆದುಹಾಕುತ್ತದೆ. ಟೈಪ್ ಮಾಡುವ ಬದಲು, ಸಾಲಿಗೊಂದು ವಿಳಾಸವಿರುವ sources.txt ಅನ್ನು ಕಾರ್ಡ್ನ .paperpaw/plugins/store ಗೆ ಹಾಕಿ. PaperPaw ಮೂಲಗಳನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ; ಸಾಧನ ಮೂಲದ ಸರ್ವರ್ ಅನ್ನು ಸಂಪರ್ಕಿಸುತ್ತದೆ. ಮೊದಲು ಓದಿದ ಪಟ್ಟಿಯ ಕೀಯನ್ನು ಸಾಧನ ನೆನಪಿಡುತ್ತದೆ, ನಂತರ ಆ ಕೀಯ ಸಹಿ ಇರುವುದನ್ನು ಮಾತ್ರ ಸ್ವೀಕರಿಸುತ್ತದೆ. ಪ್ಲಗಿನ್ ತಾನು ಬಂದ ಮೂಲದಿಂದಲೇ ಅಪ್ಡೇಟ್ ಪಡೆಯುತ್ತದೆ. PaperPaw ನ ಸ್ವಂತ ಲೈಬ್ರರಿ ಯಾವಾಗಲೂ ಇರುತ್ತದೆ."
