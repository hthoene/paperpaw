power.plugin.description = ಪವರ್ ಮೋಡ್ ಆಯ್ಕೆಮಾಡುತ್ತದೆ, ಕೈಯಾರೆ ಅಥವಾ ಬ್ಯಾಟರಿ ಪ್ರಕಾರ: ಸಾಮಾನ್ಯ, ಉಳಿತಾಯ, ಆಫ್ಲೈನ್.
power.plugin.how = "PaperPaw ಬ್ಯಾಟರಿಯನ್ನು ಹೇಗೆ ಬಳಸಬೇಕು ಎಂದು ಪವರ್ ಆಯ್ಕೆಮಾಡುತ್ತದೆ: ಸಾಮಾನ್ಯ, ಉಳಿತಾಯ ಅಥವಾ ಆಫ್ಲೈನ್. ಉಳಿತಾಯ ಕಾಯಬಹುದಾದ ಕೆಲಸಗಳನ್ನು ಸೂಕ್ತ ಸಮಯದಲ್ಲಿ ಮಾಡುತ್ತದೆ; ಆಫ್ಲೈನ್ ರೇಡಿಯೋವನ್ನು ಆಫ್ ಇರಿಸುತ್ತದೆ. ಸ್ವಯಂ ಬ್ಯಾಟರಿ ಪ್ರಕಾರ ಆಯ್ಕೆಮಾಡುತ್ತದೆ.\n\nಮೋಡ್ ಅನ್ನು ತ್ವರಿತ ಪ್ಯಾನೆಲ್ನಲ್ಲಿ (ಅಲ್ಲಿ ಪವರ್ ಮೋಡ್ಗಳನ್ನು ಅಕ್ಕಪಕ್ಕ ತೋರಿಸುತ್ತದೆ) ಅಥವಾ ಸೆಟ್ಟಿಂಗ್ಗಳ ಪವರ್ ಅಡಿಯಲ್ಲಿ ಬದಲಾಯಿಸಿ. ಅಲ್ಲಿ ಸ್ವಯಂ ಯಾವ ಮಟ್ಟದಲ್ಲಿ ಉಳಿತಾಯ ಮತ್ತು ಆಫ್ಲೈನ್ಗೆ ಬದಲಾಗಬೇಕು, ಮತ್ತು ಚಾರ್ಜ್ ಆಗುವಾಗ ಸಾಮಾನ್ಯವಾಗಿ ಇರಬೇಕೆ ಎಂದೂ ಹೊಂದಿಸಿ.\n\nಸ್ಥಿತಿ ಪಟ್ಟಿಗಳಲ್ಲಿ ಪವರ್ ಮೋಡ್ ಉಳಿತಾಯದಲ್ಲಿ ಎಲೆಯನ್ನು, ಆಫ್ಲೈನ್ನಲ್ಲಿ ಅಡ್ಡಗೆರೆ ಹಾಕಿದ Wi-Fi ಅನ್ನು ತೋರಿಸುತ್ತದೆ, ಸಾಮಾನ್ಯದಲ್ಲಿ ಏನೂ ಇಲ್ಲ.\n\nಪವರ್ ಬಟನ್ ಒತ್ತಿಹಿಡಿದರೆ ಸಣ್ಣ ಮೆನು ತೆರೆಯುತ್ತದೆ: ನಿದ್ರೆ, ಸ್ವಿಚ್ ಆಫ್ (PaperPaw ಗೆ ಸಾಧ್ಯವಿರುವಲ್ಲಿ), ಮರುಪ್ರಾರಂಭಿಸಿ, ಮತ್ತು ಟಚ್ ಸಾಧನಗಳಲ್ಲಿ ಟಚ್ ಲಾಕ್ ಅಥವಾ ಟಚ್ ಅನ್ಲಾಕ್. ಸಣ್ಣ ಒತ್ತುವಿಕೆ ಈಗಲೂ ಸಾಧನವನ್ನು ನಿದ್ರೆಗೆ ಹಾಕುತ್ತದೆ. ಹಿಂದೆ ಮೆನುವಿನಿಂದ ಹೊರಬರುತ್ತದೆ."
