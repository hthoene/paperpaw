about.plugin.name = ಕುರಿತು
about.plugin.description = PaperPaw ನ ಆವೃತ್ತಿ ಮತ್ತು ಪರವಾನಗಿಗಳು.
about.plugin.how = "ನಿಮ್ಮಲ್ಲಿ PaperPaw ನ ಯಾವ ಆವೃತ್ತಿ ಇದೆ, ಅದರ ಮೂಲ ಕೋಡ್ ಎಲ್ಲಿದೆ ಮತ್ತು ಅದು ಯಾವ ಪರವಾನಗಿಗಳ ಅಡಿಯಲ್ಲಿ ಬರುತ್ತದೆ ಎಂಬುದನ್ನು ಕುರಿತು ತೋರಿಸುತ್ತದೆ.\n\nಇದು ಸೆಟ್ಟಿಂಗ್ಗಳ ಕೊನೆಯಲ್ಲಿ, PaperPaw ಕುರಿತು ಎಂದು ಇದೆ. ಬಾಣದ ಬಟನ್ಗಳು ಮತ್ತು ಆಯ್ಕೆಮಾಡಿ ಬಳಸಿ ಒಂದು ಸಾಲನ್ನು ಆರಿಸಿ, ಅಥವಾ ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ. ಫರ್ಮ್ವೇರ್ನಲ್ಲಿ ಅಂತರ್ಗತ ಪ್ಲಗಿನ್ಗಳು, ಮತ್ತು ಕೋಡ್ ಇರುವ ಪ್ಲಗಿನ್ಗಳನ್ನು ಲೋಡ್ ಮಾಡುವ ಸಾಧನಗಳಲ್ಲಿ ಅಂತಹ ಪ್ಲಗಿನ್ಗಳನ್ನು ನಿರ್ಮಿಸಬೇಕಾದ ಫಿಂಗರ್ಪ್ರಿಂಟ್ ಕೂಡ ಅಲ್ಲಿ ಪಟ್ಟಿಯಾಗಿವೆ.\n\nಪರವಾನಗಿಗಳು ರೀಡರ್ನಲ್ಲಿ ಪಠ್ಯವಾಗಿ ತೆರೆಯುತ್ತದೆ, ಆದ್ದರಿಂದ ಪುಸ್ತಕದಂತೆ ಪುಟ ತಿರುಗಿಸಿ ಓದಬಹುದು. ಅದರಲ್ಲಿ PaperPaw ನ ಸ್ವಂತ ಪರವಾನಗಿ ಮತ್ತು ಅದರೊಂದಿಗೆ ಬರುವ ಫಾಂಟ್ಗಳು, ಐಕಾನ್ಗಳು ಮತ್ತು ಪದ ವಿಭಜನೆ ಮಾದರಿಗಳ ಪರವಾನಗಿಗಳಿವೆ. ಪ್ಲಗಿನ್ಗಳು ತಮ್ಮದೇ ಸಾಲನ್ನು ಸೇರಿಸಬಹುದು, ಉದಾಹರಣೆಗೆ ಥೀಮ್ನ ಲೇಖಕ."
