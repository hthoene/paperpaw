calibre.plugin.name = ವೈರ್ಲೆಸ್ ಲೈಬ್ರರಿ
calibre.plugin.description = ನೆಟ್ವರ್ಕ್ ಮೂಲಕ ಪುಸ್ತಕಗಳನ್ನು ಸ್ವೀಕರಿಸುತ್ತದೆ. calibre ಗಾಗಿ ವೈರ್ಲೆಸ್ ಸಾಧನವಾಗಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ.
calibre.plugin.how = "ವೈರ್ಲೆಸ್ ಲೈಬ್ರರಿಯಿಂದ ಸಾಧನವು ನಿಮ್ಮ ಕಂಪ್ಯೂಟರ್ನ Calibre ನಲ್ಲಿ ವೈರ್ಲೆಸ್ ಸಾಧನವಾಗಿ ಕಾಣಿಸುತ್ತದೆ. ಆಗ Calibre ಇದಕ್ಕೆ ಪುಸ್ತಕಗಳನ್ನು ಕಳುಹಿಸಬಹುದು, ಪಟ್ಟಿಮಾಡಬಹುದು ಮತ್ತು ಅಳಿಸಬಹುದು. ಪುಸ್ತಕಗಳು ಲೈಬ್ರರಿಗೆ ಹೋಗುತ್ತವೆ.\n\nಸಾಧನ ಮತ್ತು ಕಂಪ್ಯೂಟರ್ ಒಂದೇ Wi-Fi ನೆಟ್ವರ್ಕ್ನಲ್ಲಿರುವಾಗ “ಪರಿಕರಗಳು” ಮೆನುವಿನಿಂದ ವೈರ್ಲೆಸ್ ಲೈಬ್ರರಿ ತೆರೆಯಿರಿ. Calibre ನಲ್ಲಿ Connect/share, ನಂತರ Start wireless device connection ಆಯ್ಕೆಮಾಡಿ. ಸಾಧನವು ನಿಮ್ಮ ಕಂಪ್ಯೂಟರ್ ಅನ್ನು ಕಂಡುಕೊಂಡಾಗ ಅದರ ಹೆಸರು ತೋರಿಸುತ್ತದೆ; “ಸಂಪರ್ಕಿಸಿ” ಟ್ಯಾಪ್ ಮಾಡಿ (ಬಟನ್ಗಳಿಂದ “ಆಯ್ಕೆಮಾಡಿ” ಒತ್ತಿ). Calibre ಇಲ್ಲಿ ಪುಸ್ತಕಗಳನ್ನು ಸೇರಿಸಬಹುದು ಮತ್ತು ಅಳಿಸಬಹುದು, ಆದ್ದರಿಂದ ನಿಮ್ಮ ಸ್ವಂತ ಕಂಪ್ಯೂಟರ್ಗೆ ಮಾತ್ರ ಸಂಪರ್ಕಿಸಿ. ಸ್ಕ್ರೀನ್ ಮುಚ್ಚಿದರೆ ಸಂಪರ್ಕ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ.\n\nCalibre ತಾನಾಗಿ ಸಿಗದಿದ್ದರೆ, ಅದರ ಕಂಪ್ಯೂಟರ್ನ ವಿಳಾಸವನ್ನು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ “ಲೈಬ್ರರಿ” ಅಡಿಯ Calibre ಭಾಗದಲ್ಲಿ “ವಿಳಾಸ” ಆಗಿ ನಮೂದಿಸಿ. Calibre 9090 ಅಲ್ಲದ ಪೋರ್ಟ್ ಬಳಸಿದರೆ, ಅದನ್ನು :ಪೋರ್ಟ್ ಆಗಿ ಸೇರಿಸಿ, ಉದಾ. 192.168.1.20:9091."
