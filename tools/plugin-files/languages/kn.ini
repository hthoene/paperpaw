diagnostics.plugin.name = ಡಯಾಗ್ನೋಸ್ಟಿಕ್ಸ್
diagnostics.plugin.description = ಪರೀಕ್ಷಾ ಸ್ಕ್ರೀನ್ ಮತ್ತು ಸಾಧನದ ಪ್ರತಿ ಭಾಗದ ಮಾರ್ಗದರ್ಶಿತ ಪರಿಶೀಲನೆ.
diagnostics.plugin.how = "ಡಯಾಗ್ನೋಸ್ಟಿಕ್ಸ್ ಸಾಧನವನ್ನು ಪರೀಕ್ಷಿಸುವ ಸ್ಕ್ರೀನ್: ಪ್ಯಾನೆಲ್ ತೋರಿಸಬಲ್ಲ ಪ್ರತಿ ಬೂದು ಛಾಯೆ, ಬಟನ್ಗಳು ಮತ್ತು ಟಚ್ ಪ್ರಯತ್ನಿಸಲು ನಾಲ್ಕು ಚೌಕಗಳು, ರಿಫ್ರೆಶ್ ಮೋಡ್ಗಳನ್ನು ಹೋಲಿಸಲು ಪ್ರಗತಿ ಪಟ್ಟಿಯೊಂದಿಗೆ ಪುಟ ಎಣಿಕೆ.\n\nಪರೀಕ್ಷಾ ಸ್ಕ್ರೀನ್ಗೆ ಮೆನು ನಮೂದು ಇಲ್ಲ. ಬೇರೆ ಪ್ಲಗಿನ್ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ನೀಡದಿದ್ದಾಗ, ಅಥವಾ ಪ್ಲಗಿನ್ ನಿರ್ವಾಹಕದ “ಸ್ಕ್ರೀನ್ಗಳು” ಅಡಿಯಲ್ಲಿ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಸ್ಥಾನಕ್ಕೆ ಇದನ್ನು ಆಯ್ಕೆಮಾಡಿದಾಗ ಮಾತ್ರ ಇದು ಹೋಮ್ ಸ್ಕ್ರೀನ್.\n\n“ಆಯ್ಕೆಮಾಡಿ” ಫೋಕಸ್ನಲ್ಲಿರುವ ಚೌಕವನ್ನು ಗುರುತಿಸುತ್ತದೆ, ಬಾಣದ ಬಟನ್ಗಳು ಚೌಕಗಳ ನಡುವೆ ಸರಿಸುತ್ತವೆ; ಟಚ್ನಲ್ಲಿ ಚೌಕವನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ. ಪುಟ ಬಟನ್ಗಳು ಪರೀಕ್ಷಾ ಪುಟಗಳನ್ನು ತಿರುಗಿಸುತ್ತವೆ. ಮತ್ತೆ ಆರಂಭಿಸಲು “ಆಯ್ಕೆಮಾಡಿ” ಅಥವಾ ಸ್ಕ್ರೀನ್ ಮೇಲೆ ಬೆರಳನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ.\n\nPaperPaw ಸಾಧನದ ಫರ್ಮ್ವೇರ್ ಆಗಿರುವಲ್ಲಿ “ಪರಿಕರಗಳು” ಅಡಿಯ ಸಾಧನ ಪರಿಶೀಲನೆ ಪ್ರತಿ ಭಾಗವನ್ನು ಒಂದೊಂದು ಪುಟದಲ್ಲಿ ಪರೀಕ್ಷಿಸುತ್ತದೆ: ಸ್ಕ್ರೀನ್, ಬಟನ್ಗಳು, ಟಚ್, ಮುಂಭಾಗದ ಬೆಳಕು, ಬ್ಯಾಟರಿ, ಕಾರ್ಡ್, ಗಡಿಯಾರ, Wi-Fi, ನಿದ್ರೆ ಮತ್ತು ಮೆಮೊರಿ. ಪ್ರತಿ ಪುಟವು ವಿಫಲ, ಬಿಟ್ಟುಬಿಡಿ ಮತ್ತು ಉತ್ತೀರ್ಣದೊಂದಿಗೆ ಕೊನೆಗೊಳ್ಳುತ್ತದೆ; ಅಳತೆಗಳು ಸೂಚಿಸುವ ಉತ್ತರ ಆಯ್ಕೆಯಾಗಿರುತ್ತದೆ. ಸಾಧನದಲ್ಲಿ ಇಲ್ಲದ ಭಾಗಗಳನ್ನು ಬಿಡಲಾಗುತ್ತದೆ. ಪ್ರತಿ ಉತ್ತರದ ನಂತರ ಪುಲ್ ರಿಕ್ವೆಸ್ಟ್ಗೆ ಅಂಟಿಸಲು .paperpaw/plugins/diagnostics/device-check.txt ಗೆ ವರದಿ ಬರೆಯುತ್ತದೆ. “ಹಿಂದೆ” ಅದರಿಂದ ಹೊರಬರುತ್ತದೆ; ಮತ್ತೆ ತೆರೆದಾಗ ಅಲ್ಲಿಂದಲೇ ಮುಂದುವರಿಯುತ್ತದೆ. ಬಟನ್ಗಳು ಮಾತ್ರ ಇರುವ ಸಾಧನದಲ್ಲಿ ಮೊದಲು ಬಟನ್ಗಳ ಪುಟದಲ್ಲಿ “ಆರಂಭಿಸಿ” ಆಯ್ಕೆಮಾಡಿ; ಅಲ್ಲಿಯವರೆಗೆ ಬಾಣಗಳು, “ಆಯ್ಕೆಮಾಡಿ” ಮತ್ತು “ಹಿಂದೆ” ಎಲ್ಲಾ ಪುಟಗಳಂತೆ ಕೆಲಸ ಮಾಡುತ್ತವೆ."
