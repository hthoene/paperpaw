translate.plugin.how = "ಅನುವಾದ ಆಯ್ಕೆಮಾಡಿದ ಪಠ್ಯವನ್ನು DeepL ಮೂಲಕ ಆನ್ಲೈನ್ನಲ್ಲಿ ಅನುವಾದಿಸುತ್ತದೆ. ಪುಸ್ತಕದಲ್ಲಿ ಪಠ್ಯ ಆಯ್ಕೆಮಾಡಿ, ಆಯ್ಕೆಯ ಮೆನುವಿನಲ್ಲಿ ಅನುವಾದಿಸಿ ಆರಿಸಿ: ನಿಘಂಟು ನಮೂದಿನಂತೆ ಅನುವಾದ ಪುಟದ ಮೇಲೆ ಕಾಣಿಸುತ್ತದೆ. ಪುಟ ಬಟನ್ಗಳು ಅಥವಾ ಟ್ಯಾಪ್ಗಳು ಅದನ್ನು ಸ್ಕ್ರಾಲ್ ಮಾಡುತ್ತವೆ; ಆಯ್ಕೆ ಅಥವಾ ಕೊನೆಯಲ್ಲಿ ಟ್ಯಾಪ್ ಅದನ್ನು ಮುಚ್ಚುತ್ತದೆ.\n\nಇದಕ್ಕೆ ನೆಟ್ವರ್ಕ್ ಮತ್ತು ನಿಮ್ಮದೇ DeepL API ಕೀ ಬೇಕು, deepl.com ನಲ್ಲಿ ಉಚಿತ (DeepL API Free, ತಿಂಗಳಿಗೆ ಸುಮಾರು 5,00,000 ಅಕ್ಷರಗಳು). ನೀವು ಅದನ್ನು ನಮೂದಿಸುವವರೆಗೆ ಪ್ಯಾನೆಲ್ ಹಾಗೆ ಹೇಳುತ್ತದೆ, ಟ್ಯಾಪ್ ಮಾಡಿದರೆ ಅದನ್ನು ಕೇಳುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ, ಓದುವಿಕೆ ಅಡಿಯಲ್ಲಿ, ಅನುವಾದ ವಿಭಾಗದಲ್ಲಿ, ಇದಕ್ಕೆ ಅನುವಾದಿಸಿ ಭಾಷೆಯನ್ನು ಹೊಂದಿಸುತ್ತದೆ; ಮೊದಲು ಅದು PaperPaw ನ ಭಾಷೆ."
