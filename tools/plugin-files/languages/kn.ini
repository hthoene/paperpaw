weather.plugin.name = ಹವಾಮಾನ
weather.plugin.description = ಈಗಿನ ಹವಾಮಾನ ಮತ್ತು ಮುಂದಿನ ದಿನಗಳು ವಿಜೆಟ್ಗಳಾಗಿ, Open-Meteo ಯಿಂದ.
weather.plugin.how = "ಹವಾಮಾನ ಪ್ಲಗಿನ್ ಈಗಿನ ಹವಾಮಾನ ಮತ್ತು ಮುಂದಿನ ದಿನಗಳನ್ನು ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ವಿಜೆಟ್ಗಳಾಗಿ ತೋರಿಸುತ್ತದೆ, Open-Meteo ಯಿಂದ; ಇದಕ್ಕೆ ಖಾತೆ ಅಥವಾ ಕೀ ಬೇಕಿಲ್ಲ. ಈಗಿನ ಹವಾಮಾನ ತಾಪಮಾನ, ಸ್ಥಿತಿ ಮತ್ತು ನೀವು ಆರಿಸುವ ಇನ್ನಷ್ಟನ್ನು ತೋರಿಸುತ್ತದೆ; ಮುನ್ಸೂಚನೆ ಮುಂದಿನ ದಿನಗಳನ್ನು ಸಾಲಾಗಿ ಅಥವಾ ಪಟ್ಟಿಯಾಗಿ ತೋರಿಸುತ್ತದೆ.\n\nಮೊದಲು ಸ್ಥಳ ಆಯ್ಕೆಮಾಡಿ: ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ, ಹವಾಮಾನ ಅಡಿಯಲ್ಲಿ, ಸ್ಥಳ (ಹೆಸರು ಟೈಪ್ ಮಾಡಿ, ನಂತರ ಸಿಕ್ಕ ಸ್ಥಳಗಳಿಂದ ಆರಿಸಿ). ಅದರ ನಿರ್ದೇಶಾಂಕಗಳನ್ನು ಮಾತ್ರ ಕಳುಹಿಸಲಾಗುತ್ತದೆ, ಅದೂ ಹವಾಮಾನ ವಿಜೆಟ್ ತೋರುತ್ತಿರುವಾಗ ಮಾತ್ರ. ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಸಂಪಾದಿಸಿ ವಿಜೆಟ್ಗಳನ್ನು ಸೇರಿಸಿ.\n\n“ಗರಿಷ್ಠ ಅಪ್ಡೇಟ್ ಅಂತರ” ಹೇಳುವಷ್ಟು ಬಾರಿ ಮಾತ್ರ, ಮತ್ತು ನೆಟ್ವರ್ಕ್ ಇರುವಾಗ ಮಾತ್ರ ಹವಾಮಾನ ತರಲಾಗುತ್ತದೆ: ಅದು ತಾನಾಗಿ Wi-Fi ಆನ್ ಮಾಡುವುದಿಲ್ಲ.\n\nಹವಾಮಾನ ಡೇಟಾ: Open-Meteo.com (https://open-meteo.com), Creative Commons Attribution 4.0 ಪರವಾನಗಿ (CC BY 4.0) ಅಡಿಯಲ್ಲಿ."
