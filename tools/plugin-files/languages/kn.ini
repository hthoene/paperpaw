menu-editor.plugin.name = ಮೆನು ಎಡಿಟರ್
menu-editor.plugin.description = ಪ್ರತಿ ಮೆನುವಿನ ನಮೂದುಗಳನ್ನು ಮರುಜೋಡಿಸುತ್ತದೆ, ತೆಗೆದುಹಾಕುತ್ತದೆ ಮತ್ತು ಸೇರಿಸುತ್ತದೆ.
menu-editor.plugin.how = "ಮೆನು ಎಡಿಟರ್ ಮೆನುಗಳಲ್ಲಿ ಏನಿದೆ ಎಂಬುದನ್ನು ಬದಲಿಸುತ್ತದೆ: ನಮೂದುಗಳನ್ನು ಮೇಲೆ ಅಥವಾ ಕೆಳಗೆ ಸರಿಸಿ, ತೆಗೆದುಹಾಕಿ, ಅಥವಾ ಹೊಸದನ್ನು ಸೇರಿಸಿ.\n\nಇದು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಕಸ್ಟಮೈಸ್ ಅಡಿಯಲ್ಲಿ “ಮೆನುಗಳನ್ನು ಕಸ್ಟಮೈಸ್ ಮಾಡಿ” ಆಗಿದೆ. ಮೆನು ಆರಿಸಿ, ನಂತರ ಸರಿಸಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ನಮೂದನ್ನು ಆರಿಸಿ; “ನಮೂದು ಸೇರಿಸಿ” ಹೊಸದನ್ನು ಸೇರಿಸುತ್ತದೆ. ಬದಲಾವಣೆಗಳು ತಕ್ಷಣ ಅನ್ವಯಿಸುತ್ತವೆ. “ಈ ಮೆನು ಮರುಹೊಂದಿಸಿ” ಮೆನುವನ್ನು ಅದರ ಪ್ಲಗಿನ್ಗಳು ವ್ಯಾಖ್ಯಾನಿಸಿದಂತೆ ಮರಳಿ ತರುತ್ತದೆ, “ಎಲ್ಲ ಮೆನುಗಳನ್ನು ಮರುಹೊಂದಿಸಿ” ಎಲ್ಲ ಮೆನುಗಳಿಗೂ ಹಾಗೆ ಮಾಡುತ್ತದೆ.\n\nನೀವು ನಿಮ್ಮನ್ನೇ ಹೊರಗೆ ಲಾಕ್ ಮಾಡಿಕೊಳ್ಳಲಾಗುವುದಿಲ್ಲ: ಸೆಟ್ಟಿಂಗ್ಗಳಿಗೆ ದಾರಿಯಾದ ನಮೂದು, ನೀವು ಅಲ್ಲಿಗೆ ಬೇರೆ ದಾರಿ ಸೇರಿಸುವವರೆಗೆ ಉಳಿಯುತ್ತದೆ."
