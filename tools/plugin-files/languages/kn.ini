plugin-manager.plugin.name = ಪ್ಲಗಿನ್ ಮ್ಯಾನೇಜರ್
plugin-manager.plugin.description = ಪ್ಲಗಿನ್ಗಳನ್ನು ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ ಮತ್ತು ಅವುಗಳನ್ನು ಆನ್, ಆಫ್ ಮಾಡುತ್ತದೆ.
plugin-manager.plugin.how = "ಪ್ಲಗಿನ್ ಮ್ಯಾನೇಜರ್ ಪ್ರತಿಯೊಂದು ಪ್ಲಗಿನ್ ಅನ್ನು ಅದರ ಆವೃತ್ತಿ ಮತ್ತು ವಿವರಣೆಯೊಂದಿಗೆ ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ, ಮತ್ತು ಪ್ಲಗಿನ್ಗಳನ್ನು ಆನ್, ಆಫ್ ಮಾಡುತ್ತದೆ.\n\nಇದು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಪ್ಲಗಿನ್ಗಳನ್ನು ನಿರ್ವಹಿಸಿ ಆಗಿ ಇದೆ. ಪ್ಲಗಿನ್ ಸೆಟ್ಟಿಂಗ್ಗಳು ಪ್ರತ್ಯೇಕ ಪುಟ, ಉದಾ. ಪ್ರತಿ ಪ್ಲಗಿನ್ನ ನೆಟ್ವರ್ಕ್ ಬಳಕೆಗಾಗಿ. ಆನ್ ಅಥವಾ ಆಫ್ ಮಾಡಲು ಪ್ಲಗಿನ್ ಅನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ (ಬಟನ್ಗಳಲ್ಲಿ ಅದನ್ನು ಆಯ್ಕೆಮಾಡಿ). ಬದಲಾವಣೆ ಮರುಪ್ರಾರಂಭದ ನಂತರ ಅನ್ವಯವಾಗುತ್ತದೆ: ಆಗ ಕೆಳಗಿನ ಪಟ್ಟಿ ಈಗ ಮರುಪ್ರಾರಂಭಿಸಿ ಅನ್ನು ನೀಡುತ್ತದೆ. ಅದು ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ ಎಂದು ಓದಲು ಪ್ಲಗಿನ್ ಅನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಲ್ಲಿ ಆಯ್ಕೆ ಒತ್ತಿಹಿಡಿಯಿರಿ).\n\nಯಾವಾಗಲೂ ಆನ್ ಎಂದು ಗುರುತಿಸಿದ ಪ್ಲಗಿನ್ ಅನ್ನು ಆಫ್ ಮಾಡಲಾಗುವುದಿಲ್ಲ; ಅಗತ್ಯ ಎಂದು ಗುರುತಿಸಿದ್ದನ್ನು ಬೇರೊಂದು ಪ್ಲಗಿನ್ ಅದರ ಕೆಲಸ ಮಾಡಿದಾಗ ಮಾತ್ರ ಆಫ್ ಮಾಡಬಹುದು, ಇಲ್ಲದಿದ್ದರೆ PaperPaw ಗೆ ಹಿಂದಿರುಗುವ ದಾರಿ ಇರುವುದಿಲ್ಲ. ಹಲವು ಪ್ಲಗಿನ್ಗಳು ನೀಡುವ ಸ್ಥಳವನ್ನು ಯಾವುದು ತೋರಿಸಬೇಕು ಎಂದು ಸ್ಕ್ರೀನ್ಗಳು ಅಡಿಯಲ್ಲಿ ಆಯ್ಕೆಮಾಡಿ."
