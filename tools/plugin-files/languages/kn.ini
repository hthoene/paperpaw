core.host-ui.phone-locked = ಸಾಧನ ಲಾಕ್ ಆಗಿರುವಾಗ ಫೋನ್ನಲ್ಲಿ ಟೈಪ್ ಮಾಡಲು ಆಗುವುದಿಲ್ಲ.
core.host-ui.typing-stopped = ಪಠ್ಯ ತುಂಬಾ ಉದ್ದವಾಗಿರುವುದರಿಂದ ಲೈವ್ ಅಪ್ಡೇಟ್ಗಳು ನಿಂತಿವೆ. ನೀವು ಟೈಪ್ ಮಾಡುತ್ತಲೇ ಇರಬಹುದು; ದೃಢೀಕರಿಸಿದಾಗ ಪೂರ್ಣ ಪಠ್ಯ ಕಳುಹಿಸಲಾಗುತ್ತದೆ.
core.host-ui.text-full = ಪಠ್ಯ ತುಂಬಾ ಉದ್ದವಾಗಿದೆ. ಅದನ್ನು ಚಿಕ್ಕದಾಗಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ. ಏನನ್ನೂ ಕತ್ತರಿಸಲಾಗಿಲ್ಲ.
core.host-ui.clipboard-full = ಕ್ಲಿಪ್ಬೋರ್ಡ್ಗೆ ಪಠ್ಯ ತುಂಬಾ ಉದ್ದವಾಗಿದೆ. ಚಿಕ್ಕ ಆಯ್ಕೆಯನ್ನು ನಕಲಿಸಿ. ಹಿಂದಿನ ಕ್ಲಿಪ್ಬೋರ್ಡ್ ಪಠ್ಯ ಬದಲಾಗಿಲ್ಲ.
core.host-ui.clipboard-card = ಕ್ಲಿಪ್ಬೋರ್ಡ್ ಅನ್ನು ಓದಲು ಅಥವಾ ಬರೆಯಲು ಆಗುತ್ತಿಲ್ಲ. ಮೆಮೊರಿ ಕಾರ್ಡ್ ಸೇರಿಸಲಾಗಿದೆಯೇ ಮತ್ತು ಓದಬಹುದೇ ಎಂದು ಪರಿಶೀಲಿಸಿ.
core.host-ui.card-full = ಮೆಮೊರಿ ಕಾರ್ಡ್ ತುಂಬಿದೆ. ಸ್ವಲ್ಪ ಜಾಗ ಖಾಲಿ ಮಾಡಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.
core.host-ui.card-error = ಮೆಮೊರಿ ಕಾರ್ಡ್ನಲ್ಲಿ ಪಠ್ಯವನ್ನು ಓದಲು ಅಥವಾ ಉಳಿಸಲು ಆಗಲಿಲ್ಲ. ಕಾರ್ಡ್ ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.
core.host-permission.library = ನಿಮ್ಮ ಇಡೀ ಲೈಬ್ರರಿ, ಓದಿದ ಸ್ಥಾನಗಳು, ಮತ್ತು ಎಲ್ಲಾ ಪ್ಲಗಿನ್ಗಳ ಹೈಲೈಟ್ಗಳು ಮತ್ತು ಟಿಪ್ಪಣಿಗಳನ್ನು ಓದಬಹುದು ಮತ್ತು ಬದಲಿಸಬಹುದು.
core.host-library.import-failed = ಪುಸ್ತಕವನ್ನು ಲೈಬ್ರರಿಗೆ ಸೇರಿಸಲಾಗಲಿಲ್ಲ. ಮೆಮೊರಿ ಕಾರ್ಡ್ ಪರಿಶೀಲಿಸಿ ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ.
core.host-library.name-taken = ಈ ಹೆಸರಿನ ಪುಸ್ತಕ ಈಗಾಗಲೇ ಇದೆ. ಬೇರೆ ಹೆಸರನ್ನು ಆಯ್ಕೆಮಾಡಿ.
