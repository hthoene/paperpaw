vocabulary.sd.fault.not-utf8 = UTF-8 ಪಠ್ಯವಲ್ಲ. ಫೈಲ್ ಅನ್ನು UTF-8 ಆಗಿ ಉಳಿಸಿ (ಸ್ಪ್ರೆಡ್ಶೀಟ್ನಲ್ಲಿ: CSV UTF-8).
