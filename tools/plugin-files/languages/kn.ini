vocabulary.sd.outcome.crowded = ತುಂಬಾ ಕಾರ್ಡ್ಗಳಿಗೆ ಒಂದೇ ಮುಂಭಾಗ ಇದೆ, ಆದ್ದರಿಂದ ಈ ಫೈಲ್ ಅನ್ನು ಓದಲಿಲ್ಲ. ಮುಂಭಾಗಗಳನ್ನು ಬೇರೆಬೇರೆ ಮಾಡಿ.
vocabulary.sd.outcome.no-cards = ಯಾವುದೇ ಕಾರ್ಡ್ ಸಿಗಲಿಲ್ಲ. ಕಾರ್ಡ್ ಎಂದರೆ ಮುಂಭಾಗ ಪಠ್ಯವಿರುವ ಸಾಲು; ಮುಂಭಾಗ ಮೊದಲ ಕಾಲಮ್.
vocabulary.sd.outcome.too-large = ಈ ಫೈಲ್ ತುಂಬಾ ದೊಡ್ಡದು: ಗರಿಷ್ಠ 4 MiB ಮತ್ತು 20,000 ಸಾಲುಗಳು. ಅದನ್ನು ಹಲವು ಫೈಲ್ಗಳಾಗಿ ವಿಭಜಿಸಿ.
vocabulary.sd.outcome.utf16 = ಈ ಫೈಲ್ ಅನ್ನು UTF-16 ಆಗಿ ಉಳಿಸಲಾಗಿದೆ. ಅದನ್ನು ಮತ್ತೆ CSV UTF-8 ಆಗಿ ಉಳಿಸಿ (ಸ್ಪ್ರೆಡ್ಶೀಟ್ನಲ್ಲಿ: CSV UTF-8).
vocabulary.sd.outcome.no-notes = ಯಾವುದೇ ಟಿಪ್ಪಣಿ ಸಿಗಲಿಲ್ಲ: ಇದು Anki ಡೆಕ್ ಅಲ್ಲ, ಅಥವಾ ಇದರಲ್ಲಿ ಟಿಪ್ಪಣಿಗಳಿಲ್ಲ. ಅದನ್ನು Anki ಯಿಂದ Anki deck package (.apkg) ಆಗಿ ರಫ್ತು ಮಾಡಿ.
vocabulary.sd.outcome.newer-anki = ಈ ಡೆಕ್ ಅತ್ಯಂತ ಹೊಸ Anki ಸ್ವರೂಪದಲ್ಲಿದೆ. Support older Anki versions ಆಯ್ಕೆ ಮಾಡಿ ಅದನ್ನು ಮತ್ತೆ ರಫ್ತು ಮಾಡಿ.
vocabulary.sd.outcome.deck-too-large = ಈ Anki ಡೆಕ್ ಇಲ್ಲಿ ಓದಲು ತುಂಬಾ ದೊಡ್ಡದು: ಗರಿಷ್ಠ 4,000 ಫೈಲ್ಗಳು, 4 MiB ಟಿಪ್ಪಣಿಗಳು ಮತ್ತು 20,000 ಟಿಪ್ಪಣಿಗಳು. ಮೀಡಿಯಾ ಮತ್ತು ವೇಳಾಪಟ್ಟಿ ಇಲ್ಲದೆ ರಫ್ತು ಮಾಡಿ, ಅಥವಾ ವಿಭಜಿಸಿ.
