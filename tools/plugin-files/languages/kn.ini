keys.plugin.name = ಬಟನ್ಗಳು ಮತ್ತು ಸನ್ನೆಗಳು
keys.plugin.description = ಪ್ರತಿ ಬಟನ್, ಟ್ಯಾಪ್ ವಲಯ ಮತ್ತು ಸ್ವೈಪ್ ಏನು ಮಾಡುತ್ತದೆ, ಸಾಧನದಲ್ಲೇ ಬದಲಿಸಬಹುದು.
keys.plugin.how = "“ಬಟನ್ಗಳು ಮತ್ತು ಸನ್ನೆಗಳು” ಪ್ರತಿ ಬಟನ್, ಟ್ಯಾಪ್ ವಲಯ ಮತ್ತು ಸ್ವೈಪ್ ಏನು ಮಾಡುತ್ತದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ ಮತ್ತು ಅದನ್ನು ಸಾಧನದಲ್ಲೇ ಬದಲಿಸಲು ಬಿಡುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸಾಧನ ಅಡಿಯಲ್ಲಿ ಇದನ್ನು ತೆರೆಯಿರಿ. ಮೊದಲು ಬದಲಾವಣೆ ಎಲ್ಲಿ ಅನ್ವಯಿಸಬೇಕು ಎಂದು ಆರಿಸಿ: ಎಲ್ಲೆಡೆ, ಓದುವಾಗ, ಹೋಮ್ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ, ಲೈಬ್ರರಿಯಲ್ಲಿ ಅಥವಾ ಒಂದು ಪರಿಕರದಲ್ಲಿ. ನಂತರ ಒತ್ತಿಹಿಡಿದ ಬಟನ್ ಅಥವಾ ಅಂಚಿನಿಂದ ಸ್ವೈಪ್ನಂತಹ ಇನ್ಪುಟ್ ಆರಿಸಿ, ಮತ್ತು ಪಟ್ಟಿಯಿಂದ ಕ್ರಿಯೆಯನ್ನು ಆರಿಸಿ (ಪಟ್ಟಿಯಲ್ಲಿ ಹುಡುಕಬಹುದು). “ಪ್ರಮಾಣಿತ” ಪ್ಲಗಿನ್ಗಳು ಮತ್ತು ಬಟನ್ ಲೇಔಟ್ ಹೊಂದಿಸಿದ್ದನ್ನು ಮರಳಿ ತರುತ್ತದೆ.\n\nX4 ನಲ್ಲಿ, ಆಯ್ಕೆಮಾಡಲು, ಹಿಂದೆ ಹೋಗಲು ಅಥವಾ ಮುಂದೆ ಸರಿಯಲು ಯಾವ ಬಟನ್ ಕೂಡ ಉಳಿಯದಂತೆ ಮಾಡುವ ಬದಲಾವಣೆಯನ್ನು ನಿರಾಕರಿಸಲಾಗುತ್ತದೆ. ಕೊನೆಯಲ್ಲಿರುವ “ಬಟನ್ಗಳು ಮತ್ತು ಸನ್ನೆಗಳನ್ನು ಮರುಹೊಂದಿಸಿ” ಎಲ್ಲ ಬದಲಾವಣೆಗಳನ್ನು ಹಿಂಪಡೆಯುತ್ತದೆ."
