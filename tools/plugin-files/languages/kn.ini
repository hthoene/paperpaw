rules.plugin.name = ನಿಯಮಗಳು
rules.plugin.description = ಏನಾದರೂ ಸಂಭವಿಸಿದಾಗ ಏನನ್ನಾದರೂ ಮಾಡುತ್ತದೆ: ಉದಾ. 22:00 ಕ್ಕೆ ರಾತ್ರಿ ಮೋಡ್.
rules.plugin.how = "ಏನಾದರೂ ಸಂಭವಿಸಿದಾಗ ನಿಯಮವು ತಾನಾಗಿಯೇ ಏನನ್ನಾದರೂ ಮಾಡುತ್ತದೆ: ಪ್ರತಿದಿನ 22:00 ಕ್ಕೆ ರಾತ್ರಿ ಮೋಡ್ ಆನ್, ಅಥವಾ PaperPaw ಪ್ರಾರಂಭವಾದಾಗ ಕ್ಯಾಟಲಾಗ್ಗಳ ಸಿಂಕ್.\n\nನಿಯಮಗಳು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ “ಕಸ್ಟಮೈಸ್” ಅಡಿಯಲ್ಲಿವೆ. “ನಿಯಮ ಸೇರಿಸಿ” ಕೇಳುತ್ತದೆ: ಯಾವಾಗ? (PaperPaw ಪ್ರಾರಂಭ, ದಿನದ ಸಮಯ, ಪುಸ್ತಕ ತೆರೆಯುವುದು ಅಥವಾ ಮುಚ್ಚುವುದು, ಬ್ಯಾಟರಿ, ಚಾರ್ಜಿಂಗ್, ಸ್ವಿಚ್ ಮತ್ತು ಇನ್ನಷ್ಟು) ಮತ್ತು ನಂತರ ಏನು? (ಕ್ರಿಯೆ ಚಲಾಯಿಸಿ, ಸ್ವಿಚ್ ಆನ್ ಅಥವಾ ಆಫ್, ಸಂಖ್ಯೆ ಹೊಂದಿಸಿ, ಸಂದೇಶ ತೋರಿಸಿ). ವಿರಾಮಗೊಳಿಸಲು ನಿಯಮವನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; “ಎರಡು ಸಮಯಗಳ ನಡುವೆ” ಯಂತಹ ಷರತ್ತಿಗೆ ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಅದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಲ್ಲಿ “ಆಯ್ಕೆ” ಒತ್ತಿಹಿಡಿಯಿರಿ).\n\nಕ್ರಿಯೆಗಳು, ಸ್ವಿಚ್ಗಳು ಮತ್ತು ಸಂಖ್ಯೆಗಳು ಪ್ಲಗಿನ್ ಪ್ರಕಾರ ಇವೆ: ಮೊದಲು ಪ್ಲಗಿನ್, ನಂತರ ಅದರಲ್ಲಿರುವುದನ್ನು ಆಯ್ಕೆಮಾಡಿ; “ಹಿಂದೆ” ಮತ್ತೆ ಹೊರಬರುತ್ತದೆ. “ಹಿಂದೆ” ಅಥವಾ “ಮುಂದಿನ ಪುಟ” ದಂತಹ ಕ್ರಿಯೆ ತೋರಿಸಿರುವ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಒತ್ತಿದಂತೆಯೇ ಕೆಲಸ ಮಾಡುತ್ತದೆ.\n\nಸಮಯಗಳು ಯಾವ ಸ್ಕ್ರೀನ್ ತೆರೆದಿದ್ದರೂ ಅನ್ವಯಿಸುತ್ತವೆ. ಒಂದನ್ನೊಂದು ರದ್ದುಗೊಳಿಸುವ ಎರಡು ನಿಯಮಗಳು ಕೆಲವು ಹಂತಗಳ ನಂತರ ನಿಲ್ಲುತ್ತವೆ."
