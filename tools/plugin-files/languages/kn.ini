aids.plugin.name = ಓದುವ ನೆರವುಗಳು
aids.plugin.description = ದಪ್ಪ ಪದಾರಂಭಗಳು, ಬದಲಿ ಪದಗಳು, ಚಿತ್ರಗಳು: ನಿಮಗೆ ಬೇಕಾದಂತೆ ಪಠ್ಯ.
aids.plugin.how = "ಓದುವ ನೆರವುಗಳು ನೀವು ಓದುವಾಗ ಪುಸ್ತಕದ ಪಠ್ಯ ಹೇಗೆ ಕಾಣುತ್ತದೆ ಎಂಬುದನ್ನು ಬದಲಿಸುತ್ತವೆ. ಅವು ಎಲ್ಲಾ ಪುಸ್ತಕಗಳಿಗೆ ಅನ್ವಯಿಸುತ್ತವೆ. ದಪ್ಪ ಪದಾರಂಭಗಳು ಮತ್ತು ಪದಗಳನ್ನು ಬದಲಿಸಿ ಆರಂಭದಲ್ಲಿ ಆಫ್ ಆಗಿವೆ.\n\nಅವು ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ, ಓದುವಿಕೆ ಅಡಿಯಲ್ಲಿ, ಓದುವ ನೆರವುಗಳು ವಿಭಾಗದಲ್ಲಿವೆ. ದಪ್ಪ ಪದಾರಂಭಗಳು ಪ್ರತಿ ಪದದ ಮೊದಲಾರ್ಧವನ್ನು ದಪ್ಪವಾಗಿಸುತ್ತದೆ, ಇದು ಕೆಲವರಿಗೆ ಓದಲು ಸುಲಭ. ಪದಗಳನ್ನು ಬದಲಿಸಿ “colour = color; Mr. = Mister” ಎಂಬಂತೆ ಬರೆದ, ಅರ್ಧವಿರಾಮಗಳಿಂದ (;) ಬೇರ್ಪಡಿಸಿದ ಜೋಡಿಗಳನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ.\n\nನೀವು ಬರೆದಂತೆಯೇ ಇರುವ ಪೂರ್ಣ ಪದಗಳನ್ನು ಮಾತ್ರ ಬದಲಿಸಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ “color” ಉದ್ದ ಪದದ ಭಾಗವನ್ನು ಎಂದೂ ಬದಲಿಸುವುದಿಲ್ಲ. ಪುಸ್ತಕದ ಫೈಲ್ ಬದಲಾಗುವುದಿಲ್ಲ.\n\nಪುಸ್ತಕಗಳಲ್ಲಿನ ಚಿತ್ರಗಳನ್ನು ತೋರಿಸಬಹುದು (ಆರಂಭದಲ್ಲಿ ಹೀಗೆ), ಚಿತ್ರದ ವಿವರಣೆ ಬಳಸುವ “[ಚಿತ್ರ: ಸಮುದ್ರದಲ್ಲಿ ಹಡಗು]” ನಂತಹ ಚಿಕ್ಕ ಸಾಲಾಗಿ ಬದಲಿಸಬಹುದು, ಅಥವಾ ಬಿಡಬಹುದು. ಆಗ ಪುಟದಲ್ಲಿ ಪಠ್ಯಕ್ಕೆ ಹೆಚ್ಚು ಜಾಗ ಇರುತ್ತದೆ, ಮತ್ತು ತೋರಿಸದ ಚಿತ್ರವನ್ನು ಡಿಕೋಡ್ ಮಾಡುವುದಿಲ್ಲ, ಇದರಿಂದ ಪುಟಗಳು ಬೇಗ ತಿರುಗುತ್ತವೆ. ಕಾಮಿಕ್ಸ್ ಮತ್ತು ಚಿತ್ರಗಳಿಂದಲೇ ಮಾಡಿದ ಇತರ ಪುಸ್ತಕಗಳು ಬದಲಾಗುವುದಿಲ್ಲ."
