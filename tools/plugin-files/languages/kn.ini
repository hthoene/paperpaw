notes-overview.plugin.name = ಎಲ್ಲಾ ಟಿಪ್ಪಣಿಗಳು
notes-overview.plugin.description = ಎಲ್ಲಾ ಪುಸ್ತಕಗಳ ಬುಕ್ಮಾರ್ಕ್ಗಳು ಮತ್ತು ಹೈಲೈಟ್ಗಳು ಒಂದೇ ಪಟ್ಟಿಯಲ್ಲಿ, ಹಾಗೂ My Clippings.txt ಆಗಿ ರಫ್ತು.
notes-overview.plugin.how = "ನೀವು ಬುಕ್ಮಾರ್ಕ್ ಅಥವಾ ಹೈಲೈಟ್ ಮಾಡಿದ ಪ್ರತಿಯೊಂದು ಪುಸ್ತಕವನ್ನು, ಅವುಗಳ ಸಂಖ್ಯೆಯೊಂದಿಗೆ, ಎಲ್ಲಾ ಟಿಪ್ಪಣಿಗಳು ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ. ಇದನ್ನು ಪರಿಕರಗಳಲ್ಲಿ ತೆರೆಯಿರಿ. ಪುಸ್ತಕದ ಟಿಪ್ಪಣಿಗಳನ್ನು ನೋಡಲು ಪುಸ್ತಕವನ್ನು ಆಯ್ಕೆಮಾಡಿ, ಆ ಸ್ಥಳದಲ್ಲಿ ಪುಸ್ತಕ ತೆರೆಯಲು ಟಿಪ್ಪಣಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ.\n\nಪಟ್ಟಿಯ ಕೊನೆಯಲ್ಲಿರುವ My Clippings.txt ಆಗಿ ರಫ್ತು ಮಾಡಿ ಎಲ್ಲಾ ಟಿಪ್ಪಣಿಗಳನ್ನು Kindle ಬಳಸುವ ರೂಪದಲ್ಲಿ (UTF-8) ಒಂದೇ ಫೈಲ್ಗೆ, ಲೈಬ್ರರಿಯ ಪಕ್ಕದ Exports ಫೋಲ್ಡರ್ನಲ್ಲಿ ಬರೆಯುತ್ತದೆ. Kindle ನ My Clippings.txt ಓದುವ ಆಪ್ಗಳು ಇದನ್ನು ಓದಬಲ್ಲವು. Kindle ನಲ್ಲಿರುವಂತೆ, ಹೈಲೈಟ್ ಮೇಲಿನ ಟಿಪ್ಪಣಿ ಪ್ರತ್ಯೇಕ ನಮೂದು. ಇಲ್ಲಿನ ಪುಸ್ತಕಗಳಿಗೆ Kindle ಸ್ಥಳಗಳು ಇಲ್ಲದ ಕಾರಣ, “location” ಎಂದರೆ ಟಿಪ್ಪಣಿ ಪುಸ್ತಕದಲ್ಲಿ ಎಷ್ಟು ಶೇಕಡಾ ಮುಂದಿದೆ ಎಂಬುದು. ಫೈಲ್ ಅನ್ನು ಪ್ರತಿ ಬಾರಿ ಹೊಸದಾಗಿ ಬರೆಯಲಾಗುತ್ತದೆ; ಅದು ಹಿಂದಿನದನ್ನು ಬದಲಾಯಿಸುತ್ತದೆ."
