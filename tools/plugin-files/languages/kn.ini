smart-home.plugin.name = ಸ್ಮಾರ್ಟ್ ಹೋಮ್
smart-home.plugin.description = ನಿಮ್ಮ ಸ್ವಂತ Home Assistant ನ ಮೌಲ್ಯಗಳು ಮತ್ತು ಸ್ವಿಚ್ಗಳು, ಡ್ಯಾಶ್ಬೋರ್ಡ್ನಲ್ಲಿ ಮತ್ತು ಹೋಮ್ ಸ್ಕ್ರೀನ್ ವಿಜೆಟ್ಗಳಾಗಿ. ನಿಮ್ಮ ಮನೆಯ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿರುವ Home Assistant ಜೊತೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ.
smart-home.plugin.how = "ಸ್ಮಾರ್ಟ್ ಹೋಮ್ ನಿಮ್ಮ Home Assistant ನ ಮೌಲ್ಯಗಳು ಮತ್ತು ಸ್ವಿಚ್ಗಳನ್ನು ತೋರಿಸುತ್ತದೆ: ತಾಪಮಾನ, ತೇವಾಂಶ, ಶಕ್ತಿ, ಬಾಗಿಲು-ಕಿಟಕಿಗಳು, ದೀಪಗಳು, ಸ್ವಿಚ್ಗಳು, ದೃಶ್ಯಗಳು. ಇದು ಮನೆಯ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿ REST API ಮೂಲಕ ನೇರವಾಗಿ ನಿಮ್ಮ ಸರ್ವರ್ ಜೊತೆ ಮಾತನಾಡುತ್ತದೆ; ಬೇರೆ ಯಾವುದೇ ಸೇವೆಯ ಮೂಲಕ ಏನೂ ಹೋಗುವುದಿಲ್ಲ.\n\nಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ ಸ್ಮಾರ್ಟ್ ಹೋಮ್ › “ಸಂಪರ್ಕ” ತೆರೆಯಿರಿ: ವಿಳಾಸ (ಉದಾ. http://homeassistant.local:8123) ಮತ್ತು ದೀರ್ಘಾವಧಿಯ ಪ್ರವೇಶ ಟೋಕನ್ ನಮೂದಿಸಿ (Home Assistant ಪ್ರೊಫೈಲ್ ಪುಟದ ಕೆಳಗೆ ರಚಿಸಿ). ಟೋಕನ್ ಪಾಸ್ವರ್ಡ್ಗಳು ಮತ್ತು ಕೀಗಳ ನಡುವೆ ಉಳಿಯುತ್ತದೆ. http ಮನೆಯ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿ ಮಾತ್ರ; ಬೇರೆಡೆಯ ಸರ್ವರ್ಗೆ “ಮನೆಯ ನೆಟ್ವರ್ಕ್ನ ಹೊರಗಿನ ಸರ್ವರ್ಗಳು” ಆನ್ ಮಾಡಿ, ಮಾನ್ಯ ಪ್ರಮಾಣಪತ್ರದ https ಬಳಸಿ.\n\n“ಎಂಟಿಟಿಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ”: ಹೆಸರು ಅಥವಾ id ಯಿಂದ ಹುಡುಕಿ, ತೋರಿಸಲು ಎಂಟಿಟಿ ಆಯ್ಕೆಮಾಡಿ (ಮತ್ತೆ ಆಯ್ಕೆಮಾಡಿದರೆ ತೆಗೆಯುತ್ತದೆ). ಕೋಣೆ ನೀಡಿದರೆ ಅದರಂತೆ ಗುಂಪಾಗುತ್ತದೆ. ಹೆಚ್ಚೆಂದರೆ 24 ಎಂಟಿಟಿಗಳು. ಡ್ಯಾಶ್ಬೋರ್ಡ್ನಲ್ಲಿ ದೀಪ, ಸ್ವಿಚ್ ಅಥವಾ ದೃಶ್ಯ ಆಯ್ಕೆಮಾಡಿದರೆ ಬದಲಾಗುತ್ತದೆ; ಸೆನ್ಸರ್ ಮತ್ತೆ ಓದಲ್ಪಡುತ್ತದೆ.\n\nವಿಜೆಟ್ಗಳು (ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಒತ್ತಿಹಿಡಿದು ವಿಜೆಟ್ ಸೇರಿಸಿ): ಮೌಲ್ಯ, ಗುಂಪು, ಸ್ವಿಚ್ ಮತ್ತು ಕೋಣೆ ಕಾರ್ಡ್. ಪ್ರತಿ ವಿಜೆಟ್ನ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಎಂಟಿಟಿ ಅಥವಾ ಕೋಣೆ ಆಯ್ಕೆಮಾಡಿ.\n\nಡ್ಯಾಶ್ಬೋರ್ಡ್ ತೆರೆದಾಗ, “ಈಗ ರಿಫ್ರೆಶ್ ಮಾಡಿ” ಅಥವಾ ವಿಜೆಟ್ ಟ್ಯಾಪ್ ಮಾಡಿದಾಗ, Wi-Fi ಈಗಾಗಲೇ ಆನ್ ಇರುವಾಗ ರೀಡರ್ ಎಚ್ಚರಗೊಂಡಾಗ, ಮತ್ತು ಚಾರ್ಜ್ ಆಗುತ್ತಿರುವಾಗ ನೀವು ಹೊಂದಿಸಿದ ಅಂತರದಲ್ಲಿ ಮನೆಯನ್ನು ಓದಲಾಗುತ್ತದೆ. ಇದು ತಾನಾಗಿಯೇ Wi-Fi ಆನ್ ಮಾಡುವುದಿಲ್ಲ, ಆನ್ ಆಗಿಯೂ ಇರಿಸುವುದಿಲ್ಲ."
