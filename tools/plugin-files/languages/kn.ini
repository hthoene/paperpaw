profiles.plugin.name = ಓದುವ ಪ್ರೊಫೈಲ್ಗಳು
profiles.plugin.description = ಓದುವಿಕೆ ಮತ್ತು ಡಿಸ್ಪ್ಲೇ ಸೆಟ್ಟಿಂಗ್ಗಳ ಹೆಸರಿಸಿದ ಸೆಟ್ಗಳು, ಒಂದು ಟ್ಯಾಪ್ನಲ್ಲಿ ಬದಲಾಯಿಸಬಹುದು.
profiles.plugin.how = "ಪ್ರೊಫೈಲ್ ನಿಮ್ಮ ಓದುವಿಕೆ ಸೆಟ್ಟಿಂಗ್ಗಳು, ಡಿಸ್ಪ್ಲೇ ಸೆಟ್ಟಿಂಗ್ಗಳು ಮತ್ತು ಸ್ಥಿತಿ ಪಟ್ಟಿಗಳನ್ನು ರಾತ್ರಿ ಅಥವಾ ದೊಡ್ಡ ಅಕ್ಷರ ಎಂಬಂತಹ ಹೆಸರಿನಲ್ಲಿ ಇರಿಸುತ್ತದೆ ಮತ್ತು ಒಂದು ಟ್ಯಾಪ್ನಲ್ಲಿ ಮರಳಿ ತರುತ್ತದೆ.\n\nಓದುವ ಮೆನುವಿನ ಇನ್ನಷ್ಟು ಅಡಿಯಲ್ಲಿ, ಅಥವಾ ಸೆಟ್ಟಿಂಗ್ಗಳ ಕಸ್ಟಮೈಸ್ ಅಡಿಯಲ್ಲಿ ಪ್ರೊಫೈಲ್ಗಳನ್ನು ತೆರೆಯಿರಿ. ಬಳಸಲು ಪ್ರೊಫೈಲ್ ಅನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; ಬಳಕೆಯಲ್ಲಿರುವುದನ್ನು ಗುರುತಿಸಲಾಗಿರುತ್ತದೆ. ಪ್ರಸ್ತುತ ಸೆಟ್ಟಿಂಗ್ಗಳನ್ನು ಅದರಲ್ಲಿ ಉಳಿಸಲು, ಮರುಹೆಸರಿಸಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಅದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಲ್ಲಿ ಆಯ್ಕೆ ಒತ್ತಿಹಿಡಿಯಿರಿ). ಹೊಸ ಪ್ರೊಫೈಲ್ ಆಗಿ ಉಳಿಸಿ ಈಗಿನ ಸೆಟ್ಟಿಂಗ್ಗಳನ್ನು ಇರಿಸುತ್ತದೆ.\n\nಮುಂದಿನ ಪ್ರೊಫೈಲ್ ಪಟ್ಟಿಯಲ್ಲಿನ ಮುಂದಿನದಕ್ಕೆ ಬದಲಾಯಿಸುತ್ತದೆ; ಅದನ್ನು ಬಟನ್ಗೆ ಅಥವಾ ನಿಯಮಕ್ಕೆ ಹಾಕಿ."
