launcher-simple.plugin.description = ಶಾಂತ ಆರಂಭ ಸ್ಕ್ರೀನ್: ದೊಡ್ಡ ಗಡಿಯಾರ, ಕಾರ್ಡ್ಗಳು, ಡಾಕ್ ಮತ್ತು ದುಂಡು ಸ್ವಿಚ್ಗಳ ತ್ವರಿತ ಪ್ಯಾನೆಲ್.
launcher-simple.plugin.how = "“ಸರಳ ಹೋಮ್” ಮುಖ್ಯವಾದುದು ಮಾತ್ರ ಬೇಕಾದವರಿಗೆ ಶಾಂತ ಆರಂಭ ಸ್ಕ್ರೀನ್: ದೊಡ್ಡ ಗಡಿಯಾರ, ನೀವು ಓದುತ್ತಿರುವ ಪುಸ್ತಕ, ಲೈಬ್ರರಿ ಮತ್ತು ಸ್ಟೋರ್ ದೊಡ್ಡ ಕಾರ್ಡ್ಗಳಾಗಿ, ಮತ್ತು ಕೆಳಗೆ ಮೂರು ಐಕಾನ್ಗಳ ಡಾಕ್. ಇದಕ್ಕೆ ಸೆಟಪ್ ಬೇಕಿಲ್ಲ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಅಡಿಯಲ್ಲಿ ಇದನ್ನು ಆರಿಸಿ. ಇದರ ತ್ವರಿತ ಪ್ಯಾನೆಲ್ನಲ್ಲಿ (ಅದನ್ನೂ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಪ್ಯಾನೆಲ್ ಆಗಿ ಆರಿಸಿ) ದೊಡ್ಡ ದುಂಡು ಸ್ವಿಚ್ಗಳು, ಸಾಧನದಲ್ಲಿ ಮುಂಬೆಳಕು ಇದ್ದರೆ ಅದರ ಪಟ್ಟಿ ಮತ್ತು ಪಠ್ಯ ಗಾತ್ರದ ಪಟ್ಟಿ ಇವೆ. ಬಟನ್ಗಳಿಂದ: ಬಾಣದ ಬಟನ್ಗಳು ಫೋಕಸ್ ಸರಿಸುತ್ತವೆ, ಆಯ್ಕೆಮಾಡಿ ಆ ಭಾಗ ಹೇಳುವುದನ್ನು ಮಾಡುತ್ತದೆ; ಪಟ್ಟಿಯಲ್ಲಿ ಹತ್ತನೇ ಒಂದು ಭಾಗ ಸೇರಿಸುತ್ತದೆ, ಕೊನೆಯಿಂದ ಆರಂಭಕ್ಕೆ ಹಿಂದಿರುಗುತ್ತದೆ. ಟಚ್ನಿಂದ: ಭಾಗವನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ, ಅಥವಾ ಪಟ್ಟಿಯಲ್ಲಿ ಬೇಕಾದ ಕಡೆ ಟ್ಯಾಪ್ ಮಾಡಿ.\n\nಲೈಬ್ರರಿ ನಿಮ್ಮ ಪುಸ್ತಕಗಳನ್ನು ಕಾರ್ಡ್ಗಳಾಗಿ, ಕೊನೆಯದಾಗಿ ತೆರೆದದ್ದು ಮೊದಲು, ಒಮ್ಮೆಗೆ ಒಂದು ಪುಟದಂತೆ ತೋರಿಸುತ್ತದೆ ಮತ್ತು ಸಾಮಾನ್ಯ ರೀಡರ್ ಅನ್ನು ತೆರೆಯುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ “ಸರಳ ಹೋಮ್” ಅಡಿಯಲ್ಲಿ ಇದನ್ನು ನಿಮ್ಮದಾಗಿಸಿ: ಮುಖ್ಯ ಮೆನುವಿನಂತೆ ಎಡಿಟ್ ಮಾಡುವ ಮೂರು ಪಟ್ಟಿಗಳು. ಕಾರ್ಡ್ಗಳು: ಯಾವ ಕಾರ್ಡ್ಗಳು, ಯಾವ ಕ್ರಮದಲ್ಲಿ. ಡಾಕ್: ಯಾವ ಐಕಾನ್ಗಳು, ಯಾವುದೇ ಪ್ಲಗಿನ್ನ ಯಾವುದೇ ಕ್ರಿಯೆ. ತ್ವರಿತ ಪ್ಯಾನೆಲ್: ಯಾವ ಸ್ವಿಚ್ಗಳು ಮತ್ತು ಪಟ್ಟಿಗಳು. ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಜಾಗವಿಲ್ಲದ ಕಾರ್ಡ್ ಅನ್ನು ಕೊನೆಯಿಂದ ಬಿಡಲಾಗುತ್ತದೆ. ದಿನಾಂಕ ಮತ್ತು ಬ್ಯಾಟರಿ ಕಾಣಿಸಬೇಕೆ ಎಂಬುದನ್ನೂ ಅಲ್ಲೇ ಆರಿಸುತ್ತೀರಿ."
