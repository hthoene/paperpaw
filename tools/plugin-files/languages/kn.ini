diagnostics.check.buttons.help = “ಆರಂಭಿಸಿ” ಆಯ್ಕೆಮಾಡಿ, ನಂತರ ಕೇಳಿದಾಗ ಪ್ರತಿ ಬಟನ್ ಒತ್ತಿ. ಒಂದು ಕೆಲಸ ಮಾಡದಿದ್ದರೆ, ಮುಂದುವರಿಯಲು ಬೇರೊಂದು ಬಟನ್ ಒತ್ತಿಹಿಡಿಯಿರಿ.
