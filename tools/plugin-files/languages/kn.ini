format-txt.plugin.description = ಸರಳ ಪಠ್ಯ ಫೈಲ್ಗಳನ್ನು (.txt) ತೆರೆಯುತ್ತದೆ.
format-txt.plugin.how = "ಸರಳ ಪಠ್ಯ ಫೈಲ್ಗಳು (.txt) ಇತರ ಪುಸ್ತಕಗಳಂತೆ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯುತ್ತವೆ, ಏನನ್ನೂ ಹೊಂದಿಸಬೇಕಿಲ್ಲ. ಪ್ಲಗಿನ್ UTF-8, UTF-16 ಮತ್ತು Windows-1252 ಪಠ್ಯವನ್ನು ಓದುತ್ತದೆ ಮತ್ತು ಎನ್ಕೋಡಿಂಗ್ ಅನ್ನು ತಾನೇ ಪತ್ತೆಹಚ್ಚುತ್ತದೆ.\n\nಫೈಲ್ನ ಖಾಲಿ ಸಾಲುಗಳ ಪ್ರಕಾರ ಪ್ಯಾರಾಗಳು ವಿಭಜನೆಯಾಗುತ್ತವೆ; ಖಾಲಿ ಸಾಲುಗಳಿಲ್ಲದಿದ್ದರೆ ಪ್ರತಿ ಸಾಲೂ ಒಂದು ಪ್ಯಾರಾ. Project Gutenberg ಫೈಲ್ಗಳಲ್ಲಿ ಆರಂಭ ಮತ್ತು ಕೊನೆಯ ಪರವಾನಗಿ ಪಠ್ಯವನ್ನು ಬಿಡಲಾಗುತ್ತದೆ, ಶೀರ್ಷಿಕೆ ಮತ್ತು ಲೇಖಕರನ್ನು ಹೆಡರ್ನಿಂದ ತೆಗೆದುಕೊಳ್ಳಲಾಗುತ್ತದೆ.\n\nಫೈಲ್ ಅನ್ನು ಎಂದಿಗೂ ಪೂರ್ತಿಯಾಗಿ ಲೋಡ್ ಮಾಡುವುದಿಲ್ಲ, ಆದ್ದರಿಂದ ತುಂಬಾ ದೊಡ್ಡ ಪಠ್ಯಗಳೂ ಸಣ್ಣ ಸಾಧನಗಳಲ್ಲಿ ತೆರೆಯುತ್ತವೆ."
format-txt.title = ಸರಳ ಪಠ್ಯ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC ಮತ್ತು XTCH ಪುಸ್ತಕಗಳನ್ನು ತೆರೆಯುತ್ತದೆ: Xteink ರೀಡರ್ಗಳಿಗಾಗಿ ಮೊದಲೇ ಸಿದ್ಧಪಡಿಸಿದ ಪುಟಗಳು.
format-xtc.plugin.how = "XTC ಮತ್ತು XTCH ಫೈಲ್ಗಳು ಪುಸ್ತಕಗಳು, ಅವುಗಳ ಪುಟಗಳು ಈಗಾಗಲೇ ಚಿತ್ರಗಳಾಗಿ ಸಿದ್ಧವಾಗಿರುತ್ತವೆ; Xteink ರೀಡರ್ಗಳ ಪರಿವರ್ತಕಗಳು ಇವನ್ನು ಮಾಡುತ್ತವೆ. ಇವು ಇತರ ಪುಸ್ತಕಗಳಂತೆ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯುತ್ತವೆ.\n\nಪ್ರತಿ ಪುಟವೂ ಸ್ಥಿರ ಚಿತ್ರವಾದ್ದರಿಂದ ಪಠ್ಯದ ಗಾತ್ರ ಅಥವಾ ಫಾಂಟ್ ಬದಲಿಸಲಾಗುವುದಿಲ್ಲ. ಪುಟಗಳು ಕಪ್ಪು-ಬಿಳುಪು ಅಥವಾ ನಾಲ್ಕು ಬೂದು ಛಾಯೆಗಳಲ್ಲಿರುತ್ತವೆ. ಪ್ರತಿ ಪುಟವನ್ನು ತೋರಿಸುವಾಗಲೇ ಡಿಕೋಡ್ ಮಾಡಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ X4 ನಲ್ಲೂ ಕಡಿಮೆ ಮೆಮೊರಿ ಸಾಕು.\n\nಫೈಲ್ನಲ್ಲಿ ಇದ್ದರೆ ಶೀರ್ಷಿಕೆ, ಲೇಖಕ ಮತ್ತು ಅಧ್ಯಾಯಗಳನ್ನು ಅದರಿಂದ ತೆಗೆದುಕೊಳ್ಳಲಾಗುತ್ತದೆ."
format-xtc.title = XTC ಪುಟಗಳು
help.plugin.name = ಸಲಹೆಗಳು
help.plugin.description = ಸ್ಕ್ರೀನ್ ಮೊದಲ ಬಾರಿ ತೆರೆದಾಗ ಅದರ ನಿಯಂತ್ರಣಗಳು ಏನು ಮಾಡುತ್ತವೆ ಎಂದು ತೋರಿಸುತ್ತದೆ.
help.plugin.how = "ಸ್ಕ್ರೀನ್ ಮೊದಲ ಬಾರಿ ತೆರೆದಾಗ, ಅದರ ಮೇಲೆ ಒಂದು ಚಿಕ್ಕ ಟಿಪ್ಪಣಿ ಅದರ ನಿಯಂತ್ರಣಗಳು ಏನು ಮಾಡುತ್ತವೆ ಎಂದು ತಿಳಿಸುತ್ತದೆ: ಟ್ಯಾಪ್ ಹೋಗುವ ಸ್ಕ್ರೀನ್ ಭಾಗಗಳು ಚೌಕಟ್ಟಿನಲ್ಲಿ, ಮತ್ತು ಬಟನ್ಗಳು ಏನು ಮಾಡುತ್ತವೆ ಎಂದು.\n\nಒಂದು ಟ್ಯಾಪ್ ಅಥವಾ ಯಾವುದೇ ಬಟನ್ ಟಿಪ್ಪಣಿಯನ್ನು ಮುಚ್ಚುತ್ತದೆ, ಮತ್ತು ಆ ಸ್ಕ್ರೀನ್ಗೆ ಅದು ಮತ್ತೆ ಬರುವುದಿಲ್ಲ. “ಇನ್ನು ಸಲಹೆಗಳು ಬೇಡ” ಎಲ್ಲವನ್ನೂ ಆಫ್ ಮಾಡುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸಿಸ್ಟಂ ಅಡಿಯಲ್ಲಿ, “ಸಲಹೆಗಳು” ಅವನ್ನು ಆನ್ ಅಥವಾ ಆಫ್ ಮಾಡುತ್ತದೆ, ಮತ್ತು “ಸಲಹೆಗಳನ್ನು ಮತ್ತೆ ತೋರಿಸಿ” ಪ್ರತಿ ಸ್ಕ್ರೀನ್ನ ಟಿಪ್ಪಣಿಯನ್ನು ಇನ್ನೊಮ್ಮೆ ತೋರಿಸುತ್ತದೆ."
