plugin-manager.code.no-room-flash = ಇದರ ಕೋಡ್ಗೆ ಜಾಗ ಉಳಿದಿಲ್ಲ. ಕೋಡ್ ಇರುವ ಬೇರೊಂದು ಪ್ಲಗಿನ್ ಆಫ್ ಮಾಡಿ, ಅಥವಾ ವೆಬ್ ಫ್ಲ್ಯಾಶರ್ (paperpaw.org) ಮೂಲಕ ಪೂರ್ಣ ಲೇಔಟ್ ಫ್ಲ್ಯಾಶ್ ಮಾಡಿ: ಹಲವು ಪಟ್ಟು ಜಾಗ.
