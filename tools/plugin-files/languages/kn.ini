core.config-unreadable = {file} ಅನ್ನು ಓದಲಾಗಲಿಲ್ಲ, ಆದ್ದರಿಂದ ಸೆಟ್ಟಿಂಗ್ಗಳ ಬದಲಾವಣೆಗಳನ್ನು ಉಳಿಸಲಾಗುವುದಿಲ್ಲ. ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ ಫೈಲ್ ಅನ್ನು ಸರಿಪಡಿಸಿ ಅಥವಾ ತೆಗೆದುಹಾಕಿ.
core.secrets-unreadable = {file} ಅನ್ನು ಓದಲಾಗಲಿಲ್ಲ, ಆದ್ದರಿಂದ ಪಾಸ್ವರ್ಡ್ಗಳು ಮತ್ತು ಕೀಗಳನ್ನು ಉಳಿಸಲಾಗುವುದಿಲ್ಲ. ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ ಫೈಲ್ ಅನ್ನು ಸರಿಪಡಿಸಿ ಅಥವಾ ತೆಗೆದುಹಾಕಿ.
core.secrets-unopened = ಈ ಕಾರ್ಡ್ನಲ್ಲಿ ಉಳಿಸಿದ ಕೆಲವು ಪಾಸ್ವರ್ಡ್ಗಳು ಮತ್ತು ಕೀಗಳನ್ನು ಇಲ್ಲಿ ತೆರೆಯಲಾಗುವುದಿಲ್ಲ: ಅವುಗಳನ್ನು ಬೇರೊಂದು ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ, ಅಥವಾ ಈ ಸಾಧನದ ಕೀ ಕಳೆದುಹೋಗಿದೆ. ಪ್ಲಗಿನ್ ಕೇಳಿದಲ್ಲಿ ಅವುಗಳನ್ನು ಮತ್ತೆ ನಮೂದಿಸಿ.
core.secrets-unsupported = ಈ ಸಾಧನವು ಇನ್ನೂ ಪಾಸ್ವರ್ಡ್ಗಳನ್ನು ಉಳಿಸಲಾರದು. paperpaw.org ನಲ್ಲಿರುವ ವೆಬ್ ಫ್ಲ್ಯಾಶರ್ ಮೂಲಕ PaperPaw ಅನ್ನು ಒಮ್ಮೆ ಮರು-ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ, ಆಗ ಇದು ಕೆಲಸ ಮಾಡುತ್ತದೆ.
core.card.missing = ಮೆಮೊರಿ ಕಾರ್ಡ್ ಸಿಗಲಿಲ್ಲ, ಆದ್ದರಿಂದ ಏನನ್ನೂ ಉಳಿಸಲಾಗುವುದಿಲ್ಲ. FAT32 ಕಾರ್ಡ್ ಸೇರಿಸಿ ಮರುಪ್ರಾರಂಭಿಸಿ.
core.card.unreadable = ಮೆಮೊರಿ ಕಾರ್ಡ್ ಅನ್ನು ಓದಲಾಗುತ್ತಿಲ್ಲ, ಆದ್ದರಿಂದ ಏನನ್ನೂ ಉಳಿಸಲಾಗುವುದಿಲ್ಲ. ಬೇರೊಂದು ಕಾರ್ಡ್ ಪ್ರಯತ್ನಿಸಿ.
core.card.exfat-experimental = ಈ ಮೆಮೊರಿ ಕಾರ್ಡ್ exFAT ಆಗಿದೆ. exFAT ಬೆಂಬಲ ಪ್ರಾಯೋಗಿಕ; FAT32 ಅತ್ಯಂತ ಸುರಕ್ಷಿತ.
core.card.no-fat = ಮೆಮೊರಿ ಕಾರ್ಡ್ FAT32 ಅಲ್ಲ, ಆದ್ದರಿಂದ ಏನನ್ನೂ ಉಳಿಸಲಾಗುವುದಿಲ್ಲ. ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ ಅದನ್ನು FAT32 ಆಗಿ ಫಾರ್ಮ್ಯಾಟ್ ಮಾಡಿ.
