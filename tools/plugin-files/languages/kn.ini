bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = ರಿಮೋಟ್ಗಳು, ಕೀಬೋರ್ಡ್ಗಳು ಮತ್ತು ಸೆನ್ಸರ್ಗಳನ್ನು ಜೋಡಿಸಿ ಸಂಪರ್ಕಿಸುತ್ತದೆ.
bluetooth.plugin.how = "ರೀಡರ್ನಲ್ಲಿ Bluetooth ಇದ್ದಲ್ಲಿ (X4 Pro), Bluetooth ರಿಮೋಟ್ಗಳು, ಕೀಬೋರ್ಡ್ಗಳು ಮತ್ತು ಸೆನ್ಸರ್ಗಳನ್ನು ಅದರೊಂದಿಗೆ ಜೋಡಿಸುತ್ತದೆ.\n\nಸಾಧನ ಸೇರಿಸಿ ವ್ಯಾಪ್ತಿಯಲ್ಲಿರುವುದನ್ನು ಹುಡುಕುತ್ತದೆ; ಮೊದಲು ಸಾಧನವನ್ನು ಜೋಡಣೆ ಮೋಡ್ಗೆ ಹಾಕಿ. ಅದನ್ನು ಆರಿಸಿ, ರೀಡರ್ನಲ್ಲಿ ದೃಢೀಕರಿಸಿ (ಸಂಖ್ಯೆ ಕಾಣಿಸಿದರೆ ಹೋಲಿಸಿ). ಆಗ ರಿಮೋಟ್ ಅಥವಾ ಕೀಬೋರ್ಡ್ನ ಬಟನ್ಗಳು ಪುಟ ತಿರುಗಿಸುತ್ತವೆ ಮತ್ತು ಮೆನುಗಳಲ್ಲಿ ಸರಿಯುತ್ತವೆ; ಪ್ರತಿ ಬಟನ್ ಏನು ಮಾಡುತ್ತದೆ ಎಂಬುದನ್ನು ನಿಯಂತ್ರಣಗಳು ಅಡಿಯಲ್ಲಿ ಬದಲಿಸಿ.\n\nರಿಮೋಟ್ಗಳು ಅವುಗಳ ಬಟನ್ಗಳು ಯಾವಾಗ ಕೆಲಸ ಮಾಡುತ್ತವೆ ಎಂದು ಹೊಂದಿಸುತ್ತದೆ: ಇಲ್ಲಿ ಆನ್ ಮಾಡಿದಾಗ, ಓದುವಾಗ (ಪುಸ್ತಕ ತೆರೆದಿರುವವರೆಗೆ ಸಂಪರ್ಕ, ಬ್ಯಾಟರಿ ಉಳಿತಾಯ), ಅಥವಾ ಯಾವಾಗಲೂ. ಮೆನು ಬಟನ್ ಅಥವಾ ಸಾಧನದ ಮೇಲೆ ದೀರ್ಘ ಒತ್ತುವಿಕೆ ಅದನ್ನು ಮರೆಯುತ್ತದೆ.\n\nಸೆನ್ಸರ್ ಪ್ಲಗಿನ್ಗಳಿಗಾಗಿ: ಯಾವ ಪ್ಲಗಿನ್ ಅದನ್ನು ಬಳಸಬಹುದು ಎಂಬುದನ್ನು ಆನ್ ಮಾಡಿ. ಯಾವುದೂ ಬಳಸದಿದ್ದಾಗ Bluetooth ಆಫ್ ಆಗಿರುತ್ತದೆ."
