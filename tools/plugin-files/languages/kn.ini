settings.plugin.how = "PaperPaw ಮತ್ತು ಅದರ ಪ್ಲಗಿನ್ಗಳಲ್ಲಿ ಹೊಂದಿಸಬಹುದಾದ ಎಲ್ಲವನ್ನೂ ಸೆಟ್ಟಿಂಗ್ಗಳು ಪುಟಗಳಲ್ಲಿ ತೋರಿಸುತ್ತದೆ. ಪ್ಲಗಿನ್ಗಳಿಗೆ ಸ್ವಂತ ಸ್ಕ್ರೀನ್ ಬೇಕಿಲ್ಲ: ಅವು ಘೋಷಿಸಿದ್ದು ಇಲ್ಲಿ ಗುಂಪುಗಳಲ್ಲಿ ಕಾಣುತ್ತದೆ, ಪ್ರತಿ ಸೆಟ್ಟಿಂಗ್ನ ಕೆಳಗೆ ಅದರ ವಿವರಣೆಯೊಂದಿಗೆ.\n\nಮೆನುವಿನಲ್ಲಿನ “ಸೆಟ್ಟಿಂಗ್ಗಳು” ಮೂಲಕ ತೆರೆಯಿರಿ. ಗುಂಪನ್ನು ತೆರೆಯಲು ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ, ನಂತರ ಬದಲಿಸಲು ಅಥವಾ ಆಯ್ಕೆಮಾಡಲು ಸೆಟ್ಟಿಂಗ್ ಅನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; ಸಂಖ್ಯೆಗಳಿಗೆ − ಮತ್ತು + ಬಟನ್ಗಳಿವೆ. ಬಟನ್ಗಳಲ್ಲಿ, ಸೆಟ್ಟಿಂಗ್ಗೆ ಹೋಗಿ “ಆಯ್ಕೆ” ಒತ್ತಿ: ಎಡ ಮತ್ತು ಬಲ ಸಂಖ್ಯೆಯನ್ನು ಬದಲಿಸುತ್ತವೆ, “ಆಯ್ಕೆ” ಅದನ್ನು ಇರಿಸುತ್ತದೆ, “ಹಿಂದೆ” ಹಿಂದಿನ ಮೌಲ್ಯಕ್ಕೆ ಮರಳುತ್ತದೆ.\n\nಬದಲಾವಣೆಗಳು ತಕ್ಷಣ ಅನ್ವಯಿಸುತ್ತವೆ. “ಹುಡುಕಿ” ಪದಗಳಿಂದ ಸೆಟ್ಟಿಂಗ್ ಅನ್ನು ಹುಡುಕುತ್ತದೆ ಮತ್ತು “ಸುಧಾರಿತ ಸೆಟ್ಟಿಂಗ್ಗಳು” ಅಪರೂಪವಾಗಿ ಬೇಕಾಗುವವುಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ. “ಡೀಫಾಲ್ಟ್ಗಳಿಗೆ ಮರುಹೊಂದಿಸಿ” ಮತ್ತು “ಎಲ್ಲವನ್ನೂ ಮರುಹೊಂದಿಸಿ” ಮೊದಲು ಕೇಳುತ್ತವೆ."
