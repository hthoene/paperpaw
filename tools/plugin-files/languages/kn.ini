reading-goal.plugin.name = ಓದುವ ಗುರಿ
reading-goal.plugin.description = ದಿನಕ್ಕೆ ಓದುವ ನಿಮಿಷಗಳು, ಮತ್ತು ಇಂದಿನ ಓದಿಗೆ ತಕ್ಕಂತೆ ಮನಸ್ಥಿತಿ ಬದಲಾಗುವ ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಬೆಕ್ಕು.
reading-goal.plugin.how = "ಹೋಮ್ ಸ್ಕ್ರೀನ್ನಲ್ಲಿನ ಬೆಕ್ಕು ಇಂದಿನ ಓದು ಹೇಗೆ ಸಾಗುತ್ತಿದೆ ಎಂದು ತೋರಿಸುತ್ತದೆ: ಇನ್ನೂ ಓದದಿದ್ದರೆ ದುಃಖ, ಸ್ವಲ್ಪ ಓದಿದ ನಂತರ ಪರವಾಗಿಲ್ಲ, ದೈನಂದಿನ ಗುರಿಯ ಅರ್ಧದಿಂದ ತೃಪ್ತಿ, ಗುರಿ ತಲುಪಿದಾಗ ಸಂತೋಷ.\n\n“ಓದುವ ಬೆಕ್ಕು” ವಿಜೆಟ್ ಅನ್ನು ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗೆ ಸೇರಿಸಿ (ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಒತ್ತಿಹಿಡಿದು ವಿಜೆಟ್ ಸೇರಿಸಿ), ಅಥವಾ ನಿದ್ರೆ ಸ್ಕ್ರೀನ್ ಆಗಿ “ಇಂದಿನ ಓದುವ ಬೆಕ್ಕು” ಆಯ್ಕೆಮಾಡಿ. ಬೆಕ್ಕಿನ ಮೇಲೆ ಟ್ಯಾಪ್ ಮಾಡಿದರೆ ದೈನಂದಿನ ಗುರಿ ತೆರೆಯುತ್ತದೆ; ಇದು ನೀವು ಓದಿದ ನಿಮಿಷಗಳನ್ನು ಎಣಿಸುವ ಓದುವ ಅಂಕಿಅಂಶಗಳ ಗುರಿಯೇ ಆಗಿದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ, “ಓದುವಿಕೆ” ಅಡಿಯಲ್ಲಿ, “ತೃಪ್ತಿ ಇಲ್ಲಿಂದ” ಮತ್ತು “ಸಂತೋಷ ಇಲ್ಲಿಂದ” ಗುರಿಯ ಎಷ್ಟು ಭಾಗದಿಂದ ಬೆಕ್ಕು ತೃಪ್ತ ಅಥವಾ ಸಂತೋಷವಾಗಿರುತ್ತದೆ ಎಂದು ಹೊಂದಿಸುತ್ತವೆ; “ಸ್ವಂತ ಚಿತ್ರಗಳು” ಬೆಕ್ಕುಗಳ ಬದಲು ತೋರಿಸಲು ಚಿತ್ರಗಳ ಫೋಲ್ಡರ್ (sad, meh, content ಮತ್ತು happy) ಹೊಂದಿಸುತ್ತದೆ. ಚಿತ್ರಗಳು PNG ಅಥವಾ JPEG ಫೈಲ್ಗಳು; ಫೋಲ್ಡರ್ ಇಲ್ಲದಿದ್ದರೆ ಬೆಕ್ಕುಗಳು ಕಾಣುತ್ತವೆ."
