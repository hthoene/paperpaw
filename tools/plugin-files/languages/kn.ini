file-manager.plugin.how = "ಫೈಲ್ ಮ್ಯಾನೇಜರ್ ನಿಮ್ಮ ಪುಸ್ತಕಗಳನ್ನು ಮಾತ್ರವಲ್ಲ, ಸಾಧನದ ಸಂಗ್ರಹಣೆಯಲ್ಲಿನ ಪ್ರತಿ ಫೋಲ್ಡರ್ ಮತ್ತು ಫೈಲ್ ಅನ್ನು ತೋರಿಸುತ್ತದೆ; ಅವುಗಳನ್ನು ತೆರೆಯಲು, ಮರುಹೆಸರಿಸಲು, ಸರಿಸಲು, ನಕಲಿಸಲು, ಅಳಿಸಲು ಮತ್ತು ಹೊಸ ಫೋಲ್ಡರ್ಗಳನ್ನು ರಚಿಸಲು ಬಿಡುತ್ತದೆ.\n\n“ಪರಿಕರಗಳು” ಮೆನುವಿನಿಂದ “ಫೈಲ್ಗಳು” ತೆರೆಯಿರಿ. ಫೋಲ್ಡರ್ ಒಳಗೆ ಹೋಗಲು ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ; “ಹಿಂದೆ” ಮೇಲಿನ ಫೋಲ್ಡರ್ಗೆ ಹೋಗುತ್ತದೆ. ಅದರಿಂದ ಏನು ಮಾಡಬಹುದು ಎಂದು ನೋಡಲು ಫೈಲ್ ಅನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ, ಅಥವಾ ಯಾವುದೇ ನಮೂದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಿಂದ “ಆಯ್ಕೆಮಾಡಿ” ಒತ್ತಿಹಿಡಿಯಿರಿ). “ಸರಿಸಿ” ಮತ್ತು “ನಕಲಿಸಿ” ನಮೂದನ್ನು ಎತ್ತಿಕೊಳ್ಳುತ್ತವೆ: ಅದು ಸೇರಬೇಕಾದ ಫೋಲ್ಡರ್ಗೆ ಹೋಗಿ ಕೆಳಗಿನ ಪಟ್ಟಿಯಲ್ಲಿ “ಇಲ್ಲಿ ಅಂಟಿಸಿ” ಆಯ್ಕೆಮಾಡಿ. ಬಟನ್ಗಳಿಂದ, ಕೊನೆಯ ನಮೂದಿನಿಂದ “ಕೆಳಗೆ” ಒತ್ತಿ ಪಟ್ಟಿಯನ್ನು ತಲುಪಿ.\n\nPaperPaw ನ ಸ್ವಂತ ಡೇಟಾದಂತೆ ಚುಕ್ಕೆಯಿಂದ ಆರಂಭವಾಗುವ ಫೈಲ್ಗಳು ಮತ್ತು ಫೋಲ್ಡರ್ಗಳು ಮರೆಯಾಗಿರುತ್ತವೆ. ಅವುಗಳನ್ನು ನೋಡಲು ಸೆಟ್ಟಿಂಗ್ಗಳ “ಲೈಬ್ರರಿ” ಅಡಿಯಲ್ಲಿ “ಮರೆಮಾಡಿದ ಫೈಲ್ಗಳು” ಆನ್ ಮಾಡಿ."
