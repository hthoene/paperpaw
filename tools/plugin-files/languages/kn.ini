calendar.plugin.name = ಕ್ಯಾಲೆಂಡರ್
calendar.plugin.description = ರೀಡರ್ನಲ್ಲಿ ನಿಮ್ಮ ಕ್ಯಾಲೆಂಡರ್ಗಳು: CalDAV, iCal ಮತ್ತು ಫೈಲ್ಗಳಿಂದ ಕಾರ್ಯಸೂಚಿ, ದಿನ, ವಾರ, ತಿಂಗಳ ನೋಟಗಳು, ಸಂಪರ್ಕಗಳಿಂದ ಜನ್ಮದಿನಗಳು, ಹೋಮ್ ವಿಜೆಟ್ಗಳು ಮತ್ತು ನಿದ್ರೆ ಸ್ಕ್ರೀನ್.
calendar.plugin.how = "ರೀಡರ್ನಲ್ಲಿ ನಿಮ್ಮ ಕ್ಯಾಲೆಂಡರ್ಗಳು: ಕಾರ್ಯಸೂಚಿ, ದಿನ, ವಾರ ಮತ್ತು ತಿಂಗಳು, CalDAV ಕ್ಯಾಲೆಂಡರ್ಗಳು, iCal ವಿಳಾಸಗಳು, ಕಾರ್ಡ್ನಲ್ಲಿನ ಕ್ಯಾಲೆಂಡರ್ ಫೈಲ್ಗಳು ಮತ್ತು ಸಂಪರ್ಕಗಳ (CardDAV) ಜನ್ಮದಿನಗಳೊಂದಿಗೆ. ರೀಡರ್ ಕ್ಯಾಲೆಂಡರ್ಗಳನ್ನು ಓದುತ್ತದೆ ಮಾತ್ರ, ಬದಲಾಯಿಸುವುದಿಲ್ಲ.\n\n“ಪರಿಕರಗಳು” ಮೆನುವಿನಿಂದ ಕ್ಯಾಲೆಂಡರ್ ತೆರೆಯಿರಿ. ಮೊದಲ ಸಾಲು ನೋಟವನ್ನು ತೋರಿಸುತ್ತದೆ; ನೋಟ ಬದಲಿಸಲು, ಕ್ಯಾಲೆಂಡರ್ ಸೇರಿಸಲು ಅಥವಾ ಸಿಂಕ್ ಮಾಡಲು ಅದನ್ನು ಆಯ್ಕೆಮಾಡಿ ಅಥವಾ “ಮೆನು” ಒತ್ತಿ. ದಿನ ಮತ್ತು ವಾರದಲ್ಲಿ ಮೊದಲ ಎರಡು ಸಾಲುಗಳು (ಮತ್ತು ಪುಟ ಬಟನ್ಗಳು) ಹಿಂದಿನ/ಮುಂದಿನದಕ್ಕೆ ಹೋಗುತ್ತವೆ; ತಿಂಗಳಲ್ಲಿ ಬಾಣದ ಬಟನ್ಗಳು ದಿನವನ್ನು, ಪುಟ ಬಟನ್ಗಳು ತಿಂಗಳನ್ನು ಸರಿಸುತ್ತವೆ. “ಆಯ್ಕೆಮಾಡಿ” ಈವೆಂಟ್ನ ಪೂರ್ಣ ವಿವರ ತೋರಿಸುತ್ತದೆ.\n\n“ಕ್ಯಾಲೆಂಡರ್ಗಳು” ಅಡಿಯಲ್ಲಿ (ಮೆನುವಿನಲ್ಲಿ ಅಥವಾ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ) ಕ್ಯಾಲೆಂಡರ್ ಸೇರಿಸಿ: CalDAV ಖಾತೆ (ಸರ್ವರ್ ವಿಳಾಸ ಸಾಕು), iCal ವಿಳಾಸ, ಕಾರ್ಡ್ನಲ್ಲಿನ ಫೈಲ್ ಅಥವಾ ಸಂಪರ್ಕಗಳು. ವಿಳಾಸ, ಖಾತೆಗೆ ಬಳಕೆದಾರಹೆಸರು ಮತ್ತು ಪಾಸ್ವರ್ಡ್ (ಆಪ್ ಪಾಸ್ವರ್ಡ್ ಉತ್ತಮ) ಹಾಗೂ ಹೆಸರು ನಮೂದಿಸಿ. ಪ್ರತಿ ಕ್ಯಾಲೆಂಡರ್ಗೆ ಬದಲಾಯಿಸಬಹುದಾದ ಗುರುತು ಇದೆ; ಗರಿಷ್ಠ ಆರು ಕ್ಯಾಲೆಂಡರ್ಗಳು.\n\nಇಂದಿನ 60 ದಿನ ಹಿಂದಿನಿಂದ 60 ದಿನ ಮುಂದಿನವರೆಗಿನ ಗರಿಷ್ಠ 240 ಈವೆಂಟ್ಗಳನ್ನು ನೆಟ್ವರ್ಕ್ ಇಲ್ಲದೆಯೂ ತೋರಿಸುತ್ತದೆ.\n\nಕ್ಯಾಲೆಂಡರ್ ತೆರೆದಾಗ (ಗರಿಷ್ಠ ಐದು ನಿಮಿಷಕ್ಕೊಮ್ಮೆ), “ಈಗ ಸಿಂಕ್ ಮಾಡಿ” ಆಯ್ಕೆಮಾಡಿದಾಗ ಮತ್ತು ಸೆಟ್ಟಿಂಗ್ಗಳ ಪ್ರಕಾರ ನೆಟ್ವರ್ಕ್ ಆನ್ ಇದ್ದಾಗ ಅಥವಾ ಚಾರ್ಜಿಂಗ್ ಆರಂಭವಾದಾಗ ಓದಲಾಗುತ್ತದೆ. “ಈಗ ಸಿಂಕ್ ಮಾಡಿ” ಹೊರತು Wi-Fi ಅನ್ನು ಇದಕ್ಕಾಗಿ ಆನ್ ಮಾಡುವುದಿಲ್ಲ.\n\nಹೋಮ್ ಸ್ಕ್ರೀನ್ ವಿಜೆಟ್ಗಳು (ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಒತ್ತಿಹಿಡಿದು ವಿಜೆಟ್ ಸೇರಿಸಿ): ಇಂದು, ಮುಂದಿನ ಈವೆಂಟ್, ಕಾರ್ಯಸೂಚಿ, ತಿಂಗಳು, ಜನ್ಮದಿನಗಳು. ನಿದ್ರೆ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ಇಂದಿನ ಕಾರ್ಯಸೂಚಿಗಾಗಿ ಸೆಟ್ಟಿಂಗ್ಗಳ “ನಿದ್ರೆ ಸ್ಕ್ರೀನ್” ಅಡಿಯಲ್ಲಿ ಕ್ಯಾಲೆಂಡರ್ ಆಯ್ಕೆಮಾಡಿ."
