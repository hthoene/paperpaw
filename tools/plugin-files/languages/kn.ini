koreader.plugin.name = ಹೈಲೈಟ್ ಹಂಚಿಕೆ
koreader.plugin.description = ಎರಡರಲ್ಲೂ ಓದುವ ಪುಸ್ತಕಗಳ ಬುಕ್ಮಾರ್ಕ್ಗಳು ಮತ್ತು ಹೈಲೈಟ್ಗಳನ್ನು KOReader ಜೊತೆ ಹಂಚಿಕೊಳ್ಳುತ್ತದೆ.
koreader.plugin.how = "ಈ ಪ್ಲಗಿನ್ ನೀವು ಎರಡರಲ್ಲೂ ಓದುವ ಪುಸ್ತಕಗಳ ಬುಕ್ಮಾರ್ಕ್ಗಳು ಮತ್ತು ಹೈಲೈಟ್ಗಳನ್ನು KOReader ಜೊತೆ ಹಂಚಿಕೊಳ್ಳುತ್ತದೆ, ಒಂದೇ ಸಾಧನದಲ್ಲಿ ಅಥವಾ ಸಾಧನಗಳ ನಡುವೆ ಸಿಂಕ್ ಆಗುವ ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ನಲ್ಲಿ. ಏನನ್ನೂ ಹೊಂದಿಸಬೇಕಿಲ್ಲ.\n\nKOReader ಕೂಡ ತೆರೆದಿರುವ ಪುಸ್ತಕವನ್ನು PaperPaw ತೆರೆದಾಗ, ಮತ್ತು ನೀವು ಅದರ ಬುಕ್ಮಾರ್ಕ್ ಅಥವಾ ಹೈಲೈಟ್ಗಳನ್ನು ಬದಲಿಸಿದಾಗ, ಪುಸ್ತಕದ ಪಕ್ಕದಲ್ಲಿರುವ KOReader ಡೇಟಾದಿಂದ ಹೊಸದನ್ನು ತೆಗೆದುಕೊಳ್ಳುತ್ತದೆ ಮತ್ತು ಇಲ್ಲಿನ ಹೊಸದನ್ನು KOReader ಮುಂದಿನ ಬಾರಿ ಪುಸ್ತಕ ತೆರೆದಾಗ ಪಡೆಯಲು ಬಿಡುತ್ತದೆ. ತೆಗೆದುಹಾಕಿದ ಗುರುತುಗಳು ಮತ್ತು ಬದಲಿಸಿದ ಟಿಪ್ಪಣಿಗಳೂ ಹೋಗುತ್ತವೆ.\n\nಇದು EPUB ಪುಸ್ತಕಗಳಿಗೆ ಮಾತ್ರ. ಒಂದು ಬದಿಯ ಫೈಲ್ ಓದಲಾಗದಿದ್ದರೆ, ಅದು ಓದಲು ಸಾಧ್ಯವಾಗುವವರೆಗೆ ಎರಡೂ ಬದಿಯಲ್ಲಿ ಏನೂ ಬದಲಾಗುವುದಿಲ್ಲ."
koreader.removed-there = KOReader ಫೈಲ್ನಲ್ಲಿ ಈಗ ಹೈಲೈಟ್ಗಳಿಲ್ಲ. ಇಲ್ಲಿಯೂ ಅವನ್ನು ತೆಗೆದುಹಾಕಬೇಕೆ?
koreader.removed-there.text = ಅವನ್ನು KOReader ನಲ್ಲಿ ತೆಗೆದುಹಾಕಿರಬಹುದು, ಅಥವಾ ಅದರ ಫೈಲ್ ಬೇರೊಂದು ಸಾಧನದಿಂದ ಬಂದಿರಬಹುದು. “ಇರಿಸಿಕೊಳ್ಳಿ” ಅವನ್ನು ಇಲ್ಲಿ ಉಳಿಸಿ KOReader ಗೆ ಮತ್ತೆ ನೀಡುತ್ತದೆ.
koreader.removed-there.remove = ತೆಗೆದುಹಾಕಿ
