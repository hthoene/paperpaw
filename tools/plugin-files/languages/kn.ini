format-docx.plugin.name = DOCX ಡಾಕ್ಯುಮೆಂಟ್ಗಳು
format-docx.plugin.description = Word ಮತ್ತು ಇತರ ಪ್ರೋಗ್ರಾಂಗಳು ಉಳಿಸಿದ .docx ಫೈಲ್ಗಳನ್ನು ತೆರೆಯುತ್ತದೆ.
format-docx.plugin.how = ".docx ಡಾಕ್ಯುಮೆಂಟ್ಗಳನ್ನು ಪುಸ್ತಕಗಳಾಗಿ ತೆರೆಯುತ್ತದೆ: ಪರಿವಿಡಿಯೊಂದಿಗೆ ಶೀರ್ಷಿಕೆಗಳು, ಪಟ್ಟಿಗಳು, ಕೋಷ್ಟಕಗಳು, ದಪ್ಪ ಮತ್ತು ಓರೆ ಅಕ್ಷರ, ಲಿಂಕ್ಗಳು ಮತ್ತು ಚಿತ್ರಗಳು (JPEG, PNG, GIF).\n\nಫೈಲ್ಗಳನ್ನು ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯಿರಿ. ಶೀರ್ಷಿಕೆ ಮತ್ತು ಲೇಖಕ ಡಾಕ್ಯುಮೆಂಟ್ನ ಗುಣಲಕ್ಷಣಗಳಿಂದ ಬರುತ್ತವೆ. ಅಡಿಟಿಪ್ಪಣಿಗಳು, ಹೆಡರ್ ಮತ್ತು ಫೂಟರ್ಗಳು, ಹಾಗೂ ಕಾಮೆಂಟ್ಗಳನ್ನು ತೋರಿಸಲಾಗುವುದಿಲ್ಲ."
format-docx.title = DOCX ಡಾಕ್ಯುಮೆಂಟ್
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB ಪುಸ್ತಕಗಳನ್ನು ಅವುಗಳ ಶೈಲಿಗಳು, ಪರಿವಿಡಿ ಮತ್ತು ಚಿತ್ರಗಳೊಂದಿಗೆ ತೆರೆಯುತ್ತದೆ.
format-epub.plugin.how = "EPUB ಪುಸ್ತಕಗಳು ಲೈಬ್ರರಿಯಿಂದ ಇತರ ಪುಸ್ತಕಗಳಂತೆ, ಪರಿವಿಡಿ, ಚಿತ್ರಗಳು ಮತ್ತು ಪ್ರಕಾಶಕರ ಶೈಲಿಯೊಂದಿಗೆ ತೆರೆಯುತ್ತವೆ. ವೆಬ್ ಪುಟಗಳು (HTML), Markdown, FictionBook (.fb2) ಮತ್ತು ಕಾಮಿಕ್ ಪುಸ್ತಕ ಆರ್ಕೈವ್ಗಳು (.cbz) ಕೂಡ ಹಾಗೆಯೇ ತೆರೆಯುತ್ತವೆ, ಪ್ರತಿಯೊಂದೂ ತನ್ನದೇ ಪ್ಲಗಿನ್ ಆಗಿ.\n\nಅಧ್ಯಾಯವನ್ನು ಮೊದಲ ಬಾರಿ ತೆರೆದಾಗ ಪರಿವರ್ತಿಸಿ ಪ್ಲಗಿನ್ನ ಕ್ಯಾಶ್ನಲ್ಲಿ ಇರಿಸಲಾಗುತ್ತದೆ, ಆದ್ದರಿಂದ ನಂತರ ವೇಗವಾಗಿರುತ್ತದೆ ಮತ್ತು ದೊಡ್ಡ ಪುಸ್ತಕಗಳು ಸಣ್ಣ ಸಾಧನಗಳಲ್ಲೂ ಕೆಲಸ ಮಾಡುತ್ತವೆ. ಪರಿವಿಡಿ ಓದುವ ಮೆನುವಿನ “ಪರಿವಿಡಿ” ಅಡಿಯಲ್ಲಿದೆ. ಪುಸ್ತಕದ ಸ್ವಂತ ಶೈಲಿ ಅನ್ವಯಿಸಬೇಕೆ ಎಂಬುದು “ಓದುವಿಕೆ” ಅಡಿಯ “ಪ್ರಕಾಶಕರ ಫಾರ್ಮ್ಯಾಟಿಂಗ್” ಸೆಟ್ಟಿಂಗ್."
format-epub.title = EPUB ಇ-ಪುಸ್ತಕ
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook ಪುಸ್ತಕಗಳನ್ನು (.fb2, zip ಮಾಡಿದವೂ) ತೆರೆಯುತ್ತದೆ.
format-fb2.plugin.how = "ರಷ್ಯನ್ ಮತ್ತು ಇತರ ಪುಸ್ತಕಗಳಿಗೆ ಸಾಮಾನ್ಯವಾದ FictionBook ಪುಸ್ತಕಗಳನ್ನು (.fb2), zip ಮಾಡಿದವನ್ನೂ (.fb2.zip), ಶೀರ್ಷಿಕೆ, ಲೇಖಕರು, ಮುಖಪುಟ ಮತ್ತು ಅಧ್ಯಾಯಗಳೊಂದಿಗೆ ತೆರೆಯುತ್ತದೆ.\n\nಅವುಗಳನ್ನು ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ; ಅವು ಲೈಬ್ರರಿಯಲ್ಲಿ ಕಾಣುತ್ತವೆ ಮತ್ತು ಇತರ ಪುಸ್ತಕಗಳಂತೆ ತೆರೆಯುತ್ತವೆ."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ಫೈಲ್ಗಳಾಗಿ ಉಳಿಸಿದ ವೆಬ್ ಪುಟಗಳನ್ನು ತೆರೆಯುತ್ತದೆ, ಓದಬೇಕಾದುದನ್ನು ಮಾತ್ರ ತೋರಿಸುತ್ತದೆ.
format-html.plugin.how = "ಫೈಲ್ಗಳಾಗಿ ಉಳಿಸಿದ ವೆಬ್ ಪುಟಗಳನ್ನು (.html, .htm, .xhtml) ಪುಸ್ತಕಗಳಾಗಿ ತೆರೆಯುತ್ತದೆ: ಓದಬೇಕಾದುದು ಮಾತ್ರ, ಸುತ್ತಲಿನ ಮೆನುಗಳು, ಜಾಹೀರಾತುಗಳು ಮುಂತಾದವು ಇಲ್ಲದೆ.\n\nಫೈಲ್ ಅನ್ನು ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ ಯಾವುದೇ ಪುಸ್ತಕದಂತೆ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯಿರಿ. ಪುಟದೊಳಗಿನ ಲಿಂಕ್ಗಳು ಕೆಲಸ ಮಾಡುತ್ತವೆ; ಚಿತ್ರಗಳು ಫೈಲ್ನಲ್ಲಿ ಇರುವಲ್ಲೇ ಕಾಣುತ್ತವೆ."
format-html.title = ವೆಬ್ ಪುಟ (HTML)
format-images.plugin.name = ಚಿತ್ರಗಳು
format-images.plugin.description = ಚಿತ್ರಗಳನ್ನು (.jpg, .png, .gif) ಪುಸ್ತಕಗಳಾಗಿ ತೆರೆಯುತ್ತದೆ, ಪ್ರತಿಯೊಂದಕ್ಕೆ ಒಂದು ಪುಟ.
format-images.plugin.how = "ಚಿತ್ರಗಳು (.jpg, .png, .gif) ಲೈಬ್ರರಿಯಿಂದ ಪುಸ್ತಕಗಳಂತೆ ತೆರೆಯುತ್ತವೆ, ಪ್ರತಿ ಪುಟಕ್ಕೆ ಒಂದು ಚಿತ್ರ, ಸ್ಕ್ರೀನ್ಗೆ ಹೊಂದಿಸಿ.\n\nಚಿತ್ರಗಳ ಇಡೀ ಫೋಲ್ಡರ್ ಓದಲು ಅದರ ಮೊದಲ ಚಿತ್ರವನ್ನು ತೆರೆಯಿರಿ: ಫೋಲ್ಡರ್ನಲ್ಲಿ ಅದರ ನಂತರದ ಚಿತ್ರಗಳು ಹೆಸರುಗಳ ಕ್ರಮದಲ್ಲಿ (10 ಕ್ಕಿಂತ ಮೊದಲು 2) ಬರುತ್ತವೆ. ಫೋಲ್ಡರ್ನ ನಂತರದ ಚಿತ್ರವನ್ನು ತೆರೆದರೆ ಅಲ್ಲಿಂದ ಆರಂಭವಾಗುತ್ತದೆ; ಪ್ರತಿಯೊಂದರ ಸ್ಥಾನವನ್ನು ಪ್ರತ್ಯೇಕವಾಗಿ ನೆನಪಿಡಲಾಗುತ್ತದೆ. 300 ಚಿತ್ರಗಳವರೆಗಿನ ಫೋಲ್ಡರ್ ಅನ್ನು ನೀವು ತೆರೆದ ಚಿತ್ರದಿಂದ ಓದಲಾಗುತ್ತದೆ.\n\nಚಿತ್ರವಲ್ಲದ ಅಥವಾ ತುಂಬಾ ದೊಡ್ಡದಾದ ಫೈಲ್ ಬದಲಿಗೆ ತನ್ನ ಹೆಸರನ್ನು ತೋರಿಸುತ್ತದೆ. ಸ್ವಂತ ಶೀರ್ಷಿಕೆ ಇರುವ ಹಲವು ಚಿತ್ರಗಳ ಪುಸ್ತಕಕ್ಕೆ ಕಾಮಿಕ್ ಪುಸ್ತಕ ಆರ್ಕೈವ್ (.cbz) ಉತ್ತಮ ರೂಪ."
format-images.title = ಚಿತ್ರ
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ಫೈಲ್ಗಳನ್ನು (.md), ಉದಾ. ಟಿಪ್ಪಣಿಗಳನ್ನು ತೆರೆಯುತ್ತದೆ.
format-markdown.plugin.how = "ಟಿಪ್ಪಣಿಗಳಂತಹ Markdown ಫೈಲ್ಗಳನ್ನು (.md) ಪುಸ್ತಕಗಳಾಗಿ ತೆರೆಯುತ್ತದೆ: ಶೀರ್ಷಿಕೆಗಳು, ಪಟ್ಟಿಗಳು, ಉಲ್ಲೇಖಗಳು ಮತ್ತು ಒತ್ತು ಚಿಹ್ನೆಗಳಾಗಿ ಅಲ್ಲ, ಉದ್ದೇಶಿಸಿದಂತೆ ಕಾಣುತ್ತವೆ.\n\nಫೈಲ್ಗಳನ್ನು ಲೈಬ್ರರಿ ಫೋಲ್ಡರ್ಗೆ ಹಾಕಿ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯಿರಿ. ಮೊದಲ ಶೀರ್ಷಿಕೆ ಅದರ ಹೆಸರಾಗುತ್ತದೆ; ಫೈಲ್ನ ಪಕ್ಕದ ಚಿತ್ರಗಳು ಪಠ್ಯ ಅವುಗಳನ್ನು ಹೆಸರಿಸುವಲ್ಲಿ ಕಾಣುತ್ತವೆ."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI ಪುಸ್ತಕಗಳು
format-mobi.plugin.description = DRM ಇಲ್ಲದ .mobi ಮತ್ತು .azw ಫೈಲ್ಗಳನ್ನು ತೆರೆಯುತ್ತದೆ.
format-mobi.plugin.how = "MOBI ಪುಸ್ತಕಗಳು (.mobi, .azw) ಇತರ ಪುಸ್ತಕಗಳಂತೆ ಲೈಬ್ರರಿಯಿಂದ ತೆರೆಯುತ್ತವೆ, ಏನನ್ನೂ ಹೊಂದಿಸಬೇಕಿಲ್ಲ. ಶೀರ್ಷಿಕೆ, ಲೇಖಕರು, ಭಾಷೆ ಮತ್ತು ಮುಖಪುಟ ಪುಸ್ತಕದಿಂದಲೇ ಬರುತ್ತವೆ; ವಿಷಯಸೂಚಿಯನ್ನು ಅದರ ಶೀರ್ಷಿಕೆಗಳಿಂದ ರಚಿಸಲಾಗುತ್ತದೆ.\n\nಮೊದಲ ಬಾರಿ ತೆರೆದಾಗ ಪುಸ್ತಕವನ್ನು ಪರಿವರ್ತಿಸಲಾಗುತ್ತದೆ, ದೊಡ್ಡ ಪುಸ್ತಕಕ್ಕೆ ಇದಕ್ಕೆ ಕೆಲವು ಸೆಕೆಂಡುಗಳು ಬೇಕು; ನಂತರ ಅದು ತಕ್ಷಣ ತೆರೆಯುತ್ತದೆ. ಪಠ್ಯ, ಶೀರ್ಷಿಕೆಗಳು, ದಪ್ಪ ಮತ್ತು ಓರೆ ಅಕ್ಷರಗಳು, ಲಿಂಕ್ಗಳು ಮತ್ತು ಚಿತ್ರಗಳನ್ನು ತೋರಿಸಲಾಗುತ್ತದೆ.\n\nDRM ಇರುವ ಪುಸ್ತಕಗಳು (ಅಂಗಡಿಯಲ್ಲಿ ಕೊಂಡ ಹೆಚ್ಚಿನ ಪುಸ್ತಕಗಳು), Huffman ಸಂಕುಚನ ಇರುವ ಅಥವಾ ಹೊಸ KF8 ರೂಪದ (.azw3) ಪುಸ್ತಕಗಳು ತೆರೆಯುವುದಿಲ್ಲ: ತೆರೆಯುವಾಗ PaperPaw ಇದನ್ನು ತಿಳಿಸುತ್ತದೆ. Calibre ನಂತಹ ಪರಿಕರದಿಂದ ಮಾಡಿದ EPUB ಪ್ರತಿ ಯಾವಾಗಲೂ ತೆರೆಯುತ್ತದೆ."
format-mobi.title = MOBI ಪುಸ್ತಕಗಳು
