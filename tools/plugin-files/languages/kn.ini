mail.plugin.description = ಪಾಸ್ವರ್ಡ್ ಅಥವಾ ಆಪ್ ಪಾಸ್ವರ್ಡ್ನಿಂದ (IMAP ಮತ್ತು SMTP) ಇಮೇಲ್ ಓದುತ್ತದೆ ಮತ್ತು ಕಳುಹಿಸುತ್ತದೆ, ಬ್ರೌಸರ್ ಲಾಗಿನ್ ಇಲ್ಲದೆ.
mail.plugin.how = "ಮೇಲ್ IMAP ಮತ್ತು SMTP ಮೂಲಕ ಇಮೇಲ್ ಓದುತ್ತದೆ ಮತ್ತು ಕಳುಹಿಸುತ್ತದೆ. ಇದು ನಿಮ್ಮ ವಿಳಾಸ ಮತ್ತು ಪಾಸ್ವರ್ಡ್ನಿಂದ, ಬ್ರೌಸರ್ ಲಾಗಿನ್ ಇಲ್ಲದೆ ಸೈನ್ ಇನ್ ಆಗುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳು › ಮೇಲ್ ನಲ್ಲಿ ಖಾತೆ ಹೊಂದಿಸಿ: ಪೂರೈಕೆದಾರರನ್ನು ಆರಿಸಿ, ವಿಳಾಸ ಮತ್ತು ಪಾಸ್ವರ್ಡ್ ಟೈಪ್ ಮಾಡಿ. ಹೆಚ್ಚಿನ ಪೂರೈಕೆದಾರರಿಗೆ ಆಪ್ ಪಾಸ್ವರ್ಡ್ ಬೇಕು: ಅದನ್ನು ಖಾತೆಯ ಭದ್ರತಾ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ರಚಿಸಿ. ಪಾಸ್ವರ್ಡ್ ನಿಮ್ಮ ಪೂರೈಕೆದಾರರ ಸರ್ವರ್ಗೆ ಮಾತ್ರ ಹೋಗುತ್ತದೆ ಮತ್ತು ಪಾಸ್ವರ್ಡ್ಗಳು ಮತ್ತು ಕೀಗಳ ಜೊತೆ ಇರಿಸಲಾಗುತ್ತದೆ. ಪೂರೈಕೆದಾರರು ಪಟ್ಟಿಯಲ್ಲಿ ಇಲ್ಲದಿದ್ದರೆ “ಸ್ವಂತ ಸರ್ವರ್ಗಳು” ಆರಿಸಿ, ಸುಧಾರಿತ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಸರ್ವರ್, ಪೋರ್ಟ್ ಮತ್ತು ಭದ್ರತೆ ಹೊಂದಿಸಿ. ಯಾವ ಪ್ರಾಧಿಕಾರವೂ ದೃಢೀಕರಿಸದ ಪ್ರಮಾಣಪತ್ರದ ಸರ್ವರ್ ಅನ್ನು ನಂಬಬೇಕೆ ಎಂದು ಒಮ್ಮೆ ಕೇಳಲಾಗುತ್ತದೆ; ಫಿಂಗರ್ಪ್ರಿಂಟ್ ಅನ್ನು ಪೂರೈಕೆದಾರರು ತೋರಿಸುವುದರೊಂದಿಗೆ ಹೋಲಿಸಿ.\n\nಪರಿಕರಗಳಲ್ಲಿ ಮೇಲ್ ತೆರೆಯಿರಿ. “ಮೇಲ್ ಪರಿಶೀಲಿಸಿ” ಇತ್ತೀಚಿನ ಮೇಲ್ಗಳು ಮತ್ತು ಫೋಲ್ಡರ್ಗಳನ್ನು ತರುತ್ತದೆ. ಮೇಲ್ಗಳು ಕಾರ್ಡ್ನಲ್ಲಿ ಉಳಿಯುತ್ತವೆ, ನೆಟ್ವರ್ಕ್ ಇಲ್ಲದೆಯೂ ಓದಬಹುದು; Wi-Fi ಸ್ವಲ್ಪ ಹೊತ್ತು ಮಾತ್ರ ಆನ್ ಇರುತ್ತದೆ. ಪುಸ್ತಕ ಲಗತ್ತಿಸಿದ ಮೇಲ್ (EPUB, PDF ಇತ್ಯಾದಿ, 2 MB ವರೆಗೆ) ಕೆಳಗೆ “ಪುಸ್ತಕ ತೆರೆಯಿರಿ” ಇರುತ್ತದೆ: ಅದು ಫೈಲ್ ಅನ್ನು ಲೈಬ್ರರಿಗೆ ಸೇರಿಸಿ ತೆರೆಯುತ್ತದೆ.\n\nಮೇಲ್ ತೆರೆಯದೆ ಹೊಸ ಮೇಲ್ ನೋಡಲು, ಸೆಟ್ಟಿಂಗ್ಗಳು › ಮೇಲ್ ನಲ್ಲಿ “ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಹೊಸ ಮೇಲ್ ಪರಿಶೀಲಿಸಿ” ಆನ್ ಮಾಡಿ, ಎಷ್ಟು ಆಗಾಗ ಎಂದು ಆರಿಸಿ (15, 30 ಅಥವಾ 60 ನಿಮಿಷ). ರೀಡರ್ ಎಚ್ಚರವಾಗಿದ್ದು ಆನ್ಲೈನ್ ಇರುವಾಗ ಸುರಕ್ಷಿತ ಸಂಪರ್ಕದಲ್ಲಿ ಪರಿಶೀಲಿಸಿ ಹೋಮ್ನಲ್ಲಿ ಓದದ ಮೇಲ್ಗಳ ಸಂಖ್ಯೆ ಅಪ್ಡೇಟ್ ಮಾಡುತ್ತದೆ; ಇದು ಸ್ವಲ್ಪ ಬ್ಯಾಟರಿ ಬಳಸುತ್ತದೆ. ಹೋಮ್ ಸ್ಕ್ರೀನ್ ವಿಜೆಟ್ಗಳು ಓದದ ಸಂಖ್ಯೆ, ಇತ್ತೀಚಿನ ಮತ್ತು ನಕ್ಷತ್ರ ಹಾಕಿದ ಮೇಲ್ಗಳು, ಒಂದು ಮೇಲ್ಬಾಕ್ಸ್ ಮತ್ತು ಮೇಲ್ ಬರೆಯುವ ಶಾರ್ಟ್ಕಟ್ ತೋರಿಸುತ್ತವೆ."
