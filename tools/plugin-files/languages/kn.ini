store.source.note = PaperPaw {name} ಅನ್ನು ಅಥವಾ ಅದರ ಪ್ಲಗಿನ್ಗಳನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ. ಅದರ ಕೋಡ್ ಪ್ಲಗಿನ್ಗಳಿಗೆ ಈ ಸಾಧನ, ಅದರ ಪುಸ್ತಕಗಳು ಮತ್ತು ಸೆಟ್ಟಿಂಗ್ಗಳಿಗೆ ಪೂರ್ಣ ಪ್ರವೇಶ ಸಿಗುತ್ತದೆ. ಸಾಧನವು ಮೂಲದ ಸರ್ವರ್ ಅನ್ನು ಸಂಪರ್ಕಿಸುತ್ತದೆ. ಅದನ್ನು ನಡೆಸುವವರನ್ನು ನೀವು ನಂಬಿದರೆ ಮಾತ್ರ ಸೇರಿಸಿ.
store.source.added = {name} ಈಗ ಒಂದು ಮೂಲ. PaperPaw ಅದನ್ನು ಪರಿಶೀಲಿಸುವುದಿಲ್ಲ. ಅದರ ಕೀ {key} ಇಂದ ಆರಂಭವಾಗುತ್ತದೆ: ಇನ್ನು ಮುಂದೆ ಈ ಕೀಯ ಸಹಿ ಇರುವ ಪಟ್ಟಿಗಳು ಮತ್ತು ಪ್ಲಗಿನ್ಗಳನ್ನು ಮಾತ್ರ ಅದರಿಂದ ಸ್ವೀಕರಿಸಲಾಗುತ್ತದೆ.
