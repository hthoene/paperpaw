anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ನಿಮ್ಮ ಕಂಪ್ಯೂಟರ್ನಲ್ಲಿರುವ Anki ಯ ಬಾಕಿ ಕಾರ್ಡ್ಗಳನ್ನು ಅಭ್ಯಾಸ ಮಾಡಿಸುತ್ತದೆ ಮತ್ತು AnkiConnect ಆಡ್-ಆನ್ ಮೂಲಕ ನಿಮ್ಮ ಉತ್ತರಗಳನ್ನು ಮರಳಿ ಕಳುಹಿಸುತ್ತದೆ.
anki.plugin.how = "Anki ಮೂಲಕ ಕಂಪ್ಯೂಟರ್ನ Anki ಯಲ್ಲಿ ಬಾಕಿ ಇರುವ ಕಾರ್ಡ್ಗಳನ್ನು ರೀಡರ್ನಲ್ಲಿ ಅಭ್ಯಾಸ ಮಾಡಬಹುದು; ಉತ್ತರಗಳು ಮರಳಿ ಹೋಗುತ್ತವೆ. ಇದು ಉಚಿತ AnkiConnect ಆಡ್-ಆನ್ (ಕೋಡ್ 2055492159) ಬಳಸುತ್ತದೆ, AnkiWeb ಅನ್ನು ಎಂದೂ ಅಲ್ಲ. ಆರಂಭದಲ್ಲಿ ಆಫ್: ಪ್ಲಗಿನ್ ಸ್ಟೋರ್ನಿಂದ ಸೇರಿಸಿ.\n\nಕಂಪ್ಯೂಟರ್ನಲ್ಲಿ: Anki ಯಲ್ಲಿ AnkiConnect ಇನ್ಸ್ಟಾಲ್ ಮಾಡಿ (Tools, Add-ons, Get Add-ons) ಮತ್ತು Anki ಮರುಪ್ರಾರಂಭಿಸಿ. ಸಿಂಕ್ ಮಾಡುವಾಗ Anki ತೆರೆದಿರಬೇಕು.\n\nಸಾಮಾನ್ಯವಾಗಿ AnkiConnect ತಾನಿರುವ ಕಂಪ್ಯೂಟರ್ಗೆ (127.0.0.1) ಮಾತ್ರ ಉತ್ತರಿಸುತ್ತದೆ, ರೀಡರ್ ತಲುಪಲಾರದು. Tools, Add-ons, AnkiConnect, Config ತೆರೆದು “webBindAddress” ಅನ್ನು “0.0.0.0” ಗೆ ಹೊಂದಿಸಿ (ಮನೆಯ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿ ಆಲಿಸುತ್ತದೆ). ಪೋರ್ಟ್ “webBindPort”, ನೀವು ಬದಲಿಸದಿದ್ದರೆ 8765. ಅಲ್ಲಿ “apiKey” ಹೊಂದಿಸಿದರೆ, ಅದೇ ಕೀಯನ್ನು ಇಲ್ಲಿ ನಮೂದಿಸಿ. ಬದಲಾವಣೆಯ ನಂತರ Anki ಮರುಪ್ರಾರಂಭಿಸಿ, ಫೈರ್ವಾಲ್ ಕೇಳಿದರೆ ಅನುಮತಿಸಿ. ನಂಬಿಕೆಯ ನೆಟ್ವರ್ಕ್ನಲ್ಲಿ ಮಾತ್ರ ಬಳಸಿ; ಕೀ ಇರುವುದು ಒಳ್ಳೆಯದು.\n\nರೀಡರ್ನಲ್ಲಿ: ಪರಿಕರಗಳಿಂದ Anki ತೆರೆಯಿರಿ, ಕಂಪ್ಯೂಟರ್ ಅಡಿಯಲ್ಲಿ ಅದರ ವಿಳಾಸ (ಉದಾ. 192.168.1.20), ಬೇರೆಯಾಗಿದ್ದರೆ ಪೋರ್ಟ್, ಮತ್ತು API ಕೀ ನಮೂದಿಸಿ. ಡೆಕ್ ಆರಿಸಿ, ಅಥವಾ ಎಲ್ಲಾ ಡೆಕ್ಗಳಿಗೆ ಖಾಲಿ ಬಿಡಿ. Wi-Fi ಆನ್ ಇರುವಾಗ Anki ಜೊತೆ ಸಿಂಕ್ ಆರಿಸಿ: ಕಾಯುತ್ತಿರುವ ಉತ್ತರಗಳು ಹೋಗುತ್ತವೆ, ನಂತರ ಬಾಕಿ ಕಾರ್ಡ್ಗಳು (ಮತ್ತು ನೀವು ಹೊಂದಿಸಿದಷ್ಟು ಹೊಸವು) ಗರಿಷ್ಠ 50 ಬರುತ್ತವೆ. ನೆಟ್ವರ್ಕ್ ಇಲ್ಲದೆ ಅಭ್ಯಾಸ ಮಾಡಲು ಅಭ್ಯಾಸ ಆರಿಸಿ: ಉತ್ತರ ತೋರಿಸಿ, ಮತ್ತೆ, ಕಷ್ಟ, ಒಳ್ಳೆಯದು ಅಥವಾ ಸುಲಭ ಎಂದು ರೇಟ್ ಮಾಡಿ. ಉತ್ತರಗಳು Wi-Fi ಇಲ್ಲದಿದ್ದರೂ ರೀಡರ್ನಲ್ಲಿ ಉಳಿದು ಮುಂದಿನ ಸಿಂಕ್ನಲ್ಲಿ Anki ಗೆ ಹೋಗುತ್ತವೆ. ಕಾರ್ಡ್ ಯಾವಾಗ ಮರಳುತ್ತದೆ ಎಂದು Anki ನಿರ್ಧರಿಸುತ್ತದೆ: ಮತ್ತೆ ಎಂದು ಉತ್ತರಿಸಿದ ಕಾರ್ಡ್ ಬಾಕಿಯಾದಾಗ ನಂತರದ ಸಿಂಕ್ನಲ್ಲಿ ಮತ್ತೆ ಬರುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿನ Anki ತೆರೆದಾಗ ಸಿಂಕ್ ಮಾಡಿ, ಸ್ಕ್ರೀನ್ ತೆರೆದಾಗಲೆಲ್ಲಾ ಸಿಂಕ್ ಮಾಡುತ್ತದೆ. ಬಟನ್ ಒತ್ತಿದಾಗ ನೆಟ್ವರ್ಕ್ ಬಳಕೆಯಾಗದು."
