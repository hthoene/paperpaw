menu.plugin.name = ಮೆನು
menu.plugin.description = ಸ್ಕ್ರೀನ್ನ ಕೆಳಭಾಗದ ಮೆನು, ಕ್ರಿಯೆಗಳು ಮತ್ತು ಸೆಟ್ಟಿಂಗ್ಗಳ ಸಹಿತ.
menu.plugin.how = "ನೀವು ಏನು ಮಾಡಬಹುದು ಮತ್ತು ಹೊಂದಿಸಬಹುದು ಎಂಬುದನ್ನು ಮೆನು ಪಟ್ಟಿ ಮಾಡುತ್ತದೆ. ಇದು ತೆರೆದಿರುವುದರ ಮೇಲೆ, ಸ್ಕ್ರೀನ್ನ ಕೆಳಭಾಗದಲ್ಲಿ ತೆರೆಯುತ್ತದೆ: ಓದುವಾಗ ಸ್ಕ್ರೀನ್ನ ಮಧ್ಯವನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ ಅಥವಾ ಆಯ್ಕೆಮಾಡಿ ಒತ್ತಿ. ನಮೂದನ್ನು ಚಲಾಯಿಸಲು ಅದನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ ಅಥವಾ ಆಯ್ಕೆಮಾಡಿ.\n\nಮೆನುವಿನ ಸೆಟ್ಟಿಂಗ್ಗಳು ತಮ್ಮ ಮೌಲ್ಯವನ್ನು ತೋರಿಸುತ್ತವೆ ಮತ್ತು ಅಲ್ಲೇ ಬದಲಾಗುತ್ತವೆ, ಆದ್ದರಿಂದ ಮೆನು ತೆರೆದೇ ಇರುತ್ತದೆ. ಹೆಚ್ಚಿನ ನಮೂದುಗಳಿರುವ ನಮೂದು ಉಪಮೆನುವನ್ನು ತೆರೆಯುತ್ತದೆ.\n\nತ್ವರಿತ ಪ್ಯಾನೆಲ್ಗಾಗಿ ಮೇಲಿನ ಅಂಚಿನಿಂದ ಕೆಳಕ್ಕೆ ಸ್ವೈಪ್ ಮಾಡಿ: ನೀವು ಆಗಾಗ ಬದಲಿಸುವುದು, ಬಟನ್ಗಳಾಗಿ. ಬಟನ್ ಬದಲಿಸಲು ಟ್ಯಾಪ್ ಮಾಡಿ, ಅದರ ಸೆಟ್ಟಿಂಗ್ಗಳಿಗಾಗಿ ಒತ್ತಿಹಿಡಿಯಿರಿ. ಬಟನ್ಗಳು ಮಾತ್ರ ಇದ್ದರೆ ಬಾಣದ ಬಟನ್ಗಳು ಆರಿಸುತ್ತವೆ, ಆಯ್ಕೆಮಾಡಿ ಬದಲಿಸುತ್ತದೆ, ಹಿಂದೆ ಮುಚ್ಚುತ್ತದೆ. ನೋಟ ಅಡಿಯಲ್ಲಿ “ಮೆನುಗಳು” ಮೆನುಗಳನ್ನು ಪಟ್ಟಿಯಾಗಿ ಅಥವಾ ಟೈಲ್ಗಳಾಗಿ ತೋರಿಸುತ್ತದೆ."
