vocabulary.setting.sd-folder.help = SD ಕಾರ್ಡ್ನಲ್ಲಿ: ಅದರಲ್ಲಿನ CSV, TSV ಅಥವಾ Anki ಫೈಲ್ ಒಂದು ಡೆಕ್.
vocabulary.sd.readme = "ಫೈಲ್ಗಳಿಂದ ಫ್ಲ್ಯಾಶ್ ಕಾರ್ಡ್ಗಳು\n\nಪ್ರತಿ ಡೆಕ್ಗೆ ಇಲ್ಲಿ ಒಂದು ಫೈಲ್ ಇಡಿ: Spanish.tsv ಡೆಕ್ Spanish ಆಗುತ್ತದೆ.\nಫೈಲ್ಗಳು: .tsv, .csv ಅಥವಾ .txt (UTF-8), ಅಥವಾ .apkg: Support older Anki versions ಜೊತೆ ರಫ್ತು ಮಾಡಿದ Anki ಡೆಕ್. ಅದರ ಮೊದಲ ಮೂರು ಕ್ಷೇತ್ರಗಳು ಮುಂಭಾಗ, ಹಿಂಭಾಗ, ಉದಾಹರಣೆ ಆಗುತ್ತವೆ; PaperPaw Anki ಫೈಲ್ ಬರೆಯುವುದಿಲ್ಲ.\n\nಪ್ರತಿ ಸಾಲಿಗೆ ಒಂದು ಕಾರ್ಡ್: ಮುಂಭಾಗ, ಹಿಂಭಾಗ, ಉದಾಹರಣೆ (ಐಚ್ಛಿಕ), ಟ್ಯಾಬ್, ಅಲ್ಪವಿರಾಮ ಅಥವಾ ಅರ್ಧವಿರಾಮದಿಂದ ಬೇರ್ಪಡಿಸಿ. ಮೊದಲ ಸಾಲು ಕಾಲಮ್ ಹೆಸರಿಸಬಹುದು: front, back, example. ಉದಾಹರಣೆ:\n\nKatze\tcat\tDie Katze schläft.\n\nನಂತರ ರೀಡರ್ನಲ್ಲಿ ಫ್ಲ್ಯಾಶ್ ಕಾರ್ಡ್ಗಳು › SD ಕಾರ್ಡ್ನ ಕಾರ್ಡ್ಗಳು › ಡೆಕ್ಗಳನ್ನು ಅಪ್ಡೇಟ್ ಮಾಡಿ.\n\nತಿಳಿದಿರಲಿ:\n- ಡೆಕ್ಗಳು ಪ್ರಗತಿಯೊಂದಿಗೆ ರೀಡರ್ನಲ್ಲಿ ಉಳಿಯುತ್ತವೆ. ಹೊಸ/ಬದಲಾದ ಫೈಲ್ ಓದಲಾಗುತ್ತದೆ.\n- ಹಿಂಭಾಗ/ಉದಾಹರಣೆ ಬದಲಿಸಿದರೆ ಪ್ರಗತಿ ಉಳಿಯುತ್ತದೆ.\n- ಮುಂಭಾಗ ಬದಲಿಸಿದರೆ ಹೊಸ ಕಾರ್ಡ್ (ಸ್ಪೇಸ್, ದೊಡ್ಡಕ್ಷರ ಲೆಕ್ಕಕ್ಕಿಲ್ಲ). ಡೆಕ್ ಉಳಿಸಿದರೆ id ಕಾಲಮ್ ಬರುತ್ತದೆ: ಆಗ ಮುಂಭಾಗ ಬದಲಿಸಿದರೂ ಪ್ರಗತಿ ಉಳಿಯುತ್ತದೆ (ಮೊದಲ ಎರಡು ಸಾಲು ಬದಲಿಸಬೇಡಿ).\n- ಉಳಿಸಿದಾಗ ಮುಂಭಾಗವಿಲ್ಲದ ಸಾಲುಗಳು ಹೋಗುತ್ತವೆ; ಹಳೆಯ ಫೈಲ್ _name.bak.tsv ಆಗುತ್ತದೆ.\n- CSV UTF-8 ಆಗಿ ಉಳಿಸಿ. 4 MiB ಅಥವಾ 20,000 ಸಾಲು ಮೀರಿದರೆ ಓದುವುದಿಲ್ಲ.\n- ಅಳಿಸಿದ ಸಾಲು ಕಾರ್ಡ್ ಅಳಿಸುವುದಿಲ್ಲ, ಆ ಡೆಕ್ಗೆ “ತೆಗೆದುಹಾಕಿ” ಆನ್ ಇಲ್ಲದಿದ್ದರೆ.\n- _ ನಿಂದ ಆರಂಭವಾಗುವ ಫೈಲ್ಗಳನ್ನು ಓದುವುದಿಲ್ಲ.\n"
