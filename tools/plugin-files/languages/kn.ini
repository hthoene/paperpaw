notes-vault.plugin.name = ಟಿಪ್ಪಣಿ ವಾಲ್ಟ್
notes-vault.plugin.description = Markdown ಟಿಪ್ಪಣಿಗಳ ಫೋಲ್ಡರ್ ಅನ್ನು ಫೋಲ್ಡರ್ಗಳು, ಟ್ಯಾಗ್ಗಳು ಮತ್ತು ಇತ್ತೀಚಿನ ಬದಲಾವಣೆಗಳ ಪ್ರಕಾರ ಓದುತ್ತದೆ, ಹೋಮ್ ಸ್ಕ್ರೀನ್ಗಾಗಿ ವಿಜೆಟ್ಗಳೊಂದಿಗೆ. Obsidian ವಾಲ್ಟ್ಗಳೊಂದಿಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ.
notes-vault.plugin.how = "ಟಿಪ್ಪಣಿ ವಾಲ್ಟ್ Markdown ಟಿಪ್ಪಣಿಗಳ (.md ಫೈಲ್ಗಳು) ಫೋಲ್ಡರ್ ಅನ್ನು ಓದುತ್ತದೆ; Obsidian ವಾಲ್ಟ್ಗಳೂ ಸರಿ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಅಥವಾ ಪರಿಕರಗಳಲ್ಲಿನ ವಾಲ್ಟ್ ಪುಟದಲ್ಲಿ ವಾಲ್ಟ್ ಫೋಲ್ಡರ್ ಆಯ್ಕೆಮಾಡಿ. ಪುಟವು ಕಾರ್ಡ್ನಲ್ಲಿರುವಂತೆ ಫೋಲ್ಡರ್ಗಳು, ಇತ್ತೀಚಿನ ಟಿಪ್ಪಣಿಗಳು, ಟ್ಯಾಗ್ಗಳು ಮತ್ತು ಶೀರ್ಷಿಕೆ ಹುಡುಕಾಟ ನೀಡುತ್ತದೆ.\n\nಮೊದಲ ಬಾರಿ ಪುಟ ತೆರೆದಿರುವಾಗ ವಾಲ್ಟ್ ಇಂಡೆಕ್ಸ್ ಆಗುತ್ತದೆ (ಸಾವಿರಾರು ಟಿಪ್ಪಣಿಗಳಿಗೆ ಕೆಲವು ನಿಮಿಷ). ಇಂಡೆಕ್ಸ್ ಕಾರ್ಡ್ನಲ್ಲಿ ಉಳಿಯುತ್ತದೆ; ಕೆಲವು ಗಂಟೆಗಳ ನಂತರ ಅಥವಾ ಅಪ್ಡೇಟ್ ಆಯ್ಕೆಮಾಡಿದಾಗ ಹೊಸದಾಗುತ್ತದೆ.\n\nಟಿಪ್ಪಣಿ ರೀಡರ್ನಲ್ಲಿ ತೆರೆಯುತ್ತದೆ. [[Note]], [[Note|ಪದಗಳು]], [[Note#Heading]] ಲಿಂಕ್ಗಳು ಹೆಸರಿನಿಂದ ಟಿಪ್ಪಣಿಯನ್ನು ತೆರೆಯುತ್ತವೆ; ಹಿಂದೆ ಹಿಂದಿನ ಟಿಪ್ಪಣಿಗೆ ಮರಳಿಸುತ್ತದೆ.\n\nವಾಲ್ಟ್ನಲ್ಲಿ ಏನನ್ನೂ ಬದಲಾಯಿಸುವುದಿಲ್ಲ. ವಿಜೆಟ್ಗಳನ್ನು (ಇತ್ತೀಚಿನ, ಪಿನ್ ಮಾಡಿದ, ದಿನದ, ಯಾದೃಚ್ಛಿಕ ಟಿಪ್ಪಣಿ, ಟ್ಯಾಗ್ಗಳು, ಹುಡುಕಾಟ) ಹೋಮ್ ಸ್ಕ್ರೀನ್ ಎಡಿಟರ್ನಲ್ಲಿ ಸೇರಿಸಿ. ವಿಜೆಟ್ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಕಾರ್ಡ್ನ ಮೂಲದಿಂದ ಫೋಲ್ಡರ್ ಪಾತ್ (ಉದಾ. Notes/Work) ಬರೆದರೆ ಆ ಫೋಲ್ಡರ್ ಮಾತ್ರ; ಖಾಲಿ ಇದ್ದರೆ ಎಲ್ಲಾ ಟಿಪ್ಪಣಿಗಳು."
