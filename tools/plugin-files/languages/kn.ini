news.plugin.name = ಸುದ್ದಿ
news.plugin.description = ಸುದ್ದಿ ಫೀಡ್ಗಳನ್ನು (RSS, Atom) ಓದಲು ಪುಸ್ತಕಗಳಾಗಿ ತರುತ್ತದೆ.
news.plugin.how = "ಸುದ್ದಿ RSS ಅಥವಾ Atom ಫೀಡ್ಗಳನ್ನು ಪುಸ್ತಕಗಳಾಗಿಸುತ್ತದೆ. ಪ್ರತಿ ಫೀಡ್ ಲೈಬ್ರರಿಯ ಸುದ್ದಿ ಫೋಲ್ಡರ್ನಲ್ಲಿ ಒಂದು ಪುಸ್ತಕವಾಗುತ್ತದೆ, ಅದರ ಹೊಸ ಲೇಖನಗಳು ಸರಳ ಪಠ್ಯವಾಗಿ, ಇತರ ಪುಸ್ತಕಗಳಂತೆ ಓದಲು.\n\nಪರಿಕರಗಳ ಮೆನುವಿನಿಂದ ಸುದ್ದಿ ತೆರೆಯಿರಿ ಮತ್ತು “ಫೀಡ್ ಸೇರಿಸಿ” ಆರಿಸಿ; ಅದರ ವಿಳಾಸ ಪತ್ರಿಕೆ ಅಥವಾ ಬ್ಲಾಗ್ನ ವೆಬ್ಸೈಟ್ನಲ್ಲಿರುತ್ತದೆ. “ಸುದ್ದಿ ತನ್ನಿ” ಎಲ್ಲ ಫೀಡ್ಗಳನ್ನು ತಂದು ಹಿಂದಿನ ಪುಸ್ತಕಗಳನ್ನು ಬದಲಿಸುತ್ತದೆ. ಒಂದೇ ಫೀಡ್ ತರಲು ಅಥವಾ ತೆಗೆದುಹಾಕಲು ಅದನ್ನು ಒತ್ತಿಹಿಡಿಯಿರಿ (ಬಟನ್ಗಳಿಂದ: ಆಯ್ಕೆಮಾಡಿ ಒತ್ತಿಹಿಡಿಯಿರಿ). ತೆಗೆದುಹಾಕಿದ ಫೀಡ್ನ ಪುಸ್ತಕ ಲೈಬ್ರರಿಯಲ್ಲಿ ಉಳಿಯುತ್ತದೆ.\n\nತರಲು ನೆಟ್ವರ್ಕ್ ಬೇಕು. “ಪ್ರತಿ ಫೀಡ್ಗೆ ಲೇಖನಗಳು” (ಸೆಟ್ಟಿಂಗ್ಗಳು, ಲೈಬ್ರರಿ) ಪ್ರತಿ ಪುಸ್ತಕದಲ್ಲಿ ಎಷ್ಟು ಲೇಖನಗಳು ಎಂದು ಹೊಂದಿಸುತ್ತದೆ. “ಸುದ್ದಿ ಶೀರ್ಷಿಕೆಗಳು” ವಿಜೆಟ್ ಅವನ್ನು ಹೋಮ್ ಸ್ಕ್ರೀನ್ನಲ್ಲಿ ತೋರಿಸುತ್ತದೆ."
