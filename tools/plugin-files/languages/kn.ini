sleep.plugin.name = ನಿದ್ರೆ ಸ್ಕ್ರೀನ್
sleep.plugin.description = ಸಾಧನ ನಿದ್ರಿಸುವಾಗ ಮಲಗಿರುವ ಬೆಕ್ಕು, ಪುಸ್ತಕದ ಮುಖಪುಟ, ನಿಮ್ಮ ಚಿತ್ರಗಳು ಅಥವಾ ಸಂದೇಶವನ್ನು ತೋರಿಸುತ್ತದೆ.
sleep.plugin.how = "ಸಾಧನ ನಿದ್ರಿಸುವಾಗ ಸ್ಕ್ರೀನ್ ಏನು ತೋರಿಸಬೇಕು ಎಂದು ನಿದ್ರೆ ಸ್ಕ್ರೀನ್ ನಿರ್ಧರಿಸುತ್ತದೆ. E-ink ವಿದ್ಯುತ್ ಇಲ್ಲದೆಯೂ ಚಿತ್ರವನ್ನು ಉಳಿಸಿಕೊಳ್ಳುತ್ತದೆ.\n\nಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ “ಸಾಧನ” › “ನಿದ್ರೆ ಸ್ಕ್ರೀನ್” › “ತೋರಿಸಿ” ಯಲ್ಲಿ ಆಯ್ಕೆಮಾಡಿ: ಮಲಗಿರುವ ಬೆಕ್ಕು (ಡೀಫಾಲ್ಟ್), ಪುಸ್ತಕದ ಮುಖಪುಟ, ನನ್ನ ಚಿತ್ರಗಳು, ಲೋಗೋ ಮತ್ತು “ನಿದ್ರಿಸುತ್ತಿದೆ”, ವಿಜೆಟ್ಗಳು, ಇರುವಂತೆಯೇ ಪುಟ, ಅಥವಾ ಚಿತ್ರದೊಂದಿಗೆ ಪುಟ. “ನನ್ನ ಚಿತ್ರಗಳು” ಚಿತ್ರಗಳ ಫೋಲ್ಡರ್ನ ಫೈಲ್ಗಳನ್ನು ಒಂದರ ನಂತರ ಒಂದು ತೋರಿಸುತ್ತದೆ. ಮುಖಪುಟ ಅಥವಾ ಚಿತ್ರ ಇಲ್ಲದಿದ್ದರೆ ಬೆಕ್ಕು ಕಾಣುತ್ತದೆ. ಸಿಸ್ಟಂ ತಾನೇ ನಿದ್ರೆ ಸ್ಕ್ರೀನ್ ಬಿಡಿಸುವಲ್ಲಿ ಈ ಸೆಟ್ಟಿಂಗ್ಗಳು ಮರೆಯಾಗಿರುತ್ತವೆ.\n\n“ಆಫ್ ಮಾಡಿದಾಗ ತೋರಿಸಿ” ಸ್ಕ್ರೀನ್ ಅನ್ನು ಪವರ್ ಮೆನುವಿನಿಂದ ಅಥವಾ ನಿದ್ರೆಯ ನಂತರ ಸ್ವಯಂ ಆಫ್ ಆದಾಗ ಒಮ್ಮೆ ಬಿಡಿಸಲಾಗುತ್ತದೆ (ಬ್ಯಾಟರಿ ಖಾಲಿಯಾದಾಗ ಅಲ್ಲ). ನೀವು ಲೋಗೋ ಮತ್ತು “ಆಫ್ ಆಗಿದೆ”, ಬೆಕ್ಕು, ಮುಖಪುಟ ಅಥವಾ ನನ್ನ ಚಿತ್ರಗಳನ್ನು ಆಯ್ಕೆಮಾಡದಿದ್ದರೆ ಅದು ನಿದ್ರೆ ಸ್ಕ್ರೀನ್ನಂತೆಯೇ ಇರುತ್ತದೆ.\n\n“ಪ್ರಾರಂಭಿಸುವಾಗ ತೋರಿಸಿ” ಮತ್ತು “ಮರುಪ್ರಾರಂಭಿಸುವಾಗ ತೋರಿಸಿ” ಸಾಧನದ ಸ್ವಂತ ಸ್ಕ್ರೀನ್ಗಳು, ಬೇರೆ ಪ್ಲಗಿನ್ ಸ್ಕ್ರೀನ್ ನೀಡದಿದ್ದರೆ. ಪ್ರಾರಂಭದ ಸ್ಕ್ರೀನ್ ಅನ್ನು ಸಾಧನ ಆಫ್ ಅಥವಾ ಮರುಪ್ರಾರಂಭವಾಗುವಾಗಲೇ ಬಿಡಿಸಿ ಮುಂದಿನ ಪ್ರಾರಂಭದಲ್ಲಿ ತೋರಿಸಲಾಗುತ್ತದೆ. ಸಮಯಕ್ಕೆ ಸಿದ್ಧವಾಗದ ಸ್ಕ್ರೀನ್ ಅಥವಾ ಹಾಳಾದ ಚಿತ್ರದ ಬದಲು ಸಾಧನದ ಸ್ವಂತ ಸ್ಕ್ರೀನ್ ಕಾಣುತ್ತದೆ."
