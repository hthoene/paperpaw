setup.plugin.name = ಸೆಟಪ್
setup.plugin.description = ಮೊದಲ ಪ್ರಾರಂಭದಲ್ಲಿ, ಮುಖ್ಯ ಸೆಟ್ಟಿಂಗ್ಗಳ ಮೂಲಕ ಒಂದು ಕಿರು ಮಾರ್ಗದರ್ಶಿ.
setup.plugin.how = "ಸೆಟಪ್ ಮುಖ್ಯ ಸೆಟ್ಟಿಂಗ್ಗಳ ಮೂಲಕ ಒಂದು ಕಿರು ಮಾರ್ಗದರ್ಶಿ; PaperPaw ಮೊದಲ ಬಾರಿ ಪ್ರಾರಂಭವಾದಾಗ ಒಮ್ಮೆ ತೋರಿಸಲಾಗುತ್ತದೆ. ಪ್ರತಿ ಪುಟ ಒಂದು ವಿಷಯ ಕೇಳುತ್ತದೆ: ಭಾಷೆ, ಬಟನ್ಗಳು, ಪಠ್ಯದ ಗಾತ್ರ, ಸಮಯ ವಲಯ, Wi-Fi ಅಥವಾ ಸೇರಿಸಬೇಕಾದ ಕೆಲವು ಪ್ಲಗಿನ್ಗಳು. ಸೂಕ್ತ ಉತ್ತರ ಮೊದಲೇ ಆಯ್ಕೆಯಾಗಿರುತ್ತದೆ, ಆದ್ದರಿಂದ “ಮುಂದೆ” ಯಾವಾಗಲೂ ಸರಿ. ಈ ಸಾಧನಕ್ಕೆ ಬೇಡದ ಹಂತಗಳನ್ನು ಬಿಡಲಾಗುತ್ತದೆ.\n\nಬಟನ್ಗಳನ್ನು ಟ್ಯಾಪ್ ಮಾಡಿ, ಅಥವಾ ಮೇಲೆ ಮತ್ತು ಕೆಳಗೆ ಬಟನ್ಗಳು ಮತ್ತು “ಆಯ್ಕೆ” ಬಳಸಿ. ಮೊದಲ ಪುಟದಲ್ಲಿ “ಸ್ಕಿಪ್” ಸೆಟಪ್ನಿಂದ ತಕ್ಷಣ ಹೊರಬರುತ್ತದೆ. ಕೊನೆಯ ಪುಟ ನಿಮ್ಮ ಪುಸ್ತಕಗಳು ಎಲ್ಲಿಂದ ಬರುತ್ತವೆ ಎಂದು ತಿಳಿಸುತ್ತದೆ.\n\nಮತ್ತೆ ಚಲಾಯಿಸಲು, ಸೆಟ್ಟಿಂಗ್ಗಳನ್ನು ತೆರೆದು “PaperPaw ಸೆಟಪ್ ಮಾಡಿ” ಆಯ್ಕೆಮಾಡಿ. ಇಲ್ಲಿ ಆಯ್ಕೆಮಾಡಿದ ಎಲ್ಲವನ್ನೂ ನಂತರ ಸೆಟ್ಟಿಂಗ್ಗಳಲ್ಲಿ ಬದಲಿಸಬಹುದು."
