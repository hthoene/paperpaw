reader.plugin.name = Leser
reader.plugin.description = Wys boeke bladsy vir bladsy, met inhoudsopgawe en leesinstellings.
reader.plugin.how = "Die leser wys boeke bladsy vir bladsy. Maak ’n boek uit die biblioteek oop; die laaste boek kan by die begin weer oopmaak (instelling Maak laaste boek by begin oop).\n\nTik links of regs van die skerm, of gebruik die bladsyknoppies, om bladsye om te blaai. Tik die middel of druk Kies vir die leeskieslys: Inhoud, Soek, Gaan na bladsy, Lettertipe en uitleg, Boekmerke en uitligtings en meer. Af van die bokant maak die kitspaneel oop, op van die onderrand gaan tuis; so ook om Terug vas te hou.\n\nHou Kies vas (of hou ’n prent vas) om ’n prent op die volle skerm te sien: Links en Regs stap deur die bladsy se prente. Kies vergroot tot 2x, 3x en weer terug (dubbeltik op raak); vergroot, beweeg Links en Regs sywaarts, die bladsyknoppies (of swieps) beweeg verder oor en af. Terug keer terug na pas, dan na die bladsy (hou vas om te verlaat op raak). Tik die regterbovenhoek vir ’n boekmerk. Hou ’n woord vas om dit uit te lig. Met knoppies, hou Links: Links en Regs beweeg per woord, die bladsyknoppies per reël, om hulle vas te hou gaan na die bladsy se ente en per paragraaf; Kies maak die uitligbalk vir die woord oop, om Kies vas te hou brei dit uit na die sin en die paragraaf (dan beweeg Links en Regs die einde, om hulle vas te hou die begin). ’n Keuse gaan voort oor bladsyomslae heen. Voer uit as Markdown stoor jou notas."
