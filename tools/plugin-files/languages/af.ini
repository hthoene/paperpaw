wifi.plugin.name = Wi-Fi
wifi.plugin.description = Koppel aan Wi-Fi-netwerke wanneer nodig en skakel die radio daarna af.
wifi.plugin.how = "Wi-Fi koppel aan ’n netwerk wanneer ’n inprop die internet nodig het (’n katalogus, ’n sinkronisering, die winkel, ’n oordrag) en skakel die radio weer af ’n minuut nadat niks dit gebruik nie, of dadelik wanneer Tuis of ’n boek wys, om battery en geheue te spaar.\n\nMaak Wi-Fi oop uit Instellings, of uit die Wi-Fi-item in die statusreël. Netwerke lys dié in bereik; kies een en tik sy wagwoord, of kies Stel op met ’n foon en tik die naam en wagwoord in jou foon se blaaier in plaas van op die toestel. Vergeet verwyder ’n gestoorde netwerk.\n\nDie wagwoorde bly op die kaart, veilig bewaar, en word nooit weer gewys nie. Onder Koppel wanneer nodig stel jy hoe lank Wi-Fi aan bly ná sy laaste gebruik, of dit aan bly terwyl dit laai, en watter gestoorde netwerk eerste kom wanneer verskeie in bereik is."
