battery.plugin.name = Batterygebruik
battery.plugin.description = Teken die battery op en wys hoe lank dit hou.
battery.plugin.how = "Batterygebruik noteer die lading ongeveer een keer per minuut terwyl die toestel wakker is, saam met wat dit gedoen het: skermverfrissings en bladsye omgeblaai. Daaruit bereken dit hoeveel ’n uur wakker en 100 bladsye neem, en hoe lank die battery teen daardie pas hou.\n\nMaak Battery oop uit die Gereedskap-kieslys. Dit wys die lading nou, hierdie keer wakker, die gebruik op battery tot dusver en jou onlangse tye wakker. Dit blaai met die bladsyknoppies, of deur op die pyltjies bo te tik.\n\nDit het ’n rukkie lees op battery nodig voordat die syfers iets beteken. Opname is by verstek aan en kan in Instellings, onder Toestel, Krag, as Teken batterygebruik op afgeskakel word."
