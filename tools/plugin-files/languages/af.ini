settings.plugin.name = Instellings
settings.plugin.description = Die instellingsbladsye, gebou uit die instellings van elke inprop.
settings.plugin.how = "Instellings wys alles wat in PaperPaw en sy inproppe gestel kan word, in bladsye. Inproppe het nie ’n eie skerm nodig nie: wat hulle verklaar, verskyn hier, in groepe, met elke instelling se beskrywing daaronder.\n\nMaak dit oop met Instellings in die kieslys. Tik ’n groep om dit oop te maak, dan ’n instelling om dit te skakel of te kies; getalle het − en + knoppies. Met knoppies, beweeg na ’n instelling en druk Kies: links en regs verander ’n getal, Kies behou dit, Terug keer terug na die vorige waarde.\n\nVeranderinge geld dadelik. Soek vind ’n instelling volgens woorde en Gevorderde instellings voeg die selde benodigdes by. Stel terug na verstek en Stel alles terug vra eers."
