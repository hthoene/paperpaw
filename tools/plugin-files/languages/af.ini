keyboard.plugin.name = Sleutelbord
keyboard.plugin.description = Voer teks op die skerm in, met raak of met die knoppies.
keyboard.plugin.how = "Die sleutelbord maak oop wanneer iets teks nodig het: ’n soektog, ’n wagwoord, ’n nota of ’n instelling. Dit werk met raak en met net knoppies.\n\nMet knoppies beweeg links en regs langs ’n ry, die bladsyknoppies beweeg tussen rye, Kies druk ’n sleutel en Terug kanselleer; links en regs gaan in ’n kring om ’n ry, en op en af bly in jou kolom. Shift maak die volgende letter ’n hoofletter; druk dit twee keer vir alle hoofletters, en nog een keer om op te hou. Hou ’n letter vas (met knoppies: hou Kies daarop) vir sy hoofletter, dadelik gekies, en aksente soos é en è; in Duits kom ä, ö, ü en ß so van a, o, u en s (met knoppies sê die sleutelbord dit op daardie letters). OK voltooi; met knoppies, hou Terug om van oral af te voltooi (Terug alleen kanselleer), of hou Kies op ’n sleutel wat nie ’n letter is nie. Plak voeg die knipbordteks in, en Foon, waar aangebied, laat jou eerder op jou foon tik.\n\nIn die instellings onder Toestel, Sleutelbord: Sleutelborduitlegte kies die uitlegte. By verstek volg dit die kieslystaal; met verskeie wissel ’n sleutel tussen hulle. Umlaut-sleutels gee eerder ä-, ö-, ü- en ß-sleutels van hul eie. Grootte maak sleutels en letters groter; met net knoppies bly die rye dié van ’n rekenaarsleutelbord. Op raakskerms verander Sleutelvorm hoe die sleutels lyk. Outomatiese hoofletters begin elke sin met ’n hoofletter."
