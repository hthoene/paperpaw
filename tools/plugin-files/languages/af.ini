reading-goal.plugin.name = Leesdoel
reading-goal.plugin.description = Minute om per dag te lees, en ’n kat op die tuisskerm wie se bui volg hoeveel jy vandag gelees het.
reading-goal.plugin.how = "’n Kat op jou tuisskerm wys hoe vandag se lees gaan: hartseer terwyl jy nog nie gelees het nie, so-so ná ’n bietjie, tevrede vanaf die helfte van jou daaglikse doel, gelukkig sodra jy dit bereik het.\n\nVoeg die widget Leeskat by die tuisskerm (hou die tuisskerm vas, voeg dan ’n widget by), of kies Vandag se leeskat as die slaapskerm. ’n Tik op die kat maak die daaglikse doel oop; dit is die doel van die leesstatistiek, wat die minute tel wat jy lees.\n\nIn die instellings, onder Lees, bepaal Tevrede vanaf en Gelukkig vanaf van watter deel van die doel af die kat tevrede of gelukkig is, en Eie prente ’n gids met prente (sad, meh, content en happy) om in plaas van die katte te wys. Die prente is PNG- of JPEG-lêers; sonder ’n gids verskyn die katte."
