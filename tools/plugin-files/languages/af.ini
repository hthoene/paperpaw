notes-overview.plugin.description = Die boekmerke en uitligtings van alle boeke in een lys, en ’n uitvoer as My Clippings.txt.
notes-overview.plugin.how = "Alle notas lys elke boek waarin jy ’n boekmerk of ’n uitligting gemaak het, met hoeveel. Maak dit oop onder Gereedskap. Kies ’n boek om sy notas te sien, en ’n nota om die boek by daardie plek oop te maak.\n\nAan die einde van die lys skryf Voer uit as My Clippings.txt al die notas na een lêer, in die gids Exports langs die biblioteek, in die vorm wat ’n Kindle gebruik (UTF-8). Toepassings wat ’n Kindle se My Clippings.txt lees, kan dit lees. ’n Nota by ’n uitligting is ’n inskrywing van sy eie, soos op ’n Kindle. Omdat ’n boek hier geen Kindle-liggings het nie, is “location” hoe ver in die boek die nota is, in persent. Die lêer word elke keer weer geskryf; dit vervang die vorige een."
