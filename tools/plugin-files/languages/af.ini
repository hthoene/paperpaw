notes-vault.plugin.name = Notaskluis
notes-vault.plugin.description = Lees ’n gids Markdown-notas volgens gidse, etikette en jongste veranderinge, met widgets vir die tuisskerm. Werk met Obsidian-kluise.
notes-vault.plugin.how = "Notaskluis lees ’n gids Markdown-notas (gewone .md-lêers, soos notatoepassings dit hou). Dit werk met Obsidian-kluise.\n\nKies die kluis se gids in die instellings, of op die kluis se bladsy onder die gereedskap. Die bladsy bied dan die gidse soos hulle op die kaart is, die laaste veranderde notas, die etikette, en ’n soektog in die notas se titels.\n\nDie eerste keer word die kluis in die agtergrond geïndekseer terwyl sy bladsy oop is; ’n kluis van duisende notas neem ’n paar minute, en maak dan dadelik oop. Die indeks word op die kaart bewaar en weer gemaak wanneer die kluis se bladsy ná ’n paar uur oopgemaak word, of wanneer jy Dateer op kies.\n\n’n Nota maak in die leser oop. Skakels na ander notas ([[Nota]], [[Nota|woorde]], [[Nota#Opskrif]]) word deur die nota se naam êrens in die kluis gevind; om een te volg, maak daardie nota oop, en Terug keer terug na die nota daarvoor.\n\nNiks in die kluis word ooit verander nie. Die widgets vir die tuisskerm (onlangse notas, ’n vasgespelde nota, ’n nota van die dag, ’n lukrake nota, etikette, soek) word in die tuisskerm se redigeerder bygevoeg. ’n Widget kan sy notas uit net een gids neem: skryf die gids se pad vanaf die kaart se wortel (byvoorbeeld Notas/Werk) in die widget se instellings; as dit leeg gelaat word, neem dit al die kluis se notas."
