picture-home.plugin.name = Prent-tuisskerm
picture-home.plugin.description = ’n Tuisskerm met jou eie prent agter die widgets, en ’n statusbalk wat jy instel.
picture-home.plugin.how = "Prent-tuisskerm vervang die tuisskerm solank dit aan is: jou eie prent agter die widgets, en die bladsye widgets en gereedskap wat jy rangskik. Skakel dit af in die inpropbestuurder en die ingeboude tuisskerm is terug, met sy eie bladsye.\n\nPlaas prente (JPEG, PNG of GIF) in ’n gids op die kaart (wallpapers by verstek), kies dan een in Instellings, Pasmaak, Prent-tuisskerm. Aanpassing sê hoe dit die skerm vul (vul, hele prent, rek, oorspronklike grootte, teël), Posisie watter deel bly, Vergroting hoe groot, en Maak prent ligter hoe bleek: ’n blekere prent maak die widgets makliker leesbaar. Die prent word een keer vir elke skermgrootte voorberei, wat ’n oomblik neem.\n\nWidgets sit op plate oor die prent. Rangskik die bladsy soos op die ingeboude tuisskerm: die potlood onder die bladsy, of Wysig tuisskerm in die kieslys.\n\nDie statusbalk (tyd, Wi-Fi, battery, of wat jy kies) kan aan, af of outomaties wees, bo of onder, vol breedte of ’n klein pil links, in die middel of regs, op ’n ligte, donker of grys plaat of op die prent self. Die ry wat die knoppies noem (op die X4) kan ook aan, af of outomaties wees. Outomaties beteken ’n knoppiedruk wys hulle vir ’n paar sekondes; daardie druk doen niks anders nie.\n\nPrentvertoning sê hoe die prent geteken word: Grysvlakke in elke grys wat die skerm het (stadiger op die X4), Gerasteer in swart-en-wit kolletjies (vinnig), of Outomaties, soos die ingeboude tuisskerm dit doen: grysvlakke wanneer die skerm geteken word, kolletjies ná die eerste verandering. Waar ’n skerm geen grysvlakke het nie, val grysvlakke terug op kolletjies."
