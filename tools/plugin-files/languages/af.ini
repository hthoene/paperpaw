lock.plugin.name = Skermslot
lock.plugin.description = ’n PIN, ’n patroon of ’n wagwoord wanneer die toestel wakker word; raak gesluit tydens lees.
lock.plugin.how = "Die skermslot vra vir ’n PIN, ’n patroon of ’n wagwoord wanneer PaperPaw begin en wanneer die toestel wakker word. Dit is eers af. Dit keer net terloopse gebruik: die kode en die telling van verkeerde pogings word op die SD-kaart bewaar, so wie die kaart uithaal, wysig of omruil, kom verby die slot.\n\nStel dit in die instellings, onder Toestel, Skermslot: voer die kode in gebruik in as daar een is, kies die soort, dan die nuwe kode twee keer. ’n Patroon word net op raakskerms aangebied.\n\nNa vyf verkeerde pogings wag die volgende ’n halfminuut. Sluit nou sluit dadelik en kan op ’n knoppie, ’n gebaar of ’n reël gesit word. Sluit ná wakker word kan afgeskakel word, sodat net ’n ware begin (aanskakel of herbegin) sluit, behalwe waar elke wakker word ’n begin is, soos op die X4 op battery.\n\nRaakslot, daarnaas: Sluit raak in die kitspaneel en die leeskieslys maak dat tikke, swieps en die pen niks doen nie terwyl die knoppies steeds werk, bv. om met ’n hand op die skerm te lees. Om te ontsluit, tik twee keer met een vinger en hou dit ’n oomblik af; as jy die aan/af-knoppie vashou, maak dit die Aan/af-kieslys oop, waar Ontsluit raak dit met die knoppies doen; op die X4 Pro ontsluit die tuissleutel wat vasgehou word, dadelik."
