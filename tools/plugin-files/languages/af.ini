anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Leer die verskuldigde kaarte van Anki op jou rekenaar en stuur jou antwoorde terug, deur die AnkiConnect-byvoegsel.
anki.plugin.how = "Anki laat jou die kaarte wat in Anki op jou rekenaar verskuldig is, op die leser leer, en stuur jou antwoorde terug. Dit gebruik die vrye byvoegsel AnkiConnect (byvoegselkode 2055492159) en nooit AnkiWeb nie. Dit is eers af: voeg dit uit die Inpropwinkel by.\n\nOp die rekenaar: installeer AnkiConnect in Anki (Gereedskap, Byvoegsels, Kry byvoegsels) en herbegin Anki. Anki moet oop wees terwyl jy sinkroniseer.\n\nStandaard antwoord AnkiConnect net die rekenaar waarop dit loop (127.0.0.1), so die leser kan dit nie bereik nie. Maak Gereedskap, Byvoegsels, AnkiConnect, Config oop en stel “webBindAddress” op “0.0.0.0” (luister op die tuisnetwerk). Die poort, “webBindPort”, is 8765 tensy jy dit verander. As jy daar ’n “apiKey” stel, voer dieselfde sleutel hier in. Herbegin Anki ná die verandering van die konfigurasie, en laat Anki deur die rekenaar se firewall toe as dit vra. Gebruik dit net op ’n netwerk wat jy vertrou: enigiemand daarop kan AnkiConnect bereik, so ’n sleutel is ’n goeie idee.\n\nOp die leser: maak Anki oop onder Gereedskap, voer dan die rekenaar se adres (byvoorbeeld 192.168.1.20) onder Rekenaar in, die poort as dit nie 8765 is nie, en die API-sleutel as jy een gestel het. Kies ’n Stapel, of los dit leeg vir alle stapels. Kies dan Sinkroniseer met Anki, met Wi-Fi aan: jou wagende antwoorde word eers gestuur, dan word die kaarte wat verskuldig is (en die aantal nuwe kaarte wat jy gestel het) gehaal, hoogstens 50. Kies Leer om daardeur te gaan, sonder ’n netwerk: wys die antwoord en gradeer dit Weer, Moeilik, Goed of Maklik. Jou antwoorde word op die leser bewaar, ook sonder Wi-Fi, en gaan met die volgende sinkronisering na Anki. Anki besluit wanneer ’n kaart terugkom: ’n kaart wat jy met Weer beantwoord het, word by ’n latere sinkronisering weer gehaal sodra Anki sê dit is verskuldig.\n\nSinkroniseer wanneer Anki oopmaak, in die instellings, sinkroniseer elke keer as jy die skerm oopmaak. Niks gebruik die netwerk wanneer jy ’n knoppie druk nie."
