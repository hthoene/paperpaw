koreader.plugin.how = "Hierdie inprop deel boekmerke en uitligtings met KOReader vir boeke wat jy in albei lees, op een toestel of in ’n biblioteekgids wat tussen toestelle gesinkroniseer word. Daar is niks om op te stel nie.\n\nWanneer PaperPaw ’n boek oopmaak wat KOReader ook oopgemaak het, en wanneer jy sy boekmerke of uitligtings verander, neem dit oor wat nuut is uit KOReader se data langs die boek en laat wat hier nuut is vir KOReader om op te tel die volgende keer wat dit die boek oopmaak. Verwyderde merke en veranderde notas gaan ook oor.\n\nDit werk net vir EPUB-boeke. As een kant se lêer nie gelees kan word nie, verander niks aan enige kant totdat dit kan nie."
