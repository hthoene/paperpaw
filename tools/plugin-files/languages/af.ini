puzzles.plugin.name = Raaisels
puzzles.plugin.description = Sudoku, kruiswoordraaisels en skaakraaisels, aflyn, met ’n raaisel van die dag.
puzzles.plugin.how = "Raaisels vir die trein en die wagkamer, alles aflyn: sudoku, kruiswoordraaisels en skaakraaisels. Maak Raaisels oop uit die gereedskapkieslys, of voeg die widget Raaisel van die dag by die tuisskerm (hou die tuisskerm vas, voeg dan ’n widget by): dit wys hoe ver vandag se sudoku is, en ’n tik maak dit oop. Die sudoku van die dag is die hele dag dieselfde.\n\nSudoku: links en regs beweeg die wyser blokkie vir blokkie, op en af (die bladsyknoppies) een ry. Kies maak die syfers oop: kies een en kies weer om dit in te sit, of Vee uit om die blokkie leeg te maak. Hou Kies (of Kieslys) om by die knoppies onder die bord uit te kom: Notas verander die syfers in potloodmerke, Kontroleer merk verkeerde blokkies, Ontdoen neem die laaste skuif terug, Nuut begin ’n raaisel van die vlak wat jy kies (Maklik, Middel, Moeilik). Elke raaisel het presies een oplossing. Die speletjie word bewaar wanneer jy wegloop. Op ’n raakskerm tik ’n blokkie.\n\nKruiswoordraaisels: plaas .puz- (Across Lite) of .ipuz-lêers in die gids “puzzles” op die geheuekaart; geeneen is ingesluit nie. Beweeg op die rooster, kies dan om die woord onder die wyser op die sleutelbord in te tik (’n onderstreep laat ’n blokkie leeg). Die knoppies wissel tussen horisontaal en vertikaal, wys die lys leidrade, kontroleer die letters en onthul die woord. Die letters word vir elke lêer bewaar. Geskommelde .puz-lêers kan nie oopgemaak word nie.\n\nSkaakraaisels: ’n klein stel uit die Lichess-raaiseldatabasis (CC0). Links en regs spring van stuk na stuk, kies die stuk wat jy wil skuif, dan links en regs deur waarheen dit mag gaan, en kies weer. ’n Verkeerde skuif word teruggeneem. Wenk merk die stuk wat moet skuif, Volgende gaan na die volgende raaisel.\n\nDie bord teken net die blokkies oor wat verander. Statistiek tel die raaisels wat jy opgelos het."
