dictionary.plugin.name = Woordeboek
dictionary.plugin.description = Slaan woorde in StarDict-woordeboeke op.
dictionary.plugin.how = "Die woordeboek slaan ’n woord uit ’n boek in StarDict-woordeboeke op en wys die definisies in ’n paneel oor die onderste deel van die skerm.\n\nHou in die leser ’n woord vas en kies Slaan op; met knoppies, gebruik Kies teks onder Meer. Kopieer die woordeboekgidse (met .ifo-, .idx- en .dict-lêers) na die gids “dictionaries” op die toestel, subgidse ingesluit, of kies ’n ander gids in Instellings, onder Lees, as Woordeboekgids (’n gevorderde instelling). Die eerste opsoek berei ’n klein indeks vir elke woordeboek voor, wat ’n oomblik neem.\n\nIn die paneel rol die bladsyknoppies of Op en Af lang definisies, en Terug maak dit toe. Met raak, tik daarbuite om toe te maak."
