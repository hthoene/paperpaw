pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = ’n Fokus-afteller met werk- en pouserondtes, widgets en ’n daaglikse telling.
pomodoro.plugin.how = "’n Pomodoro-afteller: werk in gefokusde rondtes, rus dan. Dit het geen opstelling nodig nie: 25 minute fokus, 5 rus, en ná vier rondtes ’n lang pouse van 15.\n\nMaak Pomodoro oop uit die gereedskapkieslys en druk Begin, of voeg sy widgets by die tuisskerm (hou die tuisskerm vas, voeg dan ’n widget by): Pomodoro-afteller wys die fase en die minute oor, Pomodoro begin/pouseer is ’n knoppie, en Pomodoro vandag tel die rondtes wat jy klaargemaak het, met jou daaglikse doel. ’n Tik op die afteller begin of pouseer dit; hou dit vas om die volle skerm oop te maak.\n\nDie afteller bly loop wanneer jy die skerm verlaat, en gaan ná ’n herbegin volgens die horlosie voort. Terwyl die leser slaap, loop niks nie: ’n fase wat intussen geëindig het, word gemeld wanneer dit wakker word. ’n Kennisgewing sê vir jou wanneer ’n fase verby is. Om battery te spaar, werk die horlosie net een keer per minuut by (elke tien sekondes in die laaste minuut op die volle skerm) en hou die leser nooit wakker nie.\n\nOnder Pomodoro in die instellings stel jy die lengtes en die rondtes van ’n stel, en of die volgende fase vanself begin. Onder Meer: ’n flits van die skerm of ’n flikkering van die voorlig wanneer ’n fase eindig en ’n daaglikse doel."
