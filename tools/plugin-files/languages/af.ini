power.plugin.name = Krag
power.plugin.description = Kies die kragmodus, met die hand of volgens die battery: Normaal, Spaar, Aflyn.
power.plugin.how = "Krag kies hoe PaperPaw die battery bestee: Normaal, Spaar of Aflyn. Spaar doen wat kan wag op beter oomblikke; Aflyn hou die radio af. Outo kies volgens die battery.\n\nVerander die modus in die kitspaneel, waar Krag die modusse langs mekaar wys, of in Instellings onder Krag. Daar stel jy ook die vlakke waar Outo na Spaar en na Aflyn oorskakel, en of dit Normaal bly terwyl dit laai.\n\nIn die statusreëls wys Kragmodus ’n blaar terwyl dit spaar en ’n deurgekrapte Wi-Fi terwyl dit aflyn is, en niks in Normaal nie.\n\nHou die aan/af-knoppie vas om ’n klein kieslys oop te maak: Slaap, Skakel af (waar PaperPaw kan), Herbegin, en op raaktoestelle Sluit raak of Ontsluit raak. ’n Kort druk sit die toestel steeds aan die slaap. Terug verlaat die kieslys."
