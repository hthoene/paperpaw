fonts-browser.plugin.name = Meer lettertipes
fonts-browser.plugin.description = Wys lettertipes van die internet, elk met ’n voorbeeld, en laai hulle af om mee te lees.
fonts-browser.plugin.how = "Meer lettertipes lys lettertipes uit ’n lettertipebiblioteek op die internet, elke naam in sy eie lettertipe gestel, en laai dié af wat jy wil gebruik om mee te lees.\n\nJy vind dit aan die einde van die lys lettertipes waar die leeslettertipe gekies word, in Instellings, onder Lees, as Lettertipe; die statusreëls het dieselfde inskrywing vir hul lettertipe. Tik ’n lettertipe (met knoppies, druk Kies) om dit groter met ’n voorbeeldsin te sien, kies dan Laai af. Jy kan die bladsy verlaat terwyl dit aflaai. Wanneer dit klaar is, kies Lees met (die lettertipe se naam), of Gebruik vir die statusreëls. Opdateer haal ’n nuwer weergawe, Verwyder vee die lettertipe van die toestel uit.\n\nDit het Wi-Fi nodig.\n\nJOU EIE LETTERTIPES\n\nSaam met Meer lettertipes het dieselfde lys Jou eie lettertipes, wat hierdie deel van die hulp wys. ’n Eie lettertipe is ’n .ttf- of .otf-lêer, byvoorbeeld van Google Fonts.\n\nOp Android en ander toestelle wat lettertipelêers teken: kopieer die lêer na die gids fonts (op Android: PaperPaw/fonts in die gedeelde berging), herbegin PaperPaw en kies die lettertipe in Instellings, onder Lees, as Lettertipe.\n\nOp die Xteink X4 en X4 Pro: hierdie lesers lees lettertipepakkette, nie lettertipelêers nie, omdat lettertipelêers nie in hul geheue sou pas nie. Maak ’n pakket op ’n rekenaar met paperpaw-fontgen, vir elke styl wat jy het (gewoon is nodig):\n\npaperpaw-fontgen --family \"My Lettertipe\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nDit maak die gids plugins/font-my-lettertipe. Kopieer dit na die gids plugins op die geheuekaart, herbegin, en kies My Lettertipe as Lettertipe. ’n Pakket van een styl is ongeveer ’n halwe megagreep vir Latynse letters; style wat jy weglaat, word in die gewone een geteken. Die hulpmiddel sê hoeveel van die letters wat jy vra die lettertipe het (--chars latin,cyrillic,greek voeg skrifte by): ’n lettertipe sonder die letters van jou boek kan hulle nie wys nie, so soek een wat sy skrif dek.\n\nLettertipes uit Meer lettertipes werk op dieselfde manier en het geen rekenaar nodig nie.\n\nVir skerper klein teks op die e-ink-paneel, voeg --hinting light by die opdrag: dit pas die letters by die pixelrooster aan, soos die verstek-lettertipes gemaak is. Daarsonder word die letters geteken soos die lettertipe dit ontwerp het; --hinting normal en --hinting mono pas hulle sterker aan. Lettertipes met merke, soos Arabies of Devanagari, word die beste daarsonder gelaat."
