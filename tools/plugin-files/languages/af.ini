file-manager.plugin.name = Lêerbestuurder
file-manager.plugin.description = Elke gids en lêer op die toestel: maak oop, hernoem, skuif, kopieer en vee uit.
file-manager.plugin.how = "Die lêerbestuurder wys elke gids en lêer op die toestel se berging, nie net jou boeke nie, en laat jou hulle oopmaak, hernoem, skuif, kopieer en uitvee en nuwe gidse maak.\n\nMaak Lêers oop uit die Gereedskap-kieslys. Tik ’n gids om daarin te gaan; Terug gaan na die gids bo. Tik ’n lêer, of hou enige inskrywing vas (met knoppies, hou Kies), om te sien wat daarmee gedoen kan word. Skuif en Kopieer kies die inskrywing: gaan na die gids waarin dit hoort en kies Plak hier in die balk onder. Met knoppies, druk Af vanaf die laaste inskrywing om by die balk uit te kom.\n\nLêers en gidse wat met ’n punt begin, soos PaperPaw se eie data, is versteek. Om hulle te sien, skakel Versteekte lêers aan in Instellings, onder Biblioteek."
