menu-editor.plugin.name = Kieslysredigeerder
menu-editor.plugin.description = Herrangskik, verwyder en voeg inskrywings van elke kieslys by.
menu-editor.plugin.how = "Die kieslysredigeerder verander wat die kieslyste bevat: skuif inskrywings op of af, verwyder hulle, of voeg nuwes by.\n\nVind dit in Instellings onder Pasmaak, as Pasmaak kieslyste. Kies ’n kieslys, dan ’n inskrywing om dit te skuif of te verwyder; Voeg ’n inskrywing by plaas ’n nuwe een in. Veranderinge geld dadelik. Stel hierdie kieslys terug gee ’n kieslys terug soos sy inproppe dit definieer, Stel alle kieslyste terug doen dit vir elkeen.\n\nJy kan jouself nie uitsluit nie: ’n inskrywing wat die pad na die instellings is, bly totdat jy ’n ander pad daarheen byvoeg."
