keys.plugin.name = Knoppies en gebare
keys.plugin.description = Wat elke knoppie, tiksone en swiep doen, op die toestel verander.
keys.plugin.how = "Knoppies en gebare wys wat elke knoppie, tiksone en swiep doen, en laat jou dit op die toestel verander.\n\nMaak dit in die instellings oop, onder Toestel. Kies eers waar ’n verandering geld: Oral, Tydens lees, Op die tuisskerm, In die biblioteek of in een stuk gereedskap. Kies dan ’n invoer, soos ’n vasgehoue knoppie of ’n swiep van ’n rand af in, en kies ’n aksie uit die lys, wat jy kan deursoek. Standaard gee terug wat die inproppe en die knoppie-uitleg stel.\n\nOp die X4 word ’n verandering geweier wat geen knoppie sou laat om mee te kies, terug te gaan of voort te beweeg nie. Stel knoppies en gebare terug aan die einde neem elke verandering terug."
