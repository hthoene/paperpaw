format-cbz.plugin.name = Strokiesprente
format-cbz.plugin.description = Maak strokiesprentargiewe (.cbz) oop, een prent per bladsy.
format-cbz.plugin.how = "Maak strokiesprentargiewe (.cbz) oop: een prent per bladsy, by die skerm aangepas, in die volgorde van hul name (2 voor 10).\n\nPlaas hulle in die biblioteekgids en maak hulle uit die biblioteek oop; blaai om soos in enige boek. Groot prente neem die eerste keer ’n oomblik, op die X4 meer as elders.\n\nLeesinstellings (Instellings, Lees): “Paneel vir paneel” wys een paneel van ’n bladsy op ’n slag, so groot as wat die skerm toelaat, en die bladsyomslae stap daardeur; ’n bladsy sonder panele word heel gewys. “Strokiesprentbladsye loop” spieël die bladsyomslae vir manga (regs na links); die boek se eie ComicInfo.xml sê dit vanself. Die biblioteek wys ’n boek se titel en sy reeks en nommer uit ComicInfo.xml."
format-cbz.title = Strokiesprent (CBZ)
format-cbz.setting.direction = Strokiesprentbladsye loop
format-cbz.setting.direction.help = Manga: die bladsyomslae word gespieël.
format-cbz.direction.book = Soos die boek sê
format-cbz.direction.ltr = Links na regs
format-cbz.direction.rtl = Regs na links
format-cbz.setting.panels = Paneel vir paneel
format-cbz.setting.panels.help = Een paneel op ’n slag, bladsyomslae stap daardeur.
format-docx.plugin.name = DOCX-dokumente
format-docx.plugin.description = Maak .docx-lêers oop, soos Word en ander programme dit stoor.
format-docx.plugin.how = "Maak .docx-dokumente as boeke oop: opskrifte met ’n inhoudsopgawe, lyste, tabelle, vet en kursief, skakels en prente (JPEG, PNG, GIF).\n\nPlaas die lêers in die biblioteekgids en maak hulle uit die biblioteek oop. Die titel en skrywer kom uit die dokument se eienskappe. Voetnotas, kop- en voetstukke, en kommentaar word nie gewys nie."
format-docx.title = DOCX-dokument
format-epub.plugin.name = EPUB
format-epub.plugin.description = Maak EPUB-boeke oop met hul style, inhoudsopgawe en beelde.
format-epub.plugin.how = "EPUB-boeke maak soos enige ander boek uit die biblioteek oop, met hul inhoudsopgawe, beelde en die uitgewer se styling. Webbladsye (HTML), Markdown, FictionBook (.fb2) en strokiesprentargiewe (.cbz) maak op dieselfde manier oop, elk as ’n inprop van sy eie.\n\n’n Hoofstuk word die eerste keer wanneer jy dit oopmaak omgeskakel en in die inprop se kas bewaar, so dit is daarna vinniger en groot boeke werk op klein toestelle. Vind die inhoudsopgawe onder Inhoud in die leeskieslys. Of die boek se eie styling geld, is die instelling Uitgewer se formatering, onder Lees."
format-epub.title = EPUB-e-boek
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Maak FictionBook-boeke oop (.fb2, ook as zip-lêer).
format-fb2.plugin.how = "Maak FictionBook-boeke (.fb2) oop, algemeen vir Russiese en ander boeke, ook as zip-lêer (.fb2.zip), met hul titel, skrywers, omslag en hoofstukke.\n\nPlaas hulle in die biblioteekgids; hulle verskyn in die biblioteek en maak soos enige ander boek oop."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Maak webbladsye oop wat as lêers gestoor is, en wys net wat gelees moet word.
format-html.plugin.how = "Maak webbladsye wat as lêers gestoor is (.html, .htm, .xhtml) as boeke oop: net wat daar is om te lees, sonder kieslyste, advertensies en dergelike daarom heen.\n\nPlaas die lêer in die biblioteekgids en maak dit soos enige boek uit die biblioteek oop. Skakels binne die bladsy werk; prente verskyn waar hulle in die lêer is."
format-html.title = Webbladsy (HTML)
format-images.plugin.name = Prente
format-images.plugin.description = Maak prente (.jpg, .png, .gif) as boeke oop, een bladsy elk.
format-images.plugin.how = "Prente (.jpg, .png, .gif) maak soos boeke uit die biblioteek oop, een prent per bladsy, by die skerm aangepas.\n\nOm ’n hele gids prente te lees, maak sy eerste prent oop: die prente daarna in die gids volg, in die volgorde van hul name (2 voor 10). ’n Latere prent begin daar; die plek in elkeen word apart onthou. ’n Gids van tot 300 prente word gelees vanaf die een wat jy oopmaak.\n\n’n Lêer wat nie ’n prent is nie, of te groot is, wys in plaas daarvan sy naam. Vir ’n boek van baie prente met sy eie titel is ’n strokiesprentargief (.cbz) die beter vorm."
format-images.title = Prent
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Maak Markdown-lêers (.md) oop, bv. notas.
format-markdown.plugin.how = "Maak Markdown-lêers (.md), soos notas, as boeke oop: opskrifte, lyste, aanhalings en beklemtoning soos dit bedoel is, nie as leestekens nie.\n\nPlaas die lêers in die biblioteekgids en maak hulle uit die biblioteek oop. Die eerste opskrif is sy titel; prente langs die lêer verskyn waar die teks hulle noem."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI-boeke
format-mobi.plugin.description = Maak .mobi- en .azw-lêers sonder DRM oop.
format-mobi.plugin.how = "MOBI-boeke (.mobi, .azw) maak soos enige boek uit die biblioteek oop, met niks om op te stel nie. Die titel, skrywers, taal en omslag kom uit die boek, en die inhoudslys word uit sy opskrifte gemaak.\n\nDie boek word die eerste keer wanneer jy dit oopmaak omgeskakel, wat ’n paar sekondes neem vir ’n lang een; daarna maak dit dadelik oop. Teks, opskrifte, vet en kursief, skakels en prente word gewys.\n\nBoeke met DRM (die meeste boeke wat by ’n winkel gekoop is) kan nie oopgemaak word nie, ook nie boeke met Huffman-kompressie of in die nuwer KF8-vorm (.azw3) nie: PaperPaw sê so wanneer jy hulle oopmaak. ’n Kopie as EPUB, gemaak met ’n hulpmiddel soos Calibre, maak altyd oop."
format-mobi.title = MOBI-boeke
format-rtf.plugin.name = RTF-dokumente
format-rtf.plugin.description = Maak .rtf-lêers as boeke oop.
format-rtf.title = RTF-dokumente
format-txt.plugin.name = Gewone teks
format-txt.plugin.description = Maak gewone tekslêers (.txt) oop.
format-txt.plugin.how = "Gewone tekslêers (.txt) maak soos enige boek uit die biblioteek oop, met niks om op te stel nie. Die inprop lees UTF-8-, UTF-16- en Windows-1252-teks en vind die enkodering self.\n\nParagrawe volg die leë reëls in die lêer; as ’n lêer geen het nie, is elke reël ’n paragraaf. In Project Gutenberg-lêers word die lisensieteks aan die begin en die einde weggelaat, en die titel en skrywer word uit die kopstuk geneem.\n\nDie lêer word nooit heeltemal gelaai nie, so baie groot tekste maak ook op klein toestelle oop."
format-txt.title = Gewone teks
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Maak XTC- en XTCH-boeke oop, die vooraf-getekende bladsye van die Xteink-lesers.
format-xtc.plugin.how = "XTC- en XTCH-lêers is boeke waarvan die bladsye reeds as prente getoon word, soos deur omskakelaars vir die Xteink-lesers gemaak. Hulle maak soos enige boek uit die biblioteek oop.\n\nOmdat elke bladsy ’n vaste prent is, kan die teks nie vergroot of in ’n ander lettertipe gestel word nie. Bladsye is swart-en-wit of het vier grystone. Elke bladsy word gedekodeer wanneer dit gewys word, so min geheue is nodig, ook op die X4.\n\nTitel, skrywer en hoofstukke word uit die lêer geneem as dit hulle het."
format-xtc.title = XTC-bladsye
help.plugin.name = Wenke
help.plugin.description = Wys die eerste keer wat ’n skerm oopmaak wat sy kontroles doen.
help.plugin.how = "Die eerste keer wat ’n skerm oopmaak, sê ’n kort nota daaroor wat sy kontroles doen: die dele van die skerm waarheen ’n tik gaan, omraam, en wat die knoppies doen.\n\n’n Tik of enige knoppie maak die nota toe, en dit kom nie weer vir daardie skerm nie. Geen wenke meer nie skakel almal af.\n\nIn die instellings, onder Stelsel, skakel Wenke hulle aan of af, en Wys wenke weer laat elke skerm se nota nog een keer wys."
help.title = Hoe dit hier werk
