opds.plugin.name = OPDS-katalogusse
opds.plugin.description = Blaai deur OPDS-katalogusse, laai hul boeke af en hou gidse daarmee gesinkroniseer.
opds.plugin.how = "OPDS-katalogusse is aanlyn biblioteke soos Project Gutenberg, Calibre-Web, Kavita of Komga. Hierdie inprop blaai deur hulle en deursoek hulle soos gidse en laai hul boeke in die biblioteek af.\n\nMaak Katalogusse oop uit die Gereedskap-kieslys en kies Voeg katalogus by: ’n adres en, as die katalogus ’n rekening nodig het, ’n gebruikernaam en wagwoord. Tik ’n katalogus om deur dit te blaai; hou dit vas (met knoppies, hou Kies) om dit te sinkroniseer, te wysig of te verwyder.\n\nMet Sinkroniseer hierdie katalogus aangeskakel, laai Sinkroniseer katalogusse sy nuwe boeke in sy gids af. Boeke per sinkronisering beperk hoeveel een sinkronisering haal, sodat ’n groot katalogus nie die toestel vol maak nie. ’n Wolkgids (WebDAV) werk in die plek van ’n katalogus."
