bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Koppel afstandbeheers, sleutelborde en sensors, en verbind hulle.
bluetooth.plugin.how = "Bluetooth koppel afstandbeheers, sleutelborde en sensors aan die leser, waar dit Bluetooth het (die X4 Pro).\n\nVoeg ’n toestel by soek na wat in bereik is; sit die toestel eers in koppelmodus. Kies dit, en bevestig op die leser (vergelyk die nommer waar een verskyn). ’n Afstandbeheer of sleutelbord se sleutels blaai dan bladsye om en beweeg deur kieslyste; verander wat elke sleutel doen onder Bediening.\n\nAfstandbeheers sê wanneer hul sleutels werk: wanneer hier aangeskakel, tydens lees (gekoppel terwyl ’n boek oop is, spaar battery), of altyd. Die kieslysknoppie of ’n lang druk op ’n toestel vergeet dit.\n\n’n Sensor is vir inproppe: skakel aan watter inprop dit mag gebruik. Bluetooth is af wanneer niks dit gebruik nie."
