tasks.plugin.name = Take
tasks.plugin.description = Takelyste met sperdatums en prioriteite, op die leser of gesinkroniseer met jou CalDAV-bediener, met tuisskerm-widgets.
tasks.plugin.how = "Takelyste op jou leser: take met ’n sperdatum en ’n prioriteit, afgemerk wanneer hulle klaar is. Hulle werk sonder opstelling en sonder ’n netwerk, en kan met ’n CalDAV-bediener gelyk gehou word (Nextcloud, Radicale, Baïkal, Fastmail en ander), sodat dieselfde lyste op jou foon en jou rekenaar is.\n\nMaak Take oop uit die gereedskapkieslys. Die eerste ry noem die lys wat gewys word; kies dit vir ’n ander lys, vir Vandag en agterstallig oor alle lyste, vir ’n nuwe lys, om te sinkroniseer, of om die rekening te stel. Voeg ’n taak by maak die sleutelbord oop. Kies by ’n taak merk dit af (weer: nie klaar). Hou ’n taak vas of druk Kieslys om sy titel, sy sperdatum (vandag, môre, oor ’n week, of ’n datum wat jy tik soos 2026-12-24) of sy prioriteit te verander, of om dit te verwyder. Oop take kom eerste, volgens hul dag en dan volgens prioriteit; klaar take bly ’n week aan die einde (gestel onder Take in die instellings), dan verlaat hulle die leser.\n\nWidgets vir die tuisskerm (hou die tuisskerm vas, voeg dan ’n widget by): Take vandag wys wat vandag verskuldig of agterstallig is, Takelys wys een lys, Oop take tel hulle, en Volgende taak wys die een om volgende te doen. ’n Tik op ’n taak in ’n widget merk dit af; ’n tik op ’n opskrif maak die lyste oop.\n\nOm te sinkroniseer, kies CalDAV-rekening uit die lysry en voer die bediener se adres, jou gebruikernaam en ’n wagwoord (verkieslik ’n toepassingswagwoord) in. Die bediener se adres is genoeg, bv. cloud.example.com/remote.php/dav; die leser vind jou takelyste daarvandaan. Elke takelys van die bediener word ’n lys op die leser. Die leser sinkroniseer wanneer jy Take oopmaak, wanneer jy Sinkroniseer nou kies, en wanneer die netwerk in elk geval aan is; wat jy sonder ’n netwerk verander, wag en word later gestuur. As ’n taak intussen op die leser en êrens anders verander is, word die bediener se weergawe geneem en joune word as ’n nuwe taak daarnaas behou, so niks gaan verlore nie. Notas, alarms en alles anders wat ’n taak op die bediener het, bly soos dit is. Take wat herhaal, word gewys maar verander waar jy dit gemaak het. Die leser hou tot 200 take in 12 lyste."
