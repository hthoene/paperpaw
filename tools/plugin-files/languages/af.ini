news.plugin.name = Nuus
news.plugin.description = Haal nuusvoere (RSS, Atom) as boeke om te lees.
news.plugin.how = "Nuus maak RSS- of Atom-voere boeke. Elke voer word een boek in die Nuus-gids van die biblioteek, met sy nuutste artikels as gewone teks, om soos enige ander boek te lees.\n\nMaak Nuus oop uit die Gereedskap-kieslys en kies Voeg ’n voer by; sy adres is op die webwerf van die koerant of blog. Haal die nuus haal alle voere en vervang die vorige boeke. Hou ’n voer vas (met knoppies, hou Kies) om dit alleen te haal of te verwyder. ’n Voer wat verwyder is, laat sy boek in die biblioteek.\n\nHaal het ’n netwerk nodig. Artikels per voer (Instellings, Biblioteek) stel hoeveel artikels elke boek bevat. Die Nuusopskrifte-widget wys hulle op die tuisskerm."
