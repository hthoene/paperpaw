rules.plugin.name = Reëls
rules.plugin.description = Wanneer iets gebeur, doen iets: bv. nagmodus om 22:00.
rules.plugin.how = "’n Reël doen vanself iets wanneer iets gebeur: nagmodus elke dag om 22:00 aan, of die katalogusse gesinkroniseer wanneer PaperPaw begin.\n\nReëls is in Instellings onder Pasmaak, as Reëls. Voeg reël by vra Wanneer? (PaperPaw begin, ’n tyd van die dag, ’n boek oopgemaak of toegemaak, die battery, laai, ’n skakelaar en meer) en Wat dan? (voer ’n aksie uit, skakel ’n skakelaar aan of af, stel ’n getal, wys ’n boodskap). Tik ’n reël om dit te pouseer; hou dit vas (met knoppies, hou Kies) vir ’n voorwaarde soos Tussen twee tye van die dag, of om dit te verwyder.\n\nDie aksies, skakelaars en getalle om uit te kies kom per inprop: kies die inprop, dan wat dit bring; terug gaan weer daaruit. ’n Aksie wat op die gewysde skerm werk, soos Terug of Volgende bladsy, doen wat dit sou doen as dit daar gedruk is.\n\nTye geld ongeag watter skerm oop is. Twee reëls wat mekaar aanhou ontdoen, stop ná ’n paar stappe."
