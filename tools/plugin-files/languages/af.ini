sleep.plugin.name = Slaapskerm
sleep.plugin.description = Wys ’n slapende kat, die boek se omslag, jou prente of ’n boodskap terwyl die toestel slaap.
sleep.plugin.how = "Die slaapskerm bepaal wat die skerm wys terwyl die toestel slaap. E-ink hou die prent sonder krag.\n\nKies dit in die instellings, onder Toestel, Slaapskerm, met Wys: ’n slapende kat (die verstek), die boek se omslag, my prente, die logo en “Aan die slaap”, widgets, die bladsy soos dit is, of die bladsy met ’n prent. My prente wys die lêers van die Prente-gids een ná die ander.\n\nSonder ’n omslag of ’n prent wys die kat. Waar die stelsel die slaapskerm self teken, is hierdie instellings versteek.\n\nDie afskerm, Wys wanneer afgeskakel, word een keer geteken soos die toestel afgeskakel word, uit die aan/af-kieslys of ná die tyd van Skakel af ná slaap (nie wanneer ’n lae battery die krag afsny nie). Dit is soos die slaapskerm tensy jy die logo en “Afgeskakel”, die kat, die omslag of my prente kies. ’n Ander inprop kan ’n skerm daarvoor aanbied.\n\nDie begin- en herbeginskerm, Wys by begin en Wys by herbegin, is die toestel se eie tensy ’n ander inprop ’n skerm daarvoor aanbied. Inproppe loop nog nie terwyl die toestel begin nie: die skerm wat vir die begin gekies is, word vooraf geteken, soos die toestel afskakel of herbegin, en by die volgende begin gewys. ’n Skerm wat nie betyds gereed is nie, of ’n prent wat beskadig is, gee plek vir die toestel se eie; die toestel skakel in elk geval af of herbegin."
