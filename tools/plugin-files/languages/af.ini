stats.plugin.name = Leesstatistiek
stats.plugin.description = Teken op hoe lank en hoeveel jy lees, met ’n kalender en elke boek se syfers.
stats.plugin.how = "Leesstatistiek teken op hoe lank jy elke bladsy lees. Jy sien dit as ’n oorsig met vandag, die week en jou reeks, as ’n kalender, en met die syfers van elke boek.\n\nMaak dit oop uit Gereedskap, of uit Meer in die leser. In die instellings, onder Leesstatistiek, kan jy Teken lees op afskakel, ’n Daaglikse doel stel, en die Kortste bladsy en Langste bladsy stel wat tel, sodat deurblaai of ’n boek wat oop gelaat is, nie die syfers skeeftrek nie.\n\nSinkroniseer met KOReader deel die statistiek met KOReader deur ’n WebDAV-gids. Dit neem ook die statistiek van KOReader op dieselfde toestel in. Opname het ’n gestelde horlosie nodig: waar dit nie is nie, koppel een keer aan Wi-Fi."
