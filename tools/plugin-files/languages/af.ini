diagnostics.plugin.name = Diagnostiek
diagnostics.plugin.description = ’n Toetsskerm en ’n begeleide kontrole van elke deel van ’n toestel.
diagnostics.plugin.how = "Diagnostiek is ’n toetsskerm om ’n toestel na te gaan: dit wys elke grysvlak wat die paneel kan vertoon, vier blokkies om die knoppies en raak te probeer, en ’n bladsytelling met ’n vorderingsbalk om die verfrissingsmodusse te vergelyk.\n\nDie toetsskerm het geen kieslysinskrywing nie. Dit is net die tuisskerm solank geen ander inprop een bied nie, of wanneer jy dit onder Skerms in die inpropbestuurder vir die plek Tuisskerm kies.\n\nKies merk die blokkie met die fokus, en die pyltjieknoppies beweeg tussen die blokkies; met raak, tik ’n blokkie. Die bladsyknoppies blaai die toetsbladsye om. Hou Kies, of hou ’n vinger op die skerm, om van voor af te begin.\n\nDie toestelkontrole, onder Gereedskap waar PaperPaw die toestel se firmware is, gaan een bladsy op ’n slag deur elke deel van ’n toestel: die skerm, knoppies, raak, voorlig, battery, kaart, horlosie, Wi-Fi, slaap en geheue. Elke bladsy eindig met Misluk, Slaan oor en Geslaag, met die antwoord gekies wat sy metings voorstel; dele wat ’n toestel nie het nie, word oorgeslaan. Ná elke antwoord skryf dit ’n verslag na .paperpaw/plugins/diagnostics/device-check.txt, om in ’n pull request te plak. Terug verlaat dit, en dit gaan voort waar dit was wanneer dit weer oopgemaak word. Op ’n toestel met net knoppies, kies eers Begin op die knoppiebladsy; tot dan werk die pyltjies, Kies en Terug soos op elke bladsy."
