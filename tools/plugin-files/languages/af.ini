widgets.plugin.name = Widgetpakket
widgets.plugin.description = Baie meer widgets vir die tuisskerm: horlosies, ’n kalender, aanhalings, boeke, notas en meer.
widgets.plugin.how = "Die widgetpakket voeg baie widgets vir die tuisskerm by: horlosies (analoog, woord, teëls, wêreld), ’n kalender, die jaar tot dusver, ’n aftelling, die maanfase, en dag en datum; ’n aanhaling van die dag, notas, take, prente, ’n groet en die PaperPaw-logo; en vir boeke, nou besig om te lees, vordering, volgende, reeks, gunstelinge, ’n uitligting en die biblioteek in syfers. ’n Batterywidget is ook daarby.\n\nVoeg hulle by met Wysig tuisskerm in die kieslys (of ’n lang druk op die tuisskerm), dan Voeg ’n widget by. Elkeen het sy eie instellings, soos raam, grootte en belyning. As jy ’n widget kies wat verander, soos die aanhaling van die dag, wys dit die volgende een. Jou eie aanhalings gaan in quotes.txt in .paperpaw/plugins/widgets op die kaart, elke reël as teks | skrywer. Die tydwidgets het die horlosie gestel nodig; Wi-Fi stel dit."
