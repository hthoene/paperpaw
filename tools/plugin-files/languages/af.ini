vocabulary.plugin.name = Woordeskat
vocabulary.plugin.description = Hou die woorde wat jy opsoek, met hul sinne, en hersien flitskaarte met gespasieerde herhaling, gemaak op jou foon.
vocabulary.plugin.how = "Woordeskat hou die woorde wat jy tydens lees opsoek, elk met sy sin, om later deur te gaan. Jy vind die lys onder Gereedskap, nuutste eerste; kies ’n woord om dit weer op te soek. Die laaste ry, Voer uit, stoor hulle vir flitskaarttoepassings soos Anki. Die lys hou die nuutste 2 000 woorde: daarbenewens gaan die oudste, so voer hulle eers uit om almal te behou.\n\nFlitskaarte, ook onder Gereedskap, ondervra jou met gespasieerde herhaling: ná Wys antwoord gradeer jy elke kaart Weer, Moeilik, Goed of Maklik, en dit bepaal wanneer dit terugkom. Maak stapels met Wysig met jou foon: skandeer die kode met ’n foon in dieselfde Wi-Fi, tik dan kaarte of voeg baie op een slag by: maak daar ’n stapel oop, kies Baie kaarte op een slag en kies ’n CSV-, TSV- of TXT-lêer (’n kaart op elke reël: voorkant, agterkant, voorbeeld; UTF-8), plak ’n lys, of bring ’n Anki-stapel (.apkg, uitgevoer met Ondersteun ouer Anki-weergawes). \n\nOf gebruik lêers op die SD-kaart: plaas ’n CSV-, TSV- of TXT-lêer, of ’n Anki-stapel (.apkg, uitgevoer met Ondersteun ouer Anki-weergawes), vir elke stapel in die gids Flashcards (Spaans.tsv maak die stapel Spaans; een kaart op elke reël: voorkant, agterkant, voorbeeld; as UTF-8 gestoor; ’n eerste reël mag die kolomme front, back, example noem). Kies Kaarte op die SD-kaart in Flitskaarte, of laat dit gebeur wanneer jy Flitskaarte oopmaak. Die stapels bly op die leser met wat jy geleer het, en ’n lêer word in sy stapel saamgevoeg wanneer dit nuut of verander is: verander die agterkant of voorbeeld van ’n kaart in die lêer en die kaart verander en behou sy vordering; verander die voorkantteks en dit tel as ’n nuwe kaart, die ou een begin van voor af (kaarte word deur die voorkantteks onderskei; spasies en hoofletters tel nie); ’n reël wat jy uitvee, vee nie die kaart uit nie (tensy jy “kaarte wat in die lêer ontbreek” vir daardie stapel op Verwyder stel: dan word die kaart by die volgende opdatering met sy vordering vir altyd verwyder, en niks word verwyder solank een of ander reël van die lêer nie gelees kan word nie). Stoor ’n stapel na sy lêer met Stoor op die kaart: die lêer kry die kaarte se nommers (die id-kolom), sodat jy voorkante op ’n rekenaar kan wysig en die kaarte behou wat jy geleer het; die lêer hou net id, voorkant, agterkant en voorbeeld (ander kolomme, kommentaar en die volgorde van reëls word nie behou nie), en ’n stoor word geweier solank een of ander reël van die lêer nie gelees kon word nie; die lêer wat daar was, word die eerste keer na _naam.bak.tsv gekopieer (’n latere stoor vervang nie daardie kopie nie). ’n Lêer van meer as 4 MiB of 20 000 reëls word nie gelees nie, en dit moet as CSV UTF-8 gestoor wees, nie UTF-16 nie. Die eerste keer maak die leser die gids met ’n nota oor hoe dit werk.\n\nIn die instellings, onder Lees, maak Woorde wat opgesoek is word kaarte elke opgesoekte woord ’n kaart in die stapel Opgesoek."
