about.plugin.description = PaperPaw se weergawe en lisensies.
about.plugin.how = "Oor wys watter weergawe van PaperPaw jy het, waar die bronkode is, en onder watter lisensies dit kom.\n\nJy vind dit aan die einde van die Instellings, as Oor PaperPaw. Kies ’n ry met die pyltjieknoppies en Kies, of tik daarop. Inproppe wat in die firmware ingebou is en, op toestelle wat inproppe met kode laai, die vingerafdruk waarvoor sulke inproppe gebou moet wees, word ook gelys.\n\nLisensies maak as ’n teks in die leser oop, so jy blaai daardeur soos deur ’n boek. Dit bevat PaperPaw se eie lisensie en dié van die lettertipes, ikone en woordafbrekingspatrone wat saam kom. Inproppe kan ’n reël van hul eie byvoeg, soos ’n tema se skepper."
