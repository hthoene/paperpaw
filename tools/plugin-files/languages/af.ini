home.plugin.name = Tuisskerm
home.plugin.description = Die beginbladsy: bladsye met widgets, soos die boek wat gelees word en die gereedskap.
home.plugin.how = "Die tuisskerm bestaan uit bladsye, elk ’n rooster van widgets en gereedskap soos op ’n foon. Aanvanklik is die horlosie, die boek wat jy lees en die onlangs gelese boeke op een bladsy, en alle gereedskap op die volgende.\n\nTik ’n item om dit oop te maak, en swiep of gebruik die bladsyknoppies om van bladsy te verander. Met net knoppies beweeg die pyltjieknoppies van een item na die volgende en Kies maak dit oop.\n\nOm dit te herrangskik, hou die tuisskerm vas, tik die potlood onder die bladsy of kies Wysig tuisskerm in die kieslys. Sleep items om hulle te skuif of tik een vir sy opsies, ook met knoppies. Voeg ’n widget by is ook daar. Kolomme en Rye is in die instellings, onder Voorkoms, in die afdeling Tuisskerm.\n\nOp ’n skerm wat op sy sy gedraai is, wys die tuisskerm dieselfde items met meer kolomme, elke bladsy gevul voor die volgende een, en kaarte nie wyer as ongeveer 110 mm nie; niks wat jy regop gerangskik het, word verander nie. Rangskik dit op sy sy en daardie uitleg word vir daardie oriëntasie op sy eie bewaar: nuwe widgets word by albei gevoeg. Stel landskapuitleg terug onder Voeg by (terwyl jy wysig) gaan terug na die afgeleide een. Om ’n widget of gereedskapstuk in een oriëntasie te verwyder, verwyder dit nie uit die ander nie."
