vocabulary.sd.readme = "Flitskaarte uit lêers\n\nPlaas hier ’n lêer vir elke stapel: Spaans.tsv maak die stapel Spaans.\nLêers: .tsv, .csv of .txt, gestoor as UTF-8, of .apkg: ’n Anki-stapel, uitgevoer met Ondersteun ouer Anki-weergawes gemerk. Sy notas se eerste drie velde word voorkant, agterkant en voorbeeld; sy skedulering en media word nie gelees nie, en PaperPaw skryf nooit ’n Anki-lêer nie.\n\nEen kaart op elke reël: voorkant, agterkant en ’n voorbeeld (opsioneel), geskei deur ’n tab, ’n komma of ’n kommapunt. Die eerste reël mag die kolomme noem: front, back, example. Voorbeeld:\n\nHuis\thouse\tDie huis is groot.\n\nMaak dan Flitskaarte op die leser oop, kies Kaarte op die SD-kaart en dan Dateer die stapels van die kaart op.\n\nGoed om te weet:\n- Die stapels bly op die leser, met wat jy geleer het. ’n Lêer word gelees wanneer dit nuut of verander is, en sy kaarte word by die stapel gevoeg of daar verander.\n- Verander die agterkant of die voorbeeld van ’n kaart in die lêer: die kaart verander en behou jou vordering.\n- Verander die voorkantteks van ’n kaart: dit tel as ’n nuwe kaart, en die ou een begin van voor af. Kaarte word deur hul voorkantteks gepas, spasies en hoofletters tel nie. Stoor ’n stapel in ’n lêer (Kaarte op die SD-kaart, Stoor die stapel op die kaart) en elke kaart het ’n nommer in die id-kolom: verander daar ’n voorkant, behou die eerste twee reëls van die lêer soos hulle is, en die kaart behou wat jy geleer het.\n- Stoor skryf die kaarte van die stapel. Wat in die lêer was en nie ’n kaart is nie (’n reël sonder ’n voorkant), word nie behou nie; die lêer wat daar was, word na _naam.bak.tsv gekopieer.\n- Stoor die lêer as CSV UTF-8 (nie UTF-16 nie, nie ’n sigblad se eie formaat nie). ’n Lêer van meer as 4 MiB of 20 000 reëls word nie gelees nie: verdeel dit.\n- ’n Reël wat jy in die lêer uitvee, vee nie die kaart in die stapel uit nie, tensy jy Verwyder ontbrekende kaarte vir daardie stapel aanskakel. Dan gaan die kaart saam met wat jy geleer het.\n- Lêers wie se name met _ begin, word nie gelees nie.\n"
