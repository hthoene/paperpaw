files.plugin.how = "Die biblioteek lys die boeke in jou biblioteekgids, elk met sy omslag, titel, skrywer en hoe ver jy dit gelees het. Die boek wat jy laaste gelees het, staan bo as ’n kaart, so om voort te lees neem een tik, of een druk op Kies. Terwyl die biblioteek na boeke soek, sê dit hoeveel dit tot dusver gevind het.\n\nKies wat bo die boeke gewys word: almal, dié wat jy lees, ongelese of klaar gelese boeke, of die rakke (volgens skrywer, reeks, etiket, gunstelinge, die volgende boek van elke reeks wat jy begin het). Tik ’n boek om dit te lees; hou dit vas (met knoppies, hou Kies) om dit oop te maak, as klaar gelees of ongelees te merk, sy inligting te sien, dit na die argief te skuif of uit te vee. Tik die titel vir die biblioteekkieslys: hoe boeke gesorteer en gewys word, soek, die biblioteekgids en instellings.\n\nDie biblioteekgids word in Instellings, onder Biblioteek, as Biblioteekgids gestel; daar kan jy ook boeke as ’n rooster van omslae wys. Vir elke ander lêer, gebruik Lêers in die Gereedskap-kieslys."
