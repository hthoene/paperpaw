calendar.plugin.name = Kalender
calendar.plugin.description = Jou kalenders op die leser: agenda-, dag-, week- en maandaansigte uit CalDAV, iCal en lêers, verjaardae uit kontakte, tuis-widgets en ’n slaapskerm.
calendar.plugin.how = "Jou kalenders op die leser: ’n agenda van die volgende dae, ’n dag, ’n week en ’n maand, met die geleenthede van CalDAV-kalenders (Nextcloud, Radicale, Baïkal, Fastmail en ander), van iCal-adresse (.ics, webcal://), van kalenderlêers op die kaart en die verjaardae en herdenkings van jou kontakte (CardDAV). Die leser lees kalenders net; dit verander hulle nooit nie.\n\nMaak Kalender oop uit die gereedskapkieslys. Die eerste ry noem die aansig; kies dit, of hou enige ry vas of druk Kieslys, om tussen Agenda, Dag, Week, Maand en Verjaardae te wissel, kalenders by te voeg of te sinkroniseer. In Dag en Week gaan die eerste twee rye ’n dag of week terug en vorentoe (die bladsysleutels ook); in Maand beweeg die pyltjieknoppies die dag, die bladsysleutels die maand, en Kies maak die dag oop. Kies by ’n geleentheid wys dit in geheel: wanneer, waar, watter kalender en hoe dit herhaal. Terug gaan een stap terug.\n\nVoeg ’n kalender by onder Kalenders (in die kieslys, of Kalender in die instellings). Kies sy soort: ’n CalDAV-rekening (die bediener se adres is genoeg, bv. cloud.example.com/remote.php/dav; elke kalender met geleenthede word deel van die aansig), ’n iCal-adres (’n kalender wat as .ics gepubliseer is), ’n kalenderlêer op die kaart, of kontakte (’n CardDAV-adresboek: die leser wys die verjaardae en herdenkings wat daarmee gestoor is). Voer die adres in, vir ’n rekening jou gebruikernaam en ’n wagwoord (verkieslik ’n toepassingswagwoord; dit word saam met die leser se wagwoorde bewaar), en ’n naam. Elke kalender het ’n merk (’n kolletjie, ’n ring, ’n grys kolletjie of ’n vierkant) wat jy kan verander, sodat jy hulle kan onderskei; tot ses kalenders.\n\nHerhalende geleenthede (daagliks, weekliks, maandeliks, jaarliks, met weekdae, tellings, einddatums en weggelate dae), heeldaagse geleenthede en geleenthede in ander tydsones word op die leser se eie horlosie gewys. Die leser hou die geleenthede van sestig dae voor tot sestig dae ná vandag, hoogstens 240, en wys hulle sonder die netwerk. Reëls wat dit nie kan lees nie, wys hul geleentheid een keer.\n\nKalenders word gelees wanneer jy die kalender oopmaak (hoogstens elke vyf minute), wanneer jy Sinkroniseer nou kies, en, soos jy onder Kalender in die instellings stel, wanneer die netwerk in elk geval aan is of wanneer laai begin. Die leser skakel nooit sy radio daarvoor aan nie, behalwe wanneer jy Sinkroniseer nou vra.\n\nWidgets vir die tuisskerm (hou die tuisskerm vas, voeg dan ’n widget by): Vandag wys die datum en wat die dag inhou, Volgende geleentheid die geleentheid wat volgende is, Agenda die volgende dae, Maand ’n maand met ’n kolletjie onder die dae met geleenthede, en Verjaardae die volgende verjaardae. ’n Tik op ’n geleentheid maak dit oop, ’n tik op ’n dag van die maand maak daardie dag oop. Die slaapskerm kan vandag se agenda wys: kies Kalender onder Slaapskerm in die instellings."
