smart-home.plugin.name = Slimhuis
smart-home.plugin.description = Waardes en skakelaars van jou eie Home Assistant op ’n kontrolebord en as tuisskerm-widgets. Werk met Home Assistant op jou tuisnetwerk.
smart-home.plugin.how = "Slimhuis wys waardes en skakelaars van jou eie Home Assistant: temperature, humiditeit, energie, deure en vensters, ligte, skakelaars en tonele. Dit praat met jou bediener oor sy REST-API op jou tuisnetwerk; niks gaan deur enige ander diens nie.\n\nMaak Slimhuis oop uit die gereedskapkieslys, dan Verbinding: tik die adres van jou Home Assistant (byvoorbeeld http://homeassistant.local:8123) en ’n langlewende toegangtoken (maak een onderaan jou Home Assistant-profielbladsy). Die token word onder die wagwoorde en sleutels bewaar, nooit in ’n instellingslêer nie. Gewone http word net vir adresse op jou tuisnetwerk gebruik; vir ’n bediener elders skakel “Bedieners buite die tuisnetwerk” in die instellings aan en gebruik https met ’n geldige sertifikaat.\n\nKies entiteite maak ’n lys oop van wat jou bediener het: soek volgens naam of id en kies ’n entiteit om dit te wys (kies dit weer om dit weg te neem). Jy kan dit ’n kamer gee, wat dit op die kontrolebord en in die kamerwidgets groepeer. Tot 24 entiteite word bewaar. Kies op die kontrolebord ’n lig, skakelaar of toneel om dit te skakel: die ry wys die bediener se antwoord. ’n Sensor wat jy kies, word weer gelees.\n\nWidgets (hou die tuisskerm vas, voeg dan ’n widget by): Slimhuiswaarde wys een lesing groot, groep lys die entiteite van ’n kamer, skakelaar is ’n knoppie vir een lig of skakelaar, en kamer is ’n kaart met ’n kamer se lesings en skakelaars. Elke widget se instellings sê watter entiteit of kamer dit wys.\n\nDie huis word gelees wanneer jy die kontrolebord oopmaak, wanneer jy vra (die Verfris-ry of ’n tik op ’n waarde- of groepwidget), wanneer die leser wakker word waar Wi-Fi reeds aan is, en volgens die skedule wat jy stel terwyl die laaier ingeprop is. Dit skakel nooit self die radio aan nie en hou dit nooit aan nie."
