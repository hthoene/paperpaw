calibre.plugin.name = Draadlose biblioteek
calibre.plugin.description = Ontvang boeke oor die netwerk. Werk as ’n draadlose toestel vir Calibre.
calibre.plugin.how = "Draadlose biblioteek laat die toestel in Calibre op jou rekenaar as ’n draadlose toestel verskyn. Calibre kan dan boeke daarheen stuur, hulle lys en uitvee. Die boeke gaan in die biblioteek.\n\nMaak Draadlose biblioteek oop uit die Gereedskap-kieslys, met die toestel en die rekenaar in dieselfde Wi-Fi-netwerk. Kies in Calibre Koppel/deel, dan Begin draadlose toestelverbinding. Wanneer die toestel jou rekenaar gevind het, wys dit sy naam; tik Koppel (met knoppies, druk Kies). Calibre kan hier boeke byvoeg en uitvee, so koppel net aan jou eie rekenaar. Die skerm toemaak beëindig die verbinding.\n\nAs Calibre nie vanself gevind word nie, voer sy rekenaar se adres in Instellings in, onder Biblioteek, as Adres in die Calibre-deel. As Calibre ’n ander poort as 9090 gebruik, voeg dit as :poort by, bv. 192.168.1.20:9091."
