menu.plugin.name = Kieslys
menu.plugin.description = Die kieslys onder aan die skerm, met aksies en instellings.
menu.plugin.how = "Die kieslys lys wat jy kan doen en stel. Dit maak onder aan die skerm oop, bo wat ook al oop is: tik tydens lees die middel van die skerm of druk Kies. Tik of kies ’n inskrywing om dit uit te voer.\n\nInstellings in die kieslys wys hul waarde en verander op die plek, so die kieslys bly oop. ’n Inskrywing met meer inskrywings maak ’n subkieslys oop.\n\nSwiep van die bokant af af vir die kitspaneel: wat jy gereeld verander, as knoppies. Tik ’n knoppie om dit te skakel, hou dit vas vir sy instellings. Met net knoppies kies die pyltjieknoppies, Kies skakel en Terug maak toe. Onder Voorkoms wys Kieslyste die kieslyste as ’n lys of as teëls."
