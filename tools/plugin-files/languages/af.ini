plugin-manager.plugin.name = Inpropbestuurder
plugin-manager.plugin.description = Lys die inproppe en skakel hulle aan en af.
plugin-manager.plugin.how = "Die inpropbestuurder lys elke inprop met sy weergawe en beskrywing, en skakel inproppe aan en af.\n\nVind dit in Instellings, as Bestuur inproppe. Inpropinstellings is ’n aparte bladsy vir voorkeure soos elke inprop se netwerkgebruik. Tik ’n inprop om dit aan of af te skakel (met knoppies, kies dit). Die verandering geld ná ’n herbegin: die balk onder bied dan Herbegin nou aan. Hou ’n inprop vas (met knoppies, hou Kies) om te lees hoe dit werk.\n\n’n Inprop gemerk Altyd aan kan nie afgeskakel word nie, en een gemerk Vereis eers wanneer ’n ander inprop sy werk doen, anders sou PaperPaw geen pad terug hê nie. Onder Skerms kies jy watter inprop ’n plek wys wat verskeie aanbied."
