setup.plugin.name = Opstelling
setup.plugin.description = ’n Kort gids deur die instellings wat saak maak, by die eerste begin.
setup.plugin.how = "Opstelling is ’n kort gids deur die instellings wat saak maak, een keer gewys, die eerste keer wat PaperPaw begin. Elke bladsy vra een ding, soos die taal, die knoppies, die teksgrootte, die tydsone, Wi-Fi of ’n paar inproppe om by te voeg, met ’n verstandige antwoord reeds gekies, so Volgende is altyd reg. Stappe wat hierdie toestel nie nodig het nie, word weggelaat.\n\nTik die knoppies, of gebruik die op- en af-knoppies en Kies. Slaan oor op die eerste bladsy verlaat die opstelling dadelik. Die laaste bladsy sê waar jou boeke vandaan kom.\n\nOm dit weer te laat loop, maak die instellings oop en kies Stel PaperPaw op. Alles wat hier gekies is, kan later in die instellings verander word."
