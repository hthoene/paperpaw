profiles.plugin.name = Leesprofiele
profiles.plugin.description = Benoemde stelle lees- en vertooninstellings, met ’n tik gewissel.
profiles.plugin.how = "’n Profiel hou jou leesinstellings, vertooninstellings en statusreëls onder ’n naam, soos Nag of Groot druk, en bring hulle met ’n tik terug.\n\nMaak Profiele oop in die leeskieslys onder Meer, of in Instellings onder Pasmaak. Tik ’n profiel om dit te gebruik; die een in gebruik is gemerk. Hou dit vas (met knoppies, hou Kies) om die huidige instellings daarin te stoor, dit te hernoem of te verwyder. Stoor as nuwe profiel hou wat nou gestel is.\n\nVolgende profiel skakel oor na die volgende een in die lys; plaas dit op ’n knoppie of in ’n reël."
