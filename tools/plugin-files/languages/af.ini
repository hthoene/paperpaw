aids.plugin.name = Leeshulpmiddels
aids.plugin.description = Vet woordbegin, vervangde woorde, prente: teks soos jy dit wil hê.
aids.plugin.how = "Leeshulpmiddels verander hoe die teks van ’n boek lyk terwyl jy lees. Hulle geld vir elke boek. Vet woordbegin en Vervang woorde is eers af.\n\nJy vind hulle in Instellings, onder Lees, in die afdeling Leeshulpmiddels. Vet woordbegin stel die eerste helfte van elke woord vet, wat sommige mense makliker vind om te volg. Vervang woorde neem pare soos “Mnr. = Meneer; Mev. = Mevrou”, geskei deur kommapunte.\n\nSlegs hele woorde word vervang, presies soos jy dit geskryf het, so ’n deel van ’n langer woord bly onaangeraak. Die boeklêer self word nie verander nie.\n\nPrente in boeke kan gewys word (soos aanvanklik), in ’n kort reël soos “[Prent: ’n skip op see]” omgeskakel word wat die prent se beskrywing gebruik, of weggelaat word. ’n Bladsy het dan meer ruimte vir teks, en niks word vir ’n prent wat nie gewys word nie, gedekodeer nie, wat bladsye vinniger laat omblaai. Strokiesprente en ander boeke wat uit prente bestaan, word nie verander nie."
