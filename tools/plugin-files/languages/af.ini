update.plugin.name = Opdatering
update.plugin.description = Installeer firmware-opdaterings, vanaf die kaart of van die internet afgelaai.
update.plugin.how = "Opdatering installeer nuwe firmware, op toestelle waar PaperPaw die firmware is, soos die X4. Jy vind dit in die instellings, as Opdatering.\n\nSoek aanlyn vra die opdateringbediener vir ’n nuwer PaperPaw en laai dit af, wat ’n paar minute oor Wi-Fi neem. Of kopieer ’n opdateringlêer (wat op .bin eindig, van paperpaw.org) na die gids updates op die kaart, byvoorbeeld met Wi-Fi-oordrag. Installeer neem dan ongeveer ’n minuut en die toestel herbegin; boeke, instellings en leesposisies bly.\n\nMet Soek na opdaterings aan (in die instellings, eers af) vra die toestel ongeveer een keer per week vanself, net terwyl Wi-Fi in elk geval aan is of dit laai. ’n Nuwer PaperPaw wat dit vind, wag hier; niks onderbreek jou lees nie. ’n Soektog stuur wat die toestel loop, geen naam of nommer van dit nie; om toestelle te tel, ook of jy gevra het en of dit sy eerste soektog van die dag, week of maand is.\n\nAs inproppe wat jy gebruik nog geen weergawe vir die nuwe vrystelling het nie, wag die opdatering vir hulle. ’n Ouer weergawe installeer net as jy dit kies.\n\nNog firmware, soos CrossPoint, installeer ook van hier af: plaas sy lêer (wat op .bin eindig) in die gids updates, en maak Opdatering oop. PaperPaw kontroleer dat dit ’n volledige firmware vir hierdie toestel is, onbeskadig, maar kan nie sê wie dit gemaak het nie, aangesien dit nie onderteken is nie. Installeer in elk geval skryf dit in die ander helfte van die flash, en die toestel begin dit; PaperPaw bly in sy helfte totdat daardie firmware iets daaroor installeer. Om later na PaperPaw terug te keer, installeer sy installasielêer (paperpaw-<toestel>-<weergawe>-install.bin) uit die ander firmware se kieslys, soos CrossPoint se SD-firmware-opdatering."
