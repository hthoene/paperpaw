translate.plugin.description = Vertaal gekose teks aanlyn, met DeepL.
translate.plugin.how = "Vertaling vertaal gekose teks aanlyn met DeepL. Kies teks in ’n boek en kies Vertaal in die kieslys van die gekose teks: die vertaling verskyn oor die bladsy soos ’n woordeboekinskrywing. Bladsyknoppies of tikke rol dit, en Kies of ’n tik aan sy einde maak dit toe.\n\nDit het ’n netwerk en ’n DeepL-API-sleutel van jou eie nodig, gratis by deepl.com (DeepL API Free, ongeveer 500 000 karakters per maand). Totdat jy dit invoer, sê die paneel so, en ’n tik vra daarvoor.\n\nIn die instellings, onder Lees, in die afdeling Vertaling, stel Vertaal na die taal; eers is dit PaperPaw s’n."
