store.plugin.name = Inpropwinkel
store.plugin.description = Vind, installeer, dateer op en verwyder inproppe vir hierdie toestel.
store.plugin.how = "Die Inpropwinkel vind inproppe vir hierdie toestel op die internet en installeer, dateer op en verwyder hulle. Maak dit oop uit Gereedskap; dit het Wi-Fi nodig.\n\nDie begin wys wat die biblioteek aanbeveel, wat nuut of nou gewild is, dan die groepe. ’n Groep lys sy inproppe in ’n regverdige mengsel wat daagliks verander, sodat elke inprop gesien word; sorteer hulle van A tot Z, volgens nuutste of volgens laaste opdatering, en gaan in lang lyste na ’n letter. Maak een oop om sy bladsy te sien, met sy grootte en die geheue wat dit neem, kies dan Installeer, Dateer op of Verwyder. Dateer alles op bring elke geïnstalleerde inprop op datum.\n\nKode-inproppe loop met volle toegang tot die toestel: die winkel sê so en vra eers, en hulle begin ná ’n herbegin. As een skeefloop, begin PaperPaw sonder kode-inproppe en sê watter. Inpropbiblioteek stel waar die lys vandaan kom.\n\nGemeenskapsinproppe, in Instellings, Stelsel, lys ook inproppe wat ander op GitHub gepubliseer het. Niemand het hulle nagegaan nie: hulle is gemerk Nie nagegaan nie, ’n kode-inprop se bladsy wys die sleutel waarmee dit onderteken is, en ’n opdatering wat met ’n ander sleutel onderteken is, word nie geïnstalleer nie.\n\nBronne, die laaste ry van die begin, voeg ander se inproplyste by volgens hul adres (https://…/plugins.json), lys een daarvan in die plek van PaperPaw s’n, of verwyder dit. In plaas daarvan om te tik, plaas ’n lêer sources.txt met een adres op elke reël in .paperpaw/plugins/store op die kaart: die adresse verskyn onder Bronne as nuut. PaperPaw kontroleer nie ’n bron of sy inproppe nie, en die toestel kontak die bron se bediener. ’n Bron onderteken sy lys; die toestel hou die sleutel van die eerste lys wat dit lees en neem van dan af net lyste en kode-inproppe aan wat met daardie sleutel onderteken is. ’n Inprop kry sy opdaterings net van die bron waaruit dit geïnstalleer is. PaperPaw se eie biblioteek is altyd daar en kan nie verwyder word nie; om die winkel te verlaat keer daarheen terug."
