weather.plugin.name = Weer
weather.plugin.description = Die weer nou en die volgende dae as widgets, van Open-Meteo.
weather.plugin.how = "Weer wys die weer nou en die volgende dae as widgets vir die tuisskerm, van Open-Meteo, wat geen rekening of sleutel nodig het nie. Weer nou wys die temperatuur, die toestand en meer om uit te kies; Voorspelling wys die volgende dae in ’n ry of ’n lys.\n\nKies eers ’n plek: in die instellings, onder Weer, Plek (tik ’n naam, kies dit dan uit die plekke wat gevind is). Slegs sy koördinate word gestuur, en slegs terwyl ’n weerwidget gewys word. Voeg die widgets by deur die tuisskerm te wysig.\n\nDie weer word hoogstens so gereeld gehaal as wat Dateer hoogstens elke op sê, en slegs terwyl daar ’n netwerk is: dit skakel nooit self Wi-Fi aan nie.\n\nWeerdata deur Open-Meteo.com (https://open-meteo.com), onder die Creative Commons Attribution 4.0-lisensie (CC BY 4.0)."
