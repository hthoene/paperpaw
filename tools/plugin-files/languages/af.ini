transfer.plugin.name = Oordrag
transfer.plugin.description = Plaas boeke en ander lêers vanaf ’n blaaier in dieselfde netwerk op die toestel.
transfer.plugin.how = "Wi-Fi-oordrag plaas boeke en ander lêers vanaf ’n blaaier in dieselfde netwerk op die toestel, sonder kabel of toepassing. Jy kan ook lêers haal, gidse maak en uitvee.\n\nMaak dit oop uit Gereedskap. Die skerm wys ’n adres as teks en as ’n QR-kode: maak dit in ’n blaaier op ’n foon of rekenaar oop, of skandeer die kode. Die adres bevat ’n sleutel wat elke keer opnuut gemaak word, sodat ander in die netwerk nie by jou lêers kan uitkom nie. Die oordrag loop terwyl die skerm oop is.\n\nWaar PaperPaw self Wi-Fi bestuur, soos op die X4, maak Sonder ’n router onderaan ’n netwerk van die toestel se eie oop, waarby die foon aansluit deur ’n kode te skandeer."
