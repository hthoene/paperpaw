mail.plugin.name = E-pos
mail.plugin.description = Lees en stuur e-pos met ’n wagwoord of ’n toepassingswagwoord (IMAP en SMTP), geen blaaieraanmelding.
mail.plugin.how = "E-pos lees en stuur e-pos oor IMAP en SMTP. Dit meld met jou adres en ’n wagwoord aan, sonder blaaieraanmelding, so dit werk met enige verskaffer wat dit toelaat.\n\nStel ’n rekening op onder Instellings, E-pos. Kies jou verskaffer, tik jou adres en die wagwoord. Die meeste verskaffers wil ’n toepassingswagwoord hê: maak een in jou rekening se sekuriteitsinstellings en gebruik dit hier. Jou gewone wagwoord werk dikwels nie, en dit gaan nêrens heen nie behalwe na jou verskaffer se bediener. Dit word saam met die wagwoorde en sleutels bewaar.\n\nMaak E-pos onder die gereedskap oop. Kyk vir pos haal die nuutste e-posse en die gidse. E-posse word op die kaart bewaar, so jy kan hulle sonder ’n netwerk lees. Die toestel koppel, haal en ontkoppel, so Wi-Fi is net vir ’n oomblik aan.\n\nAs jou verskaffer nie op die lys is nie, kies Eie bedieners en stel die bedienernaam, poorte en sekuriteit onder die gevorderde instellings. ’n Bediener waarvoor geen owerheid instaan vir die sertifikaat nie, vra een keer of jy dit vertrou; vergelyk die vingerafdruk met wat jou verskaffer wys.\n\n’n E-pos met ’n boek aangeheg (EPUB, PDF en dergelike, tot 2 MB) het Maak boek oop daaronder: dit haal die lêer, plaas dit in jou biblioteek en maak dit oop.\n\nOm nuwe pos te sien sonder om E-pos oop te maak, skakel Soek in die agtergrond na nuwe pos aan onder Instellings, E-pos, en kies hoe gereeld (elke 15, 30 of 60 minute). Dit is af totdat jy dit aanskakel. Die leser koppel dan van tyd tot tyd oor ’n veilige verbinding terwyl dit wakker en aanlyn is, een rekening na die ander, en werk die ongelese telling op Tuis by. Dit gebruik ’n bietjie battery. As jy E-pos oopmaak, stop dit ’n kontrole wat loop.\n\nTuisskerm-widgets wys die ongelese telling, die nuutste en die gesterde e-posse, een posbus, en ’n kortpad om ’n e-pos te skryf."
