sleep.plugin.description = د وسیلې د خوب پر مهال یو ویده پیشو، د کتاب پوښ، ستاسو انځورونه یا یو پیغام ښيي.
sleep.plugin.how = "د خوب پرده ټاکي چې د وسیلې د خوب پر مهال پرده څه ښيي. ای-انک انځور پرته له بریښنا ساتي.\n\nدا په ترتیباتو کې، د وسیلې، د خوب پردې لاندې، د «ښودل» سره وټاکئ: یو ویده پیشو (ډیفالټ)، د کتاب پوښ، زما انځورونه، لوګو او «خوب»، ویجټونه، پاڼه لکه څنګه چې ده، یا پاڼه له یو انځور سره. «زما انځورونه» د انځورونو پوښۍ دوتنې یو د بل پسې ښيي.\n\nپرته له پوښ یا انځور، پیشو ښکاري. چېرته چې سیسټم د خوب پرده پخپله انځوروي، دا ترتیبات پټ دي.\n\nد بندېدو پرده، «د بندېدو پر مهال ښودل»، یو ځل انځورېږي کله چې وسیله بندېږي، د چالان/بند له مینو، یا د «له خوب وروسته بندول» له وخت وروسته (نه کله چې کمه بېټرۍ بریښنا پرې کړي). دا لکه د خوب پرده ده پرته لدې چې تاسو لوګو او «بند شوی»، پیشو، پوښ یا زما انځورونه وټاکئ. بل پلګین کولی شي د دې لپاره یوه پرده وړاندې کړي.\n\nد پیل او بیا پیل پرده، «د پیل پر مهال ښودل» او «د بیا پیل پر مهال ښودل»، د وسیلې خپله ده پرته لدې چې بل پلګین د هغوی لپاره پرده وړاندې کړي. پلګینونه لا نه چلېږي کله چې وسیله پیلېږي: هغه پرده چې د پیل لپاره ټاکل شوې مخکې انځورېږي، کله چې وسیله بندېږي یا بیا پیلېږي، او په راتلونکي پیل کې ښودل کېږي. هغه پرده چې په وخت نه ده چمتو، یا خراب انځور، د وسیلې خپلې ته ځای ورکوي؛ وسیله په هر حال بندېږي یا بیا پیلېږي."
