help.plugin.name = لارښوونې
help.plugin.description = لومړی ځل چې یوه پرده پرانیستل کېږي، ښيي چې د هغې کنټرولونه څه کوي.
help.plugin.how = "لومړی ځل چې یوه پرده پرانیستل کېږي، په هغې باندې یو لنډ یادښت وايي چې د هغې کنټرولونه څه کوي: د پردې هغه برخې چې ټک ورته ځي، په چوکاټ کې، او تڼۍ څه کوي.\n\nیو ټک یا هره تڼۍ یادښت تړي، او دا د هغې پردې لپاره بیا نه راځي. «نور لارښوونې نه» ټولې بندوي.\n\nپه ترتیباتو کې، د سیسټم لاندې، «لارښوونې» یې چالانوي یا بندوي، او «لارښوونې بیا ښودل» د هرې پردې یادښت یو ځل بیا ښکاره کوي."
