menu-editor.plugin.name = د مینو سمونکی
menu-editor.plugin.description = د هر مینو ننوتنې بیا ترتیبوي، لرې کوي او زیاتوي.
menu-editor.plugin.how = "د مینو سمونکی بدلوي چې مینوګانې څه لري: ننوتنې پورته یا ښکته وخوځوئ، لرې یې کړئ، یا نوې زیاتې کړئ.\n\nدا په ترتیباتو کې د دودیزولو لاندې، د «مینوګانې دودیزول» په توګه ومومئ. یو مینو وټاکئ، بیا یوه ننوتنه چې وخوځول شي یا لرې شي؛ «ننوتنه زیاتول» نوې ننوتنه ږدي. بدلونونه سمدلاسه پلي کېږي. «دا مینو بېرته ټاکل» یو مینو هماغسې کوي لکه څنګه چې پلګینونه یې ټاکي، «ټول مینوګانې بېرته ټاکل» دا د هرې لپاره کوي.\n\nتاسو ځان نه شئ بهر کولی: یوه ننوتنه چې ترتیباتو ته لاره ده پاتې کېږي تر هغه چې ورته بله لاره زیاته کړئ."
