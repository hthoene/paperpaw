menu.plugin.description = د پردې په ښکته کې مینو، له عملونو او ترتیباتو سره.
menu.plugin.how = "مینو لیست کوي چې تاسو څه کولی شئ او ټاکلی شئ. دا د پردې په ښکته کې، د هغه څه پر سر چې پرانیستل شوي، پرانیستل کېږي: د لوست پر مهال، د پردې منځ ټک کړئ یا غوره کول کېکاږئ. یوه ننوتنه ټک یا غوره کړئ چې چلوي یې.\n\nپه مینو کې ترتیبات خپل ارزښت ښيي او په ځای بدلېږي، نو مینو پرانیستې پاتې کېږي. هغه ننوتنه چې نورې ننوتنې لري فرعي مینو پرانیزي.\n\nد چټک پینل لپاره د پورتنۍ څنډې څخه ښکته سوایپ کړئ: هغه څه چې تاسو ډېر بدلوئ، د تڼیو په توګه. یوه تڼۍ ټک کړئ چې بدله شي، یې ونیسئ د هغې د ترتیباتو لپاره. یوازې له تڼیو سره، غشي تڼۍ ټاکي، غوره کول بدلوي او شاته تړي. د ښکارېدنې لاندې، «مینوګانې» مینوګانې د لیست یا ټایلونو په توګه ښيي."
