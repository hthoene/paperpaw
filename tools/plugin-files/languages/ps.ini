widgets.plugin.how = "د ویجټونو بسته د کور پردې لپاره ډېر ویجټونه زیاتوي: ساعتونه (عقربه‌يي، د کلمو، په خانو کې، نړیوال)، کېلنډر، کال تر اوسه، معکوسه شمېرنه، د سپوږمۍ پړاو، او ورځ او نېټه؛ د ورځې نقل قول، یادښتونه، د کارونو لیست، انځورونه، ښه راغلاست او د PaperPaw لوګو؛ او د کتابونو لپاره: اوس لوستل کېږي، پرمختګ، بل کتاب، لړۍ، خوښې، یو برجسته متن او کتابتون په شمېرو کې. د بېټرۍ ویجټ هم پکې دی.\n\nهغوی په مینو کې له «کور پرده سمول» (یا په کور پرده له اوږد فشار) زیات کړئ، بیا «ویجټ زیاتول». هر یو خپل ترتیبات لري، لکه چوکاټ، اندازه او ترتیب. د داسې ویجټ غوره کول چې بدلېږي، لکه د ورځې نقل قول، بل یې ښيي. ستاسو خپل نقل قولونه په کارت کې په .paperpaw/plugins/widgets کې quotes.txt ته ځي، هره کرښه د متن | لیکوال په توګه. د وخت ویجټونه ټاکل شوي ساعت ته اړتیا لري؛ Wi-Fi یې ټاکي."
