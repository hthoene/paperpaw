notes-overview.plugin.description = د ټولو کتابونو کتابنښې او برجسته متنونه په یوه لیست کې، او د My Clippings.txt په توګه صادرول.
notes-overview.plugin.how = "«ټول یادښتونه» هر هغه کتاب لیست کوي چې په کې تاسو کتابنښه یا برجسته متن جوړ کړی، له شمېر سره. دا په وسایلو کې پرانیزئ. یو کتاب وټاکئ چې یادښتونه یې وګورئ، او یو یادښت چې کتاب په هماغه ځای کې پرانیزئ.\n\nد لیست په پای کې، «د My Clippings.txt په توګه صادرول» ټول یادښتونه په یوه دوتنه کې، د کتابتون تر څنګ په Exports پوښۍ کې، په هغې بڼه کې چې Kindle یې کاروي (UTF-8) لیکي. هغه اپلیکیشنونه چې د Kindle My Clippings.txt لولي، یې لوستلی شي. په یوه برجسته متن یادښت خپل ننوتنه ده، لکه په Kindle کې. ځکه چې دلته کتاب د Kindle موقعیتونه نه لري، «location» په کتاب کې د یادښت ځای دی، په سلنه کې. دوتنه هر ځل بیا لیکل کېږي؛ پخوانۍ بدلوي."
