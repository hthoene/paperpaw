file-manager.plugin.description = په وسیله کې هره پوښۍ او دوتنه: پرانیستل، نوم بدلول، خوځول، کاپي کول او ړنګول.
file-manager.plugin.how = "د دوتنو مدیر د وسیلې په ذخیره کې هره پوښۍ او دوتنه ښيي، نه یوازې ستاسو کتابونه، او تاسو ته اجازه درکوي چې یې پرانیزئ، نوم یې بدل کړئ، وخوځوئ، کاپي یې کړئ او ړنګ یې کړئ او نوې پوښۍ جوړې کړئ.\n\nله وسایلو مینو څخه «دوتنې» پرانیزئ. یوه پوښۍ ټک کړئ چې ورننوځئ؛ شاته پورتنۍ پوښۍ ته ځي. یوه دوتنه ټک کړئ، یا هره ننوتنه ونیسئ (له تڼیو سره، غوره کول ونیسئ)، چې وګورئ ورسره څه کېدلی شي. خوځول او کاپي کول ننوتنه غوره کوي: هغه پوښۍ ته لاړ شئ چې هغه ورته تړاو لري او په ښکته کې په پټه کې «دلته ورکول» وټاکئ. له تڼیو سره، له وروستۍ ننوتنې څخه ښکته کېکاږئ چې پټې ته ورسېږئ.\n\nهغه دوتنې او پوښۍ چې په ټکي پیلېږي، لکه د PaperPaw خپل معلومات، پټې دي. د دوی د لیدلو لپاره په ترتیباتو کې، د کتابتون لاندې، «پټې دوتنې» چالان کړئ."
