aids.plugin.name = د لوست مرستې
aids.plugin.description = د کلمو غټ پیلونه، بدل شوې کلمې، انځورونه: متن لکه څنګه چې تاسو یې غواړئ.
aids.plugin.how = "د لوست مرستې بدلوي چې د کتاب متن د لوست پر مهال څنګه ښکاري. دا په هر کتاب پلي کېږي. د کلمو غټ پیلونه او کلمې بدلول لومړی بند دي.\n\nتاسو یې په ترتیباتو کې، د لوست لاندې، د «د لوست مرستې» برخه کې موندلی شئ. «د کلمو غټ پیلونه» د هرې کلمې لومړۍ نیمايي غټه کوي، چې ځینو ته د تعقیب کول اسانه دي. «کلمې بدلول» هغه جوړې اخلي چې داسې لیکل شوي وي «رنګ = کلر؛ ښاغلی = جناب»، په نیمه ټکي (؛) جلا شوي.\n\nیوازې بشپړې کلمې بدلېږي، دقیقاً لکه څنګه چې تاسو لیکلې، نو یوه لنډه کلمه هېڅکله د اوږدې کلمې برخه نه بدلوي. د کتاب دوتنه پخپله نه بدلېږي.\n\nپه کتابونو کې انځورونه ښودل کېدلی شي (لکه په پیل کې)، په یوه لنډه کرښه بدلېدلی شي لکه «[انځور: په سمندر کې یوه بېړۍ]» چې د انځور تشریح کاروي، یا پرېښودل کېدلی شي. بیا پاڼه د متن لپاره ډېر ځای لري، او د هغه انځور لپاره چې نه ښودل کېږي هېڅ نه ډیکوډ کېږي، چې پاڼې ګړندۍ اړوي. کامیکس او نور کتابونه چې له انځورونو جوړ دي نه بدلېږي."
