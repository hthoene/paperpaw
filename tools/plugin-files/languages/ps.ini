files.plugin.description = په وسیله کې کتابونه او پوښۍ لیست کوي او یې پرانیزي.
files.plugin.how = "کتابتون ستاسو په کتابتون پوښۍ کې کتابونه لیست کوي، هر یو له خپل پوښ، سرلیک، لیکوال او دې سره چې تاسو څومره لوستی دی. هغه کتاب چې تاسو وروستی لوستی په سر کې د کارت په توګه ولاړ دی، نو د لوست ادامې لپاره یو ټک، یا د غوره کولو یو فشار بس دی. کله چې کتابتون کتابونه لټوي، وايي چې تر اوسه یې څو موندلي.\n\nوټاکئ چې د کتابونو پر سر څه ښودل کېږي: ټول، هغه چې لولئ، ناولوستل شوي یا لوستل شوي، یا ټولګې (د لیکوال، لړۍ، ټګ، خوښو له مخې، د هرې پیل شوې لړۍ راتلونکی کتاب). یو کتاب ټک کړئ چې ولولئ؛ یې ونیسئ (له تڼیو سره، غوره کول ونیسئ) چې یې پرانیزئ، د لوستل شوي یا ناولوستل شوي په توګه یې نښه کړئ، معلومات یې وګورئ، آرشیف ته یې ولېږئ یا یې ړنګ کړئ. د کتابتون مینو لپاره سرلیک ټک کړئ: کتابونه څنګه ترتیبېږي او ښودل کېږي، لټون، د کتابتون پوښۍ او ترتیبات.\n\nد کتابتون پوښۍ په ترتیباتو کې، د کتابتون لاندې، د «د کتابتون پوښۍ» په توګه ټاکل کېږي؛ هلته تاسو کولی شئ کتابونه د پوښونو د جال په توګه هم وښایئ. د هرې بلې دوتنې لپاره، د وسایلو په مینو کې «دوتنې» وکاروئ."
