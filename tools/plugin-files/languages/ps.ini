wifi.plugin.description = د اړتیا پر مهال له Wi-Fi شبکو سره وصلېږي او وروسته راډیو بندوي.
wifi.plugin.how = "Wi-Fi هغه وخت له یوې شبکې سره وصلېږي چې یو پلګین انټرنېټ ته اړتیا ولري (یو کتلاګ، همغږي، پلورنځی، لېږد)، او راډیو بیا یوه دقیقه وروسته بندوي چې هېڅ یې ونه کاروي، یا سمدلاسه کله چې کور پرده یا یو کتاب ښکاره شي، ترڅو بېټرۍ او حافظه وسپموي.\n\nWi-Fi له ترتیباتو، یا د حالت په کرښه کې د Wi-Fi له توکي پرانیزئ. «شبکې» هغه شبکې لیست کوي چې په لاسرسي کې دي؛ یوه وټاکئ او پټنوم یې ولیکئ، یا «له تلیفون سره جوړول» وټاکئ او نوم او پټنوم د وسیلې پرځای د خپل تلیفون په براوزر کې ولیکئ. «هېرول» یوه خوندي شوې شبکه لرې کوي.\n\nپټنومونه په کارت کې په خوندي ډول پاتې کېږي، او بیا هېڅکله نه ښودل کېږي. د «د اړتیا پر مهال وصلېدل» لاندې تاسو ټاکئ چې Wi-Fi له وروستۍ کارونې وروسته څومره وخت چالان پاتې شي، ایا د چارج پر مهال چالان پاتې شي، او کله چې څو شبکې په لاسرسي کې وي کومه خوندي شوې شبکه لومړی راځي."
