picture-home.plugin.how = "انځورېزه کور پرده د کور پردې ځای نیسي کله چې چالانه وي: ستاسو خپل انځور د ویجټونو شاته، او د ویجټونو او وسایلو پاڼې چې تاسو یې ترتیبوئ. په پلګین مدیر کې یې بنده کړئ او جوړه شوې کور پرده بېرته راځي، له خپلو پاڼو سره.\n\nانځورونه (JPEG، PNG یا GIF) په کارت کې په یوې پوښۍ کې (په ډیفالټ wallpapers) کېږدئ، بیا یو په ترتیباتو، دودیزول، انځورېزه کور پرده کې وټاکئ. «برابرول» وايي چې دا پرده څنګه ډکوي (ډکول، بشپړ انځور، غځول، اصلي اندازه، ټایل)، «موقعیت» کوم برخه پاتې کېږي، «زوم» څومره لوی، او «انځور روښانه کول» څومره کمرنګ: کمرنګ انځور ویجټونه ښه لوستلی کوي. انځور د هرې پردې اندازې لپاره یو ځل چمتو کېږي، چې یو څه وخت نیسي.\n\nویجټونه د انځور پر سر په پلیټونو ولاړ دي. پاڼه لکه په جوړه شوې کور پرده کې ترتیب کړئ: د پاڼې لاندې قلم، یا په مینو کې «کور پرده سمول».\n\nد حالت پټه (وخت، Wi-Fi، بېټرۍ، یا هغه چې تاسو یې وټاکئ) کېدای شي چالانه، بنده یا اتومات وي، په سر یا ښکته کې، بشپړ پلنوالی یا کوچنی ګولۍ په چپ، منځ یا ښي کې، په روښانه، تیاره یا خړ پلیټ یا پخپله په انځور. هغه کرښه چې تڼۍ نومول کېږي (په X4 کې) هم کېدای شي چالانه، بنده یا اتومات وي. اتومات معنا لري چې د تڼۍ فشار یې د څو ثانیو لپاره ښيي؛ هغه فشار بل څه نه کوي.\n\n«د انځور ښودنه» وايي چې انځور څنګه انځورېږي: «خړ کچې» په هر خړ رنګ کې چې پرده یې لري (په X4 کې ورو)، «ټکي‌دار» په تور او سپین ټکو (ګړندی)، یا «اتومات»، لکه جوړه شوې کور پرده: کله چې پرده انځورېږي خړ کچې، له لومړي بدلون وروسته ټکي. چېرته چې پرده خړ کچې نه لري، خړ کچې ټکو ته راګرځي."
