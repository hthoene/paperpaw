format-html.plugin.description = د دوتنو په توګه خوندي شوې ویب پاڼې پرانیزي، یوازې هغه ښيي چې باید ولوستل شي.
format-html.plugin.how = "د دوتنو په توګه خوندي شوې ویب پاڼې (.html، .htm، .xhtml) د کتابونو په توګه پرانیزي: یوازې هغه چې د لوستلو لپاره دي، پرته له مینوګانو، اعلانونو او ورته شیانو چې شاوخوا یې وي.\n\nدوتنه د کتابتون په پوښۍ کې کېږدئ او له کتابتون څخه یې لکه هر کتاب پرانیزئ. په پاڼه کې لینکونه کار کوي؛ انځورونه هلته ښکاري چېرته چې په دوتنه کې دي."
