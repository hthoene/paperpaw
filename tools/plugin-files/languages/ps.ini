format-txt.plugin.name = ساده متن
format-txt.plugin.description = ساده متن دوتنې (.txt) پرانیزي.
format-txt.plugin.how = "ساده متن دوتنې (.txt) له کتابتون څخه لکه هر کتاب پرانیستل کېږي، پرته له کومې جوړونې. پلګین د UTF-8، UTF-16 او Windows-1252 متن لولي او کوډ پخپله پېژني.\n\nپیراګرافونه د دوتنې د تشو کرښو تعقیبوي؛ که یوه دوتنه هېڅ نه لري، هره کرښه یو پیراګراف دی. د Project Gutenberg په دوتنو کې د پیل او پای د جواز متن پرېښودل کېږي، او سرلیک او لیکوال د سر څخه اخیستل کېږي.\n\nدوتنه هېڅکله بشپړه نه پورته کېږي، نو ډېر لوی متنونه هم په کوچنیو وسیلو کې پرانیستل کېږي."
