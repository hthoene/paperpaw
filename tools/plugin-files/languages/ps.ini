plugin-manager.plugin.description = پلګینونه لیست کوي او چالانوي یا بندوي یې.
plugin-manager.plugin.how = "د پلګین مدیر هر پلګین له نسخې او تشریح سره لیست کوي، او پلګینونه چالانوي او بندوي.\n\nدا په ترتیباتو کې د «پلګینونه اداره کول» په توګه ومومئ. «د پلګینونو ترتیبات» جلا پاڼه ده د ترجیحاتو لپاره لکه د هر پلګین د شبکې کارونه. یو پلګین ټک کړئ چې چالان یا بند شي (له تڼیو سره، یې وټاکئ). بدلون له بیا پیل وروسته پلي کېږي: په ښکته کې پټه بیا «اوس بیا پیل» وړاندې کوي. یو پلګین ونیسئ (له تڼیو سره، غوره کول ونیسئ) چې ولولئ دا څنګه کار کوي.\n\nهغه پلګین چې «تل چالان» نښه شوی نه شي بندېدلی، او هغه چې «اړین» نښه شوی یوازې هغه وخت چې بل پلګین خپل کار پر مخ وړي، که نه PaperPaw به بېرته لاره نه لري. د «پردو» لاندې تاسو وټاکئ چې کوم پلګین یو ځای ښيي چې ډېر یې وړاندې کوي."
