format-images.plugin.how = "انځورونه (.jpg، .png، .gif) له کتابتون څخه لکه کتابونه پرانیستل کېږي، په هره پاڼه کې یو انځور، د پردې سره برابر.\n\nد انځورونو یوه بشپړه پوښۍ لوستلو لپاره، لومړی انځور یې پرانیزئ: وروسته انځورونه په پوښۍ کې د نومونو په ترتیب (2 له 10 مخکې) تعقیبېږي. په پوښۍ کې وروسته انځور له هغه ځایه پیلېږي؛ په هر یو کې ځای جلا په یاد ساتل کېږي. د تر 300 انځورونو پوښۍ له هغه ځایه لوستل کېږي چې تاسو یې پرانیزئ.\n\nیوه دوتنه چې انځور نه وي، یا ډېره لویه وي، پرځای یې خپل نوم ښيي. د ډېرو انځورونو کتاب لپاره چې خپل سرلیک ولري، د کامیک آرشیف (.cbz) ښه بڼه ده."
