home.plugin.name = کور پرده
home.plugin.description = پیل پاڼه: د ویجټونو پاڼې، لکه هغه کتاب چې لوستل کېږي او وسایل.
home.plugin.how = "کور پرده له پاڼو جوړه ده، هره یو د ویجټونو او وسایلو جال لکه په تلیفون کې. په پیل کې ساعت، هغه کتاب چې تاسو یې لولئ او وروستي لوستل شوي کتابونه په یوې پاڼې کې دي، او ټول وسایل په راتلونکې کې.\n\nیو توکی ټک کړئ چې یې پرانیزئ، او سوایپ کړئ یا د پاڼې تڼۍ وکاروئ چې پاڼې بدلې کړئ. یوازې له تڼیو سره، غشي تڼۍ له یو توکي څخه بل ته ځي او غوره کول یې پرانیزي.\n\nچې بیا یې ترتیب کړئ، کور پرده ونیسئ، د پاڼې لاندې قلم ټک کړئ یا په مینو کې «کور پرده سمول» وټاکئ. توکي وکاږئ چې یې وخوځوئ یا یو ټک کړئ د هغه د اختیارونو لپاره، له تڼیو سره هم. «ویجټ زیاتول» هم هلته دی. ستونونه او کرښې په ترتیباتو کې، د ښکارېدنې لاندې، د کور پردې برخه کې دي.\n\nپه یوې پردې کې چې په اړخ اړول شوې، کور پرده همدا توکي له ډېرو ستونونو سره ښيي، هره پاڼه د بلې مخکې ډکه، او کارتونه تر نژدې 110 mm نه پلنېږي؛ هغه څه چې تاسو ولاړ ترتیب کړي نه بدلېږي. که یې په اړخ ترتیب کړئ، دا ترتیب د هغه لوري لپاره په جلا توګه ساتل کېږي: نوي ویجټونه دواړو ته زیاتېږي. په «زیاتول» کې (د سمولو پر مهال) «د اړخ ترتیب بېرته ټاکل» ترلاسه شوي ترتیب ته ځي. په یوه لوري کې د ویجټ یا وسیلې لرې کول له بل څخه یې نه لرې کوي."
