update.plugin.name = تازه کېدنه
update.plugin.description = د فرم‌ویر تازه کېدنې نصبوي، له کارت یا له انټرنېټ څخه ښکته شوې.
update.plugin.how = "تازه کېدنه نوی فرم‌ویر نصبوي، په هغو وسیلو کې چې PaperPaw فرم‌ویر دی، لکه X4. تاسو یې په ترتیباتو کې د «تازه کېدنې» په توګه موندلی شئ.\n\n«آنلاین لټون» د تازه کېدنې له سرور څخه د نوي PaperPaw پوښتنه کوي او ښکته یې کوي، چې د Wi-Fi له لارې څو دقیقې نیسي. یا د تازه کېدنې دوتنه (چې په .bin پای ته رسېږي، له paperpaw.org څخه) په کارت کې په updates پوښۍ کې کاپي کړئ، د مثال په توګه د Wi-Fi لېږد سره. «نصبول» بیا نژدې یوه دقیقه نیسي او وسیله بیا پیلېږي؛ کتابونه، ترتیبات او د لوست ځایونه پاتې کېږي.\n\nد «تازه کېدنې لټول» سره (په ترتیباتو کې، په پیل کې بند)، وسیله نژدې هره اونۍ یو ځل پخپله پوښتي، یوازې کله چې Wi-Fi بیا هم چالان وي یا چارجېږي. یو نوی PaperPaw چې موندل کېږي دلته انتظار باسي؛ هېڅ شی ستاسو لوست نه ګډوډوي. لټون هغه څه لېږي چې وسیله پکې چلېږي، نه د هغې نوم او نه شمېره؛ د وسیلو د شمېرلو لپاره، دا هم چې تاسو پوښتنه کړې او دا د ورځې، اونۍ یا میاشتې لومړی لټون دی که نه.\n\nکه هغه پلګینونه چې تاسو یې کاروئ د نوې نسخې لپاره لا نسخه نه لري، تازه کېدنه د هغوی انتظار باسي. زړه نسخه یوازې هغه وخت نصبېږي چې تاسو یې وټاکئ.\n\nبل فرم‌ویر، لکه CrossPoint، له دلته هم نصبېږي: د هغه دوتنه (چې په .bin پای ته رسېږي) په updates پوښۍ کې کېږدئ، او «تازه کېدنه» پرانیزئ. PaperPaw ګوري چې دا د دې وسیلې لپاره بشپړ، ناخراب فرم‌ویر دی، خو نه شي ویلی چې چا جوړ کړی، ځکه چې لاسلیک شوی نه دی. «بیا هم نصبول» یې د فلش په بلې نیمايي کې لیکي، او وسیله یې پیلوي؛ PaperPaw په خپله نیمايي کې پاتې کېږي تر هغه چې دا فرم‌ویر په هغې باندې یو څه نصب کړي. وروسته PaperPaw ته د بېرته راتګ لپاره، د هغه نصبولو دوتنه (paperpaw-<device>-<version>-install.bin) د بل فرم‌ویر له مینو څخه نصب کړئ، لکه د CrossPoint SD فرم‌ویر تازه کېدنه."
