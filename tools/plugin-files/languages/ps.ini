smart-home.plugin.name = هوښیار کور
smart-home.plugin.description = ستاسو له خپل Home Assistant څخه ارزښتونه او سویچونه په یوه ډشبورډ کې او د کور پردې ویجټونو په توګه. په کورنۍ شبکه کې له Home Assistant سره کار کوي.
smart-home.plugin.how = "هوښیار کور ستاسو له خپل Home Assistant څخه ارزښتونه او سویچونه ښيي: تودوخې، رطوبت، انرژي، دروازې او کړکۍ، څراغونه، سویچونه او صحنې. دا ستاسو سرور سره د هغه د REST API له لارې په کورنۍ شبکه کې خبرې کوي؛ هېڅ بله خدمت نه پکې ښکېل دی.\n\nهوښیار کور د وسایلو له مینو څخه پرانیزئ، بیا «اړیکه»: د خپل Home Assistant پته (د بېلګې په توګه http://homeassistant.local:8123) او اوږده مهاله د لاسرسي ټوکن ولیکئ (یو د خپل Home Assistant په پروفایل پاڼه ښکته جوړ کړئ). ټوکن له پټنومونو او کیلیو سره ساتل کېږي، هېڅکله په ترتیباتو دوتنه کې نه. ساده http یوازې ستاسو د کورنۍ شبکې د پتو لپاره کارول کېږي؛ د بل ځای سرور لپاره په ترتیباتو کې «له کورنۍ شبکې بهر سرورونه» چالان کړئ او معتبر سند سره https وکاروئ.\n\n«وسایل ټاکل» د هغه لیست پرانیزي چې ستاسو سرور لري: په نوم یا id لټون وکړئ او یو وسیله وټاکئ چې ښودل شي (بیا یې وټاکئ چې لرې شي). تاسو کولی شئ ورته یوه خونه ورکړئ، چې دا په ډشبورډ او د خونې ویجټونو کې ډلبندي کوي. تر 24 وسیلو ساتل کېږي. په ډشبورډ کې یو څراغ، سویچ یا صحنه وټاکئ چې بدل شي: کرښه د سرور ځواب ښيي. یو سېنسر چې تاسو یې ټاکئ بیا لوستل کېږي.\n\nویجټونه (کور پرده ونیسئ، بیا ویجټ زیات کړئ): «هوښیار کور ارزښت» یو لوست لوی ښيي، «ډله» د یوې خونې وسایل لیست کوي، «سویچ» د یوه څراغ یا سویچ لپاره تڼۍ ده، او «خونه» یو کارت دی د یوې خونې لوستنو او سویچونو سره. د هر ویجټ ترتیبات وايي چې کوم وسیله یا خونه ښيي.\n\nکور لوستل کېږي کله چې ډشبورډ پرانیزئ، کله چې وغواړئ (د «اوس تازه کول» کرښه یا په ارزښت یا ډلې ویجټ ټک)، کله چې لوستونکی ویښېږي چېرته چې Wi-Fi لا وصل دی، او په هغه مهالوېش چې تاسو یې ټاکئ تر څو چې چارجر لګېدلی وي. دا بېسیم هېڅکله پخپله نه چالانوي او هېڅکله یې چالان نه ساتي."
