notes-vault.plugin.name = د یادښتونو خزانه
notes-vault.plugin.description = د Markdown یادښتونو پوښۍ د پوښیو، ټګونو او وروستیو بدلونونو له مخې لولي، د کور پردې لپاره ویجټونو سره. له Obsidian خزانو سره کار کوي.
notes-vault.plugin.how = "د یادښتونو خزانه د Markdown یادښتونو پوښۍ لولي (ساده .md دوتنې، لکه څنګه چې د یادښتونو اپلیکیشنونه یې ساتي). دا له Obsidian خزانو سره کار کوي.\n\nد خزانې پوښۍ په ترتیباتو کې، یا د خزانې په پاڼه کې په وسایلو کې وټاکئ. بیا پاڼه پوښۍ لکه څنګه چې په کارت کې دي، وروستي بدل شوي یادښتونه، ټګونه، او د یادښتونو په سرلیکونو کې لټون وړاندې کوي.\n\nلومړی ځل، خزانه په شاليد کې ایندېکس کېږي تر څو چې د هغې پاڼه پرانیستې وي؛ د زرګونو یادښتونو خزانه څو دقیقې نیسي، بیا سمدلاسه پرانیستل کېږي. ایندېکس په کارت کې ساتل کېږي او کله چې د خزانې پاڼه د څو ساعتونو وروسته پرانیستل شي، یا کله چې «تازه کول» وټاکئ، بیا جوړېږي.\n\nیو یادښت په لوستونکي کې پرانیستل کېږي. نورو یادښتونو ته لینکونه ([[Note]]، [[Note|words]]، [[Note#Heading]]) د یادښت د نوم له مخې په خزانه کې هر ځای موندل کېږي؛ یو تعقیبول هغه یادښت پرانیزي، او شاته بېرته مخکني یادښت ته ځي.\n\nپه خزانه کې هېڅ شی هېڅکله نه بدلېږي. د کور پردې ویجټونه (وروستي یادښتونه، یو ټاکل شوی یادښت، د ورځې یادښت، تصادفي یادښت، ټګونه، لټون) د کور پردې په سمونکي کې زیاتېږي. یو ویجټ کولی شي خپل یادښتونه یوازې له یوې پوښۍ اخیستلی شي: د پوښۍ لار د کارت له ریښې (د بېلګې په توګه Notes/Work) د ویجټ په ترتیباتو کې ولیکئ؛ که تش پرېښودل شي، د خزانې ټول یادښتونه اخلي."
