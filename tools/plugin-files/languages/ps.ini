lock.plugin.description = د وسیلې د ویښېدو پر مهال PIN، نمونه یا پټنوم؛ د لوست پر مهال لمس قفل.
lock.plugin.how = "د پردې قفل د PaperPaw د پیل او د وسیلې د ویښېدو پر مهال PIN، نمونه یا پټنوم غواړي. دا لومړی بند دی. دا یوازې عادي کارونه ساتي: کوډ او د غلطو هڅو شمېر په SD کارت کې ساتل کېږي، نو هر څوک چې کارت وباسي، سم یې کړي یا یې بدل کړي، له قفل څخه تېرېږي.\n\nدا په ترتیباتو کې، د وسیلې لاندې، د پردې قفل کې جوړ کړئ: که کوډ شته وي، اوسنی کوډ ولیکئ، ډول وټاکئ، بیا نوی کوډ دوه ځله ولیکئ. نمونه یوازې په لمسي پردو کې وړاندې کېږي.\n\nله پنځو غلطو هڅو وروسته راتلونکې نیمه دقیقه انتظار کوي. «اوس قفل کول» سمدلاسه قفلوي او په تڼۍ، اشاره یا قاعده کې ایښودل کېدلی شي. «د ویښېدو وروسته قفل کول» بندېدلی شي، چې یوازې ریښتینی پیل (چالانول یا بیا پیل) قفل کړي، پرته له هغه ځای چې هر ویښېدل پیل وي، لکه په X4 کې په بېټرۍ.\n\nد دې تر څنګ د لمس قفل: په چټک پینل او د لوست مینو کې «لمس قفلول» ټک، سوایپ او قلم هېڅ نه کوي پداسې حال کې چې تڼۍ بیا هم کار کوي، لکه په پرده د لاس سره لوستلو لپاره. د خلاصولو لپاره، په یوې ګوتې دوه ځله ټک کړئ او یې یو شېبه کښېنوئ؛ د چالان/بند تڼۍ نیول د چالان/بند مینو پرانیزي، چېرته چې «لمس خلاصول» دا د تڼیو سره کوي؛ په X4 Pro کې د کور تڼۍ نیول سمدلاسه خلاصوي."
