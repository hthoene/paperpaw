power.plugin.description = د بریښنا حالت ټاکي، په لاس یا د بېټرۍ له مخې: عادي، سپما، آفلاین.
power.plugin.how = "بریښنا ټاکي چې PaperPaw بېټرۍ څنګه مصرفوي: عادي، سپما یا آفلاین. سپما هغه څه چې انتظار کولی شي په ښو وختونو کوي؛ آفلاین بېسیم بند ساتي. اتومات د بېټرۍ له مخې ټاکي.\n\nحالت په چټک پینل کې بدل کړئ، چېرته چې «بریښنا» حالتونه یو د بل تر څنګ ښيي، یا په ترتیباتو کې د بریښنا لاندې. هلته تاسو هغه کچې هم ټاکئ چې اتومات سپما ته او آفلاین ته بدلېږي، او دا چې کله چارجېږي عادي پاتې کېږي که نه.\n\nپه د حالت کرښو کې، «د بریښنا حالت» د سپما پر مهال یوه پاڼه او د آفلاین پر مهال د کرښې کړی Wi-Fi ښيي، او په عادي کې هېڅ.\n\nد چالان/بند تڼۍ ونیسئ چې یو کوچنی مینو پرانیستل شي: خوب، بندول (چېرته چې PaperPaw کولی شي)، بیا پیل، او په لمسي وسیلو کې «لمس قفلول» یا «لمس خلاصول». لنډ فشار لا هم وسیله خوب ته وړي. شاته مینو پرېږدي."
