setup.end.help = کتابونه د کمپیوټر په مرسته په وسیله کې په «/books» پوښۍ کې کېږدئ، یا یې د Wi-Fi له لارې له تلیفون یا کمپیوټر څخه ولېږئ (وسایل، د Wi-Fi لېږد). کتلاګونه هم دوی راوړي، او Calibre چېرته چې زیات شوی. هر هغه څه چې دلته ټاکل شوي په ترتیباتو کې بدلېدلی شي.
