store.plugin.name = د پلګینونو پلورنځی
store.plugin.description = د دې وسیلې لپاره پلګینونه مومي، نصبوي، تازه کوي او لرې کوي.
store.plugin.how = "د پلګینونو پلورنځی په انټرنېټ کې د دې وسیلې لپاره پلګینونه مومي او هغوی نصبوي، تازه کوي او لرې کوي. له وسایلو څخه یې پرانیزئ؛ دا Wi-Fi ته اړتیا لري.\n\nپیل ښيي چې کتابتون څه وړاندیز کوي، څه نوي یا اوس مشهور دي، بیا ډلې. یوه ډله خپل پلګینونه په یو عادلانه ګډوډۍ کې لیست کوي چې هره ورځ بدلېږي، چې هر پلګین ولیدل شي؛ دوی له ا تر ی ترتیب کړئ، د نوي یا وروستي تازه کېدو له مخې، او په اوږدو لیستونو کې یو توري ته لاړ شئ. یو پرانیزئ چې د هغه پاڼه د اندازې او هغه حافظې سره وګورئ چې نیسي، بیا «نصبول»، «تازه کول» یا «لرې کول» وټاکئ. «ټول تازه کول» هر نصب شوی پلګین تازه کوي.\n\nکوډ پلګینونه د وسیلې بشپړ لاسرسي سره چلېږي: پلورنځی دا وايي او لومړی پوښتي، او دوی له بیا پیل وروسته پیلېږي. که یو بد شي، PaperPaw پرته له کوډ پلګینونو پیلېږي او وايي کوم یو. «د پلګینونو کتابتون» ټاکي چې لیست له کوم ځایه راځي.\n\n«ټولنیز پلګینونه»، په ترتیباتو، سیسټم کې، هغه پلګینونه هم لیست کوي چې نورو په GitHub کې خپاره کړي. هېچا نه دي کتلي: دوی د «ناکتل شوي» په توګه نښه شوي، د کوډ پلګین پاڼه هغه کیلي ښيي چې پرې لاسلیک شوی، او هغه تازه کېدنه چې په بلې کیلي لاسلیک شوې نصب نه کېږي.\n\n«سرچینې»، د پیل وروستۍ کرښه، د نورو پلګین لیستونه د هغوی په پتې (https://…/plugins.json) زیاتوي، یو له هغو د PaperPaw پرځای لیست کوي، یا یې لرې کوي. د لیکلو پرځای، یوه دوتنه sources.txt له یوې پتې سره په هره کرښه کې په کارت کې .paperpaw/plugins/store کې کېږدئ: پتې د «سرچینو» لاندې د نوي په توګه ښکاري. PaperPaw سرچینه یا د هغې پلګینونه نه ازمايي، او وسیله د سرچینې له سرور سره اړیکه نیسي. یوه سرچینه خپل لیست لاسلیک کوي؛ وسیله د لومړي لوستل شوي لیست کیلي ساتي او له هغه وروسته یوازې هغه لیستونه او کوډ پلګینونه مني چې په هغه کیلي لاسلیک شوي. یو پلګین خپلې تازه کېدنې یوازې له هغې سرچینې ترلاسه کوي چې له هغې نصب شوی. د PaperPaw خپل کتابتون تل دلته دی او نه شي لرې کېدلی؛ د پلورنځي پرېښودل بېرته هغې ته ځي."
