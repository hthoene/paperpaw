rules.plugin.name = قاعدې
rules.plugin.description = کله چې یو څه پېښ شي، یو څه کوي: لکه په 22:00 کې شپنی حالت.
rules.plugin.how = "یوه قاعده پخپله یو څه کوي کله چې یو څه پېښ شي: هره ورځ په 22:00 کې شپنی حالت چالان، یا کتلاګونه همغږي کېږي کله چې PaperPaw پیلېږي.\n\nقاعدې په ترتیباتو کې د دودیزولو لاندې، د «قاعدې» په توګه دي. «قاعده زیاتول» پوښتي «کله؟» (PaperPaw پیلېږي، د ورځې یو وخت، یو کتاب پرانیستل یا تړل کېږي، بېټرۍ، چارج کول، یو سویچ او نور) او «بیا څه؟» (یو عمل چلول، یو سویچ چالانول یا بندول، یوه شمېره ټاکل، یو پیغام ښودل). یوه قاعده ټک کړئ چې ودرول شي؛ یې ونیسئ (له تڼیو سره، غوره کول ونیسئ) د یوې شرط لپاره لکه «د ورځې د دوو وختونو ترمنځ»، یا د لرې کولو لپاره.\n\nهغه عملونه، سویچونه او شمېرې چې له هغو وټاکل شي د پلګین له مخې راځي: پلګین وټاکئ، بیا هغه څه چې راوړي؛ شاته بېرته وځي. یو عمل چې په ښودل شوې پرده کار کوي، لکه «شاته» یا «راتلونکې پاڼه»، هغه کوي چې هلته به یې کړي که فشار شي.\n\nوختونه پلي کېږي هر پرده چې پرانیستې وي. دوې قاعدې چې یو بل بېرته کوي څو ګامونو وروسته ودرېږي."
