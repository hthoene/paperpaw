pomodoro.plugin.how = "د Pomodoro ټایمر: په متمرکزو پړاوونو کې کار کوئ، بیا استراحت. دا هېڅ جوړونې ته اړتیا نه لري: 25 دقیقې تمرکز، 5 استراحت، او له څلورو پړاوونو وروسته د 15 اوږد استراحت.\n\nPomodoro د وسایلو له مینو څخه پرانیزئ او «پیل» کېکاږئ، یا د هغه ویجټونه کور پرده ته زیات کړئ (کور پرده ونیسئ، بیا ویجټ زیات کړئ): «Pomodoro ټایمر» پړاو او پاتې دقیقې ښيي، «Pomodoro پیل/وقفه» یوه تڼۍ ده، او «Pomodoro نن» هغه پړاوونه شمېري چې تاسو بشپړ کړي، له خپلې ورځنۍ موخې سره. په ټایمر ټک یې پیلوي یا ودروي؛ یې ونیسئ چې بشپړه پرده پرانیزئ.\n\nټایمر کله چې پرده پرېږدئ روان پاتې کېږي، او له بیا پیل وروسته د ساعت له مخې ادامه ورکوي. کله چې لوستونکی خوب وي هېڅ نه چلېږي: هغه پړاو چې په دې کې پای ته رسېدلی د ویښېدو پر مهال ویل کېږي. یوه یادونه ووايي چې کله پړاو پای ته رسېدلی. د بېټرۍ د ساتلو لپاره ساعت په هره دقیقه یو ځل تازه کېږي (په بشپړه پرده کې په وروستۍ دقیقه کې هر لس ثانیې) او لوستونکی هېڅکله ویښ نه ساتي.\n\nپه ترتیباتو کې د Pomodoro لاندې تاسو اوږدوالی او د یوې ټولګې پړاوونه ټاکئ، او دا چې راتلونکی پړاو پخپله پیلېږي که نه. د «نور» لاندې: کله چې پړاو پای ته ورسېږي د پردې ځلېدل یا د مخکینۍ رڼا چمکېدل او ورځنۍ موخه."
