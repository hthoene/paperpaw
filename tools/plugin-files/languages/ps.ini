keyboard.plugin.name = کیبورډ
keyboard.plugin.description = په پرده کې متن ننوځي، په لمس یا د تڼیو سره.
keyboard.plugin.how = "کیبورډ هر کله پرانیستل کېږي چې یو څه متن ته اړتیا ولري: لټون، پټنوم، یادښت یا ترتیب. دا په لمس او یوازې له تڼیو سره کار کوي.\n\nله تڼیو سره، چپ او ښي د یوې کرښې په اوږدو کې ځي، د پاڼې تڼۍ د کرښو ترمنځ ځي، غوره کول یوه تڼۍ فشاروي او شاته لغوه کوي؛ چپ او ښي د یوې کرښې شاوخوا ګرځي، او پورته او ښکته ستاسو په ستون کې پاتې کېږي. «شفټ» راتلونکی توری لوی کوي؛ دوه ځله یې کېکاږئ د ټولو لپاره، او یو ځل بیا چې ودرېږي. یو توری ونیسئ (له تڼیو سره: په هغه باندې غوره کول ونیسئ) د هغه د لوی بڼې لپاره، سمدلاسه ټاکل شوی، او تلفظ نښې لکه é او è؛ په جرمني کې، ä، ö، ü او ß همداسې له a، o، u او s څخه راځي (له تڼیو سره، کیبورډ دا په هغو تورو وايي). «OK» پای ته رسوي؛ له تڼیو سره، شاته ونیسئ چې له هر ځای څخه پای ته ورسوئ (یوازې شاته لغوه کوي)، یا په یوې تڼۍ چې توری نه وي غوره کول ونیسئ. «ورکول» د کلیپ‌بورډ متن ننباسي، او «تلیفون»، چېرته چې وړاندې شي، تاسو ته اجازه درکوي پرځای یې په خپل تلیفون ولیکئ.\n\nپه ترتیباتو کې د وسیلې، کیبورډ لاندې: «د کیبورډ ترتیبونه» ترتیبونه ټاکي. په ډیفالټ د مینو ژبه تعقیبوي؛ له څو سره، یوه تڼۍ د هغوی ترمنځ بدلون راولي. «د امالې تڼۍ» پرځای د ä، ö، ü او ß خپلې تڼۍ ورکوي. «اندازه» تڼۍ او توري لوی کوي؛ یوازې له تڼیو سره، کرښې د کمپیوټر کیبورډ کرښې پاتې کېږي. په لمسي پردو کې، «د تڼۍ بڼه» بدلوي چې تڼۍ څنګه ښکاري. «اتومات لوی توري» هره جمله په لوی توري پیلوي."
