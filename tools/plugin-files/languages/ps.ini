format-cbz.plugin.how = "د کامیک کتابونو آرشیفونه (.cbz) پرانیزي: په هره پاڼه کې یو انځور، د پردې سره برابر، د نومونو په ترتیب (2 له 10 مخکې).\n\nدا د کتابتون په پوښۍ کې کېږدئ او له کتابتون څخه یې پرانیزئ؛ پاڼې لکه په هر کتاب کې واړوئ. لوی انځورونه لومړی ځل یو څه وخت نیسي، په X4 کې له نورو ځایونو ډېر.\n\nد لوست ترتیبات (ترتیبات، لوست): «پینل په پینل» په یوه وخت کې د پاڼې یو پینل ښيي، څومره چې پرده اجازه ورکوي لوی، او پاڼې اړول یې تېروي؛ هغه پاڼه چې پینلونه نه لري بشپړه ښودل کېږي. «د کامیک پاڼو لوري» د مانګا لپاره د پاڼو اړول عکس کوي (له ښي څخه چپ ته)؛ د کتاب خپل ComicInfo.xml دا پخپله وايي. کتابتون د ComicInfo.xml څخه د کتاب سرلیک او لړۍ او شمېره ښيي."
