stats.plugin.description = ثبتوي چې تاسو څومره وخت او څومره لولئ، له کېلنډر او د هر کتاب شمېرو سره.
stats.plugin.how = "د لوست احصایې ثبتوي چې تاسو هره پاڼه څومره وخت لولئ. تاسو یې د لنډې کتنې په توګه د نن، اونۍ او ستاسو د لړۍ سره، د کېلنډر په توګه، او د هر کتاب له شمېرو سره ګورئ.\n\nدا له وسایلو یا په لوستونکي کې له «نور» څخه پرانیزئ. په ترتیباتو کې، د لوست احصایو لاندې، تاسو کولی شئ «لوست ثبتول» بند کړئ، «ورځنۍ موخه» وټاکئ، او «لنډه پاڼه» او «اوږده پاڼه» وټاکئ چې شمېرل کېږي، نو پاڼې اړول یا پرانیستی پاتې کتاب شمېرې نه کوږوي.\n\n«له KOReader سره همغږي کول» احصایې له KOReader سره د WebDAV پوښۍ له لارې شریکوي. دا په همدې وسیله کې د KOReader احصایې هم اخلي. ثبتول ته اړتیا ده چې ساعت ټاکل شوی وي: چېرته چې نه وي، یو ځل له Wi-Fi سره وصل شئ."
