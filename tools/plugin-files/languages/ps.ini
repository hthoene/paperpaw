battery.plugin.description = بېټرۍ ثبتوي او ښيي چې څومره پایښت لري.
battery.plugin.how = "د بېټرۍ مصرف د وسیلې د ویښ پاتې کېدو پر مهال نژدې هر دقیقه چارج یادوي، له هغه څه سره چې وسیلې کړي: د پردې تازه کېدنې او اړولې پاڼې. له دې څخه محاسبه کوي چې یو ساعت ویښ او 100 پاڼې څومره مصرفوي، او بېټرۍ په دې سرعت څومره پایښت لري.\n\nد وسایلو له مینو څخه بېټرۍ پرانیزئ. دا اوسنی چارج، دا ځل ویښ وخت، تر اوسه په بېټرۍ مصرف او ستاسو وروستي ویښ وختونه ښيي. دا د پاڼې تڼیو سره، یا په پورتنیو غشو ټک کولو سره پاڼې اړوي.\n\nدا ته یو څه وخت په بېټرۍ لوست په کار دی چې شمېرې معنا ولري. ثبتول په ډیفالټ چالان دی او په ترتیباتو کې، د وسیلې، بریښنا لاندې، د «د بېټرۍ مصرف ثبتول» په توګه بندېدلی شي."
