profiles.plugin.description = د لوست او ښودنې ترتیباتو نومول شوې ټولګې، په یو ټک بدلېږي.
profiles.plugin.how = "یو پروفایل ستاسو د لوست ترتیبات، د ښودنې ترتیبات او د حالت کرښې د نوم لاندې ساتي، لکه «شپه» یا «لوی چاپ»، او په یو ټک یې بېرته راولي.\n\nپروفایلونه د لوست په مینو کې د «نور» لاندې، یا په ترتیباتو کې د دودیزولو لاندې پرانیزئ. یو پروفایل ټک کړئ چې وکارول شي؛ هغه چې په کارونه کې دی نښه شوی. یې ونیسئ (له تڼیو سره، غوره کول ونیسئ) چې اوسني ترتیبات په هغه کې خوندي کړئ، نوم یې بدل کړئ یا یې لرې کړئ. «د نوي پروفایل په توګه خوندي کول» هغه ساتي چې اوس ټاکل شوي.\n\n«راتلونکی پروفایل» په لیست کې راتلونکي ته بدلېږي؛ په تڼۍ یا قاعده کې یې کېږدئ."
