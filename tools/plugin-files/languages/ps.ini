tasks.plugin.name = دندې
tasks.plugin.description = د دندو لیستونه د نېټو او لومړیتوبونو سره، په لوستونکي کې یا له ستاسو د CalDAV سرور سره همغږي، د کور پردې ویجټونو سره.
tasks.plugin.how = "ستاسو په لوستونکي کې د دندو لیستونه: دندې د وروستۍ نېټې او لومړیتوب سره، چې کله بشپړې شي نښه کېږي. دوی پرته له جوړونې او شبکې کار کوي، او د CalDAV سرور (Nextcloud، Radicale، Baïkal، Fastmail او نور) سره سمون کېدلی شي، نو ورته لیستونه ستاسو په تلیفون او کمپیوټر کې دي.\n\nدندې د وسایلو له مینو څخه پرانیزئ. لومړۍ کرښه د ښودل شوي لیست نوم وايي؛ یې وټاکئ د بل لیست، د ټولو لیستونو «نن او ناوخته» لپاره، د نوي لیست لپاره، د همغږۍ یا د حساب د ټاکلو لپاره. «دنده زیاتول» کیبورډ پرانیزي. په یوې دندې غوره کول یې نښه کوي (بیا: نه ده بشپړه شوې). یوه دنده ونیسئ یا مینو کېکاږئ د هغې سرلیک، وروستۍ نېټه (نن، سبا، په یوې اونۍ کې، یا یوه نېټه چې تاسو ولیکئ لکه 2026-12-24) یا لومړیتوب بدلولو لپاره، یا یې لرې کولو لپاره. پرانیستې دندې لومړی راځي، د ورځې او بیا لومړیتوب له مخې؛ بشپړې شوې د یوې اونۍ لپاره په پای کې پاتې کېږي (په ترتیباتو کې د دندو لاندې ټاکل کېږي)، بیا لوستونکی پرېږدي.\n\nد کور پردې ویجټونه (کور پرده ونیسئ، بیا ویجټ زیات کړئ): «نن دندې» هغه ښيي چې نن رسېدلي یا ناوخته دي، «د دندو لیست» یو لیست ښيي، «پرانیستې دندې» یې شمېري، او «راتلونکې دنده» هغه ښيي چې راتلونکې باید وشي. په ویجټ کې په یوې دندې ټک یې نښه کوي؛ په سرلیک ټک لیستونه پرانیزي.\n\nد همغږۍ لپاره، د لیست په کرښه کې «د CalDAV حساب» وټاکئ او د سرور پته، ستاسو د کارونکي نوم او پټنوم (ښه د اپ پټنوم) ولیکئ. د سرور پته بس ده، لکه cloud.example.com/remote.php/dav؛ لوستونکی ستاسو د دندو لیستونه له هغه ځایه مومي. د سرور هر د دندو لیست په لوستونکي کې لیست کېږي. لوستونکی هغه وخت همغږي کوي چې تاسو دندې پرانیزئ، کله چې «اوس همغږي کول» وټاکئ، او کله چې شبکه بیا هم چالان وي؛ هغه څه چې پرته له شبکې بدل کړئ انتظار باسي او وروسته لېږل کېږي. که یوه دنده په لوستونکي او بل چېرته په ورته وخت کې بدله شوې وي، د سرور نسخه اخیستل کېږي او ستاسو یې د نوې دندې په توګه د هغې تر څنګ ساتل کېږي، نو هېڅ نه ورکېږي. یادښتونه، الارمونه او هر بل څه چې یوه دنده په سرور کې لري لکه څنګه چې دي پاتې کېږي. هغه دندې چې تکرارېږي ښودل کېږي خو هلته بدلېږي چېرته چې تاسو جوړې کړې. لوستونکی په 12 لیستونو کې تر 200 دندې ساتي."
