anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ستاسو په کمپیوټر کې د Anki رسېدلي کارتونه زده کوي او ځوابونه بېرته لېږي، د AnkiConnect اضافه له لارې.
anki.plugin.how = "Anki تاسو ته اجازه درکوي چې په لوستونکي کې هغه کارتونه زده کړئ چې ستاسو په کمپیوټر کې په Anki کې رسېدلي دي، او ستاسو ځوابونه بېرته لېږي. دا وړیا اضافه AnkiConnect کاروي (د اضافې کوډ 2055492159) او هېڅکله AnkiWeb نه کاروي. دا لومړی بند دی: له پلګین پلورنځي یې زیات کړئ.\n\nپه کمپیوټر کې: AnkiConnect په Anki کې نصب کړئ (Tools، Add-ons، Get Add-ons) او Anki بیا پیل کړئ. د همغږۍ پر مهال باید Anki پرانیستی وي.\n\nپه ډیفالټ AnkiConnect یوازې هغه کمپیوټر ته ځواب ورکوي چې په کې چلېږي (127.0.0.1)، نو لوستونکی ورته نه شي رسېدلی. Tools، Add-ons، AnkiConnect، Config پرانیزئ او «webBindAddress» په «0.0.0.0» وټاکئ (په کورنۍ شبکه کې اورېدل). پورټ، «webBindPort»، 8765 دی تر هغه چې یې ونه بدلوئ. که تاسو هلته «apiKey» ټاکئ، همدا کیلي دلته ولیکئ. د ترتیب بدلولو وروسته Anki بیا پیل کړئ، او که یې وپوښتل، Anki د کمپیوټر په فایروال کې اجازه ورکړئ. دا یوازې په هغه شبکه کې وکاروئ چې باور ورباندې لرئ: هر څوک چې پکې وي AnkiConnect ته رسېدلی شي، نو کیلي ښه ده.\n\nپه لوستونکي کې: Anki له وسایلو څخه پرانیزئ، بیا د کمپیوټر پته (د بېلګې په توګه 192.168.1.20) د «کمپیوټر» لاندې ولیکئ، پورټ که 8765 نه وي، او د API کیلي که تاسو یې ټاکلې وي. یوه ډیک وټاکئ، یا یې د ټولو ډیکونو لپاره تش پرېږدئ. بیا، په چالان Wi-Fi کې، «له Anki سره همغږي کول» وټاکئ: ستاسو انتظار کوونکي ځوابونه لومړی لېږل کېږي، بیا هغه کارتونه چې رسېدلي دي (او د نوو کارتونو شمېر چې تاسو ټاکلی) راوړل کېږي، تر 50 پورې. «زده کړه» وټاکئ چې پرته له شبکې یې تېر کړئ: ځواب وښایئ او د «بیا»، «سخت»، «ښه» یا «اسانه» په توګه یې ارزوئ. ستاسو ځوابونه په لوستونکي کې ساتل کېږي، له Wi-Fi پرته هم، او له راتلونکې همغږۍ سره Anki ته ځي. Anki پرېکړه کوي چې یو کارت کله بېرته راځي: هغه کارت چې تاسو په «بیا» ځواب کړی، په وروستۍ همغږۍ کې بیا راوړل کېږي کله چې Anki ووايي چې رسېدلی دی.\n\n«کله چې Anki پرانیستل شي همغږي کول»، په ترتیباتو کې، هر ځل چې تاسو پرده پرانیزئ همغږي کوي. هېڅ شی د تڼۍ د فشار پر مهال شبکه نه کاروي."
