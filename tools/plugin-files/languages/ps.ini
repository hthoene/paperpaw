koreader.plugin.description = د هغو کتابونو لپاره چې په دواړو کې لوستل کېږي، کتابنښې او برجسته متنونه له KOReader سره شریکوي.
koreader.plugin.how = "دا پلګین د هغو کتابونو لپاره چې تاسو په دواړو کې لولئ، په یوې وسیلې یا د کتابتون په پوښۍ کې چې د وسیلو ترمنځ همغږي کېږي، کتابنښې او برجسته متنونه له KOReader سره شریکوي. د جوړولو لپاره هېڅ نشته.\n\nکله چې PaperPaw یو کتاب پرانیزي چې KOReader هم پرانیستی دی، او کله چې تاسو د هغه کتابنښې یا برجسته متنونه بدل کړئ، هغه څه چې نوي دي د کتاب تر څنګ د KOReader له معلوماتو اخلي او هغه څه چې دلته نوي دي د KOReader لپاره پرېږدي چې راتلونکي ځل چې کتاب پرانیزي یې واخلي. لرې شوې نښې او بدل شوي یادښتونه هم لېږدول کېږي.\n\nدا یوازې د EPUB کتابونو لپاره کار کوي. که د یوې خوا دوتنه ونه لوستل شي، په هېڅ خوا کې هېڅ نه بدلېږي تر هغه چې ممکنه شي."
