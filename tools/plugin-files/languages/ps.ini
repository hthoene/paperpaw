setup.plugin.how = "جوړونه د مهمو ترتیباتو له لارې یوه لنډه لارښوونه ده، چې یو ځل ښودل کېږي، لومړی ځل چې PaperPaw پیلېږي. هره پاڼه یو شی پوښتي، لکه ژبه، تڼۍ، د متن اندازه، د وخت سیمه، Wi-Fi یا څو پلګینونه چې زیات شي، له یوه سم ځواب سره چې لا ټاکل شوی، نو «راتلونکی» تل سم دی. هغه ګامونه چې دا وسیله ورته اړتیا نه لري پرېښودل کېږي.\n\nتڼۍ ټک کړئ، یا پورته او ښکته تڼۍ او غوره کول وکاروئ. په لومړۍ پاڼه کې «پرېښودل» جوړونه سمدلاسه پرېږدي. وروستۍ پاڼه وايي چې ستاسو کتابونه له کوم ځایه راځي.\n\nد بیا چلولو لپاره، ترتیبات پرانیزئ او «PaperPaw جوړول» وټاکئ. هر هغه څه چې دلته ټاکل شوي وروسته په ترتیباتو کې بدلېدلی شي."
