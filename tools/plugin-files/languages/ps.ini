vocabulary.sd.readme = "فلش کارتونه له دوتنو\n\nد هر ډیک لپاره دلته یوه دوتنه کېږدئ: Spanish.tsv د Spanish ډیک جوړوي.\nدوتنې: .tsv، .csv یا .txt، د UTF-8 په توګه خوندي شوې، یا .apkg: د Anki ډیک، د «Support older Anki versions» په نښه کولو سره صادر شوی. د هغه د یادښتونو لومړۍ درې ساحې مخ، شا او بېلګه کېږي؛ مهالوېش او رسنۍ یې نه لوستل کېږي، او PaperPaw هېڅکله د Anki دوتنه نه لیکي.\n\nپه هره کرښه یو کارت: مخ، شا او یوه بېلګه (اختیاري)، د ټب، کامې یا سیمي‌کولن سره جلا شوي. لومړۍ کرښه کولی شي ستنونه ونوموي: front، back، example. بېلګه:\n\nKatze\tcat\tDie Katze schläft.\n\nبیا په لوستونکي کې فلش کارتونه پرانیزئ، «په SD کارت کې کارتونه» وټاکئ او بیا «ډیکونه تازه کول».\n\nښه ده چې پوه شئ:\n- ډیکونه د هغه څه سره چې تاسو زده کړي په لوستونکي کې پاتې کېږي. یوه دوتنه هغه وخت لوستل کېږي چې نوې یا بدله شوې وي، او کارتونه یې ډیک ته زیاتېږي یا هلته بدلېږي.\n- په دوتنه کې د یوه کارت شا یا بېلګه بدله کړئ: کارت بدلېږي او ستاسو پرمختګ ساتي.\n- د یوه کارت د مخ متن بدل کړئ: دا د نوي کارت په توګه شمېرل کېږي، او زوړ له سره پیلېږي. کارتونه د مخ د متن له مخې سره سمېږي، تش ځایونه او لوی توري نه شمېرل کېږي. یو ډیک په دوتنه کې خوندي کړئ («په SD کارت کې کارتونه»، «ډیک په کارت کې خوندي کول») او هر کارت د id په ستن کې یوه شمېره لري: هلته یو مخ بدل کړئ، د دوتنې لومړۍ دوه کرښې لکه څنګه چې دي پرېږدئ، او کارت هغه څه ساتي چې تاسو زده کړي.\n- خوندي کول د ډیک کارتونه لیکي. هغه څه چې په دوتنه کې وو او کارت نه دي (یوه کرښه پرته له مخ) نه ساتل کېږي؛ هغه دوتنه چې هلته وه _name.bak.tsv ته کاپي کېږي.\n- دوتنه د CSV UTF-8 په توګه خوندي کړئ (نه UTF-16، نه د سپرېډشیټ خپله بڼه). له 4 MiB یا 20,000 کرښو لویه دوتنه نه لوستل کېږي: ویې وېشئ.\n- هغه کرښه چې تاسو یې په دوتنه کې ړنګوئ په ډیک کې کارت نه ړنګوي، مګر دا چې د هغه ډیک لپاره «ورک کارتونه لرې کول» چالان کړئ. بیا کارت د هغه څه سره چې تاسو زده کړي ځي.\n- هغه دوتنې چې نومونه یې په _ پیلېږي نه لوستل کېږي.\n"
