calibre.plugin.how = "بېسیم کتابتون وسیله ستاسو په کمپیوټر کې په Calibre کې د بېسیم وسیلې په توګه ښکاره کوي. بیا Calibre کولی شي کتابونه ورته ولېږي، لیست یې کړي او ړنګ یې کړي. کتابونه کتابتون ته ځي.\n\nد وسایلو له مینو څخه بېسیم کتابتون پرانیزئ، له وسیلې او کمپیوټر سره په یوه Wi-Fi شبکه کې. په Calibre کې Connect/share، بیا Start wireless device connection وټاکئ. کله چې وسیلې ستاسو کمپیوټر وموند، خپل نوم ښيي؛ وصل کول ټک کړئ (له تڼیو سره، غوره کول کېکاږئ). Calibre کولی شي دلته کتابونه زیات او ړنګ کړي، نو یوازې له خپل کمپیوټر سره وصل شئ. د پردې تړل اړیکه پای ته رسوي.\n\nکه Calibre پخپله ونه موندل شي، د هغه کمپیوټر پته په ترتیباتو کې، د کتابتون لاندې، د Calibre په برخه کې د «پته» په توګه ولیکئ. که Calibre له 9090 پرته بل پورټ کاروي، دا د :پورټ په توګه زیات کړئ، لکه 192.168.1.20:9091."
