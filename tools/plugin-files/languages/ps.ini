opds.plugin.description = د OPDS کتلاګونه لټوي، د هغوی کتابونه ښکته کوي او پوښۍ ورسره همغږي ساتي.
opds.plugin.how = "OPDS کتلاګونه آنلاین کتابتونونه دي لکه Project Gutenberg، Calibre-Web، Kavita یا Komga. دا پلګین دوی لکه پوښۍ لټوي او د هغوی کتابونه کتابتون ته ښکته کوي.\n\nله وسایلو مینو څخه «کتلاګونه» پرانیزئ او «کتلاګ زیاتول» وټاکئ: یوه پته، او که کتلاګ حساب ته اړتیا لري، د کارونکي نوم او پټنوم. یو کتلاګ ټک کړئ چې یې وګورئ؛ یې ونیسئ (له تڼیو سره، غوره کول ونیسئ) چې همغږي، سم یا لرې یې کړئ.\n\nکله چې «دا کتلاګ همغږي کول» چالان وي، «کتلاګونه همغږي کول» د هغه نوي کتابونه د هغه په پوښۍ کې ښکته کوي. «په هره همغږۍ کې کتابونه» محدودوي چې یوه همغږي څو راوړي، نو لوی کتلاګ وسیله نه ډکوي. د کلاوډ پوښۍ (WebDAV) د کتلاګ پرځای کار کوي."
