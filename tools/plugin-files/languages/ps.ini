keys.plugin.description = هره تڼۍ، د ټک سیمه او سوایپ څه کوي، په وسیله کې بدل شوي.
keys.plugin.how = "تڼۍ او اشارې ښيي چې هره تڼۍ، د ټک سیمه او سوایپ څه کوي، او تاسو ته اجازه درکوي چې په وسیله کې یې بدل کړئ.\n\nپه ترتیباتو کې، د وسیلې لاندې یې پرانیزئ. لومړی وټاکئ چېرته یو بدلون پلي کېږي: هر ځای، د لوست پر مهال، په کور پرده کې، په کتابتون کې یا په یوه وسیله کې. بیا یو ننوتون وټاکئ، لکه یوه ساتل شوې تڼۍ یا له څنډې دننه یو سوایپ، او له لیست څخه یو عمل وټاکئ، چې لټولی شئ. «لکه معیاري» هغه بېرته ورکوي چې پلګینونه او د تڼیو ترتیب یې ټاکي.\n\nپه X4 کې، یو بدلون چې هېڅ تڼۍ نه پرېږدي چې ورسره وټاکل شي، شاته لاړ شي یا مخکې لاړ شي، رد کېږي. په پای کې «تڼۍ او اشارې بېرته ټاکل» هر بدلون بېرته اخلي."
