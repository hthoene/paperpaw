reader.plugin.name = لوستونکی
reader.plugin.description = کتابونه پاڼه په پاڼه ښيي، له مطالبو جدول او د لوست ترتیباتو سره.
reader.plugin.how = "لوستونکی کتابونه پاڼه په پاڼه ښيي. له کتابتون څخه یو کتاب پرانیزئ؛ وروستی کتاب په پیل کې بیا پرانیستل کېدلی شي (ترتیب «په پیل کې وروستی کتاب پرانیستل»).\n\nد پاڼو اړولو لپاره د پردې چپ یا ښي ټک کړئ، یا د پاڼې تڼۍ وکاروئ. د لوست مینو لپاره منځ ټک کړئ یا غوره کول کېکاږئ: مطالب، لټون، پاڼې ته تلل، فونټ او ترتیب، کتابنښې او برجسته متنونه او نور. د پورتنۍ څنډې څخه ښکته چټک پینل پرانیزي، د ښکتنۍ څنډې څخه پورته کور ته ځي؛ شاته ساتل هم همداسې.\n\nغوره کول ونیسئ (یا یو انځور ونیسئ) چې یو انځور په بشپړه پرده وګورئ: چپ او ښي د پاڼې انځورونو له لارې ګام وهي. غوره کول 2x، 3x او بېرته لوی کوي (په لمس کې دوه ځله ټک)؛ لوی شوی، چپ او ښي اړخ ته حرکت کوي، د پاڼې تڼۍ (یا سوایپ) افقي او عمودي مخ ته ځي. شاته بېرته برابرولو ته ځي، بیا پاڼې ته (په لمس کې د وتلو لپاره ونیسئ). د کتابنښې لپاره د پورتنۍ ښي کنج ټک کړئ. یو کلمه ونیسئ چې برجسته یې کړئ. له تڼیو سره، چپ ونیسئ: چپ او ښي د کلمې له مخې حرکت کوي، د پاڼې تڼۍ د کرښې له مخې، ساتل یې د پاڼې پای ته او د پیراګراف له مخې ځي؛ غوره کول د کلمې لپاره د برجسته کولو پټه پرانیزي، غوره کول ونیسئ ټاکنه جملې او پیراګراف ته پراخوي (بیا چپ او ښي پای حرکت کوي، ساتل یې پیل). یوه ټاکنه د پاڼو اړولو په اوږدو ادامه کوي. «د Markdown په توګه صادرول» ستاسو یادښتونه خوندي کوي."
