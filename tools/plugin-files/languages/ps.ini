format-markdown.plugin.how = "Markdown دوتنې (.md)، لکه یادښتونه، د کتابونو په توګه پرانیزي: سرلیکونه، لیستونه، نقل قولونه او ټینګار هماغسې لکه څنګه چې مطلب یې دی، نه د نښو په توګه.\n\nدوتنې د کتابتون په پوښۍ کې کېږدئ او له کتابتون څخه یې پرانیزئ. لومړی سرلیک د دوتنې سرلیک ګرځي؛ د دوتنې تر څنګ انځورونه هلته ښکاري چېرته چې متن یې نوموي."
