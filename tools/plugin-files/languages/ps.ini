format-fb2.plugin.how = "FictionBook کتابونه (.fb2) پرانیزي، چې د روسي او نورو کتابونو لپاره عام دي، زپ شوي هم (.fb2.zip)، د خپل سرلیک، لیکوالانو، پوښ او څپرکو سره.\n\nدا د کتابتون په پوښۍ کې کېږدئ؛ دا په کتابتون کې ښکاري او لکه هر بل کتاب پرانیستل کېږي."
