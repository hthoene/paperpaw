reading-goal.plugin.description = په ورځ کې د لوست دقیقې، او په کور پرده کې یو پیشو چې حالت یې د نن د لوست تعقیبوي.
reading-goal.plugin.how = "ستاسو په کور پرده کې یو پیشو ښيي چې نن لوست څنګه روان دی: غمجن تر څو چې لا نه وي لوستی، لږ لوست وروسته معمولي، ستاسو د ورځنۍ موخې له نیمايي خوښ، چې ورسېږئ خوشاله.\n\n«د لوست پیشو» ویجټ کور پرده ته زیات کړئ (کور پرده ونیسئ، بیا ویجټ زیات کړئ)، یا «د نن د لوست پیشو» د خوب پردې په توګه وټاکئ. په پیشو ټک ورځنۍ موخه پرانیزي؛ دا د لوست د احصایو موخه ده، چې هغه دقیقې شمېري چې تاسو لولئ.\n\nپه ترتیباتو کې، د لوست لاندې، «خوښ له» او «خوشاله له» ټاکي چې د موخې له کومې ونډې پیشو خوښ یا خوشاله دی، او «خپل انځورونه» د انځورونو پوښۍ (sad, meh, content او happy) چې د پیشوګانو پرځای ښودل کېږي. انځورونه PNG یا JPEG دوتنې دي؛ پرته له پوښۍ، پیشوګانې ښکاري."
