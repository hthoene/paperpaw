mail.plugin.name = برېښنالیک
mail.plugin.description = برېښنالیکونه د پټنوم یا د اپ پټنوم (IMAP او SMTP) سره لولي او لېږي، پرته له براوزر ننوتنې.
mail.plugin.how = "برېښنالیک د IMAP او SMTP له لارې برېښنالیکونه لولي او لېږي. دا ستاسو له پتې او پټنوم سره ننوځي، پرته له براوزر ننوتنې، نو له هر وړاندې کوونکي سره کار کوي چې دا اجازه ورکوي.\n\nیو حساب د ترتیباتو، برېښنالیک لاندې جوړ کړئ. خپل وړاندې کوونکی وټاکئ، خپله پته او پټنوم ولیکئ. ډېری وړاندې کوونکي د اپ پټنوم غواړي: د خپل حساب د امنیت په ترتیباتو کې یو جوړ کړئ او دلته یې وکاروئ. ستاسو عادي پټنوم ډېری وختونه کار نه کوي، او دا هېڅکله هېڅ ځای نه ځي پرته له ستاسو د وړاندې کوونکي له سرور. دا له پټنومونو او کیلیو سره ساتل کېږي.\n\nبرېښنالیک په وسایلو کې پرانیزئ. «برېښنالیکونه وګورئ» وروستي برېښنالیکونه او پوښۍ راوړي. برېښنالیکونه په کارت کې ساتل کېږي، نو تاسو یې پرته له شبکې لوستلی شئ. وسیله وصلېږي، راوړي او پرې کېږي، نو Wi-Fi یوازې یو شېبه چالان وي.\n\nکه ستاسو وړاندې کوونکی په لیست کې نه وي، «خپل سرورونه» وټاکئ او د سرور نومونه، پورټونه او امنیت د پرمختللو ترتیباتو لاندې ټاکئ. هغه سرور چې د هغه سند هېڅ مرجع نه ضمانتوي، یو ځل پوښتي چې ایا ورباندې باور وکړي؛ ګوتنښه د هغه سره پرتله کړئ چې ستاسو وړاندې کوونکی یې ښيي.\n\nیو برېښنالیک چې کتاب ور ضمیمه وي (EPUB، PDF او ورته، تر 2 MB پورې) د هغه لاندې «کتاب پرانیستل» لري: دا دوتنه راوړي، ستاسو په کتابتون کې یې ږدي او پرانیزي.\n\nچې نوي برېښنالیکونه پرته له برېښنالیک پرانیستلو وګورئ، په ترتیباتو کې، برېښنالیک لاندې «په شاليد کې د نوي برېښنالیک لټون» چالان کړئ، او وټاکئ چې څومره ځله (هر 15، 30 یا 60 دقیقې). دا بند دی تر هغه چې چالان یې کړئ. بیا لوستونکی وخت په وخت د خوندي اړیکې له لارې وصلېږي کله چې ویښ او آنلاین وي، یو حساب د بل پسې، او په کور کې د نه لوستل شویو شمېر تازه کوي. دا یو څه بېټرۍ مصرفوي. برېښنالیک پرانیستل روانه کتنه ودروي.\n\nد کور پردې ویجټونه د نه لوستل شویو شمېر، وروستي او ستوریدار برېښنالیکونه، یو صندوق، او د برېښنالیک لیکلو لنډلار ښیي."
