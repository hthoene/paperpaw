settings.plugin.description = د ترتیباتو پاڼې، د هر پلګین له ترتیباتو جوړې.
settings.plugin.how = "ترتیبات هر هغه شی ښيي چې په PaperPaw او د هغه په پلګینونو کې ټاکل کېدلی شي، په پاڼو کې. پلګینونه خپلې پردې ته اړتیا نه لري: هغه څه چې اعلانوي دلته په ډلو کې ښکاري، د هر ترتیب تشریح د هغه لاندې.\n\nدا په مینو کې له «ترتیبات» سره پرانیزئ. یوه ډله ټک کړئ چې پرانیستل شي، بیا یو ترتیب چې وټاکل شي یا بدل شي؛ شمېرې − او + تڼۍ لري. له تڼیو سره، یو ترتیب ته لاړ شئ او غوره کول کېکاږئ: چپ او ښي یوه شمېره بدلوي، غوره کول یې ساتي، شاته پخوانی ارزښت بېرته راولي.\n\nبدلونونه سمدلاسه پلي کېږي. «لټون» ترتیب د کلمو له مخې مومي او «پرمختللي ترتیبات» هغه زیاتوي چې ډېر کم اړتیا ورته وي. «ډیفالټ ته بېرته ټاکل» او «ټول بېرته ټاکل» لومړی پوښتي."
