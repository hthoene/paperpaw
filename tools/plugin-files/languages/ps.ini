about.plugin.name = په اړه
about.plugin.description = د PaperPaw نسخه او جوازونه.
about.plugin.how = "«په اړه» ښيي چې تاسو د PaperPaw کومه نسخه لرئ، سرچینه کوډ یې چېرته دی، او د کومو جوازونو لاندې راځي.\n\nتاسو یې د ترتیباتو په پای کې، د «د PaperPaw په اړه» په توګه موندلی شئ. له غشو تڼیو او غوره کولو سره یوه کرښه وټاکئ، یا یې ټک کړئ. هغه پلګینونه چې په فرم‌ویر کې جوړ شوي، او په هغو وسیلو کې چې کوډ لرونکي پلګینونه لوډوي، هغه ګوتنښه چې دا پلګینونه باید ورته جوړ شوي وي، هم دلته لیست شوي.\n\n«جوازونه» په لوستونکي کې د متن په توګه پرانیستل کېږي، نو تاسو یې لکه کتاب پاڼې اړوئ. دا د PaperPaw خپل جواز او د هغو فونټونو، انځورنو او د کلمو د ماتولو نمونو جوازونه لري چې ورسره راځي. پلګینونه کولی شي خپله یوه کرښه زیاته کړي، لکه د بڼې جوړونکی."
