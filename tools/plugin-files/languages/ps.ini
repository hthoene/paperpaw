calendar.plugin.name = کېلنډر
calendar.plugin.description = ستاسو کېلنډرونه په لوستونکي کې: له CalDAV، iCal او دوتنو څخه د مهالوېش، ورځې، اونۍ او میاشتې لیدنې، له اړیکو څخه د زېږون ورځې، کور ویجټونه او د خوب پرده.
calendar.plugin.how = "ستاسو کېلنډرونه په لوستونکي کې: د راتلونکو ورځو مهالوېش، ورځ، اونۍ او میاشت، د CalDAV کېلنډرونو (Nextcloud، Radicale، Baïkal، Fastmail او نورو)، د iCal پتو (.ics، webcal://)، په کارت کې د کېلنډر دوتنو، او د اړیکو د زېږون ورځو او کلیزو (CardDAV) پېښو سره. لوستونکی کېلنډرونه یوازې لولي، نه یې بدلوي.\n\nکېلنډر د وسایلو له مینو پرانیزئ. لومړۍ کرښه د لیدنې نوم دی؛ هغه وټاکئ، یا هره کرښه ونیسئ یا مینو کېکاږئ، چې مهالوېش، ورځې، اونۍ، میاشتې او زېږون ورځو ته واوړئ، کېلنډرونه زیات یا همغږي کړئ. په ورځ او اونۍ کې لومړۍ دوه کرښې مخکینۍ او وروستۍ ورځ یا اونۍ ته ځي (د پاڼې تڼۍ هم)؛ په میاشت کې غشي تڼۍ ورځ خوځوي، د پاڼې تڼۍ میاشت، او غوره کول ورځ پرانیزي. په پېښه غوره کول هغه بشپړه ښيي: کله، چېرته، کوم کېلنډر او څنګه تکرارېږي. شاته یو ګام شاته ځي.\n\nکېلنډر د «کېلنډرونو» لاندې زیات کړئ (په مینو کې، یا په ترتیباتو کې کېلنډر). ډول یې وټاکئ: د CalDAV حساب (د سرور پته بس ده، لکه cloud.example.com/remote.php/dav؛ هر کېلنډر له پېښو سره د لیدنې برخه کېږي)، د iCal پته (د .ics په توګه خپور کېلنډر)، په کارت کې د کېلنډر دوتنه، یا اړیکې (د CardDAV پتې کتاب: لوستونکی د هغوی خوندي زېږون ورځې او کلیزې ښيي). پته، د حساب لپاره د کارونکي نوم او پټنوم (ښه د اپ پټنوم؛ د لوستونکي له پټنومونو سره ساتل کېږي)، او یو نوم ولیکئ. هر کېلنډر د توپیر لپاره یوه بدلېدونکې نښه لري (ټکی، کړۍ، خړ ټکی یا مربع)؛ تر شپږو کېلنډرونو پورې.\n\nتکرارېدونکې پېښې (ورځنۍ، اونیزې، میاشتنۍ، کلنۍ، د اونۍ ورځو، شمېرو، پای نېټو او پرېښودل شویو ورځو سره)، ټولورځنۍ پېښې او د نورو وخت سیمو پېښې د لوستونکي په خپل ساعت ښودل کېږي. لوستونکی له نن شپېته ورځې مخکې تر شپېتو ورځو وروسته پېښې ساتي، تر 240 پورې، او بې له شبکې یې ښيي. نالوستې قاعدې خپله پېښه یو ځل ښيي.\n\nکېلنډرونه هغه مهال لوستل کېږي چې کېلنډر پرانیزئ (تر ډېره هر پنځه دقیقې)، چې «اوس همغږي کول» وټاکئ، او، لکه په ترتیباتو کې د کېلنډر لاندې چې یې ټاکئ، کله چې شبکه په هر حال چالانه وي یا چارج پیلېږي. د دې لپاره بېسیم هېڅکله نه چالانېږي، مګر چې «اوس همغږي کول» وغواړئ.\n\nد کور پردې ویجټونه (کور پرده ونیسئ، بیا ویجټ زیات کړئ): «نن» نېټه او د ورځې پېښې ښيي، «راتلونکې پېښه» راتلونکې پېښه، «مهالوېش» راتلونکې ورځې، «میاشت» یوه میاشت د پېښو لرونکو ورځو لاندې ټکي سره، او «زېږون ورځې» راتلونکې زېږون ورځې. په پېښه ټک هغه پرانیزي، د میاشتې په ورځ ټک هغه ورځ. د خوب پرده کولی شي د نن مهالوېش وښيي: په ترتیباتو کې د خوب پردې لاندې کېلنډر وټاکئ."
