weather.plugin.description = اوسنۍ هوا او راتلونکې ورځې د ویجټونو په توګه، له Open-Meteo څخه.
weather.plugin.how = "هوا اوسنۍ هوا او راتلونکې ورځې د کور پردې د ویجټونو په توګه ښيي، له Open-Meteo څخه، چې حساب یا کیلي ته اړتیا نه لري. «اوسنۍ هوا» تودوخه، حالت او د انتخاب لپاره نور څه ښيي؛ «وړاندوینه» راتلونکې ورځې په یوه قطار یا لیست کې ښيي.\n\nلومړی یو ځای وټاکئ: په ترتیباتو کې، د هوا لاندې، «ځای» (یو نوم ولیکئ، بیا یې له موندل شویو ځایونو غوره کړئ). یوازې د هغه جغرافیايي مختصات لېږل کېږي، او یوازې تر هغه چې د هوا ویجټ ښودل کېږي. ویجټونه د کور پردې د سمولو پر مهال زیات کړئ.\n\nهوا تر ټولو ډېر هغومره ځله راوړل کېږي لکه څنګه چې «تازه کول تر ټولو ډېر هر» وايي، او یوازې هغه وخت چې شبکه وي: دا هېڅکله پخپله Wi-Fi نه چالانوي.\n\nد هوا معلومات د Open-Meteo.com لخوا (https://open-meteo.com)، د Creative Commons Attribution 4.0 جواز لاندې (CC BY 4.0)."
