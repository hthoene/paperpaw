diagnostics.plugin.description = د ازموینې پرده او د وسیلې د هرې برخې لارښوونه شوې کتنه.
diagnostics.plugin.how = "تشخیص د وسیلې د کتنې لپاره د ازموینې پرده ده: دا هر خړ رنګ ښيي چې پینل یې ښودلی شي، څلور ډبۍ چې تڼۍ او لمس پرې وازمایئ، او د پاڼې شمېرونکی د پرمختګ پټې سره، چې د تازه کېدو حالتونه پرتله کړئ.\n\nد ازموینې پرده د مینو ننوتنه نه لري. دا یوازې هغه وخت کور پرده ده چې بل هېڅ پلګین یوه نه وړاندې کوي، یا کله چې تاسو یې د پلګین مدیر کې د «پردو» لاندې د «کور پرده» ځای لپاره وټاکئ.\n\nغوره کول هغه ډبۍ نښه کوي چې فوکس لري، او غشي تڼۍ د ډبیو ترمنځ ځي؛ په لمس سره یوه ډبۍ ټک کړئ. د پاڼې تڼۍ د ازموینې پاڼې اړوي. غوره کول ونیسئ، یا په پرده ګوته ونیسئ، چې له سره پیل شي.\n\nد وسیلې کتنه، د وسایلو لاندې چېرته چې PaperPaw د وسیلې فرم‌ویر دی، د وسیلې هره برخه یوه یوه پاڼه تېروي: پرده، تڼۍ، لمس، رڼا، بېټرۍ، کارت، ساعت، Wi-Fi، خوب او حافظه. هره پاڼه په ناکام، پرېښودل او بریالی پای ته رسېږي؛ هغه ځواب ټاکل شوی چې پیمایښتونه یې وړاندیز کوي. هغه برخې چې وسیله یې نه لري پرېښودل کېږي. له هر ځواب وروسته دا یو راپور په .paperpaw/plugins/diagnostics/device-check.txt کې لیکي، چې په pull request کې یې کېږدئ. شاته یې پرېږدي، او کله چې بیا پرانیستل شي هلته دوام کوي چېرته چې و. په هغې وسیله کې چې یوازې تڼۍ لري، لومړی د تڼیو په پاڼه کې «پیل» وټاکئ؛ تر هغه غشي، غوره کول او شاته لکه په هره پاڼه کې کار کوي."
