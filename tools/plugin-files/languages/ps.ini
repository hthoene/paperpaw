format-docx.plugin.how = "د .docx سندونه د کتابونو په توګه پرانیزي: سرلیکونه د مطالبو له جدول سره، لیستونه، جدولونه، غټ او کوږ متن، لینکونه او انځورونه (JPEG، PNG، GIF).\n\nدوتنې د کتابتون په پوښۍ کې کېږدئ او له کتابتون څخه یې پرانیزئ. سرلیک او لیکوال د سند له ځانګړتیاوو څخه راځي. ښکتنۍ یادښتونه، سرلیکونه او پایلیکونه، او تبصرې نه ښودل کېږي."
