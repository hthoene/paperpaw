bluetooth.plugin.description = ریموټونه، کیبورډونه او سېنسرونه جوړه کوي او ور وصلوي.
bluetooth.plugin.how = "Bluetooth ریموټونه، کیبورډونه او سېنسرونه له لوستونکي سره جوړه کوي، چېرته چې دا Bluetooth لري (X4 Pro).\n\n«وسیله زیاتول» هغه څه لټوي چې نژدې دي؛ وسیله لومړی د جوړه کېدو حالت ته واچوئ. یې وټاکئ، او په لوستونکي کې یې تایید کړئ (شمېره پرتله کړئ، چېرته چې ښکاري). د ریموټ یا کیبورډ تڼۍ بیا پاڼې اړوي او په مینوګانو کې ګرځي؛ هره تڼۍ څه کوي، د «کنټرولونو» لاندې یې بدل کړئ.\n\n«ریموټونه» وايي چې د هغوی تڼۍ کله کار کوي: کله چې دلته چالان شي، د لوست پر مهال (تر څو چې کتاب پرانیستی وي وصل دي، بېټرۍ سپموي)، یا تل. د مینو تڼۍ یا په وسیله اوږد فشار یې هېروي.\n\nسېنسر د پلګینونو لپاره دی: چالان کړئ چې کوم پلګین یې کارولی شي. Bluetooth بند وي تر څو چې هېڅ یې ونه کاروي."
