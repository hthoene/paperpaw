vocabulary.plugin.name = لغتونه
vocabulary.plugin.description = هغه کلمې چې تاسو یې لټوئ د هغوی له جملو سره ساتي، او فلش کارتونه د وقفه‌يي تکرار سره تکراروي، چې په تلیفون کې جوړېږي.
vocabulary.plugin.how = "لغتونه هغه کلمې ساتي چې د لوست پر مهال یې لټوئ، هره له خپلې جملې سره، چې وروسته یې وګورئ. لیست په وسایلو کې دی، نوې لومړی؛ کلمه وټاکئ چې بیا یې ولټوئ. وروستۍ کرښه، «صادرول»، یې د فلش کارت اپونو لکه Anki لپاره خوندي کوي. لیست تر ټولو نوې 2,000 کلمې ساتي، زړې ځي، نو لومړی یې صادرې کړئ چې ټولې وساتئ.\n\nفلش کارتونه، هم په وسایلو کې، په وقفه‌يي تکرار مو ازمويي: له «ځواب ښودل» وروسته هر کارت ته «بیا»، «سخت»، «ښه» یا «اسان» ورکوئ، چې دا ټاکي کله بېرته راځي. ډیکونه د «په تلیفون سمول» سره جوړ کړئ: کوډ په همدې Wi-Fi کې په تلیفون سکن کړئ، بیا کارتونه ولیکئ یا ډېر یو ځل زیات کړئ: هلته ډیک پرانیزئ، «ډېر کارتونه یو ځل» وټاکئ او CSV، TSV یا TXT دوتنه غوره کړئ (په هره کرښه یو کارت: مخ، شا، بېلګه؛ UTF-8)، لیست ونښلوئ، یا Anki ډیک راوړئ (.apkg، د «Support older Anki versions» سره صادر شوی).\n\nیا د SD کارت دوتنې وکاروئ: هر ډیک ته CSV، TSV یا TXT دوتنه، یا Anki ډیک (.apkg، لکه پورته صادر شوی)، Flashcards پوښۍ ته واچوئ (Spanish.tsv د Spanish ډیک جوړوي؛ په هره کرښه یو کارت: مخ، شا، بېلګه؛ په UTF-8 خوندي؛ لومړۍ کرښه کولی شي ستنونه front، back، example ونوموي). په فلش کارتونو کې «په SD کارت کې کارتونه» وټاکئ، یا دا د فلش کارتونو په پرانیستو کېږي. ډیکونه له زده کړې سره په لوستونکي کې پاتې کېږي، او دوتنه هر ځل چې نوې یا بدله وي له خپل ډیک سره یو ځای کېږي: په دوتنه کې د کارت شا یا بېلګه بدله کړئ، کارت بدلېږي او پرمختګ ساتي؛ د مخ متن بدل کړئ، نوی کارت شمېرل کېږي او زوړ له سره پیلېږي (کارتونه د مخ په متن بېلېږي؛ تش ځایونه او لوی توري نه شمېرل کېږي)؛ ړنګه کرښه کارت نه ړنګوي (مګر چې د هغه ډیک لپاره «هغه کارتونه چې په دوتنه کې نشته» په «لرې کول» وټاکئ: بیا کارت په راتلونکې تازه کېدنه له پرمختګ سره تل لپاره لرې کېږي، او تر څو د دوتنې کومه کرښه نه لوستل کېږي هېڅ نه لرې کېږي). ډیک د «په کارت کې خوندي کول» سره خپلې دوتنې ته ولیکئ: دوتنه د کارتونو شمېرې (id ستن) اخلي، نو مخونه په کمپیوټر سمولی شئ او کارتونه خپله زده کړه ساتي؛ دوتنه یوازې id، مخ، شا او بېلګه ساتي (نور ستنونه، تبصرې او د کرښو ترتیب نه)، او تر څو د دوتنې کومه کرښه نالوستې وي خوندي کول نه منل کېږي؛ پخوانۍ دوتنه لومړی ځل _name.bak.tsv ته کاپي کېږي (وروسته خوندي کول یې نه بدلوي). له 4 MiB یا 20,000 کرښو لویه دوتنه نه لوستل کېږي، او باید په CSV UTF-8 خوندي وي، نه UTF-16. لومړی ځل لوستونکی پوښۍ د کار د څرنګوالي له یادونې سره جوړوي.\n\nپه ترتیباتو کې، د لوست لاندې، «له لټول شویو کلمو کارتونه» هره لټول شوې کلمه «لټول شوې» ډیک ته اچوي."
