format-epub.plugin.description = EPUB کتابونه د بڼې، مطالبو جدول او انځورونو سره پرانیزي.
format-epub.plugin.how = "EPUB کتابونه له کتابتون څخه لکه هر بل کتاب پرانیستل کېږي، د مطالبو جدول، انځورونو او د خپرونکي بڼې سره. ویب پاڼې (HTML)، Markdown، FictionBook (.fb2) او د کامیک کتابونو آرشیفونه (.cbz) همداسې پرانیستل کېږي، هر یو د خپل پلګین په توګه.\n\nیو څپرکی لومړی ځل چې تاسو یې پرانیزئ بدلېږي او د پلګین په کیش کې ساتل کېږي، نو وروسته ګړندی دی او لوی کتابونه په کوچنیو وسیلو کې کار کوي. د مطالبو جدول د لوست په مینو کې د «مطالب» لاندې ومومئ. ایا د کتاب خپله بڼه پلي کېږي د «د خپرونکي بڼه» ترتیب دی، د لوست لاندې."
