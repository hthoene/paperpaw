translate.plugin.description = ټاکل شوی متن په آنلاین ډول د DeepL سره ژباړي.
translate.plugin.how = "ژباړه ټاکل شوی متن په آنلاین ډول د DeepL سره ژباړي. په کتاب کې متن وټاکئ او د ټاکل شوي متن په مینو کې «ژباړل» وټاکئ: ژباړه د پاڼې پر سر لکه د قاموس ننوتنه ښکاري. د پاڼې تڼۍ یا ټک یې سکرولوي، او غوره کول یا په پای کې ټک یې تړي.\n\nدا شبکه او ستاسو خپل د DeepL API کیلي ته اړتیا لري، په deepl.com کې وړیا (DeepL API Free، په میاشت کې نژدې 500,000 توري). تر هغه چې یې ونه لیکئ، پینل دا وايي، او ټک یې غواړي.\n\nپه ترتیباتو کې، د لوست لاندې، د ژباړې په برخه کې، «ژباړل په» ژبه ټاکي؛ په پیل کې دا د PaperPaw خپله ده."
