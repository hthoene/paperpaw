format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC او XTCH کتابونه پرانیزي، د Xteink لوستونکو مخکې انځور شوې پاڼې.
format-xtc.plugin.how = "XTC او XTCH دوتنې هغه کتابونه دي چې پاڼې یې لا مخکې د انځورونو په توګه انځور شوې، لکه څنګه چې د Xteink لوستونکو لپاره بدلونکو جوړ کړي. دوی له کتابتون څخه لکه هر کتاب پرانیستل کېږي.\n\nځکه چې هره پاڼه یو ټاکلی انځور دی، متن نه شي لوی کېدلی او نه په بل فونټ کې ټاکل کېدلی. پاڼې تور او سپین دي یا څلور خړ رنګونه لري. هره پاڼه کله چې ښودل کېږي ډیکوډ کېږي، نو لږ حافظه په کار ده، په X4 کې هم.\n\nسرلیک، لیکوال او څپرکي له دوتنې څخه اخیستل کېږي، که یې ولري."
