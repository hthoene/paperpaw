transfer.plugin.how = "د Wi-Fi لېږد کتابونه او نورې دوتنې په همدې شبکه کې له براوزر څخه وسیلې ته اچوي، پرته له کېبل یا اپ. تاسو کولی شئ دوتنې هم راوړئ، پوښۍ جوړې کړئ او ړنګې کړئ.\n\nدا له وسایلو پرانیزئ. پرده یوه پته د متن او QR کوډ په توګه ښيي: دا په تلیفون یا کمپیوټر کې په براوزر کې پرانیزئ، یا کوډ سکین کړئ. په پته کې یوه کیلي ده چې هر ځل نوې جوړېږي، نو په شبکه کې نور ستاسو دوتنو ته نه رسېږي. لېږد تر هغه چلېږي چې پرده پرانیستې وي.\n\nچېرته چې PaperPaw پخپله Wi-Fi چلوي، لکه په X4 کې، په ښکته کې «پرته له روتر» د وسیلې خپله شبکه پرانیزي، چې تلیفون یې د کوډ سکین کولو په مرسته ورګډېږي."
