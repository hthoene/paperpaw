fonts-browser.plugin.description = له انټرنېټ څخه فونټونه د نمونې سره ښيي او د لوست لپاره یې ښکته کوي.
fonts-browser.plugin.how = "«نور فونټونه» په انټرنېټ کې د فونټ کتابتون فونټونه لیست کوي، هر نوم په خپل فونټ کې، او هغه ښکته کوي چې تاسو یې د لوست لپاره غواړئ.\n\nتاسو یې د فونټونو د لیست په پای کې موندلی شئ چېرته چې د لوست فونټ ټاکل کېږي، په ترتیباتو کې، د لوست لاندې، د «فونټ» په توګه؛ د حالت کرښې د خپل فونټ لپاره همدا ننوتنه لري. یو فونټ ټک کړئ (له تڼیو سره، غوره کول کېکاږئ) چې یې لوی د یوې نمونې جملې سره وګورئ، بیا «ښکته کول» وټاکئ. تاسو کولی شئ پاڼه پرېږدئ پداسې حال کې چې ښکته کېږي. کله چې ختم شي، «د (د فونټ نوم) سره لوستل» وټاکئ، یا «د حالت کرښو لپاره کارول». «تازه کول» نوې نسخه راوړي، «لرې کول» فونټ له وسیلې ړنګوي.\n\nدا Wi-Fi ته اړتیا لري.\n\nستاسو خپل فونټونه\n\nد «نور فونټونه» تر څنګ، همدا لیست «ستاسو خپل فونټونه» لري، چې د مرستې دا برخه ښيي. ستاسو خپل فونټ یوه .ttf یا .otf دوتنه ده، د بېلګې په توګه له Google Fonts څخه.\n\nپه Android او نورو وسیلو کې چې د فونټ دوتنې انځوروي: دوتنه په fonts پوښۍ کې کاپي کړئ (په Android کې: PaperPaw/fonts په ګډه ذخیره کې)، PaperPaw بیا پیل کړئ او فونټ په ترتیباتو کې، د لوست لاندې، د «فونټ» په توګه وټاکئ.\n\nپه Xteink X4 او X4 Pro کې: دا لوستونکي د فونټ کڅوړې لولي، نه د فونټ دوتنې، ځکه چې د فونټ دوتنې په حافظه کې نه ځايېږي. په کمپیوټر کې له paperpaw-fontgen سره یوه کڅوړه جوړه کړئ، د هر هغه سټایل لپاره چې لرئ (عادي ضروري دی):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nدا پوښۍ plugins/font-my-font جوړوي. دا د حافظې په کارت کې په plugins پوښۍ کې کاپي کړئ، بیا پیل کړئ، او «My Font» د «فونټ» په توګه وټاکئ. د یوه سټایل کڅوړه د لاتیني توریو لپاره نژدې نیم میګابایټ ده؛ هغه سټایلونه چې پرېږدئ په عادي کې انځورېږي. وسیله وايي چې فونټ څو هغه توري لري چې تاسو یې غوښتي (--chars latin,cyrillic,greek لیکونه زیاتوي): هغه فونټ چې ستاسو د کتاب توري ونه لري، نه شي یې ښودلی، نو داسې یو ولټوئ چې د هغه لیک پوښښ کوي.\n\nد «نور فونټونو» فونټونه همداسې کار کوي او کمپیوټر ته اړتیا نه لري.\n\nد ای-انک پینل کې د کوچني متن د ډېر تېز والي لپاره، امر ته --hinting light زیات کړئ: دا توري د پکسل جال سره برابروي، لکه څنګه چې ډیفالټ فونټونه جوړ شوي. بې له هغې توري داسې انځورېږي لکه څنګه چې فونټ ډیزاین شوی؛ --hinting normal او --hinting mono یې ډېر برابروي. هغه فونټونه چې نښې لري، لکه عربي یا دیواناګري، ښه ده پرته له دې پرېښودل شي."
