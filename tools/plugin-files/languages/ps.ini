format-mobi.plugin.description = .mobi او .azw دوتنې پرته له DRM پرانیزي.
format-mobi.plugin.how = "MOBI کتابونه (.mobi، .azw) له کتابتون څخه لکه هر کتاب پرانیستل کېږي، پرته له کومې جوړونې. سرلیک، لیکوالان، ژبه او پوښ له کتاب څخه راځي، او د مطالبو لیست د هغه له سرلیکونو جوړېږي.\n\nکتاب لومړی ځل چې پرانیزئ بدلېږي، چې د اوږد لپاره څو ثانیې نیسي؛ وروسته سمدلاسه پرانیستل کېږي. متن، سرلیکونه، غټ او کوږ متن، لینکونه او انځورونه ښودل کېږي.\n\nهغه کتابونه چې DRM لري (د دوکان څخه اخیستل شوي ډېری کتابونه) نه شي پرانیستل کېدلی، او هغه کتابونه هم نه چې د Huffman فشار لري یا په نوې KF8 بڼه کې (.azw3) دي: PaperPaw دا کله چې یې پرانیزئ وايي. د EPUB په توګه یوه کاپي، چې د Calibre په څېر وسیلې سره جوړه شوې، تل پرانیستل کېږي."
format-mobi.title = MOBI کتابونه
