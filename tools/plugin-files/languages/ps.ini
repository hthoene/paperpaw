news.plugin.description = د خبرونو فیډونه (RSS، Atom) د لوستلو لپاره د کتابونو په توګه راوړي.
news.plugin.how = "خبرونه RSS یا Atom فیډونه کتابونو ته بدلوي. هر فیډ د کتابتون په News پوښۍ کې یو کتاب کېږي، له خپلو وروستیو مقالو سره د ساده متن په توګه، چې لکه هر بل کتاب ولوستل شي.\n\nله وسایلو مینو څخه خبرونه پرانیزئ او «فیډ زیاتول» وټاکئ؛ پته یې د ورځپاڼې یا بلاګ په ویب سایټ کې ده. «خبرونه راوړل» ټول فیډونه راوړي او پخوانی کتابونه بدلوي. یو فیډ ونیسئ (له تڼیو سره، غوره کول ونیسئ) چې یوازې هغه راوړئ یا لرې یې کړئ. لرې شوی فیډ خپل کتاب په کتابتون کې پرېږدي.\n\nراوړل شبکه غواړي. «د هر فیډ مقالې» (ترتیبات، کتابتون) ټاکي چې یو کتاب څو مقالې لري. د «د خبرونو سرلیکونه» ویجټ دوی د کور پرده کې ښيي."
