puzzles.plugin.name = معماګانې
puzzles.plugin.description = سودوکو، کراس‌ورډ او د شطرنج معماګانې، آفلاین، د ورځې معما سره.
puzzles.plugin.how = "د اورګاډي او د انتظار د خونې لپاره معماګانې، ټولې آفلاین: سودوکو، کراس‌ورډ او د شطرنج معماګانې. معماګانې د وسایلو له مینو څخه پرانیزئ، یا د «د ورځې معما» ویجټ کور پرده ته زیات کړئ (کور پرده ونیسئ، بیا ویجټ زیات کړئ): دا ښيي چې د نن سودوکو څومره مخ ته تللی، او یو ټک یې پرانیزي. د ورځې سودوکو ټوله ورځ یو شان دی.\n\nسودوکو: چپ او ښي کرسر یو یو څلورګوټ خوځوي، پورته او ښکته (د پاڼې تڼۍ) یوه کرښه. غوره کول رقمونه پرانیزي: یو وټاکئ او بیا غوره کول چې ورننباسي، یا «پاکول» چې څلورګوټ تش کړي. غوره کول (یا مینو) ونیسئ چې د تخته لاندې تڼیو ته ورسېږئ: «یادښتونه» رقمونه د پنسل نښو ته بدلوي، «کتل» غلط څلورګوټونه نښه کوي، «بېرته» وروستی حرکت بېرته کوي، «نوی» د هغه کچې معما پیلوي چې تاسو یې ټاکئ (اسانه، منځنی، سخت). هره معما یو دقیق حل لري. لوبه کله چې پرېږدئ ساتل کېږي. په لمسي پرده کې یو څلورګوټ ټک کړئ.\n\nکراس‌ورډ: .puz (Across Lite) یا .ipuz دوتنې د حافظې په کارت کې په «puzzles» پوښۍ کې کېږدئ؛ هېڅ یو نه راځي. په جال کې حرکت وکړئ، بیا غوره کول چې د کرسر لاندې کلمه په کیبورډ ولیکئ (یو لاندې کرښه څلورګوټ تش پرېږدي). تڼۍ د افقي او عمودي ترمنځ بدلوي، د لارښوونو لیست ښيي، توري ګوري او کلمه ښيي. توري د هرې دوتنې لپاره ساتل کېږي. اختلاط شوې .puz دوتنې نه شي پرانیستل کېدلی.\n\nد شطرنج معماګانې: د Lichess د معماګانو له ډیټابیس (CC0) یوه کوچنۍ ټولګه. چپ او ښي له مهرې څخه مهرې ته ټوپ وهي، هغه مهره وټاکئ چې غواړئ یې وخوځوئ، بیا چپ او ښي د هغه د رسېدو ځایونو له لارې، او بیا غوره کول. غلط حرکت بېرته کېږي. «اشاره» هغه مهره نښه کوي چې باید وخوځي، «راتلونکی» راتلونکې معما ته ځي.\n\nتخته یوازې هغه څلورګوټونه بیا انځوروي چې بدلېږي. احصایې هغه معماګانې شمېري چې تاسو حل کړې."
