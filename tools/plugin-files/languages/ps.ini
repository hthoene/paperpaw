dictionary.plugin.description = په StarDict قاموسونو کې کلمې لټوي.
dictionary.plugin.how = "قاموس د کتاب یوه کلمه په StarDict قاموسونو کې لټوي او تعریفونه د پردې د ښکتنۍ برخې پر سر په یوه پینل کې ښيي.\n\nپه لوستونکي کې یوه کلمه ونیسئ او «لټول» وټاکئ؛ له تڼیو سره د «نور» لاندې «متن غوره کول» وکاروئ. د قاموس پوښۍ (د .ifo، .idx او .dict دوتنو سره) په وسیله کې په «dictionaries» پوښۍ کې کاپي کړئ، فرعي پوښۍ هم، یا په ترتیباتو کې، د لوست لاندې، د «د قاموس پوښۍ» په توګه بله پوښۍ وټاکئ (پرمختللی ترتیب). لومړی لټون د هر قاموس لپاره یو کوچنی ایندېکس چمتو کوي، چې یو څه وخت نیسي.\n\nپه پینل کې، د پاڼې تڼۍ یا پورته او ښکته اوږدې تعریفونه سکرول کوي، او شاته یې تړي. په لمس سره د تړلو لپاره له هغه بهر ټک کړئ."
