vocabulary.sd.readme = "Картки з файлів\n\nПокладіть сюди файл для кожної колоди: Spanish.tsv створює колоду Spanish.\nФайли: .tsv, .csv або .txt, збережені як UTF-8, або .apkg: колода Anki, експортована з позначеною опцією «Підтримка старіших версій Anki». Перші три поля її нотаток стають лицьовим боком, зворотом і прикладом; її розклад і медіа не читаються, а PaperPaw ніколи не записує файл Anki.\n\nОдна картка в кожному рядку: лицьовий бік, зворот і приклад (необов'язково), розділені табуляцією, комою або крапкою з комою. Перший рядок може називати стовпці: front, back, example. Приклад:\n\nKatze\tcat\tDie Katze schläft.\n\nПотім відкрийте «Картки» на рідері, виберіть «Картки на SD-карті», а потім «Оновити колоди».\n\nКорисно знати:\n- Колоди залишаються на рідері разом із тим, що ви вивчили. Файл читається, коли він новий або змінений, і його картки додаються до колоди або змінюються там.\n- Змініть зворот або приклад картки у файлі: картка зміниться й збереже ваш прогрес.\n- Змініть текст лицьового боку картки: це вважається новою карткою, а стара починає спочатку. Картки зіставляються за текстом лицьового боку, пробіли й регістр не враховуються. Збережіть колоду у файл («Картки на SD-карті», «Зберегти колоду на карту»), і кожна картка матиме номер у стовпці id: змініть там лицьовий бік, залиште перші два рядки файлу як є, і картка збереже те, що ви вивчили.\n- Збереження записує картки колоди. Те, що було у файлі й не є карткою (рядок без лицьового боку), не зберігається; наявний файл копіюється в _name.bak.tsv.\n- Зберігайте файл як CSV UTF-8 (не UTF-16 і не власний формат таблиці). Файл понад 4 MiB або 20 000 рядків не читається: розділіть його.\n- Рядок, який ви видалили у файлі, не видаляє картку в колоді, якщо ви не ввімкнули «Видаляти відсутні картки» для цієї колоди. Тоді картка зникне разом із тим, що ви вивчили.\n- Файли, назви яких починаються з _, не читаються.\n"
