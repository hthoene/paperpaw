files.plugin.name = Огляд файлів
files.plugin.description = Показує книги й теки на пристрої та відкриває їх.
files.plugin.how = "Бібліотека показує книги з теки вашої бібліотеки: кожну з обкладинкою, назвою, автором і прогресом читання. Книга, яку ви читали останньою, стоїть угорі як картка, тож продовжити читання можна одним дотиком або одним натисканням «Вибрати». Поки бібліотека шукає книги, вона повідомляє, скільки вже знайдено.\n\nНад книгами виберіть, що показувати: усі, ті, що ви читаєте, непрочитані чи прочитані, або полиці (за автором, серією, тегом, обране, наступна книга кожної розпочатої серії). Торкніться книги, щоб читати її; утримуйте її (на кнопках утримуйте «Вибрати»), щоб відкрити, позначити прочитаною чи непрочитаною, переглянути інформацію, перемістити в архів або видалити. Торкніться назви, щоб відкрити меню бібліотеки: як сортуються й показуються книги, пошук, тека бібліотеки та налаштування.\n\nТеку бібліотеки задають у налаштуваннях, у розділі «Бібліотека», як «Тека бібліотеки»; там же можна показувати книги сіткою обкладинок. Для всіх інших файлів скористайтеся «Файлами» в меню інструментів."
