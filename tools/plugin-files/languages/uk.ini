update.plugin.name = Оновлення
update.plugin.description = Встановлює оновлення прошивки з карти або завантажені з інтернету.
update.plugin.how = "«Оновлення» встановлює нову прошивку на пристроях, де PaperPaw є прошивкою, наприклад X4. Воно є в налаштуваннях під назвою «Оновлення».\n\n«Шукати онлайн» запитує в сервера оновлень новішу версію PaperPaw і завантажує її, що займає кілька хвилин через Wi-Fi. Або скопіюйте файл оновлення (із закінченням .bin, з paperpaw.org) у теку updates на карті, наприклад через передачу через Wi-Fi. Встановлення триває приблизно хвилину, після чого пристрій перезапускається; книги, налаштування й позиції читання залишаються.\n\nЯкщо ввімкнено «Шукати оновлення» (у налаштуваннях, спочатку вимкнено), пристрій сам питає приблизно раз на тиждень, лише коли Wi-Fi і так увімкнено або пристрій заряджається. Знайдена новіша версія PaperPaw чекає тут; ніщо не перериває ваше читання. Пошук надсилає те, що працює на пристрої, без його імені чи номера; для підрахунку пристроїв також те, чи ви питали і чи це перший пошук за день, тиждень або місяць.\n\nЯкщо для плагінів, якими ви користуєтеся, ще немає версії для нового випуску, оновлення чекає на них. Старішу версію буде встановлено, лише якщо ви її виберете.\n\nІнша прошивка, наприклад CrossPoint, теж встановлюється звідси: покладіть її файл (із закінченням .bin) у теку updates і відкрийте «Оновлення». PaperPaw перевіряє, що це повна й непошкоджена прошивка для цього пристрою, але не може сказати, хто її створив, бо вона не підписана. «Все одно встановити» записує її в другу половину флеш-пам'яті, і пристрій її запускає; PaperPaw залишається у своїй половині, доки та прошивка не встановить щось поверх неї. Щоб пізніше повернутися до PaperPaw, встановіть його файл встановлення (paperpaw-<device>-<version>-install.bin) із меню іншої прошивки, наприклад «SD firmware update» у CrossPoint."
