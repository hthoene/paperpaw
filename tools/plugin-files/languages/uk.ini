vocabulary.sd.outcome.utf16 = Цей файл збережено в UTF-16. Збережіть його знову як CSV UTF-8 (у таблиці: CSV UTF-8).
vocabulary.sd.outcome.no-notes = Нотаток не знайдено: це не колода Anki або в ній немає нотаток. Експортуйте її з Anki як пакет колоди Anki (.apkg).
vocabulary.sd.outcome.newer-anki = Ця колода в найновішому форматі Anki. Експортуйте її знову з позначеною опцією «Підтримка старіших версій Anki».
vocabulary.sd.outcome.deck-too-large = Ця колода Anki завелика, щоб прочитати її тут: не більше 4000 файлів, 4 MiB нотаток і 20 000 нотаток. Експортуйте її без медіа й без розкладу або розділіть.
