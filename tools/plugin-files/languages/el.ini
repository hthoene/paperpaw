core.secrets-unopened = Ορισμένοι αποθηκευμένοι κωδικοί και κλειδιά σε αυτήν την κάρτα δεν μπορούν να ανοιχτούν εδώ: αποθηκεύτηκαν σε άλλη συσκευή ή το κλειδί αυτής της συσκευής χάθηκε. Εισαγάγετέ τα ξανά όπου τα ζητά ένα πρόσθετο.
core.secrets-unsupported = Αυτή η συσκευή δεν μπορεί ακόμη να αποθηκεύει κωδικούς. Εγκαταστήστε ξανά το PaperPaw μία φορά με το web flasher στο paperpaw.org και θα λειτουργήσει.
