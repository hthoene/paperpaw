vocabulary.sd.skipped-notes.other = {count} σημειώσεις παραλείφθηκαν: είναι πολύ μεγάλες (π.χ. περιέχουν εικόνα)
vocabulary.sd.no-room = {count} γραμμές δεν χώρεσαν: μια τράπουλα χωρά 20.000 κάρτες.
vocabulary.sd.outcome.same = Δεν άλλαξε από την τελευταία ενημέρωση.
vocabulary.sd.outcome.unreadable = Δεν ήταν δυνατή η ανάγνωση αυτού του αρχείου. Ελέγξτε την κάρτα και δοκιμάστε ξανά.
vocabulary.sd.outcome.too-many = Υπάρχουν ήδη 50 τράπουλες, γι' αυτό το αρχείο δεν διαβάστηκε. Διαγράψτε πρώτα μια τράπουλα.
vocabulary.sd.outcome.crowded = Πάρα πολλές κάρτες έχουν την ίδια μπροστινή όψη, γι' αυτό το αρχείο δεν διαβάστηκε. Κάντε τις μπροστινές όψεις διαφορετικές.
vocabulary.sd.outcome.no-cards = Δεν βρέθηκαν κάρτες. Κάρτα είναι μια γραμμή με κείμενο μπροστινής όψης· η μπροστινή όψη είναι η πρώτη στήλη.
vocabulary.sd.outcome.too-large = Αυτό το αρχείο είναι πολύ μεγάλο: έως 4 MiB και 20.000 γραμμές. Χωρίστε το σε πολλά αρχεία.
vocabulary.sd.outcome.utf16 = Αυτό το αρχείο είναι αποθηκευμένο ως UTF-16. Αποθηκεύστε το ξανά ως CSV UTF-8 (σε λογιστικό φύλλο: CSV UTF-8).
vocabulary.sd.outcome.no-notes = Δεν βρέθηκαν σημειώσεις: δεν είναι τράπουλα Anki ή δεν έχει σημειώσεις. Εξαγάγετέ την από το Anki ως πακέτο τράπουλας Anki (.apkg).
vocabulary.sd.outcome.newer-anki = Αυτή η τράπουλα είναι στη νεότερη μορφή του Anki. Εξαγάγετέ την ξανά με επιλεγμένο το Support older Anki versions.
vocabulary.sd.outcome.deck-too-large = Αυτή η τράπουλα Anki είναι πολύ μεγάλη για να διαβαστεί εδώ: έως 4.000 αρχεία, 4 MiB σημειώσεων και 20.000 σημειώσεις. Εξαγάγετέ την χωρίς πολυμέσα και χωρίς προγραμματισμό επαναλήψεων ή χωρίστε την.
vocabulary.sd.line = Γραμμή {line}
vocabulary.sd.fault.no-front = Δεν υπάρχει κείμενο στη στήλη της μπροστινής όψης. Βάλτε εκεί τη λέξη.
vocabulary.sd.fault.not-utf8 = Δεν είναι κείμενο UTF-8. Αποθηκεύστε το αρχείο ως UTF-8 (σε λογιστικό φύλλο: CSV UTF-8).
vocabulary.sd.fault.too-long = Μεγαλύτερο από 8 KiB. Κάντε την κάρτα πιο σύντομη.
vocabulary.sd.fault.open-quote = Ανοίγει εισαγωγικό που δεν κλείνει. Κλείστε το ή αφαιρέστε το.
vocabulary.setting.sd-auto = Ενημέρωση των τραπουλών από την κάρτα στο άνοιγμα
vocabulary.setting.sd-auto.help = Οι Κάρτες μελέτης διαβάζουν τα αρχεία του φακέλου που είναι νέα ή άλλαξαν.
vocabulary.setting.sd-folder = Φάκελος για τα αρχεία των τραπουλών
vocabulary.setting.sd-folder.help = Στην κάρτα SD: ένα αρχείο CSV, TSV ή Anki σε αυτόν είναι μια τράπουλα.
vocabulary.sd.readme = "Κάρτες μελέτης από αρχεία\n\nΒάλτε εδώ ένα αρχείο για κάθε τράπουλα: το Spanish.tsv φτιάχνει την τράπουλα Spanish.\nΑρχεία: .tsv, .csv ή .txt, αποθηκευμένα ως UTF-8, ή .apkg: μια τράπουλα Anki, εξαγμένη με επιλεγμένο το Support older Anki versions. Τα τρία πρώτα πεδία των σημειώσεών της γίνονται μπροστινή όψη, πίσω όψη και παράδειγμα· ο προγραμματισμός επαναλήψεων και τα πολυμέσα της δεν διαβάζονται και το PaperPaw δεν γράφει ποτέ αρχείο Anki.\n\nΜία κάρτα σε κάθε γραμμή: μπροστινή όψη, πίσω όψη και παράδειγμα (προαιρετικό), χωρισμένα με tab, κόμμα ή semicolon. Η πρώτη γραμμή μπορεί να ονομάζει τις στήλες: front, back, example. Παράδειγμα:\n\nKatze\tcat\tDie Katze schläft.\n\nΜετά ανοίξτε τις Κάρτες μελέτης στον αναγνώστη, επιλέξτε Κάρτες μελέτης στην κάρτα SD και μετά Ενημέρωση των τραπουλών από την κάρτα.\n\nΚαλό είναι να ξέρετε:\n- Οι τράπουλες μένουν στον αναγνώστη, με όσα μάθατε. Ένα αρχείο διαβάζεται όταν είναι νέο ή έχει αλλάξει και οι κάρτες του προστίθενται στην τράπουλα ή αλλάζουν εκεί.\n- Αλλάξτε την πίσω όψη ή το παράδειγμα μιας κάρτας στο αρχείο: η κάρτα αλλάζει και κρατά την πρόοδό σας.\n- Αλλάξτε το κείμενο της μπροστινής όψης μιας κάρτας: μετράει ως νέα κάρτα και η παλιά ξεκινά από την αρχή. Οι κάρτες αντιστοιχίζονται από το κείμενο της μπροστινής όψης τους· τα κενά και τα κεφαλαία δεν μετρούν. Αποθηκεύστε μια τράπουλα σε αρχείο (Κάρτες μελέτης στην κάρτα SD, Αποθήκευση της τράπουλας στην κάρτα) και κάθε κάρτα έχει έναν αριθμό στη στήλη id: αλλάξτε εκεί μια μπροστινή όψη, αφήστε τις δύο πρώτες γραμμές του αρχείου όπως είναι και η κάρτα κρατά όσα μάθατε.\n- Η αποθήκευση γράφει τις κάρτες της τράπουλας. Ό,τι υπήρχε στο αρχείο και δεν είναι κάρτα (μια γραμμή χωρίς μπροστινή όψη) δεν διατηρείται· το αρχείο που υπήρχε αντιγράφεται στο _όνομα.bak.tsv.\n- Αποθηκεύστε το αρχείο ως CSV UTF-8 (όχι UTF-16, όχι στη δική της μορφή ενός λογιστικού φύλλου). Ένα αρχείο άνω των 4 MiB ή των 20.000 γραμμών δεν διαβάζεται: χωρίστε το.\n- Μια γραμμή που διαγράφετε στο αρχείο δεν διαγράφει την κάρτα στην τράπουλα, εκτός αν ενεργοποιήσετε το Αφαίρεση καρτών που λείπουν για αυτήν την τράπουλα. Τότε η κάρτα φεύγει μαζί με όσα μάθατε.\n- Αρχεία των οποίων το όνομα ξεκινά με _ δεν διαβάζονται.\n"
