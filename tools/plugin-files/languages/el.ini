update.plugin.name = Ενημέρωση
update.plugin.description = Εγκαθιστά ενημερώσεις του λογισμικού συσκευής, από την κάρτα ή με λήψη από το διαδίκτυο.
update.plugin.how = "Η Ενημέρωση εγκαθιστά νέο λογισμικό συσκευής, σε συσκευές όπου το PaperPaw είναι το λογισμικό συσκευής, όπως το X4. Θα τη βρείτε στις ρυθμίσεις, ως Ενημέρωση.\n\nΗ Αναζήτηση online ρωτά τον διακομιστή ενημερώσεων για νεότερο PaperPaw και το κατεβάζει, κάτι που παίρνει μερικά λεπτά μέσω Wi-Fi. Ή αντιγράψτε ένα αρχείο ενημέρωσης (με κατάληξη .bin, από το paperpaw.org) στον φάκελο updates της κάρτας, για παράδειγμα με μεταφορά μέσω Wi-Fi. Η Εγκατάσταση παίρνει τότε περίπου ένα λεπτό και η συσκευή επανεκκινείται· τα βιβλία, οι ρυθμίσεις και οι θέσεις ανάγνωσης παραμένουν.\n\nΜε την επιλογή Έλεγχος για ενημερώσεις (στις ρυθμίσεις, αρχικά ανενεργή), η συσκευή ρωτά περίπου μία φορά την εβδομάδα από μόνη της, μόνο όσο το Wi-Fi είναι ούτως ή άλλως ενεργό ή η συσκευή φορτίζει. Ένα νεότερο PaperPaw που θα βρει περιμένει εδώ· τίποτα δεν διακόπτει την ανάγνωσή σας. Μια αναζήτηση στέλνει τι τρέχει η συσκευή, όχι όνομα ή αριθμό της· για την καταμέτρηση των συσκευών, στέλνει επίσης αν ρωτήσατε εσείς και αν είναι η πρώτη της αναζήτηση της ημέρας, της εβδομάδας ή του μήνα.\n\nΑν πρόσθετα που χρησιμοποιείτε δεν έχουν ακόμη έκδοση για τη νέα κυκλοφορία, η ενημέρωση τα περιμένει. Μια παλαιότερη έκδοση εγκαθίσταται μόνο αν τη διαλέξετε.\n\nΚαι άλλο λογισμικό συσκευής, όπως το CrossPoint, εγκαθίσταται από εδώ: βάλτε το αρχείο του (με κατάληξη .bin) στον φάκελο updates και ανοίξτε την Ενημέρωση. Το PaperPaw ελέγχει ότι είναι πλήρες λογισμικό συσκευής για αυτήν τη συσκευή, χωρίς ζημιά, αλλά δεν μπορεί να πει ποιος το έφτιαξε, αφού δεν είναι υπογεγραμμένο. Η Εγκατάσταση ούτως ή άλλως το γράφει στο άλλο μισό της μνήμης flash και η συσκευή το ξεκινά· το PaperPaw μένει στο μισό του μέχρι εκείνο το λογισμικό να εγκαταστήσει κάτι από πάνω. Για να επιστρέψετε αργότερα στο PaperPaw, εγκαταστήστε το αρχείο εγκατάστασής του (paperpaw-<device>-<version>-install.bin) από το μενού του άλλου λογισμικού, όπως η ενημέρωση λογισμικού από SD του CrossPoint."
