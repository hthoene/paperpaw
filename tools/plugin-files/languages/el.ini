joplin.plugin.name = Συγχρονισμός σημειώσεων βιβλίων
joplin.plugin.description = Κρατά τις επισημάνσεις και τις σημειώσεις κάθε βιβλίου σε μια σημείωση. Λειτουργεί με το Joplin (Joplin Cloud, Joplin Server ή WebDAV).
