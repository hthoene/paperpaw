files.plugin.name = Περιήγηση αρχείων
files.plugin.description = Εμφανίζει τα βιβλία και τους φακέλους της συσκευής και τα ανοίγει.
files.plugin.how = "Η βιβλιοθήκη εμφανίζει τα βιβλία του φακέλου βιβλιοθήκης σας, το καθένα με το εξώφυλλο, τον τίτλο, τον συγγραφέα και το πόσο το έχετε διαβάσει. Το βιβλίο που διαβάσατε τελευταίο εμφανίζεται στην κορυφή ως κάρτα, ώστε η συνέχεια της ανάγνωσης να θέλει ένα πάτημα ή ένα πάτημα του Επιλογή. Όσο η βιβλιοθήκη αναζητά βιβλία, εμφανίζει πόσα έχει βρει μέχρι στιγμής.\n\nΕπάνω από τα βιβλία επιλέγετε τι εμφανίζεται: όλα, όσα διαβάζετε, τα αδιάβαστα ή τα διαβασμένα, ή τα ράφια (ανά συγγραφέα, σειρά, ετικέτα, αγαπημένα, το επόμενο βιβλίο κάθε σειράς που έχετε ξεκινήσει). Πατήστε ένα βιβλίο για να το διαβάσετε· κρατήστε το πατημένο (με κουμπιά, κρατήστε πατημένο το Επιλογή) για να το ανοίξετε, να το σημάνετε ως διαβασμένο ή αδιάβαστο, να δείτε τις πληροφορίες του, να το μετακινήσετε στην αρχειοθήκη ή να το διαγράψετε. Πατήστε τον τίτλο για το μενού της βιβλιοθήκης: πώς ταξινομούνται και εμφανίζονται τα βιβλία, αναζήτηση, ο φάκελος βιβλιοθήκης και ρυθμίσεις.\n\nΟ φάκελος βιβλιοθήκης ορίζεται στις Ρυθμίσεις, στην ενότητα Βιβλιοθήκη, ως Φάκελος βιβλιοθήκης· εκεί μπορείτε επίσης να εμφανίζετε τα βιβλία ως πλέγμα εξωφύλλων. Για κάθε άλλο αρχείο, χρησιμοποιήστε το Αρχεία στο μενού Εργαλεία."
