joplin.idle = Οι σημειώσεις που εξάγονται στέλνονται αμέσως στο Joplin.
joplin.waiting.one = Οι σημειώσεις {count} βιβλίου περιμένουν να σταλούν.
joplin.waiting.other = Οι σημειώσεις {count} βιβλίων περιμένουν να σταλούν.
joplin.sent.one = Οι σημειώσεις {count} βιβλίου βρίσκονται στο Joplin.
joplin.sent.other = Οι σημειώσεις {count} βιβλίων βρίσκονται στο Joplin.
joplin.some-failed = Στάλθηκαν στο Joplin: {sent}. Δεν στάλθηκαν: {failed}· θα σταλούν ξανά αργότερα.
