vocabulary.web.import-help = Προσθέστε ένα αρχείο CSV, TSV ή TXT με μία κάρτα σε κάθε γραμμή, ή μια τράπουλα εξαγμένη από το Anki (.apkg, με «Support older Anki versions»), ή επικολλήστε μια λίστα. Οι κάρτες μπαίνουν σε αυτήν την τράπουλα. Κάθε γραμμή: μπροστινή όψη, πίσω όψη και παράδειγμα (προαιρετικό), χωρισμένα με tab, κόμμα ή semicolon. Παράδειγμα: Katze;cat;Die Katze schläft. Τα αρχεία πρέπει να είναι κείμενο UTF-8· έως 20.000 κάρτες ανά τράπουλα.
