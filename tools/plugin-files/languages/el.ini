vocabulary.sd.save.unreadable = Δεν ήταν δυνατή η ανάγνωση της λίστας των συνδεδεμένων αρχείων, γι' αυτό δεν γράφτηκε τίποτα. Ελέγξτε την κάρτα και δοκιμάστε ξανά.
vocabulary.sd.save.full = Η κάρτα είναι γεμάτη, γι' αυτό δεν γράφτηκε τίποτα. Ελευθερώστε χώρο και δοκιμάστε ξανά.
vocabulary.sd.save.too-large = Αυτή η τράπουλα είναι πολύ μεγάλη για ένα αρχείο (4 MiB, το μέγιστο που διαβάζει μια ενημέρωση). Το αρχείο στην κάρτα δεν άλλαξε.
vocabulary.sd.save.failed = Δεν ήταν δυνατή η εγγραφή του αρχείου. Το αρχείο στην κάρτα δεν άλλαξε. Ελέγξτε την κάρτα και δοκιμάστε ξανά.
vocabulary.sd.save.not-updated = Δεν αποθηκεύτηκε: δεν ήταν δυνατό να διαβαστεί πρώτα το αρχείο στην κάρτα και μπορεί να έχει αλλαγές που η τράπουλα δεν έχει ακόμη. Διορθώστε το αρχείο και δοκιμάστε ξανά.
vocabulary.sd.save.left-out = Δεν αποθηκεύτηκε: ορισμένες γραμμές του αρχείου δεν ήταν δυνατό να διαβαστούν και η αποθήκευση θα τις απέρριπτε. Διορθώστε το αρχείο, ενημερώστε και δοκιμάστε ξανά.
vocabulary.sd.save.anki = Το {file} είναι αρχείο Anki: διαβάζεται μόνο, δεν γράφεται ποτέ.
vocabulary.sd.save.anki-refused = Δεν αποθηκεύτηκε: το {file} είναι τράπουλα Anki, που το PaperPaw μόνο διαβάζει. Εξαγάγετε ξανά την τράπουλα από το Anki για να την ενημερώσετε.
vocabulary.sd.removal-held = Δεν αφαιρέθηκε καμία κάρτα: ορισμένες γραμμές δεν ήταν δυνατό να διαβαστούν.
