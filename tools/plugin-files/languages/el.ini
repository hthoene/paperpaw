joplin.service = Συγχρονισμός με
joplin.service.help = Με τι συγχρονίζεται το Joplin, όπως ορίζεται στο Joplin: Joplin Cloud, δικό σας Joplin Server ή φάκελος WebDAV, όπως το Nextcloud. Δεν χρειάζεται να λειτουργεί υπολογιστής.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = Διεύθυνση
joplin.address.help = Joplin Server: η διεύθυνσή του, π.χ. joplin.example.org. WebDAV: ο φάκελος με τον οποίο συγχρονίζεται το Joplin, όπως στις ρυθμίσεις του, π.χ. dav.example.org/Joplin.
joplin.email = Email
joplin.user = Όνομα χρήστη
joplin.user.help = Joplin Cloud και Joplin Server: το email με το οποίο συνδέεστε (η σύνδεση δύο παραγόντων δεν μπορεί να χρησιμοποιηθεί ακόμη). WebDAV: το όνομα χρήστη του φακέλου.
joplin.password = Κωδικός
joplin.password.help = Φυλάσσεται με τους άλλους κωδικούς και κλειδιά σε αυτήν τη συσκευή. Για το Nextcloud, λειτουργεί και ένας κωδικός εφαρμογής.
joplin.secret = Κωδικός Joplin
