vocabulary.web.not-utf8 = Αυτό το αρχείο δεν είναι κείμενο UTF-8. Στο λογιστικό φύλλο ή τον επεξεργαστή κειμένου σας, αποθηκεύστε το ως CSV (UTF-8) και επιλέξτε το ξανά.
vocabulary.web.partial = Προστέθηκαν κάρτες: {count}. Η τράπουλα είναι γεμάτη (20.000 κάρτες): οι υπόλοιπες παραλείφθηκαν. Χρησιμοποιήστε άλλη τράπουλα γι' αυτές.
