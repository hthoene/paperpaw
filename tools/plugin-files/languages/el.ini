update.dual-boot.help = Το PaperPaw μοιράζεται αυτήν τη συσκευή με άλλο λογισμικό συσκευής, γι' αυτό δεν εγκαθιστά ενημερώσεις εδώ. Ενημερώστε το PaperPaw με το εργαλείο που χρησιμοποιήσατε για να το ρυθμίσετε. Δεν υπάρχει δεύτερο λογισμικό συσκευής; Πείτε το με το κουμπί παρακάτω ή εγκαταστήστε ξανά το PaperPaw μέσω USB στο paperpaw.org/flash.
