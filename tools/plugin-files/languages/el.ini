joplin.apart.other = Αλλάχθηκαν {count} σημειώσεις στο Joplin, γι' αυτό δημιουργήθηκαν νέες δίπλα τους.
joplin.nothing = Καμία σημείωση δεν περιμένει να σταλεί στο Joplin.
joplin.no-network = Η αποστολή στο Joplin χρειάζεται δίκτυο. Οι σημειώσεις περιμένουν και θα σταλούν αργότερα.
joplin.setup-needed = Ρυθμίστε πρώτα το Joplin: με τι συγχρονίζεται, ο λογαριασμός και ο κωδικός σας.
joplin.no-time = Η ώρα δεν είναι ακόμη γνωστή. Οι σημειώσεις περιμένουν και θα σταλούν αργότερα.
joplin.unreachable = Δεν είναι δυνατή η σύνδεση με το Joplin. Οι σημειώσεις περιμένουν και θα σταλούν αργότερα.
joplin.failed = Το Joplin απάντησε με σφάλμα ({status}). Οι σημειώσεις περιμένουν και θα σταλούν αργότερα.
joplin.bad-login = Το Joplin δεν δέχτηκε το email, το όνομα χρήστη ή τον κωδικό. Ελέγξτε τα στη ρύθμιση του Joplin.
joplin.no-server = Δεν υπάρχει Joplin Server σε αυτήν τη διεύθυνση. Ελέγξτε την στη ρύθμιση του Joplin.
joplin.bad-address = Η διεύθυνση δεν μπορεί να χρησιμοποιηθεί από το PaperPaw. Ελέγξτε την στη ρύθμιση του Joplin.
joplin.no-data = Δεν υπάρχουν σημειώσεις Joplin σε αυτήν τη διεύθυνση. Ελέγξτε την ή συγχρονίστε πρώτα το Joplin με αυτήν.
joplin.encrypted = Η κρυπτογράφηση από άκρο σε άκρο του Joplin είναι ενεργή. Το PaperPaw δεν μπορεί να κρυπτογραφήσει σημειώσεις, γι' αυτό δεν στέλνει καμία.
joplin.newer-target = Το Joplin φυλάσσει εκεί τις σημειώσεις σε νεότερη μορφή από αυτήν που γνωρίζει αυτό το PaperPaw. Ενημερώστε το PaperPaw για να τις στείλετε.
joplin.older-target = Το Joplin φυλάσσει εκεί τις σημειώσεις σε παλαιότερη μορφή. Ανοίξτε το Joplin για να το αναβαθμίσετε και στείλτε ξανά.
joplin.upgrading = Το Joplin αναβαθμίζει αυτήν τη στιγμή τις σημειώσεις εκεί. Περιμένουν και θα σταλούν αργότερα.
joplin.no-memory = Δεν υπάρχει αρκετή μνήμη για την αποστολή των σημειώσεων. Κάντε επανεκκίνηση και δοκιμάστε ξανά.
