update.plugin.name = به‌روزرسانی
update.plugin.description = به‌روزرسانی سیستم‌افزار را از کارت حافظه یا از اینترنت نصب می‌کند.
update.plugin.how = "«به‌روزرسانی» سیستم‌افزار جدید را روی دستگاه‌هایی نصب می‌کند که PaperPaw خودش سیستم‌افزارشان است، مثل X4. آن را در تنظیمات، با نام «به‌روزرسانی» پیدا می‌کنید.\n\n«جست‌وجوی آنلاین» از سرور به‌روزرسانی نسخهٔ جدیدتر PaperPaw را می‌پرسد و دانلودش می‌کند که با Wi-Fi چند دقیقه طول می‌کشد. یا یک فایل به‌روزرسانی (با پسوند .bin، از paperpaw.org) را در پوشهٔ updates روی کارت حافظه کپی کنید، مثلاً با انتقال Wi-Fi. نصب حدود یک دقیقه طول می‌کشد و دستگاه راه‌اندازی مجدد می‌شود؛ کتاب‌ها، تنظیمات و جایگاه مطالعه می‌مانند.\n\nبا «بررسی به‌روزرسانی‌ها» (در تنظیمات، در ابتدا خاموش)، دستگاه خودش تقریباً هفته‌ای یک بار می‌پرسد، فقط وقتی Wi-Fi به هر حال روشن است یا دستگاه شارژ می‌شود. اگر PaperPaw جدیدتری پیدا کند، این‌جا منتظر می‌ماند؛ هیچ چیز مطالعهٔ شما را قطع نمی‌کند. جست‌وجو فقط می‌فرستد که دستگاه چه چیزی اجرا می‌کند، نه نام یا شمارهٔ آن؛ برای شمارش دستگاه‌ها، همچنین این‌که شما پرسیده‌اید یا نه و این نخستین جست‌وجوی آن روز، هفته یا ماه است یا نه.\n\nاگر افزونه‌هایی که استفاده می‌کنید هنوز نسخه‌ای برای نسخهٔ جدید ندارند، به‌روزرسانی منتظرشان می‌ماند. نسخهٔ قدیمی‌تر فقط وقتی نصب می‌شود که خودتان انتخابش کنید.\n\nسیستم‌افزار دیگری، مثل CrossPoint، هم از این‌جا نصب می‌شود: فایلش (با پسوند .bin) را در پوشهٔ updates بگذارید و «به‌روزرسانی» را باز کنید. PaperPaw بررسی می‌کند که سیستم‌افزاری کامل و سالم برای این دستگاه باشد، اما نمی‌تواند بگوید چه کسی ساخته، چون امضا نشده است. «نصب در هر حال» آن را در نیمهٔ دیگر حافظهٔ فلش می‌نویسد و دستگاه آن را اجرا می‌کند؛ PaperPaw در نیمهٔ خودش می‌ماند تا آن سیستم‌افزار چیزی روی آن نصب کند. برای بازگشت به PaperPaw در آینده، فایل نصب آن (paperpaw-<device>-<version>-install.bin) را از منوی سیستم‌افزار دیگر نصب کنید، مثل «به‌روزرسانی سیستم‌افزار از SD» در CrossPoint."
