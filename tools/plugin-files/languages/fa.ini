files.plugin.name = مرورگر فایل
files.plugin.description = کتاب‌ها و پوشه‌های دستگاه را فهرست می‌کند و باز می‌کند.
files.plugin.how = "کتابخانه کتاب‌های پوشهٔ کتابخانهٔ شما را فهرست می‌کند، هر کدام با جلد، عنوان، نویسنده و میزان پیشرفت مطالعه. آخرین کتابی که خوانده‌اید به شکل کارتی بالا قرار می‌گیرد، پس ادامهٔ مطالعه فقط یک ضربه یا یک بار فشار دادن Select است. تا وقتی کتابخانه در حال جست‌وجوی کتاب‌هاست، تعداد کتاب‌های پیدا‌شده تا اینجا را نشان می‌دهد.\n\nبالای کتاب‌ها انتخاب می‌کنید چه چیزی نشان داده شود: همهٔ کتاب‌ها، کتاب‌های در حال مطالعه، نخوانده یا تمام‌شده، یا قفسه‌ها (بر اساس نویسنده، مجموعه، برچسب، موردعلاقه‌ها، کتاب بعدی هر مجموعه‌ای که شروع کرده‌اید). برای خواندن روی کتاب ضربه بزنید؛ برای باز کردن منوی آن، کتاب را نگه دارید (با دکمه‌ها، Select را نگه دارید) تا بتوانید آن را باز کنید، تمام‌شده یا نخوانده علامت بزنید، اطلاعاتش را ببینید، به بایگانی ببرید یا حذف کنید. روی عنوان ضربه بزنید تا منوی کتابخانه باز شود: مرتب‌سازی و نحوهٔ نمایش کتاب‌ها، جست‌وجو، پوشهٔ کتابخانه و تنظیمات.\n\nپوشهٔ کتابخانه در تنظیمات، بخش کتابخانه، با عنوان پوشهٔ کتابخانه تعیین می‌شود؛ همان‌جا می‌توانید کتاب‌ها را به شکل جدولی از جلدها هم نشان دهید. برای هر فایل دیگر از «فایل‌ها» در منوی ابزارها استفاده کنید."
files.title = کتابخانه
files.empty = کتاب‌ها (EPUB، FB2، TXT و غیره) را از رایانه در پوشهٔ «{dir}» کپی کنید، یا آن‌ها را با Wi-Fi بگیرید: انتقال با Wi-Fi و کاتالوگ‌ها در ابزارها هستند، و Calibre هم پس از افزودن.
