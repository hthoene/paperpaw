joplin.some-failed = به Joplin ارسال شد: {sent}. ارسال‌نشده: {failed}؛ بعداً دوباره ارسال می‌شوند.
joplin.apart.one = {count} یادداشت در Joplin تغییر کرده بود، پس یادداشت جدیدی کنار آن ساخته شد.
joplin.apart.other = {count} یادداشت در Joplin تغییر کرده بود، پس یادداشت‌های جدیدی کنار آن‌ها ساخته شد.
joplin.nothing = یادداشتی منتظر ارسال به Joplin نیست.
joplin.no-network = ارسال به Joplin به شبکه نیاز دارد. یادداشت‌ها منتظر می‌مانند و بعداً ارسال می‌شوند.
joplin.setup-needed = ابتدا Joplin را تنظیم کنید: مقصد همگام‌سازی، حساب و گذرواژه‌تان.
joplin.no-time = زمان هنوز معلوم نیست. یادداشت‌ها منتظر می‌مانند و بعداً ارسال می‌شوند.
joplin.unreachable = به Joplin دسترسی نیست. یادداشت‌ها منتظر می‌مانند و بعداً ارسال می‌شوند.
joplin.failed = Joplin با خطا پاسخ داد ({status}). یادداشت‌ها منتظر می‌مانند و بعداً ارسال می‌شوند.
joplin.bad-login = Joplin ایمیل، نام کاربری یا گذرواژه را نپذیرفت. آن‌ها را در تنظیمات Joplin بررسی کنید.
joplin.no-server = در این نشانی Joplin Server وجود ندارد. آن را در تنظیمات Joplin بررسی کنید.
joplin.bad-address = این نشانی برای PaperPaw قابل استفاده نیست. آن را در تنظیمات Joplin بررسی کنید.
joplin.no-data = در این نشانی یادداشتی از Joplin نیست. آن را بررسی کنید، یا ابتدا Joplin را با آن همگام کنید.
joplin.encrypted = رمزگذاری سرتاسری Joplin روشن است. PaperPaw نمی‌تواند یادداشت‌ها را رمزگذاری کند، پس چیزی ارسال نمی‌کند.
joplin.newer-target = Joplin یادداشت‌ها را آنجا با قالبی جدیدتر از آنچه این PaperPaw می‌شناسد نگه می‌دارد. برای ارسال، PaperPaw را به‌روز کنید.
joplin.older-target = Joplin یادداشت‌ها را آنجا با قالبی قدیمی‌تر نگه می‌دارد. Joplin را باز کنید تا ارتقا یابد، سپس دوباره ارسال کنید.
joplin.upgrading = Joplin همین حالا یادداشت‌های آنجا را ارتقا می‌دهد. یادداشت‌ها منتظر می‌مانند و بعداً ارسال می‌شوند.
joplin.no-memory = حافظه برای ارسال یادداشت‌ها کافی نیست. دوباره راه‌اندازی کنید و تلاش کنید.
