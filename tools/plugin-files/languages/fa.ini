vocabulary.sd.readme = "فلش‌کارت‌ها از فایل‌ها\n\nبرای هر دسته این‌جا یک فایل بگذارید: Spanish.tsv دستهٔ Spanish را می‌سازد.\nفایل‌ها: .tsv، .csv یا .txt، ذخیره‌شده با UTF-8، یا .apkg: دستهٔ Anki که با روشن بودن Support older Anki versions برون‌بری شده باشد. سه فیلد اول یادداشت‌هایش روی کارت، پشت کارت و مثال می‌شوند؛ زمان‌بندی و رسانه‌اش خوانده نمی‌شود و PaperPaw هرگز فایل Anki نمی‌نویسد.\n\nروی هر خط یک کارت: روی کارت، پشت کارت و مثال (اختیاری)، جداشده با Tab، ویرگول یا نقطه‌ویرگول. خط اول می‌تواند نام ستون‌ها باشد: front، back، example. نمونه:\n\nKatze\tcat\tDie Katze schläft.\n\nسپس روی کتاب‌خوان «فلش‌کارت‌ها» را باز کنید، «کارت‌ها روی کارت SD» و بعد «به‌روزرسانی دسته‌ها از کارت» را انتخاب کنید.\n\nنکته‌هایی که باید دانست:\n- دسته‌ها با آنچه یاد گرفته‌اید روی کتاب‌خوان می‌مانند. فایل وقتی جدید یا تغییرکرده باشد خوانده می‌شود و کارت‌هایش به دسته افزوده یا همان‌جا تغییر داده می‌شوند.\n- پشت یا مثال کارتی را در فایل تغییر دهید: کارت تغییر می‌کند و پیشرفت شما می‌ماند.\n- متن روی کارت را تغییر دهید: کارت جدید حساب می‌شود و کارت قدیمی از نو شروع می‌کند. کارت‌ها با متن روی کارتشان تطبیق داده می‌شوند، فاصله و بزرگی حروف حساب نمی‌شود. دسته‌ای را در فایل ذخیره کنید (کارت‌ها روی کارت SD، ذخیرهٔ دسته روی کارت) و هر کارت در ستون id شماره‌ای دارد: آن‌جا روی کارت را تغییر دهید، دو خط اول فایل را همان‌طور که هست نگه دارید، و کارت آنچه را یاد گرفته‌اید نگه می‌دارد.\n- ذخیره، کارت‌های دسته را می‌نویسد. آنچه در فایل بود و کارت نیست (خطی بدون روی کارت) نگه داشته نمی‌شود؛ فایلی که آن‌جا بود در _name.bak.tsv کپی می‌شود.\n- فایل را با CSV UTF-8 ذخیره کنید (نه UTF-16، نه قالب خاص صفحه‌گسترده). فایل بزرگ‌تر از 4 MiB یا بیش از 20,000 خط خوانده نمی‌شود: آن را تقسیم کنید.\n- خطی که در فایل پاک می‌کنید کارت را در دسته پاک نمی‌کند، مگر این‌که برای آن دسته «حذف کارت‌های ناموجود» را روشن کنید. آن‌گاه کارت با آنچه یاد گرفته‌اید می‌رود.\n- فایل‌هایی که نامشان با _ شروع می‌شود خوانده نمی‌شوند.\n"
