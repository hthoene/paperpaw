vocabulary.sd.readme = "فلش‌کارت از پرونده‌ها\n\nبرای هر دسته اینجا یک پرونده بگذارید: Spanish.tsv دستهٔ Spanish را می‌سازد.\nپرونده‌ها: ‎.tsv، ‎.csv یا ‎.txt با ذخیرهٔ UTF-8، یا ‎.apkg: یک دستهٔ Anki که با تیک Support older Anki versions صادر شده باشد. سه فیلد اول یادداشت‌های آن روی کارت، پشت کارت و مثال می‌شوند؛ زمان‌بندی و رسانه خوانده نمی‌شوند و PaperPaw هرگز پروندهٔ Anki نمی‌نویسد.\n\nروی هر خط یک کارت: روی کارت، پشت کارت و مثال (اختیاری)، جداشده با تب، ویرگول یا نقطه‌ویرگول. خط اول می‌تواند نام ستون‌ها باشد: front، back، example. نمونه:\n\nKatze\tcat\tDie Katze schläft.\n\nسپس فلش‌کارت را روی دستگاه باز کنید، «کارت‌های روی کارت حافظه» و بعد «به‌روزرسانی دسته‌ها از کارت» را انتخاب کنید.\n\nخوب است بدانید:\n- دسته‌ها همراه با آموخته‌های شما روی دستگاه می‌مانند. پرونده وقتی جدید یا تغییرکرده باشد خوانده می‌شود و کارت‌هایش به دسته افزوده یا در آن تغییر داده می‌شوند.\n- پشت یا مثال یک کارت را در پرونده عوض کنید: کارت تغییر می‌کند و پیشرفت شما می‌ماند.\n- متن روی کارت را عوض کنید: کارت جدید حساب می‌شود و کارت قدیمی از نو شروع می‌کند. کارت‌ها با متن روی کارت شناسایی می‌شوند؛ فاصله و حروف بزرگ و کوچک اهمیتی ندارند. دسته را در پرونده ذخیره کنید («کارت‌های روی کارت حافظه»، «ذخیرهٔ دسته در کارت») تا هر کارت در ستون id شماره‌ای داشته باشد: آنجا روی کارت را عوض کنید، دو خط اول پرونده را همان‌طور نگه دارید و کارت آموخته‌هایش را حفظ می‌کند.\n- ذخیره‌کردن کارت‌های دسته را می‌نویسد. آنچه در پرونده بود و کارت نیست (خطی بدون روی کارت) نگه داشته نمی‌شود؛ پروندهٔ قبلی در _name.bak.tsv کپی می‌شود.\n- پرونده را با CSV UTF-8 ذخیره کنید (نه UTF-16 و نه قالب خاص برنامهٔ صفحه‌گسترده). پروندهٔ بزرگ‌تر از 4 MiB یا بیش از 20,000 خط خوانده نمی‌شود: آن را تقسیم کنید.\n- خطی که در پرونده پاک کنید کارت دسته را پاک نمی‌کند، مگر اینکه برای آن دسته «حذف کارت‌های غایب» را روشن کنید. آن‌گاه کارت همراه با آموخته‌هایش می‌رود.\n- پرونده‌هایی که نامشان با _ شروع می‌شود خوانده نمی‌شوند.\n"
