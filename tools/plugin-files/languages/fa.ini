update.dual-boot.help = PaperPaw این دستگاه را با سیستم‌افزار دیگری شریک است، پس این‌جا به‌روزرسانی نصب نمی‌کند. PaperPaw را با همان ابزاری که برای راه‌اندازی به کار بردید به‌روز کنید. سیستم‌افزار دومی روی دستگاه نیست؟ با دکمهٔ زیر بگویید، یا PaperPaw را دوباره با USB در paperpaw.org/flash نصب کنید.
