joplin.no-network = ارسال به Joplin به شبکه نیاز دارد. یادداشت‌ها منتظر می‌مانند و بعداً فرستاده می‌شوند.
joplin.setup-needed = ابتدا Joplin را تنظیم کنید: مقصد همگام‌سازی، حساب کاربری و گذرواژهٔ شما.
joplin.no-time = زمان هنوز مشخص نیست. یادداشت‌ها منتظر می‌مانند و بعداً فرستاده می‌شوند.
joplin.unreachable = به Joplin دسترسی نیست. یادداشت‌ها منتظر می‌مانند و بعداً فرستاده می‌شوند.
joplin.failed = Joplin با یک خطا پاسخ داد ({status}). یادداشت‌ها منتظر می‌مانند و بعداً فرستاده می‌شوند.
joplin.bad-login = Joplin ایمیل، نام کاربری یا گذرواژه را نپذیرفت. آن‌ها را در تنظیمات Joplin بررسی کنید.
joplin.no-server = در این نشانی هیچ Joplin Server وجود ندارد. آن را در تنظیمات Joplin بررسی کنید.
joplin.no-data = در این نشانی هیچ یادداشت Joplin وجود ندارد. آن را بررسی کنید یا ابتدا Joplin را با آن همگام‌سازی کنید.
joplin.encrypted = رمزگذاری سرتاسری Joplin روشن است. PaperPaw نمی‌تواند یادداشت‌ها را رمزگذاری کند، پس چیزی نمی‌فرستد.
joplin.newer-target = Joplin یادداشت‌ها را آنجا در قالبی جدیدتر از قالب شناخته‌شده برای این PaperPaw نگه می‌دارد. برای ارسال، PaperPaw را به‌روزرسانی کنید.
joplin.older-target = Joplin یادداشت‌ها را آنجا در قالبی قدیمی‌تر نگه می‌دارد. Joplin را باز کنید تا ارتقا یابد و سپس دوباره بفرستید.
joplin.upgrading = Joplin همین حالا یادداشت‌ها را آنجا به‌روزرسانی می‌کند. یادداشت‌ها منتظر می‌مانند و بعداً فرستاده می‌شوند.
joplin.no-memory = حافظه برای ارسال یادداشت‌ها کافی نیست. دوباره راه‌اندازی کنید و دوباره تلاش کنید.
