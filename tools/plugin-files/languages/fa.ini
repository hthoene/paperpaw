joplin.plugin.name = همگام‌سازی یادداشت‌های کتاب
joplin.plugin.description = هایلایت‌ها و یادداشت‌های هر کتاب را در یک یادداشت نگه می‌دارد. با Joplin کار می‌کند (Joplin Cloud، Joplin Server یا WebDAV).
joplin.title = همگام‌سازی یادداشت‌های کتاب
joplin.send = ارسال به Joplin
joplin.send.help = یادداشت‌های صادرشده فوراً ارسال می‌شوند. یادداشت‌هایی که ارسال نشدند منتظر می‌مانند و با صادرکردن بعدی، با همین گزینه یا با یک قاعده ارسال می‌شوند.
joplin.service = همگام‌سازی با
joplin.service.help = Joplin با چه چیزی همگام می‌شود، مطابق تنظیم در Joplin: Joplin Cloud، Joplin Server خودتان، یا یک پوشهٔ WebDAV مثل Nextcloud. نیازی نیست رایانه‌ای روشن باشد.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = نشانی
joplin.address.help = Joplin Server: نشانی آن، مثلاً joplin.example.org. WebDAV: پوشه‌ای که Joplin به آن همگام می‌شود، همان‌طور که در تنظیمات آن آمده، مثلاً dav.example.org/Joplin.
joplin.email = ایمیل
joplin.user = نام کاربری
joplin.user.help = Joplin Cloud و Joplin Server: ایمیلی که با آن وارد می‌شوید (ورود دومرحله‌ای هنوز قابل استفاده نیست). WebDAV: نام کاربری پوشه.
joplin.password = گذرواژه
joplin.password.help = همراه گذرواژه‌ها و کلیدهای دیگر در این دستگاه نگه داشته می‌شود. برای Nextcloud، گذرواژهٔ برنامه هم کار می‌کند.
joplin.secret = گذرواژهٔ Joplin
joplin.not-kept = گذرواژه در این دستگاه ذخیره نشد.
joplin.notebook = دفترچه
joplin.notebook.help = دفترچه‌ای که PaperPaw در Joplin می‌سازد، با یک یادداشت برای هر کتاب. صادر کردن دوباره یادداشت را به‌روز می‌کند، حتی اگر به دفترچهٔ دیگری منتقل شده باشد.
joplin.idle = یادداشت‌های صادرشده فوراً به Joplin ارسال می‌شوند.
joplin.waiting.one = یادداشت‌های {count} کتاب منتظر ارسال‌اند.
joplin.waiting.other = یادداشت‌های {count} کتاب منتظر ارسال‌اند.
joplin.sent.one = یادداشت‌های {count} کتاب در Joplin هستند.
