menu-editor.plugin.name = மெனு திருத்தி
menu-editor.plugin.description = எல்லா மெனுக்களின் உருப்படிகளையும் மறுவரிசைப்படுத்துகிறது, அகற்றுகிறது, சேர்க்கிறது.
menu-editor.plugin.how = "மெனுக்களில் உள்ளவற்றை மெனு திருத்தி மாற்றும்: உருப்படிகளை மேலே அல்லது கீழே நகர்த்தலாம், அகற்றலாம், அல்லது புதியவற்றைச் சேர்க்கலாம்.\n\nஅமைப்புகளில், தனிப்பயனாக்கு பிரிவில், மெனுக்களைத் தனிப்பயனாக்கு என இதைக் காணலாம். ஒரு மெனுவைத் தேர்ந்தெடுத்து, நகர்த்த அல்லது அகற்ற ஒரு உருப்படியைத் தேர்ந்தெடுக்கவும்; உருப்படியைச் சேர் புதியதைச் சேர்க்கும். மாற்றங்கள் உடனே பொருந்தும். இந்த மெனுவை மீட்டமை ஒரு மெனுவை அதன் செருகுநிரல்கள் வரையறுத்தபடி மாற்றும், எல்லா மெனுக்களையும் மீட்டமை அனைத்துக்கும் அதைச் செய்யும்.\n\nநீங்கள் உங்களை வெளியே பூட்டிக்கொள்ள முடியாது: அமைப்புகளுக்குச் செல்லும் வழியான உருப்படி, அவற்றுக்கு வேறொரு வழியைச் சேர்க்கும் வரை இருக்கும்."
