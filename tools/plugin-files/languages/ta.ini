vocabulary.help.answers = மீண்டும்: கார்டு விரைவில், இந்த மீள்பார்வையிலேயே திரும்ப வரும். கடினம், நன்று, எளிது: ஒவ்வொன்றும் பின்னர், ஒவ்வொரு பதிலின் கீழும் காட்டப்படும் நாளில்.
vocabulary.help.tap = கார்டின் பின்பக்கத்தைப் பார்க்க அதைத் தட்டவும், பிறகு உங்கள் பதிலைத் தட்டவும்.
