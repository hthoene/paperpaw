bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = ரிமோட்டுகள், கீபோர்டுகள், சென்சார்களை இணைத்து, அவற்றுடன் தொடர்புகொள்ளும்.
bluetooth.plugin.how = "Bluetooth உள்ள சாதனத்தில் (X4 Pro), Bluetooth ரிமோட்டுகள், கீபோர்டுகள், சென்சார்களை இணைக்கும்.\n\nசாதனத்தைச் சேர் என்பது அருகிலுள்ளவற்றைத் தேடும்; முதலில் அந்தச் சாதனத்தை இணைப்புப் பயன்முறையில் வைக்கவும். அதைத் தேர்ந்தெடுத்து, இங்கே உறுதிசெய்யவும் (எண் காட்டப்பட்டால் ஒப்பிடவும்). பிறகு ரிமோட் அல்லது கீபோர்டின் பட்டன்கள் பக்கம் புரட்டும், மெனுக்களில் நகரும்; ஒவ்வொரு பட்டனும் என்ன செய்யும் என்பதைக் கட்டுப்பாடுகள் என்பதில் மாற்றலாம்.\n\nரிமோட்டுகள் என்பது அவற்றின் பட்டன்கள் எப்போது வேலை செய்யும் எனக் கூறும்: இங்கே ஆன் செய்தபோது, வாசிக்கும்போது (புத்தகம் திறந்திருக்கும்போது மட்டும் தொடர்பில் இருக்கும், பேட்டரியைச் சேமிக்கும்), அல்லது எப்போதும். ஒரு சாதனத்தின் மீது மெனு பட்டன் அல்லது நீண்ட அழுத்தம் அதை மறக்கச் செய்யும்.\n\nசென்சார் செருகுநிரல்களுக்கானது: அதை எந்தச் செருகுநிரல் பயன்படுத்தலாம் என்பதை ஆன் செய்யவும். எதுவும் பயன்படுத்தாதபோது Bluetooth ஆஃப் நிலையில் இருக்கும்."
