core.bluetooth.pair-lost = {name} உடனான இணைப்பு முடிந்தது: தொடர்பு துண்டிக்கப்பட்டது.
core.literata-pack.title = Literata
core.literata-pack.text = Literata இப்போது ஸ்டோரில் தொகுப்பாகக் கிடைக்கிறது. உங்கள் எழுத்துருத் தேர்வு சேமிக்கப்பட்டுள்ளது; தொகுப்பு நிறுவப்பட்டதும் அது மீண்டும் பொருந்தும்.
