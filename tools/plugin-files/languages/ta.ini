wifi.phone.reason-busy = சாதனம் ஏற்கெனவே வேறொரு பக்கத்தை வழங்குகிறது.
wifi.phone.reason-network = நெட்வொர்க் இல்லை.
wifi.phone.reason-refused = பக்கத்தின் போர்ட்டைச் சாதனத்தால் திறக்க முடியவில்லை.
wifi.phone.reason-other = ஏதோ தவறு நடந்தது.
wifi.phone.no-random = இந்தச் சாதனத்தால் அதன் சொந்த நெட்வொர்க்குக்குப் பாதுகாப்பான கடவுச்சொல்லை உருவாக்க முடியாது.
wifi.phone.joining-page = சாதனம் இப்போது {ssid} உடன் இணைகிறது. அது வெற்றியடைந்ததா என்பது அதன் திரையில் தெரியும்; இந்தப் பக்கத்தை மூடலாம்.
wifi.phone.choose-one = ஒரு நெட்வொர்க்கைத் தேர்ந்தெடுக்கவும், அல்லது அதன் பெயரை உள்ளிடவும்.
wifi.phone.other = வேறு நெட்வொர்க், அதன் பெயர் (விருப்பத்தேர்வு)
wifi.phone.password = கடவுச்சொல்
wifi.phone.join = இணை
wifi.phone.page-note = சாதனம் கடவுச்சொல்லை நினைவில் வைத்து, தன் சொந்த நெட்வொர்க்கிலிருந்து வெளியேறும்.
wifi.password = {ssid}-க்கான கடவுச்சொல்
wifi.none-in-reach = சேமித்த Wi-Fi நெட்வொர்க் எதுவும் அருகில் இல்லை.
wifi.failed.password = {ssid}-க்கான கடவுச்சொல் தவறு: மீண்டும் உள்ளிடவும்.
wifi.failed.not-found = {ssid} அருகில் இல்லை.
wifi.failed.timeout = {ssid} பதிலளிக்கவில்லை.
wifi.failed.other = {ssid} உடன் இணைக்க முடியவில்லை. அது அருகில் உள்ளதா? மீண்டும் முயலவும், அல்லது வேறு நெட்வொர்க்கைத் தேர்ந்தெடுக்கவும்.
wifi.setting.on-demand = தேவைப்படும்போது இணை
wifi.setting.on-demand.help = தேவைப்படும்போது Wi-Fi-ஐ ஆன் செய்து, சேமித்த நெட்வொர்க்குடன் இணையும்.
wifi.setting.idle-off = இதன் பிறகு ஆஃப் செய்
wifi.setting.idle-off.help = கடைசிப் பயன்பாட்டுக்குப் பிறகு Wi-Fi எவ்வளவு நேரம் ஆனில் இருக்கும்.
wifi.idle-off.30s = 30 வினாடிகள்
wifi.idle-off.1m = 1 நிமிடம்
wifi.idle-off.2m = 2 நிமிடங்கள்
wifi.idle-off.5m = 5 நிமிடங்கள்
wifi.idle-off.10m = 10 நிமிடங்கள்
wifi.setting.while-charging = சார்ஜ் ஆகும்போது ஆன்
wifi.setting.while-charging.help = சாதனம் சார்ஜ் ஆகும்போது சேமித்த நெட்வொர்க்கில் Wi-Fi-ஐ ஆனில் வைத்திருக்கும்.
wifi.setting.join-first = முதலில் இணை
wifi.setting.join-first.help = பல நெட்வொர்க்குகள் அருகில் இருக்கும்போது எந்தச் சேமித்த நெட்வொர்க் முதலில் வரும்.
wifi.join-first.picked = கடைசியாகத் தேர்ந்தெடுத்தது
wifi.join-first.strongest = வலுவானது
wifi.setup.help = கேட்லாக்குகளிலிருந்து புத்தகங்களைப் பெற, புத்தகத்தில் நீங்கள் இருக்கும் இடத்தை ஒத்திசைக்க, கடிகாரத்தை அமைக்க உங்கள் Wi-Fi-உடன் இணையவும். இதைப் பிறகு அமைப்புகளிலும் செய்யலாம்.
wifi.phone.join-title = சாதனத்தின் நெட்வொர்க்குடன் இணை
wifi.phone.join-note = உங்கள் ஃபோனின் கேமராவைத் திறந்து இந்தக் குறியீட்டை ஸ்கேன் செய்யவும்.
wifi.phone.name = நெட்வொர்க்
wifi.phone.next = அடுத்து
wifi.phone.open-title = அமைவுப் பக்கத்தைத் திற
wifi.phone.open-note = இப்போது இந்தக் குறியீட்டை உங்கள் ஃபோனில் ஸ்கேன் செய்யவும். பக்கம் திறக்கவில்லை என்றால், மொபைல் டேட்டாவை ஆஃப் செய்யவும்.
wifi.phone.back-step = மீண்டும் படி 1
wifi.phone.type-address = அல்லது உங்கள் ஃபோனின் உலாவியில் முகவரியை உள்ளிடவும்.
wifi.networks.title = நெட்வொர்க்குகள்
wifi.networks.reach = {count} அருகில்
wifi.switch.on = ஆன்
wifi.switch.off = ஆஃப்
wifi.password.too-long = அந்தக் கடவுச்சொல் மிக நீளமானது: நெட்வொர்க் கடவுச்சொல்லில் அதிகபட்சம் 63 எழுத்துகள் இருக்கலாம். நெட்வொர்க்கைத் தேர்ந்தெடுத்து மீண்டும் உள்ளிடவும்.
wikipedia.plugin.name = கலைக்களஞ்சியத் தேடல்
wikipedia.plugin.description = Wikipedia-இல் சொற்களைத் தேடும். Wikimedia Foundation-உடன் தொடர்புடையது அல்ல.
wikipedia.title = கலைக்களஞ்சியம்
wikipedia.loading = தேடுகிறது…
wikipedia.not-found = இதைப் பற்றி Wikipedia-இல் கட்டுரை இல்லை.
wikipedia.source = Wikipedia-இலிருந்து, CC BY-SA 4.0: {address}
wikipedia.unreachable = Wikipedia-ஐ அணுக முடியவில்லை. Wi-Fi இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.
wikipedia.failed = Wikipedia எதிர்பார்த்தபடி பதிலளிக்கவில்லை.
wikipedia.no-network = இதற்கு நெட்வொர்க் இணைப்பு தேவை.
wikipedia.offer = Wikipedia-க்கு நெட்வொர்க் தேவை, சாதனம் ஆஃப்லைனில் உள்ளது. ஆன்லைனுக்குச் செல்ல தேர்ந்தெடு பட்டனை அழுத்தவும் அல்லது தட்டவும்; பின்செல் மூடும்.
wikipedia.about = Wikipedia-இலிருந்து (https://www.wikipedia.org) கட்டுரைச் சுருக்கங்கள், CC BY-SA 4.0 உரிமத்தின் கீழ்.
