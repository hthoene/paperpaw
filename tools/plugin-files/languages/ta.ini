end-of-book.plugin.description = புத்தகத்தின் முடிவில் ஒரு திரை: தொடரின் அடுத்த புத்தகம், மதிப்பீடு, படித்து முடித்ததா இல்லையா.
end-of-book.plugin.how = புத்தகத்தின் கடைசிப் பக்கத்தை அடைந்ததும், ஒரு திரை அதன் தொடரின் அடுத்த புத்தகத்தை (அல்லது நூலகத்தை) வழங்கும், புத்தகத்துக்கு 1 முதல் 5 நட்சத்திரங்கள் தர உதவும், படித்து முடித்ததாகக் குறிக்கப்பட்டுள்ளதா என்று காட்டும். கடைசிப் பக்கத்துக்குத் திரும்ப பின்செல் அழுத்தவும்.
