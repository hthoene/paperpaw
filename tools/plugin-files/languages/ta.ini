mail.fail.no-network = நெட்வொர்க் இல்லை. Wi-Fi-ஐ ஆன் செய்து மீண்டும் முயலவும்.
mail.fail.dns = சர்வர் கண்டறியப்படவில்லை. அமைப்புகளில் அதன் பெயரைச் சரிபார்க்கவும்.
mail.fail.refused = சர்வர் இணைப்பை மறுத்தது. போர்ட்டைச் சரிபார்க்கவும்.
mail.fail.timeout = சர்வர் நேரத்தில் பதிலளிக்கவில்லை.
mail.fail.lost = இணைப்பு துண்டிக்கப்பட்டது.
mail.fail.name = சர்வரின் சான்றிதழ் வேறொரு பெயருக்கானது. சர்வர் பெயரைச் சரிபார்க்கவும்.
mail.fail.expired = சர்வரின் சான்றிதழ் காலாவதியாகிவிட்டது.
mail.fail.secure = பாதுகாப்பான இணைப்பு தோல்வியடைந்தது.
mail.fail.no-tls = இந்தச் சாதனத்தால் இன்னும் பாதுகாப்பான இணைப்புகளை உருவாக்க முடியாது.
mail.fail.clock = கடிகாரம் இன்னும் அமைக்கப்படவில்லை, எனவே சர்வரைச் சரிபார்க்க முடியாது. முதலில் Wi-Fi-உடன் இணைக்கவும் (அது கடிகாரத்தை அமைக்கும்), அல்லது அமைப்புகளில் தேதியையும் நேரத்தையும் அமைத்து, மீண்டும் முயலவும்.
mail.fail.busy = வேறொரு பாதுகாப்பான இணைப்பு திறந்துள்ளது. சிறிது நேரத்தில் மீண்டும் முயலவும்.
mail.fail.memory = பாதுகாப்பான இணைப்புக்குப் போதுமான நினைவகம் இல்லை. மற்ற திரைகளை மூடி மீண்டும் முயலவும்.
mail.fail.login = உள்நுழைவு மறுக்கப்பட்டது: {words}. முகவரியையும் ஆப் கடவுச்சொல்லையும் சரிபார்க்கவும்.
