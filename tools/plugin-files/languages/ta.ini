rules.plugin.name = விதிகள்
rules.plugin.description = ஏதாவது நடக்கும்போது, ஒன்றைச் செய்யும்: எ.கா. 22:00 மணிக்கு இரவுப் பயன்முறை.
rules.plugin.how = "ஏதாவது நடக்கும்போது ஒரு விதி தானாகவே ஒன்றைச் செய்யும்: தினமும் 22:00 மணிக்கு இரவுப் பயன்முறை ஆன், அல்லது PaperPaw தொடங்கும்போது கேட்டலாக்குகள் ஒத்திசைக்கப்படும்.\n\nவிதிகள், அமைப்புகளில் தனிப்பயனாக்கு என்பதன் கீழ் விதிகள் என உள்ளன. விதியைச் சேர் என்பது எப்போது? (PaperPaw தொடங்கும்போது, நாளின் ஒரு நேரம், புத்தகம் திறக்கப்படும்போது அல்லது மூடப்படும்போது, பேட்டரி, சார்ஜிங், ஒரு ஸ்விட்ச் மற்றும் பல) என்றும், பிறகு என்ன? (ஒரு செயலை இயக்கு, ஸ்விட்சை ஆன் அல்லது ஆஃப் செய், ஒரு எண்ணை அமை, செய்தியைக் காட்டு) என்றும் கேட்கும். ஒரு விதியை இடைநிறுத்த அதைத் தட்டவும்; இரண்டு நேரங்களுக்கு இடையில் போன்ற நிபந்தனைக்கு அல்லது அதை அகற்ற, அதை அழுத்திப் பிடிக்கவும் (பட்டன்களுடன்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்).\n\nதேர்வுசெய்யக்கூடிய செயல்கள், ஸ்விட்சுகள், எண்கள் செருகுநிரல் வாரியாக உள்ளன: முதலில் செருகுநிரலைத் தேர்ந்தெடுத்து, பிறகு அது வழங்குவதைத் தேர்ந்தெடுக்கவும்; பின்செல் மீண்டும் வெளியே கொண்டுவரும். காட்டப்படும் திரையில் செயல்படும் செயல், எ.கா. பின்செல் அல்லது அடுத்த பக்கம், அங்கே அழுத்தினால் என்ன செய்யுமோ அதையே செய்யும்.\n\nஎந்தத் திரை திறந்திருந்தாலும் நேரங்கள் பொருந்தும். ஒன்றையொன்று ரத்துசெய்யும் இரண்டு விதிகள் சில படிகளுக்குப் பிறகு நின்றுவிடும்."
