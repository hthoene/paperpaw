file-manager.error.too-long = அந்தப் பெயர் அல்லது பாதை மிக நீளமானது, அல்லது கோப்புறை மிக ஆழத்தில் உள்ளது.
file-sync.plugin.name = கோப்பு ஒத்திசைவு
file-sync.plugin.description = கார்டின் கோப்புறைகளை உங்கள் சொந்த சர்வருடன் (WebDAV) இருவழியிலும், எந்தக் கோப்பையும் இழக்காமல் ஒத்திசைக்கும்.
file-sync.title = கோப்பு ஒத்திசைவு
file-sync.open = கோப்பு ஒத்திசைவு
file-sync.sync = இப்போது ஒத்திசை
file-sync.syncing = ஒத்திசைக்கிறது…
file-sync.syncing.short = ஒத்திசைக்கிறது…
file-sync.pair = கோப்புறை ஜோடி
file-sync.pair-1.title = கோப்பு ஒத்திசைவு: ஜோடி 1
file-sync.pair-2.title = கோப்பு ஒத்திசைவு: ஜோடி 2
file-sync.pair-3.title = கோப்பு ஒத்திசைவு: ஜோடி 3
file-sync.pair.row = ஜோடி {n}
file-sync.pair.empty = அமைக்கப்படவில்லை
file-sync.pair.help = கார்டில் உள்ள கோப்புறையையும் சர்வர் கோப்புறையின் முகவரியையும் (WebDAV கோப்புறை, எ.கா. https://cloud.example.org/remote.php/dav/files/me/Notes) உள்ளிடவும். பயனரும் கடவுச்சொல்லும் இந்த ஜோடிக்கு மட்டும் சேமிக்கப்படும்.
file-sync.setting.when = தானாக ஒத்திசை
file-sync.setting.when.help = நீங்கள் கேட்கும்போது மட்டும், சார்ஜர் செருகப்படும்போதும் (6 மணிநேரத்துக்கு ஒருமுறை வரை), அல்லது Wi-Fi ஏற்கெனவே ஆனில் இருக்கும்போதும் (நாளுக்கு ஒருமுறை வரை). சாதனத்தை எழுப்புவது Wi-Fi-ஐ ஒருபோதும் இயக்காது.
file-sync.when.manual = கேட்கும்போது மட்டும்
file-sync.when.charging = சார்ஜருடன்
file-sync.when.online = சார்ஜருடனும் ஆன்லைனிலும்
file-sync.setting.folder = கார்டில் உள்ள கோப்புறை
file-sync.setting.folder.help = ஒத்திசைக்கப்படும் கார்டின் கோப்புறை, எ.கா. Notes. அதன் உள் கோப்புறைகளும் ஒத்திசைக்கப்படும்; மறைக்கப்பட்ட (புள்ளியில் தொடங்கும்) கோப்புகளும் கோப்புறைகளும் ஒத்திசைக்கப்படாது.
file-sync.setting.mode = ஒத்திசைவு முறை
file-sync.setting.mode.help = இருவழி: மாற்றங்கள் இரு திசைகளிலும் செல்லும். பதிவிறக்கம் மட்டும்: கார்டு சர்வரைப் பின்பற்றும், சர்வரில் எதுவும் மாற்றப்படாது.
file-sync.mode.two-way = இருவழி
file-sync.mode.download = பதிவிறக்கம் மட்டும்
file-sync.setting.server = சர்வர் கோப்புறை
file-sync.setting.server.help = WebDAV கோப்புறையின் முகவரி, எ.கா. https://cloud.example.org/remote.php/dav/files/me/Notes
file-sync.setting.user = பயனர்
file-sync.setting.user.help = சர்வருக்கான பயனர்பெயர். காலியாக இருந்தால்: கணக்கு இல்லை.
file-sync.password = கடவுச்சொல்
file-sync.secret.password = கோப்பு ஒத்திசைவுக் கடவுச்சொல், ஜோடி {n}
file-sync.widget.last = கடைசி ஒத்திசைவு
file-sync.widget.pending = நிலுவையிலுள்ள மாற்றங்கள்
file-sync.widget.button = இப்போது ஒத்திசை
file-sync.never = ஒருபோதும் இல்லை
file-sync.pending.count.one = {count} கோப்பு
file-sync.pending.count.other = {count} கோப்புகள்
file-sync.help = ஒரு ஜோடியைத் தேர்ந்தெடுத்து, கோப்புறையையும் சர்வரையும் உள்ளிட்டு, இப்போது ஒத்திசை என்பதைத் தேர்ந்தெடுக்கவும். ஒரு பக்கம் மாறிய கோப்பு மறுபக்கத்துக்குச் செல்லும்; இரு பக்கமும் மாறியிருந்தால், இரண்டும் வைக்கப்படும்.
file-sync.progress = {name} ஒத்திசைக்கப்படுகிறது: இந்தக் கோப்புறையில் {all}-இல் {done}.
file-sync.summary = ஒத்திசைக்கப்பட்டது. பெறப்பட்டவை {down}, அனுப்பப்பட்டவை {up}, நீக்கப்பட்டவை {deleted}, இரண்டு முறை வைக்கப்பட்டவை {conflicts}, ஒத்திசைக்கப்படாதவை {errors}.
file-sync.held = பல நீக்கங்கள் நிறுத்திவைக்கப்பட்டன: அந்தக் கோப்புகள் வைக்கப்பட்டன.
file-sync.no-pair = முதலில் ஒரு ஜோடியை அமைக்கவும்: கார்டில் உள்ள கோப்புறையும் சர்வரும்.
file-sync.bad-folder = கார்டின் ஒரு கோப்புறையைத் தேர்ந்தெடுக்கவும்; கார்டையே அல்ல, மறைக்கப்பட்ட அல்லது சிஸ்டம் கோப்புறையையும் அல்ல.
file-sync.bad-url = முகவரி http:// அல்லது https:// எனத் தொடங்க வேண்டும்.
file-sync.no-network = சர்வரை அணுக முடியவில்லை. செய்யப்பட்டவை அப்படியே இருக்கும்; அடுத்த ஒத்திசைவு தொடரும்.
file-sync.denied = சர்வர் பயனர்பெயரை அல்லது கடவுச்சொல்லை ஏற்கவில்லை.
file-sync.not-found = சர்வரில் ஒரு கோப்புறை கண்டறியப்படவில்லை.
file-sync.full = கார்டு நிரம்பிவிட்டது.
