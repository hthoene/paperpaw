sleep.plugin.name = உறக்கத் திரை
sleep.plugin.description = சாதனம் உறங்கும்போது உறங்கும் பூனை, புத்தக அட்டை, உங்கள் படங்கள் அல்லது ஒரு செய்தியைக் காட்டும்.
sleep.plugin.how = "சாதனம் உறங்கும்போது திரை என்ன காட்டும் என்பதை உறக்கத் திரை தீர்மானிக்கும். மின்சாரம் இல்லாமலும் e-ink படத்தைத் தக்கவைக்கும்.\n\nஅமைப்புகளில் சாதனம், உறக்கத் திரை என்பதன் கீழ், காட்டுவது என்பதில் தேர்ந்தெடுக்கவும்: உறங்கும் பூனை (இயல்புநிலை), புத்தக அட்டை, என் படங்கள், லோகோவும் “உறங்குகிறது” என்பதும், விட்ஜெட்டுகள், பக்கம் அப்படியே, அல்லது படத்துடன் பக்கம். என் படங்கள், படங்கள் கோப்புறையின் கோப்புகளை ஒன்றன்பின் ஒன்றாகக் காட்டும்.\n\nஅட்டையோ படமோ இல்லையெனில் பூனை காட்டப்படும். சிஸ்டமே உறக்கத் திரையை வரையும் இடத்தில் இந்த அமைப்புகள் மறைக்கப்படும்.\n\nஅணைத்த திரை (அணைக்கும்போது காட்டுவது), பவர் மெனுவிலிருந்தோ உறக்கத்துக்குப் பின் அணை என்பதன் நேரம் முடிந்தோ சாதனம் அணைக்கப்படும்போது ஒருமுறை வரையப்படும் (பேட்டரி தீர்ந்து அணையும்போது அல்ல). லோகோவும் “அணைக்கப்பட்டது” என்பதும், பூனை, அட்டை அல்லது என் படங்களைத் தேர்ந்தெடுக்காவிட்டால், அது உறக்கத் திரையைப் போலவே இருக்கும். வேறொரு செருகுநிரல் இதற்கு ஒரு திரையை வழங்கலாம்.\n\nதொடக்க, மறுதொடக்கத் திரைகள் (தொடங்கும்போது காட்டுவது, மீண்டும் தொடங்கும்போது காட்டுவது), வேறொரு செருகுநிரல் திரை வழங்காவிட்டால், சாதனத்தின் சொந்தத் திரைகளே. சாதனம் தொடங்கும்போது செருகுநிரல்கள் இன்னும் இயங்காது: தொடக்கத்துக்குத் தேர்ந்தெடுத்த திரை, சாதனம் அணையும்போது அல்லது மீண்டும் தொடங்கும்போதே முன்கூட்டியே வரையப்பட்டு, அடுத்த தொடக்கத்தில் காட்டப்படும். நேரத்துக்குள் தயாராகாத திரையோ சேதமடைந்த படமோ சாதனத்தின் சொந்தத் திரைக்கு வழிவிடும்; சாதனம் எப்படியும் அணையும் அல்லது மீண்டும் தொடங்கும்."
