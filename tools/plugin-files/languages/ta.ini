notes-overview.export.help = மின்வாசிப்பான்கள் பயன்படுத்தும் My Clippings.txt வடிவத்தில் எல்லாக் குறிப்புகளும் ஒரே கோப்பில், நூலகத்தின் அருகில் உள்ள “Exports” கோப்புறையில்.
notes-overview.export.help.more = மின்வாசிப்பான்கள் பயன்படுத்தும் My Clippings.txt வடிவத்தில் எல்லாக் குறிப்புகளும் ஒரே கோப்பில், நூலகத்தின் அருகில் உள்ள “Exports” கோப்புறையில். பட்டியல் 200 புத்தகங்களைக் காட்டும், கோப்பில் எல்லாம் இருக்கும்.
