core.power.saving.help = காத்திருக்கக்கூடியவை பொருத்தமான நேரத்துக்காகக் காத்திருக்கும்; விளக்கு அதிகபட்சம் பாதி; 5 நிமிடங்களுக்குப் பிறகு உறக்கம்.
core.power.offline = ஆஃப்லைன்
core.power.offline.help = ரேடியோ ஆஃப் நிலையில் இருக்கும்; நெட்வொர்க் தேவைப்படுபவை நீங்கள் ஆன்லைனுக்குச் செல்லும் வரை காத்திருக்கும்.
core.group.network = செருகுநிரல் வாரியாக நெட்வொர்க்
core.network.allowed = நெட்வொர்க்
core.network.allowed.help = ஆஃப் எனில், நீங்கள் கேட்டாலும் இந்தச் செருகுநிரல் நெட்வொர்க்கைச் சிறிதும் பயன்படுத்தாது.
core.saving.title = சேமிப்புப் பயன்முறைகளில்
core.saving.help = சேமிப்புப் பயன்முறைகளில் இந்தச் செருகுநிரலின் பின்னணிப் பணிகள் எப்படி இயங்கும்.
core.saving.follow = பயன்முறையைப் பின்பற்று
core.saving.normal = இயல்பு பயன்முறையைப் போல
core.saving.manual = நான் கேட்கும்போது மட்டும்
core.work.catalog = நூலகப் பட்டியலை உருவாக்குகிறது
core.library.look-again = புதிய புத்தகங்களைத் தேடு
