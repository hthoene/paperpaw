store.fetch.restart.text = {names} தயார். மீண்டும் தொடங்கிய பின் செயல்படும்.
store.template.title = ஒரு அமைவைத் தேர்ந்தெடுக்கவும்
store.template.help = PaperPaw உருவாக்கிய, செருகுநிரல்களும் அமைப்புகளும் அடங்கிய ஆயத்தத் தொகுப்பு. ஒன்றைத் தேர்ந்தெடுக்கவும், அல்லது இயல்புநிலையை வைத்திருக்கவும்.
store.template.hint = உடனே பயன்படுத்தப்படும். எல்லாவற்றையும் பின்னர் அமைப்புகளில் மாற்றலாம்.
store.template.chosen = தேர்ந்தெடுக்கப்பட்டது
store.template.keep = இயல்புநிலையை வைத்திரு
store.template.minimal = குறைந்தபட்சம்
store.template.minimal.help = அமைதியான முகப்புத் திரை, தெளிவான வாசிப்புப் பக்கம்.
store.template.stats = வாசிப்புப் புள்ளிவிவரங்கள்
store.template.stats.help = புள்ளிவிவரங்கள், வாசிப்பு இலக்கு, புத்தக முடிவில் சுருக்கம்.
store.template.language = மொழி கற்றல்
store.template.language.help = சொல்லகராதி, ஃபிளாஷ் கார்டுகள், மொழிபெயர்ப்பு.
store.template.notes = குறிப்புகள்
store.template.notes.help = உங்கள் குறிப்புகள் ஒரே இடத்தில், ஒவ்வொரு புத்தகத்துக்கும் ஒரு கண்ணோட்டம்.
store.template.adding = அமைவு பயன்படுத்தப்பட்டது. செருகுநிரல்கள் பின்னணியில் சேர்க்கப்பட்டு, அடுத்த முறை PaperPaw தொடங்கும்போது இயங்கும்.
store.template.switched-on = அமைவு பயன்படுத்தப்பட்டது. அடுத்த முறை PaperPaw தொடங்கும்போது செருகுநிரல்கள் இயங்கும்.
store.template.applied = அமைவு பயன்படுத்தப்பட்டது.
store.template.later = அமைவு பயன்படுத்தப்பட்டது. நீங்கள் இணைக்கப்பட்டதும் செருகுநிரல்கள் நிறுவப்படும்.
