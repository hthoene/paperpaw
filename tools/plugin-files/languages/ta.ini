setup.plugin.name = அமைவு
setup.plugin.description = முதல் தொடக்கத்தில், முக்கியமான அமைப்புகள் வழியாக ஒரு சிறு வழிகாட்டி.
setup.plugin.how = "அமைவு என்பது முக்கியமான அமைப்புகள் வழியாகச் செல்லும் ஒரு சிறு வழிகாட்டி; PaperPaw முதல் முறை தொடங்கும்போது ஒருமுறை மட்டும் காட்டப்படும். ஒவ்வொரு பக்கமும் ஒரு விஷயத்தைக் கேட்கும், எ.கா. மொழி, பட்டன்கள், உரை அளவு, நேர மண்டலம், Wi-Fi அல்லது சேர்க்க வேண்டிய சில செருகுநிரல்கள்; பொருத்தமான பதில் ஏற்கெனவே தேர்ந்தெடுக்கப்பட்டிருக்கும், எனவே அடுத்து எப்போதும் சரியானது. இந்தச் சாதனத்துக்குத் தேவையில்லாத படிகள் தவிர்க்கப்படும்.\n\nபட்டன்களைத் தட்டவும், அல்லது மேல், கீழ் பட்டன்களையும் தேர்ந்தெடு பட்டனையும் பயன்படுத்தவும். முதல் பக்கத்தில் உள்ள தவிர் உடனே அமைவிலிருந்து வெளியேறும். உங்கள் புத்தகங்கள் எங்கிருந்து வருகின்றன என்பதைக் கடைசிப் பக்கம் சொல்லும்.\n\nமீண்டும் இயக்க, அமைப்புகளைத் திறந்து PaperPaw-ஐ அமை என்பதைத் தேர்ந்தெடுக்கவும். இங்கே தேர்ந்தெடுத்த அனைத்தையும் பின்னர் அமைப்புகளில் மாற்றலாம்."
