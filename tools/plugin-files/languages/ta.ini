kosync.signed-in = {server}-இல் {user} ஆக உள்நுழைந்துள்ளீர்கள்.
kosync.signed-out = ஒத்திசைவுச் சர்வரில் உங்கள் கணக்கில் உள்நுழையவும், அல்லது ஒன்றை உருவாக்கவும். கடவுச்சொல்லின் ஹாஷ் மட்டுமே வைக்கப்படும்.
