opds.plugin.name = OPDS கேட்டலாக்குகள்
opds.plugin.description = OPDS கேட்டலாக்குகளில் உலாவும், அவற்றின் புத்தகங்களைப் பதிவிறக்கும், கோப்புறைகளை அவற்றுடன் ஒத்திசைவில் வைக்கும்.
opds.plugin.how = "OPDS கேட்டலாக்குகள் என்பவை Project Gutenberg, Calibre-Web, Kavita, Komga போன்ற ஆன்லைன் நூலகங்கள். இந்தச் செருகுநிரல் அவற்றைக் கோப்புறைகள் போல உலாவித் தேடி, அவற்றின் புத்தகங்களை நூலகத்தில் பதிவிறக்கும்.\n\nகருவிகள் மெனுவில் கேட்டலாக்குகள் என்பதைத் திறந்து கேட்டலாக்கைச் சேர் என்பதைத் தேர்ந்தெடுக்கவும்: ஒரு முகவரி, கேட்டலாக்குக்குக் கணக்கு தேவைப்பட்டால் பயனர்பெயரும் கடவுச்சொல்லும். உலாவ ஒரு கேட்டலாக்கைத் தட்டவும்; ஒத்திசைக்க, திருத்த அல்லது அகற்ற அதை அழுத்திப் பிடிக்கவும் (பட்டன்களில்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்).\n\nஇந்தக் கேட்டலாக்கை ஒத்திசை ஆன் செய்திருந்தால், கேட்டலாக்குகளை ஒத்திசை அதன் புதிய புத்தகங்களை அதன் கோப்புறையில் பதிவிறக்கும். ஒரு ஒத்திசைவில் எத்தனை புத்தகங்கள் பெறப்படும் என்பதை ஒரு ஒத்திசைவுக்குப் புத்தகங்கள் கட்டுப்படுத்தும், இதனால் பெரிய கேட்டலாக் சாதனத்தை நிரப்பாது. கேட்டலாக்குக்குப் பதிலாகக் கிளவுட் கோப்புறையும் (WebDAV) செயல்படும்."
opds.title = கேட்டலாக்குகள்
opds.add = கேட்டலாக்கைச் சேர்
opds.address = கேட்டலாக் முகவரி
opds.hint = ஒத்திசைக்க, திருத்த அல்லது அகற்ற ஒரு கேட்டலாக்கை அழுத்திப் பிடிக்கவும்.
opds.hint.buttons = ஒத்திசைக்க, திருத்த அல்லது அகற்ற ஒரு கேட்டலாக்கில் தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்.
opds.sync-all = கேட்டலாக்குகளை ஒத்திசை
opds.sync-all.help = ஒத்திசைவுக்குக் குறிக்கப்பட்ட கேட்டலாக்குகளின் புதிய புத்தகங்களைப் பதிவிறக்கும்.
opds.stop = ஒத்திசைவை நிறுத்து
opds.stop.help = இதுவரை பதிவிறக்கிய புத்தகங்கள் அப்படியே இருக்கும்.
opds.synced-to = {host}, {folder}-உடன் ஒத்திசைக்கப்பட்டது
opds.syncing.one = {catalog} ஒத்திசைக்கப்படுகிறது: இதுவரை {count} புதிய புத்தகம்.
opds.syncing.other = {catalog} ஒத்திசைக்கப்படுகிறது: இதுவரை {count} புதிய புத்தகங்கள்.
opds.synced.one = ஒத்திசைவு முடிந்தது: {count} புதிய புத்தகம்.
opds.synced.other = ஒத்திசைவு முடிந்தது: {count} புதிய புத்தகங்கள்.
opds.failed.one = {count} பதிவிறக்க முடியவில்லை.
opds.failed.other = {count} பதிவிறக்க முடியவில்லை.
opds.unreachable.one = {count} கேட்டலாக்கை அணுக முடியவில்லை.
opds.unreachable.other = {count} கேட்டலாக்குகளை அணுக முடியவில்லை.
opds.skipped.one = {count} கேட்டலாக் தொடப்படவில்லை: முன்பு ஒத்திசைத்த அதன் புத்தகப் பட்டியலைப் படிக்க முடியவில்லை.
opds.skipped.other = {count} கேட்டலாக்குகள் தொடப்படவில்லை: முன்பு ஒத்திசைத்த அவற்றின் புத்தகப் பட்டியல்களைப் படிக்க முடியவில்லை.
opds.option.open = திற
opds.option.sync = இப்போது ஒத்திசை
opds.option.edit = திருத்து
opds.option.remove = பட்டியலிலிருந்து அகற்று
opds.option.read = இப்போது படி
opds.option.ok = சரி
opds.field.name = பெயர்
opds.field.name.help = கேட்டலாக் பட்டியலில் தோன்றும் பெயர்.
opds.field.address = முகவரி
opds.field.address.help = கேட்டலாக்கின் OPDS முகவரி, எ.கா. சர்வர் அமைப்புகளிலிருந்து.
opds.field.user = பயனர்பெயர்
opds.field.user.help = கணக்கு தேவைப்படும் கேட்டலாக்குகளுக்கு மட்டும்.
opds.secret = கேட்டலாக்: {name}
opds.field.password = கடவுச்சொல்
opds.field.password.help = இந்தச் சாதனத்தில் வைக்கப்பட்டு, இந்தக் கேட்டலாக்குக்கு மட்டுமே அனுப்பப்படும்.
opds.field.password.http = குறியாக்கமின்றி அனுப்பப்படும்: முகவரி https அல்ல, http எனத் தொடங்குவதால் நெட்வொர்க்கில் உள்ள மற்றவர்கள் அதைப் படிக்கலாம்.
opds.field.folder = கோப்புறை
opds.field.folder.help = ஒவ்வொன்றாகப் பதிவிறக்கினாலும் ஒத்திசைத்தாலும், அதன் புத்தகங்கள் சேரும் இடம்.
opds.field.sync = இந்தக் கேட்டலாக்கை ஒத்திசை
opds.field.sync.help = “கேட்டலாக்குகளை ஒத்திசை” இதன் புதிய புத்தகங்களைப் பதிவிறக்கும்.
opds.search = தேடு
opds.more = மேலும்
opds.empty = இங்கே எதுவும் இல்லை.
opds.loading = {host} ஏற்றப்படுகிறது …
opds.failed-host = {host}-ஐ அணுக முடியவில்லை. Wi-Fi இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.
opds.error = {host} பிழை {status} உடன் பதிலளிக்கிறது.
opds.unauthorized = கேட்டலாக் பயனர்பெயரும் கடவுச்சொல்லும் கேட்கிறது: அதைத் திருத்தப் பட்டியலில் அழுத்திப் பிடிக்கவும்.
opds.unauthorized.buttons = கேட்டலாக் பயனர்பெயரும் கடவுச்சொல்லும் கேட்கிறது: அதைத் திருத்தப் பட்டியலில் அதன் மீது தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்.
opds.not-a-catalog = இது OPDS கேட்டலாக் அல்ல.
opds.no-memory = இந்தப் பட்டியலுக்குப் போதுமான நினைவகம் இல்லை.
opds.unreadable = கேட்டலாக் பட்டியலைப் படிக்க முடியவில்லை. அது அப்படியே இருக்கும், அதில் செய்யும் மாற்றங்கள் சேமிக்கப்படாது.
opds.not-kept = இதைச் சேமிக்க முடியவில்லை. உரை மிக நீளமாக இருக்கலாம், அல்லது கார்டு அல்லது கடவுச்சொல் பட்டியல் நிரம்பியிருக்கலாம்.
opds.no-search = இந்தக் கேட்டலாக்கில் இங்கே தேட முடியாது.
opds.no-network = இதற்கு நெட்வொர்க் இணைப்பு தேவை.
opds.downloading = “{title}” பதிவிறக்கப்படுகிறது … பின்செல் அதை நிறுத்தும்.
opds.download-stopped = பதிவிறக்கம் நிறுத்தப்பட்டது.
opds.downloading-share = “{title}” பதிவிறக்கப்படுகிறது: {percent}%. பின்செல் அதை நிறுத்தும்.
opds.downloading-size = “{title}” பதிவிறக்கப்படுகிறது: இதுவரை {size}. பின்செல் அதை நிறுத்தும்.
opds.no-format = இந்தப் புத்தகத்தின் எந்த வடிவத்தையும் இங்கே படிக்க முடியாது.
opds.cannot-save = புத்தகத்தைச் சேமிக்க முடியவில்லை. நினைவகம் நிரம்பியிருக்கலாம்.
opds.not-a-book = சர்வர் புத்தகம் எதையும் அனுப்பவில்லை, ஒருவேளை உள்நுழைவுப் பக்கத்தை அனுப்பியிருக்கலாம்.
opds.saved = “{name}” இப்போது {folder}-இல் உள்ளது.
opds.section = கேட்டலாக்குகள்
opds.setting.limit = ஒரு ஒத்திசைவுக்குப் புத்தகங்கள்
opds.setting.limit.help = ஒரு ஒத்திசைவில் ஒரு கேட்டலாக் பெறும் அதிகபட்சப் புத்தகங்கள்.
opds.setting.covers = கேட்டலாக் அட்டைப்படங்கள்
opds.setting.covers.help = கேட்டலாக் பட்டியல்களில் புத்தகங்களின் படங்கள், போதுமான நினைவகம் உள்ள சாதனங்களில்.
opds.only-lists.one = {count} கேட்டலாக் தானே புத்தகங்களைப் பட்டியலிடவில்லை, மேலும் பட்டியல்களை மட்டுமே: அதற்குப் பதிலாக ஒரு புத்தகப் பட்டியலை ஒத்திசைக்கவும், எ.கா. ஒரு அலமாரி.
opds.only-lists.other = {count} கேட்டலாக்குகள் தாமே புத்தகங்களைப் பட்டியலிடவில்லை, மேலும் பட்டியல்களை மட்டுமே: அதற்குப் பதிலாகப் புத்தகப் பட்டியல்களை ஒத்திசைக்கவும், எ.கா. அலமாரிகள்.
opds.field.webdav = கிளவுட் கோப்புறை (WebDAV)
opds.field.webdav.help = OPDS கேட்டலாக்குக்குப் பதிலாக, Nextcloud போன்ற WebDAV கோப்புறை.
picture-frame.plugin.name = படச்சட்டம்
picture-frame.plugin.description = உங்கள் சொந்தப் புகைப்படங்கள் உறக்கத் திரையாக, ஸ்லைடுஷோவாக, இன்றைய புகைப்படமாக: கார்டிலிருந்து அல்லது உங்கள் புகைப்பட சர்வரிலிருந்து.
picture-frame.title = படச்சட்டம்
picture-frame.open = படச்சட்டம்
picture-frame.slideshow = ஸ்லைடுஷோ
picture-frame.sync = சர்வரிலிருந்து புகைப்படங்களைப் பெறு
picture-frame.sleep = படச்சட்டத்திலிருந்து புகைப்படம்
picture-frame.widget = இன்றைய புகைப்படம்
picture-frame.setting.folder = புகைப்படக் கோப்புறை
picture-frame.setting.folder.help = உங்கள் புகைப்படங்கள் (JPEG அல்லது PNG) உள்ள கார்டின் கோப்புறை. பெயர் வரிசையில் முதல் 512 பயன்படுத்தப்படும்.
picture-frame.setting.change = புகைப்படத்தை மாற்று
picture-frame.setting.change.help = உறக்கத் திரை ஒவ்வொரு உறக்கத்திலும் அடுத்த புகைப்படத்தைக் காட்டுமா, அல்லது தினமும் புதியதைக் காட்டுமா. உறக்கம் › காட்டு என்பதில் “படச்சட்டத்திலிருந்து புகைப்படம்” என்பதைத் தேர்ந்தெடுக்கவும்.
picture-frame.change.sleep = ஒவ்வொரு உறக்கத்திலும்
picture-frame.change.daily = தினமும்
picture-frame.setting.fit = திரைக்குப் பொருத்து
picture-frame.setting.fit.help = முழுப் புகைப்படம், வெள்ளை ஓரத்துடன் முழுப் புகைப்படத்தையும் காட்டும். திரையை நிரப்பு, அதைத் திரைக்கு ஏற்ப வெட்டும். தானியங்கு, வடிவம் திரைக்கு நெருக்கமாக இருந்தால் நிரப்பும், இல்லையெனில் முழுப் புகைப்படத்தையும் காட்டும்.
picture-frame.fit.auto = தானியங்கு
picture-frame.fit.whole = முழுப் புகைப்படம்
picture-frame.fit.fill = திரையை நிரப்பு
picture-frame.setting.contrast = ஒளிமாறுபாடு
picture-frame.setting.contrast.help = அதிக ஒளிமாறுபாடு e-ink-இல் புகைப்படங்களைத் தெளிவாக்கும்; குறைவானது அவற்றை மென்மையாக வைக்கும்.
picture-frame.setting.interval = ஸ்லைடுஷோ இடைவெளி
picture-frame.setting.interval.help = சாதனம் சார்ஜரில் இணைக்கப்பட்டிருக்கும்போது ஒவ்வொரு புகைப்படமும் எவ்வளவு நேரம் இருக்கும். மின்சாரம் இல்லாமல், ஸ்லைடுஷோ பட்டன்கள் அல்லது ஸ்வைப் மூலம் தொடரும்.
picture-frame.setting.slideshow-on-charge = சார்ஜ் செய்யும்போது ஸ்லைடுஷோ
picture-frame.setting.slideshow-on-charge.help = சார்ஜரை இணைக்கும்போது ஸ்லைடுஷோவைத் திறக்கும்.
picture-frame.setting.sync = சர்வரிலிருந்து பெறு
picture-frame.setting.sync.help = கோரிக்கையின் பேரில் மட்டும், சார்ஜர் இணைக்கப்படும்போதும் (அதிகபட்சம் ஆறு மணிநேரத்துக்கு ஒருமுறை), அல்லது Wi-Fi ஏற்கெனவே ஆன் ஆக இருக்கும்போதும் (அதிகபட்சம் தினமும் ஒருமுறை). சாதனத்தை எழுப்புவது புகைப்படத்துக்காக ஒருபோதும் Wi-Fi-ஐ ஆன் செய்யாது.
picture-frame.sync.manual = கோரிக்கையின் பேரில்
picture-frame.sync.charging = சார்ஜருடன்
picture-frame.sync.online = சார்ஜருடனும் ஆன்லைனில் இருக்கும்போதும்
picture-frame.setting.cache = கார்டில் சர்வர் புகைப்படங்கள்
picture-frame.setting.cache.help = சர்வரிலிருந்து பெற்ற புகைப்படங்கள் கார்டில் எடுக்கும் அதிகபட்ச இடம். சர்வரில் இன்னும் அதிகம் இருந்தால், ஒவ்வொரு முறை பெறும்போதும் அடுத்தவை வரும்.
picture-frame.unit.mb.other = {count} MB
picture-frame.setting.server = புகைப்பட சர்வர்
picture-frame.setting.server.help = புகைப்படங்கள் உள்ள WebDAV கோப்புறையின் முகவரி, எ.கா. https://cloud.example.org/remote.php/dav/files/me/Photos
picture-frame.setting.user = பயனர்
picture-frame.setting.user.help = புகைப்பட சர்வருக்கான பயனர்பெயர். காலியாக இருந்தால்: கணக்கு இல்லை.
picture-frame.password = கடவுச்சொல்
picture-frame.secret.password = புகைப்பட சர்வர் கடவுச்சொல்
picture-frame.count.one = {count} புகைப்படம்
picture-frame.count.other = {count} புகைப்படங்கள்
picture-frame.help = கார்டு கோப்புறையிலும் சர்வரிலும் உள்ள உங்கள் புகைப்படங்கள்: ஸ்லைடுஷோ அவற்றை ஒன்றன் பின் ஒன்றாகக் காட்டும்; உறக்கத் திரையை உறக்கம் › காட்டு என்பதில் தேர்ந்தெடுக்கவும்.
picture-frame.none = இன்னும் புகைப்படங்கள் இல்லை. கார்டில் உள்ள {folder}-இல் JPEG அல்லது PNG புகைப்படங்களை வைக்கவும், அல்லது உங்கள் சர்வரிலிருந்து பெறவும்.
picture-frame.loading = புகைப்படம் ஏற்றப்படுகிறது …
picture-frame.widget.none = இன்னும் புகைப்படங்கள் இல்லை
picture-frame.syncing = புகைப்படங்களைப் பெறுகிறது …
picture-frame.synced = பெற்ற புகைப்படங்கள்: {fetched}. கார்டில்: {photos}-இல் {cached}.
picture-frame.empty-server = சர்வர் கோப்புறையில் புகைப்படங்கள் இல்லை.
picture-frame.no-server = முதலில் புகைப்பட சர்வரின் முகவரியை உள்ளிடவும்.
picture-frame.bad-url = முகவரி http:// அல்லது https:// எனத் தொடங்க வேண்டும்.
picture-frame.no-network = சர்வரை அணுக முடியவில்லை. முகவரியையும் நெட்வொர்க்கையும் சரிபார்க்கவும்.
picture-frame.denied = சர்வர் பயனர்பெயரையோ கடவுச்சொல்லையோ ஏற்கவில்லை.
picture-frame.not-found = சர்வரில் கோப்புறை காணப்படவில்லை.
picture-frame.full = கார்டு நிரம்பிவிட்டது.
picture-frame.cancelled = பெறுதல் நிறுத்தப்பட்டது.
picture-frame.failed = சர்வர் அதன் புகைப்படங்களைத் தரவில்லை. முகவரியைச் சரிபார்க்கவும்.
picture-frame.not-kept = கடவுச்சொல்லைச் சேமிக்க முடியவில்லை.
picture-home.plugin.name = படமுள்ள முகப்புத் திரை
picture-home.plugin.description = விட்ஜெட்டுகளுக்குப் பின்னால் உங்கள் சொந்தப் படமும், நீங்கள் அமைக்கும் நிலைப் பட்டியும் உள்ள முகப்புத் திரை.
picture-home.plugin.how = "ஆன் ஆக இருக்கும்போது இது முகப்புத் திரையை மாற்றும்: விட்ஜெட்டுகளுக்குப் பின்னால் உங்கள் படம், நீங்கள் அமைக்கும் விட்ஜெட், கருவிப் பக்கங்கள். செருகுநிரல் மேலாளரில் ஆஃப் செய்தால், உள்ளமைந்த முகப்புத் திரை திரும்பும்.\n\nகார்டில் ஒரு கோப்புறையில் (இயல்பாக wallpapers) படங்களை (JPEG, PNG, GIF) வைத்து, அமைப்புகள் › தனிப்பயனாக்கு › படமுள்ள முகப்புத் திரை என்பதில் ஒன்றைத் தேர்ந்தெடுக்கவும். பொருத்தம்: திரையை எப்படி நிரப்பும் (நிரப்பு, முழுப் படம், நீட்டு, அசல் அளவு, அடுக்கு); நிலை: எந்தப் பகுதி இருக்கும்; பெரிதாக்கம்: எவ்வளவு பெரிது; படத்தை வெளிராக்கு: எவ்வளவு வெளிர். வெளிரான படத்தில் விட்ஜெட்டுகள் எளிதாகப் படிக்கப்படும். ஒவ்வொரு திரை அளவுக்கும் படம் ஒருமுறை தயாரிக்கப்படும்.\n\nவிட்ஜெட்டுகள் படத்தின் மேல் பின்புலங்களில் இருக்கும். பக்கத்தை அமைக்க: பக்கத்தின் கீழ் உள்ள பென்சில், அல்லது மெனுவில் முகப்புத் திரையைத் திருத்து.\n\nநிலைப் பட்டி (நேரம், Wi-Fi, பேட்டரி அல்லது நீங்கள் தேர்ந்தெடுப்பவை): ஆன், ஆஃப் அல்லது தானியங்கு; மேலே அல்லது கீழே; முழு அகலம், அல்லது இடது, நடு, வலதில் சிறிய வில்லை; வெளிர், அடர், சாம்பல் பின்புலத்தில் அல்லது படத்தின் மீதே. பட்டன்களின் பெயர் வரிசையும் (X4-இல்) ஆன், ஆஃப், தானியங்கு ஆகலாம். தானியங்கு: பட்டனை அழுத்தினால் அவை சில விநாடிகள் தெரியும்; அந்த அழுத்தம் வேறு எதுவும் செய்யாது.\n\nபட வரைவு: சாம்பல் நிலைகள் (X4-இல் மெதுவானது), புள்ளிகள் (கருப்பு-வெள்ளை, வேகமானது), அல்லது தானியங்கு: வரையும்போது சாம்பல் நிலைகள், முதல் மாற்றத்துக்குப் பிறகு புள்ளிகள். சாம்பல் நிலைகள் இல்லாத திரையில் புள்ளிகள் பயன்படும்."
picture-home.title = படமுள்ள முகப்புத் திரை
picture-home.add = சேர்
picture-home.add.tools = கருவிகள்
picture-home.add-page = பக்கத்தைச் சேர்
picture-home.remove-page = இந்தப் பக்கத்தை அகற்று
picture-home.too-big = இந்த மாற்றம் ஒரே நேரத்தில் சேமிக்க முடியாத அளவு பெரியது.
picture-home.no-room = இந்தப் பக்கத்தில் அதற்கு இடம் இல்லை.
picture-home.preparing = படம் தயாராகிறது
picture-home.preparing.text = இதற்குச் சிறிது நேரம் ஆகும், ஒவ்வொரு படத்துக்கும் திரை அளவுக்கும் ஒருமுறை.
picture-home.unreadable = படத்தைப் படிக்க முடியவில்லை.
picture-home.short = படத்துக்குப் போதுமான நினைவகமோ கார்டில் இடமோ இல்லை.
picture-home.edit-upright = பக்கங்களை அமைக்கத் திரையை நேராகத் திருப்பவும்.
picture-home.edit.edit = திருத்து
picture-home.edit.done = முடிந்தது
picture-home.edit.cancel = ரத்துசெய்
picture-home.no-picture = படம் இல்லை
picture-home.no-pictures.title = படங்கள் இல்லை
picture-home.no-pictures = கார்டில் உள்ள “{folder}” கோப்புறையில் JPEG, PNG அல்லது GIF படங்களை வைக்கவும்.
picture-home.setting.folder = படக் கோப்புறை
picture-home.setting.folder.help = உங்கள் படங்கள் உள்ள கார்டின் கோப்புறை.
picture-home.setting.picture = படம்
picture-home.setting.picture.help = விட்ஜெட்டுகளுக்குப் பின்னால். படம் இல்லையெனில் பக்கம் வெறுமையாக இருக்கும்.
picture-home.setting.fit = பொருத்தம்
picture-home.setting.fit.help = படம் திரையை எப்படி நிரப்பும்.
picture-home.setting.anchor = நிலை
picture-home.setting.anchor.help = ஓரங்கள் வெட்டப்படும்போது எந்தப் பகுதி இருக்கும், அல்லது சிறிய படம் எங்கே அமையும்.
picture-home.setting.zoom = பெரிதாக்கம்
picture-home.setting.zoom.help = சதவீதத்தில். அதிகமானால் படத்தின் குறைந்த பகுதி தெரியும்.
picture-home.setting.lighten = படத்தை வெளிராக்கு
picture-home.setting.lighten.help = விட்ஜெட்டுகளும் உரையும் நன்கு படிக்கப்பட, வெளிராக. சதவீதத்தில்.
picture-home.setting.brightness = ஒளிர்வு
picture-home.setting.brightness.help = படம் எவ்வளவு வெளிச்சமாக இருக்கும். உங்கள் திரையில் மிக அடர்வாகத் தெரிந்தால் அதிகரிக்கவும்.
picture-home.setting.contrast = ஒளிமாறுபாடு
picture-home.setting.contrast.help = அடர், வெளிர் பகுதிகள் எவ்வளவு வேறுபடும்.
picture-home.setting.plate = விட்ஜெட் பின்புலம்
picture-home.setting.plate.help = ஒவ்வொரு விட்ஜெட்டின் கீழும் ஒரு பின்புலம்: இயல்பு (வெள்ளை), வெளிர் சாம்பல், அல்லது படம் தெரியும்படி ஒளிபுகும். அடர் படத்துக்கு, விட்ஜெட்டின் வண்ணங்களில் வெளிர் உரை வண்ணத்தைத் தேர்ந்தெடுக்கவும்.
picture-home.setting.render = பட வரைவு
picture-home.setting.render.help = சாம்பல் நிலைகள்: மெதுவானது. புள்ளிகள்: வேகமானது. தானியங்கு: உள்ளமைந்த முகப்புத் திரை போல.
picture-home.setting.bar = நிலைப் பட்டி
picture-home.setting.bar.help = நேரம், Wi-Fi, பேட்டரி. தானியங்கு: பட்டனை அழுத்தினால் சில விநாடிகள் தெரியும்.
picture-home.setting.bar-at = நிலைப் பட்டி: இடம்
picture-home.setting.bar-at.help = விட்ஜெட்டுகளுக்கு மேலே அல்லது கீழே.
picture-home.setting.bar-shape = நிலைப் பட்டி: வடிவம்
picture-home.setting.bar-shape.help = முழு அகலம், அல்லது சிறிய வில்லை.
picture-home.setting.bar-align = நிலைப் பட்டி: பக்கம்
picture-home.setting.bar-align.help = வில்லை எங்கே அமையும்.
picture-home.setting.bar-look = நிலைப் பட்டி: தோற்றம்
picture-home.setting.bar-look.help = அது எதன் மீது இருக்கும். படத்தின் மீது, உரை கருப்பு அல்லது வெள்ளை: எது படிக்க எளிதோ அது.
picture-home.setting.hints = பட்டன் வரிசை
