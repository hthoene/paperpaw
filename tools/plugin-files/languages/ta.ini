calendar.setting.sync.help = கேலெண்டரைத் திறக்கும்போதும் இப்போது ஒத்திசை என்பதைத் தேர்ந்தெடுக்கும்போதும் தவிர, கேலெண்டர்கள் எப்போது படிக்கப்படும். இதற்காக மட்டும் சாதனம் வயர்லெஸை ஒருபோதும் இயக்காது.
