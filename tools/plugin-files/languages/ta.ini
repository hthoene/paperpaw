help.setting.again.help = ஒவ்வொரு திரையும் அடுத்த முறை திறக்கும்போது அதன் குறிப்புகள் மீண்டும் ஒருமுறை காட்டப்படும்.
help.again-done = ஒவ்வொரு திரையும் அடுத்த முறை திறக்கும்போது குறிப்புகள் மீண்டும் காட்டப்படும்.
home.plugin.name = முகப்புத் திரை
home.plugin.description = தொடக்கப் பக்கம்: படித்துக்கொண்டிருக்கும் புத்தகம், கருவிகள் போன்ற விட்ஜெட்டுகளின் பக்கங்கள்.
home.plugin.how = "முகப்புத் திரை பக்கங்களால் ஆனது; ஒவ்வொன்றும் ஃபோனில் உள்ளது போல விட்ஜெட்டுகளும் கருவிகளும் கொண்ட கட்டம். தொடக்கத்தில் கடிகாரம், நீங்கள் படிக்கும் புத்தகம், சமீபத்தில் படித்த புத்தகங்கள் ஒரு பக்கத்திலும், எல்லாக் கருவிகளும் அடுத்த பக்கத்திலும் இருக்கும்.\n\nஒரு உருப்படியைத் திறக்க அதைத் தட்டவும்; பக்கம் மாற்ற ஸ்வைப் செய்யவும் அல்லது பக்க பட்டன்களைப் பயன்படுத்தவும். பட்டன்கள் மட்டும் இருந்தால், அம்புப் பட்டன்கள் ஒரு உருப்படியிலிருந்து அடுத்ததற்கு நகரும், தேர்ந்தெடு அதைத் திறக்கும்.\n\nமறுஒழுங்கு செய்ய, முகப்புத் திரையை அழுத்திப் பிடிக்கவும், பக்கத்தின் கீழே உள்ள பென்சிலைத் தட்டவும் அல்லது மெனுவில் முகப்புத் திரையைத் திருத்து என்பதைத் தேர்ந்தெடுக்கவும். உருப்படிகளை நகர்த்த இழுக்கவும் அல்லது விருப்பங்களுக்கு ஒன்றைத் தட்டவும்; பட்டன்களாலும் முடியும். விட்ஜெட்டைச் சேர் என்பதும் அங்கே உள்ளது. நெடுவரிசைகள், வரிசைகள் ஆகியவை அமைப்புகளில், தோற்றம் › முகப்புத் திரை பிரிவில் உள்ளன.\n\nபக்கவாட்டில் திருப்பிய திரையில், முகப்புத் திரை அதே உருப்படிகளை அதிக நெடுவரிசைகளுடன் காட்டும்; ஒவ்வொரு பக்கமும் நிரம்பிய பிறகே அடுத்தது, கார்டுகள் சுமார் 110 mm-க்கு மேல் அகலமாகாது; நேர்நிலையில் நீங்கள் அமைத்தது மாறாது. பக்கவாட்டில் அமைத்தால், அந்தத் தளவமைப்பு அந்த நோக்குநிலைக்குத் தனியாக வைக்கப்படும்: புதிய விட்ஜெட்டுகள் இரண்டிலும் சேர்க்கப்படும். (திருத்தும்போது) சேர் என்பதில் உள்ள கிடைமட்டத் தளவமைப்பை மீட்டமை, தானாக உருவான தளவமைப்புக்குத் திரும்பும். ஒரு நோக்குநிலையில் விட்ஜெட்டையோ கருவியையோ அகற்றினால் மற்றொன்றிலிருந்து அது அகற்றப்படாது."
