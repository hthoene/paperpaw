mail.pin.title = இந்தச் சர்வரை நம்பவா?
mail.pin.text = "{why}\nஇந்த விசைக் கைரேகை உங்கள் வழங்குநர் அல்லது நிர்வாகி காட்டுவதுடன் பொருந்தினால் மட்டுமே சர்வரை நம்பவும்:\n{hash}"
