wifi.plugin.name = Wi-Fi
wifi.plugin.description = தேவைப்படும்போது Wi-Fi நெட்வொர்க்குகளுடன் இணைந்து, பிறகு ரேடியோவை ஆஃப் செய்யும்.
wifi.plugin.how = "ஒரு செருகுநிரலுக்கு இணையம் தேவைப்படும்போது (கேட்லாக், ஒத்திசைவு, ஸ்டோர், பரிமாற்றம்) Wi-Fi ஒரு நெட்வொர்க்குடன் இணையும். எதுவும் பயன்படுத்தாத ஒரு நிமிடத்துக்குப் பிறகு, அல்லது முகப்பு அல்லது ஒரு புத்தகம் தோன்றியதும் உடனே, பேட்டரியையும் நினைவகத்தையும் சேமிக்க ரேடியோவை ஆஃப் செய்யும்.\n\nஅமைப்புகளிலிருந்து அல்லது நிலைப் பட்டியில் உள்ள Wi-Fi உருப்படியிலிருந்து Wi-Fi-ஐத் திறக்கவும். நெட்வொர்க்குகள் என்பது அருகிலுள்ளவற்றைக் காட்டும்; ஒன்றைத் தேர்ந்தெடுத்து அதன் கடவுச்சொல்லை உள்ளிடவும், அல்லது ஃபோன் மூலம் அமை என்பதைத் தேர்ந்தெடுத்து, பெயரையும் கடவுச்சொல்லையும் சாதனத்துக்குப் பதிலாக உங்கள் ஃபோனின் உலாவியில் உள்ளிடவும். மறந்துவிடு என்பது சேமித்த நெட்வொர்க்கை அகற்றும்.\n\nகடவுச்சொற்கள் கார்டில் பாதுகாப்பாக வைக்கப்படும், மீண்டும் ஒருபோதும் காட்டப்படாது. தேவைப்படும்போது இணை என்பதில், கடைசிப் பயன்பாட்டுக்குப் பிறகு Wi-Fi எவ்வளவு நேரம் ஆனில் இருக்கும், சார்ஜ் ஆகும்போது ஆனில் இருக்குமா, பல நெட்வொர்க்குகள் அருகில் இருக்கும்போது எந்தச் சேமித்த நெட்வொர்க் முதலில் வரும் என்பதை அமைக்கலாம்."
