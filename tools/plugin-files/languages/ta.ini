calibre.plugin.name = வயர்லெஸ் நூலகம்
calibre.plugin.description = நெட்வொர்க் மூலம் புத்தகங்களைப் பெறும். Calibre-க்கு வயர்லெஸ் சாதனமாகச் செயல்படும்.
calibre.plugin.how = "வயர்லெஸ் நூலகம் உங்கள் கணினியில் உள்ள Calibre-இல் இந்தச் சாதனத்தை வயர்லெஸ் சாதனமாகக் காட்டும். பிறகு Calibre புத்தகங்களை அனுப்பலாம், பட்டியலிடலாம், நீக்கலாம். புத்தகங்கள் நூலகத்துக்குச் செல்லும்.\n\nசாதனமும் கணினியும் ஒரே Wi-Fi நெட்வொர்க்கில் இருக்கும்போது, கருவிகள் மெனுவில் வயர்லெஸ் நூலகத்தைத் திறக்கவும். Calibre-இல் Connect/share, பிறகு Start wireless device connection என்பதைத் தேர்ந்தெடுக்கவும். சாதனம் உங்கள் கணினியைக் கண்டறிந்ததும் அதன் பெயரைக் காட்டும்; இணை என்பதைத் தட்டவும் (பட்டன்களில்: தேர்ந்தெடு). Calibre இங்கே புத்தகங்களைச் சேர்க்கவும் நீக்கவும் முடியும், எனவே உங்கள் சொந்தக் கணினியுடன் மட்டுமே இணைக்கவும். திரையை மூடினால் இணைப்பு முடியும்.\n\nCalibre தானாகக் கண்டறியப்படவில்லை என்றால், அமைப்புகள் › நூலகம் என்பதில் Calibre பகுதியில் முகவரி என்பதில் அதன் கணினியின் முகவரியை உள்ளிடவும். Calibre 9090 அல்லாத போர்ட்டைப் பயன்படுத்தினால், அதை :போர்ட் எனச் சேர்க்கவும், எ.கா. 192.168.1.20:9091."
