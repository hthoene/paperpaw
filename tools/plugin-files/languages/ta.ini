notes-overview.plugin.name = எல்லாக் குறிப்புகளும்
notes-overview.plugin.description = எல்லாப் புத்தகங்களின் புக்மார்க்குகளும் ஹைலைட்டுகளும் ஒரே பட்டியலில், My Clippings.txt ஆக ஏற்றுமதியுடன்.
notes-overview.plugin.how = "நீங்கள் புக்மார்க் அல்லது ஹைலைட் செய்த ஒவ்வொரு புத்தகத்தையும், எத்தனை என்பதுடன், எல்லாக் குறிப்புகளும் பட்டியலிடும். அதைக் கருவிகளில் திறக்கவும். ஒரு புத்தகத்தைத் தேர்ந்தெடுத்தால் அதன் குறிப்புகள் தெரியும்; ஒரு குறிப்பைத் தேர்ந்தெடுத்தால் புத்தகம் அந்த இடத்தில் திறக்கும்.\n\nபட்டியலின் இறுதியில் உள்ள My Clippings.txt ஆக ஏற்றுமதி செய், எல்லாக் குறிப்புகளையும் ஒரே கோப்பில், நூலகத்தின் அருகில் உள்ள Exports கோப்புறையில், Kindle பயன்படுத்தும் வடிவத்தில் (UTF-8) எழுதும். Kindle-இன் My Clippings.txt-ஐப் படிக்கும் ஆப்ஸ் இதையும் படிக்கும். Kindle-இல் உள்ளது போலவே, ஹைலைட்டின் மீதான குறிப்பு தனிப் பதிவாக இருக்கும். இங்குள்ள புத்தகங்களுக்கு Kindle இருப்பிடங்கள் இல்லாததால், “location” என்பது குறிப்பு புத்தகத்தில் எவ்வளவு தூரத்தில் உள்ளது என்பதைச் சதவீதத்தில் காட்டும். கோப்பு ஒவ்வொரு முறையும் மீண்டும் எழுதப்பட்டு, முந்தையதை மாற்றும்."
