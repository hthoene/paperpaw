smart-home.problem.address = இது சாதனம் பயன்படுத்தக்கூடிய முகவரி அல்ல. http://homeassistant.local:8123 போல எழுதவும்.
smart-home.problem.outside = அந்தச் சர்வர் உங்கள் வீட்டு நெட்வொர்க்கில் இல்லை. அமைப்புகளில் அதை அனுமதித்து, https பயன்படுத்தவும்.
smart-home.problem.insecure = வெறும் http உங்கள் வீட்டு நெட்வொர்க்கில் மட்டுமே பயன்படுத்தப்படும். அந்தச் சர்வருக்கு https முகவரியைப் பயன்படுத்தவும்.
smart-home.problem.no-network = Wi-Fi நெட்வொர்க் இல்லை. உங்கள் வீட்டு நெட்வொர்க்குடன் இணைத்து மீண்டும் முயலவும்.
smart-home.problem.offline = சாதனம் ஆஃப்லைன் பயன்முறையில் உள்ளது, எனவே ஆன்லைனுக்குச் செல்லாது.
smart-home.problem.off = ஸ்மார்ட் ஹோமின் அனுமதிகளில் நெட்வொர்க் ஆஃப் செய்யப்பட்டுள்ளது.
smart-home.problem.unreachable = சர்வர் பதிலளிக்கவில்லை. முகவரியையும், உங்கள் வீட்டு நெட்வொர்க்கை அணுக முடிகிறதா என்பதையும் சரிபார்க்கவும்.
smart-home.problem.not-found = சர்வருக்கு அது தெரியவில்லை. முகவரியைச் சரிபார்க்கவும்.
smart-home.problem.tls = பாதுகாப்பான இணைப்பு தோல்வியடைந்தது. https-க்கு சாதனம் நம்பும் சான்றிதழ் தேவை; வீட்டு நெட்வொர்க்கில் http பயன்படுத்தவும்.
smart-home.problem.denied = சர்வர் டோக்கனை ஏற்கவில்லை. புதிய நீண்ட கால அணுகல் டோக்கனை உருவாக்கி, இணைப்பு என்பதன் கீழ் சேர்க்கவும்.
smart-home.problem.status = சர்வர் ஒரு பிழையுடன் பதிலளித்தது ({status}).
smart-home.problem.too-big = சர்வரின் பதில் மிகப் பெரியது.
smart-home.problem.card = கார்டில் பதிலைச் சேமிக்க முடியவில்லை. அது நிரம்பவில்லை என்பதைச் சரிபார்க்கவும்.
smart-home.problem.bad-answer = பதில் நிலைகளின் பட்டியல் அல்ல. இது Home Assistant-இன் முகவரிதானா?
