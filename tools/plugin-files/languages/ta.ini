keys.plugin.name = பட்டன்களும் சைகைகளும்
keys.plugin.description = ஒவ்வொரு பட்டன், தட்டும் பகுதி, ஸ்வைப் என்ன செய்யும் என்பதைச் சாதனத்திலேயே மாற்றலாம்.
keys.plugin.how = "பட்டன்களும் சைகைகளும், ஒவ்வொரு பட்டன், தட்டும் பகுதி, ஸ்வைப் என்ன செய்யும் என்பதைக் காட்டி, அதைச் சாதனத்திலேயே மாற்ற உதவும்.\n\nஅமைப்புகளில், சாதனம் பிரிவில் இதைத் திறக்கவும். முதலில் மாற்றம் எங்கே பொருந்தும் எனத் தேர்ந்தெடுக்கவும்: எல்லா இடத்திலும், படிக்கும்போது, முகப்புத் திரையில், நூலகத்தில் அல்லது ஒரு கருவியில். பிறகு அழுத்திப் பிடித்த பட்டன் அல்லது விளிம்பிலிருந்து ஸ்வைப் போன்ற ஒரு உள்ளீட்டைத் தேர்ந்தெடுத்து, பட்டியலிலிருந்து (தேடலாம்) ஒரு செயலைத் தேர்ந்தெடுக்கவும். இயல்புநிலைப்படி என்பது செருகுநிரல்களும் பட்டன் தளவமைப்பும் அமைத்ததைத் திரும்பத் தரும்.\n\nX4-இல், தேர்ந்தெடுக்க, பின்செல்ல அல்லது முன்னேற ஒரு பட்டனும் இல்லாமல் செய்யும் மாற்றம் மறுக்கப்படும். இறுதியில் உள்ள பட்டன்களையும் சைகைகளையும் மீட்டமை எல்லா மாற்றங்களையும் திரும்பப் பெறும்."
