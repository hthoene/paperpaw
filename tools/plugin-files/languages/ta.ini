translate.plugin.name = மொழிபெயர்ப்பு
translate.plugin.description = தேர்ந்தெடுத்த உரையை DeepL மூலம் ஆன்லைனில் மொழிபெயர்க்கிறது.
translate.plugin.how = "மொழிபெயர்ப்பு, தேர்ந்தெடுத்த உரையை DeepL மூலம் ஆன்லைனில் மொழிபெயர்க்கிறது. புத்தகத்தில் உரையைத் தேர்ந்தெடுத்து, அதன் மெனுவில் மொழிபெயர் என்பதைத் தேர்ந்தெடுக்கவும்: அகராதிப் பதிவு போல மொழிபெயர்ப்பு பக்கத்தின் மேல் தோன்றும். பக்க பட்டன்கள் அல்லது தட்டுதல் அதை உருட்டும்; தேர்ந்தெடு பட்டன் அல்லது அதன் முடிவில் தட்டுதல் அதை மூடும்.\n\nஇதற்கு நெட்வொர்க்கும் உங்கள் சொந்த DeepL API விசையும் தேவை; deepl.com-இல் இலவசம் (DeepL API Free, மாதம் சுமார் 500,000 எழுத்துகள்). அதை உள்ளிடும் வரை பேனல் அதைச் சொல்லும், தட்டினால் அதைக் கேட்கும்.\n\nஅமைப்புகளில், வாசிப்பு, மொழிபெயர்ப்புப் பிரிவில், இதில் மொழிபெயர் என்பது மொழியை அமைக்கும்; தொடக்கத்தில் அது PaperPaw-இன் மொழி."
