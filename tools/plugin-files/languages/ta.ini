core.firmware.dual.title = இந்தச் சாதனத்தை PaperPaw-இன் சொந்தச் சாதனமாகக் கருதவா?
core.firmware.dual.what = அதன் பிறகு PaperPaw இந்தச் சாதனத்தைத் தனது சொந்தமாகக் கருதும். அதன் அடுத்த புதுப்பிப்பு மற்ற ஃபர்ம்வேரை அழித்துவிடும், அதை உங்களால் திரும்பக் கொண்டுவர முடியாது: இரண்டையும் அமைத்த கருவியால் மட்டுமே முடியும்.
