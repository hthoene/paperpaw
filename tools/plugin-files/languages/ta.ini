core.firmware.other-key = PaperPaw-உடையது அல்லாத விசையால் கையொப்பமிடப்பட்டது: {fingerprint}. அதை நம்பினால் மட்டும் நிறுவவும்.
core.firmware.unsigned = கையொப்பமிடப்படவில்லை.
core.firmware.older = இது பழைய பதிப்பு, அல்லது அதே பதிப்பு.
core.firmware.foreign.1 = இது PaperPaw அல்ல, வேறொரு ஃபர்ம்வேர். PaperPaw தானாக மீண்டும் தொடங்காது.
core.firmware.foreign.2 = PaperPaw இதைச் செயல்தவிர்க்காது. திரும்பிச் செல்வது மற்ற ஃபர்ம்வேரையோ ஒரு ஃபிளாஷ் கருவியையோ பொறுத்தது (வெப் ஃபிளாஷர் வேலை செய்யும்).
core.firmware.foreign.3 = PaperPaw ஃபிளாஷ் நினைவகத்தில் இருக்கும்; கார்டில் உள்ள உங்கள் கோப்புகள் தொடப்படாது.
core.firmware.foreign.4 = இது கையொப்பமிடப்படவில்லை; பூட் லோடர் தொடங்குவது போல மட்டுமே சரிபார்க்கப்பட்டது.
core.firmware.yes = நிறுவு
core.firmware.yes.restart = மீண்டும் தொடங்கு
