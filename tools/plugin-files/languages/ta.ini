files.plugin.name = கோப்பு உலாவி
files.plugin.description = சாதனத்தில் உள்ள புத்தகங்களையும் கோப்புறைகளையும் பட்டியலிட்டுத் திறக்கும்.
files.plugin.how = "நூலகம் உங்கள் நூலகக் கோப்புறையில் உள்ள புத்தகங்களை, ஒவ்வொன்றின் அட்டைப்படம், தலைப்பு, ஆசிரியர், எவ்வளவு படித்துள்ளீர்கள் என்பதுடன் பட்டியலிடும். கடைசியாகப் படித்த புத்தகம் மேலே ஒரு கார்டாக இருக்கும், எனவே தொடர்ந்து படிக்க ஒரு தட்டல் அல்லது தேர்ந்தெடு பட்டனை ஒருமுறை அழுத்தினால் போதும். புத்தகங்களைத் தேடும்போது, இதுவரை எத்தனை கண்டறிந்தது என்று காட்டும்.\n\nபுத்தகங்களுக்கு மேலே எது காட்டப்பட வேண்டும் எனத் தேர்ந்தெடுக்கவும்: எல்லாம், படித்துக்கொண்டிருப்பவை, படிக்காதவை அல்லது படித்து முடிந்தவை, அல்லது அலமாரிகள் (ஆசிரியர், தொடர், குறிச்சொல், பிடித்தவை, தொடங்கிய ஒவ்வொரு தொடரின் அடுத்த புத்தகம்). படிக்க ஒரு புத்தகத்தைத் தட்டவும்; திறக்க, படித்து முடிந்தது அல்லது படிக்காதது எனக் குறிக்க, தகவலைப் பார்க்க, காப்பகத்துக்கு நகர்த்த அல்லது நீக்க அதை அழுத்திப் பிடிக்கவும் (பட்டன்களில்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்). நூலக மெனுவுக்குத் தலைப்பைத் தட்டவும்: புத்தகங்கள் எப்படி வரிசைப்படுத்தப்பட்டுக் காட்டப்படும், தேடல், நூலகக் கோப்புறை, அமைப்புகள்.\n\nநூலகக் கோப்புறையை அமைப்புகள் › நூலகம் என்பதில் நூலகக் கோப்புறை என அமைக்கலாம்; அங்கே புத்தகங்களை அட்டைப்படக் கட்டமாகவும் காட்டலாம். மற்ற எல்லாக் கோப்புகளுக்கும் கருவிகள் மெனுவில் கோப்புகள் என்பதைப் பயன்படுத்தவும்."
