core.safe-mode.failed = தொடக்கம் தோல்வியடைந்ததால் செருகுநிரல்கள் முடக்கப்பட்டுள்ளன. மீண்டும் முயல, சாதனத்தை அணைத்து மீண்டும் இயக்கவும்.
