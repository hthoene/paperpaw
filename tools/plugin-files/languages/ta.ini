smart-home.plugin.name = ஸ்மார்ட் ஹோம்
smart-home.plugin.description = உங்கள் சொந்த Home Assistant-இன் மதிப்புகளும் ஸ்விட்சுகளும், டாஷ்போர்டிலும் முகப்புத் திரை விட்ஜெட்டுகளாகவும். உங்கள் வீட்டு நெட்வொர்க்கில் உள்ள Home Assistant-உடன் செயல்படும்.
smart-home.plugin.how = "ஸ்மார்ட் ஹோம் உங்கள் Home Assistant-இன் மதிப்புகளையும் ஸ்விட்சுகளையும் காட்டும் (வெப்பநிலை, ஈரப்பதம், ஆற்றல், கதவுகள், ஜன்னல்கள், விளக்குகள், காட்சிகள்). வீட்டு நெட்வொர்க்கில் REST API மூலம் நேரடியாகச் சர்வருடன் பேசும்; வேறு சேவை இல்லை.\n\nகருவிகள் மெனு › ஸ்மார்ட் ஹோம் › இணைப்பு: Home Assistant முகவரியையும் (எ.கா. http://homeassistant.local:8123) நீண்ட கால அணுகல் டோக்கனையும் (சுயவிவரப் பக்கத்தின் கீழே உருவாக்கலாம்) உள்ளிடவும். டோக்கன் கடவுச்சொற்கள், விசைகளுடன் சேமிக்கப்படும், அமைப்புக் கோப்பில் அல்ல. http வீட்டு நெட்வொர்க்கில் மட்டுமே; வெளியே உள்ள சர்வருக்கு, அமைப்புகளில் “வீட்டு நெட்வொர்க்குக்கு வெளியே உள்ள சர்வர்கள்” என்பதை ஆன் செய்து, சரியான சான்றிதழுடன் https பயன்படுத்தவும்.\n\nஎன்டிட்டிகளைத் தேர்ந்தெடு: பெயர் அல்லது id மூலம் தேடி, காட்ட வேண்டியதைத் தேர்ந்தெடுக்கவும் (மீண்டும் தேர்ந்தெடுத்தால் நீங்கும்). அறை கொடுத்தால், டாஷ்போர்டிலும் அறை விட்ஜெட்டுகளிலும் குழுவாக்கப்படும். அதிகபட்சம் 24. டாஷ்போர்டில் விளக்கு, ஸ்விட்ச் அல்லது காட்சியைத் தேர்ந்தெடுத்தால் அது மாறும்; சென்சார் மீண்டும் படிக்கப்படும்.\n\nவிட்ஜெட்டுகள் (முகப்புத் திரையை அழுத்திப் பிடிக்கவும்): மதிப்பு (ஓர் அளவீடு, பெரிதாக), குழு (ஓர் அறையின் என்டிட்டிகள்), ஸ்விட்ச் (ஒரு விளக்கு அல்லது ஸ்விட்சுக்கான பட்டன்), அறை (அளவீடுகளும் ஸ்விட்சுகளும் உள்ள கார்டு). என்டிட்டி/அறை: விட்ஜெட் அமைப்புகளில்.\n\nவீடு படிக்கப்படுவது: டாஷ்போர்டைத் திறக்கும்போது, புதுப்பி அல்லது விட்ஜெட்டைத் தட்டும்போது, Wi-Fi இயங்கும்போது சாதனம் விழித்தால், சார்ஜ் ஆகும்போது நீங்கள் அமைத்த இடைவெளியில். Wi-Fi-ஐத் தானாக ஆன் செய்யாது, ஆனில் வைத்திருக்காது."
