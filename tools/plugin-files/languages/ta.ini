settings.plugin.description = ஒவ்வொரு செருகுநிரலின் அமைப்புகளிலிருந்தும் உருவாக்கப்பட்ட அமைப்புப் பக்கங்கள்.
settings.plugin.how = "PaperPaw-இலும் அதன் செருகுநிரல்களிலும் அமைக்கக்கூடிய அனைத்தையும் அமைப்புகள் பக்கங்களாகக் காட்டும். செருகுநிரல்களுக்குத் தனித் திரை தேவையில்லை: அவை அறிவிப்பவை இங்கே குழுக்களாகத் தோன்றும், ஒவ்வொரு அமைப்பின் விளக்கமும் அதன் கீழே இருக்கும்.\n\nமெனுவில் உள்ள அமைப்புகள் மூலம் இதைத் திறக்கவும். ஒரு குழுவைத் திறக்க அதைத் தட்டவும், பிறகு ஒரு அமைப்பை மாற்ற அல்லது தேர்வுசெய்ய அதைத் தட்டவும்; எண்களுக்கு − மற்றும் + பட்டன்கள் உள்ளன. பட்டன்களுடன்: ஒரு அமைப்புக்குச் சென்று தேர்ந்தெடு பட்டனை அழுத்தவும்; இடது, வலது எண்ணை மாற்றும், தேர்ந்தெடு அதை வைத்திருக்கும், பின்செல் முந்தைய மதிப்புக்குத் திரும்பும்.\n\nமாற்றங்கள் உடனே பொருந்தும். தேடு, சொற்கள் மூலம் அமைப்பைக் கண்டறியும்; மேம்பட்ட அமைப்புகள், அரிதாகத் தேவைப்படுபவற்றையும் காட்டும். இயல்புநிலைக்கு மீட்டமை, அனைத்தையும் மீட்டமை ஆகியவை முதலில் கேட்கும்."
