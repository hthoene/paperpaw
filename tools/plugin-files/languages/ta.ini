profiles.plugin.name = வாசிப்புச் சுயவிவரங்கள்
profiles.plugin.description = பெயரிட்ட வாசிப்பு, காட்சி அமைப்புத் தொகுப்புகள், ஒரு தட்டலில் மாற்றலாம்.
profiles.plugin.how = "சுயவிவரம் உங்கள் வாசிப்பு அமைப்புகள், காட்சி அமைப்புகள், நிலைப் பட்டிகளை இரவு அல்லது பெரிய எழுத்து போன்ற ஒரு பெயரில் வைத்து, ஒரு தட்டலில் மீண்டும் கொண்டுவரும்.\n\nவாசிப்பு மெனுவில் மேலும் என்பதில், அல்லது அமைப்புகள் › தனிப்பயனாக்கு என்பதில் சுயவிவரங்களைத் திறக்கவும். பயன்படுத்த ஒரு சுயவிவரத்தைத் தட்டவும்; பயன்பாட்டில் உள்ளது குறிக்கப்படும். தற்போதைய அமைப்புகளை அதில் சேமிக்க, பெயர் மாற்ற அல்லது அகற்ற அதை அழுத்திப் பிடிக்கவும் (பட்டன்களில்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்). புதிய சுயவிவரமாகச் சேமி, இப்போது அமைக்கப்பட்டுள்ளவற்றை வைத்துக்கொள்ளும்.\n\nஅடுத்த சுயவிவரம் பட்டியலில் அடுத்ததுக்கு மாறும்; அதை ஒரு பட்டனில் அல்லது ஒரு விதியில் வைக்கவும்."
