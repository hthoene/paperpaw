vocabulary.web.import-help = ஒவ்வொரு வரியிலும் ஒரு கார்டு உள்ள CSV, TSV அல்லது TXT கோப்பை, அல்லது Anki-இலிருந்து ஏற்றுமதி செய்த தொகுப்பை (.apkg, "Support older Anki versions" உடன்) சேர்க்கவும், அல்லது ஒரு பட்டியலை ஒட்டவும். கார்டுகள் இந்தத் தொகுப்பில் சேரும். ஒவ்வொரு வரியும்: முன், பின், எடுத்துக்காட்டு (விருப்பத்தேர்வு), டேப், காற்புள்ளி அல்லது அரைப்புள்ளியால் பிரிக்கப்பட்டவை. எடுத்துக்காட்டு: Katze;cat;Die Katze schläft. கோப்புகள் UTF-8 உரையாக இருக்க வேண்டும்; ஒரு தொகுப்பில் அதிகபட்சம் 20,000 கார்டுகள்.
