tasks.setting.address.help = உங்கள் CalDAV சர்வர், அங்குள்ள உங்கள் நாள்காட்டிகள் அல்லது ஒரு பணிப் பட்டியலின் முகவரி, எ.கா. cloud.example.com/remote.php/dav. பணிகளை ரீடரில் மட்டும் வைத்திருக்க, காலியாக விடவும்.
