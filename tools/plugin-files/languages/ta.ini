core.plugin.yes.remove = அகற்று, தரவை வைத்திரு
core.plugin.yes.remove-data = தரவுடன் அகற்று
core.plugin.old-secrets = இந்தச் செருகுநிரலின் முந்தைய நிறுவல் சேமித்த கடவுச்சொற்கள் இன்னும் கார்டில் உள்ளன. அவை முதலில் அழிக்கப்படும்; இல்லையெனில் இது நிறுவப்படாது.
core.plugin.yes.erase = பழைய தரவை அழித்து நிறுவு
core.screen.open-failed = இந்தத் திரையைத் திறக்க முடியவில்லை.
core.screen.no-memory = இதற்குப் போதுமான நினைவகம் இல்லை. எதையாவது மூடிவிட்டு மீண்டும் முயலவும்.
core.plugin.unforgotten = அகற்றப்பட்ட {id} செருகுநிரலின் சேமித்த ரகசியங்களை அழிக்க முடியவில்லை. அவை கார்டில் இருக்கும்.
core.low-memory.title = நினைவகம் குறைவு
core.low-memory.text = இந்தச் செருகுநிரல்களுடன் நினைவகம் குறைவாக உள்ளது. படங்களும் அட்டைப்படங்களும் விடுபடலாம், புத்தகங்கள் மெதுவாகத் திறக்கும். செருகுநிரல்கள் என்பதில் ஒன்றை முடக்கவும்.
core.low-memory.plugins = செருகுநிரல்கள்
core.low-memory.later = இப்போது வேண்டாம்
core.setting.language = மொழி
core.setting.device-name = சாதனப் பெயர்
core.setting.night-mode = இரவுப் பயன்முறை
core.setting.night-mode.short = இரவு
core.setting.speak-focus = தேர்ந்தெடுத்ததைச் சொல்
core.setting.full-refresh-interval = முழுப் புதுப்பிப்பு
core.setting.rotation = திரையைச் சுழற்று
core.setting.rotation.help = நேராக அல்லது பக்கவாட்டில். “இந்தப் புத்தகம் மட்டும்” ஆன் எனில், அந்தப் புத்தகத்துக்கு மட்டும் பொருந்தும்.
core.setting.button-hints = பட்டன் குறிப்புகள்
core.setting.button-hints.help = திரையின் அடியில் ஒரு வரி, அதன் கீழுள்ள ஒவ்வொரு பட்டனும் என்ன செய்யும் எனக் காட்டும். வாசிக்கும்போது காட்டப்படாது.
core.setting.swap-page-buttons = பக்க பட்டன்களை இடமாற்று
core.setting.swap-page-buttons.help = வாசிக்கும்போது பக்க பட்டன்கள் எதிர்த்திசையில் பக்கம் புரட்டும்; மெனுக்களில் அல்ல.
core.setting.arrows-stay-on-page = அம்புகள் பக்கத்திலேயே இருக்கும்
core.setting.arrows-stay-on-page.help = பக்கத்தின் முதல் அல்லது கடைசி உருப்படியில் அம்புகள் அதே பக்கத்தில் சுற்றி வரும்; பக்க பட்டன்கள் பக்கம் புரட்டும்.
core.setting.space-size = அளவு
core.setting.space-size.help = ஒவ்வொரு இடைவெளியின் உயரம்.
core.setting.align = சீரமைப்பு
core.setting.align.help = விட்ஜெட்டின் உரை அதன் இடத்தில் எங்கே அமையும்: இடது, நடுவில் அல்லது வலது.
core.setting.frame = சட்டகம்
core.setting.frame.help = விட்ஜெட் எதன் மேல் வரையப்படும்; அடர் கார்டில் உரை வெளிராக இருக்கும்.
core.setting.padding = உள் இடைவெளி
core.setting.padding.help = விட்ஜெட்டின் உள்ளடக்கத்துக்கும் அதன் விளிம்புகள் அல்லது சட்டகத்துக்கும் இடையிலான இடைவெளி.
core.setting.font = எழுத்துரு
core.setting.font.help = இந்த விட்ஜெட்டின் எழுத்துரு. கார்டிலுள்ள எழுத்துருவுக்கு மிகப் பெரிய உரை மெனுக்களின் எழுத்துருவிலேயே இருக்கும்.
core.setting.size = அளவு
core.setting.size.help = விட்ஜெட்டின் உரை எவ்வளவு பெரியது. பொருந்தாத இடத்தில் அது சிறிதாக்கப்படும்.
core.setting.part.help = விட்ஜெட் இதைக் காட்டுமா என்பது. இடம் போதாத இடத்தில், எப்படியும் விடுபடலாம்.
core.setting.widget-frame = விட்ஜெட்டுகளின் சட்டகங்கள்
core.setting.widget-frame.help = தனது அமைப்புகளில் சட்டகம் தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டுக்குமான சட்டகம்.
core.setting.paper = வண்ணங்கள்
core.setting.paper.help = இயல்பு, தலைகீழ் நிறம், சாம்பல் அல்லது ஒளிபுகும். அடர் படத்தின் மேல் வெளிர் உரையைத் தேர்ந்தெடுக்கவும்.
core.setting.ink = உரை
core.setting.ink.help = விட்ஜெட்டின் உரை வண்ணம்; தானியங்கு என்பது படிக்க எளிதான கருப்பு அல்லது வெள்ளை.
core.setting.widget-paper = விட்ஜெட்டுகளின் வண்ணங்கள்
core.setting.widget-paper.help = தனது அமைப்புகளில் வண்ணம் தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் பின்னணி.
core.setting.widget-ink = விட்ஜெட்டுகளின் உரை
core.setting.widget-ink.help = தனது அமைப்புகளில் உரை வண்ணம் தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் உரை வண்ணம்.
core.setting.corners = மூலைகள்
core.setting.corners.help = விட்ஜெட்டின் மூலைகள் எவ்வளவு வட்டமானவை; தானியங்கு என்பது இடைமுகத்தின் மற்ற பகுதிகளைப் பின்பற்றும்.
core.setting.frame-line = சட்டகக் கோடு
core.setting.frame-line.help = விட்ஜெட்டின் சட்டகக் கோடு எவ்வளவு தடிமன்; தானியங்கு என்பது இடைமுகத்தின் கோடுகளைப் பின்பற்றும்.
core.setting.shadow = நிழல்
core.setting.shadow.help = விட்ஜெட்டின் கார்டு அல்லது வண்ணத்துக்குக் கீழும் வலதுபுறமும் ஒரு திடமான நிழல்.
core.setting.widget-corners = விட்ஜெட்டுகளின் மூலைகள்
core.setting.widget-corners.help = தனது அமைப்புகளில் மூலைகள் தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் மூலைகள்.
core.setting.widget-frame-line = விட்ஜெட்டுகளின் சட்டகக் கோடுகள்
core.setting.widget-frame-line.help = தனது அமைப்புகளில் சட்டகக் கோடு தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் சட்டகக் கோடு.
core.setting.widget-shadow = விட்ஜெட்டுகளின் நிழல்கள்
core.setting.widget-shadow.help = தனது அமைப்புகளில் நிழல் தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டுக்குமான நிழல்.
core.setting.widget-padding = விட்ஜெட்டுகளின் உள் இடைவெளி
core.setting.widget-padding.help = தனது அமைப்புகளில் உள் இடைவெளி தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் உள் இடைவெளி.
core.setting.widget-font = விட்ஜெட்டுகளின் எழுத்துரு
core.setting.widget-font.help = தனது அமைப்புகளில் எழுத்துரு தேர்ந்தெடுக்கப்படாத ஒவ்வொரு விட்ஜெட்டின் எழுத்துரு.
core.setting.widget-gap = விட்ஜெட்டுகளுக்கு இடையே இடைவெளி
core.setting.widget-gap.help = முகப்புத் திரையில் விட்ஜெட்டுகள் ஒன்றுக்கொன்று எவ்வளவு இடைவெளியில் இருக்கும்.
core.setting.text-color = உரை வண்ணம்
core.setting.paper-color = தாள் வண்ணம்
core.setting.colors.help = வெள்ளையில் கருப்பை விட மென்மையானது, கண்களுக்கு இதமானது; இரவுப் பயன்முறை இவற்றை இடமாற்றும்.
core.setting.text-color-own = சொந்த உரை வண்ணம்
core.setting.paper-color-own = சொந்தத் தாள் வண்ணம்
core.setting.color-own.help = #5b4636 (சிவப்பு, பச்சை, நீலம்) போன்ற வண்ணக் குறியீடு; மேலே உள்ள வண்ணம் “சொந்த வண்ணம்” எனில் பயன்படும்.
core.setting.sleep-after = இதன் பின் உறக்கம்
core.setting.notice-seconds = செய்தி நேரம்
core.setting.long-press-ms = நீண்ட அழுத்தம்
core.setting.double-tap-ms = இருமுறை தட்டல்
core.setting.tap-slop = தட்டல் விலகல் வரம்பு
core.setting.tap-layout = தட்டல் பகுதிகள்
core.setting.tap-swap = இடது, வலது தட்டல்களை இடமாற்று
core.setting.swipe-distance = ஸ்வைப் தூரம்
core.setting.frontlight = முன் விளக்கு
core.setting.frontlight-warmth = முன் விளக்கின் வெதுவெதுப்பு
core.setting.ui-size = மெனு உரை அளவு
core.setting.keymap-preset = பட்டன் அமைப்பு
core.setting.ui-header = தலைப்புப் பட்டிகள்
core.setting.ui-margin = மெனு ஓரங்கள்
core.setting.ui-row = வரிசை உயரம்
core.setting.ui-lines = கோட்டின் தடிமன்
core.setting.network-manager = நெட்வொர்க் மேலாளர் செருகுநிரல்
core.setting.logo = லோகோ படம்
core.setting.ui-palette = சாம்பல் நிறங்கள்
core.setting.text-curve = உரை நிறச்சாயல் வளைவு
core.setting.ui-text-curve = இடைமுக உரை நிறச்சாயல் வளைவு
core.setting.language.help = மெனுக்கள், செய்திகளின் மொழி.
core.setting.device-name.help = Calibre, உங்கள் ரூட்டர் முதலியவை பார்க்கும் பெயர்; அடுத்த இணைப்பிலிருந்து பயன்படும்.
core.setting.night-mode.help = கருப்பில் வெள்ளை உரை.
core.setting.night-pictures = படங்களைத் தலைகீழ் நிறமாக்கு
core.setting.night-pictures.help = ஆஃப்: அட்டைப்படங்களும் புகைப்படங்களும் நெகட்டிவாக அல்லாமல் உள்ளபடியே.
core.setting.mono-text = உரையின் அடர்த்தி
core.setting.mono-text.help = கருப்பு-வெள்ளைத் திரைகளில் எழுத்துகள் எவ்வளவு தடிமனாக இருக்கும்; மங்கலான திரைகளில் முழு என்பது உதவும்.
core.setting.speak-focus.help = பட்டன்கள் நகர்ந்து செல்லும் வரிசையை அல்லது பட்டனைச் சொல்லும்.
core.setting.voice = குரல்
core.setting.voice.help = தானியங்கு என்பது சிஸ்டத்தின் குரலைப் பயன்படுத்தும், இல்லையெனில் அந்த மொழிக்கான செருகுநிரலின் குரலை.
core.setting.ui-size.help = மெனுக்கள், பட்டியல்கள், நிலைப் பட்டியின் அளவு.
core.setting.keymap-preset.help = சாதனத்தின் பட்டன்கள் என்ன செய்யும்.
core.setting.full-refresh-interval.help = இத்தனை பக்கப் புரட்டல்களுக்குப் பிறகு ஒரு மின்னும் புதுப்பிப்பு எஞ்சிய பிம்பங்களை நீக்கும்; 0 எனில் ஒருபோதும் மின்னாது.
core.setting.flash-screens = திரை மாறும்போது மின்னு
core.setting.flash-screens.help = திரை திறக்கும்போது முழுமையாக மீண்டும் வரையும்: முந்தைய திரையின் தடம் இருக்காது, ஆனால் மெதுவாக இருக்கும்.
core.setting.ui-full-refresh-interval = மெனுக்களில் முழுப் புதுப்பிப்பு
core.setting.ui-full-refresh-interval.help = இத்தனை மெனு மாற்றங்களுக்குப் பிறகு ஒரு மின்னல் எஞ்சிய பிம்பங்களை நீக்கும்; 0 எனில் ஒருபோதும் மின்னாது.
core.setting.pictures-in-grays = சாம்பல் நிறங்களில் படங்கள்
core.setting.pictures-in-grays.help = அட்டைப்படங்கள் போன்ற படங்களை நான்கு சாம்பல் நிறங்களில் வரையும்: நுணுக்கமானது, ஆனால் சற்று மெதுவானது.
core.setting.sleep-after.help = உறக்கத்துக்கு முன் செயலற்ற நிமிடங்கள்; 0: ஒருபோதும் இல்லை.
core.setting.notice-seconds.help = “ஒத்திசைவு முடிந்தது” போன்ற சிறு செய்திகள் திரையில் எவ்வளவு நேரம் இருக்கும்.
core.setting.ui-header.help = மெனுக்கள், பட்டியல்களின் மேலே உள்ள தலைப்பு எப்படித் தோன்றும்.
core.setting.ui-corners = மூலைகள்
core.setting.ui-corners.help = முன்னிலைப்படுத்திய வரிசைகள், பட்டன்கள், பெட்டிகளின் மூலைகள்.
core.setting.ui-contrast = மாறுபாடு
core.setting.ui-contrast.help = அதிகம் என்பது சாம்பல் நிறக் குறிப்புகளையும் விளக்கங்களையும் கருப்பில் வரையும்.
core.setting.ui-focus = தேர்ந்தெடுத்த வரிசை
core.setting.ui-focus.help = தேர்ந்தெடுத்த வரிசை எப்படிக் காட்டப்படும்.
core.setting.ui-shadow = நிழல்
core.setting.ui-shadow.help = ஷீட்கள், உரையாடல்கள், சிப்கள் அழுத்தமான நிழலைக் காட்டுமா என்பது.
core.setting.ui-frame = சட்டகங்கள்
core.setting.ui-frame.help = ஷீட்கள், உரையாடல்கள், சிப்களின் சட்டகம்: ஒவ்வொன்றும் உள்ளபடியே, அல்லது எல்லாவற்றுக்கும் ஒன்று.
core.setting.ui-density = இடைவெளி
core.setting.ui-density.help = திரைகளின் பகுதிகளுக்கு இடையிலும் சுற்றிலும் எவ்வளவு இடம் இருக்கும்.
core.setting.ui-button = பட்டன்கள்
core.setting.ui-button.help = தேர்ந்தெடுக்கப்படாத பட்டன்கள் எப்படித் தோன்றும்: வெளிக்கோடு, நிரப்பப்பட்டது அல்லது தட்டையானது.
core.setting.ui-separators = வரிசைகளுக்கு இடையே கோடுகள்
core.setting.ui-separators.help = வெளிர் கோடுகள், உரை தொடங்கும் இடத்திலிருந்து மங்கிய கோடுகள், அல்லது ஏதுமில்லை.
core.setting.ui-groups = பட்டியல் பிரிவுகள்
core.setting.ui-groups.help = பட்டியல்களின் பிரிவுகள் உள்ளபடியே, அல்லது வட்டமான கார்டுகளில்.
core.setting.ui-title = தலைப்பு அளவு
core.setting.ui-title.help = மெனுக்கள், பட்டியல்களின் மேலே உள்ள தலைப்புகளின் அளவு, உரை அளவின் சதவீதமாக.
core.setting.ui-margin.help = மெனுக்கள், பட்டியல்களின் இடது, வலது பக்க இடைவெளி.
core.setting.ui-row.help = மெனுக்கள், பட்டியல்களின் வரிசைகளின் உயரம், அவற்றின் உரையைப் பொறுத்து.
core.setting.ui-lines.help = கோடுகளும் சட்டகங்களும் எவ்வளவு தடிமனாக வரையப்படும்.
core.setting.network-manager.help = மேம்பட்டது. நெட்வொர்க் தேவைப்படும்போது Wi-Fi உடன் இணைக்கும் செருகுநிரல்; காலி: ஏதுமில்லை.
core.setting.logo.help = PaperPaw லோகோவுக்குப் பதிலாகக் காட்டப்படும் JPEG அல்லது PNG கோப்பின் பாதை; காலி: வழக்கமான லோகோ.
core.setting.ui-palette.help = பயன்பாட்டின்படி வண்ணங்கள், எ.கா. muted=60 line=170 link=#2a6f97 (0 கருப்பு, 255 வெள்ளை).
core.setting.text-curve.help = புத்தக எழுத்துகளின் விளிம்பு நிறச்சாயல்: smooth, sharp:128, அல்லது 0-255 இடையே 16 எண்கள்.
core.setting.ui-text-curve.help = மேம்பட்டது. மெனுக்கள், பட்டியல்களுக்கும் இதுவே.
core.setting.long-press-ms.help = நீண்ட அழுத்தத்துக்கு பட்டனை அல்லது விரலை எவ்வளவு நேரம் பிடிக்க வேண்டும்.
core.setting.double-tap-ms.help = இரண்டாவது தட்டல் அல்லது அழுத்தம் முதலாவதற்குப் பின் எவ்வளவு விரைவில் வர வேண்டும்.
core.setting.tap-slop.help = தட்டலாகவே கருதப்பட விரல் எவ்வளவு தூரம் நகரலாம்.
core.setting.tap-layout.help = வாசிக்கும்போது எங்கே தட்டினால் பக்கம் புரளும் அல்லது மெனு திறக்கும்.
core.setting.tap-swap.help = இடது முன்னே செல்லும், வலது பின்னே செல்லும்; மற்றொரு கைக்காக.
core.setting.swipe-distance.help = ஸ்வைப் செய்ய விரல் எவ்வளவு தூரம் நகர வேண்டும்.
core.setting.frontlight.help = முன் விளக்கு எவ்வளவு பிரகாசமாக இருக்கும்; 0 அதை அணைக்கும்.
core.setting.frontlight-warmth.help = முன் விளக்கு எவ்வளவு வெதுவெதுப்பாக இருக்கும்: 0 குளிர், 100 வெதுவெதுப்பு.
core.setting.clock-format = கடிகாரம்
core.setting.week-start = வாரத் தொடக்கம்
core.setting.clock-format.help = நேரம் எப்படிக் காட்டப்படும்: 14:30 அல்லது பிற்பகல் 2:30.
core.setting.week-start.help = நாட்காட்டிகளிலும் வாசிப்புப் புள்ளிவிவரங்களிலும் வாரம் எந்த நாளில் தொடங்கும்.
core.setting.time-zone = நேர மண்டலம்
core.setting.time-zone.help = தானியங்கு: சிஸ்டத்தின் மண்டலம், இருந்தால்.
core.setting.time-zone-rule = நேர மண்டல விதி
core.setting.time-zone-rule.help = பட்டியலில் இல்லாத மண்டலங்களுக்கான POSIX TZ விதி; நேர மண்டலத்தை மேலெழுதும்.
core.setting.battery-low = பேட்டரி குறைவு அளவு
core.setting.battery-low.help = நிலைப் பட்டியில் “பேட்டரி குறைவாக இருக்கும்போது” தோன்றத் தொடங்கும் சார்ஜ் அளவு.
core.setting.status-bar = எல்லாத் திரைகளிலும் நிலைப் பட்டை
core.setting.status-bar.help = சொந்த நிலைப் பட்டி இல்லாத ஒவ்வொரு திரையின் மேலேயும் நேரத்தையும் பேட்டரியையும் காட்டும்.
core.setting.status-bar.line = நிலைப் பட்டையின் வரி
core.setting.status-bar.line.help = நிலைப் பட்டை காட்டும் நிலைப் பட்டி. காலி: நிலைப் பட்டை இல்லை.
core.setting.status-bar.screens = திரை வாரியாக நிலைப் பட்டை
core.setting.status-bar.screens.help = ஒரு வரிக்கு ஒரு திரை, screen=shown அல்லது screen=hidden என. திரை கூறுவதை விட இதுவே முன்னுரிமை பெறும்.
core.setting.awake-holds = செருகுநிரல்கள் விழிப்பில் வைக்கலாம்
core.setting.awake-holds.help = கடிகாரம் அல்லது விளையாட்டு சாதனத்தை விழிப்பில் வைக்கலாம்; அட்டவணைப்படுத்தல் எப்போதும் வைக்கும்.
core.setting.reading-font = எழுத்துரு
core.setting.status-font = எழுத்துரு
core.setting.status-font.help = வாசிக்கும்போது நிலைப் பட்டிகளின் எழுத்துரு: மெனுக்களைப் போல, புத்தகத்தைப் போல, அல்லது தனி எழுத்துரு.
core.setting.reading-font.help = “புத்தகத்தின் எழுத்துரு” என்பது சாதனத்துடன் வருவது, அல்லது சாதனம் வரையக்கூடிய இடத்தில் புத்தகத்தின் சொந்த எழுத்துரு.
core.setting.font-size = எழுத்துரு அளவு
core.setting.font-size.help = புத்தக உரையின் அளவு.
core.setting.font-size.largest = புத்தக உரையின் அளவு. பெரிய அளவுகளுக்கு: எழுத்துருக்களைக் கண்டறி.
core.setting.line-spacing = வரி இடைவெளி
core.setting.margin = ஓரங்கள்
core.setting.justify = இருபுறச் சீரமைப்பு
core.setting.hyphenate = சொற்பிரிப்பு
core.setting.hyphen-min-left = இணைப்புக்குறிக்கு முன் எழுத்துகள்
core.setting.hyphen-min-right = இணைப்புக்குறிக்குப் பின் எழுத்துகள்
core.setting.indent = பத்தி உள்தள்ளல்
core.setting.paragraph-spacing = பத்தி இடைவெளி
core.setting.margin-ends = மேல், கீழ் ஓரங்கள்
core.setting.footnotes = அடிக்குறிப்புகள்
core.setting.reading-app = வாசிப்பு ஆப்
core.setting.reading-app.help = புத்தகங்கள் திறக்கும் ஆப்; வடிவங்கள், புத்தகங்கள், கோப்புறைகளுக்குத் தனி ஆப் இருக்கலாம்.
core.setting.reading-app.format.help = இந்த வடிவப் புத்தகங்கள் திறக்கும் ஆப். இயல்புநிலை: மேலே உள்ள வாசிப்பு ஆப்.
core.setting.widows = மேலே சேர்த்து வைக்கும் வரிகள்
core.setting.widows.help = பக்கத்தின் மேலே கொண்டு செல்லப்படும் பத்தி வரிகளின் குறைந்தபட்ச எண்ணிக்கை.
core.setting.orphans = கீழே சேர்த்து வைக்கும் வரிகள்
core.setting.orphans.help = பக்கத்தின் கீழே விடப்படும் பத்தி வரிகளின் குறைந்தபட்ச எண்ணிக்கை.
core.setting.page-frame = பக்கச் சட்டகம்
core.setting.page-frame.help = பக்கத்தில் உரை எப்படி அமையும்; செருகுநிரல்கள் வேறு சட்டகங்களைச் சேர்க்கலாம்.
core.setting.line-spacing.help = வரிகளுக்கு இடையிலான இடைவெளி, எழுத்துரு அளவைப் பொறுத்து.
core.setting.margin.help = உரைக்கும் திரையின் விளிம்புகளுக்கும் இடையிலான இடைவெளி.
core.setting.justify.help = பத்திகளை இருபுறமும் சீரமைக்கும்.
core.setting.hyphenate.help = வரிகளின் இறுதியில் நீண்ட சொற்களைப் புத்தகத்தின் மொழிப்படி பிரிக்கும்.
core.setting.hyphen-min-left.help = இணைப்புக்குறிக்கு முன் விடப்படும் குறைந்தபட்ச எழுத்துகள். 0: மொழியின் வழக்கப்படி.
core.setting.hyphen-min-right.help = இணைப்புக்குறிக்குப் பின் கொண்டு செல்லப்படும் குறைந்தபட்ச எழுத்துகள். 0: மொழியின் வழக்கப்படி.
core.setting.indent.help = ஒவ்வொரு பத்தியின் முதல் வரியையும் உள்தள்ளும்.
core.setting.paragraph-spacing.help = பத்திகளுக்கு இடையே சிறிது இடைவெளி விடும், முதல் வரி உள்தள்ளலுடனோ இல்லாமலோ.
core.setting.margin-ends.help = உரைக்கு மேலும் கீழும் உள்ள இடைவெளி. மாற்றப்படும் வரை பக்கவாட்டு ஓரங்களைப் போலவே இருக்கும்.
core.setting.footnotes.help = தட்டப்பட்ட குறிப்புக் குறி (1, [2], *) அதன் குறிப்பைப் பக்கத்தின் மேல் காட்டும், அல்லது அதற்குச் செல்லும்.
core.setting.publisher-styles = வெளியீட்டாளர் வடிவமைப்பு
core.setting.publisher-styles.help = புத்தகத்தின் சொந்தத் தளவமைப்பைப் பயன்படுத்தும்; ஆஃப் எனில் உரை எளிமையாகக் காட்டப்படும்.
core.setting.font-weight = எழுத்துரு தடிமன்
core.setting.font-weight.help = எந்த எழுத்துருவிலும் அடர்த்தியான, தடிமனான உரை; வெளிர் திரைகளில் உதவும்.
core.setting.smooth-text = மென்மையான உரை
core.setting.smooth-text.help = மென்மையான சாம்பல் விளிம்புகள். கருப்பு-வெள்ளைத் திரைகளில் ஒவ்வொரு பக்கமும் மின்னும், மெதுவாக இருக்கும்.
core.setting.text-contrast = உரை மாறுபாடு
core.setting.text-contrast.help = எழுத்துகள் எவ்வளவு அடர்த்தியாக வரையப்படும். தீம் அமைக்கும் நிறச்சாயல் வளைவு இதற்குப் பதிலாகச் செயல்படும்.
core.setting.text-sharpness = கூர்மை
core.setting.text-sharpness.help = எழுத்துகள் எவ்வளவு கூர்மையாகத் தோன்றும். கூர்மை உறுதியானது, தெளிவானது; மென்மை இலகுவானது.
core.setting.picture-contrast = படத்தின் மாறுபாடு
core.setting.picture-contrast.help = படங்களிலும் காமிக்ஸிலும் வெளிருக்கும் அடருக்கும் இடையிலான வேறுபாடு எவ்வளவு வலுவானது.
core.setting.picture-gamma = படத்தின் பிரகாசம்
core.setting.picture-gamma.help = படங்களின் நடுத்தரச் சாம்பல் நிறங்கள் எவ்வளவு வெளிராக இருக்கும். வெளிறித் தெரியும் படங்களுக்கு மேலும் அடர் பொருந்தும்.
core.setting.picture-dither = படச் சாம்பல் நிறங்கள்
core.setting.picture-dither.help = சாம்பல் நிறங்கள் எப்படி வரையப்படும்: Atkinson தெளிவானது, Floyd-Steinberg மென்மையானது.
core.setting.word-spacing = சொல் இடைவெளி
core.setting.word-spacing.help = சொற்களுக்கு இடையிலான அடிப்படை இடைவெளி; 100% என்பது எழுத்துருவின் சொந்த இடைவெளி. இருபுறச் சீரமைப்பு வரிகளில் இது அகலமாகலாம்.
core.setting.book-align = புத்தகத்தின் சீரமைப்பு
core.setting.book-align.help = மையப்படுத்திய, வலப்புறம் சீரமைத்த உரை புத்தகம் அமைத்தபடியே.
core.setting.book-indent = புத்தகத்தின் உள்தள்ளல்கள்
core.setting.book-indent.help = முதல் வரி உள்தள்ளல்களும் தொங்கும் உள்தள்ளல்களும் புத்தகம் அமைத்தபடியே.
core.setting.book-sizes = புத்தகத்தின் உரை அளவுகள்
core.setting.book-sizes.help = பெரிய, சிறிய உரை புத்தகம் அமைத்தபடியே.
core.setting.book-spacing = புத்தகத்தின் இடைவெளிகள்
core.setting.book-spacing.help = பத்திகளைச் சுற்றியுள்ள இடைவெளி புத்தகம் அமைத்தபடியே.
core.setting.book-fonts = புத்தகத்தின் எழுத்துருக்கள்
core.setting.book-fonts.help = புத்தகத்துடன் வரும் எழுத்துருக்கள், சாதனம் அவற்றைக் காட்டக்கூடிய இடத்தில்.
core.setting.book-margins = புத்தகத்தின் ஓரங்கள்
core.setting.book-margins.help = மேற்கோள்கள், கவிதைகள், பட்டியல்கள் புத்தகம் அமைத்தபடியே உள்தள்ளப்படும்.
core.setting.book-line-height = புத்தகத்தின் வரி இடைவெளி
core.setting.book-line-height.help = உங்களுடையதற்குப் பதிலாகப் புத்தகத்தின் வரி இடைவெளி.
core.setting.line-breaking = வரி முறிப்பு
core.setting.line-breaking.help = சமநிலை வரிகளை மேலும் சீராக முடிக்கும்; வேகம் அவற்றை ஒவ்வொன்றாக முறிக்கும்.
core.setting.korean-breaks = கொரிய வரி முறிப்பு
core.setting.korean-breaks.help = அசை வாரியாக என்பது அச்சில் உள்ளதுபோல் எங்கும் முறிக்கும்; சொல் வாரியாக என்பது சொற்களை முழுமையாக வைக்கும். கொரிய மொழிக்கு மட்டும்.
core.setting.hanging-punctuation = தொங்கும் நிறுத்தக்குறிகள்
core.setting.hanging-punctuation.help = மேற்கோள் குறிகள், முற்றுப்புள்ளிகள், காற்புள்ளிகள், இணைப்புக்குறிகள் உரைக்குச் சற்று வெளியே அமையும், எனவே அதன் விளிம்புகள் நேராகத் தோன்றும்.
core.setting.letter-spacing = எழுத்து இடைவெளி
core.setting.letter-spacing.help = எழுத்துகளுக்கு இடையிலான இடைவெளி; 0% எனில் எழுத்துருவில் உள்ளபடியே.
core.setting.kerning = கெர்னிங்
core.setting.kerning.help = AV போன்ற எழுத்து ஜோடிகள் எழுத்துரு கூறுவதுபோல் நெருக்கமாக அமையும்.
core.setting.ligatures = கூட்டெழுத்துகள்
core.setting.ligatures.help = எழுத்துருவில் இருந்தால், fi, fl, ff ஒரே எழுத்தாக இணைக்கப்படும்.
core.setting.indent-size = உள்தள்ளல் அளவு
core.setting.indent-size.help = முதல் வரிகள் எவ்வளவு உள்தள்ளப்படும், எழுத்துரு அளவைப் பொறுத்து.
core.setting.paragraph-space = பத்தி இடைவெளி
core.setting.paragraph-space.help = பத்திகளுக்கு இடையே எவ்வளவு இடைவெளி, ஒரு வரியைப் பொறுத்து.
core.setting.scope-only = இந்தப் புத்தகம் மட்டும்
core.setting.scope-only.help = எழுத்துரு, தளவமைப்பு மாற்றங்கள் இந்தப் புத்தகத்துக்கு மட்டும் பொருந்தும் (• குறியிட்டவை).
core.setting.edge-ends = ஸ்வைப் விளிம்புகள்: மேலும் கீழும்
core.setting.edge-sides = ஸ்வைப் விளிம்புகள்: இடமும் வலமும்
core.setting.edge.help = விளிம்பிலிருந்து எவ்வளவு தூரத்துக்குள் தொடங்கும் ஸ்வைப் விளிம்பு ஸ்வைப்பாகக் கருதப்படும்; 0: ஆஃப்.
core.setting.developer = டெவலப்பர் விருப்பங்கள்
core.setting.library-folder = நூலகக் கோப்புறை
core.setting.library-folder.help = உங்கள் புத்தகங்கள் உள்ள கோப்புறை.
core.setting.developer.help = டெவலப்பர்களுக்கு: பேட்டரி பயன்பாட்டை அளவிட, சோதித்துப் பார்க்க, பிழைகளைக் கண்டறிய.
core.setting.usb-link = USB டெவலப்பர் கருவிகள்
core.setting.usb-link.help = USB கேபிளில் இணைந்த கணினி பட்டன்களை அழுத்தவும் கோப்புகளை நகலெடுக்கவும் அனுமதிக்கும். முதலில் கேட்கும்; மீண்டும் தொடங்கிய பின் ஆஃப்.
about.plugin.name = பற்றி
about.plugin.description = PaperPaw-இன் பதிப்பும் உரிமங்களும்.
about.plugin.how = "பற்றி என்பது உங்களிடம் உள்ள PaperPaw பதிப்பு, அதன் மூலக் குறியீடு எங்கே உள்ளது, அது எந்த உரிமங்களின் கீழ் வருகிறது என்பதைக் காட்டும்.\n\nஅமைப்புகளின் இறுதியில் PaperPaw பற்றி என்பதில் இதைக் காணலாம். அம்பு பட்டன்களாலும் தேர்ந்தெடு பட்டனாலும் ஒரு வரிசையைத் தேர்ந்தெடுக்கவும், அல்லது அதைத் தட்டவும். ஃபர்ம்வேரில் உள்ளமைந்த செருகுநிரல்களும், குறியீடு கொண்ட செருகுநிரல்களை ஏற்றும் சாதனங்களில் அத்தகைய செருகுநிரல்கள் எதற்காக உருவாக்கப்பட வேண்டுமோ அந்தக் கைரேகையும் (fingerprint) பட்டியலிடப்படும்.\n\nஉரிமங்கள் வாசிப்புத் திரையில் உரையாகத் திறக்கும், எனவே புத்தகம் போலப் பக்கம் புரட்டலாம். அதில் PaperPaw-இன் சொந்த உரிமமும், உடன் வரும் எழுத்துருக்கள், ஐகான்கள், சொற்பிரிப்பு வடிவங்களின் உரிமங்களும் உள்ளன. செருகுநிரல்கள் தங்களுக்கென ஒரு வரியைச் சேர்க்கலாம், எ.கா. ஒரு தீமின் ஆசிரியர்."
about.version.beta = {version} பீட்டா {number}
about.title = PaperPaw பற்றி
about.intro = e-ink சாதனங்களுக்கான, செருகுநிரல்களால் ஆன இலவச மின்புத்தக வாசிப்பான். Apache License 2.0 உரிமத்தின் கீழ் வழங்கப்படுகிறது; இதனுடன் வருபவை பின்வரும் உரிமங்களின் கீழ் உள்ளன.
about.plugins.title = உள்ளமைந்த செருகுநிரல்கள்
about.plugins.help = இந்த ஃபர்ம்வேரில் உள்ள குறியீடு கொண்ட செருகுநிரல்கள், அவற்றின் பதிப்புகளுடன். புதுப்பிப்பு இவற்றையே மீண்டும் கொண்டுவரும்; அவ்வாறு செய்ய முடியாத புதுப்பிப்பு முன்பே தெரிவிக்கும்.
about.summary = e-ink சாதனங்களுக்கான, செருகுநிரல்களால் ஆன இலவச மின்புத்தக வாசிப்பான்.
about.source = மூலக் குறியீடு
about.licences = உரிமங்கள்
about.licences.help = PaperPaw, அதன் எழுத்துருக்கள், ஐகான்கள், வடிவங்களின் உரிமங்கள்.
about.credits = நன்றி
about.native.title = குறியீடு கொண்ட செருகுநிரல்கள்
about.native.value = இடைமுகம் {major}, வரைவு {draft}
about.native.note = இந்த இடைமுகத்துக்கும் வரைவுக்கும் உருவாக்கப்பட்ட குறியீடு கொண்ட செருகுநிரல்கள் இங்கே இயங்கும்.
aids.plugin.name = வாசிப்பு உதவிகள்
aids.plugin.description = தடித்த சொல் தொடக்கங்கள், மாற்றிய சொற்கள், படங்கள்: நீங்கள் விரும்பும்படி உரை.
aids.plugin.how = "வாசிப்பு உதவிகள் நீங்கள் படிக்கும்போது புத்தக உரை எப்படித் தோன்றும் என்பதை மாற்றும். அவை எல்லாப் புத்தகங்களுக்கும் பொருந்தும். தடித்த சொல் தொடக்கங்கள், சொற்களை மாற்று ஆகியவை தொடக்கத்தில் ஆஃப் நிலையில் இருக்கும்.\n\nஅமைப்புகள் › வாசிப்பு › வாசிப்பு உதவிகள் பிரிவில் இவற்றைக் காணலாம். தடித்த சொல் தொடக்கங்கள் ஒவ்வொரு சொல்லின் முதல் பாதியையும் தடித்த எழுத்தில் காட்டும்; சிலருக்கு இது படிப்பதை எளிதாக்கும். சொற்களை மாற்று என்பதில் \"ஆஸ்பத்திரி = மருத்துவமனை; டாக்டர் = மருத்துவர்\" போன்ற ஜோடிகளை அரைப்புள்ளியால் பிரித்து எழுதவும்.\n\nநீங்கள் எழுதியபடியே முழுச் சொற்கள் மட்டுமே மாற்றப்படும், எனவே நீண்ட சொல்லின் ஒரு பகுதி ஒருபோதும் மாறாது. புத்தகக் கோப்பு மாற்றப்படாது.\n\nபுத்தகங்களில் உள்ள படங்களைக் காட்டலாம் (தொடக்க நிலை), படத்தின் விளக்கத்தைப் பயன்படுத்தும் \"[படம்: கடலில் ஒரு கப்பல்]\" போன்ற சிறு வரியாக மாற்றலாம், அல்லது விட்டுவிடலாம். அப்போது பக்கத்தில் உரைக்கு அதிக இடம் கிடைக்கும்; காட்டப்படாத படம் டிகோட் செய்யப்படாததால் பக்கங்கள் வேகமாகப் புரளும். காமிக்ஸ், படங்களால் ஆன பிற புத்தகங்கள் மாற்றப்படாது."
aids.setting.bold-beginnings = தடித்த சொல் தொடக்கங்கள்
aids.setting.bold-beginnings.help = ஒவ்வொரு சொல்லின் முதல் பாதியும் தடித்த எழுத்தில்; சிலருக்கு இது படிப்பதை எளிதாக்கும்.
