core.action.clean-up = சேமிப்பகத்தைச் சுத்தம் செய்
core.clean-up.question.one = காணப்படாத ஒரு புத்தகத்தின் குறிப்புகளை அகற்றவா?
core.clean-up.question.other = காணப்படாத {count} புத்தகங்களின் குறிப்புகளை அகற்றவா?
core.clean-up.text = அவற்றின் வாசிப்பு இடம், புக்மார்க்குகள், ஹைலைட்டுகள், குறிப்புகள் நிரந்தரமாக நீக்கப்படும். கணினியில் பெயர் மாற்றப்பட்ட அல்லது நகர்த்தப்பட்ட புத்தகமும், செருகப்படாத மெமரி கார்டில் உள்ள புத்தகமும் கூட காணப்படாது.
core.clean-up.yes = அகற்று
core.clean-up.no = வைத்திரு
core.clean-up-failed = எதுவும் சுத்தம் செய்யப்படவில்லை: மெமரி கார்டில் உள்ள ஒரு கோப்புறையைப் படிக்க முடியவில்லை.
core.cleaned-up = சுத்தம் செய்யப்பட்டது: இனி இல்லாத புத்தகங்களின் {count} எச்சங்கள்
core.offline.title = ஆஃப்லைன் பயன்முறை
core.offline.text = இதற்கு நெட்வொர்க் தேவை. ஆன்லைனுக்குச் செல்லவா?
core.offline.go-online = ஆன்லைனுக்குச் செல்
core.offline.not-now = இப்போது வேண்டாம்
core.screenshot-saved = {path} ஆகச் சேமிக்கப்பட்டது.
core.screenshot-failed = ஸ்கிரீன்ஷாட்டைச் சேமிக்க முடியவில்லை.
core.screenshot-full = ஸ்கிரீன்ஷாட்டைச் சேமிக்க முடியவில்லை: கார்டு நிரம்பிவிட்டது.
core.screenshot-unwritten = ஸ்கிரீன்ஷாட்டைச் சேமிக்க முடியவில்லை: கார்டில் எழுத முடியவில்லை.
core.config-unreadable = {file}-ஐப் படிக்க முடியவில்லை, எனவே அமைப்புகளில் செய்யும் மாற்றங்கள் சேமிக்கப்படாது. கணினியில் கோப்பைச் சரிசெய்யவும் அல்லது அகற்றவும்.
core.secrets-unreadable = {file}-ஐப் படிக்க முடியவில்லை, எனவே கடவுச்சொற்களும் விசைகளும் சேமிக்கப்படாது. கணினியில் கோப்பைச் சரிசெய்யவும் அல்லது அகற்றவும்.
core.secrets-unopened = இந்தக் கார்டில் சேமிக்கப்பட்ட சில கடவுச்சொற்களையும் விசைகளையும் இங்கே திறக்க முடியாது: அவை வேறொரு சாதனத்தில் சேமிக்கப்பட்டவை, அல்லது இந்தச் சாதனத்தின் விசை தொலைந்துவிட்டது. செருகுநிரல் கேட்கும் இடத்தில் அவற்றை மீண்டும் உள்ளிடவும்.
core.secrets-unsupported = இந்தச் சாதனத்தால் இன்னும் கடவுச்சொற்களைச் சேமிக்க முடியாது. paperpaw.org-இல் உள்ள வெப் ஃபிளாஷர் மூலம் PaperPaw-ஐ ஒருமுறை மீண்டும் நிறுவவும், பிறகு இது செயல்படும்.
core.card.missing = மெமரி கார்டு இல்லை, எனவே எதுவும் சேமிக்கப்படாது. FAT32 கார்டைச் செருகி, மீண்டும் தொடங்கவும்.
core.card.unreadable = மெமரி கார்டைப் படிக்க முடியவில்லை, எனவே எதுவும் சேமிக்கப்படாது. வேறொரு கார்டை முயலவும்.
core.card.exfat-experimental = இந்த மெமரி கார்டு exFAT ஆகும். exFAT ஆதரவு சோதனை நிலையில் உள்ளது; FAT32 மிகவும் பாதுகாப்பானது.
core.card.no-fat = மெமரி கார்டு FAT32 வடிவத்தில் இல்லை, எனவே எதுவும் சேமிக்கப்படாது. கணினியில் அதை FAT32 ஆக ஃபார்மேட் செய்யவும்.
