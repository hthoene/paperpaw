kosync.setting.server.help = KOReader-இன் ஒத்திசைவுச் சர்வர், அல்லது உங்கள் சொந்தச் சர்வர். இதை மாற்றினால் வெளியேற்றப்படுவீர்கள்.
kosync.server = சர்வர்
kosync.server-set = சர்வர்: {server}. இப்போது உள்நுழையவும் அல்லது கணக்கை உருவாக்கவும்.
kosync.server-changed = சர்வர் {server} ஆக மாற்றப்பட்டது. அங்குள்ள உங்கள் கணக்கில் உள்நுழையவும்.
