dictionary.plugin.name = அகராதி
dictionary.plugin.description = StarDict அகராதிகளில் சொற்களைத் தேடும்.
dictionary.plugin.how = "அகராதி புத்தகத்தில் உள்ள ஒரு சொல்லை StarDict அகராதிகளில் தேடி, அதன் பொருள்களைத் திரையின் கீழ்ப் பகுதியில் ஒரு பேனலில் காட்டும்.\n\nவாசிப்பில் ஒரு சொல்லை அழுத்திப் பிடித்து, பொருள் தேடு என்பதைத் தேர்ந்தெடுக்கவும்; பட்டன்களில் மேலும் என்பதில் உரையைத் தேர்ந்தெடு என்பதைப் பயன்படுத்தவும். அகராதிக் கோப்புறைகளை (.ifo, .idx, .dict கோப்புகளுடன்) சாதனத்தில் உள்ள \"dictionaries\" கோப்புறைக்கு நகலெடுக்கவும் (துணைக் கோப்புறைகளும் சரி), அல்லது அமைப்புகள் › வாசிப்பு என்பதில் அகராதிக் கோப்புறை (மேம்பட்ட அமைப்பு) என வேறொரு கோப்புறையைத் தேர்ந்தெடுக்கவும். முதல் தேடலின்போது ஒவ்வொரு அகராதிக்கும் ஒரு சிறிய அட்டவணை தயாரிக்கப்படும்; இதற்குச் சிறிது நேரம் ஆகும்.\n\nபேனலில் பக்க பட்டன்கள் அல்லது மேலே, கீழே நீண்ட பொருள்களை உருட்டும், பின்செல் அதை மூடும். தொடுதலில், மூட அதற்கு வெளியே தட்டவும்."
