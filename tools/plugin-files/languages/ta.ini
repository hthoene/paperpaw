widgets.plugin.name = விட்ஜெட் தொகுப்பு
widgets.plugin.description = முகப்புத் திரைக்கு இன்னும் பல விட்ஜெட்டுகள்: கடிகாரங்கள், நாட்காட்டி, மேற்கோள்கள், புத்தகங்கள், குறிப்புகள் மற்றும் பல.
widgets.plugin.how = "விட்ஜெட் தொகுப்பு முகப்புத் திரைக்குப் பல விட்ஜெட்டுகளைச் சேர்க்கும்: கடிகாரங்கள் (அனலாக், சொற்கள், டைல்கள், உலகம்), நாட்காட்டி, இதுவரையான ஆண்டு, கவுண்ட்டவுன், நிலவின் கட்டம், கிழமையும் தேதியும்; இன்றைய மேற்கோள், குறிப்புகள், செய்ய வேண்டியவை, படங்கள், வாழ்த்து, PaperPaw லோகோ; புத்தகங்களுக்கு: இப்போது படிப்பது, முன்னேற்றம், அடுத்து படிப்பது, தொடர், பிடித்தவை, ஒரு ஹைலைட், எண்களில் நூலகம். பேட்டரி விட்ஜெட்டும் இதில் உள்ளது.\n\nமெனுவில் முகப்புத் திரையைத் திருத்து (அல்லது முகப்புத் திரையில் நீண்ட அழுத்தம்), பிறகு விட்ஜெட்டைச் சேர் மூலம் அவற்றைச் சேர்க்கவும். ஒவ்வொன்றுக்கும் சட்டகம், அளவு, சீரமைப்பு போன்ற சொந்த அமைப்புகள் உள்ளன. இன்றைய மேற்கோள் போல மாறும் விட்ஜெட்டைத் தேர்ந்தெடுத்தால் அடுத்ததைக் காட்டும். உங்கள் சொந்த மேற்கோள்களைக் கார்டில் உள்ள .paperpaw/plugins/widgets-இல் quotes.txt-இல் வைக்கவும், ஒவ்வொரு வரியும் உரை | ஆசிரியர் என. நேர விட்ஜெட்டுகளுக்குக் கடிகாரம் அமைக்கப்பட்டிருக்க வேண்டும்; Wi-Fi அதை அமைக்கும்."
