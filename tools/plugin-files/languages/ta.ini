pomodoro.plugin.name = பொமோடோரோ
pomodoro.plugin.description = வேலை, இடைவேளைச் சுற்றுகள், விட்ஜெட்டுகள், தினசரி எண்ணிக்கையுடன் கவன டைமர்.
pomodoro.plugin.how = "பொமோடோரோ டைமர்: கவனத்துடன் சுற்றுகளாக வேலை செய்து, பிறகு ஓய்வெடுக்கவும். அமைப்பு எதுவும் தேவையில்லை: 25 நிமிடக் கவனம், 5 நிமிட ஓய்வு, நான்கு சுற்றுகளுக்குப் பிறகு 15 நிமிட நீண்ட இடைவேளை.\n\nகருவிகள் மெனுவில் பொமோடோரோவைத் திறந்து தொடங்கு என்பதை அழுத்தவும், அல்லது அதன் விட்ஜெட்டுகளை முகப்புத் திரையில் சேர்க்கவும் (முகப்புத் திரையை அழுத்திப் பிடித்து, விட்ஜெட்டைச் சேர்க்கவும்): பொமோடோரோ டைமர் கட்டத்தையும் மீதமுள்ள நிமிடங்களையும் காட்டும், பொமோடோரோ தொடங்கு/இடைநிறுத்து ஒரு பட்டன், இன்றைய பொமோடோரோ நீங்கள் முடித்த சுற்றுகளை உங்கள் தினசரி இலக்குடன் எண்ணும். டைமரைத் தட்டினால் அது தொடங்கும் அல்லது இடைநிற்கும்; முழுத் திரையைத் திறக்க அழுத்திப் பிடிக்கவும்.\n\nதிரையை விட்டு வெளியேறினாலும் டைமர் ஓடும், மீண்டும் தொடங்கிய பிறகும் கடிகாரப்படி தொடரும். சாதனம் உறங்கும்போது எதுவும் ஓடாது: இடையில் முடிந்த கட்டம் அது விழிக்கும்போது தெரிவிக்கப்படும். ஒரு கட்டம் முடிந்ததும் அறிவிப்பு தெரிவிக்கும். பேட்டரியைச் சேமிக்க, கடிகாரம் நிமிடத்துக்கு ஒருமுறை புதுப்பிக்கும் (முழுத் திரையில் கடைசி நிமிடத்தில் பத்து விநாடிக்கு ஒருமுறை), சாதனத்தை ஒருபோதும் விழிப்பில் வைக்காது.\n\nஅமைப்புகளில் பொமோடோரோ என்பதில் கால அளவுகளையும் ஒரு தொகுப்பின் சுற்றுகளையும், அடுத்த கட்டம் தானாகத் தொடங்குமா என்பதையும் அமைக்கலாம். மேலும் என்பதில்: கட்டம் முடியும்போது திரை மின்னுதல் அல்லது முன்விளக்கு சிமிட்டுதல், தினசரி இலக்கு."
