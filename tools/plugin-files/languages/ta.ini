mail.plugin.name = மின்னஞ்சல்
mail.plugin.description = கடவுச்சொல் அல்லது ஆப் கடவுச்சொல் மூலம் மின்னஞ்சலைப் படித்து அனுப்புகிறது (IMAP, SMTP), உலாவி உள்நுழைவு இல்லாமல்.
mail.plugin.how = "மின்னஞ்சல், IMAP, SMTP வழியாக மின்னஞ்சல்களைப் படித்து அனுப்பும். உலாவி இல்லாமல், முகவரி, கடவுச்சொல் மூலம் உள்நுழையும்.\n\nஅமைப்புகள் › மின்னஞ்சல் என்பதில் கணக்கை அமைக்கவும்: வழங்குநர், முகவரி, கடவுச்சொல். பெரும்பாலான வழங்குநர்களுக்கு ஆப் கடவுச்சொல் தேவை (கணக்கின் பாதுகாப்பு அமைப்புகளில் உருவாக்கவும்). அது கடவுச்சொற்கள், விசைகளுடன் வைக்கப்படும், உங்கள் வழங்குநரின் சர்வருக்கு மட்டுமே செல்லும்.\n\nகருவிகளில் மின்னஞ்சலைத் திறக்கவும். மின்னஞ்சலைச் சரிபார் புதிய மின்னஞ்சல்களையும் கோப்புறைகளையும் பெறும்; அவை கார்டில் வைக்கப்படும், நெட்வொர்க் இல்லாமலும் படிக்கலாம். Wi-Fi சிறிது நேரம் மட்டுமே ஆனில் இருக்கும்.\n\nவழங்குநர் பட்டியலில் இல்லையெனில், சொந்தச் சர்வர்கள் என்பதைத் தேர்ந்தெடுத்து, மேம்பட்ட அமைப்புகளில் சர்வர்கள், போர்ட்கள், பாதுகாப்பை அமைக்கவும். அங்கீகரிக்கப்படாத சான்றிதழ் உள்ள சர்வரை நம்பவா என ஒருமுறை கேட்கப்படும்.\n\nபுத்தகம் இணைக்கப்பட்ட மின்னஞ்சலில் (EPUB, PDF போன்றவை, 2 MB வரை) புத்தகத்தைத் திற இருக்கும்: அது கோப்பை நூலகத்தில் சேர்த்துத் திறக்கும்.\n\nபின்னணியில் புதிய மின்னஞ்சலைச் சரிபார் (அமைப்புகள் › மின்னஞ்சல், இயல்பாக ஆஃப்) ஒவ்வொரு 15, 30 அல்லது 60 நிமிடங்களுக்கு, சாதனம் விழித்து ஆன்லைனில் இருக்கும்போது, படிக்காதவற்றின் எண்ணிக்கையை முகப்பில் புதுப்பிக்கும்; சிறிது பேட்டரியைப் பயன்படுத்தும்.\n\nமுகப்புத் திரை விட்ஜெட்டுகள்: படிக்காதவை, சமீபத்தியவை, நட்சத்திரமிட்டவை, ஒரு அஞ்சல்பெட்டி, மின்னஞ்சல் எழுதுவதற்கான குறுக்குவழி."
