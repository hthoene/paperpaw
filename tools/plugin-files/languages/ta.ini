vocabulary.sd.save.full = கார்டு நிரம்பிவிட்டது, எனவே எதுவும் எழுதப்படவில்லை. சிறிது இடத்தைக் காலிசெய்து மீண்டும் முயலவும்.
vocabulary.sd.save.too-large = இந்தத் தொகுப்பு ஒரு கோப்புக்கு மிகப் பெரியது (4 MiB, ஒரு புதுப்பிப்பு படிக்கும் அதிகபட்சம்). கார்டில் உள்ள கோப்பு மாற்றப்படவில்லை.
vocabulary.sd.save.failed = கோப்பை எழுத முடியவில்லை. கார்டில் உள்ள கோப்பு மாற்றப்படவில்லை. கார்டைச் சரிபார்த்து மீண்டும் முயலவும்.
