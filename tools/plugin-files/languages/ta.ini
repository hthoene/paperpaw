tasks.account.password.help = உங்கள் கடவுச்சொல், அல்லது இன்னும் சிறப்பாக, ரீடருக்காக உருவாக்கிய ஆப் கடவுச்சொல். இது ரீடரின் கடவுச்சொற்களுடன் வைக்கப்படும், ஒருபோதும் காட்டப்படாது.
tasks.account.sync.help = சர்வரிலிருந்து பட்டியல்களைப் படித்து, நீங்கள் மாற்றியவற்றை அனுப்பும்.
