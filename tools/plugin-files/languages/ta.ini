file-manager.error.unsupported = இங்கே அது சாத்தியமில்லை.
file-manager.error.full = சேமிப்பகம் நிரம்பிவிட்டது.
file-manager.error.own-data = PaperPaw-இன் சொந்தக் கோப்புறையையும் அதிலுள்ளவற்றையும் இங்கே நீக்கவோ, பெயர் மாற்றவோ, நகர்த்தவோ முடியாது: அவற்றில் எல்லா அமைப்புகளும் குறிப்புகளும் புள்ளிவிவரங்களும் உள்ளன.
