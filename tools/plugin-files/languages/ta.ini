reader.sample.1 = ஆற்றங்கரையில் அக்காவின் அருகில் எதுவும் செய்யாமல் உட்கார்ந்திருந்ததில் ஆலிஸுக்கு மிகவும் அலுப்புத் தட்டத் தொடங்கியது: அக்கா படித்துக்கொண்டிருந்த புத்தகத்தை அவள் ஓரிரு முறை எட்டிப் பார்த்தாள், ஆனால் அதில் படங்களோ உரையாடல்களோ இல்லை.
