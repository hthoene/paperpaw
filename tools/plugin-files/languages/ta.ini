fonts-browser.plugin.name = மேலும் எழுத்துருக்கள்
fonts-browser.plugin.description = இணையத்திலிருந்து எழுத்துருக்களை மாதிரியுடன் காட்டி, வாசிப்புக்காகப் பதிவிறக்கும்.
fonts-browser.plugin.how = "இணைய எழுத்துரு நூலகத்தின் எழுத்துருக்களை அவற்றின் சொந்த எழுத்தில் பட்டியலிட்டுப் பதிவிறக்கும்.\n\nஅமைப்புகள் › வாசிப்பு › எழுத்துரு பட்டியலின் இறுதியில் இது உள்ளது (நிலைப் பட்டிகளின் எழுத்துருவிலும்). மாதிரியுடன் பெரிதாகப் பார்க்க எழுத்துருவைத் தட்டவும் (பட்டன்களில்: தேர்ந்தெடு), பிறகு பதிவிறக்கு; இடையில் வெளியேறலாம். முடிந்ததும் (பெயர்) மூலம் படி அல்லது நிலைப் பட்டிகளுக்குப் பயன்படுத்து என்பதைத் தேர்ந்தெடுக்கவும். புதுப்பி, அகற்று ஆகியவையும் உண்டு.\n\nWi-Fi தேவை.\n\nஉங்கள் சொந்த எழுத்துருக்கள்\n\nஒரு .ttf அல்லது .otf கோப்பு (எ.கா. Google Fonts).\n\nAndroid போன்ற சாதனங்களில்: கோப்பை fonts கோப்புறைக்கு (Android-இல்: PaperPaw/fonts) நகலெடுத்து, PaperPaw-ஐ மீண்டும் தொடங்கி, அமைப்புகள் › வாசிப்பு › எழுத்துரு என்பதில் தேர்ந்தெடுக்கவும்.\n\nXteink X4, X4 Pro: நினைவகம் போதாததால் இவை எழுத்துருத் தொகுப்புகளை மட்டுமே படிக்கும். கணினியில் paperpaw-fontgen மூலம் ஒவ்வொரு பாணிக்கும் (regular அவசியம்) உருவாக்கவும்:\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nஉருவாகும் plugins/font-my-font கோப்புறையை மெமரி கார்டின் plugins கோப்புறைக்கு நகலெடுத்து, மீண்டும் தொடங்கி, எழுத்துருவாக My Font-ஐத் தேர்ந்தெடுக்கவும். விடுபட்ட பாணிகள் regular-இல் வரையப்படும். --chars latin,cyrillic,greek எழுத்துமுறைகளைச் சேர்க்கும்; புத்தகத்தின் எழுத்துகள் எழுத்துருவில் இருக்க வேண்டும். மேலும் எழுத்துருக்கள் வழியே வருபவைக்குக் கணினி தேவையில்லை.\n\ne-ink திரையில் சிறிய உரை கூர்மையாக இருக்க --hinting light சேர்க்கவும்; normal, mono இன்னும் வலுவானவை. அரபு, தேவநாகரி போன்ற குறியீடுகள் உள்ள எழுத்துருக்களுக்கு இது வேண்டாம்."
