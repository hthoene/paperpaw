update.reason.unreadable = கோப்பைப் படிக்க முடியவில்லை.
update.reason.newer-format = இந்தப் புதுப்பிப்புக்குப் புதிய PaperPaw தேவை: முதலில் இதற்கு முந்தைய பதிப்பை நிறுவவும்.
update.reason.other-device = இந்தப் புதுப்பிப்பு வேறொரு சாதனத்திற்கானது.
update.reason.too-large = இந்தப் புதுப்பிப்பு இந்தச் சாதனத்தின் சேமிப்பக அமைப்பில் பொருந்தாது. paperpaw.org/flash-இல் உள்ள ஃபிளாஷர் மூலம் PaperPaw-ஐ ஒருமுறை நிறுவவும்; அதன் பிறகு சாதனத்திலேயே புதுப்பிப்புகள் செயல்படும்.
update.reason.untrusted = இந்தச் சாதனம் நம்பாத விசையால் இந்தப் புதுப்பிப்பு கையொப்பமிடப்பட்டுள்ளது.
update.reason.not-newer = இந்தப் புதுப்பிப்பு இப்போது நிறுவப்பட்டுள்ள PaperPaw-ஐ விடப் புதியதல்ல.
update.reason.damaged = கோப்பு மாற்றப்பட்டுள்ளது அல்லது சேதமடைந்துள்ளது. அதை மீண்டும் கார்டுக்கு நகலெடுக்கவும்.
update.reason.write = எழுத முடியவில்லை.
update.reason.other = புதுப்பிப்பைச் சரிபார்க்கவோ நிறுவவோ முடியவில்லை. சாதனத்தில் நினைவகம் குறைவாக இருந்தால், அதை மீண்டும் தொடங்கி மீண்டும் முயலவும்.
