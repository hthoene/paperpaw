reading-goal.plugin.name = வாசிப்பு இலக்கு
reading-goal.plugin.description = தினமும் படிக்க வேண்டிய நிமிடங்களும், இன்றைய வாசிப்புக்கு ஏற்ப மனநிலை மாறும் பூனையும் முகப்புத் திரையில்.
reading-goal.plugin.how = "முகப்புத் திரையில் உள்ள ஒரு பூனை இன்றைய வாசிப்பு எப்படிச் செல்கிறது என்பதைக் காட்டும்: இன்னும் படிக்காதவரை சோகமாக, சிறிது படித்த பிறகு பரவாயில்லையாக, தினசரி இலக்கில் பாதியிலிருந்து திருப்தியாக, இலக்கை அடைந்ததும் மகிழ்ச்சியாக.\n\nமுகப்புத் திரையில் வாசிப்புப் பூனை விட்ஜெட்டைச் சேர்க்கவும் (முகப்புத் திரையை அழுத்திப் பிடித்து, விட்ஜெட்டைச் சேர்க்கவும்), அல்லது உறக்கத் திரையாக இன்றைய வாசிப்புப் பூனையைத் தேர்ந்தெடுக்கவும். பூனையைத் தட்டினால் தினசரி இலக்கு திறக்கும்; அது நீங்கள் படிக்கும் நிமிடங்களை எண்ணும் வாசிப்புப் புள்ளிவிவரங்களின் இலக்கு.\n\nஅமைப்புகளில், வாசிப்பு என்பதன் கீழ்: இலக்கின் எந்தப் பங்கிலிருந்து பூனை திருப்தியாக அல்லது மகிழ்ச்சியாக இருக்கும் என்பதைத் திருப்தி இதிலிருந்து, மகிழ்ச்சி இதிலிருந்து ஆகியவை அமைக்கும்; சொந்தப் படங்கள் என்பது பூனைகளுக்குப் பதிலாகக் காட்டப்படும் படங்களின் (sad, meh, content, happy) கோப்புறை. படங்கள் PNG அல்லது JPEG கோப்புகள்; கோப்புறை இல்லையெனில் பூனைகள் காட்டப்படும்."
