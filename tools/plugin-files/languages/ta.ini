anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = உங்கள் கணினியில் உள்ள Anki-இன் நிலுவையிலுள்ள கார்டுகளைப் படித்து, உங்கள் பதில்களை AnkiConnect ஆட்-ஆன் மூலம் திருப்பி அனுப்பும்.
anki.plugin.how = "கணினியில் உள்ள Anki-இல் நிலுவையிலுள்ள கார்டுகளைச் சாதனத்தில் படித்து, பதில்களைத் திருப்பி அனுப்பலாம். இலவச AnkiConnect ஆட்-ஆன் (குறியீடு 2055492159) தேவை; AnkiWeb பயன்படாது. தொடக்கத்தில் ஆஃப்: செருகுநிரல் ஸ்டோரிலிருந்து சேர்க்கவும்.\n\nகணினியில்: Anki-இல் AnkiConnect-ஐ நிறுவி (Tools › Add-ons › Get Add-ons), Anki-ஐ மீண்டும் தொடங்கவும். ஒத்திசைக்கும்போது Anki திறந்திருக்க வேண்டும். Tools › Add-ons › AnkiConnect › Config-இல் \"webBindAddress\" என்பதை \"0.0.0.0\" என அமைக்கவும் (இல்லையெனில் 127.0.0.1 மட்டுமே அணுகும்). போர்ட் \"webBindPort\": 8765. \"apiKey\" அமைத்தால், அதையே இங்கே உள்ளிடவும். பிறகு Anki-ஐ மீண்டும் தொடங்கி, ஃபயர்வால் கேட்டால் அனுமதிக்கவும். நம்பகமான நெட்வொர்க்கில் மட்டும் பயன்படுத்தவும்; விசை அமைப்பது நல்லது.\n\nசாதனத்தில்: கருவிகளில் Anki-ஐத் திறந்து, கணினி என்பதில் முகவரியையும் (எ.கா. 192.168.1.20), தேவைப்பட்டால் போர்ட்டையும் API விசையையும் உள்ளிடவும். டெக்கைத் தேர்ந்தெடுக்கவும் (காலி: எல்லா டெக்குகளும்). Wi-Fi ஆன் நிலையில் Anki உடன் ஒத்திசை: காத்திருக்கும் பதில்கள் அனுப்பப்பட்டு, நிலுவையிலுள்ள கார்டுகளும் புதிய கார்டுகளும் அதிகபட்சம் 50 பெறப்படும். படி என்பதில் நெட்வொர்க் இல்லாமல் படிக்கலாம்: பதிலைக் காட்டி, மீண்டும், கடினம், நன்று அல்லது எளிது என மதிப்பிடவும். பதில்கள் சாதனத்தில் சேமிக்கப்பட்டு அடுத்த ஒத்திசைவில் Anki-க்குச் செல்லும்; கார்டு எப்போது திரும்ப வரும் என்பதை Anki தீர்மானிக்கும்.\n\nஅமைப்புகளில் Anki திறக்கும்போது ஒத்திசை ஆன் எனில், திரையைத் திறக்கும் ஒவ்வொரு முறையும் ஒத்திசைக்கும்."
