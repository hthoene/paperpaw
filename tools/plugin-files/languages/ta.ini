vocabulary.plugin.name = சொற்களஞ்சியம்
vocabulary.plugin.description = நீங்கள் தேடும் சொற்களை அவற்றின் வாக்கியங்களுடன் வைத்திருக்கும்; ஃபோனில் உருவாக்கிய ஃபிளாஷ் கார்டுகளை இடைவெளி மீள்பார்வை முறையில் பயிற்சி செய்யும்.
vocabulary.plugin.how = "வாசிக்கும்போது நீங்கள் தேடும் சொற்களைச் சொற்களஞ்சியம் அவற்றின் வாக்கியத்துடன் வைத்திருக்கும். பட்டியல் கருவிகளில் உள்ளது, புதியவை முதலில்; ஒரு சொல்லைத் தேர்ந்தெடுத்தால் மீண்டும் தேடும். ஏற்றுமதி அவற்றை Anki போன்ற ஆப்ஸுக்காகச் சேமிக்கும். புதிய 2,000 சொற்கள் மட்டுமே இருக்கும்: அனைத்தையும் வைத்திருக்க முதலில் ஏற்றுமதி செய்யவும்.\n\nகருவிகளில் உள்ள ஃபிளாஷ் கார்டுகள் இடைவெளி மீள்பார்வை முறையில் பயிற்சி தரும்: பதிலைக் காட்டு என்பதற்குப் பின் மீண்டும், கடினம், நன்று அல்லது எளிது என மதிப்பிடவும்; கார்டு எப்போது திரும்ப வரும் என்பதை அது தீர்மானிக்கும். தொகுப்புகளை உருவாக்க ஃபோனில் திருத்து: அதே Wi-Fi-இல் உள்ள ஃபோனில் குறியீட்டை ஸ்கேன் செய்து கார்டுகளைத் தட்டச்சு செய்யவும், அல்லது ஒரே நேரத்தில் பல கார்டுகள் மூலம் CSV, TSV, TXT கோப்பு (வரிக்கு ஒரு கார்டு: முன், பின், எடுத்துக்காட்டு; UTF-8) அல்லது Anki தொகுப்பைச் (.apkg, Support older Anki versions உடன்) சேர்க்கவும்.\n\nஅல்லது SD கார்டு: ஒவ்வொரு தொகுப்புக்கும் ஒரு கோப்பை Flashcards கோப்புறையில் வைக்கவும் (Spanish.tsv என்பது Spanish தொகுப்பு), பிறகு SD கார்டில் உள்ள கார்டுகள் என்பதைத் தேர்ந்தெடுக்கவும். மாறிய கோப்பு தொகுப்பில் இணையும், முன்னேற்றம் இருக்கும்; முன் உரையை மாற்றினால் அது புதிய கார்டு. நீக்கிய வரி கார்டை நீக்காது (“கோப்பில் இல்லாத கார்டுகள்” அகற்று என இருந்தால் தவிர). கார்டில் சேமி தொகுப்பைக் கோப்பில் எழுதும்; பழைய கோப்பு _name.bak.tsv ஆக நகலெடுக்கப்படும். அதிகபட்சம் 4 MiB, 20,000 வரிகள்; CSV UTF-8 ஆகச் சேமிக்கவும்.\n\nஅமைப்புகள் › வாசிப்பு › தேடிய சொற்களைக் கார்டுகளாக்கு: ஒவ்வொரு தேடிய சொல்லும் தேடியவை தொகுப்பில் கார்டாகச் சேரும்."
