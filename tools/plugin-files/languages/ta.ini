menu-editor.locked = இங்கே அமைப்புகளுக்குச் செல்லும் வழி இந்த உருப்படிதான், எனவே இது இருக்கும். முதலில் வேறொரு வழியைச் சேர்க்கவும் (எ.கா. அமைப்புகள்), பிறகு இதை அகற்றலாம்.
news.plugin.name = செய்திகள்
news.plugin.description = செய்தி ஊட்டங்களை (RSS, Atom) படிப்பதற்கான புத்தகங்களாகப் பெறுகிறது.
news.plugin.how = "செய்திகள், RSS அல்லது Atom ஊட்டங்களைப் புத்தகங்களாக மாற்றும். ஒவ்வொரு ஊட்டமும் நூலகத்தின் செய்திகள் கோப்புறையில் ஒரு புத்தகமாகும், அதன் புதிய கட்டுரைகள் எளிய உரையாக, மற்ற புத்தகங்களைப் போலவே படிக்க.\n\nகருவிகள் மெனுவிலிருந்து செய்திகளைத் திறந்து ஊட்டத்தைச் சேர் என்பதைத் தேர்ந்தெடுக்கவும்; அதன் முகவரி செய்தித்தாள் அல்லது வலைப்பதிவின் இணையதளத்தில் இருக்கும். செய்திகளைப் பெறு எல்லா ஊட்டங்களையும் பெற்று, முந்தைய புத்தகங்களை மாற்றும். ஒரு ஊட்டத்தை மட்டும் பெற அல்லது அகற்ற அதை அழுத்திப் பிடிக்கவும் (பட்டன்களுடன், தேர்ந்தெடு-ஐ அழுத்திப் பிடிக்கவும்). அகற்றப்பட்ட ஊட்டத்தின் புத்தகம் நூலகத்தில் இருக்கும்.\n\nபெறுவதற்கு நெட்வொர்க் தேவை. ஒரு ஊட்டத்துக்கான கட்டுரைகள் (அமைப்புகள் › நூலகம்) ஒவ்வொரு புத்தகத்திலும் எத்தனை கட்டுரைகள் என்பதை அமைக்கும். செய்தித் தலைப்புகள் விட்ஜெட் அவற்றை முகப்புத் திரையில் காட்டும்."
