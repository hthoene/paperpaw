diagnostics.plugin.name = கண்டறிதல்
diagnostics.plugin.description = ஒரு சோதனைத் திரையும், சாதனத்தின் ஒவ்வொரு பகுதியின் வழிகாட்டப்பட்ட சோதனையும்.
diagnostics.plugin.how = "கண்டறிதல் என்பது சாதனத்தைச் சோதிப்பதற்கான திரை: திரை காட்டக்கூடிய எல்லாச் சாம்பல் நிலைகளையும், பட்டன்களையும் தொடுதலையும் சோதிக்க நான்கு பெட்டிகளையும், புதுப்பிப்பு முறைகளை ஒப்பிட முன்னேற்றப் பட்டியுடன் பக்க எண்ணியையும் காட்டும்.\n\nசோதனைத் திரைக்கு மெனு உருப்படி இல்லை. வேறு செருகுநிரல் முகப்புத் திரையை வழங்காதபோது, அல்லது செருகுநிரல் மேலாளரில் திரைகள் என்பதில் முகப்புத் திரை இடத்துக்கு இதைத் தேர்ந்தெடுக்கும்போது மட்டுமே இது முகப்புத் திரையாகும்.\n\nதேர்ந்தெடு பட்டன் கவனத்திலுள்ள பெட்டியைக் குறிக்கும், அம்புப் பட்டன்கள் பெட்டிகளுக்கு இடையே நகரும்; தொடுதலில் பெட்டியைத் தட்டவும். பக்க பட்டன்கள் சோதனைப் பக்கங்களைப் புரட்டும். மீண்டும் தொடங்க, தேர்ந்தெடு பட்டனை அல்லது திரையில் விரலை அழுத்திப் பிடிக்கவும்.\n\nசாதனச் சோதனை (PaperPaw சாதனத்தின் ஃபர்ம்வேராக இருக்கும்போது கருவிகளில்) சாதனத்தின் ஒவ்வொரு பகுதியையும் பக்கம் பக்கமாகச் சோதிக்கும்: திரை, பட்டன்கள், தொடுதல், முன் விளக்கு, பேட்டரி, கார்டு, கடிகாரம், Wi-Fi, உறக்கம், நினைவகம். ஒவ்வொரு பக்கமும் தோல்வி, தவிர், தேர்ச்சி என முடியும்; அளவீடுகள் சுட்டும் பதில் தேர்ந்தெடுக்கப்பட்டிருக்கும். சாதனத்தில் இல்லாத பகுதிகள் தவிர்க்கப்படும். ஒவ்வொரு பதிலுக்கும் பிறகு .paperpaw/plugins/diagnostics/device-check.txt-இல் ஒரு அறிக்கை எழுதப்படும், pull request-இல் ஒட்டுவதற்கு. பின்செல் வெளியேறும்; மீண்டும் திறக்கும்போது விட்ட இடத்திலிருந்து தொடரும். பட்டன்கள் மட்டுமுள்ள சாதனத்தில் முதலில் பட்டன்கள் பக்கத்தில் தொடங்கு என்பதைத் தேர்ந்தெடுக்கவும்; அதுவரை அம்புகள், தேர்ந்தெடு, பின்செல் எல்லாப் பக்கங்களிலும் போலவே செயல்படும்."
