vocabulary.sd.skipped.other = {count} வரிகள் விடப்பட்டன
vocabulary.sd.skipped-notes.one = {count} குறிப்பு விடப்பட்டது: அது மிக நீளமானது (எ.கா. அதில் ஒரு படம்)
vocabulary.sd.skipped-notes.other = {count} குறிப்புகள் விடப்பட்டன: அவை மிக நீளமானவை (எ.கா. அவற்றில் ஒரு படம்)
vocabulary.sd.no-room = {count} வரிகள் பொருந்தவில்லை: ஒரு தொகுப்பில் 20,000 கார்டுகள் மட்டுமே இருக்கலாம்.
vocabulary.sd.outcome.same = கடந்த புதுப்பிப்பிலிருந்து மாறவில்லை.
vocabulary.sd.outcome.unreadable = இந்தக் கோப்பைப் படிக்க முடியவில்லை. கார்டைச் சரிபார்த்து மீண்டும் முயலவும்.
vocabulary.sd.outcome.too-many = ஏற்கெனவே 50 தொகுப்புகள் உள்ளன, எனவே இந்தக் கோப்பு படிக்கப்படவில்லை. முதலில் ஒரு தொகுப்பை நீக்கவும்.
vocabulary.sd.outcome.crowded = பல கார்டுகளுக்கு ஒரே முன்பக்கம் உள்ளது, எனவே இந்தக் கோப்பு படிக்கப்படவில்லை. முன்பக்கங்களை வேறுபடுத்தவும்.
vocabulary.sd.outcome.no-cards = கார்டுகள் எதுவும் இல்லை. கார்டு என்பது முன் உரை உள்ள ஒரு வரி; முன்பக்கம் முதல் நெடுவரிசை.
vocabulary.sd.outcome.too-large = இந்தக் கோப்பு மிகப் பெரியது: அதிகபட்சம் 4 MiB, 20,000 வரிகள். அதைப் பல கோப்புகளாகப் பிரிக்கவும்.
vocabulary.sd.outcome.utf16 = இந்தக் கோப்பு UTF-16 ஆகச் சேமிக்கப்பட்டுள்ளது. அதை மீண்டும் CSV UTF-8 ஆகச் சேமிக்கவும் (விரிதாளில்: CSV UTF-8).
vocabulary.sd.outcome.no-notes = குறிப்புகள் எதுவும் இல்லை: இது Anki தொகுப்பு அல்ல, அல்லது இதில் குறிப்புகள் இல்லை. Anki-இலிருந்து Anki தொகுப்புப் பேக்கேஜாக (.apkg) ஏற்றுமதி செய்யவும்.
vocabulary.sd.outcome.newer-anki = இந்தத் தொகுப்பு மிகப் புதிய Anki வடிவத்தில் உள்ளது. Support older Anki versions என்பதைத் தேர்வுசெய்து மீண்டும் ஏற்றுமதி செய்யவும்.
vocabulary.sd.outcome.deck-too-large = இந்த Anki தொகுப்பு இங்கே படிக்க மிகப் பெரியது: அதிகபட்சம் 4,000 கோப்புகள், 4 MiB குறிப்புகள், 20,000 குறிப்புகள். மீடியாவும் அட்டவணையும் இல்லாமல் ஏற்றுமதி செய்யவும், அல்லது அதைப் பிரிக்கவும்.
vocabulary.sd.line = வரி {line}
vocabulary.sd.fault.no-front = முன் நெடுவரிசையில் உரை இல்லை. சொல்லை அங்கே வைக்கவும்.
vocabulary.sd.fault.not-utf8 = UTF-8 உரை அல்ல. கோப்பை UTF-8 ஆகச் சேமிக்கவும் (விரிதாளில்: CSV UTF-8).
vocabulary.sd.fault.too-long = 8 KiB-ஐ விட நீளமானது. கார்டைச் சுருக்கவும்.
vocabulary.sd.fault.open-quote = மேற்கோள் திறக்கப்பட்டு மூடப்படவில்லை. அதை மூடவும் அல்லது அகற்றவும்.
vocabulary.setting.sd-auto = திறக்கும்போது கார்டிலிருந்து தொகுப்புகளைப் புதுப்பி
vocabulary.setting.sd-auto.help = கோப்புறையில் உள்ள புதிய அல்லது மாறிய கோப்புகளை ஃபிளாஷ் கார்டுகள் படிக்கும்.
vocabulary.setting.sd-folder = தொகுப்புக் கோப்புகளுக்கான கோப்புறை
vocabulary.setting.sd-folder.help = SD கார்டில்: அதில் உள்ள ஒவ்வொரு CSV, TSV, Anki கோப்பும் ஒரு தொகுப்பு.
vocabulary.sd.readme = "கோப்புகளிலிருந்து ஃபிளாஷ் கார்டுகள்\n\nஒவ்வொரு தொகுப்புக்கும் ஒரு கோப்பை இங்கே வைக்கவும்: Spanish.tsv என்பது Spanish தொகுப்பு.\nகோப்புகள்: UTF-8 ஆகச் சேமித்த .tsv, .csv, .txt, அல்லது .apkg (Support older Anki versions உடன் ஏற்றுமதி செய்த Anki தொகுப்பு). குறிப்புகளின் முதல் மூன்று புலங்கள் முன், பின், எடுத்துக்காட்டு ஆகும்; அட்டவணையும் மீடியாவும் படிக்கப்படாது; PaperPaw Anki கோப்பை எழுதாது.\n\nவரிக்கு ஒரு கார்டு: முன், பின், எடுத்துக்காட்டு (விருப்பம்), டேப், காற்புள்ளி அல்லது அரைப்புள்ளியால் பிரித்து. முதல் வரி நெடுவரிசைகளைப் பெயரிடலாம்: front, back, example. எடுத்துக்காட்டு:\n\nKatze\tcat\tDie Katze schläft.\n\nபிறகு சாதனத்தில் ஃபிளாஷ் கார்டுகள் › SD கார்டில் உள்ள கார்டுகள் › தொகுப்புகளைப் புதுப்பி.\n\nதெரிந்துகொள்ள:\n- தொகுப்புகள் கற்றவற்றுடன் சாதனத்தில் இருக்கும். புதிய அல்லது மாறிய கோப்பின் கார்டுகள் தொகுப்பில் சேரும் அல்லது மாறும்.\n- பின்பக்கம், எடுத்துக்காட்டை மாற்றினால் முன்னேற்றம் இருக்கும்.\n- முன் உரையை மாற்றினால் அது புதிய கார்டு (இடைவெளி, பெரிய எழுத்து கணக்கில் இல்லை). சேமித்த கோப்பில் (தொகுப்பைக் கார்டில் சேமி) id நெடுவரிசை உள்ளது: அங்கே முன்பக்கத்தை மாற்றி, முதல் இரண்டு வரிகளை மாற்றாவிட்டால், கற்றது இருக்கும்.\n- சேமிக்கும்போது முன்பக்கம் இல்லாத வரிகள் போகும்; பழைய கோப்பு _name.bak.tsv ஆகும்.\n- CSV UTF-8 ஆகச் சேமிக்கவும் (UTF-16 அல்ல). 4 MiB, 20,000 வரிகளுக்கு மேல் படிக்கப்படாது: பிரிக்கவும்.\n- நீக்கிய வரி கார்டை நீக்காது, அந்தத் தொகுப்புக்கு இல்லாத கார்டுகளை அகற்று ஆனில் இருந்தால் தவிர; அப்போது கார்டு கற்றவற்றுடன் நீங்கும்.\n- _ என்று தொடங்கும் கோப்புகள் படிக்கப்படாது.\n"
wallabag.plugin.name = பின்னர் படிக்க வேண்டிய கட்டுரைகள் (சொந்த சர்வர்)
wallabag.plugin.description = wallabag-இல் சேமித்த கட்டுரைகளைப் புத்தகங்களாகப் பெறும்.
wallabag.title = பின்னர் படிக்க வேண்டிய கட்டுரைகள் (சொந்த சர்வர்)
wallabag.fetch = கட்டுரைகளைப் பெறு
wallabag.server = சர்வர்
wallabag.server.help = பின்னர் படிக்க Wallabag-இல் சேமித்த கட்டுரைகள், “Wallabag” கோப்புறையில் புத்தகங்களாகப் பெறப்படும்.
wallabag.user = பயனர்பெயர்
wallabag.user.help = கட்டுரைகள் வரும் Wallabag கணக்கின் பயனர்பெயர்.
wallabag.password = கடவுச்சொல்
wallabag.client-id = கிளையன்ட் ID
wallabag.client-id.help = Wallabag-இல் "API clients management" என்பதில் உருவாக்கிய API கிளையன்ட்டின் ID.
wallabag.client-secret = கிளையன்ட் சீக்ரெட்
wallabag.secret.password = Wallabag கடவுச்சொல்
wallabag.secret.client = Wallabag கிளையன்ட் சீக்ரெட்
wallabag.help = Wallabag-இல் "API clients management" என்பதில் ஒரு API கிளையன்ட்டை உருவாக்கி, அதன் ID-ஐயும் சீக்ரெட்டையும் இங்கே உள்ளிடவும். படிக்காத கட்டுரைகள் “Wallabag” கோப்புறைக்கு வரும்; இறுதிவரை படித்தவை அடுத்த முறை பெறும்போது காப்பகப்படுத்தப்படும்.
wallabag.fetching = Wallabag-இலிருந்து கட்டுரைகளைப் பெறுகிறது …
wallabag.done = Wallabag: {fetched} புதியவை, {archived} காப்பகப்படுத்தப்பட்டன.
wallabag.done-failed = Wallabag: {fetched} புதியவை, {archived} காப்பகப்படுத்தப்பட்டன, {failed} தோல்வி.
wallabag.setup-needed = Wallabag-க்கு முதலில் சர்வர், பயனர்பெயர், கடவுச்சொல், API கிளையன்ட் தேவை.
wallabag.bad-login = Wallabag உள்நுழைவை ஏற்கவில்லை. பயனர்பெயர், கடவுச்சொல், API கிளையன்ட்டைச் சரிபார்க்கவும்.
wallabag.no-network = Wallabag-க்கு நெட்வொர்க் தேவை.
wallabag.unreachable = Wallabag-ஐ அணுக முடியவில்லை. Wi-Fi இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.
wallabag.unreadable = இந்தச் சாதனத்தில் பெறப்பட்ட கட்டுரைகளின் பட்டியலை Wallabag-ஆல் படிக்க முடியவில்லை, எனவே எதுவும் மாற்றப்படவில்லை.
wallabag.not-kept = Wallabag-ஆல் கடவுச்சொல்லையோ சீக்ரெட்டையோ வைத்திருக்க முடியவில்லை. அது மிக நீளமாக இல்லை என்பதைச் சரிபார்த்து மீண்டும் முயலவும்.
weather.plugin.name = வானிலை
weather.plugin.description = Open-Meteo வழங்கும் இப்போதைய வானிலையும் அடுத்த நாட்களுக்கானதும், விட்ஜெட்டுகளாக.
weather.plugin.how = "வானிலை, முகப்புத் திரைக்கான விட்ஜெட்டுகளாக இப்போதைய வானிலையையும் அடுத்த நாட்களையும் காட்டும். தரவு Open-Meteo-இலிருந்து வருகிறது, அதற்குக் கணக்கோ விசையோ தேவையில்லை. இப்போதைய வானிலை வெப்பநிலை, நிலை மற்றும் நீங்கள் தேர்வுசெய்யும் பிறவற்றைக் காட்டும்; முன்னறிவிப்பு அடுத்த நாட்களை வரிசையாக அல்லது பட்டியலாகக் காட்டும்.\n\nமுதலில் ஓர் இடத்தைத் தேர்ந்தெடுக்கவும்: அமைப்புகள் › வானிலை › இடம் (பெயரைத் தட்டச்சு செய்து, கிடைத்த இடங்களிலிருந்து தேர்ந்தெடுக்கவும்). அதன் ஆயத்தொலைவுகள் மட்டுமே அனுப்பப்படும், அதுவும் வானிலை விட்ஜெட் காட்டப்படும்போது மட்டும். முகப்புத் திரையைத் திருத்தி விட்ஜெட்டுகளைச் சேர்க்கவும்.\n\nபுதுப்பிப்பு இடைவெளி என்பதில் உள்ளதை விட அடிக்கடி வானிலை பெறப்படாது, நெட்வொர்க் இருக்கும்போது மட்டுமே: அது தானாக Wi-Fi-ஐ ஆன் செய்யாது.\n\nவானிலைத் தரவு: Open-Meteo.com (https://open-meteo.com), Creative Commons Attribution 4.0 உரிமத்தின் (CC BY 4.0) கீழ்."
weather.title = வானிலை
weather.refresh = வானிலையைப் பெறு
weather.setting.place = இடம்
weather.setting.place.help = பெயரால் தேடவும். அதன் ஆயத்தொலைவுகள் மட்டுமே Open-Meteo-க்கு அனுப்பப்படும்.
weather.setting.temperature = வெப்பநிலை அலகு
weather.setting.temperature.help = டிகிரி செல்சியஸ் அல்லது ஃபாரன்ஹீட்.
weather.unit.celsius = டிகிரி செல்சியஸ் (°C)
weather.unit.fahrenheit = டிகிரி ஃபாரன்ஹீட் (°F)
weather.setting.wind = காற்று அலகு
weather.setting.wind.help = காற்றின் வேகம் எப்படிக் காட்டப்படும்.
weather.unit.kmh = மணிக்குக் கிலோமீட்டர்
weather.unit.mph = மணிக்கு மைல்
