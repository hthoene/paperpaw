store.plugin.name = செருகுநிரல் ஸ்டோர்
store.plugin.description = இந்தச் சாதனத்துக்கான செருகுநிரல்களைக் கண்டறிந்து நிறுவுகிறது, புதுப்பிக்கிறது, அகற்றுகிறது.
store.plugin.how = "செருகுநிரல் ஸ்டோர் இந்தச் சாதனத்துக்கான செருகுநிரல்களை இணையத்தில் கண்டறிந்து நிறுவுகிறது, புதுப்பிக்கிறது, அகற்றுகிறது. கருவிகளில் திறக்கவும்; Wi-Fi தேவை.\n\nதொடக்கத்தில் பரிந்துரைகள், புதியவை, பிரபலமானவை, பிறகு குழுக்கள். குழுவின் வரிசை தினமும் மாறும்; A-Z, புதியவை அல்லது சமீபத்திய புதுப்பிப்பு படி வரிசைப்படுத்தலாம், நீண்ட பட்டியலில் எழுத்துக்குச் செல்லலாம். ஒன்றைத் திறந்து அளவு, நினைவகத்தைப் பார்த்து, நிறுவு, புதுப்பி அல்லது அகற்று. அனைத்தையும் புதுப்பி எல்லாவற்றையும் புதுப்பிக்கும்.\n\nகுறியீட்டுச் செருகுநிரல்களுக்குச் சாதனத்தில் முழு அணுகல் உண்டு: ஸ்டோர் முதலில் கேட்கும், அவை மீண்டும் தொடங்கிய பின் இயங்கும். ஒன்று தவறினால் PaperPaw அவை இல்லாமல் தொடங்கி, எது என்று சொல்லும். பட்டியல் எங்கிருந்து வரும் என்பதைச் செருகுநிரல் நூலகம் அமைக்கும்.\n\nஅமைப்புகள், சிஸ்டம், சமூகச் செருகுநிரல்கள்: GitHub-இல் பிறர் வெளியிட்டவை. சரிபார்க்கப்படாதவை எனக் குறிக்கப்படும், குறியீட்டுச் செருகுநிரலின் பக்கம் அதன் விசையைக் காட்டும்; வேறு விசையால் கையொப்பமிட்ட புதுப்பிப்பு நிறுவப்படாது.\n\nமூலங்கள் (தொடக்கத்தின் கடைசி வரிசை): பிறரின் பட்டியலை முகவரி மூலம் (https://…/plugins.json) சேர்க்கவும், காட்டவும், அகற்றவும். அல்லது வரிக்கு ஒரு முகவரியுடன் sources.txt கோப்பை கார்டில் .paperpaw/plugins/store-இல் வைக்கவும். PaperPaw மூலங்களைச் சரிபார்க்காது. முதல் பட்டியலின் விசையைச் சாதனம் நினைவில் வைத்து, அதன் கையொப்பம் உள்ளவற்றை மட்டும் ஏற்கும். செருகுநிரல் நிறுவப்பட்ட மூலத்திலிருந்தே புதுப்பிப்புகள் வரும். PaperPaw-இன் சொந்த நூலகம் எப்போதும் இருக்கும்."
