lock.touch.locked = தொடுதல் பூட்டப்பட்டுள்ளது. திறக்க, இருமுறை தட்டி இரண்டாவது தட்டலைப் பிடித்திருக்கவும்.
lock.touch.locked.buttons = தொடுதல் பூட்டப்பட்டுள்ளது. திறக்க பவர் பட்டனை அழுத்திப் பிடிக்கவும், அல்லது இருமுறை தட்டி இரண்டாவது தட்டலைப் பிடித்திருக்கவும்.
