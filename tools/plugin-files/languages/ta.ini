anki.no-network = ஒத்திசைக்க நெட்வொர்க் தேவை. உங்கள் பதில்கள் சேமிக்கப்பட்டு, அடுத்த ஒத்திசைவில் அனுப்பப்படும்.
anki.unreachable = கணினியை அணுக முடியவில்லை. அங்கே Anki திறந்துள்ளதா, முகவரியும் போர்ட்டும் சரியா, AnkiConnect எல்லா முகவரிகளிலும் கேட்கிறதா எனச் சரிபார்க்கவும் (இது எப்படிச் செயல்படுகிறது என்பதைப் பார்க்கவும்).
anki.bad-key = AnkiConnect API விசையை ஏற்கவில்லை. அதை இங்கேயும் ஆட்-ஆனின் உள்ளமைவிலும் சரிபார்க்கவும்.
anki.bad-reply = பதில் AnkiConnect-இலிருந்து (பதிப்பு 6) வரவில்லை. முகவரியையும் போர்ட்டையும் சரிபார்க்கவும்.
