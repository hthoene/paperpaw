store.source.note = PaperPaw, {name}-ஐயோ அதன் செருகுநிரல்களையோ சரிபார்க்காது. அதன் குறியீட்டுச் செருகுநிரல்களுக்கு இந்தச் சாதனம், அதன் புத்தகங்கள், அமைப்புகள் அனைத்திலும் முழு அணுகல் கிடைக்கும். சாதனம் மூலத்தின் சர்வரைத் தொடர்புகொள்ளும். அதை இயக்குபவரை நம்பினால் மட்டும் சேர்க்கவும்.
store.source.added = {name} இப்போது ஒரு மூலம். PaperPaw அதைச் சரிபார்க்காது. அதன் விசை {key} எனத் தொடங்குகிறது: இனி இந்த விசையால் கையொப்பமிட்ட பட்டியல்களும் செருகுநிரல்களும் மட்டுமே அதிலிருந்து ஏற்கப்படும்.
store.source.removed = {name} இனி ஒரு மூலம் அல்ல. அதிலிருந்து நிறுவிய செருகுநிரல்கள் அப்படியே இருக்கும்.
store.source.invalid = அது ஒரு மூலத்தின் முகவரி அல்ல. அது https:// எனத் தொடங்கி, ஒரு plugins.json-ஐக் குறிப்பிட வேண்டும்.
store.source.is-official = PaperPaw-இன் சொந்த நூலகம் எப்போதும் இருக்கும்.
store.source.full = ஏற்கனவே 8 மூலங்கள் உள்ளன. முதலில் ஒன்றை அகற்றவும்.
store.source.busy = பதிவிறக்கம் முடியும் வரை காத்திருக்கவும்.
store.source.from = {name}-இலிருந்து: PaperPaw சரிபார்க்கவில்லை
store.source.foreign.fact = வேறொரு மூலத்திலிருந்து நிறுவப்பட்டது. அதன் புதுப்பிப்புகள் அங்கிருந்தே வரும்.
store.source.foreign = {name} நிறுவப்படவில்லை: இந்தச் சாதனத்தில் அது வேறொரு மூலத்திலிருந்து உள்ளது, அதன் புதுப்பிப்புகள் அங்கிருந்து மட்டுமே வரும்.
store.source.other-key = {name} நிறுவப்படவில்லை: அது இந்த மூலத்தின் விசையால் கையொப்பமிடப்படவில்லை.
store.source.unsigned = இந்த மூலம் கையொப்பமிடப்படவில்லை
store.source.unsigned.help = அதன் பட்டியலில் செல்லுபடியாகும் கையொப்பம் இல்லை, எனவே அதில் எதுவும் படிக்கப்படவில்லை. PaperPaw-இன் செருகுநிரல்களுக்குத் திரும்ப, பின்செல்லவும்.
store.source.key-changed = இந்த மூலத்துக்கு வேறொரு விசை உள்ளது
store.source.key-changed.help = நீங்கள் சேர்த்தபோது இருந்ததை விட வேறொரு விசையால் அதன் பட்டியல் கையொப்பமிடப்பட்டுள்ளது, எனவே அதில் எதுவும் படிக்கப்படவில்லை. PaperPaw-இன் செருகுநிரல்களுக்குத் திரும்ப, பின்செல்லவும். இந்த மாற்றத்தை நம்பினால் மட்டும் மூலத்தை அகற்றி மீண்டும் சேர்க்கவும்.
store.source.too-large = இந்த மூலத்தின் பட்டியல் மிக நீளமானது
store.source.refused.help = அதில் எதுவும் படிக்கப்படவில்லை. PaperPaw-இன் செருகுநிரல்களுக்குத் திரும்ப, பின்செல்லவும்.
tasks.plugin.name = பணிகள்
tasks.plugin.description = காலக்கெடு, முன்னுரிமையுடன் கூடிய செய்ய வேண்டியவை பட்டியல்கள், ரீடரில் அல்லது உங்கள் CalDAV சர்வருடன் ஒத்திசைந்து, முகப்புத் திரை விட்ஜெட்டுகளுடன்.
tasks.plugin.how = "ரீடரில் செய்ய வேண்டியவை பட்டியல்கள்: காலக்கெடு, முன்னுரிமை கொண்ட பணிகள், முடிந்ததும் டிக் செய்யப்படும். அமைவோ நெட்வொர்க்கோ இல்லாமல் செயல்படும்; CalDAV சர்வருடன் (Nextcloud, Radicale, Baïkal, Fastmail...) ஒத்திசைக்கலாம்.\n\nகருவிகள் மெனுவில் பணிகளைத் திறக்கவும். முதல் வரிசை காட்டப்படும் பட்டியலைக் குறிக்கும்; வேறு பட்டியல், இன்றும் தாமதமானவையும், புதிய பட்டியல், ஒத்திசைவு, கணக்கு ஆகியவற்றுக்கு அதைத் தேர்ந்தெடுக்கவும். பணியைச் சேர் விசைப்பலகையைத் திறக்கும். பணியில் தேர்ந்தெடு அதை டிக் செய்யும் (மீண்டும்: முடியவில்லை). தலைப்பு, காலக்கெடு (இன்று, நாளை, ஒரு வாரத்தில், அல்லது 2026-12-24 போன்ற தேதி), முன்னுரிமையை மாற்ற அல்லது அகற்ற, பணியை அழுத்திப் பிடிக்கவும் அல்லது மெனுவை அழுத்தவும். முடிந்தவை ஒரு வாரம் இறுதியில் இருக்கும் (அமைப்புகளில் பணிகள்).\n\nமுகப்புத் திரை விட்ஜெட்டுகள்: இன்றைய பணிகள், பணிப் பட்டியல், திறந்த பணிகள், அடுத்த பணி. விட்ஜெட்டில் பணியைத் தட்டினால் டிக் ஆகும், தலைப்பைத் தட்டினால் பட்டியல்கள் திறக்கும்.\n\nஒத்திசைக்க, பட்டியல் வரிசையில் CalDAV கணக்கைத் தேர்ந்தெடுத்து, சர்வர் முகவரி (எ.கா. cloud.example.com/remote.php/dav), பயனர்பெயர், கடவுச்சொல் (ஆப் கடவுச்சொல் சிறந்தது) உள்ளிடவும். பணிகளைத் திறக்கும்போதும், இப்போது ஒத்திசை தேர்ந்தெடுக்கும்போதும், நெட்வொர்க் ஆனில் இருக்கும்போதும் ஒத்திசைவு நடக்கும்; ஆஃப்லைன் மாற்றங்கள் பிறகு அனுப்பப்படும். இருபுறமும் மாற்றப்பட்ட பணிக்குச் சர்வரின் பதிப்பு எடுக்கப்பட்டு, உங்களுடையது புதிய பணியாக வைக்கப்படும். மீண்டும் வரும் பணிகளை உருவாக்கிய இடத்தில் மாற்றவும். அதிகபட்சம் 12 பட்டியல்களில் 200 பணிகள்."
