store.code.notice = குறியீட்டுச் செருகுநிரல்கள் நிரல்கள்: கணினியிலுள்ள ஆப்ஸ் போல, இவை இந்தச் சாதனம், அதன் புத்தகங்கள், அமைப்புகள் அனைத்திலும் முழு அணுகலுடன் இயங்கும். நீங்கள் நம்புபவற்றை மட்டும் நிறுவவும். ஒன்று தவறினால், PaperPaw குறியீட்டுச் செருகுநிரல்கள் இல்லாமல் (பாதுகாப்புப் பயன்முறையில்) தொடங்கி, அது எது என்று சொல்லும்.
