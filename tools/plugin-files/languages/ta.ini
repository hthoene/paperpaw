koreader.plugin.name = ஹைலைட் பகிர்வு
koreader.plugin.description = இரண்டிலும் படிக்கும் புத்தகங்களுக்கு, புக்மார்க்குகளையும் ஹைலைட்டுகளையும் KOReader உடன் பகிர்கிறது.
koreader.plugin.how = "நீங்கள் PaperPaw-இலும் KOReader-இலும் படிக்கும் புத்தகங்களுக்கு, ஒரே சாதனத்தில் அல்லது சாதனங்களுக்கு இடையே ஒத்திசைக்கப்படும் நூலகக் கோப்புறையில், இந்தச் செருகுநிரல் புக்மார்க்குகளையும் ஹைலைட்டுகளையும் KOReader உடன் பகிர்கிறது. அமைக்க எதுவும் இல்லை.\n\nKOReader-உம் திறந்த புத்தகத்தை PaperPaw திறக்கும்போதும், அதன் புக்மார்க்குகளையோ ஹைலைட்டுகளையோ நீங்கள் மாற்றும்போதும், புத்தகத்தின் அருகில் உள்ள KOReader தரவிலிருந்து புதியவற்றை அது எடுத்துக்கொள்ளும்; இங்கே புதியவற்றை, KOReader அடுத்த முறை புத்தகத்தைத் திறக்கும்போது எடுத்துக்கொள்ள விட்டுவைக்கும். அகற்றப்பட்ட குறிகளும் மாற்றப்பட்ட குறிப்புகளும் கூடச் செல்லும்.\n\nஇது EPUB புத்தகங்களுக்கு மட்டுமே செயல்படும். ஒரு பக்கத்தின் கோப்பைப் படிக்க முடியாவிட்டால், படிக்க முடியும் வரை இரு பக்கத்திலும் எதுவும் மாறாது."
koreader.removed-there = KOReader கோப்பில் இனி ஹைலைட்டுகள் இல்லை. இங்கேயும் அவற்றை அகற்றவா?
koreader.removed-there.text = அவை KOReader-இல் அகற்றப்பட்டிருக்கலாம், அல்லது அதன் கோப்பு வேறொரு சாதனத்திலிருந்து வந்திருக்கலாம். வைத்திரு அவற்றை இங்கே வைத்து, மீண்டும் KOReader-க்குத் தரும்.
koreader.removed-there.remove = அகற்று
koreader.removed-there.keep = வைத்திரு
kosync.plugin.name = முன்னேற்ற ஒத்திசைவு
kosync.plugin.description = வாசிப்பு இடத்தை KOReader-இன் ஒத்திசைவுச் சர்வருடன் ஒத்திசைக்கிறது, KOReader உடனும்.
