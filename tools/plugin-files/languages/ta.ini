core.host-install.sideload = இந்தத் தொகுப்பு எந்தப் பட்டியலிலிருந்தும் வரவில்லை. அதன் மூலத்தை நீங்கள் நம்பினால் மட்டும் நிறுவவும்.
core.host-install.older = இது நிறுவப்பட்டுள்ள பதிப்பை விடப் பழைய பதிப்பு.
core.host-install.same = இந்தப் பதிப்பு ஏற்கெனவே நிறுவப்பட்டுள்ளது.
core.host-firmware.question = {name} ({version}) சாதன மென்பொருளை நிறுவவா?
core.host-firmware.foreign = இது PaperPaw-க்குப் பதிலாக வேறொரு சாதன மென்பொருளை நிறுவும். PaperPaw தானாக மீண்டும் தொடங்காது.
core.host-firmware.no-undo = PaperPaw-ஆல் இந்த மாற்றத்தைச் செயல்தவிர்க்க முடியாது. திரும்பிச் செல்ல, மற்ற மென்பொருளின் மீட்பு விருப்பத்தைப் பயன்படுத்தவும் அல்லது வெப் ஃபிளாஷர் மூலம் PaperPaw-ஐ மீண்டும் நிறுவவும்.
core.host-firmware.kept = PaperPaw சாதனத்தின் நினைவகத்தில் இருக்கும். மெமரி கார்டில் உள்ள கோப்புகள் மாற்றப்படாது.
core.host-firmware.unsigned = இந்த மென்பொருள் கையொப்பமிடப்படவில்லை. அதன் கோப்பு அமைப்பும் சாதனப் பொருத்தமும் மட்டுமே சரிபார்க்கப்படும்; அதன் மூலம் சரிபார்க்கப்படாது.
core.host-firmware.unknown-key = இந்த மென்பொருள் அறியப்படாத விசையால் கையொப்பமிடப்பட்டுள்ளது. இங்கே காட்டப்படும் விசையை நீங்கள் நம்பினால் மட்டும் நிறுவவும்.
core.host-firmware.downgrade = இந்தப் பழைய பதிப்பால் முந்தைய பதிப்பைத் தானாக மீட்டெடுக்க முடியாது. திரும்பிச் செல்ல, வெப் ஃபிளாஷர் மூலம் PaperPaw-ஐ மீண்டும் நிறுவவும்.
core.host-firmware.early-crash = புதிய மென்பொருள் தனது தொடக்கப் பாதுகாப்புச் சோதனைக்கு முன்பே செயலிழந்தால், சாதனம் தொடங்காமல் போகலாம். அப்போது PaperPaw-ஐ மீட்டெடுக்க வெப் ஃபிளாஷர் தேவைப்படும்.
core.host-remove.question = {name}-ஐ அகற்றவா? அதன் சேமித்த தரவை என்ன செய்ய வேண்டும்?
core.host-remove.keep = அகற்று, தரவை வைத்திரு
core.host-remove.delete = அகற்று, தரவை நீக்கு
core.host-remove.warning = அதன் தரவை நீக்கினால், சேமித்த அமைப்புகளும் கோப்புகளும் கூட அகற்றப்படும். இதைச் செயல்தவிர்க்க முடியாது.
core.host-wifi.join = {plugin} “{network}” Wi-Fi உடன் இணைய விரும்புகிறது. அனுமதிக்கவா?
core.host-wifi.hotspot = {plugin} “{network}” Wi-Fi ஹாட்ஸ்பாட்டைத் தொடங்க விரும்புகிறது. அனுமதிக்கவா?
core.host-ui.phone-locked = சாதனம் பூட்டப்பட்டிருக்கும்போது ஃபோனில் தட்டச்சு செய்ய முடியாது.
core.host-ui.typing-stopped = உரை மிக நீளமாக இருப்பதால் நேரலைப் புதுப்பிப்புகள் நின்றுவிட்டன. தொடர்ந்து தட்டச்சு செய்யலாம்; உறுதிசெய்யும்போது முழு உரையும் அனுப்பப்படும்.
core.host-ui.text-full = உரை மிக நீளமாக உள்ளது. அதைச் சுருக்கி மீண்டும் முயலவும். எதுவும் வெட்டப்படவில்லை.
core.host-ui.clipboard-full = கிளிப்போர்டுக்கு உரை மிக நீளமாக உள்ளது. சிறிய பகுதியை நகலெடுக்கவும். கிளிப்போர்டில் முன்பிருந்த உரை மாறவில்லை.
core.host-ui.clipboard-card = கிளிப்போர்டைப் படிக்கவோ அதில் எழுதவோ முடியவில்லை. மெமரி கார்டு செருகப்பட்டு, படிக்கக்கூடியதாக உள்ளதா எனச் சரிபார்க்கவும்.
core.host-ui.card-full = மெமரி கார்டு நிரம்பிவிட்டது. சிறிது இடத்தைக் காலிசெய்து மீண்டும் முயலவும்.
core.host-ui.card-error = மெமரி கார்டில் உரையைப் படிக்கவோ சேமிக்கவோ முடியவில்லை. கார்டைச் சரிபார்த்து மீண்டும் முயலவும்.
core.host-permission.library = உங்கள் முழு நூலகம், வாசிப்பு இடங்கள், எல்லாச் செருகுநிரல்களின் ஹைலைட்டுகள், குறிப்புகள் ஆகியவற்றைப் படிக்கவும் மாற்றவும் முடியும்.
core.host-library.import-failed = புத்தகத்தை நூலகத்தில் சேர்க்க முடியவில்லை. மெமரி கார்டைச் சரிபார்த்து மீண்டும் முயலவும்.
core.host-library.name-taken = இந்தப் பெயரில் ஏற்கெனவே ஒரு புத்தகம் உள்ளது. வேறொரு பெயரைத் தேர்ந்தெடுக்கவும்.
core.host-library.replace-denied = இந்தச் செருகுநிரலால் அந்தப் புத்தகத்தை மாற்ற முடியாது. தானே சேர்த்த, அதன் பிறகு நகர்த்தப்படாத புத்தகங்களை மட்டுமே அது மாற்ற முடியும்.
core.host-safe-mode.power-escape = சாதனத்தை மீண்டும் தொடங்க நீங்கள் பவர் பட்டனை அழுத்திப் பிடித்திருந்தபோது {plugin} செருகுநிரல் பதிலளிக்காததால் அது முடக்கப்பட்டது.
