store.no-room.code = குறியீட்டுக்கு {size} தேவை, {left} மட்டுமே மீதம். இடம் உருவாக்க ஒரு குறியீட்டுச் செருகுநிரலை அகற்றவும்.
store.no-room.code-flash = குறியீட்டுக்கு {size} தேவை, {left} மட்டுமே மீதம். ஒரு குறியீட்டுச் செருகுநிரலை அகற்றவும், அல்லது வெப் ஃபிளாஷர் (paperpaw.org) மூலம் முழு அமைப்பை ஃபிளாஷ் செய்யவும்: பல மடங்கு இடம் கிடைக்கும்.
