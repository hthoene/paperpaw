format-cbz.setting.panels.help = ஒரு நேரத்தில் ஒரு பேனல், பக்கம் புரட்டுதல் அவற்றின் வழியே செல்லும்.
format-docx.plugin.name = DOCX ஆவணங்கள்
format-docx.plugin.description = Word மற்றும் பிற நிரல்கள் சேமிக்கும் .docx கோப்புகளைத் திறக்கும்.
format-docx.plugin.how = ".docx ஆவணங்களைப் புத்தகங்களாகத் திறக்கும்: உள்ளடக்க அட்டவணையுடன் தலைப்புகள், பட்டியல்கள், அட்டவணைகள், தடிமன், சாய்வு, இணைப்புகள், படங்கள் (JPEG, PNG, GIF).\n\nகோப்புகளை நூலகக் கோப்புறையில் வைத்து நூலகத்திலிருந்து திறக்கவும். தலைப்பும் ஆசிரியரும் ஆவணத்தின் பண்புகளிலிருந்து வருகின்றன. அடிக்குறிப்புகள், தலைப்பு, அடிப்பகுதி வரிகள், கருத்துகள் காட்டப்படாது."
format-docx.title = DOCX ஆவணம்
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB புத்தகங்களை அவற்றின் வடிவமைப்பு, உள்ளடக்க அட்டவணை, படங்களுடன் திறக்கும்.
format-epub.plugin.how = "EPUB புத்தகங்கள், உள்ளடக்க அட்டவணை, படங்கள், வெளியீட்டாளர் வடிவமைப்புடன், பிற புத்தகங்களைப் போலவே நூலகத்திலிருந்து திறக்கும். இணையப் பக்கங்கள் (HTML), Markdown, FictionBook (.fb2), காமிக் புத்தகக் காப்பகங்கள் (.cbz) ஆகியவையும் அதே வழியில், ஒவ்வொன்றும் தனிச் செருகுநிரலாகத் திறக்கும்.\n\nஒரு அத்தியாயம் முதல் முறை திறக்கும்போது மாற்றப்பட்டு, செருகுநிரலின் தற்காலிகச் சேமிப்பில் வைக்கப்படும்; எனவே பிறகு வேகமாகத் திறக்கும், பெரிய புத்தகங்களும் சிறிய சாதனங்களில் செயல்படும். உள்ளடக்க அட்டவணை வாசிப்பு மெனுவில் உள்ளடக்கம் என்பதில் உள்ளது. புத்தகத்தின் சொந்த வடிவமைப்பு பொருந்துமா என்பது வாசிப்பு என்பதில் உள்ள வெளியீட்டாளர் வடிவமைப்பு அமைப்பு."
format-epub.title = EPUB மின்புத்தகம்
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook புத்தகங்களைத் (.fb2, zip செய்யப்பட்டவையும்) திறக்கும்.
format-fb2.plugin.how = "ரஷ்ய மற்றும் பிற புத்தகங்களுக்குப் பொதுவான FictionBook புத்தகங்களை (.fb2), zip செய்யப்பட்டவையும் (.fb2.zip), தலைப்பு, ஆசிரியர்கள், அட்டைப்படம், அத்தியாயங்களுடன் திறக்கும்.\n\nஅவற்றை நூலகக் கோப்புறையில் வைக்கவும்; அவை நூலகத்தில் காட்டப்பட்டு, பிற புத்தகங்களைப் போலவே திறக்கும்."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = கோப்புகளாகச் சேமித்த இணையப் பக்கங்களைத் திறந்து, படிக்க வேண்டியதை மட்டும் காட்டும்.
format-html.plugin.how = "கோப்புகளாகச் சேமித்த இணையப் பக்கங்களை (.html, .htm, .xhtml) புத்தகங்களாகத் திறக்கும்: சுற்றியுள்ள மெனுக்கள், விளம்பரங்கள் போன்றவை இல்லாமல், படிக்க வேண்டியதை மட்டும்.\n\nகோப்பை நூலகக் கோப்புறையில் வைத்து, எந்தப் புத்தகத்தையும் போல நூலகத்திலிருந்து திறக்கவும். பக்கத்துக்குள் உள்ள இணைப்புகள் செயல்படும்; படங்கள் கோப்பில் உள்ள இடத்திலேயே காட்டப்படும்."
format-html.title = இணையப் பக்கம் (HTML)
format-images.plugin.name = படங்கள்
format-images.plugin.description = படங்களை (.jpg, .png, .gif) பக்கத்துக்கு ஒன்றாகப் புத்தகங்களைப் போலத் திறக்கும்.
format-images.plugin.how = "படங்கள் (.jpg, .png, .gif) நூலகத்திலிருந்து புத்தகங்களைப் போலத் திறக்கும்: பக்கத்துக்கு ஒரு படம், திரைக்குப் பொருத்தி.\n\nஒரு முழுக் கோப்புறைப் படங்களையும் படிக்க, அதன் முதல் படத்தைத் திறக்கவும்: கோப்புறையில் அதற்குப் பின் உள்ள படங்கள் பெயர்களின் வரிசையில் (10-க்கு முன் 2) தொடரும். கோப்புறையில் பிந்தைய படத்தைத் திறந்தால் அங்கிருந்து தொடங்கும்; ஒவ்வொன்றின் இடமும் தனியாக நினைவில் வைக்கப்படும். திறக்கும் படத்திலிருந்து 300 படங்கள் வரை படிக்கப்படும்.\n\nபடம் அல்லாத அல்லது மிகப் பெரிய கோப்பு, அதற்குப் பதிலாகத் தன் பெயரைக் காட்டும். சொந்தத் தலைப்புடன் பல படங்கள் கொண்ட புத்தகத்துக்கு, காமிக் புத்தகக் காப்பகம் (.cbz) சிறந்த வடிவம்."
format-images.title = படம்
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown கோப்புகளை (.md), எ.கா. குறிப்புகளைத் திறக்கும்.
format-markdown.plugin.how = "குறிப்புகள் போன்ற Markdown கோப்புகளை (.md) புத்தகங்களாகத் திறக்கும்: தலைப்புகள், பட்டியல்கள், மேற்கோள்கள், அழுத்தம் ஆகியவை குறியீடுகளாக அல்ல, உரிய வடிவில்.\n\nகோப்புகளை நூலகக் கோப்புறையில் வைத்து நூலகத்திலிருந்து திறக்கவும். முதல் தலைப்பே அதன் தலைப்பு; கோப்புக்கு அருகிலுள்ள படங்கள் உரை அவற்றைக் குறிப்பிடும் இடத்தில் காட்டப்படும்."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI புத்தகங்கள்
format-mobi.plugin.description = DRM இல்லாத .mobi, .azw கோப்புகளைத் திறக்கிறது.
format-mobi.plugin.how = "MOBI புத்தகங்கள் (.mobi, .azw) எந்த அமைப்பும் இல்லாமல், மற்ற புத்தகங்களைப் போலவே நூலகத்திலிருந்து திறக்கும். தலைப்பு, ஆசிரியர்கள், மொழி, அட்டைப்படம் ஆகியவை புத்தகத்திலிருந்தே எடுக்கப்படும்; உள்ளடக்கப் பட்டியல் அதன் தலைப்புகளிலிருந்து உருவாக்கப்படும்.\n\nமுதல் முறை திறக்கும்போது புத்தகம் மாற்றப்படும்; நீளமான புத்தகத்துக்குச் சில வினாடிகள் ஆகும். அதன் பிறகு உடனே திறக்கும். உரை, தலைப்புகள், தடித்த மற்றும் சாய்வு எழுத்து, இணைப்புகள், படங்கள் காட்டப்படும்.\n\nDRM உள்ள புத்தகங்களை (கடையில் வாங்கிய பெரும்பாலானவை) திறக்க முடியாது; Huffman சுருக்கம் உள்ளவற்றையும் புதிய KF8 வடிவத்தில் (.azw3) உள்ளவற்றையும் திறக்க முடியாது: திறக்கும்போது PaperPaw இதைத் தெரிவிக்கும். Calibre போன்ற கருவியால் உருவாக்கிய EPUB நகல் எப்போதும் திறக்கும்."
format-mobi.title = MOBI புத்தகங்கள்
format-rtf.plugin.name = RTF ஆவணங்கள்
format-rtf.plugin.description = .rtf கோப்புகளைப் புத்தகங்களாகத் திறக்கிறது.
format-rtf.title = RTF ஆவணங்கள்
format-txt.plugin.name = எளிய உரை
format-txt.plugin.description = எளிய உரைக் கோப்புகளை (.txt) திறக்கிறது.
format-txt.plugin.how = "எளிய உரைக் கோப்புகள் (.txt) எந்த அமைப்பும் இல்லாமல், மற்ற புத்தகங்களைப் போலவே நூலகத்திலிருந்து திறக்கும். இந்தச் செருகுநிரல் UTF-8, UTF-16, Windows-1252 உரையைப் படிக்கும், குறியாக்கத்தைத் தானே கண்டறியும்.\n\nகோப்பில் உள்ள வெற்று வரிகளைப் பொறுத்துப் பத்திகள் அமையும்; வெற்று வரிகள் இல்லையெனில் ஒவ்வொரு வரியும் ஒரு பத்தி. Project Gutenberg கோப்புகளில் தொடக்கத்திலும் முடிவிலும் உள்ள உரிம உரை விடப்படும், தலைப்பும் ஆசிரியரும் மேல்தலைப்பிலிருந்து எடுக்கப்படும்.\n\nகோப்பு ஒருபோதும் முழுவதுமாக ஏற்றப்படாது, எனவே மிகப் பெரிய உரைகளும் சிறிய சாதனங்களில் திறக்கும்."
format-txt.title = எளிய உரை
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC, XTCH புத்தகங்களைத் திறக்கிறது: Xteink ரீடர்களுக்கான முன்பே வரையப்பட்ட பக்கங்கள்.
format-xtc.plugin.how = "XTC, XTCH கோப்புகள் என்பவை Xteink ரீடர்களுக்கான மாற்றிகள் உருவாக்கும், பக்கங்கள் ஏற்கெனவே படங்களாக வரையப்பட்ட புத்தகங்கள். அவை மற்ற புத்தகங்களைப் போலவே நூலகத்திலிருந்து திறக்கும்.\n\nஒவ்வொரு பக்கமும் நிலையான படம் என்பதால், உரையின் அளவையோ எழுத்துருவையோ மாற்ற முடியாது. பக்கங்கள் கருப்பு வெள்ளையில் அல்லது நான்கு சாம்பல் நிறங்களில் இருக்கும். ஒவ்வொரு பக்கமும் காட்டப்படும்போது மட்டுமே டிகோட் செய்யப்படும், எனவே X4-இலும் குறைந்த நினைவகமே தேவை.\n\nகோப்பில் இருந்தால் தலைப்பு, ஆசிரியர், அத்தியாயங்கள் அதிலிருந்து எடுக்கப்படும்."
format-xtc.title = XTC பக்கங்கள்
help.plugin.name = குறிப்புகள்
help.plugin.description = ஒரு திரை முதல் முறை திறக்கும்போது, அதன் கட்டுப்பாடுகள் என்ன செய்யும் எனக் காட்டுகிறது.
help.plugin.how = "ஒரு திரை முதல் முறை திறக்கும்போது, அதன் மேல் ஒரு சிறு குறிப்பு அதன் கட்டுப்பாடுகள் என்ன செய்யும் எனச் சொல்லும்: தட்டினால் செயல்படும் திரைப் பகுதிகள் சட்டமிட்டுக் காட்டப்படும், பட்டன்கள் என்ன செய்யும் என்பதும் காட்டப்படும்.\n\nதட்டினாலோ ஏதேனும் பட்டனை அழுத்தினாலோ குறிப்பு மூடும், அந்தத் திரைக்கு மீண்டும் வராது. இனி குறிப்புகள் வேண்டாம் என்பது அனைத்தையும் அணைக்கும்.\n\nஅமைப்புகளில், சிஸ்டம் பிரிவில், குறிப்புகள் அவற்றை ஆன் அல்லது ஆஃப் செய்யும்; குறிப்புகளை மீண்டும் காட்டு ஒவ்வொரு திரையின் குறிப்பையும் இன்னொரு முறை காட்டும்."
help.title = இங்கே இது எப்படிச் செயல்படுகிறது
help.got-it = புரிந்தது
help.no-more = இனி குறிப்புகள் வேண்டாம்
help.section = குறிப்புகள்
help.setting.show = குறிப்புகள்
help.setting.show.help = ஒரு திரை முதல் முறை திறக்கும்போது, அதன் கட்டுப்பாடுகள் என்ன செய்யும் என ஒரு சிறு குறிப்பு சொல்லும்.
