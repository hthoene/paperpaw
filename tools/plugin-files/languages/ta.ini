launcher-simple.plugin.name = எளிய முகப்பு
launcher-simple.plugin.description = அமைதியான தொடக்கத் திரை: பெரிய கடிகாரம், கார்டுகள், டாக், வட்ட ஸ்விட்சுகள் கொண்ட விரைவு பேனல்.
launcher-simple.plugin.how = "எளிய முகப்பு, அடிப்படை மட்டும் தேவைப்படுவோருக்கான அமைதியான தொடக்கத் திரை: பெரிய கடிகாரம், நீங்கள் படிக்கும் புத்தகம், நூலகம், ஸ்டோர் ஆகியவை பெரிய கார்டுகளாக, கீழே மூன்று ஐகான்கள் கொண்ட டாக். அமைப்பு தேவையில்லை.\n\nஅமைப்புகளில், முகப்புத் திரையின் கீழ் இதைத் தேர்ந்தெடுக்கவும். இதன் விரைவு பேனலில் (அதையும் அமைப்புகளில் பேனலாகத் தேர்ந்தெடுக்கவும்) பெரிய வட்ட ஸ்விட்சுகள், சாதனத்தில் முன் ஒளி இருந்தால் அதற்கான பட்டி, உரை அளவுக்கான பட்டி உள்ளன. பட்டன்களுடன், அம்பு விசைகள் ஃபோகஸை நகர்த்தும், தேர்ந்தெடு அந்தப் பகுதி சொல்வதைச் செய்யும்; பட்டியில் அது பத்தில் ஒன்றைக் கூட்டும், முடிவிலிருந்து தொடக்கத்துக்குத் திரும்பும். தொடுதலுடன், ஒரு பகுதியைத் தட்டவும், அல்லது பட்டியில் விரும்பும் இடத்தில் தட்டவும்.\n\nநூலகம் உங்கள் புத்தகங்களைக் கார்டுகளாக, கடைசியாகத் திறந்தது முதலில், ஒரு நேரத்தில் ஒரு பக்கம் காட்டும், சாதாரண ரீடரில் திறக்கும்.\n\nஅமைப்புகளில், எளிய முகப்பு என்பதன் கீழ் இதைத் தனிப்பயனாக்கவும்: முதன்மை மெனுவைப் போலவே திருத்தும் மூன்று பட்டியல்கள். கார்டுகள்: முகப்பு காட்டும் கார்டுகளும் அவற்றின் வரிசையும். டாக்: டாக்கில் உள்ள ஐகான்கள், எந்தச் செருகுநிரலின் எந்தச் செயலும். விரைவு பேனல்: அது காட்டும் ஸ்விட்சுகளும் பட்டிகளும். திரையில் இடமில்லாத கார்டு, கடைசியிலிருந்து, விடப்படும். தேதியும் பேட்டரியும் காட்டப்பட வேண்டுமா என்பதையும் எளிய முகப்பின் கீழ் தேர்ந்தெடுக்கலாம்."
