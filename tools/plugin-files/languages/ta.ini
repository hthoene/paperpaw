battery.plugin.name = பேட்டரி பயன்பாடு
battery.plugin.description = பேட்டரியைப் பதிவுசெய்து, அது எவ்வளவு நேரம் நீடிக்கும் எனக் காட்டும்.
battery.plugin.how = "பேட்டரி பயன்பாடு, சாதனம் விழித்திருக்கும்போது ஏறக்குறைய நிமிடத்துக்கு ஒருமுறை சார்ஜ் அளவையும், அப்போது சாதனம் செய்தவற்றையும் (திரைப் புதுப்பிப்புகள், புரட்டிய பக்கங்கள்) குறித்துக்கொள்ளும். அதிலிருந்து, ஒரு மணிநேர விழிப்புக்கும் 100 பக்கங்களுக்கும் எவ்வளவு செலவாகிறது, அந்த வேகத்தில் பேட்டரி எவ்வளவு நேரம் நீடிக்கும் எனக் கணக்கிடும்.\n\nகருவிகள் மெனுவில் பேட்டரியைத் திறக்கவும். தற்போதைய சார்ஜ், இந்த விழிப்பு நேரம், இதுவரையிலான பேட்டரி பயன்பாடு, சமீபத்திய விழிப்பு நேரங்கள் ஆகியவற்றைக் காட்டும். பக்க பட்டன்கள் மூலமோ மேலே உள்ள அம்புகளைத் தட்டியோ பக்கம் மாற்றலாம்.\n\nஎண்கள் பொருள்பட, சிறிது நேரம் பேட்டரியில் படிக்க வேண்டும். பதிவு இயல்பாக ஆன் நிலையில் இருக்கும்; அமைப்புகள் › சாதனம் › ஆற்றல் › பேட்டரி பயன்பாட்டைப் பதிவுசெய் என்பதில் அதை ஆஃப் செய்யலாம்."
