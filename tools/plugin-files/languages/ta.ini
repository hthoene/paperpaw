calendar.plugin.name = கேலெண்டர்
calendar.plugin.description = உங்கள் கேலெண்டர்கள் சாதனத்தில்: CalDAV, iCal, கோப்புகளிலிருந்து நிகழ்ச்சி நிரல், நாள், வாரம், மாதக் காட்சிகள், தொடர்புகளின் பிறந்தநாட்கள், முகப்பு விட்ஜெட்டுகள், உறக்கத் திரை.
calendar.plugin.how = "CalDAV கேலெண்டர்கள் (Nextcloud, Radicale, Fastmail…), iCal முகவரிகள் (.ics, webcal://), கார்டில் உள்ள கேலெண்டர் கோப்புகள், தொடர்புகளின் (CardDAV) பிறந்தநாட்கள், ஆண்டுவிழாக்கள் ஆகியவற்றைக் காட்டும்; கேலெண்டர்களை மாற்றாது.\n\nகருவிகள் மெனுவில் கேலெண்டரைத் திறக்கவும். காட்சியை மாற்ற, சேர்க்க, ஒத்திசைக்க: முதல் வரிசையைத் தேர்ந்தெடுக்கவும், ஒரு வரிசையை அழுத்திப் பிடிக்கவும் அல்லது மெனுவை அழுத்தவும். நாள், வாரத்தில் முதல் இரு வரிசைகளும் பக்க பட்டன்களும் முன்/பின் செல்லும்; மாதத்தில் அம்புப் பட்டன்கள் நாளையும் பக்க பட்டன்கள் மாதத்தையும் மாற்றும். தேர்ந்தெடு நிகழ்வின் முழு விவரம் காட்டும்.\n\nகேலெண்டர்கள் என்பதில் (மெனுவில், அல்லது அமைப்புகள் › கேலெண்டர்) வகையைத் தேர்ந்தெடுக்கவும்: CalDAV கணக்கு (சர்வர் முகவரி போதும்), iCal முகவரி, கார்டில் உள்ள கோப்பு, அல்லது தொடர்புகள் (CardDAV). முகவரி, கணக்குக்குப் பயனர்பெயர், கடவுச்சொல் (ஆப் கடவுச்சொல் சிறந்தது), பெயர் ஆகியவற்றை உள்ளிடவும். அதிகபட்சம் 6, ஒவ்வொன்றுக்கும் ஒரு குறி.\n\nமீண்டும் நிகழும், பிற நேர மண்டல நிகழ்வுகளும் சாதன நேரத்தில் காட்டப்படும். முன்பின் 60 நாட்களின் நிகழ்வுகள் (240 வரை) நெட்வொர்க் இன்றியும் காட்டப்படும்.\n\nதிறக்கும்போது (5 நிமிடத்துக்கு ஒருமுறை வரை), இப்போது ஒத்திசை என்பதில், அமைப்புகளின்படி நெட்வொர்க் ஆனில் இருக்கும்போது அல்லது சார்ஜ் தொடங்கும்போது படிக்கப்படும். இதற்காக வயர்லெஸ் தானாக இயக்கப்படாது.\n\nமுகப்புத் திரை விட்ஜெட்டுகள் (முகப்புத் திரையை அழுத்திப் பிடிக்கவும்): இன்று, அடுத்த நிகழ்வு, நிகழ்ச்சி நிரல், மாதம், பிறந்தநாட்கள். உறக்கத் திரையில் இன்றைய நிகழ்ச்சி நிரல்: அமைப்புகள் › உறக்கத் திரை › கேலெண்டர்."
