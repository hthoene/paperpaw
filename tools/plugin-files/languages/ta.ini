plugin-manager.stops-after-restart = மீண்டும் தொடங்கிய பிறகு நின்றுவிடும்.
plugin-manager.updates-after-restart = மீண்டும் தொடங்கிய பிறகு பதிப்பு {version} பொறுப்பேற்கும்.
plugin-manager.failed = ஏற்ற முடியவில்லை.
plugin-manager.code = குறியீட்டுடன்.
plugin-manager.code.other-build = PaperPaw-இன் வேறொரு செருகுநிரல் இடைமுகத்துக்காக உருவாக்கப்பட்டது: இதற்கான உருவாக்கத்துக்குக் காத்திருக்கிறது.
plugin-manager.code.damaged = இதன் குறியீடு சேதமடைந்துள்ளது: மீண்டும் நிறுவவும்.
plugin-manager.code.mismatch = இதன் குறியீடு வேறொரு செருகுநிரலுடையது: மீண்டும் நிறுவவும்.
plugin-manager.code.no-room = இதன் குறியீட்டுக்கு இடம் இல்லை. குறியீடு உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.code.no-room-flash = இதன் குறியீட்டுக்கு இடம் இல்லை. குறியீடு உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும், அல்லது வெப் ஃபிளாஷர் (paperpaw.org) மூலம் முழுத் தளவமைப்பை ஃபிளாஷ் செய்யவும்: பல மடங்கு இடம் கிடைக்கும்.
plugin-manager.code.unsupported = இந்தச் சாதனம் குறியீடு உள்ள செருகுநிரல்களை இயக்காது.
plugin-manager.code.safe-mode = இந்தத் தொடக்கத்தில் ஏற்றப்படவில்லை (பாதுகாப்புப் பயன்முறை): மீண்டும் தொடங்கிய பிறகு ஏற்றப்படும்.
plugin-manager.code.safe-mode-off = பாதுகாப்புப் பயன்முறையால் ஆஃப் செய்யப்பட்டது: குறியீடு உள்ள செருகுநிரல்களை ஒவ்வொன்றாக மீண்டும் ஆன் செய்யவும்.
plugin-manager.code.not-installed = ஸ்டோரிலிருந்தோ வெப் ஃபிளாஷரிலிருந்தோ நிறுவப்படவில்லை: இதன் குறியீடு இயங்காது. அங்கிருந்து நிறுவவும்.
plugin-manager.code.unsigned = கையொப்பமில்லை: சரிபார்ப்பின்றி இயங்கும்.
plugin-manager.code.changed = நிறுவிய பிறகு இதன் குறியீடு மாற்றப்பட்டது: இது இயங்காது. மீண்டும் நிறுவவும்.
plugin-manager.code.older = பழைய PaperPaw-க்காக உருவாக்கப்பட்டது: ஸ்டோரில் இதைப் புதுப்பிக்கவும்.
plugin-manager.code.needs-newer = இதைவிடப் புதிய PaperPaw தேவை: PaperPaw-ஐப் புதுப்பித்தால் இது இயங்கும்.
plugin-manager.code.revoked = இயக்கப்படவில்லை: இதன் உருவாக்குநர் கையொப்பமிட்ட விசை திருடப்பட்டு, திரும்பப் பெறப்பட்டது. இதை அகற்றவும்; ஸ்டோர் இதை உருவாக்குநரிடமிருந்து மீண்டும் பெறலாம்.
plugin-manager.formats.too-many = ஏற்றப்படவில்லை: {cap} புத்தக வடிவங்கள் என்ற வரம்பை மீறுகிறது. வடிவங்கள் உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.readers.too-many = ஏற்றப்படவில்லை: {cap} வாசிப்பு ஆப்ஸ் என்ற வரம்பை மீறுகிறது. வாசிப்பு ஆப் உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.fields.too-many = ஏற்றப்படவில்லை: {cap} புத்தகப் புலங்கள் என்ற வரம்பை மீறுகிறது. புத்தகப் புலங்கள் உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.badges.too-many = ஏற்றப்படவில்லை: {cap} புத்தக பேட்ஜ்கள் என்ற வரம்பை மீறுகிறது. புத்தக பேட்ஜ்கள் உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.providers.too-many = ஏற்றப்படவில்லை: {cap} சொல் தேடல் வழங்குநர்கள் என்ற வரம்பை மீறுகிறது. சொல் தேடல் வழங்குநர் உள்ள வேறொரு செருகுநிரலை ஆஃப் செய்யவும்.
plugin-manager.code.crashed = பாதுகாப்புப் பயன்முறையால் ஆஃப் செய்யப்பட்டது: இதனுடன் PaperPaw தொடங்கவில்லை. மீண்டும் முயல இதை ஆன் செய்யவும்.
plugin-manager.safe-mode.failed = PaperPaw தொடங்கவில்லை: குறியீடு உள்ள செருகுநிரல்கள் ஆஃப் செய்யப்பட்டன.
plugin-manager.safe-mode.key = தொடக்கத்தில் பட்டன் அழுத்திப் பிடிக்கப்பட்டது: குறியீடு உள்ள செருகுநிரல்கள் ஆஃப் செய்யப்பட்டன.
