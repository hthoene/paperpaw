file-manager.plugin.name = கோப்பு மேலாளர்
file-manager.plugin.description = சாதனத்தில் உள்ள எல்லாக் கோப்புறைகளும் கோப்புகளும்: திறக்கலாம், பெயர் மாற்றலாம், நகர்த்தலாம், நகலெடுக்கலாம், நீக்கலாம்.
file-manager.plugin.how = "கோப்பு மேலாளர் உங்கள் புத்தகங்களை மட்டுமல்லாமல், சாதனச் சேமிப்பகத்தில் உள்ள எல்லாக் கோப்புறைகளையும் கோப்புகளையும் காட்டும்; அவற்றைத் திறக்க, பெயர் மாற்ற, நகர்த்த, நகலெடுக்க, நீக்க, புதிய கோப்புறைகளை உருவாக்க உதவும்.\n\nகருவிகள் மெனுவில் கோப்புகள் என்பதைத் திறக்கவும். கோப்புறைக்குள் செல்ல அதைத் தட்டவும்; பின்செல் மேல் கோப்புறைக்குச் செல்லும். என்ன செய்யலாம் என்று பார்க்க, கோப்பைத் தட்டவும் அல்லது எந்த உருப்படியையும் அழுத்திப் பிடிக்கவும் (பட்டன்களில்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்). நகர்த்து, நகலெடு ஆகியவை உருப்படியை எடுத்துக்கொள்ளும்: அது செல்ல வேண்டிய கோப்புறைக்குச் சென்று, கீழ்ப் பட்டியில் இங்கே ஒட்டு என்பதைத் தேர்ந்தெடுக்கவும். பட்டன்களில், கடைசி உருப்படியிலிருந்து கீழே அழுத்தினால் பட்டியை அடையலாம்.\n\nPaperPaw-இன் சொந்தத் தரவு போன்ற, புள்ளியில் தொடங்கும் கோப்புகளும் கோப்புறைகளும் மறைக்கப்பட்டுள்ளன. அவற்றைப் பார்க்க, அமைப்புகள் › நூலகம் என்பதில் மறைக்கப்பட்ட கோப்புகள் என்பதை ஆன் செய்யவும்."
file-manager.title = கோப்புகள்
