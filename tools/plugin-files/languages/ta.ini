update.ready.help = இப்போது நிறுவப்பட்டுள்ளது: PaperPaw {current}. புதுப்பிப்புக்குச் சுமார் ஒரு நிமிடம் ஆகும், பிறகு சாதனம் மீண்டும் தொடங்கும். புத்தகங்கள், அமைப்புகள், வாசிப்பு இடங்கள் அப்படியே இருக்கும்.
