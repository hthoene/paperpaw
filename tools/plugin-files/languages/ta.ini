joplin.plugin.name = புத்தகக் குறிப்புகள் ஒத்திசைவு
joplin.plugin.description = ஒவ்வொரு புத்தகத்தின் ஹைலைட்டுகளையும் குறிப்புகளையும் ஒரு நோட்டில் வைக்கிறது. Joplin உடன் செயல்படும் (Joplin Cloud, Joplin Server அல்லது WebDAV).
joplin.title = புத்தகக் குறிப்புகள் ஒத்திசைவு
joplin.send = Joplin-க்கு அனுப்பு
joplin.send.help = ஏற்றுமதி செய்த குறிப்புகள் உடனே அனுப்பப்படும். அனுப்ப முடியாதவை காத்திருந்து, அடுத்த ஏற்றுமதியுடன், இதன் மூலம் அல்லது ஒரு விதியின்படி அனுப்பப்படும்.
joplin.service = ஒத்திசைவது
joplin.service.help = Joplin-இல் அமைத்தபடி, Joplin எதனுடன் ஒத்திசைகிறது: Joplin Cloud, உங்கள் சொந்த Joplin Server, அல்லது Nextcloud போன்ற WebDAV கோப்புறை. எந்தக் கணினியும் இயங்கத் தேவையில்லை.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = முகவரி
joplin.address.help = Joplin Server: அதன் முகவரி, எ.கா. joplin.example.org. WebDAV: Joplin ஒத்திசைக்கும் கோப்புறை, அதன் அமைப்புகளில் உள்ளபடி, எ.கா. dav.example.org/Joplin.
joplin.email = மின்னஞ்சல்
joplin.user = பயனர்பெயர்
joplin.user.help = Joplin Cloud, Joplin Server: நீங்கள் உள்நுழையும் மின்னஞ்சல் (இரு-காரணி உள்நுழைவை இன்னும் பயன்படுத்த முடியாது). WebDAV: கோப்புறையின் பயனர்பெயர்.
joplin.password = கடவுச்சொல்
joplin.password.help = இந்தச் சாதனத்தில் மற்ற கடவுச்சொற்கள், விசைகளுடன் வைக்கப்படும். Nextcloud-க்கு ஆப் கடவுச்சொல்லும் செயல்படும்.
joplin.secret = Joplin கடவுச்சொல்
joplin.not-kept = கடவுச்சொல்லை இந்தச் சாதனத்தில் வைக்க முடியவில்லை.
joplin.notebook = நோட்புக்
joplin.notebook.help = PaperPaw Joplin-இல் உருவாக்கும் நோட்புக், ஒவ்வொரு புத்தகத்துக்கும் ஒரு நோட்டுடன். மீண்டும் ஏற்றுமதி செய்தால் நோட் புதுப்பிக்கப்படும், வேறு நோட்புக்குக்கு நகர்த்தப்பட்டிருந்தாலும் கூட.
joplin.idle = ஏற்றுமதி செய்த குறிப்புகள் உடனே Joplin-க்கு அனுப்பப்படும்.
joplin.waiting.one = {count} புத்தகத்தின் குறிப்புகள் அனுப்பக் காத்திருக்கின்றன.
joplin.waiting.other = {count} புத்தகங்களின் குறிப்புகள் அனுப்பக் காத்திருக்கின்றன.
joplin.sent.one = {count} புத்தகத்தின் குறிப்புகள் Joplin-இல் உள்ளன.
joplin.sent.other = {count} புத்தகங்களின் குறிப்புகள் Joplin-இல் உள்ளன.
joplin.some-failed = Joplin-க்கு அனுப்பியவை: {sent}. அனுப்பாதவை: {failed}; அவை பின்னர் மீண்டும் அனுப்பப்படும்.
joplin.apart.one = Joplin-இல் {count} நோட் மாற்றப்பட்டது, எனவே அதன் அருகில் புதியது உருவாக்கப்பட்டது.
joplin.apart.other = Joplin-இல் {count} நோட்டுகள் மாற்றப்பட்டன, எனவே அவற்றின் அருகில் புதியவை உருவாக்கப்பட்டன.
joplin.nothing = Joplin-க்கு அனுப்பக் காத்திருக்கும் குறிப்புகள் இல்லை.
joplin.no-network = Joplin-க்கு அனுப்ப நெட்வொர்க் தேவை. குறிப்புகள் காத்திருந்து பின்னர் அனுப்பப்படும்.
joplin.setup-needed = முதலில் Joplin-ஐ அமைக்கவும்: அது ஒத்திசைக்கும் இடம், உங்கள் கணக்கு, கடவுச்சொல்.
joplin.no-time = நேரம் இன்னும் தெரியவில்லை. குறிப்புகள் காத்திருந்து பின்னர் அனுப்பப்படும்.
joplin.unreachable = Joplin-ஐ அணுக முடியவில்லை. குறிப்புகள் காத்திருந்து பின்னர் அனுப்பப்படும்.
joplin.failed = Joplin பிழையுடன் பதிலளித்தது ({status}). குறிப்புகள் காத்திருந்து பின்னர் அனுப்பப்படும்.
joplin.bad-login = மின்னஞ்சல், பயனர்பெயர் அல்லது கடவுச்சொல்லை Joplin ஏற்கவில்லை. Joplin அமைப்பில் அவற்றைச் சரிபார்க்கவும்.
joplin.no-server = இந்த முகவரியில் Joplin Server இல்லை. Joplin அமைப்பில் அதைச் சரிபார்க்கவும்.
joplin.bad-address = இந்த முகவரியை PaperPaw-ஆல் பயன்படுத்த முடியாது. Joplin அமைப்பில் அதைச் சரிபார்க்கவும்.
joplin.no-data = இந்த முகவரியில் Joplin குறிப்புகள் இல்லை. அதைச் சரிபார்க்கவும், அல்லது முதலில் Joplin-ஐ அதனுடன் ஒத்திசைக்கவும்.
joplin.encrypted = Joplin-இன் முழுமையான குறியாக்கம் (end-to-end) ஆனில் உள்ளது. PaperPaw-ஆல் குறிப்புகளைக் குறியாக்க முடியாது, எனவே எதையும் அனுப்பாது.
joplin.newer-target = இந்த PaperPaw அறிந்ததை விடப் புதிய வடிவத்தில் Joplin அங்கே குறிப்புகளை வைத்துள்ளது. அவற்றை அனுப்ப PaperPaw-ஐப் புதுப்பிக்கவும்.
joplin.older-target = Joplin அங்கே குறிப்புகளைப் பழைய வடிவத்தில் வைத்துள்ளது. அதை மேம்படுத்த Joplin-ஐத் திறந்து, பிறகு மீண்டும் அனுப்பவும்.
joplin.upgrading = Joplin இப்போது அங்குள்ள குறிப்புகளை மேம்படுத்திக்கொண்டிருக்கிறது. அவை காத்திருந்து பின்னர் அனுப்பப்படும்.
joplin.no-memory = குறிப்புகளை அனுப்பப் போதுமான நினைவகம் இல்லை. மீண்டும் தொடங்கி மீண்டும் முயலவும்.
keyboard.plugin.name = கீபோர்டு
keyboard.plugin.description = தொடுதல் அல்லது பட்டன்கள் மூலம் திரையில் உரையை உள்ளிடுகிறது.
keyboard.plugin.how = "தேடல், கடவுச்சொல், குறிப்பு அல்லது அமைப்பு என உரை தேவைப்படும்போதெல்லாம் கீபோர்டு திறக்கும். தொடுதலிலும் பட்டன்களிலும் செயல்படும்.\n\nபட்டன்களுடன்: இடது, வலது ஒரு வரிசையில் நகரும் (சுற்றி வரும்), பக்க பட்டன்கள் வரிசைகளுக்கு இடையே நகரும் (உங்கள் நெடுவரிசையிலேயே), தேர்ந்தெடு விசையை அழுத்தும், பின்செல் ரத்துசெய்யும். Shift அடுத்த எழுத்தைப் பெரிய எழுத்தாக்கும்; எல்லாம் பெரிய எழுத்தாக இருமுறை, நிறுத்த மீண்டும் ஒருமுறை அழுத்தவும். ஒரு எழுத்தை அழுத்திப் பிடித்தால் (பட்டன்களுடன்: அதன் மேல் தேர்ந்தெடு-ஐ அழுத்திப் பிடி) அதன் பெரிய எழுத்தும் é, è போன்ற உச்சரிப்புக் குறிகளும் வரும். சரி முடிக்கும்; பட்டன்களுடன் எங்கிருந்தும் முடிக்கப் பின்செல்-ஐ அழுத்திப் பிடிக்கவும். ஒட்டு கிளிப்போர்டு உரையைச் செருகும்; ஃபோன் (இருந்தால்) உங்கள் ஃபோனில் தட்டச்சு செய்ய உதவும்.\n\nஅமைப்புகள் › சாதனம் › கீபோர்டு: கீபோர்டு தளவமைப்புகள் (இயல்பாக மெனு மொழி; பல இருந்தால் ஒரு விசை மாற்றும்), உம்லாட் விசைகள் (ä, ö, ü, ß-க்குத் தனி விசைகள்), அளவு, விசை வடிவம் (தொடுதிரைகளில்), தானியங்கு பெரிய எழுத்துகள் (ஒவ்வொரு வாக்கியமும் பெரிய எழுத்தில் தொடங்கும்)."
