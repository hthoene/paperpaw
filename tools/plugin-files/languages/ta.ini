notes-vault.plugin.name = குறிப்புப் பெட்டகம்
notes-vault.plugin.description = Markdown குறிப்புகளின் கோப்புறையைக் கோப்புறைகள், குறிச்சொற்கள், சமீபத்திய மாற்றங்கள் வாரியாகப் படிக்கும்; முகப்புத் திரைக்கான விட்ஜெட்டுகளுடன். Obsidian பெட்டகங்களுடன் செயல்படும்.
notes-vault.plugin.how = "குறிப்புப் பெட்டகம் Markdown குறிப்புகளின் கோப்புறையை (குறிப்பு ஆப்ஸ் வைப்பது போன்ற சாதாரண .md கோப்புகள்) படிக்கும். Obsidian பெட்டகங்களுடன் செயல்படும்.\n\nபெட்டகக் கோப்புறையை அமைப்புகளில் அல்லது கருவிகளில் உள்ள பெட்டகப் பக்கத்தில் தேர்ந்தெடுக்கவும். பிறகு அந்தப் பக்கம் கார்டில் உள்ளபடி கோப்புறைகள், கடைசியாக மாறிய குறிப்புகள், குறிச்சொற்கள், குறிப்புத் தலைப்புகளில் தேடல் ஆகியவற்றைக் காட்டும்.\n\nமுதல் முறை, பக்கம் திறந்திருக்கும்போது பெட்டகம் பின்னணியில் அட்டவணைப்படுத்தப்படும்; ஆயிரக்கணக்கான குறிப்புகளுக்குச் சில நிமிடங்கள் ஆகும், பிறகு உடனே திறக்கும். அட்டவணை கார்டில் வைக்கப்பட்டு, சில மணிநேரத்துக்குப் பிறகு பக்கம் திறக்கும்போதோ புதுப்பி என்பதைத் தேர்ந்தெடுக்கும்போதோ மீண்டும் உருவாக்கப்படும்.\n\nகுறிப்பு ரீடரில் திறக்கும். பிற குறிப்புகளுக்கான இணைப்புகள் ([[Note]], [[Note|words]], [[Note#Heading]]) பெட்டகத்தில் எங்கிருந்தாலும் குறிப்பின் பெயரால் கண்டறியப்படும்; இணைப்பைத் தொடர்ந்தால் அந்தக் குறிப்பு திறக்கும், பின்செல் முந்தைய குறிப்புக்குத் திரும்பும்.\n\nபெட்டகத்தில் எதுவும் ஒருபோதும் மாற்றப்படாது. முகப்புத் திரைக்கான விட்ஜெட்டுகளை (சமீபத்திய குறிப்புகள், பின் செய்த குறிப்பு, இன்றைய குறிப்பு, சீரற்ற குறிப்பு, குறிச்சொற்கள், தேடல்) முகப்புத் திரை எடிட்டரில் சேர்க்கலாம். ஒரு விட்ஜெட் ஒரே கோப்புறையிலிருந்து மட்டும் குறிப்புகளை எடுக்கலாம்: கார்டின் ரூட்டிலிருந்து கோப்புறையின் பாதையை (எ.கா. Notes/Work) விட்ஜெட் அமைப்புகளில் எழுதவும்; காலியாக விட்டால், பெட்டகத்தின் எல்லாக் குறிப்புகளையும் எடுக்கும்."
