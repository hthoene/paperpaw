stats.plugin.name = வாசிப்புப் புள்ளிவிவரங்கள்
stats.plugin.description = நீங்கள் எவ்வளவு நேரம், எவ்வளவு படிக்கிறீர்கள் என்பதைப் பதிவுசெய்யும், நாள்காட்டியுடனும் ஒவ்வொரு புத்தகத்தின் எண்களுடனும்.
stats.plugin.how = "வாசிப்புப் புள்ளிவிவரங்கள் ஒவ்வொரு பக்கத்தையும் நீங்கள் எவ்வளவு நேரம் படிக்கிறீர்கள் என்பதைப் பதிவுசெய்யும். இன்று, இந்த வாரம், தொடர் நாட்கள் ஆகியவற்றுடன் ஒரு கண்ணோட்டமாகவும், நாள்காட்டியாகவும், ஒவ்வொரு புத்தகத்தின் எண்களுடனும் இதைக் காணலாம்.\n\nகருவிகளிலிருந்து, அல்லது வாசிப்பின்போது மேலும் என்பதிலிருந்து இதைத் திறக்கவும். அமைப்புகளில், வாசிப்புப் புள்ளிவிவரங்கள் என்பதன் கீழ், வாசிப்பைப் பதிவுசெய் என்பதை ஆஃப் செய்யலாம், தினசரி இலக்கை அமைக்கலாம், கணக்கிடப்படும் குறைந்தபட்சப் பக்க நேரம், அதிகபட்சப் பக்க நேரம் ஆகியவற்றை அமைக்கலாம்; இதனால் புரட்டுவதோ திறந்தே விடப்பட்ட புத்தகமோ எண்களைக் கெடுக்காது.\n\nKOReader-உடன் ஒத்திசை, ஒரு WebDAV கோப்புறை மூலம் புள்ளிவிவரங்களை KOReader-உடன் பகிரும். அதே சாதனத்தில் உள்ள KOReader-இன் புள்ளிவிவரங்களையும் அது எடுத்துக்கொள்ளும். பதிவுசெய்ய, கடிகாரம் அமைக்கப்பட்டிருக்க வேண்டும்: அமைக்கப்படவில்லையெனில், ஒருமுறை Wi-Fi-உடன் இணைக்கவும்."
