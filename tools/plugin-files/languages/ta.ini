menu.plugin.name = மெனு
menu.plugin.description = செயல்களும் அமைப்புகளும் கொண்ட, திரையின் கீழே உள்ள மெனு.
menu.plugin.how = "நீங்கள் செய்யக்கூடியவற்றையும் அமைக்கக்கூடியவற்றையும் மெனு பட்டியலிடும். திறந்திருப்பதன் மேல், திரையின் கீழே அது திறக்கும்: படிக்கும்போது, திரையின் நடுவில் தட்டவும் அல்லது தேர்ந்தெடு-ஐ அழுத்தவும். ஒரு உருப்படியை இயக்க அதைத் தட்டவும் அல்லது தேர்ந்தெடுக்கவும்.\n\nமெனுவில் உள்ள அமைப்புகள் அவற்றின் மதிப்பைக் காட்டி, அங்கேயே மாறும், எனவே மெனு திறந்தே இருக்கும். மேலும் உருப்படிகள் கொண்ட உருப்படி ஒரு துணை மெனுவைத் திறக்கும்.\n\nவிரைவு பேனலுக்கு மேல் விளிம்பிலிருந்து கீழே ஸ்வைப் செய்யவும்: நீங்கள் அடிக்கடி மாற்றுபவை, பட்டன்களாக. மாற்ற ஒரு பட்டனைத் தட்டவும், அதன் அமைப்புகளுக்கு அழுத்திப் பிடிக்கவும். பட்டன்கள் மட்டும் இருந்தால், அம்புப் பட்டன்கள் தேர்வு செய்யும், தேர்ந்தெடு மாற்றும், பின்செல் மூடும். தோற்றம் பிரிவில், மெனுக்கள் என்பது மெனுக்களைப் பட்டியலாக அல்லது டைல்களாகக் காட்டும்."
