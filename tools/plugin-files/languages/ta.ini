setup.end.help = கணினி மூலம் சாதனத்தில் உள்ள “/books” கோப்புறையில் புத்தகங்களை வைக்கவும், அல்லது ஃபோன் அல்லது கணினியிலிருந்து Wi-Fi மூலம் அனுப்பவும் (கருவிகள், Wi-Fi பரிமாற்றம்). கேட்டலாக்குகளும், சேர்க்கப்பட்டிருந்தால் Calibre-உம் புத்தகங்களைக் கொண்டுவரும். இங்கே தேர்ந்தெடுத்த அனைத்தையும் அமைப்புகளில் மாற்றலாம்.
