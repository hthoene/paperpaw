lock.plugin.name = திரைப் பூட்டு
lock.plugin.description = சாதனம் விழிக்கும்போது PIN, பேட்டர்ன் அல்லது கடவுச்சொல்; படிக்கும்போது தொடுதல் பூட்டு.
lock.plugin.how = "PaperPaw தொடங்கும்போதும் சாதனம் விழிக்கும்போதும் திரைப் பூட்டு PIN, பேட்டர்ன் அல்லது கடவுச்சொல்லைக் கேட்கும். தொடக்கத்தில் ஆஃபில் இருக்கும். இது சாதாரணப் பயன்பாட்டை மட்டுமே தடுக்கும்: குறியீடும் தவறான முயற்சிகளின் எண்ணிக்கையும் SD கார்டில் வைக்கப்படும், எனவே கார்டை எடுப்பவர், திருத்துபவர் அல்லது மாற்றுபவர் பூட்டைக் கடந்துவிடலாம்.\n\nஅமைப்புகள் › சாதனம் › திரைப் பூட்டு: தற்போதைய குறியீடு இருந்தால் உள்ளிட்டு, வகையைத் தேர்ந்தெடுத்து, புதிய குறியீட்டை இருமுறை உள்ளிடவும். பேட்டர்ன் தொடுதிரைகளில் மட்டுமே.\n\nஐந்து தவறான முயற்சிகளுக்குப் பிறகு அடுத்தது அரை நிமிடம் காத்திருக்கும். இப்போதே பூட்டு உடனே பூட்டும்; அதை ஒரு பட்டன், சைகை அல்லது விதிக்கு ஒதுக்கலாம். விழித்த பிறகு பூட்டு என்பதை ஆஃப் செய்தால், உண்மையான தொடக்கம் (பவர் ஆன் அல்லது மீண்டும் தொடங்குதல்) மட்டுமே பூட்டும்; ஒவ்வொரு விழிப்பும் தொடக்கமாக இருக்கும் இடங்களைத் தவிர (பேட்டரியில் X4 போல).\n\nதொடுதல் பூட்டு: விரைவு பேனலிலும் வாசிப்பு மெனுவிலும் உள்ள தொடுதலைப் பூட்டு, தட்டல்கள், ஸ்வைப்கள், பேனா ஆகியவற்றைச் செயலிழக்கச் செய்யும், பட்டன்கள் செயல்படும் (எ.கா. திரையில் கை வைத்துப் படிக்க). திறக்க, ஒரு விரலால் இருமுறை தட்டி, சிறிது நேரம் அழுத்தியே வைக்கவும்; பவர் பட்டனை அழுத்திப் பிடித்தால் பவர் மெனு திறக்கும், அங்கே தொடுதலைத் திற பட்டன்களால் திறக்கும்; X4 Pro-வில் முகப்பு விசையை அழுத்திப் பிடித்தால் உடனே திறக்கும்."
