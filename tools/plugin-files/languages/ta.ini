read-later-cloud.wait = சிறிது காத்திருக்கும்படி Readwise கேட்கிறது. ஒரு நிமிடத்தில் மீண்டும் பெறவும்.
read-later-cloud.no-network = கட்டுரைகளைப் பெற நெட்வொர்க் தேவை.
read-later-cloud.unreachable = Readwise-ஐ அணுக முடியவில்லை. Wi-Fi இணைப்பைச் சரிபார்த்து மீண்டும் முயலவும்.
read-later-cloud.unreadable = இந்தச் சாதனத்தில், பெற்ற கட்டுரைகளின் பட்டியலை இந்தச் செருகுநிரலால் படிக்க முடியவில்லை, எனவே எதுவும் மாற்றப்படவில்லை.
read-later-cloud.secret.account = Readwise Reader கணக்கு
read-later-cloud.too-big = இந்தச் சாதனம் வைக்கக்கூடியதைவிட அதிகமாக Readwise அனுப்பியது, எனவே பெறுதல் நின்றது.
read-later-cloud.no-memory = Readwise Reader-இலிருந்து பெறப் போதுமான நினைவகம் இல்லை. பெறுதல் நின்றது; அடுத்த முறை தொடரும்.
read-later-cloud.not-kept = அணுகல் டோக்கனைச் சேமிக்க முடியவில்லை. அது மிக நீளமாக இல்லை என்பதைச் சரிபார்த்து மீண்டும் முயலவும்.
reader.plugin.name = ரீடர்
reader.plugin.description = பொருளடக்கம், வாசிப்பு அமைப்புகளுடன் புத்தகங்களைப் பக்கம் பக்கமாகக் காட்டும்.
reader.plugin.how = "ரீடர் புத்தகங்களைப் பக்கம் பக்கமாகக் காட்டும். நூலகத்திலிருந்து திறக்கவும்; கடைசிப் புத்தகம் தொடக்கத்தில் தானே திறக்கலாம் (அமைப்பு: தொடக்கத்தில் கடைசிப் புத்தகத்தைத் திற).\n\nபக்கம் புரட்ட: திரையின் இடது/வலது பக்கத்தைத் தட்டவும், அல்லது பக்கப் பட்டன்கள். நடுவில் தட்டினால்/தேர்ந்தெடு அழுத்தினால் வாசிப்பு மெனு: பொருளடக்கம், தேடல், பக்கத்துக்குச் செல், எழுத்துருவும் தளவமைப்பும், புக்மார்க்குகளும் ஹைலைட்டுகளும் முதலியன. மேல் ஓரத்திலிருந்து கீழே இழுத்தால் விரைவு பேனல், கீழ் ஓரத்திலிருந்து மேலே இழுத்தால் அல்லது பின்செல்லை அழுத்திப் பிடித்தால் முகப்பு.\n\nபடத்தை முழுத் திரையில் பார்க்கத் தேர்ந்தெடு (அல்லது படத்தை) அழுத்திப் பிடிக்கவும்: இடது/வலது பக்கத்தின் படங்களில் நகரும். தேர்ந்தெடு 2x, 3x எனப் பெரிதாக்கும் (தொடுதிரையில் இருமுறை தட்டவும்); அப்போது இடது/வலது பக்கவாட்டில், பக்கப் பட்டன்கள் (அல்லது ஸ்வைப்) குறுக்கும் கீழும் நகர்த்தும். பின்செல் முழுப் படத்துக்கு, பிறகு பக்கத்துக்கு (தொடுதிரையில் அழுத்திப் பிடிக்கவும்). புக்மார்க்குக்கு மேல் வலது மூலையைத் தட்டவும். ஹைலைட் செய்ய ஒரு சொல்லை அழுத்திப் பிடிக்கவும். பட்டன்களில் இடதை அழுத்திப் பிடிக்கவும்: இடது/வலது சொல் வாரியாக, பக்கப் பட்டன்கள் வரி வாரியாக நகர்த்தும் (அழுத்திப் பிடித்தால் பக்க முனைகளுக்கும் பத்தி வாரியாகவும்); தேர்ந்தெடு ஹைலைட் பட்டியைத் திறக்கும், அதை அழுத்திப் பிடித்தால் வாக்கியம், பத்தி என விரியும் (அப்போது இடது/வலது முடிவை, அழுத்திப் பிடித்தால் தொடக்கத்தை நகர்த்தும்). தேர்வு பக்கம் புரட்டினாலும் தொடரும். Markdown ஆக ஏற்றுமதி உங்கள் குறிப்புகளைச் சேமிக்கும்."
