format-cbz.plugin.name = காமிக் புத்தகங்கள்
format-cbz.plugin.description = காமிக் புத்தகக் காப்பகங்களை (.cbz) பக்கத்துக்கு ஒரு படமாகத் திறக்கும்.
format-cbz.plugin.how = "காமிக் புத்தகக் காப்பகங்களை (.cbz) திறக்கும்: பக்கத்துக்கு ஒரு படம், திரைக்குப் பொருத்தி, பெயர்களின் வரிசையில் (10-க்கு முன் 2).\n\nஅவற்றை நூலகக் கோப்புறையில் வைத்து நூலகத்திலிருந்து திறக்கவும்; எந்தப் புத்தகத்தையும் போலப் பக்கங்களைப் புரட்டவும். பெரிய படங்களுக்கு முதல் முறை சிறிது நேரம் ஆகும், X4-இல் இன்னும் அதிகம்.\n\nவாசிப்பு அமைப்புகள் (அமைப்புகள், வாசிப்பு): “பேனல் பேனலாக” ஒரு பக்கத்தின் ஒரு பேனலைத் திரை அனுமதிக்கும் அளவுக்குப் பெரிதாகக் காட்டும், பக்கம் புரட்டுதல் அவற்றின் வழியே செல்லும்; பேனல்கள் இல்லாத பக்கம் முழுவதுமாகக் காட்டப்படும். “காமிக் பக்கங்களின் திசை” மங்காவுக்காகப் (வலமிருந்து இடம்) பக்கம் புரட்டுதலைத் திருப்பும்; புத்தகத்தின் ComicInfo.xml இதைத் தானாகச் சொல்லும். நூலகம் ComicInfo.xml-இலிருந்து புத்தகத்தின் தலைப்பு, தொடர், எண் ஆகியவற்றைக் காட்டும்."
