puzzles.plugin.name = புதிர்கள்
puzzles.plugin.description = சுடோகு, குறுக்கெழுத்து, சதுரங்கப் புதிர்கள், ஆஃப்லைனில், இன்றைய புதிருடன்.
puzzles.plugin.how = "ஆஃப்லைன் புதிர்கள்: சுடோகு, குறுக்கெழுத்து, சதுரங்கப் புதிர்கள். கருவிகள் மெனுவில் திறக்கவும், அல்லது முகப்புத் திரையில் இன்றைய புதிர் விட்ஜெட்டைச் சேர்க்கவும்: இன்றைய சுடோகுவின் நிலையைக் காட்டும் (நாள் முழுவதும் ஒரே புதிர்), தட்டினால் திறக்கும்.\n\nசுடோகு: இடது/வலது கர்சரை ஒரு கட்டம், மேல்/கீழ் (பக்கப் பட்டன்கள்) ஒரு வரிசை நகர்த்தும். தேர்ந்தெடு எண்களைத் திறக்கும்: ஒன்றைத் தேர்ந்தெடுத்து இடவும்; அழி காலியாக்கும். தேர்ந்தெடு (அல்லது மெனு) பட்டனை அழுத்திப் பிடித்தால் பலகையின் கீழ் உள்ள பட்டன்கள்: குறிப்புகள் (பென்சில் குறிகள்), சரிபார் (தவறான கட்டங்கள்), செயல்தவிர், புதியது (எளிது, நடுத்தரம், கடினம்). ஒவ்வொரு புதிருக்கும் ஒரே தீர்வு; ஆட்டம் சேமிக்கப்படும். தொடுதிரையில் கட்டத்தைத் தட்டவும்.\n\nகுறுக்கெழுத்து: .puz (Across Lite) அல்லது .ipuz கோப்புகளை மெமரி கார்டின் “puzzles” கோப்புறையில் வைக்கவும் (எதுவும் உடன் வராது). கட்டத்தில் நகர்ந்து, தேர்ந்தெடுத்து, கர்சரின் கீழ் உள்ள சொல்லைத் தட்டச்சு செய்யவும் (அடிக்கோடு கட்டத்தைக் காலியாக விடும்). பட்டன்கள்: குறுக்கு/நெடுக்கு, துப்புகள், சரிபார், காட்டு. எழுத்துகள் கோப்புவாரியாகச் சேமிக்கப்படும். மறைகுறியிட்ட .puz கோப்புகள் திறக்காது.\n\nசதுரங்கப் புதிர்கள்: Lichess தரவுத்தளத்திலிருந்து (CC0) ஒரு சிறு தொகுப்பு. இடது/வலது காய்களுக்கு இடையே தாவும்; காயைத் தேர்ந்தெடுத்து, இடது/வலது மூலம் அது செல்லும் இடத்தைத் தேர்ந்து, மீண்டும் தேர்ந்தெடுக்கவும். தவறான நகர்வு திரும்பப் பெறப்படும். உதவி நகர்த்த வேண்டிய காயைக் குறிக்கும்; அடுத்து அடுத்த புதிருக்குச் செல்லும்.\n\nபுள்ளிவிவரங்கள் நீங்கள் தீர்த்த புதிர்களை எண்ணும்."
