vocabulary.web.too-large = கோப்பு மிகப் பெரியது.
vocabulary.web.wrong-type = இந்த வகைக் கோப்பைப் படிக்க முடியாது. CSV, TSV, TXT கோப்பு அல்லது Anki தொகுப்பைப் (.apkg) பயன்படுத்தவும். விரிதாளில், முதலில் CSV (UTF-8) ஆகச் சேமி என்பதைத் தேர்ந்தெடுக்கவும்.
vocabulary.web.not-utf8 = இந்தக் கோப்பு UTF-8 உரை அல்ல. உங்கள் விரிதாளில் அல்லது எடிட்டரில் அதை CSV (UTF-8) ஆகச் சேமித்து, மீண்டும் தேர்ந்தெடுக்கவும்.
vocabulary.web.partial = சேர்க்கப்பட்ட கார்டுகள்: {count}. தொகுப்பு நிரம்பிவிட்டது (20,000 கார்டுகள்): மீதமுள்ளவை விடப்பட்டன. அவற்றுக்கு வேறொரு தொகுப்பைப் பயன்படுத்தவும்.
vocabulary.web.full = இந்தத் தொகுப்பு நிரம்பிவிட்டது (20,000 கார்டுகள்). மேலும் சேர்க்க வேறொரு தொகுப்பை உருவாக்கவும்.
