store.needs-newer.help = இந்தச் சாதனத்தில் இயங்குவதை விடப் புதிய PaperPaw-க்காக இந்தச் செருகுநிரல் உருவாக்கப்பட்டது. முதலில் PaperPaw-ஐப் புதுப்பிக்கவும்; நிறுவப்பட்ட பதிப்பு அப்படியே இருக்கும்.
store.room.code-about = குறியீட்டுச் செருகுநிரல்கள்: சுமார் {total}-இல் {used} பயன்பாட்டில்
store.refused.no-room = {name} நிறுவப்படவில்லை: குறியீட்டுச் செருகுநிரல்களுக்குப் போதுமான இடம் இல்லை. இடம் உருவாக்க ஒன்றை அகற்றவும்.
store.refused.no-room-flash = {name} நிறுவப்படவில்லை: குறியீட்டுச் செருகுநிரல்களுக்குப் போதுமான இடம் இல்லை. ஒன்றை அகற்றவும், அல்லது வெப் ஃபிளாஷர் (paperpaw.org) மூலம் முழு அமைப்பை ஃபிளாஷ் செய்யவும்: பல மடங்கு இடம் கிடைக்கும்.
