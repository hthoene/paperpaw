vocabulary.sd.save.left-out = சேமிக்கப்படவில்லை: கோப்பின் சில வரிகளைப் படிக்க முடியவில்லை, சேமித்தால் அவை இழக்கப்படும். கோப்பைச் சரிசெய்து, புதுப்பித்து, மீண்டும் முயலவும்.
