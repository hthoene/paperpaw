store.no-build = இன்னும் கிடைக்கவில்லை
store.no-build.help = இந்தச் சாதனத்தில் இயங்கும் PaperPaw-க்கு இந்தச் செருகுநிரல் இன்னும் கிடைக்கவில்லை: உருவாக்கியவர் இந்தப் பதிப்புக்கு இதை இன்னும் உருவாக்கவில்லை. நிறுவப்பட்ட பதிப்பு அப்படியே இருக்கும்; ஒரு புதுப்பிப்புக்குப் பிறகு மீண்டும் பார்க்கவும்.
