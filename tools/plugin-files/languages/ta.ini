anki.help = உங்கள் கணினியில் உள்ள Anki கார்டுகளைப் படிக்கவும்: ஒத்திசைவு நிலுவையிலுள்ள கார்டுகளைப் பெற்று, உங்கள் பதில்களைத் திருப்பி அனுப்பும். அங்கே AnkiConnect ஆட்-ஆனுடன் Anki திறந்திருக்க வேண்டும்; இது எப்படிச் செயல்படுகிறது என்பதைப் பார்க்கவும்.
