update.plugin.name = புதுப்பிப்பு
update.plugin.description = கார்டிலிருந்து அல்லது இணையத்திலிருந்து பதிவிறக்கிய ஃபர்ம்வேர் புதுப்பிப்புகளை நிறுவுகிறது.
update.plugin.how = "X4 போல PaperPaw-ஏ ஃபர்ம்வேராக உள்ள சாதனங்களில், புதுப்பிப்பு புதிய ஃபர்ம்வேரை நிறுவுகிறது. அமைப்புகளில் புதுப்பிப்பு என்பதில் உள்ளது.\n\nஆன்லைனில் தேடு, புதிய PaperPaw-ஐப் புதுப்பிப்புச் சர்வரில் கேட்டுப் பதிவிறக்கும் (Wi-Fi வழியாகச் சில நிமிடங்கள்). அல்லது புதுப்பிப்புக் கோப்பை (.bin, paperpaw.org-இலிருந்து) கார்டில் updates கோப்புறையில் நகலெடுக்கவும். பிறகு நிறுவு சுமார் ஒரு நிமிடம் எடுக்கும், சாதனம் மீண்டும் தொடங்கும்; புத்தகங்கள், அமைப்புகள், வாசிப்பு இடங்கள் அப்படியே இருக்கும்.\n\nபுதுப்பிப்புகளைத் தேடு ஆனில் இருந்தால் (தொடக்கத்தில் ஆஃப்), Wi-Fi ஆனில் இருக்கும்போது அல்லது சார்ஜ் ஆகும்போது மட்டும், சாதனம் வாரம் ஒருமுறை தானே கேட்கும். கிடைத்த புதிய PaperPaw இங்கே காத்திருக்கும். தேடலில் சாதனம் இயக்குவது அனுப்பப்படும், பெயரோ எண்ணோ அல்ல; சாதனங்களை எண்ண, நீங்கள் கேட்டீர்களா, அன்றைய/வாரத்தின்/மாதத்தின் முதல் தேடலா என்பதும்.\n\nநீங்கள் பயன்படுத்தும் செருகுநிரல்களுக்குப் புதிய பதிப்பு இல்லையெனில் புதுப்பிப்பு காத்திருக்கும். பழைய பதிப்பை நீங்கள் தேர்ந்தெடுத்தால் மட்டுமே நிறுவும்.\n\nCrossPoint போன்ற வேறு ஃபர்ம்வேரையும் நிறுவலாம்: அதன் .bin கோப்பை updates கோப்புறையில் வைத்து, புதுப்பிப்பைத் திறக்கவும். இது இந்தச் சாதனத்துக்கான முழுமையான, சேதமில்லாத ஃபர்ம்வேரா என்று PaperPaw சரிபார்க்கும்; ஆனால் கையொப்பம் இல்லாததால் யார் உருவாக்கியது என்று PaperPaw-க்குத் தெரியாது. பரவாயில்லை, நிறுவு அதை ஃபிளாஷின் மற்ற பாதியில் எழுதித் தொடங்கும். PaperPaw-க்குத் திரும்ப, அந்த ஃபர்ம்வேரின் மெனுவிலிருந்து paperpaw-<device>-<version>-install.bin-ஐ நிறுவவும்."
