power.plugin.name = மின்சக்தி
power.plugin.description = மின்சக்திப் பயன்முறையைக் கைமுறையாக அல்லது பேட்டரியைப் பொறுத்துத் தேர்ந்தெடுக்கும்: இயல்பு, சேமிப்பு, ஆஃப்லைன்.
power.plugin.how = "PaperPaw பேட்டரியை எப்படிச் செலவிடும் என்பதை மின்சக்தி தேர்ந்தெடுக்கும்: இயல்பு, சேமிப்பு அல்லது ஆஃப்லைன். சேமிப்பு, காத்திருக்கக்கூடியவற்றைச் சிறந்த நேரங்களில் செய்யும்; ஆஃப்லைன் ரேடியோவை ஆஃப் ஆக வைக்கும். தானியங்கு பேட்டரியைப் பொறுத்துத் தேர்ந்தெடுக்கும்.\n\nவிரைவு பேனலில் (மின்சக்தி அங்கே பயன்முறைகளை அருகருகே காட்டும்) அல்லது அமைப்புகள் › மின்சக்தி என்பதில் பயன்முறையை மாற்றவும். தானியங்கு சேமிப்புக்கும் ஆஃப்லைனுக்கும் மாறும் நிலைகளையும், சார்ஜ் ஆகும்போது இயல்பிலேயே இருக்குமா என்பதையும் அங்கே அமைக்கலாம்.\n\nநிலைப் பட்டிகளில், மின்சக்திப் பயன்முறை சேமிப்பில் ஓர் இலையையும், ஆஃப்லைனில் அடிக்கப்பட்ட Wi-Fi-யையும் காட்டும்; இயல்பில் எதையும் காட்டாது.\n\nசிறிய மெனுவைத் திறக்கப் பவர் பட்டனை அழுத்திப் பிடிக்கவும்: உறக்கம், அணை (PaperPaw-ஆல் முடிந்த இடத்தில்), மீண்டும் தொடங்கு, தொடுதிரைச் சாதனங்களில் தொடுதலைப் பூட்டு அல்லது தொடுதலைத் திற. சுருக்கமாக அழுத்தினால் சாதனம் வழக்கம் போல உறங்கும். பின்செல் மெனுவிலிருந்து வெளியேறும்."
