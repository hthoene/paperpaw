update.dual-boot.title = இந்தச் சாதனத்தில் இரண்டு ஃபர்ம்வேர்கள்
update.dual-boot.help = PaperPaw இந்தச் சாதனத்தை வேறொரு ஃபர்ம்வேருடன் பகிர்கிறது, எனவே இங்கே புதுப்பிப்புகளை நிறுவாது. இதை அமைக்கப் பயன்படுத்திய கருவி மூலம் PaperPaw-ஐப் புதுப்பிக்கவும். இந்தச் சாதனத்தில் இரண்டாவது ஃபர்ம்வேர் இல்லையா? கீழே உள்ள பட்டன் மூலம் தெரிவிக்கவும், அல்லது paperpaw.org/flash-இல் USB வழியாக PaperPaw-ஐ மீண்டும் ஃபிளாஷ் செய்யவும்.
update.not-dual.button = இது டூயல் பூட் அமைப்பு அல்ல
update.not-dual.ask = இந்தச் சாதனத்தில் இரண்டாவது ஃபர்ம்வேர் இல்லையா?
update.not-dual.warning = "அப்போது PaperPaw இங்கே புதுப்பிப்புகளை நிறுவும். இந்தச் சாதனத்தில் உண்மையில் வேறொரு ஃபர்ம்வேர் இருந்தால், புதுப்பிப்பு அதை மேலெழுதக்கூடும். இதைச் செயல்படுத்த PaperPaw மீண்டும் தொடங்கும்.\nபின்னர் இதைத் திரும்பப் பெற: புதுப்பிப்புகள், “டூயல் பூட்டை மீண்டும் கண்டறி”, அல்லது paperpaw.ini-இல் dual-boot = auto."
