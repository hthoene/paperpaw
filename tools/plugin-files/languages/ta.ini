edge-light.plugin.description = முன் விளக்கை அமைக்கத் திரையின் ஓரத்தில் ஸ்வைப் செய்யவும்: ஒரு பக்கம் ஒளிர்வு, மறுபக்கம் வெதுவெதுப்பு.
