plugin-manager.plugin.name = செருகுநிரல் மேலாளர்
plugin-manager.plugin.description = செருகுநிரல்களைப் பட்டியலிட்டு, அவற்றை ஆன், ஆஃப் செய்யும்.
plugin-manager.plugin.how = "செருகுநிரல் மேலாளர் ஒவ்வொரு செருகுநிரலையும் அதன் பதிப்பு, விளக்கத்துடன் பட்டியலிட்டு, செருகுநிரல்களை ஆன், ஆஃப் செய்யும்.\n\nஅமைப்புகளில் செருகுநிரல்களை நிர்வகி என்பதாக இதைக் காணலாம். செருகுநிரல் அமைப்புகள் என்பது, ஒவ்வொரு செருகுநிரலின் நெட்வொர்க் பயன்பாடு போன்ற விருப்பங்களுக்கான தனிப் பக்கம். ஒரு செருகுநிரலை ஆன் அல்லது ஆஃப் செய்ய அதைத் தட்டவும் (பட்டன்களில்: அதைத் தேர்ந்தெடுக்கவும்). மாற்றம் மீண்டும் தொடங்கிய பிறகு பொருந்தும்: அப்போது கீழே உள்ள பட்டியில் இப்போது மீண்டும் தொடங்கு என்பது தோன்றும். அது எப்படிச் செயல்படும் என்று படிக்க, செருகுநிரலை அழுத்திப் பிடிக்கவும் (பட்டன்களில்: தேர்ந்தெடு பட்டனை அழுத்திப் பிடிக்கவும்).\n\nஎப்போதும் ஆன் எனக் குறிக்கப்பட்ட செருகுநிரலை ஆஃப் செய்ய முடியாது; தேவை எனக் குறிக்கப்பட்டதை, வேறொரு செருகுநிரல் அதன் வேலையைச் செய்யும்போது மட்டுமே ஆஃப் செய்யலாம், இல்லையெனில் PaperPaw-க்குத் திரும்ப வழி இருக்காது. பல செருகுநிரல்கள் வழங்கும் ஓர் இடத்தை எது காட்டும் என்பதைத் திரைகள் என்பதில் தேர்ந்தெடுக்கலாம்."
