transfer.plugin.name = பரிமாற்றம்
transfer.plugin.description = அதே நெட்வொர்க்கில் உள்ள பிரவுசரிலிருந்து புத்தகங்களையும் பிற கோப்புகளையும் சாதனத்தில் சேர்க்கவும்.
transfer.plugin.how = "Wi-Fi பரிமாற்றம், கேபிளோ ஆப்போ இல்லாமல், அதே நெட்வொர்க்கில் உள்ள பிரவுசரிலிருந்து புத்தகங்களையும் பிற கோப்புகளையும் சாதனத்தில் சேர்க்கிறது. கோப்புகளைப் பெறவும், கோப்புறைகளை உருவாக்கவும், நீக்கவும் முடியும்.\n\nகருவிகளில் இதைத் திறக்கவும். திரையில் ஒரு முகவரி உரையாகவும் QR குறியீடாகவும் தெரியும்: ஃபோன் அல்லது கணினியின் பிரவுசரில் அதைத் திறக்கவும், அல்லது குறியீட்டை ஸ்கேன் செய்யவும். முகவரியில் ஒவ்வொரு முறையும் புதிதாக உருவாக்கப்படும் விசை உள்ளது, எனவே நெட்வொர்க்கில் உள்ள பிறரால் உங்கள் கோப்புகளை அணுக முடியாது. திரை திறந்திருக்கும் வரை பரிமாற்றம் இயங்கும்.\n\nX4 போல PaperPaw தானே Wi-Fi-ஐ இயக்கும் இடங்களில், கீழே உள்ள ரூட்டர் இல்லாமல் என்பது சாதனத்தின் சொந்த நெட்வொர்க்கைத் திறக்கும்; ஒரு குறியீட்டை ஸ்கேன் செய்து ஃபோன் அதில் இணையும்."
