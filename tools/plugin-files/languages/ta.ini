diagnostics.check.screen.title = திரை
diagnostics.check.screen.help = ஒவ்வொரு சாம்பல் நிலையும் தனிப் பட்டையாகத் தெரிய வேண்டும். வடிவத்தைச் சில முறை மாற்றவும்: முந்தையதில் எஞ்சி நிற்பது கோஸ்டிங். முழுப் புதுப்பிப்பு அதை அழிக்க வேண்டும்.
diagnostics.check.buttons.title = பட்டன்கள்
diagnostics.check.buttons.help = தொடங்கு என்பதைத் தேர்ந்தெடுத்து, கேட்கப்படும்போது ஒவ்வொரு பட்டனையும் அழுத்தவும். ஒன்று வேலை செய்யவில்லை என்றால், தொடர வேறொரு பட்டனை அழுத்திப் பிடிக்கவும்.
diagnostics.check.buttons.start = தொடங்கு
diagnostics.check.touch.title = தொடுதல்
diagnostics.check.touch.help = மூலைகளிலும் ஓரங்களிலும் உள்ள ஒவ்வொரு வட்டத்தையும் தட்டவும். அனைத்தும் நிரம்பியதும் சோதனை தானாகத் தொடரும்.
diagnostics.check.light.title = முன் விளக்கு
diagnostics.check.light.help = விளக்கு அணைந்து, பாதி, முழு, பிறகு குளிர், வெதுவெதுப்பு எனச் செல்லும். முடிவில் உங்கள் சொந்த அமைப்பு திரும்பும்.
diagnostics.check.battery.title = பேட்டரி
diagnostics.check.battery.help = கேபிளைச் செருகி எடுக்கவும்: ஒரு நிமிடத்துக்குள் சார்ஜ் ஆகிறது என்பது மாற வேண்டும்.
diagnostics.check.card.title = கார்டு
diagnostics.check.card.help = 128 KiB கோப்பு ஒன்று கார்டில் எழுதப்பட்டு, மீண்டும் படிக்கப்பட்டு, அகற்றப்படும்.
diagnostics.check.clock.title = கடிகாரம்
diagnostics.check.clock.help = நேரத்தையும் தேதியையும் வேறொரு கடிகாரத்துடன் ஒப்பிடவும்.
diagnostics.check.wifi.title = Wi-Fi
diagnostics.check.wifi.help = அருகிலுள்ள நெட்வொர்க்குகள் தேடப்படும். ஒன்றில் இணைய, Wi-Fi பக்கத்தைத் திறக்கவும்.
diagnostics.check.sleep.title = உறக்கம்
diagnostics.check.sleep.help = இப்போது உறங்கு என்பதைத் தேர்ந்தெடுத்து, பவர் பட்டனால் சாதனத்தை எழுப்பவும். மெனுவிலிருந்து மீண்டும் திறந்தாலும் சோதனை தொடரும்.
diagnostics.check.memory.title = நினைவகம்
diagnostics.check.memory.help = இப்போது காலியாக உள்ள heap, தொடக்கத்திலிருந்து பயன்படுத்தப்படாத stack.
diagnostics.check.end.title = முடிந்தது
diagnostics.check.end.help = அறிக்கை கார்டில் .paperpaw/plugins/diagnostics/device-check.txt-இல் உள்ளது. அதை உங்கள் pull request-இல் ஒட்டவும்.
