core.usb-drive.text = USB டிரைவாக இணைக்கப்பட்டுள்ளது: கார்டு கணினியில் உள்ளது. அதைத் திரும்பப் பெற, கணினியில் டிரைவை வெளியேற்றவும் அல்லது பின்செல் பட்டனை அழுத்தவும்; பிறகு சரி என்பதை அழுத்தவும். நீங்கள் நகலெடுத்த கோப்புகள் அதன் பிறகு நூலகத்தில் தோன்றும்.
core.usb-link.title = USB டெவலப்பர் கருவிகளை அனுமதிக்கவா?
core.usb-link.text = USB கேபிளில் இணைந்த கணினியால் பட்டன்களை அழுத்தவும், ஸ்கிரீன்ஷாட்கள் எடுக்கவும், புத்தகங்களையும் செருகுநிரல் கோப்புகளையும் படிக்கவும் எழுதவும் முடியும். அதனால் ரகசியங்களைப் படிக்கவோ குறியீட்டை நிறுவவோ முடியாது. சாதனம் மீண்டும் தொடங்கும்போதோ உறங்கும்போதோ, கேபிள் பிடுங்கப்படும்போதோ, அல்லது நீங்கள் இங்கே இதை முடக்கும்போதோ இது நின்றுவிடும்.
