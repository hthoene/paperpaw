vocabulary.sd.skipped-notes.other = {count} नोट छोड़े गए: वे बहुत लंबे हैं (जैसे उनमें चित्र हों)
vocabulary.sd.no-room = {count} लाइनें नहीं समाईं: एक डेक में 20,000 कार्ड आते हैं।
