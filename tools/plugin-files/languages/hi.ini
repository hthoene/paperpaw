vocabulary.sd.fault.not-utf8 = UTF-8 टेक्स्ट नहीं है। फ़ाइल को UTF-8 के रूप में सहेजें (स्प्रेडशीट में: CSV UTF-8)।
vocabulary.sd.fault.too-long = 8 KiB से लंबी है। कार्ड छोटा करें।
vocabulary.sd.fault.open-quote = उद्धरण चिह्न खुला है और बंद नहीं हुआ। उसे बंद करें या हटाएँ।
