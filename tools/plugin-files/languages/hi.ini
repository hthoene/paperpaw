vocabulary.sd.outcome.too-many = 50 डेक पहले से हैं, इसलिए यह फ़ाइल नहीं पढ़ी गई। पहले कोई डेक हटाएँ।
vocabulary.sd.outcome.crowded = बहुत से कार्डों का सामने वाला हिस्सा एक जैसा है, इसलिए यह फ़ाइल नहीं पढ़ी गई। सामने वाले हिस्से अलग करें।
vocabulary.sd.outcome.no-cards = कोई कार्ड नहीं मिला। कार्ड सामने के टेक्स्ट वाली लाइन है; सामने वाला हिस्सा पहला कॉलम है।
vocabulary.sd.outcome.too-large = यह फ़ाइल बहुत बड़ी है: ज़्यादा से ज़्यादा 4 MiB और 20,000 लाइनें। इसे कई फ़ाइलों में बाँटें।
vocabulary.sd.outcome.utf16 = यह फ़ाइल UTF-16 में सहेजी है। इसे फिर CSV UTF-8 के रूप में सहेजें (स्प्रेडशीट में: CSV UTF-8)।
vocabulary.sd.outcome.no-notes = कोई नोट नहीं मिला: यह Anki डेक नहीं है, या इसमें नोट नहीं हैं। इसे Anki से Anki डेक पैकेज (.apkg) के रूप में एक्सपोर्ट करें।
vocabulary.sd.outcome.newer-anki = यह डेक Anki के सबसे नए फ़ॉर्मैट में है। इसे “Support older Anki versions” पर निशान लगाकर फिर एक्सपोर्ट करें।
vocabulary.sd.outcome.deck-too-large = यह Anki डेक यहाँ पढ़ने के लिए बहुत बड़ा है: ज़्यादा से ज़्यादा 4,000 फ़ाइलें, 4 MiB के नोट और 20,000 नोट। इसे मीडिया और शेड्यूलिंग के बिना एक्सपोर्ट करें, या बाँटें।
