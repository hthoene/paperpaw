update.plugin.how = "अपडेट नया फ़र्मवेयर इंस्टॉल करता है, उन डिवाइस पर जहाँ PaperPaw ही फ़र्मवेयर है, जैसे X4। यह सेटिंग्स में “अपडेट” नाम से मिलता है।\n\nऑनलाइन खोजें अपडेट सर्वर से नए PaperPaw के बारे में पूछता है और उसे डाउनलोड करता है, जिसमें Wi-Fi पर कुछ मिनट लगते हैं। या कोई अपडेट फ़ाइल (.bin में समाप्त, paperpaw.org से) कार्ड के updates फ़ोल्डर में कॉपी करें, जैसे Wi-Fi ट्रांसफ़र से। फिर इंस्टॉल में लगभग एक मिनट लगता है और डिवाइस रीस्टार्ट होता है; किताबें, सेटिंग्स और पढ़ने की जगहें बनी रहती हैं।\n\n“अपडेट खोजें” चालू करने पर (सेटिंग्स में, शुरू में बंद), डिवाइस लगभग हफ़्ते में एक बार खुद पूछता है, सिर्फ़ तब जब Wi-Fi वैसे भी चालू हो या वह चार्ज हो रहा हो। मिला नया PaperPaw यहाँ इंतज़ार करता है; आपके पढ़ने में कोई रुकावट नहीं आती। खोज में वही भेजा जाता है जो डिवाइस पर चल रहा है, डिवाइस का कोई नाम या नंबर नहीं; डिवाइस गिनने के लिए यह भी कि आपने पूछा था या नहीं, और यह दिन, हफ़्ते या महीने की उसकी पहली खोज है या नहीं।\n\nअगर आपके इस्तेमाल के प्लगइन के पास नए रिलीज़ का संस्करण अभी नहीं है, तो अपडेट उनका इंतज़ार करता है। पुराना संस्करण तभी इंस्टॉल होता है जब आप उसे चुनें।\n\nकोई और फ़र्मवेयर, जैसे CrossPoint, भी यहाँ से इंस्टॉल हो सकता है: उसकी फ़ाइल (.bin में समाप्त) updates फ़ोल्डर में रखें और अपडेट खोलें। PaperPaw जाँचता है कि यह इस डिवाइस के लिए पूरा, बिना खराबी वाला फ़र्मवेयर है, पर यह नहीं बता सकता कि इसे किसने बनाया, क्योंकि इस पर हस्ताक्षर नहीं हैं। “फिर भी इंस्टॉल करें” इसे फ़्लैश के दूसरे आधे हिस्से में लिखता है, और डिवाइस उसे शुरू करता है; PaperPaw अपने हिस्से में तब तक रहता है जब तक वह फ़र्मवेयर उसके ऊपर कुछ इंस्टॉल न करे। बाद में PaperPaw पर लौटने के लिए उसकी इंस्टॉल फ़ाइल (paperpaw-<device>-<version>-install.bin) दूसरे फ़र्मवेयर के मेन्यू से इंस्टॉल करें, जैसे CrossPoint का SD फ़र्मवेयर अपडेट।"
