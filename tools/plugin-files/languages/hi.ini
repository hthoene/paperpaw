update.dual-boot.help = PaperPaw यह डिवाइस दूसरे फ़र्मवेयर के साथ बाँटता है, इसलिए यहाँ अपडेट इंस्टॉल नहीं करता। PaperPaw को उसी टूल से अपडेट करें जिससे इसे सेट किया था। इस डिवाइस पर दूसरा फ़र्मवेयर नहीं है? नीचे के बटन से बताएँ, या paperpaw.org/flash पर USB से PaperPaw फिर फ़्लैश करें।
