files.plugin.name = फ़ाइल ब्राउज़र
files.plugin.description = डिवाइस की किताबें और फ़ोल्डर सूचीबद्ध करता है और खोलता है।
files.plugin.how = "लाइब्रेरी आपके लाइब्रेरी फ़ोल्डर की किताबें सूचीबद्ध करती है, हर एक कवर, शीर्षक, लेखक और कितनी पढ़ी गई, के साथ। आपकी आख़िरी पढ़ी किताब कार्ड की तरह सबसे ऊपर रहती है, इसलिए पढ़ना जारी रखने के लिए एक टैप या चुनें का एक दबाव काफ़ी है। लाइब्रेरी किताबें खोजते समय बताती है कि अब तक कितनी मिलीं।\n\nकिताबों के ऊपर चुनें कि क्या दिखे: सभी, जो आप पढ़ रहे हैं, अनपढ़ी या पूरी हुईं, या शेल्फ़ (लेखक, शृंखला, टैग, पसंदीदा, हर शुरू की शृंखला की अगली किताब के अनुसार)। किताब पढ़ने के लिए टैप करें; उसे खोलने, पूरी हुई या अनपढ़ी चिह्नित करने, जानकारी देखने, आर्काइव में ले जाने या मिटाने के लिए दबाए रखें (बटन से, चुनें दबाए रखें)। लाइब्रेरी मेन्यू के लिए शीर्षक टैप करें: किताबें कैसे क्रमित और दिखाई जाएँ, खोज, लाइब्रेरी फ़ोल्डर और सेटिंग्स।\n\nलाइब्रेरी फ़ोल्डर सेटिंग्स में, लाइब्रेरी के तहत, लाइब्रेरी फ़ोल्डर में सेट होता है; वहाँ आप किताबें कवर के ग्रिड के रूप में भी दिखा सकते हैं। हर दूसरी फ़ाइल के लिए टूल मेन्यू में फ़ाइलें इस्तेमाल करें।"
