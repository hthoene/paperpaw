vocabulary.setting.sd-folder = डेक की फ़ाइलों का फ़ोल्डर
vocabulary.setting.sd-folder.help = SD कार्ड पर: इसमें CSV, TSV या Anki फ़ाइल एक डेक है।
vocabulary.sd.readme = "फ़ाइलों से फ़्लैशकार्ड\n\nहर डेक के लिए यहाँ एक फ़ाइल रखें: Spanish.tsv से डेक Spanish बनता है।\nफ़ाइलें: .tsv, .csv या .txt, UTF-8 में सहेजी, या .apkg: “Support older Anki versions” पर निशान लगाकर एक्सपोर्ट किया Anki डेक। इसके नोट के पहले तीन फ़ील्ड सामने, पीछे और उदाहरण बनते हैं; इसकी शेड्यूलिंग और मीडिया नहीं पढ़े जाते, और PaperPaw कभी Anki फ़ाइल नहीं लिखता।\n\nहर लाइन में एक कार्ड: सामने, पीछे और उदाहरण (वैकल्पिक), टैब, कॉमा या सेमीकोलन से अलग। पहली लाइन कॉलम के नाम बता सकती है: front, back, example। उदाहरण:\n\nKatze\tcat\tDie Katze schläft.\n\nफिर रीडर पर फ़्लैशकार्ड खोलें, “SD कार्ड पर कार्ड” चुनें और फिर “डेक अपडेट करें”।\n\nजानने लायक बातें:\n- डेक रीडर पर, आपके सीखे के साथ, रहते हैं। फ़ाइल नई या बदली होने पर पढ़ी जाती है, और उसके कार्ड डेक में जुड़ते या वहाँ बदलते हैं।\n- पीछे वाला हिस्सा या उदाहरण बदलें: कार्ड प्रगति रखता है।\n- किसी कार्ड का सामने वाला टेक्स्ट बदलें: वह नया कार्ड गिना जाता है। कार्ड सामने के टेक्स्ट से मिलाए जाते हैं। डेक को फ़ाइल में सहेजें (SD कार्ड पर कार्ड, डेक कार्ड पर सहेजें) तो हर कार्ड का id कॉलम में एक नंबर होता है: वहाँ सामने वाला हिस्सा बदलें, फ़ाइल की पहली दो लाइनें जैसी हैं वैसी रखें, और कार्ड आपका सीखा रखता है।\n- सहेजने पर डेक के कार्ड लिखे जाते हैं। फ़ाइल में जो था और कार्ड नहीं है (सामने वाले हिस्से के बिना लाइन) वह नहीं रखा जाता; वहाँ पहले की फ़ाइल _name.bak.tsv में कॉपी होती है।\n- फ़ाइल को CSV UTF-8 के रूप में सहेजें (UTF-16 नहीं, स्प्रेडशीट का अपना फ़ॉर्मैट नहीं)। 4 MiB या 20,000 लाइनों से बड़ी फ़ाइल नहीं पढ़ी जाती: उसे बाँटें।\n- फ़ाइल में हटाई लाइन से डेक का कार्ड नहीं हटता, जब तक आप उस डेक के लिए “गायब कार्ड हटाएँ” चालू न करें। तब कार्ड आपके सीखे के साथ चला जाता है।\n- जिन फ़ाइलों के नाम _ से शुरू होते हैं वे नहीं पढ़ी जातीं।\n"
