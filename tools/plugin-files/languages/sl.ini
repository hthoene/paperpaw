keyboard.plugin.name = Tipkovnica
keyboard.plugin.description = Vnaša besedilo na zaslonu, z dotikom ali s tipkami.
keyboard.plugin.how = "Tipkovnica se odpre, kadar koli je za nekaj potrebno besedilo: iskanje, geslo, opomba ali nastavitev. Deluje z dotikom in samo s tipkami.\n\nS tipkami se Levo in Desno premikata po vrstici, tipki za listanje med vrsticami, Izberi pritisne tipko in Nazaj prekliče; Levo in Desno krožita okoli vrstice, Gor in Dol ostaneta v vašem stolpcu. Shift naredi naslednjo črko veliko; dvakrat pritisnjen vse velike, še enkrat pa jih ustavi. Pridržite črko (s tipkami: pridržite Izberi na njej) za njeno veliko črko, izbrano takoj, in naglase, kot sta é in è; v nemščini tako dobite ä, ö, ü in ß iz a, o, u in s (s tipkami to tipkovnica pove na teh črkah). V redu konča vnos; s tipkami pridržana tipka Nazaj konča od koderkoli (samo Nazaj prekliče), prav tako pridržan Izberi na tipki, ki ni črka. Prilepi vstavi besedilo iz odložišča, Telefon, kjer je na voljo, pa vam omogoča, da besedilo namesto tega natipkate v telefonu.\n\nV nastavitvah pod Naprava, Tipkovnica: Razporeditve tipkovnice izbere razporeditve. Privzeto sledi jeziku menijev; pri več razporeditvah tipka preklaplja med njimi. Tipke s preglasi namesto tega da lastne tipke za ä, ö, ü in ß. Velikost poveča tipke in črke; samo s tipkami ostanejo vrstice takšne kot na računalniški tipkovnici. Na zaslonih na dotik Oblika tipk spremeni videz tipk. Samodejne velike začetnice začne vsak stavek z veliko začetnico."
