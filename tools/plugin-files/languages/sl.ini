pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Časovnik za osredotočenost z delovnimi krogi in odmori, gradniki in dnevnim števcem.
pomodoro.plugin.how = "Časovnik Pomodoro: delajte v osredotočenih krogih, nato počivajte. Ne potrebuje nastavljanja: 25 minut osredotočenosti, 5 minut odmora in po štirih krogih dolg odmor 15 minut.\n\nPomodoro odprite v meniju z orodji in pritisnite Začni ali dodajte njegove gradnike na domači zaslon (pridržite domači zaslon, nato dodajte gradnik): Časovnik Pomodoro prikaže fazo in preostale minute, Pomodoro začni/premor je gumb, Pomodoro danes pa šteje končane kroge z vašim dnevnim ciljem. Tap na časovnik ga zažene ali začasno ustavi; pridržite ga, da odprete celoten zaslon.\n\nČasovnik teče naprej, ko zapustite zaslon, in se po ponovnem zagonu nadaljuje po uri. Medtem ko bralnik spi, ne teče nič: faza, ki se je medtem končala, je sporočena ob prebujanju. Obvestilo vam pove, kdaj je faza mimo. Za varčevanje baterije se ura posodobi samo enkrat na minuto (na celem zaslonu v zadnji minuti vsakih deset sekund) in bralnika nikoli ne drži budnega.\n\nV nastavitvah pod Pomodoro določite dolžine in kroge enega niza ter ali se naslednja faza zažene sama. Pod Več: utrip zaslona ali utrip osvetlitve ob koncu faze in dnevni cilj."
