translate.plugin.how = "Prevajanje prevaja izbrano besedilo na spletu z DeepL. Izberite besedilo v knjigi in v meniju izbranega besedila izberite Prevedi: prevod se prikaže čez stran kot vnos v slovarju. Tipki za listanje ali tapi ga pomikajo, Izberi ali tap na koncu ga zapre.\n\nPotrebuje omrežje in lasten ključ API DeepL, brezplačen na deepl.com (DeepL API Free, približno 500.000 znakov na mesec). Dokler ga ne vnesete, to pove plošča, tap pa zanj vpraša.\n\nV nastavitvah pod Branje, v razdelku Prevajanje, Prevedi v določa jezik; sprva je to jezik PaperPaw."
