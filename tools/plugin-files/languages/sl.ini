mail.plugin.name = E-pošta
mail.plugin.description = Bere in pošilja e-pošto z geslom ali geslom za aplikacijo (IMAP in SMTP), brez prijave v brskalniku.
mail.plugin.how = "E-pošta bere in pošilja e-pošto prek IMAP in SMTP. Prijavi se z vašim naslovom in geslom, brez prijave v brskalniku, zato deluje z vsakim ponudnikom, ki to dovoljuje.\n\nRačun nastavite pod Nastavitve, E-pošta. Izberite svojega ponudnika, vtipkajte naslov in geslo. Večina ponudnikov zahteva geslo za aplikacijo: ustvarite ga v varnostnih nastavitvah svojega računa in ga uporabite tukaj. Vaše običajno geslo pogosto ne deluje in nikoli ne gre nikamor razen na strežnik vašega ponudnika. Shranjeno je med gesli in ključi.\n\nE-pošto odprite med orodji. Preveri pošto prenese najnovejša sporočila in mape. Sporočila ostanejo na kartici, zato jih lahko berete brez omrežja. Naprava se poveže, prenese in prekine povezavo, tako da je Wi-Fi vklopljen le za trenutek.\n\nČe vašega ponudnika ni na seznamu, izberite Lastni strežniki in v naprednih nastavitvah nastavite imena strežnikov, vrata in varnost. Strežnik, za katerega potrdilo nobena ustanova ne jamči, enkrat vpraša, ali mu zaupate; primerjajte prstni odtis s tistim, ki ga navaja vaš ponudnik.\n\nSporočilo s priloženo knjigo (EPUB, PDF in podobno, do 2 MB) ima pod seboj Odpri knjigo: prenese datoteko, jo da v vašo knjižnico in jo odpre.\n\nČe želite videti novo pošto, ne da bi odprli E-pošto, vklopite Išči novo pošto v ozadju pod Nastavitve, E-pošta in izberite, kako pogosto (vsakih 15, 30 ali 60 minut). Izklopljeno je, dokler ga ne vklopite. Bralnik se potem občasno poveže prek varne povezave, medtem ko je aktiven in povezan, en račun za drugim, in posodobi število neprebranih na domačem zaslonu. Porabi nekaj baterije. Če odprete E-pošto, se preverjanje v teku ustavi.\n\nGradniki domačega zaslona prikazujejo število neprebranih, najnovejša in sporočila z zvezdico, en poštni predal ter bližnjico za pisanje sporočila."
