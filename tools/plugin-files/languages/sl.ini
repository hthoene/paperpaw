menu.help.panel-buttons = Puščične tipke: izbira. Izberi: preklop. Nazaj: zapri.
menu-editor.plugin.name = Urejevalnik menijev
menu-editor.plugin.description = Preureja, odstranjuje in dodaja vnose vseh menijev.
menu-editor.plugin.how = "Urejevalnik menijev spremeni, kaj vsebujejo meniji: vnose premaknite gor ali dol, jih odstranite ali dodajte nove.\n\nNajdete ga v Nastavitvah pod Prilagoditev, kot Prilagodi menije. Izberite meni, nato vnos, da ga premaknete ali odstranite; Dodaj vnos vstavi novega. Spremembe veljajo takoj. Ponastavi ta meni vrne meni v stanje, kot ga določajo njegovi vtičniki, Ponastavi vse menije to stori za vse.\n\nSami se ne morete zakleniti ven: vnos, ki je pot do nastavitev, ostane, dokler ne dodate druge poti do njih."
