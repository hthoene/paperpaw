menu.plugin.name = Meni
menu.plugin.description = Meni na dnu zaslona z dejanji in nastavitvami.
menu.plugin.how = "Meni našteje, kaj lahko storite in nastavite. Odpre se na dnu zaslona, nad vsem, kar je odprto: med branjem tapnite sredino zaslona ali pritisnite Izberi. Tapnite ali izberite vnos, da ga zaženete.\n\nNastavitve v meniju prikažejo svojo vrednost in se spremenijo na mestu, zato meni ostane odprt. Vnos z več vnosi odpre podmeni.\n\nPodrsajte z zgornjega roba navzdol za hitri dostop: kar pogosto spreminjate, kot gumbi. Tapnite gumb, da ga preklopite, pridržite ga za njegove nastavitve. Samo s tipkami puščične tipke izbirajo, Izberi preklaplja in Nazaj zapre. Pod Videz Meniji prikaže menije kot seznam ali kot ploščice."
