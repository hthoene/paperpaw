power.plugin.name = Napajanje
power.plugin.description = Izbere način napajanja, ročno ali glede na baterijo: Običajno, Varčevanje, Brez povezave.
power.plugin.how = "Napajanje izbere, kako PaperPaw porablja baterijo: Običajno, Varčevanje ali Brez povezave. Varčevanje opravi, kar lahko počaka, ob ugodnejših trenutkih; Brez povezave drži radio izklopljen. Samodejno izbere glede na baterijo.\n\nNačin spremenite v hitrem dostopu, kjer Napajanje prikaže načine drug ob drugem, ali v Nastavitvah pod Napajanje. Tam določite tudi ravni, pri katerih Samodejno preklopi na Varčevanje in na Brez povezave, ter ali ostane Običajno med polnjenjem.\n\nV statusnih vrsticah Način napajanja prikaže list med varčevanjem in prečrtan Wi-Fi, ko ni povezave, v načinu Običajno pa nič.\n\nPridržite tipko za vklop, da odprete majhen meni: Spanje, Izklop (kjer PaperPaw to zmore), Ponovni zagon, na napravah na dotik pa Zakleni dotik ali Odkleni dotik. Kratek pritisk še vedno uspava napravo. Nazaj zapusti meni."
