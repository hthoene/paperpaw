store.plugin.name = Trgovina z vtičniki
store.plugin.description = Najde, namesti, posodobi in odstrani vtičnike za to napravo.
store.plugin.how = "Trgovina z vtičniki najde vtičnike za to napravo na internetu ter jih namesti, posodobi in odstrani. Odprete jo med Orodji; potrebuje Wi-Fi.\n\nZačetek prikaže, kaj priporoča knjižnica, kaj je novo ali zdaj priljubljeno, nato skupine. Skupina našteje svoje vtičnike v pošteni mešanici, ki se vsak dan spremeni, da je viden vsak vtičnik; razvrstite jih od A do Z, po novosti ali po zadnji posodobitvi in v dolgih seznamih skočite na črko. Odprite enega za njegovo stran z velikostjo in pomnilnikom, ki ga zasede, nato izberite Namesti, Posodobi ali Odstrani. Posodobi vse posodobi vse nameščene vtičnike.\n\nVtičniki s kodo tečejo s polnim dostopom do naprave: trgovina to pove in najprej vpraša, začnejo pa se po ponovnem zagonu. Če gre eden narobe, se PaperPaw zažene brez vtičnikov s kodo in pove, kateri je bil. Knjižnica vtičnikov določa, od kod prihaja seznam.\n\nSkupnostni vtičniki v Nastavitvah, Sistem, prikaže tudi vtičnike, ki so jih na GitHubu objavili drugi. Nihče jih ni pregledal: označeni so kot Nepregledano, stran vtičnika s kodo prikaže ključ, s katerim je podpisan, posodobitev, podpisana z drugim ključem, pa se ne namesti.\n\nViri, zadnja vrstica začetka, dodajo sezname vtičnikov drugih po njihovem naslovu (https://…/plugins.json), prikažejo enega od njih namesto seznama PaperPaw ali ga odstranijo. Namesto tipkanja dajte datoteko sources.txt z enim naslovom v vsaki vrstici v .paperpaw/plugins/store na kartici: naslovi se pod Viri prikažejo kot novi. PaperPaw vira in njegovih vtičnikov ne preverja, naprava pa vzpostavi stik s strežnikom vira. Vir podpiše svoj seznam; naprava si zapomni ključ prvega prebranega seznama in od takrat sprejema samo sezname in vtičnike s kodo, podpisane s tem ključem. Vtičnik dobiva posodobitve samo iz vira, iz katerega je bil nameščen. Lastna knjižnica PaperPaw je vedno tu in je ni mogoče odstraniti; ob zapustitvi trgovine se spet prikaže ona."
