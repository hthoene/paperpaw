reading-goal.plugin.name = Bralni cilj
reading-goal.plugin.description = Minute branja na dan in mačka na domačem zaslonu, katere razpoloženje sledi današnjemu branju.
reading-goal.plugin.how = "Mačka na vašem domačem zaslonu kaže, kako gre današnje branje: žalostna, dokler še niste brali, tako-tako po malo branja, zadovoljna od polovice dnevnega cilja, srečna, ko ste ga dosegli.\n\nGradnik Bralna mačka dodajte na domači zaslon (pridržite domači zaslon, nato dodajte gradnik) ali kot zaslon spanja izberite Današnja bralna mačka. Tap na mačko odpre dnevni cilj; to je cilj statistike branja, ki šteje minute, ki jih preberete.\n\nV nastavitvah pod Branje Zadovoljna od in Srečna od določita, od katerega deleža cilja je mačka zadovoljna ali srečna, Lastne slike pa mapo s slikami (sad, meh, content in happy), ki se prikažejo namesto mačk. Slike so datoteke PNG ali JPEG; brez mape se prikažejo mačke."
