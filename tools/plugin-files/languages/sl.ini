about.plugin.name = O programu
about.plugin.description = Različica in licence PaperPaw.
about.plugin.how = "O programu prikaže, katero različico PaperPaw imate, kje je njegova izvorna koda in pod katerimi licencami je izdan.\n\nNajdete ga na koncu Nastavitev, kot O PaperPaw. Vrstico izberete s puščičnimi tipkami in Izberi ali pa tapnete nanjo. Navedeni so tudi vgrajeni vtičniki in, na napravah, ki nalagajo vtičnike s kodo, prstni odtis, za katerega morajo biti taki vtičniki zgrajeni.\n\nLicence se odprejo kot besedilo v bralniku, zato listate kot po knjigi. Vsebujejo licenco PaperPaw ter licence pisav, ikon in vzorcev za deljenje besed, ki so priloženi. Vtičniki lahko dodajo svojo vrstico, na primer avtorja teme."
