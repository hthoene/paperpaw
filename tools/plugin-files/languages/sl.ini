vocabulary.sd.readme = "Kartice iz datotek\n\nTukaj dajte datoteko za vsak kupček: Angleščina.tsv naredi kupček Angleščina.\nDatoteke: .tsv, .csv ali .txt, shranjene kot UTF-8, ali .apkg: kupček Anki, izvožen z obkljukanim Podpiraj starejše različice Anki. Prva tri polja njegovih opomb postanejo sprednja stran, zadnja stran in primer; urnik učenja in mediji se ne preberejo, PaperPaw pa datoteke Anki nikoli ne zapiše.\n\nEna kartica v vsaki vrstici: sprednja stran, zadnja stran in primer (neobvezno), ločeni s tabulatorjem, vejico ali podpičjem. Prva vrstica lahko poimenuje stolpce: front, back, example. Primer:\n\nMačka\tcat\tMačka spi.\n\nNato v bralniku odprite Kartice, izberite Kartice na kartici SD in nato Posodobi kupčke s kartice.\n\nDobro je vedeti:\n- Kupčki ostanejo v bralniku, s tem, kar ste se naučili. Datoteka se prebere, kadar je nova ali spremenjena, njene kartice pa se dodajo kupčku ali tam spremenijo.\n- Zadnjo stran ali primer kartice v datoteki spremenite: kartica se spremeni in obdrži vaš napredek.\n- Besedilo sprednje strani kartice spremenite: to šteje za novo kartico, stara pa se začne znova. Kartice se ujemajo po besedilu sprednje strani, presledki in velike črke ne štejejo. Kupček shranite v datoteko (Kartice na kartici SD, Shrani kupček na kartico) in vsaka kartica ima številko v stolpcu id: tam spremenite sprednjo stran, prvi dve vrstici datoteke pustite, kakršni sta, in kartica obdrži, kar ste se naučili.\n- Shranjevanje zapiše kartice kupčka. Kar je bilo v datoteki in ni kartica (vrstica brez sprednje strani), se ne ohrani; datoteka, ki je bila tam, se kopira v _ime.bak.tsv.\n- Datoteko shranite kot CSV UTF-8 (ne UTF-16, ne v lastni obliki preglednice). Datoteka čez 4 MiB ali 20.000 vrstic se ne prebere: razdelite jo.\n- Vrstica, ki jo v datoteki izbrišete, kartice v kupčku ne izbriše, razen če za ta kupček vklopite Odstrani manjkajoče kartice. Tedaj kartica izgine s tem, kar ste se naučili.\n- Datoteke, katerih ime se začne z _, se ne preberejo.\n"
