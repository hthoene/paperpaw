setup.plugin.name = Prva nastavitev
setup.plugin.description = Kratek vodnik skozi pomembne nastavitve ob prvem zagonu.
setup.plugin.how = "Prva nastavitev je kratek vodnik skozi nastavitve, ki so pomembne, prikazan enkrat, ob prvem zagonu PaperPaw. Vsaka stran vpraša po eni stvari, kot so jezik, tipke, velikost besedila, časovni pas, Wi-Fi ali nekaj vtičnikov za dodajanje, z že izbranim smiselnim odgovorom, zato je Naprej vedno prav. Koraki, ki jih ta naprava ne potrebuje, so izpuščeni.\n\nTapnite gumbe ali uporabite tipki gor in dol ter Izberi. Preskoči na prvi strani takoj zapusti nastavitev. Zadnja stran pove, od kod prihajajo vaše knjige.\n\nČe jo želite zagnati znova, odprite nastavitve in izberite Nastavi PaperPaw. Vse, kar izberete tu, je pozneje mogoče spremeniti v nastavitvah."
