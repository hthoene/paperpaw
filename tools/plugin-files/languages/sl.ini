calendar.plugin.description = Vaši koledarji v bralniku: razpored, dnevni, tedenski in mesečni pogled iz CalDAV, iCal in datotek, rojstni dnevi iz stikov, gradniki za domači zaslon in zaslon spanja.
calendar.plugin.how = "Vaši koledarji v bralniku: razpored naslednjih dni, dan, teden in mesec z dogodki iz koledarjev CalDAV (Nextcloud, Radicale, Baïkal, Fastmail in drugi), z naslovov iCal (.ics, webcal://), iz koledarskih datotek na kartici ter rojstnimi dnevi in obletnicami vaših stikov (CardDAV). Bralnik koledarje samo bere; nikoli jih ne spreminja.\n\nKoledar odprete v meniju z orodji. Prva vrstica poimenuje pogled; izberite jo, pridržite katero koli vrstico ali pritisnite Meni, da preklopite med razporedom, dnevom, tednom, mesecem in rojstnimi dnevi, dodate koledarje ali sinhronizirate. V dnevnem in tedenskem pogledu prvi dve vrstici stopita na prejšnji in naslednji dan ali teden (to storita tudi tipki za listanje); v mesečnem pogledu puščične tipke premikajo dan, tipki za listanje mesec, Izberi pa odpre dan. Izberi pri dogodku ga prikaže v celoti: kdaj, kje, kateri koledar in kako se ponavlja. Nazaj gre en korak nazaj.\n\nKoledar dodate pod Koledarji (v meniju ali Koledar v nastavitvah). Izberite njegovo vrsto: račun CalDAV (dovolj je naslov strežnika, npr. cloud.example.com/remote.php/dav; vsak koledar z dogodki postane del pogleda), naslov iCal (koledar, objavljen kot .ics), koledarska datoteka na kartici ali stiki (imenik CardDAV: bralnik prikaže tam shranjene rojstne dneve in obletnice). Vnesite naslov, pri računu uporabniško ime in geslo (najbolje geslo za aplikacijo; hrani se med gesli bralnika) ter ime. Vsak koledar ima oznako (pika, krog, siva pika ali kvadrat), ki jo lahko spremenite, da jih ločite; do šest koledarjev.\n\nPonavljajoči se dogodki (dnevni, tedenski, mesečni, letni, z dnevi v tednu, številom, končnim datumom in izpuščenimi dnevi), celodnevni dogodki in dogodki v drugih časovnih pasovih so prikazani po uri bralnika. Bralnik hrani dogodke od šestdeset dni pred do šestdeset dni po današnjem dnevu, največ 240, in jih prikazuje brez omrežja. Pravila, ki jih ne more prebrati, prikažejo svoj dogodek enkrat.\n\nKoledarji se preberejo, ko odprete koledar (največ vsakih pet minut), ko izberete Sinhroniziraj zdaj in, kot nastavite pod Koledar v nastavitvah, ko je omrežje tako ali tako vklopljeno ali ko se začne polnjenje. Bralnik zaradi tega nikoli ne vklopi svojega radia, razen kadar zahtevate Sinhroniziraj zdaj.\n\nGradniki za domači zaslon (pridržite domači zaslon, nato dodajte gradnik): Danes prikaže datum in kaj prinaša dan, Naslednji dogodek naslednji dogodek, Razpored naslednje dni, Mesec mesec s piko pod dnevi z dogodki in Rojstni dnevi naslednje rojstne dneve. Tap na dogodek ga odpre, tap na dan v mesecu odpre ta dan. Zaslon spanja lahko prikaže današnji razpored: izberite Koledar pod Zaslon spanja v nastavitvah."
