notes-overview.plugin.name = Vse opombe
notes-overview.plugin.description = Zaznamki in poudarki vseh knjig na enem seznamu ter izvoz kot My Clippings.txt.
notes-overview.plugin.how = "Vse opombe našteje vsako knjigo, v kateri ste naredili zaznamek ali poudarek, s številom. Odprete jih med Orodji. Izberite knjigo, da vidite njene opombe, in opombo, da knjigo odprete na tem mestu.\n\nNa koncu seznama Izvozi kot My Clippings.txt zapiše vse opombe v eno datoteko, v mapo Exports ob knjižnici, v obliki, ki jo uporablja Kindle (UTF-8). Aplikacije, ki berejo datoteko My Clippings.txt iz Kindla, jo lahko preberejo. Opomba k poudarku je poseben vnos, kot pri Kindlu. Ker knjiga tukaj nima lokacij Kindla, je „location“ to, kako daleč v knjigi je opomba, v odstotkih. Datoteka se vsakič zapiše znova; nadomesti prejšnjo."
