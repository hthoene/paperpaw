smart-home.plugin.name = Pametni dom
smart-home.plugin.description = Vrednosti in stikala vašega lastnega Home Assistant na nadzorni plošči in kot gradniki domačega zaslona. Deluje s Home Assistant v vašem domačem omrežju.
smart-home.plugin.how = "Pametni dom prikazuje vrednosti in stikala vašega lastnega Home Assistant: temperature, vlago, energijo, vrata in okna, luči, stikala in prizore. Z vašim strežnikom se pogovarja prek njegovega vmesnika REST v vašem domačem omrežju; nobena druga storitev ni vmes.\n\nPametni dom odprite v meniju z orodji, nato Povezava: vnesite naslov svojega Home Assistant (na primer http://homeassistant.local:8123) in dolgoživ dostopni žeton (ustvarite ga na dnu strani profila v Home Assistant). Žeton je shranjen med gesli in ključi, nikoli v datoteki z nastavitvami. Navaden http se uporablja samo za naslove v vašem domačem omrežju; za strežnik drugje v nastavitvah vklopite „Strežniki zunaj domačega omrežja“ in uporabite https z veljavnim potrdilom.\n\nIzberi entitete odpre seznam tega, kar ima vaš strežnik: iščite po imenu ali ID in izberite entiteto, da jo prikažete (ponovna izbira jo odstrani). Lahko ji določite sobo, ki jo združi na nadzorni plošči in v gradnikih sob. Hrani se do 24 entitet. Na nadzorni plošči izberite luč, stikalo ali prizor, da ga preklopite: vrstica prikaže odgovor strežnika. Senzor, ki ga izberete, se prebere znova.\n\nGradniki (pridržite domači zaslon, nato dodajte gradnik): Vrednost pametnega doma prikaže eno meritev veliko, skupina našteje entitete sobe, stikalo je gumb za eno luč ali stikalo, soba pa je kartica z meritvami in stikali sobe. Nastavitve vsakega gradnika povedo, katero entiteto ali sobo prikazuje.\n\nDom se prebere, ko odprete nadzorno ploščo, ko to zahtevate (vrstica Osveži zdaj ali tap na gradnik vrednosti ali skupine), ko se bralnik prebudi, kjer je Wi-Fi že vzpostavljen, in po nastavljenem urniku, medtem ko je polnilnik priključen. Radia nikoli ne vklopi sam in ga nikoli ne drži vklopljenega."
