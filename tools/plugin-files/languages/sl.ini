lock.plugin.name = Zaklep zaslona
lock.plugin.description = PIN, vzorec ali geslo ob prebujanju naprave; dotik zaklenjen med branjem.
lock.plugin.how = "Zaklep zaslona zahteva PIN, vzorec ali geslo, ko se PaperPaw zažene in ko se naprava prebudi. Sprva je izklopljen. Zadrži samo naključno uporabo: koda in število napačnih poskusov sta shranjena na kartici SD, zato kdor kartico odstrani, ureja ali zamenja, pride mimo zaklepa.\n\nNastavite ga v nastavitvah, pod Naprava, Zaklep zaslona: vnesite trenutno kodo, če obstaja, izberite vrsto, nato dvakrat novo kodo. Vzorec je na voljo samo na zaslonih na dotik.\n\nPo petih napačnih poskusih mora naslednji počakati pol minute. Zakleni zdaj zaklene takoj in ga je mogoče dati na tipko, kretnjo ali pravilo. Zaklep po prebujanju je mogoče izklopiti, tako da zaklene samo pravi zagon (vklop ali ponovni zagon), razen kjer je vsako prebujanje zagon, kot pri X4 na bateriji.\n\nPoleg tega je zaklep dotika: Zakleni dotik v hitrem dostopu in meniju za branje poskrbi, da tapi, poteze in pisalo ne naredijo nič, tipke pa še delujejo, na primer za branje z roko na zaslonu. Za odklep dvakrat tapnite z enim prstom in ga za trenutek pridržite; pridržana tipka za vklop odpre meni Napajanje, v katerem Odkleni dotik to opravi s tipkami; na X4 Pro pridržana tipka za domov odklene takoj."
