tasks.plugin.name = Opravila
tasks.plugin.description = Seznami opravil z roki in prednostmi, v bralniku ali sinhronizirani z vašim strežnikom CalDAV, z gradniki za domači zaslon.
tasks.plugin.how = "Seznami opravil v vašem bralniku: opravila z rokom in prednostjo, ki jih odkljukate, ko so opravljena. Delujejo brez nastavljanja in brez omrežja ter jih je mogoče uskladiti s strežnikom CalDAV (Nextcloud, Radicale, Baïkal, Fastmail in drugi), tako da so isti seznami v telefonu in računalniku.\n\nOpravila odprite v meniju z orodji. Prva vrstica poimenuje prikazani seznam; izberite jo za drug seznam, za Danes in zamujeno prek vseh seznamov, za nov seznam, za sinhronizacijo ali za nastavitev računa. Dodaj opravilo odpre tipkovnico. Izberi pri opravilu ga odkljuka (znova: ni opravljeno). Pridržite opravilo ali pritisnite Meni, da spremenite naslov, rok (danes, jutri, čez teden dni ali datum, ki ga vtipkate, na primer 2026-12-24) ali prednost ali da ga odstranite. Odprta opravila so prva, po dnevu in nato po prednosti; opravljena ostanejo na koncu en teden (nastavljivo pod Opravila v nastavitvah), nato zapustijo bralnik.\n\nGradniki za domači zaslon (pridržite domači zaslon, nato dodajte gradnik): Današnja opravila prikaže, kaj danes zapade ali je zamujeno, Seznam opravil prikaže en seznam, Odprta opravila jih šteje, Naslednje opravilo pa prikaže tisto, ki je na vrsti. Tap na opravilo v gradniku ga odkljuka; tap na naslov odpre sezname.\n\nZa sinhronizacijo v vrstici seznama izberite Račun CalDAV in vnesite naslov strežnika, uporabniško ime in geslo (najbolje geslo za aplikacijo). Dovolj je naslov strežnika, npr. cloud.example.com/remote.php/dav; bralnik od tam najde vaše sezname opravil. Vsak seznam opravil strežnika postane seznam v bralniku. Bralnik sinhronizira, ko odprete Opravila, ko izberete Sinhroniziraj zdaj in ko je omrežje tako ali tako vklopljeno; kar spremenite brez omrežja, počaka in se pošlje pozneje. Če je bilo opravilo medtem spremenjeno v bralniku in drugje, se uporabi različica strežnika, vaša pa ostane ob njej kot novo opravilo, da se nič ne izgubi. Opombe, opomniki in vse drugo, kar ima opravilo na strežniku, ostane nespremenjeno. Ponavljajoča se opravila so prikazana, vendar se spreminjajo tam, kjer ste jih ustvarili. Bralnik sprejme do 200 opravil v 12 seznamih."
