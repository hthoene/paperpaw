transfer.plugin.name = Prenos
transfer.plugin.description = Dajte knjige in druge datoteke v napravo iz brskalnika v istem omrežju.
transfer.plugin.how = "Prenos prek Wi-Fi da knjige in druge datoteke v napravo iz brskalnika v istem omrežju, brez kabla ali aplikacije. Datoteke lahko tudi prenašate, ustvarjate mape in brišete.\n\nOdprete ga med Orodji. Zaslon prikaže naslov kot besedilo in kot kodo QR: odprite ga v brskalniku v telefonu ali računalniku ali skenirajte kodo. Naslov vsebuje ključ, ustvarjen vsakič znova, zato drugi v omrežju ne pridejo do vaših datotek. Prenos teče, dokler je zaslon odprt.\n\nKjer PaperPaw sam upravlja Wi-Fi, kot na X4, Brez usmerjevalnika na dnu odpre lastno omrežje naprave, ki se mu telefon pridruži s skeniranjem kode."
