format-cbz.plugin.name = Stripi
format-cbz.plugin.description = Odpre arhive stripov (.cbz), ena slika na stran.
format-cbz.plugin.how = "Odpre arhive stripov (.cbz): ena slika na stran, prilagojena zaslonu, po vrstnem redu imen (2 pred 10).\n\nDajte jih v mapo knjižnice in jih odprite iz knjižnice; strani obračate kot v vsaki knjigi. Velike slike ob prvem odpiranju potrebujejo trenutek, na X4 več kot drugje.\n\nNastavitve branja (Nastavitve, Branje): „Sličico za sličico“ prikaže naenkrat po eno sličico strani, tako veliko, kot dopušča zaslon, obračanje strani pa koraka skozi njih; stran brez sličic je prikazana v celoti. „Smer strani stripa“ zrcali obračanje strani za mange (od desne proti levi); datoteka ComicInfo.xml v knjigi to določi sama. Knjižnica prikaže naslov knjige ter serijo in številko iz ComicInfo.xml."
format-cbz.title = Strip (CBZ)
format-cbz.setting.direction = Smer strani stripa
format-cbz.setting.direction.help = Manga: obračanje strani je zrcaljeno.
format-cbz.direction.book = Kot določa knjiga
format-cbz.direction.ltr = Od leve proti desni
format-cbz.direction.rtl = Od desne proti levi
format-cbz.setting.panels = Sličico za sličico
format-cbz.setting.panels.help = Ena sličica naenkrat, obračanje strani koraka skozi njih.
format-docx.plugin.name = Dokumenti DOCX
format-docx.plugin.description = Odpre datoteke .docx, kot jih shranjujejo Word in drugi programi.
format-docx.plugin.how = "Odpre dokumente .docx kot knjige: naslove s kazalom, sezname, tabele, krepko in ležeče, povezave in slike (JPEG, PNG, GIF).\n\nDatoteke dajte v mapo knjižnice in jih odprite iz knjižnice. Naslov in avtor prideta iz lastnosti dokumenta. Sprotne opombe, glave in noge ter komentarji se ne prikažejo."
format-docx.title = Dokument DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Odpre knjige EPUB z njihovim oblikovanjem, kazalom in slikami.
format-epub.plugin.how = "Knjige EPUB se odprejo iz knjižnice kot vsaka druga knjiga, z njihovim kazalom, slikami in oblikovanjem založnika. Spletne strani (HTML), Markdown, FictionBook (.fb2) in arhivi stripov (.cbz) se odprejo enako, vsak kot svoj vtičnik.\n\nPoglavje se pretvori ob prvem odpiranju in shrani v predpomnilnik vtičnika, zato je pozneje hitrejše in velike knjige delujejo na majhnih napravah. Kazalo najdete pod Kazalo v meniju za branje. Ali velja oblikovanje same knjige, določa nastavitev Oblikovanje založnika pod Branje."
format-epub.title = E-knjiga EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Odpre knjige FictionBook (.fb2, tudi stisnjene).
format-fb2.plugin.how = "Odpre knjige FictionBook (.fb2), razširjene za ruske in druge knjige, tudi stisnjene (.fb2.zip), z naslovom, avtorji, naslovnico in poglavji.\n\nDajte jih v mapo knjižnice; prikažejo se v knjižnici in se odprejo kot vsaka druga knjiga."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Odpre spletne strani, shranjene kot datoteke, in prikaže samo to, kar je za branje.
format-html.plugin.how = "Odpre spletne strani, shranjene kot datoteke (.html, .htm, .xhtml), kot knjige: samo tisto, kar je za branje, brez menijev, oglasov in podobnega okoli tega.\n\nDatoteko dajte v mapo knjižnice in jo odprite iz knjižnice kot vsako knjigo. Povezave znotraj strani delujejo; slike so prikazane tam, kjer so v datoteki."
format-html.title = Spletna stran (HTML)
format-images.plugin.name = Slike
format-images.plugin.description = Odpre slike (.jpg, .png, .gif) kot knjige, ena stran na sliko.
format-images.plugin.how = "Slike (.jpg, .png, .gif) se odprejo iz knjižnice kot knjige, ena slika na stran, prilagojena zaslonu.\n\nČe želite brati celo mapo slik, odprite njeno prvo sliko: slike za njo v mapi sledijo po vrstnem redu imen (2 pred 10). Poznejša slika se začne tam; mesto branja se za vsako zapomni posebej. Mapa do 300 slik se bere od slike, ki jo odprete.\n\nDatoteka, ki ni slika ali je prevelika, namesto tega prikaže svoje ime. Za knjigo z mnogo slikami z lastnim naslovom je boljša oblika arhiv stripov (.cbz)."
format-images.title = Slika
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Odpre datoteke Markdown (.md), npr. zapiske.
format-markdown.plugin.how = "Odpre datoteke Markdown (.md), na primer zapiske, kot knjige: naslove, sezname, citate in poudarke, kot so mišljeni, ne kot znake.\n\nDatoteke dajte v mapo knjižnice in jih odprite iz knjižnice. Prvi naslov postane naslov knjige; slike ob datoteki se prikažejo tam, kjer jih omenja besedilo."
format-markdown.title = Markdown
format-mobi.plugin.name = Knjige MOBI
format-mobi.plugin.description = Odpre datoteke .mobi in .azw brez DRM.
format-mobi.plugin.how = "Knjige MOBI (.mobi, .azw) se odprejo iz knjižnice kot vsaka knjiga, brez nastavljanja. Naslov, avtorji, jezik in naslovnica pridejo iz knjige, kazalo pa nastane iz njenih naslovov.\n\nKnjiga se pretvori ob prvem odpiranju, kar pri dolgi traja nekaj sekund; potem se odpre takoj. Prikazani so besedilo, naslovi, krepko in ležeče, povezave in slike.\n\nKnjig z DRM (večina knjig, kupljenih v spletni trgovini) ni mogoče odpreti, prav tako ne knjig s stiskanjem Huffman ali v novejši obliki KF8 (.azw3): PaperPaw to pove ob odpiranju. Kopija kot EPUB, narejena z orodjem, kot je Calibre, se vedno odpre."
format-mobi.title = Knjige MOBI
format-rtf.plugin.name = Dokumenti RTF
format-rtf.plugin.description = Odpre datoteke .rtf kot knjige.
format-rtf.title = Dokumenti RTF
format-txt.plugin.name = Navadno besedilo
format-txt.plugin.description = Odpre navadne besedilne datoteke (.txt).
format-txt.plugin.how = "Navadne besedilne datoteke (.txt) se odprejo iz knjižnice kot vsaka knjiga, brez nastavljanja. Vtičnik bere besedilo UTF-8, UTF-16 in Windows-1252 ter samodejno prepozna kodiranje.\n\nOdstavki sledijo praznim vrsticam v datoteki; če jih datoteka nima, je vsaka vrstica odstavek. Pri datotekah Project Gutenberg je licenčno besedilo na začetku in koncu izpuščeno, naslov in avtor pa sta vzeta iz glave.\n\nDatoteka se nikoli ne naloži v celoti, zato se zelo velika besedila odprejo tudi na majhnih napravah."
format-txt.title = Navadno besedilo
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Odpre knjige XTC in XTCH, vnaprej izrisane strani bralnikov Xteink.
format-xtc.plugin.how = "Datoteke XTC in XTCH so knjige, katerih strani so že izrisane kot slike, kot jih ustvarjajo pretvorniki za bralnike Xteink. Odprejo se iz knjižnice kot vsaka knjiga.\n\nKer je vsaka stran fiksna slika, velikosti besedila ni mogoče spremeniti ali ga postaviti v drugo pisavo. Strani so črno-bele ali imajo štiri sivine. Vsaka stran se dekodira šele, ko je prikazana, zato potrebuje malo pomnilnika, tudi na X4.\n\nNaslov, avtor in poglavja so vzeti iz datoteke, če jih ima."
format-xtc.title = Strani XTC
help.plugin.name = Namigi
help.plugin.description = Ob prvem odprtju zaslona pokaže, kaj počnejo njegovi upravljalni elementi.
help.plugin.how = "Ob prvem odprtju zaslona kratka opomba čez njega pove, kaj počnejo njegovi upravljalni elementi: deli zaslona, na katere deluje tap, so uokvirjeni, pove pa tudi, kaj počnejo tipke.\n\nTap ali katera koli tipka opombo zapre in za ta zaslon se ne vrne več. Nič več namigov izklopi vse.\n\nV nastavitvah pod Sistem Namigi vklopijo ali izklopijo namige, Znova pokaži namige pa še enkrat prikaže opombo vsakega zaslona."
