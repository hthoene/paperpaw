koreader.plugin.name = Deljenje poudarkov
koreader.plugin.description = Deli zaznamke in poudarke s KOReader za knjige, ki jih berete v obeh.
koreader.plugin.how = "Ta vtičnik deli zaznamke in poudarke s KOReader za knjige, ki jih berete v obeh, na eni napravi ali v mapi knjižnice, sinhronizirani med napravami. Nastavljati ni treba ničesar.\n\nKo PaperPaw odpre knjigo, ki jo je odprl tudi KOReader, in ko spremenite njene zaznamke ali poudarke, prevzame novosti iz podatkov KOReader ob knjigi, novosti od tu pa pusti KOReaderju, da jih pobere ob naslednjem odprtju knjige. Odstranjene oznake in spremenjene opombe prav tako preidejo.\n\nTo velja samo za knjige EPUB. Če datoteke ene strani ni mogoče prebrati, se na nobeni strani nič ne spremeni, dokler ni spet mogoče."
