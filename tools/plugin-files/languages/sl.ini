rules.plugin.name = Pravila
rules.plugin.description = Ko se nekaj zgodi, naredi nekaj: npr. nočni način ob 22:00.
rules.plugin.how = "Pravilo samo naredi nekaj, ko se nekaj zgodi: nočni način vsak dan ob 22:00 ali sinhronizacija katalogov ob zagonu PaperPaw.\n\nPravila so v Nastavitvah pod Prilagoditev, kot Pravila. Dodaj pravilo vpraša Kdaj? (PaperPaw se zažene, ura v dnevu, knjiga se odpre ali zapre, baterija, polnjenje, stikalo in več) in Kaj potem? (izvedi dejanje, vklopi ali izklopi stikalo, nastavi število, pokaži sporočilo). Tapnite pravilo, da ga začasno ustavite; pridržite ga (s tipkami pridržite Izberi) za pogoj, kot je Med dvema urama v dnevu, ali za odstranitev.\n\nDejanja, stikala in števila za izbiro so razvrščena po vtičnikih: najprej izberite vtičnik, nato kar prinaša; Nazaj spet pelje ven. Dejanje, ki deluje na prikazan zaslon, na primer Nazaj ali Naslednja stran, stori to, kar bi storilo tam.\n\nUre veljajo, kateri koli zaslon je odprt. Dve pravili, ki se medsebojno razveljavljata, se po nekaj korakih ustavita."
