battery.plugin.name = Poraba baterije
battery.plugin.description = Beleži baterijo in pokaže, kako dolgo zdrži.
battery.plugin.how = "Poraba baterije približno vsako minuto zabeleži napolnjenost, dokler je naprava aktivna, skupaj s tem, kaj je počela: osvežitve zaslona in obrnjene strani. Iz tega izračuna, koliko porabita ura aktivnosti in 100 strani ter kako dolgo baterija zdrži s takšnim tempom.\n\nBaterijo odprete v meniju Orodja. Prikaže napolnjenost zdaj, ta čas aktivnosti, doslej porabo na bateriji in vaše zadnje čase aktivnosti. Listate s tipkama za listanje ali s tapom na puščici na vrhu.\n\nPotrebuje nekaj časa branja na bateriji, da številke kaj povedo. Beleženje je sprva vklopljeno in ga lahko izklopite v Nastavitvah, pod Naprava, Napajanje, kot Beleži porabo baterije."
