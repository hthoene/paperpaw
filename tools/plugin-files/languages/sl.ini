puzzles.plugin.name = Uganke
puzzles.plugin.description = Sudoku, križanke in šahovske naloge, brez povezave, z uganko dneva.
puzzles.plugin.how = "Uganke za vlak in čakalnico, vse brez povezave: sudoku, križanke in šahovske naloge. Uganke odprite v meniju z orodji ali dodajte gradnik Uganka dneva na domači zaslon (pridržite domači zaslon, nato dodajte gradnik): prikaže, kako daleč je današnji sudoku, tap pa ga odpre. Sudoku dneva je ves dan isti.\n\nSudoku: Levo in Desno premikata kazalec polje za poljem, Gor in Dol (tipki za listanje) za vrstico. Izberi odpre števke: izberite eno in znova Izberi, da jo vpišete, ali Počisti, da polje izpraznite. Pridržite Izberi (ali Meni), da pridete do gumbov pod ploščo: Beležke spremenijo števke v svinčniške oznake, Preveri označi napačna polja, Razveljavi vzame nazaj zadnjo potezo, Novo začne uganko izbrane stopnje (Lahko, Srednje, Težko). Vsaka uganka ima natanko eno rešitev. Igra se ob odhodu ohrani. Na zaslonu na dotik tapnite polje.\n\nKrižanke: datoteke .puz (Across Lite) ali .ipuz dajte v mapo „puzzles“ na pomnilniški kartici; nobena ni priložena. Premikajte se po mreži, nato izberite, da na tipkovnici vtipkate besedo pod kazalcem (podčrtaj pusti polje prazno). Gumbi preklapljajo med vodoravno in navpično, prikažejo seznam opisov, preverijo črke in razkrijejo besedo. Črke se za vsako datoteko ohranijo. Šifriranih datotek .puz ni mogoče odpreti.\n\nŠahovske naloge: majhen nabor iz zbirke nalog Lichess (CC0). Levo in Desno skačeta od figure do figure, izberite figuro, s katero želite igrati, nato z Levo in Desno po ciljnih poljih in znova Izberi. Napačna poteza se vzame nazaj. Namig označi figuro, ki mora igrati, Naprej gre na naslednjo nalogo.\n\nPlošča na novo nariše samo polja, ki se spremenijo. Statistika šteje rešene uganke."
