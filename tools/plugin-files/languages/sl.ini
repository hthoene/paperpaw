weather.plugin.name = Vreme
weather.plugin.description = Vreme zdaj in v naslednjih dneh kot gradniki, iz Open-Meteo.
weather.plugin.how = "Vreme prikazuje vreme zdaj in v naslednjih dneh kot gradnike za domači zaslon, iz Open-Meteo, ki ne potrebuje računa ali ključa. Vreme zdaj prikaže temperaturo, stanje in več za izbiro; Napoved prikaže naslednje dni v vrsti ali na seznamu.\n\nNajprej izberite kraj: v nastavitvah pod Vreme, Kraj (vtipkajte ime, nato ga izberite med najdenimi kraji). Pošljejo se samo njegove koordinate in samo dokler je prikazan gradnik vremena. Gradnike dodate z urejanjem domačega zaslona.\n\nVreme se prenese največ tako pogosto, kot določa Posodobi največ vsakih, in samo ob prisotnem omrežju: Wi-Fi nikoli ne vklopi sam.\n\nPodatki o vremenu: Open-Meteo.com (https://open-meteo.com), pod licenco Creative Commons Priznanje avtorstva 4.0 (CC BY 4.0)."
