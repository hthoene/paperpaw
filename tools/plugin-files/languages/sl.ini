fonts-browser.plugin.name = Več pisav
fonts-browser.plugin.description = Prikaže pisave z interneta, vsako z vzorcem, in jih prenese za branje.
fonts-browser.plugin.how = "Več pisav našteje pisave iz knjižnice pisav na internetu, vsako ime v njegovi lastni pisavi, in prenese tiste, s katerimi želite brati.\n\nNajdete jih na koncu seznama pisav, kjer izberete pisavo za branje: v Nastavitvah, pod Branje, kot Pisava; statusne vrstice imajo isti vnos za svojo pisavo. Tapnite pisavo (s tipkami pritisnite Izberi), da jo vidite večjo z vzorčnim stavkom, nato izberite Prenesi. Med prenosom lahko stran zapustite. Ko je končano, izberite Beri s (ime pisave) ali Uporabi za statusne vrstice. Posodobi prenese novejšo različico, Odstrani izbriše pisavo iz naprave.\n\nPotrebuje Wi-Fi.\n\nLASTNE PISAVE\n\nTik ob Več pisav ima isti seznam vnos Lastne pisave, ki prikaže ta del pomoči. Lastna pisava je datoteka .ttf ali .otf, na primer iz Google Fonts.\n\nNa Androidu in drugih napravah, ki izrisujejo datoteke pisav: kopirajte datoteko v mapo fonts (na Androidu: PaperPaw/fonts v skupni shrambi), znova zaženite PaperPaw in izberite pisavo v Nastavitvah, pod Branje, kot Pisava.\n\nNa Xteink X4 in X4 Pro: ta bralnika bereta pakete pisav, ne datotek pisav, ker datoteke pisav ne bi šle v njun pomnilnik. Paket naredite v računalniku s paperpaw-fontgen, za vsak slog, ki ga imate (navaden je potreben):\n\npaperpaw-fontgen --family \"Moja pisava\" --regular MojaPisava-Regular.ttf --bold MojaPisava-Bold.ttf --italic MojaPisava-Italic.ttf plugins\n\nTo ustvari mapo plugins/font-moja-pisava. Kopirajte jo v mapo plugins na pomnilniški kartici, znova zaženite in izberite Moja pisava kot Pisava. Paket z enim slogom ima za latinične črke približno pol megabajta; slogi, ki jih izpustite, se izrišejo v navadnem. Orodje pove, koliko od zahtevanih znakov ima pisava (--chars latin,cyrillic,greek doda pisave): pisava brez črk vaše knjige jih ne more prikazati, zato poiščite takšno, ki pokriva njeno pisavo.\n\nPisave iz Več pisav delujejo enako in ne potrebujejo računalnika.\n\nZa ostrejše majhno besedilo na zaslonu z e-črnilom ukazu dodajte --hinting light: črke prilagodi pikčasti mreži, kot so narejene privzete pisave. Brez tega so črke izrisane, kot jih je zasnovala pisava; --hinting normal in --hinting mono jih prilagodita močneje. Pisave z znaki nad ali pod črkami, kot sta arabščina ali devanagari, je bolje pustiti brez tega."
