aids.plugin.name = Pripomočki za branje
aids.plugin.description = Krepki začetki besed, zamenjane besede, slike: besedilo, kot ga želite.
aids.plugin.how = "Pripomočki za branje spremenijo videz besedila knjige med branjem. Veljajo za vse knjige. Krepki začetki besed in Zamenjava besed sta sprva izklopljena.\n\nNajdete jih v Nastavitvah, pod Branje, v razdelku Pripomočki za branje. Krepki začetki besed prvo polovico vsake besede postavijo krepko, kar nekaterim olajša sledenje. Zamenjava besed sprejme pare, zapisane kot „skos = skozi; tud = tudi“, ločene s podpičji.\n\nZamenjajo se samo cele besede, natanko tako, kot ste jih zapisali, zato „tud“ nikoli ne spremeni dela daljše besede. Sama datoteka knjige se ne spremeni.\n\nSlike v knjigah lahko prikažete (kot na začetku), spremenite v kratko vrstico, kot je „[Slika: ladja na morju]“, ki uporabi opis slike, ali izpustite. Stran ima potem več prostora za besedilo, za sliko, ki ni prikazana, pa se nič ne dekodira, zato se strani obračajo hitreje. Stripi in druge knjige iz slik se ne spremenijo."
