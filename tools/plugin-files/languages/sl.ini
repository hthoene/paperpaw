widgets.plugin.name = Paket gradnikov
widgets.plugin.description = Veliko dodatnih gradnikov za domači zaslon: ure, koledar, citati, knjige, opombe in več.
widgets.plugin.how = "Paket gradnikov doda veliko gradnikov za domači zaslon: ure (analogna, besedna, ploščice, svetovna), koledar, leto doslej, odštevanje, lunine mene ter dan in datum; citat dneva, opombe, opravila, slike, pozdrav in logotip PaperPaw; za knjige pa Zdaj berem, napredek, naslednja na vrsti, serija, priljubljene, poudarek in knjižnica v številkah. Vključen je tudi gradnik baterije.\n\nDodajte jih z Uredi domači zaslon v meniju (ali z dolgim pritiskom na domači zaslon), nato Dodaj gradnik. Vsak ima svoje nastavitve, kot so okvir, velikost in poravnava. Izbira gradnika, ki se spreminja, kot je citat dneva, prikaže naslednjega. Lastni citati gredo v quotes.txt v .paperpaw/plugins/widgets na kartici, vsaka vrstica kot besedilo | avtor. Gradniki časa potrebujejo nastavljeno uro; Wi-Fi jo nastavi."
