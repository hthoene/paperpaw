files.plugin.name = Pregledovalnik datotek
files.plugin.description = Prikaže knjige in mape v napravi ter jih odpre.
files.plugin.how = "Knjižnica našteje knjige v mapi vaše knjižnice, vsako z naslovnico, naslovom, avtorjem in tem, koliko ste je prebrali. Knjiga, ki ste jo nazadnje brali, stoji na vrhu kot kartica, zato je za nadaljevanje branja dovolj en tap ali en pritisk na Izberi. Medtem ko knjižnica išče knjige, pove, koliko jih je doslej našla.\n\nNad knjigami izberete, kaj je prikazano: vse, tiste, ki jih berete, neprebrane ali prebrane, ali police (po avtorju, seriji, oznaki, priljubljene, naslednja knjiga vsake začete serije). Tapnite knjigo, da jo preberete; pridržite jo (s tipkami pridržite Izberi), da jo odprete, označite kot prebrano ali neprebrano, vidite njene podatke, jo premaknete v arhiv ali izbrišete. Tapnite naslov za meni knjižnice: kako so knjige razvrščene in prikazane, iskanje, mapa knjižnice in nastavitve.\n\nMapo knjižnice nastavite v Nastavitvah, pod Knjižnica, kot Mapa knjižnice; tam lahko knjige prikažete tudi kot mrežo naslovnic. Za vse druge datoteke uporabite Datoteke v meniju Orodja."
