stats.plugin.name = Statistika branja
stats.plugin.description = Beleži, kako dolgo in koliko berete, s koledarjem in številkami vsake knjige.
stats.plugin.how = "Statistika branja beleži, kako dolgo berete posamezno stran. Vidite jo kot pregled z današnjim dnem, tednom in nizom, kot koledar in s številkami vsake knjige.\n\nOdprete jo med Orodji ali v bralniku pod Več. V nastavitvah pod Statistika branja lahko izklopite Beleži branje, nastavite Dnevni cilj ter določite Najkrajšo stran in Najdaljšo stran, ki se štejeta, da prelistavanje ali odprta knjiga ne popačita številk.\n\nSinhroniziraj s KOReader deli statistiko s KOReader prek mape WebDAV. Prevzame tudi statistiko KOReader na isti napravi. Za beleženje mora biti ura nastavljena: če ni, se enkrat povežite z Wi-Fi."
