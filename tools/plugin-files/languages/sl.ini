settings.plugin.name = Nastavitve
settings.plugin.description = Strani z nastavitvami, ustvarjene iz nastavitev vseh vtičnikov.
settings.plugin.how = "Nastavitve prikažejo vse, kar je mogoče nastaviti v PaperPaw in njegovih vtičnikih, po straneh. Vtičniki ne potrebujejo lastnega zaslona: kar prijavijo, se prikaže tukaj, v skupinah, z opisom pod vsako nastavitvijo.\n\nOdprete jih z Nastavitve v meniju. Tapnite skupino, da jo odprete, nato nastavitev, da jo preklopite ali izberete; števila imajo gumba − in +. S tipkami se premaknite na nastavitev in pritisnite Izberi: Levo in Desno spremenita število, Izberi ga obdrži, Nazaj povrne prejšnjo vrednost.\n\nSpremembe veljajo takoj. Iskanje najde nastavitev po besedah, Napredne nastavitve doda tiste, ki jih redko potrebujete. Ponastavi na privzeto in Ponastavi vse prej vprašata."
