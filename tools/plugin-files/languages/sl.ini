profiles.plugin.name = Profili branja
profiles.plugin.description = Poimenovani nabori nastavitev branja in prikaza, preklopljeni s tapom.
profiles.plugin.how = "Profil hrani vaše nastavitve branja, nastavitve prikaza in statusne vrstice pod imenom, na primer Nočni ali Velike črke, in jih s tapom povrne.\n\nProfile odprite v meniju za branje pod Več ali v Nastavitvah pod Prilagoditev. Tapnite profil, da ga uporabite; tisti v uporabi je označen. Pridržite ga (s tipkami pridržite Izberi), da vanj shranite trenutne nastavitve, ga preimenujete ali odstranite. Shrani kot nov profil ohrani, kar je zdaj nastavljeno.\n\nNaslednji profil preklopi na naslednjega na seznamu; dajte ga na tipko ali v pravilo."
