dictionary.plugin.description = Išče besede v slovarjih StarDict.
dictionary.plugin.how = "Slovar poišče besedo iz knjige v slovarjih StarDict in prikaže razlage v plošči nad spodnjim delom zaslona.\n\nV bralniku pridržite besedo in izberite Poišči; s tipkami uporabite Izberi besedilo pod Več. Mape slovarjev (z datotekami .ifo, .idx in .dict) kopirajte v mapo „dictionaries“ v napravi, podmape so dovoljene, ali pa izberite drugo mapo v Nastavitvah, pod Branje, kot Mapa slovarjev (napredna nastavitev). Pri prvem iskanju se za vsak slovar pripravi majhen indeks, kar traja trenutek.\n\nV plošči dolge razlage pomikata tipki za listanje ali Gor in Dol, Nazaj jo zapre. Z dotikom jo zaprete s tapom zunaj nje."
