sleep.plugin.name = Zaslon spanja
sleep.plugin.description = Prikaže speče mačko, naslovnico knjige, vaše slike ali sporočilo, medtem ko naprava spi.
sleep.plugin.how = "Zaslon spanja določa, kaj zaslon prikazuje, medtem ko naprava spi. E-črnilo ohrani sliko brez napajanja.\n\nIzberete ga v nastavitvah, pod Naprava, Zaslon spanja, z Prikaz: speča mačka (privzeto), naslovnica knjige, moje slike, logotip in „Spanje“, gradniki, stran, kot je, ali stran s sliko. Moje slike prikaže datoteke iz mape s slikami eno za drugo.\n\nBrez naslovnice ali slike se prikaže mačka. Kjer zaslon spanja nariše sam sistem, so te nastavitve skrite.\n\nZaslon ob izklopu, Prikaz ob izklopu, se nariše enkrat, ko se naprava izklopi, iz menija Napajanje ali po času Izklopi po spanju (ne, ko izpraznjena baterija prekine napajanje). Je enak zaslonu spanja, razen če izberete logotip in „Izklopljeno“, mačko, naslovnico ali moje slike. Drug vtičnik lahko zanj ponudi zaslon.\n\nZaslon ob zagonu in ponovnem zagonu, Prikaz ob zagonu in Prikaz ob ponovnem zagonu, je lasten napravi, razen če zanju drug vtičnik ponudi zaslon. Medtem ko se naprava zaganja, vtičniki še ne tečejo: zaslon, izbran za zagon, se vnaprej nariše, ko se naprava izklopi ali znova zažene, in prikaže ob naslednjem zagonu. Zaslon, ki ni pravočasno pripravljen, ali poškodovana slika, ustreže zaslonu naprave; naprava se v vsakem primeru izklopi ali znova zažene."
