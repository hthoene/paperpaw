file-manager.plugin.name = Upravljalnik datotek
file-manager.plugin.description = Vse mape in datoteke v napravi: odpiranje, preimenovanje, premikanje, kopiranje in brisanje.
file-manager.plugin.how = "Upravljalnik datotek prikaže vsako mapo in datoteko v shrambi naprave, ne samo vaših knjig, ter vam omogoča, da jih odpirate, preimenujete, premikate, kopirate in brišete ter ustvarjate nove mape.\n\nDatoteke odprete v meniju Orodja. Tapnite mapo, da vstopite vanjo; Nazaj vodi v mapo nad njo. Tapnite datoteko ali pridržite katero koli vrstico (s tipkami pridržite Izberi), da vidite, kaj je mogoče storiti z njo. Premakni in Kopiraj si zapomnita vnos: pojdite v mapo, kamor spada, in v vrstici na dnu izberite Prilepi sem. S tipkami pridete v vrstico, če pritisnete Dol pri zadnjem vnosu.\n\nDatoteke in mape, ki se začnejo s piko, na primer lastni podatki PaperPaw, so skrite. Da jih vidite, vklopite Skrite datoteke v Nastavitvah, pod Knjižnica."
