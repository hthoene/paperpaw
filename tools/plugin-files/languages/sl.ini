anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Uči se zapadlih kartic iz Anki v vašem računalniku in vaše odgovore pošlje nazaj prek dodatka AnkiConnect.
anki.plugin.how = "Anki vam omogoča, da na bralniku učite kartice, ki so v Anki v vašem računalniku zapadle, in pošilja vaše odgovore nazaj. Uporablja brezplačni dodatek AnkiConnect (koda dodatka 2055492159) in nikoli AnkiWeb. Sprva je izklopljen: dodajte ga iz trgovine z vtičniki.\n\nV računalniku: namestite AnkiConnect v Anki (Orodja, Dodatki, Pridobi dodatke) in znova zaženite Anki. Anki mora biti med sinhronizacijo odprt.\n\nAnkiConnect privzeto odgovarja samo računalniku, v katerem teče (127.0.0.1), zato bralnik do njega ne more. Odprite Orodja, Dodatki, AnkiConnect, Konfiguracija in nastavite „webBindAddress“ na „0.0.0.0“ (poslušanje v domačem omrežju). Vrata, „webBindPort“, so 8765, dokler jih ne spremenite. Če tam nastavite „apiKey“, tukaj vnesite isti ključ. Po spremembi konfiguracije znova zaženite Anki in dovolite Anki v požarnem zidu računalnika, če vpraša. To uporabljajte samo v omrežju, ki mu zaupate: do AnkiConnect lahko dostopa vsak v njem, zato je ključ priporočljiv.\n\nNa bralniku: odprite Anki v Orodjih, nato pod Računalnik vnesite naslov računalnika (na primer 192.168.1.20), vrata, če niso 8765, in ključ API, če ste ga nastavili. Izberite kupček ali pustite prazno za vse kupčke. Nato izberite Sinhroniziraj z Anki, z vklopljenim Wi-Fi: najprej se pošljejo čakajoči odgovori, nato se prenesejo zapadle kartice (in toliko novih, kot ste nastavili), največ 50. Izberite Učenje, da jih predelate brez omrežja: pokažite odgovor in ga ocenite z Znova, Težko, Dobro ali Lahko. Vaši odgovori ostanejo shranjeni na bralniku, tudi brez Wi-Fi, in gredo v Anki ob naslednji sinhronizaciji. Anki odloči, kdaj se kartica vrne: kartica, na katero ste odgovorili z Znova, se ob poznejši sinhronizaciji znova prenese, ko Anki sporoči, da je zapadla.\n\nSinhroniziraj ob odpiranju v nastavitvah sinhronizira vsakič, ko odprete zaslon. Pritisk tipke nikoli ne uporabi omrežja."
