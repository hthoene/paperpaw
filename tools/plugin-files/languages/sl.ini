keys.plugin.name = Tipke in kretnje
keys.plugin.description = Kaj počne vsaka tipka, območje tapa in poteza, spremenjeno v napravi.
keys.plugin.how = "Tipke in kretnje prikaže, kaj počne vsaka tipka, območje tapa in poteza, ter vam omogoča, da to spremenite v napravi.\n\nOdprete jih v nastavitvah, pod Naprava. Najprej izberite, kje velja sprememba: Povsod, Med branjem, Na domačem zaslonu, V knjižnici ali v enem orodju. Nato izberite vnos, na primer pridržano tipko ali potezo z roba, in dejanje s seznama, ki ga lahko preiščete. Kot privzeto vrne to, kar določajo vtičniki in razporeditev tipk.\n\nNa X4 je sprememba, po kateri ne bi ostala nobena tipka za izbiro, vrnitev nazaj ali premik naprej, zavrnjena. Ponastavi tipke in kretnje na koncu prekliče vse spremembe."
