home.plugin.name = Domači zaslon
home.plugin.description = Začetna stran: strani z gradniki, kot sta knjiga, ki jo berete, in orodja.
home.plugin.how = "Domači zaslon je sestavljen iz strani, vsaka je mreža gradnikov in orodij kot v telefonu. Sprva so ura, knjiga, ki jo berete, in nazadnje prebrane knjige na eni strani, vsa orodja pa na naslednji.\n\nTapnite element, da ga odprete, in podrsajte ali uporabite tipki za listanje za menjavo strani. Samo s tipkami se puščične tipke premikajo od elementa do elementa, Izberi ga odpre.\n\nZa preurejanje pridržite domači zaslon, tapnite svinčnik pod stranjo ali v meniju izberite Uredi domači zaslon. Elemente povlecite, da jih premaknete, ali tapnite enega za njegove možnosti, tudi s tipkami. Tam je tudi Dodaj gradnik. Stolpci in Vrstice so v nastavitvah, pod Videz, v razdelku Domači zaslon.\n\nNa zaslonu, obrnjenem na bok, domači zaslon prikaže iste elemente z več stolpci, vsaka stran je polna, preden se začne naslednja, kartice pa niso širše od približno 110 mm; nič, kar ste uredili pokončno, se ne spremeni. Če ga uredite na boku, se ta postavitev za to usmeritev ohrani posebej: novi gradniki se dodajo v obe. Ponastavi ležečo postavitev pod Dodaj (med urejanjem) se vrne k izpeljani. Odstranitev gradnika ali orodja v eni usmeritvi ga ne odstrani iz druge."
