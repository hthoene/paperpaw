opds.plugin.name = Katalogi OPDS
opds.plugin.description = Brska po katalogih OPDS, prenaša njihove knjige in ohranja mape sinhronizirane z njimi.
opds.plugin.how = "Katalogi OPDS so spletne knjižnice, kot so Project Gutenberg, Calibre-Web, Kavita ali Komga. Ta vtičnik po njih brska in išče kot po mapah ter njihove knjige prenaša v knjižnico.\n\nKataloge odprite v meniju Orodja in izberite Dodaj katalog: naslov in, če katalog potrebuje račun, uporabniško ime in geslo. Tapnite katalog, da brskate po njem; pridržite ga (s tipkami pridržite Izberi), da ga sinhronizirate, uredite ali odstranite.\n\nČe je vklopljeno Sinhroniziraj ta katalog, Sinhroniziraj kataloge prenese njegove nove knjige v njegovo mapo. Knjig na sinhronizacijo omeji, koliko jih prenese ena sinhronizacija, da velik katalog ne napolni naprave. Namesto kataloga deluje tudi Mapa v oblaku (WebDAV)."
