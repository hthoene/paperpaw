update.plugin.name = Posodobitev
update.plugin.description = Namesti posodobitve firmwara, s kartice ali prenesene z interneta.
update.plugin.how = "Posodobitev namesti nov firmware, na napravah, kjer je PaperPaw firmware, kot je X4. Najdete jo v nastavitvah, kot Posodobitev.\n\nIšči na spletu vpraša strežnik za posodobitve za novejši PaperPaw in ga prenese, kar prek Wi-Fi traja nekaj minut. Ali pa kopirajte datoteko s posodobitvijo (s končnico .bin, s paperpaw.org) v mapo updates na kartici, na primer s Prenosom prek Wi-Fi. Namesti nato traja približno minuto in naprava se znova zažene; knjige, nastavitve in mesta branja ostanejo.\n\nČe je vklopljeno Išči posodobitve (v nastavitvah, sprva izklopljeno), naprava približno enkrat na teden sama vpraša, le ko je Wi-Fi tako ali tako vklopljen ali se polni. Novejši PaperPaw, ki ga najde, čaka tu; nič ne moti vašega branja. Iskanje pošlje, kaj teče v napravi, brez imena ali številke naprave; za štetje naprav tudi, ali ste vprašali in ali je to njeno prvo iskanje na dan, teden ali mesec.\n\nČe vtičniki, ki jih uporabljate, še nimajo različice za novo izdajo, posodobitev počaka nanje. Starejša različica se namesti samo, če jo izberete.\n\nTudi drug firmware, kot je CrossPoint, je mogoče namestiti od tu: njegovo datoteko (s končnico .bin) dajte v mapo updates in odprite Posodobitev. PaperPaw preveri, da je to celoten, nepoškodovan firmware za to napravo, ne more pa povedati, kdo ga je naredil, ker ni podpisan. Vseeno namesti ga zapiše v drugo polovico flasha in naprava ga zažene; PaperPaw ostane v svoji polovici, dokler ta firmware ne namesti česa čezenj. Za vrnitev k PaperPaw pozneje namestite njegovo namestitveno datoteko (paperpaw-<naprava>-<različica>-install.bin) iz menija drugega firmwara, na primer iz posodobitve firmwara s kartice SD v CrossPoint."
