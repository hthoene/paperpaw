reader.plugin.name = Bralnik
reader.plugin.description = Prikazuje knjige stran za stranjo, s kazalom in nastavitvami branja.
reader.plugin.how = "Bralnik prikazuje knjige stran za stranjo. Knjigo odprite iz knjižnice; zadnja knjiga se lahko ob zagonu znova odpre (nastavitev Ob zagonu odpri zadnjo knjigo).\n\nZa obračanje strani tapnite levo ali desno stran zaslona ali uporabite tipki za listanje. Tapnite sredino ali pritisnite Izberi za meni za branje: Kazalo, Iskanje, Pojdi na stran, Pisava in postavitev, Zaznamki in poudarki in več. Z zgornjega roba navzdol se odpre hitri dostop, s spodnjega roba navzgor gre domov; enako stori pridržan Nazaj.\n\nPridržite Izberi (ali pridržite sliko), da sliko vidite čez cel zaslon: Levo in Desno koračita skozi slike strani. Izberi poveča na 2x, 3x in nazaj (na dotik dvojni tap); povečano Levo in Desno pomikata vstran, tipki za listanje (ali poteze) gresta naprej, počez in nato navzdol. Nazaj vrne na prilagoditev, nato na stran (na dotik pridržite za izhod). Tapnite zgornji desni kot za zaznamek. Pridržite besedo, da jo poudarite. S tipkami pridržite Levo: Levo in Desno nato premikata po besedah, tipki za listanje po vrsticah, pridržani pa na robove strani in po odstavkih; Izberi odpre vrstico za poudarjanje besede, pridržan Izberi razširi na stavek in odstavek (nato Levo in Desno premikata konec, pridržani začetek). Izbor se nadaljuje prek obračanja strani. Izvozi kot Markdown shrani vaše opombe."
