vocabulary.plugin.name = Besedišče
vocabulary.plugin.description = Hrani besede, ki jih poiščete, z njihovimi stavki, in preverja kartice z razmaknjenim ponavljanjem, narejene v telefonu.
vocabulary.plugin.how = "Besedišče hrani besede, ki jih poiščete med branjem, vsako z njenim stavkom, za pozneje. Seznam najdete med Orodji, najnovejše najprej; izberite besedo, da jo poiščete znova. Zadnja vrstica, Izvozi, jih shrani za aplikacije s karticami, kot je Anki. Seznam hrani najnovejših 2.000 besed: čez to najstarejše izginejo, zato jih prej izvozite, da jih obdržite vse.\n\nKartice, prav tako med Orodji, vas sprašujejo z razmaknjenim ponavljanjem: po Pokaži odgovor vsako kartico ocenite z Znova, Težko, Dobro ali Lahko, to pa določi, kdaj se vrne. Kupčke ustvarite z Urejanje s telefonom: skenirajte kodo s telefonom v istem omrežju Wi-Fi, nato tipkajte kartice ali dodajte veliko naenkrat: tam odprite kupček, izberite Več kartic naenkrat in izberite datoteko CSV, TSV ali TXT (ena kartica v vsaki vrstici: sprednja stran, zadnja stran, primer; UTF-8), prilepite seznam ali prinesite kupček Anki (.apkg, izvožen z Podpiraj starejše različice Anki). \n\nAli pa uporabite datoteke na kartici SD: za vsak kupček dajte datoteko CSV, TSV ali TXT ali kupček Anki (.apkg, izvožen z Podpiraj starejše različice Anki) v mapo Flashcards (Angleščina.tsv naredi kupček Angleščina; ena kartica v vsaki vrstici: sprednja stran, zadnja stran, primer; shranjeno kot UTF-8; prva vrstica lahko poimenuje stolpce front, back, example). Izberite Kartice na kartici SD pod Kartice ali pa pustite, da se zgodi, ko odprete Kartice. Kupčki ostanejo v bralniku s tem, kar ste se naučili, datoteka pa se vključi v svoj kupček, kadar je nova ali spremenjena: spremenite zadnjo stran ali primer kartice v datoteki in kartica se spremeni ter obdrži napredek; spremenite besedilo sprednje strani in to šteje za novo kartico, stara se začne znova (kartice se ločijo po besedilu sprednje strani; presledki in velike črke ne štejejo); vrstica, ki jo izbrišete, kartice ne izbriše (razen če za ta kupček nastavite „kartice, ki manjkajo v datoteki“ na Odstrani: tedaj se kartica ob naslednji posodobitvi odstrani z napredkom za vedno, in nič se ne odstrani, dokler katere vrstice datoteke ni mogoče prebrati). Kupček shranite v njegovo datoteko s Shrani na kartico: datoteka dobi številke kartic (stolpec id), tako da lahko sprednje strani urejate v računalniku in kartice obdržijo, kar ste se naučili; datoteka obdrži samo id, sprednjo stran, zadnjo stran in primer (drugi stolpci, komentarji in vrstni red vrstic se ne ohranijo), shranjevanje pa je zavrnjeno, dokler katere vrstice datoteke ni bilo mogoče prebrati; datoteka, ki je bila tam, se prvič kopira v _ime.bak.tsv (poznejše shranjevanje te kopije ne nadomesti). Datoteka čez 4 MiB ali 20.000 vrstic se ne prebere in mora biti shranjena kot CSV UTF-8, ne UTF-16. Ob prvi uporabi bralnik ustvari mapo z opombo, kako deluje.\n\nV nastavitvah pod Branje „Iz poiskanih besed naredi kartice“ vsako poiskano besedo da v kupček Poiskano."
