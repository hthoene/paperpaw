picture-home.plugin.name = Domači zaslon s sliko
picture-home.plugin.description = Domači zaslon z vašo lastno sliko za gradniki in statusnim pasom, ki ga nastavite.
picture-home.plugin.how = "Domači zaslon s sliko nadomesti domači zaslon, dokler je vklopljen: vaša lastna slika za gradniki ter strani z gradniki in orodji, ki jih uredite. Izklopite ga v upravljalniku vtičnikov in vgrajeni domači zaslon je spet tu, s svojimi stranmi.\n\nSlike (JPEG, PNG ali GIF) dajte v mapo na kartici (privzeto wallpapers), nato eno izberite v Nastavitve, Prilagoditev, Domači zaslon s sliko. Prilagoditev določa, kako zapolni zaslon (zapolni, cela slika, raztegni, izvirna velikost, ploščice), Položaj, kateri del ostane, Povečava, kako velika je, in Posvetli sliko, kako bleda je: bledejša slika olajša branje gradnikov. Slika se pripravi enkrat za vsako velikost zaslona, kar traja trenutek.\n\nGradniki so na ploščah nad sliko. Stran uredite kot na vgrajenem domačem zaslonu: s svinčnikom pod stranjo ali z Uredi domači zaslon v meniju.\n\nStatusni pas (ura, Wi-Fi, baterija ali kar izberete) je lahko vklopljen, izklopljen ali samodejen, zgoraj ali spodaj, čez celotno širino ali kot majhna kapsula levo, na sredini ali desno, na svetli, temni ali sivi plošči ali kar na sliki. Vrstica z imeni tipk (na X4) je prav tako lahko vklopljena, izklopljena ali samodejna. Samodejno pomeni, da jo pritisk tipke prikaže za nekaj sekund; ta pritisk ne naredi nič drugega.\n\nPrikaz slike določa, kako je slika narisana: Sivine v vseh sivinah, ki jih ima zaslon (počasneje na X4), Rastrirano v črno-belih pikah (hitro) ali Samodejno, kot na vgrajenem domačem zaslonu: sivine ob risanju zaslona, pike po prvi spremembi. Kjer zaslon nima sivin, se sivine umaknejo pikam."
