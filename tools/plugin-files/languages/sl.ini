news.plugin.name = Novice
news.plugin.description = Prenaša vire novic (RSS, Atom) kot knjige za branje.
news.plugin.how = "Novice spremenijo vire RSS ali Atom v knjige. Vsak vir postane ena knjiga v mapi News knjižnice, z najnovejšimi članki kot navadnim besedilom, za branje kot vsaka druga knjiga.\n\nNovice odprite v meniju Orodja in izberite Dodaj vir; njegov naslov je na spletni strani časopisa ali bloga. Prenesi novice prenese vse vire in nadomesti prejšnje knjige. Pridržite vir (s tipkami pridržite Izberi), da ga prenesete ali odstranite samostojno. Odstranjen vir pusti svojo knjigo v knjižnici.\n\nPrenos potrebuje omrežje. Člankov na vir (Nastavitve, Knjižnica) določa, koliko člankov vsebuje posamezna knjiga. Gradnik Naslovi novic jih prikaže na domačem zaslonu."
