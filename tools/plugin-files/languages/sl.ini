wifi.plugin.name = Wi-Fi
wifi.plugin.description = Po potrebi se poveže z omrežji Wi-Fi in nato izklopi radio.
wifi.plugin.how = "Wi-Fi se poveže z omrežjem, ko vtičnik potrebuje internet (katalog, sinhronizacija, trgovina, prenos), in radio spet izklopi minuto po tem, ko ga nič ne uporablja, ali takoj, ko se prikaže Domov ali knjiga, da prihrani baterijo in pomnilnik.\n\nWi-Fi odprete v Nastavitvah ali prek vnosa Wi-Fi v statusni vrstici. Omrežja našteje tista v dosegu; izberite eno in vtipkajte njeno geslo ali izberite Nastavi s telefonom in ime ter geslo vtipkajte v brskalniku telefona namesto v napravi. Pozabi odstrani shranjeno omrežje.\n\nGesla ostanejo na kartici, varno shranjena, in se nikoli več ne prikažejo. Pod Poveži po potrebi nastavite, kako dolgo Wi-Fi ostane vklopljen po zadnji uporabi, ali ostane vklopljen med polnjenjem in katero shranjeno omrežje je na vrsti prvo, kadar je v dosegu več njih."
