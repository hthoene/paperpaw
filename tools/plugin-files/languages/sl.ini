plugin-manager.plugin.name = Upravljalnik vtičnikov
plugin-manager.plugin.description = Našteje vtičnike ter jih vklaplja in izklaplja.
plugin-manager.plugin.how = "Upravljalnik vtičnikov našteje vsak vtičnik z različico in opisom ter vtičnike vklaplja in izklaplja.\n\nNajdete ga v Nastavitvah, kot Upravljanje vtičnikov. Nastavitve vtičnikov je ločena stran za nastavitve, kot je uporaba omrežja posameznega vtičnika. Tapnite vtičnik, da ga vklopite ali izklopite (s tipkami ga izberite). Sprememba velja po ponovnem zagonu: vrstica na dnu nato ponudi Znova zaženi zdaj. Pridržite vtičnik (s tipkami pridržite Izberi), da preberete, kako deluje.\n\nVtičnika, označenega z Vedno vklopljeno, ni mogoče izklopiti, vtičnika, označenega s Potreben, pa šele, ko drug vtičnik prevzame njegovo nalogo, sicer PaperPaw ne bi imel poti nazaj. Pod Zasloni izberete, kateri vtičnik prikazuje mesto, ki ga ponuja več njih."
