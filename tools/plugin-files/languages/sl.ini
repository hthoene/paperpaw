diagnostics.plugin.name = Diagnostika
diagnostics.plugin.description = Preizkusni zaslon in vodeno preverjanje vseh delov naprave.
diagnostics.plugin.how = "Diagnostika je preizkusni zaslon za preverjanje naprave: prikaže vse ravni sivine, ki jih plošča zmore, štiri polja za preizkus tipk in dotika ter števec strani s tekočo vrstico za primerjavo načinov osveževanja.\n\nPreizkusni zaslon nima vnosa v meniju. Domači zaslon je samo, dokler ga noben drug vtičnik ne ponuja, ali ko ga izberete v upravljalniku vtičnikov pod Zasloni za mesto Domači zaslon.\n\nIzberi označi polje s fokusom, puščične tipke se premikajo med polji; z dotikom polje tapnete. Tipki za listanje obračata preizkusne strani. Pridržite Izberi ali dolgo pridržite prst na zaslonu, da začnete znova.\n\nPreverjanje naprave, pod Orodja, kjer je PaperPaw firmware naprave, gre stran za stranjo skozi vse dele naprave: zaslon, tipke, dotik, osvetlitev, baterijo, kartico, uro, Wi-Fi, spanje in pomnilnik. Vsaka stran se konča z Neuspelo, Preskoči in Uspelo; izbran je odgovor, ki ga nakazujejo meritve. Deli, ki jih naprava nima, so preskočeni. Po vsakem odgovoru se poročilo zapiše v .paperpaw/plugins/diagnostics/device-check.txt, da ga prilepite v pull request. Nazaj ga zapusti, ob ponovnem odpiranju pa se nadaljuje tam, kjer je bilo. Na napravi samo s tipkami najprej na strani s tipkami izberite Začni; do takrat puščice, Izberi in Nazaj delujejo kot na vsaki strani."
