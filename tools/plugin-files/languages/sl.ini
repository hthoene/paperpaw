notes-vault.plugin.name = Trezor beležk
notes-vault.plugin.description = Bere mapo z beležkami Markdown po mapah, oznakah in zadnjih spremembah, z gradniki za domači zaslon. Deluje s trezorji Obsidian.
notes-vault.plugin.how = "Trezor beležk bere mapo z beležkami Markdown (navadne datoteke .md, kot jih hranijo aplikacije za beležke). Deluje s trezorji Obsidian.\n\nMapo trezorja izberite v nastavitvah ali na strani trezorja med orodji. Stran nato ponudi mape, kot so na kartici, nazadnje spremenjene beležke, oznake in iskanje po naslovih beležk.\n\nOb prvem odprtju se trezor indeksira v ozadju, dokler je njegova stran odprta; trezor z več tisoč beležkami potrebuje nekaj minut, nato se odpre takoj. Indeks je shranjen na kartici in se ustvari znova, ko se stran trezorja odpre po nekaj urah ali ko izberete Posodobi.\n\nBeležka se odpre v bralniku. Povezave na druge beležke ([[Beležka]], [[Beležka|besede]], [[Beležka#Naslov]]) se najdejo po imenu beležke kjer koli v trezorju; sledenje povezavi odpre to beležko, Nazaj pa vrne na prejšnjo beležko.\n\nNič v trezorju se nikoli ne spremeni. Gradnike za domači zaslon (nedavne beležke, pripeta beležka, beležka dneva, naključna beležka, oznake, iskanje) dodate v urejevalniku domačega zaslona. Gradnik lahko jemlje beležke samo iz ene mape: v nastavitvah gradnika zapišite pot mape od korena kartice (na primer Beležke/Delo); če pustite prazno, vzame vse beležke trezorja."
