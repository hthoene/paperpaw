bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Seznani daljince, tipkovnice in tipala ter jih poveže.
bluetooth.plugin.how = "Bluetooth seznani daljince, tipkovnice in tipala z bralnikom, kjer ima Bluetooth (X4 Pro).\n\nDodaj napravo poišče, kar je v dosegu; napravo najprej preklopite v način seznanjanja. Izberite jo in potrdite na bralniku (primerjajte številko, kjer se prikaže). Tipke daljinca ali tipkovnice nato listajo in se premikajo po menijih; kaj počne posamezna tipka, spremenite pod Upravljanje.\n\nDaljinci pove, kdaj delujejo njihove tipke: ko so tu vklopljeni, med branjem (povezani, dokler je knjiga odprta, kar varčuje baterijo) ali vedno. Tipka menija ali dolg pritisk na napravo jo pozabi.\n\nTipalo je za vtičnike: vklopite, kateri vtičnik ga sme uporabljati. Bluetooth je izklopljen, kadar ga nič ne uporablja."
