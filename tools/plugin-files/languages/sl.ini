calibre.plugin.name = Brezžična knjižnica
calibre.plugin.description = Prejema knjige prek omrežja. Deluje kot brezžična naprava za Calibre.
calibre.plugin.how = "Brezžična knjižnica poskrbi, da se naprava v Calibre v vašem računalniku prikaže kot brezžična naprava. Calibre ji potem lahko pošilja knjige, jih našteje in briše. Knjige pridejo v knjižnico.\n\nBrezžično knjižnico odprite v meniju Orodja, z napravo in računalnikom v istem omrežju Wi-Fi. V Calibre izberite Poveži/deli, nato Zaženi povezavo brezžične naprave. Ko naprava najde vaš računalnik, prikaže njegovo ime; tapnite Poveži (s tipkami pritisnite Izberi). Calibre tu lahko dodaja in briše knjige, zato se povežite samo z lastnim računalnikom. Če zaprete zaslon, se povezava konča.\n\nČe Calibre ni najden sam, v Nastavitvah, pod Knjižnica, v delu Calibre pri Naslov vnesite naslov njegovega računalnika. Če Calibre uporablja druga vrata kot 9090, jih dodajte kot :vrata, npr. 192.168.1.20:9091."
