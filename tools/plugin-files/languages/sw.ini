vocabulary.plugin.name = Msamiati
vocabulary.plugin.description = Huweka maneno unayotafuta, pamoja na sentensi zake, na kupitia kadi za kujifunza kwa kurudia kwa vipindi, zilizotengenezwa kwenye simu yako.
vocabulary.plugin.how = "Msamiati huweka maneno unayotafuta wakati wa kusoma, kila moja na sentensi yake, ili uyapitie baadaye. Orodha utaipata kwenye Zana, mapya kwanza; chagua neno ili kulitafuta tena. Safu ya mwisho, Safirisha, huyahifadhi kwa programu za kadi za kujifunza kama Anki. Orodha huweka maneno 2,000 mapya zaidi: zaidi ya hapo, ya zamani zaidi huondoka, kwa hivyo yasafirishe kwanza ili kuyaweka yote.\n\nKadi za kujifunza, pia kwenye Zana, hukujaribu kwa kurudia kwa vipindi: baada ya Onyesha jibu unaipa kila kadi daraja Tena, Ngumu, Nzuri au Rahisi, na hilo huamua inarudi lini. Tengeneza staha kwa Hariri kwa simu yako: changanua msimbo kwa simu iliyo kwenye Wi-Fi ileile, kisha uandike kadi au uongeze nyingi kwa mara moja: fungua staha huko, chagua Kadi nyingi kwa mara moja na uchague faili ya CSV, TSV au TXT (kadi kwa kila mstari: mbele, nyuma, mfano; UTF-8), bandika orodha, au leta staha ya Anki (.apkg, iliyosafirishwa kwa Saidia matoleo ya zamani ya Anki). \n\nAu tumia faili kwenye kadi ya SD: weka faili ya CSV, TSV au TXT, au staha ya Anki (.apkg, iliyosafirishwa kwa Saidia matoleo ya zamani ya Anki), kwa kila staha kwenye folda Flashcards (Spanish.tsv hutengeneza staha Spanish; kadi moja kwa kila mstari: mbele, nyuma, mfano; zihifadhiwe kama UTF-8; mstari wa kwanza unaweza kutaja safu wima mbele, nyuma, mfano). Chagua Kadi kwenye kadi ya SD katika Kadi za kujifunza, au uiache ifanyike unapofungua Kadi za kujifunza. Staha hubaki kwenye kisomaji pamoja na ulichojifunza, na faili huunganishwa kwenye staha yake kila inapokuwa mpya au imebadilika: badilisha nyuma au mfano wa kadi kwenye faili na kadi hubadilika na kuweka maendeleo yake; badilisha maandishi ya mbele na huhesabiwa kama kadi mpya, ya zamani huanza upya (kadi hutofautishwa kwa maandishi ya mbele; nafasi na herufi kubwa hazihesabiwi); mstari unaoufuta haufuti kadi (isipokuwa uweke \"kadi zinazokosekana kwenye faili\" kuwa Ondoa kwa staha hiyo: basi kadi huondolewa kwenye sasisho linalofuata pamoja na maendeleo yake, kabisa, na hakuna kinachoondolewa mstari wowote wa faili ukiwa haujaweza kusomwa). Hifadhi staha kwenye faili yake kwa Hifadhi kwenye kadi: faili hupata namba za kadi (safu wima ya id), ili uweze kuhariri sehemu za mbele kwenye kompyuta na kadi zikaweka ulichojifunza; faili huweka id, mbele, nyuma na mfano tu (safu wima nyingine, maoni na mpangilio wa mistari havihifadhiwi), na uhifadhi hukataliwa wakati mstari wowote wa faili haukuweza kusomwa; faili iliyokuwapo hunakiliwa kwenye _name.bak.tsv mara ya kwanza (uhifadhi wa baadaye haubadilishi nakala hiyo). Faili ya zaidi ya MiB 4 au mistari 20,000 haisomwi, na lazima ihifadhiwe kama CSV UTF-8, si UTF-16. Mara ya kwanza, kisomaji hutengeneza folda pamoja na dokezo kuhusu jinsi inavyofanya kazi.\n\nKwenye mipangilio, chini ya Kusoma, Maneno yaliyotafutwa huwa kadi huweka kila neno lililotafutwa kwenye staha Yaliyotafutwa."
