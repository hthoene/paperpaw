diagnostics.plugin.name = Uchunguzi
diagnostics.plugin.description = Skrini ya majaribio na ukaguzi wa mwongozo wa kila sehemu ya kifaa.
diagnostics.plugin.how = "Uchunguzi ni skrini ya majaribio ya kukagua kifaa: inaonyesha kila kiwango cha kijivu ambacho paneli inaweza kuonyesha, visanduku vinne vya kujaribu vitufe na mguso, na kihesabu cha kurasa chenye upau wa maendeleo ili kulinganisha hali za kuonyesha upya.\n\nSkrini ya majaribio haina kipengee cha menyu. Ni skrini ya mwanzo tu wakati hakuna programu jalizi nyingine inayotoa moja, au unapoichagua chini ya Skrini kwenye kidhibiti cha programu jalizi kwa mahali pa Skrini ya mwanzo.\n\nChagua huweka alama kisanduku kilicholengwa, na vitufe vya mishale husogea kati ya visanduku; kwa mguso, gusa kisanduku. Vitufe vya kurasa hugeuza kurasa za majaribio. Shikilia Chagua, au shikilia kidole kwenye skrini, ili kuanza upya.\n\nUkaguzi wa kifaa, chini ya Zana pale PaperPaw ni firmware ya kifaa, hupitia kila sehemu ya kifaa ukurasa mmoja baada ya mwingine: skrini, vitufe, mguso, mwanga wa mbele, betri, kadi, saa, Wi-Fi, usingizi na kumbukumbu. Kila ukurasa humalizika kwa Imeshindwa, Ruka na Imepita, jibu ambalo vipimo vyake vinapendekeza likiwa limechaguliwa; sehemu ambazo kifaa hakina huruka. Baada ya kila jibu huandika ripoti kwenye .paperpaw/plugins/diagnostics/device-check.txt, ya kubandika kwenye pull request. Rudi hutoka, na hurudi ulipokuwa ukiufungua tena. Kwenye kifaa chenye vitufe pekee, chagua Anza kwenye ukurasa wa vitufe kwanza; hadi hapo mishale, Chagua na Rudi hufanya kazi kama kwenye kila ukurasa."
