stats.plugin.name = Takwimu za kusoma
stats.plugin.description = Hurekodi unasoma kwa muda gani na kiasi gani, pamoja na kalenda na namba za kila kitabu.
stats.plugin.how = "Takwimu za kusoma hurekodi unasoma kila ukurasa kwa muda gani. Unaziona kama muhtasari wenye leo, wiki na mfululizo wako, kama kalenda, na kwa namba za kila kitabu.\n\nZifungue kutoka Zana, au kutoka Zaidi kwenye kisomaji. Kwenye mipangilio, chini ya Takwimu za kusoma, unaweza kuzima Rekodi usomaji, kuweka Lengo la kila siku, na kuweka Ukurasa mfupi zaidi na Ukurasa mrefu zaidi vinavyohesabiwa, ili kupitia kwa haraka au kitabu kilichoachwa wazi visipotoshe namba.\n\nSawazisha na KOReader hushiriki takwimu na KOReader kupitia folda ya WebDAV. Pia huchukua takwimu za KOReader kwenye kifaa kilekile. Kurekodi kunahitaji saa iwekwe: pale isipowekwa, unganisha Wi-Fi mara moja."
