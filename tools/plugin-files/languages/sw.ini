calendar.plugin.description = Kalenda zako kwenye kisomaji: ajenda, mwonekano wa siku, wiki na mwezi kutoka CalDAV, iCal na faili, siku za kuzaliwa kutoka kwa anwani, wijeti za mwanzo na skrini ya usingizi.
calendar.plugin.how = "Kalenda zako kwenye kisomaji: ajenda ya siku zijazo, siku, wiki na mwezi, zikiwa na matukio ya kalenda za CalDAV (Nextcloud, Radicale, Baïkal, Fastmail na nyingine), ya anwani za iCal (.ics, webcal://), ya faili za kalenda zilizo kwenye kadi na siku za kuzaliwa na maadhimisho ya anwani zako (CardDAV). Kisomaji husoma kalenda tu; hakibadilishi kamwe.\n\nFungua Kalenda kutoka menyu ya zana. Safu ya kwanza hutaja mwonekano; ichague, au shikilia safu yoyote au bonyeza Menyu, ili kubadilisha kati ya Ajenda, Siku, Wiki, Mwezi na Siku za kuzaliwa, kuongeza kalenda au kusawazisha. Katika Siku na Wiki safu mbili za kwanza huenda siku au wiki iliyotangulia na inayofuata (vitufe vya kurasa pia); katika Mwezi vitufe vya mishale husogeza siku, vitufe vya kurasa mwezi, na Chagua hufungua siku. Chagua kwenye tukio hulionyesha lote: lini, wapi, kalenda ipi na linavyojirudia. Rudi hurudi hatua moja nyuma.\n\nOngeza kalenda chini ya Kalenda (kwenye menyu, au Kalenda kwenye mipangilio). Chagua aina yake: akaunti ya CalDAV (anwani ya seva inatosha, k.m. cloud.example.com/remote.php/dav; kila kalenda yenye matukio huwa sehemu ya mwonekano), anwani ya iCal (kalenda iliyochapishwa kama .ics), faili ya kalenda kwenye kadi, au anwani (kitabu cha anwani cha CardDAV: kisomaji huonyesha siku za kuzaliwa na maadhimisho yaliyohifadhiwa nazo). Ingiza anwani, kwa akaunti jina lako la mtumiaji na nenosiri (bora nenosiri la programu; linahifadhiwa pamoja na manenosiri ya kisomaji), na jina. Kila kalenda ina alama (nukta, pete, nukta ya kijivu au mraba) unayoweza kubadilisha, ili uweze kuzitofautisha; hadi kalenda sita.\n\nMatukio yanayojirudia (kila siku, kila wiki, kila mwezi, kila mwaka, yenye siku za wiki, idadi, tarehe za mwisho na siku zilizoachwa), matukio ya siku nzima na matukio ya saa za maeneo mengine huonyeshwa kwa saa ya kisomaji chenyewe. Kisomaji huweka matukio ya kuanzia siku sitini kabla hadi siku sitini baada ya leo, upeo wa 240, na kuyaonyesha bila mtandao. Kanuni asiyoweza kuzisoma huonyesha tukio lake mara moja.\n\nKalenda husomwa unapofungua kalenda (mara moja kila dakika tano kwa upeo), unapochagua Sawazisha sasa, na, kama ulivyoweka chini ya Kalenda kwenye mipangilio, mtandao ukiwa umewashwa hata hivyo au kuchaji kunapoanza. Kisomaji hakiwashi redio yake kwa ajili hiyo kamwe, isipokuwa ukiomba Sawazisha sasa.\n\nWijeti za skrini ya mwanzo (shikilia skrini ya mwanzo, kisha uongeze wijeti): Leo huonyesha tarehe na kile siku inachobeba, Tukio lijalo tukio linalofuata, Ajenda siku zijazo, Mwezi mwezi wenye nukta chini ya siku zenye matukio, na Siku za kuzaliwa siku za kuzaliwa zijazo. Kugusa tukio hulifungua, kugusa siku ya mwezi hufungua siku hiyo. Skrini ya usingizi inaweza kuonyesha ajenda ya leo: chagua Kalenda chini ya Skrini ya usingizi kwenye mipangilio."
