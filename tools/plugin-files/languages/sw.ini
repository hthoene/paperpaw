keys.plugin.name = Vitufe na ishara
keys.plugin.description = Kila kitufe, eneo la kugusa na kutelezesha hufanya nini, vinavyobadilishwa kwenye kifaa.
keys.plugin.how = "Vitufe na ishara huonyesha kila kitufe, eneo la kugusa na kutelezesha hufanya nini, na hukuruhusu kukibadilisha kwenye kifaa.\n\nKifungue kwenye mipangilio, chini ya Kifaa. Kwanza chagua mahali badiliko linatumika: Kila mahali, Wakati wa kusoma, Kwenye skrini ya mwanzo, Kwenye maktaba au kwenye zana moja. Kisha chagua ingizo, kama kitufe kilichoshikwa au kutelezesha ndani kutoka ukingoni, na uchague kitendo kutoka kwenye orodha, ambayo unaweza kuitafuta. Kama kawaida hurudisha kile programu jalizi na mpangilio wa vitufe vilivyoweka.\n\nKwenye X4, badiliko ambalo lingeacha bila kitufe cha kuchagua, kurudi nyuma au kusonga mbele nacho hukataliwa. Weka upya vitufe na ishara mwishoni hurudisha kila badiliko."
