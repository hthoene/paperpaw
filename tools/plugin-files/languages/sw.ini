koreader.plugin.name = Kushiriki maangazio
koreader.plugin.description = Hushiriki alamisho na maangazio na KOReader kwa vitabu vinavyosomwa kwenye zote mbili.
koreader.plugin.how = "Programu jalizi hii hushiriki alamisho na maangazio na KOReader kwa vitabu unavyosoma kwenye zote mbili, kwenye kifaa kimoja au kwenye folda ya maktaba iliyosawazishwa kati ya vifaa. Hakuna cha kusanidi.\n\nPaperPaw inapofungua kitabu ambacho KOReader pia imekifungua, na unapobadilisha alamisho au maangazio yake, huchukua kilicho kipya kutoka data ya KOReader kando ya kitabu na kuacha kilicho kipya hapa ili KOReader ikichukue itakapofungua kitabu tena. Alama zilizoondolewa na madokezo yaliyobadilishwa pia huhamia.\n\nHii hufanya kazi kwa vitabu vya EPUB tu. Ikiwa faili ya upande mmoja haiwezi kusomwa, hakuna kinachobadilika upande wowote hadi iweze."
