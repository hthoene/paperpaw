news.plugin.name = Habari
news.plugin.description = Hupakua milisho ya habari (RSS, Atom) kama vitabu vya kusoma.
news.plugin.how = "Habari hubadilisha milisho ya RSS au Atom kuwa vitabu. Kila mlisho huwa kitabu kimoja kwenye folda ya Habari ya maktaba, na makala zake mpya zaidi kama maandishi matupu, vya kusoma kama kitabu kingine chochote.\n\nFungua Habari kutoka menyu ya Zana kisha uchague Ongeza mlisho; anwani yake iko kwenye tovuti ya gazeti au blogu. Pakua habari hupakua milisho yote na kubadilisha vitabu vya awali. Shikilia mlisho (kwa vitufe, shikilia Chagua) ili kuupakua au kuuondoa peke yake. Mlisho ulioondolewa huacha kitabu chake kwenye maktaba.\n\nKupakua kunahitaji mtandao. Makala kwa kila mlisho (Mipangilio, Maktaba) huweka makala ngapi kila kitabu kinashikilia. Wijeti ya Vichwa vya habari huvionyesha kwenye skrini ya mwanzo."
