keyboard.plugin.name = Kibodi
keyboard.plugin.description = Huingiza maandishi kwenye skrini, kwa mguso au kwa vitufe.
keyboard.plugin.how = "Kibodi hufunguka kila kitu kinapohitaji maandishi: utafutaji, nenosiri, dokezo au mpangilio. Hufanya kazi kwa mguso na kwa vitufe peke yake.\n\nKwa vitufe, kushoto na kulia husogea kando ya safu, vitufe vya kurasa husogea kati ya safu, Chagua hubonyeza kitufe na Rudi hughairi; kushoto na kulia huzunguka safu, na juu na chini hubaki kwenye safu wima yako. Shift hufanya herufi inayofuata iwe kubwa; ibonyeze mara mbili kwa herufi kubwa zote, na mara moja zaidi kuzima. Shikilia herufi (kwa vitufe: shikilia Chagua juu yake) kwa herufi yake kubwa, iliyochaguliwa mara moja, na herufi zenye alama kama é na è; katika Kijerumani, ä, ö, ü na ß hupatikana hivyo kutoka a, o, u na s (kwa vitufe, kibodi husema hivyo kwenye herufi hizo). Sawa humaliza; kwa vitufe, shikilia Rudi kumaliza kutoka popote (Rudi peke yake hughairi), au shikilia Chagua juu ya kitufe ambacho si herufi. Bandika huingiza maandishi ya ubao wa kunakili, na Simu, inapotolewa, hukuruhusu kuandika kwenye simu yako badala yake.\n\nKwenye mipangilio chini ya Kifaa, Kibodi: Miundo ya kibodi huchagua miundo. Kwa kawaida hufuata lugha ya menyu; ukiwa na kadhaa, kitufe hubadilisha kati yake. Vitufe vya umlaut hutoa vitufe vyake vya ä, ö, ü na ß badala yake. Ukubwa hufanya vitufe na herufi kuwa kubwa zaidi; kwa vitufe peke yake, safu hubaki zile za kibodi ya kompyuta. Kwenye skrini za kugusa, Umbo la vitufe hubadilisha jinsi vitufe vinavyoonekana. Herufi kubwa kiotomatiki huanza kila sentensi kwa herufi kubwa."
