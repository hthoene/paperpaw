notes-vault.plugin.name = Hazina ya madokezo
notes-vault.plugin.description = Husoma folda ya madokezo ya Markdown kwa folda, lebo na mabadiliko ya hivi karibuni, pamoja na wijeti za skrini ya mwanzo. Hufanya kazi na hazina za Obsidian.
notes-vault.plugin.how = "Hazina ya madokezo husoma folda ya madokezo ya Markdown (faili za .md za kawaida, kama programu za madokezo zinavyozihifadhi). Hufanya kazi na hazina za Obsidian.\n\nChagua folda ya hazina kwenye mipangilio, au kwenye ukurasa wa hazina kwenye zana. Ukurasa kisha hutoa folda kama zilivyo kwenye kadi, madokezo yaliyobadilishwa mwisho, lebo, na utafutaji kwenye majina ya madokezo.\n\nMara ya kwanza, hazina huorodheshwa chinichini ukurasa wake ukiwa wazi; hazina ya maelfu ya madokezo huchukua dakika chache, kisha hufunguka mara moja. Faharasa huhifadhiwa kwenye kadi na hutengenezwa upya ukurasa wa hazina unapofunguka baada ya saa kadhaa, au unapochagua Sasisha.\n\nDokezo hufunguka kwenye kisomaji. Viungo vya madokezo mengine ([[Dokezo]], [[Dokezo|maneno]], [[Dokezo#Kichwa]]) hupatikana kwa jina la dokezo popote kwenye hazina; kufuata kimoja hufungua dokezo hilo, na Rudi hurudi kwenye dokezo la awali.\n\nHakuna kitu kwenye hazina kinachobadilishwa kamwe. Wijeti za skrini ya mwanzo (madokezo ya hivi karibuni, dokezo lililobandikwa, dokezo la siku, dokezo la nasibu, lebo, utafutaji) huongezwa kwenye kihariri cha skrini ya mwanzo. Wijeti inaweza kuchukua madokezo yake kutoka folda moja tu: andika njia ya folda kuanzia mzizi wa kadi (kwa mfano Notes/Work) kwenye mipangilio ya wijeti; ikiachwa tupu, huchukua madokezo yote ya hazina."
