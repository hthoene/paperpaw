plugin-manager.plugin.name = Kidhibiti cha programu jalizi
plugin-manager.plugin.description = Huorodhesha programu jalizi na kuziwasha na kuzizima.
plugin-manager.plugin.how = "Kidhibiti cha programu jalizi huorodhesha kila programu jalizi pamoja na toleo na maelezo yake, na huwasha na kuzima programu jalizi.\n\nKipate kwenye Mipangilio, kama Dhibiti programu jalizi. Mipangilio ya programu jalizi ni ukurasa tofauti wa mapendeleo kama matumizi ya mtandao ya kila programu jalizi. Gusa programu jalizi ili kuiwasha au kuizima (kwa vitufe, ichague). Badiliko hutumika baada ya kuwasha upya: upau wa chini kisha hutoa Washa upya sasa. Shikilia programu jalizi (kwa vitufe, shikilia Chagua) ili kusoma jinsi inavyofanya kazi.\n\nProgramu jalizi iliyowekwa alama Imewashwa daima haiwezi kuzimwa, na ile iliyowekwa alama Inahitajika tu mara programu jalizi nyingine inapofanya kazi yake, la sivyo PaperPaw haingekuwa na njia ya kurudi. Chini ya Skrini unachagua programu jalizi ipi inaonyesha mahali ambapo kadhaa zinatoa."
