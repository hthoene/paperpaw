menu.empty = Menyu hii haina vipengee.
menu.setting.style = Menyu
menu.style.list = Orodha
menu.style.tiles = Vigae
menu.setting.style.help = Menyu kama orodha, au kama vigae vyenye ikoni zake juu ya skrini.
menu.help.panel = Paneli ya haraka: unachobadilisha mara nyingi, kama mwanga na hali ya usiku.
menu.help.panel-tap = Gusa kitufe ili kukibadilisha.
menu.help.panel-close = Gusa nje yake ili kuifunga.
menu.help.panel-buttons = Vitufe vya mishale: chagua. Chagua: badilisha. Rudi: funga.
menu-editor.plugin.name = Kihariri cha menyu
menu-editor.plugin.description = Hupanga upya, huondoa na huongeza vipengee vya kila menyu.
menu-editor.plugin.how = "Kihariri cha menyu hubadilisha kilichomo kwenye menyu: hamisha vipengee juu au chini, viondoe, au uongeze vipya.\n\nKipate kwenye Mipangilio chini ya Binafsisha, kama Binafsisha menyu. Chagua menyu, kisha kipengee cha kukihamisha au kukiondoa; Ongeza kipengee huweka kipya. Mabadiliko hutumika mara moja. Weka upya menyu hii hurudisha menyu kama programu jalizi zake zinavyoifafanua, Weka upya menyu zote hufanya hivyo kwa kila moja.\n\nHuwezi kujifungia nje: kipengee ambacho ni njia ya kwenda kwenye mipangilio hubaki hadi uongeze njia nyingine ya kuifikia."
