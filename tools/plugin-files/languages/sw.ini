fonts-browser.plugin.name = Fonti zaidi
fonts-browser.plugin.description = Huonyesha fonti kutoka mtandaoni, kila moja na sampuli, na kuzipakua ili usomee.
fonts-browser.plugin.how = "Fonti zaidi huorodhesha fonti kutoka maktaba ya fonti mtandaoni, kila jina likiandikwa kwa fonti yake, na hupakua unazotaka kusomea.\n\nUtaipata mwishoni mwa orodha ya fonti ambapo fonti ya kusomea huchaguliwa, kwenye Mipangilio, chini ya Kusoma, kama Fonti; mistari ya hali ina kipengee hichohicho kwa fonti yake. Gusa fonti (kwa vitufe, bonyeza Chagua) ili kuiona kubwa zaidi na sentensi ya mfano, kisha uchague Pakua. Unaweza kuondoka kwenye ukurasa inapopakuliwa. Ikikamilika, chagua Soma kwa (jina la fonti), au Tumia kwa mistari ya hali. Sasisha huleta toleo jipya zaidi, Ondoa hufuta fonti kutoka kwenye kifaa.\n\nInahitaji Wi-Fi.\n\nFONTI ZAKO MWENYEWE\n\nKando ya Fonti zaidi, orodha ileile ina Fonti zako mwenyewe, inayoonyesha sehemu hii ya msaada. Fonti yako mwenyewe ni faili ya .ttf au .otf, kwa mfano kutoka Google Fonts.\n\nKwenye Android na vifaa vingine vinavyochora faili za fonti: nakili faili kwenye folda ya fonti (kwenye Android: PaperPaw/fonts kwenye hifadhi iliyoshirikiwa), washa PaperPaw upya kisha uchague fonti kwenye Mipangilio, chini ya Kusoma, kama Fonti.\n\nKwenye Xteink X4 na X4 Pro: visomaji hivi husoma vifurushi vya fonti, si faili za fonti, kwa sababu faili za fonti hazingetosha kwenye kumbukumbu yake. Tengeneza kifurushi kwenye kompyuta kwa paperpaw-fontgen, kwa kila mtindo ulio nao (wa kawaida unahitajika):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nHii hutengeneza folda plugins/font-my-font. Nakili folda hiyo kwenye folda ya plugins kwenye kadi ya kumbukumbu, washa upya, kisha uchague My Font kama Fonti. Kifurushi cha mtindo mmoja ni takriban nusu megabaiti kwa herufi za Kilatini; mitindo unayoiacha huchorwa kwa wa kawaida. Zana hutaja fonti ina herufi ngapi kati ya unazoomba (--chars latin,cyrillic,greek huongeza maandishi): fonti isiyo na herufi za kitabu chako haiwezi kuzionyesha, kwa hivyo tafuta inayofunika maandishi yake.\n\nFonti kutoka Fonti zaidi hufanya kazi vilevile na hazihitaji kompyuta.\n\nKwa maandishi madogo makali zaidi kwenye paneli ya e-ink, ongeza --hinting light kwenye amri: hupanga herufi kwenye gridi ya pikseli, kama fonti za kawaida zinavyotengenezwa. Bila hiyo herufi huchorwa kama fonti ilivyozibuni; --hinting normal na --hinting mono huzipanga kwa nguvu zaidi. Fonti zenye alama, kama za Kiarabu au Devanagari, ni bora zisiwe nayo."
