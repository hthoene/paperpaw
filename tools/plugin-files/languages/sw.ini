tasks.plugin.name = Kazi
tasks.plugin.description = Orodha za kazi za kufanya zenye tarehe za mwisho na vipaumbele, kwenye kisomaji au zikiwa zimesawazishwa na seva yako ya CalDAV, pamoja na wijeti za skrini ya mwanzo.
tasks.plugin.how = "Orodha za kazi za kufanya kwenye kisomaji chako: kazi zenye tarehe ya mwisho na kipaumbele, zinazotiwa tiki zikikamilika. Hufanya kazi bila usanidi na bila mtandao, na zinaweza kuwekwa sawa na seva ya CalDAV (Nextcloud, Radicale, Baïkal, Fastmail na nyingine), ili orodha zilezile ziwe kwenye simu na kompyuta yako.\n\nFungua Kazi kutoka menyu ya zana. Safu ya kwanza hutaja orodha inayoonyeshwa; ichague kwa orodha nyingine, kwa Leo na zilizochelewa kwenye orodha zote, kwa orodha mpya, kusawazisha, au kuweka akaunti. Ongeza kazi hufungua kibodi. Chagua kwenye kazi huitia tiki kuwa imekamilika (tena: haijakamilika). Shikilia kazi au bonyeza Menyu kubadilisha jina lake, tarehe yake ya mwisho (leo, kesho, baada ya wiki, au tarehe unayoandika kama 2026-12-24) au kipaumbele chake, au kuiondoa. Kazi zilizo wazi huja kwanza, kwa siku yake kisha kipaumbele; zilizokamilika hubaki mwishoni kwa wiki moja (huwekwa chini ya Kazi kwenye mipangilio), kisha huondoka kwenye kisomaji.\n\nWijeti za skrini ya mwanzo (shikilia skrini ya mwanzo, kisha uongeze wijeti): Kazi za leo huonyesha kinachotakiwa leo au kilichochelewa, Orodha ya kazi huonyesha orodha moja, Kazi zilizo wazi huzihesabu, na Kazi inayofuata huonyesha ya kufanya baadaye. Kugusa kazi kwenye wijeti huitia tiki; kugusa kichwa hufungua orodha.\n\nIli kusawazisha, chagua Akaunti ya CalDAV kutoka safu ya orodha na uingize anwani ya seva, jina lako la mtumiaji na nenosiri (bora nenosiri la programu). Anwani ya seva inatosha, k.m. cloud.example.com/remote.php/dav; kisomaji hupata orodha zako za kazi kutoka hapo. Kila orodha ya kazi ya seva huwa orodha kwenye kisomaji. Kisomaji husawazisha unapofungua Kazi, unapochagua Sawazisha sasa, na mtandao ukiwa umewashwa hata hivyo; unachobadilisha bila mtandao husubiri na hutumwa baadaye. Ikiwa kazi ilibadilishwa kwenye kisomaji na mahali pengine wakati huo huo, toleo la seva huchukuliwa na lako huhifadhiwa kama kazi mpya kando yake, kwa hivyo hakuna kinachopotea. Madokezo, kengele na kila kitu kingine ambacho kazi ina kwenye seva hubaki kama vilivyo. Kazi zinazojirudia huonyeshwa lakini hubadilishwa mahali ulipozitengeneza. Kisomaji kinashikilia hadi kazi 200 katika orodha 12."
