update.plugin.name = Sasisho
update.plugin.description = Husakinisha masasisho ya firmware, kutoka kwenye kadi au yaliyopakuliwa kutoka mtandaoni.
update.plugin.how = "Sasisho husakinisha firmware mpya, kwenye vifaa ambapo PaperPaw ni firmware, kama X4. Utalipata kwenye mipangilio, kama Sasisho.\n\nTafuta mtandaoni huuliza seva ya masasisho PaperPaw mpya zaidi na kuipakua, jambo linalochukua dakika chache kupitia Wi-Fi. Au nakili faili ya sasisho (inayoishia .bin, kutoka paperpaw.org) kwenye folda updates kwenye kadi, kwa mfano kwa Uhamishaji wa Wi-Fi. Sakinisha kisha huchukua takriban dakika moja na kifaa huwashwa upya; vitabu, mipangilio na mahali pa kusoma vinabaki.\n\nKukiwa na Tafuta masasisho kumewashwa (kwenye mipangilio, imezimwa mwanzoni), kifaa huuliza takriban mara moja kwa wiki chenyewe, tu Wi-Fi ikiwa imewashwa hata hivyo au kinapochaji. PaperPaw mpya zaidi inayopatikana husubiri hapa; hakuna kinachokatiza usomaji wako. Utafutaji hutuma kile kifaa kinachoendesha, bila jina wala namba yake; ili kuhesabu vifaa, pia kama uliuliza na kama ni utafutaji wake wa kwanza wa siku, wiki au mwezi.\n\nIkiwa programu jalizi unazotumia bado hazina toleo la toleo jipya, sasisho huzisubiri. Toleo la zamani husakinishwa tu ukilichagua.\n\nFirmware nyingine, kama CrossPoint, husakinishwa kutoka hapa pia: weka faili yake (inayoishia .bin) kwenye folda updates, na ufungue Sasisho. PaperPaw hukagua kwamba ni firmware kamili kwa kifaa hiki, haijaharibika, lakini haiwezi kujua nani aliitengeneza, kwa kuwa haijatiwa saini. Sakinisha hata hivyo huiandika kwenye nusu nyingine ya flash, na kifaa huianzisha; PaperPaw hubaki kwenye nusu yake hadi firmware hiyo isakinishe kitu juu yake. Ili kurudi kwa PaperPaw baadaye, sakinisha faili yake ya usakinishaji (paperpaw-<device>-<version>-install.bin) kutoka menyu ya firmware nyingine, kama sasisho la firmware la SD la CrossPoint."
