lock.plugin.name = Kufunga skrini
lock.plugin.description = PIN, mchoro au nenosiri kifaa kinapoamka; mguso umefungwa wakati wa kusoma.
lock.plugin.how = "Kufunga skrini huomba PIN, mchoro au nenosiri PaperPaw inapoanza na kifaa kinapoamka. Imezimwa mwanzoni. Huzuia matumizi ya kawaida tu: msimbo na idadi ya majaribio mabaya huhifadhiwa kwenye kadi ya SD, kwa hivyo yeyote anayetoa kadi, kuihariri au kuibadilisha hupita kufuli.\n\nIweke kwenye mipangilio, chini ya Kifaa, Kufunga skrini: ingiza msimbo unaotumika ikiwa upo, chagua aina, kisha msimbo mpya mara mbili. Mchoro hutolewa kwenye skrini za kugusa tu.\n\nBaada ya majaribio matano mabaya, ijayo husubiri nusu dakika. Funga sasa hufunga mara moja na inaweza kuwekwa kwenye kitufe, ishara au kanuni. Kufunga baada ya kuamka kunaweza kuzimwa, ili kuanza halisi tu (kuwasha au kuwasha upya) kufunge, isipokuwa pale kila kuamka ni kuanza, kama kwenye X4 ikiwa kwenye betri.\n\nKufunga mguso, kando yake: Funga mguso kwenye paneli ya haraka na menyu ya kusoma hufanya kugusa, kutelezesha na kalamu zisifanye kitu huku vitufe bado vikifanya kazi, k.m. kusoma ukiwa na mkono kwenye skrini. Ili kufungua, gusa mara mbili kwa kidole kimoja na ukishikilie kwa muda mfupi; kushikilia kitufe cha kuwasha hufungua menyu ya Nishati, ambapo Fungua mguso hufanya hivyo kwa vitufe; kwenye X4 Pro, kushikilia kitufe cha mwanzo hufungua mara moja."
