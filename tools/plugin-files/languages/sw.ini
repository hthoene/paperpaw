help.setting.again.help = Vidokezo vya kila skrini huonyeshwa mara moja zaidi, itakapofunguka tena.
help.again-done = Vidokezo vitaonyeshwa tena, kila skrini itakapofunguka tena.
home.plugin.name = Skrini ya mwanzo
home.plugin.description = Ukurasa wa kuanzia: kurasa za wijeti, kama kitabu unachosoma na zana.
home.plugin.how = "Skrini ya mwanzo imetengenezwa kwa kurasa, kila moja gridi ya wijeti na zana kama kwenye simu. Mwanzoni saa, kitabu unachosoma na vitabu vilivyosomwa hivi karibuni ziko kwenye ukurasa mmoja, na zana zote kwenye unaofuata.\n\nGusa kipengee ili kukifungua, na telezesha au tumia vitufe vya kurasa kubadilisha kurasa. Kwa vitufe tu, vitufe vya mishale husogea kutoka kipengee kimoja hadi kinachofuata na Chagua hukifungua.\n\nIli kuipanga upya, shikilia skrini ya mwanzo, gusa penseli chini ya ukurasa au chagua Hariri skrini ya mwanzo kwenye menyu. Buruta vipengee kuvihamisha au gusa kimoja kwa chaguo zake, pia kwa vitufe. Ongeza wijeti pia iko hapo. Safu wima na Safu mlalo ziko kwenye mipangilio, chini ya Mwonekano, katika sehemu ya Skrini ya mwanzo.\n\nKwenye skrini iliyogeuzwa ubavuni, skrini ya mwanzo huonyesha vipengee vilevile kwa safu wima zaidi, kila ukurasa ukijazwa kabla ya unaofuata, na kadi zisizozidi upana wa takriban mm 110; hakuna ulichopanga wima kinachobadilishwa. Ipange ubavuni na mpangilio huo huhifadhiwa kwa mwelekeo huo peke yake: wijeti mpya huongezwa kwa zote mbili. Weka upya mpangilio wa mlalo katika Ongeza (wakati wa kuhariri) hurudi kwenye ule uliotokana. Kuondoa wijeti au zana kwenye mwelekeo mmoja hakukuondoi kwenye mwingine."
