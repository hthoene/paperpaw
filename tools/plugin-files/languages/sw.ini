smart-home.plugin.name = Nyumba janja
smart-home.plugin.description = Thamani na swichi kutoka Home Assistant yako mwenyewe kwenye dashibodi na kama wijeti za skrini ya mwanzo. Hufanya kazi na Home Assistant kwenye mtandao wako wa nyumbani.
smart-home.plugin.how = "Nyumba janja huonyesha thamani na swichi kutoka Home Assistant yako mwenyewe: halijoto, unyevu, nishati, milango na madirisha, taa, swichi na mazingira. Huzungumza na seva yako kupitia REST API yake kwenye mtandao wako wa nyumbani; hakuna kinachopita kwenye huduma nyingine yoyote.\n\nFungua Nyumba janja kutoka menyu ya zana, kisha Muunganisho: andika anwani ya Home Assistant yako (kwa mfano http://homeassistant.local:8123) na tokeni ya ufikiaji ya muda mrefu (itengeneze chini ya ukurasa wa wasifu wa Home Assistant yako). Tokeni huhifadhiwa kati ya manenosiri na funguo, kamwe si kwenye faili ya mipangilio. Http ya kawaida hutumika tu kwa anwani zilizo kwenye mtandao wako wa nyumbani; kwa seva iliyo kwingine washa \"Seva nje ya mtandao wa nyumbani\" kwenye mipangilio na utumie https yenye cheti halali.\n\nChagua vipengee hufungua orodha ya kile seva yako ina: tafuta kwa jina au kitambulisho na uchague kipengee ili kukionyesha (kichague tena ili kukiondoa). Unaweza kukipa chumba, ambacho hukikusanya kwenye dashibodi na kwenye wijeti za vyumba. Hadi vipengee 24 huhifadhiwa. Kwenye dashibodi chagua taa, swichi au mazingira ili kuibadilisha: safu huonyesha jibu la seva. Kihisi unachochagua husomwa tena.\n\nWijeti (shikilia skrini ya mwanzo, kisha uongeze wijeti): Thamani ya Nyumba janja huonyesha kipimo kimoja kikubwa, kikundi huorodhesha vipengee vya chumba, swichi ni kitufe cha taa au swichi moja, na chumba ni kadi yenye vipimo na swichi za chumba. Mipangilio ya kila wijeti husema ni kipengee au chumba kipi inaonyesha.\n\nNyumba husomwa unapofungua dashibodi, unapoomba (safu ya Onyesha upya au kugusa wijeti ya thamani au kikundi), kisomaji kinapoamka pale Wi-Fi tayari imewashwa, na kwa ratiba unayoweka chaja ikiwa imechomekwa. Hakiwashi redio chenyewe kamwe wala kuiacha ikiwa imewashwa."
