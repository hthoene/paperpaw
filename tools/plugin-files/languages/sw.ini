puzzles.plugin.name = Mafumbo
puzzles.plugin.description = Sudoku, chemsha bongo na mafumbo ya chesi, bila mtandao, na fumbo la siku.
puzzles.plugin.how = "Mafumbo kwa treni na chumba cha kusubiri, yote bila mtandao: sudoku, chemsha bongo na mafumbo ya chesi. Fungua Mafumbo kutoka menyu ya zana, au ongeza wijeti Fumbo la siku kwenye skrini ya mwanzo (shikilia skrini ya mwanzo, kisha uongeze wijeti): huonyesha sudoku ya leo imefika wapi, na kugusa huifungua. Sudoku ya siku ni ileile siku nzima.\n\nSudoku: kushoto na kulia husogeza kielekezi kisanduku kwa kisanduku, juu na chini (vitufe vya kurasa) kwa safu. Chagua hufungua tarakimu: chagua moja kisha uchague tena kuiweka, au Futa kuondoa kisanduku. Shikilia Chagua (au Menyu) kufikia vitufe vilivyo chini ya ubao: Madokezo hugeuza tarakimu kuwa alama za penseli, Kagua huweka alama visanduku visivyo sahihi, Tendua hurudisha hatua ya mwisho, Mpya huanza fumbo la kiwango unachochagua (Rahisi, Wastani, Gumu). Kila fumbo lina jibu moja tu. Mchezo huhifadhiwa unapoondoka. Kwenye skrini ya kugusa gusa kisanduku.\n\nChemsha bongo: weka faili za .puz (Across Lite) au .ipuz kwenye folda \"puzzles\" kwenye kadi ya kumbukumbu; hakuna zilizojumuishwa. Sogea kwenye gridi, kisha uchague ili kuandika neno lililo chini ya kielekezi kwenye kibodi (mstari wa chini huacha kisanduku tupu). Vitufe hubadilisha mlalo na wima, huonyesha orodha ya vidokezo, hukagua herufi na kufichua neno. Herufi huhifadhiwa kwa kila faili. Faili za .puz zilizochanganywa haziwezi kufunguliwa.\n\nMafumbo ya chesi: seti ndogo kutoka hifadhidata ya mafumbo ya Lichess (CC0). Kushoto na kulia huruka kutoka kipande hadi kipande, chagua kipande unachotaka kusogeza, kisha kushoto na kulia kupitia mahali kinapoweza kwenda, na uchague tena. Hatua isiyo sahihi hurudishwa. Kidokezo huweka alama kipande cha kusogeza, Ifuatayo huenda kwenye fumbo linalofuata.\n\nUbao huchora upya visanduku vinavyobadilika tu. Takwimu huhesabu mafumbo uliyotatua."
