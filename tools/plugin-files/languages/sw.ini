translate.plugin.description = Hutafsiri maandishi yaliyochaguliwa mtandaoni, kwa DeepL.
translate.plugin.how = "Tafsiri hutafsiri maandishi yaliyochaguliwa mtandaoni kwa DeepL. Chagua maandishi kitabuni kisha uchague Tafsiri kwenye menyu ya maandishi yaliyochaguliwa: tafsiri huonekana juu ya ukurasa kama maelezo ya kamusi. Vitufe vya kurasa au kugusa huisogeza, na Chagua au kugusa mwishoni mwake huifunga.\n\nInahitaji mtandao na ufunguo wako mwenyewe wa API ya DeepL, bila malipo kwenye deepl.com (DeepL API Free, takriban herufi 500,000 kwa mwezi). Hadi uuingize, paneli husema hivyo, na kugusa huuliza.\n\nKwenye mipangilio, chini ya Kusoma, katika sehemu ya Tafsiri, Tafsiri kwenda huweka lugha; mwanzoni ni ya PaperPaw yenyewe."
