about.plugin.name = Kuhusu
about.plugin.description = Toleo la PaperPaw na leseni.
about.plugin.how = "Kuhusu huonyesha una toleo gani la PaperPaw, msimbo wake wa chanzo uko wapi, na inakuja chini ya leseni zipi.\n\nUtaipata mwishoni mwa Mipangilio, kama Kuhusu PaperPaw. Chagua safu kwa vitufe vya mishale na Chagua, au iguse. Programu jalizi zilizojengwa ndani ya firmware na, kwenye vifaa vinavyopakia programu jalizi zenye msimbo, alama ya kidole ambayo programu jalizi hizo lazima zijengewe, pia zimeorodheshwa.\n\nLeseni hufunguka kama maandishi kwenye kisomaji, kwa hivyo unageuza kurasa kama kitabu. Ina leseni ya PaperPaw yenyewe na zile za fonti, ikoni na mifumo ya kugawanya maneno inayokuja nayo. Programu jalizi zinaweza kuongeza mstari wake, kama mwandishi wa mandhari."
