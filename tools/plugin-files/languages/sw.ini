setup.plugin.name = Usanidi
setup.plugin.description = Mwongozo mfupi kupitia mipangilio muhimu, wakati wa kuanza kwa mara ya kwanza.
setup.plugin.how = "Usanidi ni mwongozo mfupi kupitia mipangilio muhimu, unaoonyeshwa mara moja, PaperPaw inapoanza kwa mara ya kwanza. Kila ukurasa huuliza jambo moja, kama lugha, vitufe, ukubwa wa maandishi, saa za eneo, Wi-Fi au programu jalizi chache za kuongeza, huku jibu linalofaa tayari limechaguliwa, kwa hivyo Endelea huwa sahihi kila mara. Hatua ambazo kifaa hiki hakihitaji huachwa.\n\nGusa vitufe, au tumia vitufe vya juu na chini na Chagua. Ruka kwenye ukurasa wa kwanza huondoka kwenye usanidi mara moja. Ukurasa wa mwisho unasema vitabu vyako vinatoka wapi.\n\nIli kuuendesha tena, fungua mipangilio kisha uchague Sanidi PaperPaw. Kila kilichochaguliwa hapa kinaweza kubadilishwa kwenye mipangilio baadaye."
