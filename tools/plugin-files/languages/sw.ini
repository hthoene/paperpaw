files.plugin.name = Kivinjari cha faili
files.plugin.description = Huorodhesha vitabu na folda zilizo kwenye kifaa na kuvifungua.
files.plugin.how = "Maktaba huorodhesha vitabu vilivyo kwenye folda yako ya maktaba, kila kimoja na jalada lake, jina, mwandishi na umbali ulioufikia kukisoma. Kitabu ulichosoma mwisho kiko juu kama kadi, kwa hivyo kuendelea kusoma kunahitaji kugusa mara moja, au kubonyeza Chagua mara moja. Maktaba inapotafuta vitabu, hutaja imepata vingapi hadi sasa.\n\nChagua kinachoonyeshwa juu ya vitabu: vyote, unavyosoma, ambavyo hujasoma au vilivyokamilika, au rafu (kwa mwandishi, mfululizo, lebo, vipendwa, kitabu kinachofuata cha kila mfululizo uliouanza). Gusa kitabu ili kukisoma; kishikilie (kwa vitufe, shikilia Chagua) ili kukifungua, kukiweka alama kuwa kimekamilika au hakijasomwa, kuona taarifa zake, kukihamishia kwenye nyaraka au kukifuta. Gusa jina kwa menyu ya maktaba: jinsi vitabu vinavyopangwa na kuonyeshwa, kutafuta, folda ya maktaba na mipangilio.\n\nFolda ya maktaba huwekwa kwenye Mipangilio, chini ya Maktaba, kama Folda ya maktaba; huko unaweza pia kuonyesha vitabu kama gridi ya majalada. Kwa kila faili nyingine, tumia Faili kwenye menyu ya Zana."
