notes-overview.plugin.name = Madokezo yote
notes-overview.plugin.description = Alamisho na maangazio ya vitabu vyote kwenye orodha moja, na usafirishaji kama My Clippings.txt.
notes-overview.plugin.how = "Madokezo yote huorodhesha kila kitabu ulichoweka alamisho au mwangaza, pamoja na idadi. Kifungue kwenye Zana. Chagua kitabu kuona madokezo yake, na dokezo ili kufungua kitabu mahali hapo.\n\nMwishoni mwa orodha, Safirisha kama My Clippings.txt huandika madokezo yote kwenye faili moja, kwenye folda Exports kando ya maktaba, kwa umbo ambalo Kindle hutumia (UTF-8). Programu zinazosoma My Clippings.txt ya Kindle zinaweza kuisoma. Dokezo kwenye mwangaza ni ingizo lake lenyewe, kama kwenye Kindle. Kwa kuwa kitabu hapa hakina maeneo ya Kindle, \"eneo\" ni umbali wa dokezo ndani ya kitabu, kwa asilimia. Faili huandikwa upya kila mara; hubadilisha ile ya awali."
