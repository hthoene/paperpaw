reader.plugin.name = Kisomaji
reader.plugin.description = Huonyesha vitabu ukurasa kwa ukurasa, pamoja na yaliyomo na mipangilio ya kusoma.
reader.plugin.how = "Kisomaji huonyesha vitabu ukurasa kwa ukurasa. Fungua kitabu kutoka maktaba; kitabu cha mwisho kinaweza kufunguka tena wakati wa kuanza (mpangilio Fungua kitabu cha mwisho wakati wa kuanza).\n\nGusa kushoto au kulia mwa skrini, au tumia vitufe vya kurasa, kugeuza kurasa. Gusa katikati au bonyeza Chagua kwa menyu ya kusoma: Yaliyomo, Tafuta, Nenda kwenye ukurasa, Fonti na mpangilio, Alamisho na maangazio na zaidi. Chini kutoka ukingo wa juu hufungua paneli ya haraka, juu kutoka ukingo wa chini huenda mwanzo; kushikilia Rudi hufanya vilevile.\n\nShikilia Chagua (au shikilia picha) kuona picha kwenye skrini nzima: Kushoto na Kulia hupitia picha za ukurasa. Chagua hukuza hadi 2x, 3x na kurudi (gusa mara mbili kwenye mguso); ikikuzwa, Kushoto na Kulia husogeza pembeni, vitufe vya kurasa (au kutelezesha) husonga mbele kwa upana na kwa urefu. Rudi hurudi kwenye kutosha, kisha kwenye ukurasa (shikilia ili kutoka kwenye mguso). Gusa kona ya juu kulia kwa alamisho. Shikilia neno ili kuliangazia. Kwa vitufe, shikilia Kushoto: Kushoto na Kulia husogea kwa neno, vitufe vya kurasa kwa mstari, kuvishikilia huenda kwenye ncha za ukurasa na kwa aya; Chagua hufungua upau wa mwangaza kwa neno, kushikilia Chagua huupanua hadi sentensi na aya (kisha Kushoto na Kulia husogeza mwisho, kuvishikilia mwanzo). Uteuzi unaendelea kupitia kugeuza kurasa. Safirisha kama Markdown huhifadhi madokezo yako."
