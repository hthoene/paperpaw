sleep.plugin.name = Skrini ya usingizi
sleep.plugin.description = Huonyesha paka aliyelala, jalada la kitabu, picha zako au ujumbe kifaa kinapolala.
sleep.plugin.how = "Skrini ya usingizi huamua skrini inaonyesha nini kifaa kinapolala. E-ink huweka picha bila nishati.\n\nIchague kwenye mipangilio, chini ya Kifaa, Skrini ya usingizi, kwa Onyesha: paka aliyelala (chaguomsingi), jalada la kitabu, picha zangu, nembo na \"Imelala\", wijeti, ukurasa kama ulivyo, au ukurasa wenye picha. Picha zangu huonyesha faili za folda ya Picha moja baada ya nyingine.\n\nBila jalada au picha paka huonekana. Pale mfumo unapochora skrini ya usingizi wenyewe, mipangilio hii imefichwa.\n\nSkrini ya kuzima, Onyesha wakati imezimwa, huchorwa mara moja kifaa kinapozimwa, kutoka menyu ya nishati au baada ya muda wa Zima baada ya usingizi (si wakati betri iliyo chini inapokata nishati). Ni kama skrini ya usingizi isipokuwa ukichagua nembo na \"Imezimwa\", paka, jalada au picha zangu. Programu jalizi nyingine inaweza kutoa skrini kwa ajili yake.\n\nSkrini ya kuanza na ya kuwasha upya, Onyesha wakati wa kuanza na Onyesha wakati wa kuwasha upya, ni za kifaa chenyewe isipokuwa programu jalizi nyingine itoe skrini kwa ajili yake. Programu jalizi bado hazijaendeshwa kifaa kinapoanza: skrini iliyochaguliwa kwa kuanza huchorwa mapema, kifaa kinapozimwa au kuwashwa upya, na kuonyeshwa wakati wa kuanza kunakofuata. Skrini isiyo tayari kwa wakati, au picha iliyoharibika, hupisha ya kifaa chenyewe; kifaa huzimwa au kuwashwa upya kwa vyovyote vile."
