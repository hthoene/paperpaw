bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Huoanisha rimoti, kibodi na vihisi, na kuviunganisha.
bluetooth.plugin.how = "Bluetooth huoanisha rimoti, kibodi na vihisi na kisomaji, pale kinapokuwa na Bluetooth (X4 Pro).\n\nOngeza kifaa hutafuta kilicho karibu; weka kifaa kwenye hali ya kuoanisha kwanza. Kichague, kisha thibitisha kwenye kisomaji (linganisha namba inapoonekana). Vitufe vya rimoti au kibodi basi hugeuza kurasa na kusogea kwenye menyu; badilisha kila kitufe kinafanya nini chini ya Vidhibiti.\n\nRimoti husema vitufe vyake vinafanya kazi lini: zikiwashwa hapa, wakati wa kusoma (huunganishwa kitabu kikiwa wazi, huokoa betri), au kila mara. Kitufe cha menyu au kubonyeza kwa muda mrefu kwenye kifaa hukisahau.\n\nKihisi ni cha programu jalizi: washa programu jalizi ipi inaweza kukitumia. Bluetooth huzimwa wakati wowote hakuna kinachoitumia."
