reading-goal.plugin.name = Lengo la kusoma
reading-goal.plugin.description = Dakika za kusoma kwa siku, na paka kwenye skrini ya mwanzo ambaye hali yake hufuata usomaji wa leo.
reading-goal.plugin.how = "Paka kwenye skrini yako ya mwanzo huonyesha usomaji wa leo unaendeleaje: mwenye huzuni ukiwa bado hujasoma, hali ya kati baada ya kidogo, ameridhika kuanzia nusu ya lengo lako la kila siku, mwenye furaha ukishalifikia.\n\nOngeza wijeti Paka wa kusoma kwenye skrini ya mwanzo (shikilia skrini ya mwanzo, kisha uongeze wijeti), au chagua Paka wa kusoma wa leo kama skrini ya usingizi. Kugusa paka hufungua lengo la kila siku; ni lengo la takwimu za kusoma, ambazo huhesabu dakika unazosoma.\n\nKwenye mipangilio, chini ya Kusoma, Ameridhika kuanzia na Mwenye furaha kuanzia huweka kutoka sehemu gani ya lengo paka ameridhika au mwenye furaha, na Picha zako mwenyewe ni folda ya picha (sad, meh, content na happy) za kuonyesha badala ya paka. Picha ni faili za PNG au JPEG; bila folda, paka huonekana."
