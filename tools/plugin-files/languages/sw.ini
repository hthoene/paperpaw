store.plugin.name = Duka la programu jalizi
store.plugin.description = Hutafuta, husakinisha, husasisha na huondoa programu jalizi za kifaa hiki.
store.plugin.how = "Duka la programu jalizi hutafuta programu jalizi za kifaa hiki mtandaoni na kuzisakinisha, kuzisasisha na kuziondoa. Lifungue kutoka Zana; linahitaji Wi-Fi.\n\nMwanzo unaonyesha kile maktaba inapendekeza, kipya au maarufu sasa, kisha vikundi. Kikundi huorodhesha programu jalizi zake kwa mchanganyiko wa haki unaobadilika kila siku, ili kila programu jalizi ionekane; zipange kuanzia A hadi Z, kwa mpya zaidi au kwa sasisho la mwisho, na uende kwenye herufi kwenye orodha ndefu. Fungua moja kuona ukurasa wake, pamoja na ukubwa wake na kumbukumbu inayochukua, kisha uchague Sakinisha, Sasisha au Ondoa. Sasisha zote huleta kila programu jalizi iliyosakinishwa kwenye toleo jipya zaidi.\n\nProgramu jalizi za msimbo huendeshwa kwa ufikiaji kamili wa kifaa: duka husema hivyo na huuliza kwanza, na huanza baada ya kuwasha upya. Ikiwa moja inaharibika, PaperPaw huanza bila programu jalizi za msimbo na kusema ni ipi. Maktaba ya programu jalizi huweka orodha inatoka wapi.\n\nProgramu jalizi za jamii, kwenye Mipangilio, Mfumo, pia huorodhesha programu jalizi ambazo wengine walichapisha kwenye GitHub. Hakuna aliyezikagua: zimewekwa alama Haijakaguliwa, ukurasa wa programu jalizi ya msimbo huonyesha ufunguo iliotiwa saini nao, na sasisho lililotiwa saini kwa ufunguo mwingine halisakinishwi.\n\nVyanzo, safu ya mwisho ya mwanzo, huongeza orodha za programu jalizi za wengine kwa anwani yao (https://…/plugins.json), huorodhesha moja yao badala ya ya PaperPaw, au kuiondoa. Badala ya kuandika, weka faili sources.txt yenye anwani moja kwa kila mstari kwenye .paperpaw/plugins/store kwenye kadi: anwani huonekana chini ya Vyanzo kama mpya. PaperPaw haikagui chanzo wala programu jalizi zake, na kifaa huwasiliana na seva ya chanzo. Chanzo hutia saini orodha yake; kifaa huweka ufunguo wa orodha ya kwanza inayoisoma na tangu hapo huchukua tu orodha na programu jalizi za msimbo zilizotiwa saini kwa ufunguo huo. Programu jalizi hupata masasisho yake tu kutoka chanzo ilichosakinishwa kutoka kwake. Maktaba ya PaperPaw yenyewe huwepo daima na haiwezi kuondolewa; kuondoka dukani hurudi kwake."
