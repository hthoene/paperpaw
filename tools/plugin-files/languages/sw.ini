format-cbz.plugin.name = Vitabu vya katuni
format-cbz.plugin.description = Hufungua kumbukumbu za vitabu vya katuni (.cbz), picha moja kwa ukurasa.
format-cbz.plugin.how = "Hufungua kumbukumbu za vitabu vya katuni (.cbz): picha moja kwa ukurasa, zikitoshezwa kwenye skrini, kwa mpangilio wa majina yake (2 kabla ya 10).\n\nZiweke kwenye folda ya maktaba na uzifungue kutoka maktaba; geuza kurasa kama kwenye kitabu chochote. Picha kubwa huchukua muda mfupi mara ya kwanza, kwenye X4 zaidi ya kwingineko.\n\nMipangilio ya kusoma (Mipangilio, Kusoma): \"Fremu kwa fremu\" huonyesha fremu moja ya ukurasa kwa wakati, kubwa kadiri skrini inavyoruhusu, na kugeuza ukurasa hupitia fremu hizo; ukurasa usio na fremu huonyeshwa mzima. \"Kurasa za katuni huenda\" hugeuza upande wa kugeuza kurasa kwa manga (kulia kwenda kushoto); ComicInfo.xml ya kitabu chenyewe husema hivyo yenyewe. Maktaba huonyesha jina la kitabu na mfululizo na namba yake kutoka ComicInfo.xml."
format-cbz.title = Kitabu cha katuni (CBZ)
format-cbz.setting.direction = Kurasa za katuni huenda
format-cbz.setting.direction.help = Manga: kugeuza kurasa kumegeuzwa upande.
format-cbz.direction.book = Kama kitabu kinavyosema
format-cbz.direction.ltr = Kushoto kwenda kulia
format-cbz.direction.rtl = Kulia kwenda kushoto
format-cbz.setting.panels = Fremu kwa fremu
format-cbz.setting.panels.help = Fremu moja kwa wakati, kugeuza ukurasa hupitia fremu.
format-docx.plugin.name = Hati za DOCX
format-docx.plugin.description = Hufungua faili za .docx, kama zinavyohifadhiwa na Word na programu nyingine.
format-docx.plugin.how = "Hufungua hati za .docx kama vitabu: vichwa vyenye yaliyomo, orodha, jedwali, herufi nzito na za mlazo, viungo na picha (JPEG, PNG, GIF).\n\nWeka faili kwenye folda ya maktaba na uzifungue kutoka maktaba. Jina na mwandishi hutoka kwenye sifa za hati. Tanbihi, vichwa na vijachini, na maoni havionyeshwi."
format-docx.title = Hati ya DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Hufungua vitabu vya EPUB pamoja na mitindo yake, yaliyomo na picha.
format-epub.plugin.how = "Vitabu vya EPUB hufunguka kutoka maktaba kama kitabu kingine chochote, pamoja na yaliyomo, picha na mtindo wa mchapishaji. Kurasa za wavuti (HTML), Markdown, FictionBook (.fb2) na kumbukumbu za vitabu vya katuni (.cbz) hufunguka vivyo hivyo, kila kimoja kama programu jalizi yake.\n\nSura hubadilishwa mara ya kwanza unapoifungua na kuhifadhiwa kwenye akiba ya programu jalizi, kwa hivyo ni haraka baadaye na vitabu vikubwa hufanya kazi kwenye vifaa vidogo. Yaliyomo utayapata chini ya Yaliyomo kwenye menyu ya kusoma. Kama mtindo wa kitabu chenyewe unatumika ni mpangilio wa Umbizo la mchapishaji, chini ya Kusoma."
format-epub.title = Kitabu pepe cha EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Hufungua vitabu vya FictionBook (.fb2, pia vilivyobanwa).
format-fb2.plugin.how = "Hufungua vitabu vya FictionBook (.fb2), vinavyojulikana kwa vitabu vya Kirusi na vingine, pia vilivyobanwa (.fb2.zip), pamoja na jina, waandishi, jalada na sura zake.\n\nViweke kwenye folda ya maktaba; vinaonekana kwenye maktaba na kufunguka kama kitabu kingine chochote."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Hufungua kurasa za wavuti zilizohifadhiwa kama faili, ikionyesha tu kinachopaswa kusomwa.
format-html.plugin.how = "Hufungua kurasa za wavuti zilizohifadhiwa kama faili (.html, .htm, .xhtml) kama vitabu: kinachopaswa kusomwa tu, bila menyu, matangazo na kadhalika kuzunguka.\n\nWeka faili kwenye folda ya maktaba na uifungue kutoka maktaba kama kitabu chochote. Viungo vilivyomo kwenye ukurasa hufanya kazi; picha huonekana zilipo kwenye faili."
format-html.title = Ukurasa wa wavuti (HTML)
format-images.plugin.name = Picha
format-images.plugin.description = Hufungua picha (.jpg, .png, .gif) kama vitabu, ukurasa kwa kila moja.
format-images.plugin.how = "Picha (.jpg, .png, .gif) hufunguka kutoka maktaba kama vitabu, picha moja kwa ukurasa, ikitoshezwa kwenye skrini.\n\nIli kusoma folda nzima ya picha, fungua picha yake ya kwanza: picha zinazoifuata kwenye folda huja baadaye, kwa mpangilio wa majina yake (2 kabla ya 10). Picha ya baadaye kwenye folda huanzia hapo; mahali pa kila moja hukumbukwa kivyake. Folda ya hadi picha 300 husomwa kuanzia ile unayoifungua.\n\nFaili isiyo picha, au iliyo kubwa mno, huonyesha jina lake badala yake. Kwa kitabu cha picha nyingi chenye jina lake mwenyewe, kumbukumbu ya kitabu cha katuni (.cbz) ndiyo umbo bora."
format-images.title = Picha
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Hufungua faili za Markdown (.md), k.m. madokezo.
format-markdown.plugin.how = "Hufungua faili za Markdown (.md), kama madokezo, kama vitabu: vichwa, orodha, nukuu na msisitizo kama vilivyokusudiwa, si kama alama.\n\nWeka faili kwenye folda ya maktaba na uzifungue kutoka maktaba. Kichwa cha kwanza ndicho jina lake; picha zilizo kando ya faili huonekana maandishi yanapozitaja."
format-markdown.title = Markdown
format-mobi.plugin.name = Vitabu vya MOBI
format-mobi.plugin.description = Hufungua faili za .mobi na .azw zisizo na DRM.
format-mobi.plugin.how = "Vitabu vya MOBI (.mobi, .azw) hufunguka kutoka maktaba kama kitabu chochote, bila kitu cha kusanidi. Jina, waandishi, lugha na jalada hutoka kwenye kitabu, na orodha ya yaliyomo hutengenezwa kutoka vichwa vyake.\n\nKitabu hubadilishwa mara ya kwanza unapokifungua, jambo linalochukua sekunde chache kwa kirefu; baada ya hapo hufunguka mara moja. Maandishi, vichwa, herufi nzito na za mlazo, viungo na picha huonyeshwa.\n\nVitabu vyenye DRM (vingi vilivyonunuliwa dukani) haviwezi kufunguliwa, wala vitabu vyenye ubanaji wa Huffman au vya umbo jipya la KF8 (.azw3): PaperPaw husema hivyo unapovifungua. Nakala kama EPUB, iliyotengenezwa kwa zana kama Calibre, hufunguka kila mara."
format-mobi.title = Vitabu vya MOBI
format-rtf.plugin.name = Hati za RTF
format-rtf.plugin.description = Hufungua faili za .rtf kama vitabu.
format-rtf.title = Hati za RTF
format-txt.plugin.name = Maandishi matupu
format-txt.plugin.description = Hufungua faili za maandishi matupu (.txt).
format-txt.plugin.how = "Faili za maandishi matupu (.txt) hufunguka kutoka maktaba kama kitabu chochote, bila kitu cha kusanidi. Programu jalizi husoma maandishi ya UTF-8, UTF-16 na Windows-1252 na hupata usimbaji yenyewe.\n\nAya hufuata mistari mitupu kwenye faili; ikiwa faili haina, kila mstari ni aya. Kwenye faili za Project Gutenberg maandishi ya leseni mwanzoni na mwishoni huachwa, na jina na mwandishi huchukuliwa kutoka kwenye kichwa.\n\nFaili haipakiwi nzima kamwe, kwa hivyo maandishi makubwa sana hufunguka hata kwenye vifaa vidogo."
format-txt.title = Maandishi matupu
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Hufungua vitabu vya XTC na XTCH, kurasa zilizochorwa tayari za visomaji vya Xteink.
format-xtc.plugin.how = "Faili za XTC na XTCH ni vitabu ambavyo kurasa zake tayari zimechorwa kama picha, kama zinavyotengenezwa na vibadilishaji vya visomaji vya Xteink. Hufunguka kutoka maktaba kama kitabu chochote.\n\nKwa kuwa kila ukurasa ni picha isiyobadilika, maandishi hayawezi kubadilishwa ukubwa wala kuwekwa kwa fonti nyingine. Kurasa ni nyeusi na nyeupe au zina vivuli vinne vya kijivu. Kila ukurasa husimbuliwa unapoonyeshwa, kwa hivyo kumbukumbu kidogo inahitajika, hata kwenye X4.\n\nJina, mwandishi na sura huchukuliwa kutoka kwenye faili ikiwa nazo."
format-xtc.title = Kurasa za XTC
help.plugin.name = Vidokezo
help.plugin.description = Huonyesha vidhibiti vya skrini vinafanya nini, mara ya kwanza inapofunguka.
help.plugin.how = "Mara ya kwanza skrini inapofunguka, dokezo fupi juu yake husema vidhibiti vyake vinafanya nini: sehemu za skrini ambazo kugusa huenda, zikiwa na fremu, na vitufe vinafanya nini.\n\nKugusa au kitufe chochote hufunga dokezo, na halirudi tena kwa skrini hiyo. Hakuna vidokezo zaidi huzima vyote.\n\nKwenye mipangilio, chini ya Mfumo, Vidokezo huviwasha au kuvizima, na Onyesha vidokezo tena hufanya dokezo la kila skrini lionyeshwe mara moja zaidi."
help.title = Jinsi inavyofanya kazi hapa
help.got-it = Nimeelewa
help.no-more = Hakuna vidokezo zaidi
