aids.plugin.name = Visaidizi vya kusoma
aids.plugin.description = Mwanzo wa maneno kwa herufi nzito, maneno yaliyobadilishwa, picha: maandishi kama unavyotaka.
aids.plugin.how = "Visaidizi vya kusoma hubadilisha jinsi maandishi ya kitabu yanavyoonekana unaposoma. Vinatumika kwa kila kitabu. Mwanzo wa maneno kwa herufi nzito na Badilisha maneno huwa vimezimwa mwanzoni.\n\nUtavipata kwenye Mipangilio, chini ya Kusoma, katika sehemu ya Visaidizi vya kusoma. Mwanzo wa maneno kwa herufi nzito huweka nusu ya kwanza ya kila neno kwa herufi nzito, jambo ambalo wengine huona rahisi kufuatilia. Badilisha maneno huchukua jozi zilizoandikwa kama \"Bw. = Bwana; Bi. = Bibi\", zikitenganishwa kwa nukta mkato.\n\nManeno mazima tu ndiyo hubadilishwa, hasa kama ulivyoyaandika, kwa hivyo sehemu ya neno refu zaidi haibadiliki kamwe. Faili ya kitabu yenyewe haibadilishwi.\n\nPicha zilizomo vitabuni zinaweza kuonyeshwa (kama mwanzoni), kubadilishwa kuwa mstari mfupi kama \"[Picha: meli baharini]\" unaotumia maelezo ya picha, au kuachwa. Ukurasa basi una nafasi zaidi ya maandishi, na hakuna kinachofunguliwa kwa picha isiyoonyeshwa, jambo linalofanya kurasa zigeuke haraka. Katuni na vitabu vingine vilivyotengenezwa kwa picha havibadilishwi."
