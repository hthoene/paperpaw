rules.plugin.name = Kanuni
rules.plugin.description = Kitu kikitokea, hufanya jambo: k.m. hali ya usiku saa 22:00.
rules.plugin.how = "Kanuni hufanya jambo yenyewe kitu kinapotokea: hali ya usiku kila siku saa 22:00, au katalogi zisawazishwe PaperPaw inapoanza.\n\nKanuni ziko kwenye Mipangilio chini ya Binafsisha, kama Kanuni. Ongeza kanuni huuliza Lini? (PaperPaw inapoanza, wakati wa siku, kitabu kinapofunguliwa au kufungwa, betri, kuchaji, swichi na zaidi) na Kisha nini? (tekeleza kitendo, washa au zima swichi, weka namba, onyesha ujumbe). Gusa kanuni ili kuisimamisha; ishikilie (kwa vitufe, shikilia Chagua) kwa sharti kama Kati ya nyakati mbili za siku, au ili kuiondoa.\n\nVitendo, swichi na namba za kuchagua hutoka kwa programu jalizi: chagua programu jalizi, kisha inacholeta; rudi hutoka ndani yake tena. Kitendo kinachofanya kazi kwenye skrini inayoonyeshwa, kama Rudi au Ukurasa unaofuata, hufanya kile ambacho kingefanya kikibonyezwa hapo.\n\nNyakati hutumika skrini yoyote ikiwa wazi. Kanuni mbili zinazobatilishana mara kwa mara husimama baada ya hatua chache."
