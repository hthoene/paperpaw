picture-home.plugin.name = Skrini ya mwanzo ya picha
picture-home.plugin.description = Skrini ya mwanzo yenye picha yako mwenyewe nyuma ya wijeti, na upau wa hali unaousanidi.
picture-home.plugin.how = "Skrini ya mwanzo ya picha huchukua nafasi ya skrini ya mwanzo ikiwa imewashwa: picha yako mwenyewe nyuma ya wijeti, na kurasa za wijeti na zana unazozipanga. Izime kwenye kidhibiti cha programu jalizi na skrini ya mwanzo iliyojengwa ndani inarudi, na kurasa zake zenyewe.\n\nWeka picha (JPEG, PNG au GIF) kwenye folda kwenye kadi (wallpapers kwa kawaida), kisha uchague moja kwenye Mipangilio, Binafsisha, Skrini ya mwanzo ya picha. Kutosha husema jinsi inavyojaza skrini (jaza, picha nzima, nyoosha, ukubwa halisi, vigae), Mahali sehemu gani inabaki, Kukuza ukubwa kiasi gani, na Pauza picha ni hafifu kiasi gani: picha iliyofifia hurahisisha kusoma wijeti. Picha huandaliwa mara moja kwa kila ukubwa wa skrini, jambo linalochukua muda mfupi.\n\nWijeti hukaa kwenye sahani juu ya picha. Panga ukurasa kama kwenye skrini ya mwanzo iliyojengwa ndani: penseli chini ya ukurasa, au Hariri skrini ya mwanzo kwenye menyu.\n\nUpau wa hali (saa, Wi-Fi, betri, au unachochagua) unaweza kuwashwa, kuzimwa au kuwa kiotomatiki, juu au chini, upana kamili au kidonge kidogo kushoto, katikati au kulia, kwenye sahani nyepesi, nyeusi au ya kijivu au kwenye picha yenyewe. Safu inayotaja vitufe (kwenye X4) inaweza kuwashwa, kuzimwa au kuwa kiotomatiki pia. Kiotomatiki humaanisha kubonyeza kitufe huvionyesha kwa sekunde chache; kubonyeza huko hakufanyi kingine.\n\nUchoraji wa picha husema jinsi picha inavyochorwa: Viwango vya kijivu kwa kila kijivu ambacho skrini ina (polepole zaidi kwenye X4), Dithering kwa nukta nyeusi na nyeupe (haraka), au Kiotomatiki, kama skrini ya mwanzo iliyojengwa ndani: viwango vya kijivu skrini inapochorwa, nukta baada ya badiliko la kwanza. Pale skrini haina viwango vya kijivu, viwango vya kijivu hurudi kwenye nukta."
