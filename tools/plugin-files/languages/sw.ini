pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Kipima muda cha umakini chenye raundi za kazi na mapumziko, wijeti na hesabu ya kila siku.
pomodoro.plugin.how = "Kipima muda cha Pomodoro: fanya kazi kwa raundi za umakini, kisha upumzike. Hakihitaji usanidi: dakika 25 za umakini, 5 za mapumziko, na baada ya raundi nne mapumziko marefu ya dakika 15.\n\nFungua Pomodoro kutoka menyu ya zana na ubonyeze Anza, au ongeza wijeti zake kwenye skrini ya mwanzo (shikilia skrini ya mwanzo, kisha uongeze wijeti): Kipima muda cha Pomodoro huonyesha awamu na dakika zilizobaki, Pomodoro anza/simamisha ni kitufe, na Pomodoro leo huhesabu raundi ulizokamilisha, pamoja na lengo lako la kila siku. Kugusa kipima muda hukianza au kukisimamisha; kishikilie ili kufungua skrini kamili.\n\nKipima muda huendelea kufanya kazi unapoondoka kwenye skrini, na huendelea kwa saa baada ya kuwasha upya. Kisomaji kikilala hakuna kinachoendeshwa: awamu iliyoisha wakati huo huelezwa kinapoamka. Taarifa hukuambia awamu inapoisha. Ili kuokoa betri saa husasishwa mara moja kwa dakika (kila sekunde kumi katika dakika ya mwisho kwenye skrini kamili) na haikiweki kisomaji macho kamwe.\n\nChini ya Pomodoro kwenye mipangilio unaweka urefu na raundi za seti, na kama awamu inayofuata inaanza yenyewe. Chini ya Zaidi: mmweko wa skrini au kupepesa kwa mwanga wa mbele awamu inapoisha na lengo la kila siku."
