battery.plugin.name = Matumizi ya betri
battery.plugin.description = Hurekodi betri na kuonyesha inadumu kwa muda gani.
battery.plugin.how = "Matumizi ya betri hunakili chaji karibu mara moja kwa dakika kifaa kikiwa macho, pamoja na kilichofanya: kuonyesha skrini upya na kurasa zilizogeuzwa. Kutokana na hilo hukokotoa saa moja ya kuwa macho na kurasa 100 zinachukua kiasi gani, na betri inadumu kwa muda gani kwa kasi hiyo.\n\nFungua Betri kutoka menyu ya Zana. Inaonyesha chaji sasa, muda huu wa kuwa macho, matumizi kwenye betri hadi sasa na nyakati zako za hivi karibuni za kuwa macho. Hugeuza kurasa kwa vitufe vya kurasa, au kwa kugusa mishale iliyo juu.\n\nInahitaji muda wa kusoma kwenye betri kabla ya takwimu kuwa na maana. Kurekodi kumewashwa kwa kawaida na kunaweza kuzimwa kwenye Mipangilio, chini ya Kifaa, Nishati, kama Rekodi matumizi ya betri."
