opds.plugin.name = Katalogi za OPDS
opds.plugin.description = Huvinjari katalogi za OPDS, hupakua vitabu vyake na kuweka folda zikiwa zimesawazishwa nazo.
opds.plugin.how = "Katalogi za OPDS ni maktaba za mtandaoni kama Project Gutenberg, Calibre-Web, Kavita au Komga. Programu jalizi hii huzivinjari na kuzitafuta kama folda na kupakua vitabu vyake kwenye maktaba.\n\nFungua Katalogi kutoka menyu ya Zana kisha uchague Ongeza katalogi: anwani na, ikiwa katalogi inahitaji akaunti, jina la mtumiaji na nenosiri. Gusa katalogi ili kuivinjari; ishikilie (kwa vitufe, shikilia Chagua) ili kuisawazisha, kuihariri au kuiondoa.\n\nKukiwa na Sawazisha katalogi hii kumewashwa, Sawazisha katalogi hupakua vitabu vyake vipya kwenye folda yake. Vitabu kwa kila usawazishaji hupunguza vingapi usawazishaji mmoja unaleta, ili katalogi kubwa isijaze kifaa. Folda ya wingu (WebDAV) hufanya kazi badala ya katalogi."
