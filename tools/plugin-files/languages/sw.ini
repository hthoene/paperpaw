power.plugin.name = Nishati
power.plugin.description = Huchagua hali ya nishati, kwa mkono au kwa betri: Kawaida, Kuokoa, Nje ya mtandao.
power.plugin.how = "Nishati huchagua jinsi PaperPaw inavyotumia betri: Kawaida, Kuokoa au Nje ya mtandao. Kuokoa hufanya yanayoweza kusubiri wakati bora; Nje ya mtandao huweka redio imezimwa. Otomatiki huchagua kwa betri.\n\nBadilisha hali kwenye paneli ya haraka, ambapo Nishati huonyesha hali kando kwa kando, au kwenye Mipangilio chini ya Nishati. Huko pia unaweka viwango ambapo Otomatiki hubadilisha kuwa Kuokoa na Nje ya mtandao, na kama inabaki Kawaida wakati wa kuchaji.\n\nKwenye mistari ya hali, Hali ya nishati huonyesha jani wakati wa kuokoa na Wi-Fi iliyokatwa mstari wakati nje ya mtandao, na hakuna kitu katika Kawaida.\n\nShikilia kitufe cha kuwasha ili kufungua menyu ndogo: Lala, Zima (pale PaperPaw inapoweza), Washa upya, na kwenye vifaa vya kugusa Funga mguso au Fungua mguso. Kubonyeza kwa muda mfupi bado hulaza kifaa. Rudi huondoka kwenye menyu."
