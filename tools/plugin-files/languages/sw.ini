vocabulary.sd.readme = "Kadi za kujifunza kutoka faili\n\nWeka faili hapa kwa kila staha: Spanish.tsv hutengeneza staha Spanish.\nFaili: .tsv, .csv au .txt, zilizohifadhiwa kama UTF-8, au .apkg: staha ya Anki, iliyosafirishwa kwa Saidia matoleo ya zamani ya Anki ikiwa imetiwa tiki. Sehemu tatu za kwanza za madokezo yake huwa mbele, nyuma na mfano; ratiba yake na media hazisomwi, na PaperPaw haiandiki faili ya Anki kamwe.\n\nKadi moja kwa kila mstari: mbele, nyuma na mfano (si lazima), vikitenganishwa kwa tab, koma au nukta mkato. Mstari wa kwanza unaweza kutaja safu wima: mbele, nyuma, mfano. Mfano:\n\npaka\tcat\tPaka analala.\n\nKisha fungua Kadi za kujifunza kwenye kisomaji, chagua Kadi kwenye kadi ya SD kisha Sasisha staha kutoka kwenye kadi.\n\nMambo ya kujua:\n- Staha hubaki kwenye kisomaji, pamoja na ulichojifunza. Faili husomwa ikiwa mpya au imebadilika, na kadi zake huongezwa kwenye staha au kubadilishwa huko.\n- Badilisha nyuma au mfano wa kadi kwenye faili: kadi hubadilika na kuweka maendeleo yako.\n- Badilisha maandishi ya mbele ya kadi: huhesabiwa kama kadi mpya, na ya zamani huanza upya. Kadi hulinganishwa kwa maandishi yao ya mbele, nafasi na herufi kubwa hazihesabiwi. Hifadhi staha kwenye faili (Kadi kwenye kadi ya SD, Hifadhi staha kwenye kadi) na kila kadi ina namba kwenye safu wima ya id: badilisha mbele huko, weka mistari miwili ya kwanza ya faili kama ilivyo, na kadi huweka ulichojifunza.\n- Kuhifadhi huandika kadi za staha. Kilichokuwa kwenye faili na si kadi (mstari usio na mbele) hakihifadhiwi; faili iliyokuwapo hunakiliwa kwenye _name.bak.tsv.\n- Hifadhi faili kama CSV UTF-8 (si UTF-16, si umbizo la lahajedwali lenyewe). Faili ya zaidi ya MiB 4 au mistari 20,000 haisomwi: igawanye.\n- Mstari unaoufuta kwenye faili haufuti kadi kwenye staha, isipokuwa uwashe Ondoa kadi zinazokosekana kwa staha hiyo. Kisha kadi huenda pamoja na ulichojifunza.\n- Faili ambazo majina yake yanaanza na _ hazisomwi.\n"
