mail.plugin.name = Barua pepe
mail.plugin.description = Husoma na kutuma barua pepe kwa nenosiri au nenosiri la programu (IMAP na SMTP), bila kuingia kupitia kivinjari.
mail.plugin.how = "Barua pepe husoma na kutuma barua pepe kupitia IMAP na SMTP. Huingia kwa anwani yako na nenosiri, bila kuingia kupitia kivinjari, kwa hivyo hufanya kazi na mtoa huduma yeyote anayeruhusu hilo.\n\nSanidi akaunti chini ya Mipangilio, Barua pepe. Chagua mtoa huduma wako, andika anwani yako na nenosiri. Watoa huduma wengi wanataka nenosiri la programu: litengeneze kwenye mipangilio ya usalama ya akaunti yako na ulitumie hapa. Nenosiri lako la kawaida mara nyingi halifanyi kazi, na halitoki popote isipokuwa kwenye seva ya mtoa huduma wako. Linahifadhiwa pamoja na manenosiri na funguo.\n\nFungua Barua pepe kwenye zana. Angalia barua pepe huleta barua za hivi karibuni na folda. Barua huhifadhiwa kwenye kadi, kwa hivyo unaweza kuzisoma bila mtandao. Kifaa huunganisha, huleta na hukata muunganisho, kwa hivyo Wi-Fi huwashwa kwa muda mfupi tu.\n\nIkiwa mtoa huduma wako hayuko kwenye orodha, chagua Seva zangu mwenyewe na uweke majina ya seva, milango na usalama chini ya mipangilio ya hali ya juu. Seva ambayo cheti chake hakidhaminiwi na mamlaka yoyote huuliza mara moja kama iaminiwe; linganisha alama ya kidole na kile mtoa huduma wako anachoonyesha.\n\nBarua yenye kitabu kilichoambatishwa (EPUB, PDF na kadhalika, hadi MB 2) ina Fungua kitabu chini yake: huleta faili, kuiweka kwenye maktaba yako na kuifungua.\n\nIli kuona barua mpya bila kufungua Barua pepe, washa Angalia barua mpya chinichini chini ya Mipangilio, Barua pepe, na uchague mara ngapi (kila dakika 15, 30 au 60). Imezimwa hadi uiwashe. Kisomaji kisha huunganisha mara kwa mara kupitia muunganisho salama kikiwa macho na mtandaoni, akaunti moja baada ya nyingine, na husasisha idadi ya ambazo hazijasomwa kwenye Mwanzo. Hutumia betri kidogo. Kufungua Barua pepe husimamisha ukaguzi unaoendelea.\n\nWijeti za skrini ya mwanzo huonyesha idadi ya barua ambazo hazijasomwa, za hivi karibuni na zenye nyota, kisanduku kimoja cha barua, na njia ya mkato ya kuandika barua."
