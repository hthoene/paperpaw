profiles.plugin.name = Wasifu wa kusoma
profiles.plugin.description = Seti zenye majina za mipangilio ya kusoma na onyesho, zinazobadilishwa kwa mguso mmoja.
profiles.plugin.how = "Wasifu huweka mipangilio yako ya kusoma, mipangilio ya onyesho na mistari ya hali chini ya jina, kama Usiku au Chapa kubwa, na huirudisha kwa mguso mmoja.\n\nFungua Wasifu kwenye menyu ya kusoma chini ya Zaidi, au kwenye Mipangilio chini ya Binafsisha. Gusa wasifu ili kuutumia; ule unaotumika umewekwa alama. Ushikilie (kwa vitufe, shikilia Chagua) ili kuhifadhi mipangilio ya sasa ndani yake, kuupa jina jipya au kuuondoa. Hifadhi kama wasifu mpya huweka kilichowekwa sasa.\n\nWasifu unaofuata hubadilisha hadi unaofuata kwenye orodha; uweke kwenye kitufe au kwenye kanuni."
