dictionary.plugin.name = Kamusi
dictionary.plugin.description = Hutafuta maneno kwenye kamusi za StarDict.
dictionary.plugin.how = "Kamusi hutafuta neno kutoka kitabuni kwenye kamusi za StarDict na kuonyesha maana kwenye paneli juu ya sehemu ya chini ya skrini.\n\nKwenye kisomaji, shikilia neno kisha uchague Tafuta maana; kwa vitufe, tumia Chagua maandishi chini ya Zaidi. Nakili folda za kamusi (zenye faili za .ifo, .idx na .dict) kwenye folda \"dictionaries\" kwenye kifaa, folda ndogo zikiwemo, au chagua folda nyingine kwenye Mipangilio, chini ya Kusoma, kama Folda ya kamusi (mpangilio wa hali ya juu). Utafutaji wa kwanza huandaa faharasa ndogo kwa kila kamusi, jambo linalochukua muda mfupi.\n\nKwenye paneli, vitufe vya kurasa au Juu na Chini husogeza maana ndefu, na Rudi huifunga. Kwa mguso, gusa nje yake ili kuifunga."
