menu.plugin.name = Menyu
menu.plugin.description = Menyu iliyo chini ya skrini, yenye vitendo na mipangilio.
menu.plugin.how = "Menyu huorodhesha unachoweza kufanya na kuweka. Hufunguka chini ya skrini, juu ya kilicho wazi: wakati wa kusoma, gusa katikati ya skrini au bonyeza Chagua. Gusa au chagua kipengee ili kukiendesha.\n\nMipangilio kwenye menyu huonyesha thamani yake na hubadilika mahali pale pale, kwa hivyo menyu hubaki wazi. Kipengee chenye vipengee zaidi hufungua menyu ndogo.\n\nTelezesha chini kutoka ukingo wa juu kwa paneli ya haraka: unachobadilisha mara nyingi, kama vitufe. Gusa kitufe ili kukibadilisha, kishikilie kwa mipangilio yake. Kwa vitufe tu, vitufe vya mishale huchagua, Chagua hubadilisha na Rudi hufunga. Chini ya Mwonekano, Menyu huonyesha menyu kama orodha au kama vigae."
