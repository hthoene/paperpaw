file-manager.plugin.name = Kidhibiti cha faili
file-manager.plugin.description = Kila folda na faili kwenye kifaa: zifungue, zipe jina jipya, zihamishe, zinakili na uzifute.
file-manager.plugin.how = "Kidhibiti cha faili huonyesha kila folda na faili kwenye hifadhi ya kifaa, si vitabu vyako tu, na hukuruhusu kuvifungua, kuvipa jina jipya, kuvihamisha, kuvinakili na kuvifuta, na kutengeneza folda mpya.\n\nFungua Faili kutoka menyu ya Zana. Gusa folda ili kuingia ndani; Rudi hurudi kwenye folda iliyo juu. Gusa faili, au shikilia kipengee chochote (kwa vitufe, shikilia Chagua), ili kuona kinachoweza kufanywa nacho. Hamisha na Nakili huchagua kipengee: nenda kwenye folda ambako kinapaswa kuwa kisha uchague Bandika hapa kwenye upau wa chini. Kwa vitufe, bonyeza Chini kutoka kipengee cha mwisho ili kufikia upau.\n\nFaili na folda zinazoanza kwa nukta, kama data ya PaperPaw yenyewe, zimefichwa. Ili kuziona, washa Faili zilizofichwa kwenye Mipangilio, chini ya Maktaba."
