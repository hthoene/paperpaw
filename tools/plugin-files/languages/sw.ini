settings.plugin.name = Mipangilio
settings.plugin.description = Kurasa za mipangilio, zilizojengwa kutoka mipangilio ya kila programu jalizi.
settings.plugin.how = "Mipangilio huonyesha kila kitu kinachoweza kuwekwa katika PaperPaw na programu jalizi zake, kwenye kurasa. Programu jalizi hazihitaji skrini yake: kile wanachotangaza huonekana hapa, kwenye vikundi, na maelezo ya kila mpangilio chini yake.\n\nIfungue kwa Mipangilio kwenye menyu. Gusa kikundi ili kukifungua, kisha mpangilio ili kuubadilisha au kuuchagua; namba zina vitufe − na +. Kwa vitufe, sogea hadi mpangilio kisha ubonyeze Chagua: kushoto na kulia hubadilisha namba, Chagua huiweka, Rudi hurudi kwenye thamani ya awali.\n\nMabadiliko hutumika mara moja. Tafuta hupata mpangilio kwa maneno na Mipangilio ya hali ya juu huongeza ile isiyohitajika mara chache. Weka upya kuwa chaguomsingi na Weka upya zote huuliza kwanza."
