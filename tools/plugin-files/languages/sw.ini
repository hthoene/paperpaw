wifi.plugin.name = Wi-Fi
wifi.plugin.description = Hujiunga na mitandao ya Wi-Fi inapohitajika na kuzima redio baadaye.
wifi.plugin.how = "Wi-Fi hujiunga na mtandao programu jalizi inapohitaji intaneti (katalogi, usawazishaji, duka, uhamishaji) na kuzima redio tena dakika moja baada ya kutotumika, au mara moja Mwanzo au kitabu kinapoonyeshwa, ili kuokoa betri na kumbukumbu.\n\nFungua Wi-Fi kutoka Mipangilio, au kutoka kipengee cha Wi-Fi kwenye mstari wa hali. Mitandao huorodhesha iliyo karibu; chagua mmoja na uandike nenosiri lake, au uchague Sanidi kwa simu na uandike jina na nenosiri kwenye kivinjari cha simu yako badala ya kwenye kifaa. Sahau huondoa mtandao uliohifadhiwa.\n\nManenosiri hubaki kwenye kadi, yakihifadhiwa salama, na hayaonyeshwi tena kamwe. Chini ya Unganisha inapohitajika unaweka Wi-Fi inabaki imewashwa kwa muda gani baada ya matumizi ya mwisho, kama inabaki imewashwa wakati wa kuchaji, na mtandao upi uliohifadhiwa huja kwanza kadhaa wakiwa karibu."
