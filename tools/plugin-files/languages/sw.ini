calibre.plugin.name = Maktaba isiyotumia waya
calibre.plugin.description = Hupokea vitabu kupitia mtandao. Hufanya kazi kama kifaa kisichotumia waya cha Calibre.
calibre.plugin.how = "Maktaba isiyotumia waya huruhusu kifaa kionekane kwenye Calibre kwenye kompyuta yako kama kifaa kisichotumia waya. Calibre inaweza kisha kukitumia vitabu, kuviorodhesha na kuvifuta. Vitabu huingia kwenye maktaba.\n\nFungua Maktaba isiyotumia waya kutoka menyu ya Zana, kifaa na kompyuta zikiwa kwenye mtandao mmoja wa Wi-Fi. Kwenye Calibre chagua Unganisha/shiriki, kisha Anza muunganisho wa kifaa kisichotumia waya. Kifaa kikishapata kompyuta yako huonyesha jina lake; gusa Unganisha (kwa vitufe, bonyeza Chagua). Calibre inaweza kuongeza na kufuta vitabu hapa, kwa hivyo unganisha tu na kompyuta yako mwenyewe. Kufunga skrini humaliza muunganisho.\n\nCalibre isipopatikana yenyewe, ingiza anwani ya kompyuta yake kwenye Mipangilio, chini ya Maktaba, kama Anwani katika sehemu ya Calibre. Calibre ikitumia mlango tofauti na 9090, uongeze kama :mlango, k.m. 192.168.1.20:9091."
