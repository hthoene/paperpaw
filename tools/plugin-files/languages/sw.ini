transfer.plugin.name = Uhamishaji
transfer.plugin.description = Weka vitabu na faili nyingine kwenye kifaa kutoka kivinjari kwenye mtandao uleule.
transfer.plugin.how = "Uhamishaji wa Wi-Fi huweka vitabu na faili nyingine kwenye kifaa kutoka kivinjari kwenye mtandao uleule, bila kebo wala programu. Unaweza pia kupakua faili, kutengeneza folda na kufuta.\n\nUfungue kutoka Zana. Skrini inaonyesha anwani kama maandishi na kama msimbo wa QR: ifungue kwenye kivinjari kwenye simu au kompyuta, au changanua msimbo. Anwani ina ufunguo unaotengenezwa upya kila mara, ili wengine kwenye mtandao wasifikie faili zako. Uhamishaji unaendelea skrini ikiwa wazi.\n\nPale PaperPaw inapoendesha Wi-Fi yenyewe, kama kwenye X4, Bila kipanga njia chini hufungua mtandao wa kifaa chenyewe, ambao simu hujiunga nao kwa kuchanganua msimbo."
