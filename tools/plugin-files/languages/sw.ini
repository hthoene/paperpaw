anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Husoma kadi za Anki zinazotakiwa kwenye kompyuta yako na kutuma majibu yako nyuma, kupitia nyongeza ya AnkiConnect.
anki.plugin.how = "Anki hukuruhusu usome kwenye kisomaji kadi zinazotakiwa katika Anki kwenye kompyuta yako, na hutuma majibu yako nyuma. Hutumia nyongeza huru ya AnkiConnect (msimbo wa nyongeza 2055492159) na kamwe si AnkiWeb. Imezimwa mwanzoni: iongeze kutoka kwenye Duka la programu jalizi.\n\nKwenye kompyuta: sakinisha AnkiConnect kwenye Anki (Zana, Nyongeza, Pata nyongeza) kisha uwashe Anki upya. Anki lazima iwe wazi unaposawazisha.\n\nKwa kawaida AnkiConnect hujibu tu kompyuta inayoendeshwa juu yake (127.0.0.1), kwa hivyo kisomaji hakiwezi kuifikia. Fungua Zana, Nyongeza, AnkiConnect, Usanidi kisha uweke \"webBindAddress\" kuwa \"0.0.0.0\" (isikilize mtandao wa nyumbani). Mlango, \"webBindPort\", ni 8765 usipoubadilisha. Ukiweka \"apiKey\" huko, ingiza ufunguo uleule hapa. Washa Anki upya baada ya kubadilisha usanidi, na iruhusu Anki kupita kwenye firewall ya kompyuta ikiuliza. Tumia hili tu kwenye mtandao unaouamini: yeyote aliye juu yake anaweza kufikia AnkiConnect, kwa hivyo ufunguo ni wazo zuri.\n\nKwenye kisomaji: fungua Anki kutoka Zana, kisha ingiza anwani ya kompyuta (kwa mfano 192.168.1.20) chini ya Kompyuta, mlango kama si 8765, na ufunguo wa API ikiwa uliweka. Chagua Staha, au iache tupu kwa staha zote. Kisha chagua Sawazisha na Anki, Wi-Fi ikiwa imewashwa: majibu yako yanayosubiri hutumwa kwanza, kisha kadi zinazotakiwa (na idadi ya kadi mpya uliyoweka) huletwa, upeo wa 50. Chagua Jifunze ili uzipitie, bila mtandao: onyesha jibu kisha uliweke daraja Tena, Ngumu, Nzuri au Rahisi. Majibu yako huhifadhiwa kwenye kisomaji, hata bila Wi-Fi, na huenda Anki kwa usawazishaji unaofuata. Anki huamua kadi inarudi lini: kadi uliyojibu Tena huletwa tena na usawazishaji unaofuata Anki itakapoiita inatakiwa.\n\nSawazisha Anki inapofunguliwa, kwenye mipangilio, husawazisha kila unapofungua skrini. Hakuna kinachotumia mtandao unapobonyeza kitufe."
