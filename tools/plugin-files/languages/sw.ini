weather.plugin.name = Hali ya hewa
weather.plugin.description = Hali ya hewa sasa na siku zijazo kama wijeti, kutoka Open-Meteo.
weather.plugin.how = "Hali ya hewa huonyesha hali ya hewa sasa na siku zijazo kama wijeti za skrini ya mwanzo, kutoka Open-Meteo, ambayo haihitaji akaunti wala ufunguo. Hali ya hewa sasa huonyesha halijoto, hali na zaidi ya kuchagua; Utabiri huonyesha siku zijazo kwa safu au orodha.\n\nKwanza chagua mahali: kwenye mipangilio, chini ya Hali ya hewa, Mahali (andika jina, kisha ulichague kutoka maeneo yaliyopatikana). Viwianishi vyake tu hutumwa, na tu wijeti ya hali ya hewa inapoonyeshwa. Ongeza wijeti kwa kuhariri skrini ya mwanzo.\n\nHali ya hewa hupakuliwa kwa mara nyingi zaidi kama Sasisha kila mara moja kwa upeo inavyosema, na tu mtandao upo: haiwashi Wi-Fi yenyewe kamwe.\n\nData ya hali ya hewa na Open-Meteo.com (https://open-meteo.com), chini ya leseni ya Creative Commons Attribution 4.0 (CC BY 4.0)."
