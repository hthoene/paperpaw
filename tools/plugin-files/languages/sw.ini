widgets.plugin.name = Kifurushi cha wijeti
widgets.plugin.description = Wijeti nyingi zaidi za skrini ya mwanzo: saa, kalenda, nukuu, vitabu, madokezo na zaidi.
widgets.plugin.how = "Kifurushi cha wijeti huongeza wijeti nyingi za skrini ya mwanzo: saa (analogi, ya maneno, ya vigae, za dunia), kalenda, mwaka hadi sasa, kuhesabu kurudi nyuma, awamu ya mwezi, na siku na tarehe; nukuu ya siku, madokezo, kazi, picha, salamu na nembo ya PaperPaw; na kwa vitabu, kinachosomwa sasa, maendeleo, kinachofuata, mfululizo, vipendwa, mwangaza na maktaba kwa namba. Wijeti ya betri imo pia.\n\nZiongeze kwa Hariri skrini ya mwanzo kwenye menyu (au kubonyeza kwa muda mrefu kwenye skrini ya mwanzo), kisha Ongeza wijeti. Kila moja ina mipangilio yake, kama fremu, ukubwa na mpangilio. Kuchagua wijeti inayobadilika, kama nukuu ya siku, huonyesha inayofuata. Nukuu zako mwenyewe huingia kwenye quotes.txt katika .paperpaw/plugins/widgets kwenye kadi, kila mstari kama maandishi | mwandishi. Wijeti za wakati zinahitaji saa iwekwe; Wi-Fi huiweka."
