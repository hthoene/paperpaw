picture-home.plugin.name = Ekran kryesor me foto
picture-home.plugin.description = Një ekran kryesor me fotografinë tënde pas miniaplikacioneve, dhe një shirit gjendjeje që e konfiguron vetë.
picture-home.plugin.how = "Ekrani kryesor me foto e zëvendëson ekranin kryesor sa kohë është i ndezur: fotografia jote pas miniaplikacioneve, dhe faqet e miniaplikacioneve e të mjeteve që i rendit. Fike te menaxheri i shtojcave dhe kthehet ekrani kryesor i ndërtuar brenda, me faqet e veta.\n\nVendos fotografi (JPEG, PNG ose GIF) në një dosje në kartë (wallpapers si parazgjedhje), pastaj zgjidh një te Cilësimet, Personalizo, Ekran kryesor me foto. „Përshtatja“ thotë si e mbush ekranin (mbush, e tëra, shtrirë, madhësia origjinale, pllaka), „Pozicioni“ cila pjesë mbetet, „Zmadhimi“ sa e madhe, dhe „Çelëso fotografinë“ sa e zbehtë: një fotografi më e zbehtë i bën miniaplikacionet më të lexueshme. Fotografia përgatitet një herë për çdo madhësi ekrani, gjë që zgjat një çast.\n\nMiniaplikacionet qëndrojnë në pllaka mbi fotografi. Rendite faqen si në ekranin kryesor të ndërtuar brenda: lapsi nën faqe, ose Redakto ekranin kryesor në meny.\n\nShiriti i gjendjes (ora, Wi-Fi, bateria, ose çfarë zgjedh) mund të jetë i ndezur, i fikur ose automatik, lart ose poshtë, gjerësi e plotë ose një pilulë e vogël majtas, në mes ose djathtas, në një pllakë të çelët, të errët ose gri ose mbi vetë fotografinë. Rreshti që emërton butonat (në X4) mund të jetë gjithashtu i ndezur, i fikur ose automatik. Automatik do të thotë se një shtypje butoni i shfaq për disa sekonda; ajo shtypje nuk bën asgjë tjetër.\n\n„Vizatimi i fotografisë“ thotë si vizatohet fotografia: „Nivele gri“ në çdo gri që ka ekrani (më ngadalë në X4), „Me pika“ me pika bardhezi (shpejt), ose „Automatik“, si ekrani kryesor i ndërtuar brenda: nivele gri kur vizatohet ekrani, pika pas ndryshimit të parë. Aty ku një ekran nuk ka nivele gri, nivelet gri kthehen në pika."
