profiles.plugin.name = Profilet e leximit
profiles.plugin.description = Grupe me emër të cilësimeve të leximit dhe ekranit, që ndërrohen me një prekje.
profiles.plugin.how = "Një profil mban cilësimet e leximit, cilësimet e ekranit dhe rreshtat e gjendjes nën një emër, si Nata ose Shkronja të mëdha, dhe i kthen me një prekje.\n\nHap Profilet në menynë e leximit te Më shumë, ose te Cilësimet nën Personalizo. Prek një profil për ta përdorur; ai në përdorim është i shënuar. Mbaje shtypur (me butona, mbaj shtypur Zgjidh) për të ruajtur cilësimet aktuale në të, për ta riemërtuar ose për ta hequr. „Ruaj si profil të ri“ mban çfarë është caktuar tani.\n\n„Profili tjetër“ kalon te tjetri në listë; vendose në një buton ose në një rregull."
