koreader.plugin.name = Ndarja e theksimeve
koreader.plugin.description = Ndan faqeshënuesit dhe theksimet me KOReader për librat e lexuar në të dyja.
koreader.plugin.how = "Kjo shtojcë ndan faqeshënuesit dhe theksimet me KOReader për librat që i lexon në të dyja, në një pajisje ose në një dosje biblioteke të sinkronizuar mes pajisjeve. Nuk ka asgjë për të caktuar.\n\nKur PaperPaw hap një libër që e ka hapur edhe KOReader, dhe kur ndryshon faqeshënuesit ose theksimet e tij, merr çfarë është e re nga të dhënat e KOReader pranë librit dhe lë çfarë është e re këtu që ta marrë KOReader herën tjetër që e hap librin. Shenjat e hequra dhe shënimet e ndryshuara kalojnë gjithashtu.\n\nKjo funksionon vetëm për libra EPUB. Nëse skedari i njërës anë nuk lexohet dot, asgjë nuk ndryshon në asnjërën anë derisa të lexohet."
koreader.removed-there = Skedari i KOReader nuk ka më theksime. T'i heqësh edhe këtu?
koreader.removed-there.text = Mund të jenë hequr në KOReader, ose skedari i tij mund të ketë ardhur nga një pajisje tjetër. „Mbaji“ i lë këtu dhe ia jep sërish KOReader.
