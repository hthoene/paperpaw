smart-home.plugin.name = Shtëpia e mençur
smart-home.plugin.description = Vlera dhe çelësa nga Home Assistant yt në një panel dhe si miniaplikacione të ekranit kryesor. Punon me Home Assistant në rrjetin tënd të shtëpisë.
smart-home.plugin.how = "Shtëpia e mençur shfaq vlera dhe çelësa nga Home Assistant yt: temperatura, lagështi, energji, dyer e dritare, drita, çelësa dhe skena. Flet me serverin tënd nëpërmjet REST API në rrjetin tënd të shtëpisë; asgjë nuk kalon nga ndonjë shërbim tjetër.\n\nHap Shtëpia e mençur nga menyja e mjeteve, pastaj Lidhja: shkruaj adresën e Home Assistant (për shembull http://homeassistant.local:8123) dhe një token qasjeje afatgjatë (krijo një në fund të faqes së profilit në Home Assistant). Token-i ruhet mes fjalëkalimeve dhe çelësave, kurrë në një skedar cilësimesh. Http i thjeshtë përdoret vetëm për adresa në rrjetin tënd të shtëpisë; për një server gjetkë ndiz „Serverë jashtë rrjetit të shtëpisë“ te cilësimet dhe përdor https me një certifikatë të vlefshme.\n\n„Zgjidh entitetet“ hap një listë me ç'ka serveri yt: kërko sipas emrit ose id-së dhe zgjidh një entitet për ta shfaqur (zgjidhe përsëri për ta hequr). Mund t'i japësh një dhomë, që e grupon në panel dhe në miniaplikacionet e dhomave. Mbahen deri në 24 entitete. Në panel zgjidh një dritë, çelës ose skenë për ta ndërruar: rreshti shfaq përgjigjen e serverit. Një sensor që zgjedh lexohet sërish.\n\nMiniaplikacionet (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion): „Vlera e shtëpisë së mençur“ shfaq një matje të madhe, „grupi“ rendit entitetet e një dhome, „çelësi“ është një buton për një dritë ose çelës, dhe „dhoma“ është një kartë me matjet dhe çelësat e një dhome. Cilësimet e çdo miniaplikacioni thonë cilin entitet ose dhomë shfaq.\n\nShtëpia lexohet kur hap panelin, kur e kërkon (rreshti Rifresko ose një prekje mbi një miniaplikacion vlere ose grupi), kur lexuesi zgjohet aty ku Wi-Fi është ndezur tashmë, dhe sipas orarit që cakton ndërsa karikuesi është i lidhur. Nuk e ndez kurrë radion vetë dhe nuk e mban kurrë të ndezur."
