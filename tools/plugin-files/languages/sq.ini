notes-overview.plugin.name = Të gjitha shënimet
notes-overview.plugin.description = Faqeshënuesit dhe theksimet e të gjithë librave në një listë, dhe një eksport si My Clippings.txt.
notes-overview.plugin.how = "Të gjitha shënimet rendit çdo libër në të cilin ke bërë një faqeshënues ose një theksim, me sa janë. Hape te Mjete. Zgjidh një libër për të parë shënimet e tij, dhe një shënim për të hapur librin në atë vend.\n\nNë fund të listës, „Eksporto si My Clippings.txt“ i shkruan të gjitha shënimet në një skedar, në dosjen Exports pranë bibliotekës, në formën që përdor Kindle (UTF-8). Aplikacionet që lexojnë My Clippings.txt të një Kindle mund ta lexojnë. Një shënim mbi një theksim është një zë më vete, si në Kindle. Meqë një libër këtu nuk ka vendndodhje Kindle, „vendndodhja“ është sa thellë në libër është shënimi, në përqindje. Skedari shkruhet sërish çdo herë; zëvendëson atë të mëparshmin."
