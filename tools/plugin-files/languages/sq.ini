lock.plugin.name = Kyçja e ekranit
lock.plugin.description = Një PIN, një motiv ose një fjalëkalim kur pajisja zgjohet; prekja e kyçur gjatë leximit.
lock.plugin.how = "Kyçja e ekranit kërkon një PIN, një motiv ose një fjalëkalim kur niset PaperPaw dhe kur zgjohet pajisja. Në fillim është e fikur. Mban jashtë vetëm përdorimin e rastësishëm: kodi dhe numri i provave të gabuara ruhen në kartën SD, ndaj kushdo që e nxjerr kartën, e redakton ose e këmben e kalon kyçjen.\n\nCaktoje te cilësimet, nën Pajisja, Kyçja e ekranit: fut kodin në përdorim nëse ka, zgjidh llojin, pastaj kodin e ri dy herë. Motivi ofrohet vetëm në ekranet me prekje.\n\nPas pesë provave të gabuara, e para pas tyre pret gjysmë minutë. „Kyçe tani“ kyç menjëherë dhe mund të vihet në një buton, një gjest ose një rregull. „Kyçe pas zgjimit“ mund të fiket, që të kyçë vetëm një nisje e vërtetë (ndezja ose rindezja), përveç aty ku çdo zgjim është nisje, si në X4 me bateri.\n\nKyçja e prekjes, pranë saj: „Kyç prekjen“ në panelin e shpejtë dhe në menynë e leximit bën që prekjet, rrëshqitjet dhe lapsi të mos bëjnë asgjë ndërsa butonat punojnë prapë, p.sh. për të lexuar me një dorë në ekran. Për ta zhbllokuar, prek dy herë me një gisht dhe mbaje poshtë një çast; mbajtja e butonit të ndezjes hap menynë e Energjisë, ku „Zhbllokoje prekjen“ e bën me butona; në X4 Pro, mbajtja e tastit Kreu e zhbllokon menjëherë."
