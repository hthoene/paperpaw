battery.plugin.name = Përdorimi i baterisë
battery.plugin.description = Regjistron baterinë dhe tregon sa zgjat.
battery.plugin.how = "Përdorimi i baterisë shënon ngarkesën afërsisht një herë në minutë ndërsa pajisja është zgjuar, së bashku me atë që ka bërë: rifreskime ekrani dhe faqe të kthyera. Prej kësaj llogarit sa harxhojnë një orë zgjuar dhe 100 faqe, dhe sa zgjat bateria me këtë ritëm.\n\nHap Bateria nga menyja Mjete. Shfaq ngarkesën tani, këtë kohë zgjuar, përdorimin me bateri deri tani dhe kohët e tua të fundit zgjuar. Kalon nëpër faqe me butonat e faqes, ose duke prekur shigjetat lart.\n\nKërkon pak kohë leximi me bateri para se shifrat të kenë kuptim. Regjistrimi është i ndezur si parazgjedhje dhe mund të fiket te Cilësimet, nën Pajisja, Energjia, si Regjistro përdorimin e baterisë."
