wifi.plugin.name = Wi-Fi
wifi.plugin.description = Lidhet me rrjete Wi-Fi kur nevojitet dhe e fik radion pas përdorimit.
wifi.plugin.how = "Wi-Fi lidhet me një rrjet kur një shtojcë ka nevojë për internetin (një katalog, një sinkronizim, dyqani, një transferim) dhe e fik radion një minutë pasi nuk e përdor asgjë, ose menjëherë kur shfaqet Kreu ose një libër, për të kursyer bateri dhe kujtesë.\n\nHap Wi-Fi nga Cilësimet, ose nga zëri Wi-Fi në rreshtin e gjendjes. „Rrjetet“ rendit ato në rreze; zgjidh një dhe shkruaj fjalëkalimin e tij, ose zgjidh „Cakto me telefon“ dhe shkruaj emrin e fjalëkalimin në shfletuesin e telefonit tënd në vend të pajisjes. „Harroje“ heq një rrjet të ruajtur.\n\nFjalëkalimet qëndrojnë në kartë, të ruajtura në mënyrë të sigurt, dhe nuk shfaqen më kurrë. Te „Lidhu kur nevojitet“ cakton sa gjatë qëndron Wi-Fi i ndezur pas përdorimit të fundit, nëse qëndron i ndezur gjatë ngarkimit, dhe cili rrjet i ruajtur vjen i pari kur disa janë në rreze."
