reading-goal.plugin.name = Objektivi i leximit
reading-goal.plugin.description = Minuta për të lexuar në ditë, dhe një mace në ekranin kryesor që gjendja e saj ndjek leximin e sotëm.
reading-goal.plugin.how = "Një mace në ekranin tënd kryesor tregon si po shkon leximi i sotëm: e trishtuar derisa nuk ke lexuar ende, e pakënaqur pas pak leximi, e kënaqur nga gjysma e objektivit ditor, e lumtur sapo ta kesh arritur.\n\nShto miniaplikacionin „Macja e leximit“ në ekranin kryesor (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion), ose zgjidh „Macja e leximit të sotëm“ si ekran gjumi. Një prekje mbi macen hap objektivin ditor; është objektivi i statistikave të leximit, që numërojnë minutat që lexon.\n\nTe cilësimet, nën Leximi, „E kënaqur nga“ dhe „E lumtur nga“ caktojnë nga cila pjesë e objektivit macja është e kënaqur ose e lumtur, dhe „Fotografi të mia“ një dosje fotografish (e trishtuar, e pakënaqur, e kënaqur dhe e lumtur) për t'u shfaqur në vend të maceve. Fotografitë janë skedarë PNG ose JPEG; pa dosje, shfaqen macet."
