opds.plugin.name = Katalogët OPDS
opds.plugin.description = Shfleton katalogët OPDS, shkarkon librat e tyre dhe mban dosje të sinkronizuara me ta.
opds.plugin.how = "Katalogët OPDS janë biblioteka në linjë si Project Gutenberg, Calibre-Web, Kavita ose Komga. Kjo shtojcë i shfleton dhe i kërkon si dosje dhe shkarkon librat e tyre në bibliotekë.\n\nHap Katalogët nga menyja Mjete dhe zgjidh Shto katalog: një adresë dhe, nëse katalogu kërkon një llogari, një emër përdoruesi dhe fjalëkalim. Prek një katalog për ta shfletuar; mbaje shtypur (me butona, mbaj shtypur Zgjidh) për ta sinkronizuar, redaktuar ose hequr.\n\nMe „Sinkronizo këtë katalog“ të ndezur, „Sinkronizo katalogët“ shkarkon librat e tij të rinj në dosjen e tij. „Libra për sinkronizim“ kufizon sa libra merr një sinkronizim, ndaj një katalog i madh nuk e mbush pajisjen. Një dosje në re (WebDAV) funksionon në vend të një kataloku."
