puzzles.plugin.name = Enigma
puzzles.plugin.description = Sudoku, fjalëkryqe dhe probleme shahu, pa rrjet, me një enigmë të ditës.
puzzles.plugin.how = "Enigma për trenin dhe dhomën e pritjes, të gjitha pa rrjet: sudoku, fjalëkryqe dhe probleme shahu. Hap Enigma nga menyja e mjeteve, ose shto miniaplikacionin „Enigma e ditës“ në ekranin kryesor (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion): shfaq sa larg është sudoku i sotëm dhe një prekje e hap. Sudoku i ditës është i njëjtë gjatë gjithë ditës.\n\nSudoku: majtas e djathtas e lëvizin kursorin katror pas katrori, lart e poshtë (butonat e faqes) një rresht. Zgjidh hap shifrat: zgjidh një dhe zgjidh përsëri për ta vendosur, ose Pastro për ta zbrazur katrorin. Mbaj shtypur Zgjidh (ose Menyja) për të arritur te butonat nën tabelë: Shënime i kthen shifrat në shenja lapsi, Kontrollo shënon katrorët e gabuar, Zhbëj kthen lëvizjen e fundit, E re nis një enigmë të nivelit që zgjedh (E lehtë, Mesatare, E vështirë). Çdo enigmë ka saktësisht një zgjidhje. Loja ruhet kur largohesh. Në ekranin me prekje prek një katror.\n\nFjalëkryqe: vendos skedarë .puz (Across Lite) ose .ipuz në dosjen „puzzles“ në kartën e kujtesës; asnjë nuk është i përfshirë. Lëviz mbi rrjetë, pastaj zgjidh për të shkruar fjalën nën kursor në tastierë (një nënvizë e lë një katror bosh). Butonat kalojnë mes horizontales e vertikales, shfaqin listën e treguesve, kontrollojnë shkronjat dhe zbulojnë fjalën. Shkronjat ruhen për çdo skedar. Skedarët .puz të përzier nuk hapen.\n\nProbleme shahu: një set i vogël nga baza e të dhënave të problemeve të Lichess (CC0). Majtas e djathtas kërcejnë nga figura në figurë, zgjidh figurën që do të lëvizësh, pastaj majtas e djathtas nëpër vendet ku mund të shkojë, dhe zgjidh përsëri. Një lëvizje e gabuar kthehet pas. „Ndihmë“ shënon figurën për t'u lëvizur, „Tjetra“ shkon te problemi tjetër.\n\nTabela rivizatohet vetëm te katrorët që ndryshojnë. Statistikat numërojnë enigmat që ke zgjidhur."
