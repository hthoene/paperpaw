translate.plugin.name = Përkthimi
translate.plugin.description = Përkthen tekstin e zgjedhur në linjë, me DeepL.
translate.plugin.how = "Përkthimi përkthen tekstin e zgjedhur në linjë me DeepL. Zgjidh tekst në një libër dhe zgjidh Përkthe në menynë e tekstit të zgjedhur: përkthimi shfaqet mbi faqe si një zë fjalori. Butonat e faqes ose prekjet e lëvizin, dhe Zgjidh ose një prekje në fund të tij e mbyll.\n\nKërkon një rrjet dhe një çelës API të DeepL të yti, falas te deepl.com (DeepL API Free, rreth 500.000 shkronja në muaj). Derisa ta fusësh, paneli e thotë këtë, dhe një prekje e kërkon.\n\nTe cilësimet, nën Leximi, në seksionin Përkthimi, „Përkthe në“ cakton gjuhën; në fillim është gjuha e vetë PaperPaw."
