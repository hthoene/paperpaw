widgets.plugin.name = Paketa e miniaplikacioneve
widgets.plugin.description = Shumë miniaplikacione të tjera për ekranin kryesor: ora, një kalendar, citate, libra, shënime e më shumë.
widgets.plugin.how = "Paketa e miniaplikacioneve shton shumë miniaplikacione për ekranin kryesor: ora (analoge, me fjalë, me pllaka, botërore), një kalendar, viti deri tani, një numërim mbrapsht, faza e hënës, dhe dita e data; një citat i ditës, shënime, detyra, fotografi, një përshëndetje dhe logoja e PaperPaw; dhe për librat, ç'po lexon, përparimi, i radhës, seritë, të preferuarit, një theksim dhe biblioteka në shifra. Brenda saj ka edhe një miniaplikacion baterie.\n\nShtoji me „Redakto ekranin kryesor“ në meny (ose një shtypje të gjatë mbi ekranin kryesor), pastaj „Shto një miniaplikacion“. Secili ka cilësime të veta, si korniza, madhësia dhe rreshtimi. Zgjedhja e një miniaplikacioni që ndryshon, si citati i ditës, shfaq tjetrin. Citatet e tua shkojnë te quotes.txt në .paperpaw/plugins/widgets në kartë, çdo rresht si tekst | autor. Miniaplikacionet e kohës kërkojnë që ora të jetë caktuar; Wi-Fi e cakton."
