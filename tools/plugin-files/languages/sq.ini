anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Studion kartat e radhës të Anki-t në kompjuterin tënd dhe ia dërgon përgjigjet përsëri, nëpërmjet shtesës AnkiConnect.
anki.plugin.how = "Anki të lejon të studiosh në lexues kartat që janë të radhës në Anki në kompjuterin tënd dhe ia dërgon përgjigjet përsëri. Përdor shtesën e lirë AnkiConnect (kodi i shtesës 2055492159) dhe asnjëherë AnkiWeb. Në fillim është e fikur: shtoje nga Dyqani i shtojcave.\n\nNë kompjuter: instalo AnkiConnect në Anki (Tools, Add-ons, Get Add-ons) dhe rinise Anki-n. Anki duhet të jetë i hapur gjatë sinkronizimit.\n\nSi parazgjedhje AnkiConnect i përgjigjet vetëm kompjuterit ku punon (127.0.0.1), prandaj lexuesi nuk e arrin dot. Hap Tools, Add-ons, AnkiConnect, Config dhe vendos „webBindAddress“ në „0.0.0.0“ (dëgjon në rrjetin e shtëpisë). Porta, „webBindPort“, është 8765 përveç nëse e ndryshon. Nëse vendos një „apiKey“ atje, fute të njëjtin çelës këtu. Rinise Anki-n pas ndryshimit të konfigurimit dhe lejoje Anki-n në murin e zjarrit të kompjuterit nëse pyet. Përdore këtë vetëm në një rrjet që i beson: kushdo në të mund ta arrijë AnkiConnect, ndaj një çelës është ide e mirë.\n\nNë lexues: hap Anki nga Mjete, pastaj fut adresën e kompjuterit (për shembull 192.168.1.20) te Kompjuteri, portën nëse nuk është 8765 dhe çelësin API nëse ke vendosur një. Zgjidh një Pako, ose lëre bosh për të gjitha pakot. Pastaj zgjidh Sinkronizo me Anki, me Wi-Fi të ndezur: së pari dërgohen përgjigjet që presin, pastaj merren kartat e radhës (dhe numri i kartave të reja që ke caktuar), më së shumti 50. Zgjidh Studio për t'i kaluar pa rrjet: shfaq përgjigjen dhe vlerësoje me Përsëri, E vështirë, E mirë ose E lehtë. Përgjigjet e tua ruhen në lexues, edhe pa Wi-Fi, dhe shkojnë te Anki me sinkronizimin e radhës. Anki vendos kur kthehet një kartë: një kartë që e ke përgjigjur me Përsëri merret sërish nga një sinkronizim i mëvonshëm sapo Anki thotë se është e radhës.\n\n„Sinkronizo kur hapet Anki“, te cilësimet, sinkronizon sa herë që hap ekranin. Asgjë nuk përdor rrjetin kur shtyp një buton."
