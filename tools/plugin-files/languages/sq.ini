tasks.plugin.name = Detyrat
tasks.plugin.description = Lista detyrash me afate dhe prioritete, në lexues ose të sinkronizuara me serverin tënd CalDAV, me miniaplikacione për ekranin kryesor.
tasks.plugin.how = "Lista detyrash në lexuesin tënd: detyra me afat dhe prioritet, të shënuara kur përfundojnë. Punojnë pa caktim dhe pa rrjet, dhe mund të mbahen në përputhje me një server CalDAV (Nextcloud, Radicale, Baïkal, Fastmail e të tjerë), ndaj të njëjtat lista janë në telefon dhe në kompjuter.\n\nHap Detyrat nga menyja e mjeteve. Rreshti i parë emërton listën e shfaqur; zgjidhe për një listë tjetër, për Sot dhe të vonuarat në të gjitha listat, për një listë të re, për të sinkronizuar, ose për të caktuar llogarinë. „Shto një detyrë“ hap tastierën. Zgjidh mbi një detyrë e shënon të përfunduar (përsëri: e papërfunduar). Mbaj shtypur një detyrë ose shtyp Menyja për të ndryshuar titullin, afatin (sot, nesër, pas një jave, ose një datë që e shkruan si 2026-12-24) ose prioritetin e saj, ose për ta hequr. Detyrat e hapura vijnë të parat, sipas ditës dhe pastaj sipas prioritetit; të përfunduarat qëndrojnë në fund për një javë (caktohet te Detyrat në cilësime), pastaj largohen nga lexuesi.\n\nMiniaplikacionet për ekranin kryesor (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion): „Detyrat e sotme“ shfaq çfarë ka afat sot ose është e vonuar, „Lista e detyrave“ shfaq një listë, „Detyra të hapura“ i numëron ato dhe „Detyra tjetër“ shfaq atë që duhet bërë më pas. Një prekje mbi një detyrë në një miniaplikacion e shënon të përfunduar; një prekje mbi një titull hap listat.\n\nPër të sinkronizuar, zgjidh Llogari CalDAV nga rreshti i listës dhe fut adresën e serverit, emrin e përdoruesit dhe një fjalëkalim (më mirë një fjalëkalim aplikacioni). Mjafton adresa e serverit, p.sh. cloud.example.com/remote.php/dav; lexuesi i gjen që andej listat e tua të detyrave. Çdo listë detyrash e serverit bëhet listë në lexues. Lexuesi sinkronizon kur hap Detyrat, kur zgjidh Sinkronizo tani dhe kur rrjeti është i ndezur gjithsesi; ç'ndryshon pa rrjet pret dhe dërgohet më vonë. Nëse një detyrë u ndryshua në lexues dhe diku tjetër ndërkohë, merret versioni i serverit dhe yti ruhet si detyrë e re pranë tij, ndaj asgjë nuk humbet. Shënimet, alarmet dhe gjithçka tjetër që ka një detyrë në server mbeten siç janë. Detyrat që përsëriten shfaqen por ndryshohen aty ku i ke krijuar. Lexuesi mban deri në 200 detyra në 12 lista."
