file-manager.plugin.name = Menaxheri i skedarëve
file-manager.plugin.description = Çdo dosje dhe skedar në pajisje: hapi, riemërtoji, zhvendosi, kopjoji dhe fshiji.
file-manager.plugin.how = "Menaxheri i skedarëve shfaq çdo dosje dhe skedar në ruajtjen e pajisjes, jo vetëm librat e tu, dhe të lejon t'i hapësh, t'i riemërtosh, t'i zhvendosësh, t'i kopjosh e t'i fshish dhe të krijosh dosje të reja.\n\nHap Skedarët nga menyja Mjete. Prek një dosje për të hyrë në të; Mbrapsht të çon te dosja sipër. Prek një skedar, ose mbaj shtypur çdo zë (me butona, mbaj shtypur Zgjidh), për të parë çfarë mund të bëhet me të. Zhvendos dhe Kopjo zgjedhin zërin: shko te dosja ku i takon dhe zgjidh Ngjit këtu në shiritin poshtë. Me butona, shtyp Poshtë nga zëri i fundit për të arritur te shiriti.\n\nSkedarët dhe dosjet që nisin me pikë, si të dhënat e vetë PaperPaw, janë të fshehura. Për t'i parë, ndiz Skedarët e fshehur te Cilësimet, nën Biblioteka."
