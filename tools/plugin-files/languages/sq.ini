menu-editor.plugin.name = Redaktori i menyve
menu-editor.plugin.description = Rirendit, heq dhe shton zërat e çdo menyje.
menu-editor.plugin.how = "Redaktori i menyve ndryshon çfarë përmbajnë menytë: zhvendos zërat lart ose poshtë, hiqi, ose shto të rinj.\n\nE gjen te Cilësimet nën Personalizo, si Personalizo menytë. Zgjidh një meny, pastaj një zë për ta zhvendosur ose hequr; „Shto një zë“ vë një të ri. Ndryshimet zbatohen menjëherë. „Rivendos këtë meny“ kthen një meny siç e përcaktojnë shtojcat e saj, „Rivendos të gjitha menytë“ e bën këtë për të gjitha.\n\nNuk mund të mbyllesh jashtë: një zë që është rruga drejt cilësimeve mbetet derisa të shtosh një rrugë tjetër drejt tyre."
