calibre.plugin.name = Biblioteka pa tel
calibre.plugin.description = Merr libra nëpërmjet rrjetit. Punon si pajisje pa tel për Calibre.
calibre.plugin.how = "Biblioteka pa tel e bën pajisjen të shfaqet në Calibre në kompjuterin tënd si pajisje pa tel. Calibre mund t'i dërgojë atëherë libra, t'i rendisë dhe t'i fshijë. Librat shkojnë në bibliotekë.\n\nHap Biblioteka pa tel nga menyja Mjete, me pajisjen dhe kompjuterin në të njëjtin rrjet Wi-Fi. Në Calibre zgjidh Connect/share, pastaj Start wireless device connection. Kur pajisja ta ketë gjetur kompjuterin tënd, shfaq emrin e tij; prek Lidhu (me butona, shtyp Zgjidh). Calibre mund të shtojë dhe të fshijë libra këtu, ndaj lidhu vetëm me kompjuterin tënd. Mbyllja e ekranit e përfundon lidhjen.\n\nNëse Calibre nuk gjendet vetë, fut adresën e kompjuterit të tij te Cilësimet, nën Biblioteka, si Adresa në pjesën e Calibre. Nëse Calibre përdor një portë tjetër nga 9090, shtoje si :porta, p.sh. 192.168.1.20:9091."
