about.plugin.name = Rreth
about.plugin.description = Versioni dhe licencat e PaperPaw.
about.plugin.how = "Rreth të tregon cilin version të PaperPaw ke, ku ndodhet kodi i tij burimor dhe me cilat licenca vjen.\n\nE gjen në fund të Cilësimeve, si Rreth PaperPaw. Zgjidh një rresht me butonat e shigjetave dhe Zgjidh, ose preke. Renditen gjithashtu shtojcat e ndërtuara brenda firmware-it dhe, në pajisjet që ngarkojnë shtojca me kod, shenja gishtash për të cilën duhet të jenë ndërtuar këto shtojca.\n\nLicencat hapet si tekst në lexues, kështu që e shfletosh si një libër. Përmban licencën e vetë PaperPaw dhe ato të shkronjave, ikonave dhe modeleve të ndarjes së fjalëve që vijnë me të. Shtojcat mund të shtojnë një rresht të tyrin, si autorin e një teme."
