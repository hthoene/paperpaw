stats.plugin.name = Statistikat e leximit
stats.plugin.description = Regjistron sa gjatë dhe sa shumë lexon, me një kalendar dhe shifrat e çdo libri.
stats.plugin.how = "Statistikat e leximit regjistrojnë sa gjatë lexon çdo faqe. E sheh si një përmbledhje me sot, javën dhe serinë tënde, si një kalendar, dhe me shifrat e çdo libri.\n\nHape nga Mjete, ose nga Më shumë në lexues. Te cilësimet, nën Statistikat e leximit, mund të fikësh „Regjistro leximin“, të caktosh një „Objektiv ditor“ dhe „Faqen më të shkurtër“ e „Faqen më të gjatë“ që llogariten, që shfletimi ose një libër i lënë hapur të mos i shtrembërojë shifrat.\n\n„Sinkronizo me KOReader“ ndan statistikat me KOReader nëpërmjet një dosjeje WebDAV. Merr gjithashtu statistikat e KOReader në të njëjtën pajisje. Regjistrimi kërkon që ora të jetë caktuar: ku nuk është, lidhu një herë me Wi-Fi."
