weather.plugin.name = Moti
weather.plugin.description = Moti tani dhe ditët e ardhshme si miniaplikacione, nga Open-Meteo.
weather.plugin.how = "Moti shfaq motin tani dhe ditët e ardhshme si miniaplikacione për ekranin kryesor, nga Open-Meteo, që nuk kërkon llogari ose çelës. „Moti tani“ shfaq temperaturën, gjendjen e motit dhe më shumë për të zgjedhur; „Parashikimi“ shfaq ditët e ardhshme në një rresht ose një listë.\n\nSë pari zgjidh një vend: te cilësimet, nën Moti, Vendi (shkruaj një emër, pastaj zgjidhe nga vendet e gjetura). Dërgohen vetëm koordinatat e tij, dhe vetëm ndërsa shfaqet një miniaplikacion moti. Shtoji miniaplikacionet duke redaktuar ekranin kryesor.\n\nMoti merret më së shumti aq shpesh sa thotë „Përditëso më së shumti çdo“, dhe vetëm kur ka rrjet: nuk e ndez kurrë Wi-Fi vetë.\n\nTë dhënat e motit nga Open-Meteo.com (https://open-meteo.com), nën licencën Creative Commons Attribution 4.0 (CC BY 4.0)."
