bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Çifton telekomanda, tastiera dhe sensorë dhe i lidh.
bluetooth.plugin.how = "Bluetooth çifton telekomanda, tastiera dhe sensorë me lexuesin, aty ku ka Bluetooth (X4 Pro).\n\nShto një pajisje kërkon çfarë ka në rreze; vendose më parë pajisjen në modalitetin e çiftimit. Zgjidhe dhe konfirmo në lexues (krahaso numrin aty ku shfaqet një). Tastet e një telekomande ose tastiere pastaj kthejnë faqet dhe lëvizin nëpër meny; ndrysho çfarë bën çdo tast te Kontrollet.\n\nTelekomandat thotë kur punojnë tastet e tyre: kur ndizen këtu, gjatë leximit (lidhur sa kohë është i hapur një libër, kursen bateri), ose gjithmonë. Butoni i menysë ose një shtypje e gjatë mbi një pajisje e harron atë.\n\nNjë sensor është për shtojcat: ndiz cila shtojcë mund ta përdorë. Bluetooth është i fikur sa herë që nuk e përdor asgjë."
