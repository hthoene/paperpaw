sleep.plugin.name = Ekrani i gjumit
sleep.plugin.description = Shfaq një mace që fle, kopertinën e librit, fotografitë e tua ose një mesazh ndërsa pajisja fle.
sleep.plugin.how = "Ekrani i gjumit vendos çfarë shfaq ekrani ndërsa pajisja fle. Boja elektronike e mban fotografinë pa korrent.\n\nZgjidhe te cilësimet, nën Pajisja, Ekrani i gjumit, me Shfaq: një mace që fle (parazgjedhja), kopertina e librit, fotografitë e mia, logoja dhe „Po fle“, miniaplikacione, faqja siç është, ose faqja me një fotografi. „Fotografitë e mia“ shfaq skedarët e dosjes Pictures njëri pas tjetrit.\n\nPa kopertinë ose fotografi shfaqet macja. Aty ku sistemi e vizaton vetë ekranin e gjumit, këto cilësime janë të fshehura.\n\nEkrani i fikur, „Shfaq kur fiket“, vizatohet një herë ndërsa pajisja fiket, nga menyja e energjisë ose pas kohës së „Fike pas gjumit“ (jo kur një bateri e ulët e ndërpret korrentin). Është si ekrani i gjumit, përveçse nëse zgjedh logon dhe „U fik“, macen, kopertinën ose fotografitë e mia. Një shtojcë tjetër mund të ofrojë një ekran për të.\n\nEkrani i nisjes dhe i rindezjes, „Shfaq kur niset“ dhe „Shfaq kur rindizet“, janë ato të vetë pajisjes, përveçse nëse një shtojcë tjetër ofron një ekran për to. Shtojcat nuk punojnë ende kur niset pajisja: ekrani i zgjedhur për nisjen vizatohet paraprakisht, ndërsa pajisja fiket ose rindizet, dhe shfaqet në nisjen e radhës. Një ekran që nuk është gati në kohë, ose një fotografi e dëmtuar, i lë vendin atij të vetë pajisjes; pajisja fiket ose rindizet gjithsesi."
