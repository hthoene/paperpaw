reader.plugin.name = Lexuesi
reader.plugin.description = Shfaq libra faqe pas faqeje, me tabelë përmbajtjeje dhe cilësime leximi.
reader.plugin.how = "Lexuesi shfaq libra faqe pas faqeje. Hap një libër nga biblioteka; libri i fundit mund të rihapet në nisje (cilësimi „Hap librin e fundit në nisje“).\n\nPrek të majtën ose të djathtën e ekranit, ose përdor butonat e faqes, për të kthyer faqet. Prek mesin ose shtyp Zgjidh për menynë e leximit: Përmbajtja, Kërko, Shko te faqja, Shkronjat dhe faqosja, Faqeshënuesit dhe theksimet e më shumë. Poshtë nga skaji i sipërm hap panelin e shpejtë, lart nga skaji i poshtëm të çon te ekrani kryesor; po ashtu edhe mbajtja e Mbrapsht.\n\nMbaj shtypur Zgjidh (ose mbaj një fotografi) për ta parë një fotografi në ekran të plotë: Majtas dhe Djathtas kalojnë nëpër fotografitë e faqes. Zgjidh zmadhon në 2x, 3x dhe kthen mbrapsht (prekje e dyfishtë me prekje); e zmadhuar, Majtas dhe Djathtas lëvizin anash, butonat e faqes (ose rrëshqitjet) lëvizin tutje terthorazi dhe poshtë. Mbrapsht kthen te përshtatja, pastaj te faqja (mbaje për të dalë me prekje). Prek këndin lart djathtas për një faqeshënues. Mbaj shtypur një fjalë për ta theksuar. Me butona, mbaj shtypur Majtas: Majtas dhe Djathtas lëvizin nga një fjalë, butonat e faqes nga një rresht, mbajtja e tyre shkon te skajet e faqes dhe nga një paragraf; Zgjidh hap shiritin e theksimit për fjalën, mbajtja e Zgjidh e zgjeron në fjali dhe paragraf (pastaj Majtas dhe Djathtas lëvizin fundin, mbajtja e tyre fillimin). Një përzgjedhje vazhdon edhe pas kthimit të faqes. „Eksporto si Markdown“ ruan shënimet e tua."
