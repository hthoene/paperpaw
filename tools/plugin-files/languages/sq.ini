format-cbz.plugin.name = Komike
format-cbz.plugin.description = Hap arkivat e komikeve (.cbz), një fotografi për faqe.
format-cbz.plugin.how = "Hap arkivat e komikeve (.cbz): një fotografi për faqe, e përshtatur me ekranin, sipas rendit të emrave të tyre (2 para 10).\n\nVendosi në dosjen e bibliotekës dhe hapi nga biblioteka; ktheji faqet si në çdo libër. Fotografitë e mëdha kërkojnë një çast herën e parë, në X4 më shumë se gjetkë.\n\nCilësimet e leximit (Cilësimet, Leximi): „Panel pas paneli“ shfaq një panel të faqes në herë, aq të madh sa e lejon ekrani, dhe kthimet e faqes kalojnë nëpër to; një faqe pa panele shfaqet e plotë. „Faqet e komikut shkojnë“ pasqyron kthimet e faqes për manga (nga e djathta në të majtë); ComicInfo.xml i vetë librit e thotë këtë vetë. Biblioteka shfaq titullin e një libri dhe serinë e numrin e tij nga ComicInfo.xml."
format-cbz.title = Komik (CBZ)
format-cbz.setting.direction = Faqet e komikut shkojnë
format-cbz.setting.direction.help = Manga: kthimet e faqes pasqyrohen.
format-cbz.direction.book = Siç thotë libri
format-cbz.direction.ltr = Nga e majta në të djathtë
format-cbz.direction.rtl = Nga e djathta në të majtë
format-cbz.setting.panels = Panel pas paneli
