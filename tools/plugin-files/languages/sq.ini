keyboard.plugin.name = Tastiera
keyboard.plugin.description = Fut tekst në ekran, me prekje ose me butona.
keyboard.plugin.how = "Tastiera hapet sa herë që diçka kërkon tekst: një kërkim, një fjalëkalim, një shënim ose një cilësim. Punon me prekje dhe vetëm me butona.\n\nMe butona, majtas e djathtas lëvizin përgjatë një rreshti, butonat e faqes lëvizin mes rreshtave, Zgjidh shtyp një tast dhe Mbrapsht anulon; majtas e djathtas rrotullohen brenda rreshtit, lart e poshtë qëndrojnë në kolonën tënde. Shift e bën shkronjën tjetër të madhe; shtype dy herë për të gjitha të mëdha, dhe edhe një herë për të ndalur. Mbaj shtypur një shkronjë (me butona: mbaj shtypur Zgjidh mbi të) për shkronjën e madhe të saj, të zgjedhur menjëherë, dhe për theksa si é dhe è; në gjermanisht, ä, ö, ü dhe ß vijnë kështu nga a, o, u dhe s (me butona, tastiera e thotë këtë te ato shkronja). OK e përfundon; me butona, mbaj shtypur Mbrapsht për të përfunduar nga kudo (Mbrapsht vetëm anulon), ose mbaj shtypur Zgjidh mbi një tast që nuk është shkronjë. Ngjit fut tekstin e kujtesës së kopjimit dhe Telefoni, aty ku ofrohet, të lejon të shkruash në telefonin tënd.\n\nTe cilësimet nën Pajisja, Tastiera: Skemat e tastierës zgjedh skemat. Si parazgjedhje ndjek gjuhën e menysë; me disa, një tast kalon mes tyre. Tastet me umlaut jep në vend të tyre taste të veçanta ä, ö, ü dhe ß. Madhësia i bën tastet dhe shkronjat më të mëdha; vetëm me butona, rreshtat mbeten ato të një tastiere kompjuteri. Në ekranet me prekje, Forma e tasteve ndryshon si duken tastet. Shkronjat e mëdha automatike e nis çdo fjali me shkronjë të madhe."
