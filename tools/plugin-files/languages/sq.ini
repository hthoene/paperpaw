dictionary.plugin.name = Fjalori
dictionary.plugin.description = Kërkon fjalë në fjalorë StarDict.
dictionary.plugin.how = "Fjalori kërkon një fjalë nga një libër në fjalorë StarDict dhe i shfaq përkufizimet në një panel mbi pjesën e poshtme të ekranit.\n\nNë lexues, mbaj shtypur një fjalë dhe zgjidh Kërko; me butona, përdor Përzgjidh tekstin te Më shumë. Kopjo dosjet e fjalorëve (me skedarët .ifo, .idx dhe .dict) në dosjen „dictionaries“ të pajisjes, nëndosjet përfshirë, ose zgjidh një dosje tjetër te Cilësimet, nën Leximi, si Dosja e fjalorit (një cilësim i avancuar). Kërkimi i parë përgatit një indeks të vogël për çdo fjalor, gjë që zgjat pak.\n\nNë panel, butonat e faqes ose Lart dhe Poshtë lëvizin përkufizimet e gjata, dhe Mbrapsht e mbyll. Me prekje, prek jashtë tij për ta mbyllur."
