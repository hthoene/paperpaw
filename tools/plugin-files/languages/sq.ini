pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Një kohëmatës përqendrimi me raunde pune e pushimi, miniaplikacione dhe një numërim ditor.
pomodoro.plugin.how = "Një kohëmatës Pomodoro: puno në raunde të përqendruara, pastaj pusho. Nuk kërkon caktim: 25 minuta përqendrim, 5 pushim dhe pas katër raundesh një pushim i gjatë prej 15.\n\nHap Pomodoro nga menyja e mjeteve dhe shtyp Nis, ose shto miniaplikacionet e tij në ekranin kryesor (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion): „Kohëmatësi Pomodoro“ shfaq fazën dhe minutat e mbetura, „Pomodoro nis/pezullo“ është një buton dhe „Pomodoro sot“ numëron raundet që ke përfunduar, me objektivin tënd ditor. Një prekje mbi kohëmatësin e nis ose e pezullon; mbaje shtypur për të hapur ekranin e plotë.\n\nKohëmatësi vazhdon të punojë kur largohesh nga ekrani dhe vazhdon sipas orës pas një rindezjeje. Ndërsa lexuesi fle nuk punon asgjë: një fazë që mbaroi ndërkohë njoftohet kur zgjohet. Një njoftim të thotë kur mbaron një fazë. Për të kursyer bateri ora përditësohet një herë në minutë (çdo dhjetë sekonda në minutën e fundit në ekranin e plotë) dhe nuk e mban kurrë lexuesin zgjuar.\n\nTe Pomodoro në cilësime cakton kohëzgjatjet dhe raundet e një seti, dhe nëse faza tjetër nis vetë. Te Më shumë: një vezullim i ekranit ose një pulsim i dritës së ekranit kur mbaron një fazë, dhe një objektiv ditor."
