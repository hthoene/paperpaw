menu.plugin.name = Menyja
menu.plugin.description = Menyja në fund të ekranit, me veprime dhe cilësime.
menu.plugin.how = "Menyja rendit çfarë mund të bësh dhe të caktosh. Hapet në fund të ekranit, mbi çfarëdo që është i hapur: gjatë leximit, prek mesin e ekranit ose shtyp Zgjidh. Prek ose zgjidh një zë për ta ekzekutuar.\n\nCilësimet në meny shfaqin vlerën e tyre dhe ndryshojnë aty, ndaj menyja mbetet e hapur. Një zë me më shumë zëra hap një nënmeny.\n\nRrëshqit poshtë nga skaji i sipërm për panelin e shpejtë: çfarë ndryshon shpesh, si butona. Prek një buton për ta ndërruar, mbaje shtypur për cilësimet e tij. Vetëm me butona, butonat e shigjetave zgjedhin, Zgjidh ndërron dhe Mbrapsht mbyll. Nën Pamja, Menytë i shfaq menytë si listë ose si pllaka."
