power.plugin.name = Energjia
power.plugin.description = Zgjedh mënyrën e energjisë, me dorë ose sipas baterisë: Normal, Kursim, Jashtë linje.
power.plugin.how = "Energjia zgjedh si e shpenzon PaperPaw baterinë: Normal, Kursim ose Jashtë linje. Kursimi bën në çaste më të përshtatshme çfarë mund të presë; Jashtë linje e mban radion të fikur. Auto zgjedh sipas baterisë.\n\nNdrysho mënyrën te paneli i shpejtë, ku Energjia i shfaq mënyrat përkrah njëra-tjetrës, ose te Cilësimet nën Energjia. Aty cakton edhe nivelet ku Auto kalon në Kursim dhe në Jashtë linje, dhe nëse mbetet Normal gjatë ngarkimit.\n\nNë rreshtat e gjendjes, Mënyra e energjisë shfaq një gjethe gjatë kursimit dhe një Wi-Fi të vizuar gjatë jashtë linje, dhe asgjë në Normal.\n\nMbaj shtypur butonin e ndezjes për të hapur një meny të vogël: Fle, Fike (aty ku e bën PaperPaw), Rinis, dhe në pajisjet me prekje Kyç prekjen ose Zhbllokoje prekjen. Një shtypje e shkurtër prapë e fut pajisjen në gjumë. Mbrapsht e lë menynë."
