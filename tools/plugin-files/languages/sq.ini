keys.plugin.name = Butonat dhe gjestet
keys.plugin.description = Çfarë bën çdo buton, zonë prekjeje dhe rrëshqitje, e ndryshuar në pajisje.
keys.plugin.how = "Butonat dhe gjestet shfaq çfarë bën çdo buton, zonë prekjeje dhe rrëshqitje, dhe të lejon ta ndryshosh në pajisje.\n\nHape te cilësimet, nën Pajisja. Së pari zgjidh ku vlen një ndryshim: Kudo, Gjatë leximit, Në ekranin kryesor, Në bibliotekë ose në një mjet. Pastaj zgjidh një hyrje, si një buton i mbajtur ose një rrëshqitje nga një skaj, dhe zgjidh një veprim nga lista, ku mund të kërkosh. „Si standard“ kthen atë që caktojnë shtojcat dhe skema e butonave.\n\nNë X4, një ndryshim që nuk do të linte asnjë buton për të zgjedhur, për t'u kthyer ose për të vazhduar refuzohet. „Rivendos butonat dhe gjestet“ në fund i heq të gjitha ndryshimet."
