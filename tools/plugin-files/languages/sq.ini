settings.plugin.name = Cilësimet
settings.plugin.description = Faqet e cilësimeve, të ndërtuara nga cilësimet e çdo shtojce.
settings.plugin.how = "Cilësimet shfaqin gjithçka që mund të caktohet në PaperPaw dhe shtojcat e tij, në faqe. Shtojcat nuk kanë nevojë për ekran më vete: ç'deklarojnë shfaqet këtu, në grupe, me përshkrimin e çdo cilësimi poshtë tij.\n\nHape me Cilësimet në meny. Prek një grup për ta hapur, pastaj një cilësim për ta ndërruar ose zgjedhur; numrat kanë butonat − dhe +. Me butona, shko te një cilësim dhe shtyp Zgjidh: majtas e djathtas ndryshojnë një numër, Zgjidh e ruan, Mbrapsht kthen te vlera e mëparshme.\n\nNdryshimet zbatohen menjëherë. Kërkimi gjen një cilësim sipas fjalëve dhe „Cilësime të avancuara“ shton ato që nevojiten rrallë. „Rivendos në parazgjedhje“ dhe „Rivendos të gjitha“ pyesin më parë."
