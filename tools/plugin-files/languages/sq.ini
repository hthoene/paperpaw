format-docx.plugin.name = Dokumente DOCX
format-docx.plugin.description = Hap skedarë .docx, siç i ruajnë Word dhe programe të tjera.
format-docx.plugin.how = "Hap dokumente .docx si libra: tituj me tabelë përmbajtjeje, lista, tabela, shkronja të trasha e kursive, lidhje dhe fotografi (JPEG, PNG, GIF).\n\nVendosi skedarët në dosjen e bibliotekës dhe hapi nga biblioteka. Titulli dhe autori vijnë nga vetitë e dokumentit. Shënimet në fund, kreret e fundet e faqes dhe komentet nuk shfaqen."
format-docx.title = Dokument DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Hap libra EPUB me stilet, tabelën e përmbajtjes dhe fotografitë e tyre.
format-epub.plugin.how = "Librat EPUB hapen nga biblioteka si çdo libër tjetër, me tabelën e përmbajtjes, fotografitë dhe stilin e botuesit. Faqet e uebit (HTML), Markdown, FictionBook (.fb2) dhe arkivat e komikeve (.cbz) hapen njësoj, secili si shtojcë më vete.\n\nNjë kapitull konvertohet herën e parë që e hap dhe ruhet në memorien e fshehtë të shtojcës, ndaj më pas është më i shpejtë dhe librat e mëdhenj funksionojnë në pajisje të vogla. Tabelën e përmbajtjes e gjen te Përmbajtja në menynë e leximit. Nëse zbatohet stili i vetë librit, e vendos cilësimi Formatimi i botuesit, nën Leximi."
format-epub.title = Libër elektronik EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Hap libra FictionBook (.fb2, edhe të ngjeshur).
format-fb2.plugin.how = "Hap libra FictionBook (.fb2), të zakonshëm për librat rusë e të tjerë, edhe të ngjeshur (.fb2.zip), me titullin, autorët, kopertinën dhe kapitujt e tyre.\n\nVendosi në dosjen e bibliotekës; shfaqen në bibliotekë dhe hapen si çdo libër tjetër."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Hap faqe uebi të ruajtura si skedarë, duke shfaqur vetëm atë që do lexuar.
format-html.plugin.how = "Hap faqe uebi të ruajtura si skedarë (.html, .htm, .xhtml) si libra: vetëm ç'ka për t'u lexuar, pa menyra, reklama e të ngjashme rreth tij.\n\nVendose skedarin në dosjen e bibliotekës dhe hape nga biblioteka si çdo libër. Lidhjet brenda faqes funksionojnë; fotografitë shfaqen aty ku janë në skedar."
format-html.title = Faqe ueb (HTML)
format-images.plugin.name = Fotografi
format-images.plugin.description = Hap fotografi (.jpg, .png, .gif) si libra, një për faqe.
format-images.plugin.how = "Fotografitë (.jpg, .png, .gif) hapen nga biblioteka si librat, një fotografi për faqe, të përshtatura me ekranin.\n\nPër të lexuar një dosje të tërë fotografish, hap fotografinë e parë të saj: fotografitë pas saj në dosje pasojnë, sipas rendit të emrave të tyre (2 para 10). Një fotografi më vonë në dosje nis aty; vendi në secilën mbahet mend veçmas. Një dosje deri në 300 fotografi lexohet nga ajo që hap.\n\nNjë skedar që nuk është fotografi, ose është shumë i madh, shfaq emrin e tij në vend. Për një libër me shumë fotografi me titull të vetin, një arkiv komiku (.cbz) është forma më e mirë."
format-images.title = Fotografi
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Hap skedarë Markdown (.md), p.sh. shënime.
format-markdown.plugin.how = "Hap skedarë Markdown (.md), si shënimet, si libra: tituj, lista, citate dhe theksime siç janë menduar, jo si shenja.\n\nVendosi skedarët në dosjen e bibliotekës dhe hapi nga biblioteka. Titulli i parë është titulli i tij; fotografitë pranë skedarit shfaqen aty ku i emërton teksti."
format-markdown.title = Markdown
format-mobi.plugin.name = Libra MOBI
format-mobi.plugin.description = Hap skedarë .mobi dhe .azw pa DRM.
format-mobi.plugin.how = "Librat MOBI (.mobi, .azw) hapen nga biblioteka si çdo libër, pa asgjë për të caktuar. Titulli, autorët, gjuha dhe kopertina vijnë nga libri, dhe lista e përmbajtjes bëhet nga titujt e tij.\n\nLibri konvertohet herën e parë që e hap, gjë që zgjat disa sekonda për një libër të gjatë; pas kësaj hapet menjëherë. Shfaqen teksti, titujt, shkronjat e trasha e kursive, lidhjet dhe fotografitë.\n\nLibrat me DRM (shumica e librave të blerë në një dyqan) nuk hapen, as librat me ngjeshje Huffman ose në formën më të re KF8 (.azw3): PaperPaw e thotë këtë kur i hap. Një kopje si EPUB, e bërë me një mjet si Calibre, hapet gjithmonë."
format-mobi.title = Libra MOBI
format-rtf.plugin.name = Dokumente RTF
format-rtf.plugin.description = Hap skedarë .rtf si libra.
format-rtf.title = Dokumente RTF
format-txt.plugin.name = Tekst i thjeshtë
format-txt.plugin.description = Hap skedarë teksti të thjeshtë (.txt).
format-txt.plugin.how = "Skedarët e tekstit të thjeshtë (.txt) hapen nga biblioteka si çdo libër, pa asgjë për të caktuar. Shtojca lexon tekst UTF-8, UTF-16 dhe Windows-1252 dhe e gjen vetë kodimin.\n\nParagrafët ndjekin rreshtat bosh në skedar; nëse një skedar nuk ka, çdo rresht është një paragraf. Në skedarët e Project Gutenberg teksti i licencës në fillim dhe në fund lihet jashtë, dhe titulli e autori merren nga kreu.\n\nSkedari nuk ngarkohet kurrë i tëri, ndaj tekstet shumë të mëdha hapen edhe në pajisje të vogla."
format-txt.title = Tekst i thjeshtë
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Hap libra XTC dhe XTCH, faqet e para-vizatuara të lexuesve Xteink.
format-xtc.plugin.how = "Skedarët XTC dhe XTCH janë libra faqet e të cilëve janë vizatuar tashmë si fotografi, siç i bëjnë konvertuesit për lexuesit Xteink. Hapen nga biblioteka si çdo libër.\n\nMeqë çdo faqe është një fotografi e fiksuar, teksti nuk mund të ndryshohet në madhësi ose të vendoset me shkronja të tjera. Faqet janë bardhezi ose kanë katër nuanca gri. Çdo faqe dekodohet kur shfaqet, ndaj nevojitet pak kujtesë, edhe në X4.\n\nTitulli, autori dhe kapitujt merren nga skedari kur i ka."
format-xtc.title = Faqe XTC
help.plugin.name = Udhëzime
help.plugin.description = Tregon çfarë bëjnë kontrollet e një ekrani, herën e parë që hapet.
help.plugin.how = "Herën e parë që hapet një ekran, një shënim i shkurtër mbi të thotë çfarë bëjnë kontrollet e tij: pjesët e ekranit ku shkon një prekje, të kornizuara, dhe çfarë bëjnë butonat.\n\nNjë prekje ose çdo buton e mbyll shënimin, dhe nuk vjen më për atë ekran. „Pa udhëzime të tjera“ i fik të gjitha.\n\nTe cilësimet, nën Sistemi, Udhëzimet i ndez ose i fik, dhe „Shfaq udhëzimet përsëri“ e bën që shënimi i çdo ekrani të shfaqet edhe një herë."
help.title = Si funksionon këtu
help.got-it = E kuptova
help.no-more = Pa udhëzime të tjera
help.section = Udhëzime
help.setting.show = Udhëzime
help.setting.show.help = Herën e parë që hapet një ekran, një shënim i shkurtër thotë çfarë bëjnë kontrollet e tij.
help.setting.again = Shfaq udhëzimet përsëri
help.setting.again.help = Udhëzimet e çdo ekrani shfaqen edhe një herë, kur hapet herën tjetër.
help.again-done = Udhëzimet shfaqen përsëri, kur të hapet çdo ekran herën tjetër.
home.plugin.name = Ekrani kryesor
home.plugin.description = Faqja e nisjes: faqe me miniaplikacione, si libri që po lexohet dhe mjetet.
home.plugin.how = "Ekrani kryesor përbëhet nga faqe, secila një rrjetë miniaplikacionesh dhe mjetesh si në telefon. Në fillim ora, libri që po lexon dhe librat e lexuar së fundi janë në një faqe, dhe të gjitha mjetet në tjetrën.\n\nPrek një zë për ta hapur dhe rrëshqit ose përdor butonat e faqes për të ndërruar faqet. Vetëm me butona, butonat e shigjetave lëvizin nga një zë te tjetri dhe Zgjidh e hap.\n\nPër ta rirenditur, mbaj shtypur ekranin kryesor, prek lapsin nën faqe ose zgjidh Redakto ekranin kryesor në meny. Tërhiq zërat për t'i zhvendosur ose prek një për opsionet e tij, edhe me butona. Edhe Shto një miniaplikacion është aty. Kolonat dhe Rreshtat janë te cilësimet, nën Pamja, në seksionin Ekrani kryesor.\n\nNë një ekran të kthyer në njërën anë, ekrani kryesor shfaq të njëjtat zëra me më shumë kolona, çdo faqe e mbushur para tjetrës, dhe karta jo më të gjera se rreth 110 mm; asgjë që ke renditur drejt nuk ndryshon. Rirendite në anë dhe ai rregullim mbahet më vete për atë orientim: miniaplikacionet e reja shtohen te të dyja. Rivendos faqosjen horizontale te Shto (gjatë redaktimit) kthehet te ajo e rrjedhur. Heqja e një miniaplikacioni ose mjeti në një orientim nuk e heq nga tjetri."
