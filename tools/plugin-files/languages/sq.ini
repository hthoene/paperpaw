store.plugin.name = Dyqani i shtojcave
store.plugin.description = Gjen, instalon, përditëson dhe heq shtojca për këtë pajisje.
store.plugin.how = "Dyqani i shtojcave gjen shtojca për këtë pajisje në internet dhe i instalon, i përditëson e i heq. Hape nga Mjete; kërkon Wi-Fi.\n\nFillimi shfaq çfarë rekomandon biblioteka, çfarë është e re ose e popullarizuar tani, pastaj grupet. Një grup rendit shtojcat e tij në një përzierje të drejtë që ndryshon çdo ditë, që çdo shtojcë të shihet; renditi nga A në Zh, sipas më të rejave ose sipas përditësimit të fundit, dhe shko te një shkronjë në lista të gjata. Hap një për të parë faqen e saj, me madhësinë dhe kujtesën që zë, pastaj zgjidh Instalo, Përditëso ose Hiq. „Përditëso të gjitha“ i sjell të gjitha shtojcat e instaluara në versionin e fundit.\n\nShtojcat me kod ekzekutohen me qasje të plotë në pajisje: dyqani e thotë këtë dhe pyet më parë, dhe nisen pas një rindezjeje. Nëse njëra prishet, PaperPaw niset pa shtojca me kod dhe thotë cila. „Biblioteka e shtojcave“ cakton nga vjen lista.\n\n„Shtojca të komunitetit“, te Cilësimet, Sistemi, rendit gjithashtu shtojca që të tjerët i kanë publikuar në GitHub. Askush nuk i ka rishikuar: janë shënuar „Pa rishikuar“, faqja e një shtojce me kod shfaq çelësin me të cilin është nënshkruar, dhe një përditësim i nënshkruar nga një çelës tjetër nuk instalohet.\n\n„Burimet“, rreshti i fundit i fillimit, shton lista shtojcash të të tjerëve me adresën e tyre (https://…/plugins.json), rendit njërën prej tyre në vend të asaj të PaperPaw, ose e heq. Në vend që të shkruash, vendos një skedar sources.txt me një adresë në çdo rresht te .paperpaw/plugins/store në kartë: adresat shfaqen te Burimet si të reja. PaperPaw nuk e kontrollon një burim ose shtojcat e tij, dhe pajisja kontakton serverin e burimit. Një burim e nënshkruan listën e vet; pajisja mban çelësin e listës së parë që lexon dhe që atëherë pranon vetëm lista e shtojca me kod të nënshkruara me atë çelës. Një shtojcë i merr përditësimet vetëm nga burimi prej nga u instalua. Biblioteka e vetë PaperPaw është gjithmonë aty dhe nuk mund të hiqet; dalja nga dyqani kthen te ajo."
