update.plugin.name = Përditësimi
update.plugin.description = Instalon përditësime firmware-i, nga karta ose të shkarkuara nga interneti.
update.plugin.how = "Përditësimi instalon firmware të ri, në pajisjet ku PaperPaw është firmware-i, si X4. E gjen te cilësimet, si Përditësimi.\n\n„Kërko në linjë“ pyet serverin e përditësimeve për një PaperPaw më të ri dhe e shkarkon, gjë që zgjat disa minuta me Wi-Fi. Ose kopjo një skedar përditësimi (që mbaron me .bin, nga paperpaw.org) në dosjen updates në kartë, për shembull me Transferimin me Wi-Fi. Instalimi pastaj zgjat rreth një minutë dhe pajisja rindizet; librat, cilësimet dhe vendet e leximit mbeten.\n\nMe „Kërko për përditësime“ ndezur (te cilësimet, i fikur në fillim), pajisja pyet afërsisht një herë në javë vetë, vetëm kur Wi-Fi është i ndezur gjithsesi ose kur ngarkohet. Një PaperPaw më i ri që gjen pret këtu; asgjë nuk ndërpret leximin tënd. Një kërkim dërgon çfarë ekzekuton pajisja, jo emër ose numër të saj; për të numëruar pajisjet, edhe nëse e ke kërkuar ti dhe nëse është kërkimi i parë i ditës, javës ose muajit.\n\nNëse shtojcat që përdor nuk kanë ende version për botimin e ri, përditësimi i pret ato. Një version më i vjetër instalohet vetëm nëse e zgjedh ti.\n\nNjë firmware tjetër, si CrossPoint, instalohet gjithashtu që këtu: vendos skedarin e tij (që mbaron me .bin) në dosjen updates dhe hap Përditësimi. PaperPaw kontrollon që është një firmware i plotë për këtë pajisje, i padëmtuar, por nuk mund të thotë kush e ka bërë, meqë nuk është i nënshkruar. „Instalo gjithsesi“ e shkruan në gjysmën tjetër të flash-it dhe pajisja e nis; PaperPaw qëndron në gjysmën e vet derisa ai firmware të instalojë diçka mbi të. Për t'u kthyer më vonë te PaperPaw, instalo skedarin e tij të instalimit (paperpaw-<device>-<version>-install.bin) nga menyja e firmware-it tjetër, si përditësimi i firmware-it nga SD i CrossPoint."
