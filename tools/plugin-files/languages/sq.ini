calendar.plugin.name = Kalendari
calendar.plugin.description = Kalendarët e tu në lexues: pamje agjende, dite, jave dhe muaji nga CalDAV, iCal dhe skedarë, ditëlindje nga kontaktet, miniaplikacione për ekranin kryesor dhe një ekran gjumi.
calendar.plugin.how = "Kalendarët e tu në lexues: një agjendë e ditëve të ardhshme, një ditë, një javë dhe një muaj, me ngjarjet e kalendarëve CalDAV (Nextcloud, Radicale, Baïkal, Fastmail e të tjerë), të adresave iCal (.ics, webcal://), të skedarëve të kalendarit në kartë dhe ditëlindjet e përvjetorët e kontakteve të tua (CardDAV). Lexuesi vetëm i lexon kalendarët; nuk i ndryshon kurrë.\n\nHap Kalendari nga menyja e mjeteve. Rreshti i parë emërton pamjen; zgjidhe, ose mbaj shtypur çdo rresht ose shtyp Menyja, për të kaluar mes Agjendës, Ditës, Javës, Muajit dhe Ditëlindjeve, për të shtuar kalendarë ose për të sinkronizuar. Te Dita dhe Java dy rreshtat e parë kalojnë te dita ose java para dhe pas (po ashtu edhe butonat e faqes); te Muaji shigjetat lëvizin ditën, butonat e faqes muajin dhe Zgjidh e hap ditën. Zgjidh mbi një ngjarje e shfaq të plotë: kur, ku, cili kalendar dhe si përsëritet. Mbrapsht kthen një hap pas.\n\nShto një kalendar te Kalendarët (në meny, ose Kalendari te cilësimet). Zgjidh llojin e tij: një llogari CalDAV (mjafton adresa e serverit, p.sh. cloud.example.com/remote.php/dav; çdo kalendar me ngjarje bëhet pjesë e pamjes), një adresë iCal (një kalendar i publikuar si .ics), një skedar kalendari në kartë, ose kontaktet (një libër adresash CardDAV: lexuesi shfaq ditëlindjet dhe përvjetorët e ruajtur me to). Fut adresën, për një llogari emrin e përdoruesit dhe një fjalëkalim (më mirë një fjalëkalim aplikacioni; ruhet me fjalëkalimet e lexuesit) dhe një emër. Çdo kalendar ka një shenjë (një pikë, një unazë, një pikë gri ose një katror) që mund ta ndryshosh, që t'i dallosh; deri në gjashtë kalendarë.\n\nNgjarjet që përsëriten (çdo ditë, javë, muaj, vit, me ditë të javës, numërime, data mbarimi dhe ditë të lëna jashtë), ngjarjet gjithë ditën dhe ngjarjet në breza të tjerë orarë shfaqen në orën e vetë lexuesit. Lexuesi i mban ngjarjet nga gjashtëdhjetë ditë para deri në gjashtëdhjetë ditë pas sotit, më së shumti 240, dhe i shfaq pa rrjet. Rregullat që nuk i lexon dot e shfaqin ngjarjen e tyre një herë.\n\nKalendarët lexohen kur e hap kalendarin (më së shumti çdo pesë minuta), kur zgjidh Sinkronizo tani dhe, sipas asaj që cakton te Kalendari në cilësime, kur rrjeti është i ndezur gjithsesi ose kur fillon ngarkimi. Lexuesi nuk ndez kurrë radion për këtë, përveç kur e kërkon me Sinkronizo tani.\n\nMiniaplikacionet për ekranin kryesor (mbaj shtypur ekranin kryesor, pastaj shto një miniaplikacion): Sot shfaq datën dhe çfarë ka dita, Ngjarja tjetër ngjarjen që vjen, Agjenda ditët e ardhshme, Muaji një muaj me një pikë nën ditët që kanë ngjarje dhe Ditëlindjet ditëlindjet e ardhshme. Një prekje mbi një ngjarje e hap, një prekje mbi një ditë të muajit hap atë ditë. Ekrani i gjumit mund të shfaqë agjendën e sotme: zgjidh Kalendari te Ekrani i gjumit në cilësime."
