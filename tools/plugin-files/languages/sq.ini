diagnostics.plugin.name = Diagnostikimi
diagnostics.plugin.description = Një ekran provash dhe një kontroll i udhëhequr i çdo pjese të pajisjes.
diagnostics.plugin.how = "Diagnostikimi është një ekran provash për kontrollin e një pajisjeje: shfaq çdo nivel gri që mund të shfaqë paneli, katër kuti për të provuar butonat dhe prekjen, dhe një numërues faqesh me shirit përparimi për të krahasuar mënyrat e rifreskimit.\n\nEkrani i provave nuk ka zë në meny. Është ekrani kryesor vetëm derisa asnjë shtojcë tjetër nuk ofron një, ose kur e zgjidh te Ekranet në menaxherin e shtojcave për vendin Ekrani kryesor.\n\nZgjidh shënon kutinë në fokus dhe butonat e shigjetave lëvizin mes kutive; me prekje, prek një kuti. Butonat e faqes kthejnë faqet e provës. Mbaj shtypur Zgjidh, ose mbaj një gisht në ekran, për të filluar nga e para.\n\nKontrolli i pajisjes, nën Mjete aty ku PaperPaw është firmware-i i pajisjes, kalon nëpër çdo pjesë të një pajisjeje një faqe në herë: ekrani, butonat, prekja, drita e ekranit, bateria, karta, ora, Wi-Fi, gjumi dhe kujtesa. Çdo faqe mbaron me Dështoi, Kapërce dhe Në rregull, me përgjigjen që sugjerojnë matjet e saj të zgjedhur; pjesët që i mungojnë një pajisjeje kapërcehen. Pas çdo përgjigjeje shkruan një raport te .paperpaw/plugins/diagnostics/device-check.txt, për ta ngjitur në një pull request. Mbrapsht e lë, dhe vazhdon aty ku ishte kur hapet përsëri. Në një pajisje vetëm me butona, zgjidh më parë Nis në faqen e butonave; deri atëherë shigjetat, Zgjidh dhe Mbrapsht punojnë si në çdo faqe."
