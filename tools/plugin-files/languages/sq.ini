fonts-browser.plugin.name = Më shumë shkronja
fonts-browser.plugin.description = Shfaq shkronja nga interneti, secilën me një shembull, dhe i shkarkon për të lexuar me to.
fonts-browser.plugin.how = "Më shumë shkronja rendit shkronja nga një bibliotekë shkronjash në internet, secilin emër të vendosur në shkronjat e veta, dhe shkarkon ato që do për të lexuar me to.\n\nE gjen në fund të listës së shkronjave ku zgjidhen shkronjat e leximit, te Cilësimet, nën Leximi, si Shkronjat; rreshtat e gjendjes kanë të njëjtin zë për shkronjat e tyre. Prek një shkronjë (me butona, shtyp Zgjidh) për ta parë më të madhe me një fjali shembull, pastaj zgjidh Shkarko. Mund ta lësh faqen ndërsa shkarkon. Kur të përfundojë, zgjidh Lexo me (emri i shkronjës), ose Përdor për rreshtat e gjendjes. Përditëso merr një version më të ri, Hiq e fshin shkronjën nga pajisja.\n\nKërkon Wi-Fi.\n\nSHKRONJAT E TUA\n\nPranë Më shumë shkronja, e njëjta listë ka Shkronjat e tua, që shfaq këtë pjesë të ndihmës. Një shkronjë e jotja është një skedar .ttf ose .otf, për shembull nga Google Fonts.\n\nNë Android dhe pajisje të tjera që vizatojnë skedarë shkronjash: kopjo skedarin në dosjen fonts (në Android: PaperPaw/fonts në ruajtjen e përbashkët), rinise PaperPaw dhe zgjidh shkronjën te Cilësimet, nën Leximi, si Shkronjat.\n\nNë Xteink X4 dhe X4 Pro: këta lexues lexojnë paketa shkronjash, jo skedarë shkronjash, sepse skedarët e shkronjave nuk do të ngjiteshin në kujtesën e tyre. Bëj një paketë në një kompjuter me paperpaw-fontgen, për çdo stil që ke (i zakonshmi nevojitet):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nKjo krijon dosjen plugins/font-my-font. Kopjoje në dosjen plugins në kartën e kujtesës, rinise dhe zgjidh My Font si Shkronjat. Një paketë me një stil është rreth gjysmë megabajti për shkronja latine; stilet që i lë jashtë vizatohen me të zakonshmin. Mjeti thotë sa nga shkronjat që kërkon i ka shkronja (--chars latin,cyrillic,greek shton alfabete): një shkronjë pa shkronjat e librit tënd nuk mund t'i shfaqë, prandaj kërko një që e mbulon alfabetin e tij.\n\nShkronjat nga Më shumë shkronja punojnë njësoj dhe nuk kërkojnë kompjuter.\n\nPër tekst të vogël më të qartë në panelin e bojës elektronike, shto --hinting light te komanda: i përshtat shkronjat me rrjetën e pikselëve, ashtu siç janë bërë shkronjat e paracaktuara. Pa të, shkronjat vizatohen siç i ka projektuar projektuesi; --hinting normal dhe --hinting mono i përshtatin më fort. Shkronjat me shenja, si arabishtja ose devanagari, më mirë të lihen pa të."
