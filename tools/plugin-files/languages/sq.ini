mail.plugin.name = Posta
mail.plugin.description = Lexon dhe dërgon e-mail me një fjalëkalim ose fjalëkalim aplikacioni (IMAP dhe SMTP), pa hyrje në shfletues.
mail.plugin.how = "Posta lexon dhe dërgon e-mail nëpërmjet IMAP dhe SMTP. Hyn me adresën dhe një fjalëkalim, pa hyrje në shfletues, ndaj funksionon me çdo ofrues që e lejon këtë.\n\nCakto një llogari te Cilësimet, Posta. Zgjidh ofruesin, shkruaj adresën dhe fjalëkalimin. Shumica e ofruesve kërkojnë një fjalëkalim aplikacioni: krijo një në cilësimet e sigurisë të llogarisë sate dhe përdore këtu. Fjalëkalimi yt i zakonshëm shpesh nuk funksionon dhe nuk shkon kurrë gjetkë veç serverit të ofruesit. Ruhet me fjalëkalimet dhe çelësat.\n\nHap Posta te mjetet. „Kontrollo postën“ merr mesazhet e fundit dhe dosjet. Mesazhet ruhen në kartë, ndaj mund t'i lexosh pa rrjet. Pajisja lidhet, merr dhe shkëputet, ndaj Wi-Fi është i ndezur vetëm për një çast.\n\nNëse ofruesi yt nuk është në listë, zgjidh „Serverë të mi“ dhe cakto emrat e serverëve, portat dhe sigurinë te cilësimet e avancuara. Një server që certifikatën e tij nuk e garanton asnjë autoritet pyet një herë nëse t'i besohet; krahaso shenjën e gishtit me atë që shfaq ofruesi yt.\n\nNjë mesazh me libër të bashkëngjitur (EPUB, PDF e të ngjashëm, deri në 2 MB) ka poshtë „Hap librin“: merr skedarin, e vendos në bibliotekën tënde dhe e hap.\n\nPër të parë postë të re pa hapur Postën, ndiz „Kontrollo për postë të re në sfond“ te Cilësimet, Posta, dhe zgjidh sa shpesh (çdo 15, 30 ose 60 minuta). Është e fikur derisa ta ndezësh. Lexuesi pastaj lidhet herë pas here nëpërmjet një lidhjeje të sigurt ndërsa është zgjuar dhe në linjë, një llogari pas tjetrës, dhe përditëson numrin e të palexuarave te Kreu. Përdor pak bateri. Hapja e Postës e ndalon një kontroll që është në vazhdim.\n\nMiniaplikacionet e ekranit kryesor shfaqin numrin e të palexuarave, postën e fundit dhe atë me yll, një kuti postare, dhe një shkurtore për të shkruar një mesazh."
