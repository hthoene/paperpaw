vocabulary.plugin.name = Fjalori im
vocabulary.plugin.description = Mban fjalët që kërkon, me fjalitë e tyre, dhe përsërit kartela me përsëritje me intervale, të bëra në telefonin tënd.
vocabulary.plugin.how = "Fjalori im mban fjalët që kërkon gjatë leximit, secilën me fjalinë e vet, për t'i rishikuar më vonë. Listën e gjen te Mjete, më të rejat së pari; zgjidh një fjalë për ta kërkuar përsëri. Rreshti i fundit, Eksporto, i ruan për aplikacione kartelash si Anki. Lista mban 2.000 fjalët më të reja: përtej kësaj, më të vjetrat largohen, ndaj eksportoji më parë për t'i mbajtur të gjitha.\n\nKartelat, gjithashtu te Mjete, të pyesin me përsëritje me intervale: pas „Shfaq përgjigjen“ e vlerëson çdo kartelë me Përsëri, E vështirë, E mirë ose E lehtë, dhe kjo vendos kur kthehet. Krijo pako me „Redakto me telefon“: skano kodin me një telefon në të njëjtin Wi-Fi, pastaj shkruaj kartela ose shto shumë njëherësh: hap një pako atje, zgjidh „Shumë kartela njëherësh“ dhe zgjidh një skedar CSV, TSV ose TXT (një kartelë në çdo rresht: para, prapa, shembull; UTF-8), ngjit një listë, ose sill një pako Anki (.apkg, e eksportuar me „Support older Anki versions“).\n\nOse përdor skedarë në kartën SD: vendos një skedar CSV, TSV ose TXT, ose një pako Anki (.apkg, e eksportuar me „Support older Anki versions“), për çdo pako në dosjen Flashcards (Spanish.tsv krijon pakon Spanish; një kartelë në çdo rresht: para, prapa, shembull; e ruajtur si UTF-8; rreshti i parë mund t'i emërtojë kolonat front, back, example). Zgjidh „Kartela në kartën SD“ te Kartelat, ose lëre të ndodhë kur hap Kartelat. Pakot qëndrojnë në lexues me atë që ke mësuar, dhe një skedar bashkohet në pakon e vet sa herë që është i ri ose i ndryshuar: ndrysho anën e prapme ose shembullin e një kartele në skedar dhe kartela ndryshon dhe e mban përparimin; ndrysho tekstin e përparmë dhe llogaritet si kartelë e re, e vjetra nis nga e para (kartelat dallohen sipas tekstit të përparmë; hapësirat dhe shkronjat e mëdha nuk llogariten); një rresht që fshin nuk e fshin kartelën (përveç nëse e cakton „kartelat që mungojnë nga skedari“ në Hiq për atë pako: atëherë kartela hiqet në përditësimin e radhës me përparimin e saj, përgjithmonë, dhe asgjë nuk hiqet derisa ndonjë rresht i skedarit nuk lexohet dot). Ruaje një pako në skedarin e saj me „Ruaj në kartë“: skedari merr numrat e kartelave (kolona id), ndaj mund t'i redaktosh pjesët e përparme në një kompjuter dhe kartelat e mbajnë atë që ke mësuar; skedari mban vetëm id, front, back dhe example (kolonat e tjera, komentet dhe renditja e rreshtave nuk mbahen), dhe një ruajtje refuzohet derisa ndonjë rresht i skedarit nuk lexohet dot; skedari që ishte aty kopjohet te _name.bak.tsv herën e parë (një ruajtje e mëvonshme nuk e zëvendëson atë kopje). Një skedar mbi 4 MiB ose 20.000 rreshta nuk lexohet, dhe duhet ruajtur si CSV UTF-8, jo UTF-16. Herën e parë, lexuesi krijon dosjen me një shënim për mënyrën si funksionon.\n\nTe cilësimet, nën Leximi, „Fjalët e kërkuara bëhen kartela“ vë çdo fjalë të kërkuar në pakon „Të kërkuara“."
