files.plugin.name = Shfletuesi i skedarëve
files.plugin.description = Rendit librat dhe dosjet në pajisje dhe i hap.
files.plugin.how = "Biblioteka rendit librat në dosjen e bibliotekës sate, secilin me kopertinën, titullin, autorin dhe sa e ke lexuar. Libri që ke lexuar i fundit qëndron në krye si kartë, ndaj vazhdimi i leximit kërkon një prekje, ose një shtypje të Zgjidh. Ndërsa biblioteka kërkon libra, thotë sa ka gjetur deri tani.\n\nZgjidh çfarë shfaqet mbi librat: të gjithë, ata që po lexon, të palexuarit ose të përfunduarit, ose raftet (sipas autorit, serisë, etiketës, të preferuarve, librit tjetër të çdo serie që ke filluar). Prek një libër për ta lexuar; mbaje shtypur (me butona, mbaj shtypur Zgjidh) për ta hapur, për ta shënuar të përfunduar ose të palexuar, për të parë informacionin e tij, për ta zhvendosur në arkiv ose për ta fshirë. Prek titullin për menynë e bibliotekës: si renditen e shfaqen librat, kërkimi, dosja e bibliotekës dhe cilësimet.\n\nDosja e bibliotekës caktohet te Cilësimet, nën Biblioteka, si Dosja e bibliotekës; aty mund t'i shfaqësh librat edhe si rrjetë kopertinash. Për çdo skedar tjetër, përdor Skedarët te menyja Mjete."
