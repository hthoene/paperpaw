rules.plugin.name = Rregullat
rules.plugin.description = Kur ndodh diçka, bën diçka: p.sh. modaliteti i natës në 22:00.
rules.plugin.how = "Një rregull bën diçka vetë kur ndodh diçka: modaliteti i natës ndezur çdo ditë në 22:00, ose katalogët e sinkronizuar kur niset PaperPaw.\n\nRregullat janë te Cilësimet nën Personalizo, si Rregullat. „Shto rregull“ pyet Kur? (niset PaperPaw, një orë e ditës, hapet ose mbyllet një libër, bateria, ngarkimi, një çelës e më shumë) dhe Çfarë atëherë? (ekzekuto një veprim, ndiz ose fik një çelës, cakto një numër, shfaq një mesazh). Prek një rregull për ta pezulluar; mbaje shtypur (me butona, mbaj shtypur Zgjidh) për një kusht si „Mes dy orësh të ditës“, ose për ta hequr.\n\nVeprimet, çelësat dhe numrat për të zgjedhur vijnë sipas shtojcës: zgjidh shtojcën, pastaj çfarë sjell; mbrapsht del prej saj. Një veprim që punon mbi ekranin e shfaqur, si Mbrapsht ose Faqja tjetër, bën atë që do të bënte po të shtypej aty.\n\nOrët vlejnë cilido ekran të jetë i hapur. Dy rregulla që e zhbëjnë vazhdimisht njëri-tjetrin ndalojnë pas disa hapash."
