setup.plugin.name = Konfigurimi
setup.plugin.description = Një udhëzues i shkurtër nëpër cilësimet që kanë rëndësi, në nisjen e parë.
setup.plugin.how = "Konfigurimi është një udhëzues i shkurtër nëpër cilësimet që kanë rëndësi, i shfaqur një herë, herën e parë që niset PaperPaw. Çdo faqe pyet një gjë, si gjuhën, butonat, madhësinë e tekstit, brezin orar, Wi-Fi ose disa shtojca për të shtuar, me një përgjigje të arsyeshme të zgjedhur tashmë, ndaj Tjetra është gjithmonë e drejtë. Hapat që kjo pajisje nuk i kërkon lihen jashtë.\n\nPrek butonat, ose përdor butonat lart e poshtë dhe Zgjidh. „Kapërce“ në faqen e parë e lë konfigurimin menjëherë. Faqja e fundit tregon nga vijnë librat e tu.\n\nPër ta nisur përsëri, hap cilësimet dhe zgjidh Konfiguro PaperPaw. Gjithçka e zgjedhur këtu mund të ndryshohet më vonë te cilësimet."
