transfer.plugin.name = Transferimi
transfer.plugin.description = Vendos libra dhe skedarë të tjerë në pajisje nga një shfletues në të njëjtin rrjet.
transfer.plugin.how = "Transferimi me Wi-Fi vendos libra dhe skedarë të tjerë në pajisje nga një shfletues në të njëjtin rrjet, pa kabllo ose aplikacion. Mund të marrësh edhe skedarë, të krijosh dosje dhe të fshish.\n\nHape nga Mjete. Ekrani shfaq një adresë si tekst dhe si kod QR: hape në një shfletues në telefon ose kompjuter, ose skano kodin. Adresa mban një çelës të bërë nga e para çdo herë, ndaj të tjerët në rrjet nuk mund t'i arrijnë skedarët e tu. Transferimi punon sa kohë ekrani është i hapur.\n\nAty ku PaperPaw e ekzekuton vetë Wi-Fi, si në X4, „Pa ruter“ në fund hap një rrjet të vetë pajisjes, me të cilin lidhet telefoni duke skanuar një kod."
