plugin-manager.plugin.name = Menaxheri i shtojcave
plugin-manager.plugin.description = Rendit shtojcat dhe i ndez e i fik.
plugin-manager.plugin.how = "Menaxheri i shtojcave rendit çdo shtojcë me versionin dhe përshkrimin e saj, dhe i ndez e i fik shtojcat.\n\nE gjen te Cilësimet, si Menaxho shtojcat. Cilësimet e shtojcave është një faqe më vete për preferencat si përdorimi i rrjetit nga çdo shtojcë. Prek një shtojcë për ta ndezur ose fikur (me butona, zgjidhe). Ndryshimi zbatohet pas një rindezjeje: shiriti poshtë atëherë ofron Rinis tani. Mbaj shtypur një shtojcë (me butona, mbaj shtypur Zgjidh) për të lexuar si funksionon.\n\nNjë shtojcë e shënuar Gjithmonë e ndezur nuk mund të fiket, dhe një e shënuar E nevojshme fiket vetëm kur një shtojcë tjetër e bën punën e saj, përndryshe PaperPaw nuk do të kishte rrugë kthimi. Te Ekranet zgjedh cila shtojcë shfaq një vend që e ofrojnë disa."
