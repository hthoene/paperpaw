vocabulary.setting.sd-auto = Përditëso pakot nga karta kur hapet
vocabulary.setting.sd-auto.help = Kartelat lexojnë skedarët e dosjes që janë të rinj ose të ndryshuar.
vocabulary.setting.sd-folder = Dosja për skedarët e pakove
vocabulary.setting.sd-folder.help = Në kartën SD: një skedar CSV, TSV ose Anki në të është një pako.
vocabulary.sd.readme = "Kartela nga skedarë\n\nVendos këtu një skedar për çdo pako: Spanish.tsv krijon pakon Spanish.\nSkedarët: .tsv, .csv ose .txt, të ruajtur si UTF-8, ose .apkg: një pako Anki, e eksportuar me „Support older Anki versions“ të shënuar. Tri fushat e para të shënimeve të saj bëhen front, back dhe example; planifikimi dhe media e saj nuk lexohen, dhe PaperPaw nuk shkruan kurrë një skedar Anki.\n\nNjë kartelë në çdo rresht: front, back dhe një example (opsional), të ndarë me një tab, një presje ose një pikëpresje. Rreshti i parë mund t'i emërtojë kolonat: front, back, example. Shembull:\n\nKatze\tcat\tDie Katze schläft.\n\nPastaj hap Kartelat në lexues, zgjidh „Kartela në kartën SD“ dhe pastaj „Përditëso pakot nga karta“.\n\nMirë është të dihet:\n- Pakot qëndrojnë në lexues, me atë që ke mësuar. Një skedar lexohet kur është i ri ose i ndryshuar, dhe kartelat e tij shtohen te pakoja ose ndryshohen aty.\n- Ndrysho anën e prapme ose shembullin e një kartele në skedar: kartela ndryshon dhe e mban përparimin tënd.\n- Ndrysho tekstin e përparmë të një kartele: llogaritet si kartelë e re dhe e vjetra nis nga e para. Kartelat përputhen sipas tekstit të përparmë, hapësirat dhe shkronjat e mëdha nuk llogariten. Ruaje një pako në një skedar („Kartela në kartën SD“, „Ruaj pakon në kartë“) dhe çdo kartelë ka një numër në kolonën id: ndrysho aty një pjesë të përparme, mbaji dy rreshtat e parë të skedarit siç janë dhe kartela e mban atë që ke mësuar.\n- Ruajtja shkruan kartelat e pakos. Ç'ishte në skedar dhe nuk është kartelë (një rresht pa pjesë të përparme) nuk mbahet; skedari që ishte aty kopjohet te _name.bak.tsv.\n- Ruaje skedarin si CSV UTF-8 (jo UTF-16, jo formati i vetë një fletë llogaritjeje). Një skedar mbi 4 MiB ose 20.000 rreshta nuk lexohet: ndaje.\n- Një rresht që fshin në skedar nuk e fshin kartelën në pako, përveç nëse ndez „Hiq kartelat që mungojnë“ për atë pako. Atëherë kartela largohet me atë që ke mësuar.\n- Skedarët emrat e të cilëve nisin me _ nuk lexohen.\n"
