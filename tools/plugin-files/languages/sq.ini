aids.plugin.name = Ndihmesa leximi
aids.plugin.description = Fillime fjalësh me shkronja të trasha, fjalë të zëvendësuara, fotografi: teksti siç e do.
aids.plugin.how = "Ndihmesat e leximit ndryshojnë si duket teksti i një libri gjatë leximit. Vlejnë për çdo libër. Fillimet e fjalëve me shkronja të trasha dhe Zëvendëso fjalë janë të fikura në fillim.\n\nI gjen te Cilësimet, nën Leximi, në seksionin Ndihmesa leximi. „Fillimet e fjalëve me shkronja të trasha“ vendos në të trasha gjysmën e parë të çdo fjale, gjë që disave ua lehtëson ndjekjen. „Zëvendëso fjalë“ merr çifte të shkruara si „ngjyrë = ngjyrë; Z. = Zoti“, të ndara me pikëpresje.\n\nZëvendësohen vetëm fjalë të plota, saktësisht siç i ke shkruar, kështu që një pjesë e një fjale më të gjatë nuk preket kurrë. Vetë skedari i librit nuk ndryshohet.\n\nFotografitë në libra mund të shfaqen (si në fillim), të kthehen në një rresht të shkurtër si „[Fotografi: një anije në det]“ që përdor përshkrimin e fotografisë, ose të lihen jashtë. Atëherë një faqe ka më shumë vend për tekst dhe për një fotografi që nuk shfaqet nuk dekodohet asgjë, gjë që i shpejton kthimet e faqeve. Komiket dhe librat e tjerë të bërë nga fotografi nuk ndryshojnë."
