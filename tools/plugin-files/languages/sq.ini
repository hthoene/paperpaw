news.plugin.name = Lajme
news.plugin.description = Merr burime lajmesh (RSS, Atom) si libra për t'u lexuar.
news.plugin.how = "Lajme i kthen burimet RSS ose Atom në libra. Çdo burim bëhet një libër në dosjen News të bibliotekës, me artikujt e tij më të rinj si tekst i thjeshtë, për t'u lexuar si çdo libër tjetër.\n\nHap Lajme nga menyja Mjete dhe zgjidh „Shto një burim“; adresa e tij është në faqen e gazetës ose të blogut. „Merr lajmet“ i merr të gjitha burimet dhe zëvendëson librat e mëparshëm. Mbaj shtypur një burim (me butona, mbaj shtypur Zgjidh) për ta marrë ose hequr vetëm atë. Një burim i hequr e lë librin e tij në bibliotekë.\n\nMarrja kërkon një rrjet. „Artikuj për burim“ (Cilësimet, Biblioteka) cakton sa artikuj mban çdo libër. Miniaplikacioni „Titujt e lajmeve“ i shfaq në ekranin kryesor."
