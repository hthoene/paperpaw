notes-vault.plugin.name = Kasaforta e shënimeve
notes-vault.plugin.description = Lexon një dosje shënimesh Markdown sipas dosjeve, etiketave dhe ndryshimeve të fundit, me miniaplikacione për ekranin kryesor. Punon me kasaforta Obsidian.
notes-vault.plugin.how = "Kasaforta e shënimeve lexon një dosje shënimesh Markdown (skedarë të thjeshtë .md, siç i mbajnë aplikacionet e shënimeve). Punon me kasaforta Obsidian.\n\nZgjidh dosjen e kasafortës te cilësimet, ose në faqen e kasafortës te mjetet. Faqja pastaj ofron dosjet siç janë në kartë, shënimet e ndryshuara së fundi, etiketat dhe një kërkim në titujt e shënimeve.\n\nHerën e parë, kasaforta indeksohet në sfond ndërsa faqja e saj është e hapur; një kasafortë me mijëra shënime kërkon disa minuta, pastaj hapet menjëherë. Indeksi ruhet në kartë dhe bëhet sërish kur faqja e kasafortës hapet pas disa orësh, ose kur zgjidh Përditëso.\n\nNjë shënim hapet në lexues. Lidhjet me shënime të tjera ([[Note]], [[Note|words]], [[Note#Heading]]) gjenden nga emri i shënimit kudo në kasafortë; ndjekja e njërës hap atë shënim, dhe Mbrapsht kthen te shënimi i mëparshëm.\n\nAsgjë në kasafortë nuk ndryshohet kurrë. Miniaplikacionet për ekranin kryesor (shënime të fundit, një shënim i ngjitur, shënimi i ditës, një shënim i rastësishëm, etiketa, kërkim) shtohen në redaktorin e ekranit kryesor. Një miniaplikacion mund t'i marrë shënimet nga vetëm një dosje: shkruaj shtegun e dosjes nga rrënja e kartës (për shembull Notes/Work) te cilësimet e miniaplikacionit; i lënë bosh, merr të gjitha shënimet e kasafortës."
