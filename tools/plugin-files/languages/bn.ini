vocabulary.sd.outcome.too-large = এই ফাইল খুব বড়: সর্বোচ্চ 4 MiB ও 20,000 লাইন। কয়েকটি ফাইলে ভাগ করুন।
vocabulary.sd.outcome.utf16 = এই ফাইল UTF-16-এ সংরক্ষিত। CSV UTF-8 হিসেবে আবার সংরক্ষণ করুন (স্প্রেডশিটে: CSV UTF-8)।
vocabulary.sd.outcome.no-notes = কোনো নোট পাওয়া যায়নি: এটি Anki ডেক নয়, বা এতে নোট নেই। Anki থেকে Anki ডেক প্যাকেজ (.apkg) হিসেবে এক্সপোর্ট করুন।
vocabulary.sd.outcome.newer-anki = এই ডেক সবচেয়ে নতুন Anki ফরম্যাটে। Support older Anki versions টিক দিয়ে আবার এক্সপোর্ট করুন।
vocabulary.sd.outcome.deck-too-large = এই Anki ডেক এখানে পড়ার পক্ষে খুব বড়: সর্বোচ্চ 4,000 ফাইল, 4 MiB নোট ও 20,000 নোট। মিডিয়া ও সূচি ছাড়া এক্সপোর্ট করুন, বা ভাগ করুন।
