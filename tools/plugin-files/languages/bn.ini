update.plugin.how = "আপডেট নতুন ফার্মওয়্যার ইনস্টল করে, যেসব ডিভাইসে PaperPaw-ই ফার্মওয়্যার, যেমন X4। এটি সেটিংসে আপডেট নামে পাবেন।\n\nঅনলাইনে খুঁজুন আপডেট সার্ভারকে নতুন PaperPaw-এর কথা জিজ্ঞেস করে ও নামায়, Wi-Fi-তে কয়েক মিনিট লাগে। অথবা কার্ডের updates ফোল্ডারে একটি আপডেট ফাইল (.bin দিয়ে শেষ, paperpaw.org থেকে) কপি করুন, যেমন Wi-Fi ট্রান্সফার দিয়ে। ইনস্টলে তখন প্রায় এক মিনিট লাগে ও ডিভাইস রিস্টার্ট হয়; বই, সেটিংস ও পড়ার অবস্থান থাকে।\n\nআপডেট খুঁজুন চালু থাকলে (সেটিংসে, প্রথমে বন্ধ), ডিভাইস প্রায় সপ্তাহে একবার নিজে জিজ্ঞেস করে, শুধু যখন Wi-Fi এমনিতেই চালু বা চার্জ হচ্ছে। পাওয়া নতুন PaperPaw এখানে অপেক্ষায় থাকে; কিছুই আপনার পড়ায় বাধা দেয় না। খোঁজায় ডিভাইসে যা চলছে তা পাঠানো হয়, ডিভাইসের কোনো নাম বা নম্বর নয়; ডিভাইস গোনার জন্য আপনি চেয়েছিলেন কিনা এবং দিন, সপ্তাহ বা মাসের প্রথম খোঁজা কিনা তাও।\n\nআপনার ব্যবহৃত প্লাগইনের নতুন রিলিজের সংস্করণ এখনো না থাকলে আপডেট তাদের জন্য অপেক্ষা করে। পুরনো সংস্করণ শুধু আপনি বাছলেই ইনস্টল হয়।\n\nCrossPoint-এর মতো অন্য ফার্মওয়্যারও এখান থেকে ইনস্টল হয়: এর ফাইল (.bin দিয়ে শেষ) updates ফোল্ডারে রাখুন ও আপডেট খুলুন। PaperPaw যাচাই করে এটি এই ডিভাইসের পূর্ণ, অক্ষত ফার্মওয়্যার কিনা, কিন্তু কে বানিয়েছে তা বলতে পারে না, কারণ এটি সই করা নয়। তবুও ইনস্টল করুন এটিকে ফ্ল্যাশের অন্য অর্ধেকে লেখে, আর ডিভাইস সেটি চালু করে; ওই ফার্মওয়্যার তার ওপর কিছু ইনস্টল না করা পর্যন্ত PaperPaw তার অর্ধেকে থাকে। পরে PaperPaw-তে ফিরতে অন্য ফার্মওয়্যারের মেনু থেকে, যেমন CrossPoint-এর SD ফার্মওয়্যার আপডেট থেকে, এর ইনস্টল ফাইল (paperpaw-<device>-<version>-install.bin) ইনস্টল করুন।"
