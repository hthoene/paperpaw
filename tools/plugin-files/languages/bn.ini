vocabulary.setting.sd-auto.help = ফ্ল্যাশকার্ড ফোল্ডারের নতুন বা বদলানো ফাইল পড়ে।
vocabulary.setting.sd-folder = ডেকের ফাইলের ফোল্ডার
vocabulary.setting.sd-folder.help = SD কার্ডে: এর ভেতরের CSV, TSV বা Anki ফাইল একটি ডেক।
vocabulary.sd.readme = "ফাইল থেকে ফ্ল্যাশকার্ড\n\nপ্রতি ডেকের জন্য এখানে একটি ফাইল রাখুন: Spanish.tsv থেকে Spanish ডেক হয়।\nফাইল: .tsv, .csv বা .txt, UTF-8-এ সংরক্ষিত, অথবা .apkg: Support older Anki versions টিক দিয়ে এক্সপোর্ট করা Anki ডেক। এর নোটের প্রথম তিন ঘর হয় সামনে, পিছনে ও উদাহরণ; এর সূচি ও মিডিয়া পড়া হয় না, আর PaperPaw কখনো Anki ফাইল লেখে না।\n\nপ্রতি লাইনে একটি কার্ড: সামনে, পিছনে ও একটি উদাহরণ (ঐচ্ছিক), ট্যাব, কমা বা সেমিকোলন দিয়ে আলাদা। প্রথম লাইনে কলামের নাম থাকতে পারে: front, back, example। উদাহরণ:\n\nKatze\tcat\tDie Katze schläft.\n\nতারপর রিডারে ফ্ল্যাশকার্ড খুলুন, SD কার্ডের কার্ড বাছুন, তারপর কার্ড থেকে ডেক আপডেট করুন।\n\nজানা ভালো:\n- ডেক রিডারেই থাকে, আপনার শেখা সহ। ফাইল নতুন বা বদলানো হলে পড়া হয়, আর এর কার্ড ডেকে যোগ হয় বা সেখানে বদলায়।\n- ফাইলে কার্ডের পিছন বা উদাহরণ বদলালে কার্ড বদলায় এবং আপনার অগ্রগতি থাকে।\n- কার্ডের সামনের লেখা বদলালে তা নতুন কার্ড গণ্য হয়, আর পুরনোটি আবার শুরু থেকে। কার্ড সামনের লেখা দিয়ে মেলানো হয়, ফাঁকা ও বড় হাতের অক্ষর গোনা হয় না। ডেক ফাইলে সংরক্ষণ করলে (SD কার্ডের কার্ড, ডেক কার্ডে সংরক্ষণ) প্রতিটি কার্ডের id কলামে একটি নম্বর থাকে: সেখানে সামনের লেখা বদলান, ফাইলের প্রথম দুই লাইন যেমন আছে রাখুন, তাহলে কার্ড তার শেখা ধরে রাখে।\n- সংরক্ষণ ডেকের কার্ড লেখে। ফাইলে যা ছিল কিন্তু কার্ড নয় (সামনের লেখা ছাড়া লাইন) তা থাকে না; আগের ফাইল _name.bak.tsv-তে কপি হয়।\n- ফাইল CSV UTF-8 হিসেবে সংরক্ষণ করুন (UTF-16 নয়, স্প্রেডশিটের নিজস্ব ফরম্যাট নয়)। 4 MiB বা 20,000 লাইনের বেশি ফাইল পড়া হয় না: ভাগ করুন।\n- ফাইলে মোছা লাইন ডেকের কার্ড মোছে না, যদি না ওই ডেকে নেই এমন কার্ড সরান চালু করেন। তখন কার্ড শেখা সহ চলে যায়।\n- যেসব ফাইলের নাম _ দিয়ে শুরু সেগুলো পড়া হয় না।\n"
