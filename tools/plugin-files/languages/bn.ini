joplin.plugin.description = প্রতিটি বইয়ের হাইলাইট ও নোট একটি নোটে রাখে। Joplin-এর সাথে কাজ করে (Joplin Cloud, Joplin Server বা WebDAV)।
joplin.title = বইয়ের নোট সিঙ্ক
joplin.send = Joplin-এ পাঠান
joplin.send.help = এক্সপোর্ট করা নোট সাথে সাথে পাঠানো হয়। যে নোট পাঠানো যায়নি তা অপেক্ষা করে এবং পরের এক্সপোর্টে, এটি দিয়ে, বা নিয়ম অনুযায়ী যায়।
joplin.service = সিঙ্ক হয় যার সাথে
joplin.service.help = Joplin যার সাথে সিঙ্ক করে, Joplin-এ যেমন সেট করা: Joplin Cloud, আপনার নিজের Joplin Server, বা Nextcloud-এর মতো একটি WebDAV ফোল্ডার। কোনো কম্পিউটার চালু রাখতে হয় না।
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = ঠিকানা
joplin.address.help = Joplin Server: এর ঠিকানা, যেমন joplin.example.org। WebDAV: Joplin যে ফোল্ডারে সিঙ্ক করে, এর সেটিংসের মতো, যেমন dav.example.org/Joplin।
joplin.email = ইমেইল
joplin.user = ইউজার নাম
joplin.user.help = Joplin Cloud ও Joplin Server: যে ইমেইলে সাইন ইন করেন (দুই-ধাপের সাইন ইন এখনো চলে না)। WebDAV: ফোল্ডারের ইউজার নাম।
