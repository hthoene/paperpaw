files.plugin.name = ফাইল ব্রাউজার
files.plugin.description = ডিভাইসের বই ও ফোল্ডারের তালিকা দেখায় এবং খোলে।
files.plugin.how = "লাইব্রেরি আপনার লাইব্রেরি ফোল্ডারের বইগুলো তালিকাভুক্ত করে, প্রতিটির কভার, শিরোনাম, লেখক এবং কতটা পড়েছেন তাসহ। সবশেষ পড়া বইটি ওপরে একটি কার্ড হয়ে থাকে, তাই পড়া চালিয়ে যেতে একটি ট্যাপ, বা “বেছে নিন” একবার চাপাই যথেষ্ট। লাইব্রেরি বই খোঁজার সময় এ পর্যন্ত কতগুলো পেয়েছে তা জানায়।\n\nবইয়ের ওপরে বেছে নিন কী দেখানো হবে: সব বই, যেগুলো পড়ছেন, না-পড়া বা শেষ করা বই, অথবা তাক (লেখক, সিরিজ, ট্যাগ, প্রিয় বই, শুরু করা প্রতিটি সিরিজের পরের বই অনুযায়ী)। বই পড়তে তাতে ট্যাপ করুন; তা খুলতে, শেষ বা না-পড়া হিসেবে চিহ্নিত করতে, তথ্য দেখতে, আর্কাইভে সরাতে বা মুছতে সেটি চেপে ধরুন (বোতামে “বেছে নিন” চেপে ধরুন)। লাইব্রেরি মেনুর জন্য শিরোনামে ট্যাপ করুন: বই কীভাবে সাজানো ও দেখানো হবে, খোঁজা, লাইব্রেরি ফোল্ডার ও সেটিংস।\n\nলাইব্রেরি ফোল্ডার সেটিংসে লাইব্রেরির অধীনে “লাইব্রেরি ফোল্ডার”-এ ঠিক করা হয়; সেখানে বই কভারের গ্রিড হিসেবেও দেখাতে পারেন। অন্য সব ফাইলের জন্য টুলস মেনুর “ফাইল” ব্যবহার করুন।"
