vocabulary.sd.fault.no-front = সামনের কলামে কোনো লেখা নেই। শব্দটি সেখানে রাখুন।
vocabulary.sd.fault.not-utf8 = UTF-8 লেখা নয়। ফাইল UTF-8 হিসেবে সংরক্ষণ করুন (স্প্রেডশিটে: CSV UTF-8)।
