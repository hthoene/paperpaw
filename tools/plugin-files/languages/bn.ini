joplin.password.help = এই ডিভাইসের অন্য পাসওয়ার্ড ও কী-র সাথে রাখা হয়। Nextcloud-এর জন্য অ্যাপ পাসওয়ার্ডও চলে।
joplin.secret = Joplin পাসওয়ার্ড
joplin.not-kept = পাসওয়ার্ড এই ডিভাইসে রাখা যায়নি।
joplin.notebook = নোটবুক
joplin.notebook.help = PaperPaw Joplin-এ যে নোটবুক বানায়, প্রতিটি বইয়ের জন্য একটি নোটসহ। আবার এক্সপোর্ট করলে নোট হালনাগাদ হয়, অন্য নোটবুকে সরানো নোটও।
joplin.idle = এক্সপোর্ট করা নোট সাথে সাথে Joplin-এ পাঠানো হয়।
joplin.waiting.one = {count}টি বইয়ের নোট পাঠানোর অপেক্ষায়।
joplin.waiting.other = {count}টি বইয়ের নোট পাঠানোর অপেক্ষায়।
joplin.sent.one = {count}টি বইয়ের নোট Joplin-এ আছে।
joplin.sent.other = {count}টি বইয়ের নোট Joplin-এ আছে।
joplin.some-failed = Joplin-এ পাঠানো হয়েছে: {sent}। পাঠানো হয়নি: {failed}; পরে আবার পাঠানো হবে।
joplin.apart.one = {count}টি নোট Joplin-এ বদলানো হয়েছে, তাই পাশে একটি নতুন করা হয়েছে।
joplin.apart.other = {count}টি নোট Joplin-এ বদলানো হয়েছে, তাই পাশে নতুনগুলো করা হয়েছে।
joplin.nothing = Joplin-এ পাঠানোর জন্য কোনো নোট অপেক্ষায় নেই।
joplin.no-network = Joplin-এ পাঠাতে নেটওয়ার্ক লাগবে। নোট অপেক্ষা করে এবং পরে পাঠানো হয়।
joplin.setup-needed = আগে Joplin সেট করুন: কোথায় সিঙ্ক হয়, আপনার অ্যাকাউন্ট ও পাসওয়ার্ড।
joplin.no-time = সময় এখনো জানা নেই। নোট অপেক্ষা করে এবং পরে পাঠানো হয়।
joplin.unreachable = Joplin-এ পৌঁছানো যাচ্ছে না। নোট অপেক্ষা করে এবং পরে পাঠানো হয়।
joplin.failed = Joplin ত্রুটি ({status}) দিয়ে সাড়া দিয়েছে। নোট অপেক্ষা করে এবং পরে পাঠানো হয়।
joplin.bad-login = Joplin ইমেইল, ইউজার নাম বা পাসওয়ার্ড গ্রহণ করেনি। Joplin-এর সেট-আপে সেগুলো দেখুন।
joplin.no-server = এই ঠিকানায় কোনো Joplin Server নেই। Joplin-এর সেট-আপে এটি দেখুন।
joplin.bad-address = ঠিকানাটি PaperPaw ব্যবহার করতে পারে না। Joplin-এর সেট-আপে এটি দেখুন।
joplin.no-data = এই ঠিকানায় কোনো Joplin নোট নেই। এটি দেখুন, বা আগে Joplin-কে এর সাথে সিঙ্ক করুন।
joplin.encrypted = Joplin-এর এন্ড-টু-এন্ড এনক্রিপশন চালু। PaperPaw নোট এনক্রিপ্ট করতে পারে না, তাই কিছু পাঠায় না।
joplin.newer-target = Joplin সেখানে নোট এই PaperPaw-এর জানার চেয়ে নতুন ফরম্যাটে রাখে। পাঠাতে PaperPaw আপডেট করুন।
joplin.older-target = Joplin সেখানে নোট পুরোনো ফরম্যাটে রাখে। আপগ্রেড করতে Joplin খুলুন, তারপর আবার পাঠান।
joplin.upgrading = Joplin এখনই সেখানকার নোট আপগ্রেড করছে। নোট অপেক্ষা করে এবং পরে পাঠানো হয়।
joplin.no-memory = নোট পাঠানোর জন্য যথেষ্ট মেমরি নেই। রিস্টার্ট করে আবার চেষ্টা করুন।
