anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ကွန်ပျူတာပေါ်ရှိ Anki ၏ လေ့လာရမည့်ကတ်များကို လေ့လာပြီး AnkiConnect add-on မှတစ်ဆင့် အဖြေများ ပြန်ပို့သည်။
anki.plugin.how = "Anki ဖြင့် ကွန်ပျူတာပေါ်ရှိ Anki ၏ လေ့လာရမည့်ကတ်များကို စာဖတ်စက်တွင် လေ့လာပြီး အဖြေများကို ပြန်ပို့နိုင်သည်။ အခမဲ့ add-on AnkiConnect (ကုဒ် 2055492159) ကို သုံးပြီး AnkiWeb ကို မသုံးပါ။ မူလက ပိတ်ထားသည်: ပလပ်အင် စတိုးမှ ထည့်ပါ။\n\nကွန်ပျူတာတွင်: Anki တွင် AnkiConnect ကို ထည့်သွင်းပါ (Tools, Add-ons, Get Add-ons) ပြီး Anki ကို ပြန်စပါ။ စင့်ခ်လုပ်စဉ် Anki ဖွင့်ထားရမည်။ Tools, Add-ons, AnkiConnect, Config တွင် \"webBindAddress\" ကို \"0.0.0.0\" သို့ ပြောင်းပါ။ Port (\"webBindPort\") မှာ 8765 ဖြစ်သည်။ \"apiKey\" သတ်မှတ်ထားပါက ဤနေရာတွင် တူညီသောကီး ထည့်ပါ။ ပြီးလျှင် Anki ကို ပြန်စပြီး firewall က မေးပါက ခွင့်ပြုပါ။ ယုံကြည်ရသော ကွန်ရက်တွင်သာ သုံးပါ၊ ကီးတစ်ခု သတ်မှတ်ရန် အကြံပြုသည်။\n\nစာဖတ်စက်တွင်: ကိရိယာများမှ Anki ကို ဖွင့်ပြီး ကွန်ပျူတာ တွင် လိပ်စာ (ဥပမာ 192.168.1.20)၊ လိုအပ်ပါက port နှင့် API ကီး ထည့်ပါ။ ကတ်အစုံ ရွေးပါ သို့မဟုတ် ကတ်အစုံ အားလုံးအတွက် အလွတ်ထားပါ။ Wi-Fi ဖွင့်ပြီး Anki နှင့် စင့်ခ်လုပ်ရန် ကို ရွေးပါ: စောင့်နေသော အဖြေများကို အရင်ပို့ပြီး လေ့လာရမည့်ကတ်များ (နှင့် ကတ်အသစ်များ) ကို အများဆုံး 50 ခု ယူသည်။ လေ့လာရန် ဖြင့် ကွန်ရက်မလိုဘဲ လေ့လာပါ: အဖြေကို ပြပြီး ထပ်မံ၊ ခက်၊ ကောင်း သို့မဟုတ် လွယ် ဟု အဆင့်သတ်မှတ်ပါ။ အဖြေများကို စက်တွင် သိမ်းထားပြီး နောက်စင့်ခ်တွင် Anki သို့ ပို့သည်။ ကတ်ပြန်လာမည့်အချိန်ကို Anki က ဆုံးဖြတ်သည်။\n\nAnki ဖွင့်လျှင် စင့်ခ်လုပ်ရန် ဆက်တင်က မျက်နှာပြင်ဖွင့်တိုင်း စင့်ခ်လုပ်သည်။ ခလုတ်နှိပ်ရုံဖြင့် ကွန်ရက် မသုံးပါ။"
