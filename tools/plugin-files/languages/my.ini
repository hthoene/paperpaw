launcher-simple.plugin.description = တည်ငြိမ်သော စတင်မျက်နှာပြင်: နာရီကြီး၊ ကတ်များ၊ dock နှင့် အဝိုင်းခလုတ်များပါ အမြန် ပန်နယ်။
launcher-simple.plugin.how = "ရိုးရှင်းသော ပင်မသည် အခြေခံသာ လိုသူများအတွက် တည်ငြိမ်သော စတင်မျက်နှာပြင် ဖြစ်သည်: နာရီကြီး၊ ဖတ်နေသော စာအုပ်၊ စာကြည့်တိုက်နှင့် စတိုးကို ကတ်ကြီးများအဖြစ်၊ အောက်ခြေတွင် သင်္ကေတ သုံးခုပါ dock။ သတ်မှတ်စရာ မလိုပါ။\n\nဆက်တင်များ › ပင်မစာမျက်နှာ တွင် ရွေးပါ။ ၎င်း၏ အမြန် ပန်နယ် (ဆက်တင်များတွင် ပန်နယ်အဖြစ် ရွေးပါ) တွင် အဝိုင်းခလုတ်ကြီးများ၊ ရှေ့မီး (ရှိလျှင်) ဘားနှင့် စာသားအရွယ် ဘား ပါသည်။ ခလုတ်ဖြင့်: မြှားခလုတ်များက ရွေးထားမှုကို ရွှေ့ပြီး “ရွေးရန်” က ထိုအပိုင်း ဖော်ပြသည့်အတိုင်း လုပ်သည်။ ဘားပေါ်တွင် ဆယ်ပုံတစ်ပုံ တိုးပြီး အဆုံးမှ အစသို့ ပြန်သွားသည်။ ထိတွေ့ဖြင့်: အပိုင်းကို တို့ပါ သို့မဟုတ် ဘားပေါ်တွင် လိုသည့်နေရာကို တို့ပါ။\n\nစာကြည့်တိုက်သည် စာအုပ်များကို ကတ်များအဖြစ်၊ နောက်ဆုံးဖွင့်ခဲ့သည်ကို ရှေ့ဆုံးထား၍ တစ်ကြိမ်လျှင် စာမျက်နှာတစ်ခု ပြပြီး ပုံမှန် စာဖတ်ကိရိယာကို ဖွင့်သည်။\n\nဆက်တင်များ › ရိုးရှင်းသော ပင်မ တွင် စိတ်ကြိုက်ပြင်ပါ: ပင်မမီနူးကဲ့သို့ ပြင်နိုင်သော စာရင်း သုံးခု။ ကတ်များ: ပြမည့် ကတ်များနှင့် အစဉ်။ Dock: dock ထဲရှိ သင်္ကေတများ၊ မည်သည့်ပလပ်အင်၏ မည်သည့်လုပ်ဆောင်ချက်မဆို။ အမြန် ပန်နယ်: ပြမည့် ခလုတ်နှင့် ဘားများ။ မျက်နှာပြင်တွင် နေရာမဆံ့သော ကတ်များကို အဆုံးမှစ၍ ချန်ထားသည်။ ရက်စွဲနှင့် ဘက်ထရီ ပြမပြကိုလည်း ထိုနေရာတွင် ရွေးနိုင်သည်။"
