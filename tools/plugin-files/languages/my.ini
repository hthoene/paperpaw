opds.plugin.name = OPDS ကတ်တလောက်များ
opds.plugin.description = OPDS ကတ်တလောက်များကို ကြည့်ရှုပြီး စာအုပ်များ ဒေါင်းလုဒ်လုပ်ကာ ဖိုင်တွဲများကို ၎င်းတို့နှင့် စင့်ခ်လုပ်ထားသည်။
opds.plugin.how = "OPDS ကတ်တလောက်များသည် Project Gutenberg၊ Calibre-Web၊ Kavita သို့မဟုတ် Komga ကဲ့သို့ အွန်လိုင်း စာကြည့်တိုက်များ ဖြစ်သည်။ ဤပလပ်အင်သည် ၎င်းတို့ကို ဖိုင်တွဲများကဲ့သို့ ကြည့်ရှု၊ ရှာဖွေပြီး စာအုပ်များကို စာကြည့်တိုက်ထဲသို့ ဒေါင်းလုဒ်လုပ်သည်။\n\nကိရိယာများ မီနူးမှ ကတ်တလောက်များကို ဖွင့်ပြီး “ကတ်တလောက် ထည့်ရန်” ကို ရွေးပါ: လိပ်စာနှင့် အကောင့်လိုလျှင် အသုံးပြုသူအမည်နှင့် စကားဝှက်။ ကတ်တလောက်ကို တို့လျှင် ကြည့်ရှုနိုင်ပြီး ဖိထားလျှင် (ခလုတ်ဖြင့်ဆိုလျှင် ရွေးရန်ကို ဖိထား) စင့်ခ်လုပ်ရန်၊ ပြင်ရန် သို့မဟုတ် ဖယ်ရှားရန် ရနိုင်သည်။\n\n“ဤကတ်တလောက်ကို စင့်ခ်လုပ်ရန်” ဖွင့်ထားလျှင် “ကတ်တလောက်များ စင့်ခ်လုပ်ရန်” က စာအုပ်အသစ်များကို ၎င်း၏ဖိုင်တွဲထဲ ဒေါင်းလုဒ်လုပ်သည်။ “စင့်ခ်တစ်ကြိမ်လျှင် စာအုပ်” က တစ်ကြိမ်တွင် ရယူမည့် အရေအတွက်ကို ကန့်သတ်သဖြင့် ကတ်တလောက်ကြီးက စက်ကို မပြည့်စေပါ။ ကတ်တလောက်အစား Cloud ဖိုင်တွဲ (WebDAV) ကိုလည်း သုံးနိုင်သည်။"
