plugin-manager.plugin.description = ပလပ်အင်များကို စာရင်းပြပြီး ဖွင့်ခြင်း၊ ပိတ်ခြင်း ပြုလုပ်သည်။
plugin-manager.plugin.how = "ပလပ်အင်မန်နေဂျာသည် ပလပ်အင်တိုင်းကို ဗားရှင်းနှင့် ဖော်ပြချက်နှင့်အတူ ပြပြီး ပလပ်အင်များကို ဖွင့်၊ ပိတ် လုပ်သည်။\n\nဆက်တင်များတွင် “ပလပ်အင်များ စီမံရန်” အဖြစ် ရှာပါ။ “ပလပ်အင် ဆက်တင်များ” သည် ပလပ်အင်တစ်ခုစီ၏ ကွန်ရက်သုံးစွဲမှုကဲ့သို့ ရွေးချယ်မှုများအတွက် သီးခြားစာမျက်နှာ ဖြစ်သည်။ ပလပ်အင်ကို ဖွင့်ရန် သို့မဟုတ် ပိတ်ရန် တို့ပါ (ခလုတ်ဖြင့်ဆိုလျှင် ရွေးပါ)။ ပြောင်းလဲမှုသည် ပြန်စပြီးမှ သက်ရောက်သည်: ထိုအခါ အောက်ခြေဘားတွင် “ယခု ပြန်စရန်” ပေါ်သည်။ အလုပ်လုပ်ပုံကို ဖတ်ရန် ပလပ်အင်ကို ဖိထားပါ (ခလုတ်ဖြင့်ဆိုလျှင် ရွေးရန်ကို ဖိထားပါ)။\n\n“အမြဲဖွင့်” ဟု မှတ်ထားသော ပလပ်အင်ကို ပိတ်၍မရပါ။ “လိုအပ်” ဟု မှတ်ထားသည်ကို အခြားပလပ်အင်က ၎င်း၏အလုပ်ကို လုပ်ပေးမှသာ ပိတ်နိုင်သည်၊ မဟုတ်လျှင် PaperPaw ပြန်လမ်း မရှိတော့ပါ။ “မျက်နှာပြင်များ” အောက်တွင် ပလပ်အင်အများက ပေးသည့်နေရာကို မည်သည့်ပလပ်အင်က ပြမည်ကို ရွေးနိုင်သည်။"
