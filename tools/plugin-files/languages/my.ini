smart-home.problem.not-found = ဆာဗာက ၎င်းကို မသိပါ။ လိပ်စာကို စစ်ဆေးပါ။
smart-home.problem.tls = လုံခြုံသော ချိတ်ဆက်မှု မအောင်မြင်ပါ။ https အတွက် စာဖတ်စက် ယုံကြည်သော လက်မှတ် လိုအပ်သည်၊ အိမ်ကွန်ရက်တွင် http ကို သုံးပါ။
