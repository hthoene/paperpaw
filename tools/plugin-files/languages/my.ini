format-cbz.setting.panels.help = တစ်ကြိမ်လျှင် အကွက်တစ်ကွက်၊ စာမျက်နှာလှန်ခြင်းက တစ်ကွက်ချင်း သွားသည်။
format-docx.plugin.name = DOCX စာရွက်စာတမ်းများ
format-docx.plugin.description = Word နှင့် အခြားပရိုဂရမ်များက သိမ်းသော .docx ဖိုင်များကို ဖွင့်ပေးသည်။
format-docx.plugin.how = ".docx စာရွက်စာတမ်းများကို စာအုပ်အဖြစ် ဖွင့်ပေးသည်: ခေါင်းစဉ်များနှင့် မာတိကာ၊ စာရင်းများ၊ ဇယားများ၊ စာလုံးထူနှင့် စာလုံးစောင်း၊ လင့်ခ်များနှင့် ပုံများ (JPEG၊ PNG၊ GIF)။\n\nဖိုင်များကို စာကြည့်တိုက်ဖိုင်တွဲထဲ ထည့်ပြီး စာကြည့်တိုက်မှ ဖွင့်ပါ။ ခေါင်းစဉ်နှင့် စာရေးသူကို စာရွက်စာတမ်း၏ ဂုဏ်သတ္တိများမှ ယူသည်။ အောက်ခြေမှတ်ချက်၊ header နှင့် footer၊ မှတ်ချက်များကို မပြပါ။"
format-docx.title = DOCX စာရွက်စာတမ်း
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB စာအုပ်များကို ၎င်းတို့၏ ပုံစံ၊ မာတိကာနှင့် ပုံများနှင့်အတူ ဖွင့်ပေးသည်။
format-epub.plugin.how = "EPUB စာအုပ်များကို စာကြည့်တိုက်မှ အခြားစာအုပ်များကဲ့သို့ မာတိကာ၊ ပုံများနှင့် ထုတ်ဝေသူ၏ ပုံစံချမှုနှင့်အတူ ဖွင့်သည်။ ဝဘ်စာမျက်နှာ (HTML)၊ Markdown၊ FictionBook (.fb2) နှင့် ကာတွန်းစာအုပ် ဖိုင်များ (.cbz) ကိုလည်း ကိုယ်ပိုင် ပလပ်အင်တစ်ခုစီဖြင့် ထိုနည်းအတိုင်း ဖွင့်သည်။\n\nအခန်းတစ်ခုကို ပထမအကြိမ် ဖွင့်ချိန်တွင် ပြောင်းလဲပြီး ပလပ်အင်၏ cache တွင် သိမ်းထားသဖြင့် နောက်ပိုင်း ပိုမြန်ပြီး စာအုပ်ကြီးများလည်း စက်သေးများပေါ်တွင် အလုပ်လုပ်သည်။ မာတိကာကို စာဖတ် မီနူးရှိ “မာတိကာ” တွင် ရှာပါ။ စာအုပ်၏ ကိုယ်ပိုင်ပုံစံ သုံးမသုံးကို စာဖတ်ခြင်း အောက်ရှိ “ထုတ်ဝေသူ၏ ပုံစံချမှု” ဆက်တင်က ဆုံးဖြတ်သည်။"
format-epub.title = EPUB စာအုပ်
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook စာအုပ်များ (.fb2၊ zip ဖြင့်လည်း) ကို ဖွင့်ပေးသည်။
format-fb2.plugin.how = "ရုရှားနှင့် အခြားစာအုပ်များတွင် အသုံးများသော FictionBook စာအုပ်များ (.fb2) ကို zip ဖြင့် ချုံ့ထားလျှင်လည်း (.fb2.zip) ခေါင်းစဉ်၊ စာရေးသူများ၊ မျက်နှာဖုံးနှင့် အခန်းများနှင့်အတူ ဖွင့်ပေးသည်။\n\nစာကြည့်တိုက်ဖိုင်တွဲထဲ ထည့်ပါ: ၎င်းတို့သည် စာကြည့်တိုက်တွင် ပေါ်ပြီး အခြားစာအုပ်များကဲ့သို့ ပွင့်သည်။"
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ဖိုင်အဖြစ် သိမ်းထားသော ဝဘ်စာမျက်နှာများကို ဖတ်စရာများကိုသာ ပြ၍ ဖွင့်ပေးသည်။
format-html.plugin.how = "ဖိုင်အဖြစ် သိမ်းထားသော ဝဘ်စာမျက်နှာများ (.html၊ .htm၊ .xhtml) ကို စာအုပ်အဖြစ် ဖွင့်ပေးသည်: ပတ်ပတ်လည်ရှိ မီနူး၊ ကြော်ငြာ စသည်တို့ မပါဘဲ ဖတ်စရာများကိုသာ ပြသည်။\n\nဖိုင်ကို စာကြည့်တိုက်ဖိုင်တွဲထဲ ထည့်ပြီး စာကြည့်တိုက်မှ အခြားစာအုပ်ကဲ့သို့ ဖွင့်ပါ။ စာမျက်နှာအတွင်း လင့်ခ်များ အလုပ်လုပ်သည်။ ပုံများသည် ဖိုင်ထဲရှိ ၎င်းတို့နေရာတွင် ပေါ်သည်။"
format-html.title = ဝဘ်စာမျက်နှာ (HTML)
format-images.plugin.name = ပုံများ
format-images.plugin.description = ပုံများ (.jpg၊ .png၊ .gif) ကို စာမျက်နှာတစ်ခုလျှင် တစ်ပုံဖြင့် စာအုပ်အဖြစ် ဖွင့်ပေးသည်။
format-images.plugin.how = "ပုံများ (.jpg၊ .png၊ .gif) ကို စာကြည့်တိုက်မှ စာအုပ်ကဲ့သို့ ဖွင့်သည်: စာမျက်နှာတစ်ခုလျှင် ပုံတစ်ပုံ၊ မျက်နှာပြင်နှင့် ကိုက်အောင်။\n\nပုံဖိုင်တွဲတစ်ခုလုံး ဖတ်ရန် ၎င်း၏ ပထမပုံကို ဖွင့်ပါ: ဖိုင်တွဲထဲရှိ နောက်ပုံများက အမည်အစဉ်အတိုင်း (2 သည် 10 ၏ ရှေ့) လိုက်လာသည်။ ဖိုင်တွဲ၏ နောက်ပိုင်းရှိ ပုံကို ဖွင့်လျှင် ထိုနေရာမှ စသည်။ ပုံတစ်ပုံစီ၏ နေရာကို သီးခြား မှတ်ထားသည်။ ဖွင့်သည့်ပုံမှစ၍ ပုံ 300 အထိ ဖတ်သည်။\n\nပုံမဟုတ်သော သို့မဟုတ် ကြီးလွန်းသော ဖိုင်သည် ၎င်း၏ အမည်ကိုသာ ပြသည်။ ကိုယ်ပိုင်ခေါင်းစဉ်ပါ ပုံများစွာရှိသော စာအုပ်အတွက် ကာတွန်းစာအုပ် ဖိုင် (.cbz) က ပိုကောင်းသည်။"
format-images.title = ပုံ
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ဖိုင်များ (.md)၊ ဥပမာ မှတ်စုများကို ဖွင့်ပေးသည်။
format-markdown.plugin.how = "မှတ်စုကဲ့သို့ Markdown ဖိုင်များ (.md) ကို စာအုပ်အဖြစ် ဖွင့်ပေးသည်: ခေါင်းစဉ်၊ စာရင်း၊ ကိုးကားချက်နှင့် အလေးပေးချက်များကို သင်္ကေတအဖြစ် မဟုတ်ဘဲ ရည်ရွယ်ထားသည့်အတိုင်း ပြသည်။\n\nဖိုင်များကို စာကြည့်တိုက်ဖိုင်တွဲထဲ ထည့်ပြီး စာကြည့်တိုက်မှ ဖွင့်ပါ။ ပထမ ခေါင်းစဉ်သည် စာအုပ်ခေါင်းစဉ် ဖြစ်သည်။ ဖိုင်ဘေးရှိ ပုံများသည် စာသားက ဖော်ပြသည့်နေရာတွင် ပေါ်သည်။"
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI စာအုပ်များ
format-mobi.plugin.description = DRM မပါသော .mobi နှင့် .azw ဖိုင်များကို ဖွင့်ပေးသည်။
format-mobi.plugin.how = "MOBI စာအုပ်များ (.mobi၊ .azw) ကို စာကြည့်တိုက်မှ အခြားစာအုပ်ကဲ့သို့ ဘာမျှ သတ်မှတ်စရာမလိုဘဲ ဖွင့်သည်။ ခေါင်းစဉ်၊ စာရေးသူ၊ ဘာသာစကားနှင့် မျက်နှာဖုံးကို စာအုပ်မှ ယူပြီး မာတိကာကို ခေါင်းစဉ်များမှ ပြုလုပ်သည်။\n\nပထမအကြိမ် ဖွင့်ချိန်တွင် စာအုပ်ကို ပြောင်းလဲသဖြင့် ရှည်သော စာအုပ်အတွက် စက္ကန့်အနည်းငယ် ကြာသည်။ ထို့နောက် ချက်ချင်း ပွင့်သည်။ စာသား၊ ခေါင်းစဉ်၊ စာလုံးထူနှင့် စောင်း၊ လင့်ခ်နှင့် ပုံများကို ပြသည်။\n\nDRM ပါသော စာအုပ်များ (ဆိုင်မှ ဝယ်သော စာအုပ်အများစု)၊ Huffman ချုံ့ထားသော သို့မဟုတ် KF8 ပုံစံအသစ် (.azw3) စာအုပ်များကို မဖွင့်နိုင်ပါ: ဖွင့်ချိန်တွင် PaperPaw က ပြောပါမည်။ Calibre ကဲ့သို့ ကိရိယာဖြင့် ပြုလုပ်ထားသော EPUB မိတ္တူကို အမြဲ ဖွင့်နိုင်သည်။"
format-mobi.title = MOBI စာအုပ်များ
format-rtf.plugin.name = RTF စာရွက်စာတမ်းများ
format-rtf.plugin.description = .rtf ဖိုင်များကို စာအုပ်အဖြစ် ဖွင့်ပေးသည်။
format-rtf.title = RTF စာရွက်စာတမ်းများ
format-txt.plugin.name = ရိုးရိုးစာသား
format-txt.plugin.description = ရိုးရိုးစာသားဖိုင်များ (.txt) ကို ဖွင့်ပေးသည်။
format-txt.plugin.how = "ရိုးရိုးစာသားဖိုင်များ (.txt) ကို စာကြည့်တိုက်မှ အခြားစာအုပ်ကဲ့သို့ ဘာမျှ သတ်မှတ်စရာမလိုဘဲ ဖွင့်သည်။ ပလပ်အင်သည် UTF-8၊ UTF-16 နှင့် Windows-1252 စာသားကို ဖတ်ပြီး encoding ကို ကိုယ်တိုင် ခွဲခြားသည်။\n\nစာပိုဒ်များကို ဖိုင်ရှိ လွတ်နေသော စာကြောင်းများအတိုင်း ခွဲသည်။ ဖိုင်တွင် မရှိလျှင် စာကြောင်းတစ်ကြောင်းစီသည် စာပိုဒ်တစ်ခု ဖြစ်သည်။ Project Gutenberg ဖိုင်များတွင် အစနှင့် အဆုံးရှိ လိုင်စင်စာသားကို ချန်ထားပြီး ခေါင်းစဉ်နှင့် စာရေးသူကို header မှ ယူသည်။\n\nဖိုင်ကို တစ်ခါတည်း အပြည့် မဖွင့်သဖြင့် အလွန်ကြီးသော စာသားများကိုလည်း စက်သေးများပေါ်တွင် ဖွင့်နိုင်သည်။"
format-txt.title = ရိုးရိုးစာသား
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Xteink စာဖတ်စက်များအတွက် ကြိုတင်ပုံဖော်ထားသော စာမျက်နှာများ ဖြစ်သည့် XTC နှင့် XTCH စာအုပ်များကို ဖွင့်ပေးသည်။
format-xtc.plugin.how = "XTC နှင့် XTCH ဖိုင်များသည် Xteink စာဖတ်စက်များအတွက် converter များက ပြုလုပ်ထားသည့်၊ စာမျက်နှာများကို ပုံအဖြစ် ကြိုတင်ပုံဖော်ထားသော စာအုပ်များ ဖြစ်သည်။ ၎င်းတို့ကို စာကြည့်တိုက်မှ အခြားစာအုပ်ကဲ့သို့ ဖွင့်သည်။\n\nစာမျက်နှာတိုင်းသည် ပုံသေပုံ ဖြစ်သဖြင့် စာသားအရွယ်ကို ပြောင်း၍ သို့မဟုတ် အခြားဖောင့်ဖြင့် ပြ၍ မရပါ။ စာမျက်နှာများသည် အဖြူအမည်း သို့မဟုတ် မီးခိုးရောင် လေးဆင့် ဖြစ်သည်။ စာမျက်နှာတစ်ခုစီကို ပြချိန်တွင်မှ decode လုပ်သဖြင့် X4 တွင်ပင် မမ်မိုရီ အနည်းငယ်သာ လိုသည်။\n\nခေါင်းစဉ်၊ စာရေးသူနှင့် အခန်းများကို ဖိုင်တွင် ပါလျှင် ဖိုင်မှ ယူသည်။"
format-xtc.title = XTC စာမျက်နှာများ
gloss.plugin.name = Gloss
gloss.plugin.description = စကားလုံးများ၏ အပေါ်တွင် စာသားသေး: အသံထွက် သို့မဟုတ် ဘာသာပြန် အတို၊ စကားလုံးစာရင်းမှ။
gloss.plugin.how = "Gloss သည် စာအုပ်ရှိ စကားလုံးများ၏ အပေါ်တွင် စာသားသေးကို ပြသည်: စကားလုံး၏ အသံထွက် (furigana၊ pinyin၊ အသံထွက်) သို့မဟုတ် အဓိပ္ပာယ်ကို စကားလုံး တစ်လုံးနှစ်လုံးဖြင့်။ ဘာသာစကား သင်ယူရန် ရည်ရွယ်သည်။ စကားလုံးစာရင်း မပေးမချင်း ဘာမျှ မလုပ်ပါ။\n\nစာရင်းကို ရိုးရိုးစာသားဖိုင် (UTF-8) အဖြစ် ကတ်ပေါ်ရှိ .paperpaw/plugins/gloss/ ဖိုင်တွဲထဲ ထည့်ပါ။ စာကြောင်းတစ်ကြောင်းလျှင်: စကားလုံး၊ tab တစ်ခု၊ စာသားသေး။ # ဖြင့် စသော စာကြောင်းများသည် မှတ်ချက်ဖြစ်သည်။ ဥပမာ:\n\nHaus<tab>house\nwell-known<tab>bekannt\nHund<tab>dog\n\nထိုစာအုပ်အတွက်သာ သုံးရန် ဖိုင်ကို extension မပါသော စာအုပ်အမည်ဖြင့် (faust.epub: faust.txt)၊ ထိုဘာသာစကားရှိ စာအုပ်တိုင်းအတွက် သုံးရန် စာအုပ်၏ ဘာသာစကားဖြင့် (de.txt၊ ja.txt) အမည်ပေးပါ။ စာအုပ်၏ ကိုယ်ပိုင်ဖိုင်က ဦးစားပေးသည်။ စကားလုံးကို စာလုံးအကြီးအသေး မရွေး ရှာပြီး စကားလုံးအပြည့်သာ ရှာသည်။ ဂျပန်နှင့် တရုတ်အတွက် စာရင်းရှိ အရှည်ဆုံး စကားစုကို သုံးသည်။ နှစ်ကြိမ်ပါသော စကားလုံးသည် ပထမစာကြောင်းကို သုံးသည်။\n\nစာရင်းတစ်ခုမှ စကားလုံး 2,048 လုံး၊ တစ်လုံးလျှင် စာသားသေး 96 bytes၊ စုစုပေါင်း 24 KB အထိသာ သုံးသည်။ ပိုရှည်သော စာကြောင်းကို ချန်ထားသည်။ စာရင်းကို စာအုပ်ဖွင့်ချိန်တွင် တစ်ကြိမ်သာ ဖတ်သဖြင့် စာမျက်နှာလှန်ချိန်တွင် ဘာမျှ မဖတ်ပါ။ စာရင်းကို ပြောင်းပြီး စာအုပ်ကို ပြန်ဖွင့်ပါ။\n\nဆက်တင်များ › စာဖတ်ခြင်း › စာဖတ် အထောက်အကူများ: စာသားသေး အရွယ် (သေး၊ အလယ်အလတ်၊ ကြီး)။ စာကြောင်းများသည် စာသားသေးအတွက် လိုအပ်သော နေရာကို အပေါ်တွင် ရသည်။ စာပိုဒ်တစ်ခုသည် ၎င်း၏ ပထမ စကားလုံး 60 ခန့်၏ စာသားသေးကို ပြသည်။ စာအုပ်ဖိုင်ကိုယ်တိုင်ကို မပြောင်းပါ။"
