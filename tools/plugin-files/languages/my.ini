mail.plugin.name = မေးလ်
mail.plugin.description = စကားဝှက် သို့မဟုတ် အက်ပ် စကားဝှက်ဖြင့် (IMAP နှင့် SMTP) အီးမေးလ် ဖတ်ခြင်း၊ ပို့ခြင်း၊ ဘရောက်ဇာ ဝင်ရောက်မှု မလို။
mail.plugin.how = "မေးလ်သည် IMAP နှင့် SMTP ဖြင့် အီးမေးလ် ဖတ်ပြီး ပို့သည်။ ဘရောက်ဇာ မလိုဘဲ လိပ်စာနှင့် စကားဝှက်ဖြင့် ဝင်သဖြင့် ထိုသို့ ခွင့်ပြုသော ဝန်ဆောင်မှုပေးသူတိုင်းနှင့် အလုပ်လုပ်သည်။\n\nဆက်တင်များ › မေးလ် တွင် အကောင့် သတ်မှတ်ပါ: ဝန်ဆောင်မှုပေးသူ ရွေးပြီး လိပ်စာနှင့် စကားဝှက် ရိုက်ပါ။ အများစုက အက်ပ် စကားဝှက် လိုသည်: သင့်အကောင့်၏ လုံခြုံရေး ဆက်တင်တွင် ပြုလုပ်ပြီး ဤနေရာတွင် သုံးပါ။ စကားဝှက်ကို ဝန်ဆောင်မှုပေးသူ၏ ဆာဗာသို့သာ ပို့ပြီး စကားဝှက်နှင့် ကီးများနှင့်အတူ သိမ်းထားသည်။\n\nကိရိယာများမှ မေးလ် ကို ဖွင့်ပါ။ “မေးလ် စစ်ရန်” က နောက်ဆုံးမေးလ်များနှင့် ဖိုင်တွဲများကို ယူသည်။ မေးလ်များကို ကတ်ပေါ်တွင် သိမ်းသဖြင့် ကွန်ရက်မရှိဘဲ ဖတ်နိုင်သည်။ Wi-Fi ကို ခဏသာ ဖွင့်သည်။\n\nစာရင်းတွင် မရှိလျှင် “ကိုယ်ပိုင် ဆာဗာများ” ကို ရွေးပြီး အဆင့်မြင့် ဆက်တင်တွင် ဆာဗာ၊ port နှင့် လုံခြုံရေးကို သတ်မှတ်ပါ။ အသိအမှတ်ပြုချက် မရှိသော ဆာဗာအတွက် ယုံကြည်မလားဟု တစ်ကြိမ် မေးမည်: fingerprint ကို ဝန်ဆောင်မှုပေးသူ ပြသည်နှင့် တိုက်ကြည့်ပါ။\n\nစာအုပ် (EPUB၊ PDF စသည်၊ 2 MB အထိ) ပါသော မေးလ်အောက်တွင် “စာအုပ် ဖွင့်ရန်” ရှိသည်: ဖိုင်ကို ယူ၍ စာကြည့်တိုက်ထဲ ထည့်ပြီး ဖွင့်သည်။\n\nဆက်တင်များ › မေးလ် တွင် “နောက်ခံတွင် မေးလ်အသစ် စစ်ရန်” ကို ဖွင့်ပြီး ကြိမ်နှုန်း (15၊ 30၊ 60 မိနစ်) ရွေးနိုင်သည်။ စက် နိုးပြီး အွန်လိုင်းဖြစ်စဉ် လုံခြုံသော ချိတ်ဆက်မှုဖြင့် စစ်ပြီး ပင်မရှိ မဖတ်ရသေး အရေအတွက်ကို အပ်ဒိတ်လုပ်သည်။ ဘက်ထရီ အနည်းငယ် ကုန်သည်။\n\nပင်မစာမျက်နှာ ဝိဂျက်များ: မဖတ်ရသေး အရေအတွက်၊ နောက်ဆုံးနှင့် ကြယ်ပွင့်ပါ မေးလ်များ၊ စာတိုက်ပုံး တစ်ခု၊ မေးလ်ရေးရန် ဖြတ်လမ်း။"
