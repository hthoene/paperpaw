translate.plugin.description = ရွေးထားသော စာသားကို DeepL ဖြင့် အွန်လိုင်း ဘာသာပြန်သည်။
translate.plugin.how = "ဘာသာပြန်ခြင်းသည် ရွေးထားသော စာသားကို DeepL ဖြင့် အွန်လိုင်း ဘာသာပြန်သည်။ စာအုပ်ထဲတွင် စာသားကို ရွေးပြီး ရွေးထားသော စာသား၏ မီနူးတွင် “ဘာသာပြန်ရန်” ကို ရွေးပါ: ဘာသာပြန်ချက်သည် အဘိဓာန် ဝင်ချက်ကဲ့သို့ စာမျက်နှာပေါ်တွင် ပေါ်လာသည်။ စာမျက်နှာ ခလုတ်များ သို့မဟုတ် တို့ခြင်းဖြင့် လှိမ့်ပြီး ရွေးရန် ခလုတ် သို့မဟုတ် အဆုံးကို တို့ခြင်းဖြင့် ပိတ်ပါ။\n\nကွန်ရက်နှင့် deepl.com တွင် အခမဲ့ရနိုင်သော ကိုယ်ပိုင် DeepL API ကီး (DeepL API Free၊ တစ်လလျှင် စာလုံး 500,000 ခန့်) လိုအပ်သည်။ မထည့်ရသေးမချင်း အကွက်က ထိုသို့ပြောပြီး တို့လျှင် တောင်းပါမည်။\n\nဆက်တင်များ၊ စာဖတ်ခြင်း၊ ဘာသာပြန်ခြင်း အပိုင်းရှိ “ဘာသာပြန်မည့် ဘာသာ” တွင် ဘာသာစကားကို သတ်မှတ်ပါ၊ မူလမှာ PaperPaw ၏ ဘာသာစကား ဖြစ်သည်။"
