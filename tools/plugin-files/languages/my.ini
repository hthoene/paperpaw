news.plugin.description = သတင်း ဖိဒ်များ (RSS၊ Atom) ကို ဖတ်ရန် စာအုပ်များအဖြစ် ယူပေးသည်။
news.plugin.how = "သတင်းသည် RSS သို့မဟုတ် Atom ဖိဒ်များကို စာအုပ်များအဖြစ် ပြောင်းသည်။ ဖိဒ်တစ်ခုစီသည် စာကြည့်တိုက်၏ News ဖိုင်တွဲတွင် စာအုပ်တစ်အုပ် ဖြစ်လာပြီး ၎င်း၏ နောက်ဆုံး ဆောင်းပါးများကို ရိုးရိုးစာသားအဖြစ် အခြားစာအုပ်ကဲ့သို့ ဖတ်နိုင်သည်။\n\nကိရိယာများ မီနူးမှ သတင်း ကို ဖွင့်ပြီး “ဖိဒ် ထည့်ရန်” ကို ရွေးပါ။ ၎င်း၏ လိပ်စာသည် သတင်းစာ သို့မဟုတ် ဘလော့ဂ်၏ ဝဘ်ဆိုက်တွင် ရှိသည်။ “သတင်း ယူရန်” က ဖိဒ် အားလုံးကို ယူပြီး ယခင်စာအုပ်များကို အစားထိုးသည်။ ဖိဒ်တစ်ခုတည်းကို ယူရန် သို့မဟုတ် ဖယ်ရှားရန် ၎င်းကို ဖိထားပါ (ခလုတ်ဖြင့်: “ရွေးရန်” ကို ဖိထားပါ)။ ဖယ်ရှားထားသော ဖိဒ်၏ စာအုပ်သည် စာကြည့်တိုက်တွင် ကျန်နေမည်။\n\nယူရန် ကွန်ရက် လိုအပ်သည်။ “ဖိဒ်တစ်ခုလျှင် ဆောင်းပါး” (ဆက်တင်များ › စာကြည့်တိုက်) က စာအုပ်တစ်အုပ်စီတွင် ဆောင်းပါး မည်မျှပါမည်ကို သတ်မှတ်သည်။ “သတင်းခေါင်းစီးများ” ဝိဂျက်က ၎င်းတို့ကို ပင်မစာမျက်နှာတွင် ပြသည်။"
