puzzles.plugin.name = ပဟေဠိများ
puzzles.plugin.description = Sudoku၊ စကားလုံးဆက်နှင့် စစ်တုရင် ပဟေဠိများ၊ အော့ဖ်လိုင်း၊ ယနေ့ပဟေဠိ ပါသည်။
puzzles.plugin.how = "ရထားပေါ်နှင့် စောင့်ဆိုင်းခန်းအတွက် ပဟေဠိများ၊ အားလုံး အော့ဖ်လိုင်း: Sudoku၊ စကားလုံးဆက်နှင့် စစ်တုရင်ပဟေဠိ။ ကိရိယာများ မီနူးမှ ဖွင့်ပါ၊ သို့မဟုတ် “ယနေ့ပဟေဠိ” ဝိဂျက်ကို ပင်မစာမျက်နှာသို့ ထည့်ပါ: ယနေ့ Sudoku ရောက်ရှိမှုကို ပြပြီး တို့လျှင် ဖွင့်သည်။\n\nSudoku: ဘယ်/ညာက ကာဆာကို တစ်ကွက်ချင်း၊ အပေါ်/အောက် (စာမျက်နှာခလုတ်) က တစ်တန်းချင်း ရွှေ့သည်။ ရွေးရန်က ဂဏန်းများ ဖွင့်သည်: တစ်ခုရွေးပြီး ထည့်ပါ၊ သို့မဟုတ် “ရှင်းရန်” ဖြင့် ကွက်ကို ဗလာလုပ်ပါ။ ရွေးရန် (သို့မဟုတ် မီနူး) ကို ဖိထားလျှင် ခလုတ်များ: မှတ်စု (ခဲတံမှတ်)၊ စစ်ရန်၊ နောက်ပြန်၊ အသစ် (လွယ်၊ အလယ်အလတ်၊ ခက်)။ ပဟေဠိတိုင်းတွင် အဖြေ တစ်ခုတည်းသာ ရှိသည်။ ကစားပွဲကို သိမ်းထားသည်။ ထိတွေ့မျက်နှာပြင်တွင် ကွက်ကို တို့ပါ။\n\nစကားလုံးဆက်: .puz (Across Lite) သို့မဟုတ် .ipuz ဖိုင်များကို မမ်မိုရီကတ်ရှိ \"puzzles\" ဖိုင်တွဲထဲ ထည့်ပါ (မပါဝင်ပါ)။ ကွက်ကို ရွေးပြီး ကီးဘုတ်ဖြင့် စကားလုံး ရိုက်ပါ (_ က ကွက်ကို ဗလာထားသည်)။ ခလုတ်များ: အလျားလိုက်/ဒေါင်လိုက်၊ အရိပ်အမြွက်စာရင်း၊ စစ်ရန်၊ ဖော်ပြရန်။ စာလုံးများကို ဖိုင်တစ်ခုစီအတွက် သိမ်းသည်။ Scrambled .puz ဖိုင်များကို မဖွင့်နိုင်ပါ။\n\nစစ်တုရင်: Lichess ပဟေဠိ ဒေတာဘေ့စ် (CC0) မှ အစုငယ်။ ဘယ်/ညာဖြင့် အရုပ်ရွေးပြီး ရွေးရန်၊ ထို့နောက် သွားမည့်ကွက်ရွေးပြီး ထပ်ရွေးပါ။ မှားသောရွှေ့ကွက်ကို ပြန်ရုပ်သည်။ “အရိပ်အမြွက်” က ရွှေ့ရမည့်အရုပ်ကို မှတ်ပြသည်။\n\nစာရင်းအင်းက ဖြေရှင်းပြီး ပဟေဠိများကို ရေတွက်သည်။"
