transfer.plugin.description = ကွန်ရက်တူရှိ ဘရောက်ဇာမှ စာအုပ်များနှင့် အခြားဖိုင်များကို စက်ပေါ်သို့ ထည့်သည်။
transfer.plugin.how = "Wi-Fi လွှဲပြောင်းခြင်းသည် ကွန်ရက်တူရှိ ဘရောက်ဇာမှ စာအုပ်များနှင့် အခြားဖိုင်များကို ကြိုး သို့မဟုတ် အက်ပ် မလိုဘဲ စက်ပေါ်သို့ ထည့်သည်။ ဖိုင်များ ယူခြင်း၊ ဖိုင်တွဲ ပြုလုပ်ခြင်းနှင့် ဖျက်ခြင်းလည်း လုပ်နိုင်သည်။\n\nကိရိယာများမှ ဖွင့်ပါ။ မျက်နှာပြင်တွင် လိပ်စာကို စာသားနှင့် QR ကုဒ်အဖြစ် ပြသည်: ဖုန်း သို့မဟုတ် ကွန်ပျူတာရှိ ဘရောက်ဇာတွင် ဖွင့်ပါ သို့မဟုတ် ကုဒ်ကို စကင်ဖတ်ပါ။ လိပ်စာတွင် အကြိမ်တိုင်း အသစ်ပြုလုပ်သော ကီး ပါသဖြင့် ကွန်ရက်ရှိ အခြားသူများ သင့်ဖိုင်များကို မရယူနိုင်ပါ။ မျက်နှာပြင် ဖွင့်ထားသရွေ့ လွှဲပြောင်းခြင်း လည်ပတ်သည်။\n\nX4 ကဲ့သို့ PaperPaw က Wi-Fi ကို ကိုယ်တိုင် စီမံသည့်နေရာတွင် အောက်ခြေရှိ “Router မပါဘဲ” သည် စက်၏ ကိုယ်ပိုင် ကွန်ရက်ကို ဖွင့်ပြီး ဖုန်းက ကုဒ်ကို စကင်ဖတ်၍ ချိတ်နိုင်သည်။"
