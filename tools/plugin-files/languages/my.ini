fonts-browser.plugin.name = နောက်ထပ် ဖောင့်များ
fonts-browser.plugin.description = အင်တာနက်မှ ဖောင့်များကို နမူနာနှင့်အတူ ပြပြီး ဖတ်ရန် ဒေါင်းလုဒ်လုပ်ပေးသည်။
fonts-browser.plugin.how = "နောက်ထပ် ဖောင့်များသည် အင်တာနက်ရှိ ဖောင့်စာကြည့်တိုက်မှ ဖောင့်များကို ၎င်းတို့၏ ဖောင့်ဖြင့်ပင် စာရင်းပြပြီး ရွေးသည်ကို ဒေါင်းလုဒ်လုပ်ပေးသည်။\n\nဆက်တင်များ › စာဖတ်ခြင်း › ဖောင့် ရှိ ဖောင့်စာရင်း၏ အဆုံးတွင် ရှိသည်။ အခြေအနေဘား ဖောင့်တွင်လည်း ရှိသည်။ ဖောင့်ကို တို့ပါ (ခလုတ်ဖြင့်: “ရွေးရန်”)၊ နမူနာကြည့်ပြီး ဒေါင်းလုဒ်ကို ရွေးပါ။ ဒေါင်းလုဒ်နေစဉ် စာမျက်နှာမှ ထွက်နိုင်သည်။ ပြီးလျှင် (ဖောင့်အမည်) ဖြင့် ဖတ်ရန် သို့မဟုတ် အခြေအနေဘားများအတွက် သုံးရန် ကို ရွေးပါ။ Wi-Fi လိုအပ်သည်။\n\nကိုယ်ပိုင် ဖောင့်များ\n\nကိုယ်ပိုင်ဖောင့်မှာ .ttf သို့မဟုတ် .otf ဖိုင် ဖြစ်သည်။ Android တွင်: ဖိုင်ကို PaperPaw/fonts ထဲ ကူးပြီး PaperPaw ကို ပြန်စကာ ဖောင့် ဆက်တင်တွင် ရွေးပါ။\n\nXteink X4 နှင့် X4 Pro တွင် ဖောင့်ဖိုင် မဆံ့သဖြင့် ဖောင့်ပက်ခ် လိုသည်။ ကွန်ပျူတာပေါ်တွင် paperpaw-fontgen ဖြင့် ပြုလုပ်ပါ (regular မဖြစ်မနေ လိုသည်):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nရလာသော plugins/font-my-font ဖိုင်တွဲကို မမ်မိုရီကတ်ရှိ plugins ဖိုင်တွဲထဲ ကူးပြီး ပြန်စကာ My Font ကို ရွေးပါ။ --chars latin,cyrillic,greek ဖြင့် စာလုံးစနစ်များ ထည့်နိုင်သည်။ သင့်စာအုပ်၏ စာလုံးများ မပါသော ဖောင့်က ၎င်းတို့ကို မပြနိုင်ပါ။ e-ink ပေါ်တွင် စာလုံးသေးများ ပိုပြတ်သားစေရန် --hinting light ထည့်ပါ (normal နှင့် mono က ပိုပြင်းသည်)။ မြန်မာ၊ အာရဗီ စသည့် အမှတ်အသားပါ စာလုံးများအတွက် မထည့်ပါနှင့်။"
