update.plugin.name = အပ်ဒိတ်
update.plugin.description = ဖမ်းဝဲ အပ်ဒိတ်များကို ကတ်မှ သို့မဟုတ် အင်တာနက်မှ ဒေါင်းလုဒ်လုပ်၍ ထည့်သွင်းသည်။
update.plugin.how = "အပ်ဒိတ်သည် X4 ကဲ့သို့ PaperPaw က ဖမ်းဝဲ ဖြစ်သော စက်များတွင် ဖမ်းဝဲ အသစ်ကို ထည့်သွင်းသည်။ ဆက်တင်များတွင် “အပ်ဒိတ်” အဖြစ် ရှိသည်။\n\n“အွန်လိုင်းတွင် ရှာရန်” သည် အပ်ဒိတ်ဆာဗာထံ PaperPaw အသစ်ကို မေးပြီး ဒေါင်းလုဒ်လုပ်သည် (Wi-Fi ဖြင့် မိနစ်အနည်းငယ်)။ သို့မဟုတ် အပ်ဒိတ်ဖိုင် (.bin ဖြင့်ဆုံးသည်၊ paperpaw.org မှ) ကို ကတ်ပေါ်ရှိ updates ဖိုင်တွဲထဲသို့ ကူးပါ။ ထည့်သွင်းခြင်းသည် တစ်မိနစ်ခန့် ကြာပြီး စက် ပြန်စသည်၊ စာအုပ်များ၊ ဆက်တင်များနှင့် ဖတ်လက်စနေရာများ ကျန်ရှိသည်။\n\n“အပ်ဒိတ်များ ရှာရန်” ဖွင့်ထားလျှင် (မူလ ပိတ်) Wi-Fi ဖွင့်ထားစဉ် သို့မဟုတ် အားသွင်းနေစဉ် တစ်ပတ်လျှင် တစ်ကြိမ်ခန့် ကိုယ်တိုင် မေးသည်။ တွေ့သော ဗားရှင်းအသစ်သည် ဤနေရာတွင် စောင့်နေပြီး စာဖတ်ခြင်းကို မနှောင့်ယှက်ပါ။ ရှာဖွေမှုသည် စက်တွင် လည်ပတ်နေသည်ကိုသာ ပို့ပြီး အမည် သို့မဟုတ် နံပါတ် မပို့ပါ။\n\nသင်သုံးသော ပလပ်အင်များအတွက် ဗားရှင်းအသစ် မရှိသေးလျှင် အပ်ဒိတ်က စောင့်သည်။ ဗားရှင်းဟောင်းကို သင်ရွေးမှသာ ထည့်သွင်းသည်။\n\nCrossPoint ကဲ့သို့ အခြားဖမ်းဝဲ ကိုလည်း ၎င်း၏ .bin ဖိုင်ကို updates ထဲထည့်ပြီး အပ်ဒိတ်ကို ဖွင့်၍ ထည့်သွင်းနိုင်သည်။ PaperPaw က ဤစက်အတွက် ပြည့်စုံ၍ မပျက်သော ဖမ်းဝဲ ဖြစ်ကြောင်း စစ်ဆေးသော်လည်း လက်မှတ် မထိုးထားသဖြင့် ပြုလုပ်သူကို မသိနိုင်ပါ။ “မည်သို့ပင်ဖြစ်စေ ထည့်သွင်းရန်” သည် flash ၏ အခြားတစ်ဝက်တွင် ရေးပြီး စတင်သည်၊ PaperPaw သည် ၎င်း၏ တစ်ဝက်တွင် ကျန်ရှိသည်။ PaperPaw သို့ ပြန်ရန် အခြားဖမ်းဝဲ ၏ မီနူးမှ (paperpaw-<device>-<version>-install.bin) ကို ထည့်သွင်းပါ။"
