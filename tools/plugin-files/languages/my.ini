lock.plugin.name = မျက်နှာပြင် လော့ခ်
lock.plugin.description = စက်နိုးလာချိန်တွင် PIN၊ ပုံစံ သို့မဟုတ် စကားဝှက်၊ စာဖတ်စဉ် ထိတွေ့မှု လော့ခ်။
lock.plugin.how = "မျက်နှာပြင် လော့ခ်သည် PaperPaw စတင်ချိန်နှင့် စက်နိုးလာချိန်တွင် PIN၊ ပုံစံ သို့မဟုတ် စကားဝှက် တောင်းသည်။ မူလအားဖြင့် ပိတ်ထားသည်။ ပေါ့ပေါ့ဆဆ သုံးခြင်းကိုသာ တားသည်: ကုဒ်နှင့် အမှားအကြိမ်ရေကို မမ်မိုရီကတ်ပေါ်တွင် သိမ်းသဖြင့် ကတ်ကို ထုတ်၊ ပြင် သို့မဟုတ် လဲသူသည် လော့ခ်ကို ကျော်နိုင်သည်။\n\nဆက်တင်များ › စက် › မျက်နှာပြင် လော့ခ် တွင် သတ်မှတ်ပါ: လက်ရှိကုဒ် ရှိလျှင် ထည့်ပါ၊ အမျိုးအစား ရွေးပါ၊ ထို့နောက် ကုဒ်အသစ်ကို နှစ်ကြိမ် ထည့်ပါ။ ပုံစံကို ထိတွေ့မျက်နှာပြင်တွင်သာ ရသည်။\n\nငါးကြိမ် မှားပြီးနောက် နောက်တစ်ကြိမ်သည် စက္ကန့် 30 စောင့်ရသည်။ “ယခု လော့ခ်ချရန်” သည် ချက်ချင်း လော့ခ်ချပြီး ခလုတ်၊ လက်ဟန် သို့မဟုတ် စည်းမျဉ်းတွင် ထားနိုင်သည်။ “နိုးပြီးနောက် လော့ခ်ချရန်” ကို ပိတ်လျှင် တကယ့်စတင်ခြင်း (ဖွင့်ခြင်း သို့မဟုတ် ပြန်စခြင်း) တွင်သာ လော့ခ်ချသည် (ဘက်ထရီသုံး X4 ကဲ့သို့ နိုးတိုင်း စတင်ခြင်းဖြစ်သော စက်မှလွဲ၍)။\n\nထိတွေ့မှု လော့ခ်: အမြန် ပန်နယ်နှင့် စာဖတ် မီနူးရှိ “ထိတွေ့မှု လော့ခ်ချရန်” က ခလုတ်များ ဆက်အလုပ်လုပ်စဉ် တို့ခြင်း၊ ပွတ်ဆွဲခြင်းနှင့် ဘောပင်ကို ဘာမျှ မလုပ်စေပါ (ဥပမာ မျက်နှာပြင်ပေါ် လက်တင်၍ ဖတ်ရန်)။ ဖွင့်ရန် လက်တစ်ချောင်းဖြင့် နှစ်ချက်တို့ပြီး ခဏ ဖိထားပါ။ ပါဝါခလုတ်ကို ဖိထားလျှင် ပါဝါ မီနူး ပွင့်ပြီး “ထိတွေ့မှု လော့ခ်ဖွင့်ရန်” ဖြင့် ဖွင့်နိုင်သည်။ X4 Pro တွင် ပင်မကီးကို ဖိထားလျှင် ချက်ချင်း ပွင့်သည်။"
