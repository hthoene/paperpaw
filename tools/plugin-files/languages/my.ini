file-manager.plugin.description = စက်ပေါ်ရှိ ဖိုင်တွဲနှင့် ဖိုင်တိုင်း: ဖွင့်ခြင်း၊ အမည်ပြောင်းခြင်း၊ ရွှေ့ခြင်း၊ ကူးခြင်းနှင့် ဖျက်ခြင်း။
file-manager.plugin.how = "ဖိုင် စီမံသူသည် စာအုပ်များသာမက စက်၏ သိုလှောင်မှုရှိ ဖိုင်တွဲနှင့် ဖိုင်တိုင်းကို ပြပြီး ဖွင့်ခြင်း၊ အမည်ပြောင်းခြင်း၊ ရွှေ့ခြင်း၊ ကူးခြင်း၊ ဖျက်ခြင်းနှင့် ဖိုင်တွဲအသစ် ပြုလုပ်ခြင်း လုပ်နိုင်သည်။\n\nကိရိယာများ မီနူးမှ ဖိုင်များ ကို ဖွင့်ပါ။ ဖိုင်တွဲထဲ ဝင်ရန် ၎င်းကို တို့ပါ၊ နောက်သို့ က အပေါ်ဖိုင်တွဲသို့ သွားသည်။ လုပ်နိုင်သည်များကို ကြည့်ရန် ဖိုင်ကို တို့ပါ သို့မဟုတ် မည်သည့်အရာကိုမဆို ဖိထားပါ (ခလုတ်များဖြင့် ရွေးရန် ကို ဖိထားပါ)။ ရွှေ့ရန် နှင့် ကူးရန် က အရာကို ယူသည်: ထားလိုသော ဖိုင်တွဲသို့ သွားပြီး အောက်ခြေဘားရှိ ဤနေရာတွင် ထည့်ရန် ကို ရွေးပါ။ ခလုတ်များဖြင့် ဘားသို့ ရောက်ရန် နောက်ဆုံးအရာမှ အောက် ကို နှိပ်ပါ။\n\nPaperPaw ၏ ကိုယ်ပိုင်ဒေတာကဲ့သို့ အစက်ဖြင့် စသော ဖိုင်နှင့် ဖိုင်တွဲများကို ဖျောက်ထားသည်။ ၎င်းတို့ကို ကြည့်ရန် ဆက်တင်များ › စာကြည့်တိုက် တွင် ဖျောက်ထားသော ဖိုင်များ ကို ဖွင့်ပါ။"
