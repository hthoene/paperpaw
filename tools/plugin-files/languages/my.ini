pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = အလုပ်နှင့် အနားယူချိန် အလှည့်များ၊ ဝိဂျက်များနှင့် နေ့စဉ်အရေအတွက် ပါသော အာရုံစိုက် တိုင်မာ။
pomodoro.plugin.how = "Pomodoro တိုင်မာ: အာရုံစိုက်အလှည့်များဖြင့် အလုပ်လုပ်ပြီး အနားယူပါ။ ပြင်ဆင်ရန် မလိုပါ: အာရုံစိုက် 25 မိနစ်၊ အနားယူ 5 မိနစ်၊ လေးကြိမ်ပြီးနောက် 15 မိနစ် ရှည်လျားသော အနားယူချိန်။\n\nကိရိယာများ မီနူးမှ Pomodoro ကို ဖွင့်ပြီး “စတင်ရန်” ကို နှိပ်ပါ၊ သို့မဟုတ် ၎င်း၏ ဝိဂျက်များကို ပင်မစာမျက်နှာသို့ ထည့်ပါ (ပင်မစာမျက်နှာကို ဖိထားပြီး ဝိဂျက် ထည့်ပါ): “Pomodoro တိုင်မာ” က အဆင့်နှင့် ကျန်မိနစ်ကို ပြသည်၊ “Pomodoro စတင်/ခဏရပ်” သည် ခလုတ်ဖြစ်ပြီး “ယနေ့ Pomodoro” က ပြီးစီးသော အလှည့်များကို နေ့စဉ်ပန်းတိုင်နှင့်အတူ ရေတွက်သည်။ တိုင်မာကို တို့လျှင် စတင် သို့မဟုတ် ခဏရပ်ပြီး ဖိထားလျှင် မျက်နှာပြင်အပြည့် ဖွင့်သည်။\n\nမျက်နှာပြင်မှ ထွက်သွားလည်း တိုင်မာ ဆက်လည်ပြီး ပြန်စပြီးနောက်လည်း နာရီအတိုင်း ဆက်သွားသည်။ စာဖတ်စက် အိပ်နေစဉ် ဘာမျှ မလည်ပါ: ထိုအတောအတွင်း ပြီးသွားသော အဆင့်ကို နိုးသည့်အခါ ပြောပြသည်။ အဆင့်တစ်ခု ပြီးလျှင် အသိပေးချက် ပေါ်သည်။ ဘက်ထရီ ချွေတာရန် နာရီကို တစ်မိနစ်လျှင် တစ်ကြိမ် (မျက်နှာပြင်အပြည့်တွင် နောက်ဆုံးမိနစ်၌ 10 စက္ကန့်တစ်ကြိမ်) အပ်ဒိတ်လုပ်ပြီး စာဖတ်စက်ကို ဘယ်တော့မှ နိုးမထားပါ။\n\nဆက်တင်များရှိ Pomodoro အောက်တွင် ကြာချိန်များ၊ တစ်စုရှိ အလှည့်အရေအတွက်နှင့် နောက်အဆင့် အလိုအလျောက် စမစ သတ်မှတ်နိုင်သည်။ “နောက်ထပ်” အောက်တွင်: အဆင့်ပြီးလျှင် မျက်နှာပြင် လက်ခြင်း သို့မဟုတ် ရှေ့မီး မှိတ်တုတ်ခြင်းနှင့် နေ့စဉ်ပန်းတိုင်။"
