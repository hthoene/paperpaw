reader.plugin.name = စာဖတ်စနစ်
reader.plugin.description = စာအုပ်များကို စာမျက်နှာအလိုက် မာတိကာနှင့် စာဖတ်ဆက်တင်များဖြင့် ပြသည်။
reader.plugin.how = "စာဖတ်စနစ်သည် စာအုပ်များကို စာမျက်နှာအလိုက် ပြသည်။ စာကြည့်တိုက်မှ စာအုပ်ကို ဖွင့်ပါ။ “စတင်ချိန်တွင် နောက်ဆုံးစာအုပ် ဖွင့်ရန်” ဖြင့် နောက်ဆုံးစာအုပ်ကို စတင်စဉ် ပြန်ဖွင့်နိုင်သည်။\n\nစာမျက်နှာလှန်ရန် မျက်နှာပြင် ဘယ် သို့မဟုတ် ညာကို တို့ပါ၊ သို့မဟုတ် စာမျက်နှာခလုတ်များ သုံးပါ။ အလယ်ကို တို့ သို့မဟုတ် ရွေးရန်ကို နှိပ်လျှင် စာဖတ်မီနူး: မာတိကာ၊ ရှာဖွေရန်၊ စာမျက်နှာသို့ သွားရန်၊ ဖောင့်နှင့် အပြင်အဆင်၊ စာညှပ်နှင့် အသားပေးချက်များ စသည်။ အပေါ်အနားမှ အောက်သို့ဆွဲလျှင် အမြန် ပန်နယ်၊ အောက်အနားမှ အပေါ်သို့ဆွဲ သို့မဟုတ် “နောက်သို့” ကို ဖိထားလျှင် ပင်မ။\n\nရွေးရန် (သို့မဟုတ် ပုံ) ကို ဖိထားလျှင် ပုံကို မျက်နှာပြင်အပြည့် ပြသည်: ဘယ်/ညာက စာမျက်နှာရှိ ပုံများကို ကူးသည်။ ရွေးရန်က 2x၊ 3x ချဲ့ပြီး ပြန်ချုံ့သည် (ထိတွေ့တွင် နှစ်ချက်တို့)။ ချဲ့ထားစဉ် ဘယ်/ညာက ဘေးတိုက်၊ စာမျက်နှာခလုတ် (သို့မဟုတ် ပွတ်ဆွဲ) က ဆက်ရွှေ့သည်။ “နောက်သို့” က အံကိုက်သို့၊ ထို့နောက် စာမျက်နှာသို့ ပြန်သွားသည်။ စာညှပ်အတွက် ညာဘက်အပေါ်ထောင့်ကို တို့ပါ။ အသားပေးရန် စကားလုံးကို ဖိထားပါ။ ခလုတ်ဖြင့် ဘယ်ကို ဖိထားပါ: ဘယ်/ညာက စကားလုံးအလိုက်၊ စာမျက်နှာခလုတ်က စာကြောင်းအလိုက် (ဖိထားလျှင် စာမျက်နှာအဆုံးနှင့် စာပိုဒ်အလိုက်) ရွှေ့သည်။ ရွေးရန်က အသားပေးဘားကို ဖွင့်ပြီး ဖိထားလျှင် ဝါကျနှင့် စာပိုဒ်အထိ ချဲ့သည်။ ရွေးချယ်မှုသည် စာမျက်နှာလှန်လည်း ဆက်ရှိသည်။ “Markdown အဖြစ် ထုတ်ယူရန်” က မှတ်စုများကို သိမ်းသည်။"
