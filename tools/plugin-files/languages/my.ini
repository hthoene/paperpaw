calibre.plugin.how = "ကြိုးမဲ့ စာကြည့်တိုက်က စက်ကို ကွန်ပျူတာပေါ်ရှိ Calibre တွင် ကြိုးမဲ့စက်အဖြစ် ပေါ်စေသည်။ ထို့နောက် Calibre က စာအုပ်များ ပို့ခြင်း၊ စာရင်းပြခြင်းနှင့် ဖျက်ခြင်း လုပ်နိုင်သည်။ စာအုပ်များ စာကြည့်တိုက်ထဲသို့ ရောက်သည်။\n\nစက်နှင့် ကွန်ပျူတာ Wi-Fi ကွန်ရက်တစ်ခုတည်းတွင် ရှိစဉ် ကိရိယာများ မီနူးမှ ကြိုးမဲ့ စာကြည့်တိုက် ကို ဖွင့်ပါ။ Calibre တွင် Connect/share › Start wireless device connection ကို ရွေးပါ။ စက်က ကွန်ပျူတာကို တွေ့သည့်အခါ ၎င်း၏အမည်ကို ပြသည်၊ ချိတ်ဆက်ရန် ကို တို့ပါ (ခလုတ်များဖြင့် ရွေးရန် ကို နှိပ်ပါ)။ Calibre က ဤနေရာတွင် စာအုပ်များ ထည့်ခြင်း၊ ဖျက်ခြင်း လုပ်နိုင်သဖြင့် သင့်ကွန်ပျူတာနှင့်သာ ချိတ်ဆက်ပါ။ မျက်နှာပြင်ကို ပိတ်ပါက ချိတ်ဆက်မှု ပြီးဆုံးသည်။\n\nCalibre ကို အလိုအလျောက် မတွေ့ပါက ဆက်တင်များ › စာကြည့်တိုက် ၏ Calibre အပိုင်းတွင် လိပ်စာ အဖြစ် ၎င်း၏ကွန်ပျူတာလိပ်စာကို ထည့်ပါ။ Calibre က 9090 မဟုတ်သော port ကို သုံးပါက :port အဖြစ် ထည့်ပါ၊ ဥပမာ 192.168.1.20:9091။"
