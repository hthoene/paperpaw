picture-home.plugin.description = ဝိဂျက်များနောက်တွင် ကိုယ်ပိုင်ပုံ ပါပြီး သင်စိတ်ကြိုက်ပြင်နိုင်သော အခြေအနေဘား ပါသည့် ပင်မစာမျက်နှာ။
picture-home.plugin.how = "ပုံပါ ပင်မစာမျက်နှာကို ဖွင့်ထားစဉ် ပင်မစာမျက်နှာကို အစားထိုးသည်: ဝိဂျက်များနောက်တွင် ကိုယ်ပိုင်ပုံ၊ သင်စီစဉ်သော ဝိဂျက်နှင့် ကိရိယာ စာမျက်နှာများ။ ပလပ်အင်မန်နေဂျာတွင် ပိတ်လျှင် မူလ ပင်မစာမျက်နှာ ပြန်ပေါ်သည်။\n\nပုံများ (JPEG၊ PNG၊ GIF) ကို ကတ်ပေါ်ရှိ ဖိုင်တွဲ (မူလ wallpapers) ထဲ ထည့်ပြီး ဆက်တင်များ၊ စိတ်ကြိုက်ပြင်ရန်၊ ပုံပါ ပင်မစာမျက်နှာ တွင် ရွေးပါ။ အံကိုက် (ပြည့်၊ ပုံအပြည့်၊ ဆွဲဆန့်၊ မူလအရွယ်၊ အကွက်ခင်း)၊ နေရာ၊ ဇူးမ်နှင့် ပုံကို ဖျော့ရန် ဖြင့် ချိန်ညှိပါ။ ဖျော့သောပုံက ဝိဂျက်များကို ဖတ်ရလွယ်စေသည်။ ပုံကို မျက်နှာပြင်အရွယ်တစ်ခုစီအတွက် တစ်ကြိမ် ပြင်ဆင်ရသဖြင့် ခဏကြာသည်။\n\nဝိဂျက်များသည် ပုံပေါ်ရှိ နောက်ခံပြားများပေါ်တွင် ရှိသည်။ စာမျက်နှာကို စာမျက်နှာအောက်ရှိ ခဲတံ သို့မဟုတ် မီနူးရှိ “ပင်မစာမျက်နှာ ပြင်ရန်” ဖြင့် စီစဉ်ပါ။\n\nအခြေအနေဘား (အချိန်၊ Wi-Fi၊ ဘက်ထရီ စသည်) ကို ဖွင့်၊ ပိတ် သို့မဟုတ် အလိုအလျောက်၊ အပေါ် သို့မဟုတ် အောက်၊ အကျယ်အပြည့် သို့မဟုတ် ဆေးတောင့်ပုံ အသေး၊ အဖျော့၊ အရင့်၊ မီးခိုး နောက်ခံ သို့မဟုတ် ပုံပေါ်တွင် ထားနိုင်သည်။ ခလုတ်အမည်တန်း (X4) လည်း ထိုနည်းတူ။ အလိုအလျောက်: ခလုတ်နှိပ်လျှင် စက္ကန့်အနည်းငယ် ပြပြီး ထိုနှိပ်ခြင်းက အခြားဘာမျှ မလုပ်ပါ။\n\nပုံဆွဲပုံ: မီးခိုးအဆင့်များ (X4 တွင် ပိုနှေး)၊ အစက်ချ (အဖြူအမည်း အစက်၊ မြန်) သို့မဟုတ် အလိုအလျောက် (ဆွဲစဉ် မီးခိုးအဆင့်၊ ပထမပြောင်းလဲမှုနောက် အစက်)။ မီးခိုးအဆင့် မရှိသော မျက်နှာပြင်တွင် အစက်ကို သုံးသည်။"
