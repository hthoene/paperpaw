stats.plugin.name = စာဖတ်မှု စာရင်းအင်း
stats.plugin.description = သင် မည်မျှကြာကြာ၊ မည်မျှ ဖတ်သည်ကို ပြက္ခဒိန်နှင့် စာအုပ်တိုင်း၏ ကိန်းဂဏန်းများဖြင့် မှတ်တမ်းတင်သည်။
stats.plugin.how = "စာဖတ်မှု စာရင်းအင်းသည် စာမျက်နှာတစ်ခုစီကို မည်မျှကြာကြာ ဖတ်သည်ကို မှတ်တမ်းတင်သည်။ ယနေ့၊ ဤအပတ်နှင့် ဆက်တိုက်ဖတ်ရက်ပါသော အကျဉ်းချုပ်၊ ပြက္ခဒိန်နှင့် စာအုပ်တိုင်း၏ ကိန်းဂဏန်းများအဖြစ် ကြည့်နိုင်သည်။\n\nကိရိယာများ သို့မဟုတ် စာဖတ်စဉ် “နောက်ထပ်” မှ ဖွင့်ပါ။ ဆက်တင်များ၊ စာဖတ်မှု စာရင်းအင်းတွင် “စာဖတ်မှု မှတ်တမ်းတင်ရန်” ကို ပိတ်နိုင်ပြီး “နေ့စဉ် ပန်းတိုင်” နှင့် ရေတွက်မည့် “အတိုဆုံး စာမျက်နှာ”၊ “အရှည်ဆုံး စာမျက်နှာ” ကို သတ်မှတ်နိုင်သဖြင့် လှန်ကြည့်ခြင်း သို့မဟုတ် ဖွင့်ထားခဲ့သော စာအုပ်က ကိန်းဂဏန်းများကို မပျက်စေပါ။\n\n“KOReader နှင့် စင့်ခ်လုပ်ရန်” သည် WebDAV ဖိုင်တွဲမှတစ်ဆင့် KOReader နှင့် စာရင်းအင်းကို မျှဝေသည်။ စက်တစ်ခုတည်းရှိ KOReader ၏ စာရင်းအင်းကိုလည်း ယူသည်။ မှတ်တမ်းတင်ရန် နာရီ သတ်မှတ်ထားရမည်၊ မသတ်မှတ်ရသေးလျှင် Wi-Fi သို့ တစ်ကြိမ် ချိတ်ပါ။"
