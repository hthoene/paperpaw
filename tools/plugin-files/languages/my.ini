battery.plugin.how = "ဘက်ထရီ သုံးစွဲမှုသည် စက်နိုးနေစဉ် မိနစ်တိုင်းခန့် ဘက်ထရီအားကို စက်လုပ်ခဲ့သည့်အရာများ (မျက်နှာပြင် ပြန်လည်ဆန်းသစ်မှုနှင့် လှန်ခဲ့သော စာမျက်နှာများ) နှင့်အတူ မှတ်သည်။ ထိုမှ တစ်နာရီ နိုးနေခြင်းနှင့် စာမျက်နှာ 100 အတွက် မည်မျှ ကုန်သည်နှင့် ထိုနှုန်းဖြင့် ဘက်ထရီ မည်မျှ ခံမည်ကို တွက်ချက်သည်။\n\nကိရိယာများ မီနူးမှ ဘက်ထရီ ကို ဖွင့်ပါ။ ယခု ဘက်ထရီအား၊ ယခု နိုးနေချိန်၊ ယခုအထိ ဘက်ထရီသုံးစွဲမှုနှင့် မကြာသေးမီ နိုးနေချိန်များကို ပြသည်။ စာမျက်နှာခလုတ်များ သို့မဟုတ် ထိပ်ရှိ မြှားများကို တို့၍ လှန်နိုင်သည်။\n\nကိန်းဂဏန်းများ အဓိပ္ပာယ်ရှိရန် ဘက်ထရီဖြင့် အချိန်အတန်ကြာ ဖတ်ရန် လိုသည်။ မှတ်တမ်းတင်ခြင်းကို မူလက ဖွင့်ထားပြီး ဆက်တင်များ › စက် › ပါဝါ တွင် ဘက်ထရီ သုံးစွဲမှု မှတ်တမ်းတင်ရန် ဖြင့် ပိတ်နိုင်သည်။"
