keys.plugin.description = ခလုတ်၊ တို့ရန်နေရာနှင့် ပွတ်ဆွဲမှုတိုင်း ဘာလုပ်သည်ကို စက်ပေါ်တွင် ပြောင်းရန်။
keys.plugin.how = "ခလုတ်နှင့် လက်ဟန်များသည် ခလုတ်၊ တို့ရန်နေရာနှင့် ပွတ်ဆွဲမှုတိုင်း ဘာလုပ်သည်ကို ပြပြီး စက်ပေါ်တွင် ပြောင်းခွင့်ပေးသည်။\n\nဆက်တင်များ › စက် တွင် ဖွင့်ပါ။ ပထမဦးစွာ ပြောင်းလဲမှု သက်ရောက်မည့်နေရာကို ရွေးပါ: နေရာတိုင်း၊ စာဖတ်စဉ်၊ ပင်မစာမျက်နှာတွင်၊ စာကြည့်တိုက်တွင် သို့မဟုတ် ကိရိယာတစ်ခုတွင်။ ထို့နောက် ဖိထားသော ခလုတ် သို့မဟုတ် အစွန်းမှ ပွတ်ဆွဲခြင်းကဲ့သို့ input တစ်ခုကို ရွေးပြီး ရှာဖွေနိုင်သော စာရင်းမှ လုပ်ဆောင်ချက်တစ်ခုကို ရွေးပါ။ “စံအတိုင်း” က ပလပ်အင်များနှင့် ခလုတ် အပြင်အဆင် သတ်မှတ်ထားသည့်အတိုင်း ပြန်ဖြစ်စေသည်။\n\nX4 တွင် ရွေးရန်၊ နောက်သို့ပြန်ရန် သို့မဟုတ် ရှေ့ဆက်ရန် ခလုတ် မကျန်တော့မည့် ပြောင်းလဲမှုကို လက်မခံပါ။ အဆုံးရှိ “ခလုတ်နှင့် လက်ဟန်များ ပြန်စရန်” က ပြောင်းလဲမှုအားလုံးကို ပြန်ရုပ်သိမ်းသည်။"
