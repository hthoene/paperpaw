vocabulary.plugin.description = သင်ရှာသော စကားလုံးများကို ဝါကျနှင့်တကွ သိမ်းထားပြီး ဖုန်းဖြင့်ပြုလုပ်ထားသော ကျက်မှတ်ကတ်များကို spaced repetition ဖြင့် ပြန်လေ့ကျင့်ပေးသည်။
vocabulary.plugin.how = "ဝေါဟာရသည် စာဖတ်စဉ် သင်ရှာသော စကားလုံးများကို ဝါကျနှင့်တကွ သိမ်းထားသည်။ စာရင်းသည် ကိရိယာများ တွင် ရှိသည် (အသစ်ဆုံး အပေါ်ဆုံး)၊ စကားလုံးကို ရွေးလျှင် ပြန်ရှာပေးသည်။ နောက်ဆုံးအတန်း ထုတ်ယူရန် က Anki ကဲ့သို့ အက်ပ်များအတွက် သိမ်းပေးသည်။ အသစ်ဆုံး 2,000 လုံးသာ ထားသည်။\n\nကျက်မှတ်ကတ်များ (ကိရိယာများ တွင်) သည် spaced repetition ဖြင့် မေးသည်: “အဖြေ ပြရန်” ပြီးနောက် ထပ်မံ၊ ခက်၊ ကောင်း သို့မဟုတ် လွယ် ကို ရွေးပါ၊ ကတ် ပြန်လာမည့်အချိန်ကို ဆုံးဖြတ်သည်။ ကတ်အစုံများကို ဖုန်းဖြင့် တည်းဖြတ်ရန် ဖြင့် ပြုလုပ်ပါ: Wi-Fi တစ်ခုတည်းရှိ ဖုန်းဖြင့် ကုဒ်ကို စကင်ဖတ်ပြီး ကတ်များ ရိုက်ထည့်ပါ၊ သို့မဟုတ် ကတ်များစွာ တစ်ပြိုင်နက် ဖြင့် CSV၊ TSV၊ TXT ဖိုင် (တစ်ကြောင်းလျှင် ကတ်တစ်ခု: ရှေ့ဘက်၊ နောက်ဘက်၊ ဥပမာ; UTF-8)၊ စာရင်း သို့မဟုတ် Anki ကတ်အစုံ (.apkg၊ Support older Anki versions ဖြင့်) ထည့်ပါ။\n\nသို့မဟုတ် မမ်မိုရီကတ်၏ Flashcards ဖိုင်တွဲတွင် ကတ်အစုံတစ်ခုလျှင် ဖိုင်တစ်ခု ထားပြီး “မမ်မိုရီကတ်ပေါ်ရှိ ကတ်များ” ကို ရွေးပါ။ အသစ် သို့မဟုတ် ပြောင်းထားသော ဖိုင်ကို ကတ်အစုံထဲ ပေါင်းထည့်ပြီး လေ့လာထားမှု မပျောက်ပါ။ ရှေ့ဘက်စာသား ပြောင်းလျှင် ကတ်အသစ် ဖြစ်သည်။ ဖိုင်မှ ဖျက်ထားသော စာကြောင်းသည် ကတ်ကို မဖျက်ပါ (“ဖိုင်တွင် မရှိသော ကတ်များ” ကို ဖယ်ရှားရန် ထားမှသာ)။ “မမ်မိုရီကတ်သို့ သိမ်းရန်” ဖြင့် ကတ်အစုံကို ၎င်း၏ဖိုင်သို့ ရေးပါ: id ကော်လံ ပါလာသဖြင့် ကွန်ပျူတာတွင် ရှေ့ဘက်ကို ပြင်နိုင်သည်။ 4 MiB သို့မဟုတ် စာကြောင်း 20,000 ထက်ကြီးသော ဖိုင်ကို မဖတ်ပါ၊ CSV UTF-8 (UTF-16 မဟုတ်) ဖြင့် သိမ်းပါ။\n\nဆက်တင်များ၊ စာဖတ်ခြင်း အောက်ရှိ ရှာထားသော စကားလုံးများမှ ကတ်ပြုလုပ်ရန် က ရှာထားသော စကားလုံးတိုင်းကို ရှာထားသည်များ ကတ်အစုံထဲ ထည့်ပေးသည်။"
