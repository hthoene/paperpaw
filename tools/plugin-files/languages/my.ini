profiles.plugin.how = "ပရိုဖိုင်သည် သင့်စာဖတ် ဆက်တင်များ၊ ပြသမှု ဆက်တင်များနှင့် အခြေအနေဘားများကို “ည” သို့မဟုတ် “စာလုံးကြီး” ကဲ့သို့ အမည်ဖြင့် သိမ်းပြီး တစ်ချက်တို့ရုံဖြင့် ပြန်ယူပေးသည်။\n\nစာဖတ်မီနူး၏ နောက်ထပ် အောက်တွင် သို့မဟုတ် ဆက်တင်များ၊ စိတ်ကြိုက်ပြင်ရန် အောက်တွင် ပရိုဖိုင်များကို ဖွင့်ပါ။ သုံးရန် ပရိုဖိုင်ကို တို့ပါ။ သုံးနေသည့်တစ်ခုကို မှတ်ပြထားသည်။ ဖိထားလျှင် (ခလုတ်ဖြင့်ဆိုလျှင် ရွေးရန်ကို ဖိထား) လက်ရှိဆက်တင်များကို ၎င်းထဲ သိမ်းရန်၊ အမည်ပြောင်းရန် သို့မဟုတ် ဖယ်ရှားရန် ရနိုင်သည်။ “ပရိုဖိုင်အသစ်အဖြစ် သိမ်းရန်” က လက်ရှိသတ်မှတ်ချက်များကို သိမ်းသည်။\n\n“နောက်ပရိုဖိုင်” က စာရင်းရှိ နောက်တစ်ခုသို့ ပြောင်းသည်။ ၎င်းကို ခလုတ် သို့မဟုတ် စည်းမျဉ်းတစ်ခုတွင် ထားပါ။"
