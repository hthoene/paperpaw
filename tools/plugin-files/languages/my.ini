end-of-book.plugin.how = စာအုပ်၏ နောက်ဆုံးစာမျက်နှာသို့ ရောက်သည့်အခါ မျက်နှာပြင်တစ်ခုက ၎င်း၏ စီးရီးမှ နောက်စာအုပ် (သို့မဟုတ် စာကြည့်တိုက်) ကို ပေးပြီး စာအုပ်ကို ကြယ် တစ်ပွင့်မှ ငါးပွင့်အထိ ပေးနိုင်ကာ ဖတ်ပြီးအဖြစ် မှတ်ထားခြင်း ရှိမရှိ ပြသည်။ နောက်ဆုံးစာမျက်နှာသို့ ပြန်ရန် နောက်သို့ ကို နှိပ်ပါ။
