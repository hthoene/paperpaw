diagnostics.plugin.name = စစ်ဆေးမှု
diagnostics.plugin.description = စမ်းသပ်မျက်နှာပြင်နှင့် စက်၏ အစိတ်အပိုင်းတိုင်းကို လမ်းညွှန်စစ်ဆေးမှု။
diagnostics.plugin.how = "စစ်ဆေးမှုသည် စက်ကို စစ်ဆေးရန် စမ်းသပ်မျက်နှာပြင် ဖြစ်သည်: မျက်နှာပြင်က ပြနိုင်သော မီးခိုးအဆင့်တိုင်း၊ ခလုတ်နှင့် ထိတွေ့မှုကို စမ်းရန် အကွက်လေးကွက်နှင့် ပြန်လည်ဆန်းသစ်မုဒ်များ နှိုင်းယှဉ်ရန် စာမျက်နှာရေတွက်စက်နှင့် တိုးတက်မှုဘားကို ပြသည်။\n\nစမ်းသပ်မျက်နှာပြင်တွင် မီနူးအကြောင်းအရာ မရှိပါ။ အခြားပလပ်အင်က မပေးသည့်အခါ သို့မဟုတ် ပလပ်အင်စီမံသူ၏ မျက်နှာပြင်များ တွင် ပင်မစာမျက်နှာ နေရာအတွက် ရွေးသည့်အခါသာ ပင်မစာမျက်နှာ ဖြစ်သည်။\n\nရွေးရန် က ရွေးထားသောအကွက်ကို မှတ်ပြီး မြှားခလုတ်များက အကွက်များကြား ရွှေ့သည်၊ ထိတွေ့ဖြင့် အကွက်ကို တို့ပါ။ စာမျက်နှာခလုတ်များက စမ်းသပ်စာမျက်နှာများ လှန်သည်။ ပြန်စရန် ရွေးရန် သို့မဟုတ် မျက်နှာပြင်ပေါ် လက်ချောင်းကို ဖိထားပါ။\n\nစက် စစ်ဆေးမှု (PaperPaw သည် စက်၏ ဖမ်းဝဲ ဖြစ်သည့်အခါ ကိရိယာများ တွင်) သည် မျက်နှာပြင်၊ ခလုတ်များ၊ ထိတွေ့မှု၊ ရှေ့မီး၊ ဘက်ထရီ၊ ကတ်၊ နာရီ၊ Wi-Fi၊ အိပ်ခြင်းနှင့် မှတ်ဉာဏ်ကို တစ်မျက်နှာစီ စစ်သည်။ စာမျက်နှာတိုင်း ကျ၊ ကျော်ရန်၊ အောင် ဖြင့် ဆုံးပြီး တိုင်းတာချက်အရ အဖြေကို ကြိုရွေးထားသည်၊ စက်တွင် မပါသော အစိတ်အပိုင်းများကို ကျော်သည်။ အဖြေတိုင်းနောက် pull request တွင် ကူးထည့်ရန် .paperpaw/plugins/diagnostics/device-check.txt သို့ အစီရင်ခံစာ ရေးသည်။ နောက်သို့ ဖြင့် ထွက်ပြီး ပြန်ဖွင့်ပါက ရပ်ခဲ့သည့်နေရာမှ ဆက်သည်။ ခလုတ်သာပါသော စက်တွင် ခလုတ်စာမျက်နှာ၌ စတင်ရန် ကို အရင်ရွေးပါ။"
