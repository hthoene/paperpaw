notes-overview.plugin.description = စာအုပ်အားလုံး၏ စာညှပ်များနှင့် အသားပေးချက်များကို စာရင်းတစ်ခုတည်းတွင် ပြပြီး My Clippings.txt အဖြစ် ထုတ်ယူနိုင်သည်။
notes-overview.plugin.how = "“မှတ်စုအားလုံး” သည် သင် စာညှပ် သို့မဟုတ် အသားပေးချက် ပြုလုပ်ထားသော စာအုပ်တိုင်းကို အရေအတွက်နှင့်တကွ ပြသည်။ ကိရိယာများတွင် ဖွင့်ပါ။ စာအုပ်တစ်အုပ်ကို ရွေးလျှင် ၎င်း၏မှတ်စုများကို မြင်ရပြီး မှတ်စုတစ်ခုကို ရွေးလျှင် စာအုပ်ကို ထိုနေရာတွင် ဖွင့်ပေးသည်။\n\nစာရင်း၏အဆုံးရှိ “My Clippings.txt အဖြစ် ထုတ်ယူရန်” သည် မှတ်စုအားလုံးကို စာကြည့်တိုက်ဘေးရှိ Exports ဖိုင်တွဲထဲ ဖိုင်တစ်ခုတည်းတွင် Kindle ပုံစံ (UTF-8) ဖြင့် ရေးသည်။ Kindle ၏ My Clippings.txt ကို ဖတ်နိုင်သော အက်ပ်များက ၎င်းကို ဖတ်နိုင်သည်။ Kindle ကဲ့သို့ အသားပေးချက်ပေါ်ရှိ မှတ်စုသည် သီးခြား entry တစ်ခု ဖြစ်သည်။ ဤနေရာရှိ စာအုပ်တွင် Kindle location မရှိသဖြင့် \"location\" သည် မှတ်စုရှိရာ နေရာကို စာအုပ်၏ ရာခိုင်နှုန်းဖြင့် ပြသည်။ ဖိုင်ကို အကြိမ်တိုင်း အသစ်ရေးပြီး ယခင်ဖိုင်ကို အစားထိုးသည်။"
