smart-home.plugin.name = စမတ်ဟုမ်း
smart-home.plugin.description = သင့်ကိုယ်ပိုင် Home Assistant မှ တန်ဖိုးများနှင့် ခလုတ်များကို ဒက်ရှ်ဘုတ်ပေါ်တွင်နှင့် ပင်မစာမျက်နှာ ဝိဂျက်များအဖြစ် ပြသည်။ အိမ်ကွန်ရက်ရှိ Home Assistant နှင့် အလုပ်လုပ်သည်။
smart-home.plugin.how = "စမတ်ဟုမ်းသည် သင့် Home Assistant မှ အပူချိန်၊ စိုထိုင်းဆ၊ တံခါးများ၊ မီးများ၊ ခလုတ်များနှင့် မြင်ကွင်းများကို ပြသည်။ အိမ်ကွန်ရက်ပေါ်တွင် REST API ဖြင့် ဆာဗာနှင့် တိုက်ရိုက် ဆက်သွယ်သည်။\n\nကိရိယာများ မီနူးမှ စမတ်ဟုမ်းကို ဖွင့်ပြီး ချိတ်ဆက်မှု: Home Assistant ၏ လိပ်စာ (ဥပမာ http://homeassistant.local:8123) နှင့် သက်တမ်းရှည် ဝင်ရောက်ခွင့် တိုကင် (Home Assistant ပရိုဖိုင်စာမျက်နှာ အောက်ခြေတွင် ပြုလုပ်ပါ) ကို ရိုက်ထည့်ပါ။ တိုကင်ကို စကားဝှက်များနှင့်အတူ သိမ်းသည်။ http ကို အိမ်ကွန်ရက် လိပ်စာများအတွက်သာ သုံးသည်၊ အခြားနေရာရှိ ဆာဗာအတွက် ဆက်တင်များတွင် “အိမ်ကွန်ရက် ပြင်ပရှိ ဆာဗာများ” ကို ဖွင့်ပြီး မှန်ကန်သော လက်မှတ်ပါသည့် https ကို သုံးပါ။\n\n“ပစ္စည်းများ ရွေးရန်” သည် ဆာဗာရှိ စာရင်းကို ဖွင့်သည်: အမည် သို့မဟုတ် id ဖြင့် ရှာပြီး ပြလိုသည်ကို ရွေးပါ (ထပ်ရွေးလျှင် ဖယ်သည်)။ အခန်းတစ်ခု သတ်မှတ်လျှင် ဒက်ရှ်ဘုတ်နှင့် အခန်းဝိဂျက်များတွင် အုပ်စုဖွဲ့ပြသည်။ အများဆုံး 24 ခု သိမ်းသည်။ ဒက်ရှ်ဘုတ်တွင် မီး၊ ခလုတ် သို့မဟုတ် မြင်ကွင်းကို ရွေးလျှင် ဖွင့်/ပိတ် လုပ်ပြီး ဆာဗာ၏ အဖြေကို ပြသည်။ အာရုံခံကိရိယာကို ရွေးလျှင် ပြန်ဖတ်သည်။\n\nဝိဂျက်များ (ပင်မစာမျက်နှာကို ဖိထားပါ): တန်ဖိုး၊ အုပ်စု (အခန်းတစ်ခု၏ ပစ္စည်းများ)၊ ခလုတ်နှင့် အခန်းကတ်။\n\nဒက်ရှ်ဘုတ် ဖွင့်ချိန်၊ သင်တောင်းချိန် (“ယခု ပြန်ဖတ်ရန်” သို့မဟုတ် ဝိဂျက်ကို တို့ခြင်း)၊ Wi-Fi ချိတ်ထားစဉ် စက်နိုးချိန်နှင့် အားသွင်းနေစဉ် သတ်မှတ်ထားသော အချိန်ဇယားအတိုင်း ဖတ်သည်။ Wi-Fi ကို ကိုယ်တိုင် ဘယ်တော့မှ မဖွင့်ဘဲ ဖွင့်လည်း မထားပါ။"
