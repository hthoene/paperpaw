sleep.plugin.name = အိပ်မုဒ် မျက်နှာပြင်
sleep.plugin.description = စက် အိပ်နေစဉ် အိပ်နေသော ကြောင်၊ စာအုပ်မျက်နှာဖုံး၊ သင့်ပုံများ သို့မဟုတ် စာတိုကို ပြသည်။
sleep.plugin.how = "အိပ်မုဒ် မျက်နှာပြင်သည် စက် အိပ်နေစဉ် မျက်နှာပြင်တွင် ပြမည့်အရာကို ဆုံးဖြတ်သည်။ E-ink သည် ပါဝါမရှိဘဲ ပုံကို ထိန်းထားသည်။\n\nဆက်တင်များ၊ စက်၊ အိပ်မုဒ် မျက်နှာပြင်ရှိ “ပြရန်” တွင် ရွေးပါ: အိပ်နေသော ကြောင် (မူလ)၊ စာအုပ်မျက်နှာဖုံး၊ ကျွန်ုပ်၏ ပုံများ၊ လိုဂိုနှင့် “အိပ်နေသည်”၊ ဝိဂျက်များ၊ လက်ရှိ စာမျက်နှာ သို့မဟုတ် ပုံပါသော စာမျက်နှာ။ ကျွန်ုပ်၏ ပုံများသည် ပုံများ ဖိုင်တွဲရှိ ဖိုင်များကို တစ်ခုပြီးတစ်ခု ပြသည်။ မျက်နှာဖုံး သို့မဟုတ် ပုံ မရှိလျှင် ကြောင် ပေါ်သည်။ စနစ်က ကိုယ်တိုင်ဆွဲသည့်နေရာတွင် ဤဆက်တင်များကို ဝှက်ထားသည်။\n\n“စက်ပိတ်ချိန်တွင် ပြရန်” ကို ပါဝါမီနူးမှ သို့မဟုတ် အိပ်ပြီးနောက် ပိတ်ချိန် ရောက်၍ စက်ပိတ်သည့်အခါ တစ်ကြိမ် ဆွဲသည် (ဘက်ထရီကုန်၍ ပိတ်လျှင် မဟုတ်)။ လိုဂိုနှင့် “ပိတ်ထားသည်”၊ ကြောင်၊ မျက်နှာဖုံး သို့မဟုတ် ကျွန်ုပ်၏ ပုံများကို မရွေးလျှင် အိပ်မုဒ် မျက်နှာပြင်အတိုင်း ဖြစ်သည်။ အခြားပလပ်အင်ကလည်း မျက်နှာပြင် ပေးနိုင်သည်။\n\n“စတင်ချိန်တွင် ပြရန်” နှင့် “ပြန်စချိန်တွင် ပြရန်” သည် အခြားပလပ်အင်က မပေးလျှင် စက်၏ မူလ ဖြစ်သည်။ စက်စနေစဉ် ပလပ်အင်များ မလည်ပတ်သေးသဖြင့် စတင်ချိန် မျက်နှာပြင်ကို စက်ပိတ်ချိန် သို့မဟုတ် ပြန်စချိန်တွင် ကြိုဆွဲထားပြီး နောက်တစ်ကြိမ် စချိန်တွင် ပြသည်။ အချိန်မီ အဆင်သင့် မဖြစ်သော မျက်နှာပြင် သို့မဟုတ် ပျက်နေသောပုံ ဖြစ်လျှင် စက်၏ မူလကို ပြသည်။ စက်သည် မည်သို့ပင်ဖြစ်စေ ပိတ်ခြင်း သို့မဟုတ် ပြန်စခြင်း ပြုလုပ်ပါမည်။"
