power.plugin.description = ပါဝါမုဒ်ကို ကိုယ်တိုင် သို့မဟုတ် ဘက်ထရီအလိုက် ရွေးသည်: ပုံမှန်၊ ချွေတာ၊ အော့ဖ်လိုင်း။
power.plugin.how = "ပါဝါသည် PaperPaw ဘက်ထရီ သုံးပုံကို ရွေးသည်: ပုံမှန်၊ ချွေတာ သို့မဟုတ် အော့ဖ်လိုင်း။ ချွေတာ သည် စောင့်နိုင်သည့်အရာများကို သင့်တော်သည့်အချိန်တွင် လုပ်သည်။ အော့ဖ်လိုင်း သည် ရေဒီယိုကို ပိတ်ထားသည်။ အလိုအလျောက် သည် ဘက်ထရီအလိုက် ရွေးသည်။\n\nမုဒ်ကို အမြန် ပန်နယ်တွင် (ပါဝါက မုဒ်များကို ဘေးချင်းယှဉ် ပြသည်) သို့မဟုတ် ဆက်တင်များ၊ ပါဝါ တွင် ပြောင်းပါ။ ထိုနေရာတွင် အလိုအလျောက်က ချွေတာ နှင့် အော့ဖ်လိုင်း သို့ ပြောင်းမည့် အဆင့်များနှင့် အားသွင်းစဉ် ပုံမှန် ထားမထား ကိုလည်း သတ်မှတ်နိုင်သည်။\n\nအခြေအနေဘားများတွင် ပါဝါမုဒ်သည် ချွေတာစဉ် အရွက်ပုံ၊ အော့ဖ်လိုင်းစဉ် ကန့်လန့်ဖြတ်ထားသော Wi-Fi ပြပြီး ပုံမှန်တွင် ဘာမျှ မပြပါ။\n\nပါဝါခလုတ်ကို ဖိထားလျှင် မီနူးငယ် ပွင့်သည်: အိပ်ရန်၊ ပိတ်ရန် (PaperPaw ပိတ်နိုင်သည့်နေရာတွင်)၊ ပြန်စရန်နှင့် ထိတွေ့စက်များတွင် ထိတွေ့မှု လော့ခ်ချရန် သို့မဟုတ် လော့ခ်ဖွင့်ရန်။ ခဏနှိပ်လျှင် ယခင်အတိုင်း စက်ကို အိပ်စေသည်။ “နောက်သို့” က မီနူးမှ ထွက်သည်။"
