calendar.plugin.description = စာဖတ်စက်ပေါ်ရှိ သင့်ပြက္ခဒိန်များ: CalDAV၊ iCal နှင့် ဖိုင်များမှ အစီအစဉ်၊ နေ့၊ ရက်သတ္တပတ်၊ လ မြင်ကွင်းများ၊ အဆက်အသွယ်များမှ မွေးနေ့များ၊ ပင်မ ဝိဂျက်များနှင့် အိပ်မုဒ် မျက်နှာပြင်။
calendar.plugin.how = "စာဖတ်စက်ပေါ်ရှိ သင့်ပြက္ခဒိန်များ: အစီအစဉ်၊ နေ့၊ ရက်သတ္တပတ်နှင့် လ မြင်ကွင်းများ။ CalDAV ပြက္ခဒိန်များ (Nextcloud၊ Fastmail စသည်)၊ iCal လိပ်စာများ (.ics)၊ ကတ်ပေါ်ရှိ ဖိုင်များနှင့် အဆက်အသွယ်များ (CardDAV) ၏ မွေးနေ့များကို ပြသည်။ ပြက္ခဒိန်များကို ဖတ်ရုံသာ ဖတ်ပြီး မပြောင်းပါ။\n\nကိရိယာများ မီနူးမှ ပြက္ခဒိန် ကို ဖွင့်ပါ။ မြင်ကွင်းပြောင်းရန်၊ ပြက္ခဒိန်ထည့်ရန် သို့မဟုတ် စင့်ခ်လုပ်ရန် ပထမအတန်းကို ရွေးပါ သို့မဟုတ် အတန်းကို ဖိထားပါ သို့မဟုတ် မီနူး နှိပ်ပါ။ စာမျက်နှာခလုတ်များက ယခင်/နောက် နေ့ သို့မဟုတ် ရက်သတ္တပတ်သို့ ရွှေ့သည်၊ လ တွင် မြှားများက နေ့ကို ရွှေ့သည်။ ဖြစ်ရပ်ကို ရွေးပါက အသေးစိတ် ပြသည်။\n\nပြက္ခဒိန်များ တွင် ပြက္ခဒိန် (6 ခုအထိ) ထည့်ပါ: အမျိုးအစား၊ လိပ်စာ၊ အကောင့်အတွက် အသုံးပြုသူအမည်နှင့် စကားဝှက် (app password ပိုကောင်း)၊ အမည် ထည့်ပါ။ တစ်ခုစီကို အမှတ်အသားဖြင့် ခွဲခြားသည်။\n\nထပ်ခါ ဖြစ်ရပ်များနှင့် အခြားဇုန်ရှိ ဖြစ်ရပ်များကို စက်၏ နာရီဖြင့် ပြသည်။ ယနေ့မှ ရှေ့နောက် 60 ရက်အတွင်း ဖြစ်ရပ် 240 ခုအထိ သိမ်းပြီး ကွန်ရက်မလိုဘဲ ပြသည်။\n\nပြက္ခဒိန်ဖွင့်ချိန်၊ ယခု စင့်ခ်လုပ်ရန် ရွေးချိန်နှင့် ဆက်တင်အတိုင်း ကွန်ရက်ဖွင့်ထားချိန် သို့မဟုတ် အားသွင်းစချိန်တွင် ဖတ်သည်။ ယခု စင့်ခ်လုပ်ရန် မှလွဲ၍ ၎င်းအတွက် ရေဒီယို မဖွင့်ပါ။\n\nပင်မစာမျက်နှာ ဝိဂျက်များ: ယနေ့၊ နောက်ဖြစ်ရပ်၊ အစီအစဉ်၊ လ နှင့် မွေးနေ့များ။ အိပ်မုဒ် မျက်နှာပြင်တွင် ယနေ့အစီအစဉ် ပြရန် ဆက်တင်များ › အိပ်မုဒ် မျက်နှာပြင် တွင် ပြက္ခဒိန် ကို ရွေးပါ။"
