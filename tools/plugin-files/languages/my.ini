widgets.plugin.name = ဝိဂျက် အစုံ
widgets.plugin.description = ပင်မစာမျက်နှာအတွက် နောက်ထပ် ဝိဂျက်များစွာ: နာရီများ၊ ပြက္ခဒိန်၊ ဆိုရိုးစကားများ၊ စာအုပ်များ၊ မှတ်စုများနှင့် အခြား။
widgets.plugin.how = "ဝိဂျက် အစုံသည် ပင်မစာမျက်နှာအတွက် ဝိဂျက်များစွာ ထည့်ပေးသည်: နာရီများ (လက်တံနာရီ၊ စကားလုံးနာရီ၊ အကွက်နာရီ၊ ကမ္ဘာ့နာရီ)၊ ပြက္ခဒိန်၊ ယခုနှစ် တိုးတက်မှု၊ ရက်ရေတွက်ခြင်း၊ လအခြေအနေ၊ နေ့နှင့် ရက်စွဲ၊ ယနေ့ ဆိုရိုးစကား၊ မှတ်စု၊ လုပ်ရန်များ၊ ပုံများ၊ နှုတ်ခွန်းဆက်စကားနှင့် PaperPaw လိုဂို၊ စာအုပ်များအတွက်: ယခုဖတ်နေသည်၊ တိုးတက်မှု၊ နောက်ဖတ်ရန်၊ စီးရီး၊ အကြိုက်ဆုံးများ၊ အသားပေးချက်နှင့် ကိန်းဂဏန်းဖြင့် စာကြည့်တိုက်။ ဘက်ထရီ ဝိဂျက်လည်း ပါသည်။\n\nမီနူးရှိ ပင်မစာမျက်နှာ တည်းဖြတ်ရန် (သို့မဟုတ် ပင်မစာမျက်နှာကို ဖိထားခြင်း) ဖြင့် ဖွင့်ပြီး ဝိဂျက် ထည့်ရန် ကို ရွေးပါ။ ဝိဂျက်တိုင်းတွင် ဘောင်၊ အရွယ်အစားနှင့် ချိန်ညှိမှု ကဲ့သို့ ကိုယ်ပိုင်ဆက်တင်များ ရှိသည်။ ယနေ့ ဆိုရိုးစကား ကဲ့သို့ ပြောင်းလဲသော ဝိဂျက်ကို ရွေးလျှင် နောက်တစ်ခုကို ပြသည်။ သင့်ကိုယ်ပိုင် ဆိုရိုးစကားများကို ကတ်ပေါ်ရှိ .paperpaw/plugins/widgets ထဲက quotes.txt တွင် တစ်ကြောင်းလျှင် စာသား | ပြောသူ ဖြင့် ရေးပါ။ အချိန် ဝိဂျက်များအတွက် နာရီ သတ်မှတ်ထားရန် လိုသည်၊ Wi-Fi က သတ်မှတ်ပေးသည်။"
