dictionary.plugin.description = StarDict အဘိဓာန်များတွင် စကားလုံးများ ရှာသည်။
dictionary.plugin.how = "အဘိဓာန်သည် စာအုပ်ထဲမှ စကားလုံးကို StarDict အဘိဓာန်များတွင် ရှာပြီး အဓိပ္ပာယ်များကို မျက်နှာပြင်အောက်ပိုင်းရှိ ဘောင်တွင် ပြသည်။\n\nစာဖတ်နေစဉ် စကားလုံးကို ဖိထားပြီး ရှာရန် ကို ရွေးပါ၊ ခလုတ်များဖြင့် နောက်ထပ် အောက်ရှိ စာသား ရွေးရန် ကို သုံးပါ။ အဘိဓာန်ဖိုင်တွဲများ (.ifo၊ .idx နှင့် .dict ဖိုင်များပါ) ကို စက်ပေါ်ရှိ \"dictionaries\" ဖိုင်တွဲထဲသို့ ကူးပါ (ဖိုင်တွဲခွဲများလည်း ရသည်) သို့မဟုတ် ဆက်တင်များ › စာဖတ်ခြင်း တွင် အဘိဓာန် ဖိုင်တွဲ (အဆင့်မြင့်ဆက်တင်) အဖြစ် အခြားဖိုင်တွဲ ရွေးပါ။ ပထမအကြိမ် ရှာသည့်အခါ အဘိဓာန်တစ်ခုစီအတွက် အညွှန်းငယ် ပြင်ဆင်သဖြင့် ခဏ ကြာသည်။\n\nဘောင်ထဲတွင် စာမျက်နှာခလုတ်များ သို့မဟုတ် အပေါ်/အောက် က အဓိပ္ပာယ်ရှည်များကို လှိမ့်ပြီး နောက်သို့ က ပိတ်သည်။ ထိတွေ့ဖြင့် ပိတ်ရန် အပြင်ဘက်ကို တို့ပါ။"
