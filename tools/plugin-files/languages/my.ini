help.plugin.name = အကြံပြုချက်များ
help.plugin.description = မျက်နှာပြင်တစ်ခု ပထမအကြိမ် ပွင့်ချိန်တွင် ၎င်း၏ ထိန်းချုပ်မှုများ ဘာလုပ်သည်ကို ပြသည်။
help.plugin.how = "မျက်နှာပြင်တစ်ခု ပထမအကြိမ် ပွင့်သောအခါ ၎င်းပေါ်ရှိ မှတ်စုတိုက ၎င်း၏ ထိန်းချုပ်မှုများ ဘာလုပ်သည်ကို ပြောပြသည်: တို့လျှင် သက်ရောက်သော မျက်နှာပြင်အပိုင်းများကို ဘောင်ခတ်ပြပြီး ခလုတ်များ ဘာလုပ်သည်ကို ပြသည်။\n\nတစ်ချက်တို့ခြင်း သို့မဟုတ် မည်သည့်ခလုတ်မဆို နှိပ်ခြင်းက မှတ်စုကို ပိတ်ပြီး ထိုမျက်နှာပြင်အတွက် ထပ်မပေါ်တော့ပါ။ “အကြံပြုချက် မပြတော့ပါ” က အားလုံးကို ပိတ်သည်။\n\nဆက်တင်များ › စနစ် တွင် “အကြံပြုချက်များ” က ၎င်းတို့ကို ဖွင့်/ပိတ်ပြီး “အကြံပြုချက်များ ပြန်ပြရန်” က မျက်နှာပြင်တိုင်း၏ မှတ်စုကို နောက်တစ်ကြိမ် ပြစေသည်။"
