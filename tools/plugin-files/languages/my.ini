format-cbz.plugin.name = ကာတွန်းစာအုပ်များ
format-cbz.plugin.description = ကာတွန်းစာအုပ် ဖိုင်များ (.cbz) ကို စာမျက်နှာတစ်ခုလျှင် ပုံတစ်ပုံဖြင့် ဖွင့်ပေးသည်။
format-cbz.plugin.how = "ကာတွန်းစာအုပ် ဖိုင်များ (.cbz) ကို ဖွင့်ပေးသည်: စာမျက်နှာတစ်ခုလျှင် ပုံတစ်ပုံ၊ မျက်နှာပြင်နှင့် ကိုက်အောင်၊ အမည်အစဉ်အတိုင်း (2 သည် 10 ၏ ရှေ့)။\n\nစာကြည့်တိုက်ဖိုင်တွဲထဲ ထည့်ပြီး စာကြည့်တိုက်မှ ဖွင့်ပါ။ စာမျက်နှာများကို အခြားစာအုပ်ကဲ့သို့ လှန်ပါ။ ပုံကြီးများသည် ပထမအကြိမ်တွင် ခဏကြာသည်၊ X4 တွင် ပိုကြာသည်။\n\nစာဖတ် ဆက်တင်များ (ဆက်တင်များ › စာဖတ်ခြင်း): “အကွက်လိုက်” သည် စာမျက်နှာ၏ အကွက်တစ်ကွက်ကို မျက်နှာပြင်ဆံ့သလောက် ကြီးကြီး ပြပြီး စာမျက်နှာလှန်ခြင်းက အကွက်တစ်ကွက်ချင်း သွားသည်။ အကွက်မရှိသော စာမျက်နှာကို တစ်ခုလုံး ပြသည်။ “ကာတွန်း စာမျက်နှာ ဦးတည်ချက်” သည် manga အတွက် (ညာမှ ဘယ်) စာမျက်နှာလှန်ခြင်းကို ပြောင်းပြန်လုပ်သည်။ စာအုပ်၏ ComicInfo.xml က ၎င်းကို ကိုယ်တိုင် ဖော်ပြသည်။ စာကြည့်တိုက်သည် ComicInfo.xml မှ ခေါင်းစဉ်၊ စီးရီးနှင့် အမှတ်ကို ပြသည်။"
format-cbz.title = ကာတွန်းစာအုပ် (CBZ)
format-cbz.setting.direction = ကာတွန်း စာမျက်နှာ ဦးတည်ချက်
