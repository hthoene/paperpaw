weather.plugin.description = ယခု ရာသီဥတုနှင့် နောက်ရက်များကို Open-Meteo မှ ဝိဂျက်များအဖြစ် ပြသည်။
weather.plugin.how = "ရာသီဥတုသည် ယခု ရာသီဥတုနှင့် နောက်ရက်များကို ပင်မစာမျက်နှာအတွက် ဝိဂျက်များအဖြစ် ပြသည်။ အကောင့် သို့မဟုတ် ကီး မလိုသော Open-Meteo မှ ရယူသည်။ ယခု ရာသီဥတု က အပူချိန်၊ အခြေအနေနှင့် ရွေးနိုင်သော အခြားအချက်များကို ပြသည်။ ခန့်မှန်းချက် က နောက်ရက်များကို အတန်းလိုက် သို့မဟုတ် စာရင်းဖြင့် ပြသည်။\n\nပထမဦးစွာ နေရာတစ်ခု ရွေးပါ: ဆက်တင်များ၊ ရာသီဥတု အောက်ရှိ နေရာ (အမည်ကို ရိုက်ပြီး တွေ့ရှိသော နေရာများထဲမှ ရွေးပါ)။ ၎င်း၏ ကိုဩဒိနိတ်များကိုသာ ပို့ပြီး ရာသီဥတု ဝိဂျက် ပြနေချိန်တွင်သာ ပို့သည်။ ပင်မစာမျက်နှာကို တည်းဖြတ်၍ ဝိဂျက်များ ထည့်ပါ။\n\nရာသီဥတုကို အများဆုံး အပ်ဒိတ်ကြိမ်နှုန်း တွင် သတ်မှတ်ထားသည်ထက် မပိုစေဘဲ ကွန်ရက် ရှိချိန်တွင်သာ ရယူသည်: Wi-Fi ကို ကိုယ်တိုင် ဘယ်တော့မှ မဖွင့်ပါ။\n\nရာသီဥတု ဒေတာကို Open-Meteo.com (https://open-meteo.com) မှ Creative Commons Attribution 4.0 လိုင်စင် (CC BY 4.0) အောက်တွင် ပေးသည်။"
