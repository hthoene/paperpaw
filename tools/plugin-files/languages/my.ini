settings.plugin.how = "ဆက်တင်များသည် PaperPaw နှင့် ၎င်း၏ပလပ်အင်များတွင် သတ်မှတ်နိုင်သမျှကို စာမျက်နှာများဖြင့် ပြသည်။ ပလပ်အင်များ ကိုယ်ပိုင်မျက်နှာပြင် မလိုပါ: ၎င်းတို့ ကြေညာသည့်အရာများကို ဤနေရာတွင် အုပ်စုများဖြင့် ဆက်တင်တစ်ခုစီ၏ ဖော်ပြချက်နှင့်အတူ ပြသည်။\n\nမီနူးရှိ ဆက်တင်များဖြင့် ဖွင့်ပါ။ အုပ်စုကို ဖွင့်ရန် တို့ပြီး ဆက်တင်ကို ပြောင်းရန် သို့မဟုတ် ရွေးရန် တို့ပါ။ ဂဏန်းများတွင် − နှင့် + ခလုတ်များ ရှိသည်။ ခလုတ်ဖြင့်ဆိုလျှင် ဆက်တင်သို့ ရွှေ့ပြီး ရွေးရန်ကို နှိပ်ပါ: ဘယ်/ညာက ဂဏန်းကို ပြောင်းသည်၊ ရွေးရန်က သိမ်းသည်၊ နောက်သို့က ယခင်တန်ဖိုးသို့ ပြန်သွားသည်။\n\nပြောင်းလဲမှုများ ချက်ချင်း သက်ရောက်သည်။ ရှာဖွေရန်က ဆက်တင်ကို စကားလုံးဖြင့် ရှာပေးပြီး အဆင့်မြင့် ဆက်တင်များက ရှားရှားပါးပါး လိုအပ်သည်များကို ထည့်ပြသည်။ မူလအတိုင်း ပြန်ထားရန်နှင့် အားလုံး ပြန်ထားရန် တို့သည် ဦးစွာ မေးသည်။"
