setup.plugin.description = ပထမဆုံး စတင်ချိန်တွင် အရေးကြီးသော ဆက်တင်များကို တိုတိုလမ်းညွှန်ပေးသည်။
setup.plugin.how = "စတင်သတ်မှတ်ခြင်းသည် PaperPaw ကို ပထမဆုံး စဖွင့်ချိန်တွင် တစ်ကြိမ်သာ ပြသော အရေးကြီးဆက်တင်များ၏ လမ်းညွှန်တို ဖြစ်သည်။ စာမျက်နှာတစ်ခုစီက ဘာသာစကား၊ ခလုတ်များ၊ စာလုံးအရွယ်၊ စံတော်ချိန်ဇုန်၊ Wi-Fi သို့မဟုတ် ထည့်လိုသော ပလပ်အင်အချို့ကဲ့သို့ တစ်ခုချင်း မေးပြီး သင့်တော်သော အဖြေကို ရွေးထားပြီး ဖြစ်သဖြင့် “ရှေ့သို့” သည် အမြဲ မှန်ပါသည်။ ဤစက် မလိုအပ်သော အဆင့်များကို ချန်ထားသည်။\n\nခလုတ်များကို တို့ပါ၊ သို့မဟုတ် အပေါ်/အောက် ခလုတ်များနှင့် ရွေးရန် ခလုတ်ကို သုံးပါ။ ပထမစာမျက်နှာရှိ “ကျော်ရန်” သည် ချက်ချင်း ထွက်သည်။ နောက်ဆုံးစာမျက်နှာက စာအုပ်များ ဘယ်ကရနိုင်သည်ကို ပြောပြသည်။\n\nထပ်လုပ်ရန် ဆက်တင်များကို ဖွင့်ပြီး “PaperPaw စတင်သတ်မှတ်ရန်” ကို ရွေးပါ။ ဤနေရာတွင် ရွေးသမျှကို နောက်ပိုင်း ဆက်တင်များတွင် ပြောင်းနိုင်သည်။"
