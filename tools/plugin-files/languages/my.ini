wifi.plugin.name = Wi-Fi
wifi.plugin.description = လိုအပ်သည့်အခါ Wi-Fi ကွန်ရက်များနှင့် ချိတ်ဆက်ပြီး နောက်မှ ရေဒီယိုကို ပိတ်သည်။
wifi.plugin.how = "ပလပ်အင်တစ်ခုက အင်တာနက် လိုအပ်သည့်အခါ (ကတ်တလောက်၊ စင့်ခ်၊ စတိုး၊ လွှဲပြောင်းမှု) Wi-Fi သည် ကွန်ရက်နှင့် ချိတ်ဆက်ပြီး မည်သူမျှ မသုံးတော့သည့် တစ်မိနစ်အကြာ သို့မဟုတ် ပင်မ သို့မဟုတ် စာအုပ် ပေါ်လာသည်နှင့် ဘက်ထရီနှင့် မမ်မိုရီ သက်သာစေရန် ရေဒီယိုကို ပြန်ပိတ်သည်။\n\nWi-Fi ကို ဆက်တင်များမှ သို့မဟုတ် အခြေအနေဘားရှိ Wi-Fi မှ ဖွင့်ပါ။ ကွန်ရက်များ တွင် အနီးရှိ ကွန်ရက်များကို ပြသည်: တစ်ခုကို ရွေးပြီး စကားဝှက် ရိုက်ထည့်ပါ၊ သို့မဟုတ် ဖုန်းဖြင့် စနစ်ထည့်ရန် ကို ရွေးပြီး စက်ပေါ်တွင် မဟုတ်ဘဲ ဖုန်း၏ ဘရောက်ဇာတွင် အမည်နှင့် စကားဝှက်ကို ရိုက်ထည့်ပါ။ မေ့ရန် က သိမ်းထားသော ကွန်ရက်ကို ဖယ်ရှားသည်။\n\nစကားဝှက်များကို ကတ်ပေါ်တွင် လုံခြုံစွာ သိမ်းထားပြီး ဘယ်တော့မှ ပြန်မပြပါ။ လိုအပ်သည့်အခါ ချိတ်ဆက်ရန် အောက်တွင် နောက်ဆုံးအသုံးပြုပြီးနောက် Wi-Fi ဖွင့်ထားမည့်ကြာချိန်၊ အားသွင်းနေစဉ် ဖွင့်ထားမထား၊ အနီးတွင် များစွာရှိလျှင် ဦးစားပေးမည့် သိမ်းထားသော ကွန်ရက်ကို သတ်မှတ်နိုင်သည်။"
