menu.plugin.name = မီနူး
menu.plugin.description = မျက်နှာပြင်အောက်ခြေရှိ လုပ်ဆောင်ချက်နှင့် ဆက်တင်များပါ မီနူး။
menu.plugin.how = "မီနူးသည် သင်လုပ်နိုင်၊ သတ်မှတ်နိုင်သည်များကို စာရင်းပြသည်။ ဖွင့်ထားသည့်အရာ၏ အပေါ်၊ မျက်နှာပြင်အောက်ခြေတွင် ပွင့်သည်: စာဖတ်စဉ် မျက်နှာပြင်အလယ်ကို တို့ပါ သို့မဟုတ် “ရွေးရန်” ကို နှိပ်ပါ။ လုပ်ဆောင်ရန် အရာတစ်ခုကို တို့ပါ သို့မဟုတ် ရွေးပါ။\n\nမီနူးရှိ ဆက်တင်များသည် ၎င်းတို့၏ တန်ဖိုးကို ပြပြီး နေရာတွင်ပင် ပြောင်းသဖြင့် မီနူး ပွင့်နေဆဲ ဖြစ်သည်။ အရာများ ထပ်ပါသော အရာသည် မီနူးခွဲကို ဖွင့်သည်။\n\nအမြန် ပန်နယ်အတွက် အပေါ်အစွန်းမှ အောက်သို့ ပွတ်ဆွဲပါ: မကြာခဏ ပြောင်းသည်များကို ခလုတ်များအဖြစ် ပြသည်။ ပြောင်းရန် ခလုတ်ကို တို့ပါ၊ ဆက်တင်အတွက် ဖိထားပါ။ ခလုတ်များသာ ရှိလျှင် မြှားခလုတ်များက ရွေးပြီး “ရွေးရန်” က ပြောင်း၍ “နောက်သို့” က ပိတ်သည်။ အသွင်အပြင် အောက်ရှိ “မီနူးများ” က မီနူးများကို စာရင်း သို့မဟုတ် အကွက်များအဖြစ် ပြသည်။"
