files.plugin.name = ဖိုင်ကြည့်ရန်
files.plugin.description = စက်ပေါ်ရှိ စာအုပ်များနှင့် ဖိုင်တွဲများကို စာရင်းပြပြီး ဖွင့်ပေးသည်။
files.plugin.how = "စာကြည့်တိုက်သည် သင့်စာကြည့်တိုက်ဖိုင်တွဲရှိ စာအုပ်များကို မျက်နှာဖုံး၊ ခေါင်းစဉ်၊ စာရေးသူနှင့် ဖတ်ပြီးသလောက်တို့နှင့်အတူ စာရင်းပြသည်။ နောက်ဆုံးဖတ်ခဲ့သော စာအုပ်သည် အပေါ်ဆုံးတွင် ကတ်အဖြစ် ရှိသဖြင့် တစ်ချက်တို့ရုံ သို့မဟုတ် “ရွေးရန်” ကို တစ်ချက်နှိပ်ရုံဖြင့် ဆက်ဖတ်နိုင်သည်။ စာကြည့်တိုက်က စာအုပ်များ ရှာနေစဉ် ယခုထိ ဘယ်နှအုပ် တွေ့ပြီဖြစ်ကြောင်း ပြသည်။\n\nစာအုပ်များ၏ အပေါ်တွင် ပြမည့်အရာကို ရွေးပါ: အားလုံး၊ ဖတ်နေဆဲ၊ မဖတ်ရသေး သို့မဟုတ် ဖတ်ပြီး စာအုပ်များ၊ သို့မဟုတ် စင်များ (စာရေးသူ၊ စီးရီး၊ တဂ်၊ အကြိုက်ဆုံးများ၊ စတင်ဖတ်ထားသော စီးရီးတိုင်း၏ နောက်စာအုပ်)။ ဖတ်ရန် စာအုပ်ကို တို့ပါ။ ဖွင့်ရန်၊ ဖတ်ပြီး သို့မဟုတ် မဖတ်ရသေးဟု မှတ်ရန်၊ အချက်အလက် ကြည့်ရန်၊ မော်ကွန်းသို့ ရွှေ့ရန် သို့မဟုတ် ဖျက်ရန် ၎င်းကို ဖိထားပါ (ခလုတ်ဖြင့်: “ရွေးရန်” ကို ဖိထားပါ)။ စာကြည့်တိုက် မီနူးအတွက် ခေါင်းစဉ်ကို တို့ပါ: စာအုပ်များ စီပုံနှင့် ပြပုံ၊ ရှာဖွေခြင်း၊ စာကြည့်တိုက်ဖိုင်တွဲနှင့် ဆက်တင်များ။\n\nစာကြည့်တိုက်ဖိုင်တွဲကို ဆက်တင်များ › စာကြည့်တိုက် › စာကြည့်တိုက်ဖိုင်တွဲ တွင် သတ်မှတ်ပါ။ ထိုနေရာတွင် စာအုပ်များကို မျက်နှာဖုံး ဇယားကွက်အဖြစ်လည်း ပြနိုင်သည်။ အခြားဖိုင်အားလုံးအတွက် ကိရိယာများ မီနူးရှိ “ဖိုင်များ” ကို သုံးပါ။"
