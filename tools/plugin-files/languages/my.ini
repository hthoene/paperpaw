reading-goal.plugin.name = စာဖတ် ပန်းတိုင်
reading-goal.plugin.description = တစ်နေ့ စာဖတ်ရမည့် မိနစ်များနှင့် ယနေ့ စာဖတ်မှုအလိုက် စိတ်ခံစားမှု ပြောင်းသော ပင်မစာမျက်နှာပေါ်ရှိ ကြောင်။
reading-goal.plugin.how = "ပင်မစာမျက်နှာပေါ်ရှိ ကြောင်က ယနေ့ စာဖတ်မှုကို ပြသည်: မဖတ်ရသေးလျှင် ဝမ်းနည်း၊ နည်းနည်းဖတ်ပြီးလျှင် သာမန်၊ နေ့စဉ်ပန်းတိုင်၏ တစ်ဝက်မှစ၍ ကျေနပ်၊ ပန်းတိုင်ရောက်လျှင် ပျော်သည်။\n\n“စာဖတ်ကြောင်” ဝိဂျက်ကို ပင်မစာမျက်နှာသို့ ထည့်ပါ (ပင်မစာမျက်နှာကို ဖိထားပြီး ဝိဂျက် ထည့်ပါ)၊ သို့မဟုတ် “ယနေ့ စာဖတ်ကြောင်” ကို အိပ်မုဒ် မျက်နှာပြင်အဖြစ် ရွေးပါ။ ကြောင်ကို တို့လျှင် နေ့စဉ်ပန်းတိုင်ကို ဖွင့်သည်။ ၎င်းသည် စာဖတ်ရသည့် မိနစ်များကို ရေတွက်သော စာဖတ်မှု စာရင်းအင်း၏ ပန်းတိုင် ဖြစ်သည်။\n\nဆက်တင်များ၏ စာဖတ်ခြင်း အောက်တွင် “ကျေနပ်ခြင်း စမှတ်” နှင့် “ပျော်ခြင်း စမှတ်” က ပန်းတိုင်၏ မည်သည့်အချိုးမှ ကြောင် ကျေနပ် သို့မဟုတ် ပျော်မည်ကို သတ်မှတ်ပြီး “ကိုယ်ပိုင်ပုံများ” က ကြောင်များအစား ပြမည့် ပုံဖိုင်တွဲ (sad၊ meh၊ content၊ happy) ကို သတ်မှတ်သည်။ ပုံများသည် PNG သို့မဟုတ် JPEG ဖိုင်များ ဖြစ်သည်။ ဖိုင်တွဲ မရှိလျှင် ကြောင်များကို ပြသည်။"
