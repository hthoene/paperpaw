tasks.plugin.name = လုပ်ငန်းများ
tasks.plugin.description = သတ်မှတ်ရက်နှင့် ဦးစားပေးမှုပါသော လုပ်ရန်စာရင်းများ၊ စာဖတ်စက်ပေါ်တွင် သို့မဟုတ် CalDAV ဆာဗာနှင့် စင့်ခ်လုပ်ပြီး ပင်မစာမျက်နှာ ဝိဂျက်များဖြင့်။
tasks.plugin.how = "စာဖတ်စက်ပေါ်ရှိ လုပ်ရန်စာရင်းများ: သတ်မှတ်ရက်နှင့် ဦးစားပေးမှုပါသော လုပ်ငန်းများကို ပြီးလျှင် အမှန်ခြစ်သည်။ စီစဉ်မှုနှင့် ကွန်ရက် မလိုဘဲ အလုပ်လုပ်ပြီး CalDAV ဆာဗာ (Nextcloud၊ Radicale၊ Baïkal၊ Fastmail စသည်) နှင့် စင့်ခ်လုပ်နိုင်သည်။\n\nကိရိယာများ မီနူးမှ လုပ်ငန်းများကို ဖွင့်ပါ။ ပထမအတန်းတွင် ပြနေသော စာရင်းအမည် ရှိပြီး ၎င်းကို ရွေးလျှင် အခြားစာရင်း၊ “ယနေ့နှင့် ရက်လွန်”၊ စာရင်းအသစ်၊ စင့်ခ်လုပ်ခြင်း သို့မဟုတ် အကောင့်သို့ သွားနိုင်သည်။ လုပ်ငန်းကို ရွေးလျှင် အမှန်ခြစ်သည် (ထပ်ရွေးလျှင် ပြန်ဖြုတ်သည်)။ ခေါင်းစဉ်၊ သတ်မှတ်ရက် (ဥပမာ 2026-12-24)၊ ဦးစားပေးမှု ပြောင်းရန် သို့မဟုတ် ဖယ်ရှားရန် လုပ်ငန်းကို ဖိထားပါ သို့မဟုတ် မီနူးကို နှိပ်ပါ။ ပြီးသော လုပ်ငန်းများကို တစ်ပတ်ကြာ အဆုံးတွင် ထားသည်။\n\nဝိဂျက်များ (ပင်မစာမျက်နှာကို ဖိထားပါ): ယနေ့ လုပ်ငန်းများ၊ လုပ်ငန်းစာရင်း၊ မပြီးသေးသော လုပ်ငန်းများ အရေအတွက်နှင့် နောက်လုပ်ငန်း။ လုပ်ငန်းကို တို့လျှင် အမှန်ခြစ်သည်။\n\nစင့်ခ်လုပ်ရန် စာရင်းအတန်းမှ CalDAV အကောင့်ကို ရွေးပြီး ဆာဗာလိပ်စာ (ဥပမာ cloud.example.com/remote.php/dav)၊ အသုံးပြုသူအမည်နှင့် စကားဝှက် (အက်ပ် စကားဝှက် အကောင်းဆုံး) ထည့်ပါ။ ဆာဗာ၏ လုပ်ငန်းစာရင်းတိုင်း စာဖတ်စက်တွင် စာရင်းဖြစ်လာသည်။ လုပ်ငန်းများကို ဖွင့်ချိန်၊ “ယခု စင့်ခ်လုပ်ရန်” နှင့် ကွန်ရက် ဖွင့်ထားချိန်တွင် စင့်ခ်လုပ်သည်၊ အော့ဖ်လိုင်း ပြောင်းလဲမှုများကို နောက်မှ ပို့သည်။ နှစ်နေရာစလုံးတွင် ပြောင်းထားလျှင် ဆာဗာ၏ ဗားရှင်းကို ယူပြီး သင့်ဟာကို လုပ်ငန်းအသစ်အဖြစ် ထားသဖြင့် ဘာမျှ မပျောက်ပါ။ စာရင်း 12 ခုတွင် လုပ်ငန်း 200 အထိ ထားနိုင်သည်။"
