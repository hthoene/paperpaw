aids.plugin.description = စကားလုံးအစ ထူခြင်း၊ စကားလုံး အစားထိုးခြင်း၊ ပုံများ: သင်လိုချင်သည့် စာသား။
aids.plugin.how = "စာဖတ် အထောက်အကူများသည် စာဖတ်နေစဉ် စာအုပ်စာသား၏ အသွင်ကို ပြောင်းပေးပြီး စာအုပ်တိုင်းတွင် သက်ရောက်သည်။ စကားလုံးအစ ထူရန်နှင့် စကားလုံး အစားထိုးရန်ကို မူလက ပိတ်ထားသည်။\n\nဆက်တင်များ › စာဖတ်ခြင်း › စာဖတ် အထောက်အကူများ တွင် တွေ့နိုင်သည်။ စကားလုံးအစ ထူရန်က စကားလုံးတိုင်း၏ ပထမတစ်ဝက်ကို ထူစေပြီး အချို့လူများအတွက် ဖတ်ရပိုလွယ်သည်။ စကားလုံး အစားထိုးရန်တွင် \"colour = color; Mr. = Mister\" ကဲ့သို့ အတွဲများကို semicolon ဖြင့် ခွဲရေးပါ။\n\nရေးထားသည့်အတိုင်း စကားလုံးအပြည့်ကိုသာ အစားထိုးသဖြင့် \"color\" သည် ပိုရှည်သော စကားလုံး၏ အစိတ်အပိုင်းကို ဘယ်တော့မှ မပြောင်းပါ။ စာအုပ်ဖိုင်ကိုယ်တိုင် မပြောင်းလဲပါ။\n\nစာအုပ်ရှိ ပုံများကို ပြနိုင်သည် (မူလ)၊ ပုံ၏ ဖော်ပြချက်ကို သုံးသော \"[ပုံ: ပင်လယ်ထဲရှိ သင်္ဘော]\" ကဲ့သို့ စာကြောင်းတိုအဖြစ် ပြောင်းနိုင်သည် သို့မဟုတ် ချန်လှပ်နိုင်သည်။ ထိုအခါ စာမျက်နှာတွင် စာသားအတွက် နေရာ ပိုရပြီး မပြသော ပုံများကို decode မလုပ်သဖြင့် စာမျက်နှာ ပိုမြန်စွာ လှန်သည်။ ကာတွန်းနှင့် ပုံများဖြင့် ဖွဲ့ထားသော စာအုပ်များ မပြောင်းလဲပါ။"
