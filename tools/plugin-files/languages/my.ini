about.plugin.name = အကြောင်း
about.plugin.description = PaperPaw ၏ ဗားရှင်းနှင့် လိုင်စင်များ။
about.plugin.how = "အကြောင်း သည် သင့်တွင်ရှိသော PaperPaw ဗားရှင်း၊ ၎င်း၏ ရင်းမြစ်ကုဒ် ရှိရာနေရာနှင့် မည်သည့်လိုင်စင်များဖြင့် ထုတ်ဝေသည်ကို ပြသည်။\n\nဆက်တင်များ၏ အဆုံးတွင် PaperPaw အကြောင်း အဖြစ် တွေ့နိုင်သည်။ မြှားခလုတ်များနှင့် ရွေးရန် ဖြင့် အတန်းတစ်ခု ရွေးပါ သို့မဟုတ် ၎င်းကို တို့ပါ။ ဖမ်းဝဲတွင် ပါဝင်သော ပလပ်အင်များနှင့် ကုဒ်ပါ ပလပ်အင်များ ဖွင့်နိုင်သော စက်များတွင် ထိုပလပ်အင်များ တည်ဆောက်ရမည့် fingerprint ကိုလည်း ပြသည်။\n\nလိုင်စင်များ သည် စာဖတ်စက်တွင် စာသားအဖြစ် ပွင့်သဖြင့် စာအုပ်ကဲ့သို့ လှန်ဖတ်နိုင်သည်။ ၎င်းတွင် PaperPaw ၏ လိုင်စင်နှင့် ပါဝင်လာသော ဖောင့်များ၊ အိုင်ကွန်များနှင့် စာလုံးဖြတ်ပုံစံများ၏ လိုင်စင်များ ပါဝင်သည်။ ပလပ်အင်များက သီမ်၏ ဖန်တီးသူကဲ့သို့ ကိုယ်ပိုင်စာကြောင်း ထည့်နိုင်သည်။"
