store.plugin.how = "ပလပ်အင် စတိုးသည် ဤစက်အတွက် ပလပ်အင်များကို အင်တာနက်တွင် ရှာပြီး ထည့်သွင်း၊ အပ်ဒိတ်လုပ်၊ ဖယ်ရှားသည်။ ကိရိယာများမှ ဖွင့်ပါ၊ Wi-Fi လိုအပ်သည်။\n\nအစစာမျက်နှာတွင် အကြံပြုချက်များ၊ အသစ်နှင့် လူကြိုက်များသည်များ၊ ထို့နောက် အုပ်စုများ ပြသည်။ အုပ်စုများကို နေ့စဉ်ပြောင်းသော ရောနှောမှုဖြင့် ပြပြီး A မှ Z၊ အသစ်ဆုံး သို့မဟုတ် အပ်ဒိတ်အလိုက် စီနိုင်သည်။ တစ်ခုကို ဖွင့်လျှင် အရွယ်အစားနှင့် မမ်မိုရီ သုံးစွဲမှု ပြပြီး ထည့်သွင်းရန်၊ အပ်ဒိတ် သို့မဟုတ် ဖယ်ရှားရန် ရွေးပါ။ “အားလုံး အပ်ဒိတ်လုပ်ရန်” သည် ထည့်ထားသမျှကို အပ်ဒိတ်လုပ်သည်။\n\nကုဒ် ပလပ်အင်များသည် စက်ကို အပြည့်အဝ ဝင်ရောက်ခွင့်ဖြင့် လည်ပတ်သည်: စတိုးက အရင်မေးပြီး ပြန်စပြီးမှ စတင်သည်။ တစ်ခု ပြဿနာဖြစ်လျှင် PaperPaw သည် ကုဒ် ပလပ်အင်များ မပါဘဲ စပြီး မည်သည့်တစ်ခုဖြစ်ကြောင်း ပြောသည်။\n\nဆက်တင်များ၊ စနစ်ရှိ “အသိုင်းအဝိုင်း ပလပ်အင်များ” သည် GitHub ပေါ်တွင် အခြားသူများ ထုတ်ဝေထားသည်ကိုလည်း ပြသည်။ ၎င်းတို့ကို မည်သူမျှ မစစ်ဆေးရသေးသဖြင့် “မစစ်ဆေးရသေး” ဟု အမှတ်အသားပြပြီး အခြားကီးဖြင့် လက်မှတ်ထိုးထားသော အပ်ဒိတ်ကို မထည့်သွင်းပါ။\n\nအစစာမျက်နှာ၏ နောက်ဆုံးအတန်း “ရင်းမြစ်များ” တွင် အခြား ပလပ်အင်စာရင်းများကို လိပ်စာ (https://…/plugins.json) ဖြင့် ထည့်၊ ပြ သို့မဟုတ် ဖယ်ရှားနိုင်သည်။ ကတ်ပေါ်ရှိ .paperpaw/plugins/store ထဲသို့ လိပ်စာများပါသော sources.txt ကိုလည်း ထည့်နိုင်သည်။ PaperPaw သည် ရင်းမြစ်များကို မစစ်ဆေးပါ။ စက်သည် ပထမဆုံး ဖတ်သောစာရင်း၏ ကီးကို မှတ်ထားပြီး ထိုကီးဖြင့် လက်မှတ်ထိုးထားသည်များကိုသာ လက်ခံသည်။ ပလပ်အင်တစ်ခုသည် ထည့်သွင်းခဲ့သော ရင်းမြစ်မှသာ အပ်ဒိတ် ရသည်။ PaperPaw ၏ ကိုယ်ပိုင် စာကြည့်တိုက်ကို ဖယ်ရှား၍မရပါ။"
