notes-vault.plugin.name = မှတ်စုတိုက်
notes-vault.plugin.description = Markdown မှတ်စု ဖိုင်တွဲကို ဖိုင်တွဲ၊ တဂ်နှင့် နောက်ဆုံးပြောင်းလဲမှုများအလိုက် ဖတ်ပြီး ပင်မစာမျက်နှာအတွက် ဝိဂျက်များ ပါသည်။ Obsidian vault များနှင့် အလုပ်လုပ်သည်။
notes-vault.plugin.how = "မှတ်စုတိုက်သည် Markdown မှတ်စု ဖိုင်တွဲတစ်ခု (မှတ်စုအက်ပ်များ သိမ်းသည့် ရိုးရိုး .md ဖိုင်များ) ကို ဖတ်သည်။ Obsidian vault များနှင့် အလုပ်လုပ်သည်။\n\nဆက်တင်များတွင် သို့မဟုတ် ကိရိယာများရှိ မှတ်စုတိုက် စာမျက်နှာတွင် ဖိုင်တွဲကို ရွေးပါ။ ထို့နောက် စာမျက်နှာတွင် ကတ်ပေါ်ရှိအတိုင်း ဖိုင်တွဲများ၊ နောက်ဆုံးပြောင်းထားသော မှတ်စုများ၊ တဂ်များနှင့် ခေါင်းစဉ်ရှာဖွေမှု ပါသည်။\n\nပထမအကြိမ်တွင် စာမျက်နှာ ဖွင့်ထားစဉ် နောက်ကွယ်၌ အညွှန်းပြုလုပ်သည်။ မှတ်စု ထောင်ချီရှိလျှင် မိနစ်အနည်းငယ် ကြာပြီး ထို့နောက် ချက်ချင်း ပွင့်သည်။ အညွှန်းကို ကတ်ပေါ်တွင် သိမ်းပြီး နာရီအချို့ကြာမှ စာမျက်နှာကို ဖွင့်သည့်အခါ သို့မဟုတ် “အပ်ဒိတ်” ကို ရွေးသည့်အခါ ပြန်လုပ်သည်။\n\nမှတ်စုသည် စာဖတ်စက်တွင် ပွင့်သည်။ အခြားမှတ်စုသို့ လင့်ခ်များ ([[Note]]၊ [[Note|words]]၊ [[Note#Heading]]) ကို မှတ်စုအမည်ဖြင့် တစ်တိုက်လုံးတွင် ရှာသည်။ လင့်ခ်ကို နှိပ်လျှင် ထိုမှတ်စု ပွင့်ပြီး “နောက်သို့” က ယခင်မှတ်စုသို့ ပြန်သွားသည်။\n\nမှတ်စုတိုက်ထဲရှိ မည်သည့်အရာကိုမျှ မပြောင်းပါ။ ပင်မစာမျက်နှာ ဝိဂျက်များ (နောက်ဆုံးမှတ်စုများ၊ ပင်ထိုးမှတ်စု၊ ယနေ့မှတ်စု၊ ကျပန်းမှတ်စု၊ တဂ်များ၊ ရှာဖွေမှု) ကို ပင်မစာမျက်နှာ တည်းဖြတ်စနစ်တွင် ထည့်ပါ။ ဝိဂျက်သည် ဖိုင်တွဲတစ်ခုတည်းမှ မှတ်စုများကို ယူနိုင်သည်: ဝိဂျက်ဆက်တင်တွင် ကတ်၏ root မှ ဖိုင်တွဲလမ်းကြောင်း (ဥပမာ Notes/Work) ကို ရေးပါ။ ဗလာထားလျှင် မှတ်စုအားလုံးကို ယူသည်။"
