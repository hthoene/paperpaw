notes-overview.export.help.more = မှတ်စုအားလုံးကို e-reader များသုံးသော My Clippings.txt ပုံစံဖြင့် ဖိုင်တစ်ခုတည်းတွင် စာကြည့်တိုက်ဘေးရှိ “Exports” ဖိုင်တွဲထဲ သိမ်းသည်။ စာရင်းတွင် စာအုပ် 200 အုပ် ပြပြီး ဖိုင်တွင် အားလုံး ပါသည်။
