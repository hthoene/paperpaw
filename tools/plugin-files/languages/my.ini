menu-editor.plugin.how = "မီနူး တည်းဖြတ်ကိရိယာသည် မီနူးများတွင် ပါဝင်သည်ကို ပြောင်းသည်: အရာများကို အပေါ်အောက် ရွှေ့ခြင်း၊ ဖယ်ရှားခြင်း သို့မဟုတ် အသစ်ထည့်ခြင်း။\n\nဆက်တင်များ › စိတ်ကြိုက်ပြင်ရန် › မီနူးများ ပြင်ရန် တွင် ရှိသည်။ မီနူးတစ်ခု ရွေးပါ၊ ထို့နောက် ရွှေ့ရန် သို့မဟုတ် ဖယ်ရှားရန် အရာတစ်ခု ရွေးပါ။ “အရာ ထည့်ရန်” က အသစ်ထည့်သည်။ ပြောင်းလဲမှုများ ချက်ချင်း သက်ရောက်သည်။ “ဤမီနူး ပြန်စရန်” က မီနူးကို ၎င်း၏ ပလပ်အင်များ သတ်မှတ်ထားသည့်အတိုင်း ပြန်ဖြစ်စေပြီး “မီနူးအားလုံး ပြန်စရန်” က မီနူးတိုင်းအတွက် ထိုသို့ လုပ်သည်။\n\nကိုယ့်ကိုယ်ကို ပိတ်မိ၍ မရပါ: ဆက်တင်များသို့ သွားရာ အရာသည် အခြားလမ်း မထည့်မချင်း ကျန်နေမည်။"
