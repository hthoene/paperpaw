vocabulary.sd.readme = "ဖိုင်များမှ ကျက်မှတ်ကတ်များ\n\nကတ်အစုံတစ်ခုလျှင် ဖိုင်တစ်ခု ဤနေရာတွင် ထားပါ: Spanish.tsv မှ Spanish ကတ်အစုံ ဖြစ်လာသည်။\nဖိုင်များ: .tsv၊ .csv သို့မဟုတ် .txt (UTF-8 ဖြင့် သိမ်းထားသော)၊ သို့မဟုတ် .apkg: Support older Anki versions ကို အမှန်ခြစ်ပြီး ထုတ်ထားသော Anki ကတ်အစုံ။ ၎င်း၏ မှတ်စုများ၏ ပထမ field သုံးခုသည် ရှေ့ဘက်၊ နောက်ဘက်နှင့် ဥပမာ ဖြစ်လာသည်။ scheduling နှင့် media ကို မဖတ်ပါ၊ PaperPaw သည် Anki ဖိုင်ကို ဘယ်တော့မှ မရေးပါ။\n\nတစ်ကြောင်းလျှင် ကတ်တစ်ခု: ရှေ့ဘက်၊ နောက်ဘက်နှင့် ဥပမာ (မထည့်လည်း ရ)၊ tab၊ ကော်မာ သို့မဟုတ် semicolon ဖြင့် ခြားပါ။ ပထမစာကြောင်းက ကော်လံများကို front, back, example ဟု အမည်ပေးနိုင်သည်။ ဥပမာ:\n\nKatze\tcat\tDie Katze schläft.\n\nထို့နောက် စာဖတ်စက်တွင် ကျက်မှတ်ကတ်များ ကိုဖွင့်၊ မမ်မိုရီကတ်ပေါ်ရှိ ကတ်များ ကိုရွေးပြီး ကတ်အစုံများ အပ်ဒိတ်လုပ်ရန် ကို ရွေးပါ။\n\nသိထားသင့်သည်:\n- ကတ်အစုံများနှင့် လေ့လာထားမှုသည် စာဖတ်စက်ပေါ်တွင် ရှိသည်။ အသစ် သို့မဟုတ် ပြောင်းထားသော ဖိုင်ကိုသာ ဖတ်သည်။\n- နောက်ဘက် သို့မဟုတ် ဥပမာကို ပြောင်းလျှင် ကတ်ပြောင်းပြီး လေ့လာထားမှု ကျန်သည်။\n- ရှေ့ဘက်စာသားကို ပြောင်းလျှင် ကတ်အသစ် ဖြစ်ပြီး ကတ်ဟောင်း အစမှ ပြန်စသည်။ ကတ်အစုံကို မမ်မိုရီကတ်သို့ သိမ်းလျှင် ကတ်တိုင်း id ကော်လံတွင် နံပါတ် ရသည်: ထိုနေရာတွင် ရှေ့ဘက်ကို ပြင်ပါက ကတ်သည် လေ့လာထားမှုကို ထိန်းထားသည်။\n- သိမ်းလျှင် ကတ်အစုံ၏ ကတ်များကို ရေးသည်။ ဖိုင်ဟောင်းကို _name.bak.tsv သို့ ကူးထားသည်။\n- CSV UTF-8 ဖြင့် သိမ်းပါ (UTF-16 မဟုတ်)။ 4 MiB သို့မဟုတ် စာကြောင်း 20,000 ထက်ကြီးသော ဖိုင်ကို မဖတ်ပါ: ခွဲပါ။\n- ဖိုင်တွင် ဖျက်ထားသော စာကြောင်းသည် ကတ်ကို မဖျက်ပါ၊ ထိုကတ်အစုံအတွက် မရှိသော ကတ်များ ဖယ်ရှားရန် ဖွင့်ထားမှသာ ဖျက်သည်။\n- _ ဖြင့်စသော ဖိုင်များကို မဖတ်ပါ။\n"
