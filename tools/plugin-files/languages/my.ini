bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = အဝေးထိန်းများ၊ ကီးဘုတ်များနှင့် အာရုံခံကိရိယာများကို တွဲချိတ်ပြီး ချိတ်ဆက်သည်။
bluetooth.plugin.how = "Bluetooth သည် Bluetooth ပါသော စာဖတ်စက် (X4 Pro) နှင့် အဝေးထိန်းများ၊ ကီးဘုတ်များ၊ အာရုံခံကိရိယာများကို တွဲချိတ်ပေးသည်။\n\nစက် ထည့်ရန် သည် အနီးရှိ စက်များကို ရှာသည်၊ စက်ကို တွဲချိတ်မုဒ်သို့ အရင်ထားပါ။ ၎င်းကို ရွေးပြီး စာဖတ်စက်ပေါ်တွင် အတည်ပြုပါ (ဂဏန်းပြပါက တိုက်ကြည့်ပါ)။ ထို့နောက် အဝေးထိန်း သို့မဟုတ် ကီးဘုတ်၏ ခလုတ်များက စာမျက်နှာလှန်ပြီး မီနူးများတွင် ရွှေ့သည်၊ ခလုတ်တစ်ခုစီ၏ လုပ်ဆောင်ချက်ကို ထိန်းချုပ်မှုများ တွင် ပြောင်းပါ။\n\nအဝေးထိန်းများ တွင် ခလုတ်များ အလုပ်လုပ်မည့်အချိန်ကို ရွေးပါ: ဤနေရာတွင် ဖွင့်ထားလျှင်၊ စာဖတ်နေစဉ် (စာအုပ်ဖွင့်ထားစဉ် ချိတ်ဆက်ပြီး ဘက်ထရီ ချွေတာသည်) သို့မဟုတ် အမြဲတမ်း။ မီနူးခလုတ် သို့မဟုတ် စက်ကို ကြာကြာဖိခြင်းဖြင့် ၎င်းကို မေ့ပစ်သည်။\n\nအာရုံခံကိရိယာသည် ပလပ်အင်များအတွက် ဖြစ်သည်: မည်သည့်ပလပ်အင် သုံးနိုင်မည်ကို ဖွင့်ပါ။ မည်သည့်အရာမျှ မသုံးသည့်အခါ Bluetooth ပိတ်ထားသည်။"
