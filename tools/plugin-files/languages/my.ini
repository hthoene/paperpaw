keyboard.plugin.name = ကီးဘုတ်
keyboard.plugin.description = မျက်နှာပြင်ပေါ်တွင် ထိတွေ့၍ သို့မဟုတ် ခလုတ်များဖြင့် စာရိုက်ပေးသည်။
keyboard.plugin.how = "ရှာဖွေခြင်း၊ စကားဝှက်၊ မှတ်စု သို့မဟုတ် ဆက်တင်ကဲ့သို့ စာသား လိုအပ်သည့်အခါတိုင်း ကီးဘုတ် ပွင့်လာသည်။ ထိတွေ့၍ရော ခလုတ်များသာဖြင့်ပါ အလုပ်လုပ်သည်။\n\nခလုတ်ဖြင့်: ဘယ်နှင့် ညာက အတန်းတစ်လျှောက် ရွှေ့သည်၊ စာမျက်နှာ ခလုတ်များက အတန်းများကြား ရွှေ့သည်၊ “ရွေးရန်” က ကီးကို နှိပ်ပြီး “နောက်သို့” က ပယ်ဖျက်သည်။ ဘယ်နှင့် ညာက အတန်းတွင် ပတ်ပြီး အပေါ်နှင့် အောက်က သင့်ကော်လံအတိုင်း နေသည်။ Shift က နောက်စာလုံးကို အကြီးဖြစ်စေသည်၊ နှစ်ချက်နှိပ်လျှင် အားလုံး အကြီး၊ နောက်တစ်ချက် နှိပ်လျှင် ရပ်သည်။ စာလုံးကို ဖိထားလျှင် (ခလုတ်ဖြင့်: ၎င်းပေါ်တွင် “ရွေးရန်” ကို ဖိထား) အကြီး (ချက်ချင်း ရွေးပြီး) နှင့် é၊ è ကဲ့သို့ အသံထွက်သင်္ကေတပါ စာလုံးများ ရသည်။ ဂျာမန်တွင် ä၊ ö၊ ü၊ ß ကို a၊ o၊ u၊ s မှ ထိုနည်းဖြင့် ရသည်။ OK က ပြီးဆုံးစေသည်။ ခလုတ်ဖြင့် မည်သည့်နေရာမှမဆို ပြီးရန် “နောက်သို့” ကို ဖိထားပါ (“နောက်သို့” တစ်ခုတည်းက ပယ်ဖျက်သည်)၊ သို့မဟုတ် စာလုံးမဟုတ်သော ကီးပေါ်တွင် “ရွေးရန်” ကို ဖိထားပါ။ ကူးထည့်ရန် က clipboard စာသားကို ထည့်ပြီး ဖုန်း (ရှိလျှင်) က ဖုန်းပေါ်တွင် ရိုက်ခွင့်ပေးသည်။\n\nဆက်တင်များ › စက် › ကီးဘုတ်: “ကီးဘုတ် အပြင်အဆင်များ” က အပြင်အဆင်ကို ရွေးသည်၊ မူလအားဖြင့် မီနူး ဘာသာစကားအတိုင်း ဖြစ်ပြီး အများအပြား ရွေးလျှင် ကီးတစ်ခုက ပြောင်းပေးသည်။ “Umlaut ကီးများ” က ä၊ ö၊ ü၊ ß အတွက် သီးသန့်ကီးများ ပေးသည်။ “အရွယ်အစား” က ကီးနှင့် စာလုံးများကို ကြီးစေသည်။ ထိတွေ့မျက်နှာပြင်တွင် “ကီး ပုံသဏ္ဌာန်” က ကီးပုံစံကို ပြောင်းသည်။ “အလိုအလျောက် စာလုံးကြီး” က ဝါကျတိုင်းကို စာလုံးကြီးဖြင့် စသည်။"
