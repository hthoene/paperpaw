home.plugin.name = ပင်မစာမျက်နှာ
home.plugin.description = စတင်စာမျက်နှာ: ဖတ်နေသော စာအုပ်နှင့် ကိရိယာများကဲ့သို့ ဝိဂျက်များပါ စာမျက်နှာများ။
home.plugin.how = "ပင်မစာမျက်နှာသည် ဖုန်းကဲ့သို့ ဝိဂျက်နှင့် ကိရိယာများ၏ ဇယားကွက်ပါ စာမျက်နှာများဖြင့် ဖွဲ့စည်းထားသည်။ အစတွင် နာရီ၊ ဖတ်နေသော စာအုပ်နှင့် မကြာသေးမီက ဖတ်ခဲ့သော စာအုပ်များ စာမျက်နှာတစ်ခုတွင် ရှိပြီး ကိရိယာအားလုံး နောက်စာမျက်နှာတွင် ရှိသည်။\n\nဖွင့်ရန် အရာတစ်ခုကို တို့ပါ။ စာမျက်နှာပြောင်းရန် ပွတ်ဆွဲပါ သို့မဟုတ် စာမျက်နှာ ခလုတ်များကို သုံးပါ။ ခလုတ်များသာ ရှိလျှင် မြှားခလုတ်များက အရာတစ်ခုမှ နောက်တစ်ခုသို့ ရွှေ့ပြီး “ရွေးရန်” က ဖွင့်သည်။\n\nပြန်စီရန် ပင်မစာမျက်နှာကို ဖိထားပါ၊ စာမျက်နှာအောက်ရှိ ခဲတံကို တို့ပါ သို့မဟုတ် မီနူးတွင် “ပင်မစာမျက်နှာ ပြင်ရန်” ကို ရွေးပါ။ ရွှေ့ရန် အရာများကို ဆွဲပါ သို့မဟုတ် ရွေးစရာများအတွက် တစ်ခုကို တို့ပါ (ခလုတ်ဖြင့်လည်း ရသည်)။ “ဝိဂျက် ထည့်ရန်” လည်း ထိုနေရာတွင် ရှိသည်။ ကော်လံနှင့် အတန်းများသည် ဆက်တင်များ › အသွင်အပြင် › ပင်မစာမျက်နှာ တွင် ရှိသည်။\n\nအလျားလိုက် လှည့်ထားသော မျက်နှာပြင်ပေါ်တွင် ပင်မစာမျက်နှာသည် တူညီသော အရာများကို ကော်လံ ပိုများစွာဖြင့် ပြပြီး စာမျက်နှာတစ်ခု ပြည့်မှ နောက်တစ်ခုသို့ သွားကာ ကတ်များသည် 110 mm ခန့်ထက် မကျယ်ပါ။ ဒေါင်လိုက်တွင် စီထားသည်များကို မပြောင်းပါ။ အလျားလိုက်တွင် စီလျှင် ထိုအပြင်အဆင်ကို ထိုဦးတည်ချက်အတွက် သီးခြား သိမ်းထားသည်: ဝိဂျက်အသစ်များကို နှစ်ခုစလုံးတွင် ထည့်သည်။ (ပြင်နေစဉ်) “ထည့်ရန်” ထဲရှိ “အလျားလိုက် အပြင်အဆင် ပြန်စရန်” က မူလအတိုင်း ပြန်ဖြစ်စေသည်။ ဦးတည်ချက်တစ်ခုတွင် ဝိဂျက် သို့မဟုတ် ကိရိယာကို ဖယ်ရှားခြင်းက အခြားတစ်ခုမှ မဖယ်ရှားပါ။"
