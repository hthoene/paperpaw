rules.plugin.name = စည်းမျဉ်းများ
rules.plugin.description = တစ်ခုခု ဖြစ်လာလျှင် တစ်ခုခု လုပ်သည်: ဥပမာ 22:00 တွင် ညမုဒ်။
rules.plugin.how = "စည်းမျဉ်းသည် တစ်ခုခု ဖြစ်လာသည့်အခါ အလိုအလျောက် တစ်ခုခု လုပ်သည်: နေ့တိုင်း 22:00 တွင် ညမုဒ် ဖွင့်ခြင်း၊ သို့မဟုတ် PaperPaw စတင်သည့်အခါ ကတ်တလောက်များ စင့်ခ်လုပ်ခြင်း။\n\nစည်းမျဉ်းများသည် ဆက်တင်များ၊ စိတ်ကြိုက်ပြင်ရန် အောက်တွင် ရှိသည်။ “စည်းမျဉ်း ထည့်ရန်” က “မည်သည့်အခါ” (PaperPaw စတင်ခြင်း၊ အချိန်၊ စာအုပ် ဖွင့်/ပိတ်ခြင်း၊ ဘက်ထရီ၊ အားသွင်းခြင်း၊ ခလုတ် စသည်) နှင့် “ထို့နောက် ဘာလုပ်မည်နည်း” (လုပ်ဆောင်ချက် လုပ်ရန်၊ ခလုတ် ဖွင့်/ပိတ်ရန်၊ ဂဏန်း သတ်မှတ်ရန်၊ စာတို ပြရန်) ကို မေးသည်။ စည်းမျဉ်းကို ခဏရပ်ရန် တို့ပါ။ “အချိန်နှစ်ခုကြား” ကဲ့သို့ အခြေအနေ ထည့်ရန် သို့မဟုတ် ဖယ်ရှားရန် ဖိထားပါ (ခလုတ်ဖြင့်ဆိုလျှင် ရွေးရန်ကို ဖိထား)။\n\nရွေးနိုင်သော လုပ်ဆောင်ချက်၊ ခလုတ်နှင့် ဂဏန်းများကို ပလပ်အင်အလိုက် စီထားသည်: ပလပ်အင်ကို ရွေးပြီး ၎င်းပေးသည့်အရာကို ရွေးပါ။ “နောက်သို့” က ပြန်ထွက်သည်။ “နောက်သို့” သို့မဟုတ် “နောက်စာမျက်နှာ” ကဲ့သို့ ပြထားသော မျက်နှာပြင်ပေါ်တွင် အလုပ်လုပ်သည့် လုပ်ဆောင်ချက်သည် ထိုနေရာတွင် နှိပ်သကဲ့သို့ လုပ်သည်။\n\nအချိန်များသည် မည်သည့်မျက်နှာပြင် ဖွင့်ထားသည်ဖြစ်စေ သက်ရောက်သည်။ တစ်ခုနှင့်တစ်ခု ပြန်ဖျက်နေသော စည်းမျဉ်းနှစ်ခုသည် အဆင့်အနည်းငယ်ပြီးနောက် ရပ်သည်။"
