koreader.plugin.name = အသားပေးချက် မျှဝေခြင်း
koreader.plugin.description = နှစ်ခုစလုံးတွင် ဖတ်သော စာအုပ်များအတွက် စာညှပ်နှင့် အသားပေးချက်များကို KOReader နှင့် မျှဝေသည်။
koreader.plugin.how = "ဤပလပ်အင်သည် စက်တစ်လုံးတည်းပေါ်တွင် သို့မဟုတ် စက်များကြား စင့်ခ်လုပ်ထားသော စာကြည့်တိုက်ဖိုင်တွဲတွင် PaperPaw နှင့် KOReader နှစ်ခုစလုံးဖြင့် ဖတ်သော စာအုပ်များ၏ စာညှပ်နှင့် အသားပေးချက်များကို KOReader နှင့် မျှဝေသည်။ သတ်မှတ်စရာ မရှိပါ။\n\nKOReader ဖွင့်ဖူးသော စာအုပ်ကို PaperPaw က ဖွင့်သည့်အခါနှင့် ၎င်း၏ စာညှပ် သို့မဟုတ် အသားပေးချက်များကို ပြောင်းသည့်အခါ စာအုပ်ဘေးရှိ KOReader ဒေတာမှ အသစ်များကို ယူပြီး ဤနေရာရှိ အသစ်များကို KOReader က စာအုပ်ကို နောက်တစ်ကြိမ် ဖွင့်ချိန်တွင် ယူနိုင်ရန် ထားပေးသည်။ ဖယ်ရှားထားသော အမှတ်အသားများနှင့် ပြောင်းထားသော မှတ်စုများလည်း ကူးသွားသည်။\n\nEPUB စာအုပ်များအတွက်သာ အလုပ်လုပ်သည်။ တစ်ဖက်၏ ဖိုင်ကို ဖတ်၍မရလျှင် ဖတ်၍ရသည်အထိ မည်သည့်ဘက်တွင်မျှ ဘာမျှ မပြောင်းပါ။"
koreader.removed-there = KOReader ၏ ဖိုင်တွင် အသားပေးချက် မရှိတော့ပါ။ ဤနေရာတွင်လည်း ဖယ်ရှားမလား။
koreader.removed-there.text = ၎င်းတို့ကို KOReader တွင် ဖယ်ရှားခဲ့ခြင်း သို့မဟုတ် ၎င်း၏ ဖိုင်သည် အခြားစက်မှ လာခြင်း ဖြစ်နိုင်သည်။ “ထားရန်” က ၎င်းတို့ကို ဤနေရာတွင် ထားပြီး KOReader သို့ ပြန်ပေးသည်။
