rules.plugin.description = کاتێک شتێک ڕوودەدات، شتێک دەکات: بۆ نموونە دۆخی شەو لە 22:00.
rules.plugin.how = "یاسا خۆکار شتێک دەکات کاتێک شتێک ڕوودەدات: دۆخی شەو هەموو ڕۆژێک لە 22:00 چالاک بکات، یان کاتالۆگەکان هاوکات بکات کاتێک PaperPaw دەستپێدەکات.\n\nیاساکان لە ڕێکخستنەکان لەژێر تایبەتکردن دەدۆزرێنەوە، وەک یاساکان. «زیادکردنی یاسا» دەپرسێت کەی؟ (PaperPaw دەستپێدەکات، کاتێکی ڕۆژ، کتێبێک دەکرێتەوە یان دادەخرێت، باتری، شەحنکردن، گۆڕەرێک و زیاتر) و دواتر چی؟ (کردارێک جێبەجێ بکات، گۆڕەرێک چالاک یان ناچالاک بکات، ژمارەیەک دابنێت، پەیامێک نیشان بدات). لە یاسایەک بدە بۆ ڕاگرتنی؛ ڕایبگرە (بە دوگمەکان، «هەڵبژاردن» ڕابگرە) بۆ مەرجێک وەک «لە نێوان دوو کاتی ڕۆژدا»، یان بۆ لابردنی.\n\nکردار و گۆڕەر و ژمارەکان بەپێی پلاگین دێن: پلاگینەکە هەڵبژێرە، پاشان ئەوەی دەیهێنێت؛ «گەڕانەوە» دووبارە لێی دەردەچێت. کردارێک کە لەسەر شاشەی نیشاندراو کار دەکات، وەک «گەڕانەوە» یان «لاپەڕەی دواتر»، ئەوە دەکات کە لەوێ دەیکرد ئەگەر دابگیرایە.\n\nکاتەکان بەسەر هەر شاشەیەکی کراوەدا دەچەسپێن. دوو یاسا کە یەکتر هەڵدەوەشێننەوە دوای چەند هەنگاوێک دەوەستن."
