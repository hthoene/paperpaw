pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = کاتژمێرێکی تەرکیز بە خولی کار و پشوو، ویجێت و ژمارەی ڕۆژانە.
pomodoro.plugin.how = "کاتژمێری Pomodoro: بە خولی تەرکیزکراو کار بکە، پاشان پشوو بدە. ڕێکخستنی ناوێت: 25 خولەک تەرکیز، 5 پشوو، و دوای چوار خول پشوویەکی درێژ 15 خولەکی.\n\nPomodoro لە مێنیوی ئامرازەکان بکەرەوە و «دەستپێکردن» بکوتە، یان ویجێتەکانی بخەرە شاشەی سەرەکی (شاشەی سەرەکی ڕابگرە، پاشان ویجێتێک زیاد بکە): «کاتژمێری Pomodoro» قۆناغ و خولەکە ماوەکان نیشان دەدات، «دەستپێکردن/وەستاندنی Pomodoro» دوگمەیەکە، و «Pomodoroی ئەمڕۆ» ئەو خولانە دەژمێرێت کە تەواوت کردوون، لەگەڵ ئامانجی ڕۆژانەت. لێدان لەسەر کاتژمێرەکە دەستی پێ دەکات یان دەیوەستێنێت؛ ڕایبگرە بۆ کردنەوەی شاشەی تەواو.\n\nکاتژمێرەکە هەر کار دەکات کاتێک شاشەکە بەجێ دەهێڵیت، و دوای دووبارە دەستپێکردنەوە بەپێی کاتژمێر بەردەوام دەبێت. کاتێک خوێنەرەکە دەخەوێت هیچ کار ناکات: قۆناغێک کە لەم ماوەیەدا تەواو بووە لە کاتی هەستانەوە ڕادەگەیەنرێت. ئاگادارکردنەوەیەک پێت دەڵێت کەی قۆناغێک تەواو دەبێت. بۆ پاراستنی باتری، کاتژمێرەکە تەنیا جارێک لە خولەکێکدا نوێ دەبێتەوە (لە دوایین خولەکدا هەر دە چرکە لەسەر شاشەی تەواو) و هەرگیز خوێنەرەکە بەخەبەر ناهێڵێتەوە.\n\nلە ڕێکخستنەکان، لە «Pomodoro»، درێژی و خولەکانی کۆمەڵەیەک دیاری دەکەیت و ئەوەی قۆناغی دواتر خۆی دەست پێ بکات. لە «زیاتر»: بریسکەی شاشە یان چاوترووکانی ڕووناکیی پێشەوە کاتێک قۆناغێک تەواو دەبێت، و ئامانجی ڕۆژانە."
