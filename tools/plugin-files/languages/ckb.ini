setup.plugin.description = ڕێنمایییەکی کورت بەناو گرنگترین ڕێکخستنەکان، لە یەکەم دەستپێکردندا.
setup.plugin.how = "ڕێکخستنی سەرەتا ڕێنمایییەکی کورتە بەناو گرنگترین ڕێکخستنەکان، کە جارێک نیشان دەدرێت، لە یەکەم دەستپێکردنی PaperPaw. هەر لاپەڕەیەک یەک شت دەپرسێت، وەک زمان، دوگمەکان، قەبارەی دەق، ناوچەی کات، Wi-Fi یان چەند پلاگینێک بۆ زیادکردن، و وەڵامێکی گونجاو پێشتر هەڵبژێردراوە، بۆیە «دواتر» هەمیشە دروستە. ئەو هەنگاوانەی ئەم ئامێرە پێویستی پێیان نییە دەرناکەون.\n\nلە دوگمەکان بدە، یان دوگمەکانی سەرەوە و خوارەوە و «هەڵبژاردن» بەکاربهێنە. «بازدان» لە یەکەم لاپەڕەدا یەکسەر لە ڕێکخستنی سەرەتا دەردەچێت. دوایین لاپەڕە دەڵێت کتێبەکانت لە کوێوە دێن.\n\nبۆ جارێکی تر دەستپێکردنی، ڕێکخستنەکان بکەرەوە و «ڕێکخستنی PaperPaw» هەڵبژێرە. هەموو ئەوەی لێرە هەڵدەبژێریت دەکرێت دواتر لە ڕێکخستنەکان بگۆڕدرێت."
