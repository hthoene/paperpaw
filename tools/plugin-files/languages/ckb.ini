sleep.plugin.description = پشیلەیەکی نووستوو، بەرگی کتێب، وێنەکانت یان پەیامێک نیشان دەدات لە کاتی خەوتنی ئامێرەکە.
sleep.plugin.how = "شاشەی خەو دیاری دەکات شاشەکە چی نیشان بدات لە کاتی خەوتنی ئامێرەکە. e-ink وێنەکە بێ کارەبا دەپارێزێت.\n\nلە ڕێکخستنەکان هەڵیبژێرە، لەژێر ئامێر، شاشەی خەو، لە «نیشاندان»: پشیلەیەکی نووستوو (بنەڕەت)، بەرگی کتێب، وێنەکانم، لۆگۆ و «خەوتوو»، ویجێتەکان، لاپەڕە وەک خۆی، یان لاپەڕە لەگەڵ وێنەیەک. «وێنەکانم» فایلەکانی بوخچەی وێنەکان یەک لەدوای یەک نیشان دەدات.\n\nئەگەر بەرگ یان وێنە نەبێت، پشیلەکە دەردەکەوێت. لەو شوێنانەی سیستەم خۆی شاشەی خەو دەکێشێت، ئەم ڕێکخستنانە شاراونەتەوە.\n\nشاشەی کوژاندنەوە، «نیشاندان لە کاتی کوژاندنەوە»، یەکجار دەکێشرێت کاتێک ئامێرەکە دەکوژێتەوە، لە مێنیوی دوگمەی هێزەوە یان دوای ماوەی «کوژاندنەوە دوای خەوتن» (نەک کاتێک باتریی کەم کارەبا دەبڕێت). وەک شاشەی خەوە مەگەر لۆگۆ و «کوژاوەتەوە»، پشیلە، بەرگ یان وێنەکانم هەڵبژێریت. پلاگینێکی تر دەتوانێت شاشەیەکی بۆ پێشکەش بکات.\n\nشاشەی دەستپێکردن و دووبارە دەستپێکردنەوە، «نیشاندان لە کاتی دەستپێکردن» و «نیشاندان لە کاتی دووبارە دەستپێکردنەوە»، هی خودی ئامێرەکەیە مەگەر پلاگینێکی تر شاشەیەکیان بۆ پێشکەش بکات. پلاگینەکان هێشتا کار ناکەن لە کاتی دەستپێکردنی ئامێرەکەدا: ئەو شاشەیەی بۆ دەستپێکردن هەڵبژێردراوە پێشوەخت دەکێشرێت، کاتێک ئامێرەکە دەکوژێتەوە یان دووبارە دەستپێدەکاتەوە، و لە دەستپێکردنی داهاتوو نیشان دەدرێت. شاشەیەک کە لە کاتی خۆیدا ئامادە نەبێت، یان وێنەیەکی زیانلێکەوتوو، جێ دەدات بە شاشەی خودی ئامێرەکە؛ ئامێرەکە لە هەموو حاڵەتێکدا دەکوژێتەوە یان دووبارە دەستپێدەکاتەوە."
