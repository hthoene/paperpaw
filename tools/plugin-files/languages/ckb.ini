smart-home.plugin.name = ماڵی زیرەک
smart-home.plugin.description = بەها و گۆڕەرەکانی Home Assistantی خۆت لەسەر پێشەکی و وەک ویجێتی شاشەی سەرەکی. لەگەڵ Home Assistant لە تۆڕی ماڵەوە کار دەکات.
smart-home.plugin.how = "ماڵی زیرەک بەها و گۆڕەرەکانی Home Assistantی خۆت نیشان دەدات: پلەی گەرمی، شێ، وزە، دەرگا و پەنجەرەکان، چرا، گۆڕەر و دیمەنەکان. لە ڕێی REST API لە تۆڕی ماڵەوەتدا قسە لەگەڵ سێرڤەرەکەت دەکات؛ هیچ خزمەتگوزارییەکی تر تێوەنەگلاوە.\n\nماڵی زیرەک لە مێنیوی ئامرازەکان بکەرەوە، پاشان «پەیوەندی»: ناونیشانی Home Assistantەکەت بنووسە (بۆ نموونە http://homeassistant.local:8123) و تۆکنێکی دەستگەیشتنی بەردەوام (لە خوارەوەی لاپەڕەی پرۆفایلی Home Assistantەکەت دروستی بکە). تۆکنەکە لەنێو وشە نهێنی و کلیلەکان دەپارێزرێت، هەرگیز لە فایلی ڕێکخستندا نا. http ی سادە تەنها بۆ ناونیشانەکانی تۆڕی ماڵەوەت بەکاردێت؛ بۆ سێرڤەرێک لە شوێنێکی تر لە ڕێکخستنەکان «سێرڤەر لە دەرەوەی تۆڕی ماڵەوە» چالاک بکە و https بە بڕوانامەیەکی دروست بەکاربهێنە.\n\n«هەڵبژاردنی ئامێرەکان» لیستێک دەکاتەوە لەوەی سێرڤەرەکەت هەیەتی: بە ناو یان ID بگەڕێ و ئامێرێک هەڵبژێرە بۆ نیشاندانی (دووبارە هەڵیبژێرە بۆ لابردنی). دەتوانیت ژوورێکی پێ بدەیت، کە لە پێشەکی و ویجێتەکانی ژوور کۆی دەکاتەوە. تا 24 ئامێر دەپارێزرێن. لە پێشەکی چرایەک، گۆڕەرێک یان دیمەنێک هەڵبژێرە بۆ گۆڕینی: ڕیزەکە وەڵامی سێرڤەر نیشان دەدات. سێنسەرێک کە هەڵیدەبژێریت دووبارە دەخوێندرێتەوە.\n\nویجێتەکان (شاشەی سەرەکی ڕابگرە، پاشان ویجێتێک زیاد بکە): «بەهای ماڵی زیرەک» یەک خوێندنەوە بە گەورەیی نیشان دەدات، «گرووپ» ئامێرەکانی ژوورێک لیست دەکات، «گۆڕەر» دوگمەیەکە بۆ چرایەک یان گۆڕەرێک، و «ژوور» کارتێکە لەگەڵ خوێندنەوە و گۆڕەرەکانی ژوورێک. ڕێکخستنەکانی هەر ویجێتێک دەڵێن کام ئامێر یان ژوور نیشان دەدات.\n\nماڵەکە دەخوێندرێتەوە کاتێک پێشەکی دەکەیتەوە، کاتێک داوای دەکەیت (ڕیزی «نوێکردنەوە ئێستا» یان لێدان لە ویجێتی بەها یان گرووپ)، کاتێک خوێنەر ڕادەپەڕێت لەو شوێنەی Wi-Fi پێشتر کارایە، و بەپێی خشتەی دیاریکراوت تا شەحنکەر پێوەیە. هەرگیز خۆی بێتەلەکە هەڵناکات و هەرگیز هەڵیناگرێت."
