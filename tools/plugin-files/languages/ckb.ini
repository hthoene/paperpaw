bluetooth.plugin.name = بلووتوس
bluetooth.plugin.description = ڕیمۆت و تەختەکلیل و سێنسەرەکان جووت دەکات و دەیانبەستێتەوە.
bluetooth.plugin.how = "بلووتوس ڕیمۆت و تەختەکلیل و سێنسەرەکان لەگەڵ خوێنەرەکە جووت دەکات، لەو ئامێرانەی بلووتوسیان هەیە (X4 Pro).\n\n«زیادکردنی ئامێر» بەدوای ئەوەی لە نزیکە دەگەڕێت؛ سەرەتا ئامێرەکە بخەرە دۆخی جووتکردن. هەڵیبژێرە، و لەسەر خوێنەرەکە پشتڕاستی بکەرەوە (ژمارەکە بەراورد بکە ئەگەر یەک پیشان درا). پاشان دوگمەکانی ڕیمۆتێک یان تەختەکلیلێک لاپەڕە هەڵدەدەنەوە و بە مێنیوەکاندا دەجوولێن؛ ئەوەی هەر دوگمەیەک دەیکات لە «کۆنتڕۆڵەکان» بیگۆڕە.\n\n«ڕیمۆتەکان» دەڵێت دوگمەکانیان کەی کار دەکەن: کاتێک لێرە هەڵکرابن، لە کاتی خوێندنەوە (کاتێک کتێبێک کراوەیە دەبەسترێت، باتری دەپارێزێت)، یان هەمیشە. دوگمەی مێنیو یان لێدانی درێژ لەسەر ئامێرێک لەبیری دەکات.\n\nسێنسەر بۆ پلاگینەکانە: هەڵیبکە بۆ ئەو پلاگینەی دەتوانێت بەکاری بهێنێت. بلووتوس هەر کاتێک هیچ شتێک بەکاری نەهێنێت دەکوژێتەوە."
