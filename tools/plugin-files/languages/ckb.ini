vocabulary.plugin.description = ئەو وشانەی لێیان دەگەڕێیت لەگەڵ ڕستەکانیان دەیانهێڵێتەوە، و فلاشکارت دووبارە دەکاتەوە بە دووبارەکردنەوەی ماوەدار، کە لەسەر مۆبایلەکەت دروست کراون.
vocabulary.plugin.how = "وشەکان ئەو وشانەی لە خوێندنەوەدا لێیان دەگەڕێیت بە ڕستەکەیانەوە دەهێڵێتەوە، بۆ پێداچوونەوە. لیستەکە لە ئامرازەکانە، نوێترین یەکەم؛ وشەیەک هەڵبژێرە بۆ دووبارە لێگەڕان. دوایین ڕیز، هەناردەکردن، بۆ بەرنامەی فلاشکارت وەک Anki پاشەکەوتیان دەکات. 2000 نوێترین وشە دەمێنن، کۆنترینەکان دەڕۆن؛ بۆ هێشتنەوەی هەموو، پێشتر هەناردەیان بکە.\n\nفلاشکارت، لە ئامرازەکانیش، بە دووبارەکردنەوەی ماوەدار تاقیت دەکاتەوە: دوای پیشاندانی وەڵام کارتەکە بە دووبارە، قورس، باش یان ئاسان هەڵدەسەنگێنیت، کە کاتی گەڕانەوەی دیاری دەکات. دەستە بە دەستکاریکردن بە مۆبایل دروست بکە: کۆدەکە بە مۆبایلێکی سەر هەمان Wi-Fi سکان بکە، کارت بنووسە یان زۆر بە یەکجار زیاد بکە: لە دەستەیەکدا زۆر کارت بە یەکجار هەڵبژێرە و فایلی CSV، TSV یان TXT هەڵبگرە (هەر دێڕێک کارتێک: پێشەوە، دواوە، نموونە؛ UTF-8)، لیستێک بلکێنە، یان دەستەی Anki بهێنە (.apkg، هەناردەکراو بە پشتگیری وەشانە کۆنەکانی Anki). \n\nیان کارتی SD: بۆ هەر دەستەیەک فایلی CSV، TSV، TXT یان Anki (.apkg، وەک سەرەوە) بخە بوخچەی Flashcards (Spanish.tsv دەبێتە دەستەی Spanish؛ دێڕەکان وەک سەرەوە؛ دێڕی یەکەم دەتوانێت ناوی ستوونەکان بێت: front، back، example). لە فلاشکارت کارتەکانی کارتی SD هەڵبژێرە، یان با بە کردنەوەی فلاشکارت خۆکار بێت. دەستەکان و فێربوونەکەت لە خوێنەرەکەدا دەمێنن؛ فایلی نوێ یان گۆڕاو تێکەڵی دەستەکەی دەکرێت: گۆڕینی دواوە یان نموونە کارتەکە دەگۆڕێت و پێشکەوتن دەمێنێت؛ گۆڕینی پێشەوە کارتێکی نوێیە و کۆنەکە سەرلەنوێ دەست پێدەکات (جیاکردنەوە بە دەقی پێشەوەیە؛ بۆشایی و پیتی گەورە ناژمێردرێن)؛ سڕینەوەی دێڕ کارتەکە ناسڕێتەوە (مەگەر «کارتە نەماوەکان لە فایلەکە» بۆ ئەو دەستەیە بکەیتە سڕینەوە: ئەوسا لە نوێکردنەوەی داهاتوو بە پێشکەوتنەکەیەوە بۆ هەمیشە دەسڕێتەوە؛ بە دێڕی نەخوێنراوەوە هیچ ناسڕێتەوە). پاشەکەوتکردن بۆ کارتەکە دەستەکە بە ژمارەی کارتەکان (ستوونی id) دەخاتە فایلەکەی، بۆیە پێشەوە لە کۆمپیوتەر دەگۆڕدرێت و فێربوون دەمێنێت؛ تەنها id، پێشەوە، دواوە و نموونە دەمێنن (ستوونی تر، تێبینی و ڕیزبەندی دێڕ نا)؛ بە دێڕی نەخوێنراوەوە پاشەکەوتکردن ڕەت دەکرێتەوە؛ یەکەم جار فایلی پێشوو کۆپی دەکرێتە _name.bak.tsv (پاشەکەوتی دواتر نایگۆڕێت). فایلی سەروو 4 MiB یان 20000 دێڕ ناخوێنرێتەوە؛ دەبێت CSV UTF-8 بێت، نەک UTF-16. یەکەم جار بوخچەکە بە تێبینییەکی ڕێنماییەوە دروست دەکرێت.\n\nلە ڕێکخستنەکان، لە خوێندنەوە، وشە لێگەڕاوەکان دەبن بە کارت هەر وشەیەکی لێگەڕاو دەخاتە دەستەی لێگەڕاو."
