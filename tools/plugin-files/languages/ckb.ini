tasks.plugin.name = ئەرکەکان
tasks.plugin.description = لیستی ئەرک لەگەڵ بەروار و گرنگی، لەسەر خوێنەر یان هاوکات لەگەڵ سێرڤەری CalDAV، لەگەڵ ویجێتی شاشەی سەرەکی.
tasks.plugin.how = "لیستی ئەرک لەسەر خوێنەرەکەت: ئەرک لەگەڵ بەرواری کۆتایی و گرنگی، کاتێک تەواو دەبن نیشان دەکرێن. بێ ڕێکخستن و بێ تۆڕ کار دەکەن، و دەکرێت لەگەڵ سێرڤەری CalDAV (Nextcloud، Radicale، Baïkal، Fastmail و ئەوانی تر) هاوکات بکرێن، بۆ ئەوەی هەمان لیست لەسەر مۆبایل و کۆمپیوتەرەکەشت بن.\n\n«ئەرکەکان» لە مێنیوی ئامرازەکان بکەرەوە. یەکەم ڕیز ناوی ئەو لیستە دەبات کە نیشان دەدرێت؛ هەڵیبژێرە بۆ لیستێکی تر، بۆ «ئەمڕۆ و دواکەوتوو» لە هەموو لیستەکان، بۆ لیستێکی نوێ، بۆ هاوکاتکردن، یان بۆ دانانی هەژمار. «زیادکردنی ئەرک» تەختەکلیل دەکاتەوە. «هەڵبژاردن» لەسەر ئەرکێک وەک تەواوکراو نیشانی دەکات (دووبارە: تەواو نەکراو). ئەرکێک ڕابگرە یان «مێنیو» بکوتە بۆ گۆڕینی ناونیشان، بەرواری کۆتایی (ئەمڕۆ، سبەینێ، دوای هەفتەیەک، یان بەروارێک کە دەینووسیت وەک 2026-12-24) یان گرنگییەکەی، یان بۆ لابردنی. ئەرکە کراوەکان یەکەمن، بەپێی ڕۆژ و پاشان گرنگی؛ تەواوکراوەکان هەفتەیەک لە کۆتایی دەمێننەوە (لە ڕێکخستنەکان لەژێر ئەرکەکان دادەنرێت)، پاشان لە خوێنەر دەڕۆن.\n\nویجێتەکانی شاشەی سەرەکی (شاشەی سەرەکی ڕابگرە، پاشان ویجێتێک زیاد بکە): «ئەرکەکانی ئەمڕۆ» ئەوە نیشان دەدات کە ئەمڕۆ کاتی بەسەرچووە یان دواکەوتووە، «لیستی ئەرک» یەک لیست نیشان دەدات، «ئەرکە کراوەکان» دەیانژمێرێت، و «ئەرکی دواتر» ئەوە نیشان دەدات کە دەبێت دواتر بکرێت. لێدان لە ئەرکێک لە ویجێتەکەدا نیشانی دەکات وەک تەواو؛ لێدان لە سەردێڕێک لیستەکان دەکاتەوە.\n\nبۆ هاوکاتکردن، «هەژماری CalDAV» لە ڕیزی لیستەکە هەڵبژێرە و ناونیشانی سێرڤەر، ناوی بەکارهێنەر و وشەی نهێنی بنووسە (باشترین وشەی نهێنیی ئەپ). ناونیشانی سێرڤەر بەسە، بۆ نموونە cloud.example.com/remote.php/dav؛ خوێنەر لیستەکانی ئەرکەکانت لەوێ دەدۆزێتەوە. هەموو لیستێکی ئەرکی سێرڤەر دەبێتە لیستێک لەسەر خوێنەر. خوێنەر هاوکات دەکات کاتێک «ئەرکەکان» دەکەیتەوە، کاتێک «هاوکاتکردن ئێستا» هەڵدەبژێریت، و کاتێک تۆڕ هەرچۆنێک بێت چالاکە؛ ئەوەی بێ تۆڕ دەیگۆڕیت چاوەڕێ دەکات و دواتر دەنێردرێت. ئەگەر ئەرکێک لەسەر خوێنەر و لە شوێنێکی تر لە هەمان کاتدا گۆڕدرا، وەشانی سێرڤەر وەردەگیرێت و هی تۆ وەک ئەرکێکی نوێ لەتەنیشتی دەمێنێتەوە، بۆ ئەوەی هیچ نەفەوتێت. تێبینی، ئاگادارکەرەوە و هەموو شتێکی تر کە ئەرکێک لەسەر سێرڤەر هەیەتی وەک خۆی دەمێنێتەوە. ئەرکە دووبارەبووەوەکان نیشان دەدرێن بەڵام لەو شوێنە دەگۆڕدرێن کە دروستت کردوون. خوێنەر تا 200 ئەرک لە 12 لیستدا دەگرێت."
