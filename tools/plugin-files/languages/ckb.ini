widgets.plugin.description = ویجێتی زۆر زیاتر بۆ شاشەی سەرەکی: کاتژمێر، ڕۆژژمێر، وتە، کتێب، تێبینی و زیاتر.
widgets.plugin.how = "پاکێتی ویجێت ویجێتی زۆر بۆ شاشەی سەرەکی زیاد دەکات: کاتژمێر (ئەنالۆگ، وشەیی، کاشی، جیهانی)، ڕۆژژمێر، ساڵی ڕابردوو تا ئێستا، ژمێرەی دواوە، قۆناغەکانی مانگ، و ڕۆژ و ڕێکەوت؛ وتەی ڕۆژ، تێبینی، کاری ئەنجامنەدراو، وێنە، سڵاو و لۆگۆی PaperPaw؛ و بۆ کتێب، ئێستا دەیخوێنیتەوە، پێشکەوتن، دواتر، زنجیرە، دڵخوازەکان، دیارکراوێک و کتێبخانە بە ژمارە. ویجێتی باتریش تێیدایە.\n\nبە دەستکاریکردنی شاشەی سەرەکی لە مێنیو (یان ڕاگرتنی شاشەی سەرەکی) زیادیان بکە، پاشان زیادکردنی ویجێت. هەریەکەیان ڕێکخستنی تایبەت بە خۆی هەیە، وەک چوارچێوە، قەبارە و ڕیزکردن. هەڵبژاردنی ویجێتێکی گۆڕاو، وەک وتەی ڕۆژ، دانەی دواتر پیشان دەدات. وتەکانی خۆت دەچنە quotes.txt لە .paperpaw/plugins/widgets لەسەر کارتەکە، هەر دێڕێک بە شێوەی دەق | نووسەر. ویجێتەکانی کات پێویستیان بە کاتژمێری ڕێکخراو هەیە؛ Wi-Fi ڕێکی دەخات."
