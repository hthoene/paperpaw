anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ئەو کارتانەی کاتیان هاتووە لە Anki لەسەر کۆمپیوتەرەکەت دەخوێنێتەوە و وەڵامەکانت دەنێرێتەوە، بە ڕێگەی زیادکراوی AnkiConnect.
anki.plugin.how = "Anki ڕێگەت دەدات ئەو کارتانەی کاتیان هاتووە لە Anki لەسەر کۆمپیوتەرەکەت لەسەر خوێنەرەکە بخوێنیتەوە، و وەڵامەکانت دەنێرێتەوە. زیادکراوی ئازادی AnkiConnect (کۆدی زیادکراو 2055492159) بەکار دێنێت و هەرگیز AnkiWeb. لە سەرەتادا ناچالاکە: لە فرۆشگای پلاگینەکان زیادی بکە.\n\nلەسەر کۆمپیوتەرەکە: AnkiConnect لە Anki دابمەزرێنە (Tools، Add-ons، Get Add-ons) و Anki دووبارە دەست پێ بکەرەوە. Anki دەبێت کراوە بێت لە کاتی هاوکاتکردن.\n\nبە شێوەی ئاسایی AnkiConnect تەنها وەڵامی ئەو کۆمپیوتەرە دەداتەوە کە لەسەری کار دەکات (127.0.0.1)، بۆیە خوێنەرەکە ناتوانێت پێی بگات. Tools، Add-ons، AnkiConnect، Config بکەرەوە و «webBindAddress» دابنێ بە «0.0.0.0» (گوێگرتن لە تۆڕی ماڵەوە). پۆرت، «webBindPort»، 8765ە مەگەر بیگۆڕیت. ئەگەر «apiKey»ێکت لەوێ دانا، هەمان کلیل لێرە بنووسە. دوای گۆڕینی ڕێکخستنەکە Anki دووبارە دەست پێ بکەرەوە، و ڕێگە بدە بە Anki لە دیواری ئاگری کۆمپیوتەرەکە ئەگەر پرسی. تەنها لەسەر تۆڕێک بەکاری بهێنە کە متمانەت پێی هەیە: هەر کەسێک لەسەری بێت دەتوانێت بگات بە AnkiConnect، بۆیە کلیلێک بیرۆکەیەکی باشە.\n\nلەسەر خوێنەرەکە: Anki لە ئامرازەکان بکەرەوە، پاشان ناونیشانی کۆمپیوتەرەکە (بۆ نموونە 192.168.1.20) لە «کۆمپیوتەر» بنووسە، پۆرتەکە ئەگەر 8765 نییە، و کلیلی API ئەگەر دانابێت. «دەستە»یەک هەڵبژێرە، یان بەتاڵی بهێڵەرەوە بۆ هەموو دەستەکان. پاشان «هاوکاتکردن لەگەڵ Anki» هەڵبژێرە، لەگەڵ Wi-Fi چالاک: سەرەتا وەڵامە چاوەڕێکراوەکانت دەنێردرێن، پاشان ئەو کارتانەی کاتیان هاتووە (و ژمارەی کارتە نوێیەکان کە دەتناوە) دێنرێن، لانی زۆر 50. «خوێندن» هەڵبژێرە بۆ ئەوەی بەسەریاندا بچیت، بەبێ تۆڕ: وەڵامەکە پیشان بدە و هەڵیبسەنگێنە بە «دووبارە»، «سەخت»، «باش» یان «ئاسان». وەڵامەکانت لەسەر خوێنەرەکە دەمێننەوە، بە بێ Wi-Fiیش، و لەگەڵ هاوکاتکردنی داهاتوو دەچن بۆ Anki. Anki بڕیار دەدات کارتێک کەی دەگەڕێتەوە: کارتێک کە بە «دووبارە» وەڵامت دایەوە لە هاوکاتکردنێکی دواتر دووبارە دێنرێت کاتێک Anki دەڵێت کاتی هاتووە.\n\n«هاوکاتکردن کاتێک Anki دەکرێتەوە»، لە ڕێکخستنەکان، هەر جارێک شاشەکە دەکەیتەوە هاوکات دەکات. هیچ شتێک تۆڕ بەکار ناهێنێت کاتێک دوگمەیەک دادەگریت."
