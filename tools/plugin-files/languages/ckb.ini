puzzles.plugin.description = سودۆکۆ، خاچەوشە و مەتەڵی شەترەنج، ئۆفلاین، لەگەڵ مەتەڵی ڕۆژ.
puzzles.plugin.how = "مەتەڵ بۆ شەمەندەفەر و ژووری چاوەڕوانی، هەموو ئۆفلاین: سودۆکۆ، خاچەوشە و مەتەڵی شەترەنج. «مەتەڵەکان» لە مێنیوی ئامرازەکان بکەرەوە، یان ویجێتی «مەتەڵی ڕۆژ» بخەرە شاشەی سەرەکی (شاشەی سەرەکی ڕابگرە، پاشان ویجێتێک زیاد بکە): نیشان دەدات سودۆکۆی ئەمڕۆ تا کوێ چووە، و لێدانێک دەیکاتەوە. سودۆکۆی ڕۆژ بە درێژایی ڕۆژ هەر یەکە.\n\nسودۆکۆ: چەپ و ڕاست نیشاندەر خانە خانە دەجوڵێنن، سەرەوە و خوارەوە (دوگمەکانی لاپەڕە) بە ڕیزێک. «هەڵبژاردن» ژمارەکان دەکاتەوە: یەکێک هەڵبژێرە و دووبارە «هەڵبژاردن» بۆ دانانی، یان «سڕینەوە» بۆ بەتاڵکردنی خانەکە. «هەڵبژاردن» (یان «مێنیو») ڕابگرە بۆ گەیشتن بە دوگمەکانی ژێر تەختەکە: «تێبینی» ژمارەکان دەکات بە نیشانەی قەڵەم، «پشکنین» خانە هەڵەکان نیشان دەکات، «پاشگەزبوونەوە» دوایین جووڵە دەگەڕێنێتەوە، «نوێ» مەتەڵێک لەو ئاستەی هەڵتبژاردووە دەست پێ دەکات (ئاسان، ناوەند، قورس). هەر مەتەڵێک تەنیا یەک چارەسەری هەیە. یارییەکە لە کاتی بەجێهێشتن دەپارێزرێت. لەسەر شاشەی دەستلێدان لە خانەیەک بدە.\n\nخاچەوشە: فایلی .puz (Across Lite) یان .ipuz بخەرە بوخچەی «puzzles» لەسەر کارتی بیرگە؛ هیچیان لەگەڵ نییە. لەسەر خشتەکە بجوڵێ، پاشان هەڵبژێرە بۆ نووسینی ئەو وشەیەی لە ژێر نیشاندەرە بە تەختەکلیل (هێڵی ژێرەوە خانەیەک بەتاڵ دەهێڵێتەوە). دوگمەکان لە نێوان ئاسۆیی و ستوونی دەگۆڕن، لیستی ئاماژەکان نیشان دەدەن، پیتەکان دەپشکنن و وشەکە ئاشکرا دەکەن. پیتەکان بۆ هەر فایلێک دەپارێزرێن. فایلی .puzی تێکەڵکراو ناکرێنەوە.\n\nمەتەڵی شەترەنج: کۆمەڵەیەکی بچووک لە بنکەدراوەی مەتەڵی Lichess (CC0). چەپ و ڕاست لە پارچەیەکەوە بۆ پارچەیەک دەپەڕن، ئەو پارچەیە هەڵبژێرە کە دەتەوێت بیجووڵێنیت، پاشان بە چەپ و ڕاست بەناو ئەو شوێنانەی دەتوانێت بچێت، و دووبارە هەڵبژێرە. جووڵەیەکی هەڵە دەگەڕێندرێتەوە. «ئاماژە» پارچەی جووڵاو نیشان دەکات، «دواتر» دەچێتە مەتەڵی دواتر.\n\nتەختەکە تەنیا ئەو خانانە دووبارە دەکێشێتەوە کە دەگۆڕێن. «ئامار» ئەو مەتەڵانە دەژمێرێت کە چارەسەرت کردوون."
