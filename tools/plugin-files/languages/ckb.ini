notes-vault.plugin.name = گەنجینەی تێبینی
notes-vault.plugin.description = بوخچەیەک لە تێبینی Markdown دەخوێنێتەوە بەپێی بوخچە و تاگ و دوایین گۆڕانکارییەکان، لەگەڵ ویجێت بۆ شاشەی سەرەکی. لەگەڵ گەنجینەکانی Obsidian کار دەکات.
notes-vault.plugin.how = "«گەنجینەی تێبینی» بوخچەیەک لە تێبینی Markdown دەخوێنێتەوە (فایلی سادەی .md، وەک ئەپەکانی تێبینی دایدەنێن). لەگەڵ گەنجینەکانی Obsidian کار دەکات.\n\nبوخچەی گەنجینەکە لە ڕێکخستنەکان هەڵبژێرە، یان لە لاپەڕەی گەنجینەکە لە ئامرازەکان. ئینجا لاپەڕەکە بوخچەکان وەک لەسەر کارتەکەن، دوایین تێبینییە گۆڕاوەکان، تاگەکان و گەڕانێک لە ناونیشانی تێبینییەکان پێشکەش دەکات.\n\nیەکەم جار، گەنجینەکە لە پشتەوە پێڕست دەکرێت تا لاپەڕەکەی کراوەیە؛ گەنجینەیەک بە هەزاران تێبینی چەند خولەکێک دەخایەنێت، پاشان یەکسەر دەکرێتەوە. پێڕستەکە لەسەر کارتەکە دەپارێزرێت و دووبارە دروست دەکرێتەوە کاتێک لاپەڕەی گەنجینەکە دوای چەند کاتژمێرێک دەکرێتەوە، یان کاتێک «نوێکردنەوە» هەڵدەبژێریت.\n\nتێبینییەک لە خوێنەر دەکرێتەوە. بەستەرەکان بۆ تێبینییەکانی تر ([[تێبینی]]، [[تێبینی|وشە]]، [[تێبینی#ناونیشان]]) بە ناوی تێبینییەکە لە هەر شوێنێکی گەنجینەکە دەدۆزرێنەوە؛ شوێنکەوتنی یەکێکیان ئەو تێبینییە دەکاتەوە و «گەڕانەوە» دەگەڕێتەوە بۆ تێبینییەکەی پێشوو.\n\nهیچ شتێک لە گەنجینەکەدا هەرگیز ناگۆڕدرێت. ویجێتەکانی شاشەی سەرەکی (تێبینییە تازەکان، تێبینییەکی چەسپاو، تێبینیی ڕۆژ، تێبینییەکی هەڕەمەکی، تاگەکان، گەڕان) لە دەستکاریکەری شاشەی سەرەکی زیاد دەکرێن. ویجێتێک دەتوانێت تێبینییەکانی تەنیا لە یەک بوخچە وەربگرێت: ڕێڕەوی بوخچەکە لە ڕەگی کارتەکەوە (بۆ نموونە Notes/Work) لە ڕێکخستنەکانی ویجێتەکە بنووسە؛ ئەگەر بەتاڵ بێت، هەموو تێبینییەکانی گەنجینەکە وەردەگرێت."
