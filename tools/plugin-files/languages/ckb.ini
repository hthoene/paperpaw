transfer.plugin.description = کتێب و فایلی تر لە وێبگەڕێکی هەمان تۆڕەوە بخەرە سەر ئامێرەکە.
transfer.plugin.how = "گواستنەوە بە Wi-Fi کتێب و فایلی تر لە وێبگەڕێکی هەمان تۆڕەوە دەخاتە سەر ئامێرەکە، بێ کەیبڵ و بێ ئەپ. دەتوانیت فایلیش بهێنیت، بوخچە دروست بکەیت و بسڕیتەوە.\n\nلە ئامرازەکانەوە بیکەرەوە. شاشەکە ناونیشانێک نیشان دەدات وەک دەق و وەک کۆدی QR: لە وێبگەڕێک لەسەر مۆبایل یان کۆمپیوتەر بیکەرەوە، یان کۆدەکە سکان بکە. ناونیشانەکە کلیلێکی تێدایە کە هەر جارێک نوێ دروست دەبێت، بۆیە کەسانی تری تۆڕەکە ناتوانن بگەنە فایلەکانت. گواستنەوەکە کار دەکات تا شاشەکە کراوەیە.\n\nلەو شوێنەی PaperPaw خۆی Wi-Fi بەڕێوە دەبات، وەک لە X4، «بێ ڕاوتەر» لە خوارەوە تۆڕێکی تایبەت بە ئامێرەکە دەکاتەوە، کە مۆبایل بە سکانکردنی کۆدێک بەشدار دەبێت."
