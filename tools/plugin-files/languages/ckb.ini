notes-overview.plugin.description = نیشانە و دیارکراوەکانی هەموو کتێبەکان لە یەک لیستدا، و هەناردەکردن وەک My Clippings.txt.
notes-overview.plugin.how = "«هەموو تێبینییەکان» هەر کتێبێک لیست دەکات کە تێیدا نیشانە یان دیارکراوێکت دروست کردووە، لەگەڵ ژمارەکەیان. لە ئامرازەکان بیکەرەوە. کتێبێک هەڵبژێرە بۆ بینینی تێبینییەکانی، و تێبینییەک بۆ کردنەوەی کتێبەکە لەو شوێنەدا.\n\nلە کۆتایی لیستەکە، «هەناردەکردن وەک My Clippings.txt» هەموو تێبینییەکان لە یەک فایلدا دەنووسێت، لە بوخچەی Exports لە تەنیشت کتێبخانە، بەو شێوەیەی Kindle بەکاری دەهێنێت (UTF-8). ئەپەکانی My Clippings.txt ی Kindle دەخوێننەوە دەتوانن بیخوێننەوە. تێبینییەک لەسەر دیارکراوێک بەشێکی تایبەتی خۆیەتی، وەک لە Kindle. لەبەر ئەوەی کتێبێک لێرە شوێنی Kindleی نییە، «location» ئەوەندەی لە کتێبەکەدا چووییتە پێشەوە بە سەدی. فایلەکە هەر جارێک دووبارە دەنووسرێتەوە؛ ئەوەی پێشوو دەگۆڕێتەوە."
