joplin.newer-target = Joplin تێبینییەکان لەوێ بە شێوازێکی نوێتر دەپارێزێت لەوەی ئەم PaperPawە دەیناسێت. PaperPaw نوێ بکەرەوە بۆ ناردنیان.
joplin.older-target = Joplin تێبینییەکان لەوێ بە شێوازێکی کۆنتر دەپارێزێت. Joplin بکەرەوە بۆ بەرزکردنەوەی، پاشان دووبارە بینێرە.
joplin.upgrading = Joplin ئێستا تێبینییەکانی لەوێ نوێ دەکاتەوە. چاوەڕێ دەکەن و دواتر دەنێردرێن.
joplin.no-memory = بیرگە بەس نییە بۆ ناردنی تێبینییەکان. دووبارە دەستپێبکەرەوە و جارێکی تر هەوڵ بدە.
keyboard.plugin.name = تەختەکلیل
keyboard.plugin.description = دەق لەسەر شاشە دەنووسێت، بە دەستلێدان یان بە دوگمەکان.
keyboard.plugin.how = "تەختەکلیلەکە هەر کاتێک شتێک دەقی بوێت دەکرێتەوە: گەڕانێک، وشەیەکی نهێنی، تێبینییەک یان ڕێکخستنێک. بە دەستلێدان و بە تەنیا دوگمەکانیش کار دەکات.\n\nبە دوگمەکان، چەپ و ڕاست بەناو ڕیزێکدا دەچن، دوگمەکانی لاپەڕە لە ڕیزێکەوە بۆ ڕیزێکی تر، «هەڵبژاردن» کلیلەکە دەکوتێت و «گەڕانەوە» هەڵی دەوەشێنێتەوە؛ چەپ و ڕاست بە دەوری ڕیزەکەدا دەسوڕێنەوە و سەرەوە و خوارەوە لە ستوونەکەتدا دەمێننەوە. «Shift» پیتی دواتر گەورە دەکات؛ دووجار بیکوتە بۆ هەموو پیتەکان گەورە بن، و جارێکی تر بۆ وەستاندنی. پیتێک ڕابگرە (بە دوگمەکان: «هەڵبژاردن» لەسەری ڕابگرە) بۆ شێوە گەورەکەی، کە یەکسەر هەڵدەبژێردرێت، و بۆ دەنگنیشانەکان وەک é و è. «باشە» تەواوی دەکات؛ بە دوگمەکان، «گەڕانەوە» ڕابگرە بۆ تەواوکردن لە هەر شوێنێکەوە («گەڕانەوە» بە تەنیا هەڵی دەوەشێنێتەوە)، یان «هەڵبژاردن» ڕابگرە لەسەر کلیلێک کە پیت نییە. «لکاندن» دەقی کلیپبۆرد دەخاتە ناوەوە و «مۆبایل»، ئەگەر پێشکەش کرابێت، وا دەکات لەبری ئەوە لەسەر مۆبایلەکەت بنووسیت.\n\nلە ڕێکخستنەکان، لە ئامێر، تەختەکلیل: «ڕیزبەندی تەختەکلیل» ڕیزبەندییەکان هەڵدەبژێرێت. بە شێوەی بنەڕەتی زمانی مێنیوەکان دەگرێتەوە؛ ئەگەر چەند دانەیەک هەبێت، کلیلێک لە نێوانیاندا دەگۆڕێت. «کلیلی ئومڵاوت» لەبری ئەوە کلیلی تایبەت بە ä، ö، ü و ß دەدات. «قەبارە» کلیل و پیتەکان گەورەتر دەکات؛ بە تەنیا دوگمەکان، ڕیزەکان هەر ڕیزەکانی تەختەکلیلی کۆمپیوتەرن. لەسەر شاشەی دەستلێدان، «شێوەی کلیل» شێوەی کلیلەکان دەگۆڕێت. «پیتی گەورەی خۆکار» هەر دەستپێکی ڕستەیەک بە پیتی گەورە دەکات."
