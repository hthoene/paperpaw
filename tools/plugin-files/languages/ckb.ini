reading-goal.plugin.name = ئامانجی خوێندنەوە
reading-goal.plugin.description = خولەکەکانی خوێندنەوە لە ڕۆژێکدا، و پشیلەیەک لەسەر شاشەی سەرەکی کە هەستی بەپێی خوێندنەوەی ئەمڕۆ دەگۆڕێت.
reading-goal.plugin.how = "پشیلەیەک لەسەر شاشەی سەرەکیت نیشان دەدات خوێندنەوەی ئەمڕۆ چۆنە: غەمگین تا هێشتا نەخوێندبێتەوە، ئاسایی دوای کەمێک، ڕازی لە نیوەی ئامانجی ڕۆژانەت، دڵخۆش کاتێک گەیشتیتە ئامانجەکە.\n\nویجێتی پشیلەی خوێندنەوە بخە سەر شاشەی سەرەکی (شاشەی سەرەکی ڕابگرە، پاشان ویجێتێک زیاد بکە)، یان «پشیلەی خوێندنەوەی ئەمڕۆ» وەک شاشەی خەو هەڵبژێرە. لێدان لە پشیلەکە ئامانجی ڕۆژانە دەکاتەوە؛ ئەمە ئامانجی ئاماری خوێندنەوەیە، کە خولەکەکانی خوێندنەوەت دەژمێرێت.\n\nلە ڕێکخستنەکان، لەژێر خوێندنەوە، «ڕازی لە» و «دڵخۆش لە» دیاری دەکەن لە چ ڕێژەیەکی ئامانجەوە پشیلەکە ڕازی یان دڵخۆشە، و «وێنەی خۆت» بوخچەیەک لە وێنەکان (sad و meh و content و happy) کە لە جیاتی پشیلەکان نیشان دەدرێن. وێنەکان فایلی PNG یان JPEG ن؛ بێ بوخچە پشیلەکان نیشان دەدرێن."
