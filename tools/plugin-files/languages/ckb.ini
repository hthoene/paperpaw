format-docx.plugin.name = بەڵگەنامەی DOCX
format-docx.plugin.description = فایلی .docx دەکاتەوە، وەک Word و بەرنامەکانی تر پاشەکەوتیان دەکەن.
format-docx.plugin.how = "بەڵگەنامەی .docx وەک کتێب دەکاتەوە: سەردێڕ لەگەڵ ناوەڕۆک، لیست، خشتە، ئەستوور و لار، بەستەر و وێنە (JPEG، PNG، GIF).\n\nفایلەکان لە بوخچەی کتێبخانە دابنێ و لە کتێبخانەوە بیانکەرەوە. ناونیشان و نووسەر لە تایبەتمەندییەکانی بەڵگەنامەکەوە دێن. پەراوێز، سەرپەڕە و پێپەڕە، و تێبینییەکان پیشان نادرێن."
format-docx.title = بەڵگەنامەی DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = کتێبی EPUB دەکاتەوە لەگەڵ شێواز و ناوەڕۆک و وێنەکانیان.
format-epub.plugin.how = "کتێبی EPUB لە کتێبخانەوە وەک هەر کتێبێکی تر دەکرێنەوە، لەگەڵ ناوەڕۆک و وێنە و شێوازی بڵاوکەرەوە. لاپەڕەی وێب (HTML)، Markdown، FictionBook (.fb2) و ئەرشیفی کتێبی کۆمیکس (.cbz) بە هەمان شێوە دەکرێنەوە، هەریەکە وەک پلاگینێکی تایبەت بە خۆی.\n\nبەشێک یەکەم جار کە دەیکەیتەوە دەگۆڕدرێت و لە کاشی پلاگینەکە دەپارێزرێت، بۆیە دواتر خێراترە و کتێبی گەورە لەسەر ئامێری بچووک کار دەکەن. ناوەڕۆک لەژێر «ناوەڕۆک» لە مێنیوی خوێندنەوە بدۆزەرەوە. ئایا شێوازی خودی کتێبەکە دەگیرێت ئەو ڕێکخستنەیە «ڕازاندنەوەی بڵاوکەرەوە»، لەژێر خوێندنەوە."
format-epub.title = کتێبی ئەلیکترۆنی EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = کتێبی FictionBook (.fb2، هەروەها زیپکراو) دەکاتەوە.
format-fb2.plugin.how = "کتێبی FictionBook (.fb2) دەکاتەوە، باو بۆ کتێبی ڕووسی و ئەوانی تر، هەروەها زیپکراو (.fb2.zip)، لەگەڵ ناونیشان و نووسەر و بەرگ و بەشەکانیان.\n\nلە بوخچەی کتێبخانە دایانبنێ؛ لە کتێبخانە پیشان دەدرێن و وەک هەر کتێبێکی تر دەکرێنەوە."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = لاپەڕەی وێبی پاشەکەوتکراو وەک فایل دەکاتەوە، تەنها ئەوەی دەبێت بخوێنرێتەوە پیشان دەدات.
format-html.plugin.how = "لاپەڕەی وێبی پاشەکەوتکراو وەک فایل (.html، .htm، .xhtml) وەک کتێب دەکاتەوە: تەنها ئەوەی لەوێیە بۆ خوێندنەوە، بەبێ مێنیو و ڕیکلام و هاوشێوەکانی لە دەوریدا.\n\nفایلەکە لە بوخچەی کتێبخانە دابنێ و وەک هەر کتێبێک لە کتێبخانەوە بیکەرەوە. بەستەرەکانی ناو لاپەڕەکە کار دەکەن؛ وێنەکان لەو شوێنەدا پیشان دەدرێن کە لە فایلەکەدان."
format-html.title = لاپەڕەی وێب (HTML)
format-images.plugin.name = وێنەکان
format-images.plugin.description = وێنە (.jpg، .png، .gif) وەک کتێب دەکاتەوە، هەر یەکێک لاپەڕەیەک.
format-images.plugin.how = "وێنەکان (.jpg، .png، .gif) لە کتێبخانەوە وەک کتێب دەکرێنەوە، یەک وێنە بۆ هەر لاپەڕەیەک، بەپێی شاشە.\n\nبۆ خوێندنەوەی بوخچەیەکی تەواو لە وێنە، یەکەم وێنەکەی بکەرەوە: ئەو وێنانەی دوای لە بوخچەکەدا دەکەونەوە، بەپێی ڕیزبەندی ناوەکانیان (2 پێش 10). وێنەیەکی دواتر لە بوخچەکە لەوێوە دەست پێ دەکات؛ شوێنی هەر یەکێک جیا دەپارێزرێت. بوخچەیەک تا 300 وێنە لەو وێنەیەوە دەخوێنرێتەوە کە دەیکەیتەوە.\n\nفایلێک کە وێنە نییە، یان زۆر گەورەیە، ناوەکەی پیشان دەدات. بۆ کتێبێکی وێنەی زۆر کە ناونیشانی تایبەت بە خۆی هەیە، ئەرشیفی کتێبی کۆمیکس (.cbz) شێوەی باشترە."
format-images.title = وێنە
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = فایلە Markdownەکان (.md) دەکاتەوە، وەک تێبینییەکان.
format-markdown.plugin.how = "فایلە Markdownەکان (.md)، وەک تێبینییەکان، وەک کتێب دەکاتەوە: ناونیشان و لیست و وتەهێنان و جەختکردنەوە وەک ئەوەی مەبەستە نیشان دەدرێن، نەک وەک هێما.\n\nفایلەکان بخەرە بوخچەی کتێبخانە و لە کتێبخانەوە بیانکەرەوە. یەکەم ناونیشان دەبێتە ناونیشانی کتێبەکە؛ ئەو وێنانەی لە تەنیشت فایلەکەن لەو شوێنە دەردەکەون کە دەقەکە ناویان دەهێنێت."
format-markdown.title = Markdown
format-mobi.plugin.name = کتێبی MOBI
format-mobi.plugin.description = فایلی .mobi و .azw بێ DRM دەکاتەوە.
format-mobi.plugin.how = "کتێبی MOBI (.mobi، .azw) وەک هەر کتێبێک لە کتێبخانەوە دەکرێنەوە و ڕێکخستنیان ناوێت. ناونیشان و نووسەر و زمان و بەرگ لە خودی کتێبەکە وەردەگیرێن و لیستی ناوەڕۆک لە ناونیشانەکانیەوە دروست دەکرێت.\n\nکتێبەکە لە یەکەم جاری کردنەوەیدا دەگۆڕدرێت، کە بۆ کتێبێکی درێژ چەند چرکەیەک دەخایەنێت؛ دواتر یەکسەر دەکرێتەوە. دەق و ناونیشان و ئەستوور و لار و بەستەر و وێنە نیشان دەدرێن.\n\nکتێبی DRMدار (زۆربەی ئەوانەی لە فرۆشگا کڕدراون) ناکرێنەوە، هەروەها کتێبی پەستێنراو بە Huffman یان بە شێوەی نوێتری KF8 (.azw3): PaperPaw لە کاتی کردنەوەیدا ئەمە دەڵێت. کۆپییەک بە شێوەی EPUB، کە بە ئامرازێکی وەک Calibre دروست کرابێت، هەمیشە دەکرێتەوە."
format-mobi.title = کتێبی MOBI
format-rtf.plugin.name = بەڵگەنامەی RTF
format-rtf.plugin.description = فایلی .rtf وەک کتێب دەکاتەوە.
format-rtf.title = بەڵگەنامەی RTF
format-txt.plugin.name = دەقی سادە
format-txt.plugin.description = فایلە دەقییە سادەکان (.txt) دەکاتەوە.
format-txt.plugin.how = "فایلە دەقییە سادەکان (.txt) وەک هەر کتێبێک لە کتێبخانەوە دەکرێنەوە و ڕێکخستنیان ناوێت. پلاگینەکە دەقی UTF-8 و UTF-16 و Windows-1252 دەخوێنێتەوە و خۆی کۆدکردنەکە دەدۆزێتەوە.\n\nبڕگەکان لە دوای هێڵە بەتاڵەکانی فایلەکە دێن؛ ئەگەر فایلێک هیچی نەبێت، هەر دێڕێک بڕگەیەکە. لە فایلەکانی Project Gutenberg دەقی مۆڵەت لە سەرەتا و کۆتایی فڕێ دەدرێت و ناونیشان و نووسەر لە سەرەتای فایلەکە وەردەگیرێن.\n\nفایلەکە هەرگیز بە تەواوی بار ناکرێت، بۆیە دەقی زۆر گەورەش لەسەر ئامێری بچووک دەکرێنەوە."
format-txt.title = دەقی سادە
format-xtc.plugin.name = XTC
format-xtc.plugin.description = کتێبی XTC و XTCH دەکاتەوە، لاپەڕە ئامادەکراوەکانی خوێنەرەکانی Xteink.
format-xtc.plugin.how = "فایلی XTC و XTCH کتێبن کە لاپەڕەکانیان پێشتر وەک وێنە دروست کراون، بە گۆڕەرەکانی خوێنەرەکانی Xteink. وەک هەر کتێبێک لە کتێبخانەوە دەکرێنەوە.\n\nلەبەر ئەوەی هەر لاپەڕەیەک وێنەیەکی جێگیرە، قەبارەی دەق ناگۆڕدرێت و فۆنتی تر ناخرێتە سەر. لاپەڕەکان ڕەش و سپین یان چوار ڕەنگی خۆڵەمێشییان هەیە. هەر لاپەڕەیەک کاتێک نیشان دەدرێت ئامادە دەکرێت، بۆیە بیرگەیەکی کەم دەوێت، لەسەر X4 یش.\n\nناونیشان و نووسەر و بەشەکان لە فایلەکە وەردەگیرێن ئەگەر هەبێتن."
format-xtc.title = لاپەڕەکانی XTC
help.plugin.name = ئاماژەکان
help.plugin.description = لە یەکەم جاری کردنەوەی شاشەیەکدا نیشان دەدات کە کۆنتڕۆڵەکانی چی دەکەن.
help.plugin.how = "لە یەکەم جاری کردنەوەی شاشەیەکدا تێبینییەکی کورت لەسەری دەڵێت کە کۆنتڕۆڵەکانی چی دەکەن: ئەو بەشانەی شاشەکە کە لێدانیان کاریگەرە، بە چوارچێوە، و ئەوەی دوگمەکان دەیکەن.\n\nلێدانێک یان هەر دوگمەیەک تێبینییەکە دادەخات و بۆ ئەو شاشەیە جارێکی تر نایەتەوە. «هیچ ئاماژەیەکی تر» هەموویان ناچالاک دەکات.\n\nلە ڕێکخستنەکان، لە بەشی سیستەم، «ئاماژەکان» چالاک یان ناچالاکیان دەکات و «پیشاندانی دووبارەی ئاماژەکان» وا دەکات تێبینی هەر شاشەیەک جارێکی تر نیشان بدرێت."
help.title = لێرە چۆن کار دەکات
