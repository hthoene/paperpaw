calendar.plugin.name = ڕۆژژمێر
calendar.plugin.description = ڕۆژژمێرەکانت لەسەر خوێنەر: بینینی ڕۆژەڤ و ڕۆژ و هەفتە و مانگ لە CalDAV و iCal و فایلەکانەوە، ڕۆژی لەدایکبوون لە پەیوەندییەکانەوە، ویجێتی شاشەی سەرەکی و شاشەی خەو.
calendar.plugin.how = "ڕۆژژمێرەکانت لەسەر خوێنەر: ڕۆژەڤی ڕۆژانی داهاتوو، ڕۆژ، هەفتە و مانگ، لە ڕۆژژمێری CalDAV (Nextcloud، Radicale، Baïkal، Fastmail و تر)، ناونیشانی iCal (.ics، webcal://)، فایلی سەر کارت و ڕۆژی لەدایکبوون و ساڵیادی پەیوەندییەکانت (CardDAV). تەنها دەخوێندرێنەوە، هەرگیز ناگۆڕدرێن.\n\nڕۆژژمێر لە ئامرازەکان بکەرەوە. ڕیزی یەکەم ناوی بینینەکەیە؛ هەڵبژاردنی، یان ڕاگرتنی هەر ڕیزێک یان مێنیو، دەتباتە ڕۆژەڤ، ڕۆژ، هەفتە، مانگ و ڕۆژی لەدایکبوون، زیادکردنی ڕۆژژمێر یان هاوکاتکردن. لە ڕۆژ و هەفتە دوو ڕیزی یەکەم و دوگمەکانی لاپەڕە دەچنە پێشوو و دواتر؛ لە مانگ تیرەکان ڕۆژ و دوگمەکانی لاپەڕە مانگ دەجوڵێنن، و هەڵبژاردن ڕۆژەکە دەکاتەوە. هەڵبژاردن لەسەر ڕووداو هەمووی پیشان دەدات: کەی، لە کوێ، کام ڕۆژژمێر، چۆن دووبارە دەبێتەوە. گەڕانەوە هەنگاوێک دەگەڕێتەوە.\n\nڕۆژژمێر لە «ڕۆژژمێرەکان» زیاد بکە (مێنیو، یان ڕۆژژمێر لە ڕێکخستنەکان). جۆر: هەژماری CalDAV (ناونیشانی سێرڤەر بەسە، وەک cloud.example.com/remote.php/dav؛ هەموو ڕۆژژمێرێکی ڕووداودار پیشان دەدرێت)، ناونیشانی iCal (ڕۆژژمێری .ics ی بڵاوکراو)، فایل لەسەر کارت، یان پەیوەندییەکان (کتێبی ناونیشانی CardDAV: ڕۆژی لەدایکبوون و ساڵیادەکانی تێیدا). ناونیشان و ناو بنووسە، بۆ هەژمار ناوی بەکارهێنەر و وشەی نهێنیش (باشتر هی ئەپ؛ لەگەڵ وشە نهێنییەکانی خوێنەر دەپارێزرێت). هەر ڕۆژژمێرێک نیشانەیەکی گۆڕاوی هەیە بۆ جیاکردنەوە (خاڵ، بازنە، خاڵی خۆڵەمێشی، چوارگۆشە)؛ تا شەش ڕۆژژمێر.\n\nڕووداوی دووبارە (ڕۆژانە، هەفتانە، مانگانە، ساڵانە، بە ڕۆژی هەفتە، ژمارە، ڕێکەوتی کۆتایی و ڕۆژی لابراو)، هەموو ڕۆژ و لە ناوچەی کاتی تر بە کاتژمێری خوێنەرەکە پیشان دەدرێن. ڕووداوی شەست ڕۆژ پێش و دوای ئەمڕۆ دەمێنن، لانی زۆر 240، و بێ تۆڕ پیشان دەدرێن. یاسای نەناسراو ڕووداوەکەی یەک جار پیشان دەدات.\n\nڕۆژژمێرەکان دەخوێندرێنەوە بە کردنەوەی ڕۆژژمێر (لانی زۆر هەر پێنج خولەک جارێک)، بە «ئێستا هاوکاتکردن»، و بەپێی ڕێکخستنی ڕۆژژمێر، کاتێک تۆڕ هەرچۆنێک بێت چالاکە یان شەحنکردن دەست پێ دەکات. بێتەل تەنها بۆ «ئێستا هاوکاتکردن» هەڵدەکرێت.\n\nویجێتی شاشەی سەرەکی (شاشەکە ڕابگرە و ویجێت زیاد بکە): «ئەمڕۆ» ڕێکەوت و پلانی ڕۆژ، «ڕووداوی داهاتوو» ڕووداوی دواتر، «ڕۆژەڤ» ڕۆژانی داهاتوو، «مانگ» مانگ بە خاڵ لە ژێر ڕۆژە ڕووداودارەکان، «ڕۆژی لەدایکبوون» ئەوانەی داهاتوو. لێدان لە ڕووداو یان ڕۆژێکی مانگ دەیکاتەوە. شاشەی خەو ڕۆژەڤی ئەمڕۆ پیشان دەدات ئەگەر لە ڕێکخستنەکان لەژێر شاشەی خەو «ڕۆژژمێر» هەڵبژێریت."
