menu-editor.plugin.name = دەستکاریکەری مێنیو
menu-editor.plugin.description = بەشەکانی هەموو مێنیوەکان ڕیز دەکاتەوە، دەیانسڕێتەوە و زیادیان دەکات.
menu-editor.plugin.how = "دەستکاریکەری مێنیو ئەوە دەگۆڕێت کە مێنیوەکان چییان تێدایە: بەشەکان بۆ سەرەوە یان خوارەوە بجوڵێنە، بیانسڕەوە، یان نوێ زیاد بکە.\n\nلە ڕێکخستنەکان، لە تایبەتکردن، وەک «تایبەتکردنی مێنیوەکان» دەیدۆزیتەوە. مێنیوێک هەڵبژێرە، پاشان بەشێک بۆ جوڵاندن یان سڕینەوەی؛ «زیادکردنی بەش» یەکێکی نوێ دەخاتە ناوەوە. گۆڕانکارییەکان یەکسەر کاریگەرن. «ڕێکخستنەوەی ئەم مێنیوە» مێنیوێک دەگەڕێنێتەوە بۆ ئەوەی پلاگینەکانی پێناسەیان کردووە، «ڕێکخستنەوەی هەموو مێنیوەکان» بۆ هەموویان ئەمە دەکات.\n\nناتوانیت خۆت دەرکەیت: بەشێک کە ڕێگای ڕێکخستنەکانە دەمێنێتەوە تا ڕێگایەکی تریان بۆ زیاد دەکەیت."
