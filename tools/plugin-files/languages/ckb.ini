plugin-manager.plugin.name = بەڕێوەبەری پلاگین
plugin-manager.plugin.description = پلاگینەکان لیست دەکات و چالاک و ناچالاکیان دەکات.
plugin-manager.plugin.how = "بەڕێوەبەری پلاگین هەموو پلاگینێک لەگەڵ وەشان و وەسفەکەی لیست دەکات، و پلاگینەکان چالاک و ناچالاک دەکات.\n\nلە ڕێکخستنەکان وەک «بەڕێوەبردنی پلاگینەکان» دەیدۆزیتەوە. «ڕێکخستنەکانی پلاگین» لاپەڕەیەکی جیایە بۆ هەڵبژاردنەکان وەک بەکارهێنانی تۆڕی هەر پلاگینێک. لە پلاگینێک بدە بۆ چالاک یان ناچالاککردنی (بە دوگمەکان، هەڵیبژێرە). گۆڕانکارییەکە دوای دووبارە دەستپێکردنەوە کاریگەر دەبێت: ئەو کاتە هێڵی خوارەوە «ئێستا دووبارە دەستپێبکەرەوە» پێشکەش دەکات. پلاگینێک ڕابگرە (بە دوگمەکان، «هەڵبژاردن» ڕابگرە) بۆ خوێندنەوەی چۆنیەتی کارکردنی.\n\nپلاگینێک بە «هەمیشە چالاک» ناچالاک ناکرێت، و یەکێک بە «پێویست» تەنیا ئەو کاتە ناچالاک دەکرێت کە پلاگینێکی تر ئەرکەکەی وەربگرێت، ئەگینا PaperPaw هیچ ڕێگایەکی گەڕانەوەی نابێت. لە «شاشەکان» هەڵدەبژێریت کام پلاگین شوێنێک نیشان دەدات کە چەند پلاگینێک پێشکەشی دەکەن."
