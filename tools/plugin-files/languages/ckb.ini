settings.plugin.description = لاپەڕەکانی ڕێکخستن، لە ڕێکخستنەکانی هەموو پلاگینەکان دروست کراون.
settings.plugin.how = "ڕێکخستنەکان هەموو ئەوە نیشان دەدات کە لە PaperPaw و پلاگینەکانیدا دەکرێت ڕێک بخرێت، لە لاپەڕەکاندا. پلاگینەکان پێویستیان بە شاشەی تایبەت بە خۆیان نییە: ئەوەی ڕایدەگەیەنن لێرە دەردەکەوێت، لە گرووپدا، لەگەڵ وەسفی هەر ڕێکخستنێک لە ژێریدا.\n\nبە «ڕێکخستنەکان» لە مێنیو بیکەرەوە. لە گرووپێک بدە بۆ کردنەوەی، پاشان لە ڕێکخستنێک بۆ گۆڕین یان هەڵبژاردنی؛ ژمارەکان دوگمەی − و + یان هەیە. بە دوگمەکان، بچۆ بۆ ڕێکخستنێک و «هەڵبژاردن» بکوتە: چەپ و ڕاست ژمارەیەک دەگۆڕن، «هەڵبژاردن» دەیپارێزێت، «گەڕانەوە» بۆ بەهای پێشوو دەگەڕێتەوە.\n\nگۆڕانکارییەکان یەکسەر کار دەکەن. «گەڕان» ڕێکخستنێک بە وشە دەدۆزێتەوە و «ڕێکخستنە پێشکەوتووەکان» ئەوانەی بە دەگمەن پێویستن زیاد دەکات. «گەڕاندنەوە بۆ بنەڕەت» و «ڕێکخستنەوەی هەموو» پێشتر دەپرسن."
