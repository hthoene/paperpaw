vocabulary.sd.readme = "فلاشکارت لە فایلەکانەوە\n\nبۆ هەر دەستەیەک فایلێک لێرە دابنێ: Spanish.tsv دەستەی Spanish دروست دەکات.\nفایلەکان: .tsv، .csv یان .txt، بە UTF-8 پاشەکەوتکراو، یان .apkg: دەستەیەکی Anki، هەناردەکراو بە نیشانکردنی پشتگیری وەشانە کۆنەکانی Anki. سێ خانەی یەکەمی تێبینییەکانی دەبن بە ڕووی پێشەوە، ڕووی دواوە و نموونە؛ خشتەی فێربوون و میدیاکەی ناخوێندرێنەوە، و PaperPaw هەرگیز فایلێکی Anki نانووسێت.\n\nلە هەر دێڕێک کارتێک: ڕووی پێشەوە، ڕووی دواوە و نموونەیەک (ئارەزووەکی)، بە تاب، کۆما یان فاریزە لە یەک جیاکراوە. دێڕی یەکەم دەتوانێت ستوونەکان ناو ببات: front، back، example. نموونە:\n\nKatze\tcat\tDie Katze schläft.\n\nپاشان لەسەر خوێنەرەکە فلاشکارت بکەرەوە، کارتەکانی کارتی SD هەڵبژێرە و پاشان نوێکردنەوەی دەستەکان لە کارتەکە.\n\nشتی باش بۆ زانین:\n- دەستەکان لەسەر خوێنەرەکە دەمێننەوە، لەگەڵ ئەوەی فێربوویت. فایلێک کاتێک دەخوێندرێتەوە کە نوێ یان گۆڕدرابێت، و کارتەکانی دەخرێنە دەستەکە یان لەوێ دەگۆڕدرێن.\n- ڕووی دواوە یان نموونەی کارتێک لە فایلەکە بگۆڕە: کارتەکە دەگۆڕێت و پێشکەوتنەکەت دەهێڵێتەوە.\n- دەقی ڕووی پێشەوەی کارتێک بگۆڕە: وەک کارتێکی نوێ دادەنرێت، و کۆنەکە سەرلەنوێ دەست پێدەکات. کارتەکان بە دەقی ڕووی پێشەوەیان دەناسرێنەوە، بۆشایی و پیتی گەورە ناژمێردرێن. دەستەیەک بۆ فایلێک پاشەکەوت بکە (کارتەکانی کارتی SD، پاشەکەوتکردنی دەستە لەسەر کارتەکە) و هەر کارتێک ژمارەیەکی دەبێت لە ستوونی id: لەوێ ڕووی پێشەوەیەک بگۆڕە، دوو دێڕی یەکەمی فایلەکە وەک خۆیان بهێڵەوە، و کارتەکە ئەوەی فێربووی دەهێڵێتەوە.\n- پاشەکەوتکردن کارتەکانی دەستەکە دەنووسێت. ئەوەی لە فایلەکەدا بوو و کارت نییە (دێڕێک بێ ڕووی پێشەوە) ناهێڵرێتەوە؛ ئەو فایلەی لەوێ بوو کۆپی دەکرێت بۆ _name.bak.tsv.\n- فایلەکە وەک CSV UTF-8 پاشەکەوت بکە (نەک UTF-16، نەک فۆرماتی تایبەتی خشتەیەکی ژمێریاری). فایلێک لە 4 MiB یان 20000 دێڕ زیاتر نایخوێنرێتەوە: بیکە بە چەند فایلێک.\n- دێڕێک لە فایلەکە بیسڕیتەوە کارتەکە لە دەستەکە ناسڕێتەوە، مەگەر بۆ ئەو دەستەیە سڕینەوەی کارتە نەماوەکان هەڵبکەیت. ئەوسا کارتەکە لەگەڵ ئەوەی فێربووی دەڕوات.\n- ئەو فایلانەی ناویان بە _ دەست پێدەکات ناخوێندرێنەوە.\n"
