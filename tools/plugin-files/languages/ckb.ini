update.plugin.description = نوێکردنەوەکانی فیرمواێر دادەمەزرێنێت، لە کارتەکەوە یان لە ئینتەرنێتەوە داگیراو.
update.plugin.how = "نوێکردنەوە فیرمواێری نوێ دادەمەزرێنێت، لەسەر ئەو ئامێرانەی PaperPaw تێیاندا فیرمواێرە، وەک X4. لە ڕێکخستنەکان دەیدۆزیتەوە، وەک «نوێکردنەوە».\n\n«گەڕان لە ئۆنلاین» لە سێرڤەری نوێکردنەوە دەپرسێت بۆ PaperPawێکی نوێتر و دایدەگرێت، کە چەند خولەکێک بە Wi-Fi دەخایەنێت. یان فایلێکی نوێکردنەوە (کۆتایی .bin، لە paperpaw.org) کۆپی بکە بۆ بوخچەی updates لەسەر کارتەکە، بۆ نموونە بە گواستنەوە بە Wi-Fi. «دامەزراندن» پاشان نزیکەی خولەکێک دەخایەنێت و ئامێرەکە دووبارە دەستپێدەکاتەوە؛ کتێب، ڕێکخستن و شوێنی خوێندنەوە دەمێننەوە.\n\nلەگەڵ «گەڕان بۆ نوێکردنەوە» (لە ڕێکخستنەکان، لە سەرەتادا ناچالاک)، ئامێرەکە نزیکەی هەفتەی جارێک خۆی دەپرسێت، تەنها کاتێک Wi-Fi هەرچۆنێک بێت چالاکە یان شەحن دەکرێت. PaperPawێکی نوێتر کە بیدۆزێتەوە لێرە چاوەڕێ دەکات؛ هیچ شتێک خوێندنەوەکەت تێک نادات. گەڕانێک ئەوە دەنێرێت کە ئامێرەکە کاری پێ دەکات، هیچ ناو و ژمارەیەکی ئامێرەکە نا؛ بۆ ژماردنی ئامێرەکان، هەروەها ئایا تۆ داوات کردووە و ئایا یەکەم گەڕانییەتی لە ڕۆژ، هەفتە یان مانگدا.\n\nئەگەر پلاگینەکانی بەکاریان دەهێنیت هێشتا وەشانێکیان بۆ وەشانە نوێیەکە نەبێت، نوێکردنەوەکە چاوەڕێیان دەکات. وەشانێکی کۆنتر تەنها ئەگەر هەڵیبژێریت دادەمەزرێت.\n\nفیرمواێرێکی تریش، وەک CrossPoint، لێرەوە دادەمەزرێت: فایلەکەی (کۆتایی .bin) بخەرە بوخچەی updates، و «نوێکردنەوە» بکەرەوە. PaperPaw دەپشکنێت کە فیرمواێرێکی تەواو و بێ زیانە بۆ ئەم ئامێرە، بەڵام ناتوانێت بڵێت کێ دروستی کردووە، چونکە واژۆ نەکراوە. «دامەزراندن لە هەموو حاڵەتێکدا» دەینووسێتە نیوەکەی تری فلاشەکە، و ئامێرەکە دەستی پێدەکات؛ PaperPaw لە نیوەکەی خۆی دەمێنێتەوە تا ئەو فیرمواێرە شتێک بەسەریدا دابمەزرێنێت. بۆ گەڕانەوە بۆ PaperPaw دواتر، فایلی دامەزراندنی (paperpaw-<device>-<version>-install.bin) لە مێنیوی فیرمواێرەکەی تر دابمەزرێنە، وەک نوێکردنەوەی فیرمواێری SD ی CrossPoint."
