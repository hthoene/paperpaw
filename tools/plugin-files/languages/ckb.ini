update.dual-boot.help = PaperPaw ئەم ئامێرە لەگەڵ فیرمواێرێکی تر بەشدار دەکات، بۆیە لێرە هیچ نوێکردنەوەیەک دا نامەزرێنێت. PaperPaw بە هەمان ئامرازەوە نوێ بکەرەوە کە بۆ ڕێکخستنی بەکارت هێنا. فیرمواێری دووەم لەسەر ئامێرەکە نییە؟ بە دوگمەی خوارەوە بیڵێ، یان PaperPaw دووبارە بە USB فلاش بکە لە paperpaw.org/flash.
