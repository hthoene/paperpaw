battery.plugin.name = بەکارهێنانی باتری
battery.plugin.description = باتری تۆمار دەکات و پیشان دەدات چەند دەخایەنێت.
battery.plugin.how = "بەکارهێنانی باتری نزیکەی هەر خولەکێک ئاستی شەحن تۆمار دەکات کاتێک ئامێرەکە بێدارە، لەگەڵ ئەوەی چی کردووە: تازەکردنەوەی شاشە و لاپەڕە هەڵدراوەکان. لەوەوە هەژمار دەکات کاتژمێرێک بێداری و 100 لاپەڕە چەند دەخایەنن، و باتری بەو خێراییە چەند دەمێنێت.\n\nباتری لە لیستی ئامرازەکان بکەرەوە. شەحنی ئێستا، ئەم کاتی بێداری، بەکارهێنان لەسەر باتری تا ئێستا و کاتەکانی بێداری دوایینت پیشان دەدات. بە دوگمەکانی لاپەڕە، یان بە لێدانی تیرەکانی سەرەوە لاپەڕەکانی هەڵدەدرێنەوە.\n\nکەمێک خوێندنەوە لەسەر باتری پێویستە پێش ئەوەی ژمارەکان مانایان هەبێت. تۆمارکردن بە شێوەی ئاسایی چالاکە و دەکرێت لە ڕێکخستنەکان، لە ئامێر، وزە، وەک «تۆمارکردنی بەکارهێنانی باتری» ناچالاک بکرێت."
