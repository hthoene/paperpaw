fonts-browser.plugin.name = فۆنتی زیاتر
fonts-browser.plugin.description = فۆنتەکان لە ئینتەرنێتەوە پیشان دەدات، هەریەکە بە نموونەیەکەوە، و دایاندەگرێت بۆ خوێندنەوە.
fonts-browser.plugin.how = "«فۆنتی زیاتر» فۆنتەکان لە کتێبخانەی فۆنتێک لە ئینتەرنێت لیست دەکات، هەر ناوێک بە فۆنتی خۆی، و ئەوانەی دەتەوێت بخوێنیتەوە داگرتن دەکات.\n\nلە کۆتایی لیستی فۆنتەکان دەیدۆزیتەوە لەو شوێنەی فۆنتی خوێندنەوە هەڵدەبژێردرێت، لە ڕێکخستنەکان، لەژێر خوێندنەوە، وەک «فۆنت»؛ هێڵەکانی دۆخیش هەمان خاڵیان بۆ فۆنتەکەیان هەیە. فۆنتێک لێ بدە (بە دوگمە، «هەڵبژاردن» دابگرە) بۆ بینینی گەورەتر لەگەڵ ڕستەیەکی نموونە، پاشان «داگرتن» هەڵبژێرە. دەتوانیت لاپەڕەکە جێ بهێڵیت لە کاتی داگرتن. کاتێک تەواو بوو، «خوێندنەوە بە (ناوی فۆنتەکە)» هەڵبژێرە، یان «بەکارهێنان بۆ هێڵەکانی دۆخ». «نوێکردنەوە» وەشانێکی نوێتر دەهێنێت، «لابردن» فۆنتەکە لە ئامێرەکە دەسڕێتەوە.\n\nپێویستی بە Wi-Fi هەیە.\n\nفۆنتەکانی خۆت\n\nلە تەنیشت «فۆنتی زیاتر»، هەمان لیست «فۆنتەکانی خۆت»ی هەیە، کە ئەم بەشەی یارمەتی پیشان دەدات. فۆنتی خۆت فایلێکی .ttf یان .otf ە، بۆ نموونە لە Google Fonts.\n\nلەسەر Android و ئامێرەکانی تر کە فایلی فۆنت دەکێشن: فایلەکە کۆپی بکە بۆ بوخچەی فۆنتەکان (لەسەر Android: PaperPaw/fonts لە بیرگەی هاوبەش)، PaperPaw دووبارە دەست پێ بکەرەوە و فۆنتەکە لە ڕێکخستنەکان، لەژێر خوێندنەوە، وەک «فۆنت» هەڵبژێرە.\n\nلەسەر Xteink X4 و X4 Pro: ئەم خوێنەرانە پاکێجی فۆنت دەخوێننەوە، نەک فایلی فۆنت، چونکە فایلی فۆنت لە بیرگەیان جێ نابێتەوە. لەسەر کۆمپیوتەر بە paperpaw-fontgen پاکێجێک دروست بکە، بۆ هەر شێوازێک کە هەتە (ئاسایی پێویستە):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nئەمە بوخچەی plugins/font-my-font دروست دەکات. لە بوخچەی plugins لەسەر کارتی بیرگە کۆپی بکە، دووبارە دەست پێ بکەرەوە، و My Font وەک «فۆنت» هەڵبژێرە. پاکێجێکی یەک شێواز نزیکەی نیو مێگابایتە بۆ پیتی لاتینی؛ ئەو شێوازانەی لایان دەبەیت بە شێوازی ئاسایی دەکێشرێن. ئامرازەکە دەڵێت فۆنتەکە چەند لەو پیتانەی داوات کردووە هەیەتی (--chars latin,cyrillic,greek خەتی تر زیاد دەکات): فۆنتێک بەبێ پیتەکانی کتێبەکەت ناتوانێت پیشانیان بدات، بۆیە بەدوای یەکێکدا بگەڕێ کە خەتەکەی دابپۆشێت.\n\nفۆنتەکانی «فۆنتی زیاتر» هەمان شێوە کار دەکەن و پێویستیان بە کۆمپیوتەر نییە.\n\nبۆ دەقی بچووکی تیژتر لەسەر پانێڵی e-ink، --hinting light زیاد بکە بۆ فەرمانەکە: پیتەکان لەگەڵ تۆڕی پیکسێڵ ڕێک دەخات، وەک چۆن فۆنتە بنەڕەتییەکان دروست کراون. بەبێ ئەوە پیتەکان وەک ئەوەی فۆنتەکە دیزاین کراوە دەکێشرێن؛ --hinting normal و --hinting mono بە بەهێزتر ڕێکیان دەخەن. فۆنتەکانی نیشانەدار، وەک عەرەبی یان دیڤاناگەری، باشترە بەبێ ئەوە بن."
