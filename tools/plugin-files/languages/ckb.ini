dictionary.plugin.name = فەرهەنگ
dictionary.plugin.description = وشە لە فەرهەنگەکانی StarDict دەگەڕێت.
dictionary.plugin.how = "فەرهەنگ وشەیەک لە کتێبێک لە فەرهەنگەکانی StarDict دەگەڕێت و پێناسەکان لە پانێڵێک لەسەر بەشی خوارەوەی شاشە پیشان دەدات.\n\nلە خوێنەر، وشەیەک ڕابگرە و «گەڕان لە فەرهەنگ» هەڵبژێرە؛ بە دوگمە، لەژێر «زیاتر» «دیاریکردنی دەق» بەکاربهێنە. بوخچەکانی فەرهەنگ (لەگەڵ فایلەکانی .ifo و .idx و .dict) کۆپی بکە بۆ بوخچەی «dictionaries» لەسەر ئامێرەکە، لەگەڵ ژێر بوخچەکان، یان لە ڕێکخستنەکان، لەژێر خوێندنەوە، بوخچەیەکی تر هەڵبژێرە وەک «بوخچەی فەرهەنگ» (ڕێکخستنێکی پێشکەوتوو). یەکەم گەڕان فەهرەستێکی بچووک بۆ هەر فەرهەنگێک ئامادە دەکات، کە کەمێک دەخایەنێت.\n\nلە پانێڵەکە، دوگمەکانی لاپەڕە یان سەرەوە و خوارەوە پێناسە درێژەکان دەگوازنەوە، و «گەڕانەوە» دەیخاتەوە. بە دەستلێدان، لە دەرەوەی لێ بدە بۆ داخستن."
