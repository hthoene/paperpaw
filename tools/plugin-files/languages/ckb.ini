translate.plugin.name = وەرگێڕان
translate.plugin.description = دەقی هەڵبژێردراو بە ئۆنلاین وەردەگێڕێت، بە DeepL.
translate.plugin.how = "وەرگێڕان دەقی هەڵبژێردراو بە ئۆنلاین بە DeepL وەردەگێڕێت. دەقێک لە کتێبێکدا هەڵبژێرە و لە مێنیوی دەقی هەڵبژێردراو «وەرگێڕان» هەڵبژێرە: وەرگێڕانەکە بەسەر لاپەڕەکەدا دەردەکەوێت وەک تۆمارێکی فەرهەنگ. دوگمەکانی لاپەڕە یان لێدان دەیگێڕن، و «هەڵبژاردن» یان لێدان لە کۆتاییەکەی دایدەخات.\n\nپێویستی بە تۆڕ و کلیلی API ی DeepLی خۆت هەیە، بێبەرامبەر لە deepl.com (DeepL API Free، نزیکەی 500,000 پیت لە مانگێکدا). تا نەینووسیت، پانێلەکە ئەمە دەڵێت، و لێدان داوای دەکات.\n\nلە ڕێکخستنەکان، لەژێر خوێندنەوە، لە بەشی وەرگێڕان، «وەرگێڕان بۆ» زمانەکە دیاری دەکات؛ لە سەرەتادا زمانی خودی PaperPawە."
