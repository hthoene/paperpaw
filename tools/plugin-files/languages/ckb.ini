reader.plugin.name = خوێنەر
reader.plugin.description = کتێبەکان لاپەڕە لاپەڕە نیشان دەدات، لەگەڵ ناوەڕۆک و ڕێکخستنەکانی خوێندنەوە.
reader.plugin.how = "خوێنەر کتێبەکان لاپەڕە لاپەڕە نیشان دەدات. کتێبێک لە کتێبخانە بکەرەوە؛ دوایین کتێب دەکرێت لە دەستپێکردندا دووبارە بکرێتەوە (ڕێکخستنی «کردنەوەی دوایین کتێب لە دەستپێکردندا»).\n\nلە چەپ یان ڕاستی شاشە بدە، یان دوگمەکانی لاپەڕە بەکاربهێنە، بۆ ڕاگۆڕینی لاپەڕە. لە ناوەڕاست بدە یان «هەڵبژاردن» بکوتە بۆ مێنیوی خوێندنەوە: ناوەڕۆک، گەڕان، چوون بۆ لاپەڕە، فۆنت و ڕیزبەندی، نیشانە و دیارکراوەکان و زیاتر. لە لێوی سەرەوە بەرەو خوارەوە پانێلی خێرا دەکاتەوە، لە لێوی خوارەوە بەرەو سەرەوە دەچێتە شاشەی سەرەکی؛ «گەڕانەوە» ڕاگرتنیش هەروا.\n\n«هەڵبژاردن» ڕابگرە (یان لەسەر وێنەیەک ڕابگرە) بۆ بینینی وێنە بە شاشەی تەواو: چەپ و ڕاست بەناو وێنەکانی لاپەڕەکەدا دەچن. «هەڵبژاردن» گەورەی دەکات بۆ 2x و 3x و دووبارە دواوە (لەسەر دەستلێدان دووجار لێدان)؛ کاتێک گەورە کراوە، چەپ و ڕاست بەلاوە دەیجوڵێنن، دوگمەکانی لاپەڕە (یان خشاندن) بەرەو پێش، بە پانی و پاشان بەرەو خوارەوە دەچن. «گەڕانەوە» دەچێتەوە بۆ گونجاو، پاشان بۆ لاپەڕەکە (لەسەر دەستلێدان ڕایبگرە بۆ دەرچوون). لە گۆشەی سەرەوەی ڕاست بدە بۆ نیشانە. وشەیەک ڕابگرە بۆ دیارکردنی. بە دوگمەکان، «چەپ» ڕابگرە: چەپ و ڕاست وشە وشە دەجوڵێن، دوگمەکانی لاپەڕە دێڕ دێڕ، ڕاگرتنیان دەچێتە لێوەکانی لاپەڕە و بڕگە بڕگە؛ «هەڵبژاردن» هێڵی دیارکردن بۆ وشەکە دەکاتەوە، «هەڵبژاردن» ڕاگرتن دەیکات بە ڕستە و پاشان بڕگە (ئینجا چەپ و ڕاست کۆتایی دەجوڵێنن، ڕاگرتنیان سەرەتا). دیاریکردنێک بەسەر ڕاگۆڕینی لاپەڕەکانیشدا بەردەوام دەبێت. «هەناردەکردن وەک Markdown» تێبینییەکانت دەپارێزێت."
