picture-home.plugin.name = شاشەی سەرەکیی وێنەدار
picture-home.plugin.description = شاشەیەکی سەرەکی بە وێنەی خۆتەوە لە پشت ویجێتەکان، و هێڵێکی دۆخ کە خۆت ڕێکی دەخەیت.
picture-home.plugin.how = "«شاشەی سەرەکیی وێنەدار» شاشەی سەرەکی دەگۆڕێتەوە تا چالاکە: وێنەی خۆت لە پشت ویجێتەکان، و ئەو لاپەڕانەی ویجێت و ئامراز کە ڕێکیان دەخەیت. لە بەڕێوەبەری پلاگین ناچالاکی بکە و شاشەی سەرەکیی ناوەکی دەگەڕێتەوە، بە لاپەڕەکانی خۆیەوە.\n\nوێنەکان (JPEG، PNG یان GIF) بخەرە بوخچەیەک لەسەر کارتەکە (بە شێوەی بنەڕەت wallpapers)، پاشان لە ڕێکخستنەکان، تایبەتکردن، شاشەی سەرەکیی وێنەدار یەکێکیان هەڵبژێرە. «گونجاندن» دەڵێت چۆن شاشەکە پڕ دەکات (پڕکردنەوە، هەموو وێنەکە، کێشان، قەبارەی ڕەسەن، کاشی)، «شوێن» کام بەش دەمێنێت، «زووم» چەند گەورە، و «ڕووناککردنەوەی وێنە» چەند کاڵ: وێنەیەکی کاڵتر خوێندنەوەی ویجێتەکان ئاسانتر دەکات. وێنەکە یەک جار بۆ هەر قەبارەیەکی شاشە ئامادە دەکرێت، کە ساتێک دەخایەنێت.\n\nویجێتەکان لەسەر پاشخان دادەنرێن لەسەر وێنەکە. لاپەڕەکە وەک شاشەی سەرەکیی ناوەکی ڕێک بخە: قەڵەمی ژێر لاپەڕەکە، یان «دەستکاریکردنی شاشەی سەرەکی» لە مێنیو.\n\nهێڵی دۆخ (کات، Wi-Fi، باتری، یان ئەوەی هەڵیدەبژێریت) دەکرێت چالاک، ناچالاک یان خۆکار بێت، لە سەرەوە یان خوارەوە، بە پانیی تەواو یان وەک حەبێکی بچووک لە چەپ، ناوەڕاست یان ڕاست، لەسەر پاشخانێکی ڕووناک، تاریک یان خۆڵەمێشی یان لەسەر خودی وێنەکە. ئەو ڕیزەی ناوی دوگمەکان دەهێنێت (لەسەر X4) یش دەکرێت چالاک، ناچالاک یان خۆکار بێت. خۆکار واتە کوتانی دوگمەیەک چەند چرکەیەک نیشانیان دەدات؛ ئەو کوتانە هیچی تر ناکات.\n\n«نیشاندانی وێنە» دەڵێت وێنەکە چۆن دەکێشرێت: «ئاستی خۆڵەمێشی» بە هەموو ڕەنگە خۆڵەمێشییەکانی شاشەکە (لەسەر X4 هێواشتر)، «خاڵخاڵ» بە خاڵی ڕەش و سپی (خێرا)، یان «خۆکار»، وەک شاشەی سەرەکیی ناوەکی دەیکات: ئاستی خۆڵەمێشی کاتی کێشانی شاشە، خاڵ دوای یەکەم گۆڕانکاری. لەو شوێنانەی شاشە ئاستی خۆڵەمێشی نییە، ئاستی خۆڵەمێشی دەبێتە خاڵ."
