wifi.plugin.name = Wi-Fi
wifi.plugin.description = کاتی پێویست بە تۆڕی Wi-Fi دەبەستێتەوە و پاشان ڕادیۆکە دەکوژێنێتەوە.
wifi.plugin.how = "Wi-Fi کاتێک پلاگینێک پێویستی بە ئینتەرنێت بێت (کاتالۆگ، هاوکاتکردن، فرۆشگا، گواستنەوە) بە تۆڕێکەوە دەبەستێتەوە و خولەکێک دوای ئەوەی هیچ بەکاری نەهێنێت، یان یەکسەر کاتێک سەرەکی یان کتێبێک پیشان دەدرێت، ڕادیۆکە دووبارە دەکوژێنێتەوە، بۆ پاراستنی باتری و بیرگە.\n\nWi-Fi لە ڕێکخستنەکان بکەرەوە، یان لە بڕگەی Wi-Fi لە هێڵی دۆخ. تۆڕەکان ئەوانەی لە ئاستدان لیست دەکات؛ یەکێک هەڵبژێرە و وشەی نهێنییەکەی بنووسە، یان ڕێکخستن بە مۆبایل هەڵبژێرە و ناو و وشەی نهێنی لە وێبگەڕی مۆبایلەکەت بنووسە لەبری لەسەر ئامێرەکە. لەبیرکردن تۆڕێکی پاشەکەوتکراو لادەبات.\n\nوشە نهێنییەکان لەسەر کارتەکە دەمێننەوە، بە سەلامەتی هەڵگیراون، و هەرگیز دووبارە پیشان نادرێنەوە. لە بەستنەوە کاتی پێویست دیاری دەکەیت Wi-Fi دوای دوایین بەکارهێنان چەند دەمێنێتەوە، ئایا لە کاتی شەحنکردن دەمێنێتەوە، و کام تۆڕی پاشەکەوتکراو یەکەم دێت کاتێک چەند یەک لە ئاستدان."
