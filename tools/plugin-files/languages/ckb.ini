profiles.plugin.how = "پرۆفایلێک ڕێکخستنەکانی خوێندنەوە، ڕێکخستنەکانی نیشاندان و هێڵەکانی دۆخت بە ناوێک دەپارێزێت، وەک «شەو» یان «پیتی گەورە»، و بە لێدانێک دەیانگەڕێنێتەوە.\n\nپرۆفایلەکان لە مێنیوی خوێندنەوە لە «زیاتر»، یان لە ڕێکخستنەکان لە «تایبەتکردن» بکەرەوە. لە پرۆفایلێک بدە بۆ بەکارهێنانی؛ ئەوەی لە بەکارهێناندایە نیشانکراوە. ڕایبگرە (بە دوگمەکان، «هەڵبژاردن» ڕابگرە) بۆ پاشەکەوتکردنی ڕێکخستنەکانی ئێستا تێیدا، ناوگۆڕین یان سڕینەوەی. «پاشەکەوتکردن وەک پرۆفایلی نوێ» ئەوە دەپارێزێت کە ئێستا ڕێکخراوە.\n\n«پرۆفایلی دواتر» دەگۆڕێت بۆ ئەوەی دواتر لە لیستەکە؛ بیخە سەر دوگمەیەک یان یاسایەک."
