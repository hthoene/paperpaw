menu.plugin.name = مێنیو
menu.plugin.description = مێنیوی بەشی خوارەوەی شاشە، لەگەڵ کردار و ڕێکخستنەکان.
menu.plugin.how = "مێنیو ئەوە لیست دەکات کە دەتوانیت بیکەیت و ڕێکی بخەیت. لە خوارەوەی شاشە دەکرێتەوە، لەسەر ئەوەی کراوەیە: لە کاتی خوێندنەوە، لە ناوەڕاستی شاشە بدە یان «هەڵبژاردن» بکوتە. لە بەشێک بدە یان هەڵیبژێرە بۆ جێبەجێکردنی.\n\nڕێکخستنەکانی ناو مێنیو بەهاکەیان نیشان دەدەن و لە شوێنی خۆیاندا دەگۆڕدرێن، بۆیە مێنیو کراوە دەمێنێتەوە. بەشێک کە بەشی زیاتری هەیە ژێرمێنیوێک دەکاتەوە.\n\nلە لێوی سەرەوە بخشێنە خوارەوە بۆ پانێلی خێرا: ئەوەی زۆر دەیگۆڕیت، وەک دوگمە. لە دوگمەیەک بدە بۆ گۆڕینی، ڕایبگرە بۆ ڕێکخستنەکانی. تەنیا بە دوگمەکان، دوگمە تیرەکان هەڵدەبژێرن، «هەڵبژاردن» دەیگۆڕێت و «گەڕانەوە» دەیدەخات. لە ڕووکار، «مێنیوەکان» مێنیوەکان وەک لیست یان وەک کاشی نیشان دەدات."
