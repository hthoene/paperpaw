setup.end.help = کتێب بخەرە بوخچەی «/books» لەسەر ئامێرەکە بە کۆمپیوتەر، یان بە Wi-Fi لە مۆبایل یان کۆمپیوتەرەوە بینێرە (ئامرازەکان، گواستنەوە بە Wi-Fi). کاتالۆگەکانیش کتێب دەهێنن، و Calibre ئەگەر زیاد کرابێت. هەموو ئەوەی لێرە هەڵدەبژێریت دەکرێت لە ڕێکخستنەکان بگۆڕدرێت.
