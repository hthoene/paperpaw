file-manager.plugin.name = بەڕێوەبەری فایل
file-manager.plugin.description = هەموو بوخچە و فایلێکی ئامێرەکە: بیانکەرەوە، ناویان بگۆڕە، بیانگوازەرەوە، کۆپییان بکە و بیانسڕەوە.
file-manager.plugin.how = "بەڕێوەبەری فایل هەموو بوخچە و فایلێکی بیرگەی ئامێرەکە پیشان دەدات، نەک تەنها کتێبەکانت، و ڕێگەت دەدات بیانکەیتەوە، ناویان بگۆڕیت، بیانگوازیتەوە، کۆپییان بکەیت و بیانسڕیتەوە و بوخچەی نوێ دروست بکەیت.\n\n«فایلەکان» لە لیستی ئامرازەکان بکەرەوە. بوخچەیەک لێ بدە بۆ چوونە ناوی؛ «گەڕانەوە» دەچێتە بوخچەی سەرەوە. فایلێک لێ بدە، یان هەر خاڵێک ڕابگرە (بە دوگمە، «هەڵبژاردن» ڕابگرە)، بۆ بینینی ئەوەی دەکرێت لەگەڵیدا بکرێت. «گواستنەوە» و «کۆپیکردن» خاڵەکە هەڵدەبژێرن: بچۆ بۆ ئەو بوخچەیەی تێیدا دەبێت و «لێرە بیلکێنە» لە شریتی خوارەوە هەڵبژێرە. بە دوگمە، لە دوایین خاڵەوە «خوارەوە» دابگرە بۆ گەیشتن بە شریتەکە.\n\nئەو فایل و بوخچانەی بە خاڵ دەست پێ دەکەن، وەک داتای خودی PaperPaw، شاراوەن. بۆ بینینیان، «فایلە شاراوەکان» لە ڕێکخستنەکان، لەژێر کتێبخانە، چالاک بکە."
