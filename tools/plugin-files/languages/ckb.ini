update.not-dual.warning = "ئەوسا PaperPaw لێرە نوێکردنەوە دادەمەزرێنێت. ئەگەر فیرمواێرێکی تر هێشتا لەسەر ئامێرەکە دامەزرابێت، نوێکردنەوەکە دەتوانێت بیسڕێتەوە. بۆ جێبەجێکردنی ئەمە PaperPaw دووبارە دەست پێدەکاتەوە.\nبۆ گەڕانەوە دواتر: لە نوێکردنەوەکان «دووبارە دۆزینەوەی دوو-بووت»، یان dual-boot = auto لە paperpaw.ini."
