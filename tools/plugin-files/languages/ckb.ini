stats.plugin.name = ئاماری خوێندنەوە
stats.plugin.description = تۆمار دەکات چەند ماوە و چەند دەخوێنیتەوە، لەگەڵ ڕۆژژمێر و ژمارەکانی هەر کتێبێک.
stats.plugin.how = "ئاماری خوێندنەوە تۆمار دەکات چەند ماوە هەر لاپەڕەیەک دەخوێنیتەوە. وەک چاوخشاندنێک دەیبینیت، لەگەڵ ئەمڕۆ، هەفتە و زنجیرەکەت، وەک ڕۆژژمێر، و لەگەڵ ژمارەکانی هەر کتێبێک.\n\nلە ئامرازەکان بیکەرەوە، یان لە «زیاتر» لە خوێنەر. لە ڕێکخستنەکان، لەژێر ئاماری خوێندنەوە، دەتوانیت «تۆمارکردنی خوێندنەوە» ناچالاک بکەیت، «ئامانجی ڕۆژانە» دابنێیت، و «کورتترین لاپەڕە» و «درێژترین لاپەڕە» دیاری بکەیت کە دەژمێردرێن، بۆ ئەوەی هەڵدانەوە یان کتێبی کراوە ژمارەکان تێک نەدەن.\n\n«هاوکاتکردن لەگەڵ KOReader» ئامارەکان لەگەڵ KOReader بەشدار دەکات لە ڕێی بوخچەیەکی WebDAV. هەروەها ئاماری KOReader لەسەر هەمان ئامێر وەردەگرێت. تۆمارکردن پێویستی بەوەیە کاتژمێرەکە ڕێک خرابێت: ئەگەر نەخرابێت، جارێک بە Wi-Fi بەستەرەوە."
