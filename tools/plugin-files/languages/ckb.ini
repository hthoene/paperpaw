weather.plugin.name = کەشوهەوا
weather.plugin.description = کەشوهەوای ئێستا و ڕۆژانی داهاتوو وەک ویجێت، لە Open-Meteo.
weather.plugin.how = "کەشوهەوا کەشوهەوای ئێستا و ڕۆژانی داهاتوو وەک ویجێت بۆ شاشەی سەرەکی پیشان دەدات، لە Open-Meteo، کە هیچ هەژمار و کلیلێکی ناوێت. کەشوهەوای ئێستا پلەی گەرمی، بارودۆخ و شتی زیاتر بۆ هەڵبژاردن پیشان دەدات؛ پێشبینی ڕۆژانی داهاتوو لە ڕیزێک یان لیستێکدا پیشان دەدات.\n\nسەرەتا شوێنێک هەڵبژێرە: لە ڕێکخستنەکان، لە کەشوهەوا، شوێن (ناوێک بنووسە، پاشان لە شوێنە دۆزراوەکان هەڵیبژێرە). تەنها پێوەرەکانی (coordinates) دەنێردرێن، و تەنها تا ویجێتێکی کەشوهەوا پیشان دەدرێت. ویجێتەکان بە دەستکاریکردنی شاشەی سەرەکی زیاد بکە.\n\nکەشوهەوا زۆرترین ئەوەندە جار دەهێنرێت کە «زۆرترین نوێکردنەوە لە هەموو» دەڵێت، و تەنها کاتێک تۆڕ هەبێت: هەرگیز Wi-Fi بە خۆی هەڵناکات.\n\nداتای کەشوهەوا لە Open-Meteo.com (https://open-meteo.com)، لە ژێر مۆڵەتی Creative Commons Attribution 4.0 (CC BY 4.0)."
