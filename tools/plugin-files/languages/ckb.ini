calibre.plugin.name = کتێبخانەی بێتەل
calibre.plugin.description = کتێب لە تۆڕەوە وەردەگرێت. وەک ئامێرێکی بێتەل بۆ calibre کار دەکات.
calibre.plugin.how = "کتێبخانەی بێتەل ڕێگە دەدات ئامێرەکە لە Calibre لەسەر کۆمپیوتەرەکەت وەک ئامێرێکی بێتەل دەربکەوێت. Calibre ئینجا دەتوانێت کتێب بۆی بنێرێت، لیستیان بکات و بیانسڕێتەوە. کتێبەکان دەچنە کتێبخانە.\n\nکتێبخانەی بێتەل لە لیستی ئامرازەکان بکەرەوە، لەگەڵ ئەوەی ئامێرەکە و کۆمپیوتەرەکە لە هەمان تۆڕی Wi-Fi دان. لە Calibre «Connect/share» و پاشان «Start wireless device connection» هەڵبژێرە. کاتێک ئامێرەکە کۆمپیوتەرەکەی دۆزییەوە ناوەکەی پیشان دەدات؛ «بەستنەوە» لێ بدە (بە دوگمە، «هەڵبژاردن» دابگرە). Calibre دەتوانێت لێرە کتێب زیاد بکات و بیسڕێتەوە، بۆیە تەنها بە کۆمپیوتەری خۆت ببەستەوە. داخستنی شاشەکە پەیوەندییەکە کۆتایی پێ دەهێنێت.\n\nئەگەر Calibre خۆکارانە نەدۆزرایەوە، ناونیشانی کۆمپیوتەرەکەی لە ڕێکخستنەکان، لەژێر کتێبخانە، وەک «ناونیشان» لە بەشی Calibre بنووسە. ئەگەر Calibre پۆرتێکی جگە لە 9090 بەکار دەهێنێت، وەک :port زیادی بکە، بۆ نموونە 192.168.1.20:9091."
