mail.plugin.name = ئیمەیڵ
mail.plugin.description = ئیمەیڵ دەخوێنێتەوە و دەنێرێت بە وشەی نهێنی یان وشەی نهێنیی ئەپ (IMAP و SMTP)، بەبێ چوونەژوورەوە لە وێبگەڕ.
mail.plugin.how = "ئیمەیڵ لە ڕێگەی IMAP و SMTP ئیمەیڵ دەخوێنێتەوە و دەنێرێت. بە ناونیشان و وشەیەکی نهێنی دەچێتە ژوورەوە، بەبێ چوونەژوورەوە لە وێبگەڕ، بۆیە لەگەڵ هەر دابینکەرێک کار دەکات کە ئەمە ڕێگە بدات.\n\nهەژمارێک لە ڕێکخستنەکان، ئیمەیڵ ڕێک بخە. دابینکەرەکەت هەڵبژێرە، ناونیشان و وشەی نهێنییەکەت بنووسە. زۆربەی دابینکەران وشەی نهێنیی ئەپ دەخوازن: یەکێک لە ڕێکخستنەکانی ئاسایشی هەژمارەکەتدا دروست بکە و لێرە بەکاری بهێنە. وشەی نهێنیی ئاساییت زۆر جار کار ناکات، و هەرگیز بۆ هیچ شوێنێک ناچێت جگە لە سێرڤەری دابینکەرەکەت. لەگەڵ وشە نهێنی و کلیلەکان دەپارێزرێت.\n\nئیمەیڵ لە ئامرازەکان بکەرەوە. «بپشکنە بۆ ئیمەیڵ» نوێترین ئیمەیڵەکان و بوخچەکان دەهێنێت. ئیمەیڵەکان لەسەر کارتەکە دەمێننەوە، بۆیە بەبێ تۆڕ دەتوانیت بیانخوێنیتەوە. ئامێرەکە پەیوەندی دەکات، دەهێنێت و دەیپچڕێنێت، بۆیە Wi-Fi تەنیا بۆ ساتێک چالاکە.\n\nئەگەر دابینکەرەکەت لە لیستەکەدا نییە، «سێرڤەری خۆت» هەڵبژێرە و ناوی سێرڤەر و پۆرت و ئاسایش لە ڕێکخستنە پێشکەوتووەکاندا دابنێ. سێرڤەرێک کە هیچ دەسەڵاتێک دلنیایی بڕوانامەکەی نەدات یەک جار دەپرسێت ئایا متمانەی پێ بکەیت؛ پەنجەنیشانەکە لەگەڵ ئەوەی دابینکەرەکەت پیشانی دەدات بەراورد بکە.\n\nئیمەیڵێک کە کتێبێکی پێوەیە (EPUB، PDF و هاوشێوە، تا 2 MB) لە ژێرەوە «کردنەوەی کتێب»ی هەیە: فایلەکە دەهێنێت، دەیخاتە کتێبخانەکەتەوە و دەیکاتەوە.\n\nبۆ بینینی ئیمەیڵی نوێ بەبێ کردنەوەی ئیمەیڵ، لە ڕێکخستنەکان، ئیمەیڵ، «گەڕان بۆ ئیمەیڵی نوێ لە پشتەوە» چالاک بکە و هەڵبژێرە هەر چەند جارێک (هەر 15، 30 یان 60 خولەک). تا چالاکی نەکەیت ناچالاکە. ئینجا خوێنەرەکە هەندێک جار بە پەیوەندییەکی پارێزراو پەیوەندی دەکات کاتێک بەخەبەرە و ئۆنلاینە، هەژمارێک دوای یەکێکی تر، و ژمارەی نەخوێندراوەکان لە شاشەی سەرەکی نوێ دەکاتەوە. هەندێک باتری بەکار دەهێنێت. کردنەوەی ئیمەیڵ پشکنینێکی کاردەکەر ڕادەگرێت.\n\nویجێتەکانی شاشەی سەرەکی ژمارەی نەخوێندراوەکان، نوێترین ئیمەیڵەکان و ئیمەیڵە ئەستێرەدارەکان، یەک سندوق، و کورتەڕێیەک بۆ نووسینی ئیمەیڵ نیشان دەدەن."
