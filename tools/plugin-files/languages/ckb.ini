diagnostics.plugin.description = شاشەی تاقیکردنەوە و پشکنینێکی ڕێنمایکراو بۆ هەموو بەشەکانی ئامێرێک.
diagnostics.plugin.how = "دیاگنۆستیک شاشەی تاقیکردنەوەیە بۆ پشکنینی ئامێرێک: هەموو ئاستێکی خۆڵەمێشی کە پانێڵەکە دەتوانێت پیشانی بدات، چوار سندوق بۆ تاقیکردنەوەی دوگمە و دەستلێدان، و ژمارەگرێکی لاپەڕە لەگەڵ شریتی پێشکەوتن بۆ بەراوردکردنی دۆخەکانی تازەکردنەوە پیشان دەدات.\n\nشاشەی تاقیکردنەوە هیچ خاڵێکی لە مێنیودا نییە. تەنها شاشەی سەرەکییە تا هیچ پلاگینێکی تر شاشەیەک پێشکەش نەکات، یان کاتێک لە بەڕێوەبەری پلاگین لەژێر شاشەکان بۆ شوێنی شاشەی سەرەکی هەڵیدەبژێریت.\n\n«هەڵبژاردن» سندوقی فۆکەسکراو نیشان دەکات، و دوگمە تیرەکان لە نێوان سندوقەکان دەجوڵێن؛ بە دەستلێدان، سندوقێک لێ بدە. دوگمەکانی لاپەڕە لاپەڕەکانی تاقیکردنەوە هەڵدەدەنەوە. «هەڵبژاردن» ڕابگرە، یان پەنجەیەک لەسەر شاشە ڕابگرە، بۆ دەستپێکردنەوە.\n\nپشکنینی ئامێر، لەژێر ئامرازەکان لەو شوێنانەی PaperPaw فیرمواێری ئامێرەکەیە، بە هەموو بەشەکانی ئامێرێکدا دەچێت لاپەڕە بە لاپەڕە: شاشە، دوگمە، دەستلێدان، ڕووناکی پێشەوە، باتری، کارت، کاتژمێر، Wi-Fi، خەو و بیرگە. هەر لاپەڕەیەک بە «سەرنەکەوتوو»، «بازدان» و «سەرکەوتوو» کۆتایی دێت، ئەو وەڵامەی پێوانەکانی پێشنیاری دەکەن هەڵبژێردراوە؛ ئەو بەشانەی ئامێرێک نییەتی بازیان پێدا دەدرێت. دوای هەر وەڵامێک ڕاپۆرتێک دەنووسێت بۆ .paperpaw/plugins/diagnostics/device-check.txt، بۆ لکاندن لە pull request. «گەڕانەوە» جێی دەهێڵێت، و کاتێک دووبارە دەکرێتەوە لەو شوێنەوە بەردەوام دەبێت کە لێی وەستابوو. لەسەر ئامێرێک کە تەنها دوگمەی هەیە، سەرەتا لە لاپەڕەی دوگمەکان «دەستپێکردن» هەڵبژێرە؛ تا ئەو کاتە تیرەکان و «هەڵبژاردن» و «گەڕانەوە» وەک هەموو لاپەڕەیەک کار دەکەن."
