store.plugin.name = فرۆشگای پلاگین
store.plugin.description = پلاگینەکان بۆ ئەم ئامێرە دەدۆزێتەوە، دایاندەمەزرێنێت، نوێیان دەکاتەوە و لایاندەبات.
store.plugin.how = "فرۆشگای پلاگین پلاگینەکان بۆ ئەم ئامێرە لەسەر ئینتەرنێت دەدۆزێتەوە و دایاندەمەزرێنێت، نوێیان دەکاتەوە و لایاندەبات. لە ئامرازەکانەوە بیکەرەوە؛ پێویستی بە Wi-Fi هەیە.\n\nسەرەتا ئەوە نیشان دەدات کە کتێبخانە پێشنیاری دەکات، ئەوەی نوێیە یان ئێستا بەناوبانگە، پاشان گرووپەکان. گرووپێک پلاگینەکانی بە تێکەڵییەکی دادپەروەرانە لیست دەکات کە هەموو ڕۆژێک دەگۆڕێت، بۆ ئەوەی هەموو پلاگینێک ببینرێت؛ لە A بۆ Z، بەپێی نوێترین یان دوایین نوێکردنەوە ڕیزیان بکە، و لە لیستە درێژەکاندا بچۆ بۆ پیتێک. یەکێکیان بکەرەوە بۆ بینینی لاپەڕەکەی، لەگەڵ قەبارە و ئەو بیرگەیەی دەیگرێت، پاشان «دامەزراندن» یان «نوێکردنەوە» یان «لابردن» هەڵبژێرە. «نوێکردنەوەی هەموو» هەموو پلاگینە دامەزراوەکان نوێ دەکاتەوە.\n\nپلاگینەکانی کۆد بە دەستگەیشتنی تەواو بە ئامێرەکە کار دەکەن: فرۆشگا ئەمە دەڵێت و پێشتر دەپرسێت، و دوای دووبارە دەستپێکردنەوە دەستپێدەکەن. ئەگەر یەکێکیان هەڵە بکات، PaperPaw بێ پلاگینی کۆد دەستپێدەکات و دەڵێت کامیان بوو. «کتێبخانەی پلاگین» دیاری دەکات لیستەکە لە کوێوە دێت.\n\n«پلاگینەکانی کۆمەڵگا»، لە ڕێکخستنەکان، سیستەم، پلاگینەکانیش لیست دەکات کە کەسانی تر لەسەر GitHub بڵاویان کردووەتەوە. کەس نەیپشکنیوون: وەک «نەپشکنراو» نیشان کراون، لاپەڕەی پلاگینێکی کۆد ئەو کلیلە نیشان دەدات کە واژۆ کراوە پێی، و نوێکردنەوەیەک کە بە کلیلێکی تر واژۆ کرابێت دانامەزرێت.\n\n«سەرچاوەکان»، دوایین ڕیزی سەرەتا، لیستی پلاگینی کەسانی تر زیاد دەکات بە ناونیشانیان (https://…/plugins.json)، یەکێکیان لە جیاتی هی PaperPaw لیست دەکات، یان لایدەبات. لە جیاتی نووسین، فایلێکی sources.txt کە لە هەر دێڕێکدا ناونیشانێکی تێدا بێت بخەرە .paperpaw/plugins/store لەسەر کارتەکە: ناونیشانەکان لەژێر «سەرچاوەکان» وەک نوێ دەردەکەون. PaperPaw سەرچاوەیەک و پلاگینەکانی ناپشکنێت، و ئامێرەکە پەیوەندی بە سێرڤەری سەرچاوەکەوە دەکات. سەرچاوەیەک لیستەکەی واژۆ دەکات؛ ئامێرەکە کلیلی یەکەم لیستی خوێندراو دەپارێزێت و لەوەولا تەنها ئەو لیست و پلاگینی کۆدانە وەردەگرێت کە بەو کلیلە واژۆ کراون. پلاگینێک نوێکردنەوەکانی تەنها لەو سەرچاوەیەوە وەردەگرێت کە لێیەوە دامەزرابوو. کتێبخانەی خودی PaperPaw هەمیشە ئامادەیە و ناتوانرێت لابدرێت؛ جێهێشتنی فرۆشگا دەگەڕێتەوە بۆی."
