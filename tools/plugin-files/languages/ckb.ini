power.plugin.name = وزە
power.plugin.description = دۆخی وزە هەڵدەبژێرێت، بە دەست یان بەپێی باتری: ئاسایی، پاشەکەوت، ئۆفلاین.
power.plugin.how = "«وزە» هەڵدەبژێرێت PaperPaw باتری چۆن بەکار بهێنێت: ئاسایی، پاشەکەوت یان ئۆفلاین. «پاشەکەوت» ئەوەی دەکرێت دوابخرێت لە کاتی باشتردا دەیکات؛ «ئۆفلاین» ڕادیۆکە کوژاوە دەهێڵێتەوە. «خۆکار» بەپێی باتری هەڵدەبژێرێت.\n\nدۆخەکە لە پانێلی خێرا بگۆڕە، کە «وزە» دۆخەکان لە تەنیشت یەک نیشان دەدات، یان لە ڕێکخستنەکان، لە «وزە». لەوێ ئاستەکانیش دیاری دەکەیت کە «خۆکار» تێیدا دەگۆڕێت بۆ «پاشەکەوت» و بۆ «ئۆفلاین»، و ئەوەی لە کاتی شەحنکردندا «ئاسایی» دەمێنێتەوە.\n\nلە هێڵەکانی دۆخدا، «دۆخی وزە» گەڵایەک لە کاتی پاشەکەوت و Wi-Fiیەکی هێڵ لێدراو لە کاتی ئۆفلاین نیشان دەدات، و لە «ئاسایی» هیچ.\n\nدوگمەی هێز ڕابگرە بۆ کردنەوەی مێنیوێکی بچووک: خەوتن، کوژاندنەوە (ئەو شوێنانەی PaperPaw دەتوانێت)، دووبارە دەستپێکردنەوە، و لەسەر ئامێرەکانی دەستلێدان «قفڵکردنی دەستلێدان» یان «کردنەوەی قفڵی دەستلێدان». کوتانی کورت هەر ئامێرەکە دەخەوێنێت. «گەڕانەوە» مێنیوەکە بەجێ دێڵێت."
