keys.plugin.name = دوگمە و ئاماژەکان
keys.plugin.description = هەر دوگمە و ناوچەی لێدان و خشاندنێک چی دەکات، لەسەر ئامێرەکە دەگۆڕدرێت.
keys.plugin.how = "«دوگمە و ئاماژەکان» نیشان دەدات هەر دوگمە و ناوچەی لێدان و خشاندنێک چی دەکات، و دەتهێڵێت لەسەر ئامێرەکە بیگۆڕیت.\n\nلە ڕێکخستنەکان، لە ئامێر، بیکەرەوە. سەرەتا هەڵبژێرە گۆڕانکارییەکە لە کوێ کاریگەرە: لە هەموو شوێنێک، لە کاتی خوێندنەوە، لە شاشەی سەرەکی، لە کتێبخانە یان لە یەک ئامرازدا. پاشان ورودییەک هەڵبژێرە، وەک دوگمەیەکی ڕاگیراو یان خشاندنێک لە لێوێکەوە بۆ ناوەوە، و کردارێک لە لیستەکە هەڵبژێرە، کە دەتوانیت بیدۆزیتەوە. «وەک بنەڕەت» ئەوە دەگەڕێنێتەوە کە پلاگینەکان و ڕیزبەندی دوگمەکان دایانناوە.\n\nلەسەر X4، ئەو گۆڕانکارییەی هیچ دوگمەیەک بەجێ بهێڵێت بۆ هەڵبژاردن یان گەڕانەوە یان چوونە پێشەوە ڕەت دەکرێتەوە. «ڕێکخستنەوەی دوگمە و ئاماژەکان» لە کۆتاییدا هەموو گۆڕانکارییەک دەگەڕێنێتەوە."
