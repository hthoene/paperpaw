koreader.plugin.name = هاوبەشکردنی دیارکراوەکان
koreader.plugin.description = نیشانە و دیارکراوەکان لەگەڵ KOReader هاوبەش دەکات بۆ ئەو کتێبانەی لە هەردووکیاندا دەخوێنرێنەوە.
koreader.plugin.how = "ئەم پلاگینە نیشانە و دیارکراوەکان لەگەڵ KOReader هاوبەش دەکات بۆ ئەو کتێبانەی لە هەردووکیاندا دەیانخوێنیتەوە، لەسەر یەک ئامێر یان لە بوخچەیەکی کتێبخانە کە لە نێوان ئامێرەکان هاوکات دەکرێت. هیچ شتێک نییە بۆ ڕێکخستن.\n\nکاتێک PaperPaw کتێبێک دەکاتەوە کە KOReader یش کردوویەتییەوە، و کاتێک نیشانە یان دیارکراوەکانی دەگۆڕیت، ئەوەی نوێیە لە داتای KOReader لە تەنیشت کتێبەکە وەری دەگرێت و ئەوەی لێرە نوێیە بۆ KOReader جێ دەهێڵێت تا لە کردنەوەی دواتری کتێبەکەدا وەریبگرێت. نیشانە سڕاوەکان و تێبینییە گۆڕاوەکانیش دەچنە ئەوێ.\n\nئەمە تەنیا بۆ کتێبی EPUB کار دەکات. ئەگەر فایلی یەکێک لە دوو لا نەخوێندرێتەوە، تا ئەو کاتەی دەخوێندرێتەوە لە هیچ لایەکدا هیچ ناگۆڕدرێت."
koreader.removed-there = فایلی KOReader چیتر هیچ دیارکراوێکی نییە. لێرەش بسڕدرێنەوە؟
koreader.removed-there.text = لەوانەیە لە KOReader سڕابنەوە، یان فایلەکە لە ئامێرێکی ترەوە هاتبێت. «هێشتنەوە» لێرە دەیانهێڵێتەوە و دووبارە دەیاندات بە KOReader.
