files.plugin.name = وێبگەڕی فایل
files.plugin.description = کتێب و بوخچەکانی سەر ئامێرەکە لیست دەکات و دەیانکاتەوە.
files.plugin.how = "کتێبخانە ئەو کتێبانە لیست دەکات کە لە بوخچەی کتێبخانەکەتدان، هەریەکە لەگەڵ بەرگ و ناونیشان و نووسەر و ئەوەی تا کوێ خوێندووتەتەوە. ئەو کتێبەی دوایین جار خوێندووتەتەوە وەک کارتێک لە سەرەوە دەوەستێت، بۆیە بەردەوامبوون لە خوێندنەوە تەنها یەک لێدان یان یەک دابگرتنی «هەڵبژاردن»ە. لە کاتێکدا کتێبخانە بەدوای کتێبدا دەگەڕێت، دەڵێت تا ئێستا چەندی دۆزیوەتەوە.\n\nهەڵبژێرە چی لە سەرەوەی کتێبەکان پیشان بدرێت: هەموویان، ئەوانەی دەیانخوێنیتەوە، نەخوێندراو یان تەواوکراوەکان، یان ڕەفەکان (بەپێی نووسەر، زنجیرە، تاگ، دڵخوازەکان، کتێبی داهاتووی هەر زنجیرەیەک کە دەستت پێ کردووە). کتێبێک لێ بدە بۆ خوێندنەوەی؛ ڕایبگرە (بە دوگمە، «هەڵبژاردن» ڕابگرە) بۆ کردنەوەی، نیشانکردنی وەک تەواوکراو یان نەخوێندراو، بینینی زانیارییەکانی، گواستنەوەی بۆ ئەرشیف یان سڕینەوەی. ناونیشانەکە لێ بدە بۆ مێنیوی کتێبخانە: کتێبەکان چۆن ڕیز و پیشان دەدرێن، گەڕان، بوخچەی کتێبخانە و ڕێکخستنەکان.\n\nبوخچەی کتێبخانە لە ڕێکخستنەکان دادەنرێت، لەژێر کتێبخانە، وەک «بوخچەی کتێبخانە»؛ لەوێ دەتوانیت کتێبەکان وەک تۆڕێکی بەرگیش پیشان بدەیت. بۆ هەموو فایلێکی تر، «فایلەکان» لە لیستی ئامرازەکان بەکاربهێنە."
