home.plugin.name = شاشەی سەرەکی
home.plugin.description = لاپەڕەی سەرەکی: لاپەڕەی ویجێتەکان، وەک ئەو کتێبەی دەیخوێنیتەوە و ئامرازەکان.
home.plugin.how = "شاشەی سەرەکی لە چەند لاپەڕە پێک دێت، هەریەکەیان تۆڕێکە لە ویجێت و ئامراز وەک لەسەر مۆبایل. لە سەرەتادا کاتژمێر و ئەو کتێبەی دەیخوێنیتەوە و ئەو کتێبانەی تازە خوێندووتنەتەوە لە یەک لاپەڕەن و هەموو ئامرازەکان لە لاپەڕەی دواتر.\n\nلە بەشێک بدە بۆ کردنەوەی، و بخشێنە یان دوگمەکانی لاپەڕە بەکاربهێنە بۆ گۆڕینی لاپەڕە. تەنیا بە دوگمەکان، دوگمە تیرەکان لە بەشێکەوە دەچنە بەشەکەی دواتر و «هەڵبژاردن» دەیکاتەوە.\n\nبۆ ڕیزکردنەوەی، شاشەی سەرەکی ڕابگرە، لێدە لە قەڵەمی ژێر لاپەڕەکە یان لە مێنیو «دەستکاریکردنی شاشەی سەرەکی» هەڵبژێرە. بەشەکان ڕابکێشە بۆ جوڵاندنیان یان لە یەکێکیان بدە بۆ هەڵبژاردنەکانی، بە دوگمەکانیش دەکرێت. «زیادکردنی ویجێت» یش لەوێیە. «ستوون» و «ڕیز» لە ڕێکخستنەکان، لە ڕووکار، لە بەشی شاشەی سەرەکین.\n\nلەسەر شاشەیەکی ئاراستە پان، شاشەی سەرەکی هەمان بەشەکان بە ستوونی زیاتر نیشان دەدات، هەر لاپەڕەیەک پڕ دەبێت پێش ئەوەی دواتر دەست پێ بکات، و کارتەکان لە نزیکەی 110 mm پانتر نین؛ ئەوەی بە ستوونی ڕێکت خستووە ناگۆڕدرێت. ئەگەر بە پانی ڕێکی بخەیت، ئەو ڕیزبەندییە بۆ ئەو ئاراستەیە بە تەنیا دەمێنێتەوە: ویجێتی نوێ بۆ هەردووکیان زیاد دەکرێن. «ڕێکخستنەوەی ڕیزبەندی پان» لە «زیادکردن» (لە کاتی دەستکاریکردندا) دەگەڕێتەوە سەر ڕیزبەندییە وەرگیراوەکە. سڕینەوەی ویجێت یان ئامرازێک لە یەک ئاراستەدا لە ئەوی تر ناسڕێتەوە."
