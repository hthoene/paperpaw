lock.plugin.name = قفڵی شاشە
lock.plugin.description = PIN، شێوازێک یان وشەی نهێنییەک کاتی هەستانەوەی ئامێرەکە؛ دەستلێدان لە کاتی خوێندنەوەدا قفڵ دەکرێت.
lock.plugin.how = "قفڵی شاشە لە کاتی دەستپێکردنی PaperPaw و هەستانەوەی ئامێرەکەدا PIN، شێواز یان وشەی نهێنی دەپرسێت. لە سەرەتادا ناچالاکە. تەنیا لە بەکارهێنانی ئاسایی دەپارێزێت: کۆد و ژمارەی هەوڵە هەڵەکان لەسەر کارتی SD دەپارێزرێن، بۆیە هەرکەسێک کارتەکە دەربهێنێت، دەستکاری بکات یان بیگۆڕێت لە قفڵەکە دەپەڕێتەوە.\n\nلە ڕێکخستنەکان، لە ئامێر، قفڵی شاشە ڕێکی بخە: ئەگەر کۆدێکی بەکارهاتوو هەبێت بینووسە، جۆرەکە هەڵبژێرە، پاشان کۆدی نوێ دووجار. شێواز تەنیا لەسەر شاشەی دەستلێدان پێشکەش دەکرێت.\n\nدوای پێنج هەوڵی هەڵە، هەوڵی دواتر نیو خولەک چاوەڕێ دەکات. «ئێستا قفڵ بکە» یەکسەر قفڵ دەکات و دەکرێت بخرێتە سەر دوگمەیەک، ئاماژەیەک یان یاسایەک. «قفڵکردن دوای هەستانەوە» دەکرێت ناچالاک بکرێت، ئینجا تەنیا دەستپێکردنێکی ڕاستەقینە (هەڵکردن یان دووبارە دەستپێکردنەوە) قفڵ دەکات، جگە لەو شوێنانەی هەر هەستانەوەیەک دەستپێکردنە، وەک X4 لەسەر باتری.\n\nلە تەنیشتیەوە قفڵی دەستلێدان: «قفڵکردنی دەستلێدان» لە پانێلی خێرا و مێنیوی خوێندنەوە وا دەکات لێدان و خشاندن و قەڵەم هیچ نەکەن و دوگمەکان هەر کار بکەن، بۆ نموونە بۆ خوێندنەوە بە دەستێک لەسەر شاشە. بۆ کردنەوەی قفڵ، بە یەک پەنجە دووجار لێبدە و کەمێک پەنجەکەت لەسەری ڕابگرە؛ ڕاگرتنی دوگمەی هێز مێنیوی هێز دەکاتەوە، کە «کردنەوەی قفڵی دەستلێدان» بە دوگمەکان دەیکات؛ لەسەر X4 Pro، ڕاگرتنی دوگمەی سەرەکی یەکسەر قفڵەکە دەکاتەوە."
