news.plugin.name = هەواڵ
news.plugin.description = فیدی هەواڵ (RSS، Atom) وەک کتێب دەهێنێت بۆ خوێندنەوە.
news.plugin.how = "هەواڵ فیدی RSS یان Atom دەکات بە کتێب. هەر فیدێک دەبێتە یەک کتێب لە بوخچەی News ی کتێبخانە، بە نوێترین بابەتەکانییەوە وەک دەقی سادە، بۆ خوێندنەوە وەک هەر کتێبێکی تر.\n\nهەواڵ لە مێنیوی ئامرازەکان بکەرەوە و «زیادکردنی فید» هەڵبژێرە؛ ناونیشانەکەی لە ماڵپەڕی ڕۆژنامە یان بلۆگەکەیە. «هێنانی هەواڵ» هەموو فیدەکان دەهێنێت و کتێبە پێشووەکان دەگۆڕێتەوە. فیدێک ڕابگرە (بە دوگمەکان، «هەڵبژاردن» ڕابگرە) بۆ هێنان یان سڕینەوەی بە تەنیا. فیدێکی سڕاوە کتێبەکەی لە کتێبخانە دەهێڵێتەوە.\n\nهێنان تۆڕی دەوێت. «بابەت بۆ هەر فیدێک» (ڕێکخستنەکان، کتێبخانە) دیاری دەکات هەر کتێبێک چەند بابەتی تێدایە. ویجێتی «سەردێڕە هەواڵەکان» لە شاشەی سەرەکی نیشانیان دەدات."
