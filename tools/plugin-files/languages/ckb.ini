format-cbz.plugin.name = کتێبی کۆمیکس
format-cbz.plugin.description = ئەرشیفی کتێبی کۆمیکس (.cbz) دەکاتەوە، وێنەیەک بۆ هەر لاپەڕەیەک.
format-cbz.plugin.how = "ئەرشیفی کتێبی کۆمیکس (.cbz) دەکاتەوە: وێنەیەک بۆ هەر لاپەڕەیەک، بەپێی شاشە، بەپێی ڕیزبەندی ناوەکانیان (2 پێش 10).\n\nلە بوخچەی کتێبخانە دایانبنێ و لە کتێبخانەوە بیانکەرەوە؛ لاپەڕەکان وەک هەر کتێبێک هەڵبدەرەوە. وێنە گەورەکان یەکەم جار کەمێک دەخایەنن، لەسەر X4 زیاتر لە شوێنەکانی تر.\n\nڕێکخستنەکانی خوێندنەوە (ڕێکخستنەکان، خوێندنەوە): «پانێڵ بە پانێڵ» هەر جارێک یەک پانێڵی لاپەڕەیەک پیشان دەدات، هێندە گەورە کە شاشە ڕێگە بدات، و لاپەڕە هەڵدانەوەکان بەسەریاندا هەنگاو دەنێن؛ لاپەڕەیەک بێ پانێڵ بە تەواوی پیشان دەدرێت. «ئاراستەی لاپەڕەی کۆمیکس» هەڵدانەوەی لاپەڕەکان بۆ مانگا پێچەوانە دەکات (لە ڕاستەوە بۆ چەپ)؛ ComicInfo.xmlی خودی کتێبەکە خۆی ئەمە دەڵێت. کتێبخانە ناونیشانی کتێبێک و زنجیرە و ژمارەکەی لە ComicInfo.xml پیشان دەدات."
