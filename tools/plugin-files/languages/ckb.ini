aids.plugin.name = یارمەتیدەرەکانی خوێندنەوە
aids.plugin.description = سەرەتای وشەی ئەستوور، وشەی گۆڕدراو، وێنە: دەق وەک تۆ دەتەوێت.
aids.plugin.how = "یارمەتیدەرەکانی خوێندنەوە شێوەی دەقی کتێب دەگۆڕن لە کاتی خوێندنەوە. بۆ هەموو کتێبەکان کار دەکەن. «سەرەتای وشەی ئەستوور» و «گۆڕینی وشەکان» لە سەرەتادا ناچالاکن.\n\nلە ڕێکخستنەکان دەیاندۆزیتەوە، لە خوێندنەوە، لە بەشی یارمەتیدەرەکانی خوێندنەوە. «سەرەتای وشەی ئەستوور» نیوەی یەکەمی هەر وشەیەک ئەستوور دەکات، کە هەندێک کەس بە ئاسانتر دەزانن بۆ شوێنکەوتن. «گۆڕینی وشەکان» جووتەکان وەردەگرێت کە وەک «colour = color; Mr. = Mister» نووسراون و بە نیشانەی ؛ جیا کراونەتەوە.\n\nتەنها وشە تەواوەکان دەگۆڕدرێن، وەک ئەوەی نووسیوتە، بۆیە «color» هەرگیز بەشێکی وشەیەکی درێژتر ناگۆڕێت. خودی فایلی کتێبەکە ناگۆڕدرێت.\n\nوێنەی ناو کتێبەکان دەکرێت پیشان بدرێن (وەک لە سەرەتادا)، بکرێن بە ڕیزێکی کورت وەک «[وێنە: کەشتییەک لە دەریا]» کە وەسفی وێنەکە بەکار دێنێت، یان لابدرێن. ئینجا لاپەڕە شوێنی زیاتری بۆ دەق دەبێت، و هیچ شتێک بۆ وێنەیەک کە پیشان نەدرێت کۆد ناکرێتەوە، کە وا دەکات لاپەڕەکان خێراتر هەڵبدرێنەوە. کۆمیکس و کتێبەکانی تری لە وێنە پێکهاتوو ناگۆڕدرێن."
