about.plugin.name = دەربارە
about.plugin.description = وەشان و مۆڵەتەکانی PaperPaw.
about.plugin.how = "دەربارە پیشان دەدات کام وەشانی PaperPawت هەیە، کۆدی سەرچاوەکەی لە کوێیە، و بە کام مۆڵەتەکان دێت.\n\nلە کۆتایی ڕێکخستنەکان دەیدۆزیتەوە، وەک دەربارەی PaperPaw. بە دوگمەکانی تیر و «هەڵبژاردن» ڕیزێک هەڵبژێرە، یان دەستی لێ بدە. ئەو پلاگینانەی لە فیرمواێرەکەدا دروستکراون، و لەو ئامێرانەی پلاگینی کۆددار بار دەکەن، ئەو پەنجەنیشانەی دەبێت پلاگینی وا بۆی دروست کرابێت، لەوێ دەنووسرێن.\n\nمۆڵەتەکان وەک دەقێک لە خوێنەر دەکرێتەوە، بۆیە وەک کتێب لاپەڕەکانی هەڵدەدەیتەوە. مۆڵەتی خودی PaperPaw و مۆڵەتی ئەو فۆنت و ئایکۆن و شێوازی بڕینی وشانەی لەگەڵیدا دێن لەخۆ دەگرێت. پلاگینەکان دەتوانن ڕیزێکی تایبەت بە خۆیان زیاد بکەن، وەک دروستکەری ڕووکارێک."
