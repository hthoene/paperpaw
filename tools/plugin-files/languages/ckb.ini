opds.plugin.name = کاتالۆگەکانی OPDS
opds.plugin.description = کاتالۆگەکانی OPDS دەگەڕێت، کتێبەکانیان دادەگرێت و بوخچەکان لەگەڵیان هاوکات دەهێڵێتەوە.
opds.plugin.how = "کاتالۆگەکانی OPDS کتێبخانەی ئۆنلاینن وەک Project Gutenberg، Calibre-Web، Kavita یان Komga. ئەم پلاگینە وەک بوخچە دەیانگەڕێت و بەناویاندا دەگەڕێت و کتێبەکانیان دادەگرێتە ناو کتێبخانە.\n\n«کاتالۆگەکان» لە مێنیوی ئامرازەکان بکەرەوە و «زیادکردنی کاتالۆگ» هەڵبژێرە: ناونیشانێک و، ئەگەر کاتالۆگەکە هەژمارێکی بوێت، ناوی بەکارهێنەر و وشەی نهێنی. لە کاتالۆگێک بدە بۆ گەڕانی؛ ڕایبگرە (بە دوگمەکان، «هەڵبژاردن» ڕابگرە) بۆ هاوکاتکردن، دەستکاریکردن یان سڕینەوەی.\n\nکاتێک «هاوکاتکردنی ئەم کاتالۆگە» چالاکە، «هاوکاتکردنی کاتالۆگەکان» کتێبە نوێکانی دادەگرێتە ناو بوخچەکەی. «کتێب بۆ هەر هاوکاتکردنێک» سنووردار دەکات چەند کتێب لە یەک هاوکاتکردندا دەهێنرێن، بۆ ئەوەی کاتالۆگێکی گەورە ئامێرەکە پڕ نەکات. «بوخچەی کلاود (WebDAV)» لەبری کاتالۆگ کار دەکات."
