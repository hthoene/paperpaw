picture-home.plugin.name = Irudidun hasierako pantaila
picture-home.plugin.description = Hasierako pantaila bat widgeten atzean zure irudi propioarekin, eta konfiguratzen duzun egoera-barra batekin.
picture-home.plugin.how = "Irudidun hasierako pantailak hasierako pantaila ordezkatzen du piztuta dagoen bitartean: zure irudi propioa widgeten atzean, eta antolatzen dituzun widget eta tresnen orriak. Itzali plugin-kudeatzailean eta integratutako hasierako pantaila itzultzen da, bere orri propioekin.\n\nJarri irudiak (JPEG, PNG edo GIF) txarteleko karpeta batean (lehenespenez wallpapers), eta gero aukeratu bat Ezarpenak, Pertsonalizatu, Irudidun hasierako pantaila atalean. Egokitzeak pantaila nola betetzen duen esaten du (bete, irudi osoa, luzatu, jatorrizko tamaina, mosaiko), Posizioak zein zati geratzen den, Zoomak zein handi, eta Argitu irudia-k zein zurbil: irudi zurbilago batek widgetak errazago irakurtzen laguntzen du. Irudia pantaila-tamaina bakoitzerako behin prestatzen da, eta une bat behar du.\n\nWidgetak irudiaren gaineko plaketan daude. Antolatu orria integratutako hasierako pantailan bezala: orriaren azpiko arkatza, edo Editatu hasierako pantaila menuan.\n\nEgoera-barra (ordua, Wi-Fi, bateria, edo aukeratzen duzuna) piztuta, itzalita edo automatikoa izan daiteke, goian edo behean, zabalera osoan edo pilula txiki bat ezkerrean, erdian edo eskuinean, plaka argi, ilun edo gris batean edo irudian bertan. Botoien izenak dituen lerroa (X4-n) piztuta, itzalita edo automatikoa ere izan daiteke. Automatikoak esan nahi du botoi bat sakatzeak segundo batzuetan erakusten dituela; sakatze horrek ez du beste ezer egiten.\n\nIrudiaren errendatzeak irudia nola marrazten den esaten du: Gris-mailak pantailak dituen gris guztietan (X4-n mantsoagoa), Puntuz zuri-beltzeko puntuetan (azkarra), edo Automatikoa, integratutako hasierako pantailak bezala: gris-mailak pantaila marrazten denean, puntuak lehen aldaketaren ondoren. Pantailak gris-mailarik ez duen tokian, gris-mailek puntuetara itzultzen dute."
