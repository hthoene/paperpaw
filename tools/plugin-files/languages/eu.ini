lock.plugin.name = Pantaila-blokeoa
lock.plugin.description = PIN bat, eredu bat edo pasahitz bat gailua esnatzean; ukipena blokeatuta irakurtzean.
lock.plugin.how = "Pantaila-blokeoak PIN bat, eredu bat edo pasahitz bat eskatzen du PaperPaw abiatzen denean eta gailua esnatzen denean. Hasieran itzalita dago. Ustekabeko erabilera saihesteko soilik balio du: kodea eta huts egindako saiakera kopurua SD txartelean gordetzen dira, beraz txartela ateratzen, editatzen edo aldatzen duenak blokeoa saihesten du.\n\nEzarri ezarpenetan, Gailua, Pantaila-blokeoa atalean: sartu erabiltzen ari zaren kodea, baldin badago, aukeratu mota, eta gero kode berria birritan. Eredua ukipen-pantailetan soilik eskaintzen da.\n\nBost saiakera okerren ondoren, hurrengoak minutu erdi itxaron behar du. Blokeatu orain berehala blokeatzen du eta botoi, keinu edo arau batean jar daiteke. Blokeatu esnatu ondoren itzali daiteke, eta orduan benetako abiatzeak soilik blokeatzen du (pizte edo berrabiaraztea), esnatze bakoitza abiatze bat den tokian izan ezik, X4-ren bateria-erabileran bezala.\n\nHorren ondoan, ukipen-blokeoa: Blokeatu ukipena sarbide azkarrean eta irakurketa-menuan ukitzeei, irristatzeei eta arkatzari ezer egiten ez uzten die, botoiek funtzionatzen jarraitzen duten bitartean, adibidez eskua pantailan duzula irakurtzeko. Desblokeatzeko, ukitu birritan hatz batekin eta eutsi une batez; pizteko botoiari eusteak Energia menua irekitzen du, non Desblokeatu ukipena botoiekin egiten den; X4 Pro-n, hasierako tekla sakatuta edukitzeak berehala desblokeatzen du."
