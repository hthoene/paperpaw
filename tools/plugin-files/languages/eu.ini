widgets.plugin.name = Widget-paketea
widgets.plugin.description = Widget gehiago hasierako pantailarako: erlojuak, egutegi bat, aipuak, liburuak, oharrak eta gehiago.
widgets.plugin.how = "Widget-paketeak widget asko gehitzen ditu hasierako pantailarako: erlojuak (analogikoa, hitzezkoa, lauzatan, munduko erlojua), egutegi bat, urtea orain arte, kontu-atzera bat, ilargi-fasea, eta eguna eta data; eguneko aipu bat, oharrak, egiteko-zerrendak, irudiak, agur bat eta PaperPaw-en logoa; eta liburuetarako, orain irakurtzen ari zarena, aurrerapena, hurrengoa, sailak, gogokoak, nabarmendu bat eta liburutegia zenbakitan. Bateria-widget bat ere badago.\n\nGehitu Editatu hasierako pantaila aukerarekin menuan (edo hasierako pantailari eutsiz), gero Gehitu widget bat. Bakoitzak bere ezarpenak ditu, adibidez markoa, tamaina eta lerrokatzea. Aldatzen den widget bat hautatzen baduzu, eguneko aipua bezala, hurrengoa erakusten du. Zure aipuak quotes.txt fitxategian doaz, txarteleko .paperpaw/plugins/widgets karpetan, lerro bakoitza testua | egilea gisa. Ordu-widgetek ordua ezarrita izatea behar dute; Wi-Fi-k ezartzen du."
