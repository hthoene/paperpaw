reading-goal.plugin.name = Irakurketa-helburua
reading-goal.plugin.description = Egunean irakurtzeko minutuak, eta hasierako pantailan katu bat, bere umorea gaurko irakurketaren araberakoa dena.
reading-goal.plugin.how = "Zure hasierako pantailako katu batek gaurko irakurketa nola doan erakusten du: triste oraindik irakurri ez duzun bitartean, erdipurdi pixka bat irakurri ondoren, pozik zure eguneko helburuaren erditik aurrera, alai lortu duzunean.\n\nGehitu Irakurketa-katua widgeta hasierako pantailara (eutsi hasierako pantailari, gero gehitu widget bat), edo aukeratu Gaurko irakurketa-katua lo-pantaila gisa. Katua ukitzeak eguneko helburua irekitzen du; irakurketa-estatistiken helburua da, irakurtzen dituzun minutuak zenbatzen dituena.\n\nEzarpenetan, Irakurketa atalean, Pozik hemendik eta Alai hemendik aukerek ezartzen dute helburuaren zein ehunekotik aurrera dagoen katua pozik edo alai, eta Irudi propioak aukerak irudien karpeta bat (sad, meh, content eta happy), katuen ordez erakusteko. Irudiak PNG edo JPEG fitxategiak dira; karpetarik ez badago, katuak erakusten dira."
