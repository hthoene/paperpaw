pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Kontzentrazio-tenporizadore bat lan- eta atseden-txandekin, widgetekin eta eguneroko kontagailu batekin.
pomodoro.plugin.how = "Pomodoro tenporizadore bat: lan egin kontzentrazio-txandetan, gero atseden hartu. Ez du konfiguraziorik behar: 25 minutu kontzentrazioa, 5 atsedena, eta lau txandaren ondoren 15 minutuko atseden luze bat.\n\nIreki Pomodoro tresnen menuan eta sakatu Hasi, edo gehitu bere widgetak hasierako pantailara (eutsi hasierako pantailari, gero gehitu widget bat): Pomodoro tenporizadorea faseak eta geratzen diren minutuak erakusten ditu, Pomodoro hasi/eten botoi bat da, eta Pomodoro gaur amaitutako txandak zenbatzen ditu, zure eguneroko helburuarekin. Tenporizadorea ukitzeak hasi edo eten egiten du; eutsiz gero pantaila osoa irekitzen da.\n\nTenporizadoreak martxan jarraitzen du pantaila uzten duzunean, eta berrabiarazi ondoren erlojuaren arabera jarraitzen du. Irakurlea lo dagoen bitartean ez da ezer exekutatzen: bitartean amaitu den fase bat esnatzean jakinarazten da. Ohar batek fase bat noiz amaitu den esaten dizu. Bateria aurrezteko, erlojua minutuan behin eguneratzen da (pantaila osoan azken minutuan hamar segundoro) eta ez du inoiz irakurlea esna mantentzen.\n\nEzarpenetan, Pomodoro atalean, iraupenak eta multzo bateko txandak ezartzen dituzu, eta hurrengo fasea berez hasten den ala ez. Gehiago atalean: pantailaren keinu bat edo aurreko argiaren keinu bat fase bat amaitzean, eta eguneroko helburu bat."
