news.plugin.name = Berriak
news.plugin.description = Berri-jarioak (RSS, Atom) eskuratzen ditu liburu gisa irakurtzeko.
news.plugin.how = "Berriak-ek RSS edo Atom jarioak liburu bihurtzen ditu. Jario bakoitza liburu bat bihurtzen da liburutegiko News karpetan, bere azken artikuluekin testu soil gisa, beste edozein liburu bezala irakurtzeko.\n\nIreki Berriak Tresnak menuan eta aukeratu Gehitu jario bat; bere helbidea egunkariaren edo blogaren webgunean dago. Eskuratu berriak jario guztiak eskuratzen ditu eta aurreko liburuak ordezkatzen ditu. Eutsi jario bati (botoiekin, eutsi Hautatu botoiari) berak bakarrik eskuratzeko edo kentzeko. Kendutako jario batek bere liburua liburutegian uzten du.\n\nEskuratzeak sarea behar du. Jario bakoitzeko artikuluak (Ezarpenak, Liburutegia) ezartzen du liburu bakoitzak zenbat artikulu dituen. Berrien titularrak widgetak hasierako pantailan erakusten ditu."
