keyboard.plugin.name = Teklatua
keyboard.plugin.description = Testua pantailan sartzen du, ukipenez edo botoiekin.
keyboard.plugin.how = "Teklatua zerbaitek testua behar duen bakoitzean irekitzen da: bilaketa, pasahitza, oharra edo ezarpena. Ukipenez eta botoiekin soilik funtzionatzen du.\n\nBotoiekin, ezkerrak eta eskuinak errenkada batean zehar mugitzen dute, orri-botoiek errenkaden artean, Hautatu botoiak tekla sakatzen du eta Atzera botoiak bertan behera uzten du; ezkerrak eta eskuinak errenkada inguruan ibiltzen dira, eta goiak eta behek zure zutabean jarraitzen dute. Maius botoiak hurrengo letra larri bihurtzen du; bi aldiz sakatuta letra guztiak, eta beste behin gelditzeko. Eutsi letra bati (botoiekin: eutsi Hautatu botoiari) bere letra larria berehala hautatuta eta é eta è bezalako azentuak lortzeko; hemen ñ eta ç ere horrela datoz n eta c letretatik (botoiekin, teklatuak hala esaten du letra horietan). Ados botoiak amaitzen du; botoiekin, eutsi Atzera edozein tokitatik amaitzeko (Atzera botoi bakarrak bertan behera uzten du), edo eutsi Hautatu letra ez den tekla batean. Itsatsi botoiak arbeleko testua txertatzen du, eta Telefonoa, eskaintzen denean, testua zure telefonoan idaztea uzten dizu.\n\nEzarpenetan, Gailua, Teklatua atalean: Teklatu-diseinuak diseinuak aukeratzen ditu. Lehenespenez menuen hizkuntzari jarraitzen dio; hainbat badaude, tekla batek haien artean aldatzen du. Umlaut teklak aukerak ä, ö, ü eta ß letretarako tekla propioak ematen ditu. Tamaina aukerak teklak eta letrak handiagoak egiten ditu; botoiekin soilik, errenkadak ordenagailu-teklatu batenak izaten jarraitzen dute. Ukipen-pantailetan, Teklen forma aukerak teklek nolako itxura duten aldatzen du. Letra larri automatikoak esaldi bakoitza letra larriz hasten du."
