files.plugin.name = Fitxategi-arakatzailea
files.plugin.description = Gailuko liburuak eta karpetak zerrendatzen ditu eta irekitzen ditu.
files.plugin.how = "Liburutegiak zure liburutegi-karpetako liburuak zerrendatzen ditu, bakoitza bere azalarekin, izenburuarekin, egilearekin eta zenbat irakurri duzunarekin. Azkenekoz irakurri duzun liburua goian dago txartel gisa, beraz irakurtzen jarraitzeko ukitze bat nahikoa da, edo Hautatu botoia sakatzea. Liburutegia liburuak bilatzen ari den bitartean, orain arte zenbat aurkitu dituen esaten du.\n\nLiburuen gainean aukeratu zer erakusten den: guztiak, irakurtzen ari zarenak, irakurri gabeak edo irakurrita daudenak, edo apalak (egilearen, sailaren, etiketaren, gogokoen arabera, hasi duzun saila bakoitzaren hurrengo liburua). Ukitu liburu bat irakurtzeko; eutsi (botoiekin, eutsi Hautatu botoiari) irekitzeko, irakurrita edo irakurri gabe markatzeko, bere informazioa ikusteko, artxibora mugitzeko edo ezabatzeko. Ukitu izenburua liburutegiaren menurako: liburuak nola ordenatzen eta erakusten diren, bilaketa, liburutegi-karpeta eta ezarpenak.\n\nLiburutegi-karpeta Ezarpenetan ezartzen da, Liburutegia atalean, Liburutegi-karpeta gisa; hor liburuak azal-sareta gisa ere erakutsi ditzakezu. Gainerako fitxategi guztietarako, erabili Fitxategiak Tresnak menuan."
