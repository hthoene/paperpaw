profiles.plugin.name = Irakurketa-profilak
profiles.plugin.description = Irakurketa- eta pantaila-ezarpenen multzo izendunak, ukitze batekin aldatzen direnak.
profiles.plugin.how = "Profil batek zure irakurketa-ezarpenak, pantaila-ezarpenak eta egoera-lerroak gordetzen ditu izen baten azpian, adibidez Gaua edo Letra handia, eta ukitze batekin berrezartzen ditu.\n\nIreki Profilak irakurketa-menuan, Gehiago atalean, edo Ezarpenetan, Pertsonalizatu atalean. Ukitu profil bat erabiltzeko; erabileran dagoena markatuta dago. Eutsi (botoiekin, eutsi Hautatu botoiari) uneko ezarpenak bertan gordetzeko, izena aldatzeko edo kentzeko. Gorde profil berri gisa orain ezarrita dagoena gordetzen du.\n\nHurrengo profila zerrendako hurrengora pasatzen da; jarri botoi batean edo arau batean."
