aids.plugin.name = Irakurketa-laguntzak
aids.plugin.description = Hitz-hasiera lodiak, ordezkatutako hitzak, irudiak: testua nahi duzun bezala.
aids.plugin.how = "Irakurketa-laguntzek liburu baten testuak irakurtzean duen itxura aldatzen dute. Liburu guztietan aplikatzen dira. Hitz-hasiera lodiak eta Ordezkatu hitzak hasieran itzalita daude.\n\nEzarpenetan aurkituko dituzu, Irakurketa atalean, Irakurketa-laguntzak sekzioan. Hitz-hasiera lodiak hitz bakoitzaren lehen erdia lodiz jartzen du, eta batzuei jarraitzea errazten die. Ordezkatu hitzak «colour = color; Mr. = Mister» bezalako bikoteak hartzen ditu, puntu eta komaz bereizita.\n\nHitz osoak soilik ordezkatzen dira, idatzi duzun bezala zehazki, beraz «color» ez da inoiz hitz luzeago baten zati bat aldatuko. Liburuaren fitxategia bera ez da aldatzen.\n\nLiburuetako irudiak erakutsi daitezke (hasieran bezala), «[Irudia: itsasoko untzi bat]» bezalako lerro labur batean bihurtu, irudiaren deskribapena erabiliz, edo kendu. Orduan orrialde batek leku gehiago du testurako, eta erakusten ez den irudi baterako ez da ezer deskodetzen, eta horrek orriak azkarrago pasatzen ditu. Komikiak eta irudiz osatutako beste liburuak ez dira aldatzen."
