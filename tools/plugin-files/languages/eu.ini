smart-home.plugin.name = Etxe adimenduna
smart-home.plugin.description = Zure Home Assistant-eko balioak eta etengailuak panel batean eta hasierako pantailako widget gisa. Zure etxeko sareko Home Assistant-ekin funtzionatzen du.
smart-home.plugin.how = "Etxe adimendunak zure Home Assistant-eko balioak eta etengailuak erakusten ditu: tenperaturak, hezetasuna, energia, ateak eta leihoak, argiak, etengailuak eta eszenak. Zure zerbitzariarekin REST APIaren bidez hitz egiten du zure etxeko sarean; ez da beste zerbitzurik tartean sartzen.\n\nIreki Etxe adimenduna tresnen menuan, gero Konexioa: idatzi zure Home Assistant-en helbidea (adibidez http://homeassistant.local:8123) eta iraupen luzeko sarbide-token bat (egin bat zure Home Assistant-eko profil-orriaren behealdean). Tokena pasahitzen eta gakoen artean gordetzen da, inoiz ez ezarpen-fitxategi batean. http soila zure etxeko sareko helbideetarako soilik erabiltzen da; beste nonbaiteko zerbitzari baterako aktibatu \"Etxeko saretik kanpoko zerbitzariak\" ezarpenetan eta erabili https baliozko ziurtagiri batekin.\n\nAukeratu entitateak aukerak zure zerbitzariak dituenaren zerrenda bat irekitzen du: bilatu izenez edo id bidez eta hautatu entitate bat erakusteko (hautatu berriro kentzeko). Gela bat eman diezaiokezu, panelean eta gela-widgetetan taldekatzen duena. Gehienez 24 entitate gordetzen dira. Panelean hautatu argi, etengailu edo eszena bat aldatzeko: errenkadak zerbitzariaren erantzuna erakusten du. Hautatzen duzun sentsore bat berriro irakurtzen da.\n\nWidgetak (eutsi hasierako pantailari, gero gehitu widget bat): Etxe adimendunaren balioak irakurketa bat handi erakusten du, taldeak gela bateko entitateak zerrendatzen ditu, etengailua argi edo etengailu baterako botoi bat da, eta gelak gela bateko irakurketak eta etengailuak dituen txartel bat da. Widget bakoitzaren ezarpenek esaten dute zein entitate edo gela erakusten duen.\n\nEtxea irakurtzen da panela irekitzen duzunean, eskatzen duzunean (Eguneratu errenkada edo balio- edo talde-widget baten gaineko ukitze bat), irakurlea esnatzen denean Wi-Fi piztuta dagoen tokian, eta kargagailua konektatuta dagoen bitartean ezarritako egutegiaren arabera. Ez du inoiz irratia berez pizten eta ez du inoiz piztuta mantentzen."
