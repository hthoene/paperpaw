rules.plugin.name = Arauak
rules.plugin.description = Zerbait gertatzen denean, zerbait egiten du: adib. gau modua 22:00etan.
rules.plugin.how = "Arau batek berez zerbait egiten du zerbait gertatzen denean: gau modua egunero 22:00etan, edo katalogoak sinkronizatzea PaperPaw abiatzen denean.\n\nArauak Ezarpenetan daude, Pertsonalizatu atalean, Arauak gisa. Gehitu araua-k Noiz? galdetzen du (PaperPaw abiatzen denean, eguneko ordu bat, liburu bat irekitzean edo ixtean, bateria, kargatzea, etengailu bat eta gehiago) eta Orduan zer? (ekintza bat exekutatu, etengailu bat piztu edo itzali, zenbaki bat ezarri, mezu bat erakutsi). Ukitu arau bat eteteko; eutsi (botoiekin, eutsi Hautatu botoiari) Eguneko bi orduren artean bezalako baldintza baterako, edo kentzeko.\n\nAukeratzeko ekintzak, etengailuak eta zenbakiak pluginaren arabera datoz: aukeratu plugina, gero zer ekartzen duen; atzera botoiak berriro ateratzen zaitu. Erakusten den pantailan eragiten duen ekintza batek, Atzera edo Hurrengo orrialdea bezala, hor sakatuz gero egingo lukeena egiten du.\n\nOrduak edozein pantaila irekita dagoela aplikatzen dira. Elkar desegiten duten bi arau pauso batzuen ondoren gelditzen dira."
