about.plugin.name = Honi buruz
about.plugin.description = PaperPaw-en bertsioa eta lizentziak.
about.plugin.how = "«Honi buruz»-ek erakusten du PaperPaw-en zer bertsio duzun, non dagoen bere iturburu-kodea eta zer lizentziapean datorren.\n\nEzarpenen amaieran aurkituko duzu, PaperPaw-i buruz gisa. Aukeratu errenkada bat geziekin eta Hautatu botoiarekin, edo ukitu. Firmwarean integratutako pluginak eta, kodea duten pluginak kargatzen dituzten gailuetan, plugin horiek eraikita egon behar duten hatz-marka ere zerrendatuta daude.\n\nLizentziak testu gisa irekitzen dira irakurlean, beraz liburu bat bezala pasatzen dituzu orriak. PaperPaw-en lizentzia propioa dakar, eta berarekin datozen letra-tipoen, ikonoen eta hitz-zatiketa-ereduen lizentziak. Pluginek lerro propio bat gehi dezakete, adibidez gai baten egilea."
