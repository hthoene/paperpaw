calibre.plugin.name = Hari gabeko liburutegia
calibre.plugin.description = Liburuak sarearen bidez jasotzen ditu. Hari gabeko gailu gisa funtzionatzen du calibre-rentzat.
calibre.plugin.how = "Hari gabeko liburutegiak gailua zure ordenagailuko Calibre-n hari gabeko gailu gisa agertzen uzten du. Calibre-k orduan liburuak bidal diezazkioke, zerrendatu eta ezabatu. Liburuak liburutegira joaten dira.\n\nIreki Hari gabeko liburutegia Tresnak menuan, gailua eta ordenagailua Wi-Fi sare berean daudela. Calibre-n aukeratu Konektatu/partekatu, gero Hasi hari gabeko gailuaren konexioa. Gailuak zure ordenagailua aurkitu duenean, haren izena erakusten du; ukitu Konektatu (botoiekin, sakatu Hautatu). Calibre-k liburuak gehitu eta ezabatu ditzake hemen, beraz konektatu zure ordenagailuarekin soilik. Pantaila ixteak konexioa amaitzen du.\n\nCalibre berez aurkitzen ez bada, sartu bere ordenagailuaren helbidea Ezarpenetan, Liburutegia atalean, Calibre zatiko Helbidea gisa. Calibre-k 9090 ez den beste ataka bat erabiltzen badu, gehitu :ataka gisa, adib. 192.168.1.20:9091."
