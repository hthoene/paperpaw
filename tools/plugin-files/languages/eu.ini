settings.plugin.name = Ezarpenak
settings.plugin.description = Ezarpen-orriak, plugin guztien ezarpenetatik eraikiak.
settings.plugin.how = "Ezarpenek PaperPaw-en eta bere pluginen ezar daitekeen guztia erakusten dute, orrietan. Pluginek ez dute pantaila propiorik behar: aitortzen dutena hemen agertzen da, taldeetan, ezarpen bakoitzaren azpian bere deskribapenarekin.\n\nIreki menuko Ezarpenak aukerarekin. Ukitu talde bat irekitzeko, gero ezarpen bat aldatzeko edo aukeratzeko; zenbakiek − eta + botoiak dituzte. Botoiekin, joan ezarpen batera eta sakatu Hautatu: ezkerrak eta eskuinak zenbaki bat aldatzen dute, Hautatu botoiak mantentzen du, Atzera botoiak aurreko balioa berrezartzen du.\n\nAldaketak berehala aplikatzen dira. Bilatu-k ezarpen bat hitzen bidez aurkitzen du eta Ezarpen aurreratuak-ek gutxitan behar direnak gehitzen ditu. Berrezarri lehenespenak eta Berrezarri guztiak aurretik galdetzen dute."
