bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Urrutiko aginteak, teklatuak eta sentsoreak parekatzen ditu, eta konektatzen ditu.
bluetooth.plugin.how = "Bluetooth-ak urrutiko aginteak, teklatuak eta sentsoreak parekatzen ditu irakurlearekin, Bluetooth duen tokian (X4 Pro).\n\nGehitu gailu bat eskura dagoena bilatzen du; jarri gailua aurretik parekatze moduan. Aukeratu eta berretsi irakurlean (konparatu zenbakia, agertzen den tokian). Urrutiko agintearen edo teklatuaren teklek orriak pasatzen dituzte eta menuetan mugitzen dira; tekla bakoitzak zer egiten duen Kontrolak atalean alda dezakezu.\n\nUrrutiko aginteak atalak esaten du noiz funtzionatzen duten haien teklek: hemen piztuta daudenean, irakurtzean (liburu bat irekita dagoen bitartean konektatuta, bateria aurrezten), edo beti. Menu-botoiak edo gailu baten gaineko sakatze luzeak ahaztu egiten du.\n\nSentsore bat pluginentzat da: aktibatu zein pluginek erabil dezakeen. Bluetooth itzalita dago ezerk erabiltzen ez duen bitartean."
