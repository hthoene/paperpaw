diagnostics.plugin.name = Diagnostikoak
diagnostics.plugin.description = Proba-pantaila bat eta gailuaren atal guztien egiaztapen gidatu bat.
diagnostics.plugin.how = "Diagnostikoak gailu bat egiaztatzeko proba-pantaila bat da: panelak erakus dezakeen gris-maila guztiak erakusten ditu, botoiak eta ukipena probatzeko lau koadro, eta orri-kontagailu bat aurrerapen-barrarekin, freskatze-moduak konparatzeko.\n\nProba-pantailak ez du menu-sarrerarik. Hasierako pantaila da soilik beste pluginik bat eskaintzen ez duen bitartean, edo plugin-kudeatzaileko Pantailak atalean Hasierako pantaila lekuarentzat aukeratzen duzunean.\n\nHautatu botoiak fokuko koadroa markatzen du, eta geziek koadroen artean mugitzen dute; ukipenarekin, ukitu koadro bat. Orri-botoiek proba-orriak pasatzen dituzte. Eutsi Hautatu botoiari, edo eutsi atz bat pantailan, hasieratik hasteko.\n\nGailuaren egiaztapenak, PaperPaw gailuaren firmwarea den tokian Tresnak atalean, gailuaren atal guztiak orriz orri aztertzen ditu: pantaila, botoiak, ukipena, aurreko argia, bateria, txartela, ordua, Wi-Fi, lo egitea eta memoria. Orri bakoitza Huts, Saltatu eta Gainditu aukerekin amaitzen da, neurketek iradokitzen duten erantzuna hautatuta dagoela; gailuak ez dituen atalak saltatzen dira. Erantzun bakoitzaren ondoren, txosten bat idazten du .paperpaw/plugins/diagnostics/device-check.txt fitxategian, pull request batean txertatzeko. Atzera botoiak uzten du, eta berriro irekitzean utzi zuen tokian jarraitzen du. Botoiak soilik dituen gailu batean, aukeratu lehenik Hasi botoien orrian; ordura arte geziek, Hautatu botoiak eta Atzera botoiak orri guztietan bezala funtzionatzen dute."
