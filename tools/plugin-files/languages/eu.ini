wifi.plugin.name = Wi-Fi
wifi.plugin.description = Wi-Fi sareetara konektatzen da behar denean eta ondoren irratia itzaltzen du.
wifi.plugin.how = "Wi-Fi-k sare batera konektatzen da plugin batek internet behar duenean (katalogo bat, sinkronizazio bat, denda, transferentzia bat) eta irratia berriro itzaltzen du ezerk erabiltzen ez duenetik minutu batera, edo berehala Hasiera edo liburu bat erakusten denean, bateria eta memoria aurrezteko.\n\nIreki Wi-Fi Ezarpenetan, edo egoera-lerroko Wi-Fi elementutik. Sareak atalak eskura daudenak zerrendatzen ditu; aukeratu bat eta idatzi bere pasahitza, edo aukeratu Konfiguratu telefonoarekin eta idatzi izena eta pasahitza zure telefonoko nabigatzailean gailuan idatzi beharrean. Ahaztu-k gordetako sare bat kentzen du.\n\nPasahitzak txartelean geratzen dira, modu seguruan gordeta, eta ez dira berriro erakusten. Konektatu behar denean atalean ezartzen duzu Wi-Fi zenbat denboran geratzen den piztuta azken erabileraren ondoren, kargatzean piztuta geratzen den, eta gordetako zein sare doan lehenik hainbat eskura daudenean."
