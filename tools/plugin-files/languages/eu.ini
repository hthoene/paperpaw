home.plugin.name = Hasierako pantaila
home.plugin.description = Hasierako orria: widget-orriak, adibidez irakurtzen ari zaren liburua eta tresnak.
home.plugin.how = "Hasierako pantaila orriz osatuta dago, bakoitza widget eta tresnen sareta bat, telefono batean bezala. Hasieran erlojua, irakurtzen ari zaren liburua eta azkenekoz irakurritako liburuak orri batean daude, eta tresna guztiak hurrengoan.\n\nUkitu elementu bat irekitzeko, eta irristatu edo erabili orri-botoiak orriak aldatzeko. Botoiekin soilik, geziek elementu batetik hurrengora mugitzen dute eta Hautatu botoiak irekitzen du.\n\nBerrantolatzeko, eutsi hasierako pantailari, ukitu orriaren azpiko arkatza edo aukeratu Editatu hasierako pantaila menuan. Arrastatu elementuak mugitzeko edo ukitu bat bere aukerak ikusteko, botoiekin ere bai. Gehitu widget bat ere hor dago. Zutabeak eta Errenkadak ezarpenetan daude, Itxura atalean, Hasierako pantaila sekzioan.\n\nAlboan jarritako pantaila batean, hasierako pantailak elementu berberak erakusten ditu zutabe gehiagorekin, orri bakoitza hurrengoa hasi aurretik beteta, eta 110 mm inguru baino zabalagoak ez diren txartelekin; zutabean antolatutakoa ez da aldatzen. Alboan antolatzen baduzu, diseinu hori orientazio horretarako gordetzen da berez: widget berriak biei gehitzen zaizkie. Gehitu atalean (editatzen ari zarela) Berrezarri horizontaleko diseinua aukerak eratorritakora itzultzen du. Orientazio batean widget edo tresna bat kentzeak ez du bestetik kentzen."
