menu-editor.plugin.description = Menu guztien sarrerak berrantolatzen, kentzen eta gehitzen ditu.
menu-editor.plugin.how = "Menu-editoreak menuek zer duten aldatzen du: mugitu sarrerak gora edo behera, kendu, edo gehitu berriak.\n\nEzarpenetan aurkituko duzu, Pertsonalizatu atalean, Pertsonalizatu menuak gisa. Aukeratu menu bat, gero sarrera bat mugitzeko edo kentzeko; Gehitu sarrera bat-ek berri bat jartzen du. Aldaketak berehala aplikatzen dira. Berrezarri menu hau-k menu bat bere pluginek definitzen duten bezala uzten du, Berrezarri menu guztiak-ek guztiekin egiten du.\n\nEzin zara kanpoan geratu: ezarpenetarako bidea den sarrera bat bertan geratzen da, haietarako beste bide bat gehitu arte."
