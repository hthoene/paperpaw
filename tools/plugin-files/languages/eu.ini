vocabulary.setting.sd-folder.help = SD txartelean: bertako CSV, TSV edo Anki fitxategi bat sorta bat da.
vocabulary.sd.readme = "Ikasketa-txartelak fitxategietatik\n\nJarri fitxategi bat hemen sorta bakoitzeko: Gaztelania.tsv fitxategiak Gaztelania sorta egiten du.\nFitxategiak: .tsv, .csv edo .txt, UTF-8 gisa gordeta, edo .apkg: Anki sorta bat, Onartu Anki-ren bertsio zaharragoak markatuta esportatua. Bere oharren lehen hiru eremuak aurrealdea, atzealdea eta adibidea bihurtzen dira; bere programazioa eta multimedia ez dira irakurtzen, eta PaperPaw-ek ez du inoiz Anki fitxategirik idazten.\n\nTxartel bat lerro bakoitzean: aurrealdea, atzealdea eta adibide bat (aukerakoa), tabulazioz, komaz edo puntu eta komaz bereizita. Lehen lerroak zutabeak izendatu ditzake: front, back, example. Adibidea:\n\netxea\thouse\tEtxea handia da.\n\nGero ireki Ikasketa-txartelak irakurlean, aukeratu SD txarteleko txartelak eta gero Eguneratu sortak txartelean.\n\nJakitekoak:\n- Sortak irakurlean geratzen dira, ikasi duzunarekin. Fitxategi bat berria edo aldatua denean irakurtzen da, eta bere txartelak sortari gehitzen zaizkio edo hor aldatzen dira.\n- Aldatu fitxategiko txartel baten atzealdea edo adibidea: txartela aldatzen da eta zure aurrerapena mantentzen du.\n- Aldatu txartel baten aurrealdeko testua: txartel berri gisa zenbatzen da, eta zaharra hutsetik hasten da. Txartelak aurrealdeko testuaren arabera bereizten dira, zuriuneek eta maiuskulek ez dute zenbatzen. Gorde sorta bat fitxategi batean (SD txarteleko txartelak, Gorde sorta txartelean) eta txartel bakoitzak zenbaki bat izango du id zutabean: aldatu aurrealde bat hor, mantendu fitxategiaren lehen bi lerroak dauden bezala, eta txartelak ikasi duzuna mantentzen du.\n- Gordetzeak sortaren txartelak idazten ditu. Fitxategian zegoena eta txartel ez dena (aurrealderik gabeko lerro bat) ez da mantentzen; hor zegoen fitxategia _izena.bak.tsv gisa kopiatzen da.\n- Gorde fitxategia CSV UTF-8 gisa (ez UTF-16 gisa, ez kalkulu-orri baten formatu propioan). 4 MiB baino handiagoa edo 20.000 lerro baino gehiagokoa den fitxategi bat ez da irakurtzen: zatitu.\n- Fitxategian ezabatzen duzun lerro batek ez du sortako txartela ezabatzen, sorta horretarako Kendu falta diren txartelak aktibatzen ez baduzu. Orduan txartela ikasi duzunarekin batera joaten da.\n- _ ikurrarekin hasten diren izenak dituzten fitxategiak ez dira irakurtzen.\n"
