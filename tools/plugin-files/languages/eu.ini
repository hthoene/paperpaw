notes-vault.plugin.name = Oharren gordailua
notes-vault.plugin.description = Markdown oharren karpeta bat irakurtzen du karpeten, etiketen eta azken aldaketen arabera, hasierako pantailarako widgetekin. Obsidian gordailuekin funtzionatzen du.
notes-vault.plugin.how = "Oharren gordailuak Markdown oharren karpeta bat irakurtzen du (.md fitxategi soilak, ohar-aplikazioek gordetzen dituzten bezala). Obsidian gordailuekin funtzionatzen du.\n\nAukeratu gordailuaren karpeta ezarpenetan, edo gordailuaren orrian tresnetan. Orriak orduan karpetak eskaintzen ditu txartelean dauden bezala, azkenekoz aldatutako oharrak, etiketak eta oharren izenburuetan bilaketa bat.\n\nLehen aldiz, gordailua atzeko planoan indexatzen da bere orria irekita dagoen bitartean; milaka ohar dituen gordailu batek minutu batzuk behar ditu, eta gero berehala irekitzen da. Indizea txartelean gordetzen da eta berriro egiten da gordailuaren orria ordu batzuen ondoren irekitzen denean, edo Eguneratu aukeratzen duzunean.\n\nOhar bat irakurlean irekitzen da. Beste ohar batzuetarako estekak ([[Oharra]], [[Oharra|hitzak]], [[Oharra#Goiburua]]) oharraren izenaren bidez aurkitzen dira gordailuko edozein tokitan; bat jarraitzeak ohar hori irekitzen du, eta Atzera botoiak aurreko oharrera itzultzen du.\n\nGordailuan ez da ezer inoiz aldatzen. Hasierako pantailarako widgetak (azken oharrak, ainguratutako ohar bat, eguneko ohar bat, ausazko ohar bat, etiketak, bilaketa) hasierako pantailaren editorean gehitzen dira. Widget batek bere oharrak karpeta bakar batetik har ditzake: idatzi karpetaren bidea txartelaren erroetatik (adibidez Oharrak/Lana) widgetaren ezarpenetan; hutsik utziz gero, gordailuko ohar guztiak hartzen ditu."
