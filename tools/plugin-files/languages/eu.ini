reader.plugin.name = Irakurlea
reader.plugin.description = Liburuak orriz orri erakusten ditu, aurkibidearekin eta irakurketa-ezarpenekin.
reader.plugin.how = "Irakurleak liburuak orriz orri erakusten ditu. Ireki liburu bat liburutegitik; azken liburua abioan berriro ireki daiteke (Ireki azken liburua abioan ezarpena).\n\nUkitu pantailaren ezkerra edo eskuina, edo erabili orri-botoiak, orriak pasatzeko. Ukitu erdia edo sakatu Hautatu irakurketa-menurako: Aurkibidea, Bilatu, Joan orrira, Letra-tipoa eta diseinua, Laster-markak eta nabarmenduak eta gehiago. Goiko ertzetik behera sarbide azkarra irekitzen du, beheko ertzetik gora hasierara doa; baita Atzera botoiari eutsiz ere.\n\nEutsi Hautatu botoiari (edo eutsi irudi bati) irudi bat pantaila osoan ikusteko: Ezkerrak eta Eskuinak orriko irudien artean mugitzen dira. Hautatu botoiak 2x, 3x eta atzera zoomatzen du (ukipenean, ukitu birritan); zoomatuta, Ezkerrak eta Eskuinak alboetara mugitzen dute, orri-botoiek (edo irristatzeek) zeharka eta behera jarraitzen dute. Atzera botoiak doitzera itzultzen du, gero orrira (ukipenean, eutsi irteteko). Ukitu goiko eskuineko izkina laster-marka baterako. Eutsi hitz bati nabarmentzeko. Botoiekin, eutsi Ezkerra botoiari: Ezkerrak eta Eskuinak hitzez hitz mugitzen dira, orri-botoiak lerroz lerro, eutsita orriaren muturretara eta paragrafoz paragrafo; Hautatu botoiak hitzaren nabarmentze-barra irekitzen du, Hautatu botoiari eusteak esaldira eta paragrafora zabaltzen du (gero Ezkerrak eta Eskuinak amaiera mugitzen dute, eutsita hasiera). Hautapen batek orri-pasatzeetan zehar jarraitzen du. Esportatu Markdown gisa-k zure oharrak gordetzen ditu."
