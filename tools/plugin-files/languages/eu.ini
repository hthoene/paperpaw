keys.plugin.name = Botoiak eta keinuak
keys.plugin.description = Botoi, ukitze-eremu eta irristatze bakoitzak zer egiten duen, gailuan aldatuta.
keys.plugin.how = "Botoiak eta keinuak atalak botoi, ukitze-eremu eta irristatze bakoitzak zer egiten duen erakusten du, eta gailuan aldatzen uzten dizu.\n\nIreki ezarpenetan, Gailua atalean. Aukeratu lehenik aldaketa non aplikatzen den: Nonahi, Irakurtzean, Hasierako pantailan, Liburutegian edo tresna batean. Gero aukeratu sarrera bat, adibidez eutsitako botoi bat edo ertz batetik barrurako irristatze bat, eta ekintza bat zerrendatik, bilatu dezakezuna. Estandarra-k pluginek eta botoien diseinuak ezarritakoa itzultzen du.\n\nX4-n, hautatzeko, atzera egiteko edo aurrera egiteko botoirik utziko ez lukeen aldaketa bat ukatu egiten da. Amaierako Berrezarri botoiak eta keinuak aukerak aldaketa guztiak desegiten ditu."
