calendar.plugin.description = Zure egutegiak irakurlean: agenda, eguneko, asteko eta hileko ikuspegiak CalDAV, iCal eta fitxategietatik, kontaktuen urtebetetzeak, hasierako widgetak eta lo-pantaila.
calendar.plugin.how = "Zure egutegiak irakurlean: hurrengo egunen agenda, egun bat, aste bat eta hilabete bat, CalDAV egutegien gertaerekin (Nextcloud, Radicale, Baïkal, Fastmail eta beste batzuk), iCal helbideenekin (.ics, webcal://), txarteleko egutegi-fitxategienekin eta zure kontaktuen urtebetetze eta urteurrenekin (CardDAV). Irakurleak egutegiak irakurri bakarrik egiten ditu; ez ditu inoiz aldatzen.\n\nIreki Egutegia tresnen menuan. Lehen errenkadak ikuspegiaren izena du; aukeratu, edo eutsi edozein errenkadari edo sakatu Menua, Agenda, Eguna, Astea, Hilabetea eta Urtebetetzeak artean aldatzeko, egutegiak gehitzeko edo sinkronizatzeko. Eguna eta Astea ikuspegietan, lehen bi errenkadek aurreko eta hurrengo egunera edo astera pasatzen dute (orri-botoiek ere bai); Hilabetea ikuspegian geziek eguna mugitzen dute, orri-botoiek hilabetea, eta Hautatu botoiak eguna irekitzen du. Gertaera batean Hautatu sakatzeak osorik erakusten du: noiz, non, zein egutegi eta nola errepikatzen den. Atzera botoiak urrats bat atzera egiten du.\n\nGehitu egutegi bat Egutegiak atalean (menuan, edo Egutegia ezarpenetan). Aukeratu mota: CalDAV kontu bat (zerbitzariaren helbidea nahikoa da, adib. cloud.example.com/remote.php/dav; gertaerak dituen egutegi bakoitza ikuspegiaren parte bihurtzen da), iCal helbide bat (.ics gisa argitaratutako egutegi bat), txarteleko egutegi-fitxategi bat, edo kontaktuak (CardDAV helbide-liburu bat: irakurleak haiekin gordetako urtebetetzeak eta urteurrenak erakusten ditu). Sartu helbidea, kontu baterako zure erabiltzaile-izena eta pasahitza (hobe aplikazio-pasahitz bat; irakurlearen pasahitzekin batera gordetzen da), eta izen bat. Egutegi bakoitzak marka bat du (puntu bat, eraztun bat, puntu gris bat edo karratu bat), alda dezakezuna, bereizteko; gehienez sei egutegi.\n\nErrepikatzen diren gertaerak (egunero, astero, hilero, urtero, asteko egunekin, kopuruekin, amaiera-datekin eta saltatutako egunekin), egun osoko gertaerak eta beste ordu-eremu batzuetako gertaerak irakurlearen erlojuan erakusten dira. Irakurleak gaurtik hirurogei egun lehenagotik hirurogei egun geroagora arteko gertaerak gordetzen ditu, gehienez 240, eta sarerik gabe erakusten ditu. Irakurri ezin dituen arauek bere gertaera behin erakusten dute.\n\nEgutegiak irakurtzen dira egutegia irekitzen duzunean (gehienez bost minuturik behin), Sinkronizatu orain aukeratzen duzunean, eta, ezarpenetako Egutegia atalean ezartzen duzun bezala, sarea hala ere piztuta dagoenean edo kargatzen hasten denean. Irakurleak ez du inoiz irratia pizten horretarako, Sinkronizatu orain eskatzen duzunean izan ezik.\n\nHasierako pantailarako widgetak (eutsi hasierako pantailari, gero gehitu widget bat): Gaur datak eta egunak dakarrena erakusten ditu, Hurrengo gertaera hurrengo gertaera, Agenda hurrengo egunak, Hilabetea gertaerak dituzten egunen azpian puntu bat duen hilabete bat, eta Urtebetetzeak hurrengo urtebetetzeak. Gertaera bat ukitzeak irekitzen du, hilabeteko egun bat ukitzeak egun hori irekitzen du. Lo-pantailak gaurko agenda erakutsi dezake: aukeratu Egutegia ezarpenetako Lo-pantaila atalean."
