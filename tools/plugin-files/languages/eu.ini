transfer.plugin.name = Transferentzia
transfer.plugin.description = Jarri liburuak eta beste fitxategiak gailuan sare bereko nabigatzaile batetik.
transfer.plugin.how = "Wi-Fi bidezko transferentziak liburuak eta beste fitxategiak gailuan jartzen ditu sare bereko nabigatzaile batetik, kablerik edo aplikaziorik gabe. Fitxategiak jaso, karpetak egin eta ezabatu ere egin dezakezu.\n\nIreki Tresnak menuan. Pantailak helbide bat erakusten du testu gisa eta QR kode gisa: ireki telefono edo ordenagailu bateko nabigatzaile batean, edo eskaneatu kodea. Helbideak aldi bakoitzean berriro sortzen den gako bat du, beraz sareko besteek ezin dituzte zure fitxategiak lortu. Transferentzia pantaila irekita dagoen bitartean exekutatzen da.\n\nPaperPaw-ek berak Wi-Fi kudeatzen duen tokian, X4-n bezala, beheko Router gabe aukerak gailuaren sare propio bat irekitzen du, telefonoak kode bat eskaneatuz batzen dena."
