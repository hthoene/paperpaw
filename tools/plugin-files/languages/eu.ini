koreader.plugin.name = Nabarmenduen partekatzea
koreader.plugin.description = Laster-markak eta nabarmenduak partekatzen ditu KOReader-ekin, bietan irakurtzen diren liburuetarako.
koreader.plugin.how = "Plugin honek laster-markak eta nabarmenduak partekatzen ditu KOReader-ekin, bietan irakurtzen dituzun liburuetarako, gailu bakar batean edo gailuen artean sinkronizatutako liburutegi-karpeta batean. Ez dago ezer konfiguratzeko.\n\nPaperPaw-ek KOReader-ek ere ireki duen liburu bat irekitzen duenean, eta liburuaren laster-markak edo nabarmenduak aldatzen dituzunean, KOReader-en liburuaren ondoko datuetako berria hartzen du, eta hemengo berria KOReader-entzat uzten du, hurrengo aldian liburua irekitzean jaso dezan. Kendutako markak eta aldatutako oharrak ere pasatzen dira.\n\nHau EPUB liburuetarako soilik funtzionatzen du. Alde bateko fitxategia irakurri ezin bada, ez da ezer aldatzen alde batean ez bestean, berriro irakur daitekeen arte."
