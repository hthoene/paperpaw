vocabulary.plugin.name = Hiztegi pertsonala
vocabulary.plugin.description = Bilatzen dituzun hitzak gordetzen ditu, haien esaldiekin, eta ikasketa-txartelak berrikusten ditu tarte-errepikapenarekin, telefonoan eginak.
vocabulary.plugin.how = "Hiztegiak irakurtzean bilatzen dituzun hitzak gordetzen ditu, bakoitza bere esaldiarekin, geroago berrikusteko. Zerrenda Tresnak atalean aurkituko duzu, berrienak lehenik; aukeratu hitz bat berriro bilatzeko. Azken errenkadak, Esportatu, Anki bezalako ikasketa-txartelen aplikazioetarako gordetzen ditu. Zerrendak 2.000 hitz berrienak gordetzen ditu: horretatik aurrera, zaharrenak kentzen dira, beraz esportatu lehenik guztiak mantentzeko.\n\nIkasketa-txartelek, Tresnak atalean ere, tarte-errepikapenarekin galdetzen dizute: Erakutsi erantzuna ondoren txartel bakoitza Berriro, Zaila, Ondo edo Erraza gisa baloratzen duzu, eta horrek erabakitzen du noiz itzultzen den. Sortak Editatu telefonoarekin atalarekin egiten dituzu: eskaneatu kodea Wi-Fi berean dagoen telefono batekin, gero idatzi txartelak edo gehitu asko aldi berean: ireki hor sorta bat, aukeratu Txartel asko aldi berean eta aukeratu CSV, TSV edo TXT fitxategi bat (txartel bat lerro bakoitzean: aurrealdea, atzealdea, adibidea; UTF-8), itsatsi zerrenda bat, edo ekarri Anki sorta bat (.apkg, Onartu Anki-ren bertsio zaharragoak aukerarekin esportatua). \n\nEdo erabili SD txarteleko fitxategiak: jarri CSV, TSV edo TXT fitxategi bat, edo Anki sorta bat (.apkg, Onartu Anki-ren bertsio zaharragoak aukerarekin esportatua), sorta bakoitzeko Flashcards karpetan (Gaztelania.tsv fitxategiak Gaztelania sorta egiten du; txartel bat lerro bakoitzean: aurrealdea, atzealdea, adibidea; UTF-8 gisa gordeta; lehen lerro batek zutabeak izendatu ditzake: front, back, example). Aukeratu SD txarteleko txartelak Ikasketa-txartelak atalean, edo utzi gertatzen Ikasketa-txartelak irekitzen duzunean. Sortak irakurlean geratzen dira, ikasi duzunarekin, eta fitxategi bat bere sortan sartzen da berria edo aldatua denean: aldatu fitxategiko txartel baten atzealdea edo adibidea eta txartela aldatzen da eta bere aurrerapena mantentzen du; aldatu aurrealdeko testua eta txartel berri gisa zenbatzen da, zaharra hutsetik hasten da (txartelak aurrealdeko testuaren arabera bereizten dira; zuriuneek eta maiuskulek ez dute zenbatzen); ezabatzen duzun lerro batek ez du txartela ezabatzen (sorta horretarako \"fitxategian falta diren txartelak\" Kendu gisa ezartzen ez baduzu: orduan txartela hurrengo eguneraketan kentzen da, bere aurrerapenarekin, betiko, eta ez da ezer kentzen fitxategiko lerroren bat irakurri ezin den bitartean). Gorde sorta bat bere fitxategian Gorde txartelean aukerarekin: fitxategiak txartelen zenbakiak jasotzen ditu (id zutabea), beraz aurrealdeak ordenagailuan alda ditzakezu eta txartelek ikasi duzuna mantentzen dute; fitxategiak id, aurrealdea, atzealdea eta adibidea soilik mantentzen ditu (beste zutabeak, iruzkinak eta lerroen ordena ez dira mantentzen), eta gordetzea ukatzen da fitxategiko lerroren bat irakurri ezin izan den bitartean; hor zegoen fitxategia _izena.bak.tsv gisa kopiatzen da lehen aldian (geroagoko gordetze batek ez du kopia hori ordezkatzen). 4 MiB baino handiagoa edo 20.000 lerro baino gehiagokoa den fitxategia ez da irakurtzen, eta CSV UTF-8 gisa gordeta egon behar du, ez UTF-16 gisa. Lehen aldian, irakurleak karpeta egiten du funtzionamenduari buruzko ohar batekin.\n\nEzarpenetan, Irakurketa atalean, Bilatutako hitzak txartel bihurtzen dira aukerak bilatutako hitz bakoitza Bilatutakoak sortan jartzen du."
