format-cbz.setting.panels.help = Koadro bat aldi bakoitzean, orri-pasatzeek haietan zehar mugitzen dute.
format-docx.plugin.name = DOCX dokumentuak
format-docx.plugin.description = .docx fitxategiak irekitzen ditu, Word-ek eta beste programek gordetzen dituzten bezala.
format-docx.plugin.how = "DOCX dokumentuak liburu gisa irekitzen ditu: edukien aurkibidea duten goiburuak, zerrendak, taulak, letra lodia eta etzana, estekak eta irudiak (JPEG, PNG, GIF).\n\nJarri fitxategiak liburutegi-karpetan eta ireki liburutegitik. Izenburua eta egilea dokumentuaren propietateetatik datoz. Oin-oharrak, goiburuak eta oinak, eta iruzkinak ez dira erakusten."
format-docx.title = DOCX dokumentua
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB liburuak irekitzen ditu, estiloekin, edukien aurkibidearekin eta irudiekin.
format-epub.plugin.how = "EPUB liburuak liburutegitik irekitzen dira beste edozein liburu bezala, edukien aurkibidearekin, irudiekin eta argitaratzailearen estiloarekin. Web-orriak (HTML), Markdown, FictionBook (.fb2) eta komiki-artxiboak (.cbz) berdin irekitzen dira, bakoitza bere pluginarekin.\n\nKapitulu bat lehen aldiz irekitzen duzunean bihurtzen da eta pluginaren cachean gordetzen da, beraz geroago azkarragoa da eta liburu handiek gailu txikietan funtzionatzen dute. Edukien aurkibidea irakurketa-menuko Edukia atalean aurkituko duzu. Liburuaren bere estiloa aplikatzen den ala ez Argitaratzailearen formatua ezarpenak zehazten du, Irakurketa atalean."
format-epub.title = EPUB e-liburua
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook liburuak irekitzen ditu (.fb2, zipatuta ere bai).
format-fb2.plugin.how = "FictionBook liburuak (.fb2) irekitzen ditu, errusierazko eta beste liburu batzuetan ohikoak, zipatuta ere (.fb2.zip), izenburuarekin, egileekin, azalarekin eta kapituluekin.\n\nJarri liburutegi-karpetan; liburutegian agertzen dira eta beste edozein liburu bezala irekitzen dira."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Fitxategi gisa gordetako web-orriak irekitzen ditu, irakurtzeko dena soilik erakutsiz.
format-html.plugin.how = "Fitxategi gisa gordetako web-orriak (.html, .htm, .xhtml) liburu gisa irekitzen ditu: irakurtzeko dagoena soilik, inguruko menurik, iragarkirik eta antzekorik gabe.\n\nJarri fitxategia liburutegi-karpetan eta ireki liburutegitik edozein liburu bezala. Orriaren barruko estekek funtzionatzen dute; irudiak fitxategian dauden tokian agertzen dira."
format-html.title = Web-orria (HTML)
format-images.plugin.name = Irudiak
format-images.plugin.description = Irudiak (.jpg, .png, .gif) liburu gisa irekitzen ditu, orrialde bat bakoitzeko.
format-images.plugin.how = "Irudiak (.jpg, .png, .gif) liburutegitik irekitzen dira liburuak bezala, irudi bat orrialdeko, pantailara egokituta.\n\nIrudi-karpeta oso bat irakurtzeko, ireki bere lehen irudia: karpetako ondorengo irudiak jarraitzen dute, haien izenen ordenan (2 10aren aurretik). Geroagoko irudi batek hortik hasten du; bakoitzaren lekua bereizita gogoratzen da. Gehienez 300 irudiko karpeta bat irakurtzen da ireki duzun irudiaren ondotik.\n\nIrudia ez den fitxategi batek, edo handiegia denak, bere izena erakusten du horren ordez. Irudi asko eta izenburu propioa dituen liburu baterako, komiki-artxibo bat (.cbz) da forma hobea."
format-images.title = Irudia
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown fitxategiak (.md) irekitzen ditu, adib. oharrak.
format-markdown.plugin.how = "Markdown fitxategiak (.md), adibidez oharrak, liburu gisa irekitzen ditu: goiburuak, zerrendak, aipuak eta nabarmenduak esan nahi duten bezala, ez ikur gisa.\n\nJarri fitxategiak liburutegi-karpetan eta ireki liburutegitik. Lehen goiburua da izenburua; fitxategiaren ondoko irudiak testuak aipatzen dituen tokian agertzen dira."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI liburuak
format-mobi.plugin.description = DRM gabeko .mobi eta .azw fitxategiak irekitzen ditu.
format-mobi.plugin.how = "MOBI liburuak (.mobi, .azw) liburutegitik irekitzen dira beste edozein liburu bezala, ezer konfiguratu beharrik gabe. Izenburua, egileak, hizkuntza eta azala liburutik datoz, eta edukien zerrenda bere goiburuetatik egiten da.\n\nLiburua lehen aldiz irekitzen duzunean bihurtzen da, eta luzea bada segundo batzuk behar ditu; ondoren berehala irekitzen da. Testua, goiburuak, letra lodia eta etzana, estekak eta irudiak erakusten dira.\n\nDRM duten liburuak (dendan erositako gehienak) ezin dira ireki, ezta Huffman konpresioa dutenak edo KF8 forma berriagokoak (.azw3) ere: PaperPaw-ek hala esaten du irekitzean. EPUB kopia bat, Calibre bezalako tresna batekin egina, beti irekitzen da."
format-mobi.title = MOBI liburuak
format-rtf.plugin.name = RTF dokumentuak
format-rtf.plugin.description = .rtf fitxategiak liburu gisa irekitzen ditu.
format-rtf.title = RTF dokumentuak
format-txt.plugin.name = Testu soila
format-txt.plugin.description = Testu-fitxategi soilak (.txt) irekitzen ditu.
format-txt.plugin.how = "Testu-fitxategi soilak (.txt) liburutegitik irekitzen dira beste edozein liburu bezala, ezer konfiguratu beharrik gabe. Pluginak UTF-8, UTF-16 eta Windows-1252 testuak irakurtzen ditu eta kodeketa berez aurkitzen du.\n\nParagrafoak fitxategiko lerro hutsei jarraitzen die; fitxategiak bat ere ez badu, lerro bakoitza paragrafo bat da. Project Gutenberg fitxategietan hasierako eta amaierako lizentzia-testua kanpoan uzten da, eta izenburua eta egilea goiburutik hartzen dira.\n\nFitxategia ez da inoiz osorik kargatzen, beraz testu oso handiak ere irekitzen dira gailu txikietan."
format-txt.title = Testu soila
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC eta XTCH liburuak irekitzen ditu, Xteink irakurleen aurrez errendatutako orrialdeak.
format-xtc.plugin.how = "XTC eta XTCH fitxategiak orrialdeak dagoeneko irudi gisa errendatuta dituzten liburuak dira, Xteink irakurleentzako bihurgailuek eginak. Liburutegitik irekitzen dira beste edozein liburu bezala.\n\nOrrialde bakoitza irudi finko bat denez, testuaren tamaina ezin da aldatu eta ezin da beste letra-tipo batean jarri. Orrialdeak zuri-beltzak dira edo lau gris dituzte. Orrialde bakoitza erakusten denean deskodetzen da, beraz memoria gutxi behar da, X4-n ere.\n\nIzenburua, egilea eta kapituluak fitxategitik hartzen dira, baldin baditu."
format-xtc.title = XTC orrialdeak
help.plugin.name = Aholkuak
help.plugin.description = Pantaila bat lehen aldiz irekitzean, bere kontrolek zer egiten duten erakusten du.
help.plugin.how = "Pantaila bat lehen aldiz irekitzen denean, gainean ohar labur batek bere kontrolek zer egiten duten esaten du: ukitzeak eragiten duen pantailaren zatiak, markoz inguratuta, eta botoiek zer egiten duten.\n\nUkitze batek edo edozein botoik oharra ixten du, eta ez da pantaila horretarako berriro agertzen. Ez gehiago aholkurik denak itzaltzen ditu.\n\nEzarpenetan, Sistema atalean, Aholkuak piztu edo itzaltzen ditu, eta Erakutsi aholkuak berriro-k pantaila bakoitzaren oharra behin gehiago erakusten du."
