fonts-browser.plugin.name = Letra-tipo gehiago
fonts-browser.plugin.description = Interneteko letra-tipoak erakusten ditu, bakoitza lagin batekin, eta irakurtzeko deskargatzen ditu.
fonts-browser.plugin.how = "Letra-tipo gehiagok interneteko letra-tipo-liburutegi bateko letra-tipoak zerrendatzen ditu, izen bakoitza bere letra-tipoan idatzita, eta irakurtzeko nahi dituzunak deskargatzen ditu.\n\nIrakurtzeko letra-tipoa aukeratzen den letra-tipoen zerrendaren amaieran aurkituko duzu, Ezarpenetan, Irakurketa atalean, Letra-tipoa gisa; egoera-lerroek sarrera bera dute beren letra-tipoarentzat. Ukitu letra-tipo bat (botoiekin, sakatu Hautatu) handiago ikusteko esaldi-lagin batekin, eta aukeratu Deskargatu. Deskargatzen ari den bitartean orrialdea utzi dezakezu. Amaitzen denean, aukeratu Irakurri honekin (letra-tipoaren izena), edo Erabili egoera-lerroetarako. Eguneratu-k bertsio berriago bat eskuratzen du, Kendu-k letra-tipoa gailutik ezabatzen du.\n\nWi-Fi behar du.\n\nZURE LETRA-TIPO PROPIOAK\n\nLetra-tipo gehiago aukeraren ondoan, zerrenda berak Zure letra-tipo propioak aukera du, laguntzaren zati hau erakusten duena. Letra-tipo propioa .ttf edo .otf fitxategi bat da, adibidez Google Fonts-etik.\n\nAndroid-en eta letra-tipo-fitxategiak marrazten dituzten beste gailuetan: kopiatu fitxategia fonts karpetara (Android-en: PaperPaw/fonts partekatutako biltegian), berrabiarazi PaperPaw eta aukeratu letra-tipoa Ezarpenetan, Irakurketa atalean, Letra-tipoa gisa.\n\nXteink X4 eta X4 Pro gailuetan: irakurle hauek letra-tipo-paketeak irakurtzen dituzte, ez letra-tipo-fitxategiak, fitxategiak ez liratekeelako memorian kabituko. Egin pakete bat ordenagailuan paperpaw-fontgen erabilita, zure estilo bakoitzerako (normala beharrezkoa da):\n\npaperpaw-fontgen --family \"Nire Letra\" --regular NireLetra-Regular.ttf --bold NireLetra-Bold.ttf --italic NireLetra-Italic.ttf plugins\n\nHonek plugins/font-nire-letra karpeta sortzen du. Kopiatu memoria-txarteleko plugins karpetara, berrabiarazi eta aukeratu Nire Letra Letra-tipoa gisa. Estilo bakarreko pakete batek, letra latinoetarako, megabyte erdi inguru hartzen du; kentzen dituzun estiloak normalean marrazten dira. Tresnak esaten du eskatzen dituzun letretatik zenbat dituen letra-tipoak (--chars latin,cyrillic,greek idazkerak gehitzen ditu): zure liburuaren letrarik ez duen letra-tipo batek ezin ditu erakutsi, beraz bilatu haren idazkera estaltzen duen bat.\n\nLetra-tipo gehiago aukerako letra-tipoek berdin funtzionatzen dute eta ez dute ordenagailurik behar.\n\nE-ink panelean testu txiki zorrotzagoa lortzeko, gehitu --hinting light komandoari: letrak pixel-sareta egokitzen ditu, lehenetsitako letra-tipoak egiten diren bezala. Hori gabe letrak letra-tipoak diseinatu zituen bezala marrazten dira; --hinting normal eta --hinting mono aukerek gogorrago egokitzen dituzte. Arabiera edo Devanagari bezalako marka dituzten letra-tipoak hobe da hori gabe uztea."
