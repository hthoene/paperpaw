file-manager.plugin.name = Fitxategi-kudeatzailea
file-manager.plugin.description = Gailuko karpeta eta fitxategi guztiak: ireki, aldatu izena, mugitu, kopiatu eta ezabatu.
file-manager.plugin.how = "Fitxategi-kudeatzaileak gailuaren biltegiratzeko karpeta eta fitxategi guztiak erakusten ditu, ez soilik zure liburuak, eta ireki, izena aldatu, mugitu, kopiatu eta ezabatzen uzten dizu, baita karpeta berriak sortzen ere.\n\nIreki Fitxategiak Tresnak menuan. Ukitu karpeta bat barrura sartzeko; Atzera botoiak gaineko karpetara eramaten du. Ukitu fitxategi bat, edo eutsi edozein sarrerari (botoiekin, eutsi Hautatu botoiari), harekin zer egin daitekeen ikusteko. Mugitu eta Kopiatu aukerek sarrera aukeratzen dute: joan dagokion karpetara eta aukeratu Itsatsi hemen beheko barran. Botoiekin, sakatu Behera azken sarreratik barrara iristeko.\n\nPuntu batekin hasten diren fitxategiak eta karpetak, adibidez PaperPaw-en datu propioak, ezkutatuta daude. Ikusteko, aktibatu Ezkutuko fitxategiak Ezarpenetan, Liburutegia atalean."
