format-cbz.plugin.name = Komikiak
format-cbz.plugin.description = Komiki-artxiboak (.cbz) irekitzen ditu, irudi bat orrialdeko.
format-cbz.plugin.how = "Komiki-artxiboak (.cbz) irekitzen ditu: irudi bat orrialdeko, pantailara egokituta, haien izenen ordenan (2 10aren aurretik).\n\nJarri liburutegi-karpetan eta ireki liburutegitik; pasatu orriak edozein liburutan bezala. Irudi handiek une bat behar dute lehen aldian, X4-n beste toki batzuetan baino gehiago.\n\nIrakurketa-ezarpenak (Ezarpenak, Irakurketa): «Koadroz koadro»-k orrialde bateko koadro bakarra erakusten du aldi bakoitzean, pantailak uzten duen handiena, eta orri-pasatzeek haietan zehar mugitzen dute; koadrorik gabeko orrialde bat osorik erakusten da. «Komiki-orrialdeen norabidea»-k orri-pasatzeak islatzen ditu mangarako (eskuinetik ezkerrera); liburuaren ComicInfo.xml fitxategiak berak esaten du. Liburutegiak liburuaren izenburua eta ComicInfo.xml fitxategiko saila eta zenbakia erakusten ditu."
format-cbz.title = Komikia (CBZ)
format-cbz.setting.direction = Komiki-orrialdeen norabidea
format-cbz.setting.direction.help = Manga: orri-pasatzeak islatuta daude.
