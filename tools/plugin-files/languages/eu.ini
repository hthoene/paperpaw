setup.plugin.name = Konfigurazioa
setup.plugin.description = Garrantzitsuak diren ezarpenen gida labur bat, lehen abiatzean.
setup.plugin.how = "Konfigurazioa garrantzitsuak diren ezarpenen gida labur bat da, behin soilik erakusten dena, PaperPaw lehen aldiz abiatzen denean. Orri bakoitzak gauza bat galdetzen du, adibidez hizkuntza, botoiak, testu-tamaina, ordu-eremua, Wi-Fi edo gehitzeko plugin batzuk, erantzun zentzuzko bat dagoeneko aukeratuta duela, beraz Hurrengoa beti zuzena da. Gailu honek behar ez dituen urratsak kanpoan uzten dira.\n\nUkitu botoiak, edo erabili gora eta behera botoiak eta Hautatu. Lehen orriko Saltatu aukerak konfigurazioa berehala uzten du. Azken orriak zure liburuak nondik datozen esaten du.\n\nBerriro exekutatzeko, ireki ezarpenak eta aukeratu Konfiguratu PaperPaw. Hemen aukeratutako guztia geroago alda daiteke ezarpenetan."
