battery.plugin.name = Bateria-erabilera
battery.plugin.description = Bateria erregistratzen du eta zenbat irauten duen erakusten du.
battery.plugin.how = "Bateria-erabilerak kargaren oharra hartzen du minutuan behin gutxi gorabehera, gailua esna dagoen bitartean, egin duenarekin batera: pantaila-freskatzeak eta pasatutako orriak. Horrekin kalkulatzen du ordubete esnatuta eta 100 orrik zenbat hartzen duten, eta bateriak erritmo horretan zenbat irauten duen.\n\nIreki Bateria Tresnak menuan. Orain dagoen karga erakusten du, esna egon zaren une hau, orain arte bateriarekin egin den erabilera eta azken esna-aldiak. Orri-botoiekin edo goiko geziak ukituta pasatzen da.\n\nDenbora pixka bat behar du bateriarekin irakurtzen, zifrek zerbait esan dezaten arte. Erregistroa lehenespenez aktibatuta dago eta Ezarpenetan desaktiba daiteke, Gailua, Energia atalean, Erregistratu bateria-erabilera gisa."
