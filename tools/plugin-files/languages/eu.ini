stats.plugin.name = Irakurketa-estatistikak
stats.plugin.description = Zenbat denboran eta zenbat irakurtzen duzun erregistratzen du, egutegiarekin eta liburu bakoitzaren zenbakiekin.
stats.plugin.how = "Irakurketa-estatistikek orrialde bakoitza zenbat denboran irakurtzen duzun erregistratzen dute. Ikuspegi orokor gisa ikusten duzu, gaur, astea eta zure segida erakutsiz, egutegi gisa, eta liburu bakoitzaren zenbakiekin.\n\nIreki Tresnak menuan, edo irakurlean Gehiago atalean. Ezarpenetan, Irakurketa-estatistikak atalean, Erregistratu irakurketa itzali dezakezu, Eguneko helburua ezarri, eta Orrialderik laburrena eta Orrialderik luzeena ezarri zer zenbatzen den, orriak azkar pasatzeak edo irekita utzitako liburu batek zenbakiak distortsionatu ez ditzan.\n\nSinkronizatu KOReader-ekin atalak estatistikak KOReader-ekin partekatzen ditu WebDAV karpeta baten bidez. Gailu berean dagoen KOReader-en estatistikak ere hartzen ditu. Erregistratzeko ordua ezarrita egon behar da: ez badago, konektatu Wi-Fi-ra behin."
