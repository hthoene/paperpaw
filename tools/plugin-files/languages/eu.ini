dictionary.plugin.name = Hiztegia
dictionary.plugin.description = Hitzak bilatzen ditu StarDict hiztegietan.
dictionary.plugin.how = "Hiztegiak liburu bateko hitz bat bilatzen du StarDict hiztegietan, eta definizioak pantailaren beheko aldearen gaineko panel batean erakusten ditu.\n\nIrakurlean, eutsi hitz bati eta aukeratu Bilatu; botoiekin, erabili Hautatu testua Gehiago atalean. Kopiatu hiztegi-karpetak (.ifo, .idx eta .dict fitxategiekin) gailuko \"dictionaries\" karpetara, azpikarpetak barne, edo aukeratu beste karpeta bat Ezarpenetan, Irakurketa atalean, Hiztegi-karpeta gisa (ezarpen aurreratua). Lehen bilaketak indize txiki bat prestatzen du hiztegi bakoitzerako, eta une bat behar du.\n\nPanelean, orri-botoiek edo Gora eta Behera botoiek definizio luzeak mugitzen dituzte, eta Atzera botoiak ixten du. Ukipenarekin, ukitu kanpoan ixteko."
