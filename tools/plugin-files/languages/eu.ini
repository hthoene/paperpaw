update.plugin.name = Eguneraketa
update.plugin.description = Firmware-eguneraketak instalatzen ditu, txartelekoak edo internetetik deskargatutakoak.
update.plugin.how = "Eguneraketak firmware berria instalatzen du, PaperPaw firmwarea den gailuetan, X4 bezala. Ezarpenetan aurkituko duzu, Eguneraketa gisa.\n\nBilatu linean-ek eguneraketa-zerbitzariari PaperPaw berriago bat galdetzen dio eta deskargatzen du, minutu batzuk behar dituena Wi-Fi bidez. Edo kopiatu eguneraketa-fitxategi bat (.bin amaiera duena, paperpaw.org-etik) txarteleko updates karpetan, adibidez Wi-Fi bidezko transferentziarekin. Instalatzeak gero minutu bat inguru behar du eta gailua berrabiarazten da; liburuak, ezarpenak eta irakurketa-puntuak mantentzen dira.\n\nBilatu eguneraketak aukera piztuta dagoenean (ezarpenetan, hasieran itzalita), gailuak astean behin inguru galdetzen du berez, Wi-Fi hala ere piztuta dagoenean edo kargatzen ari denean soilik. Aurkitzen duen PaperPaw berriago batek hemen itxaroten du; ezerk ez du zure irakurketa eten. Bilaketa batek gailuak exekutatzen duena bidaltzen du, ez bere izenik ez zenbakirik; gailuak zenbatzeko, baita eskatu duzun ala ez eta eguneko, asteko edo hilabeteko bere lehen bilaketa den ala ez ere.\n\nErabiltzen dituzun pluginek oraindik ez badute bertsio berrirako bertsiorik, eguneraketak haien zain egoten da. Bertsio zaharrago bat aukeratzen baduzu soilik instalatzen da.\n\nBeste firmware bat, CrossPoint bezala, hemendik ere instalatzen da: jarri bere fitxategia (.bin amaiera duena) updates karpetan, eta ireki Eguneraketa. PaperPaw-ek egiaztatzen du gailu honetarako firmware oso bat dela, kaltetu gabea, baina ezin du esan nork egin duen, sinatuta ez dagoelako. Instalatu hala ere flash-aren beste erdian idazten du, eta gailuak abiarazten du; PaperPaw bere erdian geratzen da firmware horrek zerbait instalatzen duen arte haren gainean. Geroago PaperPaw-era itzultzeko, instalatu bere instalazio-fitxategia (paperpaw-<gailua>-<bertsioa>-install.bin) beste firmwarearen menutik, CrossPoint-en SD firmware-eguneraketa bezala."
