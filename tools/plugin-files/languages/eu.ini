weather.plugin.name = Eguraldia
weather.plugin.description = Eguraldia orain eta hurrengo egunetan widget gisa, Open-Meteo-tik.
weather.plugin.how = "Eguraldiak eguraldia orain eta hurrengo egunetan erakusten du hasierako pantailarako widget gisa, Open-Meteo-tik, kontu edo gakorik behar ez duena. Eguraldia orain-ek tenperatura, baldintza eta aukeratzeko gehiago erakusten ditu; Iragarpenak hurrengo egunak errenkada batean edo zerrenda batean erakusten ditu.\n\nAukeratu lehenik leku bat: ezarpenetan, Eguraldia, Kokalekua atalean (idatzi izen bat, gero aukeratu aurkitutako lekuen artean). Haren koordenatuak soilik bidaltzen dira, eta eguraldi-widget bat erakusten den bitartean soilik. Gehitu widgetak hasierako pantaila editatuz.\n\nEguraldia Eguneratu gehienez zenbatero atalak dioen maiztasunean baino gehiagotan ez da eskuratzen, eta sarea dagoenean soilik: ez du inoiz Wi-Fi berez pizten.\n\nEguraldi-datuak Open-Meteo.com-ek (https://open-meteo.com) emandakoak, Creative Commons Attribution 4.0 lizentziapean (CC BY 4.0)."
