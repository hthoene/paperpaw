opds.plugin.name = OPDS katalogoak
opds.plugin.description = OPDS katalogoak arakatzen ditu, haien liburuak deskargatzen ditu eta karpetak haiekin sinkronizatuta mantentzen ditu.
opds.plugin.how = "OPDS katalogoak lineako liburutegiak dira, Project Gutenberg, Calibre-Web, Kavita edo Komga bezalakoak. Plugin honek karpetak bezala arakatu eta bilatzen ditu, eta haien liburuak liburutegian deskargatzen ditu.\n\nIreki Katalogoak Tresnak menuan eta aukeratu Gehitu katalogoa: helbide bat eta, katalogoak kontu bat behar badu, erabiltzaile-izena eta pasahitza. Ukitu katalogo bat arakatzeko; eutsi (botoiekin, eutsi Hautatu botoiari) sinkronizatzeko, editatzeko edo kentzeko.\n\nSinkronizatu katalogo hau aktibatuta dagoenean, Sinkronizatu katalogoak aukerak bere liburu berriak bere karpetan deskargatzen ditu. Liburuak sinkronizazioko aukerak sinkronizazio batek zenbat eskuratzen duen mugatzen du, katalogo handi batek gailua bete ez dezan. Hodeiko karpeta (WebDAV) bat ere balio du katalogo baten ordez."
