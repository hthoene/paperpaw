store.plugin.name = Plugin denda
store.plugin.description = Gailu honetarako pluginak aurkitzen, instalatzen, eguneratzen eta kentzen ditu.
store.plugin.how = "Plugin dendak gailu honetarako pluginak aurkitzen ditu internetean eta instalatu, eguneratu eta kentzen ditu. Ireki Tresnak menuan; Wi-Fi behar du.\n\nHasierak liburutegiak gomendatzen duena erakusten du, orain berria edo ezaguna dena, gero taldeak. Talde batek bere pluginak nahasketa bidezko batean zerrendatzen ditu, egunero aldatzen dena, plugin guztiak ikus daitezen; ordenatu A-tik Z-ra, berrienen arabera edo azken eguneraketaren arabera, eta joan letra batera zerrenda luzeetan. Ireki bat bere orria ikusteko, bere tamainarekin eta hartzen duen memoriarekin, gero aukeratu Instalatu, Eguneratu edo Kendu. Eguneratu guztiak-ek instalatutako plugin guztiak eguneratzen ditu.\n\nKodedun pluginak gailurako sarbide osoarekin exekutatzen dira: dendak hala esaten du eta aurretik galdetzen du, eta berrabiarazi ondoren abiatzen dira. Batek huts egiten badu, PaperPaw kodedun pluginik gabe abiatzen da eta zein den esaten du. Plugin-liburutegiak zerrenda nondik datorren ezartzen du.\n\nKomunitateko pluginak, Ezarpenak, Sistema atalean, besteek GitHub-en argitaratutako pluginak ere zerrendatzen ditu. Inork ez ditu berrikusi: Berrikusi gabe gisa markatuta daude, kodedun plugin baten orriak sinatuta dagoen gakoa erakusten du, eta beste gako batekin sinatutako eguneraketa bat ez da instalatzen.\n\nIturriak, hasierako azken errenkadak, besteen plugin-zerrendak gehitzen ditu haien helbidearen bidez (https://…/plugins.json), horietako bat PaperPaw-en zerrendaren ordez zerrendatzen du, edo kentzen du. Idatzi ordez, jarri sources.txt fitxategi bat, lerro bakoitzean helbide batekin, txarteleko .paperpaw/plugins/store karpetan: helbideak Iturriak atalean agertzen dira berri gisa. PaperPaw-ek ez du iturri bat edo bere pluginak egiaztatzen, eta gailua iturriaren zerbitzariarekin harremanetan jartzen da. Iturri batek bere zerrenda sinatzen du; gailuak irakurtzen duen lehen zerrendaren gakoa gordetzen du eta handik aurrera gako horrekin sinatutako zerrendak eta kodedun pluginak soilik onartzen ditu. Plugin batek bere eguneraketak instalatu zen iturritik soilik jasotzen ditu. PaperPaw-en liburutegi propioa beti dago hor eta ezin da kendu; dendatik ateratzean harantz itzultzen da."
