tasks.plugin.name = Zereginak
tasks.plugin.description = Egiteko-zerrendak epeekin eta lehentasunekin, irakurlean edo zure CalDAV zerbitzariarekin sinkronizatuta, hasierako pantailarako widgetekin.
tasks.plugin.how = "Egiteko-zerrendak zure irakurlean: epea eta lehentasuna dituzten zereginak, amaitzen direnean markatzen direnak. Konfiguraziorik eta sarerik gabe funtzionatzen dute, eta CalDAV zerbitzari batekin (Nextcloud, Radicale, Baïkal, Fastmail eta beste batzuk) bat etorrita mantendu daitezke, zerrenda berberak telefonoan eta ordenagailuan egon daitezen.\n\nIreki Zereginak tresnen menuan. Lehen errenkadak erakusten den zerrendaren izena du; aukeratu beste zerrenda baterako, zerrenda guztietako Gaur eta epez kanpokoak ikusteko, zerrenda berri baterako, sinkronizatzeko edo kontua ezartzeko. Gehitu zeregin bat-ek teklatua irekitzen du. Zeregin batean Hautatu sakatzeak markatzen du (berriro: egin gabe). Eutsi zeregin bati edo sakatu Menua bere izenburua, bere epea (gaur, bihar, aste bat barru, edo idazten duzun data bat, adibidez 2026-12-24) edo bere lehentasuna aldatzeko, edo kentzeko. Zeregin irekiak lehenik doaz, egunaren arabera eta gero lehentasunaren arabera; eginak amaieran geratzen dira aste batez (ezarpenetako Zereginak atalean ezartzen da), eta gero irakurlea uzten dute.\n\nHasierako pantailarako widgetak (eutsi hasierako pantailari, gero gehitu widget bat): Gaurko zereginak gaur epea duena edo epez kanpo dagoena erakusten du, Zeregin-zerrenda zerrenda bat erakusten du, Zeregin irekiak zenbatzen ditu, eta Hurrengo zeregina hurrengo egin beharrekoa erakusten du. Widgeteko zeregin bat ukitzeak markatzen du; izenburu bat ukitzeak zerrendak irekitzen ditu.\n\nSinkronizatzeko, aukeratu CalDAV kontua zerrenda-errenkadan eta sartu zerbitzariaren helbidea, zure erabiltzaile-izena eta pasahitz bat (hobe aplikazio-pasahitz bat). Zerbitzariaren helbidea nahikoa da, adib. cloud.example.com/remote.php/dav; irakurleak hortik aurkitzen ditu zure zeregin-zerrendak. Zerbitzariko zeregin-zerrenda bakoitza irakurleko zerrenda bat bihurtzen da. Irakurleak sinkronizatzen du Zereginak irekitzen duzunean, Sinkronizatu orain aukeratzen duzunean, eta sarea hala ere piztuta dagoenean; sarerik gabe aldatzen duzuna zain geratzen da eta geroago bidaltzen da. Zeregin bat irakurlean eta beste nonbait aldatu bada bitartean, zerbitzariaren bertsioa hartzen da eta zurea zeregin berri gisa gordetzen da haren ondoan, ezer galdu ez dadin. Oharrak, alarmak eta zeregin batek zerbitzarian duen gainerako guztia dauden bezala geratzen dira. Errepikatzen diren zereginak erakusten dira, baina sortu zenituen tokian aldatzen dira. Irakurleak 200 zeregin gordetzen ditu 12 zerrendatan."
