notes-overview.plugin.name = Ohar guztiak
notes-overview.plugin.description = Liburu guztien laster-markak eta nabarmenduak zerrenda batean, eta My Clippings.txt gisa esportatzeko aukera.
notes-overview.plugin.how = "Ohar guztiak-ek laster-marka edo nabarmendu bat egin duzun liburu guztiak zerrendatzen ditu, zenbat dituzten adieraziz. Ireki Tresnak menuan. Aukeratu liburu bat bere oharrak ikusteko, eta ohar bat liburua leku horretan irekitzeko.\n\nZerrendaren amaieran, Esportatu My Clippings.txt gisa-k ohar guztiak fitxategi batean idazten ditu, liburutegiaren ondoko Exports karpetan, Kindle batek erabiltzen duen formatuan (UTF-8). Kindle baten My Clippings.txt irakurtzen duten aplikazioek irakur dezakete. Nabarmendu bati buruzko ohar bat sarrera bereizi bat da, Kindle-n bezala. Hemengo liburuek ez dutenez Kindle-ren kokapenik, \"location\" oharra liburuan zein urrun dagoen da, ehunekotan. Fitxategia aldi bakoitzean berriro idazten da; aurrekoa ordezkatzen du."
