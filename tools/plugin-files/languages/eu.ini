menu.plugin.name = Menua
menu.plugin.description = Pantailaren beheko aldeko menua, ekintzekin eta ezarpenekin.
menu.plugin.how = "Menuak egin eta ezar dezakezuna zerrendatzen du. Pantailaren behealdean irekitzen da, irekita dagoenaren gainean: irakurtzean, ukitu pantailaren erdia edo sakatu Hautatu. Ukitu edo hautatu sarrera bat exekutatzeko.\n\nMenuko ezarpenek beren balioa erakusten dute eta bertan aldatzen dira, beraz menua irekita geratzen da. Sarrera gehiago dituen sarrera batek azpimenu bat irekitzen du.\n\nIrristatu behera goiko ertzetik sarbide azkarrerako: maiz aldatzen duzuna, botoi gisa. Ukitu botoi bat aldatzeko, eutsi bere ezarpenetarako. Botoiekin soilik, geziek aukeratzen dute, Hautatu botoiak aldatzen du eta Atzera botoiak ixten du. Itxura atalean, Menuak aukerak menuak zerrenda gisa edo lauza gisa erakusten ditu."
