plugin-manager.plugin.name = Plugin-kudeatzailea
plugin-manager.plugin.description = Pluginak zerrendatzen ditu eta piztu eta itzaltzen ditu.
plugin-manager.plugin.how = "Plugin-kudeatzaileak plugin guztiak zerrendatzen ditu, bertsioarekin eta deskribapenarekin, eta pluginak piztu eta itzaltzen ditu.\n\nEzarpenetan aurkituko duzu, Kudeatu pluginak gisa. Plugin-ezarpenak orri bereizi bat da, plugin bakoitzaren sare-erabilera bezalako lehentasunetarako. Ukitu plugin bat pizteko edo itzaltzeko (botoiekin, hautatu). Aldaketa berrabiarazi ondoren aplikatzen da: beheko barrak orduan Berrabiarazi orain eskaintzen du. Eutsi plugin bati (botoiekin, eutsi Hautatu botoiari) nola dabilen irakurtzeko.\n\nBeti piztuta markatutako plugin bat ezin da itzali, eta Beharrezkoa markatutakoa beste plugin batek bere lana egiten duenean soilik, bestela PaperPaw-ek ez luke atzera egiteko biderik izango. Pantailak atalean aukeratzen duzu zein pluginek erakusten duen hainbatek eskaintzen duten leku bat."
