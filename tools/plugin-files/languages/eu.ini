mail.plugin.name = Posta
mail.plugin.description = Posta elektronikoa irakurtzen eta bidaltzen du pasahitzarekin edo aplikazio-pasahitzarekin (IMAP eta SMTP), nabigatzailean saioa hasi gabe.
mail.plugin.how = "Posta-k posta elektronikoa irakurtzen eta bidaltzen du IMAP eta SMTP bidez. Zure helbidearekin eta pasahitz batekin hasten du saioa, nabigatzailean saioa hasi gabe, beraz hori baimentzen duen edozein hornitzailerekin funtzionatzen du.\n\nKonfiguratu kontu bat Ezarpenak, Posta atalean. Aukeratu zure hornitzailea, idatzi zure helbidea eta pasahitza. Hornitzaile gehienek aplikazio-pasahitz bat nahi dute: egin bat zure kontuaren segurtasun-ezarpenetan eta erabili hemen. Zure ohiko pasahitzak askotan ez du funtzionatzen, eta inoiz ez doa zure hornitzailearen zerbitzarira ez beste inora. Pasahitzekin eta gakoekin batera gordetzen da.\n\nIreki Posta tresnetan. Begiratu posta aukerak azken mezuak eta karpetak eskuratzen ditu. Mezuak txartelean gordetzen dira, beraz sarerik gabe irakur ditzakezu. Gailua konektatu, eskuratu eta deskonektatu egiten da, beraz Wi-Fi une batez soilik dago piztuta.\n\nZure hornitzailea zerrendan ez badago, aukeratu Zerbitzari propioak eta ezarri zerbitzarien izenak, atakak eta segurtasuna ezarpen aurreratuetan. Ziurtagiria inongo agintaritzak bermatzen ez duen zerbitzari batek behin galdetzen du fidatzen zaren; konparatu hatz-marka zure hornitzaileak erakusten duenarekin.\n\nLiburu bat eranskin duen mezu batek (EPUB, PDF eta antzekoak, 2 MB arte) Ireki liburua du azpian: fitxategia eskuratzen du, zure liburutegian jartzen du eta irekitzen du.\n\nPosta berria Posta ireki gabe ikusteko, aktibatu Begiratu posta berria atzeko planoan Ezarpenak, Posta atalean, eta aukeratu zenbatero (15, 30 edo 60 minuturik behin). Aktibatu arte itzalita dago. Irakurleak orduan noizean behin konektatzen da konexio seguru baten bidez, esna eta linean dagoen bitartean, kontu bat bestearen ondoren, eta irakurri gabeko kopurua eguneratzen du Hasieran. Bateria apur bat erabiltzen du. Posta irekitzean, martxan dagoen egiaztapena gelditzen da.\n\nHasierako pantailako widgetek irakurri gabeko kopurua, azken mezuak eta izarrez markatutakoak, posta-kutxa bat eta mezu bat idazteko lasterbide bat erakusten dituzte."
