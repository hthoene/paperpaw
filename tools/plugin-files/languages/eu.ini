anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Zure ordenagailuko Anki-ren txartel iraungiak ikasten ditu eta erantzunak itzultzen ditu, AnkiConnect gehigarriaren bidez.
anki.plugin.how = "Anki-k zure ordenagailuko Anki-n ikasi beharreko txartelak irakurlean ikasten uzten dizu, eta erantzunak itzultzen ditu. AnkiConnect gehigarri librea erabiltzen du (gehigarriaren kodea 2055492159), eta inoiz ez AnkiWeb. Hasieran itzalita dago: gehitu Plugin dendatik.\n\nOrdenagailuan: instalatu AnkiConnect Anki-n (Tresnak, Gehigarriak, Eskuratu gehigarriak) eta berrabiarazi Anki. Anki irekita egon behar da sinkronizatzen duzun bitartean.\n\nLehenespenez AnkiConnect-ek exekutatzen den ordenagailuari bakarrik erantzuten dio (127.0.0.1), beraz irakurleak ezin du lortu. Ireki Tresnak, Gehigarriak, AnkiConnect, Konfigurazioa eta ezarri «webBindAddress» «0.0.0.0» gisa (etxeko sarean entzun). Ataka, «webBindPort», 8765 da aldatu ezean. Hor «apiKey» bat ezartzen baduzu, sartu gako bera hemen. Berrabiarazi Anki konfigurazioa aldatu ondoren, eta baimendu Anki ordenagailuaren suebakian, galdetzen badu. Erabili hau fidatzen zaren sare batean soilik: bertako edonork lor dezake AnkiConnect, beraz gako bat komeni da.\n\nIrakurlean: ireki Anki Tresnak menuan, eta sartu ordenagailuaren helbidea (adibidez 192.168.1.20) Ordenagailua atalean, ataka 8765 ez bada, eta API gakoa ezarri baduzu. Aukeratu Sorta bat, edo utzi hutsik sorta guztietarako. Gero aukeratu Sinkronizatu Ankirekin, Wi-Fi piztuta dagoela: lehenik zain dauden erantzunak bidaltzen dira, eta gero iraungitako txartelak (eta ezarritako txartel berri kopurua) eskuratzen dira, gehienez 50. Aukeratu Ikasi haiek sarerik gabe ikusteko: erakutsi erantzuna eta baloratu Berriro, Zaila, Ondo edo Erraza gisa. Zure erantzunak irakurlean gordetzen dira, Wi-Fi gabe ere, eta hurrengo sinkronizazioarekin doaz Anki-ra. Anki-k erabakitzen du txartel bat noiz itzultzen den: Berriro erantzun zenuen txartela geroko sinkronizazio batek berriro eskuratzen du, Anki-k iraungita dagoela esaten duenean.\n\nSinkronizatu Anki irekitzean aukerak, ezarpenetan, pantaila irekitzen duzun bakoitzean sinkronizatzen du. Ezerk ez du sarea erabiltzen tekla bat sakatzen duzunean."
