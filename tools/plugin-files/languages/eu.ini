puzzles.plugin.name = Pasatiempoak
puzzles.plugin.description = Sudokuak, hitz gurutzatuak eta xake-problemak, lineaz kanpo, eguneko pasatiempo batekin.
puzzles.plugin.how = "Trenerako eta itxaron-gelarako pasatiempoak, dena lineaz kanpo: sudokuak, hitz gurutzatuak eta xake-problemak. Ireki Pasatiempoak tresnen menuan, edo gehitu Eguneko pasatiempoa widgeta hasierako pantailara (eutsi hasierako pantailari, gero gehitu widget bat): gaurko sudokua zenbateraino dagoen erakusten du, eta ukitzeak irekitzen du. Eguneko sudokua egun osoan berdina da.\n\nSudokua: ezkerrak eta eskuinak kurtsorea gelaxkaz gelaxka mugitzen dute, gorak eta beheak (orri-botoiak) errenkada batean. Hautatu botoiak digituak irekitzen ditu: aukeratu bat eta hautatu berriro sartzeko, edo Garbitu gelaxka husteko. Eutsi Hautatu botoiari (edo Menua) taularen azpiko botoietara iristeko: Oharrak-ek digituak arkatz-marka bihurtzen ditu, Egiaztatu-k gelaxka okerrak markatzen ditu, Desegin-ek azken mugimendua desegiten du, Berria-k aukeratzen duzun mailako pasatiempo bat hasten du (Erraza, Ertaina, Zaila). Pasatiempo bakoitzak soluzio bakar bat du. Jokoa gordetzen da uzten duzunean. Ukipen-pantaila batean, ukitu gelaxka bat.\n\nHitz gurutzatuak: jarri .puz (Across Lite) edo .ipuz fitxategiak memoria-txarteleko \"puzzles\" karpetan; ez da bat ere sartzen. Mugitu sareta gainean, gero hautatu kurtsorearen azpiko hitza teklatuan idazteko (azpimarra batek gelaxka hutsik uzten du). Botoiek horizontalaren eta bertikalaren artean aldatzen dute, aholkuen zerrenda erakusten dute, letrak egiaztatzen dituzte eta hitza erakusten dute. Letrak fitxategi bakoitzerako gordetzen dira. Nahastutako .puz fitxategiak ezin dira ireki.\n\nXake-problemak: Lichess-eko problema-bilduma baten multzo txiki bat (CC0). Ezkerrak eta eskuinak pieza batetik bestera saltatzen dute, hautatu mugitu nahi duzun pieza, gero ezkerra eta eskuina erabili non joan daitekeen aukeratzeko, eta hautatu berriro. Mugimendu oker bat desegiten da. Aholkuak mugitu beharreko pieza markatzen du, Hurrengoa-k hurrengo problemara pasatzen da.\n\nTaulak aldatzen diren gelaxkak soilik marrazten ditu berriro. Estatistikak ebatzitako pasatiempoak zenbatzen ditu."
