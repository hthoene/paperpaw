power.plugin.name = Energia
power.plugin.description = Energia-modua aukeratzen du, eskuz edo bateriaren arabera: Normala, Aurrezpena, Lineaz kanpo.
power.plugin.how = "Energiak PaperPaw-ek bateria nola erabiltzen duen aukeratzen du: Normala, Aurrezpena edo Lineaz kanpo. Aurrezpenak itxaron dezakeena une egokiagoetan egiten du; Lineaz kanpo moduak irratia itzalita mantentzen du. Automatikoak bateriaren arabera aukeratzen du.\n\nAldatu modua sarbide azkarrean, non Energia atalak moduak ondoz ondo erakusten dituen, edo Ezarpenetan, Energia atalean. Han ere ezartzen duzu zein mailatan pasatzen den Automatikoa Aurrezpenera eta Lineaz kanpora, eta kargatzean Normal geratzen den ala ez.\n\nEgoera-lerroetan, Energia-modua atalak hosto bat erakusten du aurrezten ari denean eta marratutako Wi-Fi bat lineaz kanpo dagoenean, eta ezer ez Normalean.\n\nEutsi pizteko botoiari menu txiki bat irekitzeko: Lo egin, Itzali (PaperPaw-ek egin dezakeen tokian), Berrabiarazi, eta ukipen-gailuetan Blokeatu ukipena edo Desblokeatu ukipena. Sakatze labur batek gailua lo jartzen du oraindik ere. Atzera botoiak menua uzten du."
