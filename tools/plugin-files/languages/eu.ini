translate.plugin.description = Hautatutako testua linean itzultzen du, DeepL-rekin.
translate.plugin.how = "Itzulpenak hautatutako testua linean itzultzen du DeepL-rekin. Hautatu testua liburu batean eta aukeratu Itzuli hautatutako testuaren menuan: itzulpena orrialdearen gainean agertzen da hiztegiko sarrera bat bezala. Orri-botoiek edo ukitzeek korritzen dute, eta Hautatu botoiak edo amaierako ukitze batek ixten du.\n\nSarea eta zure DeepL API gako propioa behar ditu, doan deepl.com-en (DeepL API Free, hilean 500.000 karaktere inguru). Sartu arte, panelak hala esaten du, eta ukitze batek eskatzen du.\n\nEzarpenetan, Irakurketa atalean, Itzulpena sekzioan, Itzuli hona aukerak hizkuntza ezartzen du; hasieran PaperPaw-ena da."
