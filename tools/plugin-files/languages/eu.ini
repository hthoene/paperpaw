sleep.plugin.name = Lo-pantaila
sleep.plugin.description = Lo dagoen katu bat, liburuaren azala, zure irudiak edo mezu bat erakusten du gailua lo dagoen bitartean.
sleep.plugin.how = "Lo-pantailak gailua lo dagoen bitartean pantailak zer erakusten duen erabakitzen du. E-inkak irudia korronterik gabe mantentzen du.\n\nAukeratu ezarpenetan, Gailua, Lo-pantaila atalean, Erakutsi aukerarekin: lo dagoen katu bat (lehenetsia), liburuaren azala, nire irudiak, logoa eta \"Lo\", widgetak, orrialdea dagoen bezala, edo orrialdea irudi batekin. Nire irudiak aukerak Irudien karpetako fitxategiak banan-banan erakusten ditu.\n\nAzalik edo irudirik gabe, katua erakusten da. Sistemak berak lo-pantaila marrazten duen tokian, ezarpen hauek ezkutatuta daude.\n\nItzalitako pantaila, Erakutsi itzaltzean, behin marrazten da gailua itzaltzen denean, energia-menutik edo Itzali lo egin ondoren aukeraren denboraren ondoren (ez bateria agorrak korrontea mozten duenean). Lo-pantaila bezalakoa da, logoa eta \"Itzalita\", katua, azala edo nire irudiak aukeratzen ez badituzu. Beste plugin batek pantaila bat eskain dezake horretarako.\n\nAbiatzeko eta berrabiarazteko pantaila, Erakutsi abiatzean eta Erakutsi berrabiaraztean, gailuarena da, beste plugin batek horretarako bat eskaintzen ez badu. Gailua abiatzen den bitartean pluginak ez dira oraindik exekutatzen: abiatzerako aukeratutako pantaila aldez aurretik marrazten da, gailua itzaltzen edo berrabiarazten den bitartean, eta hurrengo abiatzean erakusten da. Garaiz prest ez dagoen pantaila batek, edo kaltetutako irudi batek, gailuaren pantailari uzten dio tokia; gailua edonola ere itzaltzen edo berrabiarazten da."
