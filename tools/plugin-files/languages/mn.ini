setup.plugin.name = Эхний тохиргоо
setup.plugin.description = Эхний асаалтад чухал тохиргоонуудаар хөтлөх богино заавар.
setup.plugin.how = "Эхний тохиргоо бол чухал тохиргоонуудаар хөтлөх богино заавар бөгөөд PaperPaw анх асахад нэг удаа гарна. Хуудас бүр нэг зүйл асууна: хэл, товч, текстийн хэмжээ, цагийн бүс, Wi-Fi, эсвэл нэмэх хэдэн плагин. Тохиромжтой хариулт аль хэдийн сонгогдсон тул «Дараах» нь үргэлж зөв. Энэ төхөөрөмжид хэрэггүй алхмууд гарахгүй.\n\nТовчнуудыг товших, эсвэл дээш, доош товч болон «Сонгох» товчийг ашиглана уу. Эхний хуудсан дээрх «Алгасах» нь тохиргооноос шууд гарна. Сүүлийн хуудас номоо хаанаас авахыг хэлнэ.\n\nДахин ажиллуулахын тулд тохиргоог нээгээд «PaperPaw-г тохируулах» мөрийг сонгоно уу. Энд сонгосон бүхнийг дараа нь тохиргоонд өөрчилж болно."
