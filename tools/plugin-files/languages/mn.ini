keyboard.plugin.name = Гар
keyboard.plugin.description = Дэлгэц дээр мэдрэгчээр эсвэл товчоор текст оруулна.
keyboard.plugin.how = "Текст хэрэгтэй үед гар нээгдэнэ: хайлт, нууц үг, тэмдэглэл эсвэл тохиргоо. Мэдрэгчээр ч, зөвхөн товчоор ч ажиллана.\n\nТовчоор: зүүн, баруун нь мөрийн дагуу, хуудас эргүүлэх товч мөр хооронд шилжинэ, «Сонгох» товчлуурыг дарж, «Буцах» цуцална; зүүн, баруун мөрийг тойрч, дээш, доош таны баганаар явна. Shift дараагийн үсгийг том болгоно; бүгдийг том үсгээр бичихэд хоёр дарж, зогсоохын тулд дахин нэг дарна. Үсгийг дарж байвал (товчоор: дээр нь «Сонгох» товчийг дарж байх) шууд сонгогдсон том үсэг болон é, è зэрэг хувилбарууд гарна; герман хэлэнд ä, ö, ü, ß нь a, o, u, s үсгээс ингэж гарна (товчоор бол гар тэр үсгүүд дээр үүнийг заана). OK дуусгана; товчоор бол хаанаас ч дуусгахын тулд «Буцах» товчийг дарж байна (дангаар дарвал цуцална), эсвэл үсэг биш товчлуур дээр «Сонгох» товчийг дарж байна. «Буулгах» санах ойн текстийг оруулж, «Утас» байгаа бол утсан дээрээ бичих боломж олгоно.\n\nТохиргооны Төхөөрөмж хэсгийн Гар бүлэгт: «Гарын байршил» байршлуудыг сонгоно. Анхдагчаар цэсний хэлийг дагана; хэд байвал нэг товчлуураар солигдоно. «Умлаут товчлуур» ä, ö, ü, ß үсэгт тусдаа товчлуур өгнө. «Хэмжээ» товчлуур, үсгийг томсгоно; зөвхөн товчоор бол мөрүүд компьютерийн гарынх хэвээр үлдэнэ. Мэдрэгчтэй дэлгэц дээр «Товчлуурын хэлбэр» товчлуурын харагдах байдлыг өөрчилнө. «Автомат том үсэг» өгүүлбэр бүрийг том үсгээр эхлүүлнэ."
