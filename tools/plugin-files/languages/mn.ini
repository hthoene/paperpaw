opds.plugin.how = "OPDS каталог гэдэг нь Project Gutenberg, Calibre-Web, Kavita, Komga зэрэг онлайн номын сан юм. Энэ плагин тэдгээрийг хавтас шиг үзэж, хайж, номыг нь номын сан руу татна.\n\nХэрэгслүүд цэснээс «Каталогууд» хэсгийг нээгээд «Каталог нэмэх» товчийг сонгоно уу: хаяг, мөн каталог бүртгэл шаарддаг бол хэрэглэгчийн нэр, нууц үг. Каталогийг товшвол нээгдэнэ; дарж байвал (товчоор бол «Сонгох» товчийг дарж байвал) синк хийх, засах, хасах боломжтой.\n\n«Энэ каталогийг синк хийх» асаалттай бол «Каталогуудыг синк хийх» нь шинэ номуудыг нь хавтсанд нь татна. «Синк бүрийн ном» нь нэг удаад хэдэн ном татахыг хязгаарлаж, том каталог төхөөрөмжийг дүүргэхээс сэргийлнэ. Каталогийн оронд үүлэн хавтас (WebDAV) ч ажиллана."
