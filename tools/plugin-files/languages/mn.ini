vocabulary.plugin.name = Үгсийн сан
vocabulary.plugin.description = Толь бичгээс хайсан үгсийг өгүүлбэртэй нь хадгалж, утсаараа үүсгэсэн флэш картыг интервалтай давталтаар давтуулна.
vocabulary.plugin.how = "Үгсийн сан нь уншиж байхдаа толь бичгээс хайсан үгсийг өгүүлбэртэй нь хадгалдаг. Жагсаалт Хэрэгслүүд хэсэгт байх ба хамгийн шинэ нь эхэндээ; үгийг сонговол дахин хайна. Сүүлийн мөр «Экспортлох» нь үгсийг Anki зэрэг флэш картын аппад зориулж хадгална. Жагсаалтад сүүлийн 2,000 үг үлдэж, хуучнууд нь устдаг тул эхлээд экспортлоно уу.\n\nФлэш карт (мөн Хэрэгслүүд хэсэгт) интервалтай давталтаар асууна: «Хариултыг харах» дарсны дараа карт бүрийг Дахин, Хэцүү, Сайн эсвэл Амархан гэж үнэлэх ба энэ нь карт хэзээ эргэж ирэхийг тодорхойлно. Багцыг «Утсаараа засах» хэсгээс үүсгэнэ: ижил Wi-Fi-д байгаа утсаар кодыг уншуулаад карт бичих, эсвэл тэнд багц нээж «Олон картыг нэг дор» сонгоод CSV, TSV, TXT файл (мөр бүрт нэг карт: нүүр, ар, жишээ; UTF-8), жагсаалт эсвэл Anki багц (.apkg, «Support older Anki versions» сонголттой экспортолсон) нэмнэ.\n\nЭсвэл SD карт дээрх файл ашиглана: багц бүрт нэг CSV, TSV, TXT эсвэл .apkg файлыг Flashcards хавтсанд хийнэ (Англи.tsv нь Англи багц болно; мөр бүрт нэг карт: нүүр, ар, жишээ; UTF-8; эхний мөр баганыг front, back, example гэж нэрлэж болно). Флэш картад «SD карт дээрх картууд» мөрийг сонгох эсвэл нээх үед автоматаар уншуулна. Багцууд таны сурсан явцтай хамт төхөөрөмжид үлдэх ба шинэ эсвэл өөрчлөгдсөн файл багцдаа нэгтгэгдэнэ: ар тал эсвэл жишээг өөрчилбөл карт явцаа хадгална; нүүр талыг өөрчилбөл шинэ карт болж, хуучин нь дахин эхэлнэ (картыг нүүр талын текстээр нь ялгадаг; зай, том жижиг үсэг хамаагүй). Файлаас устгасан мөр картыг устгахгүй, харин тухайн багцад «Файлд байхгүй картууд» тохиргоог Хасах болговол дараагийн шинэчлэлтээр карт явцтайгаа бүрмөсөн хасагдана (файлын аль нэг мөр уншигдахгүй байвал юу ч хасагдахгүй). «Карт руу хадгалах» нь багцыг файлд нь бичиж, картын дугаарыг (id багана) нэмдэг тул нүүр талыг компьютер дээр засахад явц хадгалагдана; файлд зөвхөн id, нүүр, ар, жишээ үлдэнэ; уншигдаагүй мөр байвал хадгалахгүй; өмнөх файлыг эхний удаа _нэр.bak.tsv болгож хуулна. 4 MiB эсвэл 20,000 мөрөөс том файлыг уншихгүй; CSV UTF-8 (UTF-16 биш) хэлбэрээр хадгална уу. Эхний удаа хавтас заавартайгаа үүснэ.\n\nТохиргоо › Унших хэсэгт «Хайсан үгсээс карт үүсгэх» асаалттай бол хайсан үг бүр «Хайсан үгс» багцад орно."
