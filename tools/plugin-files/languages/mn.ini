picture-home.plugin.name = Зурагтай нүүр дэлгэц
picture-home.plugin.description = Виджетүүдийн ард таны өөрийн зурагтай, өөрөө тохируулдаг төлөвийн мөртэй нүүр дэлгэц.
picture-home.plugin.how = "«Зурагтай нүүр дэлгэц» асаалттай үедээ нүүр дэлгэцийг орлоно: виджетүүдийн ард таны зураг, мөн таны байрлуулсан виджет, хэрэгслийн хуудсууд. Плагин менежерт унтраавал үндсэн нүүр дэлгэц өөрийн хуудсуудтайгаа буцаж ирнэ.\n\nЗургуудаа (JPEG, PNG эсвэл GIF) карт дээрх хавтсанд (анхдагчаар wallpapers) хийгээд Тохиргоо › Тохируулах › Зурагтай нүүр дэлгэц хэсгээс нэгийг сонгоно уу. «Тааруулах» нь дэлгэцийг хэрхэн дүүргэхийг (дүүргэх, бүтэн зураг, сунгах, анхны хэмжээ, хавтанцарлах), «Байрлал» аль хэсэг нь үлдэхийг, «Томруулах» хэр том байхыг, «Зургийг цайруулах» хэр цайвар байхыг заана: цайвар зураг дээр виджетүүд илүү уншигдана. Зургийг дэлгэцийн хэмжээ бүрт нэг удаа бэлтгэдэг тул түр хүлээнэ.\n\nВиджетүүд зургийн дээрх дэвсгэр дээр байрлана. Хуудсыг үндсэн нүүр дэлгэц дээрх шиг байрлуулна: хуудасны доорх харандаагаар, эсвэл цэс дэх «Нүүр дэлгэцийг засах» сонголтоор.\n\nТөлөвийн мөр (цаг, Wi-Fi, батарей эсвэл таны сонгосон зүйл) асаалттай, унтраалттай эсвэл автомат; дээд эсвэл доод талд; бүтэн өргөнөөр эсвэл зүүн, голд, баруун талд жижиг капсул хэлбэрээр; цайвар, бараан, саарал дэвсгэр дээр эсвэл шууд зураг дээр байж болно. Товчнуудын нэрийг заасан мөр (X4 дээр) мөн асаалттай, унтраалттай эсвэл автомат байж болно. Автомат гэвэл товч дарахад тэдгээр хэдэн секунд харагдана; тэр даралт өөр юу ч хийхгүй.\n\n«Зургийн дүрслэл» нь зургийг хэрхэн зурахыг заана: «Саарал түвшин» дэлгэцийн бүх саарал өнгөөр (X4 дээр удаан), «Цэгэн» хар цагаан цэгээр (хурдан), эсвэл «Автомат» үндсэн нүүр дэлгэцийнх шиг: дэлгэцийг зурахад саарал түвшнээр, анхны өөрчлөлтийн дараа цэгээр. Саарал түвшингүй дэлгэц дээр саарал түвшний оронд цэг ашиглана."
