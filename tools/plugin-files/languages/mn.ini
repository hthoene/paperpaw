pomodoro.plugin.name = Помодоро
pomodoro.plugin.description = Ажил, амралтын ээлжтэй төвлөрлийн цаг хэмжигч, виджетүүд болон өдрийн тоололтой.
pomodoro.plugin.how = "Помодоро цаг хэмжигч: төвлөрсөн ээлжүүдээр ажиллаад, дараа нь амарна. Тохируулах шаардлагагүй: 25 минут төвлөрөл, 5 минут амралт, дөрвөн ээлжийн дараа 15 минутын урт завсарлага.\n\nПомодорог хэрэгслүүдийн цэснээс нээгээд «Эхлэх» товчийг дарна уу, эсвэл виджетүүдийг нь нүүр дэлгэцэд нэмнэ үү (нүүр дэлгэцийг дарж байгаад виджет нэмнэ): «Помодоро цаг хэмжигч» үе шат болон үлдсэн минутыг харуулна, «Помодоро эхлэх/зогсоох» бол товч, «Помодоро өнөөдөр» дуусгасан ээлжүүдийг өдрийн зорилгын хамт тоолно. Цаг хэмжигч дээр товшвол эхэлж эсвэл түр зогсоно; бүтэн дэлгэцээр нээх бол дарж байна уу.\n\nДэлгэцээс гарсан ч цаг хэмжигч ажилласаар байх ба дахин эхлүүлсний дараа цагийн дагуу үргэлжилнэ. Уншигч унтаж байхад юу ч ажиллахгүй: энэ хооронд дууссан үе шатыг сэрэх үед мэдэгдэнэ. Үе шат дуусахад мэдэгдэл гарна. Батарей хэмнэхийн тулд цаг минутад нэг удаа шинэчлэгдэх (бүтэн дэлгэцэд сүүлийн минутад арван секунд тутам) бөгөөд уншигчийг хэзээ ч сэрүүн байлгахгүй.\n\nТохиргооны «Помодоро» хэсэгт үргэлжлэх хугацаа, нэг багц дахь ээлжийн тоо, дараагийн үе шат өөрөө эхлэх эсэхийг тохируулна. «Бусад» хэсэгт: үе шат дуусахад дэлгэц эсвэл урд гэрэл анивчих, мөн өдрийн зорилго."
