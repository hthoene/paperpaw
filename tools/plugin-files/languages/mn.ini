notes-vault.plugin.name = Тэмдэглэлийн сан
notes-vault.plugin.description = Markdown тэмдэглэлийн хавтсыг хавтас, шошго, сүүлийн өөрчлөлтөөр нь уншиж, нүүр дэлгэцэд виджет өгнө. Obsidian сантай ажиллана.
notes-vault.plugin.how = "«Тэмдэглэлийн сан» нь Markdown тэмдэглэлийн хавтсыг (тэмдэглэлийн аппуудын хадгалдаг энгийн .md файлууд) уншина. Obsidian сантай ажиллана.\n\nСангийн хавтсыг тохиргоонд, эсвэл хэрэгслүүд доторх сангийн хуудсан дээр сонгоно уу. Тэр хуудас дараа нь карт дээрх хавтаснууд, сүүлд өөрчилсөн тэмдэглэлүүд, шошгууд болон тэмдэглэлийн гарчгаар хайх боломжийг харуулна.\n\nАнх удаа сангийн хуудас нээлттэй байх үед санг ард нь индексжүүлнэ; хэдэн мянган тэмдэглэлтэй санд хэдэн минут болох ба дараа нь шууд нээгдэнэ. Индекс карт дээр хадгалагдах бөгөөд хэдэн цагийн дараа сангийн хуудсыг нээхэд, эсвэл «Индекс шинэчлэх» товчийг сонгоход дахин үүснэ.\n\nТэмдэглэл уншигчид нээгдэнэ. Бусад тэмдэглэл рүү заасан холбоосыг ([[Тэмдэглэл]], [[Тэмдэглэл|үгс]], [[Тэмдэглэл#Гарчиг]]) тэмдэглэлийн нэрээр сангийн хаанаас ч олно; холбоосоор орвол тэр тэмдэглэл нээгдэж, «Буцах» товч өмнөх тэмдэглэл рүү буцаана.\n\nСан дахь юу ч хэзээ ч өөрчлөгдөхгүй. Нүүр дэлгэцийн виджетүүдийг (сүүлийн тэмдэглэлүүд, бэхэлсэн тэмдэглэл, өдрийн тэмдэглэл, санамсаргүй тэмдэглэл, шошго, хайлт) нүүр дэлгэцийн засварлагчид нэмнэ. Виджет тэмдэглэлээ зөвхөн нэг хавтаснаас авч болно: виджетийн тохиргоонд хавтасны замыг картын үндсээс бичнэ үү (жишээ нь Тэмдэглэл/Ажил); хоосон бол сангийн бүх тэмдэглэлийг авна."
