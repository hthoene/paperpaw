launcher-simple.plugin.name = Энгийн нүүр
launcher-simple.plugin.description = Тайван нүүр дэлгэц: том цаг, картууд, доод мөр, дугуй унтраалгатай шуурхай самбар.
launcher-simple.plugin.how = "«Энгийн нүүр» бол зөвхөн гол зүйл хэрэгтэй хүнд зориулсан тайван нүүр дэлгэц: том цаг, уншиж буй ном, номын сан ба дэлгүүр том карт хэлбэрээр, доор нь гурван дүрстэй доод мөр. Тохируулах шаардлагагүй.\n\nҮүнийг тохиргооны нүүр дэлгэцийн хэсгээс сонгоно уу. Түүний шуурхай самбар (үүнийг мөн тохиргоонд самбар болгон сонгоно) том дугуй унтраалгууд, төхөөрөмжид гэрэл байвал гэрлийн гулсуур, мөн текстийн хэмжээний гулсууртай. Товчоор: сумтай товчнууд фокусыг зөөж, «Сонгох» товч тухайн хэсгийн заасныг гүйцэтгэнэ; гулсуур дээр аравны нэгийг нэмж, төгсгөлөөс эхэнд нь буцна. Мэдрэгчээр: хэсгийг товших, эсвэл гулсуурын хүссэн газарт товшино уу.\n\nНомын сан номуудыг карт хэлбэрээр, хамгийн сүүлд нээснийг эхэнд нь, нэг хуудсаар харуулж, энгийн уншигчаар нээнэ.\n\nТохиргооны «Энгийн нүүр» хэсэгт өөрийнхөөрөө тохируулна уу: үндсэн цэсийг засдаг шиг засах гурван жагсаалт бий. Картууд: нүүр ямар картуудыг ямар дарааллаар харуулах. Доод мөр: ямар дүрс байх, ямар ч плагины ямар ч үйлдэл байж болно. Шуурхай самбар: ямар унтраалга, гулсуур харуулах. Дэлгэцэнд багтахгүй картыг төгсгөлөөс нь эхлэн хасна. «Энгийн нүүр» хэсэгт огноо, батарей харуулах эсэхийг ч сонгоно."
