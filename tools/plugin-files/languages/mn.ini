calendar.plugin.name = Хуанли
calendar.plugin.description = Хуанли уншигч дээр: CalDAV, iCal, файлаас хуваарь, өдөр, долоо хоног, сарын харагдац, харилцагчдын төрсөн өдөр, нүүр дэлгэцийн виджет, унтах дэлгэц.
calendar.plugin.how = "Хуанли уншигч дээр: ойрын өдрүүдийн хуваарь, өдөр, долоо хоног, сар. CalDAV хуанли (Nextcloud, Radicale, Baïkal, Fastmail г.м.), iCal хаяг (.ics, webcal://), карт дээрх хуанлийн файл, харилцагчдын төрсөн өдөр, ой (CardDAV). Уншигч хуанлийг зөвхөн уншина, хэзээ ч өөрчлөхгүй.\n\n«Хэрэгслүүд» цэснээс Хуанлийг нээнэ үү. Эхний мөр харагдацыг заана: түүнийг сонгох, аль нэг мөрийг дарж байх эсвэл «Цэс» дарвал Хуваарь, Өдөр, Долоо хоног, Сар, Төрсөн өдрүүдийн хооронд шилжих, хуанли нэмэх, синк хийх боломжтой. Өдөр, Долоо хоногт эхний хоёр мөр (мөн хуудас эргүүлэх товч) өмнөх, дараах руу шилжүүлнэ; Сард сум товч өдрийг, хуудас эргүүлэх товч сарыг шилжүүлж, «Сонгох» өдрийг нээнэ. Үйл явдал дээр «Сонгох» дарвал хэзээ, хаана, аль хуанли, хэрхэн давтагдахыг харуулна. «Буцах» нэг алхам буцна.\n\nХуанлийг «Хуанлиуд» хэсэгт нэмнэ (цэсэнд эсвэл тохиргооны Хуанли хэсэгт). Төрлөө сонгоно уу: CalDAV бүртгэл (серверийн хаяг хангалттай, ж.нь cloud.example.com/remote.php/dav), iCal хаяг, карт дээрх файл эсвэл харилцагчид (CardDAV хаягийн дэвтэр: төрсөн өдөр, ой). Хаяг, бүртгэлд хэрэглэгчийн нэр, нууц үг (аппын нууц үг хамгийн тохиромжтой), мөн нэр оруулна. Хуанли бүр ялгах тэмдэгтэй (цэг, цагираг, саарал цэг, дөрвөлжин); 6 хүртэл хуанли.\n\nДавтагдах, бүтэн өдрийн, өөр цагийн бүсийн үйл явдлууд уншигчийн цагаар харагдана. Өнөөдрөөс 60 хоногийн өмнөхөөс 60 хоногийн дараах хүртэлх, 240 хүртэл үйл явдлыг хадгалж, сүлжээгүйгээр харуулна. Уншиж чадаагүй давталтын дүрэмтэй үйл явдал нэг л удаа харагдана.\n\nХуанлийг нээх үед (5 минутад нэгээс ихгүй), «Одоо синк хийх» сонгох үед, мөн тохиргооны дагуу сүлжээ асаалттай эсвэл цэнэглэж эхлэх үед уншина. Уншигч үүний тулд Wi-Fi-г өөрөө асаахгүй, зөвхөн «Одоо синк хийх» сонгоход асаана.\n\nНүүр дэлгэцийн виджетүүд (нүүр дэлгэцийг дарж байгаад виджет нэмнэ): Өнөөдөр, Дараагийн үйл явдал, Хуваарь, Сар (үйл явдалтай өдрийн доор цэг), Төрсөн өдрүүд. Үйл явдал дээр товшвол нээгдэнэ, сарын өдөр дээр товшвол тэр өдөр нээгдэнэ. Унтах дэлгэц өнөөдрийн хуваарийг харуулж болно: тохиргооны «Унтах дэлгэц» хэсэгт Хуанлийг сонгоно уу."
