plugin-manager.plugin.name = Плагин удирдлага
plugin-manager.plugin.description = Плагинуудыг жагсааж, асааж унтраана.
plugin-manager.plugin.how = "Плагин удирдлага нь плагин бүрийг хувилбар, тайлбартай нь жагсааж, плагинуудыг асааж унтраана.\n\nТүүнийг Тохиргоонд «Плагин удирдах» нэрээр олно. «Плагины тохиргоо» нь плагин бүрийн сүлжээ ашиглалт зэрэг сонголтын тусдаа хуудас. Плагиныг асаах эсвэл унтраах бол түүн дээр товшино уу (товчоор бол сонгоно уу). Өөрчлөлт дахин эхлүүлсний дараа хүчинтэй болно: тэгэхэд доод мөрөнд «Одоо дахин эхлүүлэх» гарна. Плагин хэрхэн ажилладгийг унших бол түүнийг дарж байна уу (товчоор бол «Сонгох» товчийг дарж байна уу).\n\n«Үргэлж асаалттай» гэсэн плагиныг унтраах боломжгүй. «Шаардлагатай» гэснийг зөвхөн өөр плагин түүний үүргийг гүйцэтгэх үед унтрааж болно, эс тэгвээс PaperPaw буцах замгүй болно. «Дэлгэцүүд» хэсэгт хэд хэдэн плагины санал болгодог байрыг аль плагин харуулахыг сонгоно."
