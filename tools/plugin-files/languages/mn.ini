help.again-done = Дэлгэц бүр дараа нээгдэхдээ зөвлөмжөө дахин харуулна.
home.plugin.name = Нүүр дэлгэц
home.plugin.description = Эхлэл хуудас: уншиж буй ном, хэрэгслүүд зэрэг виджеттэй хуудсууд.
home.plugin.how = "Нүүр дэлгэц нь утасных шиг виджет, хэрэгслүүдийн торноос бүрдсэн хуудсуудаас тогтоно. Эхэндээ цаг, уншиж буй ном, сүүлд уншсан номууд нэг хуудсанд, бүх хэрэгсэл дараагийн хуудсанд байна.\n\nЗүйлийг нээхийн тулд товшиж, хуудас солихын тулд шудрах эсвэл хуудас эргүүлэх товчийг ашиглана уу. Зөвхөн товчоор бол сум товчнууд нэг зүйлээс нөгөөд шилжиж, «Сонгох» товч нээнэ.\n\nЗохион байгуулахын тулд нүүр дэлгэцийг дарж байх, хуудасны доорх харандааг товших, эсвэл цэснээс «Нүүр дэлгэцийг засах» гэснийг сонгоно уу. Зүйлсийг чирж зөөх, эсвэл нэгийг нь товшиж сонголтыг нь нээнэ; товчоор ч болно. «Виджет нэмэх» ч тэнд бий. «Багана», «Мөр» тохиргоо Гадаад төрх хэсгийн Нүүр дэлгэц бүлэгт байна.\n\nХажуу тийш эргүүлсэн дэлгэц дээр нүүр дэлгэц ижил зүйлсийг илүү олон баганаар харуулж, хуудас бүрийг дүүргээд дараагийнх руу шилжинэ, картууд 110 мм орчмоос өргөн болохгүй; босоо байрлалд зохион байгуулсан зүйл өөрчлөгдөхгүй. Хэвтээ байрлалд зохион байгуулбал тэр байршил тухайн чиглэлд тусдаа хадгалагдана: шинэ виджетүүд хоёуланд нь нэмэгдэнэ. Засах үеийн «Нэмэх» доторх «Хэвтээ байршлыг анхны болгох» нь автоматаар гаргасан байршилд буцаана. Нэг чиглэлд виджет эсвэл хэрэгслийг хасахад нөгөөгөөс нь хасагдахгүй."
