koreader.plugin.name = Тодотгол хуваалцах
koreader.plugin.description = Хоёуланд нь уншдаг номын хавчуурга, тодотголыг KOReader-тэй хуваалцана.
koreader.plugin.how = "Энэ плагин нь нэг төхөөрөмж дээр, эсвэл төхөөрөмжүүдийн хооронд синк хийгддэг номын сангийн хавтсанд PaperPaw болон KOReader хоёуланд нь уншдаг номын хавчуурга, тодотголыг KOReader-тэй хуваалцана. Тохируулах зүйл байхгүй.\n\nKOReader-ийн нээж байсан номыг PaperPaw нээх үед, мөн та түүний хавчуурга, тодотголыг өөрчлөх үед номын хажууд буй KOReader-ийн өгөгдлөөс шинэ зүйлийг авч, энд шинээр нэмэгдсэнийг KOReader дараа нь номыг нээхдээ авахаар үлдээнэ. Хассан тэмдэглэгээ, өөрчилсөн тэмдэглэл ч мөн дамжина.\n\nЭнэ нь зөвхөн EPUB номд ажиллана. Аль нэг талын файлыг уншиж чадахгүй бол уншиж чадах хүртэл аль ч талд юу ч өөрчлөгдөхгүй."
koreader.removed-there = KOReader-ийн файлд тодотгол үлдээгүй байна. Эндээс ч бас хасах уу?
koreader.removed-there.text = Тэдгээрийг KOReader дээр хассан, эсвэл файл нь өөр төхөөрөмжөөс ирсэн байж магадгүй. «Үлдээх» нь тэдгээрийг энд үлдээж, KOReader-т дахин өгнө.
