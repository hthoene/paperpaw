update.plugin.name = Шинэчлэлт
update.plugin.description = Картаас эсвэл интернэтээс татсан програм хангамжийн шинэчлэлтийг суулгана.
update.plugin.how = "Шинэчлэлт нь X4 зэрэг PaperPaw өөрөө програм хангамж нь болдог төхөөрөмж дээр шинэ програм хангамж суулгана. Тохиргоонд Шинэчлэлт нэрээр байна.\n\n«Онлайнаар хайх» нь шинэчлэлтийн серверээс шинэ PaperPaw асууж татна; Wi-Fi-аар хэдэн минут болно. Эсвэл шинэчлэлтийн файлыг (.bin, paperpaw.org сайтаас) картын updates хавтас руу, жишээ нь Wi-Fi дамжуулалтаар хуулна уу. Дараа нь «Суулгах» нэг минут орчим үргэлжилж, төхөөрөмж дахин асна; ном, тохиргоо, уншсан байрлал хэвээр үлдэнэ.\n\n«Шинэчлэлт хайх» асаалттай бол (тохиргоонд, анхандаа унтраалттай) төхөөрөмж долоо хоногт нэг орчим удаа, зөвхөн Wi-Fi асаалттай эсвэл цэнэглэж байх үед өөрөө шалгана. Олдсон шинэ PaperPaw энд хүлээнэ; уншихад юу ч саад болохгүй. Хайлт нь төхөөрөмж дээр ажиллаж буй хувилбарыг илгээх ба төхөөрөмжийн нэр, дугаарыг илгээхгүй; төхөөрөмжийг тоолохын тулд мөн та өөрөө хүссэн эсэх, өдөр, долоо хоног, сарын эхний хайлт эсэхийг илгээнэ.\n\nТаны хэрэглэдэг плагинуудад шинэ хувилбарт тохирох хувилбар хараахан гараагүй бол шинэчлэлт тэднийг хүлээнэ. Хуучин хувилбарыг зөвхөн та сонгосон үед суулгана.\n\nCrossPoint зэрэг өөр програм хангамжийг ч эндээс суулгаж болно: файлыг (.bin) updates хавтсанд хийгээд Шинэчлэлт хэсгийг нээнэ үү. PaperPaw энэ нь энэ төхөөрөмжид зориулсан бүтэн, гэмтээгүй програм хангамж эсэхийг шалгах боловч гарын үсэггүй тул хэн хийснийг мэдэх боломжгүй. «Ямар ч байсан суулгах» нь үүнийг флаш санах ойн нөгөө хагаст бичиж, төхөөрөмж түүнийг эхлүүлнэ; тэр програм хангамж дээр нь ямар нэг зүйл суулгах хүртэл PaperPaw өөрийн хагаст үлдэнэ. PaperPaw руу буцахын тулд түүний суулгах файлыг (paperpaw-<төхөөрөмж>-<хувилбар>-install.bin) нөгөө програм хангамжийн цэснээс, жишээ нь CrossPoint-ийн SD firmware update-ээр суулгана уу."
