about.plugin.name = Тухай
about.plugin.description = PaperPaw-ийн хувилбар ба лиценз.
about.plugin.how = "«Тухай» хэсэг таны PaperPaw аль хувилбар болох, эх код нь хаана байгаа, ямар лицензээр түгээгддэгийг харуулна.\n\nҮүнийг Тохиргооны хамгийн доор «PaperPaw-ийн тухай» нэрээр олно. Сум товч ба «Сонгох» товчоор мөр сонгох, эсвэл мөрийг товшино уу. Програм хангамжид суулгагдсан плагинууд, мөн код бүхий плагин ачаалдаг төхөөрөмж дээр ийм плагинуудыг бүтээх ёстой хурууны хээ ч энд жагсаагдана.\n\n«Лиценз» уншигч дээр текст хэлбэрээр нээгдэх тул ном шиг хуудас эргүүлж уншина. Үүнд PaperPaw-ийн өөрийн лиценз болон хамт ирдэг фонт, дүрс тэмдэг, үг таслах загваруудын лиценз багтана. Плагинууд өөрийн мөр, жишээ нь загварын зохиогчийг нэмж болно."
