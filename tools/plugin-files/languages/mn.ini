transfer.plugin.name = Дамжуулалт
transfer.plugin.description = Нэг сүлжээн дэх хөтчөөс төхөөрөмж рүү ном болон бусад файл хуулна.
transfer.plugin.how = "Wi-Fi дамжуулалт нь кабель, аппгүйгээр нэг сүлжээн дэх хөтчөөс төхөөрөмж рүү ном болон бусад файл хуулна. Мөн файл татаж авах, хавтас үүсгэх, устгах боломжтой.\n\nҮүнийг Хэрэгслүүд цэснээс нээнэ үү. Дэлгэц дээр хаяг текст болон QR код хэлбэрээр гарна: хаягийг утас эсвэл компьютерийн хөтчид нээх эсвэл кодыг уншуулна уу. Хаяг удаа бүр шинээр үүсгэсэн түлхүүртэй тул сүлжээн дэх бусад хүн таны файлд хандаж чадахгүй. Дэлгэц нээлттэй байх хооронд дамжуулалт ажиллана.\n\nX4 зэрэг PaperPaw өөрөө Wi-Fi-г удирддаг төхөөрөмж дээр доод хэсгийн «Роутергүй» нь төхөөрөмжийн өөрийн сүлжээг нээнэ; утас кодыг уншуулж түүнд нэгдэнэ."
