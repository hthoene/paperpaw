aids.plugin.name = Унших туслах
aids.plugin.description = Үгийн тод эхлэл, сольсон үг, зураг: текст таны хүссэнээр.
aids.plugin.how = "«Унших туслах» нь уншиж байх үед номын текст хэрхэн харагдахыг өөрчилнө. Бүх номд үйлчилнэ. «Үгийн эхийг тодруулах», «Үг солих» эхэндээ унтраалттай.\n\nТэдгээрийг Тохиргоо › Унших › Унших туслах хэсгээс олно. «Үгийн эхийг тодруулах» нь үг бүрийн эхний хагасыг тод болгодог бөгөөд зарим хүнд ингэж уншихад хялбар байдаг. «Үг солих» нь «г.м. = гэх мэт; ж.нь = жишээ нь» гэх мэт цэгтэй таслалаар тусгаарласан хосуудыг авна.\n\nЗөвхөн бүтэн үгийг, яг таны бичсэнээр солино, тиймээс урт үгийн хэсэг хэзээ ч өөрчлөгдөхгүй. Номын файл өөрөө өөрчлөгдөхгүй.\n\nНомын зургийг харуулах (эхэндээ ийм), зургийн тайлбарыг ашигласан «[Зураг: далай дээрх хөлөг онгоц]» гэх мэт богино мөрөөр орлуулах, эсвэл хасаж болно. Тэгвэл хуудсанд текстийн зай ихсэж, харуулахгүй зургийг задлахгүй тул хуудас хурдан эргэнэ. Комикс болон зургаас бүтсэн бусад ном өөрчлөгдөхгүй."
