settings.plugin.name = Тохиргоо
settings.plugin.description = Бүх плагины тохиргооноос бүтсэн тохиргооны хуудсууд.
settings.plugin.how = "Тохиргоо нь PaperPaw болон түүний плагинуудад тохируулж болох бүх зүйлийг хуудсаар харуулна. Плагинуудад өөрийн дэлгэц хэрэггүй: тэдний зарласан зүйл энд бүлгээрээ, тохиргоо бүрийн доор тайлбартайгаар гарна.\n\nЦэсний «Тохиргоо» мөрөөр нээнэ. Бүлгийг товшвол нээгдэнэ, дараа нь тохиргоог товшиж асааж унтраах эсвэл сонгоно. Тоонд − ба + товч бий. Товчоор бол тохиргоо руу очиж «Сонгох» товчийг дарна: зүүн, баруун нь тоог өөрчилнө, «Сонгох» хадгална, «Буцах» өмнөх утгыг сэргээнэ.\n\nӨөрчлөлт шууд хэрэгжинэ. «Хайх» нь тохиргоог үгээр олно, «Нарийвчилсан тохиргоо» ховор хэрэглэгддэгийг нэмж харуулна. «Анхны болгох» ба «Бүгдийг анхны болгох» эхлээд асууна."
