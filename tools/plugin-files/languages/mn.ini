keys.plugin.description = Товч, товших бүс, шудралт бүр юу хийхийг төхөөрөмж дээр өөрчилнө.
keys.plugin.how = "«Товч ба зангаа» нь товч, товших бүс, шудралт бүр юу хийдгийг харуулж, төхөөрөмж дээр өөрчлөх боломж олгоно.\n\nТохиргооны Төхөөрөмж хэсгээс нээнэ. Эхлээд өөрчлөлт хаана хамаарахыг сонгоно: Хаа сайгүй, Унших үед, Нүүр дэлгэц дээр, Номын санд эсвэл нэг хэрэгсэлд. Дараа нь дарж байгаа товч эсвэл захаас дотогш шудрах зэрэг оролтыг сонгоод, хайж болох жагсаалтаас үйлдэл сонгоно. «Стандартаар» нь плагинууд болон товчны байршлын тохируулсныг буцаана.\n\nX4 дээр сонгох, буцах эсвэл урагшлах товч үлдээхгүй өөрчлөлтийг хүлээж авахгүй. Төгсгөлд байгаа «Товч ба зангааг анхны болгох» бүх өөрчлөлтийг буцаана."
