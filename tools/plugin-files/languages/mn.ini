translate.plugin.description = Сонгосон текстийг DeepL-ээр онлайнаар орчуулна.
translate.plugin.how = "Орчуулга нь сонгосон текстийг DeepL-ээр онлайнаар орчуулна. Номонд текст сонгоод, сонгосон текстийн цэснээс «Орчуулах» гэснийг сонгоно уу: орчуулга толь бичгийн оруулга шиг хуудасны дээр гарна. Хуудас эргүүлэх товч эсвэл товшилтоор гүйлгэнэ; «Сонгох» товч эсвэл төгсгөлд нь товшвол хаагдана.\n\nСүлжээ болон өөрийн DeepL API түлхүүр хэрэгтэй, deepl.com дээр үнэгүй авна (DeepL API Free, сард ойролцоогоор 500,000 тэмдэгт). Түлхүүр оруулах хүртэл самбар үүнийг мэдэгдэх ба товшвол түлхүүр асууна.\n\nТохиргооны Унших хэсгийн Орчуулга бүлэгт «Орчуулах хэл» нь хэлийг тогтооно; анхандаа PaperPaw-ийн хэл байна."
