diagnostics.plugin.name = Оношилгоо
diagnostics.plugin.description = Туршилтын дэлгэц ба төхөөрөмжийн бүх хэсгийг алхам алхмаар шалгах.
diagnostics.plugin.how = "Оношилгоо бол төхөөрөмж шалгах туршилтын дэлгэц: дэлгэцийн харуулж чадах саарлын бүх түвшин, товч ба мэдрэгчийг турших дөрвөн нүд, сэргээх горимуудыг харьцуулах хуудасны тоолуур, явцын мөрийг харуулна.\n\nТуршилтын дэлгэц цэсэнд байхгүй. Өөр плагин нүүр дэлгэц санал болгоогүй үед, эсвэл плагин удирдагчийн «Дэлгэцүүд» хэсэгт «Нүүр дэлгэц» байрлалд сонгосон үед л нүүр дэлгэц болно.\n\n«Сонгох» идэвхтэй нүдийг тэмдэглэж, сум товчнууд нүд хооронд шилжүүлнэ; мэдрэгчээр нүдийг товшино. Хуудас эргүүлэх товч туршилтын хуудсыг эргүүлнэ. Дахин эхлэхийн тулд «Сонгох» товчийг дарж байх эсвэл дэлгэцэн дээр хуруугаа удаан барина уу.\n\nPaperPaw төхөөрөмжийн програм хангамж бол «Хэрэгслүүд» доторх төхөөрөмжийн шалгалт хэсэг бүрийг нэг нэг хуудсаар шалгана: дэлгэц, товч, мэдрэгч, гэрэл, батарей, карт, цаг, Wi-Fi, унтах горим, санах ой. Хуудас бүр «Тэнцээгүй», «Алгасах», «Тэнцсэн» сонголтоор төгсөх ба хэмжилтийн санал болгосон хариулт сонгогдсон байна; төхөөрөмжид байхгүй хэсгийг алгасна. Хариулт бүрийн дараа тайланг .paperpaw/plugins/diagnostics/device-check.txt файлд бичнэ, үүнийг pull request-д буулгана. «Буцах» гаргана, дахин нээхэд зогссон газраасаа үргэлжилнэ. Зөвхөн товчтой төхөөрөмж дээр эхлээд товчны хуудсанд «Эхлэх» товчийг сонгоно уу; тэр хүртэл сум, «Сонгох», «Буцах» бусад хуудсан дээрх шиг ажиллана."
