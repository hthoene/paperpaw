vocabulary.sd.readme = "Файлаас флэш карт\n\nБагц бүрт энд нэг файл хийнэ үү: Англи.tsv нь Англи багц болно.\nФайл: .tsv, .csv эсвэл .txt (UTF-8 хэлбэрээр хадгалсан), эсвэл .apkg: «Support older Anki versions» сонголтыг чагталж экспортолсон Anki багц. Түүний тэмдэглэлийн эхний гурван талбар нүүр, ар, жишээ болно; давталтын хуваарь, медиаг уншихгүй, PaperPaw Anki файлд хэзээ ч бичихгүй.\n\nМөр бүрт нэг карт: нүүр, ар, жишээ (заавал биш), таб, таслал эсвэл цэгтэй таслалаар тусгаарласан. Эхний мөр баганыг нэрлэж болно: front, back, example. Жишээ:\n\ncat\tмуур\tThe cat is sleeping.\n\nДараа нь төхөөрөмж дээр Флэш карт нээж, «SD карт дээрх картууд», дараа нь «Багцуудыг шинэчлэх» мөрийг сонгоно уу.\n\nАнхаарах зүйл:\n- Багцууд таны сурсан явцтай хамт төхөөрөмжид үлдэнэ. Файл шинэ эсвэл өөрчлөгдсөн үед уншигдаж, картууд нь багцад нэмэгдэх эсвэл тэнд өөрчлөгдөнө.\n- Файлд картын ар тал эсвэл жишээг өөрчилбөл карт өөрчлөгдөж, явцаа хадгална.\n- Картын нүүр талыг өөрчилбөл шинэ карт болж, хуучин нь дахин эхэлнэ. Картыг нүүр талын текстээр нь тааруулдаг; зай, том жижиг үсэг хамаагүй. Багцыг файлд хадгалбал («SD карт дээрх картууд», «Карт руу хадгалах») карт бүр id баганад дугаартай болно: тэнд нүүр талыг өөрчилж, файлын эхний хоёр мөрийг хэвээр үлдээвэл карт явцаа хадгална.\n- Хадгалахад багцын картууд бичигдэнэ. Файлд байсан ч карт биш зүйл (нүүр талгүй мөр) хадгалагдахгүй; өмнөх файл _нэр.bak.tsv болж хуулагдана.\n- Файлыг CSV UTF-8 хэлбэрээр хадгална уу (UTF-16 биш, хүснэгтийн програмын өөрийн формат биш). 4 MiB эсвэл 20,000 мөрөөс том файлыг уншихгүй: хуваана уу.\n- Файлаас устгасан мөр багц дахь картыг устгахгүй, харин тухайн багцад «Файлд байхгүй картууд» тохиргоог Хасах болговол карт явцтайгаа хамт устана.\n- Нэр нь _ тэмдгээр эхэлсэн файлыг уншихгүй.\n"
