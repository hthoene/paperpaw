menu.plugin.name = Цэс
menu.plugin.description = Дэлгэцийн доод хэсэгт гарах, үйлдэл болон тохиргоо бүхий цэс.
menu.plugin.how = "Цэс нь таны хийж, тохируулж болох зүйлсийг жагсаана. Энэ нь дэлгэцийн доод хэсэгт, нээлттэй байгаа зүйлийн дээр нээгдэнэ: уншиж байхдаа дэлгэцийн голд товших эсвэл «Сонгох» товчийг дарна уу. Мөрийг товших эсвэл сонгож ажиллуулна.\n\nЦэс дэх тохиргоонууд утгаа харуулж, тэр дор нь өөрчлөгддөг тул цэс нээлттэй хэвээр үлдэнэ. Дэд мөрүүдтэй мөр дэд цэс нээнэ.\n\nДээд захаас доош шударвал шуурхай самбар гарна: байнга өөрчилдөг зүйлс товч хэлбэрээр. Товчийг товшиж асаах/унтраах, дарж байж тохиргоог нь нээнэ. Зөвхөн товчоор: сумтай товчнууд сонгож, «Сонгох» асааж/унтрааж, «Буцах» хаана. «Гадаад төрх» хэсгийн «Цэсүүд» тохиргоо цэсийг жагсаалт эсвэл хавтан хэлбэрээр харуулна."
