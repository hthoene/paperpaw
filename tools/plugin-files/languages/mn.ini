smart-home.plugin.name = Ухаалаг гэр
smart-home.plugin.description = Өөрийн Home Assistant-ийн утга, унтраалгыг хянах самбар болон нүүр дэлгэцийн виджетээр харуулна. Гэрийн сүлжээн дэх Home Assistant-тай ажиллана.
smart-home.plugin.how = "Ухаалаг гэр нь өөрийн Home Assistant-ийн утга, унтраалгыг харуулна: температур, чийгшил, эрчим хүч, хаалга цонх, гэрэл, унтраалга, сцен. Гэрийн сүлжээгээр сервертэй тань REST API-аар шууд холбогдоно; өөр үйлчилгээ дамжихгүй.\n\nХэрэгслүүдийн цэснээс Ухаалаг гэрийг нээгээд «Холболт» хэсэгт Home Assistant-ийн хаяг (жишээ нь http://homeassistant.local:8123) болон урт хугацааны хандалтын токен (Home Assistant-ийн профайл хуудасны доод хэсэгт үүсгэнэ) оруулна уу. Токен нууц үг, түлхүүрийн хамт хадгалагдана, тохиргооны файлд хэзээ ч биш. Энгийн http зөвхөн гэрийн сүлжээний хаягт ашиглагдана; өөр газрын серверт тохиргооноос «Гэрийн сүлжээнээс гадуурх сервер» тохиргоог асааж, хүчинтэй гэрчилгээтэй https ашиглана уу.\n\n«Объект сонгох» нь серверт буй зүйлсийн жагсаалтыг нээнэ: нэр эсвэл id-аар хайж, харуулах объектоо сонгоно (дахин сонговол хасагдана). Түүнд өрөө өгвөл хянах самбар болон өрөөний виджетэд бүлэглэгдэнэ. 24 хүртэл объект хадгална. Хянах самбар дээр гэрэл, унтраалга, сцен сонговол асаах/унтраах буюу ажиллуулна; мөрөнд серверийн хариу харагдана. Сонгосон мэдрэгчийг дахин уншина.\n\nВиджетүүд (нүүр дэлгэцийг дарж байгаад виджет нэмнэ): утга нь нэг үзүүлэлтийг томоор, бүлэг нь өрөөний объектуудыг, унтраалга нь нэг гэрэл эсвэл унтраалгын товчийг, өрөө нь өрөөний үзүүлэлт, унтраалгатай картыг харуулна. Виджет бүрийн тохиргоонд аль объект эсвэл өрөөг харуулахыг заана.\n\nГэрийн мэдээллийг хянах самбар нээх, таныг хүсэх («Одоо шинэчлэх» мөр эсвэл утга, бүлгийн виджет товших), Wi-Fi асаалттай үед төхөөрөмж сэрэх, мөн цэнэглэгч залгаатай үед таны тохируулсан давтамжаар уншина. Радиог өөрөө хэзээ ч асаахгүй, асаалттай ч байлгахгүй."
