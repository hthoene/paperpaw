battery.plugin.name = Батарейн хэрэглээ
battery.plugin.description = Батарейг бүртгэж, хэр удаан барихыг харуулна.
battery.plugin.how = "«Батарейн хэрэглээ» нь төхөөрөмж сэрүүн байх үед цэнэгийг ойролцоогоор минут тутам, төхөөрөмжийн хийсэн зүйлийн хамт тэмдэглэнэ: дэлгэцийн сэргээлт, эргүүлсэн хуудас. Үүнээс сэрүүн байх нэг цаг болон 100 хуудас хэр их цэнэг зарцуулдаг, энэ хурдаар батарей хэр удаан барихыг тооцоолно.\n\nХэрэгслүүд цэсний «Батарей» мөрийг нээнэ үү. Энд одоогийн цэнэг, энэ удаагийн сэрүүн хугацаа, батарейгаар өнөөг хүртэлх хэрэглээ, сүүлийн сэрүүн хугацаанууд харагдана. Хуудас эргүүлэх товчоор, эсвэл дээд талын сумыг товшиж хуудаслана.\n\nТоонууд утга учиртай болохын тулд батарейгаар хэсэг хугацаанд унших хэрэгтэй. Бүртгэл анхнаасаа асаалттай бөгөөд Тохиргоо › Төхөөрөмж › Эрчим хүч хэсэгт «Батарейн хэрэглээг бүртгэх» тохиргоогоор унтрааж болно."
