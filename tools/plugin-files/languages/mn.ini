puzzles.plugin.name = Таавар
puzzles.plugin.description = Судоку, кроссворд, шатрын бодлого, офлайн, өдрийн таавартай.
puzzles.plugin.how = "Галт тэрэг, хүлээлгийн өрөөнд зориулсан офлайн таавар: судоку, кроссворд, шатрын бодлого. Тааврыг хэрэгслүүдийн цэснээс нээнэ үү, эсвэл «Өдрийн таавар» виджетийг нүүр дэлгэцэд нэмнэ үү (нүүр дэлгэцийг дарж байгаад виджет нэмнэ): өнөөдрийн судоку хэр явсныг харуулж, товшвол нээнэ. Өдрийн судоку өдөржин ижил.\n\nСудоку: Зүүн, Баруун курсорыг нэг нүдээр, Дээш, Доош (хуудас эргүүлэх товч) нэг мөрөөр зөөнө. «Сонгох» цифрүүдийг нээнэ: нэгийг сонгоод дахин сонговол оруулна, «Арилгах» нүдийг хоосолно. «Сонгох» (эсвэл «Цэс») товчийг дарж байвал самбарын доорх товчнууд руу очно: «Тэмдэглэл» цифрийг харандааны тэмдэг болгоно, «Шалгах» буруу нүдийг тэмдэглэнэ, «Буцаах» сүүлийн нүүдлийг буцаана, «Шинэ» сонгосон түвшний (Хялбар, Дунд, Хэцүү) таавар эхлүүлнэ. Таавар бүр яг нэг шийдтэй. Гарахад тоглолт хадгалагдана. Мэдрэгчтэй дэлгэц дээр нүдэн дээр товшино.\n\nКроссворд: .puz (Across Lite) эсвэл .ipuz файлуудыг санах ойн карт дээрх «puzzles» хавтсанд хийнэ үү; дагалдах файл байхгүй. Торон дээр шилжээд сонговол курсор доорх үгийг гараар бичнэ (доогуур зураас нүдийг хоосон үлдээнэ). Товчнууд хэвтээ, босоо чиглэлийг сольж, асуултын жагсаалтыг харуулж, үсгийг шалгаж, үгийг илчилнэ. Үсгүүд файл бүрээр хадгалагдана. Шифрлэсэн .puz файлыг нээх боломжгүй.\n\nШатрын бодлого: Lichess бодлогын сангаас (CC0) авсан жижиг багц. Зүүн, Баруун нэг дүрсээс нөгөө рүү шилжинэ; нүүх дүрсээ сонгоод, Зүүн, Баруунаар очих нүдээ олж дахин сонгоно уу. Буруу нүүдлийг буцаана. «Зөвлөмж» нүүх дүрсийг тэмдэглэнэ, «Дараах» дараагийн бодлого руу шилжинэ.\n\nСамбар зөвхөн өөрчлөгдсөн нүднүүдийг дахин зурна. «Статистик» шийдсэн тааврыг тоолно."
