profiles.plugin.name = Унших профайлууд
profiles.plugin.description = Унших болон дэлгэцийн тохиргооны нэртэй багцууд, нэг товшилтоор солигдоно.
profiles.plugin.how = "Профайл нь унших тохиргоо, дэлгэцийн тохиргоо, төлөвийн мөрүүдийг «Шөнө», «Том үсэг» гэх мэт нэрээр хадгалж, нэг товшилтоор буцаан авчирна.\n\nПрофайлуудыг унших цэсний «Бусад» хэсгээс эсвэл Тохиргооны «Тохируулах» хэсгээс нээнэ. Профайлыг ашиглах бол түүн дээр товшино уу; ашиглаж буй нь тэмдэглэгдсэн байна. Одоогийн тохиргоог түүнд хадгалах, нэрийг нь өөрчлөх эсвэл хасах бол дарж байна уу (товчоор бол «Сонгох» товчийг дарж байна уу). «Шинэ профайл болгон хадгалах» нь одоогийн тохиргоог хадгална.\n\n«Дараагийн профайл» жагсаалтын дараагийн профайл руу шилжүүлнэ; үүнийг товч эсвэл дүрэмд оноож болно."
