notes-overview.plugin.name = Бүх тэмдэглэл
notes-overview.plugin.description = Бүх номын хавчуурга, тодотгол нэг жагсаалтад, мөн My Clippings.txt болгон экспортлох.
notes-overview.plugin.how = "«Бүх тэмдэглэл» нь таны хавчуурга эсвэл тодотгол хийсэн ном бүрийг тоотой нь жагсаана. Үүнийг Хэрэгслүүд цэснээс нээнэ. Номыг сонговол тэмдэглэлүүд нь харагдана, тэмдэглэлийг сонговол ном тухайн газраа нээгдэнэ.\n\nЖагсаалтын төгсгөл дэх «My Clippings.txt болгон экспортлох» нь бүх тэмдэглэлийг нэг файлд, номын сангийн хажуух Exports хавтсанд, Kindle-ийн хэрэглэдэг хэлбэрээр (UTF-8) бичнэ. Kindle-ийн My Clippings.txt файлыг уншдаг аппууд үүнийг уншиж чадна. Тодотгол дээрх тэмдэглэл нь Kindle дээрх шиг тусдаа бичлэг болно. Энд ном Kindle-ийн байршилгүй тул «location» нь тэмдэглэл номын хэдэн хувьд байгааг заана. Файлыг тухай бүр шинээр бичиж, өмнөхийг нь солино."
