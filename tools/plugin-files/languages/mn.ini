power.plugin.name = Эрчим хүч
power.plugin.description = Эрчим хүчний горимыг гараар эсвэл батарейгаас хамааруулж сонгоно: Энгийн, Хэмнэлт, Офлайн.
power.plugin.how = "«Эрчим хүч» нь PaperPaw батарейг хэрхэн зарцуулахыг сонгоно: Энгийн, Хэмнэлт эсвэл Офлайн. Хэмнэлт горимд хүлээж болох ажлыг илүү тохиромжтой үед хийнэ; Офлайн горимд радио унтраалттай байна. Автомат горим батарейгаас хамаарч сонгоно.\n\nГоримыг шуурхай самбараас (тэнд «Эрчим хүч» горимуудыг зэрэгцүүлэн харуулна) эсвэл Тохиргооны «Эрчим хүч» хэсгээс солино. Тэнд Автомат горим Хэмнэлт болон Офлайн руу шилжих түвшин, цэнэглэх үед Энгийн хэвээр байх эсэхийг мөн тохируулна.\n\nТөлөвийн мөрөнд «Эрчим хүчний горим» хэмнэлтийн үед навч, офлайн үед дээгүүр нь зурсан Wi-Fi тэмдэг харуулна, Энгийн үед юу ч харуулахгүй.\n\nАсаах товчийг дарж байвал жижиг цэс нээгдэнэ: Унтах, Унтраах (PaperPaw чадах төхөөрөмжид), Дахин асаах, мэдрэгчтэй төхөөрөмжид Мэдрэгчийг түгжих эсвэл Мэдрэгчийн түгжээг тайлах. Богино дарвал өмнөх шигээ төхөөрөмж унтана. «Буцах» товч цэснээс гарна."
