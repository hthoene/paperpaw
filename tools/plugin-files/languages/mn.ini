bluetooth.plugin.description = Алсын удирдлага, гар, мэдрэгчийг хослуулж, холбоно.
bluetooth.plugin.how = "Bluetooth нь Bluetooth-тэй уншигч (X4 Pro) дээр алсын удирдлага, гар, мэдрэгчийг хослуулна.\n\n«Төхөөрөмж нэмэх» нь ойр байгаа төхөөрөмжийг хайна; эхлээд төхөөрөмжөө хослуулах горимд оруулна уу. Түүнийг сонгоод уншигч дээр баталгаажуулна уу (тоо гарч ирвэл харьцуулна уу). Ингэснээр алсын удирдлага эсвэл гарын товчоор хуудас эргүүлж, цэсээр шилжинэ; товч бүрийн үйлдлийг Удирдлага хэсэгт өөрчилнө.\n\n«Алсын удирдлага» нь товч хэзээ ажиллахыг заана: энд асаасан үед, унших үед (ном нээлттэй байх хооронд холбогдож, батарей хэмнэнэ), эсвэл үргэлж. Цэс товч эсвэл төхөөрөмж дээр удаан дарвал түүнийг мартана.\n\nМэдрэгч нь плагинд зориулагдсан: аль плагин ашиглаж болохыг асаана уу. Юу ч ашиглаагүй үед Bluetooth унтраалттай байна."
