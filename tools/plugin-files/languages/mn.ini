help.plugin.name = Зөвлөмж
help.plugin.description = Дэлгэц анх нээгдэхэд удирдлага нь юу хийдгийг харуулна.
help.plugin.how = "Дэлгэц анх нээгдэхэд дээр нь богино тайлбар гарч, удирдлага нь юу хийдгийг хэлнэ: товшилт дэлгэцийн аль хэсэгт хамаарахыг хүрээгээр, мөн товчнууд юу хийдгийг.\n\nТовших эсвэл аль нэг товч дарахад тайлбар хаагдах бөгөөд тухайн дэлгэцэд дахин гарахгүй. «Зөвлөмж хэрэггүй» бүгдийг нь унтраана.\n\nТохиргооны Систем хэсэгт «Зөвлөмж» тэдгээрийг асааж, унтраана; «Зөвлөмжийг дахин харуулах» нь дэлгэц бүрийн тайлбарыг дахин нэг удаа харуулна."
help.title = Энд хэрхэн ажилладаг вэ
help.got-it = Ойлголоо
