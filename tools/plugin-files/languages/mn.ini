fonts-browser.plugin.name = Нэмэлт фонт
fonts-browser.plugin.description = Интернэтээс фонтуудыг жишээтэй нь харуулж, уншихад зориулан татаж авна.
fonts-browser.plugin.how = "Нэмэлт фонт нь интернэт дэх фонтын сангийн фонтуудыг нэр бүрийг өөрийн фонтоор нь бичиж жагсаагаад, сонгосныг тань татна.\n\nТохиргоо › Унших › Фонт дахь фонтын жагсаалтын төгсгөлд байна; төлөвийн мөрийн фонтод ч ийм мөр бий. Фонтыг товшвол (товчоор: «Сонгох») жишээ өгүүлбэртэй томоор харагдана, дараа нь «Татах»-ыг сонгоно уу. Татаж байх үед хуудсаас гарч болно. Дууссаны дараа «… фонтоор унших» эсвэл «Төлөвийн мөрөнд ашиглах»-ыг сонгоно. «Шинэчлэх» шинэ хувилбар татна, «Хасах» фонтыг төхөөрөмжөөс устгана.\n\nWi-Fi хэрэгтэй.\n\nӨӨРИЙН ФОНТ\n\nМөн жагсаалтад «Өөрийн фонт» мөр бий, тусламжийн энэ хэсгийг харуулна. Өөрийн фонт нь .ttf эсвэл .otf файл, жишээ нь Google Fonts-оос.\n\nAndroid болон фонт файл зурдаг бусад төхөөрөмж дээр: файлыг fonts хавтас руу хуулж (Android дээр: дундын санах ойн PaperPaw/fonts), PaperPaw-г дахин эхлүүлээд Тохиргоо › Унших › Фонт хэсэгт сонгоно уу.\n\nXteink X4, X4 Pro дээр: фонт файл санах ойд нь багтахгүй тул эдгээр нь фонтын багц уншдаг. Компьютер дээр paperpaw-fontgen-ээр байгаа хэв маяг бүрээр багц үүсгэнэ (regular заавал):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nИнгэхэд plugins/font-my-font хавтас үүснэ. Үүнийг санах ойн картын plugins хавтас руу хуулж, дахин эхлүүлээд Фонт хэсэгт My Font-ыг сонгоно. Латин үсэгтэй нэг хэв маягийн багц ойролцоогоор хагас МБ; оруулаагүй хэв маягийг regular-аар зурна. Хэрэгсэл хүссэн үсгүүдээс хэд нь фонтод байгааг хэлнэ (--chars latin,cyrillic,greek бичиг нэмнэ): номын тань үсэг фонтод байхгүй бол харагдахгүй, тиймээс тэр бичгийг агуулсан фонт сонгоно уу.\n\nНэмэлт фонтоос авсан фонт мөн адил ажиллах ба компьютер шаардахгүй.\n\nE-ink дэлгэц дээр жижиг текстийг илүү тод болгох бол командад --hinting light нэмнэ үү: үсгийг үндсэн фонтууд шиг пикселийн торд тааруулна. Үүнгүйгээр үсэг фонтын дизайнаараа зурагдана; --hinting normal ба --hinting mono илүү хүчтэй тааруулна. Араб, Деванагари зэрэг тэмдэгтэй бичгийн фонтод үүнийг хэрэглэхгүй нь дээр."
