calibre.plugin.name = Утасгүй номын сан
calibre.plugin.description = Сүлжээгээр ном хүлээн авна. Calibre-д утасгүй төхөөрөмж болж ажиллана.
calibre.plugin.how = "Утасгүй номын сан нь төхөөрөмжийг компьютер дээрх Calibre-д утасгүй төхөөрөмж болгон харуулна. Ингэснээр Calibre түүн рүү ном илгээж, жагсааж, устгаж чадна. Номууд номын санд орно.\n\nТөхөөрөмж, компьютер нэг Wi-Fi сүлжээнд байхад «Хэрэгслүүд» цэснээс Утасгүй номын санг нээнэ үү. Calibre дээр «Connect/share» › «Start wireless device connection» сонгоно уу. Төхөөрөмж таны компьютерийг олбол нэрийг нь харуулна: «Холбогдох» дээр товшино уу (товчтой бол «Сонгох» дарна). Calibre энд ном нэмж, устгаж чадах тул зөвхөн өөрийн компьютертэй холбогдоно уу. Дэлгэцийг хаавал холболт тасарна.\n\nCalibre өөрөө олдохгүй бол түүний компьютерийн хаягийг Тохиргоо › Номын сан хэсгийн Calibre дотор «Хаяг» мөрөнд оруулна уу. Calibre 9090-ээс өөр порт ашигладаг бол :порт гэж нэмнэ, ж.нь 192.168.1.20:9091."
