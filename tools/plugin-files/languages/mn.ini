rules.plugin.description = Ямар нэг зүйл болоход үйлдэл хийнэ: жишээ нь 22:00 цагт шөнийн горим.
rules.plugin.how = "Дүрэм нь ямар нэг зүйл болоход өөрөө үйлдэл хийнэ: өдөр бүр 22:00 цагт шөнийн горимыг асаах, эсвэл PaperPaw эхлэхэд каталогуудыг синк хийх.\n\nДүрмүүд тохиргооны «Тохируулах» хэсэгт «Дүрэм» нэрээр байна. «Дүрэм нэмэх» нь Хэзээ? (PaperPaw эхлэх, өдрийн цаг, ном нээх эсвэл хаах, батарей, цэнэглэлт, шилжүүлэгч гэх мэт) болон Дараа нь юу? (үйлдэл гүйцэтгэх, шилжүүлэгчийг асаах эсвэл унтраах, тоо тохируулах, мессеж харуулах) гэж асууна. Дүрмийг товшвол түр зогсоно. Дарж байвал (товчоор бол «Сонгох» товчийг дарж байх) «Өдрийн хоёр цагийн хооронд» гэх мэт нөхцөл нэмэх эсвэл хасах боломжтой.\n\nСонгох үйлдэл, шилжүүлэгч, тоо нь плагинаар ангилагдсан: эхлээд плагиныг, дараа нь түүний санал болгосныг сонгоно. «Буцах» дахин гаргана. Харагдаж буй дэлгэц дээр ажилладаг үйлдэл, жишээ нь «Буцах» эсвэл «Дараах хуудас», тэнд дарсантай адил ажиллана.\n\nЦагийн дүрэм аль ч дэлгэц нээлттэй байсан ажиллана. Бие биеэ байнга цуцалдаг хоёр дүрэм хэдэн алхмын дараа зогсоно."
