reader.plugin.name = Уншигч
reader.plugin.description = Номыг хуудас хуудсаар, агуулга болон унших тохиргоотой харуулна.
reader.plugin.how = "Уншигч номыг хуудас хуудсаар харуулна. Номыг номын сангаас нээнэ үү; сүүлийн номыг асах үед дахин нээж болно («Асахад сүүлийн номыг нээх» тохиргоо).\n\nХуудас эргүүлэх бол дэлгэцийн зүүн эсвэл баруун талд товших, эсвэл хуудас эргүүлэх товчийг ашиглана уу. Унших цэсийг нээх бол голд нь товших эсвэл «Сонгох» товчийг дарна уу: Агуулга, Хайх, Хуудас руу очих, Фонт ба байршил, Хавчуурга ба тодотгол гэх мэт. Дээд захаас доош чирвэл шуурхай самбар нээгдэж, доод захаас дээш чирвэл нүүр дэлгэц рүү очно; «Буцах» товчийг дарж байх нь мөн адил.\n\nЗургийг бүтэн дэлгэцээр харах бол «Сонгох» товчийг (эсвэл зургийг) дарж байна уу: Зүүн, Баруун хуудасны зургуудаар шилжинэ. «Сонгох» 2x, 3x томруулаад буцаана (мэдрэгч дээр давхар товших); томруулсан үед Зүүн, Баруун хажуу тийш, хуудас эргүүлэх товч (эсвэл шудрах) хөндлөн ба доош шилжүүлнэ. «Буцах» эхлээд дэлгэцэд багтаана, дараа нь хуудас руу буцна (мэдрэгч дээр гарах бол дарж байна уу). Хавчуурга тавих бол баруун дээд буланд товшино уу. Үгийг тодотгох бол түүнийг дарж байна уу. Товчоор: Зүүн товчийг дарж байна уу; Зүүн, Баруун үгээр, хуудас эргүүлэх товч мөрөөр шилжүүлэх ба тэдгээрийг дарж байвал хуудасны төгсгөл рүү, догол мөрөөр шилжинэ. «Сонгох» үгийн тодотголын самбарыг нээж, «Сонгох» товчийг дарж байвал өгүүлбэр, догол мөр хүртэл өргөтгөнө (дараа нь Зүүн, Баруун төгсгөлийг, дарж байвал эхлэлийг зөөнө). Сонголт хуудас эргүүлсэн ч үргэлжилнэ. «Markdown болгон экспортлох» тэмдэглэлүүдийг тань хадгална."
