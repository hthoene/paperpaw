sleep.plugin.name = Унтах дэлгэц
sleep.plugin.description = Төхөөрөмж унтаж байхад унтаж буй муур, номын нүүр зураг, таны зураг эсвэл мессеж харуулна.
sleep.plugin.how = "Унтах дэлгэц нь төхөөрөмж унтаж байхад дэлгэцэнд юу харагдахыг тодорхойлно. E-ink дэлгэц тэжээлгүйгээр зургаа хадгална.\n\nТохиргооны Төхөөрөмж, Унтах дэлгэц хэсгийн «Харуулах» мөрөөс сонгоно: унтаж буй муур (анхдагч), номын нүүр зураг, миний зургууд, лого ба «Унтаж байна», виджетүүд, хуудсыг байгаагаар нь, эсвэл зурагтай хуудас. «Миний зургууд» нь Зургийн хавтсанд буй файлуудыг ээлжлэн харуулна.\n\nНүүр зураг эсвэл зураг байхгүй бол муур гарна. Систем өөрөө унтах дэлгэцийг зурдаг төхөөрөмж дээр эдгээр тохиргоо нуугдана.\n\nУнтраах дэлгэц («Унтрахад харуулах») нь «Эрчим хүч» цэснээс эсвэл «Унтсаны дараа унтраах» хугацаа өнгөрөхөд төхөөрөмж унтрах үед нэг удаа зурагдана (батарей дуусаж тэжээл тасрахад биш). Лого ба «Унтарсан», муур, нүүр зураг эсвэл миний зургуудыг сонгоогүй бол унтах дэлгэцтэй адил байна. Өөр плагин үүнд дэлгэц санал болгож болно.\n\nАсаах ба дахин эхлүүлэх дэлгэц («Асахад харуулах», «Дахин эхлэхэд харуулах») нь өөр плагин дэлгэц санал болгоогүй бол төхөөрөмжийн өөрийнх байна. Төхөөрөмж асаж байхад плагинууд хараахан ажилладаггүй: асахад сонгосон дэлгэц нь төхөөрөмж унтрах эсвэл дахин эхлэх үед урьдчилан зурагдаж, дараагийн асаалтад харагдана. Цагтаа бэлэн болоогүй дэлгэц эсвэл гэмтсэн зургийн оронд төхөөрөмжийн өөрийнх нь гарна; төхөөрөмж ямар ч тохиолдолд унтарч эсвэл дахин эхэлнэ."
