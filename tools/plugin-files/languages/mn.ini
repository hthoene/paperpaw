file-manager.plugin.name = Файл менежер
file-manager.plugin.description = Төхөөрөмж дээрх бүх хавтас, файл: нээх, нэр өөрчлөх, зөөх, хуулах, устгах.
file-manager.plugin.how = "Файл менежер нь зөвхөн номууд биш, төхөөрөмжийн санах ой дээрх бүх хавтас, файлыг харуулж, тэдгээрийг нээх, нэр өөрчлөх, зөөх, хуулах, устгах, шинэ хавтас үүсгэх боломж олгоно.\n\n«Хэрэгслүүд» цэснээс «Файлууд» мөрийг нээнэ үү. Хавтас руу орохын тулд түүн дээр товшино; «Буцах» дээд хавтас руу буцна. Файл дээр товших эсвэл аль нэг мөрийг дарж байвал (товчоор бол «Сонгох» дарж байх) хийж болох үйлдлүүд гарна. «Зөөх», «Хуулах» нь мөрийг авна: очих хавтсандаа ороод доод самбараас «Энд буулгах» сонгоно уу. Товчоор бол сүүлийн мөрнөөс «Доош» дарж самбарт хүрнэ.\n\nPaperPaw-ийн өөрийн өгөгдөл гэх мэт цэгээр эхэлсэн файл, хавтас далд байна. Тэдгээрийг харахын тулд Тохиргоо › Номын сан хэсэгт «Далд файлууд» тохиргоог асаана уу."
