files.plugin.name = Файлууд
files.plugin.description = Төхөөрөмж дээрх ном, хавтсуудыг жагсааж, нээнэ.
files.plugin.how = "Номын сан таны номын сангийн хавтас дахь номуудыг нүүр зураг, гарчиг, зохиолч, хэр зэрэг уншсантай нь жагсаана. Хамгийн сүүлд уншсан ном дээд талд карт болж харагдах тул үргэлжлүүлэн уншихад нэг товшилт, эсвэл «Сонгох» товчийг нэг дарахад хангалттай. Номын сан ном хайж байх үед одоогоор хэдийг олсноо харуулна.\n\nНомуудын дээд талд юу харуулахаа сонгоно: бүх ном, уншиж буй, уншаагүй, уншиж дууссан ном, эсвэл тавиурууд (зохиолч, цуврал, шошго, дуртай, эхэлсэн цуврал бүрийн дараагийн ном). Ном унших бол товшино уу; нээх, дууссан эсвэл уншаагүй гэж тэмдэглэх, мэдээллийг нь харах, архив руу зөөх, устгах бол дарж байна уу (товчоор: «Сонгох» товчийг дарж байна). Номын сангийн цэсийг нээх бол гарчгийг товшино уу: эрэмбэлэх, харуулах хэлбэр, хайлт, номын сангийн хавтас, тохиргоо.\n\nНомын сангийн хавтсыг Тохиргоо › Номын сан › Номын сангийн хавтас хэсэгт тохируулна; тэнд номуудыг нүүр зургийн хүснэгтээр харуулж бас болно. Бусад бүх файлд Хэрэгслүүд цэсний «Файлууд» хэсгийг ашиглана уу."
