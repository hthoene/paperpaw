store.plugin.name = Плагин дэлгүүр
store.plugin.description = Энэ төхөөрөмжийн плагинуудыг олж, суулгаж, шинэчилж, устгана.
store.plugin.how = "Плагин дэлгүүр энэ төхөөрөмжийн плагинуудыг интернэтээс олж, суулгаж, шинэчилж, устгадаг. Хэрэгслүүд хэсгээс нээнэ; Wi-Fi хэрэгтэй.\n\nЭхлэл хуудсанд сангийн санал болгосон, шинэ болон одоо алдартай плагинууд, дараа нь бүлгүүд харагдана. Бүлгийн плагинууд өдөр бүр өөрчлөгддөг тэнцүү холимгоор жагсдаг тул плагин бүр харагдана; цагаан толгойгоор, хамгийн шинээр эсвэл сүүлд шинэчлэгдсэнээр эрэмбэлж, урт жагсаалтад үсэг рүү очиж болно. Плагиныг нээвэл хэмжээ, эзлэх санах ойтой нь хуудас гарна; тэндээс «Суулгах», «Шинэчлэх» эсвэл «Устгах» товчийг сонгоно. «Бүгдийг шинэчлэх» нь суулгасан бүх плагиныг шинэчилнэ.\n\nКод плагинууд төхөөрөмжид бүрэн хандана: дэлгүүр үүнийг анхааруулж, урьдчилан асууна; тэд дахин эхлүүлсний дараа ажиллана. Аль нэг нь алдаа гаргавал PaperPaw код плагингүйгээр эхэлж, аль нь болохыг хэлнэ. Жагсаалт хаанаас ирэхийг «Плагины сан» тохиргоо заана.\n\nТохиргоо › Систем доторх «Олон нийтийн плагин» нь бусдын GitHub дээр нийтэлсэн плагинуудыг бас харуулна. Тэдгээрийг хэн ч хянаагүй: «Хянагдаагүй» гэж тэмдэглэгдэх ба код плагины хуудсанд гарын үсгийн түлхүүр нь харагдана; өөр түлхүүрээр гарын үсэг зурсан шинэчлэлт суулгагдахгүй.\n\nЭхлэл хуудасны сүүлийн мөр болох «Эх сурвалжууд» нь бусдын плагин жагсаалтыг хаягаар нь (https://…/plugins.json) нэмэх, аль нэгийг PaperPaw-ийн жагсаалтын оронд харуулах, эсвэл устгах боломж олгоно. Бичихийн оронд мөр бүрт нэг хаягтай sources.txt файлыг карт дээрх .paperpaw/plugins/store хавтсанд хийж болно: хаягууд «Эх сурвалжууд» хэсэгт шинэ гэж харагдана. PaperPaw эх сурвалж, түүний плагинуудыг шалгадаггүй бөгөөд төхөөрөмж эх сурвалжийн сервертэй холбогдоно. Эх сурвалж жагсаалтдаа гарын үсэг зурдаг; төхөөрөмж анх уншсан жагсаалтын түлхүүрийг хадгалж, цаашид зөвхөн тэр түлхүүрээр гарын үсэг зурсан жагсаалт, код плагиныг хүлээн авна. Плагин зөвхөн суулгасан эх сурвалжаасаа шинэчлэлт авна. PaperPaw-ийн өөрийн сан үргэлж байх ба устгах боломжгүй; дэлгүүрээс гарахад түүн рүү буцна."
