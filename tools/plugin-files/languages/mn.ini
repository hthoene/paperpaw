anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Компьютер дээрх Anki-ийн давтах цаг болсон картуудыг AnkiConnect нэмэлтээр дамжуулан давтаж, хариултыг буцааж илгээнэ.
anki.plugin.how = "Anki плагин нь компьютер дээрх Anki-ийн давтах цаг болсон картуудыг уншигч дээр давтаж, хариултыг тань буцааж илгээнэ. Үнэгүй AnkiConnect нэмэлтийг (код 2055492159) ашигладаг, AnkiWeb-ийг хэзээ ч ашиглахгүй. Эхэндээ унтраалттай: Плагин дэлгүүрээс нэмнэ үү.\n\nКомпьютер дээр: Anki-д AnkiConnect суулгаад (Tools, Add-ons, Get Add-ons) Anki-г дахин эхлүүлнэ үү. Синк хийх үед Anki нээлттэй байх ёстой.\n\nAnkiConnect анхнаасаа зөвхөн өөрийн ажиллаж буй компьютерт (127.0.0.1) хариулдаг тул уншигч холбогдож чадахгүй. Tools, Add-ons, AnkiConnect, Config-ийг нээж \"webBindAddress\" утгыг \"0.0.0.0\" болгоно уу (гэрийн сүлжээнд сонсоно). Порт буюу \"webBindPort\" нь өөрчлөөгүй бол 8765. Тэнд \"apiKey\" тохируулсан бол энд ижил түлхүүрийг оруулна уу. Тохиргоог өөрчилсний дараа Anki-г дахин эхлүүлж, компьютерийн галт хана асуувал Anki-г зөвшөөрнө үү. Зөвхөн итгэлтэй сүлжээнд ашиглана уу: тэнд байгаа хэн ч AnkiConnect-д хандаж чадна, тиймээс түлхүүр тавих нь зүйтэй.\n\nУншигч дээр: Хэрэгслүүд цэснээс Anki-г нээж, «Компьютер» мөрөнд компьютерийн хаягийг (жишээ нь 192.168.1.20), порт 8765 биш бол портыг, API түлхүүр тавьсан бол түүнийг оруулна уу. Багц сонгох, эсвэл бүх багцын хувьд хоосон үлдээнэ үү. Дараа нь Wi-Fi асаалттай үед «Anki-тай синк хийх» гэснийг сонгоно: хүлээгдэж буй хариултууд эхэлж илгээгдэж, дараа нь давтах цаг болсон картууд (мөн таны тохируулсан тооны шинэ карт) хамгийн ихдээ 50 хүртэл татагдана. «Суралцах» гэснийг сонгож сүлжээгүйгээр давтана: хариултыг харуулаад «Дахин», «Хэцүү», «Сайн» эсвэл «Амархан» гэж үнэлнэ. Хариултууд Wi-Fi-гүй үед ч уншигч дээр хадгалагдаж, дараагийн синкээр Anki рүү очно. Карт хэзээ буцаж ирэхийг Anki шийднэ: «Дахин» гэж хариулсан картыг Anki давтах цаг болсон гэх үед дараагийн синк дахин татна.\n\nТохиргоон дахь «Нээхэд синк хийх» нь дэлгэцийг нээх бүрт синк хийнэ. Товч дарахад сүлжээ огт ашиглагдахгүй."
