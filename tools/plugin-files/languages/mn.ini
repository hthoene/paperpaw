reading-goal.plugin.name = Уншлагын зорилго
reading-goal.plugin.description = Өдөрт унших минут, мөн өнөөдрийн уншлагаас хамаарч сэтгэл санаа нь өөрчлөгддөг нүүр дэлгэцийн муур.
reading-goal.plugin.how = "Нүүр дэлгэц дээрх муур өнөөдрийн уншлага ямар байгааг харуулна: хараахан уншаагүй бол гунигтай, бага зэрэг уншсаны дараа гайгүй, өдрийн зорилгынхоо хагаст хүрэхэд сэтгэл хангалуун, зорилгодоо хүрэхэд баяртай.\n\n«Уншдаг муур» виджетийг нүүр дэлгэцэд нэмнэ үү (нүүр дэлгэцийг дарж байгаад виджет нэмнэ), эсвэл «Өнөөдрийн уншдаг муур» дэлгэцийг унтах дэлгэц болгон сонгоно уу. Муурыг товшвол өдрийн зорилго нээгдэнэ. Энэ нь уншсан минутыг тоолдог уншлагын статистикийн зорилго юм.\n\nТохиргооны «Унших» хэсэгт «Сэтгэл хангалуун болох» ба «Баяртай болох» нь зорилгын хэдэн хувиас муур сэтгэл хангалуун эсвэл баяртай болохыг, «Өөрийн зураг» нь муурын оронд харуулах зургийн хавтсыг (sad, meh, content, happy) тогтооно. Зургууд нь PNG эсвэл JPEG файл байна. Хавтас сонгоогүй бол муурууд харагдана."
