tasks.plugin.description = Хугацаа, ач холбогдолтой хийх ажлын жагсаалт: төхөөрөмж дээр эсвэл таны CalDAV сервертэй синк хийж, нүүр дэлгэцийн виджеттэй.
tasks.plugin.how = "Төхөөрөмж дээрх хийх ажлын жагсаалт: хугацаа, ач холбогдолтой даалгаврууд, хийснээ тэмдэглэнэ. Тохиргоо, сүлжээгүйгээр ажиллах ба CalDAV сервертэй (Nextcloud, Radicale, Baïkal, Fastmail г.м.) синк хийж, утас, компьютертэйгээ ижил жагсаалттай байж болно.\n\nДаалгаврууд нь Хэрэгслүүд цэсэнд байна. Эхний мөрөнд харагдаж буй жагсаалтын нэр байна: үүнийг сонгоод өөр жагсаалт, бүх жагсаалтын «Өнөөдөр ба хугацаа хэтэрсэн», шинэ жагсаалт, синк эсвэл бүртгэлийг нээнэ. «Даалгавар нэмэх» гар нээнэ. Даалгавар дээр «Сонгох» дарвал хийснээр тэмдэглэнэ (дахин дарвал буцаана). Даалгаврыг дарж байх эсвэл «Цэс» товч дарж гарчиг, хугацаа (өнөөдөр, маргааш, долоо хоногийн дараа эсвэл 2026-12-24 гэх мэт огноо), ач холбогдлыг өөрчлөх эсвэл устгана. Хийгээгүй даалгаврууд эхэнд өдрөөр, дараа нь ач холбогдлоор эрэмбэлэгдэнэ; хийсэн нь долоо хоног төгсгөлд үлдээд (тохиргооны Даалгаврууд хэсэгт өөрчилнө) устана.\n\nНүүр дэлгэцийн виджетүүд (нүүр дэлгэцийг дарж байгаад виджет нэмнэ): «Өнөөдрийн даалгавар» өнөөдөр болон хугацаа хэтэрснийг, «Даалгаврын жагсаалт» нэг жагсаалтыг, «Хийгээгүй даалгавар» тоог, «Дараагийн даалгавар» дараа хийхийг харуулна. Виджет дэх даалгаврыг товшвол хийснээр тэмдэглэнэ; гарчгийг товшвол жагсаалтууд нээгдэнэ.\n\nСинк хийхийн тулд жагсаалтын мөрнөөс CalDAV бүртгэлийг сонгоод серверийн хаяг, хэрэглэгчийн нэр, нууц үгээ (аппын нууц үг хамгийн тохиромжтой) оруулна уу. Серверийн хаяг хангалттай, ж.нь cloud.example.com/remote.php/dav; төхөөрөмж жагсаалтуудыг тэндээс олно. Серверийн жагсаалт бүр төхөөрөмж дээр жагсаалт болно. Даалгаврууд нээх, «Одоо синк хийх» сонгох үед болон сүлжээ асаалттай үед синк хийнэ; сүлжээгүй хийсэн өөрчлөлт дараа илгээгдэнэ. Нэг даалгаврыг төхөөрөмж дээр болон өөр газар зэрэг өөрчилсөн бол серверийнхийг авч, таных шинэ даалгавар болж үлдэнэ, юу ч алдагдахгүй. Сервер дээрх тэмдэглэл, сануулга зэрэг бусад зүйл хэвээр үлдэнэ. Давтагддаг даалгаврууд харагдах боловч үүсгэсэн газраа өөрчлөгдөнө. Төхөөрөмж 12 жагсаалтад 200 хүртэл даалгавар хадгална."
