menu-editor.plugin.name = Цэс засварлагч
menu-editor.plugin.description = Бүх цэсийн мөрүүдийн дарааллыг өөрчилж, хасаж, нэмнэ.
menu-editor.plugin.how = "Цэс засварлагч цэсүүдийн агуулгыг өөрчилнө: мөрүүдийг дээш, доош зөөх, хасах эсвэл шинээр нэмэх.\n\nҮүнийг тохиргооны «Тохируулах» хэсгээс «Цэс тохируулах» нэрээр олно. Цэс, дараа нь мөр сонгож зөөх эсвэл хасна; «Мөр нэмэх» шинэ мөр нэмнэ. Өөрчлөлт шууд хэрэгжинэ. «Энэ цэсийг анхны болгох» цэсийг плагинуудын тодорхойлсон анхны байдалд нь буцаана, «Бүх цэсийг анхны болгох» бүх цэсэд үүнийг хийнэ.\n\nӨөрийгөө түгжиж гаргах боломжгүй: тохиргоо руу хүргэх мөр нь тийш хүргэх өөр зам нэмэх хүртэл үлдэнэ."
