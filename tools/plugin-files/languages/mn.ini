weather.plugin.name = Цаг агаар
weather.plugin.description = Одоогийн болон ойрын өдрүүдийн цаг агаар виджет хэлбэрээр, Open-Meteo-оос.
weather.plugin.how = "Цаг агаар нь одоогийн цаг агаар болон ойрын өдрүүдийн мэдээг нүүр дэлгэцийн виджет болгон харуулна. Мэдээллийг Open-Meteo-оос авдаг бөгөөд бүртгэл, түлхүүр шаардлагагүй. «Одоогийн цаг агаар» нь температур, цаг агаарын байдал болон сонгосон бусад зүйлсийг харуулна; «Урьдчилсан мэдээ» нь ойрын өдрүүдийг мөрөөр эсвэл жагсаалтаар харуулна.\n\nЭхлээд газраа сонгоно уу: тохиргооны «Цаг агаар» хэсгийн «Газар» мөрөнд (нэрийг бичээд, олдсон газруудаас сонгоно). Зөвхөн түүний координат илгээгдэх бөгөөд энэ нь цаг агаарын виджет харагдаж байх үед л болно. Виджетүүдийг нүүр дэлгэцийг засах үед нэмнэ.\n\nЦаг агаарыг «Шинэчлэх давтамж» тохиргоонд заасан хугацаанаас олон удаа татахгүй бөгөөд зөвхөн сүлжээ байгаа үед татна: Wi-Fi-г хэзээ ч өөрөө асаахгүй.\n\nЦаг агаарын мэдээллийг Open-Meteo.com (https://open-meteo.com) Creative Commons Attribution 4.0 (CC BY 4.0) лицензээр олгосон."
