fonts-default.plugin.description = PaperPaw-тай хамт ирдэг фонт, дүрс тэмдэгүүд.
format-cbz.plugin.name = Комикс
format-cbz.plugin.description = Комиксийн архивыг (.cbz) нээнэ, хуудас бүрт нэг зураг.
format-cbz.plugin.how = "Комиксийн архивыг (.cbz) нээнэ: хуудас бүрт нэг зураг, дэлгэцэнд тааруулж, файлын нэрийн дарааллаар (2 нь 10-аас өмнө).\n\nТэдгээрийг номын сангийн хавтаст хийгээд номын сангаас нээнэ үү; хуудсыг бусад номын адил эргүүлнэ. Том зураг анх удаа бага зэрэг удаан ачаалагдана, X4 дээр бусдаас илүү.\n\nУнших тохиргоо (Тохиргоо › Унших): «Хүрээгээр» нь хуудасны нэг хүрээг дэлгэцэнд багтах хэрээр томоор харуулж, хуудас эргүүлэхэд хүрээ хүрээгээр шилжинэ; хүрээгүй хуудас бүтнээрээ харагдана. «Комиксийн хуудасны чиглэл» нь мангад зориулж хуудас эргүүлэлтийг эсрэгээр болгоно (баруунаас зүүн); номын өөрийн ComicInfo.xml үүнийг өөрөө заадаг. Номын сан ComicInfo.xml-ээс номын гарчиг, цуврал, дугаарыг харуулна."
format-cbz.title = Комикс (CBZ)
format-cbz.setting.direction = Комиксийн хуудасны чиглэл
format-cbz.setting.direction.help = Манга: хуудас эргүүлэлт эсрэгээрээ болно.
format-cbz.direction.book = Номд заасанаар
format-cbz.direction.ltr = Зүүнээс баруун
format-cbz.direction.rtl = Баруунаас зүүн
format-cbz.setting.panels = Хүрээгээр
format-cbz.setting.panels.help = Нэг удаад нэг хүрээ, хуудас эргүүлэхэд дараагийнх руу шилжинэ.
format-docx.plugin.name = DOCX баримт бичиг
format-docx.plugin.description = Word болон бусад програмын хадгалсан .docx файлыг нээнэ.
format-docx.plugin.how = ".docx баримт бичгийг ном шиг нээнэ: хэсгийн гарчгууд агуулгатайгаа, жагсаалт, хүснэгт, тод ба налуу бичвэр, холбоос, зураг (JPEG, PNG, GIF).\n\nФайлуудыг номын сангийн хавтаст хийгээд номын сангаас нээнэ үү. Гарчиг, зохиолч баримт бичгийн шинж чанараас авагдана. Зүүлт тайлбар, толгой ба хөл хэсэг, сэтгэгдэл харагдахгүй."
format-docx.title = DOCX баримт бичиг
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB номыг загвар, агуулга, зурагтай нь нээнэ.
format-epub.plugin.how = "EPUB ном номын сангаас бусад номын адил агуулга, зураг, хэвлэгчийн загвартайгаа нээгдэнэ. Вэб хуудас (HTML), Markdown, FictionBook (.fb2), комиксийн архив (.cbz) ч мөн адил нээгдэнэ, тус бүр өөрийн плагинтай.\n\nБүлгийг анх нээх үед хөрвүүлж, плагины кэшэд хадгална; ингэснээр дараа нь хурдан нээгдэх ба том ном жижиг төхөөрөмж дээр ч ажиллана. Агуулгыг унших цэсний «Агуулга» хэсгээс олно. Номын өөрийн загварыг хэрэглэх эсэхийг Унших хэсгийн «Хэвлэгчийн загвар» тохиргоо шийднэ."
format-epub.title = EPUB цахим ном
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook номыг нээнэ (.fb2, мөн zip-ээр шахсан).
format-fb2.plugin.how = "Орос болон бусад номд түгээмэл FictionBook номыг (.fb2), мөн zip-ээр шахсаныг (.fb2.zip) гарчиг, зохиолч, нүүр зураг, бүлгүүдтэй нь нээнэ.\n\nТэдгээрийг номын сангийн хавтаст хийнэ үү; номын санд харагдаж, бусад номын адил нээгдэнэ."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Файлаар хадгалсан вэб хуудсыг нээж, зөвхөн унших хэсгийг харуулна.
format-html.plugin.how = "Файлаар хадгалсан вэб хуудсыг (.html, .htm, .xhtml) ном шиг нээнэ: зөвхөн унших зүйлийг, эргэн тойрны цэс, зар сурталчилгаа зэрэггүйгээр.\n\nФайлыг номын сангийн хавтаст хийгээд номын сангаас бусад номын адил нээнэ үү. Хуудас доторх холбоосууд ажиллана; зургууд файл дахь байрандаа харагдана."
format-html.title = Вэб хуудас (HTML)
format-images.plugin.name = Зургууд
format-images.plugin.description = Зургийг (.jpg, .png, .gif) ном шиг нээнэ, зураг бүр нэг хуудас.
format-images.plugin.how = "Зургууд (.jpg, .png, .gif) номын сангаас ном шиг нээгдэнэ: хуудас бүрт нэг зураг, дэлгэцэнд тааруулсан.\n\nБүхэл хавтас зургийг унших бол эхний зургийг нь нээнэ үү: хавтсанд түүний дараах зургууд нэрийн дарааллаар (2 нь 10-аас өмнө) үргэлжилнэ. Хавтасны дунд байгаа зургийг нээвэл тэндээс эхэлнэ; байрлалыг тус бүрд нь тусад нь санана. Нээсэн зургаас эхлэн хавтасны 300 хүртэлх зургийг уншина.\n\nЗураг биш эсвэл хэт том файлын оронд нэр нь харагдана. Өөрийн гарчигтай олон зурагтай номд комиксийн архив (.cbz) илүү тохиромжтой."
format-images.title = Зураг
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown файлыг (.md), жишээ нь тэмдэглэлийг нээнэ.
format-markdown.plugin.how = "Markdown файлыг (.md), жишээ нь тэмдэглэлийг ном шиг нээнэ: хэсгийн гарчиг, жагсаалт, ишлэл, тодруулгыг тэмдэгт хэлбэрээр биш, зориулалтынх нь дагуу харуулна.\n\nФайлуудыг номын сангийн хавтаст хийгээд номын сангаас нээнэ үү. Эхний хэсгийн гарчиг нь номын гарчиг болно; файлын хажууд байгаа зургууд текстэд дурдсан газарт харагдана."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI ном
format-mobi.plugin.description = DRM-гүй .mobi, .azw файлыг нээнэ.
format-mobi.plugin.how = "MOBI ном (.mobi, .azw) номын сангаас бусад номын адил, ямар нэг тохиргоогүйгээр нээгдэнэ. Гарчиг, зохиолч, хэл, нүүр зураг номоос авагдаж, агуулгыг хэсгийн гарчгуудаас нь үүсгэнэ.\n\nНомыг анх нээх үед хөрвүүлдэг бөгөөд урт номд хэдэн секунд зарцуулна; дараа нь шууд нээгдэнэ. Текст, хэсгийн гарчиг, тод ба налуу бичвэр, холбоос, зураг харагдана.\n\nDRM-тэй ном (дэлгүүрээс худалдаж авсан ихэнх ном), мөн Huffman шахалттай эсвэл шинэ KF8 хэлбэрийн (.azw3) номыг нээх боломжгүй: нээх үед PaperPaw үүнийг хэлнэ. Calibre зэрэг хэрэгслээр хийсэн EPUB хуулбар үргэлж нээгдэнэ."
format-mobi.title = MOBI ном
format-rtf.plugin.name = RTF баримт бичиг
format-rtf.plugin.description = .rtf файлуудыг ном болгон нээнэ.
format-rtf.title = RTF баримт бичиг
format-txt.plugin.name = Энгийн текст
format-txt.plugin.description = Энгийн текст файл (.txt) нээнэ.
format-txt.plugin.how = "Энгийн текст файл (.txt) бусад номын адил номын сангаас нээгдэх бөгөөд юу ч тохируулах шаардлагагүй. Плагин UTF-8, UTF-16 болон Windows-1252 текстийг уншиж, кодчиллыг өөрөө тодорхойлно.\n\nДогол мөрүүд файл дахь хоосон мөрөөр хуваагдана; хоосон мөр огт байхгүй бол мөр бүр тусдаа догол мөр болно. Project Gutenberg-ийн файлуудад эхэн ба төгсгөл дэх лицензийн текстийг алгасаж, гарчиг ба зохиогчийг толгой хэсгээс нь авна.\n\nФайлыг хэзээ ч бүхэлд нь ачаалдаггүй тул маш том текст ч жижиг төхөөрөмж дээр нээгдэнэ."
format-txt.title = Энгийн текст
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Xteink уншигчдад зориулж урьдчилан зурсан хуудастай XTC, XTCH номыг нээнэ.
format-xtc.plugin.how = "XTC ба XTCH файл бол Xteink уншигчдад зориулсан хөрвүүлэгчээр хийсэн, хуудсууд нь аль хэдийн зураг болсон ном юм. Тэдгээр нь бусад номын адил номын сангаас нээгдэнэ.\n\nХуудас бүр тогтмол зураг тул текстийн хэмжээг өөрчлөх, өөр фонтоор харуулах боломжгүй. Хуудсууд хар цагаан эсвэл саарлын дөрвөн өнгөтэй. Хуудас бүрийг харуулах үед нь задалдаг тул X4 дээр ч бага санах ой хэрэглэнэ.\n\nГарчиг, зохиогч, бүлгүүд файлд байвал түүнээс авна."
format-xtc.title = XTC хуудас
gloss.plugin.name = Үгийн тайлбар
gloss.plugin.description = Үгийн дээрх жижиг текст: үгийн жагсаалтаас авсан дуудлага эсвэл товч орчуулга.
gloss.plugin.how = "Үгийн тайлбар нь номын үгсийн дээр жижиг текст бичнэ: үгийг хэрхэн уншдаг (фуригана, пиньинь, дуудлага) эсвэл нэг хоёр үгээр юу гэсэн утгатайг. Энэ нь хэл сурахад зориулагдсан. Үгийн жагсаалт өгөх хүртэл юу ч хийхгүй.\n\nЖагсаалтыг энгийн текст файл (UTF-8) болгон карт дээрх .paperpaw/plugins/gloss/ хавтсанд хийнэ үү. Мөр бүрт: үг, таб, жижиг текст. # тэмдгээр эхэлсэн мөрийг тооцохгүй. Жишээ нь:\n\nHaus<tab>house\nwell-known<tab>bekannt\nHund<tab>dog\n\nЗөвхөн нэг номд хэрэглэх бол файлыг өргөтгөлгүй номын нэрээр (faust.epub: faust.txt), тухайн хэлний бүх номд хэрэглэх бол номын хэлээр (de.txt, ja.txt) нэрлэнэ үү. Номын өөрийн файл давуу эрхтэй. Үгийг том жижиг үсгээс үл хамааран, зөвхөн бүтэн үгээр олно; япон, хятад хэлэнд жагсаалтын хамгийн урт хэллэгийг авна. Хоёр удаа орсон үгийн эхний мөрийг авна.\n\nЖагсаалтаас хамгийн ихдээ 2,048 үг, үг тус бүрд 96 байт, нийтдээ 24 КБ жижиг текст ашиглана; түүнээс урт мөрийг алгасна. Жагсаалтыг номыг нээх үед нэг удаа уншдаг тул хуудас эргүүлэхэд юу ч уншихгүй. Жагсаалтыг өөрчилсний дараа номыг дахин нээнэ үү.\n\nТохиргоо, Унших хэсгийн Унших туслах бүлэгт: Жижиг текстийн хэмжээ (жижиг, дунд, том). Мөрүүдийн дээр жижиг текстэд хэрэгтэй зай гарна. Догол мөр бүр эхний 60 орчим үгийнхээ жижиг текстийг харуулна. Номын файл өөрөө өөрчлөгдөхгүй."
