dictionary.plugin.name = Толь бичиг
dictionary.plugin.description = StarDict толь бичгүүдээс үг хайна.
dictionary.plugin.how = "Толь бичиг нь номын үгийг StarDict толь бичгүүдээс хайж, тайлбарыг дэлгэцийн доод хэсгийг бүрхэх самбарт харуулна.\n\nУншигч дотор үгийг дарж байгаад «Хайж харах» сонгоно уу; товчоор бол «Бусад» доторх «Текст сонгох» мөрийг ашиглана. Толь бичгийн хавтсуудыг (.ifo, .idx, .dict файлтай) төхөөрөмжийн \"dictionaries\" хавтсанд хуулна уу, дэд хавтас ч болно; эсвэл Тохиргоо › Унших хэсгийн «Толь бичгийн хавтас» (нарийвчилсан тохиргоо) мөрөнд өөр хавтас сонгоно. Анхны хайлтаар толь бичиг бүрт жижиг индекс бэлтгэдэг тул түр хугацаа шаардана.\n\nСамбарт хуудас эргүүлэх товч эсвэл «Дээш», «Доош» урт тайлбарыг гүйлгэж, «Буцах» хаана. Мэдрэгчээр самбараас гадна товшиж хаана."
