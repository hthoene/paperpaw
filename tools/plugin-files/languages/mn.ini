lock.plugin.name = Дэлгэцийн түгжээ
lock.plugin.description = Төхөөрөмж сэрэхэд PIN, хээ эсвэл нууц үг; уншиж байхад мэдрэгчийг түгжинэ.
lock.plugin.how = "Дэлгэцийн түгжээ нь PaperPaw асах болон төхөөрөмж сэрэх үед PIN, хээ эсвэл нууц үг асууна. Анх унтраалттай байдаг. Энэ нь зөвхөн санамсаргүй хэрэглээнээс хамгаална: код болон буруу оролдлогын тоо SD карт дээр хадгалагддаг тул картыг гаргаж, засаж эсвэл сольсон хэн ч түгжээг давж чадна.\n\nТохиргооны «Төхөөрөмж» › «Дэлгэцийн түгжээ» хэсэгт тохируулна: одоогийн код байвал оруулж, төрлийг сонгоод, шинэ кодыг хоёр удаа оруулна. Хээ зөвхөн мэдрэгчтэй дэлгэцэд байна.\n\nТав удаа буруу оролдсоны дараа дараагийн оролдлого хагас минут хүлээнэ. «Одоо түгжих» шууд түгжих бөгөөд үүнийг товч, зангаа эсвэл дүрэмд оноож болно. «Сэрэхэд түгжих» тохиргоог унтрааж болно; тэгвэл зөвхөн жинхэнэ асалт (асаах эсвэл дахин асаах) түгжинэ. Харин батарейгаар ажиллаж буй X4 шиг сэрэх бүр нь асалт болдог төхөөрөмж үл хамаарна.\n\nҮүний хажууд мэдрэгчийн түгжээ бий: шуурхай самбар болон уншлагын цэсэн дэх «Мэдрэгчийг түгжих» нь товчнуудыг ажиллуулсаар, товших, шудрах, үзгийг идэвхгүй болгоно. Жишээ нь гараа дэлгэцэн дээр тавьж уншихад тохиромжтой. Тайлахын тулд нэг хуруугаар хоёр товшоод, хурууг түр дарж байна уу. Асаах товчийг дарж байхад «Эрчим хүч» цэс нээгдэх бөгөөд тэнд «Мэдрэгчийн түгжээг тайлах» мөрөөр товчоор тайлна. X4 Pro дээр нүүр товчийг дарж байхад шууд тайлна."
