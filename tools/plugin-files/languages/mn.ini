news.plugin.name = Мэдээ
news.plugin.description = Мэдээний сувгуудыг (RSS, Atom) унших ном болгон татна.
news.plugin.how = "«Мэдээ» нь RSS эсвэл Atom сувгуудыг ном болгоно. Суваг бүр номын сангийн News хавтсанд нэг ном болж, хамгийн сүүлийн нийтлэлүүдээ энгийн текстээр агуулах бөгөөд бусад ном шиг уншина.\n\n«Хэрэгслүүд» цэснээс «Мэдээ» хэсгийг нээгээд «Суваг нэмэх» мөрийг сонгоно уу; хаяг нь сонин эсвэл блогийн вэбсайт дээр байдаг. «Мэдээ татах» бүх сувгийг татаж, өмнөх номуудыг солино. Сувгийг дангаар нь татах эсвэл хасахын тулд түүнийг дарж байна уу (товчоор: «Сонгох» товчийг дарж байна). Хассан сувгийн ном номын санд үлдэнэ.\n\nТатахад сүлжээ хэрэгтэй. «Суваг бүрийн нийтлэл» (Тохиргоо › Номын сан) ном бүрт хэдэн нийтлэл байхыг тогтооно. «Мэдээний гарчиг» виджет тэдгээрийг нүүр дэлгэц дээр харуулна."
