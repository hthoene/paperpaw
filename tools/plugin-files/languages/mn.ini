update.dual-boot.help = PaperPaw энэ төхөөрөмжийг өөр програм хангамжтай хуваан ашигладаг тул энд шинэчлэлт суулгадаггүй. PaperPaw-г суулгахдаа ашигласан хэрэгслээрээ шинэчилнэ үү. Энэ төхөөрөмжид хоёр дахь програм хангамж байхгүй юу? Доорх товчоор мэдэгдэх эсвэл paperpaw.org/flash хаягаар орж PaperPaw-г USB-ээр дахин суулгана уу.
