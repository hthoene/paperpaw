mail.plugin.name = Имэйл
mail.plugin.description = Нууц үг эсвэл аппын нууц үгээр (IMAP, SMTP) имэйл уншиж, илгээнэ; хөтчөөр нэвтрэх шаардлагагүй.
mail.plugin.how = "«Имэйл» нь IMAP, SMTP-ээр имэйл уншиж, илгээнэ. Хөтчөөр бус, хаяг ба нууц үгээр нэвтэрдэг тул үүнийг зөвшөөрдөг ямар ч үйлчилгээ үзүүлэгчтэй ажиллана.\n\nБүртгэлээ Тохиргоо › Имэйл хэсэгт тохируулна: үйлчилгээ үзүүлэгчээ сонгоод, хаяг, нууц үгээ бичнэ үү. Ихэнх нь аппын нууц үг шаарддаг: бүртгэлийнхээ аюулгүй байдлын тохиргоонд үүсгээд энд ашиглана уу. Энгийн нууц үг тань ихэвчлэн ажилладаггүй бөгөөд үйлчилгээ үзүүлэгчийн серверээс өөр хаашаа ч очихгүй. Нууц үг, түлхүүрүүдийн хамт хадгалагдана.\n\n«Имэйл»-ийг хэрэгслүүдээс нээнэ. «Имэйл шалгах» сүүлийн имэйлүүд, хавтсуудыг татна. Имэйлүүд карт дээр хадгалагдах тул сүлжээгүй уншиж болно. Төхөөрөмж холбогдож, татаад салдаг тул Wi-Fi хэдхэн хором л асна.\n\nҮйлчилгээ үзүүлэгч тань жагсаалтад байхгүй бол «Өөрийн сервер» сонголтыг сонгож, нарийвчилсан тохиргоонд серверийн нэр, порт, хамгаалалтыг оруулна уу. Гэрчилгээг нь итгэмжлэгдсэн байгууллага баталгаажуулаагүй сервер итгэх эсэхийг нэг удаа асууна; хурууны хээг үйлчилгээ үзүүлэгчийн өгсөнтэй харьцуулна уу.\n\nНом хавсаргасан (EPUB, PDF гэх мэт, 2 МБ хүртэл) имэйлийн доор «Ном нээх» байна: файлыг татаж, номын санд хийгээд нээнэ.\n\nИмэйлийг нээлгүйгээр шинэ имэйл харахын тулд Тохиргоо › Имэйл хэсэгт «Шинэ имэйлийг арын горимд шалгах» тохиргоог асааж, давтамжийг (15, 30 эсвэл 60 минут тутам) сонгоно уу. Анх унтраалттай. Асаасны дараа уншигч сэрүүн, онлайн байх үедээ аюулгүй холболтоор үе үе бүртгэл бүрийг ээлжлэн шалгаж, нүүр дэлгэц дээрх уншаагүй имэйлийн тоог шинэчилнэ. Бага зэрэг батарей зарцуулна. Имэйлийг нээхэд явагдаж буй шалгалт зогсоно.\n\nНүүр дэлгэцийн виджетүүд уншаагүй имэйлийн тоо, сүүлийн болон одтой имэйлүүд, нэг шуудангийн хайрцаг, имэйл бичих товчлолыг харуулна."
