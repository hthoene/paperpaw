stats.plugin.description = Хэр удаан, хэр их уншсаныг бүртгэж, хуанли болон ном бүрийн тоон үзүүлэлтийг харуулна.
stats.plugin.how = "Уншлагын статистик нь хуудас бүрийг хэр удаан уншсаныг бүртгэнэ. Үүнийг өнөөдөр, долоо хоног, тасралтгүй уншсан өдрүүдийн тойм, хуанли, мөн ном бүрийн тоон үзүүлэлтээр харна.\n\nХэрэгслүүдээс, эсвэл уншигчийн «Бусад» цэснээс нээнэ. Тохиргооны Уншлагын статистик хэсэгт «Уншлага бүртгэх» тохиргоог унтрааж, «Өдрийн зорилго» тавьж, тооцогдох «Хамгийн богино хуудас», «Хамгийн урт хуудас» тохиргоог хийж болно. Ингэснээр хуудас гүйлгэх эсвэл нээлттэй орхисон ном тоон үзүүлэлтийг гажуудуулахгүй.\n\n«KOReader-тэй синк хийх» нь WebDAV хавтсаар дамжуулан KOReader-тэй статистикаа хуваалцана. Мөн энэ төхөөрөмж дээрх KOReader-ийн статистикийг шилжүүлж авна. Бүртгэхэд цаг тохируулсан байх шаардлагатай: тохируулаагүй бол Wi-Fi-д нэг удаа холбогдоно уу."
