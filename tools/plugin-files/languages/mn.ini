widgets.plugin.name = Виджетийн багц
widgets.plugin.description = Нүүр дэлгэцийн олон нэмэлт виджет: цаг, хуанли, ишлэл, ном, тэмдэглэл гэх мэт.
widgets.plugin.how = "Виджетийн багц нь нүүр дэлгэцэд олон виджет нэмнэ: цаг (заагууртай, үгэн, хавтан, дэлхийн), хуанли, оны явц, хоног тоолох, сарны үе, өдөр ба огноо; өдрийн ишлэл, тэмдэглэл, хийх ажил, зураг, мэндчилгээ, PaperPaw лого; номын хувьд одоо уншиж буй ном, явц, дараагийн ном, цуврал, дуртай номууд, тодотгол, тоогоор номын сан. Батарейн виджет ч бас багтсан.\n\nЦэсний «Нүүр дэлгэцийг засах» (эсвэл нүүр дэлгэц дээр удаан дарах), дараа нь «Виджет нэмэх»-ээр нэмнэ. Виджет бүр хүрээ, хэмжээ, жигдрүүлэлт зэрэг өөрийн тохиргоотой. Өдрийн ишлэл мэт солигддог виджетийг сонговол дараагийнх нь гарна. Өөрийн ишлэлүүдийг картын .paperpaw/plugins/widgets хавтас дахь quotes.txt файлд мөр бүрт текст | зохиогч хэлбэрээр бичнэ. Цагийн виджетүүдэд цаг тохируулсан байх хэрэгтэй; Wi-Fi түүнийг тохируулна."
