wifi.plugin.name = Wi-Fi
wifi.plugin.description = Шаардлагатай үед Wi-Fi сүлжээнд холбогдож, дараа нь радиог унтраана.
wifi.plugin.how = "Плагинд интернэт хэрэгтэй үед (каталог, синк, дэлгүүр, файл дамжуулалт) Wi-Fi сүлжээнд холбогдоно. Батарей, санах ой хэмнэхийн тулд юу ч ашиглахгүй болсноос нэг минутын дараа, эсвэл нүүр дэлгэц юм уу ном харагдмагц радиог шууд унтраана.\n\nWi-Fi хэсгийг Тохиргоо цэснээс, эсвэл төлөвийн мөрийн Wi-Fi зүйлээс нээнэ. «Сүлжээнүүд» хэсэгт хүрээнд байгаа сүлжээнүүд жагсана: нэгийг сонгоод нууц үгийг нь бичнэ үү. Эсвэл «Утсаар тохируулах» гэснийг сонгоод нэр, нууц үгийг төхөөрөмж дээр биш утасныхаа хөтөч дээр бичнэ үү. «Мартах» нь хадгалсан сүлжээг хасна.\n\nНууц үгс карт дээр аюулгүй хадгалагдах бөгөөд дахин хэзээ ч харагдахгүй. «Шаардлагатай үед холбогдох» хэсэгт Wi-Fi сүүлд ашигласны дараа хэр удаан асаалттай байх, цэнэглэж байхад асаалттай байх эсэх, хэд хэдэн сүлжээ хүрээнд байвал аль хадгалсан сүлжээ түрүүлэхийг тохируулна."
