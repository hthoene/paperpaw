plugin-manager.plugin.name = Upravitelj dodataka
plugin-manager.plugin.description = Navodi dodatke te ih uključuje i isključuje.
plugin-manager.plugin.how = "Upravitelj dodataka navodi svaki dodatak s verzijom i opisom te uključuje i isključuje dodatke.\n\nNalazi se u Postavkama, kao Upravljanje dodacima. Postavke dodataka zasebna je stranica za postavke poput korištenja mreže svakog dodatka. Dodirnite dodatak da ga uključite ili isključite (s tipkama ga odaberite). Promjena vrijedi nakon ponovnog pokretanja: traka pri dnu tada nudi Ponovno pokreni sada. Držite dodatak (s tipkama držite Odaberi) da pročitate kako radi.\n\nDodatak označen Uvijek uključeno ne može se isključiti, a onaj označen Potrebno tek kad drugi dodatak preuzme njegovu zadaću, inače PaperPaw ne bi imao put natrag. Pod Zasloni birate koji dodatak prikazuje mjesto koje nudi više njih."
