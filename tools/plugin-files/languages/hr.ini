profiles.plugin.name = Profili čitanja
profiles.plugin.description = Imenovani skupovi postavki čitanja i prikaza, mijenjaju se dodirom.
profiles.plugin.how = "Profil pod imenom čuva vaše postavke čitanja, postavke prikaza i statusne retke, poput Noć ili Krupan tisak, i vraća ih dodirom.\n\nOtvorite Profile u izborniku čitanja pod Više ili u Postavkama pod Prilagodba. Dodirnite profil da ga koristite; onaj u uporabi je označen. Držite ga (s tipkama držite Odaberi) da u njega spremite trenutačne postavke, preimenujete ga ili uklonite. Spremi kao novi profil čuva ono što je sada postavljeno.\n\nSljedeći profil prelazi na sljedeći na popisu; stavite ga na tipku ili u pravilo."
