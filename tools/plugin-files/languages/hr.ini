menu-editor.plugin.name = Uređivač izbornika
menu-editor.plugin.description = Preslaguje, uklanja i dodaje stavke svakog izbornika.
menu-editor.plugin.how = "Uređivač izbornika mijenja što izbornici sadrže: pomaknite stavke gore ili dolje, uklonite ih ili dodajte nove.\n\nNalazi se u Postavkama pod Prilagodba, kao Prilagodi izbornike. Odaberite izbornik, zatim stavku da je pomaknete ili uklonite; Dodaj stavku umeće novu. Promjene vrijede odmah. Poništi ovaj izbornik vraća izbornik na ono kako ga definiraju njegovi dodaci, Poništi sve izbornike čini to za svaki.\n\nNe možete se zaključati: stavka koja je put do postavki ostaje dok ne dodate drugi put do njih."
