format-cbz.plugin.name = Stripovi
format-cbz.plugin.description = Otvara arhive stripova (.cbz), jedna slika po stranici.
format-cbz.plugin.how = "Otvara arhive stripova (.cbz): jedna slika po stranici, prilagođena zaslonu, redoslijedom njihovih naziva (2 prije 10).\n\nStavite ih u mapu knjižnice i otvorite iz knjižnice; stranice se okreću kao u svakoj knjizi. Velike slike prvi put traju trenutak, na X4 više nego drugdje.\n\nPostavke čitanja (Postavke, Čitanje): „Kadar po kadar“ prikazuje jedan kadar stranice odjednom, onoliko velik koliko zaslon dopušta, a okretanje stranica prolazi kroz njih; stranica bez kadrova prikazuje se cijela. „Smjer čitanja stripa“ zrcali okretanje stranica za mangu (zdesna ulijevo); ComicInfo.xml u samoj knjizi to sam navodi. Knjižnica prikazuje naslov knjige te njezinu seriju i broj iz ComicInfo.xml."
format-cbz.title = Strip (CBZ)
format-cbz.setting.direction = Smjer čitanja stripa
format-cbz.setting.direction.help = Manga: okretanje stranica je zrcaljeno.
format-cbz.direction.book = Kako knjiga kaže
format-cbz.direction.ltr = Slijeva udesno
format-cbz.direction.rtl = Zdesna ulijevo
format-cbz.setting.panels = Kadar po kadar
format-cbz.setting.panels.help = Jedan kadar odjednom, okretanje stranica prolazi kroz njih.
format-docx.plugin.name = DOCX dokumenti
format-docx.plugin.description = Otvara .docx datoteke, kako ih spremaju Word i drugi programi.
format-docx.plugin.how = "Otvara .docx dokumente kao knjige: naslove sa sadržajem, popise, tablice, podebljano i kurziv, poveznice i slike (JPEG, PNG, GIF).\n\nStavite datoteke u mapu knjižnice i otvorite ih iz knjižnice. Naslov i autor preuzimaju se iz svojstava dokumenta. Fusnote, zaglavlja i podnožja te komentari ne prikazuju se."
format-docx.title = DOCX dokument
format-epub.plugin.name = EPUB
format-epub.plugin.description = Otvara EPUB knjige s njihovim stilovima, sadržajem i slikama.
format-epub.plugin.how = "EPUB knjige otvaraju se iz knjižnice kao svaka druga knjiga, sa sadržajem, slikama i izdavačevim oblikovanjem. Web-stranice (HTML), Markdown, FictionBook (.fb2) i arhive stripova (.cbz) otvaraju se na isti način, svaki kao zaseban dodatak.\n\nPoglavlje se pretvara pri prvom otvaranju i sprema u predmemoriju dodatka pa je poslije brže, a velike knjige rade na malim uređajima. Sadržaj pronađite pod Sadržaj u izborniku čitanja. Vrijedi li oblikovanje same knjige, određuje postavka Oblikovanje izdavača, pod Čitanje."
format-epub.title = EPUB e-knjiga
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Otvara FictionBook knjige (.fb2, i zipirane).
format-fb2.plugin.how = "Otvara FictionBook knjige (.fb2), uobičajene za ruske i druge knjige, i zipirane (.fb2.zip), s naslovom, autorima, naslovnicom i poglavljima.\n\nStavite ih u mapu knjižnice; prikazuju se u knjižnici i otvaraju kao svaka druga knjiga."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Otvara web-stranice spremljene kao datoteke i prikazuje samo ono što treba čitati.
format-html.plugin.how = "Otvara web-stranice spremljene kao datoteke (.html, .htm, .xhtml) kao knjige: samo ono što je za čitanje, bez izbornika, oglasa i sličnog oko toga.\n\nStavite datoteku u mapu knjižnice i otvorite je iz knjižnice kao svaku knjigu. Poveznice unutar stranice rade; slike se prikazuju gdje su u datoteci."
format-html.title = Web-stranica (HTML)
format-images.plugin.name = Slike
format-images.plugin.description = Otvara slike (.jpg, .png, .gif) kao knjige, jedna stranica po slici.
format-images.plugin.how = "Slike (.jpg, .png, .gif) otvaraju se iz knjižnice kao knjige, jedna slika po stranici, prilagođena zaslonu.\n\nDa pročitate cijelu mapu slika, otvorite njezinu prvu sliku: slike nakon nje u mapi slijede redoslijedom svojih naziva (2 prije 10). Kasnija slika započinje ondje; mjesto u svakoj pamti se zasebno. Mapa do 300 slika čita se od one koju otvorite.\n\nDatoteka koja nije slika ili je prevelika prikazuje svoj naziv. Za knjigu s mnogo slika s vlastitim naslovom bolji je oblik arhiva stripa (.cbz)."
format-images.title = Slika
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Otvara Markdown datoteke (.md), npr. bilješke.
format-markdown.plugin.how = "Otvara Markdown datoteke (.md), poput bilješki, kao knjige: naslove, popise, citate i isticanje onako kako su zamišljeni, a ne kao znakove.\n\nStavite datoteke u mapu knjižnice i otvorite ih iz knjižnice. Prvi naslov postaje njezin naslov; slike uz datoteku prikazuju se ondje gdje ih tekst navodi."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI knjige
format-mobi.plugin.description = Otvara .mobi i .azw datoteke bez DRM-a.
format-mobi.plugin.how = "MOBI knjige (.mobi, .azw) otvaraju se iz knjižnice kao svaka knjiga, bez ikakvog postavljanja. Naslov, autori, jezik i naslovnica preuzimaju se iz knjige, a popis sadržaja izrađuje se iz njezinih naslova.\n\nKnjiga se pretvara pri prvom otvaranju, što za dugu traje nekoliko sekundi; poslije se otvara odmah. Prikazuju se tekst, naslovi, podebljano i kurziv, poveznice i slike.\n\nKnjige s DRM-om (većina knjiga kupljenih u trgovini) ne mogu se otvoriti, kao ni knjige s Huffmanovom kompresijom ili u novijem obliku KF8 (.azw3): PaperPaw to kaže pri otvaranju. Kopija kao EPUB, napravljena alatom poput Calibrea, uvijek se otvara."
format-mobi.title = MOBI knjige
format-rtf.plugin.name = RTF dokumenti
format-rtf.plugin.description = Otvara .rtf datoteke kao knjige.
format-rtf.title = RTF dokumenti
format-txt.plugin.name = Obični tekst
format-txt.plugin.description = Otvara obične tekstualne datoteke (.txt).
format-txt.plugin.how = "Obične tekstualne datoteke (.txt) otvaraju se iz knjižnice kao svaka knjiga, bez ikakvog postavljanja. Dodatak čita UTF-8, UTF-16 i Windows-1252 tekst i sam prepoznaje kodiranje.\n\nOdlomci slijede prazne retke u datoteci; ako ih datoteka nema, svaki je redak odlomak. U datotekama s Project Gutenberga tekst licencije na početku i na kraju izostavlja se, a naslov i autor preuzimaju se iz zaglavlja.\n\nDatoteka se nikad ne učitava cijela pa se i vrlo veliki tekstovi otvaraju na malim uređajima."
format-txt.title = Obični tekst
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Otvara XTC i XTCH knjige, unaprijed iscrtane stranice Xteink čitača.
format-xtc.plugin.how = "XTC i XTCH datoteke su knjige čije su stranice već iscrtane kao slike, kako ih izrađuju pretvarači za Xteink čitače. Otvaraju se iz knjižnice kao svaka knjiga.\n\nBudući da je svaka stranica fiksna slika, veličina teksta ne može se mijenjati niti se može postaviti drugi font. Stranice su crno-bijele ili imaju četiri sive nijanse. Svaka se stranica dekodira kad se prikaže pa treba malo memorije, i na X4.\n\nNaslov, autor i poglavlja preuzimaju se iz datoteke ako ih ima."
format-xtc.title = XTC stranice
help.plugin.name = Savjeti
help.plugin.description = Pri prvom otvaranju zaslona pokazuje što rade njegove kontrole.
help.plugin.how = "Pri prvom otvaranju zaslona kratka bilješka preko njega kaže što rade njegove kontrole: dijelovi zaslona na koje djeluje dodir, uokvireni, i što rade tipke.\n\nDodir ili bilo koja tipka zatvara bilješku i ona se za taj zaslon više ne vraća. Više ne prikazuj savjete isključuje sve.\n\nU postavkama, pod Sustav, Savjeti ih uključuje ili isključuje, a Ponovno prikaži savjete ponovno prikazuje bilješku svakog zaslona jednom."
