picture-home.plugin.name = Početni zaslon sa slikom
picture-home.plugin.description = Početni zaslon s vašom vlastitom slikom iza widgeta i statusnom trakom koju sami postavljate.
picture-home.plugin.how = "Početni zaslon sa slikom zamjenjuje početni zaslon dok je uključen: vaša vlastita slika iza widgeta te stranice widgeta i alata koje sami slažete. Isključite ga u upravitelju dodataka i ugrađeni početni zaslon se vraća, sa svojim stranicama.\n\nStavite slike (JPEG, PNG ili GIF) u mapu na kartici (zadano wallpapers), zatim odaberite jednu u Postavkama, Prilagodba, Početni zaslon sa slikom. Prilagodba kaže kako ispunjava zaslon (ispuni, cijela slika, razvuci, izvorna veličina, popločaj), Položaj koji dio ostaje, Zoom koliko je velika, a Posvijetli sliku koliko je blijeda: blijeda slika olakšava čitanje widgeta. Slika se priprema jednom za svaku veličinu zaslona, što traje trenutak.\n\nWidgeti stoje na podlogama preko slike. Stranicu složite kao na ugrađenom početnom zaslonu: olovkom ispod stranice ili Uredi početni zaslon u izborniku.\n\nStatusna traka (vrijeme, Wi-Fi, baterija ili što odaberete) može biti uključena, isključena ili automatska, na vrhu ili na dnu, u punoj širini ili kao mala pilula lijevo, u sredini ili desno, na svijetloj, tamnoj ili sivoj podlozi ili izravno na slici. Redak koji imenuje tipke (na X4) također može biti uključen, isključen ili automatski. Automatski znači da ih pritisak tipke prikazuje nekoliko sekundi; taj pritisak ne radi ništa drugo.\n\nPrikaz slike kaže kako se slika crta: Sivi tonovi u svim sivim nijansama koje zaslon ima (sporije na X4), Rasterski u crno-bijelim točkama (brzo) ili Automatski, kao ugrađeni početni zaslon: sivi tonovi pri crtanju zaslona, točke nakon prve promjene. Gdje zaslon nema sivih tonova, sivi tonovi se zamjenjuju točkama."
