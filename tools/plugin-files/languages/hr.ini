dictionary.plugin.name = Rječnik
dictionary.plugin.description = Traži riječi u StarDict rječnicima.
dictionary.plugin.how = "Rječnik traži riječ iz knjige u StarDict rječnicima i prikazuje definicije u ploči preko donjeg dijela zaslona.\n\nU čitaču držite riječ i odaberite Potraži; s tipkama koristite Odaberi tekst pod Više. Kopirajte mape rječnika (s datotekama .ifo, .idx i .dict) u mapu „dictionaries“ na uređaju, uključujući podmape, ili odaberite drugu mapu u Postavkama, pod Čitanje, kao Mapa rječnika (napredna postavka). Prvo traženje priprema mali indeks za svaki rječnik, što traje trenutak.\n\nU ploči tipke za listanje ili Gore i Dolje pomiču duge definicije, a Natrag je zatvara. Na dodirnom zaslonu dodirnite izvan nje da je zatvorite."
