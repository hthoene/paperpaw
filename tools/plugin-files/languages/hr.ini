keyboard.plugin.name = Tipkovnica
keyboard.plugin.description = Unosi tekst na zaslonu, dodirom ili tipkama.
keyboard.plugin.how = "Tipkovnica se otvara kad god nešto treba tekst: pretraga, lozinka, bilješka ili postavka. Radi dodirom i samo s tipkama.\n\nS tipkama Lijevo i Desno kreću se po retku, tipke za listanje između redaka, Odaberi pritišće tipku, a Natrag odustaje; Lijevo i Desno kruže po retku, a Gore i Dolje ostaju u vašem stupcu. Shift čini sljedeće slovo velikim; pritisnite ga dvaput za sva velika slova, a još jednom da prestanu. Držite slovo (s tipkama: držite Odaberi na njemu) za njegovo veliko slovo, odmah odabrano, i naglaske poput é i è; u njemačkom ä, ö, ü i ß tako dolaze od a, o, u i s (s tipkama tipkovnica to kaže na tim slovima). U redu završava; s tipkama držite Natrag da završite odasvud (samo Natrag odustaje) ili držite Odaberi na tipki koja nije slovo. Zalijepi umeće tekst iz međuspremnika, a Telefon, gdje se nudi, omogućuje da umjesto toga tipkate na telefonu.\n\nU postavkama pod Uređaj, Tipkovnica: Rasporedi tipkovnice bira rasporede. Prema zadanim postavkama prati jezik izbornika; s više njih tipka prebacuje između njih. Tipke za umlaute daje zasebne tipke za ä, ö, ü i ß. Veličina povećava tipke i slova; samo s tipkama redovi ostaju oni računalne tipkovnice. Na dodirnim zaslonima Oblik tipki mijenja kako tipke izgledaju. Automatska velika slova počinje svaku rečenicu velikim slovom."
