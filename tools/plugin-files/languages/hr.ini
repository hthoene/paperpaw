settings.plugin.name = Postavke
settings.plugin.description = Stranice postavki, izrađene iz postavki svakog dodatka.
settings.plugin.how = "Postavke prikazuju sve što se može postaviti u PaperPawu i njegovim dodacima, u stranicama. Dodacima ne treba vlastiti zaslon: ono što prijave pojavljuje se ovdje, u grupama, s opisom svake postavke ispod nje.\n\nOtvorite ih pomoću Postavke u izborniku. Dodirnite grupu da je otvorite, zatim postavku da je prebacite ili odaberete; brojevi imaju gumbe − i +. S tipkama dođite do postavke i pritisnite Odaberi: lijevo i desno mijenjaju broj, Odaberi ga zadržava, Natrag vraća raniju vrijednost.\n\nPromjene vrijede odmah. Traži pronalazi postavku po riječima, a Napredne postavke dodaju one koje su rijetko potrebne. Vrati na zadano i Vrati sve na zadano prethodno pitaju."
