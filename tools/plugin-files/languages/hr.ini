koreader.plugin.name = Dijeljenje istaknutog
koreader.plugin.description = Dijeli knjižne oznake i istaknute dijelove s KOReaderom za knjige koje se čitaju u oba.
koreader.plugin.how = "Ovaj dodatak dijeli knjižne oznake i istaknute dijelove s KOReaderom za knjige koje čitate u oba, na jednom uređaju ili u mapi knjižnice sinkroniziranoj među uređajima. Ništa se ne mora postavljati.\n\nKad PaperPaw otvori knjigu koju je otvorio i KOReader te kad promijenite njezine knjižne oznake ili istaknute dijelove, preuzima ono što je novo iz KOReaderovih podataka uz knjigu, a ono što je novo ovdje ostavlja KOReaderu da to preuzme pri sljedećem otvaranju knjige. Uklonjene oznake i promijenjene bilješke također se prenose.\n\nOvo radi samo za EPUB knjige. Ako se datoteka jedne strane ne može pročitati, ništa se ne mijenja ni na jednoj strani dok se ne može."
