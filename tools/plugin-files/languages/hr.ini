mail.plugin.name = E-pošta
mail.plugin.description = Čita i šalje e-poštu s lozinkom ili lozinkom za aplikaciju (IMAP i SMTP), bez prijave u pregledniku.
mail.plugin.how = "E-pošta čita i šalje poruke putem IMAP-a i SMTP-a. Prijavljuje se vašom adresom i lozinkom, bez prijave u pregledniku, pa radi sa svakim davateljem koji to dopušta.\n\nRačun postavite pod Postavke, E-pošta. Odaberite svog davatelja, upišite adresu i lozinku. Većina davatelja traži lozinku za aplikaciju: izradite je u sigurnosnim postavkama svog računa i koristite je ovdje. Vaša uobičajena lozinka često ne radi i nikamo ne ide osim na poslužitelj vašeg davatelja. Sprema se uz lozinke i ključeve.\n\nOtvorite E-poštu u alatima. Provjeri poštu dohvaća najnovije poruke i mape. Poruke ostaju na kartici pa ih možete čitati bez mreže. Uređaj se povezuje, dohvaća i odspaja, tako da je Wi-Fi uključen samo na trenutak.\n\nAko vašeg davatelja nema na popisu, odaberite Vlastiti poslužitelji i postavite nazive poslužitelja, portove i sigurnost pod naprednim postavkama. Poslužitelj za čiju potvrdu ne jamči nijedno tijelo jednom pita vjerujete li mu; usporedite otisak s onim što prikazuje vaš davatelj.\n\nPoruka s priloženom knjigom (EPUB, PDF i slično, do 2 MB) ima ispod sebe Otvori knjigu: dohvaća datoteku, stavlja je u vašu knjižnicu i otvara je.\n\nDa biste vidjeli nove poruke bez otvaranja E-pošte, uključite Provjeravaj novu poštu u pozadini pod Postavke, E-pošta i odaberite koliko često (svakih 15, 30 ili 60 minuta). Isključeno je dok ga ne uključite. Čitač se tada povremeno povezuje sigurnom vezom dok je budan i na mreži, jedan račun za drugim, i ažurira broj nepročitanih na Početnom zaslonu. Troši nešto baterije. Otvaranje E-pošte zaustavlja provjeru koja je u tijeku.\n\nWidgeti početnog zaslona prikazuju broj nepročitanih, najnovije i označene poruke, jedan poštanski sandučić i prečac za pisanje poruke."
