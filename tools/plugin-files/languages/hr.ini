anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Uči kartice iz Ankija na vašem računalu koje su na redu i šalje vaše odgovore natrag, putem dodatka AnkiConnect.
anki.plugin.how = "Anki vam omogućuje da na čitaču učite kartice koje su na redu u Ankiju na vašem računalu i šalje vaše odgovore natrag. Koristi besplatan dodatak AnkiConnect (kod dodatka 2055492159) i nikad AnkiWeb. Isprva je isključen: dodajte ga iz trgovine dodataka.\n\nNa računalu: instalirajte AnkiConnect u Anki (Alati, Dodaci, Dohvati dodatke) i ponovno pokrenite Anki. Anki mora biti otvoren dok sinkronizirate.\n\nAnkiConnect prema zadanim postavkama odgovara samo računalu na kojem radi (127.0.0.1), pa ga čitač ne može dosegnuti. Otvorite Alati, Dodaci, AnkiConnect, Konfiguracija i postavite „webBindAddress“ na „0.0.0.0“ (slušanje na kućnoj mreži). Port, „webBindPort“, je 8765 osim ako ga promijenite. Ako ondje postavite „apiKey“, ovdje unesite isti ključ. Nakon promjene konfiguracije ponovno pokrenite Anki i dopustite Anki u vatrozidu računala ako to zatraži. Koristite ovo samo na mreži kojoj vjerujete: svatko na njoj može doći do AnkiConnecta pa je ključ dobra ideja.\n\nNa čitaču: otvorite Anki iz Alata, zatim pod Računalo unesite adresu računala (na primjer 192.168.1.20), port ako nije 8765 i API ključ ako ste ga postavili. Odaberite Špil ili ga ostavite praznim za sve špilove. Zatim odaberite Sinkroniziraj s Ankijem, uz uključen Wi-Fi: najprije se šalju vaši odgovori na čekanju, zatim se dohvaćaju kartice koje su na redu (i broj novih kartica koji ste postavili), najviše 50. Odaberite Uči da ih prođete, bez mreže: prikažite odgovor i ocijenite ga s Ponovo, Teško, Dobro ili Lako. Vaši odgovori ostaju spremljeni na čitaču, i bez Wi-Fi mreže, i idu u Anki pri sljedećoj sinkronizaciji. Anki odlučuje kada se kartica vraća: kartica na koju ste odgovorili s Ponovo dohvaća se ponovno pri kasnijoj sinkronizaciji kad Anki javi da je na redu.\n\nSinkroniziraj pri otvaranju Ankija, u postavkama, sinkronizira svaki put kad otvorite zaslon. Ništa ne koristi mrežu kad pritisnete tipku."
