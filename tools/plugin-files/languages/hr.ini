translate.plugin.how = "Prijevod prevodi odabrani tekst na mreži pomoću DeepL-a. Odaberite tekst u knjizi i odaberite Prevedi u izborniku odabranog teksta: prijevod se pojavljuje preko stranice kao unos u rječniku. Tipke za listanje ili dodiri pomiču ga, a Odaberi ili dodir na njegovu kraju zatvara ga.\n\nTreba mrežu i vlastiti DeepL API ključ, besplatan na deepl.com (DeepL API Free, oko 500.000 znakova mjesečno). Dok ga ne unesete, ploča to kaže, a dodir ga traži.\n\nU postavkama, pod Čitanje, u odjeljku Prijevod, Prevedi na postavlja jezik; isprva je to jezik PaperPawa."
