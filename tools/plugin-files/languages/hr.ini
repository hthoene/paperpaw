wifi.plugin.name = Wi-Fi
wifi.plugin.description = Povezuje se s Wi-Fi mrežama po potrebi i poslije isključuje bežični modul.
wifi.plugin.how = "Wi-Fi se povezuje s mrežom kad dodatku treba internet (katalog, sinkronizacija, trgovina, prijenos) i ponovno isključuje bežični modul minutu nakon što ga ništa ne koristi, ili odmah kad se prikaže Početna ili knjiga, radi štednje baterije i memorije.\n\nOtvorite Wi-Fi iz Postavki ili preko stavke Wi-Fi u statusnom retku. Mreže navodi one u dometu; odaberite jednu i upišite njezinu lozinku ili odaberite Postavi telefonom i upišite naziv i lozinku u pregledniku telefona umjesto na uređaju. Zaboravi uklanja spremljenu mrežu.\n\nLozinke ostaju na kartici, sigurno pohranjene, i nikad se više ne prikazuju. Pod Poveži po potrebi određujete koliko dugo Wi-Fi ostaje uključen nakon zadnje uporabe, ostaje li uključen tijekom punjenja i koja spremljena mreža ima prednost kad ih je više u dometu."
