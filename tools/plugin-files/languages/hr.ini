battery.plugin.name = Potrošnja baterije
battery.plugin.description = Bilježi bateriju i pokazuje koliko dugo traje.
battery.plugin.how = "Potrošnja baterije bilježi napunjenost otprilike jednom u minuti dok je uređaj aktivan, zajedno s onim što je radio: osvježavanja zaslona i okrenute stranice. Iz toga izračunava koliko troši sat aktivnosti i 100 stranica te koliko dugo baterija traje takvim tempom.\n\nOtvorite Bateriju iz izbornika Alati. Prikazuje trenutačnu napunjenost, ovo razdoblje aktivnosti, dosadašnju potrošnju na bateriji i vaša nedavna razdoblja aktivnosti. Listati se može tipkama za listanje ili dodirom na strelice na vrhu.\n\nTreba malo čitanja na bateriji da brojke išta znače. Bilježenje je prema zadanim postavkama uključeno i može se isključiti u Postavkama, pod Uređaj, Napajanje, kao Bilježi potrošnju baterije."
