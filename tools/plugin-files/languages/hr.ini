keys.plugin.name = Tipke i geste
keys.plugin.description = Što radi svaka tipka, zona dodira i povlačenje, mijenja se na uređaju.
keys.plugin.how = "Tipke i geste pokazuje što radi svaka tipka, zona dodira i povlačenje te omogućuje da to promijenite na uređaju.\n\nOtvorite ga u postavkama, pod Uređaj. Najprije odaberite gdje se promjena primjenjuje: Svugdje, Tijekom čitanja, Na početnom zaslonu, U knjižnici ili u jednom alatu. Zatim odaberite unos, poput držane tipke ili povlačenja s ruba, i radnju s popisa, koji možete pretraživati. Kao standardno vraća ono što postavljaju dodaci i raspored tipki.\n\nNa X4 se odbija promjena nakon koje ne bi ostala nijedna tipka za odabir, povratak ili nastavak. Poništi tipke i geste na kraju poništava svaku promjenu."
