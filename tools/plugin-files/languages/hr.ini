pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Mjerač fokusa s krugovima rada i pauze, widgetima i dnevnim brojačem.
pomodoro.plugin.how = "Pomodoro mjerač: radite u fokusiranim krugovima, zatim se odmorite. Ne treba postavljanje: 25 minuta fokusa, 5 odmora, a nakon četiri kruga duga pauza od 15.\n\nOtvorite Pomodoro iz izbornika alata i pritisnite Start ili dodajte njegove widgete na početni zaslon (držite početni zaslon, zatim dodajte widget): Pomodoro mjerač prikazuje fazu i preostale minute, Pomodoro start/pauza je gumb, a Pomodoro danas broji završene krugove, s vašim dnevnim ciljem. Dodir na mjerač pokreće ga ili pauzira; držite ga da otvorite cijeli zaslon.\n\nMjerač nastavlja raditi kad napustite zaslon i nakon ponovnog pokretanja nastavlja prema satu. Dok čitač spava, ništa ne radi: faza koja je u međuvremenu završila javlja se pri buđenju. Obavijest vam kaže kad je faza gotova. Radi štednje baterije sat se ažurira jednom u minuti (svakih deset sekundi u zadnjoj minuti na cijelom zaslonu) i nikad ne drži čitač budnim.\n\nPod Pomodoro u postavkama određujete duljine i krugove jednog niza te počinje li sljedeća faza sama. Pod Više: bljesak zaslona ili treperenje prednjeg svjetla kad faza završi te dnevni cilj."
