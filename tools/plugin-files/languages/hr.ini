widgets.plugin.name = Paket widgeta
widgets.plugin.description = Mnogo više widgeta za početni zaslon: satovi, kalendar, citati, knjige, bilješke i više.
widgets.plugin.how = "Paket widgeta dodaje mnogo widgeta za početni zaslon: satove (analogni, riječni, pločice, svjetski), kalendar, godinu do sada, odbrojavanje, mjesečevu mijenu te dan i datum; citat dana, bilješke, obveze, slike, pozdrav i PaperPaw logotip; a za knjige trenutačno čitano, napredak, sljedeće na redu, seriju, favorite, istaknuti dio i knjižnicu u brojkama. U njemu je i widget baterije.\n\nDodajte ih pomoću Uredi početni zaslon u izborniku (ili dugim pritiskom na početni zaslon), zatim Dodaj widget. Svaki ima vlastite postavke, poput okvira, veličine i poravnanja. Odabir widgeta koji se mijenja, poput citata dana, prikazuje sljedeći. Vlastiti citati idu u quotes.txt u .paperpaw/plugins/widgets na kartici, svaki redak kao tekst | autor. Widgeti vremena trebaju postavljen sat; Wi-Fi ga postavlja."
