home.plugin.name = Početni zaslon
home.plugin.description = Početna stranica: stranice s widgetima, poput knjige koja se čita i alata.
home.plugin.how = "Početni zaslon sastoji se od stranica, svaka je mreža widgeta i alata kao na telefonu. Isprva su sat, knjiga koju čitate i nedavno čitane knjige na jednoj stranici, a svi alati na sljedećoj.\n\nDodirnite stavku da je otvorite te povucite ili koristite tipke za listanje za promjenu stranica. Samo s tipkama tipke sa strelicama pomiču se od jedne stavke do sljedeće, a Odaberi je otvara.\n\nZa preuređivanje držite početni zaslon, dodirnite olovku ispod stranice ili odaberite Uredi početni zaslon u izborniku. Povucite stavke da ih premjestite ili dodirnite jednu za njezine opcije, i s tipkama. Ondje je i Dodaj widget. Stupci i Retci nalaze se u postavkama, pod Izgled, u odjeljku Početni zaslon.\n\nNa zaslonu okrenutom na bok početni zaslon prikazuje iste stavke s više stupaca, svaka se stranica popunjava prije sljedeće, a kartice nisu šire od oko 110 mm; ništa što ste uspravno složili ne mijenja se. Složite li ga na boku, taj se raspored zasebno čuva za tu orijentaciju: novi widgeti dodaju se u obje. Poništi položeni raspored pod Dodaj (pri uređivanju) vraća na izvedeni. Uklanjanje widgeta ili alata u jednoj orijentaciji ne uklanja ga iz druge."
