menu.plugin.name = Izbornik
menu.plugin.description = Izbornik pri dnu zaslona, s radnjama i postavkama.
menu.plugin.how = "Izbornik navodi što možete raditi i postaviti. Otvara se pri dnu zaslona, iznad onoga što je otvoreno: tijekom čitanja dodirnite sredinu zaslona ili pritisnite Odaberi. Dodirnite ili odaberite stavku da je izvršite.\n\nPostavke u izborniku prikazuju svoju vrijednost i mijenjaju se na mjestu pa izbornik ostaje otvoren. Stavka s daljnjim stavkama otvara podizbornik.\n\nPovucite prema dolje od gornjeg ruba za brzi pristup: ono što često mijenjate, kao gumbe. Dodirnite gumb da ga prebacite, držite ga za njegove postavke. Samo s tipkama tipke sa strelicama biraju, Odaberi prebacuje, a Natrag zatvara. Pod Izgled, Izbornici prikazuju izbornike kao popis ili kao pločice."
