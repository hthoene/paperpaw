notes-overview.plugin.name = Sve bilješke
notes-overview.plugin.description = Knjižne oznake i istaknuti dijelovi svih knjiga na jednom popisu te izvoz kao My Clippings.txt.
notes-overview.plugin.how = "Sve bilješke navodi svaku knjigu u kojoj ste napravili knjižnu oznaku ili istaknuli dio, s brojem. Otvorite je u Alatima. Odaberite knjigu da vidite njezine bilješke, a bilješku da otvorite knjigu na tom mjestu.\n\nNa kraju popisa Izvezi kao My Clippings.txt upisuje sve bilješke u jednu datoteku, u mapi Exports uz knjižnicu, u obliku koji koristi Kindle (UTF-8). Aplikacije koje čitaju Kindleov My Clippings.txt mogu je pročitati. Bilješka uz istaknuti dio je zaseban unos, kao na Kindleu. Budući da knjiga ovdje nema Kindleove lokacije, „location“ je koliko je bilješka daleko u knjizi, u postocima. Datoteka se svaki put ponovno piše; zamjenjuje prethodnu."
