diagnostics.plugin.name = Dijagnostika
diagnostics.plugin.description = Testni zaslon i vođena provjera svakog dijela uređaja.
diagnostics.plugin.how = "Dijagnostika je testni zaslon za provjeru uređaja: prikazuje svaku razinu sive koju panel može prikazati, četiri okvira za isprobavanje tipki i dodira te brojač stranica s trakom napretka za usporedbu načina osvježavanja.\n\nTestni zaslon nema stavku u izborniku. Početni je zaslon samo dok ga nijedan drugi dodatak ne nudi ili kad ga odaberete pod Zasloni u upravitelju dodataka za mjesto Početni zaslon.\n\nOdaberi označava okvir u fokusu, a tipke sa strelicama kreću se među okvirima; na dodirnom zaslonu dodirnite okvir. Tipke za listanje okreću testne stranice. Držite Odaberi ili držite prst na zaslonu da počnete ispočetka.\n\nProvjera uređaja, pod Alati ondje gdje je PaperPaw firmware uređaja, prolazi kroz svaki dio uređaja stranicu po stranicu: zaslon, tipke, dodir, prednje svjetlo, bateriju, karticu, sat, Wi-Fi, spavanje i memoriju. Svaka stranica završava s Neuspješno, Preskoči i Uspješno, a odabran je odgovor koji sugeriraju njezina mjerenja; dijelovi koje uređaj nema preskaču se. Nakon svakog odgovora upisuje izvješće u .paperpaw/plugins/diagnostics/device-check.txt, za lijepljenje u pull request. Natrag je napušta, a pri sljedećem otvaranju nastavlja ondje gdje je stala. Na uređaju samo s tipkama najprije na stranici tipki odaberite Pokreni; do tada strelice, Odaberi i Natrag rade kao na svakoj stranici."
