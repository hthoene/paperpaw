update.plugin.name = Ažuriranje
update.plugin.description = Instalira ažuriranja firmwarea, s kartice ili preuzeta s interneta.
update.plugin.how = "Ažuriranje instalira novi firmware, na uređajima na kojima je PaperPaw firmware, poput X4. Nalazi se u postavkama, kao Ažuriranje.\n\nTraži na mreži pita poslužitelj ažuriranja za noviji PaperPaw i preuzima ga, što putem Wi-Fi mreže traje nekoliko minuta. Ili kopirajte datoteku ažuriranja (završava na .bin, s paperpaw.org) u mapu updates na kartici, na primjer putem Wi-Fi prijenosa. Instaliraj zatim traje oko minutu i uređaj se ponovno pokreće; knjige, postavke i mjesta čitanja ostaju.\n\nUz uključeno Traži ažuriranja (u postavkama, isprva isključeno) uređaj sam pita otprilike jednom tjedno, samo dok je Wi-Fi svejedno uključen ili se puni. Noviji PaperPaw koji pronađe čeka ovdje; ništa ne prekida vaše čitanje. Pretraga šalje što uređaj pokreće, bez njegova naziva ili broja; radi brojanja uređaja još i jeste li je zatražili te je li to njegova prva pretraga dana, tjedna ili mjeseca.\n\nAko dodaci koje koristite još nemaju verziju za novo izdanje, ažuriranje ih čeka. Starija verzija instalira se samo ako je odaberete.\n\nDrugi firmware, poput CrossPointa, također se instalira odavde: stavite njegovu datoteku (završava na .bin) u mapu updates i otvorite Ažuriranje. PaperPaw provjerava da je to cijeli, neoštećeni firmware za ovaj uređaj, ali ne može reći tko ga je izradio jer nije potpisan. Ipak instaliraj upisuje ga u drugu polovicu flash memorije i uređaj ga pokreće; PaperPaw ostaje u svojoj polovici dok taj firmware ne instalira nešto preko nje. Za povratak na PaperPaw poslije instalirajte njegovu instalacijsku datoteku (paperpaw-<device>-<version>-install.bin) iz izbornika drugog firmwarea, poput CrossPointova ažuriranja firmwarea s SD kartice."
