stats.plugin.name = Statistika čitanja
stats.plugin.description = Bilježi koliko dugo i koliko čitate, s kalendarom i brojkama svake knjige.
stats.plugin.how = "Statistika čitanja bilježi koliko dugo čitate svaku stranicu. Vidite je kao pregled s danas, tjednom i vašim nizom, kao kalendar i s brojkama svake knjige.\n\nOtvorite je iz Alata ili iz Više u čitaču. U postavkama, pod Statistika čitanja, možete isključiti Bilježi čitanje, postaviti Dnevni cilj te postaviti Najkraća stranica i Najdulja stranica koje se računaju, da listanje ili otvorena knjiga ne iskrive brojke.\n\nSinkroniziraj s KOReaderom dijeli statistiku s KOReaderom putem WebDAV mape. Preuzima i statistiku KOReadera na istom uređaju. Za bilježenje sat mora biti postavljen: ako nije, jednom se povežite s Wi-Fi mrežom."
