vocabulary.sd.readme = "Kartice za učenje iz datoteka\n\nStavite ovdje datoteku za svaki špil: Spanish.tsv izrađuje špil Spanish.\nDatoteke: .tsv, .csv ili .txt, spremljene kao UTF-8, ili .apkg: Anki špil, izvezen s označenim Podrži starije verzije Ankija. Prva tri polja njegovih bilješki postaju prednja strana, stražnja strana i primjer; njegov raspored učenja i mediji ne čitaju se, a PaperPaw nikad ne zapisuje Anki datoteku.\n\nJedna kartica u svakom retku: prednja strana, stražnja strana i primjer (neobavezno), razdvojeni tabulatorom, zarezom ili točkom sa zarezom. Prvi redak može imenovati stupce: front, back, example. Primjer:\n\nKatze\tmačka\tDie Katze schläft.\n\nZatim otvorite Kartice za učenje na čitaču, odaberite Kartice s SD kartice i zatim Ažuriraj špilove.\n\nDobro je znati:\n- Špilovi ostaju na čitaču, s onim što ste naučili. Datoteka se čita kad je nova ili promijenjena, a njezine se kartice dodaju špilu ili se ondje mijenjaju.\n- Promijenite stražnju stranu ili primjer kartice u datoteci: kartica se mijenja i zadržava vaš napredak.\n- Promijenite tekst prednje strane kartice: to se računa kao nova kartica, a stara počinje ispočetka. Kartice se prepoznaju po tekstu prednje strane, razmaci i velika slova ne računaju se. Spremite špil u datoteku (Kartice s SD kartice, Spremi špil na karticu) i svaka kartica ima broj u stupcu id: ondje promijenite prednju stranu, prva dva retka datoteke ostavite kakva jesu i kartica zadržava što ste naučili.\n- Spremanje zapisuje kartice špila. Ono što je bilo u datoteci, a nije kartica (redak bez prednje strane), ne čuva se; datoteka koja je ondje bila kopira se u _naziv.bak.tsv.\n- Spremite datoteku kao CSV UTF-8 (ne UTF-16, ne vlastiti format proračunske tablice). Datoteka veća od 4 MiB ili s više od 20.000 redaka ne čita se: podijelite je.\n- Redak koji izbrišete u datoteci ne briše karticu u špilu, osim ako za taj špil uključite Ukloni kartice koje nedostaju. Tada kartica nestaje s onim što ste naučili.\n- Datoteke čiji naziv počinje s _ ne čitaju se.\n"
