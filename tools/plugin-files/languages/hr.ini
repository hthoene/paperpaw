puzzles.plugin.name = Zagonetke
puzzles.plugin.description = Sudoku, križaljke i šahovski zadaci, izvanmrežno, sa zagonetkom dana.
puzzles.plugin.how = "Zagonetke za vlak i čekaonicu, sve izvanmrežno: sudoku, križaljke i šahovski zadaci. Otvorite Zagonetke iz izbornika alata ili dodajte widget Zagonetka dana na početni zaslon (držite početni zaslon, zatim dodajte widget): prikazuje koliko je današnji sudoku riješen, a dodir ga otvara. Sudoku dana isti je cijeli dan.\n\nSudoku: Lijevo i Desno pomiču kursor polje po polje, Gore i Dolje (tipke za listanje) za jedan redak. Odaberi otvara znamenke: odaberite jednu i ponovno Odaberi da je upišete ili Izbriši da ispraznite polje. Držite Odaberi (ili Izbornik) da dođete do gumba ispod ploče: Bilješke pretvara znamenke u olovkom označene bilješke, Provjeri označava pogrešna polja, Poništi vraća zadnji potez, Novo započinje zagonetku odabrane razine (Lako, Srednje, Teško). Svaka zagonetka ima točno jedno rješenje. Igra se čuva kad izađete. Na dodirnom zaslonu dodirnite polje.\n\nKrižaljke: stavite .puz (Across Lite) ili .ipuz datoteke u mapu „puzzles“ na memorijskoj kartici; nijedna nije uključena. Krećite se po mreži, zatim odaberite da tipkovnicom upišete riječ ispod kursora (podcrta ostavlja polje praznim). Gumbi prebacuju vodoravno i okomito, prikazuju popis tragova, provjeravaju slova i otkrivaju riječ. Slova se čuvaju za svaku datoteku. Šifrirane .puz datoteke ne mogu se otvoriti.\n\nŠahovski zadaci: mali skup iz Lichessove baze zadataka (CC0). Lijevo i Desno skaču od figure do figure, odaberite figuru koju želite pomaknuti, zatim Lijevo i Desno kroz polja na koja smije, i ponovno Odaberi. Pogrešan potez se vraća. Savjet označava figuru koja treba igrati, Dalje ide na sljedeći zadatak.\n\nPloča ponovno crta samo polja koja se mijenjaju. Statistika broji zadatke koje ste riješili."
