reading-goal.plugin.name = Cilj čitanja
reading-goal.plugin.description = Minute čitanja dnevno i mačka na početnom zaslonu čije raspoloženje prati današnje čitanje.
reading-goal.plugin.how = "Mačka na vašem početnom zaslonu pokazuje kako ide današnje čitanje: tužna dok još niste čitali, tako-tako nakon malo čitanja, zadovoljna od polovice dnevnog cilja, sretna kad ga postignete.\n\nDodajte widget Mačka za čitanje na početni zaslon (držite početni zaslon, zatim dodajte widget) ili odaberite Današnja mačka za čitanje kao zaslon spavanja. Dodir na mačku otvara dnevni cilj; to je cilj statistike čitanja, koja broji minute koje čitate.\n\nU postavkama, pod Čitanje, Zadovoljna od i Sretna od određuju od kojeg udjela cilja je mačka zadovoljna ili sretna, a Vlastite slike mapu sa slikama (sad, meh, content i happy) koje se prikazuju umjesto mačaka. Slike su PNG ili JPEG datoteke; bez mape prikazuju se mačke."
