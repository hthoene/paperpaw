calibre.plugin.name = Bežična knjižnica
calibre.plugin.description = Prima knjige putem mreže. Radi kao bežični uređaj za Calibre.
calibre.plugin.how = "Bežična knjižnica omogućuje da se uređaj u Calibreu na vašem računalu pojavi kao bežični uređaj. Calibre mu tada može slati knjige, navoditi ih i brisati. Knjige idu u knjižnicu.\n\nOtvorite Bežičnu knjižnicu iz izbornika Alati, s uređajem i računalom u istoj Wi-Fi mreži. U Calibreu odaberite Poveži/podijeli, zatim Pokreni vezu s bežičnim uređajem. Kad uređaj pronađe vaše računalo, prikazuje njegov naziv; dodirnite Poveži (s tipkama pritisnite Odaberi). Calibre ovdje može dodavati i brisati knjige pa se povežite samo sa svojim računalom. Zatvaranje zaslona prekida vezu.\n\nAko se Calibre ne pronađe sam, unesite adresu njegova računala u Postavkama, pod Knjižnica, kao Adresa u dijelu Calibre. Ako Calibre koristi port različit od 9090, dodajte ga kao :port, npr. 192.168.1.20:9091."
