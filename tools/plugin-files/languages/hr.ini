reader.plugin.name = Čitač
reader.plugin.description = Prikazuje knjige stranicu po stranicu, sa sadržajem i postavkama čitanja.
reader.plugin.how = "Čitač prikazuje knjige stranicu po stranicu. Otvorite knjigu iz knjižnice; zadnja knjiga može se ponovno otvoriti pri pokretanju (postavka Otvori zadnju knjigu pri pokretanju).\n\nDodirnite lijevu ili desnu stranu zaslona ili koristite tipke za listanje da okrećete stranice. Dodirnite sredinu ili pritisnite Odaberi za izbornik čitanja: Sadržaj, Traži, Idi na stranicu, Font i raspored, Knjižne oznake i istaknuto i više. Prema dolje od gornjeg ruba otvara brzi pristup, prema gore od donjeg ruba vodi na početni zaslon; tako radi i držanje Natrag.\n\nDržite Odaberi (ili držite sliku) da vidite sliku preko cijelog zaslona: Lijevo i Desno prolaze kroz slike stranice. Odaberi povećava na 2x, 3x i natrag (dvostruki dodir na dodiru); povećano, Lijevo i Desno pomiču u stranu, tipke za listanje (ili povlačenja) idu dalje poprijeko i prema dolje. Natrag vraća na prilagođeni prikaz, zatim na stranicu (na dodiru držite za izlaz). Dodirnite gornji desni kut za knjižnu oznaku. Držite riječ da je istaknete. S tipkama držite Lijevo: Lijevo i Desno pomiču po riječ, tipke za listanje po redak, držanje ide na krajeve stranice i po odlomak; Odaberi otvara traku isticanja za riječ, držanje Odaberi proširuje na rečenicu i odlomak (zatim Lijevo i Desno pomiču kraj, njihovo držanje početak). Odabir se nastavlja preko okretanja stranica. Izvezi kao Markdown sprema vaše bilješke."
