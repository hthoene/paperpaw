aids.plugin.name = Pomoć pri čitanju
aids.plugin.description = Podebljani počeci riječi, zamijenjene riječi, slike: tekst kakav želite.
aids.plugin.how = "Pomoć pri čitanju mijenja kako tekst knjige izgleda dok čitate. Vrijedi za svaku knjigu. Podebljani počeci riječi i Zamijeni riječi isprva su isključeni.\n\nNalazi se u Postavkama, pod Čitanje, u odjeljku Pomoć pri čitanju. Podebljani počeci riječi podebljava prvu polovicu svake riječi, što nekima olakšava praćenje. Zamijeni riječi uzima parove zapisane kao „šta = što; ko = tko“, odvojene točkom sa zarezom.\n\nZamjenjuju se samo cijele riječi, točno onako kako ste ih napisali, pa „ko“ nikad ne mijenja dio dulje riječi. Sama datoteka knjige ne mijenja se.\n\nSlike u knjigama mogu se prikazati (kao isprva), pretvoriti u kratak redak poput „[Slika: brod na moru]“ koji koristi opis slike ili izostaviti. Stranica tada ima više prostora za tekst, a ništa se ne dekodira za sliku koja se ne prikazuje, zbog čega se stranice brže okreću. Stripovi i druge knjige od slika ne mijenjaju se."
