opds.plugin.name = OPDS katalozi
opds.plugin.description = Pregledava OPDS kataloge, preuzima njihove knjige i održava mape usklađenima s njima.
opds.plugin.how = "OPDS katalozi su mrežne knjižnice poput Project Gutenberga, Calibre-Weba, Kavite ili Komge. Ovaj dodatak ih pregledava i pretražuje kao mape i preuzima njihove knjige u knjižnicu.\n\nOtvorite Kataloge iz izbornika Alati i odaberite Dodaj katalog: adresa i, ako katalog treba račun, korisničko ime i lozinka. Dodirnite katalog da ga pregledate; držite ga (s tipkama držite Odaberi) da ga sinkronizirate, uredite ili uklonite.\n\nS uključenim Sinkroniziraj ovaj katalog, Sinkroniziraj kataloge preuzima njegove nove knjige u njegovu mapu. Knjiga po sinkronizaciji ograničava koliko ih jedna sinkronizacija dohvaća da veliki katalog ne napuni uređaj. Mapa u oblaku (WebDAV) radi umjesto kataloga."
