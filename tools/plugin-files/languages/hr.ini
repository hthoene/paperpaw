bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Uparuje daljinske upravljače, tipkovnice i senzore te ih povezuje.
bluetooth.plugin.how = "Bluetooth uparuje daljinske upravljače, tipkovnice i senzore s čitačem, ondje gdje ima Bluetooth (X4 Pro).\n\nDodaj uređaj traži što je u dometu; uređaj prethodno stavite u način uparivanja. Odaberite ga i potvrdite na čitaču (usporedite broj gdje se prikaže). Tipke daljinskog upravljača ili tipkovnice tada listaju i kreću se kroz izbornike; što svaka tipka radi mijenja se pod Upravljanje.\n\nDaljinski upravljači kaže kada im tipke rade: kad su ovdje uključeni, tijekom čitanja (povezani dok je knjiga otvorena, štedi bateriju) ili uvijek. Tipka izbornika ili dugi pritisak na uređaj zaboravlja ga.\n\nSenzor je za dodatke: uključite koji ga dodatak smije koristiti. Bluetooth je isključen kad ga ništa ne koristi."
