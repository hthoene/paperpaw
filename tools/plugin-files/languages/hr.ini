tasks.plugin.name = Zadaci
tasks.plugin.description = Popisi obveza s rokovima i prioritetima, na čitaču ili sinkronizirani s vašim CalDAV poslužiteljem, s widgetima za početni zaslon.
tasks.plugin.how = "Popisi obveza na vašem čitaču: zadaci s rokom i prioritetom, koje označite kad su gotovi. Rade bez postavljanja i bez mreže, a mogu se održavati usklađenima s CalDAV poslužiteljem (Nextcloud, Radicale, Baïkal, Fastmail i drugi) pa su isti popisi i na vašem telefonu i računalu.\n\nOtvorite Zadatke iz izbornika alata. Prvi redak imenuje prikazani popis; odaberite ga za drugi popis, za Danas i zakašnjelo na svim popisima, za novi popis, za sinkronizaciju ili za postavljanje računa. Dodaj zadatak otvara tipkovnicu. Odaberi na zadatku označava ga gotovim (ponovno: nije gotovo). Držite zadatak ili pritisnite Izbornik da promijenite naslov, rok (danas, sutra, za tjedan dana ili datum koji upišete poput 2026-12-24) ili prioritet ili da ga uklonite. Otvoreni zadaci dolaze prvi, po danu pa po prioritetu; gotovi ostaju na kraju tjedan dana (postavlja se pod Zadaci u postavkama), zatim napuštaju čitač.\n\nWidgeti za početni zaslon (držite početni zaslon, zatim dodajte widget): Zadaci danas prikazuje što dospijeva danas ili je zakašnjelo, Popis zadataka prikazuje jedan popis, Otvoreni zadaci ih broji, a Sljedeći zadatak prikazuje onaj koji je sljedeći na redu. Dodir na zadatak u widgetu označava ga gotovim; dodir na naslov otvara popise.\n\nZa sinkronizaciju odaberite CalDAV račun iz retka popisa i unesite adresu poslužitelja, svoje korisničko ime i lozinku (najbolje lozinku za aplikaciju). Dovoljna je adresa poslužitelja, npr. cloud.example.com/remote.php/dav; čitač odande pronalazi vaše popise zadataka. Svaki popis zadataka na poslužitelju postaje popis na čitaču. Čitač sinkronizira kad otvorite Zadatke, kad odaberete Sinkroniziraj sada i kad je mreža svejedno uključena; ono što promijenite bez mreže čeka i šalje se kasnije. Ako je zadatak u međuvremenu promijenjen na čitaču i negdje drugdje, uzima se verzija poslužitelja, a vaša se zadržava kao novi zadatak pored nje pa ništa ne propada. Bilješke, alarmi i sve drugo što zadatak ima na poslužitelju ostaju kakvi jesu. Zadaci koji se ponavljaju prikazuju se, ali se mijenjaju ondje gdje ste ih napravili. Čitač drži do 200 zadataka u 12 popisa."
