lock.plugin.name = Zaključavanje zaslona
lock.plugin.description = PIN, uzorak ili lozinka pri buđenju uređaja; dodir zaključan tijekom čitanja.
lock.plugin.how = "Zaključavanje zaslona traži PIN, uzorak ili lozinku kad se PaperPaw pokrene i kad se uređaj probudi. Isprva je isključeno. Sprječava samo usputnu uporabu: kôd i broj pogrešnih pokušaja spremljeni su na SD kartici pa tko izvadi karticu, uredi je ili zamijeni, zaobilazi zaključavanje.\n\nPostavite ga u postavkama, pod Uređaj, Zaključavanje zaslona: unesite kôd koji je u uporabi ako ga ima, odaberite vrstu, zatim novi kôd dvaput. Uzorak se nudi samo na dodirnim zaslonima.\n\nNakon pet pogrešnih pokušaja sljedeći čeka pola minute. Zaključaj sada zaključava odmah i može se staviti na tipku, gestu ili pravilo. Zaključavanje nakon buđenja može se isključiti pa tada zaključava samo pravo pokretanje (uključivanje ili ponovno pokretanje), osim ondje gdje je svako buđenje pokretanje, kao na X4 na bateriji.\n\nUz to zaključavanje dodira: Zaključaj dodir u brzom pristupu i izborniku čitanja čini da dodiri, povlačenja i olovka ne rade ništa, dok tipke i dalje rade, npr. za čitanje s rukom na zaslonu. Za otključavanje dvaput dodirnite jednim prstom i ostavite ga na trenutak; držanje tipke za uključivanje otvara izbornik napajanja, u kojem Otključaj dodir to obavlja tipkama; na X4 Pro držanje tipke Početna odmah otključava."
