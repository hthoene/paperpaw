transfer.plugin.name = Prijenos
transfer.plugin.description = Stavlja knjige i druge datoteke na uređaj iz preglednika na istoj mreži.
transfer.plugin.how = "Wi-Fi prijenos stavlja knjige i druge datoteke na uređaj iz preglednika na istoj mreži, bez kabela i aplikacije. Možete i preuzimati datoteke, izrađivati mape i brisati.\n\nOtvorite ga iz Alata. Zaslon prikazuje adresu kao tekst i kao QR kôd: otvorite je u pregledniku na telefonu ili računalu ili skenirajte kôd. Adresa sadrži ključ koji se svaki put izrađuje iznova pa drugi na mreži ne mogu doći do vaših datoteka. Prijenos radi dok je zaslon otvoren.\n\nGdje PaperPaw sam upravlja Wi-Fi mrežom, kao na X4, Bez usmjerivača pri dnu otvara vlastitu mrežu uređaja kojoj se telefon pridružuje skeniranjem koda."
