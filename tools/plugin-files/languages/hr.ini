weather.plugin.description = Vrijeme sada i u sljedećim danima kao widgeti, iz Open-Meteoa.
weather.plugin.how = "Vrijeme prikazuje vremensku prognozu za sada i sljedeće dane kao widgete za početni zaslon, iz Open-Meteoa, koji ne treba račun ni ključ. Vrijeme sada prikazuje temperaturu, stanje i više po izboru; Prognoza prikazuje sljedeće dane u nizu ili kao popis.\n\nNajprije odaberite mjesto: u postavkama, pod Vrijeme, Mjesto (upišite naziv, zatim ga odaberite među pronađenim mjestima). Šalju se samo njegove koordinate, i to samo dok je widget vremena prikazan. Widgete dodajte uređivanjem početnog zaslona.\n\nVrijeme se dohvaća najviše onoliko često koliko kaže Ažuriraj najviše svakih i samo dok postoji mreža: nikad sam ne uključuje Wi-Fi.\n\nPodaci o vremenu iz Open-Meteo.com (https://open-meteo.com), pod licencijom Creative Commons Imenovanje 4.0 (CC BY 4.0)."
