store.plugin.name = Trgovina dodataka
store.plugin.description = Pronalazi, instalira, ažurira i uklanja dodatke za ovaj uređaj.
store.plugin.how = "Trgovina dodataka pronalazi dodatke za ovaj uređaj na internetu te ih instalira, ažurira i uklanja. Otvorite je iz Alata; treba Wi-Fi.\n\nPočetak prikazuje što knjižnica preporučuje, što je novo ili trenutačno popularno, zatim grupe. Grupa navodi svoje dodatke u poštenom miješanju koje se mijenja svaki dan da se svaki vidi; sortirajte ih od A do Ž, po najnovijima ili zadnjem ažuriranju, i u dugim popisima skočite na slovo. Otvorite jedan da vidite njegovu stranicu, s veličinom i memorijom koju zauzima, zatim odaberite Instaliraj, Ažuriraj ili Ukloni. Ažuriraj sve dovodi svaki instalirani dodatak na novo.\n\nDodaci s kodom rade s punim pristupom uređaju: trgovina to kaže i prethodno pita, a pokreću se nakon ponovnog pokretanja. Ako jedan pođe po zlu, PaperPaw se pokreće bez dodataka s kodom i kaže koji je. Biblioteka dodataka određuje odakle dolazi popis.\n\nDodaci zajednice, u Postavkama, Sustav, navode i dodatke koje su drugi objavili na GitHubu. Nitko ih nije pregledao: označeni su kao Neprovjereno, stranica dodatka s kodom prikazuje ključ kojim je potpisan, a ažuriranje potpisano drugim ključem ne instalira se.\n\nIzvori, zadnji redak početka, dodaju popise dodataka drugih putem njihove adrese (https://…/plugins.json), navode jedan od njih umjesto PaperPawova ili ga uklanjaju. Umjesto tipkanja, stavite datoteku sources.txt s jednom adresom u svakom retku u .paperpaw/plugins/store na kartici: adrese se pod Izvori prikazuju kao nove. PaperPaw ne provjerava izvor ni njegove dodatke, a uređaj se povezuje s poslužiteljem izvora. Izvor potpisuje svoj popis; uređaj pamti ključ prvog pročitanog popisa i od tada prihvaća samo popise i dodatke s kodom potpisane tim ključem. Dodatak dobiva ažuriranja samo iz izvora iz kojeg je instaliran. PaperPawova vlastita biblioteka uvijek je ondje i ne može se ukloniti; napuštanje trgovine vraća na nju."
