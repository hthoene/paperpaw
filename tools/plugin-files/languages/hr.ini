file-manager.plugin.name = Upravitelj datoteka
file-manager.plugin.description = Svaka mapa i datoteka na uređaju: otvaranje, preimenovanje, premještanje, kopiranje i brisanje.
file-manager.plugin.how = "Upravitelj datoteka prikazuje svaku mapu i datoteku u pohrani uređaja, ne samo vaše knjige, i omogućuje otvaranje, preimenovanje, premještanje, kopiranje i brisanje te izradu novih mapa.\n\nOtvorite Datoteke iz izbornika Alati. Dodirnite mapu da uđete u nju; Natrag vodi u mapu iznad. Dodirnite datoteku ili držite bilo koju stavku (s tipkama držite Odaberi) da vidite što se s njom može učiniti. Premjesti i Kopiraj pamte stavku: idite u mapu u koju pripada i odaberite Zalijepi ovdje u traci pri dnu. S tipkama pritisnite Dolje od zadnje stavke da dođete do trake.\n\nDatoteke i mape koje počinju točkom, poput PaperPawovih vlastitih podataka, skrivene su. Da ih vidite, uključite Skrivene datoteke u Postavkama, pod Knjižnica."
