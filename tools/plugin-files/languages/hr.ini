power.plugin.name = Napajanje
power.plugin.description = Bira način napajanja, ručno ili prema bateriji: Normalno, Štednja, Izvanmrežno.
power.plugin.how = "Napajanje bira kako PaperPaw troši bateriju: Normalno, Štednja ili Izvanmrežno. Štednja radi ono što može pričekati u povoljnijim trenucima; Izvanmrežno drži bežične veze isključenima. Automatski bira prema bateriji.\n\nNačin promijenite u brzom pristupu, gdje Napajanje prikazuje načine jedan pored drugog, ili u Postavkama pod Napajanje. Ondje određujete i razine na kojima Automatski prelazi na Štednju i na Izvanmrežno te ostaje li Normalno tijekom punjenja.\n\nU statusnim retcima Način napajanja prikazuje list pri štednji i prekriženi Wi-Fi pri izvanmrežnom načinu, a u Normalnom ništa.\n\nDržanje tipke za uključivanje otvara mali izbornik: Spavanje, Isključi (gdje PaperPaw može), Ponovno pokreni, a na dodirnim uređajima Zaključaj dodir ili Otključaj dodir. Kratki pritisak i dalje stavlja uređaj na spavanje. Natrag napušta izbornik."
