notes-vault.plugin.name = Trezor bilješki
notes-vault.plugin.description = Čita mapu Markdown bilješki po mapama, oznakama i zadnjim promjenama, s widgetima za početni zaslon. Radi s Obsidian trezorima.
notes-vault.plugin.how = "Trezor bilješki čita mapu Markdown bilješki (obične .md datoteke, kako ih čuvaju aplikacije za bilješke). Radi s Obsidian trezorima.\n\nMapu trezora odaberite u postavkama ili na stranici trezora u alatima. Stranica tada nudi mape kakve jesu na kartici, zadnje promijenjene bilješke, oznake i pretragu u naslovima bilješki.\n\nPrvi put trezor se indeksira u pozadini dok je njegova stranica otvorena; trezor s tisućama bilješki traje nekoliko minuta, zatim se otvara odmah. Indeks se čuva na kartici i ponovno izrađuje kad se stranica trezora otvori nakon nekoliko sati ili kad odaberete Ažuriraj.\n\nBilješka se otvara u čitaču. Poveznice na druge bilješke ([[Bilješka]], [[Bilješka|riječi]], [[Bilješka#Naslov]]) pronalaze se po nazivu bilješke bilo gdje u trezoru; slijeđenje jedne otvara tu bilješku, a Natrag vraća na prethodnu bilješku.\n\nNišta u trezoru se nikad ne mijenja. Widgeti za početni zaslon (nedavne bilješke, prikvačena bilješka, bilješka dana, nasumična bilješka, oznake, pretraga) dodaju se u uređivaču početnog zaslona. Widget može uzimati bilješke samo iz jedne mape: upišite putanju mape od korijena kartice (na primjer Bilješke/Posao) u postavke widgeta; ako ostane prazno, uzima sve bilješke trezora."
