rules.plugin.name = Pravila
rules.plugin.description = Kad se nešto dogodi, nešto učini: npr. noćni način u 22:00.
rules.plugin.how = "Pravilo samo nešto učini kad se nešto dogodi: noćni način uključen svaki dan u 22:00 ili katalozi sinkronizirani kad se PaperPaw pokrene.\n\nPravila su u Postavkama pod Prilagodba, kao Pravila. Dodaj pravilo pita Kada? (PaperPaw se pokrene, doba dana, knjiga se otvori ili zatvori, baterija, punjenje, prekidač i više) i Što zatim? (izvrši radnju, uključi ili isključi prekidač, postavi broj, prikaži poruku). Dodirnite pravilo da ga pauzirate; držite ga (s tipkama držite Odaberi) za uvjet poput Između dva doba dana ili da ga uklonite.\n\nRadnje, prekidači i brojevi za odabir dolaze po dodatku: odaberite dodatak, zatim što donosi; natrag vodi iz njega. Radnja koja djeluje na prikazani zaslon, poput Natrag ili Sljedeća stranica, radi ono što bi radila da je pritisnuta ondje.\n\nVremena vrijede bez obzira na to koji je zaslon otvoren. Dva pravila koja se međusobno poništavaju staju nakon nekoliko koraka."
