about.plugin.name = O aplikaciji
about.plugin.description = Verzija i licencije PaperPawa.
about.plugin.how = "O aplikaciji pokazuje koju verziju PaperPawa imate, gdje je njegov izvorni kod i pod kojim licencijama dolazi.\n\nNalazi se na kraju Postavki, kao O PaperPawu. Redak odaberite tipkama sa strelicama i Odaberi ili ga dodirnite. Navedeni su i dodaci ugrađeni u firmware te, na uređajima koji učitavaju dodatke s kodom, otisak za koji takvi dodaci moraju biti izrađeni.\n\nLicencije se otvaraju kao tekst u čitaču pa listate kao po knjizi. Sadrži PaperPawovu licenciju i licencije fontova, ikona i uzoraka rastavljanja riječi koji dolaze s njim. Dodaci mogu dodati vlastiti redak, primjerice autora teme."
