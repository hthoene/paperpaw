vocabulary.plugin.name = Vokabular
vocabulary.plugin.description = Čuva riječi koje potražite, s njihovim rečenicama, i ponavlja kartice za učenje s razmaknutim ponavljanjem, izrađene na telefonu.
vocabulary.plugin.how = "Vokabular čuva riječi koje potražite tijekom čitanja, svaku s njezinom rečenicom, za kasnije ponavljanje. Popis se nalazi u Alatima, najnovije prvo; odaberite riječ da je ponovno potražite. Zadnji redak, Izvezi, sprema ih za aplikacije s karticama poput Ankija. Popis čuva najnovijih 2.000 riječi: povrh toga najstarije nestaju pa ih prije izvezite da zadržite sve.\n\nKartice za učenje, također u Alatima, ispituju vas razmaknutim ponavljanjem: nakon Prikaži odgovor ocijenite svaku karticu s Ponovo, Teško, Dobro ili Lako, a to određuje kad se vraća. Špilove izradite pomoću Uredi telefonom: skenirajte kôd telefonom na istoj Wi-Fi mreži, zatim tipkajte kartice ili dodajte mnogo odjednom: ondje otvorite špil, odaberite Mnogo kartica odjednom i odaberite CSV, TSV ili TXT datoteku (jedna kartica u svakom retku: prednja strana, stražnja strana, primjer; UTF-8), zalijepite popis ili donesite Anki špil (.apkg, izvezen s Podrži starije verzije Ankija). \n\nIli koristite datoteke na SD kartici: stavite CSV, TSV ili TXT datoteku ili Anki špil (.apkg, izvezen s Podrži starije verzije Ankija) za svaki špil u mapu Flashcards (Spanish.tsv izrađuje špil Spanish; jedna kartica u svakom retku: prednja strana, stražnja strana, primjer; spremljeno kao UTF-8; prvi redak može imenovati stupce front, back, example). Odaberite Kartice s SD kartice u Karticama za učenje ili pustite da se to dogodi kad otvorite Kartice za učenje. Špilovi ostaju na čitaču s onim što ste naučili, a datoteka se uključuje u svoj špil kad god je nova ili promijenjena: promijenite stražnju stranu ili primjer kartice u datoteci i kartica se mijenja i zadržava svoj napredak; promijenite tekst prednje strane i to se računa kao nova kartica, stara počinje ispočetka (kartice se razlikuju po tekstu prednje strane; razmaci i velika slova ne računaju se); redak koji izbrišete ne briše karticu (osim ako za taj špil postavite „kartice koje nedostaju u datoteci“ na Ukloni: tada se kartica pri sljedećem ažuriranju uklanja s napretkom, trajno, a ništa se ne uklanja dok se neki redak datoteke ne može pročitati). Špil spremite u njegovu datoteku pomoću Spremi na karticu: datoteka dobiva brojeve kartica (stupac id) pa možete uređivati prednje strane na računalu, a kartice zadržavaju što ste naučili; datoteka čuva samo id, prednju stranu, stražnju stranu i primjer (ostali stupci, komentari i redoslijed redaka ne čuvaju se), a spremanje se odbija dok se neki redak datoteke nije mogao pročitati; datoteka koja je ondje bila prvi se put kopira u _naziv.bak.tsv (kasnije spremanje ne zamjenjuje tu kopiju). Datoteka veća od 4 MiB ili s više od 20.000 redaka ne čita se, a mora biti spremljena kao CSV UTF-8, a ne UTF-16. Prvi put čitač izrađuje mapu s bilješkom o tome kako radi.\n\nU postavkama, pod Čitanje, Potražene riječi postaju kartice stavlja svaku potraženu riječ u špil Potraženo."
