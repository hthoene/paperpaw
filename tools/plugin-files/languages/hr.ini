setup.plugin.name = Postavljanje
setup.plugin.description = Kratki vodič kroz važne postavke, pri prvom pokretanju.
setup.plugin.how = "Postavljanje je kratki vodič kroz postavke koje su važne, prikazan jednom, pri prvom pokretanju PaperPawa. Svaka stranica pita jednu stvar, poput jezika, tipki, veličine teksta, vremenske zone, Wi-Fi mreže ili nekoliko dodataka za dodavanje, s već odabranim razumnim odgovorom pa je Dalje uvijek ispravno. Koraci koje ovaj uređaj ne treba izostavljaju se.\n\nDodirnite gumbe ili koristite tipke gore i dolje i Odaberi. Preskoči na prvoj stranici odmah napušta postavljanje. Zadnja stranica kaže odakle dolaze vaše knjige.\n\nDa ga pokrenete ponovno, otvorite postavke i odaberite Postavljanje PaperPawa. Sve što se ovdje odabere može se poslije promijeniti u postavkama."
