fonts-browser.plugin.name = Više fontova
fonts-browser.plugin.description = Prikazuje fontove s interneta, svaki s uzorkom, i preuzima ih za čitanje.
fonts-browser.plugin.how = "Više fontova navodi fontove iz biblioteke fontova na internetu, svaki naziv ispisan vlastitim fontom, i preuzima one kojima želite čitati.\n\nNalazi se na kraju popisa fontova ondje gdje se bira font za čitanje, u Postavkama, pod Čitanje, kao Font; statusni retci imaju isti unos za svoj font. Dodirnite font (s tipkama pritisnite Odaberi) da ga vidite veće s primjerom rečenice, zatim odaberite Preuzmi. Stranicu možete napustiti dok se preuzima. Kad završi, odaberite Čitaj fontom (naziv fonta) ili Koristi za statusne retke. Ažuriraj dohvaća noviju verziju, Ukloni briše font s uređaja.\n\nTreba Wi-Fi.\n\nVLASTITI FONTOVI\n\nUz Više fontova isti popis ima Vlastiti fontovi, koji prikazuje ovaj dio pomoći. Vlastiti font je .ttf ili .otf datoteka, na primjer s Google Fontsa.\n\nNa Androidu i drugim uređajima koji crtaju datoteke fontova: kopirajte datoteku u mapu fonts (na Androidu: PaperPaw/fonts u zajedničkoj pohrani), ponovno pokrenite PaperPaw i odaberite font u Postavkama, pod Čitanje, kao Font.\n\nNa Xteink X4 i X4 Pro: ti čitači čitaju pakete fontova, a ne datoteke fontova, jer datoteke fontova ne bi stale u njihovu memoriju. Izradite paket na računalu pomoću paperpaw-fontgen, za svaki stil koji imate (obični je potreban):\n\npaperpaw-fontgen --family \"Moj font\" --regular MojFont-Regular.ttf --bold MojFont-Bold.ttf --italic MojFont-Italic.ttf plugins\n\nOvo izrađuje mapu plugins/font-moj-font. Kopirajte je u mapu plugins na memorijskoj kartici, ponovno pokrenite i odaberite Moj font kao Font. Paket s jednim stilom za latinična slova ima oko pola megabajta; stilovi koje izostavite crtaju se obični. Alat kaže koliko traženih slova font ima (--chars latin,cyrillic,greek dodaje pisma): font bez slova vaše knjige ne može ih prikazati pa potražite onaj koji pokriva njezino pismo.\n\nFontovi iz Više fontova rade na isti način i ne trebaju računalo.\n\nZa oštriji sitni tekst na e-ink panelu dodajte --hinting light naredbi: prilagođava slova mreži piksela, kako su napravljeni zadani fontovi. Bez toga slova se crtaju onako kako ih je font dizajnirao; --hinting normal i --hinting mono prilagođavaju ih jače. Fontove s oznakama, poput arapskog ili devanagarija, najbolje je ostaviti bez toga."
