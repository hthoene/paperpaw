calendar.plugin.name = Kalendar
calendar.plugin.description = Vaši kalendari na čitaču: prikazi rasporeda, dana, tjedna i mjeseca iz CalDAV-a, iCala i datoteka, rođendani iz kontakata, widgeti za početni zaslon i zaslon spavanja.
calendar.plugin.how = "Vaši kalendari na čitaču: raspored sljedećih dana, dan, tjedan i mjesec, s događajima iz CalDAV kalendara (Nextcloud, Radicale, Baïkal, Fastmail i drugi), iz iCal adresa (.ics, webcal://), iz datoteka kalendara na kartici te rođendanima i godišnjicama vaših kontakata (CardDAV). Čitač kalendare samo čita; nikad ih ne mijenja.\n\nOtvorite Kalendar iz izbornika alata. Prvi redak imenuje prikaz; odaberite ga ili držite bilo koji redak ili pritisnite Izbornik da biste prebacivali između Rasporeda, Dana, Tjedna, Mjeseca i Rođendana, dodali kalendare ili sinkronizirali. U Danu i Tjednu prva dva retka vode na prethodni i sljedeći dan ili tjedan (tipke za listanje također); u Mjesecu tipke sa strelicama pomiču dan, tipke za listanje mjesec, a Odaberi otvara dan. Odaberi na događaju prikazuje ga cijelog: kada, gdje, koji kalendar i kako se ponavlja. Natrag vraća jedan korak.\n\nKalendar dodajte pod Kalendari (u izborniku ili Kalendar u postavkama). Odaberite njegovu vrstu: CalDAV račun (dovoljna je adresa poslužitelja, npr. cloud.example.com/remote.php/dav; svaki kalendar s događajima postaje dio prikaza), iCal adresu (kalendar objavljen kao .ics), datoteku kalendara na kartici ili kontakte (CardDAV adresar: čitač prikazuje rođendane i godišnjice spremljene uz njih). Unesite adresu, za račun svoje korisničko ime i lozinku (najbolje lozinku za aplikaciju; sprema se uz lozinke čitača) te naziv. Svaki kalendar ima oznaku (točku, prsten, sivu točku ili kvadrat) koju možete promijeniti da ih razlikujete; do šest kalendara.\n\nDogađaji koji se ponavljaju (dnevno, tjedno, mjesečno, godišnje, s danima u tjednu, brojem ponavljanja, datumima završetka i izostavljenim danima), cjelodnevni događaji i događaji u drugim vremenskim zonama prikazuju se prema satu čitača. Čitač čuva događaje od šezdeset dana prije do šezdeset dana poslije danas, najviše 240, i prikazuje ih bez mreže. Pravila koja ne može pročitati prikazuju svoj događaj jednom.\n\nKalendari se čitaju kad otvorite kalendar (najviše svakih pet minuta), kad odaberete Sinkroniziraj sada i, kako postavite pod Kalendar u postavkama, kad je mreža svejedno uključena ili kad počne punjenje. Čitač zbog toga nikad ne uključuje svoj bežični modul, osim kad zatražite Sinkroniziraj sada.\n\nWidgeti za početni zaslon (držite početni zaslon, zatim dodajte widget): Danas prikazuje datum i što dan donosi, Sljedeći događaj događaj koji slijedi, Raspored sljedeće dane, Mjesec mjesec s točkom ispod dana koji imaju događaje, a Rođendani sljedeće rođendane. Dodir na događaj otvara ga, dodir na dan u mjesecu otvara taj dan. Zaslon spavanja može prikazivati današnji raspored: odaberite Kalendar pod Zaslon spavanja u postavkama."
