smart-home.plugin.name = Pametni dom
smart-home.plugin.description = Vrijednosti i prekidači iz vašeg vlastitog Home Assistanta na nadzornoj ploči i kao widgeti početnog zaslona. Radi s Home Assistantom na vašoj kućnoj mreži.
smart-home.plugin.how = "Pametni dom prikazuje vrijednosti i prekidače iz vašeg vlastitog Home Assistanta: temperature, vlažnost, energiju, vrata i prozore, svjetla, prekidače i scene. S vašim poslužiteljem razgovara putem njegova REST API-ja na vašoj kućnoj mreži; ništa ne ide preko nijedne druge usluge.\n\nOtvorite Pametni dom iz izbornika alata, zatim Veza: unesite adresu svog Home Assistanta (na primjer http://homeassistant.local:8123) i dugotrajni pristupni token (izradite ga pri dnu stranice profila u Home Assistantu). Token se čuva među lozinkama i ključevima, nikad u datoteci postavki. Obični http koristi se samo za adrese na vašoj kućnoj mreži; za poslužitelj negdje drugdje uključite „Poslužitelji izvan kućne mreže“ u postavkama i koristite https s valjanom potvrdom.\n\nOdaberi uređaje otvara popis onoga što vaš poslužitelj ima: tražite po nazivu ili ID-u i odaberite uređaj da ga prikažete (ponovno ga odaberite da ga uklonite). Možete mu dati prostoriju, koja ga grupira na nadzornoj ploči i u widgetima prostorija. Čuva se do 24 uređaja. Na nadzornoj ploči odaberite svjetlo, prekidač ili scenu da ga prebacite: redak prikazuje odgovor poslužitelja. Senzor koji odaberete ponovno se čita.\n\nWidgeti (držite početni zaslon, zatim dodajte widget): Vrijednost pametnog doma prikazuje jedno očitanje veliko, grupa navodi uređaje jedne prostorije, prekidač je gumb za jedno svjetlo ili prekidač, a prostorija je kartica s očitanjima i prekidačima prostorije. Postavke svakog widgeta kažu koji uređaj ili prostoriju prikazuje.\n\nDom se čita kad otvorite nadzornu ploču, kad to zatražite (redak Osvježi sada ili dodir na widget vrijednosti ili grupe), kad se čitač probudi ondje gdje je Wi-Fi već uspostavljen te prema rasporedu koji postavite dok je punjač priključen. Nikad sam ne uključuje bežični modul i nikad ga ne drži uključenim."
