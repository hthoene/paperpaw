sleep.plugin.name = Zaslon spavanja
sleep.plugin.description = Prikazuje usnulu mačku, naslovnicu knjige, vaše slike ili poruku dok uređaj spava.
sleep.plugin.how = "Zaslon spavanja određuje što zaslon prikazuje dok uređaj spava. E-ink čuva sliku bez struje.\n\nOdaberite ga u postavkama, pod Uređaj, Zaslon spavanja, s Prikaz: usnula mačka (zadano), naslovnica knjige, moje slike, logotip i „Spavanje“, widgeti, stranica kakva jest ili stranica sa slikom. Moje slike prikazuje datoteke iz mape slika jednu za drugom.\n\nBez naslovnice ili slike prikazuje se mačka. Gdje sustav sam crta zaslon spavanja, ove postavke su skrivene.\n\nZaslon isključenosti, Prikaz pri isključivanju, crta se jednom pri isključivanju uređaja, iz izbornika napajanja ili nakon vremena iz Isključi nakon spavanja (ne kad prazna baterija prekine struju). Isti je kao zaslon spavanja osim ako odaberete logotip i „Isključeno“, mačku, naslovnicu ili moje slike. Drugi dodatak može ponuditi zaslon za to.\n\nZaslon pokretanja i ponovnog pokretanja, Prikaz pri pokretanju i Prikaz pri ponovnom pokretanju, vlastiti su zasloni uređaja osim ako drugi dodatak za njih ponudi zaslon. Dodaci još ne rade dok se uređaj pokreće: zaslon odabran za pokretanje unaprijed se crta pri isključivanju ili ponovnom pokretanju uređaja i prikazuje pri sljedećem pokretanju. Zaslon koji nije na vrijeme spreman ili oštećena slika ustupaju mjesto zaslonu uređaja; uređaj se u svakom slučaju isključuje ili ponovno pokreće."
