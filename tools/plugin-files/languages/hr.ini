news.plugin.name = Vijesti
news.plugin.description = Dohvaća izvore vijesti (RSS, Atom) kao knjige za čitanje.
news.plugin.how = "Vijesti pretvaraju RSS ili Atom izvore u knjige. Svaki izvor postaje jedna knjiga u mapi News knjižnice, s najnovijim člancima kao običnim tekstom, za čitanje kao svaka druga knjiga.\n\nOtvorite Vijesti iz izbornika Alati i odaberite Dodaj izvor; njegova adresa je na web-stranici novina ili bloga. Dohvati vijesti dohvaća sve izvore i zamjenjuje ranije knjige. Držite izvor (s tipkama držite Odaberi) da ga dohvatite ili uklonite zasebno. Uklonjeni izvor ostavlja svoju knjigu u knjižnici.\n\nDohvaćanje treba mrežu. Članaka po izvoru (Postavke, Knjižnica) određuje koliko članaka svaka knjiga sadrži. Widget Naslovi vijesti prikazuje ih na početnom zaslonu."
