files.plugin.name = Pregled datoteka
files.plugin.description = Navodi knjige i mape na uređaju i otvara ih.
files.plugin.how = "Knjižnica navodi knjige u mapi vaše knjižnice, svaku s naslovnicom, naslovom, autorom i koliko ste je pročitali. Knjiga koju ste zadnju čitali stoji na vrhu kao kartica pa nastavak čitanja traži jedan dodir ili jedan pritisak na Odaberi. Dok knjižnica traži knjige, kaže koliko ih je dosad pronašla.\n\nIznad knjiga odaberite što se prikazuje: sve, one koje čitate, nepročitane ili pročitane, ili police (po autoru, seriji, oznaci, favoriti, sljedeća knjiga svake započete serije). Dodirnite knjigu da je čitate; držite je (s tipkama držite Odaberi) da je otvorite, označite kao pročitanu ili nepročitanu, vidite informacije o njoj, premjestite je u arhivu ili izbrišete. Dodirnite naslov za izbornik knjižnice: kako se knjige sortiraju i prikazuju, pretraga, mapa knjižnice i postavke.\n\nMapa knjižnice postavlja se u Postavkama, pod Knjižnica, kao Mapa knjižnice; ondje možete prikazati i knjige kao mrežu naslovnica. Za sve ostale datoteke koristite Datoteke u izborniku Alati."
