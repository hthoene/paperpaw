smart-home.plugin.name = Cartref clyfar
smart-home.plugin.description = Gwerthoedd a switshis o'ch Home Assistant eich hun ar ddangosfwrdd ac fel teclynnau'r sgrin gartref. Yn gweithio gyda Home Assistant ar eich rhwydwaith cartref.
smart-home.plugin.how = "Mae Cartref clyfar yn dangos gwerthoedd a switshis o'ch Home Assistant eich hun: tymereddau, lleithder, ynni, drysau a ffenestri, goleuadau, switshis a golygfeydd. Mae'n siarad â'ch gweinydd dros ei API REST ar eich rhwydwaith cartref; nid oes dim yn mynd drwy unrhyw wasanaeth arall.\n\nAgorwch Cartref clyfar o'r ddewislen offer, yna Cysylltiad: teipiwch gyfeiriad eich Home Assistant (er enghraifft http://homeassistant.local:8123) a thocyn mynediad hirhoedlog (gwnewch un ar waelod tudalen proffil eich Home Assistant). Cedwir y tocyn ymhlith y cyfrineiriau a'r allweddi, byth mewn ffeil gosodiadau. Defnyddir http plaen dim ond ar gyfer cyfeiriadau ar eich rhwydwaith cartref; ar gyfer gweinydd mewn man arall trowch \"Gweinyddion y tu allan i'r rhwydwaith cartref\" ymlaen yn y gosodiadau a defnyddiwch https gyda thystysgrif ddilys.\n\nMae Dewis endidau yn agor rhestr o'r hyn sydd gan eich gweinydd: chwiliwch yn ôl enw neu id a dewiswch endid i'w ddangos (dewiswch ef eto i'w dynnu). Gallwch roi ystafell iddo, sy'n ei grwpio ar y dangosfwrdd ac yn y teclynnau ystafell. Cedwir hyd at 24 o endidau. Ar y dangosfwrdd dewiswch olau, switsh neu olygfa i'w switsio: mae'r rhes yn dangos ateb y gweinydd. Darllenir synhwyrydd a ddewiswch eto.\n\nTeclynnau (daliwch y sgrin gartref, yna ychwanegwch declyn): mae Gwerth Cartref clyfar yn dangos un darlleniad yn fawr, mae grŵp yn rhestru endidau ystafell, mae switsh yn fotwm ar gyfer un golau neu switsh, ac mae ystafell yn gerdyn gyda darlleniadau a switshis ystafell. Mae gosodiadau pob teclyn yn dweud pa endid neu ystafell y mae'n ei ddangos.\n\nDarllenir y cartref pan fyddwch yn agor y dangosfwrdd, pan ofynnwch (y rhes Adnewyddu neu dap ar declyn gwerth neu grŵp), pan fydd y darllenydd yn deffro lle mae Wi-Fi ar waith eisoes, ac ar yr amserlen a osodwch tra bo'r gwefrydd wedi'i blygio i mewn. Nid yw byth yn troi'r radio ymlaen ohono'i hun a byth yn ei gadw ymlaen."
