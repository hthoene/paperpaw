news.plugin.name = Newyddion
news.plugin.description = Yn nôl ffrydiau newyddion (RSS, Atom) fel llyfrau i'w darllen.
news.plugin.how = "Mae Newyddion yn troi ffrydiau RSS neu Atom yn llyfrau. Mae pob ffrwd yn dod yn un llyfr yn ffolder Newyddion y llyfrgell, gyda'i herthyglau diweddaraf fel testun plaen, i'w ddarllen fel unrhyw lyfr arall.\n\nAgorwch Newyddion o'r ddewislen Offer a dewiswch Ychwanegu ffrwd; mae ei chyfeiriad ar wefan y papur newydd neu'r blog. Mae Nôl y newyddion yn nôl pob ffrwd ac yn disodli'r llyfrau cynharach. Daliwch ffrwd (gyda botymau, daliwch Dewis) i'w nôl neu ei thynnu ar ei phen ei hun. Mae ffrwd a dynnir yn gadael ei llyfr yn y llyfrgell.\n\nMae nôl yn gofyn am rwydwaith. Mae Erthyglau'r ffrwd (Gosodiadau, Llyfrgell) yn gosod faint o erthyglau y mae pob llyfr yn eu dal. Mae'r teclyn Penawdau newyddion yn eu dangos ar y sgrin gartref."
