battery.plugin.name = Defnydd batri
battery.plugin.description = Yn cofnodi'r batri ac yn dangos pa mor hir y mae'n para.
battery.plugin.how = "Mae Defnydd batri yn nodi'r wefr tua unwaith y funud tra bo'r ddyfais yn effro, ynghyd â'r hyn a wnaeth: adnewyddiadau sgrin a thudalennau a droswyd. O hynny mae'n cyfrifo faint y mae awr yn effro a 100 tudalen yn ei gymryd, a pha mor hir y mae'r batri'n para ar y cyflymder hwnnw.\n\nAgorwch Batri o'r ddewislen Offer. Mae'n dangos y wefr nawr, yr amser effro hwn, y defnydd ar fatri hyd yn hyn a'ch amserau effro diweddar. Mae'n troi tudalennau gyda botymau'r dudalen, neu drwy dapio'r saethau ar y brig.\n\nMae angen peth amser o ddarllen ar fatri cyn i'r ffigurau olygu dim. Mae cofnodi ymlaen yn ddiofyn a gellir ei ddiffodd yn y Gosodiadau, o dan Dyfais, Pŵer, fel Cofnodi defnydd batri."
