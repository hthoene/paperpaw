notes-vault.plugin.name = Cell nodiadau
notes-vault.plugin.description = Yn darllen ffolder o nodiadau Markdown yn ôl ffolderi, tagiau a'r newidiadau diweddaraf, gyda theclynnau ar gyfer y sgrin gartref. Yn gweithio gyda chelloedd Obsidian.
notes-vault.plugin.how = "Mae Cell nodiadau yn darllen ffolder o nodiadau Markdown (ffeiliau .md plaen, fel y mae apiau nodiadau'n eu cadw). Mae'n gweithio gyda chelloedd Obsidian.\n\nDewiswch ffolder y gell yn y gosodiadau, neu ar dudalen y gell yn yr offer. Yna mae'r dudalen yn cynnig y ffolderi fel y maent ar y cerdyn, y nodiadau a newidiwyd ddiwethaf, y tagiau, a chwiliad yn nheitlau'r nodiadau.\n\nY tro cyntaf, mynegeir y gell yn y cefndir tra bo'i thudalen ar agor; mae cell o filoedd o nodiadau yn cymryd ychydig funudau, yna'n agor ar unwaith. Cedwir y mynegai ar y cerdyn a'i wneud eto pan fydd tudalen y gell yn agor ar ôl ychydig oriau, neu pan ddewiswch Diweddaru.\n\nMae nodyn yn agor yn y darllenydd. Ceir dolenni i nodiadau eraill ([[Nodyn]], [[Nodyn|geiriau]], [[Nodyn#Pennawd]]) yn ôl enw'r nodyn yn unrhyw le yn y gell; mae dilyn un yn agor y nodyn hwnnw, ac mae Yn ôl yn dychwelyd i'r nodyn cynt.\n\nNi newidir dim yn y gell byth. Ychwanegir y teclynnau ar gyfer y sgrin gartref (nodiadau diweddar, nodyn wedi'i binio, nodyn y dydd, nodyn ar hap, tagiau, chwilio) yng ngolygydd y sgrin gartref. Gall teclyn gymryd ei nodiadau o un ffolder yn unig: ysgrifennwch lwybr y ffolder o wraidd y cerdyn (er enghraifft Notes/Work) yng ngosodiadau'r teclyn; os gadewir ef yn wag, mae'n cymryd holl nodiadau'r gell."
