about.plugin.name = Ynghylch
about.plugin.description = Fersiwn a thrwyddedau PaperPaw.
about.plugin.how = "Mae Ynghylch yn dangos pa fersiwn o PaperPaw sydd gennych, ble mae ei god ffynhonnell, a than ba drwyddedau y daw.\n\nCewch hyd iddo ar ddiwedd y Gosodiadau, fel Ynghylch PaperPaw. Dewiswch res gyda'r botymau saeth a Dewis, neu tapiwch hi. Rhestrir hefyd ategion sydd wedi'u hadeiladu i mewn i'r cadarnwedd ac, ar ddyfeisiau sy'n llwytho ategion â chod, y ffinglun y mae'n rhaid adeiladu ategion o'r fath ar ei gyfer.\n\nMae Trwyddedau yn agor fel testun yn y darllenydd, felly rydych yn troi tudalennau drwyddo fel llyfr. Mae'n cynnwys trwydded PaperPaw ei hun a rhai'r ffontiau, yr eiconau a'r patrymau cysylltnodi sy'n dod gydag ef. Gall ategion ychwanegu llinell eu hunain, fel awdur thema."
about.version.beta = {version} Beta {number}
about.title = Ynghylch PaperPaw
about.intro = Darllenydd e-lyfrau rhydd ar gyfer dyfeisiau e-inc, wedi'i wneud o ategion. Trwyddedwyd o dan Drwydded Apache 2.0; trwyddedir yr hyn y mae'n ei gynnwys fel a ganlyn.
about.plugins.title = Ategion wedi'u hadeiladu i mewn
about.plugins.help = Yr ategion â chod yn y cadarnwedd hwn, gyda'u fersiynau. Mae diweddariad yn dod â'r un rhai eto; bydd un na all wneud hynny'n dweud hynny'n gyntaf.
about.summary = Darllenydd e-lyfrau rhydd ar gyfer dyfeisiau e-inc, wedi'i wneud o ategion.
