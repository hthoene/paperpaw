puzzles.plugin.name = Posau
puzzles.plugin.description = Sudoku, croeseiriau a phosau gwyddbwyll, all-lein, gyda phos y dydd.
puzzles.plugin.how = "Posau ar gyfer y trên a'r ystafell aros, i gyd all-lein: sudoku, croeseiriau a phosau gwyddbwyll. Agorwch Posau o'r ddewislen offer, neu ychwanegwch y teclyn Pos y dydd at y sgrin gartref (daliwch y sgrin gartref, yna ychwanegwch declyn): mae'n dangos pa mor bell yw sudoku heddiw, ac mae tap yn ei agor. Mae sudoku'r dydd yr un fath drwy'r dydd.\n\nSudoku: mae chwith a de yn symud y cyrchwr sgwâr wrth sgwâr, i fyny ac i lawr (botymau'r dudalen) fesul rhes. Mae Dewis yn agor y digidau: dewiswch un a dewiswch eto i'w roi i mewn, neu Clirio i wagio'r sgwâr. Daliwch Dewis (neu Ddewislen) i gyrraedd y botymau o dan y bwrdd: mae Nodiadau yn troi'r digidau'n farciau pensil, mae Gwirio yn marcio sgwariau anghywir, mae Dadwneud yn dadwneud y symudiad olaf, mae Newydd yn dechrau pos o'r lefel a ddewiswch (Hawdd, Canolig, Anodd). Mae gan bob pos un ateb yn union. Cedwir y gêm pan fyddwch yn gadael. Ar sgrin gyffwrdd tapiwch sgwâr.\n\nCroeseiriau: rhowch ffeiliau .puz (Across Lite) neu .ipuz yn y ffolder \"puzzles\" ar y cerdyn cof; ni chynhwysir yr un. Symudwch ar y grid, yna dewiswch i deipio'r gair o dan y cyrchwr ar y bysellfwrdd (mae tanlinell yn gadael sgwâr yn wag). Mae'r botymau'n newid rhwng ar draws ac i lawr, yn dangos rhestr y cliwiau, yn gwirio'r llythrennau ac yn datgelu'r gair. Cedwir y llythrennau ar gyfer pob ffeil. Does dim modd agor ffeiliau .puz wedi'u sgramblo.\n\nPosau gwyddbwyll: set fach o gronfa ddata posau Lichess (CC0). Mae chwith a de yn neidio o ddarn i ddarn, dewiswch y darn rydych am ei symud, yna chwith a de drwy'r mannau y caiff fynd, a dewiswch eto. Cymerir symudiad anghywir yn ôl. Mae Awgrym yn marcio'r darn i'w symud, mae Nesaf yn mynd i'r pos nesaf.\n\nMae'r bwrdd yn ailluniadu'r sgwariau sy'n newid yn unig. Mae Ystadegau yn cyfrif y posau a ddatryswyd gennych."
