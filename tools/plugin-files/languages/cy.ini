opds.plugin.name = Catalogau OPDS
opds.plugin.description = Yn pori catalogau OPDS, yn lawrlwytho eu llyfrau ac yn cadw ffolderi wedi'u cysoni â nhw.
opds.plugin.how = "Llyfrgelloedd ar-lein yw catalogau OPDS fel Project Gutenberg, Calibre-Web, Kavita neu Komga. Mae'r ategyn hwn yn eu pori ac yn chwilio ynddynt fel ffolderi ac yn lawrlwytho eu llyfrau i'r llyfrgell.\n\nAgorwch Catalogau o'r ddewislen Offer a dewiswch Ychwanegu catalog: cyfeiriad ac, os yw'r catalog angen cyfrif, enw defnyddiwr a chyfrinair. Tapiwch gatalog i'w bori; daliwch ef (gyda botymau, daliwch Dewis) i'w gysoni, ei olygu neu ei dynnu.\n\nGyda Cysoni'r catalog hwn wedi'i droi ymlaen, mae Cysoni catalogau yn lawrlwytho ei lyfrau newydd i'w ffolder. Mae Llyfrau fesul cysoni yn cyfyngu faint y mae un cysoniad yn eu nôl, fel nad yw catalog mawr yn llenwi'r ddyfais. Mae ffolder Cwmwl (WebDAV) yn gweithio yn lle catalog."
