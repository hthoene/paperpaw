store.plugin.name = Storfa ategion
store.plugin.description = Yn dod o hyd i ategion ar gyfer y ddyfais hon, yn eu gosod, eu diweddaru a'u tynnu.
store.plugin.how = "Mae'r Storfa ategion yn dod o hyd i ategion ar gyfer y ddyfais hon ar y rhyngrwyd ac yn eu gosod, eu diweddaru a'u tynnu. Agorwch hi o Offer; mae angen Wi-Fi arni.\n\nMae'r dechrau yn dangos yr hyn y mae'r llyfrgell yn ei argymell, yr hyn sy'n newydd neu'n boblogaidd nawr, yna'r grwpiau. Mae grŵp yn rhestru ei ategion mewn cymysgedd teg sy'n newid bob dydd, fel bod pob ategyn yn cael ei weld; trefnwch hwy o A i Z, yn ôl y newydd-af neu'r diweddariad diwethaf, ac ewch at lythyren mewn rhestrau hir. Agorwch un i weld ei dudalen, gyda'i faint a'r cof y mae'n ei gymryd, yna dewiswch Gosod, Diweddaru neu Dynnu. Mae Diweddaru'r cyfan yn dod â phob ategyn sydd wedi'i osod yn gyfredol.\n\nMae ategion cod yn rhedeg gyda mynediad llawn i'r ddyfais: mae'r storfa'n dweud hynny ac yn gofyn yn gyntaf, ac maent yn cychwyn ar ôl ailgychwyn. Os aiff un o'i le, mae PaperPaw yn cychwyn heb ategion cod ac yn dweud pa un. Mae Llyfrgell ategion yn gosod o ble y daw'r rhestr.\n\nMae Ategion cymunedol, yn y Gosodiadau, System, hefyd yn rhestru ategion a gyhoeddwyd gan eraill ar GitHub. Ni adolygodd neb hwy: fe'u marcir Heb eu hadolygu, mae tudalen ategyn cod yn dangos yr allwedd y'i llofnodwyd â hi, ac ni osodir diweddariad a lofnodwyd gan allwedd arall.\n\nMae Ffynonellau, rhes olaf y dechrau, yn ychwanegu rhestrau ategion eraill yn ôl eu cyfeiriad (https://…/plugins.json), yn rhestru un ohonynt yn lle un PaperPaw, neu'n ei dynnu. Yn lle teipio, rhowch ffeil sources.txt gydag un cyfeiriad ar bob llinell yn .paperpaw/plugins/store ar y cerdyn: mae'r cyfeiriadau'n dangos o dan Ffynonellau fel newydd. Nid yw PaperPaw yn gwirio ffynhonnell na'i hategion, ac mae'r ddyfais yn cysylltu â gweinydd y ffynhonnell. Mae ffynhonnell yn llofnodi ei rhestr; mae'r ddyfais yn cadw allwedd y rhestr gyntaf y mae'n ei darllen ac o hynny ymlaen yn derbyn dim ond rhestrau ac ategion cod a lofnodwyd â'r allwedd honno. Mae ategyn yn cael ei ddiweddariadau o'r ffynhonnell y'i gosodwyd ohoni yn unig. Mae llyfrgell PaperPaw ei hun bob amser yno ac ni ellir ei thynnu; mae gadael y storfa yn dychwelyd ati."
