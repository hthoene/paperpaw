mail.plugin.name = E-bost
mail.plugin.description = Yn darllen ac yn anfon e-bost gyda chyfrinair neu gyfrinair ap (IMAP a SMTP), dim mewngofnodi drwy borwr.
mail.plugin.how = "Mae E-bost yn darllen ac yn anfon e-bost dros IMAP a SMTP. Mae'n mewngofnodi gyda'ch cyfeiriad a chyfrinair, heb fewngofnodi drwy borwr, felly mae'n gweithio gydag unrhyw ddarparwr sy'n caniatáu hynny.\n\nGosodwch gyfrif o dan Gosodiadau, E-bost. Dewiswch eich darparwr, teipiwch eich cyfeiriad a'r cyfrinair. Mae'r rhan fwyaf o ddarparwyr eisiau cyfrinair ap: gwnewch un yng ngosodiadau diogelwch eich cyfrif a defnyddiwch hwnnw yma. Yn aml nid yw eich cyfrinair arferol yn gweithio, ac nid yw byth yn mynd i unman ond gweinydd eich darparwr. Cedwir ef gyda'r cyfrineiriau a'r allweddi.\n\nAgorwch E-bost yn yr offer. Mae Gwirio am e-bost yn nôl yr e-byst diweddaraf a'r ffolderi. Cedwir e-byst ar y cerdyn, felly gallwch eu darllen heb rwydwaith. Mae'r ddyfais yn cysylltu, yn nôl ac yn datgysylltu, felly dim ond am foment y mae Wi-Fi ymlaen.\n\nOs nad yw eich darparwr ar y rhestr, dewiswch Gweinyddion eich hun a gosodwch enwau'r gweinyddion, y pyrth a'r diogelwch o dan y gosodiadau uwch. Mae gweinydd nad oes unrhyw awdurdod yn gwarantu ei dystysgrif yn gofyn unwaith a ddylid ymddiried ynddo; cymharwch y ffinglun â'r hyn y mae eich darparwr yn ei ddangos.\n\nMae gan e-bost â llyfr ynghlwm (EPUB, PDF a'u tebyg, hyd at 2 MB) Agor y llyfr oddi tano: mae'n nôl y ffeil, yn ei rhoi yn eich llyfrgell ac yn ei hagor.\n\nI weld e-bost newydd heb agor E-bost, trowch Gwirio am e-bost newydd yn y cefndir ymlaen o dan Gosodiadau, E-bost, a dewiswch pa mor aml (bob 15, 30 neu 60 munud). Mae i ffwrdd nes i chi ei droi ymlaen. Yna mae'r darllenydd yn cysylltu o bryd i'w gilydd dros gysylltiad diogel tra bo'n effro ac ar-lein, un cyfrif ar ôl y llall, ac yn diweddaru'r cyfrif heb eu darllen ar y Sgrin gartref. Mae'n defnyddio rhywfaint o fatri. Mae agor E-bost yn atal gwiriad sy'n rhedeg.\n\nMae teclynnau'r sgrin gartref yn dangos y cyfrif heb eu darllen, yr e-byst diweddaraf a'r rhai â seren, un blwch post, a llwybr byr i ysgrifennu e-bost."
