plugin-manager.plugin.name = Rheolwr ategion
plugin-manager.plugin.description = Yn rhestru'r ategion ac yn eu troi ymlaen ac i ffwrdd.
plugin-manager.plugin.how = "Mae'r rheolwr ategion yn rhestru pob ategyn gyda'i fersiwn a'i ddisgrifiad, ac yn troi ategion ymlaen ac i ffwrdd.\n\nCewch hyd iddo yn y Gosodiadau, fel Rheoli ategion. Mae Gosodiadau ategion yn dudalen ar wahân ar gyfer dewisiadau fel defnydd rhwydwaith pob ategyn. Tapiwch ategyn i'w droi ymlaen neu i ffwrdd (gyda botymau, dewiswch ef). Mae'r newid yn berthnasol ar ôl ailgychwyn: yna mae'r bar ar y gwaelod yn cynnig Ailgychwyn nawr. Daliwch ategyn (gyda botymau, daliwch Dewis) i ddarllen sut mae'n gweithio.\n\nNi ellir diffodd ategyn a nodir Bob amser ymlaen, ac mae un a nodir Angenrheidiol yn angenrheidiol dim ond nes bod ategyn arall yn gwneud ei waith, neu ni fyddai gan PaperPaw ffordd yn ôl. O dan Sgriniau rydych yn dewis pa ategyn sy'n dangos lle y mae sawl un yn ei gynnig."
