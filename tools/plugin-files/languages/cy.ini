rules.plugin.name = Rheolau
rules.plugin.description = Pan fydd rhywbeth yn digwydd, yn gwneud rhywbeth: e.e. modd nos am 22:00.
rules.plugin.how = "Mae rheol yn gwneud rhywbeth ohoni ei hun pan fydd rhywbeth yn digwydd: modd nos ymlaen bob dydd am 22:00, neu'r catalogau'n cael eu cysoni pan fydd PaperPaw yn cychwyn.\n\nMae rheolau yn y Gosodiadau o dan Addasu, fel Rheolau. Mae Ychwanegu rheol yn gofyn Pryd? (mae PaperPaw yn cychwyn, amser o'r dydd, llyfr yn cael ei agor neu ei gau, y batri, gwefru, switsh a mwy) a Beth wedyn? (rhedeg gweithred, troi switsh ymlaen neu i ffwrdd, gosod rhif, dangos neges). Tapiwch reol i'w seibio; daliwch hi (gyda botymau, daliwch Dewis) am amod fel Rhwng dau amser o'r dydd, neu i'w thynnu.\n\nMae'r gweithredoedd, y switshis a'r rhifau i ddewis ohonynt yn dod fesul ategyn: dewiswch yr ategyn, yna'r hyn y mae'n ei gynnig; mae yn ôl yn mynd allan ohono eto. Mae gweithred sy'n gweithio ar y sgrin a ddangosir, fel Yn ôl neu Tudalen nesaf, yn gwneud yr hyn y byddai'n ei wneud pe câi ei phwyso yno.\n\nMae amserau'n berthnasol pa sgrin bynnag sy'n agored. Mae dwy reol sy'n dal i ddadwneud ei gilydd yn stopio ar ôl ychydig gamau."
