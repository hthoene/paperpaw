update.plugin.name = Diweddaru
update.plugin.description = Yn gosod diweddariadau cadarnwedd, o'r cerdyn neu wedi'u lawrlwytho o'r rhyngrwyd.
update.plugin.how = "Mae Diweddaru yn gosod cadarnwedd newydd, ar ddyfeisiau lle mae PaperPaw yn gadarnwedd, fel yr X4. Cewch hyd iddo yn y gosodiadau, fel Diweddaru.\n\nMae Chwilio ar-lein yn gofyn i'r gweinydd diweddaru am PaperPaw newyddach ac yn ei lawrlwytho, sy'n cymryd ychydig funudau dros Wi-Fi. Neu copïwch ffeil diweddaru (yn gorffen â .bin, o paperpaw.org) i'r ffolder updates ar y cerdyn, er enghraifft gyda Throsglwyddo Wi-Fi. Yna mae Gosod yn cymryd tua munud ac mae'r ddyfais yn ailgychwyn; mae llyfrau, gosodiadau a safleoedd darllen yn aros.\n\nGyda Chwilio am ddiweddariadau ymlaen (yn y gosodiadau, i ffwrdd i ddechrau), mae'r ddyfais yn gofyn tua unwaith yr wythnos ohoni ei hun, dim ond tra bo Wi-Fi ymlaen beth bynnag neu tra bo'n gwefru. Mae PaperPaw newyddach y mae'n dod o hyd iddo yn aros yma; nid oes dim yn torri ar draws eich darllen. Mae chwiliad yn anfon yr hyn y mae'r ddyfais yn ei redeg, dim enw na rhif ohoni; i gyfrif dyfeisiau, hefyd pa un a ofynnoch ac a yw'n chwiliad cyntaf y dydd, yr wythnos neu'r mis.\n\nOs nad oes fersiwn eto ar gyfer y datganiad newydd gan ategion rydych yn eu defnyddio, mae'r diweddariad yn aros amdanynt. Mae fersiwn hŷn yn gosod dim ond os dewiswch hi.\n\nMae cadarnwedd arall, fel CrossPoint, yn gosod oddi yma hefyd: rhowch ei ffeil (yn gorffen â .bin) yn y ffolder updates, ac agorwch Diweddaru. Mae PaperPaw yn gwirio ei fod yn gadarnwedd cyfan ar gyfer y ddyfais hon, heb ei ddifrodi, ond ni all ddweud pwy a'i gwnaeth, gan nad yw wedi'i lofnodi. Mae Gosod beth bynnag yn ei ysgrifennu i hanner arall y fflach, ac mae'r ddyfais yn ei gychwyn; mae PaperPaw yn aros yn ei hanner nes bod y cadarnwedd hwnnw'n gosod rhywbeth drosto. I ddychwelyd i PaperPaw yn nes ymlaen, gosodwch ei ffeil gosod (paperpaw-<device>-<version>-install.bin) o ddewislen y cadarnwedd arall, fel diweddariad cadarnwedd SD CrossPoint."
