keyboard.plugin.name = Bysellfwrdd
keyboard.plugin.description = Yn rhoi testun ar y sgrin, drwy gyffwrdd neu gyda'r botymau.
keyboard.plugin.how = "Mae'r bysellfwrdd yn agor pryd bynnag y mae rhywbeth angen testun: chwiliad, cyfrinair, nodyn neu osodiad. Mae'n gweithio drwy gyffwrdd a gyda botymau yn unig.\n\nGyda botymau, mae chwith a de yn symud ar hyd rhes, mae botymau'r dudalen yn symud rhwng rhesi, mae Dewis yn pwyso bysell ac mae Yn ôl yn diddymu; mae chwith a de yn mynd o amgylch rhes, ac mae i fyny ac i lawr yn cadw at eich colofn. Mae Shift yn gwneud y llythyren nesaf yn briflythyren; pwyswch ddwywaith ar gyfer pob priflythyren, ac unwaith eto i stopio. Daliwch lythyren (gyda botymau: daliwch Dewis arni) am ei phriflythyren, a ddewisir ar unwaith, ac acenion fel é ac è; yn Almaeneg, daw ä, ö, ü a ß felly o a, o, u ac s (gyda botymau, mae'r bysellfwrdd yn dweud hynny ar y llythrennau hynny). Mae Iawn yn gorffen; gyda botymau, daliwch Yn ôl i orffen o unrhyw le (mae Yn ôl yn unig yn diddymu), neu daliwch Dewis ar fysell nad yw'n llythyren. Mae Gludo yn mewnosod testun y clipfwrdd, ac mae Ffôn, lle'i cynigir, yn gadael i chi deipio ar eich ffôn yn lle hynny.\n\nYn y gosodiadau o dan Dyfais, Bysellfwrdd: mae Cynlluniau bysellfwrdd yn dewis y cynlluniau. Yn ddiofyn mae'n dilyn iaith y ddewislen; gyda sawl un, mae bysell yn newid rhyngddynt. Mae Bysellau umlaut yn rhoi bysellau ä, ö, ü a ß eu hunain yn lle hynny. Mae Maint yn gwneud bysellau a llythrennau'n fwy; gyda botymau yn unig, mae'r rhesi'n aros fel rhai bysellfwrdd cyfrifiadur. Ar sgriniau cyffwrdd, mae Siâp y bysellau yn newid sut mae'r bysellau'n edrych. Mae Priflythrennau awtomatig yn dechrau pob brawddeg â phriflythyren."
