home.plugin.name = Sgrin gartref
home.plugin.description = Y dudalen gychwyn: tudalennau o declynnau, fel y llyfr sy'n cael ei ddarllen a'r offer.
home.plugin.how = "Mae'r sgrin gartref wedi'i gwneud o dudalennau, pob un yn grid o declynnau ac offer fel ar ffôn. Ar y dechrau mae'r cloc, y llyfr rydych yn ei ddarllen a'r llyfrau a ddarllenwyd yn ddiweddar ar un dudalen, a phob offeryn ar y nesaf.\n\nTapiwch eitem i'w hagor, a llusgwch neu defnyddiwch fotymau'r dudalen i newid tudalennau. Gyda botymau'n unig, mae'r botymau saeth yn symud o un eitem i'r nesaf ac mae Dewis yn ei hagor.\n\nI'w haildrefnu, daliwch y sgrin gartref, tapiwch y pensil o dan y dudalen neu dewiswch Golygu'r sgrin gartref yn y ddewislen. Llusgwch eitemau i'w symud neu tapiwch un am ei dewisiadau, hefyd gyda botymau. Mae Ychwanegu teclyn yno hefyd. Mae Colofnau a Rhesi yn y gosodiadau, o dan Golwg, yn yr adran Sgrin gartref.\n\nAr sgrin wedi'i throi ar ei hochr, mae'r sgrin gartref yn dangos yr un eitemau gyda mwy o golofnau, pob tudalen wedi'i llenwi cyn y nesaf, a chardiau dim lletach na thua 110 mm; ni newidir dim a drefnwyd gennych yn unionsyth. Trefnwch hi ar ei hochr a chedwir y cynllun hwnnw ar gyfer y cyfeiriadiad hwnnw ar ei ben ei hun: ychwanegir teclynnau newydd at y ddau. Mae Ailosod y cynllun llorweddol yn Ychwanegu (wrth olygu) yn mynd yn ôl i'r un deilliedig. Nid yw tynnu teclyn neu offeryn ar un cyfeiriadiad yn ei dynnu o'r llall."
