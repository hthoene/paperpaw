dictionary.plugin.description = Yn chwilio am eiriau mewn geiriaduron StarDict.
dictionary.plugin.how = "Mae'r geiriadur yn chwilio am air o lyfr mewn geiriaduron StarDict ac yn dangos y diffiniadau mewn panel dros ran isaf y sgrin.\n\nYn y darllenydd, daliwch air a dewiswch Chwilio; gyda botymau, defnyddiwch Dewis testun o dan Rhagor. Copïwch ffolderi'r geiriaduron (gyda ffeiliau .ifo, .idx a .dict) i'r ffolder \"dictionaries\" ar y ddyfais, is-ffolderi'n gynwysedig, neu dewiswch ffolder arall yn y Gosodiadau, o dan Darllen, fel Ffolder geiriaduron (gosodiad uwch). Mae'r chwiliad cyntaf yn paratoi mynegai bach ar gyfer pob geiriadur, sy'n cymryd eiliad.\n\nYn y panel, mae botymau'r dudalen neu I fyny ac I lawr yn sgrolio diffiniadau hir, ac mae Yn ôl yn ei gau. Gyda chyffwrdd, tapiwch y tu allan iddo i'w gau."
