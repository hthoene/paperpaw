widgets.plugin.name = Pecyn teclynnau
widgets.plugin.description = Llawer mwy o declynnau ar gyfer y sgrin gartref: clociau, calendr, dyfyniadau, llyfrau, nodiadau a mwy.
widgets.plugin.how = "Mae'r pecyn teclynnau yn ychwanegu llawer o declynnau ar gyfer y sgrin gartref: clociau (analog, geiriau, teils, y byd), calendr, y flwyddyn hyd yma, cyfrif i lawr, cyfnod y lleuad, a diwrnod a dyddiad; dyfyniad y dydd, nodiadau, tasgau, lluniau, cyfarchiad a logo PaperPaw; ac ar gyfer llyfrau, yn darllen nawr, cynnydd, nesaf, cyfresi, ffefrynnau, uwcholeuad a'r llyfrgell mewn rhifau. Mae teclyn batri ynddo hefyd.\n\nYchwanegwch hwy gyda Golygu'r sgrin gartref yn y ddewislen (neu wasg hir ar y sgrin gartref), yna Ychwanegu teclyn. Mae gan bob un ei osodiadau ei hun, fel ffrâm, maint ac aliniad. Mae dewis teclyn sy'n newid, fel dyfyniad y dydd, yn dangos y nesaf. Mae eich dyfyniadau eich hun yn mynd i quotes.txt yn .paperpaw/plugins/widgets ar y cerdyn, pob llinell fel testun | awdur. Mae'r teclynnau amser angen i'r cloc fod wedi'i osod; mae Wi-Fi yn ei osod."
