notes-overview.plugin.name = Pob nodyn
notes-overview.plugin.description = Nodau tudalen ac uwcholeuadau pob llyfr mewn un rhestr, ac allforio fel My Clippings.txt.
notes-overview.plugin.how = "Mae Pob nodyn yn rhestru pob llyfr y gwnaethoch nod tudalen neu uwcholeuad ynddo, gyda faint. Agorwch ef yn Offer. Dewiswch lyfr i weld ei nodiadau, a nodyn i agor y llyfr yn y lle hwnnw.\n\nAr ddiwedd y rhestr, mae Allforio fel My Clippings.txt yn ysgrifennu'r holl nodiadau i un ffeil, yn y ffolder Exports wrth ochr y llyfrgell, yn y ffurf y mae Kindle yn ei defnyddio (UTF-8). Gall apiau sy'n darllen My Clippings.txt Kindle ei darllen. Mae nodyn ar uwcholeuad yn gofnod ar wahân, fel ar Kindle. Gan nad oes lleoliadau Kindle i lyfr yma, \"lleoliad\" yw pa mor bell i mewn i'r llyfr y mae'r nodyn, fel canran. Ysgrifennir y ffeil eto bob tro; mae'n disodli'r un flaenorol."
