tasks.plugin.name = Tasgau
tasks.plugin.description = Rhestrau tasgau gyda dyddiadau a blaenoriaethau, ar y darllenydd neu wedi'u cysoni â'ch gweinydd CalDAV, gyda theclynnau sgrin gartref.
tasks.plugin.how = "Rhestrau tasgau ar eich darllenydd: tasgau gyda dyddiad cwblhau a blaenoriaeth, wedi'u ticio pan fyddant wedi'u gwneud. Maent yn gweithio heb ddim i'w osod a heb rwydwaith, a gellir eu cadw ar y cyd â gweinydd CalDAV (Nextcloud, Radicale, Baïkal, Fastmail ac eraill), fel bod yr un rhestrau ar eich ffôn a'ch cyfrifiadur.\n\nAgorwch Tasgau o'r ddewislen offer. Mae'r rhes gyntaf yn enwi'r rhestr a ddangosir; dewiswch hi am restr arall, am Heddiw a thu hwnt i'r dyddiad ar draws pob rhestr, am restr newydd, i gysoni, neu i osod y cyfrif. Mae Ychwanegu tasg yn agor y bysellfwrdd. Mae Dewis ar dasg yn ei thicio (eto: heb ei gwneud). Daliwch dasg neu pwyswch Dewislen i newid ei theitl, ei dyddiad cwblhau (heddiw, yfory, ymhen wythnos, neu ddyddiad a deipiwch fel 2026-12-24) neu ei blaenoriaeth, neu i'w thynnu. Daw tasgau agored yn gyntaf, yn ôl eu diwrnod ac yna yn ôl blaenoriaeth; mae rhai wedi'u gwneud yn aros ar y diwedd am wythnos (gosodwch o dan Tasgau yn y gosodiadau), yna maent yn gadael y darllenydd.\n\nTeclynnau ar gyfer y sgrin gartref (daliwch y sgrin gartref, yna ychwanegwch declyn): mae Tasgau heddiw yn dangos yr hyn sy'n ddyledus heddiw neu sydd wedi mynd heibio'i ddyddiad, mae Rhestr tasgau yn dangos un rhestr, mae Tasgau agored yn eu cyfrif, ac mae Tasg nesaf yn dangos yr un i'w gwneud nesaf. Mae tap ar dasg mewn teclyn yn ei thicio; mae tap ar bennawd yn agor y rhestrau.\n\nI gysoni, dewiswch Cyfrif CalDAV o res y rhestr a rhowch gyfeiriad y gweinydd, eich enw defnyddiwr a chyfrinair (yn ddelfrydol cyfrinair ap). Mae cyfeiriad y gweinydd yn ddigon, e.e. cloud.example.com/remote.php/dav; mae'r darllenydd yn dod o hyd i'ch rhestrau tasgau oddi yno. Mae pob rhestr tasgau ar y gweinydd yn dod yn rhestr ar y darllenydd. Mae'r darllenydd yn cysoni pan fyddwch yn agor Tasgau, pan ddewiswch Cysoni nawr, a phan fo'r rhwydwaith ymlaen beth bynnag; mae'r hyn a newidiwch heb rwydwaith yn aros ac yn cael ei anfon yn nes ymlaen. Os newidiwyd tasg ar y darllenydd ac mewn man arall yn y cyfamser, cymerir fersiwn y gweinydd a chedwir eich un chi fel tasg newydd wrth ei hochr, fel nad oes dim yn cael ei golli. Mae nodiadau, larymau a phopeth arall sydd gan dasg ar y gweinydd yn aros fel y maent. Dangosir tasgau sy'n ailadrodd ond fe'u newidir lle gwnaethoch hwy. Mae'r darllenydd yn dal hyd at 200 o dasgau mewn 12 rhestr."
