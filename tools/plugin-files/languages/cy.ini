reading-goal.plugin.name = Nod darllen
reading-goal.plugin.description = Munudau i'w darllen bob dydd, a chath ar y sgrin gartref y mae ei hwyliau'n dilyn darllen heddiw.
reading-goal.plugin.how = "Mae cath ar eich sgrin gartref yn dangos sut mae darllen heddiw'n mynd: trist tra nad ydych wedi darllen eto, fel-fel ar ôl ychydig, bodlon o hanner eich nod dyddiol, hapus unwaith y byddwch wedi'i gyrraedd.\n\nYchwanegwch y teclyn Cath ddarllen at y sgrin gartref (daliwch y sgrin gartref, yna ychwanegwch declyn), neu dewiswch Cath darllen heddiw fel y sgrin cysgu. Mae tap ar y gath yn agor y nod dyddiol; dyma nod yr ystadegau darllen, sy'n cyfrif y munudau a ddarllenwch.\n\nYn y gosodiadau, o dan Darllen, mae Bodlon o a Hapus o yn gosod o ba gyfran o'r nod y mae'r gath yn fodlon neu'n hapus, a Lluniau eich hun ffolder o luniau (trist, fel-fel, bodlon a hapus) i'w dangos yn lle'r cathod. Ffeiliau PNG neu JPEG yw'r lluniau; heb ffolder, dangosir y cathod."
