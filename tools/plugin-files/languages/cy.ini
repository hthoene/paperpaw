calendar.plugin.name = Calendr
calendar.plugin.description = Eich calendrau ar y darllenydd: golygon agenda, diwrnod, wythnos a mis o CalDAV, iCal a ffeiliau, penblwyddi o gysylltiadau, teclynnau cartref a sgrin cysgu.
calendar.plugin.how = "Eich calendrau ar y darllenydd: agenda o'r dyddiau nesaf, diwrnod, wythnos a mis, gyda digwyddiadau calendrau CalDAV (Nextcloud, Radicale, Baïkal, Fastmail ac eraill), cyfeiriadau iCal (.ics, webcal://), ffeiliau calendr ar y cerdyn a phenblwyddi a dathliadau blynyddol eich cysylltiadau (CardDAV). Dim ond darllen calendrau y mae'r darllenydd; nid yw byth yn eu newid.\n\nAgorwch Calendr o'r ddewislen offer. Mae'r rhes gyntaf yn enwi'r golwg; dewiswch hi, neu daliwch unrhyw res neu pwyswch Dewislen, i newid rhwng Agenda, Diwrnod, Wythnos, Mis a Phenblwyddi, i ychwanegu calendrau neu i gysoni. Yn Niwrnod ac Wythnos mae'r ddwy res gyntaf yn camu i'r diwrnod neu'r wythnos cynt ac wedyn (felly hefyd fysellau'r dudalen); yn Mis mae'r bysellau saeth yn symud y diwrnod, bysellau'r dudalen y mis, ac mae Dewis yn agor y diwrnod. Mae Dewis ar ddigwyddiad yn ei ddangos yn llawn: pryd, ble, pa galendr a sut mae'n ailadrodd. Mae Yn ôl yn mynd un cam yn ôl.\n\nYchwanegwch galendr o dan Calendrau (yn y ddewislen, neu Calendr yn y gosodiadau). Dewiswch ei fath: cyfrif CalDAV (mae cyfeiriad y gweinydd yn ddigon, e.e. cloud.example.com/remote.php/dav; mae pob calendr â digwyddiadau yn dod yn rhan o'r golwg), cyfeiriad iCal (calendr a gyhoeddir fel .ics), ffeil calendr ar y cerdyn, neu gysylltiadau (llyfr cyfeiriadau CardDAV: mae'r darllenydd yn dangos y penblwyddi a'r dathliadau blynyddol sydd wedi'u storio gyda nhw). Rhowch y cyfeiriad, ar gyfer cyfrif eich enw defnyddiwr a chyfrinair (yn ddelfrydol cyfrinair ap; fe'i cedwir gyda chyfrineiriau'r darllenydd), ac enw. Mae gan bob calendr farc (dot, cylch, dot llwyd neu sgwâr) y gallwch ei newid, fel y gallwch eu gwahaniaethu; hyd at chwe chalendr.\n\nDangosir digwyddiadau sy'n ailadrodd (bob dydd, bob wythnos, bob mis, bob blwyddyn, gyda diwrnodau'r wythnos, cyfrifon, dyddiadau gorffen a diwrnodau a adawyd allan), digwyddiadau drwy'r dydd a digwyddiadau mewn parthau amser eraill ar gloc y darllenydd ei hun. Mae'r darllenydd yn cadw'r digwyddiadau o drigain diwrnod cyn heddiw hyd drigain diwrnod ar ei ôl, 240 ar y mwyaf, ac yn eu dangos heb y rhwydwaith. Mae rheolau na all eu darllen yn dangos eu digwyddiad unwaith.\n\nDarllenir calendrau pan fyddwch yn agor y calendr (bob pum munud ar y mwyaf), pan ddewiswch Cysoni nawr, ac, fel y gosodwch o dan Calendr yn y gosodiadau, pan fo'r rhwydwaith ymlaen beth bynnag neu pan fydd gwefru'n dechrau. Nid yw'r darllenydd byth yn troi ei radio ymlaen ar ei gyfer, ac eithrio pan ofynnwch am Cysoni nawr.\n\nTeclynnau ar gyfer y sgrin gartref (daliwch y sgrin gartref, yna ychwanegwch declyn): mae Heddiw yn dangos y dyddiad a'r hyn y mae'r diwrnod yn ei gynnwys, Digwyddiad nesaf y digwyddiad nesaf, Agenda y dyddiau nesaf, Mis fis gyda dot o dan y diwrnodau sydd â digwyddiadau, a Phenblwyddi y penblwyddi nesaf. Mae tap ar ddigwyddiad yn ei agor, mae tap ar ddiwrnod o'r mis yn agor y diwrnod hwnnw. Gall y sgrin cysgu ddangos agenda heddiw: dewiswch Calendr o dan Sgrin cysgu yn y gosodiadau."
