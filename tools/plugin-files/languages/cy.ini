transfer.plugin.how = "Mae Trosglwyddo Wi-Fi yn rhoi llyfrau a ffeiliau eraill ar y ddyfais o borwr yn yr un rhwydwaith, heb gebl nac ap. Gallwch hefyd nôl ffeiliau, gwneud ffolderi a dileu.\n\nAgorwch ef o Offer. Mae'r sgrin yn dangos cyfeiriad fel testun ac fel cod QR: agorwch ef mewn porwr ar ffôn neu gyfrifiadur, neu sganiwch y cod. Mae'r cyfeiriad yn cynnwys allwedd a wneir o'r newydd bob tro, fel na all eraill yn y rhwydwaith gyrraedd eich ffeiliau. Mae'r trosglwyddo'n rhedeg tra bo'r sgrin ar agor.\n\nLle mae PaperPaw yn rhedeg Wi-Fi ei hun, fel ar yr X4, mae Heb lwybrydd ar y gwaelod yn agor rhwydwaith y ddyfais ei hun, y mae'r ffôn yn ymuno ag ef trwy sganio cod."
