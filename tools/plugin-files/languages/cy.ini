calibre.plugin.name = Llyfrgell ddiwifr
calibre.plugin.description = Yn derbyn llyfrau dros y rhwydwaith. Yn gweithio fel dyfais ddiwifr ar gyfer calibre.
calibre.plugin.how = "Mae'r Llyfrgell ddiwifr yn gadael i'r ddyfais ymddangos yn Calibre ar eich cyfrifiadur fel dyfais ddiwifr. Yna gall Calibre anfon llyfrau ati, eu rhestru a'u dileu. Mae'r llyfrau'n mynd i'r llyfrgell.\n\nAgorwch y Llyfrgell ddiwifr o'r ddewislen Offer, gyda'r ddyfais a'r cyfrifiadur yn yr un rhwydwaith Wi-Fi. Yn Calibre dewiswch Cysylltu/rhannu, yna Dechrau cysylltiad dyfais ddiwifr. Pan fydd y ddyfais wedi dod o hyd i'ch cyfrifiadur mae'n dangos ei enw; tapiwch Cysylltu (gyda botymau, pwyswch Dewis). Gall Calibre ychwanegu a dileu llyfrau yma, felly cysylltwch â'ch cyfrifiadur eich hun yn unig. Mae cau'r sgrin yn gorffen y cysylltiad.\n\nOs na cheir hyd i Calibre ohono'i hun, rhowch gyfeiriad ei gyfrifiadur yn y Gosodiadau, o dan Llyfrgell, fel Cyfeiriad yn rhan Calibre. Os yw Calibre yn defnyddio porth heblaw 9090, ychwanegwch ef fel :porth, e.e. 192.168.1.20:9091."
