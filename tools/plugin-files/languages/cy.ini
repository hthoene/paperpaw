menu.plugin.name = Dewislen
menu.plugin.description = Y ddewislen ar waelod y sgrin, gyda gweithredoedd a gosodiadau.
menu.plugin.how = "Mae'r ddewislen yn rhestru'r hyn y gallwch ei wneud a'i osod. Mae'n agor ar waelod y sgrin, uwchben beth bynnag sydd ar agor: wrth ddarllen, tapiwch ganol y sgrin neu pwyswch Dewis. Tapiwch neu dewiswch gofnod i'w redeg.\n\nMae gosodiadau yn y ddewislen yn dangos eu gwerth ac yn newid yn eu lle, felly mae'r ddewislen yn aros ar agor. Mae cofnod â mwy o gofnodion yn agor is-ddewislen.\n\nLlusgwch i lawr o'r ymyl uchaf am y panel cyflym: yr hyn rydych yn ei newid yn aml, fel botymau. Tapiwch fotwm i'w newid, daliwch ef am ei osodiadau. Gyda botymau'n unig, mae'r botymau saeth yn dewis, mae Dewis yn newid ac mae Yn ôl yn cau. O dan Golwg, mae Dewislenni yn dangos dewislenni fel rhestr neu fel teils."
