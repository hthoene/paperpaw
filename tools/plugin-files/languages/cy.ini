anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Yn astudio cardiau dyledus Anki ar eich cyfrifiadur ac yn anfon eich atebion yn ôl, drwy'r ychwanegyn AnkiConnect.
anki.plugin.how = "Mae Anki yn gadael i chi astudio ar y darllenydd y cardiau sy'n ddyledus yn Anki ar eich cyfrifiadur, ac yn anfon eich atebion yn ôl. Mae'n defnyddio'r ychwanegyn rhydd AnkiConnect (cod ychwanegyn 2055492159) ac nid AnkiWeb byth. Mae i ffwrdd i ddechrau: ychwanegwch ef o Storfa'r ategion.\n\nAr y cyfrifiadur: gosodwch AnkiConnect yn Anki (Offer, Ychwanegion, Cael Ychwanegion) ac ailgychwynnwch Anki. Rhaid i Anki fod ar agor wrth i chi gysoni.\n\nYn ddiofyn mae AnkiConnect yn ateb y cyfrifiadur y mae'n rhedeg arno yn unig (127.0.0.1), felly ni all y darllenydd ei gyrraedd. Agorwch Offer, Ychwanegion, AnkiConnect, Ffurfweddu a gosodwch \"webBindAddress\" i \"0.0.0.0\" (gwrando ar y rhwydwaith cartref). Y porth, \"webBindPort\", yw 8765 oni newidiwch ef. Os gosodwch \"apiKey\" yno, rhowch yr un allwedd yma. Ailgychwynnwch Anki ar ôl newid y ffurfwedd, a chaniatewch Anki drwy wal dân y cyfrifiadur os bydd yn gofyn. Defnyddiwch hyn ar rwydwaith rydych yn ymddiried ynddo yn unig: gall unrhyw un arno gyrraedd AnkiConnect, felly mae allwedd yn syniad da.\n\nAr y darllenydd: agorwch Anki o Offer, yna rhowch gyfeiriad y cyfrifiadur (er enghraifft 192.168.1.20) o dan Cyfrifiadur, y porth os nad yw'n 8765, a'r allwedd API os gosodoch un. Dewiswch Becyn, neu gadewch ef yn wag ar gyfer pob pecyn. Yna dewiswch Cysoni ag Anki, gyda Wi-Fi ymlaen: anfonir eich atebion sy'n aros yn gyntaf, yna ceir y cardiau sy'n ddyledus (a nifer y cardiau newydd a osodoch), 50 ar y mwyaf. Dewiswch Astudio i fynd drwyddynt, heb rwydwaith: dangoswch yr ateb a'i raddio Eto, Anodd, Da neu Hawdd. Cedwir eich atebion ar y darllenydd, hefyd heb Wi-Fi, ac maent yn mynd i Anki gyda'r cysoni nesaf. Anki sy'n penderfynu pryd mae cerdyn yn dod yn ôl: ceir cerdyn a atebwyd gennych Eto eto mewn cysoni diweddarach unwaith y bydd Anki yn dweud ei fod yn ddyledus.\n\nMae Cysoni pan fydd Anki yn agor, yn y gosodiadau, yn cysoni bob tro yr agorwch y sgrin. Nid oes dim yn defnyddio'r rhwydwaith pan wasgwch fysell."
