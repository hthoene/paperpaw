picture-home.plugin.name = Sgrin gartref luniau
picture-home.plugin.description = Sgrin gartref gyda'ch llun eich hun y tu ôl i'r teclynnau, a bar statws y gallwch ei ffurfweddu.
picture-home.plugin.how = "Mae'r Sgrin gartref luniau yn disodli'r sgrin gartref tra bo ymlaen: eich llun eich hun y tu ôl i'r teclynnau, a'r tudalennau o declynnau ac offer rydych yn eu trefnu. Diffoddwch hi yn rheolwr yr ategion ac mae'r sgrin gartref adeiledig yn ôl, gyda'i thudalennau ei hun.\n\nRhowch luniau (JPEG, PNG neu GIF) mewn ffolder ar y cerdyn (wallpapers yn ddiofyn), yna dewiswch un yn y Gosodiadau, Addasu, Sgrin gartref luniau. Mae Ffitio yn dweud sut mae'n llenwi'r sgrin (llenwi, y llun cyfan, ymestyn, maint gwreiddiol, teilio), Safle pa ran sy'n aros, Chwyddo pa mor fawr, a Goleuo'r llun pa mor welw: mae llun gwelwach yn gwneud y teclynnau'n haws eu darllen. Paratoir y llun unwaith ar gyfer pob maint sgrin, sy'n cymryd eiliad.\n\nMae teclynnau'n eistedd ar blatiau dros y llun. Trefnwch y dudalen fel ar y sgrin gartref adeiledig: y pensil o dan y dudalen, neu Golygu'r sgrin gartref yn y ddewislen.\n\nGall y bar statws (amser, Wi-Fi, batri, neu'r hyn a ddewiswch) fod ymlaen, i ffwrdd neu'n awtomatig, ar y brig neu'r gwaelod, lled llawn neu bilsen fach ar y chwith, yn y canol neu ar y dde, ar blât golau, tywyll neu lwyd neu ar y llun ei hun. Gall y rhes sy'n enwi'r botymau (ar yr X4) fod ymlaen, i ffwrdd neu'n awtomatig hefyd. Mae awtomatig yn golygu bod gwasg botwm yn eu dangos am ychydig eiliadau; nid yw'r wasg honno'n gwneud dim arall.\n\nMae Rendro lluniau yn dweud sut y tynnir y llun: Lefelau llwyd ym mhob llwyd sydd gan y sgrin (arafach ar yr X4), Dithero mewn dotiau du a gwyn (cyflym), neu Awtomatig, fel y mae'r sgrin gartref adeiledig yn ei wneud: lefelau llwyd pan dynnir y sgrin, dotiau ar ôl y newid cyntaf. Lle nad oes gan sgrin lefelau llwyd, mae lefelau llwyd yn disgyn yn ôl i ddotiau."
