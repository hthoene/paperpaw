reader.plugin.name = Darllenydd
reader.plugin.description = Yn dangos llyfrau dudalen wrth dudalen, gyda thabl cynnwys a gosodiadau darllen.
reader.plugin.how = "Mae'r darllenydd yn dangos llyfrau dudalen wrth dudalen. Agorwch lyfr o'r llyfrgell; gall y llyfr olaf ailagor wrth gychwyn (y gosodiad Agor y llyfr olaf wrth gychwyn).\n\nTapiwch ochr chwith neu dde'r sgrin, neu defnyddiwch fotymau'r dudalen, i droi tudalennau. Tapiwch y canol neu pwyswch Dewis am y ddewislen ddarllen: Cynnwys, Chwilio, Mynd i dudalen, Ffont a chynllun, Nodau tudalen ac uwcholeuadau a mwy. Mae llusgo i lawr o'r ymyl uchaf yn agor y panel cyflym, mae llusgo i fyny o'r ymyl gwaelod yn mynd adref; felly hefyd dal Yn ôl.\n\nDaliwch Dewis (neu ddal llun) i weld llun ar y sgrin lawn: mae Chwith a De yn camu drwy luniau'r dudalen. Mae Dewis yn chwyddo i 2x, 3x ac yn ôl (tap dwbl ar sgrin gyffwrdd); wedi'i chwyddo, mae Chwith a De yn panio i'r ochr, mae botymau'r dudalen (neu lusgiadau) yn symud ymlaen ar draws ac i lawr. Mae Yn ôl yn dychwelyd i ffitio, yna i'r dudalen (daliwch i adael ar sgrin gyffwrdd). Tapiwch gornel dde uchaf am nod tudalen. Daliwch air i'w uwcholeuo. Gyda botymau, daliwch Chwith: mae Chwith a De yn symud fesul gair, botymau'r dudalen fesul llinell, mae eu dal yn mynd i derfynau'r dudalen ac fesul paragraff; mae Dewis yn agor bar uwcholeuo'r gair, mae dal Dewis yn ei ledu i'r frawddeg a'r paragraff (yna mae Chwith a De yn symud y diwedd, eu dal y dechrau). Mae dewisiad yn mynd ymlaen dros droeon tudalen. Mae Allforio fel Markdown yn cadw eich nodiadau."
