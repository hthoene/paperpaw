koreader.plugin.name = Rhannu uwcholeuadau
koreader.plugin.description = Yn rhannu nodau tudalen ac uwcholeuadau gyda KOReader ar gyfer llyfrau a ddarllenir yn y ddau.
koreader.plugin.how = "Mae'r ategyn hwn yn rhannu nodau tudalen ac uwcholeuadau gyda KOReader ar gyfer llyfrau rydych yn eu darllen yn y ddau, ar un ddyfais neu mewn ffolder llyfrgell a gysonir rhwng dyfeisiau. Does dim i'w osod.\n\nPan fydd PaperPaw yn agor llyfr y mae KOReader hefyd wedi'i agor, a phan fyddwch yn newid ei nodau tudalen neu ei uwcholeuadau, mae'n cymryd drosodd yr hyn sy'n newydd o ddata KOReader wrth ochr y llyfr ac yn gadael yr hyn sy'n newydd yma i KOReader ei gasglu y tro nesaf y bydd yn agor y llyfr. Mae marciau a dynnwyd a nodiadau a newidiwyd yn mynd drosodd hefyd.\n\nMae hyn yn gweithio ar gyfer llyfrau EPUB yn unig. Os na ellir darllen ffeil un ochr, ni newidir dim ar y naill ochr na'r llall nes y gellir."
koreader.removed-there = Does dim uwcholeuadau yn ffeil KOReader mwyach. Eu tynnu yma hefyd?
koreader.removed-there.text = Efallai eu bod wedi'u tynnu yn KOReader, neu fod ei ffeil wedi dod o ddyfais arall. Mae Cadw yn eu gadael yma ac yn eu rhoi i KOReader eto.
