files.plugin.name = Porwr ffeiliau
files.plugin.description = Yn rhestru'r llyfrau a'r ffolderi ar y ddyfais ac yn eu hagor.
files.plugin.how = "Mae'r llyfrgell yn rhestru'r llyfrau yn ffolder eich llyfrgell, pob un gyda'i glawr, ei deitl, ei awdur a pha mor bell rydych wedi'i ddarllen. Mae'r llyfr a ddarllenoch ddiwethaf ar y brig fel cerdyn, felly mae mynd ymlaen i ddarllen yn cymryd un tap, neu un gwasgiad o Dewis. Tra bo'r llyfrgell yn chwilio am lyfrau, mae'n dweud faint y mae wedi'u canfod hyd yn hyn.\n\nDewiswch beth a ddangosir uwchben y llyfrau: pob un, y rhai rydych yn eu darllen, rhai heb eu darllen neu wedi'u gorffen, neu'r silffoedd (yn ôl awdur, cyfres, tag, ffefrynnau, llyfr nesaf pob cyfres rydych wedi'i dechrau). Tapiwch lyfr i'w ddarllen; daliwch ef (gyda botymau, daliwch Dewis) i'w agor, ei farcio'n wedi'i orffen neu heb ei ddarllen, gweld ei wybodaeth, ei symud i'r archif neu ei ddileu. Tapiwch y teitl i gael dewislen y llyfrgell: sut mae llyfrau'n cael eu trefnu a'u dangos, chwilio, ffolder y llyfrgell a'r gosodiadau.\n\nGosodir ffolder y llyfrgell yn y Gosodiadau, o dan Llyfrgell, fel Ffolder y llyfrgell; yno gallwch hefyd ddangos llyfrau fel grid o gloriau. Ar gyfer pob ffeil arall, defnyddiwch Ffeiliau yn y ddewislen Offer."
