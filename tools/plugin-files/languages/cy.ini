keys.plugin.name = Botymau ac ystumiau
keys.plugin.description = Beth mae pob botwm, parth tap a llusgiad yn ei wneud, wedi'i newid ar y ddyfais.
keys.plugin.how = "Mae Botymau ac ystumiau yn dangos beth mae pob botwm, parth tap a llusgiad yn ei wneud, ac yn gadael i chi ei newid ar y ddyfais.\n\nAgorwch ef yn y gosodiadau, o dan Dyfais. Dewiswch yn gyntaf ble mae newid yn berthnasol: Ym mhobman, Wrth ddarllen, Ar y sgrin gartref, Yn y llyfrgell neu mewn un offeryn. Yna dewiswch fewnbwn, fel botwm a ddelir neu lusgiad i mewn o ymyl, a dewiswch weithred o'r rhestr, y gallwch chwilio ynddi. Mae Fel safon yn rhoi yn ôl yr hyn a osodwyd gan yr ategion a chynllun y botymau.\n\nAr yr X4, gwrthodir newid a fyddai'n gadael dim botwm i ddewis, mynd yn ôl neu symud ymlaen ag ef. Mae Ailosod botymau ac ystumiau ar y diwedd yn dadwneud pob newid."
