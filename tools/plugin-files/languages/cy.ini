setup.plugin.name = Gosod
setup.plugin.description = Canllaw byr drwy'r gosodiadau sy'n bwysig, ar y cychwyn cyntaf.
setup.plugin.how = "Canllaw byr drwy'r gosodiadau sy'n bwysig yw Gosod, a ddangosir unwaith, y tro cyntaf y bydd PaperPaw yn cychwyn. Mae pob tudalen yn gofyn un peth, fel yr iaith, y botymau, maint y testun, y parth amser, Wi-Fi neu ychydig o ategion i'w hychwanegu, gydag ateb synhwyrol eisoes wedi'i ddewis, felly mae Nesaf bob amser yn iawn. Gadewir camau nad oes eu hangen ar y ddyfais hon allan.\n\nTapiwch y botymau, neu defnyddiwch y botymau i fyny ac i lawr a Dewis. Mae Hepgor ar y dudalen gyntaf yn gadael y gosod ar unwaith. Mae'r dudalen olaf yn dweud o ble y daw eich llyfrau.\n\nI'w redeg eto, agorwch y gosodiadau a dewiswch Gosod PaperPaw. Gellir newid popeth a ddewisir yma yn y gosodiadau yn nes ymlaen."
