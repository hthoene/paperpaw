profiles.plugin.name = Proffiliau darllen
profiles.plugin.description = Setiau o osodiadau darllen ac arddangos a enwir, a newidir â thap.
profiles.plugin.how = "Mae proffil yn cadw eich gosodiadau darllen, eich gosodiadau arddangos a'ch llinellau statws o dan enw, fel Nos neu Print mawr, ac yn eu dod yn ôl â thap.\n\nAgorwch Proffiliau yn y ddewislen ddarllen o dan Rhagor, neu yn y Gosodiadau o dan Addasu. Tapiwch broffil i'w ddefnyddio; mae'r un sy'n cael ei ddefnyddio wedi'i farcio. Daliwch ef (gyda botymau, daliwch Dewis) i gadw'r gosodiadau cyfredol ynddo, ei ailenwi neu ei dynnu. Mae Cadw fel proffil newydd yn cadw'r hyn sydd wedi'i osod nawr.\n\nMae Proffil nesaf yn newid i'r un nesaf yn y rhestr; rhowch ef ar fotwm neu mewn rheol."
