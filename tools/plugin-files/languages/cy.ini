sleep.plugin.name = Sgrin cysgu
sleep.plugin.description = Yn dangos cath yn cysgu, clawr y llyfr, eich lluniau neu neges tra bo'r ddyfais yn cysgu.
sleep.plugin.how = "Mae'r sgrin cysgu yn penderfynu beth mae'r sgrin yn ei ddangos tra bo'r ddyfais yn cysgu. Mae e-inc yn cadw'r llun heb bŵer.\n\nDewiswch hi yn y gosodiadau, o dan Dyfais, Sgrin cysgu, gyda Dangos: cath yn cysgu (y rhagosodiad), clawr y llyfr, fy lluniau, y logo a \"Yn cysgu\", teclynnau, y dudalen fel y mae, neu'r dudalen gyda llun. Mae Fy lluniau yn dangos ffeiliau'r ffolder Pictures un ar ôl y llall.\n\nHeb glawr neu lun mae'r gath yn dangos. Lle mae'r system yn tynnu'r sgrin cysgu ei hun, mae'r gosodiadau hyn wedi'u cuddio.\n\nMae'r sgrin diffodd, Dangos wrth ddiffodd, yn cael ei thynnu unwaith wrth i'r ddyfais gael ei diffodd, o'r ddewislen pŵer neu ar ôl amser Diffodd ar ôl cysgu (nid pan fydd batri isel yn torri'r pŵer). Mae fel y sgrin cysgu oni ddewiswch y logo a \"Wedi'i ddiffodd\", y gath, y clawr neu fy lluniau. Gall ategyn arall gynnig sgrin ar ei chyfer.\n\nMae sgrin y cychwyn a'r ailgychwyn, Dangos wrth gychwyn a Dangos wrth ailgychwyn, yn rhai'r ddyfais ei hun oni bai fod ategyn arall yn cynnig sgrin ar eu cyfer. Nid yw ategion yn rhedeg eto tra bo'r ddyfais yn cychwyn: tynnir y sgrin a ddewiswyd ar gyfer y cychwyn ymlaen llaw, wrth i'r ddyfais ddiffodd neu ailgychwyn, a'i dangos ar y cychwyn nesaf. Mae sgrin nad yw'n barod mewn pryd, neu lun sydd wedi'i ddifrodi, yn ildio i un'r ddyfais ei hun; mae'r ddyfais yn diffodd neu'n ailgychwyn beth bynnag."
