wifi.plugin.name = Wi-Fi
wifi.plugin.description = Yn ymuno â rhwydweithiau Wi-Fi pan fo angen ac yn diffodd y radio wedyn.
wifi.plugin.how = "Mae Wi-Fi yn ymuno â rhwydwaith pan fydd ategyn angen y rhyngrwyd (catalog, cysoni, y storfa, trosglwyddo) ac yn diffodd y radio eto funud ar ôl nad oes dim yn ei ddefnyddio, neu ar unwaith pan fydd y Cartref neu lyfr yn dangos, i arbed batri a chof.\n\nAgorwch Wi-Fi o'r Gosodiadau, neu o'r eitem Wi-Fi yn y llinell statws. Mae Rhwydweithiau yn rhestru'r rhai o fewn cyrraedd; dewiswch un a theipiwch ei gyfrinair, neu dewiswch Gosod gyda ffôn a theipiwch yr enw a'r cyfrinair ym mhorwr eich ffôn yn lle ar y ddyfais. Mae Anghofio yn tynnu rhwydwaith a gadwyd.\n\nMae'r cyfrineiriau'n aros ar y cerdyn, wedi'u cadw'n ddiogel, ac ni chânt eu dangos byth eto. O dan Cysylltu pan fo angen rydych yn gosod am ba hyd y mae Wi-Fi yn aros ymlaen ar ôl ei ddefnydd olaf, pa un a yw'n aros ymlaen wrth wefru, a pha rwydwaith a gadwyd sy'n dod yn gyntaf pan fo sawl un o fewn cyrraedd."
