translate.plugin.name = Cyfieithu
translate.plugin.description = Yn cyfieithu testun a ddewiswyd ar-lein, gyda DeepL.
translate.plugin.how = "Mae Cyfieithu yn cyfieithu testun a ddewiswyd ar-lein gyda DeepL. Dewiswch destun mewn llyfr a dewiswch Cyfieithu yn newislen y testun a ddewiswyd: mae'r cyfieithiad yn ymddangos dros y dudalen fel cofnod geiriadur. Mae botymau'r dudalen neu dapiau yn ei sgrolio, ac mae Dewis neu dap ar ei ddiwedd yn ei gau.\n\nMae angen rhwydwaith ac allwedd API DeepL eich hun arno, am ddim yn deepl.com (DeepL API Free, tua 500,000 o nodau y mis). Nes i chi ei rhoi, mae'r panel yn dweud hynny, ac mae tap yn gofyn amdani.\n\nYn y gosodiadau, o dan Darllen, yn yr adran Cyfieithu, mae Cyfieithu i yn gosod yr iaith; i ddechrau iaith PaperPaw ei hun yw hi."
