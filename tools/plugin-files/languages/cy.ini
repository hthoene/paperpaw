diagnostics.plugin.description = Sgrin brofi a gwiriad dan arweiniad o bob rhan o ddyfais.
diagnostics.plugin.how = "Mae Diagnosteg yn sgrin brofi ar gyfer gwirio dyfais: mae'n dangos pob lefel llwyd y gall y panel ei dangos, pedwar blwch i roi cynnig ar y botymau a'r cyffwrdd, a chownter tudalennau gyda bar cynnydd i gymharu'r moddau adnewyddu.\n\nNid oes gan y sgrin brofi gofnod dewislen. Dim ond y sgrin gartref ydyw tra nad oes ategyn arall yn cynnig un, neu pan fyddwch yn ei dewis o dan Sgriniau yn rheolwr yr ategion ar gyfer y lle Sgrin gartref.\n\nMae Dewis yn marcio'r blwch â ffocws, ac mae'r botymau saeth yn symud rhwng y blychau; gyda chyffwrdd, tapiwch flwch. Mae botymau'r dudalen yn troi'r tudalennau prawf. Daliwch Dewis, neu ddal bys ar y sgrin, i ddechrau eto.\n\nMae'r gwiriad dyfais, o dan Offer lle mae PaperPaw yn gadarnwedd y ddyfais, yn mynd drwy bob rhan o ddyfais un dudalen ar y tro: y sgrin, botymau, cyffwrdd, golau blaen, batri, cerdyn, cloc, Wi-Fi, cwsg a chof. Mae pob tudalen yn gorffen â Methu, Hepgor a Phasio, a'r ateb y mae ei fesuriadau'n ei awgrymu wedi'i ddewis; hepgorir rhannau nad oes gan ddyfais. Ar ôl pob ateb mae'n ysgrifennu adroddiad i .paperpaw/plugins/diagnostics/device-check.txt, i'w ludo mewn cais tynnu. Mae Yn ôl yn ei adael, ac mae'n mynd ymlaen o'r lle'r oedd pan agorir eto. Ar ddyfais â botymau'n unig, dewiswch Dechrau ar dudalen y botymau yn gyntaf; tan hynny mae'r saethau, Dewis ac Yn ôl yn gweithio fel ar bob tudalen."
