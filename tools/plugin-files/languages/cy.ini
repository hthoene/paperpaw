bluetooth.plugin.description = Yn paru rheolyddion o bell, bysellfyrddau a synwyryddion, ac yn eu cysylltu.
bluetooth.plugin.how = "Mae Bluetooth yn paru rheolyddion o bell, bysellfyrddau a synwyryddion â'r darllenydd, lle mae ganddo Bluetooth (yr X4 Pro).\n\nMae Ychwanegu dyfais yn chwilio am yr hyn sydd o fewn cyrraedd; rhowch y ddyfais yn y modd paru yn gyntaf. Dewiswch hi, a chadarnhewch ar y darllenydd (cymharwch y rhif lle mae un yn ymddangos). Wedyn mae bysellau rheolydd o bell neu fysellfwrdd yn troi tudalennau ac yn symud drwy ddewislenni; newidiwch beth mae pob bysell yn ei wneud o dan Rheolyddion.\n\nMae Rheolyddion o bell yn dweud pryd mae eu bysellau'n gweithio: pan fyddant wedi'u troi ymlaen yma, wrth ddarllen (wedi'u cysylltu tra bo llyfr ar agor, gan arbed batri), neu bob amser. Mae'r botwm dewislen neu wasg hir ar ddyfais yn ei hanghofio.\n\nMae synhwyrydd ar gyfer ategion: trowch ymlaen pa ategyn a gaiff ei ddefnyddio. Mae Bluetooth i ffwrdd pryd bynnag nad oes dim yn ei ddefnyddio."
