vocabulary.plugin.description = Yn cadw'r geiriau rydych yn chwilio amdanynt, gyda'u brawddegau, ac yn adolygu cardiau fflach gydag ailadrodd bylchog, wedi'u gwneud ar eich ffôn.
vocabulary.plugin.how = "Mae Geirfa yn cadw'r geiriau rydych yn chwilio amdanynt wrth ddarllen, pob un gyda'i frawddeg, i fynd drostynt yn nes ymlaen. Cewch hyd i'r rhestr yn Offer, y newyddaf yn gyntaf; dewiswch air i chwilio amdano eto. Mae'r rhes olaf, Allforio, yn eu cadw ar gyfer apiau cardiau fflach fel Anki. Mae'r rhestr yn cadw'r 2,000 gair diweddaraf: tu hwnt i hynny, mae'r hynaf yn mynd, felly allforiwch hwy yn gyntaf i'w cadw i gyd.\n\nMae Cardiau fflach, hefyd yn Offer, yn eich holi gydag ailadrodd bylchog: ar ôl Dangos yr ateb rydych yn graddio pob cerdyn Eto, Anodd, Da neu Hawdd, ac mae hynny'n penderfynu pryd mae'n dod yn ôl. Gwnewch becynnau gyda Golygu gyda'ch ffôn: sganiwch y cod gyda ffôn yn yr un Wi-Fi, yna teipiwch gardiau neu ychwanegwch lawer ar unwaith: agorwch becyn yno, dewiswch Llawer o gardiau ar unwaith a dewiswch ffeil CSV, TSV neu TXT (cerdyn ar bob llinell: blaen, cefn, enghraifft; UTF-8), gludwch restr, neu dewch â phecyn Anki (.apkg, wedi'i allforio gyda Support older Anki versions). \n\nNeu defnyddiwch ffeiliau ar y cerdyn SD: rhowch ffeil CSV, TSV neu TXT, neu becyn Anki (.apkg, wedi'i allforio gyda Support older Anki versions), ar gyfer pob pecyn yn y ffolder Flashcards (mae Spanish.tsv yn gwneud y pecyn Spanish; un cerdyn ar bob llinell: blaen, cefn, enghraifft; wedi'i gadw fel UTF-8; gall y llinell gyntaf enwi'r colofnau front, back, example). Dewiswch Cardiau ar y cerdyn SD yn Cardiau fflach, neu gadewch iddo ddigwydd pan fyddwch yn agor Cardiau fflach. Mae'r pecynnau'n aros ar y darllenydd gyda'r hyn a ddysgoch, ac mae ffeil yn cael ei huno â'i phecyn pryd bynnag y bydd yn newydd neu wedi newid: newidiwch gefn neu enghraifft cerdyn yn y ffeil ac mae'r cerdyn yn newid ac yn cadw ei gynnydd; newidiwch destun y blaen ac mae'n cyfrif fel cerdyn newydd, mae'r hen un yn dechrau o'r newydd (gwahaniaethir rhwng cardiau gan destun y blaen; nid yw bylchau a phriflythrennau'n cyfrif); nid yw llinell a ddilëwch yn dileu'r cerdyn (oni osodwch “cardiau sydd ar goll o'r ffeil” i Tynnu ar gyfer y pecyn hwnnw: yna caiff y cerdyn ei dynnu yn y diweddariad nesaf gyda'i gynnydd, am byth, ac ni thynnir dim tra bo rhyw linell o'r ffeil na ellir ei darllen). Cadwch becyn i'w ffeil gyda Cadw ar y cerdyn: mae'r ffeil yn cael rhifau'r cardiau (y golofn id), felly gallwch olygu blaenau ar gyfrifiadur ac mae'r cardiau'n cadw'r hyn a ddysgoch; mae'r ffeil yn cadw id, blaen, cefn ac enghraifft yn unig (ni chedwir colofnau eraill, sylwadau na threfn y llinellau), a gwrthodir cadw tra bo rhyw linell o'r ffeil na ellid ei darllen; copïir y ffeil a oedd yno i _name.bak.tsv y tro cyntaf (nid yw cadw diweddarach yn disodli'r copi hwnnw). Ni ddarllenir ffeil dros 4 MiB neu 20,000 o linellau, a rhaid ei chadw fel CSV UTF-8, nid UTF-16. Y tro cyntaf, mae'r darllenydd yn gwneud y ffolder gyda nodyn ar sut mae'n gweithio.\n\nYn y gosodiadau, o dan Darllen, mae Geiriau y chwilir amdanynt yn dod yn gardiau yn rhoi pob gair y chwilir amdano yn y pecyn Looked up."
