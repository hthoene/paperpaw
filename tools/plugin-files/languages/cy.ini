fonts-browser.plugin.name = Rhagor o ffontiau
fonts-browser.plugin.description = Yn dangos ffontiau o'r rhyngrwyd, pob un gyda sampl, ac yn eu lawrlwytho i ddarllen gyda nhw.
fonts-browser.plugin.how = "Mae Rhagor o ffontiau yn rhestru ffontiau o lyfrgell ffontiau ar y rhyngrwyd, pob enw wedi'i osod yn ei ffont ei hun, ac yn lawrlwytho'r rhai rydych eu heisiau i ddarllen gyda nhw.\n\nCewch hyd iddo ar ddiwedd y rhestr o ffontiau lle dewisir y ffont darllen, yn y Gosodiadau, o dan Darllen, fel Ffont; mae gan y llinellau statws yr un cofnod ar gyfer eu ffont. Tapiwch ffont (gyda botymau, pwyswch Dewis) i'w weld yn fwy gyda brawddeg sampl, yna dewiswch Lawrlwytho. Gallwch adael y dudalen tra bo'n lawrlwytho. Pan fydd wedi gorffen, dewiswch Darllen gyda (enw'r ffont), neu Defnyddio ar gyfer y llinellau statws. Mae Diweddaru yn nôl fersiwn newyddach, mae Tynnu yn dileu'r ffont o'r ddyfais.\n\nMae angen Wi-Fi arno.\n\nEICH FFONTIAU EICH HUN\n\nWrth ochr Rhagor o ffontiau, mae gan yr un rhestr Eich ffontiau eich hun, sy'n dangos y rhan hon o'r cymorth. Ffeil .ttf neu .otf yw ffont eich hun, er enghraifft o Google Fonts.\n\nAr Android a dyfeisiau eraill sy'n tynnu ffeiliau ffont: copïwch y ffeil i'r ffolder ffontiau (ar Android: PaperPaw/fonts yn y storfa a rennir), ailgychwynnwch PaperPaw a dewiswch y ffont yn y Gosodiadau, o dan Darllen, fel Ffont.\n\nAr yr Xteink X4 ac X4 Pro: mae'r darllenwyr hyn yn darllen pecynnau ffont, nid ffeiliau ffont, oherwydd ni fyddai ffeiliau ffont yn ffitio yn eu cof. Gwnewch becyn ar gyfrifiadur gyda paperpaw-fontgen, ar gyfer pob arddull sydd gennych (mae angen yr un arferol):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nMae hyn yn gwneud y ffolder plugins/font-my-font. Copïwch hi i'r ffolder plugins ar y cerdyn cof, ailgychwynnwch, a dewiswch My Font fel Ffont. Mae pecyn o un arddull tua hanner megabeit ar gyfer llythrennau Lladin; tynnir arddulliau a adawoch allan yn yr un arferol. Mae'r offeryn yn dweud faint o'r llythrennau y gofynnwch amdanynt sydd gan y ffont (mae --chars latin,cyrillic,greek yn ychwanegu sgriptiau): ni all ffont heb lythrennau eich llyfr eu dangos, felly chwiliwch am un sy'n cwmpasu ei sgript.\n\nMae ffontiau o Rhagor o ffontiau yn gweithio yn yr un ffordd ac nid oes angen cyfrifiadur arnynt.\n\nAr gyfer testun bach craffach ar y panel e-inc, ychwanegwch --hinting light at y gorchymyn: mae'n ffitio'r llythrennau i'r grid picseli, fel y gwneir y ffontiau diofyn. Hebddo tynnir y llythrennau fel y dyluniodd y ffont hwy; mae --hinting normal a --hinting mono yn eu ffitio'n gryfach. Mae'n well gadael ffontiau â marciau, fel Arabeg neu Devanagari, hebddo."
