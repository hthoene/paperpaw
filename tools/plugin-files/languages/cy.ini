lock.plugin.name = Clo sgrin
lock.plugin.description = PIN, patrwm neu gyfrinair pan fydd y ddyfais yn deffro; cyffwrdd wedi'i gloi wrth ddarllen.
lock.plugin.how = "Mae'r clo sgrin yn gofyn am PIN, patrwm neu gyfrinair pan fydd PaperPaw yn cychwyn a phan fydd y ddyfais yn deffro. Mae i ffwrdd i ddechrau. Mae'n cadw defnydd achlysurol allan yn unig: cedwir y cod a nifer y ceisiadau anghywir ar y cerdyn SD, felly mae pwy bynnag sy'n tynnu'r cerdyn allan, ei olygu neu ei gyfnewid yn mynd heibio'r clo.\n\nGosodwch ef yn y gosodiadau, o dan Dyfais, Clo sgrin: rhowch y cod cyfredol os oes un, dewiswch y math, yna'r cod newydd ddwywaith. Cynigir patrwm ar sgriniau cyffwrdd yn unig.\n\nAr ôl pum cynnig anghywir mae'r nesaf yn aros hanner munud. Mae Cloi nawr yn cloi ar unwaith a gellir ei roi ar fotwm, ystum neu reol. Gellir diffodd Cloi ar ôl deffro, fel mai dim ond cychwyn go iawn (pŵer ymlaen neu ailgychwyn) sy'n cloi, ac eithrio lle mae pob deffro yn gychwyn, fel ar yr X4 ar fatri.\n\nClo cyffwrdd, wrth ei ochr: mae Cloi cyffwrdd yn y panel cyflym a'r ddewislen ddarllen yn gwneud i dapiau, llusgiadau a'r ysgrifbin wneud dim tra bo'r botymau'n dal i weithio, e.e. i ddarllen â llaw ar y sgrin. I ddatgloi, tapiwch ddwywaith ag un bys a'i gadw i lawr am eiliad; mae dal y botwm pŵer yn agor y ddewislen Pŵer, lle mae Datgloi cyffwrdd yn ei wneud gyda'r botymau; ar yr X4 Pro, mae dal y fysell cartref yn datgloi ar unwaith."
