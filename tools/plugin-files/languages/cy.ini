vocabulary.sd.readme = "Cardiau fflach o ffeiliau\n\nRhowch ffeil yma ar gyfer pob pecyn: mae Spanish.tsv yn gwneud y pecyn Spanish.\nFfeiliau: .tsv, .csv neu .txt, wedi'u cadw fel UTF-8, neu .apkg: pecyn Anki, wedi'i allforio gyda Support older Anki versions wedi'i dicio. Mae tri maes cyntaf ei nodiadau yn dod yn flaen, cefn ac enghraifft; ni ddarllenir ei amserlennu na'i gyfryngau, ac nid yw PaperPaw byth yn ysgrifennu ffeil Anki.\n\nUn cerdyn ar bob llinell: blaen, cefn ac enghraifft (dewisol), wedi'u gwahanu â thab, coma neu hanner colon. Gall y llinell gyntaf enwi'r colofnau: front, back, example. Enghraifft:\n\nCath\tcat\tMae'r gath yn cysgu.\n\nYna agorwch Cardiau fflach ar y darllenydd, dewiswch Cardiau ar y cerdyn SD ac yna Diweddaru'r pecynnau o'r cerdyn.\n\nDa gwybod:\n- Mae'r pecynnau'n aros ar y darllenydd, gyda'r hyn a ddysgoch. Darllenir ffeil pan fydd yn newydd neu wedi newid, ac ychwanegir ei chardiau at y pecyn neu eu newid yno.\n- Newidiwch gefn neu enghraifft cerdyn yn y ffeil: mae'r cerdyn yn newid ac yn cadw eich cynnydd.\n- Newidiwch destun blaen cerdyn: mae'n cyfrif fel cerdyn newydd, ac mae'r hen un yn dechrau o'r newydd. Mae cardiau'n cael eu paru yn ôl testun y blaen; nid yw bylchau a phriflythrennau'n cyfrif. Cadwch becyn i ffeil (Cardiau ar y cerdyn SD, Cadw'r pecyn ar y cerdyn) ac mae gan bob cerdyn rif yn y golofn id: newidiwch flaen yno, cadwch ddwy linell gyntaf y ffeil fel y maent, ac mae'r cerdyn yn cadw'r hyn a ddysgoch.\n- Mae cadw yn ysgrifennu cardiau'r pecyn. Ni chedwir yr hyn a oedd yn y ffeil ac nad yw'n gerdyn (llinell heb flaen); copïir y ffeil a oedd yno i _name.bak.tsv.\n- Cadwch y ffeil fel CSV UTF-8 (nid UTF-16, nid fformat ei hun taenlen). Ni ddarllenir ffeil dros 4 MiB neu 20,000 o linellau: rhannwch hi.\n- Nid yw llinell a ddilëwch yn y ffeil yn dileu'r cerdyn yn y pecyn, oni throwch Tynnu cardiau coll ymlaen ar gyfer y pecyn hwnnw. Yna mae'r cerdyn yn mynd gyda'r hyn a ddysgoch.\n- Ni ddarllenir ffeiliau y mae eu henwau'n dechrau â _.\n"
