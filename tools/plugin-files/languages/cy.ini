aids.plugin.name = Cymhorthion darllen
aids.plugin.description = Dechreuadau geiriau mewn print trwm, geiriau wedi'u hamnewid, lluniau: testun fel y mynnwch.
aids.plugin.how = "Mae cymhorthion darllen yn newid sut mae testun llyfr yn edrych wrth i chi ddarllen. Maent yn berthnasol i bob llyfr. Mae Dechreuadau geiriau trwm ac Amnewid geiriau i ffwrdd i ddechrau.\n\nCewch hyd iddynt yn y Gosodiadau, o dan Darllen, yn yr adran Cymhorthion darllen. Mae Dechreuadau geiriau trwm yn gosod hanner cyntaf pob gair mewn print trwm, y mae rhai pobl yn ei chael yn haws ei ddilyn. Mae Amnewid geiriau yn cymryd parau wedi'u hysgrifennu fel \"colour = color; Mr. = Mister\", wedi'u gwahanu gan hanner colonau.\n\nDim ond geiriau cyfan a amnewidir, yn union fel yr ysgrifennoch chi nhw, felly ni fydd \"color\" byth yn newid rhan o air hirach. Nid yw ffeil y llyfr ei hun yn cael ei newid.\n\nGellir dangos lluniau mewn llyfrau (fel ar y dechrau), eu troi'n llinell fer fel \"[Llun: llong ar y môr]\" sy'n defnyddio disgrifiad y llun, neu eu gadael allan. Mae gan dudalen fwy o le i destun wedyn, ac nid oes dim yn cael ei ddadgodio ar gyfer llun nas dangosir, sy'n gwneud i dudalennau droi'n gyflymach. Nid yw comics a llyfrau eraill sydd wedi'u gwneud o luniau yn cael eu newid."
