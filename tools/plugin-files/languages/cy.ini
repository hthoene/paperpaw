weather.plugin.name = Tywydd
weather.plugin.description = Y tywydd nawr a'r dyddiau nesaf fel teclynnau, o Open-Meteo.
weather.plugin.how = "Mae Tywydd yn dangos y tywydd nawr a'r dyddiau nesaf fel teclynnau ar gyfer y sgrin gartref, o Open-Meteo, nad oes angen cyfrif nac allwedd arno. Mae Tywydd nawr yn dangos y tymheredd, y cyflwr a mwy i ddewis ohonynt; mae Rhagolwg yn dangos y dyddiau nesaf mewn rhes neu restr.\n\nDewiswch le yn gyntaf: yn y gosodiadau, o dan Tywydd, Lle (teipiwch enw, yna dewiswch ef o'r lleoedd a ganfuwyd). Dim ond ei gyfesurynnau a anfonir, a dim ond tra bo teclyn tywydd yn cael ei ddangos. Ychwanegwch y teclynnau drwy olygu'r sgrin gartref.\n\nNôlir y tywydd mor aml ag y mae Diweddaru bob … ar y mwyaf yn ei ddweud, a dim ond tra bo rhwydwaith: nid yw byth yn troi Wi-Fi ymlaen ohono'i hun.\n\nData tywydd gan Open-Meteo.com (https://open-meteo.com), o dan drwydded Creative Commons Attribution 4.0 (CC BY 4.0)."
