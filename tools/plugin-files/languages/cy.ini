menu.empty = Does gan y ddewislen hon ddim cofnodion.
menu.setting.style = Dewislenni
menu.style.list = Rhestr
menu.style.tiles = Teils
menu.setting.style.help = Dewislenni fel rhestr, neu fel teils gyda'u heiconau ar frig y sgrin.
menu.help.panel = Y panel cyflym: yr hyn rydych yn ei newid yn aml, fel y golau a'r modd nos.
menu.help.panel-tap = Tapiwch fotwm i'w newid.
menu.help.panel-close = Tapiwch y tu allan iddo i'w gau.
menu.help.panel-buttons = Y botymau saeth: dewis. Dewis: newid. Yn ôl: cau.
menu-editor.plugin.name = Golygydd dewislenni
menu-editor.plugin.description = Yn aildrefnu, yn tynnu ac yn ychwanegu cofnodion pob dewislen.
menu-editor.plugin.how = "Mae'r golygydd dewislenni yn newid yr hyn y mae'r dewislenni'n ei gynnwys: symudwch gofnodion i fyny neu i lawr, tynnwch hwy, neu ychwanegwch rai newydd.\n\nCewch hyd iddo yn y Gosodiadau o dan Addasu, fel Addasu dewislenni. Dewiswch ddewislen, yna cofnod i'w symud neu ei dynnu; mae Ychwanegu cofnod yn rhoi un newydd i mewn. Mae newidiadau'n berthnasol ar unwaith. Mae Ailosod y ddewislen hon yn dychwelyd dewislen i'r ffordd y mae ei hategion yn ei diffinio, mae Ailosod pob dewislen yn gwneud hynny ar gyfer pob un.\n\nNi allwch gloi eich hun allan: mae cofnod sy'n ffordd at y gosodiadau yn aros nes i chi ychwanegu ffordd arall atynt."
