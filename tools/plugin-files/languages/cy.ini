settings.plugin.name = Gosodiadau
settings.plugin.description = Tudalennau'r gosodiadau, wedi'u hadeiladu o osodiadau pob ategyn.
settings.plugin.how = "Mae Gosodiadau yn dangos popeth y gellir ei osod yn PaperPaw a'i ategion, mewn tudalennau. Does dim angen sgrin eu hunain ar ategion: mae'r hyn y maent yn ei ddatgan yn ymddangos yma, mewn grwpiau, gyda disgrifiad pob gosodiad oddi tano.\n\nAgorwch ef gyda Gosodiadau yn y ddewislen. Tapiwch grŵp i'w agor, yna gosodiad i'w droi neu ei ddewis; mae gan rifau fotymau − a +. Gyda botymau, ewch at osodiad a gwasgwch Dewis: mae chwith a de yn newid rhif, mae Dewis yn ei gadw, mae Yn ôl yn dychwelyd i'r gwerth cynharach.\n\nMae newidiadau'n berthnasol ar unwaith. Mae Chwilio yn dod o hyd i osodiad yn ôl geiriau ac mae Gosodiadau uwch yn ychwanegu'r rhai sydd eu hangen yn anaml. Mae Ailosod i'r rhagosodiadau ac Ailosod y cyfan yn gofyn yn gyntaf."
