format-cbz.plugin.name = Llyfrau comig
format-cbz.plugin.description = Yn agor archifau llyfrau comig (.cbz), llun y dudalen.
format-cbz.plugin.how = "Yn agor archifau llyfrau comig (.cbz): llun y dudalen, wedi'i ffitio i'r sgrin, yn nhrefn eu henwau (2 cyn 10).\n\nRhowch hwy yn ffolder y llyfrgell a'u hagor o'r llyfrgell; trowch y tudalennau fel mewn unrhyw lyfr. Mae lluniau mawr yn cymryd eiliad y tro cyntaf, ar yr X4 yn fwy nag mewn mannau eraill.\n\nGosodiadau darllen (Gosodiadau, Darllen): mae \"Panel wrth banel\" yn dangos un panel o dudalen ar y tro, mor fawr ag y mae'r sgrin yn ei ganiatáu, ac mae troi'r tudalennau yn camu drwyddynt; dangosir tudalen heb baneli yn gyfan. Mae \"Cyfeiriad tudalennau comig\" yn adlewyrchu troi'r tudalennau ar gyfer manga (o'r dde i'r chwith); mae ComicInfo.xml y llyfr ei hun yn dweud hynny ohono'i hun. Mae'r llyfrgell yn dangos teitl llyfr a'i gyfres a'i rif o ComicInfo.xml."
format-cbz.title = Llyfr comig (CBZ)
format-cbz.setting.direction = Cyfeiriad tudalennau comig
format-cbz.setting.direction.help = Manga: mae troi'r tudalennau wedi'i adlewyrchu.
format-cbz.direction.book = Fel y mae'r llyfr yn ei ddweud
format-cbz.direction.ltr = Chwith i dde
format-cbz.direction.rtl = De i chwith
format-cbz.setting.panels = Panel wrth banel
format-cbz.setting.panels.help = Un panel ar y tro, mae troi'r tudalennau yn camu drwyddynt.
format-docx.plugin.name = Dogfennau DOCX
format-docx.plugin.description = Yn agor ffeiliau .docx, fel y'u cedwir gan Word a rhaglenni eraill.
format-docx.plugin.how = "Yn agor dogfennau .docx fel llyfrau: penawdau gyda thabl cynnwys, rhestrau, tablau, print trwm ac italig, dolenni a lluniau (JPEG, PNG, GIF).\n\nRhowch y ffeiliau yn ffolder y llyfrgell a'u hagor o'r llyfrgell. Daw'r teitl a'r awdur o briodweddau'r ddogfen. Ni ddangosir troednodiadau, penynnau a throedynnau, na sylwadau."
format-docx.title = Dogfen DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Yn agor llyfrau EPUB gyda'u harddulliau, eu tabl cynnwys a'u lluniau.
format-epub.plugin.how = "Mae llyfrau EPUB yn agor o'r llyfrgell fel unrhyw lyfr arall, gyda'u tabl cynnwys, eu lluniau ac arddull y cyhoeddwr. Mae tudalennau gwe (HTML), Markdown, FictionBook (.fb2) ac archifau llyfrau comig (.cbz) yn agor yn yr un ffordd, pob un fel ategyn ei hun.\n\nTrosir pennod y tro cyntaf yr agorwch hi a'i chadw yn storfa dros dro'r ategyn, felly mae'n gyflymach wedyn ac mae llyfrau mawr yn gweithio ar ddyfeisiau bach. Cewch hyd i'r tabl cynnwys o dan Cynnwys yn y ddewislen ddarllen. Y gosodiad Fformatio'r cyhoeddwr, o dan Darllen, sy'n penderfynu a yw arddull y llyfr ei hun yn berthnasol."
format-epub.title = E-lyfr EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Yn agor llyfrau FictionBook (.fb2, hefyd wedi'u zipio).
format-fb2.plugin.how = "Yn agor llyfrau FictionBook (.fb2), cyffredin ar gyfer llyfrau Rwsieg ac eraill, hefyd wedi'u zipio (.fb2.zip), gyda'u teitl, eu hawduron, eu clawr a'u penodau.\n\nRhowch hwy yn ffolder y llyfrgell; maent yn ymddangos yn y llyfrgell ac yn agor fel unrhyw lyfr arall."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Yn agor tudalennau gwe a gadwyd fel ffeiliau, gan ddangos dim ond yr hyn sydd i'w ddarllen.
format-html.plugin.how = "Yn agor tudalennau gwe a gadwyd fel ffeiliau (.html, .htm, .xhtml) fel llyfrau: dim ond yr hyn sydd yno i'w ddarllen, heb ddewislenni, hysbysebion a'u tebyg o'i gwmpas.\n\nRhowch y ffeil yn ffolder y llyfrgell a'i hagor o'r llyfrgell fel unrhyw lyfr. Mae dolenni o fewn y dudalen yn gweithio; mae lluniau'n ymddangos lle maent yn y ffeil."
format-html.title = Tudalen we (HTML)
format-images.plugin.name = Lluniau
format-images.plugin.description = Yn agor lluniau (.jpg, .png, .gif) fel llyfrau, tudalen yr un.
format-images.plugin.how = "Mae lluniau (.jpg, .png, .gif) yn agor o'r llyfrgell fel llyfrau, un llun i dudalen, wedi'u ffitio i'r sgrin.\n\nI ddarllen ffolder gyfan o luniau, agorwch ei llun cyntaf: mae'r lluniau ar ei ôl yn y ffolder yn dilyn, yn nhrefn eu henwau (2 cyn 10). Mae llun diweddarach yn y ffolder yn dechrau yno; cofir y safle ym mhob un ar wahân. Darllenir ffolder o hyd at 300 o luniau o'r un yr agorwch.\n\nMae ffeil nad yw'n llun, neu sy'n rhy fawr, yn dangos ei henw yn lle hynny. Ar gyfer llyfr o lawer o luniau gyda'i deitl ei hun, archif llyfr comig (.cbz) yw'r ffurf orau."
format-images.title = Llun
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Yn agor ffeiliau Markdown (.md), e.e. nodiadau.
format-markdown.plugin.how = "Yn agor ffeiliau Markdown (.md), fel nodiadau, fel llyfrau: penawdau, rhestrau, dyfyniadau a phwyslais fel y bwriadwyd, nid fel arwyddion.\n\nRhowch y ffeiliau yn ffolder y llyfrgell a'u hagor o'r llyfrgell. Y pennawd cyntaf yw ei deitl; mae lluniau wrth ochr y ffeil yn ymddangos lle mae'r testun yn eu henwi."
format-markdown.title = Markdown
format-mobi.plugin.name = Llyfrau MOBI
format-mobi.plugin.description = Yn agor ffeiliau .mobi ac .azw heb DRM.
format-mobi.plugin.how = "Mae llyfrau MOBI (.mobi, .azw) yn agor o'r llyfrgell fel unrhyw lyfr, heb ddim i'w osod. Daw'r teitl, yr awduron, yr iaith a'r clawr o'r llyfr, a gwneir y rhestr cynnwys o'i benawdau.\n\nTrosir y llyfr y tro cyntaf yr agorwch ef, sy'n cymryd ychydig eiliadau ar gyfer un hir; wedyn mae'n agor ar unwaith. Dangosir testun, penawdau, print trwm ac italig, dolenni a lluniau.\n\nNi ellir agor llyfrau â DRM (y rhan fwyaf o lyfrau a brynir o siop), na llyfrau â chywasgu Huffman nac yn y ffurf KF8 newyddach (.azw3): mae PaperPaw yn dweud hynny pan fyddwch yn eu hagor. Mae copi fel EPUB, a wneir gydag offeryn fel Calibre, bob amser yn agor."
format-mobi.title = Llyfrau MOBI
format-rtf.plugin.name = Dogfennau RTF
format-rtf.plugin.description = Yn agor ffeiliau .rtf fel llyfrau.
format-rtf.title = Dogfennau RTF
format-txt.plugin.name = Testun plaen
format-txt.plugin.description = Yn agor ffeiliau testun plaen (.txt).
format-txt.plugin.how = "Mae ffeiliau testun plaen (.txt) yn agor o'r llyfrgell fel unrhyw lyfr, heb ddim i'w osod. Mae'r ategyn yn darllen testun UTF-8, UTF-16 a Windows-1252 ac yn canfod y codiad ei hun.\n\nMae paragraffau'n dilyn y llinellau gwag yn y ffeil; os nad oes rhai mewn ffeil, mae pob llinell yn baragraff. Mewn ffeiliau Project Gutenberg gadewir testun y drwydded ar y dechrau ac ar y diwedd allan, a chymerir y teitl a'r awdur o'r pennyn.\n\nNid yw'r ffeil byth yn cael ei llwytho'n gyfan, felly mae testunau mawr iawn yn agor ar ddyfeisiau bach hefyd."
format-txt.title = Testun plaen
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Yn agor llyfrau XTC ac XTCH, tudalennau wedi'u rendro ymlaen llaw darllenwyr Xteink.
format-xtc.plugin.how = "Llyfrau yw ffeiliau XTC ac XTCH y mae eu tudalennau eisoes wedi'u rendro fel lluniau, fel y'u gwneir gan drawsnewidwyr ar gyfer darllenwyr Xteink. Maent yn agor o'r llyfrgell fel unrhyw lyfr.\n\nOherwydd bod pob tudalen yn llun sefydlog, ni ellir newid maint y testun na'i osod mewn ffont arall. Mae tudalennau'n ddu a gwyn neu mae ganddynt bedwar arlliw llwyd. Dadgodir pob tudalen pan gaiff ei dangos, felly mae angen ychydig o gof, hefyd ar yr X4.\n\nCymerir y teitl, yr awdur a'r penodau o'r ffeil pan fydd ganddi nhw."
format-xtc.title = Tudalennau XTC
help.plugin.name = Awgrymiadau
help.plugin.description = Yn dangos beth mae rheolyddion sgrin yn ei wneud, y tro cyntaf y mae'n agor.
help.plugin.how = "Y tro cyntaf y mae sgrin yn agor, mae nodyn byr drosti yn dweud beth mae ei rheolyddion yn ei wneud: y rhannau o'r sgrin y mae tap yn mynd iddynt, mewn ffrâm, a beth mae'r botymau'n ei wneud.\n\nMae tap neu unrhyw fotwm yn cau'r nodyn, ac nid yw'n dod eto ar gyfer y sgrin honno. Mae Dim rhagor o awgrymiadau yn eu diffodd i gyd.\n\nYn y gosodiadau, o dan System, mae Awgrymiadau yn eu troi ymlaen neu i ffwrdd, ac mae Dangos awgrymiadau eto yn dangos nodyn pob sgrin unwaith eto."
help.title = Sut mae'n gweithio yma
help.got-it = Deall
help.no-more = Dim rhagor o awgrymiadau
help.section = Awgrymiadau
help.setting.show = Awgrymiadau
help.setting.show.help = Y tro cyntaf y mae sgrin yn agor, mae nodyn byr yn dweud beth mae ei rheolyddion yn ei wneud.
help.setting.again = Dangos awgrymiadau eto
help.setting.again.help = Dangosir awgrymiadau pob sgrin unwaith eto, y tro nesaf y bydd yn agor.
