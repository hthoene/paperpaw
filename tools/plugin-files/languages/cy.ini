stats.plugin.name = Ystadegau darllen
stats.plugin.description = Yn cofnodi am ba hyd a faint rydych yn darllen, gyda chalendr a rhifau pob llyfr.
stats.plugin.how = "Mae Ystadegau darllen yn cofnodi am ba hyd rydych yn darllen pob tudalen. Fe'i gwelwch fel trosolwg gyda heddiw, yr wythnos a'ch rhediad, fel calendr, a gyda rhifau pob llyfr.\n\nAgorwch ef o Offer, neu o Rhagor yn y darllenydd. Yn y gosodiadau, o dan Ystadegau darllen, gallwch ddiffodd Cofnodi darllen, gosod Nod dyddiol, a gosod y Dudalen fyrraf a'r Dudalen hiraf sy'n cyfrif, fel nad yw bodio drwodd na llyfr a adawyd ar agor yn gwyro'r rhifau.\n\nMae Cysoni â KOReader yn rhannu'r ystadegau gyda KOReader drwy ffolder WebDAV. Mae hefyd yn cymryd ystadegau KOReader ar yr un ddyfais i mewn. Mae cofnodi angen i'r cloc fod wedi'i osod: lle nad yw, cysylltwch â Wi-Fi unwaith."
