file-manager.plugin.name = Rheolwr ffeiliau
file-manager.plugin.description = Pob ffolder a ffeil ar y ddyfais: eu hagor, eu hailenwi, eu symud, eu copïo a'u dileu.
file-manager.plugin.how = "Mae'r rheolwr ffeiliau yn dangos pob ffolder a ffeil ar storfa'r ddyfais, nid eich llyfrau yn unig, ac yn gadael i chi eu hagor, eu hailenwi, eu symud, eu copïo a'u dileu a gwneud ffolderi newydd.\n\nAgorwch Ffeiliau o'r ddewislen Offer. Tapiwch ffolder i fynd i mewn iddi; mae Yn ôl yn mynd i'r ffolder uwchben. Tapiwch ffeil, neu daliwch unrhyw gofnod (gyda botymau, daliwch Dewis), i weld beth y gellir ei wneud â hi. Mae Symud a Chopïo yn dewis y cofnod: ewch i'r ffolder y mae'n perthyn ynddi a dewiswch Gludo yma yn y bar ar y gwaelod. Gyda botymau, pwyswch I lawr o'r cofnod olaf i gyrraedd y bar.\n\nMae ffeiliau a ffolderi sy'n dechrau â dot, fel data PaperPaw ei hun, wedi'u cuddio. I'w gweld, trowch Ffeiliau cudd ymlaen yn y Gosodiadau, o dan Llyfrgell."
