power.plugin.name = Pŵer
power.plugin.description = Yn dewis y modd pŵer, â llaw neu yn ôl y batri: Arferol, Arbed, All-lein.
power.plugin.how = "Mae Pŵer yn dewis sut mae PaperPaw yn gwario'r batri: Arferol, Arbed neu All-lein. Mae Arbed yn gwneud yr hyn y gall aros ar adegau gwell; mae All-lein yn cadw'r radio i ffwrdd. Mae Awto yn dewis yn ôl y batri.\n\nNewidiwch y modd yn y panel cyflym, lle mae Pŵer yn dangos y moddau ochr yn ochr, neu yn y Gosodiadau o dan Pŵer. Yno hefyd rydych yn gosod y lefelau y mae Awto yn newid i Arbed ac i All-lein, a pha un a yw'n aros yn Arferol wrth wefru.\n\nYn y llinellau statws, mae Modd pŵer yn dangos deilen wrth arbed a Wi-Fi wedi'i groesi allan tra bo'n all-lein, a dim byd yn Arferol.\n\nDaliwch y botwm pŵer i agor dewislen fach: Cwsg, Diffodd (lle gall PaperPaw), Ailgychwyn, ac ar ddyfeisiau cyffwrdd Cloi cyffwrdd neu Ddatgloi cyffwrdd. Mae gwasg fer yn dal i roi'r ddyfais i gysgu. Mae Yn ôl yn gadael y ddewislen."
