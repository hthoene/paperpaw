pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Amserydd ffocws gyda rowndiau gwaith ac egwyl, teclynnau a chyfrif dyddiol.
pomodoro.plugin.how = "Amserydd Pomodoro: gweithiwch mewn rowndiau â ffocws, yna gorffwyswch. Does dim angen ei osod: 25 munud o ffocws, 5 o orffwys, ac ar ôl pedair rownd egwyl hir o 15.\n\nAgorwch Pomodoro o'r ddewislen offer a gwasgwch Dechrau, neu ychwanegwch ei declynnau at y sgrin gartref (daliwch y sgrin gartref, yna ychwanegwch declyn): mae Amserydd Pomodoro yn dangos y cyfnod a'r munudau sy'n weddill, mae Pomodoro dechrau/seibiant yn fotwm, ac mae Pomodoro heddiw yn cyfrif y rowndiau a orffennoch, gyda'ch nod dyddiol. Mae tap ar yr amserydd yn ei ddechrau neu'n ei seibio; daliwch ef i agor y sgrin lawn.\n\nMae'r amserydd yn dal i redeg pan fyddwch yn gadael y sgrin, ac yn mynd ymlaen yn ôl y cloc ar ôl ailgychwyn. Tra bo'r darllenydd yn cysgu nid oes dim yn rhedeg: dywedir wrthych am gyfnod a ddaeth i ben yn y cyfamser pan fydd yn deffro. Mae hysbysiad yn dweud wrthych pan fydd cyfnod ar ben. I arbed batri mae'r cloc yn diweddaru unwaith y funud (bob deg eiliad yn y funud olaf ar y sgrin lawn) ac nid yw byth yn cadw'r darllenydd yn effro.\n\nO dan Pomodoro yn y gosodiadau rydych yn gosod hyd y cyfnodau a rowndiau set, a pha un a yw'r cyfnod nesaf yn dechrau ohono'i hun. O dan Rhagor: fflach y sgrin neu amrantiad y golau blaen pan fydd cyfnod yn dod i ben a nod dyddiol."
