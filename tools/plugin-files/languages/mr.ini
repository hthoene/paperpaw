update.plugin.name = अपडेट
update.plugin.description = फर्मवेअर अपडेट इंस्टॉल करते, कार्डवरून किंवा इंटरनेटवरून डाउनलोड करून.
update.plugin.how = "अपडेट नवे फर्मवेअर इंस्टॉल करते, ज्या उपकरणांवर PaperPaw हेच फर्मवेअर आहे, जसे X4. ते सेटिंग्जमध्ये अपडेट म्हणून सापडते.\n\nऑनलाइन शोध अपडेट सर्व्हरकडून नवे PaperPaw विचारतो आणि डाउनलोड करतो; वाय-फायवर काही मिनिटे लागतात. किंवा अपडेट फाइल (.bin, paperpaw.org वरून) कार्डवरील updates फोल्डरमध्ये कॉपी करा, उदा. वाय-फाय ट्रान्सफरने. इंस्टॉलला सुमारे एक मिनिट लागते आणि उपकरण रीस्टार्ट होते; पुस्तके, सेटिंग्ज आणि वाचनाची जागा तशीच राहते.\n\nअपडेट शोधा सुरू केल्यास (सेटिंग्जमध्ये, सुरुवातीला बंद) उपकरण आठवड्यातून एकदा स्वतः शोधते, फक्त वाय-फाय आधीच चालू असताना किंवा चार्ज होत असताना. सापडलेले नवे PaperPaw इथे थांबते; वाचनात काहीही व्यत्यय आणत नाही. शोध फक्त उपकरणावर काय चालते ते पाठवतो, उपकरणाचे नाव किंवा क्रमांक नाही.\n\nवापरत असलेल्या प्लगइनना नव्या आवृत्तीसाठी अजून आवृत्ती नसल्यास अपडेट त्यांची वाट पाहते.\n\nCrossPoint सारखे दुसरे फर्मवेअरही इथून इंस्टॉल होते: त्याची फाइल (.bin) updates फोल्डरमध्ये ठेवा आणि अपडेट उघडा. PaperPaw ते या उपकरणासाठी पूर्ण व अखंड फर्मवेअर असल्याचे तपासते, पण ते सही केलेले नसल्याने कोणी बनवले ते सांगू शकत नाही. तरीही इंस्टॉल करा ते फ्लॅशच्या दुसऱ्या अर्ध्या भागात लिहिते आणि उपकरण ते सुरू करते. PaperPaw वर परत जाण्यासाठी त्याची इंस्टॉल फाइल (paperpaw-<device>-<version>-install.bin) दुसऱ्या फर्मवेअरच्या मेनूमधून इंस्टॉल करा."
