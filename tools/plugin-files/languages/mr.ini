vocabulary.sd.outcome.no-notes = नोट्स सापडल्या नाहीत: हा Anki डेक नाही, किंवा त्यात नोट्स नाहीत. तो Anki मधून Anki डेक पॅकेज (.apkg) म्हणून निर्यात करा.
vocabulary.sd.outcome.newer-anki = हा डेक सर्वात नवीन Anki स्वरूपात आहे. “जुन्या Anki आवृत्त्यांना समर्थन” निवडून तो पुन्हा निर्यात करा.
vocabulary.sd.outcome.deck-too-large = हा Anki डेक येथे वाचण्यासाठी खूप मोठा आहे: जास्तीत जास्त 4,000 फाइल, 4 MiB नोट्स आणि 20,000 नोट्स. तो मीडिया आणि शेड्युलिंगशिवाय निर्यात करा, किंवा विभागा.
