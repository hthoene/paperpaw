vocabulary.web.import-help = प्रत्येक ओळीत एक कार्ड असलेली CSV, TSV किंवा TXT फाइल जोडा, किंवा Anki मधून निर्यात केलेला डेक (.apkg, “जुन्या Anki आवृत्त्यांना समर्थन” सह), किंवा यादी पेस्ट करा. कार्ड या डेकमध्ये जातात. प्रत्येक ओळ: पुढची बाजू, मागची बाजू आणि उदाहरण (पर्यायी), टॅब, स्वल्पविराम किंवा अर्धविरामाने वेगळे केलेले. उदाहरण: Katze;cat;Die Katze schläft. फाइल UTF-8 मजकूर असाव्यात; प्रत्येक डेकमध्ये जास्तीत जास्त 20,000 कार्ड.
