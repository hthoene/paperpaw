update.not-dual.warning = "त्यानंतर PaperPaw इथे अपडेट इंस्टॉल करेल. या उपकरणावर दुसरे फर्मवेअर तरीही इंस्टॉल असल्यास, अपडेट ते अधिलिखित करू शकते. हे लागू करण्यासाठी PaperPaw रीस्टार्ट होते.\nनंतर रद्द करण्यासाठी: अपडेट, “ड्युअल-बूट पुन्हा ओळखा”, किंवा paperpaw.ini मध्ये dual-boot = auto."
