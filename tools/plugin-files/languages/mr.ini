vocabulary.setting.sd-folder.help = SD कार्डवर: त्यातील CSV, TSV किंवा Anki फाइल म्हणजे एक डेक.
vocabulary.sd.readme = "फाइलमधील फ्लॅश कार्ड\n\nप्रत्येक डेकसाठी येथे एक फाइल ठेवा: Spanish.tsv म्हणजे Spanish हा डेक बनतो.\nफाइल: .tsv, .csv किंवा .txt, UTF-8 म्हणून जतन केलेली, किंवा .apkg: Anki डेक, “जुन्या Anki आवृत्त्यांना समर्थन” निवडून निर्यात केलेला. त्यातील नोट्सची पहिली तीन फील्ड पुढची बाजू, मागची बाजू आणि उदाहरण बनतात; त्याचे शेड्युलिंग आणि मीडिया वाचले जात नाहीत, आणि PaperPaw कधीही Anki फाइल लिहीत नाही.\n\nप्रत्येक ओळीत एक कार्ड: पुढची बाजू, मागची बाजू आणि उदाहरण (पर्यायी), टॅब, स्वल्पविराम किंवा अर्धविरामाने वेगळे केलेले. पहिली ओळ स्तंभांची नावे देऊ शकते: front, back, example. उदाहरण:\n\nKatze\tcat\tDie Katze schläft.\n\nमग रीडरवर फ्लॅश कार्ड उघडा, SD कार्डवरील कार्ड निवडा आणि मग कार्डवरून डेक अपडेट करा निवडा.\n\nजाणून घेण्यासारखे:\n- डेक रीडरवर राहतात, तुम्ही शिकलेल्या गोष्टींसह. फाइल नवीन किंवा बदललेली असताना वाचली जाते, आणि तिची कार्ड डेकमध्ये जोडली जातात किंवा तिथे बदलली जातात.\n- फाइलमध्ये कार्डची मागची बाजू किंवा उदाहरण बदला: कार्ड बदलते आणि तुमची प्रगती राहते.\n- कार्डच्या पुढच्या बाजूचा मजकूर बदला: ते नवीन कार्ड मानले जाते, आणि जुने पुन्हा सुरू होते. कार्ड त्यांच्या पुढच्या बाजूच्या मजकुराने ओळखली जातात, स्पेस आणि कॅपिटल अक्षरे मोजली जात नाहीत. डेक फाइलमध्ये जतन करा (SD कार्डवरील कार्ड, डेक कार्डवर जतन करा) आणि प्रत्येक कार्डला id स्तंभात एक क्रमांक मिळतो: तिथे पुढची बाजू बदला, फाइलच्या पहिल्या दोन ओळी जशाच्या तशा ठेवा, आणि कार्ड तुमची प्रगती ठेवते.\n- जतन करताना डेकची कार्ड लिहिली जातात. फाइलमध्ये जे होते आणि कार्ड नाही (पुढची बाजू नसलेली ओळ) ते ठेवले जात नाही; तिथे असलेली फाइल _name.bak.tsv मध्ये कॉपी केली जाते.\n- फाइलमधून तुम्ही हटवलेली ओळ डेकमधील कार्ड हटवत नाही, जोपर्यंत तुम्ही त्या डेकसाठी गहाळ कार्ड काढा चालू करत नाही. तेव्हा कार्ड प्रगतीसह जाते.\n"
