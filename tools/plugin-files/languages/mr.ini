update.dual-boot.help = PaperPaw हे उपकरण दुसऱ्या फर्मवेअरसोबत वाटते, त्यामुळे ते इथे अपडेट इंस्टॉल करत नाही. हे सेट करताना वापरलेल्या टूलने PaperPaw अपडेट करा. या उपकरणावर दुसरे फर्मवेअर नाही? खालच्या बटणाने तसे सांगा, किंवा paperpaw.org/flash वर USB ने PaperPaw पुन्हा फ्लॅश करा.
