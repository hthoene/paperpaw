files.plugin.name = फाइल ब्राउझर
files.plugin.description = डिव्हाइसवरील पुस्तके आणि फोल्डर दाखवते आणि उघडते.
files.plugin.how = "ग्रंथालय तुमच्या ग्रंथालय फोल्डरमधील पुस्तके दाखवते, प्रत्येकाचे कव्हर, शीर्षक, लेखक आणि किती वाचले आहे ते सहित. तुम्ही शेवटचे वाचलेले पुस्तक वर कार्ड म्हणून असते, त्यामुळे वाचन पुढे सुरू ठेवायला एक टॅप किंवा निवडा एकदा दाबणे पुरे. पुस्तके शोधत असताना ग्रंथालय आतापर्यंत किती सापडली ते सांगते.\n\nपुस्तकांच्या वर काय दाखवायचे ते निवडा: सर्व, वाचत असलेली, न वाचलेली किंवा वाचून झालेली, किंवा शेल्फ (लेखक, मालिका, टॅग, आवडती, सुरू केलेल्या प्रत्येक मालिकेचे पुढील पुस्तक). वाचण्यासाठी पुस्तकावर टॅप करा; ते उघडणे, वाचून झाले किंवा न वाचलेले म्हणून चिन्हांकित करणे, माहिती पाहणे, आर्काइव्हमध्ये हलवणे किंवा हटवणे यासाठी ते दाबून ठेवा (बटणांसह निवडा दाबून ठेवा). ग्रंथालय मेनूसाठी शीर्षकावर टॅप करा: पुस्तकांची क्रमवारी आणि दर्शन, शोध, ग्रंथालय फोल्डर आणि सेटिंग्ज.\n\nग्रंथालय फोल्डर सेटिंग्जमध्ये ग्रंथालय अंतर्गत ग्रंथालय फोल्डर येथे ठरवला जातो; तेथे पुस्तके कव्हरच्या ग्रिडमध्येही दाखवता येतात. इतर सर्व फाइल्ससाठी साधने मेनूमधील फाइल्स वापरा."
