bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = રિમોટ, કીબોર્ડ અને સેન્સરની જોડી કરે છે અને તેમને કનેક્ટ કરે છે.
bluetooth.plugin.how = "Bluetooth રીડર સાથે રિમોટ, કીબોર્ડ અને સેન્સરની જોડી કરે છે, જ્યાં રીડરમાં Bluetooth હોય (X4 Pro).\n\nડિવાઇસ ઉમેરો નજીકમાં શું છે તે શોધે છે; પહેલાં ડિવાઇસને જોડી મોડમાં મૂકો. તેને પસંદ કરો, અને રીડર પર પુષ્ટિ કરો (જ્યાં નંબર દેખાય ત્યાં તેની સરખામણી કરો). પછી રિમોટ કે કીબોર્ડનાં બટન પેજ ફેરવે છે અને મેનૂમાં ફરે છે; દરેક બટન શું કરે તે નિયંત્રણો હેઠળ બદલો.\n\nરિમોટ જણાવે છે કે તેમનાં બટન ક્યારે કામ કરે: અહીં ચાલુ કરો ત્યારે, વાંચતી વખતે (પુસ્તક ખુલ્લું હોય ત્યાં સુધી કનેક્ટ, બૅટરી બચાવે છે), અથવા હંમેશાં. મેનૂ બટન અથવા ડિવાઇસ પર લાંબું દબાવવાથી તે ભૂલી જવાય છે.\n\nસેન્સર પ્લગિન માટે છે: કયું પ્લગિન તેને વાપરી શકે તે ચાલુ કરો. કંઈ તેને ન વાપરે ત્યારે Bluetooth બંધ રહે છે."
