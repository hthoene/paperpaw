notes-overview.plugin.name = બધી નોંધો
notes-overview.plugin.description = બધાં પુસ્તકોના બુકમાર્ક અને હાઇલાઇટ એક સૂચિમાં, અને My Clippings.txt તરીકે એક્સપોર્ટ.
notes-overview.plugin.how = "“બધી નોંધો” દરેક એવું પુસ્તક બતાવે છે જેમાં તમે બુકમાર્ક અથવા હાઇલાઇટ કર્યું હોય, કેટલાં છે તે સાથે. તેને ટૂલમાં ખોલો. પુસ્તકની નોંધો જોવા પુસ્તક પસંદ કરો, અને પુસ્તકને તે જગ્યાએ ખોલવા નોંધ પસંદ કરો.\n\nસૂચિના અંતે “My Clippings.txt તરીકે એક્સપોર્ટ કરો” બધી નોંધો એક ફાઇલમાં લખે છે, લાઇબ્રેરીની બાજુના Exports ફોલ્ડરમાં, Kindle વાપરે છે તે સ્વરૂપમાં (UTF-8). Kindleની My Clippings.txt વાંચતી ઍપ તેને વાંચી શકે છે. હાઇલાઇટ પરની નોંધ Kindleની જેમ અલગ એન્ટ્રી છે. અહીં પુસ્તકમાં Kindle લોકેશન ન હોવાથી, “location” એટલે નોંધ પુસ્તકમાં કેટલા ટકા આગળ છે તે. ફાઇલ દર વખતે ફરીથી લખાય છે; તે પાછલી ફાઇલનું સ્થાન લે છે."
