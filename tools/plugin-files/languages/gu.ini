file-manager.plugin.name = ફાઇલ મેનેજર
file-manager.plugin.description = ડિવાઇસ પરનાં બધાં ફોલ્ડર અને ફાઇલો: ખોલો, નામ બદલો, ખસેડો, કૉપિ કરો અને કાઢી નાખો.
file-manager.plugin.how = "ફાઇલ મેનેજર ડિવાઇસના સ્ટોરેજ પરનાં દરેક ફોલ્ડર અને ફાઇલ બતાવે છે, ફક્ત તમારાં પુસ્તકો નહીં, અને તેમને ખોલવા, નામ બદલવા, ખસેડવા, કૉપિ કરવા અને કાઢી નાખવા તથા નવાં ફોલ્ડર બનાવવા દે છે.\n\nટૂલ મેનૂમાંથી ફાઇલો ખોલો. ફોલ્ડરમાં જવા તેના પર ટૅપ કરો; પાછળ ઉપરના ફોલ્ડરમાં લઈ જાય છે. તેનાથી શું થઈ શકે તે જોવા ફાઇલ પર ટૅપ કરો, અથવા કોઈ પણ એન્ટ્રી દબાવી રાખો (બટનથી, પસંદ કરો દબાવી રાખો). ખસેડો અને કૉપિ કરો એન્ટ્રી પકડી લે છે: જે ફોલ્ડરમાં તે મૂકવી હોય ત્યાં જાઓ અને નીચેની પટ્ટીમાં અહીં પેસ્ટ કરો પસંદ કરો. બટનથી, પટ્ટી સુધી પહોંચવા છેલ્લી એન્ટ્રી પરથી નીચે દબાવો.\n\nબિંદુથી શરૂ થતી ફાઇલો અને ફોલ્ડર, જેમ કે PaperPawનો પોતાનો ડેટા, છુપાયેલાં હોય છે. તેમને જોવા, સેટિંગમાં લાઇબ્રેરી હેઠળ છુપાયેલી ફાઇલો ચાલુ કરો."
