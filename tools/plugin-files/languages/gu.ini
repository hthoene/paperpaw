about.plugin.name = વિશે
about.plugin.description = PaperPaw નું વર્ઝન અને લાઇસન્સ.
about.plugin.how = "વિશે બતાવે છે કે તમારી પાસે PaperPaw નું કયું વર્ઝન છે, તેનો સોર્સ કોડ ક્યાં છે અને તે કયા લાઇસન્સ હેઠળ આવે છે.\n\nતે તમને સેટિંગના અંતે, PaperPaw વિશે તરીકે મળશે. તીર બટન અને પસંદ કરો વડે પંક્તિ પસંદ કરો, અથવા તેના પર ટૅપ કરો. ફર્મવેરમાં બિલ્ટ-ઇન પ્લગિન અને, કોડવાળાં પ્લગિન લોડ કરતાં ડિવાઇસ પર, આવાં પ્લગિન જેના માટે બનેલાં હોવાં જોઈએ તે ફિંગરપ્રિન્ટ પણ ત્યાં દર્શાવેલાં છે.\n\nલાઇસન્સ રીડરમાં ટેક્સ્ટ તરીકે ખૂલે છે, તેથી તમે પુસ્તકની જેમ તેનાં પેજ ફેરવો છો. તેમાં PaperPaw નું પોતાનું લાઇસન્સ અને તેની સાથે આવતા ફોન્ટ, આઇકન અને હાઇફનેશન પેટર્નનાં લાઇસન્સ છે. પ્લગિન પોતાની એક લાઇન ઉમેરી શકે છે, જેમ કે થીમના લેખકનું નામ."
