calibre.plugin.name = વાયરલેસ લાઇબ્રેરી
calibre.plugin.description = નેટવર્ક પરથી પુસ્તકો મેળવે છે. calibre માટે વાયરલેસ ડિવાઇસ તરીકે કામ કરે છે.
calibre.plugin.how = "વાયરલેસ લાઇબ્રેરીથી ડિવાઇસ તમારા કમ્પ્યુટર પરના Calibreમાં વાયરલેસ ડિવાઇસ તરીકે દેખાય છે. પછી Calibre તેને પુસ્તકો મોકલી શકે, તેમની સૂચિ બતાવી શકે અને તેમને કાઢી નાખી શકે. પુસ્તકો લાઇબ્રેરીમાં જાય છે.\n\nડિવાઇસ અને કમ્પ્યુટર એક જ Wi-Fi નેટવર્કમાં હોય ત્યારે ટૂલ મેનૂમાંથી વાયરલેસ લાઇબ્રેરી ખોલો. Calibreમાં Connect/share, પછી Start wireless device connection પસંદ કરો. ડિવાઇસને તમારું કમ્પ્યુટર મળે ત્યારે તે તેનું નામ બતાવે છે; કનેક્ટ કરો પર ટૅપ કરો (બટનથી, પસંદ કરો દબાવો). Calibre અહીં પુસ્તકો ઉમેરી અને કાઢી શકે છે, તેથી ફક્ત તમારા પોતાના કમ્પ્યુટર સાથે કનેક્ટ કરો. સ્ક્રીન બંધ કરવાથી કનેક્શન પૂરું થાય છે.\n\nજો Calibre જાતે ન મળે, તો સેટિંગમાં લાઇબ્રેરી હેઠળ Calibre વિભાગમાં સરનામું તરીકે તેના કમ્પ્યુટરનું સરનામું દાખલ કરો. જો Calibre 9090 સિવાયનો પોર્ટ વાપરે, તો તેને :પોર્ટ તરીકે ઉમેરો, દા.ત. 192.168.1.20:9091."
