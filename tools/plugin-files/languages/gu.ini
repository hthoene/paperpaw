battery.plugin.description = બૅટરી નોંધે છે અને તે કેટલો સમય ચાલે છે તે બતાવે છે.
battery.plugin.how = "બૅટરી વપરાશ ડિવાઇસ જાગૃત હોય ત્યારે લગભગ દર મિનિટે ચાર્જ નોંધે છે, સાથે તેણે શું કર્યું તે પણ: સ્ક્રીન રિફ્રેશ અને ફેરવેલાં પેજ. તેના પરથી તે ગણે છે કે જાગૃત રહેવાના એક કલાક અને 100 પેજમાં કેટલું વપરાય છે, અને એ ઝડપે બૅટરી કેટલો સમય ચાલશે.\n\nટૂલ મેનૂમાંથી બૅટરી ખોલો. તે અત્યારનો ચાર્જ, આ વખતે જાગૃત સમય, અત્યાર સુધીનો બૅટરી પરનો વપરાશ અને તમારા તાજેતરના જાગૃત સમય બતાવે છે. પેજ બટન વડે, અથવા ઉપરના તીર પર ટૅપ કરીને પેજ ફેરવાય છે.\n\nઆંકડાનો કોઈ અર્થ થાય તે પહેલાં બૅટરી પર થોડો સમય વાંચવું પડે છે. નોંધણી મૂળભૂત રીતે ચાલુ છે અને સેટિંગમાં, ડિવાઇસ, પાવર હેઠળ, બૅટરી વપરાશ નોંધો તરીકે બંધ કરી શકાય છે."
