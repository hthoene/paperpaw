rules.plugin.name = નિયમો
rules.plugin.description = કંઈક થાય ત્યારે કંઈક કરે છે: દા.ત. 22:00 વાગ્યે રાત્રિ મોડ.
rules.plugin.how = "કંઈક થાય ત્યારે નિયમ જાતે કંઈક કરે છે: દરરોજ 22:00 વાગ્યે રાત્રિ મોડ ચાલુ, અથવા PaperPaw શરૂ થાય ત્યારે કૅટલૉગ સિંક.\n\nનિયમો સેટિંગમાં “કસ્ટમાઇઝ કરો” હેઠળ “નિયમો” તરીકે છે. “નિયમ ઉમેરો” પૂછે છે “ક્યારે?” (PaperPaw શરૂ થાય, દિવસનો કોઈ સમય, પુસ્તક ખૂલે કે બંધ થાય, બૅટરી, ચાર્જિંગ, કોઈ સ્વિચ અને વધુ) અને “પછી શું?” (ક્રિયા ચલાવો, સ્વિચ ચાલુ કે બંધ કરો, સંખ્યા સેટ કરો, સંદેશ બતાવો). નિયમને થોભાવવા તેના પર ટૅપ કરો; “બે સમય વચ્ચે” જેવી શરત માટે, અથવા તેને કાઢી નાખવા, તેને દબાવી રાખો (બટનથી: “પસંદ કરો” દબાવી રાખો).\n\nપસંદ કરવાની ક્રિયાઓ, સ્વિચ અને સંખ્યાઓ પ્લગિન મુજબ ગોઠવેલી છે: પ્લગિન પસંદ કરો, પછી તે જે લાવે તે; “પાછળ” ફરી બહાર લઈ જાય છે. બતાવેલી સ્ક્રીન પર કામ કરતી ક્રિયા, જેમ કે “પાછળ” કે “આગલું પેજ”, ત્યાં દબાવવાથી જે થાય તે જ કરે છે.\n\nસમય ગમે તે સ્ક્રીન ખુલ્લી હોય ત્યારે લાગુ પડે છે. એકબીજાને સતત ઉલટાવતા બે નિયમો થોડાં પગલાં પછી અટકી જાય છે."
