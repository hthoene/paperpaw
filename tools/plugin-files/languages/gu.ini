reader.plugin.name = રીડર
reader.plugin.description = પુસ્તકો પેજ દર પેજ બતાવે છે, અનુક્રમણિકા અને વાંચન સેટિંગ સાથે.
reader.plugin.how = "રીડર પુસ્તકો પેજ દર પેજ બતાવે છે. લાઇબ્રેરીમાંથી પુસ્તક ખોલો; છેલ્લું પુસ્તક શરૂઆતે ફરી ખૂલી શકે છે (સેટિંગ “શરૂઆતે છેલ્લું પુસ્તક ખોલો”).\n\nપેજ ફેરવવા સ્ક્રીનની ડાબી કે જમણી બાજુ ટૅપ કરો, અથવા પેજ બટન વાપરો. વાંચન મેનૂ માટે વચ્ચે ટૅપ કરો અથવા “પસંદ કરો” દબાવો: અનુક્રમણિકા, શોધ, પેજ પર જાઓ, ફોન્ટ અને લેઆઉટ, બુકમાર્ક અને હાઇલાઇટ અને વધુ. ઉપરની કિનારીથી નીચે સ્વાઇપ ક્વિક પૅનલ ખોલે છે, નીચેની કિનારીથી ઉપર સ્વાઇપ હોમ પર લઈ જાય છે; “પાછળ” દબાવી રાખવાથી પણ.\n\nચિત્ર પૂરી સ્ક્રીનમાં જોવા “પસંદ કરો” દબાવી રાખો (અથવા ચિત્ર દબાવી રાખો): ડાબે અને જમણે પેજનાં ચિત્રોમાં ફરે છે. “પસંદ કરો” 2x, 3x અને પાછું ઝૂમ કરે છે (ટચ પર ડબલ ટૅપ); ઝૂમ કરેલું હોય ત્યારે ડાબે અને જમણે આડું ખસેડે છે, પેજ બટન (અથવા સ્વાઇપ) આડું અને નીચે આગળ વધે છે. “પાછળ” ફિટ પર, પછી પેજ પર પાછું લાવે છે (ટચ પર છોડવા દબાવી રાખો). બુકમાર્ક માટે ઉપરના જમણા ખૂણે ટૅપ કરો. શબ્દ હાઇલાઇટ કરવા તેને દબાવી રાખો. બટનથી, ડાબું દબાવી રાખો: ડાબે અને જમણે શબ્દ પ્રમાણે ખસે છે, પેજ બટન લાઇન પ્રમાણે, તેમને દબાવી રાખવાથી પેજના છેડે અને ફકરા પ્રમાણે; “પસંદ કરો” શબ્દ માટે હાઇલાઇટ બાર ખોલે છે, “પસંદ કરો” દબાવી રાખવાથી તે વાક્ય અને ફકરા સુધી વિસ્તરે છે (પછી ડાબે અને જમણે અંત ખસેડે છે, તેમને દબાવી રાખવાથી શરૂઆત). પસંદગી પેજ ફેરવવા છતાં ચાલુ રહે છે. “Markdown તરીકે એક્સપોર્ટ કરો” તમારી નોંધો સાચવે છે."
