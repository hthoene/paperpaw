aids.plugin.name = વાંચન સહાય
aids.plugin.description = ઘાટી શબ્દ-શરૂઆત, બદલેલા શબ્દો, ચિત્રો: તમે ઇચ્છો તેવું ટેક્સ્ટ.
aids.plugin.how = "વાંચન સહાય તમે વાંચો ત્યારે પુસ્તકનું ટેક્સ્ટ કેવું દેખાય તે બદલે છે. તે દરેક પુસ્તકને લાગુ પડે છે. ઘાટી શબ્દ-શરૂઆત અને શબ્દો બદલો શરૂઆતમાં બંધ હોય છે.\n\nતે તમને સેટિંગમાં, વાંચન હેઠળ, વાંચન સહાય વિભાગમાં મળશે. ઘાટી શબ્દ-શરૂઆત દરેક શબ્દનો પહેલો અડધો ભાગ ઘાટો કરે છે, જે કેટલાક લોકોને વાંચવામાં સરળ લાગે છે. શબ્દો બદલો \"colour = color; Mr. = Mister\" જેવી રીતે લખેલી જોડીઓ લે છે, અર્ધવિરામથી અલગ કરેલી.\n\nફક્ત આખા શબ્દો જ બદલાય છે, બરાબર તમે લખ્યા તેવા, તેથી \"color\" ક્યારેય લાંબા શબ્દનો ભાગ બદલતું નથી. પુસ્તકની ફાઇલ પોતે બદલાતી નથી.\n\nપુસ્તકોમાંનાં ચિત્રો બતાવી શકાય (શરૂઆતમાં આમ), ચિત્રના વર્ણનનો ઉપયોગ કરતી \"[ચિત્ર: દરિયામાં એક વહાણ]\" જેવી ટૂંકી લાઇનમાં ફેરવી શકાય, અથવા છોડી દેવાય. ત્યારે પેજ પર ટેક્સ્ટ માટે વધુ જગ્યા રહે છે, અને ન બતાવેલા ચિત્ર માટે કશું ડિકોડ થતું નથી, તેથી પેજ ઝડપથી ફરે છે. કૉમિક અને ચિત્રોથી બનેલાં અન્ય પુસ્તકો બદલાતાં નથી."
