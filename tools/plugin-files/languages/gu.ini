format-cbz.plugin.name = કૉમિક્સ
format-cbz.plugin.description = કૉમિક બુક આર્કાઇવ (.cbz) ખોલે છે, દરેક પેજ પર એક ચિત્ર.
format-cbz.plugin.how = "કૉમિક બુક આર્કાઇવ (.cbz) ખોલે છે: દરેક પેજ પર એક ચિત્ર, સ્ક્રીનમાં બંધબેસતું, તેમનાં નામના ક્રમમાં (10 પહેલાં 2).\n\nતેમને લાઇબ્રેરી ફોલ્ડરમાં મૂકો અને લાઇબ્રેરીમાંથી ખોલો; કોઈ પણ પુસ્તકની જેમ પેજ ફેરવો. મોટાં ચિત્રોમાં પહેલી વાર થોડી વાર લાગે છે, X4 પર બીજે કરતાં વધુ.\n\nવાંચન સેટિંગ (સેટિંગ, વાંચન): “પૅનલ દર પૅનલ” એક સમયે પેજની એક પૅનલ, સ્ક્રીન મંજૂરી આપે તેટલી મોટી, બતાવે છે, અને પેજ ફેરવવાથી એક પછી એક પૅનલ આવે છે; પૅનલ વગરનું પેજ આખું બતાવાય છે. “કૉમિક પેજની દિશા” મંગા માટે (જમણેથી ડાબે) પેજ ફેરવવાનું ઉલટાવે છે; પુસ્તકની પોતાની ComicInfo.xml આ જાતે જણાવે છે. લાઇબ્રેરી ComicInfo.xmlમાંથી પુસ્તકનું શીર્ષક અને તેની શ્રેણી અને નંબર બતાવે છે."
format-cbz.title = કૉમિક બુક (CBZ)
