menu.plugin.name = મેનૂ
menu.plugin.description = સ્ક્રીનના તળિયે ક્રિયાઓ અને સેટિંગ સાથેનું મેનૂ.
menu.plugin.how = "મેનૂ તમે શું કરી અને સેટ કરી શકો તેની સૂચિ બતાવે છે. તે સ્ક્રીનના તળિયે, જે ખુલ્લું હોય તેની ઉપર ખૂલે છે: વાંચતી વખતે સ્ક્રીનની વચ્ચે ટૅપ કરો અથવા “પસંદ કરો” દબાવો. કોઈ એન્ટ્રી ચલાવવા તેને ટૅપ કરો કે પસંદ કરો.\n\nમેનૂમાંનાં સેટિંગ તેમનું મૂલ્ય બતાવે છે અને ત્યાં જ બદલાય છે, તેથી મેનૂ ખુલ્લું રહે છે. વધુ એન્ટ્રીવાળી એન્ટ્રી સબમેનૂ ખોલે છે.\n\nઝડપી પૅનલ માટે ઉપરની કિનારીથી નીચે સ્વાઇપ કરો: તમે વારંવાર બદલો છો તે, બટન તરીકે. બટન બદલવા તેને ટૅપ કરો, તેનાં સેટિંગ માટે દબાવી રાખો. ફક્ત બટન વડે, તીર બટન પસંદ કરે છે, “પસંદ કરો” બદલે છે અને “પાછળ” બંધ કરે છે. દેખાવ હેઠળ, “મેનૂ” મેનૂને સૂચિ તરીકે કે ટાઇલ તરીકે બતાવે છે."
