puzzles.plugin.name = કોયડા
puzzles.plugin.description = સુડોકુ, ક્રૉસવર્ડ અને ચેસ કોયડા, ઑફલાઇન, આજના કોયડા સાથે.
puzzles.plugin.how = "ટ્રેન અને પ્રતીક્ષાખંડ માટે કોયડા, બધા ઑફલાઇન: સુડોકુ, ક્રૉસવર્ડ અને ચેસ કોયડા. ટૂલ મેનૂમાંથી “કોયડા” ખોલો, અથવા હોમ સ્ક્રીન પર “આજનો કોયડો” વિજેટ ઉમેરો (હોમ સ્ક્રીન દબાવી રાખો): તે આજનું સુડોકુ કેટલું થયું છે તે બતાવે છે, અને ટૅપ કરવાથી તે ખૂલે છે. આજનું સુડોકુ આખો દિવસ એક જ રહે છે.\n\nસુડોકુ: ડાબે અને જમણે કર્સરને ખાને ખાને ખસેડે છે, ઉપર અને નીચે (પેજ બટન) એક હરોળ. “પસંદ કરો” અંકો ખોલે છે: એક પસંદ કરો અને તેને મૂકવા ફરી “પસંદ કરો”, અથવા ખાનું ખાલી કરવા “સાફ કરો”. બોર્ડ નીચેનાં બટન સુધી પહોંચવા “પસંદ કરો” (અથવા “મેનૂ”) દબાવી રાખો: “નોંધો” અંકોને પેન્સિલ નિશાન બનાવે છે, “તપાસો” ખોટાં ખાનાં ચિહ્નિત કરે છે, “પૂર્વવત્ કરો” છેલ્લી ચાલ પાછી લે છે, “નવું” તમે પસંદ કરો તે સ્તરનો કોયડો શરૂ કરે છે (સરળ, મધ્યમ, મુશ્કેલ). દરેક કોયડાનો બરાબર એક ઉકેલ છે. તમે છોડો ત્યારે રમત સચવાય છે. ટચ સ્ક્રીન પર ખાના પર ટૅપ કરો.\n\nક્રૉસવર્ડ: મેમરી કાર્ડ પર \"puzzles\" ફોલ્ડરમાં .puz (Across Lite) અથવા .ipuz ફાઇલો મૂકો; કોઈ સાથે આવતી નથી. ગ્રિડ પર ખસો, પછી કર્સર નીચેનો શબ્દ કીબોર્ડ પર ટાઇપ કરવા પસંદ કરો (અંડરસ્કોર ખાનું ખાલી રાખે છે). બટન આડી અને ઊભી વચ્ચે બદલે છે, સંકેતોની સૂચિ બતાવે છે, અક્ષરો તપાસે છે અને શબ્દ બતાવે છે. દરેક ફાઇલ માટે અક્ષરો સચવાય છે. સ્ક્રૅમ્બલ્ડ .puz ફાઇલો ખોલી શકાતી નથી.\n\nચેસ કોયડા: Lichess કોયડા ડેટાબેઝ (CC0) માંથી નાનો સેટ. ડાબે અને જમણે મહોરાં વચ્ચે ફરો, ખસેડવાનું મહોરું પસંદ કરો, પછી ડાબે અને જમણે તે જ્યાં જઈ શકે ત્યાં ફરો અને ફરી પસંદ કરો. ખોટી ચાલ પાછી લેવાય છે. “સંકેત” ખસેડવાનું મહોરું ચિહ્નિત કરે છે, “આગળ” આગલા કોયડા પર જાય છે.\n\nબોર્ડ ફક્ત બદલાતાં ખાનાં ફરી દોરે છે. “આંકડા” તમે ઉકેલેલા કોયડા ગણે છે."
