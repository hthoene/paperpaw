koreader.plugin.description = બંનેમાં વાંચેલાં પુસ્તકો માટે KOReader સાથે બુકમાર્ક અને હાઇલાઇટ શેર કરે છે.
koreader.plugin.how = "આ પ્લગિન તમે બંનેમાં વાંચો છો તે પુસ્તકો માટે KOReader સાથે બુકમાર્ક અને હાઇલાઇટ શેર કરે છે, એક જ ડિવાઇસ પર અથવા ડિવાઇસ વચ્ચે સિંક થતા લાઇબ્રેરી ફોલ્ડરમાં. કશું સેટ કરવાની જરૂર નથી.\n\nKOReaderએ પણ ખોલેલું પુસ્તક PaperPaw ખોલે ત્યારે, અને તમે તેના બુકમાર્ક કે હાઇલાઇટ બદલો ત્યારે, તે પુસ્તકની બાજુના KOReader ડેટામાંથી જે નવું છે તે લઈ લે છે, અને અહીં જે નવું છે તે KOReader માટે રાખે છે, જે તે હવે પછી પુસ્તક ખોલે ત્યારે લઈ લે. કાઢી નાખેલાં નિશાન અને બદલેલી નોંધો પણ જાય છે.\n\nઆ ફક્ત EPUB પુસ્તકો માટે કામ કરે છે. જો એક બાજુની ફાઇલ વાંચી ન શકાય, તો તે વાંચી શકાય ત્યાં સુધી કોઈ બાજુ કશું બદલાતું નથી."
koreader.removed-there = KOReaderની ફાઇલમાં હવે કોઈ હાઇલાઇટ નથી. તેમને અહીંથી પણ કાઢી નાખીએ?
koreader.removed-there.text = કદાચ તે KOReaderમાં કાઢી નખાયાં હોય, અથવા તેની ફાઇલ બીજા ડિવાઇસથી આવી હોય. “રાખો” તેમને અહીં રહેવા દે છે અને ફરી KOReaderને આપે છે.
