dictionary.plugin.name = શબ્દકોશ
dictionary.plugin.description = StarDict શબ્દકોશોમાં શબ્દો શોધે છે.
dictionary.plugin.how = "શબ્દકોશ પુસ્તકમાંના શબ્દને StarDict શબ્દકોશોમાં શોધે છે અને સ્ક્રીનના નીચલા ભાગ પરની પેનલમાં તેના અર્થ બતાવે છે.\n\nવાંચતી વખતે, શબ્દ દબાવી રાખો અને શોધો પસંદ કરો; બટનથી, વધુ હેઠળ ટેક્સ્ટ પસંદ કરો વાપરો. શબ્દકોશનાં ફોલ્ડર (.ifo, .idx અને .dict ફાઇલો સાથે) ડિવાઇસ પરના \"dictionaries\" ફોલ્ડરમાં કૉપિ કરો, સબફોલ્ડર પણ ચાલે, અથવા સેટિંગમાં વાંચન હેઠળ શબ્દકોશ ફોલ્ડર તરીકે બીજું ફોલ્ડર પસંદ કરો (એક અદ્યતન સેટિંગ). પહેલી શોધ દરેક શબ્દકોશ માટે નાનો ઇન્ડેક્સ તૈયાર કરે છે, જેમાં થોડી વાર લાગે છે.\n\nપેનલમાં, પેજ બટન અથવા ઉપર અને નીચે લાંબા અર્થ સ્ક્રોલ કરે છે, અને પાછળ તેને બંધ કરે છે. ટચથી, બંધ કરવા તેની બહાર ટૅપ કરો."
