tasks.account.password.help = તમારો પાસવર્ડ અથવા, વધુ સારું, રીડર માટે બનાવેલો ઍપ પાસવર્ડ. તે રીડરના પાસવર્ડ સાથે રાખવામાં આવે છે અને ક્યારેય બતાવાતો નથી.
