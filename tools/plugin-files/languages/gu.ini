files.plugin.how = "લાઇબ્રેરી તમારા લાઇબ્રેરી ફોલ્ડરનાં પુસ્તકોની સૂચિ બતાવે છે, દરેક તેના કવર, શીર્ષક, લેખક અને તમે તેને કેટલું વાંચ્યું છે તે સાથે. તમે છેલ્લે વાંચેલું પુસ્તક સૌથી ઉપર કાર્ડ તરીકે હોય છે, તેથી આગળ વાંચવા એક ટૅપ, અથવા પસંદ કરો એક વાર દબાવવું પૂરતું છે. લાઇબ્રેરી પુસ્તકો શોધતી હોય ત્યારે, અત્યાર સુધી કેટલાં મળ્યાં તે બતાવે છે.\n\nપુસ્તકોની ઉપર શું બતાવવું તે પસંદ કરો: બધાં, તમે વાંચી રહ્યાં છો તે, ન વાંચેલાં કે પૂરાં વાંચેલાં, અથવા છાજલીઓ (લેખક, શ્રેણી, ટૅગ, મનપસંદ, તમે શરૂ કરેલી દરેક શ્રેણીનું આગલું પુસ્તક મુજબ). પુસ્તક વાંચવા તેના પર ટૅપ કરો; તેને ખોલવા, પૂરું વાંચેલું કે ન વાંચેલું ચિહ્નિત કરવા, તેની માહિતી જોવા, આર્કાઇવમાં ખસેડવા કે કાઢી નાખવા તેને દબાવી રાખો (બટનથી, પસંદ કરો દબાવી રાખો). લાઇબ્રેરી મેનૂ માટે શીર્ષક પર ટૅપ કરો: પુસ્તકો કેવી રીતે ગોઠવાય અને દેખાય, શોધ, લાઇબ્રેરી ફોલ્ડર અને સેટિંગ.\n\nલાઇબ્રેરી ફોલ્ડર સેટિંગમાં લાઇબ્રેરી હેઠળ લાઇબ્રેરી ફોલ્ડર તરીકે સેટ થાય છે; ત્યાં તમે પુસ્તકોને કવરની ગ્રિડ તરીકે પણ બતાવી શકો. બાકીની દરેક ફાઇલ માટે ટૂલ મેનૂમાં ફાઇલો વાપરો."
