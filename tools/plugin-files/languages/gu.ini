reading-goal.plugin.name = વાંચન લક્ષ્ય
reading-goal.plugin.description = રોજ વાંચવાની મિનિટો, અને હોમ સ્ક્રીન પર એક બિલાડી જેનો મૂડ આજના વાંચન મુજબ બદલાય છે.
reading-goal.plugin.how = "તમારી હોમ સ્ક્રીન પરની બિલાડી બતાવે છે કે આજનું વાંચન કેવું ચાલે છે: તમે હજી વાંચ્યું ન હોય ત્યાં સુધી ઉદાસ, થોડું વાંચ્યા પછી ઠીકઠાક, રોજના લક્ષ્યના અડધાથી સંતુષ્ટ, અને લક્ષ્ય પૂરું થાય એટલે ખુશ.\n\nહોમ સ્ક્રીન પર “વાંચન બિલાડી” વિજેટ ઉમેરો (હોમ સ્ક્રીન દબાવી રાખો, પછી વિજેટ ઉમેરો), અથવા સ્લીપ સ્ક્રીન તરીકે “આજની વાંચન બિલાડી” પસંદ કરો. બિલાડી પર ટૅપ કરવાથી રોજનું લક્ષ્ય ખૂલે છે; તે વાંચનના આંકડાનું લક્ષ્ય છે, જે તમે વાંચેલી મિનિટો ગણે છે.\n\nસેટિંગમાં, “વાંચન” હેઠળ, “આટલાથી સંતુષ્ટ” અને “આટલાથી ખુશ” નક્કી કરે છે કે લક્ષ્યના કયા ભાગથી બિલાડી સંતુષ્ટ કે ખુશ થાય, અને “પોતાનાં ચિત્રો” બિલાડીઓને બદલે બતાવવાનાં ચિત્રો (sad, meh, content અને happy)નું ફોલ્ડર. ચિત્રો PNG કે JPEG ફાઇલો હોય છે; ફોલ્ડર ન હોય તો બિલાડીઓ દેખાય છે."
