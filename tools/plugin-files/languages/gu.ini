picture-home.plugin.description = વિજેટની પાછળ તમારા પોતાના ચિત્રવાળી હોમ સ્ક્રીન, અને તમે ગોઠવો તેવો સ્ટેટસ બાર.
picture-home.plugin.how = "“ચિત્ર હોમ સ્ક્રીન” ચાલુ હોય ત્યાં સુધી હોમ સ્ક્રીનનું સ્થાન લે છે: વિજેટની પાછળ તમારું પોતાનું ચિત્ર, અને તમે ગોઠવો તેવાં વિજેટ અને ટૂલનાં પેજ. પ્લગિન મેનેજરમાં તેને બંધ કરો એટલે બિલ્ટ-ઇન હોમ સ્ક્રીન તેનાં પોતાનાં પેજ સાથે પાછી આવે છે.\n\nકાર્ડ પરના ફોલ્ડરમાં ચિત્રો (JPEG, PNG અથવા GIF) મૂકો (માનક રીતે wallpapers), પછી સેટિંગ › કસ્ટમાઇઝ કરો › ચિત્ર હોમ સ્ક્રીનમાં એક પસંદ કરો. “ફિટ” કહે છે કે તે સ્ક્રીન કેવી રીતે ભરે (ભરો, આખું ચિત્ર, ખેંચો, મૂળ કદ, ટાઇલ), “સ્થાન” કયો ભાગ રહે, “ઝૂમ” કેટલું મોટું, અને “ચિત્ર આછું કરો” કેટલું ફિક્કું: વધુ ફિક્કું ચિત્ર વિજેટને વાંચવામાં સરળ બનાવે છે. ચિત્ર દરેક સ્ક્રીન કદ માટે એક વાર તૈયાર થાય છે, જેમાં થોડી વાર લાગે છે.\n\nવિજેટ ચિત્ર પર પૃષ્ઠભૂમિ પર રહે છે. પેજ બિલ્ટ-ઇન હોમ સ્ક્રીનની જેમ ગોઠવો: પેજ નીચેની પેન્સિલ, અથવા મેનૂમાં “હોમ સ્ક્રીનમાં ફેરફાર કરો”.\n\nસ્ટેટસ બાર (સમય, Wi-Fi, બૅટરી, અથવા તમે પસંદ કરો તે) ચાલુ, બંધ અથવા ઑટોમૅટિક હોઈ શકે, ઉપર અથવા નીચે, પૂરી પહોળાઈમાં અથવા ડાબે, વચ્ચે કે જમણે નાની પટ્ટી તરીકે, આછી, ઘેરી કે ભૂખરી પૃષ્ઠભૂમિ પર અથવા સીધો ચિત્ર પર. બટનોનાં નામવાળી હરોળ (X4 પર) પણ ચાલુ, બંધ અથવા ઑટોમૅટિક હોઈ શકે. ઑટોમૅટિક એટલે બટન દબાવવાથી તે થોડી સેકન્ડ માટે દેખાય છે; તે દબાણ બીજું કશું કરતું નથી.\n\n“ચિત્ર રેન્ડરિંગ” કહે છે કે ચિત્ર કેવી રીતે દોરાય: “ભૂખરા શેડ” સ્ક્રીનના દરેક ભૂખરા શેડમાં (X4 પર ધીમું), “બિંદુઓ” કાળા અને સફેદ બિંદુઓમાં (ઝડપી), અથવા “ઑટોમૅટિક”, બિલ્ટ-ઇન હોમ સ્ક્રીનની જેમ: સ્ક્રીન દોરાય ત્યારે ભૂખરા શેડ, પહેલા ફેરફાર પછી બિંદુઓ. જે સ્ક્રીનમાં ભૂખરા શેડ નથી, ત્યાં ભૂખરા શેડને બદલે બિંદુઓ વપરાય છે."
