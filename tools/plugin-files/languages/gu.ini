home.plugin.name = હોમ સ્ક્રીન
home.plugin.description = શરૂઆતનું પેજ: વિજેટનાં પેજ, જેમ કે વંચાતું પુસ્તક અને ટૂલ.
home.plugin.how = "હોમ સ્ક્રીન પેજની બનેલી છે, દરેક પેજ ફોનની જેમ વિજેટ અને ટૂલની જાળી છે. શરૂઆતમાં ઘડિયાળ, તમે વાંચી રહ્યા છો તે પુસ્તક અને તાજેતરમાં વાંચેલાં પુસ્તકો એક પેજ પર હોય છે, અને બધાં ટૂલ પછીના પેજ પર.\n\nકોઈ આઇટમ ખોલવા તેને ટૅપ કરો, અને પેજ બદલવા સ્વાઇપ કરો અથવા પેજ બટન વાપરો. ફક્ત બટન વડે, તીર બટન એક આઇટમથી બીજી પર જાય છે અને “પસંદ કરો” તેને ખોલે છે.\n\nગોઠવણી બદલવા હોમ સ્ક્રીન દબાવી રાખો, પેજની નીચેની પેન્સિલ ટૅપ કરો અથવા મેનૂમાં “હોમ સ્ક્રીનમાં ફેરફાર કરો” પસંદ કરો. આઇટમ ખસેડવા તેમને ખેંચો અથવા તેના વિકલ્પો માટે એકને ટૅપ કરો, બટન વડે પણ. “વિજેટ ઉમેરો” પણ ત્યાં જ છે. કૉલમ અને પંક્તિઓ સેટિંગમાં, દેખાવ હેઠળ, હોમ સ્ક્રીન વિભાગમાં છે.\n\nઆડી ફેરવેલી સ્ક્રીન પર હોમ સ્ક્રીન એ જ આઇટમ વધુ કૉલમમાં બતાવે છે, દરેક પેજ પછીના પેજ પહેલાં ભરાય છે, અને કાર્ડ લગભગ 110 mmથી પહોળાં થતાં નથી; ઊભી સ્ક્રીન પર તમે ગોઠવેલું કશું બદલાતું નથી. તેને આડી સ્ક્રીન પર ગોઠવો તો તે લેઆઉટ ફક્ત તે દિશા માટે અલગથી રહે છે: નવાં વિજેટ બંનેમાં ઉમેરાય છે. “ઉમેરો”માં (ફેરફાર કરતી વખતે) “આડું લેઆઉટ રીસેટ કરો” મૂળ પરથી બનેલા લેઆઉટ પર પાછું લાવે છે. એક દિશામાંથી વિજેટ કે ટૂલ કાઢી નાખવાથી તે બીજીમાંથી નીકળતું નથી."
