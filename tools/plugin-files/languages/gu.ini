menu-editor.plugin.name = મેનૂ એડિટર
menu-editor.plugin.description = દરેક મેનૂની એન્ટ્રીનો ક્રમ બદલે છે, તેમને કાઢે છે અને ઉમેરે છે.
menu-editor.plugin.how = "મેનૂ એડિટર મેનૂમાં શું છે તે બદલે છે: એન્ટ્રી ઉપર કે નીચે ખસેડો, કાઢી નાખો, અથવા નવી ઉમેરો.\n\nતે સેટિંગમાં કસ્ટમાઇઝ કરો હેઠળ, “મેનૂ કસ્ટમાઇઝ કરો” તરીકે મળે છે. મેનૂ પસંદ કરો, પછી ખસેડવા કે કાઢવા માટે એન્ટ્રી; “એન્ટ્રી ઉમેરો” નવી ઉમેરે છે. ફેરફારો તરત લાગુ થાય છે. “આ મેનૂ રીસેટ કરો” મેનૂને તેનાં પ્લગિને નક્કી કર્યા મુજબ પાછું લાવે છે, “બધાં મેનૂ રીસેટ કરો” દરેક મેનૂ માટે એમ કરે છે.\n\nતમે પોતાને બહાર લૉક કરી શકતા નથી: સેટિંગ સુધી પહોંચવાનો રસ્તો હોય તેવી એન્ટ્રી, તમે ત્યાં જવાનો બીજો રસ્તો ઉમેરો ત્યાં સુધી રહે છે."
