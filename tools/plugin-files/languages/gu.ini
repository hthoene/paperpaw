transfer.plugin.name = ટ્રાન્સફર
transfer.plugin.description = એ જ નેટવર્કના બ્રાઉઝરમાંથી ડિવાઇસ પર પુસ્તકો અને બીજી ફાઇલો મૂકો.
transfer.plugin.how = "Wi-Fi ટ્રાન્સફર એ જ નેટવર્કના બ્રાઉઝરમાંથી, કેબલ કે ઍપ વિના, ડિવાઇસ પર પુસ્તકો અને બીજી ફાઇલો મૂકે છે. તમે ફાઇલો મેળવી પણ શકો છો, ફોલ્ડર બનાવી શકો છો અને કાઢી નાખી શકો છો.\n\nતેને ટૂલમાંથી ખોલો. સ્ક્રીન એક સરનામું ટેક્સ્ટ તરીકે અને QR કોડ તરીકે બતાવે છે: તેને ફોન કે કમ્પ્યુટરના બ્રાઉઝરમાં ખોલો, અથવા કોડ સ્કૅન કરો. સરનામામાં દર વખતે નવી બનતી કી હોય છે, તેથી નેટવર્કમાંના બીજા લોકો તમારી ફાઇલો સુધી પહોંચી શકતા નથી. સ્ક્રીન ખુલ્લી હોય ત્યાં સુધી ટ્રાન્સફર ચાલે છે.\n\nજ્યાં PaperPaw પોતે Wi-Fi ચલાવે છે, જેમ કે X4 પર, ત્યાં નીચે રાઉટર વિના ડિવાઇસનું પોતાનું નેટવર્ક ખોલે છે, જેમાં ફોન કોડ સ્કૅન કરીને જોડાય છે."
