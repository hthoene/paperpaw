profiles.plugin.name = વાંચન પ્રોફાઇલ
profiles.plugin.description = વાંચન અને ડિસ્પ્લે સેટિંગના નામવાળા સેટ, એક ટૅપથી બદલાય છે.
profiles.plugin.how = "પ્રોફાઇલ તમારા વાંચન સેટિંગ, ડિસ્પ્લે સેટિંગ અને સ્ટેટસ લાઇનને “રાત” કે “મોટા અક્ષર” જેવા નામ હેઠળ રાખે છે, અને એક ટૅપથી તેમને પાછા લાવે છે.\n\nવાંચન મેનૂમાં “વધુ” હેઠળ, અથવા સેટિંગમાં “કસ્ટમાઇઝ કરો” હેઠળ “પ્રોફાઇલ” ખોલો. પ્રોફાઇલ વાપરવા તેના પર ટૅપ કરો; ઉપયોગમાં હોય તે ચિહ્નિત હોય છે. હાલના સેટિંગ તેમાં સાચવવા, તેનું નામ બદલવા અથવા તેને કાઢી નાખવા તેને દબાવી રાખો (બટનથી: “પસંદ કરો” દબાવી રાખો). “નવી પ્રોફાઇલ તરીકે સાચવો” અત્યારે જે સેટ છે તે રાખે છે.\n\n“આગલી પ્રોફાઇલ” સૂચિની આગલી પ્રોફાઇલ પર જાય છે; તેને બટન પર અથવા નિયમમાં મૂકો."
