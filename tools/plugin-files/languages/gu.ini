diagnostics.plugin.description = ટેસ્ટ સ્ક્રીન અને ડિવાઇસના દરેક ભાગની માર્ગદર્શિત તપાસ.
diagnostics.plugin.how = "નિદાન એ ડિવાઇસ તપાસવા માટેની ટેસ્ટ સ્ક્રીન છે: તે ડિસ્પ્લે બતાવી શકે તે દરેક ભૂખરો સ્તર, બટન અને ટચ અજમાવવા માટે ચાર ખાનાં, અને રિફ્રેશ મોડની સરખામણી કરવા પ્રગતિ પટ્ટી સાથે પેજ કાઉન્ટર બતાવે છે.\n\nટેસ્ટ સ્ક્રીનની કોઈ મેનૂ એન્ટ્રી નથી. જ્યાં સુધી બીજું કોઈ પ્લગિન હોમ સ્ક્રીન ન આપે ત્યાં સુધી જ, અથવા પ્લગિન મેનેજરમાં સ્ક્રીન હેઠળ હોમ સ્ક્રીનની જગ્યા માટે તમે તેને પસંદ કરો ત્યારે, તે હોમ સ્ક્રીન હોય છે.\n\nપસંદ કરો ફોકસવાળું ખાનું ચિહ્નિત કરે છે, અને તીર બટન ખાનાં વચ્ચે ખસે છે; ટચથી, ખાના પર ટૅપ કરો. પેજ બટન ટેસ્ટ પેજ ફેરવે છે. ફરીથી શરૂ કરવા પસંદ કરો દબાવી રાખો, અથવા સ્ક્રીન પર આંગળી રાખી મૂકો.\n\nડિવાઇસ તપાસ, જ્યાં PaperPaw ડિવાઇસનું ફર્મવેર હોય ત્યાં ટૂલ હેઠળ, ડિવાઇસના દરેક ભાગમાંથી એક પછી એક પેજ પર પસાર થાય છે: સ્ક્રીન, બટન, ટચ, લાઇટ, બૅટરી, કાર્ડ, ઘડિયાળ, Wi-Fi, સ્લીપ અને મેમરી. દરેક પેજના અંતે નિષ્ફળ, છોડો અને પાસ હોય છે, અને તેના માપ સૂચવે તે જવાબ પસંદ કરેલો હોય છે; ડિવાઇસમાં ન હોય તે ભાગ છોડી દેવાય છે. દરેક જવાબ પછી તે .paperpaw/plugins/diagnostics/device-check.txtમાં રિપોર્ટ લખે છે, જે pull requestમાં પેસ્ટ કરી શકાય. પાછળ તેમાંથી બહાર નીકળે છે, અને ફરી ખોલવાથી તે જ્યાં હતી ત્યાંથી આગળ વધે છે. ફક્ત બટનવાળા ડિવાઇસ પર, પહેલાં બટન પેજ પર શરૂ કરો પસંદ કરો; ત્યાં સુધી તીર, પસંદ કરો અને પાછળ દરેક પેજની જેમ કામ કરે છે."
