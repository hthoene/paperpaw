pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = કામ અને વિરામના રાઉન્ડ, વિજેટ અને દૈનિક ગણતરી સાથેનું ફોકસ ટાઇમર.
pomodoro.plugin.how = "Pomodoro ટાઇમર: ધ્યાન આપીને રાઉન્ડમાં કામ કરો, પછી આરામ કરો. તેને કોઈ સેટઅપ જોઈતું નથી: 25 મિનિટ ફોકસ, 5 મિનિટ આરામ, અને ચાર રાઉન્ડ પછી 15 મિનિટનો લાંબો વિરામ.\n\nટૂલ મેનૂમાંથી Pomodoro ખોલો અને “શરૂ કરો” દબાવો, અથવા તેનાં વિજેટ હોમ સ્ક્રીનમાં ઉમેરો (હોમ સ્ક્રીન દબાવી રાખો, પછી વિજેટ ઉમેરો): “Pomodoro ટાઇમર” તબક્કો અને બાકી મિનિટ બતાવે છે, “Pomodoro શરૂ/થોભો” એક બટન છે, અને “આજે Pomodoro” તમે પૂરા કરેલા રાઉન્ડ તમારા દૈનિક લક્ષ્ય સાથે ગણે છે. ટાઇમર પર ટૅપ કરવાથી તે શરૂ થાય કે થોભે છે; પૂરી સ્ક્રીન ખોલવા તેને દબાવી રાખો.\n\nતમે સ્ક્રીન છોડો ત્યારે પણ ટાઇમર ચાલતું રહે છે, અને ફરી શરૂ કર્યા પછી ઘડિયાળ મુજબ આગળ ચાલે છે. રીડર સ્લીપમાં હોય ત્યારે કશું ચાલતું નથી: વચ્ચે પૂરો થયેલો તબક્કો જાગે ત્યારે જણાવાય છે. તબક્કો પૂરો થાય ત્યારે સૂચના જણાવે છે. બૅટરી બચાવવા ઘડિયાળ મિનિટમાં એક વાર અપડેટ થાય છે (પૂરી સ્ક્રીન પર છેલ્લી મિનિટમાં દર દસ સેકન્ડે) અને રીડરને ક્યારેય જાગતું રાખતી નથી.\n\nસેટિંગમાં Pomodoro હેઠળ તમે સમયગાળા અને એક સેટના રાઉન્ડ સેટ કરો છો, અને આગલો તબક્કો જાતે શરૂ થાય કે નહીં. “વધુ” હેઠળ: તબક્કો પૂરો થાય ત્યારે સ્ક્રીનનો ઝબકારો અથવા લાઇટનું ઝબકવું, અને દૈનિક લક્ષ્ય."
