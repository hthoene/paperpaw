format-html.plugin.name = HTML
format-html.plugin.description = ફાઇલ તરીકે સાચવેલાં વેબ પેજ ખોલે છે, ફક્ત વાંચવાનું હોય તે બતાવીને.
format-html.plugin.how = "ફાઇલ તરીકે સાચવેલાં વેબ પેજ (.html, .htm, .xhtml) પુસ્તકો તરીકે ખોલે છે: ફક્ત વાંચવાનું હોય તે જ, આસપાસનાં મેનૂ, જાહેરાતો અને એવું બધું વિના.\n\nફાઇલને લાઇબ્રેરી ફોલ્ડરમાં મૂકો અને કોઈ પણ પુસ્તકની જેમ લાઇબ્રેરીમાંથી ખોલો. પેજની અંદરની લિંક કામ કરે છે; ચિત્રો ફાઇલમાં જ્યાં હોય ત્યાં દેખાય છે."
format-html.title = વેબ પેજ (HTML)
format-images.plugin.name = ચિત્રો
format-images.plugin.description = ચિત્રો (.jpg, .png, .gif)ને પુસ્તકો તરીકે ખોલે છે, દરેક એક પેજ.
format-images.plugin.how = "ચિત્રો (.jpg, .png, .gif) લાઇબ્રેરીમાંથી પુસ્તકોની જેમ ખૂલે છે, દરેક પેજ પર એક ચિત્ર, સ્ક્રીનમાં બંધબેસતું.\n\nચિત્રોનું આખું ફોલ્ડર વાંચવા તેનું પહેલું ચિત્ર ખોલો: ફોલ્ડરમાં તેના પછીનાં ચિત્રો તેમનાં નામના ક્રમમાં (10 પહેલાં 2) આવે છે. ફોલ્ડરમાં પાછળનું ચિત્ર ત્યાંથી શરૂ થાય છે; દરેકનું વાંચનસ્થાન અલગથી યાદ રખાય છે. તમે ખોલો તે ચિત્રથી ફોલ્ડરનાં 300 સુધી ચિત્રો વંચાય છે.\n\nજે ફાઇલ ચિત્ર ન હોય, અથવા બહુ મોટી હોય, તે તેના બદલે તેનું નામ બતાવે છે. પોતાના શીર્ષકવાળા ઘણાં ચિત્રોના પુસ્તક માટે કૉમિક બુક આર્કાઇવ (.cbz) વધુ સારું સ્વરૂપ છે."
format-images.title = ચિત્ર
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ફાઇલો (.md) ખોલે છે, દા.ત. નોંધો.
format-markdown.plugin.how = "Markdown ફાઇલો (.md), જેમ કે નોંધો, પુસ્તકો તરીકે ખોલે છે: મથાળાં, સૂચિઓ, અવતરણો અને ભાર જેવાં હોવાં જોઈએ તેવાં, ચિહ્નો તરીકે નહીં.\n\nફાઇલોને લાઇબ્રેરી ફોલ્ડરમાં મૂકો અને લાઇબ્રેરીમાંથી ખોલો. પહેલું મથાળું તેનું શીર્ષક બને છે; ફાઇલની બાજુનાં ચિત્રો ટેક્સ્ટ જ્યાં તેમનું નામ લે ત્યાં દેખાય છે."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI પુસ્તકો
format-mobi.plugin.description = DRM વગરની .mobi અને .azw ફાઇલો ખોલે છે.
format-mobi.plugin.how = "MOBI પુસ્તકો (.mobi, .azw) કોઈ પણ પુસ્તકની જેમ લાઇબ્રેરીમાંથી ખૂલે છે, કશું સેટ કરવાની જરૂર નથી. શીર્ષક, લેખકો, ભાષા અને કવર પુસ્તકમાંથી આવે છે, અને અનુક્રમણિકા તેનાં મથાળાંમાંથી બને છે.\n\nપહેલી વાર ખોલો ત્યારે પુસ્તક રૂપાંતરિત થાય છે, લાંબા પુસ્તકમાં થોડી સેકન્ડ લાગે છે; ત્યાર પછી તે તરત ખૂલે છે. ટેક્સ્ટ, મથાળાં, બોલ્ડ અને ઇટાલિક, લિંક અને ચિત્રો બતાવાય છે.\n\nDRMવાળાં પુસ્તકો (દુકાનમાંથી ખરીદેલાં મોટા ભાગનાં પુસ્તકો) ખૂલી શકતાં નથી, તેમ જ Huffman કમ્પ્રેશનવાળાં કે નવા KF8 સ્વરૂપ (.azw3)નાં પુસ્તકો પણ નહીં: ખોલતી વખતે PaperPaw એ જણાવે છે. Calibre જેવા ટૂલ વડે બનાવેલી EPUB નકલ હંમેશાં ખૂલે છે."
format-mobi.title = MOBI પુસ્તકો
