plugin-manager.plugin.name = પ્લગિન મેનેજર
plugin-manager.plugin.description = પ્લગિનની સૂચિ બતાવે છે અને તેમને ચાલુ-બંધ કરે છે.
plugin-manager.plugin.how = "પ્લગિન મેનેજર દરેક પ્લગિનને તેના વર્ઝન અને વર્ણન સાથે બતાવે છે, અને પ્લગિન ચાલુ-બંધ કરે છે.\n\nતે સેટિંગમાં “પ્લગિન મેનેજ કરો” તરીકે મળશે. “પ્લગિન સેટિંગ” એ દરેક પ્લગિનના નેટવર્ક ઉપયોગ જેવી પસંદગીઓ માટેનું અલગ પેજ છે. પ્લગિન ચાલુ કે બંધ કરવા તેના પર ટૅપ કરો (બટનથી: તેને પસંદ કરો). ફેરફાર ફરી શરૂ કર્યા પછી લાગુ થાય છે: પછી નીચેનો બાર “હમણાં ફરી શરૂ કરો” આપે છે. તે કેવી રીતે કામ કરે છે તે વાંચવા પ્લગિનને દબાવી રાખો (બટનથી: “પસંદ કરો” દબાવી રાખો).\n\n“હંમેશાં ચાલુ” ચિહ્નિત પ્લગિન બંધ કરી શકાતું નથી, અને “જરૂરી” ચિહ્નિત પ્લગિન ત્યારે જ બંધ થાય જ્યારે બીજું પ્લગિન તેનું કામ કરે, નહીં તો PaperPaw પાસે પાછા આવવાનો કોઈ રસ્તો ન રહે. “સ્ક્રીન” હેઠળ તમે પસંદ કરો છો કે જે સ્થાન ઘણાં પ્લગિન આપે છે તે કયું પ્લગિન બતાવે."
