vocabulary.sd.readme = "ફાઇલોમાંથી ફ્લૅશ કાર્ડ\n\nદરેક ડેક માટે અહીં એક ફાઇલ મૂકો: Spanish.tsv થી Spanish ડેક બને છે.\nફાઇલો: .tsv, .csv કે .txt, UTF-8 તરીકે સાચવેલી, અથવા .apkg: Anki ડેક, “Support older Anki versions” પર ટિક કરીને એક્સપોર્ટ કરેલું. તેની નોંધોનાં પહેલાં ત્રણ ફીલ્ડ આગળની બાજુ, પાછળની બાજુ અને ઉદાહરણ બને છે; શેડ્યૂલિંગ અને મીડિયા વંચાતાં નથી, અને PaperPaw ક્યારેય Anki ફાઇલ લખતું નથી.\n\nદરેક લાઇનમાં એક કાર્ડ: આગળની બાજુ, પાછળની બાજુ અને ઉદાહરણ (વૈકલ્પિક), ટૅબ, અલ્પવિરામ કે અર્ધવિરામથી અલગ. પહેલી લાઇનમાં કૉલમનાં નામ હોઈ શકે: front, back, example. ઉદાહરણ:\n\nKatze\tcat\tDie Katze schläft.\n\nપછી રીડર પર ફ્લૅશ કાર્ડ ખોલો, SD કાર્ડ પરનાં કાર્ડ પસંદ કરો અને ડેક અપડેટ કરો.\n\nજાણવા જેવું:\n- ડેક પ્રગતિ સાથે રીડર પર રહે છે. નવી કે બદલાયેલી ફાઇલ વંચાય છે, અને તેનાં કાર્ડ ડેકમાં ઉમેરાય કે બદલાય છે.\n- પાછળની બાજુ કે ઉદાહરણ બદલો: કાર્ડ બદલાય છે, પ્રગતિ રહે છે.\n- આગળનું ટેક્સ્ટ બદલો: તે નવું કાર્ડ ગણાય છે, અને જૂનું શરૂઆતથી શરૂ થાય છે. કાર્ડ આગળના ટેક્સ્ટથી મેળવાય છે, સ્પેસ અને કૅપિટલ અક્ષરો ગણાતા નથી. ડેકને ફાઇલમાં સાચવો (SD કાર્ડ પરનાં કાર્ડ, ડેક કાર્ડ પર સાચવો) તો દરેક કાર્ડને id કૉલમમાં નંબર મળે છે: પછી આગળની બાજુ બદલો, પહેલી બે લાઇન જેમ છે તેમ રાખો, અને પ્રગતિ રહે છે.\n- સાચવવાથી ડેકનાં કાર્ડ લખાય છે; ફાઇલમાંની બાકીની વસ્તુ (આગળની બાજુ વગરની લાઇન) રહેતી નથી, અને જૂની ફાઇલ _name.bak.tsv માં કૉપિ થાય છે.\n- CSV UTF-8 તરીકે સાચવો (UTF-16 કે સ્પ્રેડશીટનું પોતાનું ફૉર્મેટ નહીં). 4 MiB કે 20,000 લાઇનથી મોટી ફાઇલ વંચાતી નથી: તેને વહેંચો.\n- કાઢેલી લાઇન કાર્ડ કાઢતી નથી, સિવાય કે તે ડેક માટે ખૂટતાં કાર્ડ કાઢી નાખવાનું ચાલુ હોય; ત્યારે કાર્ડ પ્રગતિ સાથે જાય છે.\n- _ થી શરૂ થતાં નામવાળી ફાઇલો વંચાતી નથી.\n"
