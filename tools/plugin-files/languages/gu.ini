opds.plugin.name = OPDS કૅટલૉગ
opds.plugin.description = OPDS કૅટલૉગ બ્રાઉઝ કરે છે, તેમનાં પુસ્તકો ડાઉનલોડ કરે છે અને ફોલ્ડરને તેમની સાથે સિંકમાં રાખે છે.
opds.plugin.how = "OPDS કૅટલૉગ એ Project Gutenberg, Calibre-Web, Kavita અથવા Komga જેવી ઑનલાઇન લાઇબ્રેરી છે. આ પ્લગિન તેમને ફોલ્ડરની જેમ બ્રાઉઝ કરે છે અને શોધે છે, અને તેમનાં પુસ્તકો લાઇબ્રેરીમાં ડાઉનલોડ કરે છે.\n\nટૂલ મેનૂમાંથી “કૅટલૉગ” ખોલો અને “કૅટલૉગ ઉમેરો” પસંદ કરો: સરનામું અને, જો કૅટલૉગને એકાઉન્ટ જોઈતું હોય, તો વપરાશકર્તાનું નામ અને પાસવર્ડ. કૅટલૉગ બ્રાઉઝ કરવા તેના પર ટૅપ કરો; સિંક કરવા, ફેરફાર કરવા અથવા કાઢી નાખવા તેને દબાવી રાખો (બટનથી: “પસંદ કરો” દબાવી રાખો).\n\n“આ કૅટલૉગ સિંક કરો” ચાલુ હોય ત્યારે “કૅટલૉગ સિંક કરો” તેનાં નવાં પુસ્તકો તેના ફોલ્ડરમાં ડાઉનલોડ કરે છે. “સિંક દીઠ પુસ્તકો” એક સિંકમાં કેટલાં પુસ્તકો આવે તેની મર્યાદા રાખે છે, જેથી મોટો કૅટલૉગ ડિવાઇસ ભરી ન દે. કૅટલૉગને બદલે ક્લાઉડ ફોલ્ડર (WebDAV) પણ ચાલે છે."
