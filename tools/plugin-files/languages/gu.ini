diagnostics.check.touch.help = ખૂણા અને કિનારીઓ પરના દરેક વર્તુળ પર ટૅપ કરો. બધાં ભરાઈ જાય એટલે તપાસ જાતે આગળ વધે છે.
diagnostics.check.light.title = લાઇટ
diagnostics.check.light.help = લાઇટ બંધ, અડધી અને પૂરી થાય છે, પછી ઠંડી અને ગરમ. અંતે તમારું પોતાનું સેટિંગ પાછું આવે છે.
