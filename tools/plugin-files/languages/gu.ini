format-txt.plugin.name = સાદો ટેક્સ્ટ
format-txt.plugin.description = સાદી ટેક્સ્ટ ફાઇલો (.txt) ખોલે છે.
format-txt.plugin.how = "સાદી ટેક્સ્ટ ફાઇલો (.txt) કોઈ પણ પુસ્તકની જેમ લાઇબ્રેરીમાંથી ખૂલે છે, કશું સેટ કરવાની જરૂર નથી. પ્લગિન UTF-8, UTF-16 અને Windows-1252 ટેક્સ્ટ વાંચે છે અને એન્કોડિંગ જાતે ઓળખે છે.\n\nફકરા ફાઇલની ખાલી લીટીઓ પ્રમાણે બને છે; ફાઇલમાં ખાલી લીટી ન હોય, તો દરેક લીટી એક ફકરો બને છે. Project Gutenberg ફાઇલોમાં શરૂઆત અને અંતનો લાઇસન્સ ટેક્સ્ટ છોડી દેવાય છે, અને શીર્ષક તથા લેખક હેડરમાંથી લેવાય છે.\n\nફાઇલ ક્યારેય આખી લોડ થતી નથી, તેથી ખૂબ મોટા ટેક્સ્ટ નાનાં ડિવાઇસ પર પણ ખૂલે છે."
format-txt.title = સાદો ટેક્સ્ટ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC અને XTCH પુસ્તકો ખોલે છે, Xteink રીડર માટે પહેલેથી રેન્ડર કરેલાં પેજ.
format-xtc.plugin.how = "XTC અને XTCH ફાઇલો એવાં પુસ્તકો છે જેનાં પેજ પહેલેથી ચિત્ર તરીકે રેન્ડર થયેલાં હોય છે, જેમ Xteink રીડર માટેના કન્વર્ટર બનાવે છે. તે કોઈ પણ પુસ્તકની જેમ લાઇબ્રેરીમાંથી ખૂલે છે.\n\nદરેક પેજ સ્થિર ચિત્ર હોવાથી ટેક્સ્ટનું કદ બદલી શકાતું નથી કે બીજો ફોન્ટ વાપરી શકાતો નથી. પેજ કાળાં-સફેદ હોય છે અથવા તેમાં ભૂખરા રંગની ચાર છાયા હોય છે. દરેક પેજ બતાવાય ત્યારે ડીકોડ થાય છે, તેથી ઓછી મેમરી જોઈએ છે, X4 પર પણ.\n\nફાઇલમાં હોય તો શીર્ષક, લેખક અને પ્રકરણો તેમાંથી લેવાય છે."
format-xtc.title = XTC પેજ
help.plugin.name = સંકેતો
help.plugin.description = સ્ક્રીન પહેલી વાર ખૂલે ત્યારે તેનાં નિયંત્રણો શું કરે છે તે બતાવે છે.
help.plugin.how = "સ્ક્રીન પહેલી વાર ખૂલે ત્યારે તેના પર એક ટૂંકી નોંધ જણાવે છે કે તેનાં નિયંત્રણો શું કરે છે: સ્ક્રીનના કયા ભાગમાં ટૅપ કરવાથી શું થાય છે, ચોકઠામાં બતાવેલું, અને બટન શું કરે છે.\n\nએક ટૅપ કે કોઈ પણ બટન નોંધ બંધ કરે છે, અને તે સ્ક્રીન માટે તે ફરી દેખાતી નથી. “વધુ સંકેતો નહીં” બધા સંકેતો બંધ કરે છે.\n\nસેટિંગમાં, સિસ્ટમ હેઠળ, “સંકેતો” તેમને ચાલુ કે બંધ કરે છે, અને “સંકેતો ફરી બતાવો” દરેક સ્ક્રીનની નોંધ વધુ એક વાર બતાવે છે."
