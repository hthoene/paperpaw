core.usb-drive.text = USB ડ્રાઇવ તરીકે કનેક્ટ થયું છે: કાર્ડ કમ્પ્યુટર પર છે. તેને પાછું મેળવવા ત્યાં ડ્રાઇવ બહાર કાઢો અથવા પાછળ દબાવો; પછી ઓકે દબાવો. તમે કૉપિ કરેલી ફાઇલો પછીથી લાઇબ્રેરીમાં દેખાશે.
