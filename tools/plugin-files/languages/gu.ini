diagnostics.check.sleep.help = હમણાં સ્લીપ પસંદ કરો, પછી ડિવાઇસને તેના પાવર બટનથી જગાડો. તપાસ આગળ વધે છે, મેનૂમાંથી ફરી ખોલો તો પણ.
