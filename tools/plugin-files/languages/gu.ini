setup.plugin.name = સેટઅપ
setup.plugin.description = પહેલી વાર શરૂ કરતી વખતે મહત્ત્વનાં સેટિંગમાંથી ટૂંકી માર્ગદર્શિકા.
setup.plugin.how = "સેટઅપ મહત્ત્વનાં સેટિંગમાંથી પસાર કરાવતી ટૂંકી માર્ગદર્શિકા છે, જે PaperPaw પહેલી વાર શરૂ થાય ત્યારે એક જ વાર બતાવાય છે. દરેક પેજ એક વસ્તુ પૂછે છે, જેમ કે ભાષા, બટન, ટેક્સ્ટનું કદ, સમય ઝોન, Wi-Fi કે ઉમેરવા માટે થોડાં પ્લગિન, અને યોગ્ય જવાબ પહેલેથી પસંદ કરેલો હોય છે, તેથી “આગળ” હંમેશાં બરાબર છે. આ ડિવાઇસને જરૂર ન હોય તેવાં પગલાં છોડી દેવાય છે.\n\nબટન પર ટૅપ કરો, અથવા ઉપર અને નીચે બટન અને “પસંદ કરો” વાપરો. પહેલા પેજ પર “છોડો” સેટઅપમાંથી તરત બહાર લઈ જાય છે. છેલ્લું પેજ જણાવે છે કે તમારાં પુસ્તકો ક્યાંથી આવે છે.\n\nતેને ફરી ચલાવવા, સેટિંગ ખોલો અને “PaperPaw સેટ કરો” પસંદ કરો. અહીં પસંદ કરેલું બધું પછીથી સેટિંગમાં બદલી શકાય છે."
