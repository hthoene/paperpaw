stats.plugin.description = તમે કેટલો સમય અને કેટલું વાંચો છો તે નોંધે છે, કૅલેન્ડર અને દરેક પુસ્તકના આંકડા સાથે.
stats.plugin.how = "વાંચનના આંકડા તમે દરેક પેજ કેટલો સમય વાંચો છો તે નોંધે છે. તમે તેને આજ, અઠવાડિયું અને તમારી સળંગ શ્રેણી સાથેના સારાંશ તરીકે, કૅલેન્ડર તરીકે, અને દરેક પુસ્તકના આંકડા સાથે જુઓ છો.\n\nતેને “ટૂલ”માંથી, અથવા રીડરમાં “વધુ”માંથી ખોલો. સેટિંગમાં, “વાંચનના આંકડા” હેઠળ, તમે “વાંચન નોંધો” બંધ કરી શકો છો, “રોજનું લક્ષ્ય” સેટ કરી શકો છો, અને ગણાતાં “સૌથી ટૂંકું પેજ” અને “સૌથી લાંબું પેજ” સેટ કરી શકો છો, જેથી ઝડપથી પાનાં ફેરવવાથી કે ખુલ્લું રહી ગયેલું પુસ્તક આંકડા ન બગાડે.\n\n“KOReader સાથે સિંક કરો” WebDAV ફોલ્ડર દ્વારા KOReader સાથે આંકડા શેર કરે છે. તે એ જ ડિવાઇસ પરના KOReaderના આંકડા પણ લઈ લે છે. નોંધવા માટે ઘડિયાળ સેટ હોવી જોઈએ: જ્યાં ન હોય ત્યાં, એક વાર Wi-Fi સાથે કનેક્ટ કરો."
