fonts-browser.plugin.description = ઇન્ટરનેટ પરથી ફોન્ટ બતાવે છે, દરેક નમૂના સાથે, અને વાંચવા માટે તેમને ડાઉનલોડ કરે છે.
fonts-browser.plugin.how = "વધુ ફોન્ટ ઇન્ટરનેટ પરની ફોન્ટ લાઇબ્રેરીમાંથી ફોન્ટની સૂચિ બતાવે છે, દરેક નામ તેના પોતાના ફોન્ટમાં, અને તમે પસંદ કરો તે ડાઉનલોડ કરે છે.\n\nતે ફોન્ટની સૂચિના અંતે મળશે: સેટિંગમાં વાંચન હેઠળ ફોન્ટ (સ્ટેટસ લાઇનના ફોન્ટમાં પણ). નમૂના વાક્ય સાથે મોટો જોવા ફોન્ટ પર ટૅપ કરો (બટનથી: પસંદ કરો), પછી ડાઉનલોડ કરો પસંદ કરો; ડાઉનલોડ ચાલે ત્યારે પેજ છોડી શકો છો. પછી (ફોન્ટનું નામ) વડે વાંચો અથવા સ્ટેટસ લાઇન માટે વાપરો પસંદ કરો. અપડેટ કરો નવું વર્ઝન લાવે છે, કાઢી નાખો ફોન્ટ ડિવાઇસમાંથી કાઢે છે. તેને Wi-Fi જોઈએ.\n\nતમારા પોતાના ફોન્ટ\n\nસૂચિમાં વધુ ફોન્ટની બાજુમાં તમારા પોતાના ફોન્ટ છે. પોતાનો ફોન્ટ .ttf કે .otf ફાઇલ હોય છે.\n\nAndroid અને ફોન્ટ ફાઇલો દોરી શકતાં ડિવાઇસ પર: ફાઇલને fonts ફોલ્ડરમાં કૉપિ કરો (Android: શેર કરેલા સ્ટોરેજમાં PaperPaw/fonts), PaperPaw ફરી શરૂ કરો અને સેટિંગમાં વાંચન હેઠળ ફોન્ટ તરીકે તે પસંદ કરો.\n\nXteink X4 અને X4 Pro ફોન્ટ ફાઇલો નહીં, ફોન્ટ પૅક વાંચે છે. કમ્પ્યુટર પર paperpaw-fontgen વડે દરેક શૈલી માટે પૅક બનાવો (regular જરૂરી):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nઆનાથી plugins/font-my-font ફોલ્ડર બને છે. તેને મેમરી કાર્ડના plugins ફોલ્ડરમાં કૉપિ કરો, ફરી શરૂ કરો અને ફોન્ટ તરીકે My Font પસંદ કરો. લેટિન માટે એક શૈલી આશરે અડધો MB હોય છે; ખૂટતી શૈલીઓ regularમાં દોરાય છે. ટૂલ જણાવે છે કે માગેલા અક્ષરોમાંથી કેટલા ફોન્ટમાં છે (--chars latin,cyrillic,greek લિપિઓ ઉમેરે છે); તમારા પુસ્તકની લિપિ આવરી લેતો ફોન્ટ પસંદ કરો.\n\nવધુ ફોન્ટમાંથી મળેલા ફોન્ટ પણ આ જ રીતે કામ કરે છે, કમ્પ્યુટર વગર.\n\ne-ink પર વધુ સ્પષ્ટ નાના ટેક્સ્ટ માટે કમાન્ડમાં --hinting light ઉમેરો: અક્ષરો માનક ફોન્ટની જેમ પિક્સેલ ગ્રિડમાં બેસે છે. ગુજરાતી, અરબી કે દેવનાગરી જેવા માત્રાવાળા ફોન્ટને તેના વિના રાખો."
