keyboard.plugin.name = કીબોર્ડ
keyboard.plugin.description = ટચથી કે બટન વડે સ્ક્રીન પર ટેક્સ્ટ દાખલ કરે છે.
keyboard.plugin.how = "જ્યારે પણ કશામાં ટેક્સ્ટ જોઈએ ત્યારે કીબોર્ડ ખૂલે છે: શોધ, પાસવર્ડ, નોંધ કે સેટિંગ. તે ટચથી અને ફક્ત બટન વડે પણ કામ કરે છે.\n\nબટન વડે, ડાબે અને જમણે પંક્તિમાં ખસે છે, પેજ બટન પંક્તિઓ વચ્ચે ખસે છે, “પસંદ કરો” કી દબાવે છે અને “પાછળ” રદ કરે છે; ડાબે અને જમણે પંક્તિમાં ગોળ ફરે છે, અને ઉપર તથા નીચે તમારી કૉલમમાં રહે છે. શિફ્ટ આગલો અક્ષર કેપિટલ બનાવે છે; બધા કેપિટલ માટે તેને બે વાર દબાવો, અને બંધ કરવા વધુ એક વાર. અક્ષર દબાવી રાખો (બટન વડે: તેના પર “પસંદ કરો” દબાવી રાખો) તો તેનો કેપિટલ, તરત પસંદ થયેલો, અને é તથા è જેવાં ઍક્સેન્ટ મળે છે; જર્મનમાં ä, ö, ü અને ß આ રીતે a, o, u અને sમાંથી મળે છે (બટન વડે, કીબોર્ડ તે અક્ષરો પર આ જણાવે છે). “ઓકે” પૂરું કરે છે; બટન વડે, ગમે ત્યાંથી પૂરું કરવા “પાછળ” દબાવી રાખો (ફક્ત “પાછળ” રદ કરે છે), અથવા અક્ષર ન હોય તેવી કી પર “પસંદ કરો” દબાવી રાખો. “પેસ્ટ કરો” ક્લિપબોર્ડનો ટેક્સ્ટ દાખલ કરે છે, અને “ફોન”, જ્યાં હોય ત્યાં, તમને તેના બદલે ફોન પર ટાઇપ કરવા દે છે.\n\nસેટિંગમાં ડિવાઇસ, કીબોર્ડ હેઠળ: “કીબોર્ડ લેઆઉટ” લેઆઉટ પસંદ કરે છે. માનક રીતે તે મેનૂની ભાષાને અનુસરે છે; ઘણાં લેઆઉટ હોય તો એક કી તેમની વચ્ચે બદલે છે. “ઉમલાઉટ કી” ä, ö, ü અને ß માટે અલગ કી આપે છે. “કદ” કી અને અક્ષરો મોટાં કરે છે; ફક્ત બટન વડે, પંક્તિઓ કમ્પ્યુટર કીબોર્ડની જ રહે છે. ટચ સ્ક્રીન પર “કીનો આકાર” કી કેવી દેખાય તે બદલે છે. “ઑટોમૅટિક કેપિટલ” દરેક વાક્ય કેપિટલથી શરૂ કરે છે."
