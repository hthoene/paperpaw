format-cbz.setting.panels.help = એક સમયે એક પૅનલ, પેજ ફેરવવાથી એક પછી એક.
format-docx.plugin.name = DOCX દસ્તાવેજો
format-docx.plugin.description = Word અને અન્ય પ્રોગ્રામ સાચવે તેવી .docx ફાઇલો ખોલે છે.
format-docx.plugin.how = ".docx દસ્તાવેજોને પુસ્તકો તરીકે ખોલે છે: વિષયસૂચિ સાથે મથાળાં, સૂચિઓ, કોષ્ટકો, બોલ્ડ અને ઇટાલિક, લિંક અને ચિત્રો (JPEG, PNG, GIF).\n\nફાઇલોને લાઇબ્રેરી ફોલ્ડરમાં મૂકો અને લાઇબ્રેરીમાંથી ખોલો. શીર્ષક અને લેખક દસ્તાવેજના ગુણધર્મોમાંથી આવે છે. ફૂટનોટ, હેડર અને ફૂટર, અને ટિપ્પણીઓ બતાવાતાં નથી."
format-docx.title = DOCX દસ્તાવેજ
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB પુસ્તકોને તેમની શૈલી, વિષયસૂચિ અને ચિત્રો સાથે ખોલે છે.
format-epub.plugin.how = "EPUB પુસ્તકો લાઇબ્રેરીમાંથી બીજા કોઈ પણ પુસ્તકની જેમ, તેમની વિષયસૂચિ, ચિત્રો અને પ્રકાશકની શૈલી સાથે ખૂલે છે. વેબ પેજ (HTML), Markdown, FictionBook (.fb2) અને કૉમિક બુક આર્કાઇવ (.cbz) પણ આ જ રીતે ખૂલે છે, દરેક પોતાના અલગ પ્લગિન તરીકે.\n\nપ્રકરણ પહેલી વાર ખોલો ત્યારે રૂપાંતરિત થાય છે અને પ્લગિનના કૅશમાં રખાય છે, તેથી પછી તે ઝડપી ખૂલે છે અને મોટાં પુસ્તકો નાનાં ડિવાઇસ પર પણ ચાલે છે. વિષયસૂચિ વાંચન મેનૂમાં વિષયસૂચિ હેઠળ મળશે. પુસ્તકની પોતાની શૈલી લાગુ થાય કે નહીં તે વાંચન હેઠળનું સેટિંગ પ્રકાશકનું ફૉર્મેટિંગ નક્કી કરે છે."
format-epub.title = EPUB ઇ-બુક
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook પુસ્તકો (.fb2, zip કરેલાં પણ) ખોલે છે.
format-fb2.plugin.how = "FictionBook પુસ્તકો (.fb2) ખોલે છે, જે રશિયન અને અન્ય પુસ્તકો માટે સામાન્ય છે, zip કરેલાં (.fb2.zip) પણ, તેમનાં શીર્ષક, લેખકો, કવર અને પ્રકરણો સાથે.\n\nતેમને લાઇબ્રેરી ફોલ્ડરમાં મૂકો; તે લાઇબ્રેરીમાં દેખાય છે અને બીજા કોઈ પણ પુસ્તકની જેમ ખૂલે છે."
