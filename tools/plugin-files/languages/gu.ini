vocabulary.web.import-help = દરેક લાઇનમાં એક કાર્ડવાળી CSV, TSV કે TXT ફાઇલ ઉમેરો, અથવા Ankiમાંથી એક્સપોર્ટ કરેલું ડેક (.apkg, “Support older Anki versions” સાથે), અથવા કોઈ સૂચિ પેસ્ટ કરો. કાર્ડ આ ડેકમાં જાય છે. દરેક લાઇન: આગળની બાજુ, પાછળની બાજુ અને ઉદાહરણ (વૈકલ્પિક), ટૅબ, અલ્પવિરામ કે અર્ધવિરામથી અલગ. ઉદાહરણ: Katze;cat;Die Katze schläft. ફાઇલો UTF-8 ટેક્સ્ટ હોવી જોઈએ; ડેક દીઠ વધુમાં વધુ 20,000 કાર્ડ.
