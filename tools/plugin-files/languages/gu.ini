weather.plugin.name = હવામાન
weather.plugin.description = હમણાંનું અને આગલા દિવસોનું હવામાન વિજેટ તરીકે, Open-Meteo પરથી.
weather.plugin.how = "હવામાન હોમ સ્ક્રીન માટેનાં વિજેટ તરીકે હમણાંનું અને આગલા દિવસોનું હવામાન બતાવે છે, Open-Meteo પરથી, જેને કોઈ એકાઉન્ટ કે કીની જરૂર નથી. હમણાંનું હવામાન તાપમાન, સ્થિતિ અને પસંદ કરી શકાય તેવું વધુ બતાવે છે; આગાહી આગલા દિવસો એક હરોળમાં કે સૂચિમાં બતાવે છે.\n\nપહેલાં સ્થળ પસંદ કરો: સેટિંગમાં, હવામાન હેઠળ, સ્થળ (નામ ટાઇપ કરો, પછી મળેલાં સ્થળોમાંથી પસંદ કરો). ફક્ત તેના કોઑર્ડિનેટ મોકલાય છે, અને તે પણ ફક્ત હવામાન વિજેટ દેખાતું હોય ત્યારે. હોમ સ્ક્રીનમાં ફેરફાર કરીને વિજેટ ઉમેરો.\n\nહવામાન વધુમાં વધુ એટલી વાર લવાય છે જેટલું અપડેટ વધુમાં વધુ દર કહે, અને ફક્ત નેટવર્ક હોય ત્યારે: તે ક્યારેય જાતે Wi-Fi ચાલુ કરતું નથી.\n\nહવામાન ડેટા Open-Meteo.com (https://open-meteo.com) તરફથી, Creative Commons Attribution 4.0 લાઇસન્સ (CC BY 4.0) હેઠળ."
