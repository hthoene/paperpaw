widgets.plugin.description = હોમ સ્ક્રીન માટે ઘણાં વધુ વિજેટ: ઘડિયાળો, કૅલેન્ડર, સુવિચાર, પુસ્તકો, નોંધો અને વધુ.
widgets.plugin.how = "વિજેટ પૅક હોમ સ્ક્રીન માટે ઘણાં વિજેટ ઉમેરે છે: ઘડિયાળો (એનાલૉગ, શબ્દ, ટાઇલ, વિશ્વ), કૅલેન્ડર, અત્યાર સુધીનું વર્ષ, કાઉન્ટડાઉન, ચંદ્રની કળા, અને દિવસ અને તારીખ; આજનો સુવિચાર, નોંધો, કરવાનાં કામ, ચિત્રો, શુભેચ્છા અને PaperPaw લોગો; અને પુસ્તકો માટે, હાલ વંચાતું, પ્રગતિ, હવે પછીનું, શ્રેણી, મનપસંદ, હાઇલાઇટ અને આંકડામાં લાઇબ્રેરી. બૅટરી વિજેટ પણ તેમાં છે.\n\nમેનૂમાં હોમ સ્ક્રીનમાં ફેરફાર કરો (અથવા હોમ સ્ક્રીન પર લાંબું દબાવીને) વડે, પછી વિજેટ ઉમેરો વડે તેમને ઉમેરો. દરેકનાં પોતાનાં સેટિંગ છે, જેમ કે ફ્રેમ, કદ અને ગોઠવણી. આજના સુવિચાર જેવું બદલાતું વિજેટ પસંદ કરવાથી આગલું બતાવે છે. તમારા પોતાના સુવિચાર કાર્ડ પર .paperpaw/plugins/widgets માંની quotes.txt માં જાય છે, દરેક લાઇન ટેક્સ્ટ | લેખક તરીકે. સમયનાં વિજેટને સેટ કરેલી ઘડિયાળ જોઈએ; Wi-Fi તેને સેટ કરે છે."
