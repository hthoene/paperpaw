core.host-install.older = આ ઇન્સ્ટૉલ કરેલા વર્ઝન કરતાં જૂનું વર્ઝન છે.
core.host-install.same = આ વર્ઝન પહેલેથી ઇન્સ્ટૉલ કરેલું છે.
core.host-firmware.question = ડિવાઇસ સૉફ્ટવેર {name} ({version}) ઇન્સ્ટૉલ કરીએ?
core.host-firmware.foreign = આ PaperPaw ની જગ્યાએ બીજું ડિવાઇસ સૉફ્ટવેર મૂકે છે. PaperPaw જાતે ફરી શરૂ થશે નહીં.
core.host-firmware.no-undo = PaperPaw આ ફેરફાર પાછો લઈ શકતું નથી. પાછા આવવા માટે બીજા સૉફ્ટવેરનો રિકવરી વિકલ્પ વાપરો અથવા વેબ ફ્લૅશર વડે PaperPaw ફરીથી ઇન્સ્ટૉલ કરો.
core.host-firmware.kept = PaperPaw ડિવાઇસની મેમરીમાં રહે છે. મેમરી કાર્ડ પરની ફાઇલો બદલાતી નથી.
core.host-firmware.unsigned = આ સૉફ્ટવેર પર સહી નથી. ફક્ત તેની ફાઇલ રચના અને ડિવાઇસ સાથે સુસંગતતા તપાસાય છે; તેનો સ્રોત ચકાસાતો નથી.
core.host-firmware.unknown-key = આ સૉફ્ટવેર પર અજાણી કી વડે સહી થઈ છે. અહીં બતાવેલી કી પર વિશ્વાસ હોય તો જ તેને ઇન્સ્ટૉલ કરો.
core.host-firmware.downgrade = આ જૂનું વર્ઝન પાછલું વર્ઝન આપમેળે પાછું લાવી શકતું નથી. પાછા આવવા માટે વેબ ફ્લૅશર વડે PaperPaw ફરીથી ઇન્સ્ટૉલ કરો.
core.host-firmware.early-crash = જો નવું સૉફ્ટવેર તેની શરૂઆતની સુરક્ષા તપાસ પહેલાં ક્રૅશ થાય, તો ડિવાઇસ શરૂ થવાનું બંધ થઈ શકે. ત્યારે PaperPaw પાછું લાવવા વેબ ફ્લૅશર જોઈશે.
core.host-remove.question = {name} કાઢી નાખીએ? તેના સાચવેલા ડેટાનું શું કરવું?
core.host-remove.keep = કાઢો અને ડેટા રાખો
core.host-remove.delete = કાઢો અને ડેટા ડિલીટ કરો
core.host-remove.warning = ડેટા ડિલીટ કરવાથી તેનાં સાચવેલાં સેટિંગ અને ફાઇલો પણ જતાં રહે છે. આ પાછું લઈ શકાતું નથી.
core.host-wifi.join = {plugin} Wi-Fi “{network}” સાથે કનેક્ટ થવા માગે છે. મંજૂરી આપીએ?
core.host-wifi.hotspot = {plugin} Wi-Fi હૉટસ્પૉટ “{network}” શરૂ કરવા માગે છે. મંજૂરી આપીએ?
core.host-ui.phone-locked = ડિવાઇસ લૉક હોય ત્યારે ફોન પરથી ટાઇપ કરી શકાતું નથી.
core.host-ui.typing-stopped = ટેક્સ્ટ ઘણું લાંબું હોવાથી લાઇવ અપડેટ બંધ થયાં છે. તમે ટાઇપ કરવાનું ચાલુ રાખી શકો છો; પુષ્ટિ કરશો ત્યારે આખું ટેક્સ્ટ મોકલાશે.
core.host-ui.text-full = ટેક્સ્ટ ઘણું લાંબું છે. તેને ટૂંકું કરીને ફરી પ્રયાસ કરો. કશું કપાયું નથી.
core.host-ui.clipboard-full = ક્લિપબોર્ડ માટે ટેક્સ્ટ ઘણું લાંબું છે. નાની પસંદગી કૉપિ કરો. ક્લિપબોર્ડનું પહેલાંનું ટેક્સ્ટ બદલાયું નથી.
core.host-ui.clipboard-card = ક્લિપબોર્ડ વાંચી કે લખી શકાતું નથી. મેમરી કાર્ડ દાખલ કરેલું અને વાંચી શકાય તેવું છે કે નહીં તે તપાસો.
core.host-ui.card-full = મેમરી કાર્ડ ભરાઈ ગયું છે. થોડી જગ્યા ખાલી કરો અને ફરી પ્રયાસ કરો.
core.host-ui.card-error = મેમરી કાર્ડ પર ટેક્સ્ટ વાંચી કે સાચવી શકાયું નહીં. કાર્ડ તપાસો અને ફરી પ્રયાસ કરો.
core.host-permission.library = તમારી આખી લાઇબ્રેરી, વાંચનસ્થાનો અને દરેક પ્લગિનનાં હાઇલાઇટ અને નોંધો વાંચી શકે છે અને બદલી શકે છે.
core.host-library.import-failed = પુસ્તક લાઇબ્રેરીમાં ઉમેરી શકાયું નહીં. મેમરી કાર્ડ તપાસો અને ફરી પ્રયાસ કરો.
core.host-library.name-taken = આ નામનું પુસ્તક પહેલેથી છે. બીજું નામ પસંદ કરો.
core.host-library.replace-denied = આ પ્લગિન તે પુસ્તક બદલી શકતું નથી. તે ફક્ત પોતે ઉમેરેલાં અને ત્યાર પછી ખસેડાયાં ન હોય તેવાં પુસ્તકો જ બદલી શકે છે.
core.host-safe-mode.power-escape = તમે ડિવાઇસ ફરી શરૂ કરવા પાવર બટન દબાવી રાખ્યું ત્યારે પ્લગિન {plugin} એ પ્રતિસાદ આપવાનું બંધ કર્યું હતું, તેથી તેને બંધ કરવામાં આવ્યું.
core.notice-box = સૂચના
core.firmware.title = આ ફર્મવેર ઇન્સ્ટૉલ કરીએ?
core.firmware.title.restart = નવા ફર્મવેર સાથે ફરી શરૂ કરીએ?
core.firmware.asked-by = {name} દ્વારા વિનંતી.
core.firmware.image = {project} {version}
core.firmware.signed = {key} દ્વારા સહી કરેલું.
core.firmware.other-key = PaperPaw ની ન હોય તેવી કી વડે સહી કરેલું: {fingerprint}. તેના પર વિશ્વાસ હોય તો જ ઇન્સ્ટૉલ કરો.
core.firmware.unsigned = સહી કરેલું નથી.
core.firmware.older = આ જૂનું વર્ઝન છે, અથવા એ જ વર્ઝન છે.
core.firmware.foreign.1 = આ બીજું ફર્મવેર છે, PaperPaw નથી. PaperPaw જાતે ફરી શરૂ થતું નથી.
core.firmware.foreign.2 = PaperPaw આ પાછું લેતું નથી. પાછા આવવાનું બીજા ફર્મવેર અથવા ફ્લૅશ ટૂલ પર આધાર રાખે છે (વેબ ફ્લૅશર કામ કરે છે).
core.firmware.foreign.3 = PaperPaw ફ્લૅશમાં રહે છે અને કાર્ડ પરની તમારી ફાઇલોને અડવામાં આવતું નથી.
core.firmware.foreign.4 = તેના પર સહી નથી, ફક્ત બૂટ લોડર તેને જે રીતે શરૂ કરે તે રીતે તપાસાયું છે.
core.firmware.yes = ઇન્સ્ટૉલ કરો
core.firmware.yes.restart = ફરી શરૂ કરો
core.firmware.no = રદ કરો
core.firmware.dual.title = આ ડિવાઇસને PaperPaw નું પોતાનું ગણીએ?
core.firmware.dual.what = પછી PaperPaw આ ડિવાઇસને પોતાનું ગણે છે. તેનું આગલું અપડેટ બીજું ફર્મવેર ભૂંસી નાખે છે, અને તમે તેને પાછું લાવી શકતા નથી: ફક્ત બંનેને સેટ કરનાર ટૂલ જ તે કરી શકે છે.
core.firmware.dual.yes = પોતાનું ગણો
core.plugin.title = આ પ્લગિન ઇન્સ્ટૉલ કરીએ?
core.plugin.title.remove = આ પ્લગિન કાઢી નાખીએ?
core.plugin.what = {name} {version} ({id})
core.plugin.sideload = તે સ્ટોરમાંથી આવતું નથી: તેની કોઈ ખાતરી આપતું નથી.
core.plugin.uses = તે આ વાપરે છે: {keys}.
core.plugin.yes = ઇન્સ્ટૉલ કરો
core.plugin.remove-data = તમે તેનું ડેટા ફોલ્ડર પ્લગિન સાથે ન કાઢો ત્યાં સુધી તે રહે છે.
core.plugin.yes.remove = કાઢો, ડેટા રાખો
core.plugin.yes.remove-data = ડેટા સાથે કાઢો
core.plugin.old-secrets = આ પ્લગિનના અગાઉના ઇન્સ્ટૉલે સાચવેલા પાસવર્ડ હજી કાર્ડ પર છે. પહેલાં તે ભૂંસાય છે; તે વિના પ્લગિન ઇન્સ્ટૉલ થતું નથી.
core.plugin.yes.erase = જૂનો ડેટા ભૂંસો, ઇન્સ્ટૉલ કરો
core.screen.open-failed = આ સ્ક્રીન ખોલી શકાઈ નહીં.
core.screen.no-memory = આ માટે પૂરતી મેમરી નથી. કંઈક બંધ કરો અને ફરી પ્રયાસ કરો.
core.plugin.unforgotten = કાઢી નાખેલા પ્લગિન {id} ની સાચવેલી ગુપ્ત માહિતી ભૂંસી શકાઈ નહીં. તે કાર્ડ પર રહે છે.
core.low-memory.title = મેમરી ઓછી છે
core.low-memory.text = આ પ્લગિન સાથે મેમરી ઓછી પડે છે. ચિત્રો અને કવર ખૂટી શકે છે, અને પુસ્તકો ધીમે ખૂલે છે. પ્લગિનમાં જઈને એક બંધ કરો.
core.low-memory.plugins = પ્લગિન
core.low-memory.later = અત્યારે નહીં
core.setting.language = ભાષા
core.setting.device-name = ડિવાઇસનું નામ
core.setting.night-mode = રાત્રિ મોડ
core.setting.night-mode.short = રાત્રિ
core.setting.speak-focus = પસંદગી બોલો
core.setting.full-refresh-interval = પૂર્ણ રિફ્રેશ
core.setting.rotation = સ્ક્રીન ફેરવો
core.setting.rotation.help = સીધું અથવા આડું. “ફક્ત આ પુસ્તક” ચાલુ હોય ત્યારે તે ફક્ત તે પુસ્તકને લાગુ પડે છે.
core.setting.button-hints = બટન સંકેતો
core.setting.button-hints.help = સ્ક્રીનના તળિયે એક લાઇન બતાવે છે કે તેની નીચેનું દરેક બટન શું કરે છે. વાંચતી વખતે નહીં.
core.setting.swap-page-buttons = પેજ બટન અદલાબદલી કરો
core.setting.swap-page-buttons.help = વાંચતી વખતે પેજ બટન ઊલટી દિશામાં પેજ ફેરવે છે, મેનૂમાં નહીં.
core.setting.arrows-stay-on-page = તીર બટન પેજ પર રહે
core.setting.arrows-stay-on-page.help = પેજની પહેલી કે છેલ્લી આઇટમ પર તીર તે જ પેજ પર ફરી શરૂઆતમાં જાય છે; પેજ બટન પેજ ફેરવે છે.
core.setting.space-size = કદ
core.setting.space-size.help = દરેક જગ્યાની ઊંચાઈ.
core.setting.align = ગોઠવણી
core.setting.align.help = વિજેટનું ટેક્સ્ટ તેની જગ્યામાં ક્યાં રહે: ડાબે, વચ્ચે કે જમણે.
core.setting.frame = ફ્રેમ
core.setting.frame.help = વિજેટ શેમાં દોરાય છે; ઘેરા કાર્ડમાં ટેક્સ્ટ આછું હોય છે.
core.setting.padding = અંતર
core.setting.padding.help = વિજેટની સામગ્રી અને તેની કિનારીઓ કે ફ્રેમ વચ્ચેનું અંતર.
core.setting.font = ફોન્ટ
core.setting.font.help = આ વિજેટનો ફોન્ટ. કાર્ડ પરના ફોન્ટ માટે ઘણું મોટું ટેક્સ્ટ મેનૂના ફોન્ટમાં રહે છે.
core.setting.size = કદ
core.setting.size.help = વિજેટનું ટેક્સ્ટ કેટલું મોટું છે. જ્યાં તે સમાય નહીં ત્યાં તેને નાનું કરાય છે.
core.setting.part.help = વિજેટ આ બતાવે કે નહીં. જ્યાં જગ્યા ઓછી હોય ત્યાં તે છતાં પણ છોડી દેવાઈ શકે.
core.setting.widget-frame = વિજેટની ફ્રેમ
core.setting.widget-frame.help = જે વિજેટનાં પોતાનાં સેટિંગમાં ફ્રેમ પસંદ ન કરી હોય તે દરેક માટે ફ્રેમ.
core.setting.paper = રંગો
core.setting.paper.help = સામાન્ય, ઊલટા રંગ, ભૂખરો અથવા પારદર્શક. ઘેરા ચિત્ર પર આછું ટેક્સ્ટ પસંદ કરો.
