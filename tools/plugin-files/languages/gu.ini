keys.plugin.name = બટન અને જેસ્ચર
keys.plugin.description = દરેક બટન, ટૅપ ઝોન અને સ્વાઇપ શું કરે છે, ડિવાઇસ પર જ બદલી શકાય.
keys.plugin.how = "“બટન અને જેસ્ચર” દરેક બટન, ટૅપ ઝોન અને સ્વાઇપ શું કરે છે તે બતાવે છે, અને તમને તે ડિવાઇસ પર જ બદલવા દે છે.\n\nતેને સેટિંગમાં, ડિવાઇસ હેઠળ ખોલો. પહેલાં પસંદ કરો કે ફેરફાર ક્યાં લાગુ થાય: બધે, વાંચતી વખતે, હોમ સ્ક્રીન પર, લાઇબ્રેરીમાં કે કોઈ એક ટૂલમાં. પછી કોઈ ઇનપુટ પસંદ કરો, જેમ કે દબાવી રાખેલું બટન કે કિનારીથી અંદર સ્વાઇપ, અને સૂચિમાંથી ક્રિયા પસંદ કરો, જેમાં તમે શોધી શકો છો. “માનક” પ્લગિન અને બટન લેઆઉટે સેટ કરેલું પાછું લાવે છે.\n\nX4 પર, જે ફેરફારથી પસંદ કરવા, પાછળ જવા કે આગળ વધવા માટે કોઈ બટન ન બચે, તે નકારાય છે. છેલ્લે “બટન અને જેસ્ચર રીસેટ કરો” બધા ફેરફારો પાછા લે છે."
