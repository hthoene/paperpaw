core.usb-link.text = USB કેબલ પરનું કમ્પ્યુટર બટન દબાવી શકશે, સ્ક્રીનશૉટ લઈ શકશે અને પુસ્તકો તથા પ્લગિન ફાઇલો વાંચી-લખી શકશે. તે ગુપ્ત માહિતી વાંચી શકતું નથી કે કોડ ઇન્સ્ટૉલ કરી શકતું નથી. ડિવાઇસ ફરી શરૂ થાય કે સ્લીપમાં જાય, કેબલ કાઢી લેવાય, અથવા તમે અહીં તેને બંધ કરો ત્યારે તે બંધ થઈ જાય છે.
