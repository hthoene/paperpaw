joplin.plugin.name = પુસ્તક નોંધો સિંક
joplin.plugin.description = દરેક પુસ્તકનાં હાઇલાઇટ અને નોંધો એક નોંધમાં રાખે છે. Joplin સાથે કામ કરે છે (Joplin Cloud, Joplin Server અથવા WebDAV).
joplin.title = પુસ્તક નોંધો સિંક
joplin.send = Joplin પર મોકલો
joplin.send.help = નિકાસ કરેલી નોંધો તરત મોકલાય છે. જે નોંધો મોકલી ન શકાઈ તે રાહ જુએ છે અને આગલી નિકાસ સાથે, આનાથી, અથવા કોઈ નિયમથી જાય છે.
joplin.service = આની સાથે સિંક
joplin.service.help = Joplin શાની સાથે સિંક કરે છે, Joplinમાં સેટ કર્યા મુજબ: Joplin Cloud, તમારું પોતાનું Joplin Server, અથવા Nextcloud જેવું WebDAV ફોલ્ડર. કોઈ કમ્પ્યુટર ચાલુ હોવું જરૂરી નથી.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = સરનામું
joplin.address.help = Joplin Server: તેનું સરનામું, દા.ત. joplin.example.org. WebDAV: Joplin જે ફોલ્ડરમાં સિંક કરે છે, તેનાં સેટિંગ મુજબ, દા.ત. dav.example.org/Joplin.
joplin.email = ઇમેઇલ
joplin.user = વપરાશકર્તાનું નામ
joplin.user.help = Joplin Cloud અને Joplin Server: તમે જે ઇમેઇલથી સાઇન ઇન કરો છો તે (બે-પગલાંનું સાઇન ઇન હજી વાપરી શકાતું નથી). WebDAV: ફોલ્ડરનું વપરાશકર્તા નામ.
joplin.password = પાસવર્ડ
joplin.password.help = આ ડિવાઇસ પર બીજા પાસવર્ડ અને કી સાથે રાખવામાં આવે છે. Nextcloud માટે ઍપ પાસવર્ડ પણ ચાલે છે.
joplin.secret = Joplin પાસવર્ડ
joplin.not-kept = પાસવર્ડ આ ડિવાઇસ પર રાખી શકાયો નહીં.
joplin.notebook = નોટબુક
joplin.notebook.help = PaperPaw Joplinમાં બનાવે છે તે નોટબુક, દરેક પુસ્તક માટે એક નોંધ સાથે. ફરી નિકાસ કરવાથી નોંધ અપડેટ થાય છે, બીજી નોટબુકમાં ખસેડેલી નોંધ પણ.
joplin.idle = નિકાસ કરેલી નોંધો તરત Joplin પર મોકલાય છે.
joplin.waiting.one = {count} પુસ્તકની નોંધો મોકલાવાની રાહ જુએ છે.
joplin.waiting.other = {count} પુસ્તકોની નોંધો મોકલાવાની રાહ જુએ છે.
joplin.sent.one = {count} પુસ્તકની નોંધો Joplinમાં છે.
joplin.sent.other = {count} પુસ્તકોની નોંધો Joplinમાં છે.
joplin.some-failed = Joplin પર મોકલી: {sent}. ન મોકલાઈ: {failed}; તે પછીથી ફરી મોકલાશે.
joplin.apart.one = {count} નોંધ Joplinમાં બદલાઈ હતી, તેથી તેની બાજુમાં નવી બનાવી.
joplin.apart.other = {count} નોંધો Joplinમાં બદલાઈ હતી, તેથી તેમની બાજુમાં નવી બનાવી.
joplin.nothing = Joplin પર મોકલવા માટે કોઈ નોંધ બાકી નથી.
joplin.no-network = Joplin પર મોકલવા નેટવર્ક જોઈએ. નોંધો રાહ જુએ છે અને પછીથી મોકલાશે.
joplin.setup-needed = પહેલાં Joplin સેટ કરો: તે ક્યાં સિંક કરે છે, તમારું એકાઉન્ટ અને પાસવર્ડ.
joplin.no-time = સમય હજી જાણીતો નથી. નોંધો રાહ જુએ છે અને પછીથી મોકલાશે.
joplin.unreachable = Joplin સુધી પહોંચી શકાતું નથી. નોંધો રાહ જુએ છે અને પછીથી મોકલાશે.
joplin.failed = Joplinએ ભૂલ સાથે જવાબ આપ્યો ({status}). નોંધો રાહ જુએ છે અને પછીથી મોકલાશે.
joplin.bad-login = Joplinએ ઇમેઇલ, વપરાશકર્તા નામ કે પાસવર્ડ સ્વીકાર્યો નહીં. Joplinના સેટઅપમાં તે તપાસો.
joplin.no-server = આ સરનામે કોઈ Joplin Server નથી. Joplinના સેટઅપમાં તે તપાસો.
joplin.bad-address = આ સરનામું PaperPaw વાપરી શકે તેવું નથી. Joplinના સેટઅપમાં તે તપાસો.
joplin.no-data = આ સરનામે કોઈ Joplin નોંધો નથી. તે તપાસો, અથવા પહેલાં Joplinને તેની સાથે સિંક કરો.
joplin.encrypted = Joplinનું એન્ડ-ટુ-એન્ડ એન્ક્રિપ્શન ચાલુ છે. PaperPaw નોંધો એન્ક્રિપ્ટ કરી શકતું નથી, તેથી કોઈ મોકલતું નથી.
