tasks.plugin.name = કાર્યો
tasks.plugin.description = નિયત તારીખ અને પ્રાથમિકતા સાથે કરવાનાં કાર્યોની સૂચિઓ, રીડર પર અથવા તમારા CalDAV સર્વર સાથે સિંક કરેલી, હોમ સ્ક્રીન વિજેટ સાથે.
tasks.plugin.how = "તમારા રીડર પર કરવાનાં કાર્યોની સૂચિઓ: નિયત તારીખ અને પ્રાથમિકતાવાળાં કાર્યો, જે પૂરાં થાય ત્યારે ટિક થાય છે. તે સેટઅપ કે નેટવર્ક વિના કામ કરે છે, અને CalDAV સર્વર (Nextcloud, Radicale, Baïkal, Fastmail વગેરે) સાથે સિંક થઈ શકે છે, જેથી એ જ સૂચિઓ ફોન અને કમ્પ્યુટર પર પણ હોય.\n\nટૂલ મેનૂમાંથી કાર્યો ખોલો. પહેલી લાઇન પસંદ કરીને બીજી સૂચિ, બધી સૂચિઓનાં આજનાં અને મુદત વીતેલાં કાર્યો, નવી સૂચિ, સિંક કે એકાઉન્ટ સેટઅપ પસંદ કરો. કાર્ય ઉમેરો કીબોર્ડ ખોલે છે. કાર્ય પસંદ કરવાથી તે ટિક થાય છે (ફરીથી: પૂરું નથી). શીર્ષક, નિયત તારીખ (આજે, કાલે, એક અઠવાડિયામાં કે કોઈ તારીખ) કે પ્રાથમિકતા બદલવા અથવા કાઢી નાખવા કાર્ય દબાવી રાખો કે મેનૂ દબાવો. ખુલ્લાં કાર્યો પહેલાં આવે છે, દિવસ અને પછી પ્રાથમિકતા મુજબ; પૂરાં થયેલાં એક અઠવાડિયું અંતે રહે છે (સેટિંગમાં કાર્યો હેઠળ સેટ કરો), પછી રીડર પરથી જાય છે.\n\nવિજેટ (હોમ સ્ક્રીન દબાવી રાખો, પછી વિજેટ ઉમેરો): આજનાં કાર્યો, કાર્ય સૂચિ, ખુલ્લાં કાર્યો અને આગલું કાર્ય. વિજેટમાં કાર્ય પર ટૅપ તેને ટિક કરે છે, શીર્ષક પર ટૅપ સૂચિઓ ખોલે છે.\n\nસિંક માટે સૂચિની લાઇનમાંથી CalDAV એકાઉન્ટ પસંદ કરો અને સર્વરનું સરનામું, વપરાશકર્તા નામ અને પાસવર્ડ (શક્ય હોય તો ઍપ પાસવર્ડ) દાખલ કરો. સર્વરની દરેક કાર્ય સૂચિ રીડર પર સૂચિ બને છે. તમે કાર્યો ખોલો, હમણાં સિંક કરો પસંદ કરો કે નેટવર્ક આમ પણ ચાલુ હોય ત્યારે રીડર સિંક કરે છે; નેટવર્ક વિનાના ફેરફારો પછીથી મોકલાય છે. કાર્ય વચ્ચે બંને જગ્યાએ બદલાયું હોય તો સર્વરનું વર્ઝન લેવાય છે અને તમારું તેની બાજુમાં નવા કાર્ય તરીકે રહે છે. સર્વર પરની નોંધો, એલાર્મ વગેરે જેમ છે તેમ રહે છે. પુનરાવર્તિત કાર્યો દેખાય છે પણ જ્યાં બનાવ્યાં ત્યાં જ બદલાય છે. રીડર 12 સૂચિઓમાં 200 સુધી કાર્યો રાખે છે."
