anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = તમારા કમ્પ્યુટર પરના Anki નાં બાકી કાર્ડનો અભ્યાસ કરે છે અને AnkiConnect ઍડ-ઑન મારફતે તમારા જવાબો પાછા મોકલે છે.
anki.plugin.how = "Anki વડે તમે કમ્પ્યુટર પરના Anki નાં બાકી કાર્ડનો અભ્યાસ રીડર પર કરી શકો છો, અને તે તમારા જવાબો પાછા મોકલે છે. તે મફત ઍડ-ઑન AnkiConnect (કોડ 2055492159) વાપરે છે, ક્યારેય AnkiWeb નહીં. શરૂઆતમાં તે બંધ હોય છે: તેને પ્લગિન સ્ટોરમાંથી ઉમેરો.\n\nકમ્પ્યુટર પર: Anki માં AnkiConnect ઇન્સ્ટૉલ કરો (Tools, Add-ons, Get Add-ons) અને Anki ફરી શરૂ કરો. સિંક કરો ત્યારે Anki ખુલ્લું હોવું જોઈએ.\n\nમૂળભૂત રીતે AnkiConnect ફક્ત પોતાના કમ્પ્યુટરને જ જવાબ આપે છે (127.0.0.1), તેથી રીડર તેના સુધી પહોંચી શકતું નથી. Tools, Add-ons, AnkiConnect, Config ખોલો અને \"webBindAddress\" ને \"0.0.0.0\" પર સેટ કરો (હોમ નેટવર્ક પર સાંભળે). પોર્ટ, \"webBindPort\", 8765 છે સિવાય કે તમે બદલો. ત્યાં \"apiKey\" સેટ કરો તો અહીં એ જ કી દાખલ કરો. ગોઠવણી બદલ્યા પછી Anki ફરી શરૂ કરો, અને ફાયરવૉલ પૂછે તો Anki ને મંજૂરી આપો. ફક્ત વિશ્વાસપાત્ર નેટવર્ક પર જ વાપરો: તેના પર કોઈ પણ AnkiConnect સુધી પહોંચી શકે છે, તેથી કી રાખવી સારી છે.\n\nરીડર પર: ટૂલમાંથી Anki ખોલો, પછી કમ્પ્યુટર હેઠળ તેનું સરનામું (દા.ત. 192.168.1.20), પોર્ટ (જો 8765 ન હોય) અને API કી (જો સેટ કરી હોય) દાખલ કરો. ડેક પસંદ કરો, અથવા બધા ડેક માટે ખાલી રાખો. પછી Wi-Fi ચાલુ રાખીને Anki સાથે સિંક કરો પસંદ કરો: પહેલાં રાહ જોતા જવાબો મોકલાય છે, પછી બાકી કાર્ડ (અને તમે સેટ કરેલી સંખ્યાનાં નવાં કાર્ડ) આવે છે, વધુમાં વધુ 50. નેટવર્ક વિના તેમને જોવા અભ્યાસ કરો પસંદ કરો: જવાબ બતાવો અને ફરી, અઘરું, સારું કે સરળ તરીકે રેટ કરો. જવાબો રીડર પર સચવાય છે, Wi-Fi વિના પણ, અને આગલા સિંક સાથે Anki માં જાય છે. કાર્ડ ક્યારે પાછું આવે તે Anki નક્કી કરે છે: ફરી તરીકે જવાબ આપેલું કાર્ડ Anki તેને બાકી ગણે ત્યારે પછીના સિંકમાં ફરી આવે છે.\n\nસેટિંગમાં Anki ખૂલે ત્યારે સિંક કરો દર વખતે સ્ક્રીન ખોલતાં સિંક કરે છે. બટન દબાવવાથી ક્યારેય નેટવર્ક વપરાતું નથી."
