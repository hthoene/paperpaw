vocabulary.plugin.description = તમે શોધેલા શબ્દો તેમનાં વાક્યો સાથે રાખે છે, અને ફોન પર બનાવેલાં ફ્લૅશ કાર્ડનું અંતરાલ પુનરાવર્તનથી પુનરાવર્તન કરાવે છે.
vocabulary.plugin.how = "શબ્દભંડોળ વાંચતી વખતે તમે શોધેલા શબ્દો, દરેક તેના વાક્ય સાથે, ફરી જોવા માટે રાખે છે. સૂચિ ટૂલમાં છે, સૌથી નવા પહેલાં; શબ્દ ફરી શોધવા તેને પસંદ કરો. છેલ્લી હરોળ, એક્સપોર્ટ કરો, તેમને Anki જેવી ફ્લૅશ કાર્ડ ઍપ માટે સાચવે છે. સૂચિ સૌથી નવા 2,000 શબ્દો રાખે છે (જૂના જાય છે), તેથી સમયસર એક્સપોર્ટ કરો.\n\nફ્લૅશ કાર્ડ (ટૂલમાં) અંતરાલ પુનરાવર્તનથી કસોટી કરે છે: જવાબ બતાવો પછી દરેક કાર્ડને ફરીથી, અઘરું, સારું કે સરળ ગણો; તેનાથી નક્કી થાય છે કે તે ક્યારે પાછું આવશે. ડેક ફોનથી ફેરફાર કરો વડે બનાવો: એ જ Wi-Fiમાંના ફોનથી કોડ સ્કૅન કરો, પછી કાર્ડ ટાઇપ કરો, અથવા ડેક ખોલીને એકસાથે ઘણાં કાર્ડ પસંદ કરો: CSV, TSV કે TXT ફાઇલ (દરેક લાઇનમાં એક કાર્ડ: આગળની બાજુ, પાછળની બાજુ, ઉદાહરણ; UTF-8), પેસ્ટ કરેલી સૂચિ, અથવા Anki ડેક (.apkg, “Support older Anki versions” સાથે એક્સપોર્ટ કરેલું).\n\nઅથવા SD કાર્ડના Flashcards ફોલ્ડરમાં દરેક ડેક માટે આવી એક ફાઇલ મૂકો (Spanish.tsv થી Spanish ડેક બને છે). ફ્લૅશ કાર્ડમાં SD કાર્ડ પરનાં કાર્ડ પસંદ કરો, અથવા ખોલતી વખતે આપોઆપ થવા દો. ડેક પ્રગતિ સાથે રીડર પર રહે છે, અને નવી કે બદલાયેલી ફાઇલ તેમાં ભેળવાય છે: પાછળની બાજુ કે ઉદાહરણ બદલવાથી પ્રગતિ રહે છે; આગળનું ટેક્સ્ટ બદલવાથી નવું કાર્ડ બને છે. કાઢેલી લાઇન કાર્ડ કાઢતી નથી, સિવાય કે તે ડેક માટે “ફાઇલમાં ન હોય તેવાં કાર્ડ”ને કાઢી નાખો પર સેટ હોય. કાર્ડ પર સાચવો ડેકને ફાઇલમાં સાચવે છે, id કૉલમમાં કાર્ડ નંબર સાથે, જેથી કમ્પ્યુટર પર આગળની બાજુ બદલ્યા પછી પણ પ્રગતિ રહે; પહેલી વાર જૂની ફાઇલ _name.bak.tsv માં કૉપિ થાય છે. 4 MiB કે 20,000 લાઇનથી મોટી ફાઇલ વંચાતી નથી; CSV UTF-8 તરીકે સાચવો. પહેલી વાર રીડર ફોલ્ડર બનાવીને તેમાં સમજૂતીની નોંધ મૂકે છે.\n\nસેટિંગમાં વાંચન હેઠળ શોધેલા શબ્દોનાં કાર્ડ બનાવો દરેક શોધેલા શબ્દને શોધેલા ડેકમાં મૂકે છે."
