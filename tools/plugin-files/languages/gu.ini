wifi.plugin.name = Wi-Fi
wifi.plugin.description = જરૂર પડે ત્યારે Wi-Fi નેટવર્ક સાથે કનેક્ટ થાય છે અને પછી રેડિયો બંધ કરે છે.
wifi.plugin.how = "કોઈ પ્લગિનને ઇન્ટરનેટ જોઈએ (કૅટલૉગ, સિંક, સ્ટોર, ટ્રાન્સફર) ત્યારે Wi-Fi નેટવર્ક સાથે કનેક્ટ થાય છે, અને બૅટરી તથા મેમરી બચાવવા માટે, કોઈ તેનો ઉપયોગ ન કરે તેના એક મિનિટ પછી, અથવા હોમ કે કોઈ પુસ્તક દેખાય ત્યારે તરત, રેડિયો ફરી બંધ કરે છે.\n\nસેટિંગમાંથી અથવા સ્ટેટસ લાઇનની Wi-Fi આઇટમમાંથી Wi-Fi ખોલો. નેટવર્ક વિભાગ પહોંચમાંનાં નેટવર્ક બતાવે છે; એક પસંદ કરો અને તેનો પાસવર્ડ લખો, અથવા ફોન વડે સેટઅપ કરો પસંદ કરો અને નામ તથા પાસવર્ડ ડિવાઇસ પર નહીં પણ તમારા ફોનના બ્રાઉઝરમાં લખો. ભૂલી જાઓ સાચવેલું નેટવર્ક કાઢી નાખે છે.\n\nપાસવર્ડ કાર્ડ પર સુરક્ષિત રીતે રહે છે અને ફરી ક્યારેય બતાવાતા નથી. જરૂર પડે ત્યારે કનેક્ટ કરો હેઠળ તમે નક્કી કરો છો કે છેલ્લા ઉપયોગ પછી Wi-Fi કેટલો સમય ચાલુ રહે, ચાર્જ થતી વખતે ચાલુ રહે કે નહીં, અને અનેક નેટવર્ક પહોંચમાં હોય ત્યારે કયું સાચવેલું નેટવર્ક પહેલાં આવે."
