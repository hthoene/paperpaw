smart-home.plugin.name = સ્માર્ટ હોમ
smart-home.plugin.description = તમારા પોતાના Home Assistantનાં મૂલ્યો અને સ્વિચ ડૅશબોર્ડ પર અને હોમ સ્ક્રીન વિજેટ તરીકે. તમારા હોમ નેટવર્ક પરના Home Assistant સાથે કામ કરે છે.
smart-home.plugin.how = "સ્માર્ટ હોમ તમારા પોતાના Home Assistantનાં મૂલ્યો અને સ્વિચ બતાવે છે: તાપમાન, ભેજ, ઊર્જા, દરવાજા અને બારીઓ, લાઇટ, સ્વિચ અને સીન. તે હોમ નેટવર્ક પર REST API દ્વારા સીધું તમારા સર્વર સાથે વાત કરે છે; કશું બીજી સેવામાંથી પસાર થતું નથી.\n\nટૂલ મેનૂમાંથી “સ્માર્ટ હોમ” ખોલો, પછી “કનેક્શન”: Home Assistantનું સરનામું (દા.ત. http://homeassistant.local:8123) અને લાંબા ગાળાનું ઍક્સેસ ટોકન લખો (Home Assistantના પ્રોફાઇલ પેજના તળિયે બનાવો). ટોકન પાસવર્ડ અને કી વચ્ચે રખાય છે, ક્યારેય સેટિંગ ફાઇલમાં નહીં. સાદું http ફક્ત હોમ નેટવર્કનાં સરનામાં માટે છે; બહારના સર્વર માટે સેટિંગમાં “હોમ નેટવર્કની બહારના સર્વર” ચાલુ કરો અને માન્ય પ્રમાણપત્ર સાથે https વાપરો.\n\n“એન્ટિટી પસંદ કરો” સર્વરની એન્ટિટીની સૂચિ ખોલે છે: નામ કે id વડે શોધો અને બતાવવા પસંદ કરો (ફરી પસંદ કરવાથી દૂર થાય છે). એન્ટિટીને રૂમ આપવાથી તે ડૅશબોર્ડ પર અને રૂમ વિજેટમાં જૂથમાં આવે છે. વધુમાં વધુ 24 એન્ટિટી. ડૅશબોર્ડ પર લાઇટ, સ્વિચ કે સીન પસંદ કરવાથી તે ચાલુ-બંધ થાય છે અને લાઇન સર્વરનો જવાબ બતાવે છે; સેન્સર પસંદ કરવાથી તે ફરી વંચાય છે.\n\nવિજેટ (હોમ સ્ક્રીન દબાવી રાખો, પછી વિજેટ ઉમેરો): “સ્માર્ટ હોમ મૂલ્ય” એક રીડિંગ મોટું બતાવે છે, “જૂથ” રૂમની એન્ટિટીની સૂચિ, “સ્વિચ” લાઇટ કે સ્વિચનું બટન, અને “રૂમ” રૂમનાં રીડિંગ અને સ્વિચવાળું કાર્ડ. દરેક વિજેટનાં સેટિંગમાં તેની એન્ટિટી કે રૂમ પસંદ કરો.\n\nમાહિતી ત્યારે વંચાય છે જ્યારે તમે ડૅશબોર્ડ ખોલો, જ્યારે તમે કહો (“હમણાં રિફ્રેશ કરો” અથવા મૂલ્ય કે જૂથ વિજેટ પર ટૅપ), જ્યારે રીડર Wi-Fi પહેલેથી ચાલુ હોય ત્યાં જાગે, અને ચાર્જર લાગેલું હોય ત્યારે તમારા સમયપત્રક મુજબ. તે ક્યારેય જાતે રેડિયો ચાલુ કરતું નથી કે ચાલુ રાખતું નથી."
