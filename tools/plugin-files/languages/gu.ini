mail.plugin.name = મેઇલ
mail.plugin.description = પાસવર્ડ કે ઍપ પાસવર્ડ વડે ઇમેઇલ વાંચે અને મોકલે છે (IMAP અને SMTP), બ્રાઉઝર લૉગિન વગર.
mail.plugin.how = "મેઇલ IMAP અને SMTP દ્વારા ઇમેઇલ વાંચે અને મોકલે છે. તે સરનામા અને પાસવર્ડથી સાઇન ઇન કરે છે, બ્રાઉઝર લૉગિન વગર, તેથી આવી મંજૂરી આપતા કોઈ પણ પ્રદાતા સાથે કામ કરે છે.\n\nસેટિંગ, મેઇલ હેઠળ એકાઉન્ટ સેટ કરો: પ્રદાતા પસંદ કરો, સરનામું અને પાસવર્ડ લખો. મોટા ભાગના પ્રદાતા ઍપ પાસવર્ડ માગે છે: એકાઉન્ટનાં સુરક્ષા સેટિંગમાં બનાવો અને અહીં વાપરો; સામાન્ય પાસવર્ડ ઘણી વાર કામ કરતો નથી. પાસવર્ડ પ્રદાતાના સર્વર સિવાય ક્યાંય જતો નથી અને પાસવર્ડ અને કી સાથે રખાય છે.\n\nટૂલમાં મેઇલ ખોલો. “મેઇલ તપાસો” નવીનતમ મેઇલ અને ફોલ્ડર મેળવે છે. મેઇલ કાર્ડ પર રહે છે, તેથી નેટવર્ક વગર વાંચી શકાય છે. ડિવાઇસ કનેક્ટ થઈ, મેળવીને ડિસ્કનેક્ટ થાય છે, તેથી Wi-Fi ફક્ત એક ક્ષણ ચાલુ રહે છે.\n\nપ્રદાતા સૂચિમાં ન હોય તો “પોતાના સર્વર” પસંદ કરો અને વિગતવાર સેટિંગમાં સર્વરનાં નામ, પોર્ટ અને સુરક્ષા સેટ કરો. જે સર્વરના પ્રમાણપત્રની કોઈ સત્તાધિકારી ખાતરી આપતું નથી તેના પર વિશ્વાસ કરવો કે નહીં તે એક વાર પુછાય છે; ફિંગરપ્રિન્ટને પ્રદાતા બતાવે તેની સાથે સરખાવો.\n\nપુસ્તક જોડેલા મેઇલ (EPUB, PDF વગેરે, 2 MB સુધી) નીચે “પુસ્તક ખોલો” હોય છે: તે ફાઇલ મેળવી, લાઇબ્રેરીમાં મૂકીને ખોલે છે.\n\nમેઇલ ખોલ્યા વગર નવા મેઇલ જોવા, સેટિંગ, મેઇલ હેઠળ “બૅકગ્રાઉન્ડમાં નવા મેઇલ તપાસો” ચાલુ કરો અને કેટલી વારે તે પસંદ કરો (દર 15, 30 કે 60 મિનિટે); મૂળભૂત રીતે તે બંધ છે. પછી રીડર જાગતું અને ઑનલાઇન હોય ત્યારે સુરક્ષિત કનેક્શન પર એક પછી એક એકાઉન્ટ તપાસે છે અને હોમ પર ન વાંચેલા મેઇલની સંખ્યા અપડેટ કરે છે. તે થોડી બૅટરી વાપરે છે. મેઇલ ખોલવાથી ચાલુ તપાસ અટકે છે.\n\nહોમ સ્ક્રીન વિજેટ ન વાંચેલા મેઇલની સંખ્યા, નવીનતમ અને સ્ટાર કરેલા મેઇલ, એક મેઇલબૉક્સ અને મેઇલ લખવાનો શૉર્ટકટ બતાવે છે."
