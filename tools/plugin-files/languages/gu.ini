notes-vault.plugin.name = નોંધ વૉલ્ટ
notes-vault.plugin.description = Markdown નોંધોનું ફોલ્ડર ફોલ્ડર, ટૅગ અને તાજા ફેરફારો મુજબ વાંચે છે, હોમ સ્ક્રીન માટેનાં વિજેટ સાથે. Obsidian વૉલ્ટ સાથે કામ કરે છે.
notes-vault.plugin.how = "“નોંધ વૉલ્ટ” Markdown નોંધોનું ફોલ્ડર વાંચે છે (સાદી .md ફાઇલો, જેમ નોંધ ઍપ તેમને રાખે છે). તે Obsidian વૉલ્ટ સાથે કામ કરે છે.\n\nવૉલ્ટનું ફોલ્ડર સેટિંગમાં અથવા ટૂલમાં વૉલ્ટના પેજ પર પસંદ કરો. પછી પેજ પર કાર્ડ પર જેમ છે તેમ ફોલ્ડર, છેલ્લે બદલાયેલી નોંધો, ટૅગ અને નોંધોનાં શીર્ષકોમાં શોધ મળે છે.\n\nપહેલી વાર, વૉલ્ટનું પેજ ખુલ્લું હોય ત્યાં સુધી વૉલ્ટ બૅકગ્રાઉન્ડમાં ઇન્ડેક્સ થાય છે; હજારો નોંધોવાળા વૉલ્ટને થોડી મિનિટ લાગે છે, પછી તે તરત ખૂલે છે. ઇન્ડેક્સ કાર્ડ પર રહે છે અને થોડા કલાક પછી વૉલ્ટનું પેજ ખૂલે ત્યારે, અથવા તમે “અપડેટ” પસંદ કરો ત્યારે ફરીથી બને છે.\n\nનોંધ રીડરમાં ખૂલે છે. બીજી નોંધોની લિંક ([[નોંધ]], [[નોંધ|શબ્દો]], [[નોંધ#મથાળું]]) નોંધના નામથી વૉલ્ટમાં ગમે ત્યાં શોધાય છે; લિંક અનુસરવાથી તે નોંધ ખૂલે છે, અને “પાછળ” પહેલાંની નોંધ પર પાછા લાવે છે.\n\nવૉલ્ટમાં ક્યારેય કશું બદલાતું નથી. હોમ સ્ક્રીન માટેનાં વિજેટ (તાજેતરની નોંધો, પિન કરેલી નોંધ, દિવસની નોંધ, રેન્ડમ નોંધ, ટૅગ, શોધ) હોમ સ્ક્રીનના એડિટરમાં ઉમેરાય છે. વિજેટ તેની નોંધો ફક્ત એક ફોલ્ડરમાંથી લઈ શકે છે: વિજેટના સેટિંગમાં કાર્ડના રૂટથી ફોલ્ડરનો પાથ લખો (ઉદાહરણ તરીકે Notes/Work); ખાલી રાખો તો તે વૉલ્ટની બધી નોંધો લે છે."
