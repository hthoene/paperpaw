calendar.plugin.name = કૅલેન્ડર
calendar.plugin.description = રીડર પર તમારાં કૅલેન્ડર: CalDAV, iCal અને ફાઇલોમાંથી એજન્ડા, દિવસ, અઠવાડિયું અને મહિનો, સંપર્કોમાંથી જન્મદિવસ, હોમ વિજેટ અને સ્લીપ સ્ક્રીન.
calendar.plugin.how = "રીડર પર તમારાં કૅલેન્ડર: એજન્ડા, દિવસ, અઠવાડિયું અને મહિનો, જેમાં CalDAV કૅલેન્ડર (Nextcloud, Radicale, Baïkal, Fastmail વગેરે), iCal સરનામાં (.ics, webcal://) અને કાર્ડ પરની કૅલેન્ડર ફાઇલોની ઇવેન્ટ તથા સંપર્કોના (CardDAV) જન્મદિવસ અને વર્ષગાંઠ દેખાય છે. રીડર તેમને ફક્ત વાંચે છે.\n\nટૂલ મેનૂમાંથી કૅલેન્ડર ખોલો. દૃશ્ય બદલવા, કૅલેન્ડર ઉમેરવા કે સિંક કરવા પહેલી પંક્તિ પસંદ કરો અથવા મેનૂ દબાવો. દિવસ અને અઠવાડિયામાં પેજ બટન પાછલા કે આગલા પર જાય છે; મહિનામાં તીર બટન દિવસ બદલે છે, પેજ બટન મહિનો, અને પસંદ કરો દિવસ ખોલે છે. ઇવેન્ટ પસંદ કરવાથી તેની બધી વિગતો દેખાય છે.\n\nમેનૂમાં કે સેટિંગમાં કૅલેન્ડર હેઠળ કૅલેન્ડર ઉમેરો અને પ્રકાર પસંદ કરો: CalDAV એકાઉન્ટ (સર્વરનું સરનામું પૂરતું છે), iCal સરનામું (.ics), કાર્ડ પરની કૅલેન્ડર ફાઇલ, અથવા સંપર્કો (CardDAV: જન્મદિવસ અને વર્ષગાંઠ). સરનામું, એકાઉન્ટ માટે વપરાશકર્તા નામ અને પાસવર્ડ (શ્રેષ્ઠ તો ઍપ પાસવર્ડ) અને નામ દાખલ કરો. દરેક કૅલેન્ડરનું પોતાનું નિશાન હોય છે; વધુમાં વધુ છ કૅલેન્ડર.\n\nપુનરાવર્તિત, આખા દિવસની અને બીજા સમય ઝોનની ઇવેન્ટ રીડરની ઘડિયાળ મુજબ બતાવાય છે. રીડર આજથી સાઠ દિવસ પહેલાં અને પછી સુધીની, વધુમાં વધુ 240 ઇવેન્ટ રાખે છે અને નેટવર્ક વિના બતાવે છે.\n\nકૅલેન્ડર ખોલતાં (વધુમાં વધુ દર પાંચ મિનિટે), હમણાં સિંક કરો વડે, અને સેટિંગમાં કૅલેન્ડર હેઠળ ગોઠવો તો નેટવર્ક ચાલુ હોય કે ચાર્જિંગ શરૂ થાય ત્યારે વંચાય છે. હમણાં સિંક કરો સિવાય રીડર તેના માટે રેડિયો ચાલુ કરતું નથી.\n\nવિજેટ (હોમ સ્ક્રીન દબાવી રાખો, પછી વિજેટ ઉમેરો): આજ, આગલી ઇવેન્ટ, એજન્ડા, મહિનો (ઇવેન્ટવાળા દિવસ નીચે ટપકાં) અને જન્મદિવસ. ઇવેન્ટ કે દિવસ પર ટૅપ કરવાથી તે ખૂલે છે. સ્લીપ સ્ક્રીન આજનો એજન્ડા બતાવી શકે છે: સેટિંગમાં સ્લીપ સ્ક્રીન હેઠળ કૅલેન્ડર પસંદ કરો."
