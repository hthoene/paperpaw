news.plugin.name = સમાચાર
news.plugin.description = સમાચાર ફીડ (RSS, Atom) વાંચવા માટે પુસ્તક તરીકે મેળવે છે.
news.plugin.how = "સમાચાર RSS કે Atom ફીડને પુસ્તકોમાં ફેરવે છે. દરેક ફીડ લાઇબ્રેરીના સમાચાર ફોલ્ડરમાં એક પુસ્તક બને છે, તેના નવીનતમ લેખો સાદા ટેક્સ્ટ તરીકે, બીજા કોઈ પણ પુસ્તકની જેમ વાંચવા માટે.\n\nટૂલ મેનૂમાંથી સમાચાર ખોલો અને “ફીડ ઉમેરો” પસંદ કરો; તેનું સરનામું અખબાર કે બ્લૉગની વેબસાઇટ પર હોય છે. “સમાચાર મેળવો” બધી ફીડ મેળવે છે અને અગાઉનાં પુસ્તકો બદલે છે. કોઈ એક ફીડને એકલી મેળવવા કે કાઢવા તેને દબાવી રાખો (બટન વડે, “પસંદ કરો” દબાવી રાખો). કાઢી નાખેલી ફીડનું પુસ્તક લાઇબ્રેરીમાં રહે છે.\n\nમેળવવા માટે નેટવર્ક જોઈએ. “ફીડ દીઠ લેખો” (સેટિંગ, લાઇબ્રેરી) દરેક પુસ્તકમાં કેટલા લેખ હોય તે નક્કી કરે છે. “સમાચાર હેડલાઇન” વિજેટ તેમને હોમ સ્ક્રીન પર બતાવે છે."
