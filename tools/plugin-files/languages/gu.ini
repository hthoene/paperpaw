settings.plugin.name = સેટિંગ
settings.plugin.description = સેટિંગનાં પેજ, દરેક પ્લગિનનાં સેટિંગમાંથી બનેલાં.
settings.plugin.how = "સેટિંગ PaperPaw અને તેનાં પ્લગિનમાં જે કંઈ સેટ કરી શકાય તે બધું પેજમાં બતાવે છે. પ્લગિનને પોતાની સ્ક્રીનની જરૂર નથી: તેઓ જે જાહેર કરે તે અહીં જૂથોમાં દેખાય છે, દરેક સેટિંગનું વર્ણન તેની નીચે.\n\nમેનૂમાં “સેટિંગ”થી તેને ખોલો. જૂથ ખોલવા તેના પર ટૅપ કરો, પછી સેટિંગ પર ટૅપ કરીને તેને બદલો કે પસંદ કરો; સંખ્યાઓ માટે − અને + બટન છે. બટનથી, સેટિંગ પર જાઓ અને “પસંદ કરો” દબાવો: ડાબું અને જમણું સંખ્યા બદલે છે, “પસંદ કરો” તેને રાખે છે, “પાછળ” જૂનું મૂલ્ય પાછું લાવે છે.\n\nફેરફારો તરત લાગુ પડે છે. “શોધો” શબ્દોથી સેટિંગ શોધે છે અને “વિગતવાર સેટિંગ” ભાગ્યે જ જોઈતાં સેટિંગ ઉમેરે છે. “માનક પર રીસેટ કરો” અને “બધું રીસેટ કરો” પહેલાં પૂછે છે."
