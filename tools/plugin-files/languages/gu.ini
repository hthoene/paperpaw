store.plugin.name = પ્લગિન સ્ટોર
store.plugin.description = આ ડિવાઇસ માટે પ્લગિન શોધે, ઇન્સ્ટૉલ કરે, અપડેટ કરે અને કાઢી નાખે છે.
store.plugin.how = "પ્લગિન સ્ટોર ઇન્ટરનેટ પર આ ડિવાઇસ માટેનાં પ્લગિન શોધે છે અને તેમને ઇન્સ્ટૉલ કરે, અપડેટ કરે અને કાઢી નાખે છે. તેને ટૂલમાંથી ખોલો; તેને Wi-Fi જોઈએ.\n\nશરૂઆતમાં ભલામણો, નવાં અને લોકપ્રિય પ્લગિન, પછી જૂથો દેખાય છે. જૂથ તેનાં પ્લગિન દરરોજ બદલાતા મિશ્રણમાં બતાવે છે, જેથી દરેક જોવાય; તેમને A થી Z, સૌથી નવાં કે છેલ્લા અપડેટ મુજબ ગોઠવો, અને લાંબી સૂચિમાં અક્ષર પર જાઓ. પ્લગિનનું પેજ તેનું કદ અને મેમરી બતાવે છે; ત્યાં ઇન્સ્ટૉલ કરો, અપડેટ કરો કે કાઢી નાખો પસંદ કરો. બધાં અપડેટ કરો દરેક ઇન્સ્ટૉલ કરેલું પ્લગિન અદ્યતન કરે છે.\n\nકોડ પ્લગિન ડિવાઇસની પૂરી ઍક્સેસ સાથે ચાલે છે: સ્ટોર આ જણાવીને પહેલાં પૂછે છે, અને તે ફરી શરૂ કર્યા પછી ચાલુ થાય છે. કોઈ ગરબડ કરે તો PaperPaw કોડ પ્લગિન વિના શરૂ થાય છે અને કયું હતું તે જણાવે છે.\n\nસેટિંગ, સિસ્ટમમાં કમ્યુનિટી પ્લગિન બીજાઓએ GitHub પર પ્રકાશિત કરેલાં પ્લગિન પણ બતાવે છે. તેમની કોઈએ સમીક્ષા કરી નથી અને તેમના પર સમીક્ષા વગરનું લખેલું હોય છે; કોડ પ્લગિનનું પેજ તેની સાઇનિંગ કી બતાવે છે, અને બીજી કીથી સાઇન થયેલું અપડેટ ઇન્સ્ટૉલ થતું નથી.\n\nસ્રોત (શરૂઆતની છેલ્લી લાઇન) બીજાઓની પ્લગિન સૂચિઓ તેમના સરનામાથી (https://…/plugins.json) ઉમેરે છે, PaperPawની સૂચિને બદલે તેમાંથી એક બતાવે છે કે કાઢી નાખે છે. ટાઇપ કરવાને બદલે કાર્ડ પર .paperpaw/plugins/store માં sources.txt મૂકો, દરેક લાઇનમાં એક સરનામું. PaperPaw સ્રોત કે તેનાં પ્લગિન તપાસતું નથી, અને ડિવાઇસ સ્રોતના સર્વરનો સંપર્ક કરે છે. ડિવાઇસ પહેલી વાંચેલી સૂચિની કી યાદ રાખે છે અને પછી ફક્ત તે કીથી સાઇન થયેલી સૂચિઓ અને કોડ પ્લગિન સ્વીકારે છે. પ્લગિનને અપડેટ ફક્ત તેના પોતાના સ્રોતમાંથી મળે છે. PaperPawની પોતાની લાઇબ્રેરી કાઢી શકાતી નથી; સ્ટોરમાંથી બહાર નીકળતાં ફરી તે જ દેખાય છે."
