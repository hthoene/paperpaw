lock.plugin.name = સ્ક્રીન લૉક
lock.plugin.description = ડિવાઇસ જાગે ત્યારે PIN, પૅટર્ન કે પાસવર્ડ; વાંચતી વખતે ટચ લૉક.
lock.plugin.how = "PaperPaw શરૂ થાય ત્યારે અને ડિવાઇસ જાગે ત્યારે સ્ક્રીન લૉક PIN, પૅટર્ન કે પાસવર્ડ માગે છે. શરૂઆતમાં તે બંધ હોય છે. તે ફક્ત આકસ્મિક વપરાશ રોકે છે: કોડ અને ખોટા પ્રયાસોની ગણતરી SD કાર્ડ પર રહે છે, તેથી જે કોઈ કાર્ડ કાઢે, તેમાં ફેરફાર કરે કે બદલે તે લૉક પાર કરી જાય છે.\n\nતેને સેટિંગમાં, ડિવાઇસ, સ્ક્રીન લૉક હેઠળ સેટ કરો: ચાલુ કોડ હોય તો તે દાખલ કરો, પ્રકાર પસંદ કરો, પછી નવો કોડ બે વાર. પૅટર્ન ફક્ત ટચ સ્ક્રીન પર મળે છે.\n\nપાંચ ખોટા પ્રયાસ પછી આગલા પ્રયાસ માટે અડધી મિનિટ રાહ જોવી પડે છે. “હમણાં લૉક કરો” તરત લૉક કરે છે અને તેને બટન, જેસ્ચર કે નિયમ પર મૂકી શકાય છે. “જાગ્યા પછી લૉક કરો” બંધ કરી શકાય છે, જેથી ફક્ત સાચી શરૂઆત (પાવર ચાલુ કે ફરી શરૂ) લૉક કરે, સિવાય કે જ્યાં દરેક જાગવું શરૂઆત હોય, જેમ કે બૅટરી પર X4.\n\nટચ લૉક, તેની બાજુમાં: ઝડપી પૅનલ અને વાંચન મેનૂમાં “ટચ લૉક કરો” ટૅપ, સ્વાઇપ અને પેનને નિષ્ક્રિય કરે છે જ્યારે બટન કામ કરતાં રહે છે, દા.ત. સ્ક્રીન પર હાથ રાખીને વાંચવા. અનલૉક કરવા, એક આંગળીથી બે વાર ટૅપ કરો અને તેને એક ક્ષણ દબાવી રાખો; પાવર બટન દબાવી રાખવાથી પાવર મેનૂ ખૂલે છે, જ્યાં “ટચ અનલૉક કરો” બટન વડે તે કરે છે; X4 Pro પર હોમ કી દબાવી રાખવાથી તરત અનલૉક થાય છે."
