store.source.note = PaperPaw {name} કે તેનાં પ્લગિન તપાસતું નથી. તેનાં કોડ પ્લગિનને આ ડિવાઇસ, તેનાં પુસ્તકો અને તેના સેટિંગની પૂરી ઍક્સેસ મળે છે. ડિવાઇસ સ્રોતના સર્વરનો સંપર્ક કરે છે. તેને ચલાવનાર પર વિશ્વાસ હોય તો જ ઉમેરો.
