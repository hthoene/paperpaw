translate.plugin.description = પસંદ કરેલા ટેક્સ્ટનો DeepL વડે ઑનલાઇન અનુવાદ કરે છે.
translate.plugin.how = "અનુવાદ પસંદ કરેલા ટેક્સ્ટનો DeepL વડે ઑનલાઇન અનુવાદ કરે છે. પુસ્તકમાં ટેક્સ્ટ પસંદ કરો અને પસંદ કરેલા ટેક્સ્ટના મેનૂમાં અનુવાદ કરો પસંદ કરો: અનુવાદ શબ્દકોશની એન્ટ્રીની જેમ પેજ પર દેખાય છે. પેજ બટન કે ટૅપ તેને સ્ક્રોલ કરે છે, અને પસંદ કરો અથવા તેના અંતે ટૅપ તેને બંધ કરે છે.\n\nતેને નેટવર્ક અને તમારી પોતાની DeepL API કી જોઈએ, જે deepl.com પર મફત મળે છે (DeepL API Free, મહિને લગભગ 500,000 અક્ષરો). તમે તે દાખલ ન કરો ત્યાં સુધી પૅનલ આ જણાવે છે, અને ટૅપ કરવાથી તે માગે છે.\n\nસેટિંગમાં, વાંચન હેઠળ, અનુવાદ વિભાગમાં, આમાં અનુવાદ કરો ભાષા નક્કી કરે છે; શરૂઆતમાં તે PaperPawની પોતાની ભાષા છે."
