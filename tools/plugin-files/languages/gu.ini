diagnostics.check.buttons.help = શરૂ કરો પસંદ કરો, પછી દરેક બટન માગવામાં આવે ત્યારે દબાવો. કોઈ બટન કામ ન કરે, તો આગળ વધવા બીજું બટન દબાવી રાખો.
