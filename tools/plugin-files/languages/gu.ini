launcher-simple.plugin.name = સરળ હોમ
launcher-simple.plugin.description = શાંત શરૂઆતની સ્ક્રીન: મોટી ઘડિયાળ, કાર્ડ, ડૉક અને ગોળ સ્વિચવાળી ઝડપી પૅનલ.
launcher-simple.plugin.how = "“સરળ હોમ” એ લોકો માટેની શાંત શરૂઆતની સ્ક્રીન છે જેમને ફક્ત મૂળ વસ્તુઓ જોઈએ: મોટી ઘડિયાળ, તમે વાંચો છો તે પુસ્તક, મોટાં કાર્ડ તરીકે લાઇબ્રેરી અને સ્ટોર, અને નીચે ત્રણ આઇકનનો ડૉક. તેને કોઈ સેટઅપની જરૂર નથી.\n\nતેને સેટિંગમાં, હોમ સ્ક્રીન હેઠળ પસંદ કરો. તેની ઝડપી પૅનલ (તેને પણ સેટિંગમાં પૅનલ તરીકે પસંદ કરો)માં મોટી ગોળ સ્વિચ, ડિવાઇસમાં લાઇટ હોય ત્યાં લાઇટ માટે એક પટ્ટી અને ટેક્સ્ટના કદ માટે એક પટ્ટી હોય છે. બટન વડે, તીર કી ફોકસ ખસેડે છે અને “પસંદ કરો” તે ભાગ જે કહે તે કરે છે; પટ્ટી પર તે દસમો ભાગ ઉમેરે છે, અને છેડેથી શરૂઆતમાં પાછું જાય છે. ટચ વડે, કોઈ ભાગને ટૅપ કરો, અથવા પટ્ટી પર જ્યાં જોઈએ ત્યાં ટૅપ કરો.\n\nલાઇબ્રેરી તમારાં પુસ્તકો કાર્ડ તરીકે બતાવે છે, છેલ્લે ખોલેલું પુસ્તક પહેલું, એક વારમાં એક પેજ, અને સામાન્ય રીડર ખોલે છે.\n\nતેને સેટિંગમાં, “સરળ હોમ” હેઠળ તમારી રીતે ગોઠવો: ત્રણ સૂચિઓ, જેમાં તમે મુખ્ય મેનૂની જેમ જ ફેરફાર કરો છો. કાર્ડ: હોમ કયાં કાર્ડ અને કયા ક્રમમાં બતાવે. ડૉક: ડૉકમાં કયાં આઇકન હોય, કોઈ પણ પ્લગિનની કોઈ પણ ક્રિયા. ઝડપી પૅનલ: તે કઈ સ્વિચ અને પટ્ટીઓ બતાવે. સ્ક્રીનમાં જગ્યા ન હોય તેવું કાર્ડ, છેડેથી શરૂ કરીને, છોડી દેવાય છે. “સરળ હોમ” હેઠળ તમે એ પણ પસંદ કરો છો કે તારીખ અને બૅટરી દેખાય કે નહીં."
