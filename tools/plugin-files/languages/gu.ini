store.source.key-changed.help = તમે તેને ઉમેર્યો ત્યારે હતી તેના કરતાં બીજી કીથી તેની સૂચિ સાઇન થયેલી છે, તેથી તેમાંથી કંઈ વાંચ્યું નથી. PaperPawનાં પ્લગિન પર પાછા જવા પાછળ જાઓ. ફેરફાર પર વિશ્વાસ હોય તો જ સ્રોત કાઢી નાખીને ફરી ઉમેરો.
