update.plugin.name = અપડેટ
update.plugin.description = ફર્મવેર અપડેટ ઇન્સ્ટૉલ કરે છે, કાર્ડ પરથી અથવા ઇન્ટરનેટ પરથી ડાઉનલોડ કરીને.
update.plugin.how = "અપડેટ નવું ફર્મવેર ઇન્સ્ટૉલ કરે છે, એવાં ડિવાઇસ પર જ્યાં PaperPaw જ ફર્મવેર છે, જેમ કે X4. તે તમને સેટિંગમાં અપડેટ તરીકે મળશે.\n\nઑનલાઇન શોધો અપડેટ સર્વરને નવા PaperPaw વિશે પૂછે છે અને તેને ડાઉનલોડ કરે છે, જેમાં Wi-Fi પર થોડી મિનિટ લાગે છે. અથવા અપડેટ ફાઇલ (.bin થી પૂરી થતી, paperpaw.org પરથી) કાર્ડ પરના updates ફોલ્ડરમાં કૉપિ કરો, ઉદાહરણ તરીકે Wi-Fi ટ્રાન્સફર વડે. પછી ઇન્સ્ટૉલ કરો લગભગ એક મિનિટ લે છે અને ડિવાઇસ ફરી શરૂ થાય છે; પુસ્તકો, સેટિંગ અને વાંચનસ્થાન રહે છે.\n\nઅપડેટ માટે જુઓ ચાલુ હોય ત્યારે (સેટિંગમાં, શરૂઆતમાં બંધ), ડિવાઇસ પોતે લગભગ અઠવાડિયે એક વાર પૂછે છે, ફક્ત ત્યારે જ્યારે Wi-Fi આમ પણ ચાલુ હોય અથવા તે ચાર્જ થતું હોય. તેને મળેલું નવું PaperPaw અહીં રાહ જુએ છે; કંઈ તમારા વાંચનમાં વિક્ષેપ પાડતું નથી. શોધ ડિવાઇસ શું ચલાવે છે તે મોકલે છે, તેનું કોઈ નામ કે નંબર નહીં; ડિવાઇસની ગણતરી માટે, એ પણ કે તમે પૂછ્યું હતું કે નહીં અને તે દિવસ, અઠવાડિયા કે મહિનાની તેની પહેલી શોધ છે કે નહીં.\n\nજો તમે વાપરો છો તે પ્લગિનનું નવી રિલીઝ માટે હજી કોઈ વર્ઝન ન હોય, તો અપડેટ તેમની રાહ જુએ છે. જૂનું વર્ઝન ફક્ત તમે પસંદ કરો તો જ ઇન્સ્ટૉલ થાય છે.\n\nબીજું ફર્મવેર, જેમ કે CrossPoint, પણ અહીંથી ઇન્સ્ટૉલ થાય છે: તેની ફાઇલ (.bin થી પૂરી થતી) updates ફોલ્ડરમાં મૂકો, અને અપડેટ ખોલો. PaperPaw તપાસે છે કે તે આ ડિવાઇસ માટેનું આખું, ખામી વગરનું ફર્મવેર છે, પણ તે કોણે બનાવ્યું તે કહી શકતું નથી, કારણ કે તે સાઇન થયેલું નથી. તો પણ ઇન્સ્ટૉલ કરો તેને ફ્લૅશના બીજા અડધા ભાગમાં લખે છે, અને ડિવાઇસ તેને શરૂ કરે છે; તે ફર્મવેર તેના પર કંઈક ઇન્સ્ટૉલ ન કરે ત્યાં સુધી PaperPaw તેના અડધા ભાગમાં રહે છે. પછીથી PaperPaw પર પાછા આવવા, બીજા ફર્મવેરના મેનૂમાંથી, જેમ કે CrossPoint નું SD firmware update, તેની ઇન્સ્ટૉલ ફાઇલ (paperpaw-<device>-<version>-install.bin) ઇન્સ્ટૉલ કરો."
