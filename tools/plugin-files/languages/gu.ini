sleep.plugin.name = સ્લીપ સ્ક્રીન
sleep.plugin.description = ડિવાઇસ સ્લીપમાં હોય ત્યારે સૂતેલી બિલાડી, પુસ્તકનું કવર, તમારાં ચિત્રો કે સંદેશ બતાવે છે.
sleep.plugin.how = "ડિવાઇસ સ્લીપમાં હોય ત્યારે સ્ક્રીન શું બતાવે તે સ્લીપ સ્ક્રીન નક્કી કરે છે. ઇ-ઇંક પાવર વગર પણ ચિત્ર જાળવી રાખે છે.\n\nતેને સેટિંગમાં “ડિવાઇસ”, “સ્લીપ સ્ક્રીન” હેઠળ “બતાવો”માં પસંદ કરો: સૂતેલી બિલાડી (માનક), પુસ્તકનું કવર, મારાં ચિત્રો, લોગો અને “સ્લીપમાં”, વિજેટ, પેજ જેમ છે તેમ, અથવા ચિત્ર સાથે પેજ. “મારાં ચિત્રો” ચિત્રોના ફોલ્ડરની ફાઇલો એક પછી એક બતાવે છે.\n\nકવર કે ચિત્ર ન હોય તો બિલાડી દેખાય છે. જ્યાં સિસ્ટમ જાતે સ્લીપ સ્ક્રીન દોરે છે, ત્યાં આ સેટિંગ છુપાયેલાં છે.\n\nબંધ સ્ક્રીન, “બંધ કરતી વખતે બતાવો”, ડિવાઇસ બંધ થાય ત્યારે એક વાર દોરાય છે, પાવર મેનૂમાંથી અથવા “સ્લીપ પછી બંધ કરો”ના સમય પછી (ઓછી બૅટરીને કારણે પાવર કપાય ત્યારે નહીં). તે સ્લીપ સ્ક્રીન જેવી જ હોય છે, સિવાય કે તમે લોગો અને “બંધ”, બિલાડી, કવર કે મારાં ચિત્રો પસંદ કરો. બીજું પ્લગિન તેના માટે સ્ક્રીન આપી શકે છે.\n\nશરૂઆત અને ફરી શરૂઆતની સ્ક્રીન, “શરૂ કરતી વખતે બતાવો” અને “ફરી શરૂ કરતી વખતે બતાવો”, ડિવાઇસની પોતાની હોય છે, સિવાય કે બીજું પ્લગિન તેના માટે સ્ક્રીન આપે. ડિવાઇસ શરૂ થતું હોય ત્યારે પ્લગિન હજી ચાલતાં નથી: શરૂઆત માટે પસંદ કરેલી સ્ક્રીન અગાઉથી દોરાય છે, ડિવાઇસ બંધ થાય કે ફરી શરૂ થાય ત્યારે, અને આગલી શરૂઆતે બતાવાય છે. સમયસર તૈયાર ન થયેલી સ્ક્રીન, અથવા ખરાબ થયેલું ચિત્ર, ડિવાઇસની પોતાની સ્ક્રીનને જગ્યા આપે છે; ડિવાઇસ કોઈ પણ સંજોગમાં બંધ થાય છે કે ફરી શરૂ થાય છે."
