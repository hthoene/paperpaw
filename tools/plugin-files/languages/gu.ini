power.plugin.name = પાવર
power.plugin.description = પાવર મોડ જાતે અથવા બૅટરી મુજબ પસંદ કરે છે: સામાન્ય, બચત, ઑફલાઇન.
power.plugin.how = "“પાવર” પસંદ કરે છે કે PaperPaw બૅટરી કેવી રીતે વાપરે: સામાન્ય, બચત અથવા ઑફલાઇન. “બચત” રાહ જોઈ શકે તેવાં કામ વધુ સારા સમયે કરે છે; “ઑફલાઇન” રેડિયો બંધ રાખે છે. “ઑટો” બૅટરી મુજબ પસંદ કરે છે.\n\nમોડ ક્વિક પૅનલમાં બદલો, જ્યાં “પાવર” મોડ બાજુ બાજુમાં બતાવે છે, અથવા સેટિંગમાં “પાવર” હેઠળ. ત્યાં તમે એ સ્તર પણ સેટ કરો છો જ્યાં “ઑટો” બચત અને ઑફલાઇન પર જાય, અને ચાર્જ થતી વખતે તે સામાન્ય રહે કે નહીં.\n\nસ્ટેટસ લાઇનમાં “પાવર મોડ” બચત વખતે પાંદડું અને ઑફલાઇન વખતે કાપેલું Wi-Fi બતાવે છે, અને સામાન્યમાં કશું નહીં.\n\nનાનું મેનૂ ખોલવા પાવર બટન દબાવી રાખો: સ્લીપ, બંધ કરો (જ્યાં PaperPaw કરી શકે), ફરી શરૂ કરો, અને ટચ ડિવાઇસ પર ટચ લૉક કરો કે ટચ અનલૉક કરો. ટૂંકું દબાવવાથી ડિવાઇસ હજી પણ સ્લીપમાં જાય છે. “પાછળ” મેનૂ છોડે છે."
