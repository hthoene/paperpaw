update.plugin.how = "Opdatering installerer ny firmware på enheder, hvor PaperPaw er firmwaren, f.eks. X4. Du finder den under Opdatering i indstillingerne.\n\nSøg online spørger opdateringsserveren efter en nyere PaperPaw og henter den. Det tager nogle minutter over Wi-Fi. Eller kopiér en opdateringsfil (med endelsen .bin, fra paperpaw.org) til mappen updates på kortet, f.eks. med Wi-Fi-overførsel. Installationen tager derefter omkring et minut, og enheden genstarter; bøger, indstillinger og læsepositioner bevares.\n\nNår Søg efter opdateringer er slået til (i indstillingerne, fra som standard), søger enheden selv cirka én gang om ugen, men kun når Wi-Fi allerede er slået til, eller enheden oplades. En nyere PaperPaw, som findes, venter her; intet afbryder din læsning. En søgning sender, hvad enheden kører, uden navn eller enhedsnummer; for at tælle enheder sendes også, om du bad om søgningen, og om det er dagens, ugens eller månedens første søgning.\n\nHvis udvidelser, du bruger, endnu ikke har en version til den nye udgave, venter opdateringen på dem. En ældre version installeres kun, hvis du vælger den.\n\nAnden firmware, f.eks. CrossPoint, kan også installeres herfra: læg dens fil (med endelsen .bin) i mappen updates, og åbn Opdatering. PaperPaw kontrollerer, at det er en hel, ubeskadiget firmware til denne enhed, men kan ikke se, hvem der har lavet den, da den ikke er signeret. Installer alligevel skriver den til den anden halvdel af flashlageret, og enheden starter den; PaperPaw bliver i sin halvdel, indtil den anden firmware installerer noget over den. For senere at vende tilbage til PaperPaw skal du installere dens installationsfil (paperpaw-<device>-<version>-install.bin) fra den anden firmwares menu, f.eks. CrossPoints SD firmware update."
