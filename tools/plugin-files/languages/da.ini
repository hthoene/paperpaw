files.plugin.name = Filbrowser
files.plugin.description = Viser bøgerne og mapperne på enheden og åbner dem.
files.plugin.how = "Biblioteket viser bøgerne i din biblioteksmappe med omslag, titel, forfatter og hvor langt du har læst. Den bog, du sidst læste, står øverst som et kort, så du kan læse videre med ét tryk eller ét tryk på OK. Mens biblioteket leder efter bøger, viser det, hvor mange det har fundet indtil nu.\n\nVælg over bøgerne, hvad der vises: alle, dem du er i gang med, ulæste eller færdiglæste, eller hylderne (efter forfatter, serie, emneord, favoritter, næste bog i hver serie, du er begyndt på). Tryk på en bog for at læse den; hold den nede (med knapper: hold OK) for at åbne den, markere den som læst eller ulæst, se dens oplysninger, flytte den til arkivet eller slette den. Tryk på titlen for biblioteksmenuen: sortering og visning, søgning, biblioteksmappe og indstillinger.\n\nBiblioteksmappen vælges i Indstillinger under Bibliotek som Biblioteksmappe; her kan du også vise bøgerne som et gitter af omslag. Brug Filer i menuen Værktøjer til alle andre filer."
