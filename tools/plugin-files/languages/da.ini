vocabulary.sd.readme = "Øvelseskort fra filer\n\nLæg en fil her for hvert sæt: Spansk.tsv opretter sættet Spansk.\nFiler: .tsv, .csv eller .txt, gemt som UTF-8, eller .apkg: et Anki-sæt eksporteret med Support older Anki versions markeret. Noternes første tre felter bliver forside, bagside og eksempel; øvelsesplan og medier læses ikke, og PaperPaw skriver aldrig til en Anki-fil.\n\nÉt kort pr. linje: forside, bagside og et valgfrit eksempel, adskilt af tabulator, komma eller semikolon. Første linje kan navngive kolonnerne: front, back, example. Eksempel:\n\nKatze\tkat\tDie Katze schläft.\n\nÅbn så Øvelseskort på læseren, vælg Kort på SD-kortet og derefter Opdater sættene.\n\nGodt at vide:\n- Sættene bliver på læseren med det, du har lært. En fil læses, når den er ny eller ændret, og dens kort tilføjes eller ændres i sættet.\n- Ændr et korts bagside eller eksempel i filen: kortet ændres og bevarer din fremgang.\n- Ændr et korts forside: det tæller som et nyt kort, og det gamle starter forfra. Kort matches efter forsiden uden hensyn til mellemrum og store bogstaver. Gem et sæt i en fil (Kort på SD-kortet, Gem sættet på kortet), så får hvert kort et nummer i id-kolonnen: ændr en forside der, behold filens første to linjer, og kortet bevarer din fremgang.\n- Lagring skriver sættets kort. Indhold, der ikke er kort (linjer uden forside), bevares ikke; den tidligere fil kopieres til _name.bak.tsv.\n- Gem filen som CSV UTF-8 (ikke UTF-16 eller regnearkets eget format). En fil over 4 MiB eller 20.000 linjer læses ikke: del den op.\n- En linje slettet i filen sletter ikke kortet i sættet, medmindre du slår Fjern manglende kort til for sættet. Så fjernes kortet sammen med din fremgang.\n- Filer, hvis navne starter med _, læses ikke.\n"
