vocabulary.plugin.name = Сөз байлык
vocabulary.plugin.description = Сиз караган сөздөрдү сүйлөмдөрү менен сактайт жана телефондо жасалган карточкаларды аралыктуу кайталоо менен кайталатат.
vocabulary.plugin.how = "«Сөз байлык» окууда караган сөздөрдү сүйлөмү менен кайталоо үчүн сактайт. Тизме Куралдарда, жаңысы биринчи; сөздү тандап кайра караңыз. Акыркы сап «Экспорттоо» аларды Anki сыяктуу карточка колдонмолоруна сактайт. Эң жаңы 2 000 сөз калат, эскилери өчөт: баарын сактоо үчүн эрте экспорттоңуз.\n\nКарточкалар (Куралдарда) аралыктуу кайталоо менен сынайт: «Жоопту көрсөтүүдөн» кийин «Кайра», «Кыйын», «Жакшы» же «Оңой» деп баалайсыз, бул карточканын кайтар убагын аныктайт. Топтомдор «Телефон менен түзөтүү» аркылуу: кодду ошол эле Wi-Fi'дагы телефон менен сканерлеп, карточка териңиз же топтомду ачып, «Көп карточка бир убакта» менен CSV, TSV же TXT файлын тандаңыз (сапка бир карточка: алдыңкы бет, арткы бет, мисал; UTF-8), тизме коюңуз же Anki топтомун алып келиңиз (.apkg, «Anki'нин эски версияларын колдоо» менен экспорттолгон). \n\nЖе SD карта аркылуу: Flashcards папкасына ар топтомго CSV, TSV, TXT файлын же Anki топтомун (.apkg, жогорудагыдай) салыңыз (Испанча.tsv – «Испанча» топтому; формат жогорудагыдай; биринчи сап front, back, example мамычаларын атай алат). Карточкалардан «SD картадагы карточкаларды» тандаңыз же ачканда өзү болсун. Топтомдор үйрөнгөнүңүз менен окугучта калат; жаңы же өзгөргөн файл топтомуна кошулат: арткы бет же мисал өзгөрсө, карточка жылышын сактап өзгөрөт; алдыңкы бет өзгөрсө, жаңы карточка болот, эскиси нөлдөн башталат (карточка алдыңкы бети менен таанылат; боштук, баш тамга эсептелбейт); өчүрүлгөн сап карточканы өчүрбөйт (топтомдо «Файлда жок карточкаларды» «Алып салууга» койбосоңуз: анда ал кийинки жаңыртууда жылышы менен биротоло өчөт, файлдын бир сабы окулбаса, эч нерсе өчпөйт). «Картага сактоо» топтомду өз файлына карточка номерлери (id мамычасы) менен жазат: алдыңкы беттерди компьютерде түзөтсөңүз да, үйрөнгөнүңүз калат; файлда id, алдыңкы, арткы бет, мисал гана калат (башка мамычалар, комментарийлер, сап тартиби жоголот), окулбаган сап болсо, сактоо болбойт; мурункусу биринчи жолу гана _аты.bak.tsv болуп көчүрүлөт. 4 МиБ же 20 000 саптан ашкан файл окулбайт; ал UTF-16 эмес, CSV UTF-8 болсун. Папка биринчи жолу түшүндүрмө менен түзүлөт.\n\n«Окуу» жөндөөлөрүндөгү «Каралган сөздөрдөн карточка жасоо» ар бир сөздү «Каралгандар» топтомуна салат."
