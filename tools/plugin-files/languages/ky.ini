news.plugin.name = Жаңылыктар
news.plugin.description = Жаңылык таспаларын (RSS, Atom) окула турган китептер катары алат.
news.plugin.how = "«Жаңылыктар» RSS же Atom таспаларын китептерге айландырат. Ар бир таспа китепкананын «Жаңылыктар» папкасындагы бир китеп болот, анын эң жаңы макалалары жөнөкөй текст катары, башка китептердей окулат.\n\n«Жаңылыктарды» Куралдар менюсунан ачып, «Таспа кошуу» тандаңыз; анын дареги гезиттин же блогдун сайтында. «Жаңылыктарды алуу» бардык таспаларды алат жана мурунку китептерди алмаштырат. Таспаны жалгыз алуу же алып салуу үчүн аны басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз). Алынып салынган таспа китебин китепканада калтырат.\n\nАлуу үчүн тармак керек. Жөндөөлөр, Китепкана ичиндеги «Таспадагы макалалар» ар бир китеп канча макала камтыйт экенин коёт. «Жаңылык аталыштары» виджети аларды башкы экранда көрсөтөт."
