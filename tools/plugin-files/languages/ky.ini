dictionary.plugin.name = Сөздүк
dictionary.plugin.description = StarDict сөздүктөрүнөн сөздөрдү издейт.
dictionary.plugin.how = "Сөздүк китептеги сөздү StarDict сөздүктөрүнөн издейт жана аныктамаларды экрандын ылдый бөлүгүнүн үстүндөгү панелде көрсөтөт.\n\nОкугучта сөздү басып туруп, «Издөө» тандаңыз; баскычтар менен «Дагы» астындагы «Текстти тандоо» колдонуңуз. Сөздүк папкаларын (.ifo, .idx жана .dict файлдары менен) түзмөктөгү «dictionaries» папкасына, ички папкалары менен кошо көчүрүңүз же Жөндөөлөрдөн «Окуу» астындагы «Сөздүк папкасы» аркылуу башка папканы тандаңыз (өнүккөн жөндөө). Биринчи издөө ар бир сөздүк үчүн кичине индекс даярдайт, бул бир аз убакытты алат.\n\nПанелде бет баскычтары же «Өйдө» жана «Төмөн» узун аныктамаларды сыдырат, «Артка» аны жабат. Сенсор менен аны жабуу үчүн анын сыртын таптаңыз."
