diagnostics.plugin.description = Сыноо экраны жана түзмөктүн бардык бөлүктөрүн жетектөө менен текшерүү.
diagnostics.plugin.how = "«Диагностика» түзмөктү текшерүү үчүн сыноо экраны: ал панель көрсөтө алган бардык боз деңгээлдерди, баскычтарды жана сенсорду сыноо үчүн төрт кутучаны жана жаңыртуу режимдерин салыштыруу үчүн жылыш тилкеси бар бет эсептегичин көрсөтөт.\n\nСыноо экранынын меню пункту жок. Ал башка плагин өзүнүкүн сунуш кылбаганда же плагин башкаргычындагы «Экрандар» бөлүмүндөн «Башкы экран» орду үчүн аны тандаганыңызда гана башкы экран болот.\n\n«Тандоо» фокустагы кутучаны белгилейт, жебе баскычтары кутучалар ортосунда жылдырат; сенсор менен кутучаны таптаңыз. Бет баскычтары сыноо беттерин бурат. «Тандоо» баскычын же манжаңызды экранда басып туруу башынан баштайт.\n\nТүзмөктү текшерүү, PaperPaw түзмөктүн микропрограммасы болгон жерде «Куралдар» астында, түзмөктүн бардык бөлүктөрүнөн бир бет менен өтөт: экран, баскычтар, сенсор, жарык, батарея, карта, саат, Wi-Fi, уйку жана эс тутум. Ар бир бет «Өтпөдү», «Өткөрүп жиберүү» жана «Өттү» менен аяктайт; өлчөөлөр сунуштаган жооп тандалып турат. Түзмөктө жок бөлүктөр өткөрүлүп жиберилет. Ар бир жоопто ал .paperpaw/plugins/diagnostics/device-check.txt ичине отчет жазат, аны pull request'ке коюу үчүн. «Артка» андан чыгат, кайра ачканда ал калган жеринен улантылат. Баскычтарынан гана турган түзмөктө адегенде баскыч бетинде «Баштоо» тандаңыз; ага чейин жебелер, «Тандоо» жана «Артка» бардык беттердегидей иштейт."
