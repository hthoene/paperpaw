aids.plugin.name = Окуу жардамчылары
aids.plugin.description = Сөз башталышы калың, алмаштырылган сөздөр, сүрөттөр: текст сиз каалагандай.
aids.plugin.how = "Окуу жардамчылары китептин тексти окуп жатканда кандай көрүнөрүн өзгөртөт. Алар ар бир китепке колдонулат. Сөздөрдүн башталышын калың кылуу жана Сөздөрдү алмаштыруу адегенде өчүк.\n\nАларды Жөндөөлөрдөн, «Окуу» астынан, «Окуу жардамчылары» бөлүмүнөн табасыз. «Сөз башталышы калың» ар бир сөздүн биринчи жарымын калың кылып коёт, кээ бир адамдарга ушундай окуу оңой. «Сөздөрдү алмаштыруу» «түс = түр; Мр. = Мистер» сыяктуу үтүрлүү чекит менен бөлүнгөн жуптарды кабыл алат.\n\nБүтүн сөздөр гана, так сиз жазгандай алмаштырылат, ошондуктан «түс» узунураак сөздүн бир бөлүгүн эч качан өзгөртпөйт. Китеп файлынын өзү өзгөрбөйт.\n\nКитептеги сүрөттөрдү көрсөтүүгө (адегендегидей), сүрөттүн сүрөттөмөсүн колдонгон «[Сүрөт: деңиздеги кеме]» сыяктуу кыска сапка айландырууга же алып салууга болот. Анда бетте текст үчүн орун көбүрөөк болот, ал эми көрсөтүлбөгөн сүрөт үчүн эч нерсе декоддолбойт, бул беттердин тез бурулушуна жардам берет. Комикстер жана сүрөттөрдөн турган башка китептер өзгөрбөйт."
