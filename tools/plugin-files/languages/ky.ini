opds.plugin.description = OPDS каталогдорун серептейт, алардын китептерин жүктөп алат жана папкаларды алар менен шайкеш кармайт.
opds.plugin.how = "OPDS каталогдору Project Gutenberg, Calibre-Web, Kavita же Komga сыяктуу онлайн китепканалар. Бул плагин аларды папкалардай серептейт жана издейт жана китептерин китепканага жүктөп алат.\n\n«Каталогдорду» Куралдар менюсунан ачып, «Каталог кошуу» тандаңыз: дарек жана каталогго эсеп керек болсо, колдонуучу аты менен сырсөз. Серептөө үчүн каталогду таптаңыз; аны шайкештирүү, түзөтүү же алып салуу үчүн басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз).\n\n«Бул каталогду шайкештирүү» күйүк болгондо, «Каталогдорду шайкештирүү» анын жаңы китептерин анын папкасына жүктөп алат. «Бир шайкештирүүдөгү китептер» бир шайкештирүү канча китеп алаарын чектейт, ошондуктан чоң каталог түзмөктү толтурбайт. «Булут папкасы (WebDAV)» каталогдун ордуна иштейт."
