reading-goal.plugin.name = Окуу максаты
reading-goal.plugin.description = Күнүнө окула турган мүнөттөр жана башкы экрандагы мышык, анын маанайы бүгүнкү окууга жараша болот.
reading-goal.plugin.how = "Башкы экраныңыздагы мышык бүгүнкү окуу кандай баратканын көрсөтөт: сиз азырынча окуй элек болсоңуз капа, бир аз окугандан кийин орто, күндүк максатыңыздын жарымынан ыраазы, аны жеткенден кийин бактылуу.\n\nБашкы экранга «Окуу мышыгы» виджетин кошуңуз (башкы экранды басып туруп, анан виджет кошуңуз) же уйку экраны катары «Бүгүнкү окуу мышыгын» тандаңыз. Мышыкты таптоо күндүк максатты ачат; ал окуган мүнөттөрүңүздү эсептеген окуу статистикасынын максаты.\n\nЖөндөөлөрдөн «Окуу» астында «Ыраазы болот» жана «Бактылуу болот» мышык максаттын кайсы үлүшүнөн ыраазы же бактылуу болорун коёт, ал эми «Өз сүрөттөрүм» мышыктардын ордуна көрсөтүлө турган сүрөттөрдүн папкасын көрсөтөт (капа, орто, ыраазы жана бактылуу). Сүрөттөр PNG же JPEG файлдары; папка жок болсо, мышыктар көрүнөт."
