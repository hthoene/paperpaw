vocabulary.sd.readme = "Файлдардан карточкалар\n\nБул жерге ар бир топтом үчүн бир файл салыңыз: Испанча.tsv «Испанча» топтомун түзөт.\nФайлдар: UTF-8 катары сакталган .tsv, .csv же .txt, же .apkg: «Support older Anki versions» (Anki'нин эски версияларын колдоо) белгиленип экспорттолгон Anki топтому. Анын жазууларынын алгачкы үч талаасы алдыңкы бет, арткы бет жана мисал болот; анын пландоосу жана медиасы окулбайт, жана PaperPaw Anki файлын эч качан жазбайт.\n\nАр бир сапта бир карточка: алдыңкы бет, арткы бет жана мисал (милдеттүү эмес), табуляция, үтүр же үтүрлүү чекит менен бөлүнгөн. Биринчи сап мамычаларды атай алат: front, back, example. Мисал:\n\nKatze\tмышык\tDie Katze schläft.\n\nАнан окугучта Карточкаларды ачып, «SD картадагы карточкаларды», андан кийин «Топтомдорду жаңыртууну» тандаңыз.\n\nБилүү пайдалуу:\n- Топтомдор үйрөнгөнүңүз менен окугучта калат. Файл жаңы же өзгөргөндө окулат, жана анын карточкалары топтомго кошулат же ошол жерде өзгөртүлөт.\n- Файлдагы карточканын арткы бетин же мисалын өзгөртүңүз: карточка өзгөрөт жана жылышыңызды сактайт.\n- Карточканын алдыңкы бетинин текстин өзгөртүңүз: ал жаңы карточка болуп саналат, жана эскиси башынан башталат. Карточкалар алдыңкы бетинин тексти боюнча дал келтирилет, боштуктар жана баш тамгалар эсепке алынбайт. Топтомду файлга сактаңыз («SD картадагы карточкалар», «Топтомду картага сактоо»), анда ар бир карточканын id мамычасында номери болот: алдыңкы бетти ошол жерде өзгөртүңүз, файлдын алгачкы эки сабын ошол бойдон калтырыңыз, жана карточка үйрөнгөнүңүздү сактайт.\n- Сактоо топтомдун карточкаларын жазат. Файлда болгон, бирок карточка болбогон нерсе (алдыңкы бети жок сап) сакталбайт; мурунку файл _аты.bak.tsv катары көчүрүлөт.\n- Файлды CSV UTF-8 катары сактаңыз (UTF-16 эмес, электрондук таблицанын өз форматы эмес). 4 МиБ же 20 000 саптан ашкан файл окулбайт: аны бөлүңүз.\n- Файлдан өчүргөн сабыңыз топтомдогу карточканы өчүрбөйт, эгер ошол топтом үчүн «Файлда жок карточкаларды алып салууну» күйгүзбөсөңүз. Анда карточка үйрөнгөнүңүз менен кошо кетет.\n- Аттары _ менен башталган файлдар окулбайт.\n"
