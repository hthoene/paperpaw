power.plugin.description = Кубат режимин кол менен же батареяга жараша тандайт: Кадимки, Үнөмдөө, Оффлайн.
power.plugin.how = "«Кубат» PaperPaw батареяны кантип сарптаарын тандайт: «Кадимки», «Үнөмдөө» же «Оффлайн». «Үнөмдөө» күтө турган нерсени ыңгайлуураак учурда кылат; «Оффлайн» радионы өчүк кармайт. «Авто» батареяга жараша тандайт.\n\nРежимди тез панелде өзгөртүңүз, ал жерде «Кубат» режимдерди катар көрсөтөт, же Жөндөөлөрдөн «Кубат» астында. Ошол жерде «Авто» «Үнөмдөөгө» жана «Оффлайнга» которулган деңгээлдерди, ошондой эле заряддоо учурунда «Кадимки» бойдон калабы, коёсуз.\n\nАбал саптарында «Кубат режими» үнөмдөөдө жалбырак, оффлайнда сызылган Wi-Fi көрсөтөт, ал эми «Кадимки» режимде эч нерсе көрсөтпөйт.\n\nКичине менюну ачуу үчүн күйгүзүү баскычын басып туруңуз: «Уктатуу», «Өчүрүү» (PaperPaw жасай алган жерде), «Кайра иштетүү», ал эми сенсордук түзмөктөрдө «Сенсорду кулпулоо» же «Сенсорду ачуу». Кыска басуу түзмөктү баары бир уктатат. «Артка» менюдан чыгат."
