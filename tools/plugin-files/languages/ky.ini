menu-editor.plugin.name = Меню редактору
menu-editor.plugin.description = Ар бир менюнун жазууларын кайра иреттейт, алып салат жана кошот.
menu-editor.plugin.how = "Меню редактору менюлардын курамын өзгөртөт: жазууларды өйдө же төмөн жылдырыңыз, аларды алып салыңыз же жаңыларын кошуңуз.\n\nАны Жөндөөлөрдөн «Ыңгайлаштыруу» астындагы «Менюларды ыңгайлаштыруу» бөлүмүнөн табыңыз. Менюну тандаңыз, анан аны жылдыруу же алып салуу үчүн жазууну тандаңыз; «Жазуу кошуу» жаңысын киргизет. Өзгөртүүлөр дароо колдонулат. «Бул менюну баштапкы абалга келтирүү» менюну анын плагиндери аныктагандай кайтарат, «Бардык менюларды баштапкы абалга келтирүү» муну ар бири үчүн жасайт.\n\nӨзүңүздү бекитип алуу мүмкүн эмес: жөндөөлөргө барган жол болгон жазуу аларга башка жол кошмоюнча калат."
