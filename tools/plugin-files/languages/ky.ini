translate.plugin.description = Тандалган текстти онлайн, DeepL менен которот.
translate.plugin.how = "«Котормо» тандалган текстти онлайн DeepL менен которот. Китептеги текстти тандап, тандалган текст менюсунан «Которуу» тандаңыз: котормо беттин үстүндө сөздүк жазуусундай чыгат. Бет баскычтары же таптоолор аны сыдырат, ал эми «Тандоо» же анын аягындагы таптоо аны жабат.\n\nАга тармак жана deepl.com сайтында акысыз өз DeepL API ачкычыңыз керек (DeepL API Free, айына болжол менен 500 000 белги). Аны киргизгенге чейин панель муну айтат, ал эми таптоо аны сурайт.\n\nЖөндөөлөрдөн «Окуу» астындагы «Котормо» бөлүмүндө «Которуу тили» тилди коёт; башында ал PaperPaw'дын өз тили."
