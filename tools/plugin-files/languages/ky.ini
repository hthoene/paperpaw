tasks.plugin.name = Тапшырмалар
tasks.plugin.description = Мөөнөтү жана артыкчылыгы бар иштер тизмеси, окугучта же CalDAV сервериңиз менен шайкештирилген, башкы экран виджеттери менен.
tasks.plugin.how = "Окугучуңуздагы иштер тизмеси: мөөнөтү жана артыкчылыгы бар тапшырмалар, аткарылганда белгиленет. Алар жөндөөсүз жана тармаксыз иштейт жана CalDAV сервери (Nextcloud, Radicale, Baïkal, Fastmail жана башкалар) менен шайкеш кармалышы мүмкүн, ошондуктан ошол эле тизмелер телефонуңузда жана компьютериңизде болот.\n\n«Тапшырмаларды» куралдар менюсунан ачыңыз. Биринчи сап көрсөтүлгөн тизменин атын айтат; башка тизме үчүн, бардык тизмелердеги «Бүгүн жана мөөнөтү өткөндөр» үчүн, жаңы тизме үчүн, шайкештирүү үчүн же эсепти коюу үчүн аны тандаңыз. «Тапшырма кошуу» клавиатураны ачат. Тапшырмада «Тандоо» аны белгилейт (кайра: аткарылган эмес). Анын аталышын, мөөнөтүн (бүгүн, эртең, бир жумадан кийин же 2026-12-24 сыяктуу терген күн) же артыкчылыгын өзгөртүү үчүн же аны алып салуу үчүн тапшырманы басып туруңуз же «Меню» басыңыз. Ачык тапшырмалар биринчи турат, күнү, анан артыкчылыгы боюнча; аткарылгандары бир жума аягында калат (жөндөөлөрдөгү «Тапшырмалар» астында коюлат), анан окугучтан кетет.\n\nБашкы экран виджеттери (башкы экранды басып туруп, анан виджет кошуңуз): «Бүгүнкү тапшырмалар» бүгүн мөөнөтү келген же өткөндөрдү көрсөтөт, «Тапшырмалар тизмеси» бир тизмени көрсөтөт, «Ачык тапшырмалар» аларды санайт, ал эми «Кийинки тапшырма» кийин аткарыла турганды көрсөтөт. Виджеттеги тапшырманы таптоо аны белгилейт; аталышты таптоо тизмелерди ачат.\n\nШайкештирүү үчүн тизме сабынан «CalDAV эсеби» тандап, сервердин дарегин, колдонуучу атыңызды жана сырсөздү (эң жакшысы колдонмо сырсөзү) киргизиңиз. Сервердин дареги жетиштүү, мис. cloud.example.com/remote.php/dav; окугуч тапшырма тизмелериңизди ошол жактан табат. Сервердеги ар бир тапшырма тизмеси окугучта тизме болот. Окугуч «Тапшырмаларды» ачканда, «Азыр шайкештирүү» тандаганда жана тармак баары бир күйүк болгондо шайкештирет; тармаксыз өзгөрткөнүңүз күтөт жана кийинчерээк жөнөтүлөт. Тапшырма окугучта жана ортодо башка жерде өзгөртүлсө, сервердин нускасы алынат, ал эми сиздики анын жанында жаңы тапшырма катары сакталат, ошондуктан эч нерсе жоголбойт. Эскертүүлөр, ойготкучтар жана тапшырмада серверде бар башка нерселердин баары өз калыбында калат. Кайталануучу тапшырмалар көрсөтүлөт, бирок аларды түзгөн жерде өзгөртүлөт. Окугуч 12 тизмеде 200гө чейин тапшырманы сактайт."
