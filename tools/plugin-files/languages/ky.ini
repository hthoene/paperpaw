file-manager.plugin.name = Файл башкаргыч
file-manager.plugin.description = Түзмөктөгү бардык папкалар жана файлдар: ачуу, атын өзгөртүү, жылдыруу, көчүрүү жана өчүрүү.
file-manager.plugin.how = "Файл башкаргыч түзмөктүн сактагычындагы бардык папкаларды жана файлдарды көрсөтөт, китептериңизди гана эмес, жана аларды ачууга, атын өзгөртүүгө, жылдырууга, көчүрүүгө, өчүрүүгө жана жаңы папкаларды түзүүгө мүмкүндүк берет.\n\n«Файлдарды» Куралдар менюсунан ачыңыз. Ичине кирүү үчүн папканы таптаңыз; «Артка» жогорудагы папкага өтөт. Ага эмне кылса болорун көрүү үчүн файлды таптаңыз же каалаган жазууну басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз). «Жылдыруу» жана «Көчүрүү» жазууну тандайт: ал таандык папкага өтүп, ылдыйкы тилкедеги «Ушул жерге коюу» тандаңыз. Баскычтар менен тилкеге жетүү үчүн акыркы жазуудан «Төмөн» басыңыз.\n\nНукта менен башталган файлдар жана папкалар, мисалы PaperPaw'дын өз маалыматы, жашырылган. Аларды көрүү үчүн Жөндөөлөрдөн «Китепкана» астындагы «Жашыруун файлдарды» күйгүзүңүз."
