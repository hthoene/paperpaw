sleep.plugin.name = Уйку экраны
sleep.plugin.description = Түзмөк уктап жатканда уктап жаткан мышыкты, китептин мукабасын, сүрөттөрүңүздү же билдирүүнү көрсөтөт.
sleep.plugin.how = "Уйку экраны түзмөк уктап жатканда экран эмнени көрсөтөрүн чечет. E-ink сүрөттү кубатсыз сактайт.\n\nАны жөндөөлөрдөн «Түзмөк», «Уйку экраны» бөлүмүнөн «Көрсөтүү» менен тандаңыз: уктап жаткан мышык (демейки), китептин мукабасы, менин сүрөттөрүм, логотип жана «Уйкуда», виджеттер, бет өз калыбында же сүрөтү бар бет. «Менин сүрөттөрүм» «Сүрөттөр» папкасындагы файлдарды бирден көрсөтөт.\n\nМукабасыз же сүрөтсүз мышык көрүнөт. Уйку экранын система өзү чийген жерде бул жөндөөлөр жашырылган.\n\nӨчүк экран, «Өчүрүлгөндө көрсөтүү», түзмөк өчүрүлгөндө, күйгүзүү менюсунан же «Уйкудан кийин өчүрүү» убактысынан кийин бир жолу чийилет (батарея аз болуп кубат үзүлгөндө эмес). Ал логотип жана «Өчүрүлгөн», мышык, мукаба же менин сүрөттөрүм тандалбаса, уйку экранындай болот. Башка плагин ал үчүн экран сунуштай алат.\n\nБаштоо жана кайра иштетүү экраны, «Баштоодо көрсөтүү» жана «Кайра иштетүүдө көрсөтүү», башка плагин алар үчүн экран сунуштабаса, түзмөктүн өзүнүкү. Түзмөк башталганда плагиндер азырынча иштебейт: баштоо үчүн тандалган экран алдын ала, түзмөк өчүп же кайра иштегенде чийилет жана кийинки баштоодо көрсөтүлөт. Убагында даяр болбогон экран же бузулган сүрөт түзмөктүн өзүнүкүнө жол берет; түзмөк баары бир өчөт же кайра иштейт."
