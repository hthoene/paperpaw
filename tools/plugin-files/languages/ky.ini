keys.plugin.name = Баскычтар жана жаңсоолор
keys.plugin.description = Ар бир баскыч, таптоо зонасы жана сүрүү эмне кылат, түзмөктө өзгөртүлөт.
keys.plugin.how = "«Баскычтар жана жаңсоолор» ар бир баскыч, таптоо зонасы жана сүрүү эмне кылаарын көрсөтөт жана аны түзмөктө өзгөртүүгө мүмкүндүк берет.\n\nАны жөндөөлөрдөн «Түзмөк» астынан ачыңыз. Адегенде өзгөртүү кайда колдонуларын тандаңыз: «Бардык жерде», «Окуп жатканда», «Башкы экранда», «Китепканада» же бир куралда. Анан басып турган баскыч же четинен ичкери сүрүү сыяктуу киргизүүнү тандап, издесе боло турган тизмеден аракетти тандаңыз. «Стандарттуу» плагиндер жана баскыч калыбы койгонду кайтарат.\n\nX4'те тандоо, артка кайтуу же алга жылуу үчүн бир да баскыч калбай турган өзгөртүү четке кагылат. Аягындагы «Баскычтарды жана жаңсоолорду баштапкы абалга келтирүү» бардык өзгөртүүлөрдү кайтарат."
