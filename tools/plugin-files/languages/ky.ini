notes-overview.plugin.name = Бардык эскертүүлөр
notes-overview.plugin.description = Бардык китептердин бетбелгилери жана белгилөөлөрү бир тизмеде жана My Clippings.txt катары экспорт.
notes-overview.plugin.how = "«Бардык эскертүүлөр» бетбелги же белгилөө жасаган ар бир китепти канчасы менен тизмелейт. Аны «Куралдардан» ачыңыз. Эскертүүлөрүн көрүү үчүн китепти тандаңыз, ал эми китепти ошол жерден ачуу үчүн эскертүүнү тандаңыз.\n\nТизменин аягында «My Clippings.txt катары экспорттоо» бардык эскертүүлөрдү китепкананын жанындагы «Exports» папкасына бир файлга жазат, Kindle колдонгон форматта (UTF-8). Kindle'дин My Clippings.txt файлын окуган колдонмолор аны окуй алат. Белгилөөдөгү эскертүү Kindle'деги сыяктуу өзүнчө жазуу болот. Бул жердеги китепте Kindle орундары жок болгондуктан, «орун» эскертүү китептин канчалык тереңдигинде экенин пайыз менен көрсөтөт. Файл ар жолу кайра жазылат; ал мурункусун алмаштырат."
