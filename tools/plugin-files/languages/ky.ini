fonts-browser.plugin.description = Интернеттен шрифттерди көрсөтөт, ар бири үлгү менен, жана аларды окуу үчүн жүктөп алат.
fonts-browser.plugin.how = "«Көбүрөөк шрифттер» интернеттеги шрифт китепканасынан шрифттерди тизмелейт, ар бир аты өз шрифти менен жазылган, жана окугуңуз келгендерди жүктөп алат.\n\nАны окуу шрифти тандалган шрифттер тизмесинин аягынан табасыз, Жөндөөлөрдөн «Окуу» астындагы «Шрифт» бөлүмүндө; абал саптары өз шрифти үчүн ошол эле пунктка ээ. Шрифтти чоңураак көрүү үчүн үлгү сүйлөм менен таптаңыз (баскычтар менен «Тандоо» басыңыз), анан «Жүктөп алуу» тандаңыз. Ал жүктөлүп жатканда бетти таштап кетсеңиз болот. Даяр болгондо «Окуу (шрифттин аты) менен» же абал саптары үчүн «Колдонуу» тандаңыз. «Жаңыртуу» жаңыраак версияны алат, «Алып салуу» шрифтти түзмөктөн өчүрөт.\n\nАга Wi-Fi керек.\n\nӨЗ ШРИФТТЕРИҢИЗ\n\n«Көбүрөөк шрифттердин» жанында ошол эле тизмеде «Өз шрифттериңиз» бар, ал жардамдын бул бөлүгүн көрсөтөт. Өз шрифтиңиз бул .ttf же .otf файлы, мисалы Google Fonts'тон.\n\nAndroid'де жана шрифт файлдарын чийген башка түзмөктөрдө: файлды шрифттер папкасына көчүрүңүз (Android'де: ортоктош сактагычтагы PaperPaw/fonts), PaperPaw'ды кайра иштетип, шрифтти Жөндөөлөрдөн «Окуу» астындагы «Шрифт» бөлүмүндөн тандаңыз.\n\nXteink X4 жана X4 Pro'до: бул окугучтар шрифт файлдарын эмес, шрифт пакеттерин окуйт, анткени шрифт файлдары алардын эс тутумуна батпайт. Пакетти компьютерде paperpaw-fontgen менен жасаңыз, сизде бар ар бир стиль үчүн (кадимки керек):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nБул plugins/font-my-font папкасын жасайт. Аны эс тутум картасындагы plugins папкасына көчүрүп, кайра иштетип, «My Font» шрифтин «Шрифт» катары тандаңыз. Бир стилдеги пакет латын тамгалары үчүн болжол менен жарым мегабайт; калтырылган стилдер кадимки менен чийилет. Курал шрифтте сиз сураган тамгалардын канчасы бар экенин айтат (--chars latin,cyrillic,greek жазууларды кошот): китебиңиздеги тамгалары жок шрифт аларды көрсөтө албайт, ошондуктан анын жазуусун камтыганын издеңиз.\n\n«Көбүрөөк шрифттерден» шрифттер ушундай эле иштейт жана компьютер керек эмес.\n\nE-ink панелиндеги майда текстти даанараак кылуу үчүн буйрукка --hinting light кошуңуз: ал тамгаларды пиксел торуна ылайыктайт, демейки шрифттер ушундай жасалган. Анысыз тамгалар шрифт иштелип чыккандай чийилет; --hinting normal жана --hinting mono аларды күчтүүрөөк ылайыктайт. Араб же деванагари сыяктуу белгилери бар шрифттерди ансыз калтыруу жакшы."
