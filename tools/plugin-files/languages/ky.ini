profiles.plugin.name = Окуу профилдери
profiles.plugin.description = Окуу жана экран жөндөөлөрүнүн аталыштуу топтому, бир таптоо менен которулат.
profiles.plugin.how = "Профиль окуу жөндөөлөрүңүздү, экран жөндөөлөрүңүздү жана абал саптарыңызды «Түнкү» же «Чоң тамга» сыяктуу ат менен сактайт жана аларды бир таптоо менен кайтарат.\n\n«Профилдерди» окуу менюсунан «Дагы» астынан же Жөндөөлөрдөн «Ыңгайлаштыруу» астынан ачыңыз. Профилди колдонуу үчүн таптаңыз; колдонулуп жаткан белгиленет. Азыркы жөндөөлөрдү ага сактоо, атын өзгөртүү же алып салуу үчүн аны басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз). «Жаңы профиль катары сактоо» азыр коюлганды сактайт.\n\n«Кийинки профиль» тизмедеги кийинкисине которот; аны баскычка же эрежеге коюңуз."
