calendar.plugin.name = Күнтизме
calendar.plugin.description = Күнтизмелериңиз окугучта: CalDAV, iCal жана файлдардан күн тартиби, күн, жума жана ай көрүнүштөрү, байланыштардан туулган күндөр, башкы экран виджеттери жана уйку экраны.
calendar.plugin.how = "Күнтизмелер окугучта: кийинки күндөрдүн күн тартиби, күн, жума, ай; CalDAV (Nextcloud, Radicale, Baïkal, Fastmail ж.б.), iCal даректери (.ics, webcal://), картадагы файлдардын иш-чаралары жана байланыштардын туулган, эстелик күндөрү (CardDAV). Окугуч аларды окуйт гана, өзгөртпөйт.\n\nКүнтизмени куралдар менюсунан ачыңыз. Биринчи сапта көрүнүштүн аты; аны тандап, сапты басып туруп же «Меню» менен «Күн тартиби», «Күн», «Жума», «Ай», «Туулган күндөргө» өтөсүз, күнтизме кошосуз же шайкештиресиз. «Күн», «Жума» ичинде алгачкы эки сап мурунку же кийинки күнгө/жумага өтөт (бет баскычтары да); «Ай» ичинде жебелер күндү, бет баскычтары айды жылдырат, «Тандоо» күндү ачат. «Тандоо» иш-чараны толук көрсөтөт: качан, кайда, кайсы күнтизме, кантип кайталанат. «Артка» бир кадам кайтарат.\n\n«Күнтизмелер» бөлүмүнөн (менюда же жөндөөлөрдөгү «Күнтизме») күнтизме кошуңуз. Түрү: CalDAV эсеби (сервер дареги жетиштүү, мис. cloud.example.com/remote.php/dav; иш-чаралуу ар бир күнтизме кошулат), iCal дареги (жарыяланган .ics), картадагы файл же байланыштар (CardDAV дарек китеби: андагы туулган, эстелик күндөр). Даректи, эсеп үчүн колдонуучу аты менен сырсөздү (колдонмо сырсөзү жакшы; окугучтун сырсөздөрү менен сакталат) жана атын киргизиңиз. Ар бирин өзгөртүлүүчү белги ажыратат (чекит, шакек, боз чекит же чарчы); алтыга чейин.\n\nКайталануучу (күн, жума, ай, жыл сайын; жума күндөрү, саны, аяктоо күнү, өткөрүлгөн күндөр менен), күн бою жана башка саат алкагындагы иш-чаралар окугучтун саатында көрүнөт. Бүгүндөн 60 күн мурунку жана кийинки иш-чаралар (эң көп 240) сакталып, тармаксыз көрүнөт. Эрежеси окулбаган иш-чара бир жолу көрүнөт.\n\nКүнтизмелер ачылганда (эң көп 5 мүнөттө бир), «Азыр шайкештирүү» тандалганда жана жөндөөлөрдөгү «Күнтизме» боюнча тармак күйүк кезде же заряддоо башталганда окулат. Бул үчүн радио өзүнөн күйбөйт, «Азыр шайкештирүүдөн» башка.\n\nБашкы экран виджеттери (экранды басып туруп, виджет кошуңуз): «Бүгүн» (дата, күндүн иштери), «Кийинки иш-чара», «Күн тартиби» (кийинки күндөр), «Ай» (иш-чаралуу күндөр чекиттүү) жана «Туулган күндөр» (жакынкылары). Тапталган иш-чара же айдын күнү ачылат. Уйку экраны бүгүнкү тартипти көрсөтө алат: жөндөөлөрдө «Уйку экраны» астынан «Күнтизме» тандаңыз."
