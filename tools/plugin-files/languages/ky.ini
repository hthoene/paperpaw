core.host-firmware.foreign = Бул PaperPaw'ды башка микропрограмма менен алмаштырат. PaperPaw кийин өзү кайра иштебейт.
core.host-firmware.no-undo = PaperPaw бул өзгөртүүнү артка кайтара албайт. Кайтуу үчүн башка микропрограмманын калыбына келтирүү мүмкүнчүлүгүн колдонуңуз же PaperPaw'ды веб-флэшер менен кайра орнотуңуз.
core.host-firmware.kept = PaperPaw түзмөктүн эс тутумунда калат. Эс тутум картасындагы файлдар өзгөрбөйт.
core.host-firmware.unsigned = Бул микропрограмма кол коюлган эмес. Анын файл түзүмү жана түзмөккө шайкештиги гана текшерилет, булагы текшерилбейт.
core.host-firmware.unknown-key = Бул микропрограммага белгисиз ачкыч менен кол коюлган. Бул жерде көрсөтүлгөн ачкычка ишенсеңиз гана орнотуңуз.
core.host-firmware.downgrade = Бул эски версия мурунку версияны автоматтык түрдө калыбына келтире албайт. Кайтуу үчүн PaperPaw'ды веб-флэшер менен кайра орнотуңуз.
core.host-firmware.early-crash = Жаңы микропрограмма ишке киргизүүдөгү коопсуздук текшерүүсүнөн мурун иштебей калса, түзмөк күйбөй калышы мүмкүн. PaperPaw'ды калыбына келтирүү үчүн веб-флэшер керек болот.
