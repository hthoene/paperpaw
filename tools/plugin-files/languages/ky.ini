transfer.plugin.description = Бир тармактагы браузерден түзмөккө китептерди жана башка файлдарды салат.
transfer.plugin.how = "Wi-Fi аркылуу өткөрүү китептерди жана башка файлдарды бир тармактагы браузерден түзмөккө салат, кабелсиз жана колдонмосуз. Ошондой эле файлдарды алып, папкаларды түзүп жана өчүрө аласыз.\n\nАны Куралдардан ачыңыз. Экран даректи текст жана QR-код катары көрсөтөт: аны телефондогу же компьютердеги браузерде ачыңыз же кодду сканерлеңиз. Дарек ар жолу жаңыдан жасалган ачкычты камтыйт, ошондуктан тармактагы башкалар файлдарыңызга кире албайт. Өткөрүү экран ачык турганда иштейт.\n\nPaperPaw Wi-Fi'ды өзү иштеткен жерде, X4'тегидей, ылдыйдагы «Роутерсиз» түзмөктүн өз тармагын ачат, телефон ага кодду сканерлөө менен кошулат."
