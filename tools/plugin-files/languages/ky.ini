mail.plugin.name = Почта
mail.plugin.description = Электрондук каттарды сырсөз же колдонмо сырсөзү менен окуйт жана жөнөтөт (IMAP жана SMTP), браузерде кирүүсүз.
mail.plugin.how = "«Почта» электрондук каттарды IMAP жана SMTP аркылуу окуйт жана жөнөтөт. Ал дарегиңиз жана сырсөз менен кирет, браузерде кирүүсүз, ошондуктан муну уруксат берген каалаган провайдер менен иштейт.\n\nЭсепти Жөндөөлөрдөн «Почта» бөлүмүндө жөндөңүз. Провайдериңизди тандап, дарегиңизди жана сырсөздү териңиз. Көпчүлүк провайдерлер колдонмо сырсөзүн каалайт: аны эсебиңиздин коопсуздук жөндөөлөрүндө жасап, ушул жерде колдонуңуз. Кадимки сырсөзүңүз көбүнчө иштебейт жана ал провайдериңиздин серверинен башка жакка эч качан барбайт. Ал сырсөздөр жана ачкычтар менен кошо сакталат.\n\n«Почтаны» куралдардан ачыңыз. «Каттарды текшерүү» эң акыркы каттарды жана папкаларды алат. Каттар картада сакталат, ошондуктан аларды тармаксыз окуй аласыз. Түзмөк туташат, алат жана үзүлөт, ошондуктан Wi-Fi бир саамга гана күйүк болот.\n\nПровайдериңиз тизмеде жок болсо, «Өз серверлерим» тандап, сервер аттарын, портторду жана коопсуздукту өнүккөн жөндөөлөрдөн коюңуз. Сертификатына эч бир орган кепилдик бербеген сервер ага ишенүү керекпи деп бир жолу сурайт; манжа изин провайдериңиз көрсөткөн менен салыштырыңыз.\n\nКитеп тиркелген катта (EPUB, PDF жана ушул сыяктуулар, 2 МБ'га чейин) анын астында «Китепти ачуу» бар: ал файлды алат, китепканага салат жана ачат.\n\n«Почтаны» ачпай жаңы каттарды көрүү үчүн Жөндөөлөрдөн «Почта» бөлүмүндөгү «Жаңы каттарды фондо текшерүүнү» күйгүзүп, канчалык тез-тез экенин тандаңыз (15, 30 же 60 мүнөт сайын). Ал сиз күйгүзмөйүнчө өчүк. Андан кийин окугуч ойгоо жана онлайн болгондо кээде коопсуз туташуу аркылуу туташат, бир эсептен кийин экинчисин, жана Башкыдагы окула элек санын жаңыртат. Ал бир аз батареяны сарптайт. «Почтаны» ачуу жүрүп жаткан текшерүүнү токтотот.\n\nБашкы экран виджеттери окула элек санын, акыркы жана жылдызчалуу каттарды, бир почта кутусун жана кат жазуу үчүн ыкчам жолду көрсөтөт."
