keyboard.plugin.name = Клавиатура
keyboard.plugin.description = Экранда текст киргизет, сенсор менен же баскычтар менен.
keyboard.plugin.how = "Клавиатура бир нерсеге текст керек болгондо ачылат: издөө, сырсөз, эскертүү же жөндөө. Ал сенсор менен да, баскычтар менен гана да иштейт.\n\nБаскычтар менен солго жана оңго сап боюнча жылдырат, бет баскычтары саптар ортосунда жылдырат, «Тандоо» баскычты басат, «Артка» жокко чыгарат; солго жана оңго сапты айланат, ал эми өйдө жана төмөн мамычаңызды сактайт. «Shift» кийинки тамганы баш тамга кылат; бардыгы баш тамга болуш үчүн эки жолу басыңыз, токтотуу үчүн дагы бир жолу. Тамганы басып туруңуз (баскычтар менен: ага «Тандоо» баскычын басып туруңуз), анын баш тамгасы дароо тандалат, ошондой эле é жана è сыяктуу акценттер; немис тилинде ä, ö, ü жана ß ушундайча a, o, u жана s тамгаларынан келет (баскычтар менен клавиатура ал тамгаларда муну айтат). «OK» аяктайт; баскычтар менен каалаган жерден аяктоо үчүн «Артка» баскычын басып туруңуз («Артка» жалгыз жокко чыгарат) же тамга болбогон баскычта «Тандоо» баскычын басып туруңуз. «Коюу» алмашуу буферинин текстин киргизет, ал эми «Телефон», сунушталганда, анын ордуна телефонуңузда терүүгө мүмкүндүк берет.\n\n«Түзмөк», «Клавиатура» астындагы жөндөөлөрдө: «Клавиатура калыптары» калыптарды тандайт. Демейки боюнча ал меню тилин ээрчийт; бир нечеси болсо, баскыч алардын ортосунда которот. «Умлаут баскычтары» анын ордуна ä, ö, ü жана ß үчүн өзүнчө баскычтарды берет. «Өлчөмү» баскычтарды жана тамгаларды чоңойтот; баскычтар менен гана саптар компьютер клавиатурасындагыдай калат. Сенсордук экрандарда «Баскыч формасы» баскычтар кандай көрүнөрүн өзгөртөт. «Автоматтык баш тамгалар» ар бир сүйлөмдү баш тамга менен баштайт."
