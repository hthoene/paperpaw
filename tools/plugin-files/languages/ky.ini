lock.plugin.description = Түзмөк ойгонгондо PIN-код, графикалык ачкыч же сырсөз; окуп жатканда сенсор кулпуланат.
lock.plugin.how = "Экран кулпусу PaperPaw башталганда жана түзмөк ойгонгондо PIN-код, графикалык ачкыч же сырсөз сурайт. Ал адегенде өчүк. Ал кокус колдонуудан гана сактайт: код жана туура эмес аракеттердин саны SD картасында сакталат, ошондуктан картаны алган, аны түзөткөн же алмаштырган адам кулпудан өтүп кетет.\n\nАны жөндөөлөрдөн «Түзмөк», «Экран кулпусу» бөлүмүндө жөндөңүз: колдонулуп жаткан код бар болсо, аны киргизиңиз, түрүн тандаңыз, анан жаңы кодду эки жолу киргизиңиз. Графикалык ачкыч сенсордук экрандарда гана сунушталат.\n\nБеш туура эмес аракеттен кийин кийинкиси жарым мүнөт күтөт. «Азыр кулпулоо» дароо кулпулайт жана аны баскычка, жаңсоого же эрежеге коюуга болот. «Ойгонгондон кийин кулпулоо» өчүрүлүшү мүмкүн, ошондо чыныгы баштоо (күйгүзүү же кайра иштетүү) гана кулпулайт, ар бир ойгонуу баштоо болгон жерлерден тышкары, мисалы X4 батареяда.\n\nСенсор кулпусу, анын жанында: тез панелдеги жана окуу менюсундагы «Сенсорду кулпулоо» таптоолорду, сүрүүлөрдү жана калемди эч нерсе кылбай коёт, ал эми баскычтар иштей берет, мис. колуңуз экранда турганда окуу үчүн. Ачуу үчүн бир манжа менен эки жолу таптап, экинчисин бир азга кармап туруңуз; күйгүзүү баскычын басып туруу «Күйгүзүү» менюсун ачат, ал жерде «Сенсорду ачуу» муну баскычтар менен жасайт; X4 Pro'до башкы баскычты басып туруу дароо ачат."
