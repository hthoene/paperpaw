reader.plugin.name = Окугуч
reader.plugin.description = Китептерди бетме-бет, мазмуну жана окуу жөндөөлөрү менен көрсөтөт.
reader.plugin.how = "Окугуч китептерди бетме-бет көрсөтөт. Китепканадан китепти ачыңыз; акыркы китеп башталышында кайра ачылышы мүмкүн («Акыркы китепти баштоодо ачуу» жөндөөсү).\n\nБеттерди буруу үчүн экрандын сол же оң жагын таптаңыз же бет баскычтарын колдонуңуз. Окуу менюсу үчүн ортосун таптаңыз же «Тандоо» басыңыз: «Мазмун», «Издөө», «Бетке өтүү», «Шрифт жана калыптоо», «Бетбелгилер жана белгилөөлөр» жана башкалар. Жогорку четинен ылдый сүрүү тез панелди ачат, ылдыйкы четинен өйдө сүрүү башкы экранга өтөт; «Артка» баскычын басып туруу да ошондой.\n\nСүрөттү толук экранда көрүү үчүн «Тандоо» баскычын (же сүрөттү) басып туруңуз: «Солго» жана «Оңго» беттеги сүрөттөр боюнча өтөт. «Тандоо» 2x, 3x жана артка чоңойтот (сенсорлордо эки жолу таптоо); чоңойтулганда «Солго» жана «Оңго» каптал тарапка жылдырат, бет баскычтары (же сүрүүлөр) туурасынан жана бийиктигинен өтөт. «Артка» ылайыкташууга, анан бетке кайтарат (сенсордо чыгуу үчүн басып туруңуз). Бетбелги үчүн жогорку оң бурчту таптаңыз. Белгилөө үчүн сөздү басып туруңуз. Баскычтар менен «Солго» баскычын басып туруңуз: «Солго» жана «Оңго» сөз боюнча, бет баскычтары сап боюнча жылдырат, аларды басып туруу беттин четтерине жана абзац боюнча өтөт; «Тандоо» сөз үчүн белгилөө тилкесин ачат, «Тандоо» баскычын басып туруу аны сүйлөмгө жана абзацка кеңейтет (анан «Солго» жана «Оңго» аягын жылдырат, аларды басып туруу башталышын). Тандоо беттерди бургандан кийин да улантылат. «Markdown катары экспорттоо» эскертүүлөрүңүздү сактайт."
