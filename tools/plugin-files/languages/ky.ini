smart-home.plugin.name = Акылдуу үй
smart-home.plugin.description = Өз Home Assistant'ыңыздагы маанилер жана которгучтар башкы тактада жана башкы экран виджеттери катары. Үй тармагыңыздагы Home Assistant менен иштейт.
smart-home.plugin.how = "«Акылдуу үй» өз Home Assistant'ыңыздагы маанилерди жана которгучтарды көрсөтөт: температура, нымдуулук, энергия, эшиктер жана терезелер, жарыктар, которгучтар жана сценалар. Ал серверибиз менен үй тармагыңызда анын REST API аркылуу сүйлөшөт; эч нерсе башка кызмат аркылуу өтпөйт.\n\n«Акылдуу үйдү» куралдар менюсунан ачып, анан «Туташуу»: Home Assistant дарегиңизди (мисалы http://homeassistant.local:8123) жана узак мөөнөттүү кирүү токенин териңиз (аны Home Assistant профиль бетинин ылдый жагында жасаңыз). Токен сырсөздөр жана ачкычтар арасында сакталат, жөндөөлөр файлында эч качан. Жөнөкөй http үй тармагыңыздагы даректер үчүн гана колдонулат; башка жердеги сервер үчүн жөндөөлөрдөн «Үй тармагынын сыртындагы серверлерди» күйгүзүп, жарактуу сертификаты бар https колдонуңуз.\n\n«Объекттерди тандоо» серверңизде бар нерселердин тизмесин ачат: ат же id боюнча издеп, объектти көрсөтүү үчүн тандаңыз (аны алып салуу үчүн кайра тандаңыз). Ага бөлмө берсеңиз болот, ал аны башкы тактада жана бөлмө виджеттеринде топтойт. 24 объектке чейин сакталат. Башкы тактада которуу үчүн жарыкты, которгучту же сценаны тандаңыз: сап серверден жоопту көрсөтөт. Тандаган сенсоруңуз кайра окулат.\n\nВиджеттер (башкы экранды басып туруп, анан виджет кошуңуз): «Акылдуу үй мааниси» бир көрсөткүчтү чоң көрсөтөт, «топ» бөлмөнүн объекттерин тизмелейт, «которгуч» бир жарык же которгуч үчүн баскыч, ал эми «бөлмө» бөлмөнүн көрсөткүчтөрү жана которгучтары бар карточка. Ар бир виджеттин жөндөөлөрү ал кайсы объектти же бөлмөнү көрсөтөрүн айтат.\n\nҮй башкы такта ачылганда, сиз сураганда («Жаңыртуу» сабы же маани же топ виджетин таптоо), окугуч Wi-Fi мурунтан иштеген жерде ойгонгондо жана заряддагыч сайылып турганда өзүңүз койгон график боюнча окулат. Ал радионы өзү эч качан күйгүзбөйт жана эч качан күйүк кармабайт."
