puzzles.plugin.name = Башкатырмалар
puzzles.plugin.description = Судоку, кроссворддор жана шахмат маселелери, оффлайн, күндүн башкатырмасы менен.
puzzles.plugin.how = "Поезд жана күтүү залы үчүн башкатырмалар, баары оффлайн: судоку, кроссворддор жана шахмат маселелери. «Башкатырмаларды» куралдар менюсунан ачыңыз же башкы экранга «Күндүн башкатырмасы» виджетин кошуңуз (башкы экранды басып туруп, анан виджет кошуңуз): ал бүгүнкү судоку канчалык чечилгенин көрсөтөт, ал эми таптоо аны ачат. Күндүн судокусу күн бою бирдей.\n\nСудоку: солго жана оңго курсорду уячама-уяча, өйдө жана төмөн (бет баскычтары) бир сапка жылдырат. «Тандоо» цифраларды ачат: бирин тандап, аны коюу үчүн дагы «Тандоо» басыңыз же уячаны бошотуу үчүн «Тазалоо». Тактанын астындагы баскычтарга жетүү үчүн «Тандоо» баскычын (же «Меню») басып туруңуз: «Белгилер» цифраларды карандаш белгилерине айландырат, «Текшерүү» туура эмес уячаларды белгилейт, «Артка» акыркы жылышты кайтарат, «Жаңы» сиз тандаган деңгээлдеги башкатырманы баштайт (Жеңил, Орточо, Кыйын). Ар бир башкатырманын так бир чечими бар. Оюн чыкканда сакталат. Сенсордук экранда уячаны таптаңыз.\n\nКроссворддор: .puz (Across Lite) же .ipuz файлдарын эс тутум картасындагы «puzzles» папкасына салыңыз; эч бири кошулган эмес. Торчо боюнча жылып, анан курсордун астындагы сөздү клавиатурада териңиз (асты сызык уячаны бош калтырат). Баскычтар туурасынан жана тигинен которот, суроолор тизмесин көрсөтөт, тамгаларды текшерет жана сөздү ачат. Тамгалар ар бир файл үчүн сакталат. Аралаштырылган .puz файлдарын ачуу мүмкүн эмес.\n\nШахмат маселелери: Lichess башкатырма базасынан чакан топтом (CC0). Солго жана оңго фигурадан фигурага секирет, жылдыргыңыз келген фигураны тандаңыз, анан бара ала турган жерлер аркылуу солго жана оңго, жана кайра тандаңыз. Туура эмес жылыш артка алынат. «Кеңеш» жылдыра турган фигураны белгилейт, «Кийинки» кийинки башкатырмага өтөт.\n\nТакта өзгөргөн уячаларды гана кайра чийет. «Статистика» чыгарган башкатырмаларыңызды эсептейт."
