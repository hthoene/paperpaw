picture-home.plugin.name = Сүрөттүү башкы экран
picture-home.plugin.description = Виджеттердин артында өз сүрөтүңүз бар башкы экран жана өзүңүз жөндөгөн абал тилкеси.
picture-home.plugin.how = "«Сүрөттүү башкы экран» күйүк турганда башкы экрандын ордун басат: виджеттердин артында өз сүрөтүңүз жана өзүңүз иреттеген виджеттер менен куралдардын беттери. Аны плагин башкаргычында өчүрсөңүз, орнотулган башкы экран өз беттери менен кайтат.\n\nСүрөттөрдү (JPEG, PNG же GIF) картадагы папкага (демейки боюнча wallpapers) салыңыз, анан Жөндөөлөр, Ыңгайлаштыруу, «Сүрөттүү башкы экран» бөлүмүнөн бирин тандаңыз. «Ылайыктоо» сүрөт экранды кантип толтурарын айтат (толтуруу, бүтүн сүрөт, чоюу, баштапкы өлчөм, плиткалоо), «Орду» кайсы бөлүгү калаарын, «Масштаб» канчалык чоң экенин, ал эми «Сүрөттү ачыктатуу» канчалык купкууну: купкуураак сүрөт виджеттерди окууну жеңилдетет. Сүрөт ар бир экран өлчөмү үчүн бир жолу даярдалат, бул бир аз убакыт алат.\n\nВиджеттер сүрөттүн үстүндөгү негиздерге отурат. Бетти орнотулган башкы экрандагыдай иреттеңиз: беттин астындагы калем же менюдагы «Башкы экранды түзөтүү».\n\nАбал тилкеси (убакыт, Wi-Fi, батарея же сиз тандаганыңыз) күйүк, өчүк же автоматтык болушу мүмкүн, жогоруда же ылдыйда, толук туурасында же солдо, ортодо же оңдо кичине капсула катары, ачык, кара же боз негизде же сүрөттүн өзүндө. Баскычтарды атаган сап (X4'те) да күйүк, өчүк же автоматтык болушу мүмкүн. Автоматтык баскычты басуу аларды бир нече секундага көрсөтөт дегенди билдирет; ал басуу башка эч нерсе кылбайт.\n\n«Сүрөттү чийүү» сүрөт кантип чийилерин айтат: «Боз деңгээлдер» экрандагы бардык боз түстөрдө (X4'те жайыраак), «Растрланган» кара-ак чекиттерде (тез) же «Автоматтык», орнотулган башкы экрандай: экран чийилгенде боз деңгээлдер, биринчи өзгөрүүдөн кийин чекиттер. Экранда боз деңгээлдер жок жерде боз деңгээлдер чекиттерге өтөт."
