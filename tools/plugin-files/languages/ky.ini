help.again-done = Ар бир экран кийинки ачылганда кеңештер кайра көрсөтүлөт.
home.plugin.name = Башкы экран
home.plugin.description = Баштапкы бет: виджеттердин беттери, мисалы окулуп жаткан китеп жана куралдар.
home.plugin.how = "Башкы экран беттерден турат, ар бири телефондогудай виджеттердин жана куралдардын торчосу. Адегенде саат, окуп жаткан китебиңиз жана акыркы окулган китептер бир бетте, ал эми бардык куралдар кийинки бетте.\n\nЭлементти ачуу үчүн таптаңыз, беттерди өзгөртүү үчүн сүрүңүз же бет баскычтарын колдонуңуз. Баскычтар менен гана жебе баскычтары бир элементтен кийинкисине жылдырат, ал эми «Тандоо» аны ачат.\n\nАны кайра иретке келтирүү үчүн башкы экранды басып туруңуз, беттин астындагы калемди таптаңыз же менюдан «Башкы экранды түзөтүү» тандаңыз. Элементтерди жылдыруу үчүн сүйрөңүз же параметрлери үчүн бирин таптаңыз, баскычтар менен да. «Виджет кошуу» да ошол жерде. «Мамычалар» жана «Саптар» жөндөөлөрдө, «Көрүнүш» астындагы «Башкы экран» бөлүмүндө.\n\nЖатык бурулган экранда башкы экран ошол эле элементтерди көбүрөөк мамыча менен көрсөтөт, ар бир бет кийинкиден мурун толтурулат, ал эми карточкалар болжол менен 110 мм ден кененирээк болбойт; тик абалда иреттегениңиздин баары өзгөрбөйт. Аны жатык абалда иреттесеңиз, ошол калып ошол багыт үчүн өзүнчө сакталат: жаңы виджеттер экөөнө тең кошулат. «Кошуу» ичиндеги «Жатык калыпты баштапкы абалга келтирүү» (түзөтүү учурунда) чыгарылган калыпка кайтат. Бир багытта виджетти же курал алып салуу аны экинчисинен алып салбайт."
