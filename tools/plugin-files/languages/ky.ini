about.plugin.name = Тууралуу
about.plugin.description = PaperPaw версиясы жана лицензиялары.
about.plugin.how = "«Тууралуу» бөлүмү PaperPaw'дын кайсы версиясы бар экенин, баштапкы коду кайда экенин жана кандай лицензиялар менен таркатыларын көрсөтөт.\n\nАны Жөндөөлөрдүн аягынан «PaperPaw тууралуу» катары табасыз. Сапты жебе баскычтары менен тандап, «Тандоо» басыңыз же аны таптаңыз. Микропрограммага орнотулган плагиндер жана код менен плагин жүктөгөн түзмөктөрдө мындай плагиндер курулушу керек болгон манжа изи да ошол жерде көрсөтүлөт.\n\n«Лицензиялар» окугучта текст катары ачылат, ошондуктан аны китептей барактайсыз. Анда PaperPaw'дын өз лицензиясы жана аны менен келген шрифттердин, иконалардын жана сөз ташуу үлгүлөрүнүн лицензиялары бар. Плагиндер өз сапын кошо алат, мисалы теманын автору."
