widgets.plugin.description = Башкы экран үчүн дагы көп виджеттер: сааттар, күнтизме, цитаталар, китептер, эскертүүлөр жана башкалар.
widgets.plugin.how = "Виджеттер топтому башкы экранга көп виджет кошот: сааттар (жебелүү, сөз саат, плиткалар, дүйнөлүк), күнтизме, жылдын өткөнү, артка эсептөө, айдын фазасы, күн жана дата; күндүн цитатасы, эскертүүлөр, иштер, сүрөттөр, саламдашуу жана PaperPaw логотиби; китептер үчүн: азыр окулуп жаткан, прогресс, кезектеги, серия, тандалмалар, белгилөө жана сандардагы китепкана. Батарея виджети да бар.\n\nАларды менюдагы «Башкы экранды түзөтүү» аркылуу (же башкы экранды басып туруп), анан «Виджет кошуу» менен кошуңуз. Ар биринин өз жөндөөлөрү бар, мисалы, алкак, өлчөм жана тегиздөө. Алмашып туруучу виджетти, мисалы, күндүн цитатасын тандасаңыз, кийинкиси көрсөтүлөт. Өз цитаталарыңызды картадагы .paperpaw/plugins/widgets ичиндеги quotes.txt файлына жазыңыз, ар бир сап текст | автор түрүндө. Убакыт виджеттери үчүн саат коюлушу керек; аны Wi-Fi коёт."
