bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Пульттарды, клавиатураларды жана сенсорлорду жупташтырып, туташтырат.
bluetooth.plugin.how = "Bluetooth пульттарды, клавиатураларды жана сенсорлорду окугуч менен жупташтырат, ал жерде Bluetooth бар болсо (X4 Pro).\n\n«Түзмөк кошуу» жакында турганды издейт; адегенде түзмөктү жупташтыруу режимине коюңуз. Аны тандап, окугучта ырастаңыз (сан көрүнгөн жерде аны салыштырыңыз). Пульттун же клавиатуранын баскычтары андан кийин беттерди бурат жана менюларда жылдырат; ар бир баскыч эмне кылаарын «Башкаруу» бөлүмүндө өзгөртүңүз.\n\n«Пульттар» алардын баскычтары качан иштээрин айтат: бул жерде күйгүзүлгөндө, окуп жатканда (китеп ачык болгондо гана туташат, батареяны үнөмдөйт) же дайыма. Меню баскычы же түзмөктү узак басуу аны унутат.\n\nСенсор плагиндер үчүн: кайсы плагин аны колдоно аларын күйгүзүңүз. Эч ким колдонбогондо Bluetooth өчүк болот."
