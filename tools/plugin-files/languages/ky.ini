core.host-ui.text-full = Текст өтө узун. Аны кыскартып, кайра аракет кылыңыз. Эч нерсе кесилген жок.
core.host-ui.clipboard-full = Текст алмашуу буфери үчүн өтө узун. Кыскараак бөлүктү көчүрүңүз. Буферден мурунку текст өзгөрүүсүз калды.
core.host-ui.clipboard-card = Алмашуу буферин окуу же жазуу мүмкүн эмес. Эс тутум картасы салынганын жана окулаарын текшериңиз.
core.host-ui.card-full = Эс тутум картасы толду. Бир аз орун бошотуп, кайра аракет кылыңыз.
core.host-ui.card-error = Текстти эс тутум картасынан окуу же ага сактоо мүмкүн болгон жок. Картаны текшерип, кайра аракет кылыңыз.
core.host-permission.library = Бүт китепканаңызды, окуу орундарын, ошондой эле бардык плагиндердин белгилөөлөрүн жана эскертүлөрүн окуй алат жана аларды өзгөртө алат.
core.host-library.import-failed = Китепти китепканага кошуу мүмкүн болгон жок. Эс тутум картасын текшерип, кайра аракет кылыңыз.
