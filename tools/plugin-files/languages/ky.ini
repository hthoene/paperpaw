store.plugin.name = Плагин дүкөнү
store.plugin.description = Бул түзмөк үчүн плагиндерди табат, орнотот, жаңыртат жана алып салат.
store.plugin.how = "«Плагин дүкөнү» бул түзмөк үчүн плагиндерди интернеттен табат жана аларды орнотот, жаңыртат жана алып салат. Аны Куралдардан ачыңыз; ага Wi-Fi керек.\n\nБашталышы китепкана эмнени сунуштаарын, азыр эмне жаңы же популярдуу экенин, анан топтордун тизмесин көрсөтөт. Топ өз плагиндерин күн сайын өзгөрүүчү адилет аралашмада тизмелейт, ошентип ар бир плагин көрүнөт; аларды А-дан Я-га чейин, эң жаңылары же акыркы жаңыртуу боюнча иреттеңиз жана узун тизмелерде тамгага өтүңүз. Анын бетин көрүү үчүн бирин ачыңыз, өлчөмү жана ал ээлеген эс тутуму менен, анан «Орнотуу», «Жаңыртуу» же «Алып салуу» тандаңыз. «Баарын жаңыртуу» орнотулган ар бир плагинди жаңылайт.\n\nКоддуу плагиндер түзмөккө толук кирүү менен иштейт: дүкөн муну айтат жана адегенде сурайт, алар кайра иштеткенден кийин башталат. Бири бузулса, PaperPaw коддуу плагиндерсиз башталат жана кайсынысы экенин айтат. «Плагин китепканасы» тизме кайдан келерин коёт.\n\nЖөндөөлөр, Система бөлүмүндөгү «Жамааттын плагиндери» башкалар GitHub'та жарыялаган плагиндерди да тизмелейт. Аларды эч ким карап чыккан жок: алар «Текшерилбеген» деп белгиленет, коддуу плагиндин бети ал кол койгон ачкычты көрсөтөт жана башка ачкыч менен кол коюлган жаңыртуу орнотулбайт.\n\n«Булактар», башталыштын акыркы сабы, башкалардын плагин тизмелерин алардын дареги боюнча кошот (https://…/plugins.json), алардын бирин PaperPaw'дыкынын ордуна тизмелейт же аны алып салат. Терүүнүн ордуна ар бир сапка бир дарек менен sources.txt файлын картадагы .paperpaw/plugins/store ичине салыңыз: даректер «Булактар» астында жаңы катары көрүнөт. PaperPaw булакты же анын плагиндерин текшербейт, ал эми түзмөк булактын серверине кайрылат. Булак өз тизмесине кол коёт; түзмөк окуган биринчи тизменин ачкычын сактайт жана андан кийин ошол ачкыч менен кол коюлган тизмелерди жана коддуу плагиндерди гана кабыл алат. Плагин жаңыртууларын орнотулган булагынан гана алат. PaperPaw'дын өз китепканасы ар дайым бар жана алып салынбайт; дүкөндөн чыгуу ага кайтарат."
