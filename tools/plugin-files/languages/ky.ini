plugin-manager.plugin.name = Плагин башкаргычы
plugin-manager.plugin.description = Плагиндерди тизмелеп, аларды күйгүзөт жана өчүрөт.
plugin-manager.plugin.how = "Плагин башкаргычы ар бир плагинди анын версиясы жана сүрөттөмөсү менен тизмелейт жана плагиндерди күйгүзөт же өчүрөт.\n\nАны Жөндөөлөрдөн «Плагиндерди башкаруу» катары табыңыз. «Плагин жөндөөлөрү» ар бир плагиндин тармак колдонушу сыяктуу тандоолор үчүн өзүнчө бет. Плагинди күйгүзүү же өчүрүү үчүн таптаңыз (баскычтар менен аны тандаңыз). Өзгөртүү кайра иштеткенден кийин колдонулат: ылдыйкы тилке андан кийин «Азыр кайра иштетүүнү» сунуштайт. Анын кантип иштээрин окуу үчүн плагинди басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз).\n\n«Дайыма күйүк» деп белгиленген плагинди өчүрүү мүмкүн эмес, ал эми «Керек» деп белгиленгенди башка плагин өз ишин аткарганда гана, болбосо PaperPaw'дын артка жолу болбойт. «Экрандар» бөлүмүндө бир нече плагин сунуштаган орунду кайсы плагин көрсөтөрүн тандайсыз."
