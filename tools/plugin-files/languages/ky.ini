format-cbz.plugin.name = Комикстер
format-cbz.plugin.description = Комикс архивдерин (.cbz) ачат, бир сүрөт бир бет.
format-cbz.plugin.how = "Комикс архивдерин (.cbz) ачат: бир сүрөт бир бет, экранга ылайыкталган, алардын аттарынын тартибинде (2 10дон мурун).\n\nАларды китепкана папкасына салып, китепканадан ачыңыз; беттерди башка китептердегидей буруңуз. Чоң сүрөттөр биринчи жолу бир аз убакыт алат, X4'те башкаларга караганда көбүрөөк.\n\nОкуу жөндөөлөрү (Жөндөөлөр, Окуу): «Панелме-панель» беттин бир панелин өз кезегинде, экран уруксат бергенче чоң кылып көрсөтөт, беттерди буруу аларды ээрчийт; панелсиз бет бүтүндөй көрсөтүлөт. «Комикс беттери жүрөт» беттерди буруу манга үчүн (оңдон солго) күзгүлөнөт; китептин өз ComicInfo.xml файлы муну өзү айтат. Китепкана китептин аталышын жана ComicInfo.xml'ден сериясын жана номерин көрсөтөт."
format-cbz.title = Комикс (CBZ)
format-cbz.setting.direction = Комикс беттери жүрөт
format-cbz.setting.direction.help = Манга: беттерди буруу күзгүлөнөт.
format-cbz.direction.book = Китептеги сыяктуу
format-cbz.direction.ltr = Солдон оңго
format-cbz.direction.rtl = Оңдон солго
format-cbz.setting.panels = Панелме-панель
format-cbz.setting.panels.help = Бир убакта бир панель, беттерди буруу аларды ээрчийт.
format-docx.plugin.name = DOCX документтери
format-docx.plugin.description = Word жана башка программалар сактагандай .docx файлдарын ачат.
format-docx.plugin.how = "DOCX документтерин китеп катары ачат: мазмуну бар аталыштар, тизмелер, таблицалар, калың жана курсив, шилтемелер жана сүрөттөр (JPEG, PNG, GIF).\n\nФайлдарды китепкана папкасына салып, китепканадан ачыңыз. Аталышы жана автору документтин касиеттеринен алынат. Сноскалар, үстүнкү жана астыңкы колонтитулдар жана комментарийлер көрсөтүлбөйт."
format-docx.title = DOCX документи
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB китептерин стилдери, мазмуну жана сүрөттөрү менен ачат.
format-epub.plugin.how = "EPUB китептери китепканадан башка китептердей ачылат, мазмуну, сүрөттөрү жана басмакананын стили менен. Веб беттер (HTML), Markdown, FictionBook (.fb2) жана комикс архивдери (.cbz) ушундай эле ачылат, ар бири өзүнчө плагин катары.\n\nБөлүм биринчи ачканыңызда өзгөртүлүп, плагиндин кэшинде сакталат, ошондуктан андан кийин тезирээк жана чоң китептер чакан түзмөктөрдө иштейт. Мазмунду окуу менюсундагы «Мазмун» астынан табыңыз. Китептин өз стили колдонулабы, бул «Окуу» астындагы «Басмакананын форматтоосу» жөндөөсү."
format-epub.title = EPUB электрондук китеби
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook китептерин (.fb2, архивделгенин да) ачат.
format-fb2.plugin.how = "Орус жана башка китептер үчүн кеңири таралган FictionBook китептерин (.fb2), архивделгенин да (.fb2.zip), аталышы, авторлору, мукабасы жана бөлүмдөрү менен ачат.\n\nАларды китепкана папкасына салыңыз; алар китепканада көрүнүп, башка китептердей ачылат."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Файл катары сакталган веб беттерди ачат, окула турганды гана көрсөтөт.
format-html.plugin.how = "Файл катары сакталган веб беттерди (.html, .htm, .xhtml) китеп катары ачат: окула турган нерсе гана, анын тегерегиндеги менюларсыз, жарнамасыз жана ушул сыяктуусуз.\n\nФайлды китепкана папкасына салып, китепканадан башка китептей ачыңыз. Беттин ичиндеги шилтемелер иштейт; сүрөттөр файлда кайда болсо ошол жерде көрүнөт."
format-html.title = Веб бет (HTML)
format-images.plugin.name = Сүрөттөр
format-images.plugin.description = Сүрөттөрдү (.jpg, .png, .gif) китеп катары ачат, ар бири бир бет.
format-images.plugin.how = "Сүрөттөр (.jpg, .png, .gif) китепканадан китептей ачылат, бир сүрөт бир бет, экранга ылайыкталган.\n\nСүрөттөрдүн бүтүн папкасын окуу үчүн анын биринчи сүрөтүн ачыңыз: папкадагы андан кийинки сүрөттөр аттарынын тартибинде улантылат (2 10дон мурун). Папканын кийинки жериндеги сүрөт ошол жерден башталат; ар биринде орун өзүнчө эсте калат. 300гө чейин сүрөттөн турган папка сиз ачкан сүрөттөн баштап окулат.\n\nСүрөт эмес же өтө чоң файл анын ордуна өз атын көрсөтөт. Өз аталышы бар көп сүрөттүү китеп үчүн комикс архиви (.cbz) жакшыраак форма."
format-images.title = Сүрөт
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown файлдарын (.md), мис. эскертүлөрдү ачат.
format-markdown.plugin.how = "Markdown файлдарын (.md), мисалы эскертүлөрдү, китеп катары ачат: аталыштар, тизмелер, цитаталар жана белгилер белги катары эмес, ойлонулгандай көрсөтүлөт.\n\nФайлдарды китепкана папкасына салып, китепканадан ачыңыз. Биринчи аталыш анын аталышы; файлдын жанындагы сүрөттөр текст аларды атаган жерде көрүнөт."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI китептери
format-mobi.plugin.description = DRMсиз .mobi жана .azw файлдарын ачат.
format-mobi.plugin.how = "MOBI китептери (.mobi, .azw) китепканадан башка китептей ачылат, эч нерсе жөндөөнүн кереги жок. Аталышы, авторлору, тили жана мукабасы китептен алынат, мазмун тизмеси анын аталыштарынан түзүлөт.\n\nКитеп биринчи ачканыңызда өзгөртүлөт, узун китепке бир нече секунд кетет; андан кийин ал дароо ачылат. Текст, аталыштар, калың жана курсив, шилтемелер жана сүрөттөр көрсөтүлөт.\n\nDRM бар китептерди (дүкөндөн сатып алынган көпчүлүк китептер), Huffman кысуусу бар же жаңыраак KF8 формасындагы (.azw3) китептерди ачуу мүмкүн эмес: PaperPaw аларды ачканыңызда муну айтат. Calibre сыяктуу курал менен жасалган EPUB көчүрмөсү ар дайым ачылат."
format-mobi.title = MOBI китептери
format-rtf.plugin.name = RTF документтери
format-rtf.plugin.description = .rtf файлдарын китеп катары ачат.
format-rtf.title = RTF документтери
format-txt.plugin.name = Жөнөкөй текст
format-txt.plugin.description = Жөнөкөй текст файлдарын (.txt) ачат.
format-txt.plugin.how = "Жөнөкөй текст файлдары (.txt) китепканадан башка китептей ачылат, эч нерсе жөндөөнүн кереги жок. Плагин UTF-8, UTF-16 жана Windows-1252 текстин окуйт жана коддоону өзү табат.\n\nАбзацтар файлдагы бош саптарды ээрчийт; файлда алар жок болсо, ар бир сап абзац болот. Project Gutenberg файлдарында башындагы жана аягындагы лицензия тексти калтырылат, ал эми аталышы менен автору баш сабынан алынат.\n\nФайл эч качан толугу менен жүктөлбөйт, ошондуктан абдан чоң тексттер чакан түзмөктөрдө да ачылат."
format-txt.title = Жөнөкөй текст
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC жана XTCH китептерин, Xteink окугучтарынын алдын ала даярдалган беттерин ачат.
format-xtc.plugin.how = "XTC жана XTCH файлдары беттери сүрөт катары мурунтан даярдалган китептер, Xteink окугучтары үчүн конвертерлер жасагандай. Алар китепканадан башка китептей ачылат.\n\nАр бир бет туруктуу сүрөт болгондуктан, текстин өлчөмүн өзгөртүүгө же башка шрифт менен коюуга болбойт. Беттер кара-ак же төрт боз түстө. Ар бир бет көрсөтүлгөндө декоддолот, ошондуктан эс тутум аз керек, X4'те да.\n\nАталышы, автору жана бөлүмдөрү файлда болсо, андан алынат."
format-xtc.title = XTC беттери
help.plugin.name = Кеңештер
help.plugin.description = Экран биринчи ачылганда анын башкаруу элементтери эмне кылаарын көрсөтөт.
help.plugin.how = "Экран биринчи ачылганда анын үстүндө кыска эскертме анын башкаруу элементтери эмне кылаарын айтат: таптоо өткөн экрандын бөлүктөрү алкакта жана баскычтар эмне кылаары.\n\nТаптоо же каалаган баскыч эскертмени жабат, ал бул экран үчүн кайра келбейт. «Кеңеш көрсөтпөө» алардын баарын өчүрөт.\n\nЖөндөөлөрдөн «Система» астындагы «Кеңештер» аларды күйгүзөт же өчүрөт, ал эми «Кеңештерди кайра көрсөтүү» ар бир экрандын эскертмесин дагы бир жолу көрсөттүрөт."
help.title = Бул жерде кантип иштейт
help.got-it = Түшүнүктүү
help.no-more = Кеңеш көрсөтпөө
help.section = Кеңештер
help.setting.show = Кеңештер
help.setting.show.help = Экран биринчи ачылганда кыска эскертме анын башкаруу элементтери эмне кылаарын айтат.
help.setting.again = Кеңештерди кайра көрсөтүү
