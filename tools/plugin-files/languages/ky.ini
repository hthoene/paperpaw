weather.plugin.name = Аба ырайы
weather.plugin.description = Азыркы жана кийинки күндөрдүн аба ырайы виджет катары, Open-Meteo'дон.
weather.plugin.how = "«Аба ырайы» азыркы жана кийинки күндөрдүн аба ырайын башкы экран үчүн виджеттер катары Open-Meteo'дон көрсөтөт, ага эсеп да, ачкыч да керек эмес. «Азыркы аба ырайы» температураны, абалды жана тандоого дагы башка маалыматтарды көрсөтөт; «Болжол» кийинки күндөрдү катар же тизме катары көрсөтөт.\n\nАдегенде жерди тандаңыз: жөндөөлөрдө, «Аба ырайы» астында, «Жер» (атын териңиз, анан табылган жерлерден тандаңыз). Анын координаттары гана жөнөтүлөт, анда да аба ырайы виджети көрсөтүлүп турганда гана. Виджеттерди башкы экранды түзөтүү аркылуу кошуңуз.\n\nАба ырайы «Жаңыртуу жыштыгы (эң көп)» көрсөткөндөн тез-тез алынбайт жана тармак бар болгондо гана алынат: ал Wi-Fi'ды эч качан өзү күйгүзбөйт.\n\nАба ырайы маалыматтары Open-Meteo.com (https://open-meteo.com) тарабынан, Creative Commons Attribution 4.0 (CC BY 4.0) лицензиясы боюнча."
