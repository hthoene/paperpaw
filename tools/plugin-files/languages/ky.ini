wifi.plugin.name = Wi-Fi
wifi.plugin.description = Керек болгондо Wi-Fi тармактарына туташат жана андан кийин радиону өчүрөт.
wifi.plugin.how = "Wi-Fi плагинге интернет керек болгондо (каталог, шайкештирүү, дүкөн, өткөрүү) тармакка туташат жана радиону эч нерсе колдонбой калгандан бир мүнөт өткөндө, же Башкы экран же китеп ачылганда дароо кайра өчүрөт: ушинтип батарея жана эс тутум үнөмдөлөт.\n\nWi-Fi'ды Жөндөөлөрдөн же абал сабындагы Wi-Fi пунктунан ачыңыз. «Тармактар» жакын жердегилерди көрсөтөт; бирөөнү тандап, анын сырсөзүн териңиз, же «Телефон менен жөндөө» тандап, атын жана сырсөзүн түзмөктө эмес, телефонуңуздун браузеринде териңиз. «Унутуу» сакталган тармакты алып салат.\n\nСырсөздөр картада коопсуз сакталат жана эч качан кайра көрсөтүлбөйт. «Керек болгондо туташуу» бөлүмүндө Wi-Fi акыркы колдонуудан кийин канча убакыт күйүк турарын, заряддалып жатканда күйүк турарын жана бир нечеси жакын болгондо кайсы сакталган тармак биринчи болорун коёсуз."
