files.plugin.name = Файл серепчиси
files.plugin.description = Түзмөктөгү китептерди жана папкаларды тизмелеп, аларды ачат.
files.plugin.how = "Китепкана китепкана папкаңыздагы китептерди тизмелейт, ар биринин мукабасы, аталышы, автору жана канчалык окулганы менен. Акыркы окуган китебиңиз жогорунда карточка катары турат, ошондуктан окууну улантуу бир таптоо же «Тандоо» баскычын бир басуу. Китепкана китептерди издеп жатканда, азырынча канчасын тапканын айтат.\n\nКитептердин үстүндө эмне көрсөтүлөрүн тандаңыз: бардыгы, окуп жаткандарыңыз, окула элек же окулган китептер же текчелер (автор, серия, тег, тандалмалар, баштаган ар бир сериянын кийинки китеби боюнча). Китепти окуу үчүн таптаңыз; аны ачуу, окулду же окула элек деп белгилөө, маалыматын көрүү, архивге жылдыруу же өчүрүү үчүн басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз). Китепкана менюсу үчүн аталышты таптаңыз: китептер кантип иреттелет жана көрсөтүлөт, издөө, китепкана папкасы жана жөндөөлөр.\n\nКитепкана папкасы Жөндөөлөрдөн «Китепкана» астындагы «Китепкана папкасы» аркылуу коюлат; ошол жерде китептерди мукабалар торчосу катары да көрсөтсөңүз болот. Башка бардык файлдар үчүн Куралдар менюсундагы «Файлдарды» колдонуңуз."
