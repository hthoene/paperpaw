koreader.plugin.name = Белгилөөлөрдү бөлүшүү
koreader.plugin.description = Экөөндө тең окулган китептер үчүн бетбелгилерди жана белгилөөлөрдү KOReader менен бөлүшөт.
koreader.plugin.how = "Бул плагин экөөндө тең окуган китептериңиз үчүн бетбелгилерди жана белгилөөлөрдү KOReader менен бөлүшөт, бир түзмөктө же түзмөктөр ортосунда шайкештирилген китепкана папкасында. Жөндөөнүн кереги жок.\n\nPaperPaw KOReader да ачкан китепти ачканда жана анын бетбелгилерин же белгилөөлөрүн өзгөрткөндө, ал китептин жанындагы KOReader маалыматынан жаңысын алат жана бул жердеги жаңысын KOReader китепти кийинки ирет ачканда алышы үчүн калтырат. Алынган белгилер жана өзгөртүлгөн эскертүлөр да өтөт.\n\nБул EPUB китептери үчүн гана иштейт. Бир тараптын файлын окуу мүмкүн болбосо, ал мүмкүн болгонго чейин эки тарапта тең эч нерсе өзгөрбөйт."
koreader.removed-there = KOReader файлында белгилөөлөр мындан ары жок. Аларды бул жерден да алып салабызбы?
koreader.removed-there.text = Алар KOReader'де алынып салынган болушу мүмкүн, же анын файлы башка түзмөктөн келген. «Калтыруу» аларды бул жерде калтырып, KOReader'ге кайра берет.
