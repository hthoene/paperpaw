rules.plugin.name = Эрежелер
rules.plugin.description = Бир нерсе болгондо, бир нерсе кылат: мис. саат 22:00дө түнкү режим.
rules.plugin.how = "Эреже бир нерсе болгондо өзү бир нерсе кылат: күн сайын саат 22:00дө түнкү режим күйөт же PaperPaw башталганда каталогдор шайкештирилет.\n\nЭрежелер Жөндөөлөрдөн «Ыңгайлаштыруу» астындагы «Эрежелер» бөлүмүндө. «Эреже кошуу» «Качан?» (PaperPaw башталганда, күндүн убактысы, китеп ачылганда же жабылганда, батарея, заряддоо, которгуч жана башкалар) жана «Анан эмне?» (аракетти аткаруу, которгучту күйгүзүү же өчүрүү, сан коюу, билдирүү көрсөтүү) деп сурайт. Эрежени тындыруу үчүн таптаңыз; «Эки убакыттын ортосунда» сыяктуу шарт үчүн же аны алып салуу үчүн басып туруңуз (баскычтар менен «Тандоо» баскычын басып туруңуз).\n\nТандалуучу аракеттер, которгучтар жана сандар плагин боюнча келет: плагинди тандаңыз, анан ал эмнени алып келерин; «Артка» андан кайра чыгарат. «Артка» же «Кийинки бет» сыяктуу көрсөтүлгөн экранда иштеген аракет ошол жерде басылса эмне кылса, ошону кылат.\n\nУбакыттар кайсы экран ачык болбосун колдонулат. Бири-бирин кайра бузган эки эреже бир нече кадамдан кийин токтойт."
