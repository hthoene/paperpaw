pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Иш жана эс алуу турлары, виджеттер жана күндүк эсептегич менен көңүл топтоо таймери.
pomodoro.plugin.how = "Pomodoro таймери: көңүл топтолгон турларда иштеңиз, анан эс алыңыз. Жөндөөнүн кереги жок: 25 мүнөт көңүл топтоо, 5 эс алуу, ал эми төрт турдан кийин 15 мүнөттүк узак тыныгуу.\n\n«Pomodoro» куралдар менюсунан ачып, «Баштоо» басыңыз же анын виджеттерин башкы экранга кошуңуз (башкы экранды басып туруп, анан виджет кошуңуз): «Pomodoro таймери» фазаны жана калган мүнөттөрдү көрсөтөт, «Pomodoro баштоо/тындыруу» баскыч, ал эми «Бүгүнкү Pomodoro» аяктаган турларыңызды күндүк максатыңыз менен эсептейт. Таймерди таптасаңыз ал башталат же токтойт; толук экранды ачуу үчүн аны басып туруңуз.\n\nЭкрандан чыксаңыз да таймер иштей берет жана кайра иштеткенден кийин саат боюнча улантылат. Окугуч уктап жатканда эч нерсе иштебейт: ал ортодо аяктаган фаза ойгонгондо айтылат. Фаза аяктаганда эскертүү айтат. Батареяны үнөмдөө үчүн саат мүнөтүнө бир жолу жаңырат (толук экранда акыркы мүнөттө он секунд сайын) жана окугучту эч качан ойгоо кармабайт.\n\nЖөндөөлөрдөгү «Pomodoro» бөлүмүндө узактыктарды жана топтомдогу турларды, ошондой эле кийинки фаза өзү башталабы, коёсуз. «Дагы» бөлүмүндө: фаза аяктаганда экрандын жаркылдашы же жарыктын жымыңдашы жана күндүк максат."
