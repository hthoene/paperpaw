notes-vault.plugin.name = Эскертүүлөр сактагычы
notes-vault.plugin.description = Markdown эскертүүлөрүнүн папкасын папкалар, тегдер жана акыркы өзгөртүүлөр боюнча окуйт, башкы экран үчүн виджеттер менен. Obsidian сактагычтары менен иштейт.
notes-vault.plugin.how = "«Эскертүүлөр сактагычы» Markdown эскертүүлөрүнүн папкасын окуйт (жөнөкөй .md файлдары, эскертүү колдонмолору сактагандай). Ал Obsidian сактагычтары менен иштейт.\n\nСактагычтын папкасын жөндөөлөрдөн же куралдардагы сактагыч бетинен тандаңыз. Бет андан кийин папкаларды картада турганындай, акыркы өзгөргөн эскертүүлөрдү, тегдерди жана эскертүүлөрдүн аталыштарынан издөөнү сунуштайт.\n\nБиринчи жолу сактагыч анын бети ачык турганда фондо индекстелет; миңдеген эскертүүсү бар сактагыч бир нече мүнөт алат, андан кийин дароо ачылат. Индекс картада сакталат жана сактагычтын бети бир нече сааттан кийин ачылганда же «Жаңыртуу» тандаганда кайра жасалат.\n\nЭскертүү окугучта ачылат. Башка эскертүүлөргө шилтемелер ([[Note]], [[Note|words]], [[Note#Heading]]) эскертүүнүн аты боюнча сактагычтын каалаган жеринен табылат; бирин ээрчисе, ал эскертүү ачылат, ал эми «Артка» мурунку эскертүүгө кайтарат.\n\nСактагычта эч нерсе эч качан өзгөрбөйт. Башкы экран үчүн виджеттер (акыркы эскертүүлөр, кадалган эскертүү, күндүн эскертүүсү, кокус эскертүү, тегдер, издөө) башкы экрандын редакторунда кошулат. Виджет эскертүүлөрүн бир эле папкадан ала алат: виджеттин жөндөөлөрүнө папканын жолун картанын тамырынан жазыңыз (мисалы Notes/Work); бош калтырсаңыз, ал сактагычтын бардык эскертүүлөрүн алат."
