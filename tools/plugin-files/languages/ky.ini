stats.plugin.description = Канча убакыт жана канча окугуңузду жазат, күнтизме жана ар бир китептин сандары менен.
stats.plugin.how = "«Окуу статистикасы» ар бир бетти канча убакыт окуганыңызды жазат. Аны бүгүн, жума жана үзгүлтүксүз күндөрүңүз менен сереп, күнтизме катары жана ар бир китептин сандары менен көрөсүз.\n\nАны Куралдардан же окугучтагы «Дагы» бөлүмүнөн ачыңыз. Жөндөөлөрдөн «Окуу статистикасы» астында «Окууну жазууну» өчүрүп, «Күндүк максатты» коюп, эсепке алынуучу «Эң кыска бетти» жана «Эң узак бетти» коё аласыз, ошондуктан барактап чыгуу же ачык калган китеп сандарды бурмалабайт.\n\n«KOReader менен шайкештирүү» статистиканы KOReader менен WebDAV папкасы аркылуу бөлүшөт. Ал ошондой эле ошол эле түзмөктөгү KOReader статистикасын кабыл алат. Жазуу үчүн саат коюлган болушу керек: ал коюлбаган жерде Wi-Fi'га бир жолу туташыңыз."
