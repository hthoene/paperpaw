anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Компьютериңиздеги Anki'нин мөөнөтү келген карточкаларын үйрөнөт жана жоопторуңузду кайра жөнөтөт, AnkiConnect кошумчасы аркылуу.
anki.plugin.how = "Anki компьютериңиздеги Anki'де мөөнөтү келген карточкаларды окугучта үйрөнүүгө жана жоопторуңузду кайра жөнөтүүгө мүмкүндүк берет. Ал AnkiConnect акысыз кошумчасын (кошумча коду 2055492159) колдонот жана AnkiWeb'ди эч качан колдонбойт. Ал адегенде өчүк: аны плагиндер дүкөнүнөн кошуңуз.\n\nКомпьютерде: Anki'ге AnkiConnect'ти орнотуңуз (Tools, Add-ons, Get Add-ons) жана Anki'ди кайра иштетиңиз. Шайкештирүүдө Anki ачык болушу керек.\n\nАдатта AnkiConnect өзү иштеген компьютерге гана жооп берет (127.0.0.1), ошондуктан окугуч ага жете албайт. Tools, Add-ons, AnkiConnect, Config бөлүмүн ачып, «webBindAddress» маанисин «0.0.0.0» кылыңыз (үй тармагында угуу). Порт, «webBindPort», сиз өзгөртпөсөңүз 8765. Ал жерде «apiKey» койсоңуз, ошол эле ачкычты бул жерге киргизиңиз. Конфигурацияны өзгөрткөндөн кийин Anki'ди кайра иштетиңиз жана сураса, компьютердин брандмауэринде Anki'ге уруксат бериңиз. Муну ишенген тармагыңызда гана колдонуңуз: андагы каалаган адам AnkiConnect'ке жете алат, ошондуктан ачкыч пайдалуу.\n\nОкугучта: Куралдардан Anki'ни ачып, «Компьютер» бөлүмүнө компьютердин дарегин (мисалы 192.168.1.20), порт 8765 болбосо портту жана ачкыч койсоңуз API ачкычын киргизиңиз. Топтомду тандаңыз же бардык топтомдор үчүн бош калтырыңыз. Анан Wi-Fi күйүк болгондо «Anki менен шайкештирүү» тандаңыз: адегенде күтүп турган жооптор жөнөтүлөт, андан кийин мөөнөтү келген карточкалар (жана сиз койгон санда жаңы карточкалар) алынат, эң көп дегенде 50. Аларды тармаксыз өтүү үчүн «Үйрөнүү» тандаңыз: жоопту көрсөтүп, «Кайра», «Кыйын», «Жакшы» же «Оңой» деп баалаңыз. Жоопторуңуз окугучта, Wi-Fi жок да сакталат жана кийинки шайкештирүүдө Anki'ге барат. Карточка качан кайра келерин Anki чечет: «Кайра» деп жооп берилген карточка Anki аны мөөнөтү келди деп билдиргенден кийин кийинки шайкештирүүдө кайра алынат.\n\nЖөндөөлөрдөгү «Anki ачылганда шайкештирүү» экранды ар ачкан сайын шайкештирет. Баскыч басканда тармак эч качан колдонулбайт."
