update.plugin.name = Жаңыртуу
update.plugin.description = Микропрограмма жаңыртууларын картадан же интернеттен жүктөлгөнүн орнотот.
update.plugin.how = "«Жаңыртуу» PaperPaw микропрограмма болгон түзмөктөрдө, мисалы X4'те, жаңы микропрограмманы орнотот. Аны жөндөөлөрдөн «Жаңыртуу» катары табасыз.\n\n«Онлайн издөө» жаңыртуу серверинен жаңыраак PaperPaw'ды сурайт жана аны жүктөп алат, Wi-Fi аркылуу бул бир нече мүнөт алат. Же жаңыртуу файлын (.bin менен аяктаган, paperpaw.org'дон) картадагы updates папкасына көчүрүңүз, мисалы Wi-Fi аркылуу өткөрүү менен. «Орнотуу» андан кийин болжол менен бир мүнөт алат жана түзмөк кайра иштейт; китептер, жөндөөлөр жана окуу орундары калат.\n\n«Жаңыртууларды издөө» күйүк болгондо (жөндөөлөрдө, башында өчүк) түзмөк жумасына бир жолу өзү сурайт, Wi-Fi баары бир күйүк болгондо же заряддалып жатканда гана. Ал тапкан жаңыраак PaperPaw ушул жерде күтөт; эч нерсе окууңузду үзбөйт. Издөө түзмөк эмне иштеткенин жөнөтөт, анын аты же номери эмес; түзмөктөрдү саноо үчүн ошондой эле сиз сурадыңызбы жана бул күндүн, жуманын же айдын биринчи издөөсүбү. \n\nКолдонгон плагиндериңиздин жаңы чыгарылышы үчүн версиясы азырынча жок болсо, жаңыртуу аларды күтөт. Эски версия сиз тандасаңыз гана орнотулат.\n\nCrossPoint сыяктуу башка микропрограмма да ушул жерден орнотулат: анын файлын (.bin менен аяктаган) updates папкасына салып, «Жаңыртууну» ачыңыз. PaperPaw анын бул түзмөк үчүн бүтүн, бузулбаган микропрограмма экенин текшерет, бирок аны ким жасаганын айта албайт, анткени ага кол коюлган эмес. «Баары бир орнотуу» аны флэштин башка жарымына жазат жана түзмөк аны иштетет; PaperPaw ал микропрограмма анын үстүнө бир нерсе орнотмоюнча өз жарымында калат. Кийин PaperPaw'га кайтуу үчүн башка микропрограмманын менюсунан, мисалы CrossPoint'тун SD микропрограмма жаңыртуусунан, анын орнотуу файлын (paperpaw-<түзмөк>-<версия>-install.bin) орнотуңуз."
