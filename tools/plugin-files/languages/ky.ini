settings.plugin.name = Жөндөөлөр
settings.plugin.description = Ар бир плагиндин жөндөөлөрүнөн түзүлгөн жөндөө беттери.
settings.plugin.how = "«Жөндөөлөр» PaperPaw жана анын плагиндеринде жөндөлө турган бардык нерсени беттерде көрсөтөт. Плагиндерге өз экраны керек эмес: алар жарыялаган нерсе ушул жерде топтор менен, ар бир жөндөөнүн сүрөттөмөсү анын астында көрүнөт.\n\nАны менюдагы «Жөндөөлөр» менен ачыңыз. Топту ачуу үчүн таптаңыз, анан жөндөөнү которуу же тандоо үчүн; сандарда − жана + баскычтары бар. Баскычтар менен жөндөөгө өтүп, «Тандоо» басыңыз: солго жана оңго санды өзгөртөт, «Тандоо» аны сактайт, «Артка» мурунку маанини кайтарат.\n\nӨзгөртүүлөр дароо колдонулат. «Издөө» жөндөөнү сөздөр боюнча табат, ал эми «Өнүккөн жөндөөлөр» сейрек керек болгондорду кошот. «Демейкиге кайтаруу» жана «Баарын кайтаруу» адегенде сурайт."
