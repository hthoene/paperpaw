menu.plugin.description = Экрандын ылдый жагындагы меню, аракеттер жана жөндөөлөр менен.
menu.plugin.how = "Меню эмне кылсаңыз жана эмнени жөндөсөңүз болорун тизмелейт. Ал экрандын ылдый жагында, ачык нерсенин үстүндө ачылат: окуп жатканда экрандын ортосун таптаңыз же «Тандоо» басыңыз. Аны аткаруу үчүн жазууну таптаңыз же тандаңыз.\n\nМенюдагы жөндөөлөр өз маанисин көрсөтөт жана ордунда өзгөрөт, ошондуктан меню ачык калат. Көбүрөөк жазуулары бар жазуу подменюну ачат.\n\nТез панель үчүн жогорку четинен ылдый сүрүңүз: сиз көп өзгөрткөн нерселер, баскычтар катары. Баскычты которуу үчүн таптаңыз, анын жөндөөлөрү үчүн басып туруңуз. Баскычтар менен гана жебе баскычтары тандайт, «Тандоо» которот жана «Артка» жабат. «Көрүнүш», «Менюлар» астында менюларды тизме катары же плиткалар катары көрсөтөт."
