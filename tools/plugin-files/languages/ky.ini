battery.plugin.name = Батарея сарпталышы
battery.plugin.description = Батареяны жазып, канча убакытка жетерин көрсөтөт.
battery.plugin.how = "«Батарея сарпталышы» түзмөк ойгоо турганда дээрлик ар мүнөттө зарядды жазып алат, ошону менен бирге түзмөк эмне кылганын: экран жаңыртууларын жана бурулган беттерди. Ошондон ойгоо бир саат менен 100 бет канча алаарын жана батарея ушундай ылдамдыкта канча жетерин эсептейт.\n\nБатареяны Куралдар менюсунан ачыңыз. Ал азыркы зарядды, ушул ойгоо убакытты, батареядагы азырынча сарпталышты жана акыркы ойгоо убактыларыңызды көрсөтөт. Бет баскычтары менен же жогору жактагы жебелерди таптап барактасаңыз болот.\n\nЦифралар бир нерсе айта баштоо үчүн батареяда бир аз убакыт окуу керек. Жазуу адегенде күйүк жана аны Жөндөөлөрдөн, «Түзмөк», «Кубат» астындагы «Батарея сарпталышын жазуу» аркылуу өчүрсө болот."
