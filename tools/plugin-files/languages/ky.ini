setup.plugin.name = Жөндөө
setup.plugin.description = Биринчи ишке киргизүүдө эң маанилүү жөндөөлөр боюнча кыска жол көрсөткүч.
setup.plugin.how = "«Жөндөө» эң маанилүү жөндөөлөр боюнча кыска жол көрсөткүч, PaperPaw биринчи жолу башталганда бир жолу көрсөтүлөт. Ар бир бет тил, баскычтар, текст өлчөмү, убакыт алкагы, Wi-Fi же кошула турган бир нече плагин сыяктуу бир нерсени сурайт, акылга сыярлык жооп мурунтан тандалган, ошондуктан «Кийинки» ар дайым туура. Бул түзмөккө кереги жок кадамдар калтырылат.\n\nБаскычтарды таптаңыз же өйдө жана төмөн баскычтарын жана «Тандоо» баскычын колдонуңуз. Биринчи беттеги «Өткөрүп жиберүү» жөндөөдөн дароо чыгат. Акыркы бет китептериңиз кайдан келерин айтат.\n\nКайра иштетүү үчүн жөндөөлөрдү ачып, «PaperPaw'ды жөндөө» тандаңыз. Бул жерде тандалган баары кийин жөндөөлөрдөн өзгөртүлүшү мүмкүн."
