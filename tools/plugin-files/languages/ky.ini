calibre.plugin.name = Зымсыз китепкана
calibre.plugin.description = Китептерди тармак аркылуу кабыл алат. Calibre үчүн зымсыз түзмөк катары иштейт.
calibre.plugin.how = "«Зымсыз китепкана» түзмөктүн компьютериңиздеги Calibre'де зымсыз түзмөк катары көрүнүшүнө мүмкүндүк берет. Андан кийин Calibre ага китептерди жөнөтүп, аларды тизмелеп жана өчүрө алат. Китептер китепканага түшөт.\n\n«Зымсыз китепкананы» Куралдар менюсунан ачыңыз, түзмөк менен компьютер бир Wi-Fi тармагында болсун. Calibre'де «Connect/share», анан «Start wireless device connection» тандаңыз. Түзмөк компьютериңизди тапканда анын атын көрсөтөт; «Туташуу» баскычын таптаңыз (баскычтар менен «Тандоо» басыңыз). Calibre бул жерге китептерди кошуп, өчүрө алат, ошондуктан өз компьютериңизге гана туташыңыз. Экранды жабуу туташууну үзөт.\n\nCalibre өзү табылбаса, анын компьютеринин дарегин Жөндөөлөрдөн «Китепкана» астындагы Calibre бөлүмүндө «Дарек» катары киргизиңиз. Calibre 9090 портунан башкасын колдонсо, аны :порт катары кошуңуз, мис. 192.168.1.20:9091."
