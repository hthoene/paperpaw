stats.plugin.name = Skaitymo statistika
stats.plugin.description = Įrašo, kiek ilgai ir kiek skaitote, su kalendoriumi ir kiekvienos knygos skaičiais.
stats.plugin.how = "„Skaitymo statistika“ įrašo, kiek laiko skaitote kiekvieną puslapį. Ją matote kaip apžvalgą su šiandiena, savaite ir serija, kaip kalendorių ir su kiekvienos knygos skaičiais.\n\nAtidarykite ją iš „Įrankiai“ arba skaitymo ekrane iš „Daugiau“. Nustatymuose, skiltyje „Skaitymo statistika“, galite išjungti „Įrašyti skaitymą“, nustatyti „Dienos tikslą“ ir nustatyti „Trumpiausią puslapį“ bei „Ilgiausią puslapį“, kurie skaičiuojami, kad vartymas ar paliktas atidarytas knyga neiškreiptų skaičių.\n\n„Sinchronizuoti su KOReader“ dalijasi statistika su KOReader per WebDAV aplanką. Taip pat perima to paties įrenginio KOReader statistiką. Įrašymui reikia nustatyto laikrodžio: jei jis nenustatytas, vieną kartą prisijunkite prie Wi-Fi."
