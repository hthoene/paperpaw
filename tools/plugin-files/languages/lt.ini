about.plugin.name = Apie
about.plugin.description = PaperPaw versija ir licencijos.
about.plugin.how = "Skiltis „Apie“ parodo, kokią PaperPaw versiją turite, kur yra jos pirminis kodas ir kokiomis licencijomis ji platinama.\n\nJą rasite nustatymų pabaigoje kaip „Apie PaperPaw“. Eilutę pasirinkite rodyklių mygtukais ir „Pasirinkti“ arba ją palieskite. Taip pat išvardyti integruoti įskiepiai ir įrenginiuose, kurie įkelia įskiepius su kodu, pirštų atspaudas, kuriam tokie įskiepiai turi būti sukurti.\n\n„Licencijos“ atsidaro kaip tekstas skaitykloje, todėl jį verčiate kaip knygą. Jame yra paties PaperPaw licencija ir kartu pateikiamų šriftų, piktogramų bei žodžių kėlimo šablonų licencijos. Įskiepiai gali pridėti savo eilutę, pvz., temos autorių."
