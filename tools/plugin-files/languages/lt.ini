koreader.plugin.name = Paryškinimų bendrinimas
koreader.plugin.description = Dalijasi žymėmis ir paryškinimais su KOReader knygoms, skaitomoms abiejose.
koreader.plugin.how = "Šis įskiepis dalijasi žymėmis ir paryškinimais su KOReader knygoms, kurias skaitote abiejose, viename įrenginyje arba bibliotekos aplanke, sinchronizuojamame tarp įrenginių. Nieko nereikia nustatyti.\n\nKai PaperPaw atidaro knygą, kurią buvo atidariusi ir KOReader, ir kai keičiate jos žymes ar paryškinimus, jis perima tai, kas nauja, iš KOReader duomenų šalia knygos ir palieka tai, kas nauja čia, kad KOReader pasiimtų kitą kartą atidarydama knygą. Pašalinti ženklinimai ir pakeistos pastabos taip pat perkeliami.\n\nTai veikia tik EPUB knygoms. Jei vienos pusės failo perskaityti nepavyksta, nė vienoje pusėje niekas nesikeičia, kol nepavyks."
