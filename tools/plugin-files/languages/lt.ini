opds.plugin.name = OPDS katalogai
opds.plugin.description = Naršo OPDS katalogus, atsisiunčia jų knygas ir palaiko aplankus sinchronizuotus su jais.
opds.plugin.how = "OPDS katalogai yra interneto bibliotekos, pvz., Project Gutenberg, Calibre-Web, Kavita ar Komga. Šis įskiepis naršo ir ieško juose kaip aplankuose ir atsisiunčia jų knygas į biblioteką.\n\nAtidarykite „Katalogai“ iš meniu „Įrankiai“ ir pasirinkite „Pridėti katalogą“: adresas ir, jei katalogui reikia paskyros, naudotojo vardas ir slaptažodis. Palieskite katalogą, kad jį naršytumėte; palaikykite jį (su mygtukais palaikykite „Pasirinkti“), kad sinchronizuotumėte, redaguotumėte ar pašalintumėte.\n\nĮjungus „Sinchronizuoti šį katalogą“, „Sinchronizuoti katalogus“ atsisiunčia jo naujas knygas į jo aplanką. „Knygų per sinchronizavimą“ riboja, kiek vienas sinchronizavimas atsisiunčia, kad didelis katalogas neužpildytų įrenginio. Vietoj katalogo veikia ir debesies aplankas (WebDAV)."
