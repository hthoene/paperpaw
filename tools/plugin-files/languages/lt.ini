calibre.plugin.name = Belaidė biblioteka
calibre.plugin.description = Gauna knygas per tinklą. Veikia kaip belaidis Calibre įrenginys.
calibre.plugin.how = "„Belaidė biblioteka“ leidžia įrenginiui kompiuterio programoje „Calibre“ pasirodyti kaip belaidžiam įrenginiui. Tada „Calibre“ gali siųsti jam knygas, jas išvardyti ir ištrinti. Knygos patenka į biblioteką.\n\nAtidarykite „Belaidė biblioteka“ iš meniu „Įrankiai“, kai įrenginys ir kompiuteris yra tame pačiame Wi-Fi tinkle. Programoje „Calibre“ pasirinkite „Prisijungti / bendrinti“, tada „Paleisti belaidžio įrenginio ryšį“. Kai įrenginys suras jūsų kompiuterį, jis parodys jo pavadinimą; palieskite „Prisijungti“ (su mygtukais spauskite „Pasirinkti“). „Calibre“ čia gali pridėti ir ištrinti knygas, todėl jungkitės tik prie savo kompiuterio. Uždarius ekraną ryšys nutraukiamas.\n\nJei „Calibre“ nerandama savaime, įveskite jos kompiuterio adresą nustatymuose, skiltyje „Biblioteka“, kaip „Adresas“ dalyje „Calibre“. Jei „Calibre“ naudoja ne 9090 prievadą, pridėkite jį kaip :prievadas, pvz., 192.168.1.20:9091."
