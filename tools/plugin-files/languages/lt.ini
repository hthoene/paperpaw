keys.plugin.name = Mygtukai ir gestai
keys.plugin.description = Ką daro kiekvienas mygtukas, palietimo zona ir perbraukimas, keičiama įrenginyje.
keys.plugin.how = "„Mygtukai ir gestai“ parodo, ką daro kiekvienas mygtukas, palietimo zona ir perbraukimas, ir leidžia tai keisti įrenginyje.\n\nAtidarykite jį nustatymuose, skiltyje „Įrenginys“. Pirmiausia pasirinkite, kur galioja pakeitimas: „Visur“, „Skaitant“, „Pradžios ekrane“, „Bibliotekoje“ ar viename įrankyje. Tada pasirinkite įvestį, pvz., palaikomą mygtuką ar perbraukimą nuo krašto, ir veiksmą iš sąrašo, kuriame galima ieškoti. „Kaip standartiškai“ grąžina tai, ką nustato įskiepiai ir mygtukų išdėstymas.\n\nX4 pakeitimas, po kurio nebeliktų mygtuko pasirinkti, grįžti atgal ar judėti toliau, atmetamas. „Atstatyti mygtukus ir gestus“ pabaigoje atšaukia visus pakeitimus."
