settings.plugin.name = Nustatymai
settings.plugin.description = Nustatymų puslapiai, sudaryti iš visų įskiepių nustatymų.
settings.plugin.how = "„Nustatymai“ rodo viską, ką galima nustatyti PaperPaw ir jo įskiepiuose, puslapiais. Įskiepiams savo ekrano nereikia: tai, ką jie deklaruoja, atsiranda čia, grupėmis, su kiekvieno nustatymo aprašu po juo.\n\nAtidarykite juos per „Nustatymai“ meniu. Palieskite grupę, kad ją atidarytumėte, tada nustatymą, kad jį perjungtumėte ar pasirinktumėte; skaičiai turi mygtukus − ir +. Su mygtukais pereikite prie nustatymo ir paspauskite „Pasirinkti“: „Kairėn“ ir „Dešinėn“ keičia skaičių, „Pasirinkti“ jį palieka, „Atgal“ grąžina ankstesnę reikšmę.\n\nPakeitimai įsigalioja iš karto. „Paieška“ randa nustatymą pagal žodžius, o „Išplėstiniai nustatymai“ prideda retai reikalingus. „Atstatyti numatytuosius“ ir „Atstatyti viską“ pirmiausia paklausia."
