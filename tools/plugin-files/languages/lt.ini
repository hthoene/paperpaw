diagnostics.plugin.name = Diagnostika
diagnostics.plugin.description = Bandomasis ekranas ir vedamasis visų įrenginio dalių patikrinimas.
diagnostics.plugin.how = "„Diagnostika“ yra bandomasis ekranas įrenginiui patikrinti: jis rodo kiekvieną pilkumo lygį, kurį gali parodyti ekranas, keturis langelius mygtukams ir lietimui išbandyti bei puslapių skaitiklį su eigos juosta atnaujinimo režimams palyginti.\n\nBandomasis ekranas neturi meniu įrašo. Jis yra pradžios ekranas tik tada, kai jokio kito įskiepio nėra, arba kai jį pasirenkate įskiepių tvarkyklėje skiltyje „Ekranai“ vietai „Pradžios ekranas“.\n\n„Pasirinkti“ pažymi langelį su fokusu, o rodyklių mygtukai juda tarp langelių; lietimu palieskite langelį. Puslapių mygtukai verčia bandomuosius puslapius. Palaikykite „Pasirinkti“ arba pirštą ekrane, kad pradėtumėte iš naujo.\n\n„Įrenginio patikra“ įrankiuose, kur PaperPaw yra įrenginio programinė įranga, puslapis po puslapio eina per visas įrenginio dalis: ekraną, mygtukus, lietimą, priekinę šviesą, bateriją, kortelę, laikrodį, Wi-Fi, miegą ir atmintį. Kiekvienas puslapis baigiasi pasirinkimais „Nepavyko“, „Praleisti“ ir „Pavyko“, o pasirinktas atsakymas, kurį siūlo matavimai; įrenginio neturimos dalys praleidžiamos. Po kiekvieno atsakymo ji įrašo ataskaitą į .paperpaw/plugins/diagnostics/device-check.txt, kurią galima įklijuoti į pull request. „Atgal“ ją palieka, o vėl atidarius ji tęsia ten, kur sustojo. Įrenginyje tik su mygtukais pirmiausia mygtukų puslapyje pasirinkite „Pradėti“; iki tol rodyklės, „Pasirinkti“ ir „Atgal“ veikia kaip kiekviename puslapyje."
