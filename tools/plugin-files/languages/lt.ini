tasks.plugin.name = Užduotys
tasks.plugin.description = Darbų sąrašai su terminais ir prioritetais skaitykloje arba sinchronizuoti su jūsų CalDAV serveriu, su pradžios ekrano valdikliais.
tasks.plugin.how = "Darbų sąrašai jūsų skaitykloje: užduotys su terminu ir prioritetu, pažymimos kaip atliktos. Jos veikia be nustatymų ir be tinklo ir gali būti sinchronizuojamos su CalDAV serveriu (Nextcloud, Radicale, Baïkal, Fastmail ir kitais), todėl tie patys sąrašai yra telefone ir kompiuteryje.\n\nAtidarykite „Užduotys“ įrankių meniu. Pirmoji eilutė nurodo rodomą sąrašą; pasirinkite ją kitam sąrašui, „Šiandien ir pavėluotos“ per visus sąrašus, naujam sąrašui, sinchronizavimui arba paskyrai nustatyti. „Pridėti užduotį“ atidaro klaviatūrą. „Pasirinkti“ ant užduoties ją pažymi kaip atliktą (dar kartą: neatlikta). Palaikykite užduotį arba paspauskite „Meniu“, kad pakeistumėte jos pavadinimą, terminą (šiandien, rytoj, po savaitės arba įvestą datą, pvz., 2026-12-24) ar prioritetą arba ją pašalintumėte. Neatliktos užduotys rodomos pirmiausia, pagal dieną, o tada pagal prioritetą; atliktos lieka pabaigoje savaitę (nustatoma nustatymuose skiltyje „Užduotys“), tada pašalinamos iš skaityklės.\n\nPradžios ekrano valdikliai (palaikykite pradžios ekraną, tada pridėkite valdiklį): „Užduotys šiandien“ rodo, ką reikia atlikti šiandien ar kas pavėluota, „Užduočių sąrašas“ rodo vieną sąrašą, „Neatliktos užduotys“ jas suskaičiuoja, o „Kita užduotis“ rodo tą, kurią reikia atlikti kitą. Palietus užduotį valdiklyje ji pažymima kaip atlikta; palietus antraštę atsidaro sąrašai.\n\nNorėdami sinchronizuoti, sąrašo eilutėje pasirinkite „CalDAV paskyra“ ir įveskite serverio adresą, savo naudotojo vardą ir slaptažodį (geriausia programos slaptažodį). Užtenka serverio adreso, pvz., cloud.example.com/remote.php/dav; skaitykla iš ten suranda jūsų užduočių sąrašus. Kiekvienas serverio užduočių sąrašas tampa sąrašu skaitykloje. Skaitykla sinchronizuoja, kai atidarote „Užduotys“, kai pasirenkate „Sinchronizuoti dabar“ ir kai tinklas ir taip įjungtas; tai, ką pakeičiate be tinklo, laukia ir išsiunčiama vėliau. Jei užduotis per tą laiką buvo pakeista skaitykloje ir kitur, imama serverio versija, o jūsų lieka kaip nauja užduotis šalia, kad nieko neprarastumėte. Pastabos, priminimai ir viskas, ką užduotis turi serveryje, lieka nepakeista. Pasikartojančios užduotys rodomos, bet keičiamos ten, kur jas sukūrėte. Skaitykloje telpa iki 200 užduočių 12 sąrašų."
