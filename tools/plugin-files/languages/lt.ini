mail.plugin.name = Paštas
mail.plugin.description = Skaito ir siunčia el. laiškus su slaptažodžiu ar programos slaptažodžiu (IMAP ir SMTP), be prisijungimo naršyklėje.
mail.plugin.how = "„Paštas“ skaito ir siunčia el. laiškus per IMAP ir SMTP. Jis prisijungia su jūsų adresu ir slaptažodžiu, be prisijungimo naršyklėje, todėl veikia su bet kuriuo tai leidžiančiu paslaugų teikėju.\n\nPaskyrą nustatykite skiltyje „Nustatymai“, „Paštas“. Pasirinkite savo teikėją, įveskite adresą ir slaptažodį. Dauguma teikėjų reikalauja programos slaptažodžio: sukurkite jį savo paskyros saugos nustatymuose ir naudokite čia. Jūsų įprastas slaptažodis dažnai neveikia, o jis niekur nenueina, išskyrus jūsų teikėjo serverį. Jis laikomas kartu su slaptažodžiais ir raktais.\n\nAtidarykite „Paštas“ įrankiuose. „Tikrinti paštą“ atsisiunčia naujausius laiškus ir aplankus. Laiškai laikomi kortelėje, todėl galite juos skaityti be tinklo. Įrenginys prisijungia, atsisiunčia ir atsijungia, todėl Wi-Fi įjungtas tik akimirką.\n\nJei jūsų teikėjo sąraše nėra, pasirinkite „Savi serveriai“ ir nustatykite serverių pavadinimus, prievadus ir saugą išplėstiniuose nustatymuose. Serveris, kurio sertifikato niekas nepatvirtina, vieną kartą paklausia, ar juo pasitikite; palyginkite kontrolinį kodą su tuo, kurį nurodo jūsų teikėjas.\n\nLaiškas su prisegta knyga (EPUB, PDF ir panašiai, iki 2 MB) po savimi turi „Atidaryti knygą“: ji atsisiunčia failą, įdeda jį į jūsų biblioteką ir atidaro.\n\nNorėdami matyti naujus laiškus neatidarę „Paštas“, nustatymuose, skiltyje „Paštas“, įjunkite „Ieškoti naujo pašto fone“ ir pasirinkite, kaip dažnai (kas 15, 30 ar 60 minučių). Iki įjungimo ji išjungta. Tada skaitykla kartkartėmis prisijungia saugiu ryšiu, kol budi ir yra prisijungusi, po vieną paskyrą, ir atnaujina neperskaitytų laiškų skaičių pradžios ekrane. Tai šiek tiek eikvoja bateriją. Atidarius „Paštas“ vykstantis tikrinimas sustoja.\n\nPradžios ekrano valdikliai rodo neperskaitytų laiškų skaičių, naujausius ir pažymėtus laiškus, vieną pašto dėžutę ir nuorodą laiškui rašyti."
