update.plugin.name = Atnaujinimas
update.plugin.description = Diegia programinės įrangos naujinius iš kortelės arba atsisiųstus iš interneto.
update.plugin.how = "„Atnaujinimas“ įdiegia naują programinę įrangą įrenginiuose, kuriuose PaperPaw pati yra programinė įranga, pvz., X4. Rasite jį nustatymuose kaip „Atnaujinimas“.\n\n„Ieškoti internete“ paklausia naujinių serverio apie naujesnį PaperPaw ir jį atsisiunčia, o tai per Wi-Fi užtrunka kelias minutes. Arba nukopijuokite naujinio failą (baigiasi .bin, iš paperpaw.org) į aplanką updates kortelėje, pvz., su „Wi-Fi perkėlimas“. Tada „Įdiegti“ užtrunka apie minutę ir įrenginys persikrauna; knygos, nustatymai ir skaitymo vietos lieka.\n\nĮjungus „Ieškoti naujinių“ (nustatymuose, iš pradžių išjungta), įrenginys maždaug kartą per savaitę pats paklausia, tik kai Wi-Fi ir taip įjungtas arba jis kraunasi. Rastas naujesnis PaperPaw laukia čia; nieko netrukdo skaityti. Paieška išsiunčia tai, kas veikia įrenginyje, bet ne jo pavadinimą ar numerį; įrenginiams suskaičiuoti – taip pat, ar jūs paprašėte ir ar tai pirma jo paieška per dieną, savaitę ar mėnesį.\n\nJei jūsų naudojamas įskiepis dar neturi naujo leidimo versijos, naujinys jos laukia. Senesnė versija diegiama tik jei ją pasirenkate.\n\nČia taip pat galima įdiegti kitą programinę įrangą, pvz., CrossPoint: įdėkite jos failą (baigiasi .bin) į aplanką updates ir atidarykite „Atnaujinimas“. PaperPaw patikrina, ar tai pilna, nesugadinta šio įrenginio programinė įranga, bet negali pasakyti, kas ją sukūrė, nes ji nepasirašyta. „Vis tiek įdiegti“ įrašo ją į kitą atminties pusę, ir įrenginys ją paleidžia; PaperPaw lieka savo pusėje, kol ta programinė įranga kažką įdiegia virš jos. Vėliau grįžti prie PaperPaw galima įdiegiant jos diegimo failą (paperpaw-<įrenginys>-<versija>-install.bin) iš kitos programinės įrangos meniu, pvz., CrossPoint SD programinės įrangos atnaujinimo."
