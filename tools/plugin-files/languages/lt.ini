menu-editor.plugin.how = "Meniu redaktorius keičia, kas yra meniu: perkelkite įrašus aukštyn ar žemyn, šalinkite juos arba pridėkite naujų.\n\nJį rasite nustatymuose skiltyje „Pritaikymas“ kaip „Pritaikyti meniu“. Pasirinkite meniu, tada įrašą, kad jį perkeltumėte ar pašalintumėte; „Pridėti įrašą“ įdeda naują. Pakeitimai galioja iš karto. „Atstatyti šį meniu“ grąžina meniu į tokį, kokį jį apibrėžia jo įskiepiai, „Atstatyti visus meniu“ tai padaro visiems.\n\nJūs negalite savęs užrakinti: įrašas, kuris yra kelias į nustatymus, lieka, kol pridėsite kitą kelią į juos."
