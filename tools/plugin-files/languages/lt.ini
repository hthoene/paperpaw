calendar.plugin.name = Kalendorius
calendar.plugin.description = Jūsų kalendoriai skaitykloje: darbotvarkė, dienos, savaitės ir mėnesio rodiniai iš CalDAV, iCal ir failų, gimtadieniai iš kontaktų, pradžios ekrano valdikliai ir miego ekranas.
calendar.plugin.how = "Jūsų kalendoriai skaitykloje: artimiausių dienų darbotvarkė, diena, savaitė ir mėnuo su CalDAV kalendorių (Nextcloud, Radicale, Baïkal, Fastmail ir kitų), iCal adresų (.ics, webcal://), kortelėje esančių kalendorių failų įvykiais bei jūsų kontaktų gimtadieniais ir metinėmis (CardDAV). Skaitykla kalendorius tik skaito; jų niekada nekeičia.\n\nAtidarykite „Kalendorius“ įrankių meniu. Pirmoji eilutė nurodo rodinį; pasirinkite ją arba palaikykite bet kurią eilutę ar paspauskite „Meniu“, kad perjungtumėte tarp „Darbotvarkė“, „Diena“, „Savaitė“, „Mėnuo“ ir „Gimtadieniai“, pridėtumėte kalendorių ar sinchronizuotumėte. Dienos ir savaitės rodiniuose pirmosios dvi eilutės peršoka į ankstesnę ir kitą dieną ar savaitę (tą patį daro ir puslapių mygtukai); mėnesio rodinyje rodyklių mygtukai perkelia dieną, puslapių mygtukai – mėnesį, o „Pasirinkti“ atidaro dieną. „Pasirinkti“ ant įvykio parodo jį visą: kada, kur, kuris kalendorius ir kaip kartojasi. „Atgal“ grįžta vienu žingsniu.\n\nKalendorių pridėkite skiltyje „Kalendoriai“ (meniu arba nustatymuose „Kalendorius“). Pasirinkite jo rūšį: CalDAV paskyra (užtenka serverio adreso, pvz., cloud.example.com/remote.php/dav; kiekvienas kalendorius su įvykiais tampa rodinio dalimi), iCal adresas (kalendorius, paskelbtas kaip .ics), kalendoriaus failas kortelėje arba kontaktai (CardDAV adresų knyga: skaitykla rodo juose išsaugotus gimtadienius ir metines). Įveskite adresą, paskyrai – savo naudotojo vardą ir slaptažodį (geriausia programos slaptažodį; jis laikomas kartu su skaityklos slaptažodžiais) bei pavadinimą. Kiekvienas kalendorius turi ženklą (tašką, žiedą, pilką tašką ar kvadratą), kurį galite keisti, kad juos atskirtumėte; iki šešių kalendorių.\n\nKartojami įvykiai (kasdien, kas savaitę, kas mėnesį, kasmet, su savaitės dienomis, skaičiumi, pabaigos datomis ir praleistomis dienomis), visos dienos įvykiai ir įvykiai kitose laiko juostose rodomi pagal skaityklos laikrodį. Skaitykla laiko įvykius nuo šešiasdešimties dienų prieš iki šešiasdešimties dienų po šiandienos, daugiausia 240, ir rodo juos be tinklo. Taisyklių, kurių negali perskaityti, įvykis rodomas vieną kartą.\n\nKalendoriai skaitomi, kai atidarote kalendorių (ne dažniau kaip kas penkias minutes), kai pasirenkate „Sinchronizuoti dabar“ ir, kaip nustatote nustatymuose skiltyje „Kalendorius“, kai tinklas ir taip įjungtas arba kai prasideda įkrovimas. Skaitykla dėl to niekada neįjungia radijo ryšio, nebent paprašote „Sinchronizuoti dabar“.\n\nPradžios ekrano valdikliai (palaikykite pradžios ekraną, tada pridėkite valdiklį): „Šiandien“ rodo datą ir ką diena žada, „Kitas įvykis“ – artimiausią įvykį, „Darbotvarkė“ – artimiausias dienas, „Mėnuo“ – mėnesį su tašku po dienomis, kuriose yra įvykių, o „Gimtadieniai“ – artimiausius gimtadienius. Palietus įvykį jis atsidaro, palietus mėnesio dieną atsidaro ta diena. Miego ekranas gali rodyti šiandienos darbotvarkę: nustatymuose skiltyje „Miego ekranas“ pasirinkite „Kalendorius“."
