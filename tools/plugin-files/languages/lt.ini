notes-overview.plugin.name = Visos pastabos
notes-overview.plugin.description = Visų knygų žymės ir paryškinimai viename sąraše ir eksportas į My Clippings.txt.
notes-overview.plugin.how = "„Visos pastabos“ išvardija kiekvieną knygą, kurioje padarėte žymę ar paryškinimą, nurodydamos jų skaičių. Atidarykite jį skiltyje „Įrankiai“. Pasirinkite knygą, kad pamatytumėte jos pastabas, ir pastabą, kad atidarytumėte knygą toje vietoje.\n\nSąrašo pabaigoje „Eksportuoti kaip My Clippings.txt“ įrašo visas pastabas į vieną failą aplanke „Exports“ šalia bibliotekos tokia forma, kokią naudoja Kindle (UTF-8). Programos, kurios skaito Kindle failą My Clippings.txt, gali jį perskaityti. Pastaba prie paryškinimo yra atskiras įrašas, kaip Kindle. Kadangi čia knyga neturi Kindle vietų, „location“ yra pastabos vieta knygoje procentais. Failas įrašomas iš naujo kiekvieną kartą; jis pakeičia ankstesnįjį."
