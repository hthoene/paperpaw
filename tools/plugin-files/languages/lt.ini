battery.plugin.name = Baterijos naudojimas
battery.plugin.description = Įrašo baterijos būseną ir rodo, kiek laiko jos užteks.
battery.plugin.how = "„Baterijos naudojimas“ maždaug kas minutę, kol įrenginys budi, užrašo įkrovą kartu su tuo, ką jis darė: ekrano atnaujinimais ir pervertais puslapiais. Iš to apskaičiuoja, kiek baterijos suvartoja valanda budėjimo ir 100 puslapių ir kiek laiko ja užteks tokiu tempu.\n\nAtidarykite „Baterija“ iš meniu „Įrankiai“. Matysite dabartinę įkrovą, šį budėjimą, naudojimą nuo pradžios su baterija ir pastarųjų budėjimų sąrašą. Verskite puslapiais mygtukais arba paliesdami rodykles viršuje.\n\nReikia šiek tiek paskaityti naudojant bateriją, kad skaičiai ką nors reikštų. Įrašymas iš pradžių įjungtas ir jį galima išjungti nustatymuose skiltyje „Įrenginys“, „Maitinimas“, parinktis „Įrašyti baterijos naudojimą“."
