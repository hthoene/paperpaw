store.plugin.name = Įskiepių parduotuvė
store.plugin.description = Randa, diegia, atnaujina ir šalina šio įrenginio įskiepius.
store.plugin.how = "Įskiepių parduotuvė randa šio įrenginio įskiepius internete ir juos diegia, atnaujina bei šalina. Atidarykite ją iš „Įrankiai“; jai reikia Wi-Fi.\n\nPradžioje rodoma, ką rekomenduoja biblioteka, kas nauja ar dabar populiaru, tada grupės. Grupė išvardija savo įskiepius sąžiningu mišiniu, kuris keičiasi kasdien, kad kiekvienas įskiepis būtų pamatytas; rūšiuokite juos nuo A iki Z, pagal naujumą ar paskutinį atnaujinimą ir ilgus sąrašus šokite prie raidės. Atidarykite vieną, kad pamatytumėte jo puslapį su dydžiu ir naudojama atmintimi, tada pasirinkite „Įdiegti“, „Atnaujinti“ ar „Pašalinti“. „Atnaujinti viską“ atnaujina kiekvieną įdiegtą įskiepį.\n\nĮskiepiai su kodu veikia su visa prieiga prie įrenginio: parduotuvė tai pasako ir pirmiausia paklausia, o jie pasileidžia po paleidimo iš naujo. Jei kuris nors sugenda, PaperPaw pasileidžia be įskiepių su kodu ir pasako, kurie tai buvo. „Įskiepių biblioteka“ nustato, iš kur ateina sąrašas.\n\n„Bendruomenės įskiepiai“ nustatymuose, skiltyje „Sistema“, taip pat išvardija įskiepius, kuriuos kiti paskelbė GitHub. Niekas jų nepatikrino: jie pažymėti „Nepatikrinta“, įskiepio su kodu puslapis rodo raktą, kuriuo jis pasirašytas, o atnaujinimas, pasirašytas kitu raktu, neįdiegiamas.\n\n„Šaltiniai“, paskutinė pradžios eilutė, prideda kitų žmonių įskiepių sąrašus pagal jų adresą (https://…/plugins.json), parodo vieną iš jų vietoj PaperPaw sąrašo arba jį pašalina. Vietoj rašymo įdėkite failą sources.txt su vienu adresu eilutėje į .paperpaw/plugins/store kortelėje: adresai skiltyje „Šaltiniai“ rodomi kaip nauji. PaperPaw netikrina šaltinio ar jo įskiepių, o įrenginys jungiasi prie šaltinio serverio. Šaltinis pasirašo savo sąrašą; įrenginys įsimena pirmojo perskaityto sąrašo raktą ir nuo to laiko priima tik sąrašus ir įskiepius su kodu, pasirašytus tuo raktu. Įskiepis gauna atnaujinimus tik iš šaltinio, iš kurio buvo įdiegtas. Paties PaperPaw biblioteka yra visada ir jos pašalinti negalima; išėjus iš parduotuvės grįžtama prie jos."
