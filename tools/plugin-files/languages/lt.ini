puzzles.plugin.name = Galvosūkiai
puzzles.plugin.description = Sudoku, kryžiažodžiai ir šachmatų uždaviniai be interneto, su dienos galvosūkiu.
puzzles.plugin.how = "Galvosūkiai traukiniui ir laukiamajam, visi be interneto: sudoku, kryžiažodžiai ir šachmatų uždaviniai. Atidarykite „Galvosūkiai“ įrankių meniu arba pridėkite valdiklį „Dienos galvosūkis“ į pradžios ekraną (palaikykite pradžios ekraną, tada pridėkite valdiklį): jis rodo, kiek toli yra šiandienos sudoku, o palietimas jį atidaro. Dienos sudoku visą dieną tas pats.\n\nSudoku: „Kairėn“ ir „Dešinėn“ perkelia žymeklį langelis po langelio, „Aukštyn“ ir „Žemyn“ (puslapių mygtukai) – per eilutę. „Pasirinkti“ atidaro skaitmenis: pasirinkite vieną ir dar kartą „Pasirinkti“, kad jį įrašytumėte, arba „Valyti“, kad langelį ištuštintumėte. Palaikykite „Pasirinkti“ (arba „Meniu“), kad pasiektumėte mygtukus po lenta: „Pastabos“ paverčia skaitmenis pieštuko žymėmis, „Tikrinti“ pažymi neteisingus langelius, „Atšaukti“ grąžina paskutinį ėjimą, „Naujas“ pradeda jūsų pasirinkto lygio galvosūkį („Lengvas“, „Vidutinis“, „Sunkus“). Kiekvienas galvosūkis turi lygiai vieną sprendimą. Žaidimas išsaugomas išėjus. Jutikliniame ekrane palieskite langelį.\n\nKryžiažodžiai: .puz (Across Lite) arba .ipuz failus įdėkite į aplanką „puzzles“ atminties kortelėje; jokių kartu nepateikiama. Judėkite tinklelyje, tada pasirinkite, kad klaviatūra įvestumėte žodį po žymekliu (pabraukimas palieka langelį tuščią). Mygtukai perjungia horizontaliai ir vertikaliai, rodo apibrėžimų sąrašą, tikrina raides ir parodo žodį. Raidės išsaugomos kiekvienam failui. Užšifruotų .puz failų atidaryti negalima.\n\nŠachmatų uždaviniai: nedidelis rinkinys iš Lichess uždavinių duomenų bazės (CC0). „Kairėn“ ir „Dešinėn“ šoka nuo figūros prie figūros, pasirinkite figūrą, kuria norite eiti, tada „Kairėn“ ir „Dešinėn“ per laukelius, kuriuos ji gali pasiekti, ir dar kartą „Pasirinkti“. Neteisingas ėjimas atšaukiamas. „Užuomina“ pažymi figūrą, kuria reikia eiti, „Toliau“ pereina prie kito uždavinio.\n\nLenta perpiešia tik tuos langelius, kurie keičiasi. „Statistika“ skaičiuoja išspręstus galvosūkius."
