notes-vault.plugin.name = Užrašų saugykla
notes-vault.plugin.description = Skaito Markdown užrašų aplanką pagal aplankus, gaires ir paskutinius pakeitimus, su valdikliais pradžios ekranui. Veikia su Obsidian saugyklomis.
notes-vault.plugin.how = "„Užrašų saugykla“ skaito Markdown užrašų aplanką (paprastus .md failus, kaip juos laiko užrašų programos). Ji veikia su Obsidian saugyklomis.\n\nPasirinkite saugyklos aplanką nustatymuose arba saugyklos puslapyje įrankiuose. Tada puslapis siūlo aplankus tokius, kokie jie yra kortelėje, paskutines pakeistas pastabas, gaires ir paiešką pastabų pavadinimuose.\n\nPirmą kartą saugykla indeksuojama fone, kol jos puslapis atidarytas; tūkstančių pastabų saugykla užtrunka kelias minutes, vėliau atsidaro iš karto. Indeksas laikomas kortelėje ir sukuriamas iš naujo, kai saugyklos puslapis atidaromas po kelių valandų arba kai pasirenkate „Atnaujinti“.\n\nPastaba atsidaro skaitykloje. Nuorodos į kitas pastabas ([[Pastaba]], [[Pastaba|žodžiai]], [[Pastaba#Antraštė]]) randamos pagal pastabos pavadinimą bet kur saugykloje; nuoroda atidaro tą pastabą, o „Atgal“ grąžina į ankstesnę pastabą.\n\nNieko saugykloje niekada nekeičiama. Pradžios ekrano valdikliai (paskutinės pastabos, prisegta pastaba, dienos pastaba, atsitiktinė pastaba, gairės, paieška) pridedami pradžios ekrano redaktoriuje. Valdiklis gali imti pastabas tik iš vieno aplanko: valdiklio nustatymuose įrašykite aplanko kelią nuo kortelės šaknies (pavyzdžiui, Notes/Work); jei palikta tuščia, imamos visos saugyklos pastabos."
