vocabulary.plugin.description = Išsaugo žodžius, kurių ieškote, su jų sakiniais, ir kartoja korteles su išdėstytu kartojimu, sukurtas telefone.
vocabulary.plugin.how = "„Žodynėlis“ išsaugo skaitydami ieškomus žodžius, kiekvieną su jo sakiniu, kad vėliau juos peržiūrėtumėte. Sąrašą rasite skiltyje „Įrankiai“, naujausi pirmiausia; pasirinkite žodį, kad jo ieškotumėte dar kartą. Paskutinė eilutė, „Eksportuoti“, išsaugo juos kortelių programoms, pvz., Anki. Sąraše laikoma naujausių 2 000 žodžių: toliau seniausi išmetami, todėl eksportuokite juos anksčiau, kad išsaugotumėte visus.\n\n„Kortelės“, taip pat skiltyje „Įrankiai“, tikrina jus išdėstytu kartojimu: paspaudę „Rodyti atsakymą“ įvertinate kiekvieną kortelę „Dar kartą“, „Sunku“, „Gerai“ ar „Lengva“, ir tai nulemia, kada ji sugrįš. Kaladžių kurkite su „Redaguoti telefonu“: nuskaitykite kodą telefonu tame pačiame Wi-Fi, tada įveskite korteles arba pridėkite daug iš karto: ten atidarykite kaladę, pasirinkite „Daug kortelių iš karto“ ir pasirinkite CSV, TSV ar TXT failą (viena kortelė eilutėje: priekis, galas, pavyzdys; UTF-8), įklijuokite sąrašą arba atsineškite Anki kaladę (.apkg, eksportuotą su „Palaikyti senesnes Anki versijas“).\n\nArba naudokite SD kortelės failus: įdėkite kiekvienai kaladei CSV, TSV ar TXT failą arba Anki kaladę (.apkg, eksportuotą su „Palaikyti senesnes Anki versijas“) į aplanką Flashcards (Spanish.tsv sukuria kaladę Spanish; viena kortelė eilutėje: priekis, galas, pavyzdys; įrašyta UTF-8; pirmoji eilutė gali pavadinti stulpelius front, back, example). Pasirinkite „Kortelės iš SD kortelės“ skiltyje „Kortelės“ arba leiskite tam įvykti atidarius „Kortelės“. Kaladės lieka skaitykloje su tuo, ką išmokote, o failas sujungiamas su savo kalade, kai tik yra naujas ar pakeistas: pakeitus kortelės galą ar pavyzdį faile, kortelė pasikeičia ir išlaiko savo eigą; pakeitus priekio tekstą, tai laikoma nauja kortele, o sena pradedama iš naujo (kortelės atskiriamos pagal priekio tekstą; tarpai ir didžiosios raidės neskaičiuojami); ištrinta eilutė kortelės neištrina (nebent tai kaladei „kortelių, kurių nėra faile“ nustatysite į „Pašalinti“: tada kortelė kitą kartą atnaujinant pašalinama kartu su eiga visam laikui, o nieko nepašalinama, kol kuri nors failo eilutė negali būti perskaityta). Kaladę išsaugokite į jos failą per „Įrašyti į kortelę“: failas gauna kortelių numerius (stulpelis id), todėl galite redaguoti priekius kompiuteryje, o kortelės išlaiko tai, ką išmokote; faile lieka tik id, priekis, galas ir pavyzdys (kiti stulpeliai, komentarai ir eilučių tvarka neišsaugomi), o įrašymas atmetamas, kol kuri nors failo eilutė negalėjo būti perskaityta; ten buvęs failas pirmą kartą nukopijuojamas į _vardas.bak.tsv (vėlesnis įrašymas šios kopijos nepakeičia). Failas, didesnis nei 4 MiB ar turintis daugiau nei 20 000 eilučių, neskaitomas, o jis turi būti įrašytas kaip CSV UTF-8, ne UTF-16. Pirmą kartą skaitykla sukuria aplanką su pastaba, kaip tai veikia.\n\nNustatymuose, skiltyje „Skaitymas“, „Ieškomi žodžiai tampa kortelėmis“ kiekvieną ieškomą žodį įdeda į kaladę „Ieškoti žodžiai“."
