smart-home.plugin.name = Išmanieji namai
smart-home.plugin.description = Jūsų pačių Home Assistant reikšmės ir jungikliai skydelyje ir kaip pradžios ekrano valdikliai. Veikia su Home Assistant jūsų namų tinkle.
smart-home.plugin.how = "„Išmanieji namai“ rodo jūsų pačių Home Assistant reikšmes ir jungiklius: temperatūras, drėgmę, energiją, duris ir langus, šviestuvus, jungiklius ir scenas. Jis kalbasi su jūsų serveriu per jo REST API jūsų namų tinkle; per jokią kitą paslaugą niekas nevyksta.\n\nAtidarykite „Išmanieji namai“ įrankių meniu, tada „Ryšys“: įveskite savo Home Assistant adresą (pavyzdžiui, http://homeassistant.local:8123) ir ilgalaikį prieigos raktą (sukurkite jį jūsų Home Assistant profilio puslapio apačioje). Raktas laikomas tarp slaptažodžių ir raktų, niekada nustatymų faile. Paprastas http naudojamas tik jūsų namų tinklo adresams; serveriui kitur nustatymuose įjunkite „Serveriai už namų tinklo“ ir naudokite https su galiojančiu sertifikatu.\n\n„Pasirinkti esybes“ atidaro jūsų serverio turimų esybių sąrašą: ieškokite pagal pavadinimą ar ID ir pasirinkite esybę, kad ją rodytumėte (pasirinkite dar kartą, kad ją pašalintumėte). Galite priskirti jai kambarį, kuris sugrupuoja ją skydelyje ir kambarių valdikliuose. Išsaugoma iki 24 esybių. Skydelyje pasirinkę šviestuvą, jungiklį ar sceną jį perjungiate: eilutė rodo serverio atsakymą. Pasirinktas jutiklis perskaitomas iš naujo.\n\nValdikliai (palaikykite pradžios ekraną, tada pridėkite valdiklį): „Išmaniųjų namų reikšmė“ rodo vieną rodmenį dideliu šriftu, „grupė“ išvardija kambario esybes, „jungiklis“ yra mygtukas vienam šviestuvui ar jungikliui, o „kambarys“ yra kortelė su kambario rodmenimis ir jungikliais. Kiekvieno valdiklio nustatymai nurodo, kurią esybę ar kambarį jis rodo.\n\nNamai skaitomi, kai atidarote skydelį, kai paprašote („Atnaujinti dabar“ eilutė arba palietimas ant reikšmės ar grupės valdiklio), kai skaitykla pabunda ten, kur Wi-Fi jau veikia, ir pagal nustatytą grafiką, kol prijungtas kroviklis. Jis niekada pats neįjungia radijo ryšio ir niekada nelaiko jo įjungto."
