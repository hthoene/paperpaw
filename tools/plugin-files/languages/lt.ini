profiles.plugin.name = Skaitymo profiliai
profiles.plugin.description = Pavadinti skaitymo ir ekrano nustatymų rinkiniai, perjungiami palietimu.
profiles.plugin.how = "Profilis pavadinimu, pvz., „Naktis“ ar „Didelis šriftas“, išsaugo jūsų skaitymo nustatymus, ekrano nustatymus ir būsenos juostas ir vienu palietimu juos grąžina.\n\nAtidarykite „Profiliai“ skaitymo meniu skiltyje „Daugiau“ arba nustatymuose skiltyje „Pritaikymas“. Palieskite profilį, kad jį naudotumėte; naudojamas pažymėtas. Palaikykite jį (su mygtukais palaikykite „Pasirinkti“), kad į jį įrašytumėte dabartinius nustatymus, jį pervadintumėte ar pašalintumėte. „Įrašyti kaip naują profilį“ išsaugo tai, kas nustatyta dabar.\n\n„Kitas profilis“ persijungia į kitą sąraše; priskirkite jį mygtukui ar taisyklei."
