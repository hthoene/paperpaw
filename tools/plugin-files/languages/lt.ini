transfer.plugin.name = Perkėlimas
transfer.plugin.description = Įdėkite knygas ir kitus failus į įrenginį iš naršyklės tame pačiame tinkle.
transfer.plugin.how = "„Wi-Fi perkėlimas“ įdeda knygas ir kitus failus į įrenginį iš naršyklės tame pačiame tinkle, be kabelio ar programos. Taip pat galite atsisiųsti failus, kurti aplankus ir trinti.\n\nAtidarykite jį iš „Įrankiai“. Ekrane rodomas adresas tekstu ir QR kodu: atidarykite jį telefono ar kompiuterio naršyklėje arba nuskaitykite kodą. Adresas turi raktą, kuris kaskart sukuriamas iš naujo, todėl kiti tinkle negali pasiekti jūsų failų. Perkėlimas vyksta, kol ekranas atidarytas.\n\nKur PaperPaw pats valdo Wi-Fi, kaip X4, apačioje esantis „Be maršrutizatoriaus“ atidaro paties įrenginio tinklą, prie kurio telefonas prisijungia nuskaitydamas kodą."
