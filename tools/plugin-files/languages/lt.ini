format-cbz.plugin.name = Komiksai
format-cbz.plugin.description = Atidaro komiksų archyvus (.cbz), vienas paveikslėlis – vienas puslapis.
format-cbz.plugin.how = "Atidaro komiksų archyvus (.cbz): vienas paveikslėlis – vienas puslapis, pritaikytas ekranui, pagal pavadinimų tvarką (2 prieš 10).\n\nĮdėkite juos į bibliotekos aplanką ir atidarykite iš bibliotekos; puslapius verskite kaip bet kurioje knygoje. Dideli paveikslėliai pirmą kartą užtrunka akimirką, X4 – ilgiau nei kitur.\n\nSkaitymo nustatymai (Nustatymai, Skaitymas): „Kadras po kadro“ vienu metu rodo vieną puslapio kadrą, kiek leidžia ekranas, o puslapių vertimas juos perjungia; puslapis be kadrų rodomas visas. „Komiksų puslapių kryptis“ atspindi puslapių vertimą mangai (iš dešinės į kairę); pati knygos ComicInfo.xml tai nurodo savaime. Biblioteka rodo knygos pavadinimą ir jos seriją bei numerį iš ComicInfo.xml."
