menu.plugin.name = Meniu
menu.plugin.description = Ekrano apačioje esantis meniu su veiksmais ir nustatymais.
menu.plugin.how = "Meniu išvardija, ką galite daryti ir nustatyti. Jis atsidaro ekrano apačioje, virš to, kas atidaryta: skaitant palieskite ekrano vidurį arba paspauskite „Pasirinkti“. Palieskite ar pasirinkite įrašą, kad jį vykdytumėte.\n\nMeniu nustatymai rodo savo reikšmę ir keičiasi vietoje, todėl meniu lieka atidarytas. Įrašas su daugiau įrašų atidaro submeniu.\n\nPerbraukite žemyn nuo viršutinio krašto, kad atsidarytų greitasis skydelis: tai, ką keičiate dažnai, kaip mygtukai. Palieskite mygtuką, kad jį perjungtumėte, palaikykite – jo nustatymams. Naudojant tik mygtukus, rodyklių mygtukai pasirenka, „Pasirinkti“ perjungia, o „Atgal“ uždaro. Skiltyje „Išvaizda“ „Meniu“ rodo meniu kaip sąrašą arba kaip plyteles."
