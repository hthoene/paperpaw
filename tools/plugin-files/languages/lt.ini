widgets.plugin.name = Valdiklių paketas
widgets.plugin.description = Daug daugiau pradžios ekrano valdiklių: laikrodžiai, kalendorius, citatos, knygos, pastabos ir kita.
widgets.plugin.how = "Valdiklių paketas prideda daug pradžios ekrano valdiklių: laikrodžius (analoginį, žodinį, plytelėmis, pasaulio), kalendorių, metų eigą, atgalinį skaičiavimą, Mėnulio fazę ir dieną bei datą; dienos citatą, pastabas, darbus, paveikslėlius, pasveikinimą ir PaperPaw logotipą; o knygoms – dabar skaitomą, skaitymo eigą, kitą eilėje, seriją, mėgstamiausias, paryškinimą ir biblioteką skaičiais. Jame yra ir baterijos valdiklis.\n\nPridėkite juos per „Redaguoti pradžios ekraną“ meniu (arba ilgai palaikę pradžios ekraną), tada „Pridėti valdiklį“. Kiekvienas turi savo nustatymus, pvz., rėmelį, dydį ir lygiavimą. Pasirinkus besikeičiantį valdiklį, pvz., dienos citatą, parodoma kita. Savo citatas dėkite į quotes.txt aplanke .paperpaw/plugins/widgets kortelėje, kiekviena eilutė kaip tekstas | autorius. Laiko valdikliams reikia nustatyto laikrodžio; jį nustato Wi-Fi."
