help.setting.again.help = Kiekvieno ekrano užuominos vėl parodomos kitą kartą jį atidarius.
help.again-done = Užuominos bus parodytos vėl, kai kitą kartą bus atidarytas kiekvienas ekranas.
home.plugin.name = Pradžios ekranas
home.plugin.description = Pradžios puslapis: valdiklių puslapiai, pvz., skaitoma knyga ir įrankiai.
home.plugin.how = "Pradžios ekranas sudarytas iš puslapių, kurių kiekvienas yra valdiklių ir įrankių tinklelis, kaip telefone. Iš pradžių laikrodis, šiuo metu skaitoma knyga ir neseniai skaitytos knygos yra viename puslapyje, o visi įrankiai – kitame.\n\nPalieskite elementą, kad jį atidarytumėte, ir perbraukite arba naudokite puslapių mygtukus, kad pakeistumėte puslapį. Naudojant tik mygtukus, rodyklių mygtukai pereina nuo vieno elemento prie kito, o „Pasirinkti“ jį atidaro.\n\nNorėdami pertvarkyti, palaikykite pradžios ekraną, palieskite pieštuką po puslapiu arba meniu pasirinkite „Redaguoti pradžios ekraną“. Elementus vilkite, kad juos perkeltumėte, arba palieskite vieną jo parinktims, taip pat su mygtukais. „Pridėti valdiklį“ taip pat ten. „Stulpeliai“ ir „Eilutės“ yra nustatymuose skiltyje „Išvaizda“, dalyje „Pradžios ekranas“.\n\nPasuktame ekrane pradžios ekranas rodo tuos pačius elementus su daugiau stulpelių, kiekvienas puslapis užpildomas prieš kitą, o kortelės ne platesnės nei maždaug 110 mm; to, ką išdėstėte stačiai, tai nekeičia. Jei išdėstysite jį gulsčiai, šis maketas išsaugomas tai padėčiai atskirai: nauji valdikliai pridedami į abu. „Atstatyti gulsčią maketą“ skiltyje „Pridėti“ (redaguojant) grąžina išvestinį maketą. Pašalinus valdiklį ar įrankį vienoje padėtyje, jis nepašalinamas iš kitos."
