dictionary.plugin.name = Žodynas
dictionary.plugin.description = Ieško žodžių StarDict žodynuose.
dictionary.plugin.how = "Žodynas ieško knygos žodžio StarDict žodynuose ir rodo apibrėžimus skydelyje ekrano apatinėje dalyje.\n\nSkaitykloje palaikykite žodį ir pasirinkite „Ieškoti žodyne“; su mygtukais naudokite „Pažymėti tekstą“ skiltyje „Daugiau“. Nukopijuokite žodynų aplankus (su .ifo, .idx ir .dict failais) į įrenginio aplanką „dictionaries“, įskaitant poaplankius, arba pasirinkite kitą aplanką nustatymuose, skiltyje „Skaitymas“, kaip „Žodynų aplankas“ (išplėstinis nustatymas). Pirmą kartą ieškant kiekvienam žodynui paruošiamas nedidelis indeksas, tai trunka akimirką.\n\nSkydelyje puslapių mygtukai arba „Aukštyn“ ir „Žemyn“ slenka ilgus apibrėžimus, o „Atgal“ jį uždaro. Naudojant lietimą, palieskite už jo ribų, kad uždarytumėte."
