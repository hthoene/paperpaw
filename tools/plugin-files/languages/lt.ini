power.plugin.name = Maitinimas
power.plugin.description = Pasirenka maitinimo režimą, ranka arba pagal bateriją: įprastas, taupymas, neprisijungus.
power.plugin.how = "„Maitinimas“ pasirenka, kaip PaperPaw naudoja bateriją: „Įprastas“, „Taupymas“ ar „Neprisijungus“. „Taupymas“ tai, kas gali palaukti, daro tinkamesnėmis akimirkomis; „Neprisijungus“ palieka radijo ryšį išjungtą. „Auto“ pasirenka pagal bateriją.\n\nRežimą keiskite greitajame skydelyje, kur „Maitinimas“ rodo režimus greta vienas kito, arba nustatymuose skiltyje „Maitinimas“. Ten taip pat nustatote lygius, kuriuose „Auto“ persijungia į „Taupymas“ ir į „Neprisijungus“, ir ar kraunant lieka „Įprastas“.\n\nBūsenos juostose „Maitinimo režimas“ rodo lapelį taupant ir perbrauktą Wi-Fi veikiant neprisijungus, o įprastame režime nerodo nieko.\n\nPalaikykite maitinimo mygtuką, kad atsidarytų nedidelis meniu: „Užmigdyti“, „Išjungti“ (kur PaperPaw gali), „Paleisti iš naujo“, o jutikliniuose įrenginiuose „Užrakinti lietimą“ ar „Atrakinti lietimą“. Trumpas paspaudimas, kaip ir anksčiau, užmigdo įrenginį. „Atgal“ palieka meniu."
