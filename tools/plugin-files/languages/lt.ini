anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Mokosi laiko sulaukusias „Anki“ korteles jūsų kompiuteryje ir siunčia atsakymus atgal per priedą „AnkiConnect“.
anki.plugin.how = "„Anki“ leidžia skaitykloje mokytis korteles, kurių laikas jūsų kompiuterio „Anki“ programoje atėjo, ir siunčia jūsų atsakymus atgal. Jis naudoja nemokamą priedą „AnkiConnect“ (priedo kodas 2055492159) ir niekada „AnkiWeb“. Iš pradžių jis išjungtas: pridėkite jį iš įskiepių parduotuvės.\n\nKompiuteryje: įdiekite „AnkiConnect“ programoje „Anki“ (Įrankiai, Priedai, Gauti priedų) ir paleiskite „Anki“ iš naujo. Sinchronizuojant „Anki“ turi būti atidaryta.\n\nIš pradžių „AnkiConnect“ atsako tik kompiuteriui, kuriame veikia (127.0.0.1), todėl skaitykla jo nepasiekia. Atidarykite Įrankiai, Priedai, AnkiConnect, Konfigūracija ir nustatykite „webBindAddress“ į „0.0.0.0“ (klausytis namų tinkle). Prievadas „webBindPort“ yra 8765, jei jo nepakeisite. Jei ten nustatote „apiKey“, čia įveskite tą patį raktą. Pakeitę konfigūraciją paleiskite „Anki“ iš naujo ir leiskite „Anki“ per kompiuterio užkardą, jei ji paklaus. Naudokite tai tik tinkle, kuriuo pasitikite: kiekvienas jame gali pasiekti „AnkiConnect“, todėl raktas yra gera mintis.\n\nSkaitykloje: atidarykite „Anki“ iš Įrankių, tada skiltyje „Kompiuteris“ įveskite kompiuterio adresą (pavyzdžiui, 192.168.1.20), prievadą, jei jis ne 8765, ir API raktą, jei jį nustatėte. Pasirinkite kaladę arba palikite tuščią, jei norite visų kaladžių. Tada, įjungę Wi-Fi, pasirinkite „Sinchronizuoti su Anki“: pirmiausia išsiunčiami laukiantys atsakymai, paskui paimamos laiko sulaukusios kortelės (ir jūsų nustatytas naujų kortelių skaičius), daugiausia 50. Pasirinkite „Mokytis“, kad jas peržiūrėtumėte be tinklo: parodykite atsakymą ir įvertinkite jį „Dar kartą“, „Sunku“, „Gerai“ arba „Lengva“. Jūsų atsakymai laikomi skaitykloje, taip pat be Wi-Fi, ir su kitu sinchronizavimu nueina į „Anki“. „Anki“ sprendžia, kada kortelė sugrįžta: kortelė, kurią įvertinote „Dar kartą“, vėlesnio sinchronizavimo metu paimama iš naujo, kai tik „Anki“ pasako, kad jos laikas atėjo.\n\n„Sinchronizuoti atidarius“ nustatymuose sinchronizuoja kaskart atidarius ekraną. Paspaudus mygtuką tinklas niekada nenaudojamas."
