setup.plugin.name = Pradinis nustatymas
setup.plugin.description = Trumpas vadovas per svarbiausius nustatymus pirmą kartą paleidus.
setup.plugin.how = "Pradinis nustatymas yra trumpas vadovas per svarbiausius nustatymus, rodomas vieną kartą, kai PaperPaw paleidžiamas pirmą kartą. Kiekvienas puslapis klausia vieno dalyko, pvz., kalbos, mygtukų, teksto dydžio, laiko juostos, Wi-Fi ar kelių pridėtinų įskiepių, ir jau pasirinktas pagrįstas atsakymas, todėl „Toliau“ visada tinka. Žingsniai, kurių šiam įrenginiui nereikia, praleidžiami.\n\nPalieskite mygtukus arba naudokite mygtukus aukštyn ir žemyn bei „Pasirinkti“. „Praleisti“ pirmame puslapyje iš karto palieka nustatymą. Paskutinis puslapis pasako, iš kur ateina jūsų knygos.\n\nNorėdami jį paleisti dar kartą, atidarykite nustatymus ir pasirinkite „Nustatyti PaperPaw“. Viską, ką čia pasirenkate, vėliau galima pakeisti nustatymuose."
