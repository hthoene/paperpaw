rules.plugin.name = Taisyklės
rules.plugin.description = Kai kas nors nutinka, kažką daro: pvz., naktinis režimas 22:00.
rules.plugin.how = "Taisyklė pati kažką daro, kai kas nors nutinka: naktinis režimas įjungiamas kiekvieną dieną 22:00 arba katalogai sinchronizuojami, kai paleidžiamas PaperPaw.\n\nTaisyklės yra nustatymuose, skiltyje „Pritaikymas“, kaip „Taisyklės“. „Pridėti taisyklę“ klausia „Kada?“ (paleidžiamas PaperPaw, paros laikas, atidaroma ar uždaroma knyga, baterija, krovimas, jungiklis ir kita) ir „Kas tada?“ (vykdyti veiksmą, įjungti ar išjungti jungiklį, nustatyti skaičių, parodyti pranešimą). Palieskite taisyklę, kad ją pristabdytumėte; palaikykite ją (su mygtukais palaikykite „Pasirinkti“) sąlygai, pvz., „Tarp dviejų paros laikų“, arba kad ją pašalintumėte.\n\nPasirenkami veiksmai, jungikliai ir skaičiai sugrupuoti pagal įskiepį: pasirinkite įskiepį, tada tai, ką jis siūlo; „Atgal“ vėl išeina iš jo. Veiksmas, veikiantis rodomą ekraną, pvz., „Atgal“ ar „Kitas puslapis“, daro tai, ką darytų paspaustas ten.\n\nLaikai galioja kad ir koks ekranas būtų atidarytas. Dvi taisyklės, kurios vis panaikina viena kitą, sustoja po kelių žingsnių."
