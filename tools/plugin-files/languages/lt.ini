news.plugin.name = Naujienos
news.plugin.description = Atsisiunčia naujienų kanalus (RSS, Atom) kaip knygas skaitymui.
news.plugin.how = "„Naujienos“ paverčia RSS ar Atom kanalus knygomis. Kiekvienas kanalas tampa viena knyga bibliotekos aplanke „News“, su naujausiais straipsniais kaip paprastu tekstu, skaitoma kaip bet kuri kita knyga.\n\nAtidarykite „Naujienos“ iš meniu „Įrankiai“ ir pasirinkite „Pridėti kanalą“; jo adresas yra laikraščio ar tinklaraščio svetainėje. „Gauti naujienas“ atsisiunčia visus kanalus ir pakeičia ankstesnes knygas. Palaikykite kanalą (su mygtukais palaikykite „Pasirinkti“), kad jį atsisiųstumėte ar pašalintumėte atskirai. Pašalinto kanalo knyga lieka bibliotekoje.\n\nAtsisiuntimui reikia tinklo. „Straipsnių kanale“ (Nustatymai, Biblioteka) nustato, kiek straipsnių laiko kiekviena knyga. Valdiklis „Naujienų antraštės“ rodo jas pradžios ekrane."
