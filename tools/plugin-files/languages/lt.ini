fonts-browser.plugin.name = Daugiau šriftų
fonts-browser.plugin.description = Rodo šriftus iš interneto, kiekvieną su pavyzdžiu, ir atsisiunčia juos skaitymui.
fonts-browser.plugin.how = "„Daugiau šriftų“ išvardija šriftus iš interneto šriftų bibliotekos, kiekvieną pavadinimą parašytą jo paties šriftu, ir atsisiunčia tuos, kuriais norite skaityti.\n\nJį rasite šriftų sąrašo pabaigoje, ten, kur pasirenkamas skaitymo šriftas: nustatymuose skiltyje „Skaitymas“, kaip „Šriftas“; būsenos juostų šriftui yra tas pats įrašas. Palieskite šriftą (su mygtukais spauskite „Pasirinkti“), kad pamatytumėte jį didesnį su pavyzdiniu sakiniu, ir pasirinkite „Atsisiųsti“. Kol siunčiama, puslapį galite palikti. Kai baigta, pasirinkite „Skaityti su (šrifto pavadinimas)“ arba „Naudoti būsenos juostoms“. „Atnaujinti“ atsisiunčia naujesnę versiją, „Pašalinti“ ištrina šriftą iš įrenginio.\n\nReikia Wi-Fi.\n\nJŪSŲ ŠRIFTAI\n\nLygiai šalia „Daugiau šriftų“ tame pačiame sąraše yra „Jūsų šriftai“, kuris rodo šią žinyno dalį. Jūsų šriftas yra .ttf ar .otf failas, pavyzdžiui, iš Google Fonts.\n\nAndroid ir kituose įrenginiuose, kurie piešia šriftų failus: nukopijuokite failą į aplanką fonts (Android: PaperPaw/fonts bendroje atmintyje), paleiskite PaperPaw iš naujo ir pasirinkite šriftą nustatymuose skiltyje „Skaitymas“, kaip „Šriftas“.\n\nXteink X4 ir X4 Pro: šios skaityklės skaito šriftų paketus, o ne šriftų failus, nes šriftų failai netilptų jų atmintyje. Paketą sukurkite kompiuteryje su paperpaw-fontgen, kiekvienam turimam stiliui (įprastas būtinas):\n\npaperpaw-fontgen --family \"Mano šriftas\" --regular ManoSriftas-Regular.ttf --bold ManoSriftas-Bold.ttf --italic ManoSriftas-Italic.ttf plugins\n\nTai sukuria aplanką plugins/font-mano-sriftas. Nukopijuokite jį į aplanką plugins atminties kortelėje, paleiskite iš naujo ir pasirinkite „Mano šriftas“ kaip „Šriftas“. Vieno stiliaus paketas lotyniškoms raidėms užima apie pusę megabaito; praleisti stiliai piešiami įprastu. Įrankis pasako, kiek jūsų prašomų raidžių šriftas turi (--chars latin,cyrillic,greek prideda rašmenis): šriftas be jūsų knygos raidžių jų parodyti negali, todėl ieškokite tokio, kuris apima jos rašmenis.\n\nŠriftai iš „Daugiau šriftų“ veikia taip pat ir kompiuterio nereikalauja.\n\nNorėdami ryškesnio smulkaus teksto e. rašalo ekrane, prie komandos pridėkite --hinting light: ji pritaiko raides prie taškų tinklelio, kaip padaryti numatytieji šriftai. Be jos raidės piešiamos taip, kaip jas sukūrė šrifto dizaineris; --hinting normal ir --hinting mono pritaiko jas stipriau. Šriftus su ženklais, pvz., arabų ar devanagari, geriausia palikti be jos."
