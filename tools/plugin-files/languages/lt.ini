bluetooth.plugin.how = "„Bluetooth“ susieja nuotolinio valdymo pultus, klaviatūras ir jutiklius su skaitykla, kur ji turi „Bluetooth“ (X4 Pro).\n\n„Pridėti įrenginį“ ieško to, kas yra šalia; prieš tai įrenginį perjunkite į susiejimo režimą. Pasirinkite jį ir patvirtinkite skaitykloje (kur rodomas skaičius, palyginkite). Tada pulto ar klaviatūros klavišai verčia puslapius ir juda per meniu; ką daro kiekvienas klavišas, keiskite skiltyje „Valdymas“.\n\n„Pultai“ nurodo, kada jų klavišai veikia: kai čia įjungta, skaitant (prijungta, kol atidaryta knyga, taupo bateriją) arba visada. Meniu mygtukas arba ilgas įrenginio paspaudimas jį pamiršta.\n\nJutiklis skirtas įskiepiams: įjunkite, kuris įskiepis gali jį naudoti. „Bluetooth“ išjungtas, kai jo niekas nenaudoja."
