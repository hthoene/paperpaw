file-manager.plugin.name = Failų tvarkyklė
file-manager.plugin.description = Kiekvienas įrenginio aplankas ir failas: atidarykite, pervadinkite, perkelkite, kopijuokite ir ištrinkite juos.
file-manager.plugin.how = "Failų tvarkyklė rodo kiekvieną įrenginio atminties aplanką ir failą, ne tik jūsų knygas, ir leidžia juos atidaryti, pervadinti, perkelti, kopijuoti ir ištrinti bei kurti naujus aplankus.\n\nAtidarykite „Failai“ iš meniu „Įrankiai“. Palieskite aplanką, kad įeitumėte į jį; „Atgal“ grąžina į aukštesnį aplanką. Palieskite failą arba palaikykite bet kurį įrašą (su mygtukais palaikykite „Pasirinkti“), kad pamatytumėte, ką su juo galima daryti. „Perkelti“ ir „Kopijuoti“ įsimena įrašą: eikite į aplanką, kuriame jis turi būti, ir apačioje esančioje juostoje pasirinkite „Įklijuoti čia“. Su mygtukais į juostą patenkate paspaudę „Žemyn“ nuo paskutinio įrašo.\n\nFailai ir aplankai, prasidedantys tašku, pvz., paties PaperPaw duomenys, paslėpti. Norėdami juos pamatyti, nustatymuose skiltyje „Biblioteka“ įjunkite „Paslėpti failai“."
