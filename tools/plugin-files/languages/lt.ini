vocabulary.sd.readme = "Kortelės iš failų\n\nĮdėkite čia po failą kiekvienai kaladei: Spanish.tsv sukuria kaladę Spanish.\nFailai: .tsv, .csv ar .txt, įrašyti UTF-8, arba .apkg: Anki kaladė, eksportuota pažymėjus „Palaikyti senesnes Anki versijas“. Pirmieji trys jos pastabų laukai tampa priekiu, galu ir pavyzdžiu; jos planavimas ir medija neskaitomi, o PaperPaw niekada nerašo Anki failo.\n\nViena kortelė eilutėje: priekis, galas ir pavyzdys (nebūtina), atskirti tabuliacijos ženklu, kableliu ar kabliataškiu. Pirmoji eilutė gali pavadinti stulpelius: front, back, example. Pavyzdys:\n\nkatė\tcat\tKatė miega.\n\nTada atidarykite „Kortelės“ skaitykloje, pasirinkite „Kortelės iš SD kortelės“ ir „Atnaujinti kaladas“.\n\nVerta žinoti:\n- Kaladės lieka skaitykloje su tuo, ką išmokote. Failas skaitomas, kai yra naujas ar pakeistas, o jo kortelės pridedamos prie kaladės arba ten pakeičiamos.\n- Pakeitus kortelės galą ar pavyzdį faile, kortelė pasikeičia ir išlaiko jūsų eigą.\n- Pakeitus kortelės priekio tekstą, tai laikoma nauja kortele, o sena pradedama iš naujo. Kortelės atpažįstamos pagal priekio tekstą, tarpai ir didžiosios raidės neskaičiuojami. Įrašius kaladę į failą („Kortelės iš SD kortelės“, „Įrašyti kaladę į kortelę“), kiekviena kortelė gauna numerį stulpelyje id: pakeiskite ten priekį, palikite pirmąsias dvi failo eilutes tokias, kokios jos yra, ir kortelė išlaikys tai, ką išmokote.\n- Įrašant įrašomos kaladės kortelės. Tai, kas buvo faile ir nėra kortelė (eilutė be priekio), neišsaugoma; ten buvęs failas nukopijuojamas į _vardas.bak.tsv.\n- Įrašykite failą kaip CSV UTF-8 (ne UTF-16 ir ne skaičiuoklės savo formatu). Failas, didesnis nei 4 MiB ar turintis daugiau nei 20 000 eilučių, neskaitomas: padalykite jį.\n- Faile ištrinta eilutė neištrina kortelės kaladėje, nebent tai kaladei įjungsite „Pašalinti“ ties „kortelės, kurių nėra faile“. Tada kortelė dingsta kartu su tuo, ką išmokote.\n- Failai, kurių pavadinimai prasideda _, neskaitomi.\n"
