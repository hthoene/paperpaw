pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Susikaupimo laikmatis su darbo ir pertraukų ratais, valdikliais ir dienos skaičiavimu.
pomodoro.plugin.how = "Pomodoro laikmatis: dirbkite susikaupimo ratais, tada ilsėkitės. Jo nereikia nustatinėti: 25 minutės susikaupimo, 5 poilsio, o po keturių ratų – 15 minučių ilga pertrauka.\n\nAtidarykite „Pomodoro“ įrankių meniu ir paspauskite „Pradėti“ arba pridėkite jo valdiklius į pradžios ekraną (palaikykite pradžios ekraną, tada pridėkite valdiklį): „Pomodoro laikmatis“ rodo fazę ir likusias minutes, „Pomodoro pradėti / pristabdyti“ yra mygtukas, o „Pomodoro šiandien“ skaičiuoja jūsų užbaigtus ratus su jūsų dienos tikslu. Palietus laikmatį jis pradedamas ar pristabdomas; palaikykite, kad atidarytumėte visą ekraną.\n\nLaikmatis tęsia darbą, kai išeinate iš ekrano, ir po paleidimo iš naujo tęsia pagal laikrodį. Kol skaitykla miega, niekas neveikia: per tą laiką pasibaigusi fazė pranešama, kai ji pabunda. Pranešimas pasako, kada fazė baigėsi. Siekiant taupyti bateriją, laikrodis atnaujinamas kartą per minutę (visame ekrane paskutinę minutę – kas dešimt sekundžių) ir niekada neleidžia skaityklei nemiegoti.\n\nNustatymuose skiltyje „Pomodoro“ nustatote trukmes ir rato skaičių rinkinyje bei ar kita fazė prasideda savaime. Skiltyje „Daugiau“: ekrano mirktelėjimas ar priekinės šviesos blykstelėjimas fazei pasibaigus ir dienos tikslas."
