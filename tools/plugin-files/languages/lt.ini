aids.plugin.name = Skaitymo pagalba
aids.plugin.description = Paryškintos žodžių pradžios, pakeisti žodžiai, paveikslėliai: tekstas, kaip norite.
aids.plugin.how = "Skaitymo pagalba keičia, kaip skaitant atrodo knygos tekstas. Ji galioja kiekvienai knygai. Paryškintos žodžių pradžios ir žodžių keitimas iš pradžių išjungti.\n\nJuos rasite nustatymuose skiltyje „Skaitymas“, dalyje „Skaitymo pagalba“. „Paryškintos žodžių pradžios“ pusę kiekvieno žodžio parašo paryškintai, o kai kuriems taip lengviau sekti tekstą. „Keisti žodžius“ priima porų sąrašą, pvz., „zmogus = žmogus; sviesa = šviesa“, atskirtą kabliataškiais.\n\nKeičiami tik sveiki žodžiai, tiksliai taip, kaip juos įvedėte, todėl ilgesnio žodžio dalis niekada nepakeičiama. Pati knygos failo turinys nekeičiamas.\n\nKnygų paveikslėlius galima rodyti (iš pradžių taip), pakeisti trumpa eilute, pvz., „[Paveikslėlis: laivas jūroje]“, naudojančia paveikslėlio aprašą, arba praleisti. Tada puslapyje lieka daugiau vietos tekstui, o nerodomas paveikslėlis nėra dekoduojamas, todėl puslapiai verčiami greičiau. Komiksai ir kitos iš paveikslėlių sudarytos knygos nekeičiamos."
