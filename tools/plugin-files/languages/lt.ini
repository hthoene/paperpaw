files.plugin.name = Failų naršyklė
files.plugin.description = Rodo įrenginio knygas ir aplankus ir juos atidaro.
files.plugin.how = "Biblioteka išvardija jūsų bibliotekos aplanke esančias knygas, kiekvieną su viršeliu, pavadinimu, autoriumi ir kiek jos perskaityta. Paskutinė skaityta knyga stovi viršuje kaip kortelė, todėl tęsti skaitymą užtenka vieno palietimo arba vieno „Pasirinkti“ paspaudimo. Kol biblioteka ieško knygų, ji nurodo, kiek jų jau rado.\n\nVirš knygų pasirinkite, kas rodoma: visos, skaitomos, neskaitytos ar perskaitytos knygos arba lentynos (pagal autorių, seriją, gairę, mėgstamiausias, kitą kiekvienos pradėtos serijos knygą). Palieskite knygą, kad ją skaitytumėte; palaikykite ją (su mygtukais palaikykite „Pasirinkti“), kad ją atidarytumėte, pažymėtumėte kaip perskaitytą ar neskaitytą, pamatytumėte jos informaciją, perkeltumėte į archyvą ar ištrintumėte. Palieskite pavadinimą, kad atsidarytų bibliotekos meniu: kaip knygos rūšiuojamos ir rodomos, paieška, bibliotekos aplankas ir nustatymai.\n\nBibliotekos aplankas nustatomas nustatymuose, skiltyje „Biblioteka“, kaip „Bibliotekos aplankas“; ten taip pat galite rodyti knygas kaip viršelių tinklelį. Visiems kitiems failams naudokite „Failai“ meniu „Įrankiai“."
