reader.plugin.name = Skaitymas
reader.plugin.description = Rodo knygas puslapis po puslapio, su turiniu ir skaitymo nustatymais.
reader.plugin.how = "Skaitymo ekranas rodo knygas puslapis po puslapio. Atidarykite knygą iš bibliotekos; paskutinė knyga gali vėl atsidaryti paleidus (nustatymas „Paleidus atidaryti paskutinę knygą“).\n\nPalieskite ekrano kairę ar dešinę arba naudokite puslapių mygtukus, kad verstumėte puslapius. Palieskite vidurį arba paspauskite „Pasirinkti“, kad atsidarytų skaitymo meniu: „Turinys“, „Paieška“, „Eiti į puslapį“, „Šriftas ir maketas“, „Žymės ir paryškinimai“ ir daugiau. Žemyn nuo viršutinio krašto atidaro greitąjį skydelį, aukštyn nuo apatinio krašto grįžtama į pradžią; taip pat ir palaikius „Atgal“.\n\nPalaikykite „Pasirinkti“ (arba paveikslėlį), kad pamatytumėte paveikslėlį per visą ekraną: „Kairėn“ ir „Dešinėn“ eina per puslapio paveikslėlius. „Pasirinkti“ padidina iki 2x, 3x ir grąžina (jutikliniame ekrane – dukart palieskite); padidinus „Kairėn“ ir „Dešinėn“ slenka į šoną, puslapių mygtukai (arba perbraukimai) juda toliau skersai ir žemyn. „Atgal“ grįžta į pritaikytą rodinį, tada į puslapį (jutikliniame ekrane palaikykite, kad išeitumėte). Palieskite viršutinį dešinįjį kampą, kad pridėtumėte žymę. Palaikykite žodį, kad jį paryškintumėte. Su mygtukais palaikykite „Kairėn“: „Kairėn“ ir „Dešinėn“ juda po žodį, puslapių mygtukai – po eilutę, palaikant – iki puslapio kraštų ir po pastraipą; „Pasirinkti“ atidaro paryškinimo juostą žodžiui, palaikius „Pasirinkti“ ji išplečiama iki sakinio ir pastraipos (tada „Kairėn“ ir „Dešinėn“ perkelia pabaigą, palaikant – pradžią). Pažymėjimas tęsiasi per puslapių vertimus. „Eksportuoti kaip Markdown“ išsaugo jūsų pastabas."
