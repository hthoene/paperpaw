lock.plugin.name = Ekrano užraktas
lock.plugin.description = PIN kodas, piešinys ar slaptažodis, kai įrenginys pabunda; lietimas užrakinamas skaitant.
lock.plugin.how = "Ekrano užraktas prašo PIN kodo, piešinio ar slaptažodžio, kai PaperPaw paleidžiamas ir kai įrenginys pabunda. Iš pradžių jis išjungtas. Jis apsaugo tik nuo atsitiktinio naudojimo: kodas ir klaidingų bandymų skaičius laikomi SD kortelėje, todėl kas išima kortelę, ją redaguoja ar pakeičia, apeina užraktą.\n\nNustatykite jį nustatymuose, skiltyje „Įrenginys“, „Ekrano užraktas“: įveskite dabartinį kodą, jei jis yra, pasirinkite rūšį, tada naująjį kodą du kartus. Piešinys siūlomas tik jutikliniuose ekranuose.\n\nPo penkių klaidingų bandymų kitas laukia pusę minutės. „Užrakinti dabar“ užrakina iš karto ir gali būti priskirtas mygtukui, gestui ar taisyklei. „Užrakinti pabudus“ galima išjungti, tada užrakina tik tikras paleidimas (įjungimas ar paleidimas iš naujo), išskyrus tuos atvejus, kai kiekvienas pabudimas yra paleidimas, kaip X4 veikiant iš baterijos.\n\nŠalia – lietimo užraktas: „Užrakinti lietimą“ greitajame skydelyje ir skaitymo meniu padaro taip, kad palietimai, perbraukimai ir rašiklis nieko nedaro, o mygtukai veikia toliau, pvz., kad galėtumėte skaityti laikydami ranką ant ekrano. Norėdami atrakinti, du kartus palieskite vienu pirštu ir akimirką palaikykite jį nuspaudę; palaikius maitinimo mygtuką atsidaro maitinimo meniu, kuriame „Atrakinti lietimą“ tai padaro mygtukais; X4 Pro palaikius pradžios mygtuką atrakinama iš karto."
