reading-goal.plugin.name = Skaitymo tikslas
reading-goal.plugin.description = Minutės skaitymui per dieną ir katė pradžios ekrane, kurios nuotaika seka šiandienos skaitymą.
reading-goal.plugin.how = "Jūsų pradžios ekrane esanti katė rodo, kaip sekasi šiandien skaityti: nuliūdusi, kol dar neskaitėte, šiaip sau, kai paskaityta šiek tiek, patenkinta nuo pusės dienos tikslo, laiminga, kai jį pasiekiate.\n\nPridėkite valdiklį „Skaitymo katė“ į pradžios ekraną (palaikykite pradžios ekraną, tada pridėkite valdiklį) arba kaip miego ekraną pasirinkite „Šiandienos skaitymo katė“. Palietus katę atsidaro dienos tikslas; tai skaitymo statistikos, skaičiuojančios jūsų skaitymo minutes, tikslas.\n\nNustatymuose, skiltyje „Skaitymas“, „Patenkinta nuo“ ir „Laiminga nuo“ nustato, nuo kokios tikslo dalies katė yra patenkinta ar laiminga, o „Savi paveikslėliai“ – paveikslėlių aplanką (sad, meh, content ir happy), rodomų vietoj kačių. Paveikslėliai yra PNG ar JPEG failai; be aplanko rodomos katės."
