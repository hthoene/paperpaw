translate.plugin.description = Verčia pažymėtą tekstą internetu su DeepL.
translate.plugin.how = "„Vertimas“ verčia pažymėtą tekstą internetu su DeepL. Pažymėkite tekstą knygoje ir pažymėto teksto meniu pasirinkite „Versti“: vertimas pasirodo virš puslapio kaip žodyno įrašas. Puslapių mygtukai ar palietimai jį slenka, o „Pasirinkti“ ar palietimas jo gale uždaro.\n\nReikia tinklo ir jūsų pačių DeepL API rakto, nemokamo deepl.com (DeepL API Free, apie 500 000 ženklų per mėnesį). Kol jo nėra, skydelis tai pasako, o palietimas jo paprašo.\n\nNustatymuose, skiltyje „Skaitymas“, dalyje „Vertimas“, „Versti į“ nustato kalbą; iš pradžių tai PaperPaw kalba."
