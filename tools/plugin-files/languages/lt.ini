wifi.plugin.name = Wi-Fi
wifi.plugin.description = Prisijungia prie Wi-Fi tinklų, kai reikia, ir paskui išjungia radijo ryšį.
wifi.plugin.how = "„Wi-Fi“ prisijungia prie tinklo, kai įskiepiui reikia interneto (katalogui, sinchronizavimui, parduotuvei, perkėlimui), ir išjungia radijo ryšį po minutės, kai niekas jo nenaudoja, arba iš karto, kai rodoma pradžia ar knyga, kad būtų taupoma baterija ir atmintis.\n\nAtidarykite „Wi-Fi“ nustatymuose arba per „Wi-Fi“ elementą būsenos juostoje. „Tinklai“ išvardija tinklus zonoje; pasirinkite vieną ir įveskite jo slaptažodį arba pasirinkite „Nustatyti telefonu“ ir įveskite pavadinimą bei slaptažodį telefono naršyklėje, o ne įrenginyje. „Pamiršti“ pašalina išsaugotą tinklą.\n\nSlaptažodžiai lieka kortelėje, saugiai laikomi, ir daugiau niekada nerodomi. Skiltyje „Prisijungti pagal poreikį“ nustatote, kiek laiko Wi-Fi lieka įjungtas po paskutinio naudojimo, ar jis lieka įjungtas kraunant ir kuris išsaugotas tinklas pirmas, kai zonoje yra keli."
