sleep.plugin.name = Miego ekranas
sleep.plugin.description = Rodo miegančią katę, knygos viršelį, jūsų paveikslėlius ar pranešimą, kol įrenginys miega.
sleep.plugin.how = "Miego ekranas nusprendžia, ką ekranas rodo, kol įrenginys miega. E. rašalas išlaiko vaizdą be maitinimo.\n\nPasirinkite jį nustatymuose, skiltyje „Įrenginys“, „Miego ekranas“, per „Rodyti“: miegančią katę (numatytoji), knygos viršelį, mano paveikslėlius, logotipą ir užrašą „Miegama“, valdiklius, puslapį tokį, koks jis yra, arba puslapį su paveikslėliu. „Mano paveikslėliai“ rodo paveikslėlių aplanko failus vieną po kito.\n\nBe viršelio ar paveikslėlio rodoma katė. Kur miego ekraną piešia pati sistema, šie nustatymai paslėpti.\n\nIšjungimo ekranas, „Rodyti išjungus“, nupiešiamas vieną kartą, kai įrenginys išjungiamas, iš maitinimo meniu arba praėjus laikui, nustatytam „Išjungti po miego“ (ne tada, kai maitinimą nutraukia silpna baterija). Jis toks kaip miego ekranas, nebent pasirinktumėte logotipą ir užrašą „Išjungta“, katę, viršelį ar mano paveikslėlius. Kitas įskiepis gali jam pasiūlyti ekraną.\n\nPaleidimo ir paleidimo iš naujo ekranas, „Rodyti paleidžiant“ ir „Rodyti paleidžiant iš naujo“, yra paties įrenginio, nebent kitas įskiepis pasiūlo jiems ekraną. Įrenginiui paleidžiant įskiepiai dar neveikia: paleidimui pasirinktas ekranas nupiešiamas iš anksto, kai įrenginys išjungiamas ar paleidžiamas iš naujo, ir parodomas kitą kartą paleidžiant. Ekranas, kuris laiku nepasiruošia, arba sugadintas paveikslėlis užleidžia vietą paties įrenginio ekranui; įrenginys bet kuriuo atveju išsijungia arba paleidžiamas iš naujo."
