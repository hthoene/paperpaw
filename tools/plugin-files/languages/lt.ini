picture-home.plugin.name = Pradžios ekranas su paveikslėliu
picture-home.plugin.description = Pradžios ekranas su jūsų pačių paveikslėliu už valdiklių ir jūsų sukonfigūruojama būsenos juosta.
picture-home.plugin.how = "„Pradžios ekranas su paveikslėliu“ pakeičia pradžios ekraną, kol jis įjungtas: jūsų pačių paveikslėlis už valdiklių ir jūsų sudėlioti valdiklių ir įrankių puslapiai. Išjunkite jį įskiepių tvarkyklėje ir vėl bus integruotasis pradžios ekranas su savais puslapiais.\n\nPaveikslėlius (JPEG, PNG ar GIF) įdėkite į kortelės aplanką (pagal numatytąjį wallpapers), tada pasirinkite vieną nustatymuose, Pritaikymas, „Pradžios ekranas su paveikslėliu“. „Pritaikymas“ nurodo, kaip jis užpildo ekraną (užpildyti, visas paveikslėlis, ištempti, originalus dydis, plytelės), „Padėtis“ – kuri dalis lieka, „Mastelis“ – kaip didelis, o „Šviesinti paveikslėlį“ – kaip blyškus: blyškesnis paveikslėlis valdiklius daro lengviau skaitomus. Paveikslėlis paruošiamas vieną kartą kiekvienam ekrano dydžiui, tai užtrunka akimirką.\n\nValdikliai stovi ant plokštelių virš paveikslėlio. Puslapį sutvarkykite kaip integruotajame pradžios ekrane: pieštuku po puslapiu arba „Redaguoti pradžios ekraną“ meniu.\n\nBūsenos juosta (laikas, Wi-Fi, baterija ar tai, ką pasirenkate) gali būti įjungta, išjungta ar automatinė, viršuje ar apačioje, per visą plotį arba maža piliulė kairėje, viduryje ar dešinėje, ant šviesios, tamsios ar pilkos plokštelės arba ant paties paveikslėlio. Eilutė, nurodanti mygtukus (X4), taip pat gali būti įjungta, išjungta ar automatinė. „Automatinė“ reiškia, kad mygtuko paspaudimas ją parodo kelioms sekundėms; tas paspaudimas daugiau nieko nedaro.\n\n„Paveikslėlio atvaizdavimas“ nurodo, kaip paveikslėlis piešiamas: „Pilkumo lygiai“ – visais ekrano turimais pilkumo atspalviais (X4 lėčiau), „Taškuotas“ – juodais ir baltais taškais (greitai) arba „Automatinis“, kaip integruotajame pradžios ekrane: piešiant ekraną pilkumo lygiai, po pirmo pakeitimo taškai. Kur ekranas neturi pilkumo lygių, pilkumo lygiai pakeičiami taškais."
