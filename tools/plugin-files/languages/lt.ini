weather.plugin.name = Orai
weather.plugin.description = Dabartiniai ir artimiausių dienų orai kaip valdikliai, iš Open-Meteo.
weather.plugin.how = "„Orai“ rodo dabartinius ir artimiausių dienų orus kaip pradžios ekrano valdiklius, iš Open-Meteo, kuriam nereikia paskyros ar rakto. „Orai dabar“ rodo temperatūrą, oro sąlygas ir daugiau pasirenkamų duomenų; „Prognozė“ rodo artimiausias dienas eilute ar sąrašu.\n\nPirmiausia pasirinkite vietą: nustatymuose, skiltyje „Orai“, „Vieta“ (įveskite pavadinimą, tada pasirinkite iš rastų vietų). Siunčiamos tik jos koordinatės ir tik kol rodomas orų valdiklis. Valdiklius pridėkite redaguodami pradžios ekraną.\n\nOrai gaunami ne dažniau, nei nurodo „Atnaujinti ne dažniau kaip kas“, ir tik esant tinklui: Wi-Fi jis niekada pats neįjungia.\n\nOrų duomenys iš Open-Meteo.com (https://open-meteo.com), pagal Creative Commons Attribution 4.0 licenciją (CC BY 4.0)."
