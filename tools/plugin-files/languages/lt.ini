keyboard.plugin.name = Klaviatūra
keyboard.plugin.description = Įveda tekstą ekrane, lietimu arba mygtukais.
keyboard.plugin.how = "Klaviatūra atsidaro, kai tik ko nors reikia tekstui: paieškai, slaptažodžiui, pastabai ar nustatymui. Ji veikia lietimu ir vien tik su mygtukais.\n\nSu mygtukais „Kairėn“ ir „Dešinėn“ juda išilgai eilutės, puslapių mygtukai – tarp eilučių, „Pasirinkti“ paspaudžia klavišą, o „Atgal“ atšaukia; „Kairėn“ ir „Dešinėn“ eina ratu aplink eilutę, o „Aukštyn“ ir „Žemyn“ lieka jūsų stulpelyje. „Shift“ kitą raidę padaro didžiąja; paspaudus du kartus – visas didžiąsias, dar kartą – nutraukia. Palaikykite raidę (su mygtukais: palaikykite „Pasirinkti“ ant jos), kad gautumėte jos didžiąją, pasirenkamą iš karto, ir diakritikus, pvz., é ir è; vokiškai ä, ö, ü ir ß taip gaunami iš a, o, u ir s (su mygtukais klaviatūra tai pasako ant tų raidžių). „Gerai“ baigia; su mygtukais palaikykite „Atgal“, kad baigtumėte iš bet kur (vien „Atgal“ atšaukia), arba palaikykite „Pasirinkti“ ant klavišo, kuris nėra raidė. „Įklijuoti“ įterpia iškarpinės tekstą, o „Telefonas“, kur siūloma, leidžia rašyti telefone.\n\nNustatymuose skiltyje „Įrenginys“, „Klaviatūra“: „Klaviatūros išdėstymai“ pasirenka išdėstymus. Pagal numatytąjį seka meniu kalbą; esant keliems, klavišas perjungia juos. „Umlauto klavišai“ vietoj to suteikia ä, ö, ü ir ß atskirus klavišus. „Dydis“ klavišus ir raides padaro didesnius; vien su mygtukais eilutės lieka tokios kaip kompiuterio klaviatūros. Jutikliniuose ekranuose „Klavišų forma“ keičia, kaip klavišai atrodo. „Automatinės didžiosios raidės“ pradeda kiekvieną sakinį didžiąja raide."
