format-docx.plugin.name = DOCX dokumentai
format-docx.plugin.description = Atidaro .docx failus, tokius, kokius išsaugo Word ir kitos programos.
format-docx.plugin.how = "Atidaro .docx dokumentus kaip knygas: antraštes su turiniu, sąrašus, lenteles, pusjuodį ir kursyvą, nuorodas ir paveikslėlius (JPEG, PNG, GIF).\n\nĮdėkite failus į bibliotekos aplanką ir atidarykite iš bibliotekos. Pavadinimas ir autorius imami iš dokumento savybių. Išnašos, antraštės ir poraštės bei komentarai nerodomi."
format-docx.title = DOCX dokumentas
format-epub.plugin.name = EPUB
format-epub.plugin.description = Atidaro EPUB knygas su jų stiliais, turiniu ir paveikslėliais.
format-epub.plugin.how = "EPUB knygos atsidaro iš bibliotekos kaip bet kuri kita knyga, su turiniu, paveikslėliais ir leidėjo maketu. Tinklalapiai (HTML), Markdown, FictionBook (.fb2) ir komiksų archyvai (.cbz) atsidaro taip pat, kiekvienas kaip atskiras įskiepis.\n\nSkyrius paverčiamas, kai jį atidarote pirmą kartą, ir laikomas įskiepio talpykloje, todėl vėliau jis atsidaro greičiau, o didelės knygos veikia mažuose įrenginiuose. Turinį rasite skaitymo meniu skiltyje „Turinys“. Ar taikomas paties knygos stilius, nusprendžia nustatymas „Leidėjo formatavimas“ skiltyje „Skaitymas“."
format-epub.title = EPUB el. knyga
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Atidaro FictionBook knygas (.fb2, taip pat suspaustas).
format-fb2.plugin.how = "Atidaro FictionBook knygas (.fb2), paplitusias rusų ir kitoms knygoms, taip pat suspaustas (.fb2.zip), su jų pavadinimu, autoriais, viršeliu ir skyriais.\n\nĮdėkite jas į bibliotekos aplanką; jos rodomos bibliotekoje ir atsidaro kaip bet kuri kita knyga."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Atidaro kaip failus išsaugotus tinklalapius, rodydamas tik tai, ką reikia skaityti.
format-html.plugin.how = "Atidaro kaip failus išsaugotus tinklalapius (.html, .htm, .xhtml) kaip knygas: tik tai, ką reikia skaityti, be meniu, reklamų ir panašių dalykų aplink.\n\nĮdėkite failą į bibliotekos aplanką ir atidarykite iš bibliotekos kaip bet kurią knygą. Nuorodos puslapio viduje veikia; paveikslėliai rodomi ten, kur jie yra faile."
format-html.title = Tinklalapis (HTML)
format-images.plugin.name = Paveikslėliai
format-images.plugin.description = Atidaro paveikslėlius (.jpg, .png, .gif) kaip knygas, kiekvienas – puslapis.
format-images.plugin.how = "Paveikslėliai (.jpg, .png, .gif) atsidaro iš bibliotekos kaip knygos, vienas paveikslėlis puslapyje, pritaikytas ekranui.\n\nNorėdami skaityti visą paveikslėlių aplanką, atidarykite pirmąjį paveikslėlį: po jo aplanke esantys paveikslėliai seka pagal pavadinimų tvarką (2 prieš 10). Vėlesnis aplanko paveikslėlis prasideda nuo jo; vieta kiekviename įsimenama atskirai. Aplankas iki 300 paveikslėlių skaitomas nuo to, kurį atidarote.\n\nFailas, kuris nėra paveikslėlis arba yra per didelis, rodo savo pavadinimą. Knygai iš daugelio paveikslėlių su savo pavadinimu geresnė forma yra komiksų archyvas (.cbz)."
format-images.title = Paveikslėlis
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Atidaro Markdown failus (.md), pvz., užrašus.
format-markdown.plugin.how = "Atidaro Markdown failus (.md), pvz., užrašus, kaip knygas: antraštes, sąrašus, citatas ir paryškinimus taip, kaip jie turėtų atrodyti, o ne kaip ženklus.\n\nĮdėkite failus į bibliotekos aplanką ir atidarykite iš bibliotekos. Pirmoji antraštė tampa pavadinimu; šalia failo esantys paveikslėliai rodomi ten, kur juos mini tekstas."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI knygos
format-mobi.plugin.description = Atidaro .mobi ir .azw failus be DRM.
format-mobi.plugin.how = "MOBI knygos (.mobi, .azw) atsidaro iš bibliotekos kaip bet kuri knyga, nieko nereikia nustatyti. Pavadinimas, autoriai, kalba ir viršelis imami iš knygos, o turinys sudaromas iš jos antraščių.\n\nKnyga paverčiama, kai ją atidarote pirmą kartą, – ilgai knygai tai užtrunka kelias sekundes; vėliau ji atsidaro iš karto. Rodomas tekstas, antraštės, pusjuodis ir kursyvas, nuorodos ir paveikslėliai.\n\nKnygų su DRM (dauguma knygų, nupirktų parduotuvėje) atidaryti negalima, taip pat negalima atidaryti knygų su Huffman glaudinimu ar naujesnės KF8 formos (.azw3): PaperPaw tai pasako jas atidarant. EPUB kopija, padaryta tokiu įrankiu kaip Calibre, atsidaro visada."
format-mobi.title = MOBI knygos
format-rtf.plugin.name = RTF dokumentai
format-rtf.plugin.description = Atidaro .rtf failus kaip knygas.
format-rtf.title = RTF dokumentai
format-txt.plugin.name = Paprastas tekstas
format-txt.plugin.description = Atidaro paprastus tekstinius failus (.txt).
format-txt.plugin.how = "Paprasti tekstiniai failai (.txt) atsidaro iš bibliotekos kaip bet kuri knyga, nieko nereikia nustatyti. Įskiepis skaito UTF-8, UTF-16 ir Windows-1252 tekstą ir koduotę atpažįsta pats.\n\nPastraipos seka tuščias failo eilutes; jei failas jų neturi, kiekviena eilutė yra pastraipa. Project Gutenberg failuose pradžioje ir pabaigoje esantis licencijos tekstas praleidžiamas, o pavadinimas ir autorius imami iš antraštės.\n\nFailas niekada neįkeliamas visas, todėl labai dideli tekstai atsidaro ir mažuose įrenginiuose."
format-txt.title = Paprastas tekstas
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Atidaro XTC ir XTCH knygas, iš anksto sugeneruotus Xteink skaityklių puslapius.
format-xtc.plugin.how = "XTC ir XTCH failai yra knygos, kurių puslapiai jau sugeneruoti kaip paveikslėliai, kaip juos sukuria Xteink skaityklių keitikliai. Jie atsidaro iš bibliotekos kaip bet kuri knyga.\n\nKadangi kiekvienas puslapis yra pastovus paveikslėlis, teksto dydžio ar šrifto pakeisti negalima. Puslapiai nespalvoti arba turi keturis pilkumo atspalvius. Kiekvienas puslapis dekoduojamas, kai rodomas, todėl reikia nedaug atminties, taip pat ir X4.\n\nPavadinimas, autorius ir skyriai imami iš failo, jei jis juos turi."
format-xtc.title = XTC puslapiai
help.plugin.name = Užuominos
help.plugin.description = Pirmą kartą atidarius ekraną parodo, ką daro jo valdikliai.
help.plugin.how = "Kai ekranas atidaromas pirmą kartą, virš jo pasirodo trumpa pastaba, ką daro jo valdikliai: ekrano dalys, į kurias veikia palietimas, apvestos rėmeliu, ir ką daro mygtukai.\n\nPalietimas ar bet kuris mygtukas uždaro pastabą, ir to ekrano ji daugiau nebesirodo. „Daugiau užuominų nerodyti“ išjungia jas visas.\n\nNustatymuose skiltyje „Sistema“ „Užuominos“ jas įjungia ar išjungia, o „Rodyti užuominas iš naujo“ vėl parodo kiekvieno ekrano pastabą vieną kartą."
help.title = Kaip čia veikia
help.got-it = Supratau
help.no-more = Daugiau užuominų nerodyti
help.section = Užuominos
