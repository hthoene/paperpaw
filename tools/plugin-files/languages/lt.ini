plugin-manager.plugin.name = Įskiepių tvarkyklė
plugin-manager.plugin.description = Išvardija įskiepius ir juos įjungia bei išjungia.
plugin-manager.plugin.how = "Įskiepių tvarkyklė išvardija kiekvieną įskiepį su jo versija ir aprašu ir įjungia bei išjungia įskiepius.\n\nJą rasite nustatymuose kaip „Tvarkyti įskiepius“. „Įskiepių nustatymai“ yra atskiras puslapis nuostatoms, pvz., kiekvieno įskiepio tinklo naudojimui. Palieskite įskiepį, kad jį įjungtumėte ar išjungtumėte (su mygtukais pasirinkite jį). Pakeitimas įsigalioja po paleidimo iš naujo: apačioje esanti juosta tada siūlo „Paleisti iš naujo dabar“. Palaikykite įskiepį (su mygtukais palaikykite „Pasirinkti“), kad perskaitytumėte, kaip jis veikia.\n\nĮskiepio su žyma „Visada įjungta“ išjungti negalima, o su žyma „Būtinas“ – tik kai kitas įskiepis perima jo darbą, kitaip PaperPaw neturėtų kelio atgal. Skiltyje „Ekranai“ pasirenkate, kuris įskiepis rodo vietą, kurią siūlo keli."
