menu.plugin.name = Menu
menu.plugin.description = Menu ing ngisor layar, karo aksi lan setelan.
menu.plugin.how = "Menu ndhaptar apa sing bisa sampeyan lakoni lan setel. Mbukak ing ngisor layar, ing ndhuwur apa wae sing dibuka: nalika maca, tutul tengah layar utawa pencet Pilih. Tutul utawa pilih entri kanggo nglakokake.\n\nSetelan ing menu nuduhake nilaine lan owah ing panggonane, mula menu tetep mbukak. Entri sing duwe entri liyane mbukak submenu.\n\nGesek mudhun saka pinggir ndhuwur kanggo panel cepet: apa sing asring sampeyan owahi, minangka tombol. Tutul tombol kanggo ngganti, tahan kanggo setelane. Nganggo tombol wae, tombol panah milih, Pilih ngganti lan Bali nutup. Ing Rupa, Menu nuduhake menu minangka dhaptar utawa kothak."
