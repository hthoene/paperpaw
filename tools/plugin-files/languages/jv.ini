aids.plugin.name = Pambantu maca
aids.plugin.description = Wiwitan tembung kandel, tembung sing diganti, gambar: teks miturut karepmu.
aids.plugin.how = "Pambantu maca ngowahi tampilan teks buku nalika sampeyan maca. Iki ditrapake ing kabeh buku. Wiwitan tembung kandel lan Ganti tembung mati ing wiwitan.\n\nSampeyan bisa nemokake ing Setelan, ing Maca, ing bagean Pambantu maca. Wiwitan tembung kandel nggawe separo kawitan saben tembung dadi kandel, sing dianggep luwih gampang diikuti dening sawetara wong. Ganti tembung nganggo pasangan sing ditulis kayata “ora = ra; Pak = Bapak”, dipisahake titik koma.\n\nMung tembung utuh sing diganti, persis kaya sing sampeyan tulis, dadi “ora” ora bakal ngowahi bagean saka tembung sing luwih dawa. Berkas bukune dhewe ora diowahi.\n\nGambar ing buku bisa ditampilake (kaya ing wiwitan), diowahi dadi baris cendhak kayata “[Gambar: kapal ing segara]” sing nggunakake katrangan gambar, utawa ditinggal. Kaca banjur duwe papan luwih akeh kanggo teks, lan ora ana gambar sing didekode yen ora ditampilake, sing nggawe kaca luwih cepet dibalik. Komik lan buku liyane sing digawe saka gambar ora diowahi."
