wifi.plugin.name = Wi-Fi
wifi.plugin.description = Gabung menyang jaringan Wi-Fi yen dibutuhake lan mateni radio sawise iku.
wifi.plugin.how = "Wi-Fi gabung menyang jaringan yen plugin butuh internet (katalog, sinkron, toko, transfer) lan mateni radio maneh sakmenit sawise ora ana sing nggunakake, utawa langsung yen Ngarep utawa buku katon, kanggo ngirit baterai lan memori.\n\nBuka Wi-Fi saka Setelan, utawa saka item Wi-Fi ing baris status. Jaringan ndhaptar sing ana ing jangkauan; pilih siji lan ketik tembung sandine, utawa pilih Setel nganggo ponsel lan ketik jeneng lan tembung sandi ing browser ponsel sampeyan, ora ing piranti. Lalekna mbusak jaringan sing disimpen.\n\nTembung sandi tetep ing kertu, disimpen kanthi aman, lan ora tau ditampilake maneh. Ing Nyambung yen dibutuhake sampeyan nyetel suwene Wi-Fi tetep murub sawise panggunaan pungkasan, apa tetep murub nalika ngisi daya, lan jaringan sing disimpen endi sing dadi pisanan yen akeh sing ana ing jangkauan."
