tasks.plugin.name = Tugas
tasks.plugin.description = Dhaptar tugas karo tanggal wates lan prioritas, ing pamaca utawa disinkronake karo server CalDAV sampeyan, karo widget layar ngarep.
tasks.plugin.how = "Dhaptar tugas ing pamaca sampeyan: tugas karo tanggal wates lan prioritas, dicentang yen wis rampung. Mlaku tanpa disetel lan tanpa jaringan, lan bisa dijaga tetep sinkron karo server CalDAV (Nextcloud, Radicale, Baïkal, Fastmail lan liyane), mula dhaptar sing padha ana ing ponsel lan komputer sampeyan.\n\nBuka Tugas saka menu alat. Larik pisanan nyebutake dhaptar sing katon; pilih kanggo dhaptar liyane, kanggo Dina iki lan telat ing kabeh dhaptar, kanggo dhaptar anyar, kanggo sinkron, utawa kanggo nyetel akun. Tambah tugas mbukak keyboard. Pilih ing tugas nyentang (maneh: durung rampung). Tahan tugas utawa pencet Menu kanggo ngowahi judhul, tanggal wates (dina iki, sesuk, seminggu maneh, utawa tanggal sing sampeyan ketik kayata 2026-12-24) utawa prioritase, utawa nyopot. Tugas sing isih mbukak ana ing ngarep, miturut dina lan banjur prioritas; sing wis rampung tetep ing pungkasan sepekan (disetel ing Tugas ing setelan), banjur ninggalake pamaca.\n\nWidget kanggo layar ngarep (tahan layar ngarep, banjur tambah widget): Tugas dina iki nuduhake apa sing wektune dina iki utawa wis telat, Dhaptar tugas nuduhake siji dhaptar, Tugas mbukak ngitung, lan Tugas candhake nuduhake sing kudu ditindakake candhake. Tutulan ing tugas ing widget nyentang; tutulan ing judhul mbukak dhaptar.\n\nKanggo sinkron, pilih Akun CalDAV saka larik dhaptar lan lebokna alamat server, jeneng pangguna lan tembung sandi (becike tembung sandi aplikasi). Alamat server wis cukup, contone cloud.example.com/remote.php/dav; pamaca nemokake dhaptar tugas sampeyan saka kana. Saben dhaptar tugas server dadi dhaptar ing pamaca. Pamaca nyinkronake nalika sampeyan mbukak Tugas, nalika sampeyan milih Sinkron saiki, lan nalika jaringan wis murub; apa sing sampeyan owahi tanpa jaringan nunggu lan dikirim mengko. Yen tugas diowahi ing pamaca lan ing panggonan liya ing wektu sing padha, versi server sing dijupuk lan versi sampeyan disimpen minangka tugas anyar ing jejere, mula ora ana sing ilang. Cathetan, alarm lan liyane sing duwe tugas ing server tetep kaya sing ana. Tugas sing bola-balen katon nanging diowahi ing panggonan sampeyan nggawe. Pamaca nyimpen nganti 200 tugas ing 12 dhaptar."
