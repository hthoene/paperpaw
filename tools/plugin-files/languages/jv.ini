weather.plugin.name = Cuaca
weather.plugin.description = Cuaca saiki lan dina-dina sabanjure minangka widget, saka Open-Meteo.
weather.plugin.how = "Cuaca nuduhake cuaca saiki lan dina-dina sabanjure minangka widget kanggo layar ngarep, saka Open-Meteo, sing ora butuh akun utawa kunci. Cuaca saiki nuduhake suhu, kahanan lan liyane sing bisa dipilih; Prakiraan nuduhake dina-dina sabanjure ing sak larik utawa dhaptar.\n\nPisanan pilih panggonan: ing setelan, ing Cuaca, Panggonan (ketik jeneng, banjur pilih saka panggonan sing ketemu). Mung koordinate sing dikirim, lan mung nalika widget cuaca katon. Tambah widget kanthi ngowahi layar ngarep.\n\nCuaca dijupuk paling kerep kaya sing diandharake Anyari paling kerep saben, lan mung nalika ana jaringan: ora tau ngurupake Wi-Fi dhewe.\n\nData cuaca saka Open-Meteo.com (https://open-meteo.com), miturut lisensi Creative Commons Attribution 4.0 (CC BY 4.0)."
