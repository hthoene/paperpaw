koreader.plugin.name = Pambagi sorotan
koreader.plugin.description = Nuduhake tetenger lan sorotan karo KOReader kanggo buku sing diwaca ing loro-lorone.
koreader.plugin.how = "Plugin iki nuduhake tetenger lan sorotan karo KOReader kanggo buku sing sampeyan waca ing loro-lorone, ing siji piranti utawa ing folder perpustakaan sing disinkronake antar piranti. Ora ana sing kudu disetel.\n\nYen PaperPaw mbukak buku sing uga wis dibuka KOReader, lan yen sampeyan ngowahi tetenger utawa sorotane, PaperPaw njupuk apa sing anyar saka data KOReader ing jejere buku lan ninggalake apa sing anyar ing kene supaya dijupuk KOReader nalika mbukak buku kuwi maneh. Tandha sing dibusak lan cathetan sing diowahi uga ditularake.\n\nIki mung kanggo buku EPUB. Yen berkas ing salah siji sisih ora bisa diwaca, ora ana sing owah ing sisih endi wae nganti bisa diwaca."
