setup.plugin.name = Setelan awal
setup.plugin.description = Pandhuan cendhak liwat setelan sing penting, nalika miwiti pisanan.
setup.plugin.how = "Setelan awal yaiku pandhuan cendhak liwat setelan sing penting, ditampilake sapisan wae, nalika PaperPaw diwiwiti pisanan. Saben kaca takon siji perkara, kayata basa, tombol, ukuran teks, zona wektu, Wi-Fi utawa sawetara plugin sing arep ditambahake, kanthi wangsulan sing wajar wis dipilih, mula Candhake tansah bener. Langkah sing ora dibutuhake piranti iki ora dilebokake.\n\nTutul tombol, utawa gunakna tombol munggah lan mudhun lan Pilih. Lewati ing kaca pisanan ninggalake setelan awal langsung. Kaca pungkasan ngandhani saka ngendi bukumu teka.\n\nKanggo mlakokake maneh, buka setelan lan pilih Setel PaperPaw. Kabeh sing dipilih ing kene bisa diowahi ing setelan mengko."
