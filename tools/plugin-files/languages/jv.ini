puzzles.plugin.name = Teka-teki
puzzles.plugin.description = Sudoku, teka-teki silang lan teka-teki catur, offline, karo teka-teki dina iki.
puzzles.plugin.how = "Teka-teki kanggo ing sepur lan ruwang tunggu, kabeh offline: sudoku, teka-teki silang lan teka-teki catur. Buka Teka-teki saka menu alat, utawa tambah widget Teka-teki dina iki ing layar ngarep (tahan layar ngarep, banjur tambah widget): nuduhake sepira adohe sudoku dina iki, lan tutulan mbukak. Sudoku dina iki padha sedina muput.\n\nSudoku: kiwa lan tengen mindhah kursor kothak siji-siji, munggah lan mudhun (tombol kaca) saben larik. Pilih mbukak angka: pilih siji lan pilih maneh kanggo nglebokake, utawa Busak kanggo ngosongake kothak. Tahan Pilih (utawa Menu) kanggo tekan tombol ing ngisor papan: Cathetan ngowahi angka dadi tandha potlot, Priksa nandhani kothak sing salah, Batalake mbalekake gerakan pungkasan, Anyar miwiti teka-teki tingkat sing sampeyan pilih (Gampang, Sedheng, Angel). Saben teka-teki duwe persis siji pangsulan. Kaulinan disimpen nalika sampeyan ninggalake. Ing layar sentuh tutul kothak.\n\nTeka-teki silang: selehna berkas .puz (Across Lite) utawa .ipuz ing folder \"puzzles\" ing kertu memori; ora ana sing kalebu. Obah ing kothak, banjur pilih kanggo ngetik tembung ing sangisore kursor nganggo keyboard (garis ngisor ninggalake kothak kosong). Tombol ngganti mendatar lan menurun, nuduhake dhaptar pitunjuk, mriksa aksara lan mbukak tembung. Aksara disimpen kanggo saben berkas. Berkas .puz sing diacak ora bisa dibuka.\n\nTeka-teki catur: sawetara cilik saka basis data teka-teki Lichess (CC0). Kiwa lan tengen mlumpat saka bidak menyang bidak, pilih bidak sing arep dipindhah, banjur kiwa lan tengen liwat panggonan sing bisa dituju, lan pilih maneh. Gerakan sing salah dibatalake. Pitunjuk nandhani bidak sing kudu dipindhah, Candhake menyang teka-teki candhake.\n\nPapan mung nggambar maneh kothak sing owah. Statistik ngetung teka-teki sing sampeyan pecahake."
