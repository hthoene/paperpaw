notes-overview.plugin.name = Kabeh cathetan
notes-overview.plugin.description = Tetenger lan sorotan saka kabeh buku ing sak dhaptar, lan ekspor minangka My Clippings.txt.
notes-overview.plugin.how = "Kabeh cathetan ndhaptar saben buku sing sampeyan gawe tetenger utawa sorotan, karo cacahane. Buka ing Alat. Pilih buku kanggo ndeleng cathetane, lan cathetan kanggo mbukak buku ing panggonan kuwi.\n\nIng pungkasan dhaptar, Ekspor minangka My Clippings.txt nulis kabeh cathetan ing sak berkas, ing folder Exports ing jejere perpustakaan, kanthi wujud sing dienggo Kindle (UTF-8). Aplikasi sing maca My Clippings.txt saka Kindle bisa maca iki. Cathetan ing sorotan dadi entri dhewe, kaya ing Kindle. Amarga buku ing kene ora duwe lokasi Kindle, “lokasi” yaiku sepira adohe cathetan ing buku, ing persen. Berkas ditulis maneh saben-saben; ngganti sing sadurunge."
