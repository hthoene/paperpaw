anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Sinau kartu Anki sing wis wektune ing komputer lan ngirim wangsulan sampeyan bali, liwat add-on AnkiConnect.
anki.plugin.how = "Anki ngidini sampeyan sinau kartu sing wis wektune ing Anki ing komputer sampeyan nganggo pamaca, lan ngirim wangsulan sampeyan bali. Nganggo add-on gratis AnkiConnect (kode add-on 2055492159) lan ora tau AnkiWeb. Wiwitane mati: tambahna saka Toko plugin.\n\nIng komputer: instal AnkiConnect ing Anki (Alat, Add-ons, Get Add-ons) lan wiwiti maneh Anki. Anki kudu mbukak nalika sampeyan sinkron.\n\nSacara standar AnkiConnect mung mangsuli komputer sing dienggo mlaku (127.0.0.1), dadi pamaca ora bisa tekan. Buka Alat, Add-ons, AnkiConnect, Config lan setel \"webBindAddress\" dadi \"0.0.0.0\" (ngrungokake ing jaringan omah). Port, \"webBindPort\", yaiku 8765 yen ora sampeyan owahi. Yen sampeyan nyetel \"apiKey\" ing kana, lebokna kunci sing padha ing kene. Wiwiti maneh Anki sawise ngowahi konfigurasi, lan ijinake Anki liwat firewall komputer yen takon. Gunakna iki mung ing jaringan sing sampeyan percaya: sapa wae ing jaringan kuwi bisa tekan AnkiConnect, dadi kunci iku apik.\n\nIng pamaca: buka Anki saka Alat, banjur lebokna alamat komputer (contone 192.168.1.20) ing Komputer, port yen dudu 8765, lan kunci API yen sampeyan nyetel. Pilih Dek, utawa kosongna kanggo kabeh dek. Banjur pilih Sinkron karo Anki, nalika Wi-Fi murub: wangsulan sing nunggu dikirim dhisik, banjur kartu sing wis wektune (lan jumlah kartu anyar sing sampeyan setel) dijupuk, paling akeh 50. Pilih Sinau kanggo nglakoni, tanpa jaringan: tuduhake wangsulan lan nilai Baleni, Angel, Apik utawa Gampang. Wangsulan sampeyan disimpen ing pamaca, uga tanpa Wi-Fi, lan menyang Anki nalika sinkron candhake. Anki sing nemtokake kapan kartu bali: kartu sing wis dijawab Baleni dijupuk maneh dening sinkron sabanjure yen Anki nyebut wis wektune.\n\nSinkron nalika Anki dibuka, ing setelan, sinkron saben sampeyan mbukak layar. Ora ana sing nggunakake jaringan yen sampeyan mencet tombol."
