battery.plugin.name = Panggunaan baterai
battery.plugin.description = Nyathet baterai lan nuduhake sepira suwene tahane.
battery.plugin.how = "Panggunaan baterai nyathet daya kira-kira saben menit nalika piranti tangi, bareng karo apa sing ditindakake: nyegerake layar lan kaca sing dibalik. Saka kuwi diitung pira sing dibutuhake sajam tangi lan 100 kaca, lan sepira suwene baterai tahan ing irama kuwi.\n\nBuka Baterai saka menu Alat. Nuduhake daya saiki, wektu tangi iki, panggunaan nganggo baterai nganti saiki lan wektu tangi sing bubar. Dibalik nganggo tombol kaca, utawa kanthi nutul panah ing ndhuwur.\n\nButuh sawetara wektu maca nganggo baterai sadurunge angka-angkane ana artine. Pencatatan murub ing wiwitan lan bisa dipateni ing Setelan, ing Piranti, Daya, minangka Catet panggunaan baterai."
