menu-editor.plugin.name = Panyunting menu
menu-editor.plugin.description = Ngatur ulang, mbusak lan nambah entri saben menu.
menu-editor.plugin.how = "Panyunting menu ngowahi isine menu: mindhah entri munggah utawa mudhun, mbusak, utawa nambah sing anyar.\n\nSampeyan bisa nemokake ing Setelan ing Sesuaikan, minangka Sesuaikan menu. Pilih menu, banjur entri kanggo mindhah utawa mbusak; Tambah entri nglebokake sing anyar. Owah-owahan ditrapake langsung. Reset menu iki mbalekake menu kaya sing ditemtokake plugine, Reset kabeh menu nindakake kanggo saben menu.\n\nSampeyan ora bisa ngunci awak dhewe: entri sing dadi dalan menyang setelan tetep ana nganti sampeyan nambah dalan liyane menyang kono."
