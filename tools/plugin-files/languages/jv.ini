bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Masangake remote, keyboard lan sensor, lan nyambungake.
bluetooth.plugin.how = "Bluetooth masangake remote, keyboard lan sensor karo pamaca, yen duwe Bluetooth (X4 Pro).\n\nTambah piranti golek apa sing ana ing jangkauan; sijine piranti ing mode pasangan dhisik. Pilih piranti kuwi, lan konfirmasi ing pamaca (bandhingna nomer yen ana sing katon). Tombol remote utawa keyboard banjur mbalik kaca lan obah ing menu; owahi apa sing ditindakake saben tombol ing Kontrol.\n\nRemote ngandhani kapan tombole bisa: yen diurupake ing kene, nalika maca (disambung nalika buku mbukak, ngirit baterai), utawa tansah. Tombol menu utawa penekan dawa ing piranti bakal mbusak piranti kuwi saka dhaptar.\n\nSensor kanggo plugin: urupna plugin endi sing oleh nggunakake. Bluetooth mati yen ora ana sing nggunakake."
