dictionary.plugin.description = Nggoleki tembung ing kamus StarDict.
dictionary.plugin.how = "Kamus nggoleki tembung saka buku ing kamus StarDict lan nuduhake definisine ing panel ing ndhuwur bagean ngisor layar.\n\nIng pamaca, tahan tembung lan pilih Goleki; nganggo tombol, gunakna Pilih teks ing Liyane. Salinen folder kamus (karo berkas .ifo, .idx lan .dict) menyang folder \"dictionaries\" ing piranti, kalebu subfolder, utawa pilih folder liya ing Setelan, ing Maca, minangka Folder kamus (setelan lanjut). Panelusuran pisanan nyiapake indeks cilik kanggo saben kamus, sing butuh sawetara wektu.\n\nIng panel, tombol kaca utawa Munggah lan Mudhun nggulung definisi sing dawa, lan Bali nutup panel. Nganggo sentuh, tutul ing njaba panel kanggo nutup."
