reader.plugin.name = Pamaca
reader.plugin.description = Nuduhake buku kaca-kaca, karo dhaptar isi lan setelan maca.
reader.plugin.how = "Pamaca nuduhake buku kaca-kaca. Buka buku saka perpustakaan; buku pungkasan bisa dibuka maneh nalika miwiti (setelan Buka buku pungkasan nalika miwiti).\n\nTutul sisih kiwa utawa tengen layar, utawa gunakna tombol kaca, kanggo mbalik kaca. Tutul tengah utawa pencet Pilih kanggo menu maca: Isi, Telusuri, Menyang kaca, Fon lan tata letak, Tetenger lan sorotan lan liyane. Mudhun saka pinggir ndhuwur mbukak panel cepet, munggah saka pinggir ngisor menyang ngarep; nahan Bali uga.\n\nTahan Pilih (utawa tahan gambar) kanggo ndeleng gambar layar kebak: Kiwa lan Tengen mlaku liwat gambar-gambar ing kaca. Pilih nggedhekake dadi 2x, 3x lan bali (tutul kaping pindho ing sentuh); nalika digedhekake, Kiwa lan Tengen nggeser nyamping, tombol kaca (utawa gesekan) mlaku liwat nyamping lan mudhun. Bali bali menyang pas, banjur menyang kaca (tahan kanggo metu ing sentuh). Tutul pojok ndhuwur tengen kanggo tetenger. Tahan tembung kanggo nyorot. Nganggo tombol, tahan Kiwa: Kiwa lan Tengen mindhah miturut tembung, tombol kaca miturut baris, nahan mlaku menyang pungkasan kaca lan miturut paragraf; Pilih mbukak bar sorotan kanggo tembung, nahan Pilih nglebokake dadi ukara lan paragraf (banjur Kiwa lan Tengen mindhah pungkasan, nahan mindhah wiwitan). Pilihan terus nalika kaca dibalik. Ekspor minangka Markdown nyimpen cathetan sampeyan."
