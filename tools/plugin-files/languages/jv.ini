home.plugin.name = Layar ngarep
home.plugin.description = Kaca wiwitan: kaca widget, kayata buku sing lagi diwaca lan alat.
home.plugin.how = "Layar ngarep digawe saka kaca-kaca, saben-saben kothak widget lan alat kaya ing ponsel. Ing wiwitan jam, buku sing sampeyan waca lan buku sing bubar diwaca ana ing siji kaca, lan kabeh alat ing kaca candhake.\n\nTutul item kanggo mbukak, lan gesek utawa gunakna tombol kaca kanggo ganti kaca. Nganggo tombol wae, tombol panah pindhah saka item siji menyang item candhake lan Pilih mbukak.\n\nKanggo ngatur ulang, tahan layar ngarep, tutul potlot ing ngisor kaca utawa pilih Owahi layar ngarep ing menu. Seret item kanggo mindhah utawa tutul siji kanggo pilihane, uga nganggo tombol. Tambah widget uga ana ing kono. Kolom lan Larik ana ing setelan, ing Rupa, ing bagean Layar ngarep.\n\nIng layar sing diputer nyamping, layar ngarep nuduhake item sing padha karo luwih akeh kolom, saben kaca diisi sadurunge sing candhake, lan kertu ora luwih amba tinimbang kira-kira 110 mm; apa sing sampeyan atur ing posisi jejeg ora diowahi. Yen sampeyan ngatur ing posisi nyamping, tata letak kuwi disimpen dhewe kanggo orientasi kuwi: widget anyar ditambahake menyang loro-lorone. Reset tata letak nyamping ing Tambah (nalika ngowahi) bali menyang sing diturunake. Mbusak widget utawa alat ing siji orientasi ora mbusak saka liyane."
