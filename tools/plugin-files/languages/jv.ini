pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Timer fokus karo putaran kerja lan istirahat, widget lan cacahan saben dina.
pomodoro.plugin.how = "Timer Pomodoro: kerja ing putaran sing fokus, banjur istirahat. Ora butuh disetel: 25 menit fokus, 5 istirahat, lan sawise patang putaran istirahat dawa 15.\n\nBuka Pomodoro saka menu alat lan pencet Wiwiti, utawa tambah widgete ing layar ngarep (tahan layar ngarep, banjur tambah widget): Timer Pomodoro nuduhake fase lan menit sing isih, Wiwiti/setop Pomodoro yaiku tombol, lan Pomodoro dina iki ngetung putaran sing wis rampung, karo target saben dina. Tutulan ing timer miwiti utawa ngaso; tahan kanggo mbukak layar kebak.\n\nTimer tetep mlaku nalika sampeyan ninggalake layar, lan nerusake miturut jam sawise miwiti maneh. Nalika pamaca turu ora ana sing mlaku: fase sing rampung ing wektu iku diwartakake nalika tangi. Kabar ngandhani yen fase wis rampung. Kanggo ngirit baterai jam dianyari sapisan saben menit (saben sepuluh detik ing menit pungkasan ing layar kebak) lan ora tau nahan pamaca tetep tangi.\n\nIng Pomodoro ing setelan sampeyan nyetel dawane lan putaran saben set, lan apa fase candhake diwiwiti dhewe. Ing Liyane: kedhip layar utawa kedhip lampu ngarep nalika fase rampung lan target saben dina."
