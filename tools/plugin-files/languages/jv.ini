mail.plugin.name = Email
mail.plugin.description = Maca lan ngirim email nganggo tembung sandi utawa tembung sandi aplikasi (IMAP lan SMTP), tanpa mlebu liwat browser.
mail.plugin.how = "Email maca lan ngirim email liwat IMAP lan SMTP. Mlebu nganggo alamat lan tembung sandi sampeyan, tanpa mlebu liwat browser, mula bisa karo panyedhiya apa wae sing ngidini.\n\nSetel akun ing Setelan, Email. Pilih panyedhiya, ketik alamat lan tembung sandi. Umume panyedhiya njaluk tembung sandi aplikasi: gawe ing setelan keamanan akun sampeyan lan gunakna ing kene. Tembung sandi biasa asring ora bisa, lan ora tau menyang ngendi-ngendi kajaba menyang server panyedhiya sampeyan. Disimpen bareng tembung sandi lan kunci.\n\nBuka Email ing alat. Priksa email njupuk email paling anyar lan folder. Email disimpen ing kertu, mula bisa diwaca tanpa jaringan. Piranti nyambung, njupuk lan medhot, mula Wi-Fi murub mung sedhela.\n\nYen panyedhiya sampeyan ora ana ing dhaptar, pilih Server dhewe lan setel jeneng server, port lan keamanan ing setelan lanjut. Server sing sertifikate ora dijamin otoritas apa wae takon sapisan apa arep dipercaya; bandhingna sidik jari karo sing ditampilake panyedhiya sampeyan.\n\nEmail sing ana bukune (EPUB, PDF lan sapanunggalane, nganti 2 MB) duwe Buka buku ing sangisore: njupuk berkas, nyelehake ing perpustakaan sampeyan lan mbukak.\n\nKanggo ndeleng email anyar tanpa mbukak Email, urupna Priksa email anyar ing latar mburi ing Setelan, Email, lan pilih sepira kerepe (saben 15, 30 utawa 60 menit). Iki mati nganti sampeyan urupake. Pamaca banjur nyambung sak-sak liwat sambungan aman nalika tangi lan online, akun siji-siji, lan nganyari cacahan sing durung diwaca ing Ngarep. Nganggo sawetara baterai. Mbukak Email mandhegake pamriksan sing lagi mlaku.\n\nWidget layar ngarep nuduhake cacahan sing durung diwaca, email paling anyar lan sing dibintangi, siji kothak layang, lan ddalan cendhak kanggo nulis email."
