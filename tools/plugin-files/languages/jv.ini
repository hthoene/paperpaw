vocabulary.sd.readme = "Kartu flash saka berkas\n\nSelehna berkas ing kene kanggo saben dek: Spanish.tsv nggawe dek Spanish.\nBerkas: .tsv, .csv utawa .txt, disimpen minangka UTF-8, utawa .apkg: dek Anki, diekspor nganggo Support older Anki versions dicentang. Telung kolom pisanan cathetane dadi ngarep, mburi lan conto; penjadwalan lan media ora diwaca, lan PaperPaw ora tau nulis berkas Anki.\n\nSiji kartu ing saben baris: ngarep, mburi lan conto (opsional), dipisahake nganggo tab, koma utawa titik koma. Baris pisanan bisa nyebutake kolom: ngarep, mburi, conto. Conto:\n\nKatze\tcat\tDie Katze schläft.\n\nBanjur buka Kartu flash ing pamaca, pilih Kartu ing kertu SD lan banjur Anyari dek saka kertu.\n\nMenawa migunani:\n- Dek tetep ing pamaca, karo apa sing sampeyan sinaoni. Berkas diwaca yen anyar utawa diowahi, lan kartune ditambahake menyang dek utawa diowahi ing kana.\n- Ganti mburi utawa conto kartu ing berkas: kartu owah lan nyimpen kemajuane.\n- Ganti teks ngarep kartu: diitung minangka kartu anyar, lan sing lawas miwiti saka awal. Kartu dicocogake miturut teks ngarep, spasi lan aksara kapital ora diitung. Simpen dek menyang berkas (Kartu ing kertu SD, Simpen dek menyang kertu) lan saben kartu duwe nomer ing kolom id: ganti ngarep ing kana, tetepna rong baris pisanan berkas kaya sing ana, lan kartu nyimpen apa sing sampeyan sinaoni.\n- Nyimpen nulis kartu dek. Apa sing ana ing berkas lan dudu kartu (baris tanpa ngarep) ora disimpen; berkas sing ana ing kana disalin menyang _name.bak.tsv.\n- Simpen berkas minangka CSV UTF-8 (dudu UTF-16, dudu format spreadsheet dhewe). Berkas luwih saka 4 MiB utawa 20.000 baris ora diwaca: pecah.\n- Baris sing sampeyan busak ing berkas ora mbusak kartu ing dek, kajaba sampeyan ngurupake Copot kartu sing ilang kanggo dek kuwi. Banjur kartu lunga karo apa sing sampeyan sinaoni.\n- Berkas sing jenenge diwiwiti _ ora diwaca.\n"
