translate.plugin.how = "Terjemahan nerjemahake teks sing dipilih kanthi online nganggo DeepL. Pilih teks ing buku lan pilih Terjemahake ing menu teks sing dipilih: terjemahane katon ing ndhuwur kaca kaya entri kamus. Tombol kaca utawa tutulan nggulung, lan Pilih utawa tutulan ing pungkasane nutup.\n\nButuh jaringan lan kunci API DeepL sampeyan dhewe, gratis ing deepl.com (DeepL API Free, kira-kira 500.000 karakter saben sasi). Nganti sampeyan nglebokake, panel ngandhani, lan tutulan njaluk kunci.\n\nIng setelan, ing Maca, ing bagean Terjemahan, Terjemahake menyang nyetel basa; ing wiwitan yaiku basa PaperPaw dhewe."
