rules.plugin.name = Aturan
rules.plugin.description = Yen ana kedadean, nindakake apa-apa: contone mode wengi jam 22:00.
rules.plugin.how = "Aturan nindakake sawijining perkara dhewe yen ana kedadean: mode wengi murub saben dina jam 22:00, utawa katalog disinkronake nalika PaperPaw diwiwiti.\n\nAturan ana ing Setelan ing Sesuaikan, minangka Aturan. Tambah aturan takon Yen kapan? (PaperPaw diwiwiti, wektu ing dina, buku dibuka utawa ditutup, baterai, ngisi daya, saklar lan liyane) lan Banjur apa? (nglakokake aksi, nguripake utawa mateni saklar, nyetel angka, nuduhake pesen). Tutul aturan kanggo ngaso; tahan (nganggo tombol, tahan Pilih) kanggo kondisi kayata Ing antarane rong wektu ing dina, utawa kanggo nyopot.\n\nAksi, saklar lan angka sing bisa dipilih teka miturut plugin: pilih plugin, banjur apa sing digawa; bali metu saka kono maneh. Aksi sing ditrapake ing layar sing katon, kayata Bali utawa Kaca candhake, nindakake apa sing bakal ditindakake yen dipencet ing kana.\n\nWektu ditrapake apa wae layar sing mbukak. Rong aturan sing terus-terusan mbatalake siji lan sijine mandheg sawise sawetara langkah."
