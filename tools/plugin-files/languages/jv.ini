format-cbz.plugin.name = Komik
format-cbz.plugin.description = Mbukak arsip komik (.cbz), saben kaca siji gambar.
format-cbz.plugin.how = "Mbukak arsip komik (.cbz): saben kaca siji gambar, disesuaikan karo layar, miturut urutan jenenge (2 sadurunge 10).\n\nSelehna ing folder perpustakaan lan buka saka perpustakaan; balik kaca kaya ing buku apa wae. Gambar gedhe butuh sawetara wektu nalika pisanan, luwih suwe ing X4 tinimbang ing panggonan liya.\n\nSetelan maca (Setelan, Maca): “Panel siji-siji” nuduhake siji panel saka kaca ing sawijining wektu, sagedhe sing diidini layar, lan kaca sing dibalik mlaku ngliwati panel-panel kuwi; kaca tanpa panel katon utuh. “Arah kaca komik” nyerminake pambalikan kaca kanggo manga (tengen menyang kiwa); ComicInfo.xml buku dhewe ngandhani kuwi kanthi otomatis. Perpustakaan nuduhake judhul buku lan seri lan nomere saka ComicInfo.xml."
format-cbz.title = Komik (CBZ)
format-cbz.setting.direction = Arah kaca komik
format-cbz.setting.direction.help = Manga: pambalikan kaca dicerminake.
format-cbz.direction.book = Miturut buku
format-cbz.direction.ltr = Kiwa menyang tengen
format-cbz.direction.rtl = Tengen menyang kiwa
format-cbz.setting.panels = Panel siji-siji
format-cbz.setting.panels.help = Siji panel ing sawijining wektu, kaca dibalik ngliwati panel.
format-docx.plugin.name = Dokumen DOCX
format-docx.plugin.description = Mbukak berkas .docx, kaya sing disimpen Word lan program liyane.
format-docx.plugin.how = "Mbukak dokumen .docx minangka buku: judhul karo dhaptar isi, dhaptar, tabel, kandel lan miring, pranala lan gambar (JPEG, PNG, GIF).\n\nSelehna berkas ing folder perpustakaan lan buka saka perpustakaan. Judhul lan penulis dijupuk saka properti dokumen. Cathetan sikil, header lan footer, lan komentar ora katon."
format-docx.title = Dokumen DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Mbukak buku EPUB karo gaya, dhaptar isi lan gambare.
format-epub.plugin.how = "Buku EPUB mbukak saka perpustakaan kaya buku liyane, karo dhaptar isi, gambar lan gaya saka penerbit. Kaca web (HTML), Markdown, FictionBook (.fb2) lan arsip komik (.cbz) mbukak kanthi cara sing padha, saben-saben minangka plugin dhewe.\n\nSawijining bab dikonversi nalika sampeyan mbukak pisanan lan disimpen ing cache plugin, dadi sabanjure luwih cepet lan buku gedhe bisa mlaku ing piranti cilik. Dhaptar isi ana ing Isi ing menu maca. Apa gaya buku dhewe ditrapake yaiku setelan Format saka penerbit, ing Maca."
format-epub.title = E-book EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Mbukak buku FictionBook (.fb2, uga sing di-zip).
format-fb2.plugin.how = "Mbukak buku FictionBook (.fb2), umum kanggo buku basa Rusia lan liyane, uga sing di-zip (.fb2.zip), karo judhul, penulis, sampul lan bab.\n\nSelehna ing folder perpustakaan; katon ing perpustakaan lan mbukak kaya buku liyane."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Mbukak kaca web sing disimpen minangka berkas, nuduhake mung sing kudu diwaca.
format-html.plugin.how = "Mbukak kaca web sing disimpen minangka berkas (.html, .htm, .xhtml) minangka buku: mung sing kudu diwaca, tanpa menu, iklan lan liya-liyane ing sakubenge.\n\nSelehna berkas ing folder perpustakaan lan buka saka perpustakaan kaya buku apa wae. Pranala ing jero kaca mlaku; gambar katon ing panggonan ing berkas."
format-html.title = Kaca web (HTML)
format-images.plugin.name = Gambar
format-images.plugin.description = Mbukak gambar (.jpg, .png, .gif) minangka buku, saben gambar siji kaca.
format-images.plugin.how = "Gambar (.jpg, .png, .gif) mbukak saka perpustakaan kaya buku, siji gambar saben kaca, disesuaikan karo layar.\n\nKanggo maca sak folder gambar, buka gambar pisanane: gambar sawise iku ing folder nututi, miturut urutan jenenge (2 sadurunge 10). Gambar sing luwih mburi ing folder miwiti saka kono; panggonan ing saben gambar dieling-eling kanthi kapisah. Folder nganti 300 gambar diwaca saka gambar sing sampeyan buka.\n\nBerkas sing dudu gambar, utawa kegedhen, nuduhake jenenge. Kanggo buku akeh gambar kanthi judhul dhewe, arsip komik (.cbz) yaiku wujud sing luwih apik."
format-images.title = Gambar
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Mbukak berkas Markdown (.md), contone cathetan.
format-markdown.plugin.how = "Mbukak berkas Markdown (.md), kayata cathetan, minangka buku: judhul, dhaptar, kutipan lan penekanan kaya sing dikarepake, dudu minangka tandha-tandha.\n\nSelehna berkas ing folder perpustakaan lan buka saka perpustakaan. Judhul pisanan dadi judhule; gambar ing jejere berkas katon ing panggonan sing disebutake teks."
format-markdown.title = Markdown
format-mobi.plugin.name = Buku MOBI
format-mobi.plugin.description = Mbukak berkas .mobi lan .azw tanpa DRM.
format-mobi.plugin.how = "Buku MOBI (.mobi, .azw) mbukak saka perpustakaan kaya buku apa wae, tanpa perlu disetel. Judhul, penulis, basa lan sampul dijupuk saka buku, lan dhaptar isi digawe saka judhul-judhule.\n\nBuku dikonversi nalika sampeyan mbukak pisanan, sing butuh sawetara detik kanggo buku sing dawa; sawise iku mbukak langsung. Teks, judhul, kandel lan miring, pranala lan gambar katon.\n\nBuku nganggo DRM (umume buku sing dituku saka toko) ora bisa dibuka, uga buku nganggo kompresi Huffman utawa wujud KF8 sing luwih anyar (.azw3): PaperPaw ngandhani yen sampeyan mbukak. Salinan minangka EPUB, sing digawe nganggo alat kayata Calibre, mesthi bisa dibuka."
format-mobi.title = Buku MOBI
format-rtf.plugin.name = Dokumen RTF
format-rtf.plugin.description = Mbukak berkas .rtf minangka buku.
format-rtf.title = Dokumen RTF
format-txt.plugin.name = Teks biasa
format-txt.plugin.description = Mbukak berkas teks biasa (.txt).
format-txt.plugin.how = "Berkas teks biasa (.txt) mbukak saka perpustakaan kaya buku apa wae, tanpa perlu disetel. Plugin maca teks UTF-8, UTF-16 lan Windows-1252 lan nemokake enkodhinge dhewe.\n\nParagraf manut baris kosong ing berkas; yen berkas ora duwe, saben baris dadi paragraf. Ing berkas Project Gutenberg teks lisensi ing wiwitan lan pungkasan ora dilebokake, lan judhul lan penulis dijupuk saka header.\n\nBerkas ora tau dimuat kabeh, mula teks gedhe banget uga mbukak ing piranti cilik."
format-txt.title = Teks biasa
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Mbukak buku XTC lan XTCH, kaca pra-render saka pamaca Xteink.
format-xtc.plugin.how = "Berkas XTC lan XTCH yaiku buku sing kacane wis dirender minangka gambar, kaya sing digawe konverter kanggo pamaca Xteink. Mbukak saka perpustakaan kaya buku apa wae.\n\nAmarga saben kaca iku gambar tetep, teks ora bisa diowahi ukurane utawa dienggo fon liya. Kaca iku ireng-putih utawa duwe patang tingkat kelabu. Saben kaca didekode nalika ditampilake, mula butuh memori sithik, uga ing X4.\n\nJudhul, penulis lan bab dijupuk saka berkas yen ana."
format-xtc.title = Kaca XTC
help.plugin.name = Pitunjuk
help.plugin.description = Nuduhake apa sing ditindakake kontrol layar, nalika pisanan dibuka.
help.plugin.how = "Nalika layar dibuka pisanan, cathetan cendhak ing ndhuwure ngandhani apa sing ditindakake kontrole: bagean layar sing dituju tutulan, diwenehi pigura, lan apa sing ditindakake tombol.\n\nTutulan utawa tombol apa wae nutup cathetan, lan ora metu maneh kanggo layar kuwi. Aja ana pitunjuk maneh mateni kabeh.\n\nIng setelan, ing Sistem, Pitunjuk murub utawa mateni, lan Tuduhake pitunjuk maneh nuduhake cathetan saben layar sapisan maneh."
