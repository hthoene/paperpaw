settings.plugin.name = Setelan
settings.plugin.description = Kaca setelan, digawe saka setelan saben plugin.
settings.plugin.how = "Setelan nuduhake kabeh sing bisa disetel ing PaperPaw lan plugine, ing kaca-kaca. Plugin ora butuh layar dhewe: apa sing dideklarasi katon ing kene, ing klompok, karo katrangan saben setelan ing sangisore.\n\nBuka nganggo Setelan ing menu. Tutul klompok kanggo mbukak, banjur setelan kanggo ngganti utawa milih; angka duwe tombol − lan +. Nganggo tombol, pindhah menyang setelan lan pencet Pilih: kiwa lan tengen ngganti angka, Pilih nahan, Bali bali menyang nilai sadurunge.\n\nOwah-owahan ditrapake langsung. Telusuri nemokake setelan miturut tembung lan Setelan lanjut nambah sing arang dibutuhake. Reset menyang standar lan Reset kabeh takon dhisik."
