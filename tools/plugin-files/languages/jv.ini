plugin-manager.plugin.name = Manajer plugin
plugin-manager.plugin.description = Ndhaptar plugin lan nguripake utawa mateni.
plugin-manager.plugin.how = "Manajer plugin ndhaptar saben plugin karo versi lan katrangane, lan nguripake utawa mateni plugin.\n\nSampeyan bisa nemokake ing Setelan, minangka Kelola plugin. Setelan plugin yaiku kaca dhewe kanggo preferensi kayata panggunaan jaringan saben plugin. Tutul plugin kanggo nguripake utawa mateni (nganggo tombol, pilih). Owah-owahan ditrapake sawise miwiti maneh: bar ing ngisor banjur nawakake Wiwiti maneh saiki. Tahan plugin (nganggo tombol, tahan Pilih) kanggo maca cara kerjane.\n\nPlugin sing ditandhani Tansah murub ora bisa dipateni, lan sing ditandhani Dibutuhake mung nganti plugin liyane nindakake tugase, utawa PaperPaw ora duwe dalan bali. Ing Layar sampeyan milih plugin endi sing nuduhake panggonan sing ditawakake akeh plugin."
