keyboard.plugin.name = Keyboard
keyboard.plugin.description = Ngetik teks ing layar, nganggo sentuh utawa tombol.
keyboard.plugin.how = "Keyboard mbukak saben ana sing butuh teks: telusuran, tembung sandi, cathetan utawa setelan. Bisa nganggo sentuh lan nganggo tombol wae.\n\nNganggo tombol, kiwa lan tengen mindhah ing sak baris, tombol kaca mindhah antar baris, Pilih mencet tombol lan Bali mbatalake; kiwa lan tengen muter ing sak baris, lan munggah lan mudhun tetep ing kolom sampeyan. Shift ndadekake aksara candhake kapital; pencet kaping pindho kanggo kabeh kapital, lan sapisan maneh kanggo mandheg. Tahan aksara (nganggo tombol: tahan Pilih ing aksara kuwi) kanggo kapitale, sing dipilih langsung, lan aksen kayata é lan è; ing basa Jerman, ä, ö, ü lan ß teka saka a, o, u lan s (nganggo tombol, keyboard ngandhani ing aksara-aksara kuwi). OK ngrampungake; nganggo tombol, tahan Bali kanggo ngrampungake saka ngendi wae (Bali wae mbatalake), utawa tahan Pilih ing tombol sing dudu aksara. Tempel nyisipake teks clipboard, lan Ponsel, yen ditawakake, ngidini sampeyan ngetik ing ponsel.\n\nIng setelan ing Piranti, Keyboard: Tata letak keyboard milih tata letak. Sacara standar manut basa menu; yen luwih saka siji, tombol ganti antarane. Tombol umlaut menehi tombol ä, ö, ü lan ß dhewe. Ukuran nggedhekake tombol lan aksara; nganggo tombol wae, larik tetep kaya keyboard komputer. Ing layar sentuh, Wujud tombol ngowahi rupane tombol. Kapital otomatis miwiti saben ukara nganggo kapital."
