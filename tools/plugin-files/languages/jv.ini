opds.plugin.name = Katalog OPDS
opds.plugin.description = Njelajah katalog OPDS, ngundhuh bukune lan njaga folder tetep sinkron karo katalog.
opds.plugin.how = "Katalog OPDS yaiku perpustakaan online kayata Project Gutenberg, Calibre-Web, Kavita utawa Komga. Plugin iki njelajah lan nelusuri kaya folder lan ngundhuh bukune menyang perpustakaan.\n\nBuka Katalog saka menu Alat lan pilih Tambah katalog: alamat lan, yen katalog butuh akun, jeneng pangguna lan tembung sandi. Tutul katalog kanggo njelajah; tahan (nganggo tombol, tahan Pilih) kanggo sinkron, ngowahi utawa nyopot.\n\nYen Sinkron katalog iki diurupake, Sinkron katalog ngundhuh buku anyar menyang foldere. Buku saben sinkron mbatesi pira buku sing dijupuk sapisan sinkron, supaya katalog gedhe ora ngebaki piranti. Folder cloud (WebDAV) bisa dienggo minangka ganti katalog."
