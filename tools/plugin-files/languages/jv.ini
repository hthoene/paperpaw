notes-vault.plugin.name = Gudhang cathetan
notes-vault.plugin.description = Maca folder cathetan Markdown miturut folder, tag lan owah-owahan paling anyar, karo widget kanggo layar ngarep. Mlaku karo gudhang Obsidian.
notes-vault.plugin.how = "Gudhang cathetan maca folder cathetan Markdown (berkas .md biasa, kaya sing disimpen aplikasi cathetan). Mlaku karo gudhang Obsidian.\n\nPilih folder gudhange ing setelan, utawa ing kaca gudhang ing alat. Kacane banjur nawakake folder kaya ing kertu, cathetan sing bubar diowahi, tag, lan telusuran ing judhul cathetan.\n\nSapisanan, gudhang diindeks ing latar mburi nalika kacane mbukak; gudhang kanthi ewonan cathetan butuh sawetara menit, banjur mbukak langsung. Indeks disimpen ing kertu lan digawe maneh yen kaca gudhang dibuka sawise sawetara jam, utawa yen sampeyan milih Anyari.\n\nCathetan mbukak ing pamaca. Pranala menyang cathetan liya ([[Note]], [[Note|words]], [[Note#Heading]]) ditemokake miturut jenenge cathetan ing ngendi wae ing gudhang; ngetutake siji mbukak cathetan iku, lan Bali bali menyang cathetan sadurunge.\n\nOra ana apa-apa ing gudhang sing tau diowahi. Widget kanggo layar ngarep (cathetan anyar, cathetan sing dipasangi pin, cathetan dina iki, cathetan acak, tag, telusuran) ditambahake ing panyunting layar ngarep. Widget bisa njupuk cathetane saka siji folder wae: tulisen path folder saka oyod kertu (contone Notes/Work) ing setelan widget; yen kosong, njupuk kabeh cathetan gudhang."
