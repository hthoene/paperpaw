calendar.plugin.name = Kalender
calendar.plugin.description = Kalender sampeyan ing pamaca: tampilan agenda, dina, pekan lan sasi saka CalDAV, iCal lan berkas, ulang tahun saka kontak, widget ngarep lan layar turu.
calendar.plugin.how = "Kalender sampeyan ing pamaca: agenda kanggo dina-dina sabanjure, dina, pekan lan sasi, kanthi acara saka kalender CalDAV (Nextcloud, Radicale, Baïkal, Fastmail lan liyane), saka alamat iCal (.ics, webcal://), saka berkas kalender ing kertu lan ulang tahun lan pengetan saka kontak sampeyan (CardDAV). Pamaca mung maca kalender; ora tau ngowahi.\n\nBuka Kalender saka menu alat. Larik pisanan nyebutake tampilan; pilih, utawa tahan larik apa wae utawa pencet Menu, kanggo ganti antarane Agenda, Dina, Pekan, Sasi lan Ulang tahun, kanggo nambah kalender utawa sinkron. Ing Dina lan Pekan rong larik pisanan pindhah menyang dina utawa pekan sadurunge lan sawise (tombol kaca uga); ing Sasi tombol panah mindhah dina, tombol kaca mindhah sasi, lan Pilih mbukak dina. Pilih ing acara nuduhake acara kanthi lengkap: kapan, ing ngendi, kalender endi lan kepriye bola-baline. Bali mundur siji langkah.\n\nTambah kalender ing Kalender (ing menu, utawa Kalender ing setelan). Pilih jenise: akun CalDAV (alamat server wis cukup, contone cloud.example.com/remote.php/dav; saben kalender sing duwe acara dadi bagean saka tampilan), alamat iCal (kalender sing diterbitake minangka .ics), berkas kalender ing kertu, utawa kontak (buku alamat CardDAV: pamaca nuduhake ulang tahun lan pengetan sing disimpen bareng). Lebokna alamat, kanggo akun jeneng pangguna lan tembung sandi (becike tembung sandi aplikasi; disimpen bareng tembung sandi pamaca), lan jeneng. Saben kalender duwe tandha (titik, bunder, titik kelabu utawa kothak) sing bisa sampeyan owahi, supaya bisa dibedakake; nganti enem kalender.\n\nAcara sing bola-balen (saben dina, saben pekan, saben sasi, saben taun, nganggo dina ing pekan, cacahan, tanggal pungkasan lan dina sing ditinggal), acara sedina muput lan acara ing zona wektu liya katon miturut jam pamaca dhewe. Pamaca nyimpen acara saka sawidak dina sadurunge nganti sawidak dina sawise dina iki, paling akeh 240, lan nuduhake tanpa jaringan. Aturan sing ora bisa diwaca nuduhake acarane sapisan wae.\n\nKalender diwaca nalika sampeyan mbukak kalender (paling kerep saben limang menit), nalika sampeyan milih Sinkron saiki, lan, miturut setelan ing Kalender, nalika jaringan wis murub utawa nalika ngisi daya diwiwiti. Pamaca ora tau ngurupake radione kanggo iki, kajaba yen sampeyan njaluk Sinkron saiki.\n\nWidget kanggo layar ngarep (tahan layar ngarep, banjur tambah widget): Dina iki nuduhake tanggal lan apa isi dina iku, Acara candhake nuduhake acara sing kapisan, Agenda dina-dina sabanjure, Sasi nuduhake sasi kanthi titik ing sangisore dina sing duwe acara, lan Ulang tahun nuduhake ulang tahun sabanjure. Tutulan ing acara mbukak acara iku, tutulan ing dina saka sasi mbukak dina kuwi. Layar turu bisa nuduhake agenda dina iki: pilih Kalender ing Layar turu ing setelan."
