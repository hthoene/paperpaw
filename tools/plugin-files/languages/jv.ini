lock.plugin.name = Kunci layar
lock.plugin.description = PIN, pola utawa tembung sandi nalika piranti tangi; sentuh dikunci nalika maca.
lock.plugin.how = "Kunci layar njaluk PIN, pola utawa tembung sandi nalika PaperPaw diwiwiti lan nalika piranti tangi. Wiwitane mati. Iki mung nyegah panggunaan sak-karepe: kode lan cacahan salah nyoba disimpen ing kertu SD, mula sapa wae sing nyopot kertu, ngowahi utawa nuker bisa liwat saka kunci.\n\nSetel ing setelan, ing Piranti, Kunci layar: lebokna kode sing lagi dienggo yen ana, pilih jenise, banjur kode anyar kaping pindho. Pola mung ditawakake ing layar sentuh.\n\nSawise limang salah nyoba, sing candhake nunggu setengah menit. Kunci saiki ngunci langsung lan bisa dilebokake ing tombol, gerakan utawa aturan. Kunci sawise tangi bisa dipateni, supaya mung wiwitan sejati (urup utawa miwiti maneh) sing ngunci, kajaba yen saben tangi iku wiwitan, kaya ing X4 nganggo baterai.\n\nKunci sentuh, ing jejere: Kunci sentuh ing panel cepet lan menu maca ndadekake tutulan, gesekan lan pena ora ana gunane nalika tombol isih mlaku, contone kanggo maca nalika tangan ing layar. Kanggo mbukak kunci, tutul kaping pindho nganggo siji driji lan tahan sedhela; nahan tombol daya mbukak menu Daya, sing ana Bukak kunci sentuh kanggo nindakake nganggo tombol; ing X4 Pro, nahan tombol ngarep mbukak kunci langsung."
