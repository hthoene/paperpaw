about.plugin.name = Babagan
about.plugin.description = Versi lan lisensi PaperPaw.
about.plugin.how = "Babagan nuduhake versi PaperPaw sing sampeyan duwe, ing ngendi kode sumbere, lan nganggo lisensi apa.\n\nSampeyan bisa nemokake ing pungkasan Setelan, minangka Babagan PaperPaw. Pilih larik nganggo tombol panah lan Pilih, utawa tutul. Plugin sing wis ana ing firmware lan, ing piranti sing mbukak plugin nganggo kode, sidik jari sing kudu dienggo mbangun plugin kuwi uga kadhaptar.\n\nLisensi mbukak minangka teks ing pamaca, dadi sampeyan mbalik kaca kaya ing buku. Isine lisensi PaperPaw dhewe lan lisensi fon, ikon lan pola pamisahan suku kata sing digawa bareng. Plugin bisa nambah baris dhewe, kayata panulis tema."
