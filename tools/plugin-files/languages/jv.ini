files.plugin.name = Penjelajah berkas
files.plugin.description = Ndhaptar buku lan folder ing piranti lan mbukak.
files.plugin.how = "Perpustakaan ndhaptar buku ing folder perpustakaan sampeyan, saben-saben nganggo sampul, judhul, penulis lan sepira adohe sampeyan wis maca. Buku sing sampeyan waca pungkasan ana ing ndhuwur minangka kertu, dadi nerusake maca mung butuh sapisan tutul, utawa sapisan pencet Pilih. Nalika perpustakaan nggoleki buku, ngandhani pira sing wis ketemu.\n\nPilih apa sing katon ing ndhuwur buku: kabeh, sing lagi diwaca, durung diwaca utawa wis rampung, utawa rak (miturut penulis, seri, tag, favorit, buku candhake saben seri sing wis sampeyan wiwiti). Tutul buku kanggo maca; tahan (nganggo tombol, tahan Pilih) kanggo mbukak, nandhani rampung utawa durung diwaca, ndeleng informasine, mindhah menyang arsip utawa mbusak. Tutul judhul kanggo menu perpustakaan: cara buku diurutake lan katon, telusuran, folder perpustakaan lan setelan.\n\nFolder perpustakaan disetel ing Setelan, ing Perpustakaan, minangka Folder perpustakaan; ing kana sampeyan uga bisa nuduhake buku minangka kothak sampul. Kanggo berkas liyane, gunakna Berkas ing menu Alat."
