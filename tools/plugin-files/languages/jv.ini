vocabulary.plugin.name = Kosakata
vocabulary.plugin.description = Nyimpen tembung sing digoleki, karo ukarane, lan mriksa kartu flash nganggo pangulangan sela-selang, digawe ing ponsel sampeyan.
vocabulary.plugin.how = "Kosakata nyimpen tembung sing sampeyan goleki nalika maca, saben-saben karo ukarane, kanggo ditliti mengko. Dhaptare ana ing Alat, sing paling anyar dhisik; pilih tembung kanggo nggoleki maneh. Larik pungkasan, Ekspor, nyimpen kanggo aplikasi kartu flash kayata Anki. Dhaptar nyimpen 2.000 tembung paling anyar: luwih saka iku, sing paling lawas ilang, mula ekspor dhisik kanggo nyimpen kabeh.\n\nKartu flash, uga ing Alat, nguji sampeyan nganggo pangulangan sela-selang: sawise Tuduhake wangsulan sampeyan menehi nilai saben kartu Baleni, Angel, Apik utawa Gampang, lan iku nemtokake kapan bali. Gawe dek nganggo Owahi nganggo ponsel: pindai kode nganggo ponsel ing Wi-Fi sing padha, banjur ketik kartu utawa tambah akeh sapisan: buka dek ing kana, pilih Akeh kartu sapisan lan pilih berkas CSV, TSV utawa TXT (saben baris siji kartu: ngarep, mburi, conto; UTF-8), tempel dhaptar, utawa gawa dek Anki (.apkg, diekspor nganggo Support older Anki versions).\n\nUtawa gunakna berkas ing kertu SD: selehna berkas CSV, TSV utawa TXT, utawa dek Anki (.apkg, diekspor nganggo Support older Anki versions), kanggo saben dek ing folder Flashcards (Spanish.tsv nggawe dek Spanish; saben baris siji kartu: ngarep, mburi, conto; disimpen minangka UTF-8; baris pisanan bisa nyebutake kolom ngarep, mburi, conto). Pilih Kartu ing kertu SD ing Kartu flash, utawa ben kelakon nalika sampeyan mbukak Kartu flash. Dek tetep ing pamaca karo apa sing sampeyan sinaoni, lan berkas digabung menyang deke yen anyar utawa diowahi: ganti mburi utawa conto kartu ing berkas lan kartu owah lan nyimpen kemajuane; ganti teks ngarep lan diitung minangka kartu anyar, sing lawas miwiti saka awal (kartu dibedakake miturut teks ngarep; spasi lan aksara kapital ora diitung); baris sing sampeyan busak ora mbusak kartu (kajaba yen sampeyan nyetel \"kartu sing ora ana ing berkas\" dadi Copot kanggo dek kuwi: banjur kartu dicopot nalika pembaruan candhake karo kemajuane, kanggo salawase, lan ora ana sing dicopot nalika ana baris ing berkas sing ora bisa diwaca). Simpen dek menyang berkase nganggo Simpen menyang kertu: berkas entuk nomer kartu (kolom id), mula sampeyan bisa ngowahi ngarep ing komputer lan kartu nyimpen apa sing sampeyan sinaoni; berkas mung nyimpen id, ngarep, mburi lan conto (kolom liyane, komentar lan urutan baris ora disimpen), lan panyimpenan ditolak nalika ana baris ing berkas sing ora bisa diwaca; berkas sing ana ing kana disalin menyang _name.bak.tsv sapisanan (panyimpenan candhake ora ngganti salinan iku). Berkas luwih saka 4 MiB utawa 20.000 baris ora diwaca, lan kudu disimpen minangka CSV UTF-8, ora UTF-16. Sapisanan, pamaca nggawe folder karo cathetan babagan cara kerjane.\n\nIng setelan, ing Maca, Tembung sing digoleki dadi kartu nglebokake saben tembung sing digoleki menyang dek Wis digoleki."
