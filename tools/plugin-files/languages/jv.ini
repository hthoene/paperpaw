fonts-browser.plugin.name = Fon liyane
fonts-browser.plugin.description = Nuduhake fon saka internet, saben-saben nganggo conto, lan ngundhuh kanggo maca.
fonts-browser.plugin.how = "Fon liyane ndhaptar fon saka perpustakaan fon ing internet, saben jeneng ditulis nganggo fon dhewe, lan ngundhuh sing sampeyan pengin kanggo maca.\n\nSampeyan bisa nemokake ing pungkasan dhaptar fon panggonan milih fon maca, ing Setelan, ing Maca, minangka Fon; baris status duwe entri sing padha kanggo fone. Tutul fon (nganggo tombol, pencet Pilih) kanggo ndeleng luwih gedhe karo ukara conto, banjur pilih Undhuh. Sampeyan bisa ninggalake kaca nalika ngundhuh. Yen wis rampung, pilih Waca nganggo (jeneng fon), utawa Gunakna kanggo baris status. Anyari njupuk versi sing luwih anyar, Copot mbusak fon saka piranti.\n\nButuh Wi-Fi.\n\nFON SAMPEYAN DHEWE\n\nIng jejere Fon liyane, dhaptar sing padha duwe Fon sampeyan dhewe, sing nuduhake bagean pitulung iki. Fon dhewe yaiku berkas .ttf utawa .otf, contone saka Google Fonts.\n\nIng Android lan piranti liyane sing nggambar berkas fon: salinen berkas menyang folder fon (ing Android: PaperPaw/fonts ing panyimpenan bareng), wiwiti maneh PaperPaw lan pilih fon ing Setelan, ing Maca, minangka Fon.\n\nIng Xteink X4 lan X4 Pro: pamaca iki maca paket fon, dudu berkas fon, amarga berkas fon ora cukup ing memorine. Gawe paket ing komputer nganggo paperpaw-fontgen, kanggo saben gaya sing sampeyan duwe (reguler dibutuhake):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nIki nggawe folder plugins/font-my-font. Salinen menyang folder plugins ing kertu memori, wiwiti maneh, lan pilih My Font minangka Fon. Paket siji gaya kira-kira setengah megabita kanggo aksara Latin; gaya sing ditinggal digambar nganggo reguler. Alat ngandhani pira aksara sing dijaluk ana ing fon (--chars latin,cyrillic,greek nambah aksara liyane): fon tanpa aksara buku sampeyan ora bisa nuduhake, mula goleka sing nyakup aksarane.\n\nFon saka Fon liyane mlaku kanthi cara sing padha lan ora butuh komputer.\n\nKanggo teks cilik sing luwih landhep ing panel e-ink, tambahna --hinting light ing prentah: nyocogake aksara karo kothak piksel, kaya fon standar digawe. Tanpa iku aksara digambar kaya sing dirancang desainer fon; --hinting normal lan --hinting mono nyocogake luwih kuwat. Fon nganggo tandha, kayata Arab utawa Devanagari, becike ora nganggo."
