store.plugin.description = Nggoleki, nginstal, nganyari lan nyopot plugin kanggo piranti iki.
store.plugin.how = "Toko plugin nggoleki plugin kanggo piranti iki ing internet lan nginstal, nganyari lan nyopot. Buka saka Alat; butuh Wi-Fi.\n\nWiwitane nuduhake apa sing disaranake perpustakaan, apa sing anyar utawa populer saiki, banjur klompok-klompoke. Klompok ndhaptar plugine kanthi campuran adil sing owah saben dina, supaya saben plugin katon; urutna saka A nganti Z, miturut sing paling anyar utawa pembaruan pungkasan, lan menyang aksara ing dhaptar sing dawa. Buka siji kanggo ndeleng kacane, karo ukuran lan memori sing dibutuhake, banjur pilih Instal, Anyari utawa Copot. Anyari kabeh nganyari saben plugin sing wis diinstal.\n\nPlugin kode mlaku kanthi akses kebak menyang piranti: toko ngandhani lan takon dhisik, lan diwiwiti sawise miwiti maneh. Yen ana sing salah, PaperPaw miwiti tanpa plugin kode lan ngandhani endi. Perpustakaan plugin nyetel saka ngendi dhaptar teka.\n\nPlugin komunitas, ing Setelan, Sistem, uga ndhaptar plugin sing diterbitake wong liya ing GitHub. Ora ana sing mriksa: ditandhani Durung dipriksa, kaca plugin kode nuduhake kunci sing dienggo nandhatangani, lan pembaruan sing ditandhatangani kunci liyane ora diinstal.\n\nSumber, larik pungkasan ing wiwitan, nambah dhaptar plugin saka wong liya miturut alamate (https://…/plugins.json), ndhaptar siji ing gantine PaperPaw, utawa nyopot. Tinimbang ngetik, selehna berkas sources.txt karo siji alamat saben baris ing .paperpaw/plugins/store ing kertu: alamat katon ing Sumber minangka anyar. PaperPaw ora mriksa sumber utawa plugine, lan piranti ngubungi server sumber. Sumber nandhatangani dhaptare; piranti nyimpen kunci saka dhaptar pisanan sing diwaca lan wiwit iku mung nampa dhaptar lan plugin kode sing ditandhatangani kunci kuwi. Plugin entuk pembaruan mung saka sumber sing dienggo nginstal. Perpustakaan PaperPaw dhewe tansah ana lan ora bisa dicopot; metu saka toko bali menyang kono."
