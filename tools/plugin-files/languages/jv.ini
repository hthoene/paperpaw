news.plugin.name = Warta
news.plugin.description = Njupuk feed warta (RSS, Atom) minangka buku kanggo diwaca.
news.plugin.how = "Warta ngowahi feed RSS utawa Atom dadi buku. Saben feed dadi siji buku ing folder Warta ing perpustakaan, karo artikel paling anyar minangka teks biasa, kanggo diwaca kaya buku liyane.\n\nBuka Warta saka menu Alat lan pilih Tambah feed; alamate ana ing situs web koran utawa blog. Jupuk warta njupuk kabeh feed lan ngganti buku sadurunge. Tahan feed (nganggo tombol, tahan Pilih) kanggo njupuk utawa nyopot dhewe. Feed sing dicopot ninggalake bukune ing perpustakaan.\n\nNjupuk butuh jaringan. Artikel saben feed (Setelan, Perpustakaan) nyetel pira artikel sing ana ing saben buku. Widget Judhul warta nuduhake ing layar ngarep."
