update.plugin.name = Pembaruan
update.plugin.description = Nginstal pembaruan firmware, saka kertu utawa diundhuh saka internet.
update.plugin.how = "Pembaruan nginstal firmware anyar, ing piranti sing PaperPaw dadi firmware, kayata X4. Sampeyan bisa nemokake ing setelan, minangka Pembaruan.\n\nTelusuri online njaluk server pembaruan kanggo PaperPaw sing luwih anyar lan ngundhuh, sing butuh sawetara menit liwat Wi-Fi. Utawa salinen berkas pembaruan (kanthi pungkasan .bin, saka paperpaw.org) menyang folder updates ing kertu, contone nganggo Transfer Wi-Fi. Instal banjur butuh kira-kira sakmenit lan piranti miwiti maneh; buku, setelan lan panggonan maca tetep.\n\nKanthi Goleki pembaruan diurupake (ing setelan, mati ing wiwitan), piranti takon kira-kira saben pekan dhewe, mung nalika Wi-Fi wis murub utawa ngisi daya. PaperPaw sing luwih anyar sing ditemokake nunggu ing kene; ora ana sing ngganggu maca sampeyan. Panelusuran ngirim apa sing dilakokake piranti, tanpa jeneng utawa nomere; kanggo ngitung piranti, uga apa sampeyan sing njaluk lan apa iki panelusuran pisanan ing dina, pekan utawa sasi.\n\nYen plugin sing sampeyan enggo durung duwe versi kanggo rilis anyar, pembaruan nunggu. Versi sing luwih lawas diinstal mung yen sampeyan milih.\n\nFirmware liyane, kayata CrossPoint, uga diinstal saka kene: selehna berkase (kanthi pungkasan .bin) ing folder updates, lan buka Pembaruan. PaperPaw mriksa manawa iku firmware lengkap kanggo piranti iki, ora rusak, nanging ora bisa ngerti sapa sing nggawe, amarga ora ditandhatangani. Instal sanajan ngono nulis ing separo liyane saka flash, lan piranti miwiti; PaperPaw tetep ing separone nganti firmware kuwi nginstal apa-apa ing ndhuwure. Kanggo bali menyang PaperPaw mengko, instal berkas instal-e (paperpaw-<device>-<version>-install.bin) saka menu firmware liyane, kayata pembaruan firmware SD CrossPoint."
