calibre.plugin.name = Perpustakaan nirkabel
calibre.plugin.description = Nampa buku liwat jaringan. Dienggo minangka piranti nirkabel kanggo calibre.
calibre.plugin.how = "Perpustakaan nirkabel ndadekake piranti katon ing Calibre ing komputer sampeyan minangka piranti nirkabel. Calibre banjur bisa ngirim buku menyang kono, ndhaptar lan mbusak. Bukune mlebu ing perpustakaan.\n\nBuka Perpustakaan nirkabel saka menu Alat, karo piranti lan komputer ing jaringan Wi-Fi sing padha. Ing Calibre pilih Connect/share, banjur Start wireless device connection. Yen piranti wis nemokake komputer sampeyan, jenenge katon; tutul Sambungake (nganggo tombol, pencet Pilih). Calibre bisa nambah lan mbusak buku ing kene, mula sambungake mung menyang komputer sampeyan dhewe. Nutup layar mungkasi sambungan.\n\nYen Calibre ora ketemu dhewe, lebokna alamat komputere ing Setelan, ing Perpustakaan, minangka Alamat ing bagean Calibre. Yen Calibre nggunakake port liyane saka 9090, tambahna minangka :port, contone 192.168.1.20:9091."
