stats.plugin.name = Statistik maca
stats.plugin.description = Nyathet suwene lan akehe sampeyan maca, karo kalender lan angka saben buku.
stats.plugin.how = "Statistik maca nyathet suwene sampeyan maca saben kaca. Sampeyan ndeleng minangka ringkesan karo dina iki, pekan lan runtutan, minangka kalender, lan karo angka saben buku.\n\nBuka saka Alat, utawa saka Liyane ing pamaca. Ing setelan, ing Statistik maca, sampeyan bisa mateni Catet maca, nyetel Target saben dina, lan nyetel Kaca paling cendhak lan Kaca paling dawa sing diitung, supaya mbalik-mbalik utawa buku sing dibiyarake mbukak ora ngganggu angka-angka.\n\nSinkron karo KOReader nuduhake statistik karo KOReader liwat folder WebDAV. Uga njupuk statistik KOReader ing piranti sing padha. Nyathet butuh jam sing wis disetel: yen durung, sambungna menyang Wi-Fi sapisan."
