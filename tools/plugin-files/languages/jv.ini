diagnostics.plugin.name = Diagnostik
diagnostics.plugin.description = Layar tes lan pamriksan terpandu saben bagean piranti.
diagnostics.plugin.how = "Diagnostik minangka layar tes kanggo mriksa piranti: nuduhake saben tingkat kelabu sing bisa ditampilake panel, patang kothak kanggo nyoba tombol lan sentuh, lan cacahan kaca nganggo bar kemajuan kanggo mbandhingake mode nyegerake.\n\nLayar tes ora duwe entri menu. Iku mung dadi layar ngarep yen ora ana plugin liya sing nawakake, utawa yen sampeyan milih ing Layar ing manajer plugin kanggo panggonan Layar ngarep.\n\nPilih menehi tandha kothak sing difokusake, lan tombol panah pindhah antarane kothak; nganggo sentuh, tutul kothak. Tombol kaca mbalik kaca tes. Tahan Pilih, utawa tahan driji ing layar, kanggo miwiti saka awal.\n\nPamriksan piranti, ing Alat yen PaperPaw dadi firmware piranti, nglakoni saben bagean piranti kaca siji-siji: layar, tombol, sentuh, lampu ngarep, baterai, kertu, jam, Wi-Fi, turu lan memori. Saben kaca ditutup nganggo Gagal, Lewati lan Lulus, wangsulan sing disaranake pangukurane wis kapilih; bagean sing ora ana ing piranti dilewati. Sawise saben wangsulan ditulis laporan menyang .paperpaw/plugins/diagnostics/device-check.txt, kanggo ditempel ing pull request. Bali metu saka kono, lan terus ing panggonan sing ditinggal yen dibuka maneh. Ing piranti sing mung nganggo tombol, pilih Wiwiti ing kaca tombol dhisik; nganti iku panah, Pilih lan Bali mlaku kaya ing saben kaca."
