power.plugin.name = Daya
power.plugin.description = Milih mode daya, kanthi tangan utawa miturut baterai: Normal, Irit, Offline.
power.plugin.how = "Daya milih cara PaperPaw nggunakake baterai: Normal, Irit utawa Offline. Irit nindakake apa sing bisa ditundha ing wektu sing luwih apik; Offline njaga radio tetep mati. Otomatis milih miturut baterai.\n\nOwahi mode ing panel cepet, ing ngendi Daya nuduhake mode jejer-jejer, utawa ing Setelan ing Daya. Ing kana sampeyan uga nyetel tingkat ing ngendi Otomatis pindhah menyang Irit lan menyang Offline, lan apa tetep Normal nalika ngisi daya.\n\nIng baris status, Mode daya nuduhake godhong nalika irit lan Wi-Fi sing dicoret nalika offline, lan ora ana apa-apa ing Normal.\n\nTahan tombol daya kanggo mbukak menu cilik: Turu, Pateni (yen PaperPaw bisa), Wiwiti maneh, lan ing piranti sentuh Kunci sentuh utawa Bukak kunci sentuh. Pencetan cendhak isih nglebokake piranti turu. Bali ninggalake menu."
