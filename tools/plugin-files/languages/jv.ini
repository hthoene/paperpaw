sleep.plugin.name = Layar turu
sleep.plugin.description = Nuduhake kucing turu, sampul buku, gambar sampeyan utawa pesen nalika piranti turu.
sleep.plugin.how = "Layar turu nemtokake apa sing katon ing layar nalika piranti turu. E-ink njaga gambar tanpa daya.\n\nPilih ing setelan, ing Piranti, Layar turu, karo Tuduhake: kucing turu (standar), sampul buku, gambar-gambarku, logo lan “Turu”, widget, kaca kaya sing ana, utawa kaca karo gambar. Gambar-gambarku nuduhake berkas ing folder Pictures siji-siji.\n\nTanpa sampul utawa gambar kucing sing katon. Yen sistem nggambar layar turu dhewe, setelan iki didelikake.\n\nLayar mati, Tuduhake nalika dipateni, digambar sapisan nalika piranti dipateni, saka menu daya utawa sawise wektune Pateni sawise turu (ora yen baterai entek mutusake daya). Padha karo layar turu kajaba yen sampeyan milih logo lan “Dipateni”, kucing, sampul utawa gambar-gambarku. Plugin liyane bisa nawakake layar kanggo iku.\n\nLayar wiwitan lan miwiti maneh, Tuduhake nalika miwiti lan Tuduhake nalika miwiti maneh, yaiku duweke piranti kajaba yen plugin liyane nawakake layar kanggo iku. Plugin durung mlaku nalika piranti miwiti: layar sing dipilih kanggo wiwitan digambar luwih dhisik, nalika piranti dipateni utawa miwiti maneh, lan katon nalika wiwitan candhake. Layar sing durung siyap ing wektune, utawa gambar sing rusak, ngalah marang duweke piranti; piranti dipateni utawa miwiti maneh ing kasus apa wae."
