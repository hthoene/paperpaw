profiles.plugin.name = Profil maca
profiles.plugin.description = Set setelan maca lan tampilan kanthi jeneng, diganti nganggo sapisan tutulan.
profiles.plugin.how = "Profil nyimpen setelan maca, setelan tampilan lan baris status sampeyan kanthi jeneng, kayata Wengi utawa Cetakan gedhe, lan nggawa bali kanthi sapisan tutulan.\n\nBuka Profil ing menu maca ing Liyane, utawa ing Setelan ing Sesuaikan. Tutul profil kanggo nganggo; sing lagi dienggo ditandhani. Tahan (nganggo tombol, tahan Pilih) kanggo nyimpen setelan saiki ing kono, ngganti jeneng utawa nyopot. Simpen minangka profil anyar nyimpen apa sing disetel saiki.\n\nProfil candhake pindhah menyang sing candhake ing dhaptar; selehna ing tombol utawa ing aturan."
