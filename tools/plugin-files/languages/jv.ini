keys.plugin.name = Tombol lan gerakan
keys.plugin.description = Apa sing ditindakake saben tombol, zona tutulan lan gesekan, diowahi ing piranti.
keys.plugin.how = "Tombol lan gerakan nuduhake apa sing ditindakake saben tombol, zona tutulan lan gesekan, lan ngidini sampeyan ngowahi ing piranti.\n\nBuka ing setelan, ing Piranti. Pisanan pilih panggonan owah-owahan ditrapake: Ing ngendi wae, Nalika maca, Ing layar ngarep, Ing perpustakaan utawa ing siji alat. Banjur pilih input, kayata tombol sing ditahan utawa gesekan saka pinggir, lan pilih aksi saka dhaptar, sing bisa ditelusuri. Kaya standar mbalekake apa sing disetel plugin lan tata letak tombol.\n\nIng X4, owah-owahan sing ora ninggalake tombol kanggo milih, bali utawa nerusake ditolak. Reset tombol lan gerakan ing pungkasan mbatalake saben owah-owahan."
