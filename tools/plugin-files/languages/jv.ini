file-manager.plugin.description = Saben folder lan berkas ing piranti: buka, ganti jeneng, pindhah, salin lan busak.
file-manager.plugin.how = "Manajer berkas nuduhake saben folder lan berkas ing panyimpenan piranti, ora mung buku sampeyan, lan ngidini sampeyan mbukak, ngganti jeneng, mindhah, nyalin lan mbusak, uga nggawe folder anyar.\n\nBuka Berkas saka menu Alat. Tutul folder kanggo mlebu; Bali menyang folder ing ndhuwur. Tutul berkas, utawa tahan entri apa wae (nganggo tombol, tahan Pilih), kanggo ndeleng apa sing bisa ditindakake. Pindhah lan Salin milih entri kuwi: menyang folder panggonane lan pilih Tempel ing kene ing bar ing ngisor. Nganggo tombol, pencet Mudhun saka entri pungkasan kanggo tekan bar.\n\nBerkas lan folder sing diwiwiti titik, kayata data PaperPaw dhewe, didelikake. Kanggo ndeleng, urupna Berkas sing didelikake ing Setelan, ing Perpustakaan."
