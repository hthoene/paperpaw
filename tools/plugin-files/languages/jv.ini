reading-goal.plugin.name = Target maca
reading-goal.plugin.description = Menit maca saben dina, lan kucing ing layar ngarep sing swasanane manut maca dina iki.
reading-goal.plugin.how = "Kucing ing layar ngarep sampeyan nuduhake kepriye maca dina iki: sedhih yen sampeyan durung maca, biasa wae sawise sithik, marem wiwit setengah target saben dina, seneng yen wis tekan.\n\nTambah widget Kucing maca ing layar ngarep (tahan layar ngarep, banjur tambah widget), utawa pilih Kucing maca dina iki minangka layar turu. Tutulan ing kucing mbukak target saben dina; iki target statistik maca, sing ngitung menit sing sampeyan waca.\n\nIng setelan, ing Maca, Marem wiwit lan Seneng wiwit nyetel wiwit pira bagean target kucing marem utawa seneng, lan Gambar dhewe folder gambar (sedhih, biasa, marem lan seneng) sing katon minangka ganti kucing. Gambare berkas PNG utawa JPEG; tanpa folder, kucing sing katon."
