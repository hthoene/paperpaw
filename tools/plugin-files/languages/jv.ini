transfer.plugin.name = Transfer
transfer.plugin.description = Nglebokake buku lan berkas liyane menyang piranti saka browser ing jaringan sing padha.
transfer.plugin.how = "Transfer Wi-Fi nglebokake buku lan berkas liyane menyang piranti saka browser ing jaringan sing padha, tanpa kabel utawa aplikasi. Sampeyan uga bisa njupuk berkas, nggawe folder lan mbusak.\n\nBuka saka Alat. Layar nuduhake alamat minangka teks lan kode QR: buka ing browser ing ponsel utawa komputer, utawa pindai kode. Alamat ngemot kunci sing digawe anyar saben-saben, mula wong liya ing jaringan ora bisa tekan berkas sampeyan. Transfer mlaku nalika layar mbukak.\n\nIng panggonan PaperPaw mlakokake Wi-Fi dhewe, kaya ing X4, Tanpa router ing ngisor mbukak jaringan duweke piranti dhewe, sing digabungi ponsel kanthi mindai kode."
