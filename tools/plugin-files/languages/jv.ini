widgets.plugin.name = Paket widget
widgets.plugin.description = Akeh widget liyane kanggo layar ngarep: jam, kalender, kutipan, buku, cathetan lan liyane.
widgets.plugin.how = "Paket widget nambah akeh widget kanggo layar ngarep: jam (analog, tembung, ubin, donya), kalender, taun nganti saiki, itungan mundur, fase rembulan, lan dina lan tanggal; kutipan dina iki, cathetan, dhaptar tugas, gambar, salam lan logo PaperPaw; lan kanggo buku, lagi diwaca, kemajuan, candhake, seri, favorit, sorotan lan perpustakaan ing angka. Widget baterai uga ana ing kono.\n\nTambah nganggo Owahi layar ngarep ing menu (utawa penekan dawa ing layar ngarep), banjur Tambah widget. Saben duwe setelan dhewe, kayata pigura, ukuran lan perataan. Milih widget sing owah, kayata kutipan dina iki, nuduhake sing candhake. Kutipan sampeyan dhewe mlebu ing quotes.txt ing .paperpaw/plugins/widgets ing kertu, saben baris minangka teks | penulis. Widget wektu butuh jam sing wis disetel; Wi-Fi nyetel."
