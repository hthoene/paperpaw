smart-home.plugin.name = Smart home
smart-home.plugin.description = Nilai lan saklar saka Home Assistant sampeyan dhewe ing dashboard lan minangka widget layar ngarep. Mlaku karo Home Assistant ing jaringan omah sampeyan.
smart-home.plugin.how = "Smart home nuduhake nilai lan saklar saka Home Assistant sampeyan dhewe: suhu, kelembapan, energi, lawang lan jendhela, lampu, saklar lan adegan. Ngobrol karo server sampeyan liwat REST API ing jaringan omah; ora ana sing liwat layanan liya.\n\nBuka Smart home saka menu alat, banjur Sambungan: ketik alamat Home Assistant sampeyan (contone http://homeassistant.local:8123) lan token akses sing awet (gawe ing ngisor kaca profil Home Assistant sampeyan). Token disimpen ing antarane tembung sandi lan kunci, ora tau ing berkas setelan. Http biasa mung dienggo kanggo alamat ing jaringan omah sampeyan; kanggo server ing panggonan liya urupna “Server ing njaba jaringan omah” ing setelan lan gunakna https karo sertifikat sing sah.\n\nPilih entitas mbukak dhaptar apa sing diduweni server sampeyan: telusuri miturut jeneng utawa id lan pilih entitas kanggo nuduhake (pilih maneh kanggo nyopot). Sampeyan bisa menehi kamar, sing ngklompokake ing dashboard lan ing widget kamar. Nganti 24 entitas disimpen. Ing dashboard pilih lampu, saklar utawa adegan kanggo ngganti: larik nuduhake wangsulane server. Sensor sing sampeyan pilih diwaca maneh.\n\nWidget (tahan layar ngarep, banjur tambah widget): Nilai Smart home nuduhake siji wacan gedhe, klompok ndhaptar entitas saka kamar, saklar yaiku tombol kanggo siji lampu utawa saklar, lan kamar yaiku kertu karo wacan lan saklar saka kamar. Setelan saben widget ngandhani entitas utawa kamar endi sing ditampilake.\n\nOmah diwaca nalika sampeyan mbukak dashboard, nalika sampeyan njaluk (larik Segerake utawa tutulan ing widget nilai utawa klompok), nalika pamaca tangi ing panggonan sing Wi-Fi wis murub, lan miturut jadwal sing sampeyan setel nalika pangisi daya dicolok. Ora tau ngurupake radio dhewe lan ora tau njaga tetep murub."
