picture-home.plugin.name = Layar ngarep nganggo gambar
picture-home.plugin.description = Layar ngarep karo gambar sampeyan dhewe ing mburi widget, lan bar status sing bisa sampeyan setel.
picture-home.plugin.how = "Layar ngarep nganggo gambar ngganti layar ngarep nalika murub: gambar sampeyan dhewe ing mburi widget, lan kaca widget lan alat sing sampeyan atur. Pateni ing manajer plugin lan layar ngarep bawaan bali, karo kaca-kacane dhewe.\n\nSelehna gambar (JPEG, PNG utawa GIF) ing folder ing kertu (wallpapers sacara standar), banjur pilih siji ing Setelan, Sesuaikan, Layar ngarep nganggo gambar. Pas ngandhani cara ngisi layar (isi, gambar kabeh, melar, ukuran asli, ubin), Posisi bagean endi sing tetep, Zoom sepira gedhe, lan Padhangna gambar sepira pucet: gambar sing luwih pucet ndadekake widget luwih gampang diwaca. Gambar disiapake sapisan kanggo saben ukuran layar, sing butuh sawetara wektu.\n\nWidget lungguh ing piring ing ndhuwur gambar. Atur kaca kaya ing layar ngarep bawaan: potlot ing ngisor kaca, utawa Owahi layar ngarep ing menu.\n\nBar status (wektu, Wi-Fi, baterai, utawa apa sing sampeyan pilih) bisa murub, mati utawa otomatis, ing ndhuwur utawa ngisor, amba kebak utawa pil cilik ing kiwa, tengah utawa tengen, ing piring padhang, peteng utawa kelabu utawa ing gambar dhewe. Larik sing nyebutake tombol (ing X4) bisa murub, mati utawa otomatis uga. Otomatis tegese pencetan tombol nuduhake sawetara detik; pencetan kuwi ora nindakake liyane.\n\nPanggambaran gambar nuduhake cara gambar digambar: Tingkat kelabu ing saben kelabu sing diduweni layar (luwih alon ing X4), Dither nganggo titik ireng-putih (cepet), utawa Otomatis, kaya layar ngarep bawaan: tingkat kelabu nalika layar digambar, titik sawise owah-owahan pisanan. Yen layar ora duwe tingkat kelabu, tingkat kelabu bali dadi titik."
