update.plugin.name = Atualização
update.plugin.description = Instala atualizações de firmware do cartão ou baixadas da internet.
update.plugin.how = "Atualização instala um novo firmware nos dispositivos em que o PaperPaw é o firmware, como o X4. Ela fica em Configurações, Atualização.\n\nBuscar online consulta o servidor de atualizações e baixa uma versão mais recente do PaperPaw, o que leva alguns minutos por Wi-Fi. Você também pode copiar um arquivo de atualização (terminado em .bin, de paperpaw.org) para a pasta updates do cartão, por exemplo pela transferência Wi-Fi. A instalação leva cerca de um minuto e o dispositivo reinicia; livros, configurações e posições de leitura são mantidos.\n\nCom Buscar atualizações ativado nas configurações (desativado inicialmente), o dispositivo verifica sozinho cerca de uma vez por semana, apenas quando o Wi-Fi já está ligado ou durante a carga. Uma nova versão fica aguardando aqui, sem interromper sua leitura. A busca envia a versão em uso, sem nome nem número do dispositivo; para contar dispositivos, também informa se você iniciou a busca e se é a primeira do dia, da semana ou do mês.\n\nSe algum plugin em uso ainda não tiver uma versão compatível, a atualização aguarda. Uma versão anterior só é instalada se você a escolher.\n\nOutro firmware, como o CrossPoint, também pode ser instalado aqui: coloque o arquivo .bin dele na pasta updates e abra Atualização. O PaperPaw verifica se é um firmware completo e íntegro para este dispositivo, mas não pode identificar o autor, pois ele não é assinado. Instalar mesmo assim grava na outra metade da memória flash, e o dispositivo inicia esse firmware; o PaperPaw fica na sua metade até que o outro firmware a sobrescreva. Para voltar ao PaperPaw, instale o arquivo de instalação dele (paperpaw-<device>-<version>-install.bin) pelo menu do outro firmware, como SD firmware update no CrossPoint."
