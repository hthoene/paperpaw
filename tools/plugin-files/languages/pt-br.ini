vocabulary.setting.sd-folder.help = No cartão SD: cada arquivo CSV, TSV ou Anki nela é um baralho.
vocabulary.sd.readme = "Cartões de estudo a partir de arquivos\n\nColoque aqui um arquivo por baralho: Espanhol.tsv cria o baralho Espanhol.\nArquivos: .tsv, .csv ou .txt salvos como UTF-8, ou .apkg: um baralho Anki exportado com Suportar versões mais antigas do Anki marcado. Os três primeiros campos das notas viram frente, verso e exemplo. O agendamento e a mídia não são lidos, e o PaperPaw nunca grava em arquivos Anki.\n\nUm cartão por linha: frente, verso e exemplo opcional, separados por tabulação, vírgula ou ponto e vírgula. A primeira linha pode nomear as colunas: front, back, example. Exemplo:\n\nKatze\tgato\tDie Katze schläft.\n\nDepois abra Cartões de estudo no leitor, escolha Cartões no cartão SD e Atualizar baralhos do cartão.\n\nBom saber:\n- Os baralhos ficam no leitor com seu progresso de aprendizado. Um arquivo é lido quando é novo ou foi alterado, e seus cartões são adicionados ao baralho ou atualizados nele.\n- Altere o verso ou o exemplo no arquivo: o cartão muda e mantém seu progresso.\n- Altere o texto da frente no arquivo: conta como um cartão novo e o antigo recomeça. Os cartões são identificados pelo texto da frente, sem considerar espaços e maiúsculas. Salve um baralho em arquivo (Cartões no cartão SD, Salvar baralho no cartão) para cada cartão ter um número na coluna id. Altere a frente ali, mantenha as duas primeiras linhas do arquivo e o cartão preservará seu progresso.\n- Salvar grava os cartões do baralho. O que estava no arquivo sem ser cartão (uma linha sem frente) não é mantido. O arquivo anterior é copiado para _nome.bak.tsv.\n- Salve o arquivo como CSV UTF-8, nunca UTF-16 nem no formato próprio da planilha. Arquivos acima de 4 MiB ou 20.000 linhas não são lidos: divida-os.\n- Excluir uma linha do arquivo não exclui o cartão do baralho, a menos que você ative Remover cartões ausentes para esse baralho. Nesse caso, o cartão e seu progresso são removidos.\n- Arquivos cujo nome começa com _ não são lidos.\n"
