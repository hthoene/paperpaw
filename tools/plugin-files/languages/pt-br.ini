files.plugin.name = Navegador de arquivos
files.plugin.description = Lista e abre os livros e as pastas do dispositivo.
files.plugin.how = "A biblioteca lista os livros da sua pasta de biblioteca, com capa, título, autor e progresso de leitura. O último livro lido aparece no topo como um cartão: basta tocar ou pressionar Selecionar para continuar. Enquanto procura livros, a biblioteca informa quantos já encontrou.\n\nAcima dos livros, escolha o que mostrar: todos, em leitura, não lidos ou concluídos, ou as estantes (por autor, série, etiqueta, favoritos, próximo livro de cada série iniciada). Toque em um livro para ler; mantenha-o pressionado (com botões, segure Selecionar) para abrir, marcar como concluído ou não lido, ver informações, arquivar ou excluir. Toque no título para abrir o menu da biblioteca: ordenação, exibição, busca, pasta da biblioteca e configurações.\n\nA pasta é definida em Configurações, Biblioteca, Pasta da biblioteca; ali você também pode exibir os livros em uma grade de capas. Para os outros arquivos, use Arquivos no menu Ferramentas."
