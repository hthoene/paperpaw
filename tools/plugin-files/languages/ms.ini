reader.plugin.name = Pembaca
reader.plugin.description = Menunjukkan buku halaman demi halaman, dengan jadual kandungan dan tetapan bacaan.
reader.plugin.how = "Pembaca menunjukkan buku halaman demi halaman. Buka buku daripada pustaka; buku terakhir boleh dibuka semula semasa permulaan (tetapan Buka buku terakhir semasa permulaan).\n\nKetik bahagian kiri atau kanan skrin, atau gunakan butang halaman, untuk menukar halaman. Ketik bahagian tengah atau tekan Pilih untuk menu bacaan: Kandungan, Cari, Pergi ke halaman, Fon dan reka letak, Penanda buku dan serlahan dan lagi. Ke bawah dari tepi atas membuka panel pantas, ke atas dari tepi bawah pergi ke skrin utama; begitu juga menahan Kembali.\n\nTahan Pilih (atau tahan gambar) untuk melihat gambar skrin penuh: Kiri dan Kanan melangkah melalui gambar pada halaman. Pilih mengezum kepada 2x, 3x dan kembali (ketik dua kali pada sentuhan); semasa dizum, Kiri dan Kanan menggerakkan gambar ke sisi, butang halaman (atau leretan) bergerak merentas dan ke bawah. Kembali pulang ke muatan, kemudian ke halaman (tahan untuk keluar pada sentuhan). Ketik penjuru kanan atas untuk penanda buku. Tahan perkataan untuk menyerlahkannya. Dengan butang, tahan Kiri: Kiri dan Kanan bergerak mengikut perkataan, butang halaman mengikut baris, menahannya pergi ke hujung halaman dan mengikut perenggan; Pilih membuka bar serlahan untuk perkataan itu, menahan Pilih meluaskannya kepada ayat dan perenggan (kemudian Kiri dan Kanan menggerakkan hujung, menahannya menggerakkan permulaan). Pilihan diteruskan melepasi pertukaran halaman. Eksport sebagai Markdown menyimpan nota anda."
