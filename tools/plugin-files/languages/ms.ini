lock.plugin.name = Kunci skrin
lock.plugin.description = PIN, corak atau kata laluan apabila peranti bangun; sentuhan dikunci semasa membaca.
lock.plugin.how = "Kunci skrin meminta PIN, corak atau kata laluan apabila PaperPaw bermula dan apabila peranti bangun. Pada mulanya ia mati. Ia hanya menghalang penggunaan sambil lewa: kod dan bilangan percubaan yang salah disimpan pada kad SD, jadi sesiapa yang mengeluarkan kad itu, mengeditnya atau menukarnya dapat melepasi kunci.\n\nTetapkannya dalam tetapan, di bawah Peranti, Kunci skrin: masukkan kod yang digunakan jika ada, pilih jenisnya, kemudian kod baharu dua kali. Corak hanya ditawarkan pada skrin sentuh.\n\nSelepas lima percubaan yang salah, percubaan berikutnya menunggu setengah minit. Kunci sekarang mengunci serta-merta dan boleh diletakkan pada butang, gerak isyarat atau peraturan. Kunci selepas bangun boleh dimatikan, supaya hanya permulaan sebenar (dihidupkan atau dimulakan semula) mengunci, kecuali jika setiap bangun ialah permulaan, seperti pada X4 yang menggunakan bateri.\n\nKunci sentuhan, di sebelahnya: Kunci sentuhan dalam panel pantas dan menu bacaan menjadikan ketikan, leretan dan pen tidak berbuat apa-apa sementara butang masih berfungsi, cth. untuk membaca dengan tangan di atas skrin. Untuk membuka kunci, ketik dua kali dengan satu jari dan kekalkan seketika; menahan butang kuasa membuka menu Kuasa, tempat Buka kunci sentuhan melakukannya dengan butang; pada X4 Pro, menahan kekunci utama membuka kunci serta-merta."
