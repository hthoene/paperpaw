dictionary.plugin.name = Kamus
dictionary.plugin.description = Mencari perkataan dalam kamus StarDict.
dictionary.plugin.how = "Kamus mencari perkataan daripada buku dalam kamus StarDict dan menunjukkan takrifannya dalam panel di atas bahagian bawah skrin.\n\nDalam pembaca, tahan perkataan dan pilih Cari; dengan butang, gunakan Pilih teks di bawah Lagi. Salin folder kamus (dengan fail .ifo, .idx dan .dict) ke dalam folder \"dictionaries\" pada peranti, termasuk subfolder, atau pilih folder lain dalam Tetapan, di bawah Bacaan, sebagai Folder kamus (tetapan lanjutan). Carian pertama menyediakan indeks kecil bagi setiap kamus, yang mengambil sedikit masa.\n\nDalam panel, butang halaman atau Atas dan Bawah menatal takrifan yang panjang, dan Kembali menutupnya. Dengan sentuhan, ketik di luarnya untuk menutup."
