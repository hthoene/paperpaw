notes-vault.plugin.name = Peti nota
notes-vault.plugin.description = Membaca folder nota Markdown mengikut folder, teg dan perubahan terkini, dengan widget untuk skrin utama. Berfungsi dengan peti Obsidian.
notes-vault.plugin.how = "Peti nota membaca folder nota Markdown (fail .md biasa, seperti yang disimpan oleh apl nota). Ia berfungsi dengan peti Obsidian.\n\nPilih folder peti dalam tetapan, atau pada halaman peti dalam alat. Halaman itu kemudian menawarkan folder seperti yang ada pada kad, nota yang terakhir diubah, teg, dan carian dalam tajuk nota.\n\nPada kali pertama, peti diindeks di latar belakang semasa halamannya dibuka; peti dengan beribu-ribu nota mengambil beberapa minit, kemudian dibuka serta-merta. Indeks disimpan pada kad dan dibuat semula apabila halaman peti dibuka selepas beberapa jam, atau apabila anda memilih Kemas kini.\n\nNota dibuka dalam pembaca. Pautan ke nota lain ([[Nota]], [[Nota|perkataan]], [[Nota#Tajuk]]) ditemui melalui nama nota di mana-mana dalam peti; mengikut satu pautan membuka nota itu, dan Kembali pergi ke nota sebelumnya.\n\nTiada apa pun dalam peti yang pernah diubah. Widget untuk skrin utama (nota terkini, nota yang disematkan, nota hari ini, nota rawak, teg, carian) ditambah dalam editor skrin utama. Widget boleh mengambil notanya daripada satu folder sahaja: tulis laluan folder dari akar kad (contohnya Notes/Work) dalam tetapan widget; jika dibiarkan kosong, ia mengambil semua nota dalam peti."
