anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Mengkaji kad Anki yang perlu dikaji pada komputer anda dan menghantar jawapan anda kembali, melalui alat tambah AnkiConnect.
anki.plugin.how = "Anki membolehkan anda mengkaji kad yang perlu dikaji dalam Anki pada komputer anda di atas pembaca, dan menghantar jawapan anda kembali. Ia menggunakan alat tambah percuma AnkiConnect (kod alat tambah 2055492159) dan tidak pernah AnkiWeb. Ia mati pada mulanya: tambahkannya daripada Kedai pemalam.\n\nPada komputer: pasang AnkiConnect dalam Anki (Alat, Add-on, Dapatkan Add-on) dan mulakan semula Anki. Anki mesti dibuka semasa anda menyegerak.\n\nSecara lalai AnkiConnect hanya menjawab komputer tempat ia berjalan (127.0.0.1), jadi pembaca tidak dapat mencapainya. Buka Alat, Add-on, AnkiConnect, Konfigurasi dan tetapkan \"webBindAddress\" kepada \"0.0.0.0\" (mendengar pada rangkaian rumah). Port, \"webBindPort\", ialah 8765 melainkan anda mengubahnya. Jika anda menetapkan \"apiKey\" di sana, masukkan kunci yang sama di sini. Mulakan semula Anki selepas mengubah konfigurasi, dan benarkan Anki melalui tembok api komputer jika ia bertanya. Gunakan ini hanya pada rangkaian yang anda percayai: sesiapa sahaja padanya boleh mencapai AnkiConnect, jadi kunci adalah idea yang baik.\n\nPada pembaca: buka Anki daripada Alat, kemudian masukkan alamat komputer (contohnya 192.168.1.20) di bawah Komputer, port jika bukan 8765, dan kunci API jika anda menetapkannya. Pilih Dek, atau biarkan kosong untuk semua dek. Kemudian pilih Segerak dengan Anki, dengan Wi-Fi dihidupkan: jawapan anda yang menunggu dihantar dahulu, kemudian kad yang perlu dikaji (dan bilangan kad baharu yang anda tetapkan) diambil, paling banyak 50. Pilih Kaji untuk melaluinya, tanpa rangkaian: tunjukkan jawapan dan nilaikan sebagai Sekali lagi, Sukar, Baik atau Mudah. Jawapan anda disimpan pada pembaca, juga tanpa Wi-Fi, dan dihantar ke Anki pada penyegerakan seterusnya. Anki menentukan bila sesuatu kad kembali: kad yang anda jawab Sekali lagi diambil semula oleh penyegerakan kemudian apabila Anki menyatakan ia perlu dikaji.\n\nSegerak apabila Anki dibuka, dalam tetapan, menyegerak setiap kali anda membuka skrin. Tiada apa-apa yang menggunakan rangkaian apabila anda menekan kekunci."
