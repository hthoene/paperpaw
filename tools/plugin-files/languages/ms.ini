fonts-browser.plugin.name = Lagi fon
fonts-browser.plugin.description = Menunjukkan fon dari internet, masing-masing dengan contoh, dan memuat turunnya untuk membaca.
fonts-browser.plugin.how = "Lagi fon menyenaraikan fon daripada pustaka fon di internet, setiap nama ditulis dalam fonnya sendiri, dan memuat turun yang anda mahu gunakan untuk membaca.\n\nAnda menemuinya di penghujung senarai fon tempat fon bacaan dipilih, dalam Tetapan, di bawah Bacaan, sebagai Fon; baris status mempunyai entri yang sama untuk fonnya. Ketik fon (dengan butang, tekan Pilih) untuk melihatnya lebih besar dengan ayat contoh, kemudian pilih Muat turun. Anda boleh meninggalkan halaman semasa ia dimuat turun. Apabila selesai, pilih Baca dengan (nama fon), atau Guna untuk baris status. Kemas kini mengambil versi lebih baharu, Alih keluar memadam fon daripada peranti.\n\nIa memerlukan Wi-Fi.\n\nFON ANDA SENDIRI\n\nBersebelahan Lagi fon, senarai yang sama mempunyai Fon anda sendiri, yang menunjukkan bahagian bantuan ini. Fon anda sendiri ialah fail .ttf atau .otf, contohnya daripada Google Fonts.\n\nPada Android dan peranti lain yang melukis fail fon: salin fail ke dalam folder fonts (pada Android: PaperPaw/fonts dalam storan kongsi), mulakan semula PaperPaw dan pilih fon dalam Tetapan, di bawah Bacaan, sebagai Fon.\n\nPada Xteink X4 dan X4 Pro: pembaca ini membaca pek fon, bukan fail fon, kerana fail fon tidak muat dalam memori mereka. Buat pek pada komputer dengan paperpaw-fontgen, bagi setiap gaya yang anda ada (biasa diperlukan):\n\npaperpaw-fontgen --family \"Fon Saya\" --regular FonSaya-Biasa.ttf --bold FonSaya-Tebal.ttf --italic FonSaya-Condong.ttf plugins\n\nIni menghasilkan folder plugins/font-fon-saya. Salin ke dalam folder plugins pada kad memori, mulakan semula, dan pilih Fon Saya sebagai Fon. Pek satu gaya kira-kira setengah megabait untuk huruf Latin; gaya yang anda tinggalkan dilukis dalam gaya biasa. Alat itu menyatakan berapa banyak huruf yang anda minta yang dimiliki fon (--chars latin,cyrillic,greek menambah skrip): fon tanpa huruf buku anda tidak dapat menunjukkannya, jadi cari yang meliputi skripnya.\n\nFon daripada Lagi fon berfungsi dengan cara yang sama dan tidak memerlukan komputer.\n\nUntuk teks kecil yang lebih tajam pada panel e-ink, tambahkan --hinting light pada arahan: ia menyesuaikan huruf dengan grid piksel, seperti cara fon lalai dibuat. Tanpanya huruf dilukis seperti yang direka oleh fon; --hinting normal dan --hinting mono menyesuaikannya dengan lebih kuat. Fon dengan tanda, seperti Arab atau Devanagari, lebih baik ditinggalkan tanpanya."
