smart-home.plugin.name = Rumah pintar
smart-home.plugin.description = Nilai dan suis daripada Home Assistant anda sendiri pada papan pemuka dan sebagai widget skrin utama. Berfungsi dengan Home Assistant pada rangkaian rumah anda.
smart-home.plugin.how = "Rumah pintar menunjukkan nilai dan suis daripada Home Assistant anda sendiri: suhu, kelembapan, tenaga, pintu dan tingkap, lampu, suis dan senario. Ia berhubung dengan pelayan anda melalui API RESTnya pada rangkaian rumah anda; tiada apa yang melalui perkhidmatan lain.\n\nBuka Rumah pintar daripada menu alat, kemudian Sambungan: taip alamat Home Assistant anda (contohnya http://homeassistant.local:8123) dan token akses jangka panjang (buat satu di bahagian bawah halaman profil Home Assistant anda). Token disimpan bersama kata laluan dan kunci, tidak pernah dalam fail tetapan. http biasa hanya digunakan untuk alamat pada rangkaian rumah anda; untuk pelayan di tempat lain hidupkan \"Pelayan di luar rangkaian rumah\" dalam tetapan dan gunakan https dengan sijil yang sah.\n\nPilih entiti membuka senarai apa yang ada pada pelayan anda: cari mengikut nama atau id dan pilih entiti untuk menunjukkannya (pilih sekali lagi untuk membuangnya). Anda boleh memberinya bilik, yang mengumpulkannya pada papan pemuka dan dalam widget bilik. Sehingga 24 entiti disimpan. Pada papan pemuka pilih lampu, suis atau senario untuk menukarnya: baris menunjukkan jawapan pelayan. Penderia yang anda pilih dibaca semula.\n\nWidget (tahan skrin utama, kemudian tambah widget): Nilai rumah pintar menunjukkan satu bacaan besar, kumpulan menyenaraikan entiti sesebuah bilik, suis ialah butang untuk satu lampu atau suis, dan bilik ialah kad dengan bacaan dan suis sesebuah bilik. Tetapan setiap widget menyatakan entiti atau bilik yang ditunjukkannya.\n\nRumah dibaca apabila anda membuka papan pemuka, apabila anda memintanya (baris Segar semula atau ketikan pada widget nilai atau kumpulan), apabila pembaca bangun jika Wi-Fi sudah hidup, dan mengikut jadual yang anda tetapkan semasa pengecas dicucuk. Ia tidak pernah menghidupkan radio dengan sendirinya dan tidak pernah mengekalkannya hidup."
