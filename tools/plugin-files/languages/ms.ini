vocabulary.plugin.name = Kosa kata
vocabulary.plugin.description = Menyimpan perkataan yang anda cari, beserta ayatnya, dan mengulang kaji kad imbas dengan ulangan berjarak, dibuat pada telefon anda.
vocabulary.plugin.how = "Kosa kata menyimpan perkataan yang anda cari semasa membaca, masing-masing dengan ayatnya, untuk dilihat semula kemudian. Anda menemui senarainya dalam Alat, yang terbaharu dahulu; pilih perkataan untuk mencarinya semula. Baris terakhir, Eksport, menyimpannya untuk apl kad imbas seperti Anki. Senarai menyimpan 2,000 perkataan terbaharu: selebihnya, yang paling lama dibuang, jadi eksport dahulu untuk menyimpan semuanya.\n\nKad imbas, juga dalam Alat, menguji anda dengan ulangan berjarak: selepas Tunjuk jawapan anda menilai setiap kad Sekali lagi, Sukar, Baik atau Mudah, dan itu menentukan bila ia kembali. Buat dek dengan Edit dengan telefon anda: imbas kod dengan telefon dalam Wi-Fi yang sama, kemudian taip kad atau tambah banyak sekali gus: buka dek di sana, pilih Banyak kad sekaligus dan pilih fail CSV, TSV atau TXT (satu kad pada setiap baris: depan, belakang, contoh; UTF-8), tampal senarai, atau bawa dek Anki (.apkg, dieksport dengan Sokong versi Anki yang lebih lama).\n\nAtau gunakan fail pada kad SD: letakkan fail CSV, TSV atau TXT, atau dek Anki (.apkg, dieksport dengan Sokong versi Anki yang lebih lama), bagi setiap dek dalam folder Flashcards (Sepanyol.tsv menjadikan dek Sepanyol; satu kad pada setiap baris: depan, belakang, contoh; disimpan sebagai UTF-8; baris pertama boleh menamakan lajur front, back, example). Pilih Kad daripada SD dalam Kad imbas, atau biarkan ia berlaku apabila anda membuka Kad imbas. Dek kekal pada pembaca bersama apa yang telah anda pelajari, dan fail digabungkan ke dalam deknya apabila ia baharu atau diubah: ubah belakang atau contoh sesuatu kad dalam fail dan kad itu berubah serta mengekalkan kemajuannya; ubah teks depan dan ia dikira sebagai kad baharu, yang lama bermula semula (kad dibezakan mengikut teks depan; ruang dan huruf besar tidak dikira); baris yang anda padam tidak memadam kad (melainkan anda menetapkan \"kad yang tiada dalam fail\" kepada Alih keluar bagi dek itu: maka kad dialih keluar pada kemas kini seterusnya bersama kemajuannya, selama-lamanya, dan tiada apa dialih keluar selagi ada baris dalam fail yang tidak dapat dibaca). Simpan dek ke failnya dengan Simpan pada kad: fail mendapat nombor kad (lajur id), jadi anda boleh mengedit bahagian depan pada komputer dan kad mengekalkan apa yang telah anda pelajari; fail hanya menyimpan id, depan, belakang dan contoh (lajur lain, komen dan susunan baris tidak disimpan), dan penyimpanan ditolak selagi ada baris dalam fail yang tidak dapat dibaca; fail yang ada di situ disalin ke _nama.bak.tsv kali pertama (penyimpanan kemudian tidak menggantikan salinan itu). Fail melebihi 4 MiB atau 20,000 baris tidak dibaca, dan ia mesti disimpan sebagai CSV UTF-8, bukan UTF-16. Kali pertama, pembaca membuat folder dengan nota tentang cara ia berfungsi.\n\nDalam tetapan, di bawah Bacaan, Perkataan dicari menjadi kad memasukkan setiap perkataan yang dicari ke dalam dek Dicari."
