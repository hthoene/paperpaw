reading-goal.plugin.name = Sasaran bacaan
reading-goal.plugin.description = Minit untuk dibaca setiap hari, dan seekor kucing pada skrin utama yang perasaannya mengikut bacaan hari ini.
reading-goal.plugin.how = "Seekor kucing pada skrin utama anda menunjukkan bagaimana bacaan hari ini: sedih selagi anda belum membaca, biasa-biasa sahaja selepas sedikit, berpuas hati daripada separuh sasaran harian anda, gembira sebaik sahaja anda mencapainya.\n\nTambah widget Kucing bacaan pada skrin utama (tahan skrin utama, kemudian tambah widget), atau pilih Kucing bacaan hari ini sebagai skrin tidur. Ketikan pada kucing membuka sasaran harian; ia ialah sasaran statistik bacaan, yang mengira minit anda membaca.\n\nDalam tetapan, di bawah Bacaan, Berpuas hati daripada dan Gembira daripada menetapkan daripada bahagian sasaran yang manakah kucing berpuas hati atau gembira, dan Gambar sendiri ialah folder gambar (sad, meh, content dan happy) untuk ditunjukkan sebagai ganti kucing. Gambar ialah fail PNG atau JPEG; tanpa folder, kucing ditunjukkan."
