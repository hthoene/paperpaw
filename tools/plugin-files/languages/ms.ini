opds.plugin.name = Katalog OPDS
opds.plugin.description = Menyemak imbas katalog OPDS, memuat turun bukunya dan memastikan folder sentiasa sama dengannya.
opds.plugin.how = "Katalog OPDS ialah pustaka dalam talian seperti Project Gutenberg, Calibre-Web, Kavita atau Komga. Pemalam ini menyemak imbas dan mencarinya seperti folder dan memuat turun bukunya ke dalam pustaka.\n\nBuka Katalog daripada menu Alat dan pilih Tambah katalog: alamat dan, jika katalog memerlukan akaun, nama pengguna dan kata laluan. Ketik katalog untuk menyemak imbasnya; tahannya (dengan butang, tahan Pilih) untuk menyegerak, mengedit atau mengalih keluarnya.\n\nDengan Segerak katalog ini dihidupkan, Segerak katalog memuat turun buku barunya ke dalam foldernya. Buku setiap segerak menghadkan berapa banyak yang diambil oleh satu penyegerakan, supaya katalog besar tidak memenuhi peranti. Folder awan (WebDAV) berfungsi sebagai ganti katalog."
