wifi.plugin.name = Wi-Fi
wifi.plugin.description = Menyertai rangkaian Wi-Fi apabila perlu dan mematikan radio selepas itu.
wifi.plugin.how = "Wi-Fi menyertai rangkaian apabila pemalam memerlukan internet (katalog, penyegerakan, Kedai, pindahan) dan mematikan radio semula seminit selepas tiada apa yang menggunakannya, atau serta-merta apabila Utama atau buku ditunjukkan, untuk menjimatkan bateri dan memori.\n\nBuka Wi-Fi daripada Tetapan, atau daripada item Wi-Fi dalam baris status. Rangkaian menyenaraikan yang dalam jangkauan; pilih satu dan taip kata laluannya, atau pilih Sediakan dengan telefon dan taip nama serta kata laluan dalam pelayar telefon anda dan bukan pada peranti. Lupakan mengalih keluar rangkaian yang disimpan.\n\nKata laluan kekal pada kad, disimpan dengan selamat, dan tidak pernah ditunjukkan lagi. Di bawah Sambung apabila perlu anda menetapkan berapa lama Wi-Fi kekal hidup selepas penggunaan terakhir, sama ada ia kekal hidup semasa mengecas, dan rangkaian tersimpan mana yang didahulukan apabila beberapa rangkaian berada dalam jangkauan."
