settings.plugin.name = Tetapan
settings.plugin.description = Halaman tetapan, dibina daripada tetapan setiap pemalam.
settings.plugin.how = "Tetapan menunjukkan segala yang boleh ditetapkan dalam PaperPaw dan pemalamnya, dalam halaman. Pemalam tidak memerlukan skrin sendiri: apa yang diisytiharkannya muncul di sini, dalam kumpulan, dengan keterangan setiap tetapan di bawahnya.\n\nBuka dengan Tetapan dalam menu. Ketik kumpulan untuk membukanya, kemudian tetapan untuk menukar atau memilihnya; nombor mempunyai butang − dan +. Dengan butang, bergerak ke tetapan dan tekan Pilih: kiri dan kanan mengubah nombor, Pilih mengekalkannya, Kembali mengembalikan nilai terdahulu.\n\nPerubahan berkuat kuasa serta-merta. Cari mencari tetapan mengikut perkataan dan Tetapan lanjutan menambah tetapan yang jarang diperlukan. Tetapkan semula kepada lalai dan Tetapkan semula semua bertanya dahulu."
