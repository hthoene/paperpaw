weather.plugin.description = Cuaca sekarang dan beberapa hari akan datang sebagai widget, daripada Open-Meteo.
weather.plugin.how = "Cuaca menunjukkan cuaca sekarang dan beberapa hari akan datang sebagai widget untuk skrin utama, daripada Open-Meteo, yang tidak memerlukan akaun atau kunci. Cuaca sekarang menunjukkan suhu, keadaan dan lagi untuk dipilih; Ramalan menunjukkan beberapa hari akan datang dalam satu baris atau senarai.\n\nPilih tempat dahulu: dalam tetapan, di bawah Cuaca, Tempat (taip nama, kemudian pilih daripada tempat yang ditemui). Hanya koordinatnya dihantar, dan hanya semasa widget cuaca ditunjukkan. Tambah widget dengan mengedit skrin utama.\n\nCuaca diambil paling kerap sekerap yang dinyatakan oleh Kemas kini paling kerap setiap, dan hanya apabila ada rangkaian: ia tidak pernah menghidupkan Wi-Fi sendiri.\n\nData cuaca oleh Open-Meteo.com (https://open-meteo.com), di bawah lesen Creative Commons Attribution 4.0 (CC BY 4.0)."
