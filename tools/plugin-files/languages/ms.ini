plugin-manager.plugin.name = Pengurus pemalam
plugin-manager.plugin.description = Menyenaraikan pemalam dan menghidupkan serta mematikannya.
plugin-manager.plugin.how = "Pengurus pemalam menyenaraikan setiap pemalam dengan versi dan keterangannya, dan menghidupkan serta mematikan pemalam.\n\nCarinya dalam Tetapan, sebagai Urus pemalam. Tetapan pemalam ialah halaman berasingan untuk keutamaan seperti penggunaan rangkaian setiap pemalam. Ketik pemalam untuk menghidupkan atau mematikannya (dengan butang, pilihnya). Perubahan berkuat kuasa selepas dimulakan semula: bar di bahagian bawah kemudian menawarkan Mula semula sekarang. Tahan pemalam (dengan butang, tahan Pilih) untuk membaca cara ia berfungsi.\n\nPemalam yang ditanda Sentiasa hidup tidak boleh dimatikan, dan yang ditanda Diperlukan hanya selepas pemalam lain melakukan tugasnya, jika tidak PaperPaw tiada jalan kembali. Di bawah Skrin anda memilih pemalam yang menunjukkan tempat yang ditawarkan oleh beberapa pemalam."
