files.plugin.description = Menyenaraikan buku dan folder pada peranti dan membukanya.
files.plugin.how = "Pustaka menyenaraikan buku dalam folder pustaka anda, setiap satu dengan kulitnya, tajuk, pengarang dan sejauh mana anda telah membacanya. Buku yang anda baca terakhir berada di atas sebagai kad, jadi meneruskan bacaan hanya memerlukan satu ketikan, atau satu tekanan Pilih. Semasa pustaka mencari buku, ia menyatakan berapa banyak yang telah ditemuinya setakat ini.\n\nPilih apa yang ditunjukkan di atas buku: semuanya, yang sedang anda baca, yang belum dibaca atau yang sudah selesai, atau rak (mengikut pengarang, siri, teg, kegemaran, buku seterusnya bagi setiap siri yang telah anda mulakan). Ketik buku untuk membacanya; tahannya (dengan butang, tahan Pilih) untuk membukanya, menandakannya selesai atau belum dibaca, melihat maklumatnya, mengalihkannya ke arkib atau memadamnya. Ketik tajuk untuk menu pustaka: cara buku disusun dan ditunjukkan, carian, folder pustaka dan tetapan.\n\nFolder pustaka ditetapkan dalam Tetapan, di bawah Pustaka, sebagai Folder pustaka; di sana anda juga boleh menunjukkan buku sebagai grid kulit. Untuk setiap fail lain, gunakan Fail dalam menu Alat."
