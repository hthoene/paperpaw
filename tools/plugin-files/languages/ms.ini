store.plugin.name = Kedai pemalam
store.plugin.description = Mencari, memasang, mengemas kini dan mengalih keluar pemalam untuk peranti ini.
store.plugin.how = "Kedai pemalam mencari pemalam untuk peranti ini di internet dan memasang, mengemas kini serta mengalih keluarnya. Bukanya daripada Alat; ia memerlukan Wi-Fi.\n\nPermulaan menunjukkan apa yang disyorkan oleh pustaka, apa yang baharu atau popular sekarang, kemudian kumpulan. Satu kumpulan menyenaraikan pemalamnya dalam campuran adil yang berubah setiap hari, supaya setiap pemalam dilihat; susunkannya dari A hingga Z, mengikut yang terbaharu atau kemas kini terakhir, dan pergi ke huruf dalam senarai yang panjang. Buka satu untuk melihat halamannya, dengan saiz dan memori yang diambilnya, kemudian pilih Pasang, Kemas kini atau Alih keluar. Kemas kini semua mengemas kini setiap pemalam yang dipasang.\n\nPemalam kod berjalan dengan akses penuh kepada peranti: Kedai menyatakannya dan bertanya dahulu, dan ia bermula selepas dimulakan semula. Jika ada yang bermasalah, PaperPaw bermula tanpa pemalam kod dan menyatakan yang mana. Pustaka pemalam menetapkan sumber senarai.\n\nPemalam komuniti, dalam Tetapan, Sistem, turut menyenaraikan pemalam yang diterbitkan orang lain di GitHub. Tiada sesiapa yang menyemaknya: ia ditanda Belum disemak, halaman pemalam kod menunjukkan kunci yang digunakan untuk menandatanganinya, dan kemas kini yang ditandatangani oleh kunci lain tidak dipasang.\n\nSumber, baris terakhir pada permulaan, menambah senarai pemalam orang lain melalui alamatnya (https://…/plugins.json), menyenaraikan salah satu daripadanya sebagai ganti senarai PaperPaw, atau mengalih keluarnya. Daripada menaip, letakkan fail sources.txt dengan satu alamat pada setiap baris ke dalam .paperpaw/plugins/store pada kad: alamat itu muncul di bawah Sumber sebagai baharu. PaperPaw tidak menyemak sesuatu sumber atau pemalamnya, dan peranti menghubungi pelayan sumber itu. Sesuatu sumber menandatangani senaraiya; peranti menyimpan kunci senarai pertama yang dibacanya dan selepas itu hanya menerima senarai dan pemalam kod yang ditandatangani dengan kunci itu. Pemalam mendapat kemas kininya hanya daripada sumber tempat ia dipasang. Pustaka PaperPaw sendiri sentiasa ada dan tidak boleh dialih keluar; meninggalkan Kedai kembali kepadanya."
