home.plugin.name = Skrin utama
home.plugin.description = Halaman permulaan: halaman widget, seperti buku yang sedang dibaca dan alat.
home.plugin.how = "Skrin utama terdiri daripada halaman, masing-masing grid widget dan alat seperti pada telefon. Pada mulanya jam, buku yang sedang anda baca dan buku yang baru dibaca berada pada satu halaman, dan semua alat pada halaman berikutnya.\n\nKetik item untuk membukanya, dan leret atau gunakan butang halaman untuk menukar halaman. Dengan butang sahaja, butang anak panah bergerak dari satu item ke item seterusnya dan Pilih membukanya.\n\nUntuk menyusunnya semula, tahan skrin utama, ketik pensel di bawah halaman atau pilih Edit skrin utama dalam menu. Seret item untuk mengalihkannya atau ketik satu untuk pilihannya, juga dengan butang. Tambah widget juga ada di situ. Lajur dan Baris terdapat dalam tetapan, di bawah Penampilan, dalam bahagian Skrin utama.\n\nPada skrin yang dimiringkan, skrin utama menunjukkan item yang sama dengan lebih banyak lajur, setiap halaman dipenuhi sebelum halaman seterusnya, dan kad tidak lebih lebar daripada kira-kira 110 mm; tiada apa yang anda susun secara menegak diubah. Susun ia secara mengiring dan susun atur itu dikekalkan bagi orientasi tersebut secara berasingan: widget baharu ditambah pada kedua-duanya. Tetapkan semula susun atur mengiring dalam Tambah (semasa mengedit) kembali kepada yang diterbitkan. Mengalih keluar widget atau alat pada satu orientasi tidak mengalih keluarnya daripada yang satu lagi."
