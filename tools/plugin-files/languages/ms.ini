sleep.plugin.name = Skrin tidur
sleep.plugin.description = Menunjukkan kucing tidur, kulit buku, gambar anda atau mesej semasa peranti tidur.
sleep.plugin.how = "Skrin tidur menentukan apa yang ditunjukkan skrin semasa peranti tidur. E-ink mengekalkan gambar tanpa kuasa.\n\nPilihnya dalam tetapan, di bawah Peranti, Skrin tidur, dengan Tunjuk: kucing tidur (lalai), kulit buku, gambar saya, logo dan \"Sedang tidur\", widget, halaman seperti sedia ada, atau halaman dengan gambar. Gambar saya menunjukkan fail dalam folder Gambar satu demi satu.\n\nTanpa kulit atau gambar, kucing ditunjukkan. Jika sistem melukis sendiri skrin tidur, tetapan ini disembunyikan.\n\nSkrin mati, Tunjuk apabila dimatikan, dilukis sekali apabila peranti dimatikan, daripada menu kuasa atau selepas tempoh Matikan selepas tidur (tidak apabila bateri lemah memutuskan kuasa). Ia seperti skrin tidur melainkan anda memilih logo dan \"Dimatikan\", kucing, kulit buku atau gambar saya. Pemalam lain boleh menawarkan skrin untuknya.\n\nSkrin permulaan dan mula semula, Tunjuk semasa bermula dan Tunjuk semasa dimulakan semula, ialah milik peranti sendiri melainkan pemalam lain menawarkan skrin untuknya. Pemalam belum berjalan semasa peranti bermula: skrin yang dipilih untuk permulaan dilukis lebih awal, semasa peranti dimatikan atau dimulakan semula, dan ditunjukkan pada permulaan berikutnya. Skrin yang tidak siap pada masanya, atau gambar yang rosak, memberi laluan kepada skrin peranti sendiri; peranti dimatikan atau dimulakan semula walau apa pun."
