file-manager.plugin.name = Pengurus fail
file-manager.plugin.description = Setiap folder dan fail pada peranti: buka, namakan semula, alih, salin dan padam.
file-manager.plugin.how = "Pengurus fail menunjukkan setiap folder dan fail pada storan peranti, bukan hanya buku anda, dan membolehkan anda membuka, menamakan semula, mengalih, menyalin dan memadamnya serta membuat folder baharu.\n\nBuka Fail daripada menu Alat. Ketik folder untuk masuk ke dalamnya; Kembali pergi ke folder di atas. Ketik fail, atau tahan mana-mana entri (dengan butang, tahan Pilih), untuk melihat apa yang boleh dilakukan padanya. Alih dan Salin memilih entri itu: pergi ke folder tempat ia sepatutnya berada dan pilih Tampal di sini dalam bar di bahagian bawah. Dengan butang, tekan Bawah daripada entri terakhir untuk sampai ke bar.\n\nFail dan folder yang bermula dengan titik, seperti data PaperPaw sendiri, disembunyikan. Untuk melihatnya, hidupkan Fail tersembunyi dalam Tetapan, di bawah Pustaka."
