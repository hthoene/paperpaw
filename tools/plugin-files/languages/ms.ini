menu.plugin.name = Menu
menu.plugin.description = Menu di bahagian bawah skrin, dengan tindakan dan tetapan.
menu.plugin.how = "Menu menyenaraikan apa yang boleh anda lakukan dan tetapkan. Ia dibuka di bahagian bawah skrin, di atas apa sahaja yang sedang dibuka: semasa membaca, ketik tengah skrin atau tekan Pilih. Ketik atau pilih entri untuk menjalankannya.\n\nTetapan dalam menu menunjukkan nilainya dan berubah di tempat, jadi menu kekal terbuka. Entri yang mempunyai entri lain membuka submenu.\n\nLeret ke bawah dari tepi atas untuk panel pantas: apa yang anda ubah dengan kerap, sebagai butang. Ketik butang untuk menukarnya, tahan untuk tetapannya. Dengan butang sahaja, butang anak panah memilih, Pilih menukar dan Kembali menutup. Di bawah Penampilan, Menu menunjukkan menu sebagai senarai atau sebagai jubin."
