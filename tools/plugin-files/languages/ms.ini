transfer.plugin.name = Pindahan
transfer.plugin.description = Letakkan buku dan fail lain pada peranti daripada pelayar dalam rangkaian yang sama.
transfer.plugin.how = "Pindahan Wi-Fi meletakkan buku dan fail lain pada peranti daripada pelayar dalam rangkaian yang sama, tanpa kabel atau apl. Anda juga boleh mengambil fail, membuat folder dan memadam.\n\nBukanya daripada Alat. Skrin menunjukkan alamat sebagai teks dan sebagai kod QR: bukanya dalam pelayar pada telefon atau komputer, atau imbas kod itu. Alamat mengandungi kunci yang dibuat baharu setiap kali, jadi orang lain dalam rangkaian tidak dapat mencapai fail anda. Pindahan berjalan semasa skrin dibuka.\n\nJika PaperPaw mengendalikan Wi-Fi sendiri, seperti pada X4, Tanpa penghala di bahagian bawah membuka rangkaian milik peranti sendiri, yang disertai telefon dengan mengimbas kod."
