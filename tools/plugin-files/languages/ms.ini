notes-overview.plugin.name = Semua nota
notes-overview.plugin.description = Penanda buku dan serlahan semua buku dalam satu senarai, dan eksport sebagai My Clippings.txt.
notes-overview.plugin.how = "Semua nota menyenaraikan setiap buku yang anda buat penanda buku atau serlahan di dalamnya, beserta bilangannya. Bukanya dalam Alat. Pilih buku untuk melihat notanya, dan pilih nota untuk membuka buku pada tempat itu.\n\nDi penghujung senarai, Eksport sebagai My Clippings.txt menulis semua nota ke dalam satu fail, dalam folder Exports di sebelah pustaka, dalam bentuk yang digunakan Kindle (UTF-8). Apl yang membaca My Clippings.txt Kindle boleh membacanya. Nota pada serlahan ialah entri tersendiri, seperti pada Kindle. Oleh sebab buku di sini tiada lokasi Kindle, \"location\" ialah sejauh mana nota itu berada dalam buku, dalam peratus. Fail ditulis semula setiap kali; ia menggantikan yang sebelumnya."
