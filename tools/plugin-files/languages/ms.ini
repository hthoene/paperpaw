core.host-firmware.foreign = Ini menggantikan PaperPaw dengan perisian peranti yang berbeza. PaperPaw tidak akan bermula semula dengan sendirinya.
core.host-firmware.no-undo = PaperPaw tidak dapat membuat asal perubahan ini. Untuk kembali, gunakan pilihan pemulihan perisian lain itu atau pasang semula PaperPaw dengan web flasher.
