battery.plugin.name = Penggunaan bateri
battery.plugin.description = Merekod bateri dan menunjukkan berapa lama ia bertahan.
battery.plugin.how = "Penggunaan bateri mencatat cas kira-kira seminit sekali semasa peranti sedar, bersama apa yang dilakukannya: penyegaran skrin dan halaman yang dilayari. Daripada itu ia mengira berapa banyak yang diperlukan untuk sejam sedar dan 100 halaman, dan berapa lama bateri bertahan pada kadar itu.\n\nBuka Bateri daripada menu Alat. Ia menunjukkan cas sekarang, tempoh sedar kali ini, penggunaan pada bateri setakat ini dan tempoh sedar anda yang terkini. Ia menukar halaman dengan butang halaman, atau dengan mengetik anak panah di bahagian atas.\n\nIa memerlukan seketika membaca pada bateri sebelum angkanya bermakna. Rakaman dihidupkan secara lalai dan boleh dimatikan dalam Tetapan, di bawah Peranti, Kuasa, sebagai Rekod penggunaan bateri."
