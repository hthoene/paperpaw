menu-editor.plugin.name = Editor menu
menu-editor.plugin.description = Menyusun semula, mengalih keluar dan menambah entri setiap menu.
menu-editor.plugin.how = "Editor menu mengubah kandungan menu: alihkan entri ke atas atau ke bawah, alih keluarnya, atau tambah yang baharu.\n\nCarinya dalam Tetapan di bawah Suaikan, sebagai Suaikan menu. Pilih menu, kemudian entri untuk mengalihkan atau mengalih keluarnya; Tambah entri memasukkan yang baharu. Perubahan terpakai serta-merta. Tetapkan semula menu ini mengembalikan menu kepada cara pemalamnya menentukannya, Tetapkan semula semua menu berbuat demikian untuk setiap menu.\n\nAnda tidak boleh mengunci diri anda di luar: entri yang menjadi jalan ke tetapan kekal sehingga anda menambah jalan lain ke sana."
