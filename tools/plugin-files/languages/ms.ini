puzzles.plugin.name = Teka-teki
puzzles.plugin.description = Sudoku, teka silang kata dan teka-teki catur, luar talian, dengan teka-teki hari ini.
puzzles.plugin.how = "Teka-teki untuk dalam kereta api dan ruang menunggu, semuanya luar talian: sudoku, teka silang kata dan teka-teki catur. Buka Teka-teki daripada menu alat, atau tambah widget Teka-teki hari ini pada skrin utama (tahan skrin utama, kemudian tambah widget): ia menunjukkan sejauh mana sudoku hari ini, dan ketikan membukanya. Sudoku hari ini sama sepanjang hari.\n\nSudoku: kiri dan kanan menggerakkan kursor petak demi petak, atas dan bawah (butang halaman) satu baris. Pilih membuka digit: pilih satu dan pilih sekali lagi untuk memasukkannya, atau Kosongkan untuk mengosongkan petak. Tahan Pilih (atau Menu) untuk mencapai butang di bawah papan: Nota menjadikan digit tanda pensel, Semak menanda petak yang salah, Buat asal membatalkan langkah terakhir, Baharu memulakan teka-teki pada tahap yang anda pilih (Mudah, Sederhana, Sukar). Setiap teka-teki mempunyai tepat satu penyelesaian. Permainan disimpan apabila anda keluar. Pada skrin sentuh ketik petak.\n\nTeka silang kata: letakkan fail .puz (Across Lite) atau .ipuz dalam folder \"puzzles\" pada kad memori; tiada yang disertakan. Bergerak pada grid, kemudian pilih untuk menaip perkataan di bawah kursor pada papan kekunci (garis bawah membiarkan petak kosong). Butang bertukar antara mendatar dan menurun, menunjukkan senarai petunjuk, menyemak huruf dan mendedahkan perkataan. Huruf disimpan bagi setiap fail. Fail .puz yang dikacau tidak dapat dibuka.\n\nTeka-teki catur: set kecil daripada pangkalan data teka-teki Lichess (CC0). Kiri dan kanan melompat dari buah ke buah, pilih buah yang hendak anda gerakkan, kemudian kiri dan kanan melalui tempat ia boleh pergi, dan pilih sekali lagi. Langkah yang salah dibatalkan. Petunjuk menanda buah yang perlu bergerak, Seterusnya pergi ke teka-teki berikutnya.\n\nPapan hanya melukis semula petak yang berubah. Statistik mengira teka-teki yang anda selesaikan."
