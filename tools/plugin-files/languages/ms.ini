format-cbz.plugin.name = Buku komik
format-cbz.plugin.description = Membuka arkib buku komik (.cbz), satu gambar satu halaman.
format-cbz.plugin.how = "Membuka arkib buku komik (.cbz): satu gambar satu halaman, disesuaikan dengan skrin, mengikut urutan namanya (2 sebelum 10).\n\nLetakkannya dalam folder pustaka dan bukanya daripada pustaka; tukar halaman seperti dalam mana-mana buku. Gambar besar mengambil sedikit masa buat kali pertama, pada X4 lebih lama daripada tempat lain.\n\nTetapan bacaan (Tetapan, Bacaan): \"Panel demi panel\" menunjukkan satu panel sahaja pada satu masa, sebesar yang dibenarkan skrin, dan pertukaran halaman melangkah melaluinya; halaman tanpa panel ditunjukkan sepenuhnya. \"Halaman komik bergerak\" mencerminkan pertukaran halaman untuk manga (kanan ke kiri); ComicInfo.xml buku itu sendiri menyatakannya dengan sendirinya. Pustaka menunjukkan tajuk buku serta siri dan nombornya daripada ComicInfo.xml."
format-cbz.title = Buku komik (CBZ)
format-cbz.setting.direction = Halaman komik bergerak
format-cbz.setting.direction.help = Manga: pertukaran halaman dicerminkan.
format-cbz.direction.book = Seperti kata buku
format-cbz.direction.ltr = Kiri ke kanan
format-cbz.direction.rtl = Kanan ke kiri
format-cbz.setting.panels = Panel demi panel
format-cbz.setting.panels.help = Satu panel pada satu masa, pertukaran halaman melangkah melaluinya.
format-docx.plugin.name = Dokumen DOCX
format-docx.plugin.description = Membuka fail .docx, seperti yang disimpan oleh Word dan program lain.
format-docx.plugin.how = "Membuka dokumen .docx sebagai buku: tajuk dengan jadual kandungan, senarai, jadual, tebal dan condong, pautan dan gambar (JPEG, PNG, GIF).\n\nLetakkan fail dalam folder pustaka dan bukanya daripada pustaka. Tajuk dan pengarang diambil daripada sifat dokumen. Nota kaki, pengepala dan pengaki, serta ulasan tidak ditunjukkan."
format-docx.title = Dokumen DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Membuka buku EPUB dengan gayanya, jadual kandungan dan imej.
format-epub.plugin.how = "Buku EPUB dibuka daripada pustaka seperti mana-mana buku lain, dengan jadual kandungannya, imej dan gaya penerbit. Halaman web (HTML), Markdown, FictionBook (.fb2) dan arkib buku komik (.cbz) dibuka dengan cara yang sama, masing-masing sebagai pemalam tersendiri.\n\nSesuatu bab ditukar apabila anda membukanya buat kali pertama dan disimpan dalam cache pemalam, jadi ia lebih pantas selepas itu dan buku besar berfungsi pada peranti kecil. Cari jadual kandungan di bawah Kandungan dalam menu bacaan. Sama ada gaya buku itu sendiri digunakan ialah tetapan Pemformatan penerbit, di bawah Bacaan."
format-epub.title = E-buku EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Membuka buku FictionBook (.fb2, juga yang dizip).
format-fb2.plugin.how = "Membuka buku FictionBook (.fb2), lazim bagi buku Rusia dan lain-lain, juga yang dizip (.fb2.zip), dengan tajuk, pengarang, kulit dan babnya.\n\nLetakkannya dalam folder pustaka; ia muncul dalam pustaka dan dibuka seperti mana-mana buku lain."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Membuka halaman web yang disimpan sebagai fail, hanya menunjukkan apa yang untuk dibaca.
format-html.plugin.how = "Membuka halaman web yang disimpan sebagai fail (.html, .htm, .xhtml) sebagai buku: hanya apa yang untuk dibaca, tanpa menu, iklan dan sebagainya di sekelilingnya.\n\nLetakkan fail dalam folder pustaka dan bukanya daripada pustaka seperti mana-mana buku. Pautan dalam halaman berfungsi; gambar muncul di tempat ia berada dalam fail."
format-html.title = Halaman web (HTML)
format-images.plugin.name = Gambar
format-images.plugin.description = Membuka gambar (.jpg, .png, .gif) sebagai buku, satu halaman setiap gambar.
format-images.plugin.how = "Gambar (.jpg, .png, .gif) dibuka daripada pustaka seperti buku, satu gambar satu halaman, disesuaikan dengan skrin.\n\nUntuk membaca satu folder penuh gambar, buka gambar pertamanya: gambar selepasnya dalam folder menyusul, mengikut urutan namanya (2 sebelum 10). Gambar yang lebih kemudian dalam folder bermula di sana; kedudukan dalam setiap satu diingati secara berasingan. Sehingga 300 gambar dalam folder dibaca bermula daripada gambar yang anda buka.\n\nFail yang bukan gambar, atau terlalu besar, menunjukkan namanya sebagai ganti. Untuk buku dengan banyak gambar dan tajuk sendiri, arkib buku komik (.cbz) ialah bentuk yang lebih baik."
format-images.title = Gambar
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Membuka fail Markdown (.md), cth. nota.
format-markdown.plugin.how = "Membuka fail Markdown (.md), seperti nota, sebagai buku: tajuk, senarai, petikan dan penekanan seperti yang dimaksudkan, bukan sebagai simbol.\n\nLetakkan fail dalam folder pustaka dan bukanya daripada pustaka. Tajuk pertama menjadi tajuk bukunya; gambar di sebelah fail muncul di tempat teks menamakannya."
format-markdown.title = Markdown
format-mobi.plugin.name = Buku MOBI
format-mobi.plugin.description = Membuka fail .mobi dan .azw tanpa DRM.
format-mobi.plugin.how = "Buku MOBI (.mobi, .azw) dibuka daripada pustaka seperti mana-mana buku, tanpa apa-apa untuk disediakan. Tajuk, pengarang, bahasa dan kulit diambil daripada buku, dan senarai kandungan dibuat daripada tajuk-tajuknya.\n\nBuku ditukar apabila anda membukanya buat kali pertama, yang mengambil beberapa saat bagi buku yang panjang; selepas itu ia dibuka serta-merta. Teks, tajuk, tebal dan condong, pautan dan gambar ditunjukkan.\n\nBuku dengan DRM (kebanyakan buku yang dibeli dari kedai) tidak dapat dibuka, begitu juga buku dengan mampatan Huffman atau dalam bentuk KF8 yang lebih baharu (.azw3): PaperPaw menyatakannya apabila anda membukanya. Salinan sebagai EPUB, yang dibuat dengan alat seperti Calibre, sentiasa dapat dibuka."
format-mobi.title = Buku MOBI
format-rtf.plugin.name = Dokumen RTF
format-rtf.plugin.description = Membuka fail .rtf sebagai buku.
format-rtf.title = Dokumen RTF
format-txt.plugin.name = Teks biasa
format-txt.plugin.description = Membuka fail teks biasa (.txt).
format-txt.plugin.how = "Fail teks biasa (.txt) dibuka daripada pustaka seperti mana-mana buku, tanpa apa-apa untuk disediakan. Pemalam membaca teks UTF-8, UTF-16 dan Windows-1252 dan mengenal pasti pengekodan dengan sendirinya.\n\nPerenggan mengikut baris kosong dalam fail; jika fail tiada baris kosong, setiap baris ialah satu perenggan. Dalam fail Project Gutenberg, teks lesen pada permulaan dan penghujung ditinggalkan, dan tajuk serta pengarang diambil daripada pengepala.\n\nFail tidak pernah dimuatkan sepenuhnya, jadi teks yang sangat besar juga dapat dibuka pada peranti kecil."
format-txt.title = Teks biasa
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Membuka buku XTC dan XTCH, halaman pra-render pembaca Xteink.
format-xtc.plugin.how = "Fail XTC dan XTCH ialah buku yang halamannya sudah dirender sebagai gambar, seperti yang dibuat oleh penukar untuk pembaca Xteink. Ia dibuka daripada pustaka seperti mana-mana buku.\n\nKerana setiap halaman ialah gambar tetap, saiz teks tidak boleh diubah dan fon lain tidak boleh digunakan. Halaman berwarna hitam putih atau mempunyai empat warna kelabu. Setiap halaman dinyahkod apabila ditunjukkan, jadi memori yang diperlukan sedikit, juga pada X4.\n\nTajuk, pengarang dan bab diambil daripada fail jika ada."
format-xtc.title = Halaman XTC
help.plugin.name = Petunjuk
help.plugin.description = Menunjukkan fungsi kawalan sesuatu skrin, pada kali pertama ia dibuka.
help.plugin.how = "Pada kali pertama sesuatu skrin dibuka, satu nota ringkas di atasnya menyatakan fungsi kawalannya: bahagian skrin yang menerima ketikan, berbingkai, dan fungsi butang.\n\nKetikan atau mana-mana butang menutup nota itu, dan ia tidak muncul lagi untuk skrin tersebut. Tiada petunjuk lagi mematikan semuanya.\n\nDalam tetapan, di bawah Sistem, Petunjuk menghidupkan atau mematikannya, dan Tunjuk petunjuk semula menyebabkan nota setiap skrin dipaparkan sekali lagi."
help.title = Cara ia berfungsi di sini
help.got-it = Faham
help.no-more = Tiada petunjuk lagi
