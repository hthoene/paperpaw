keys.plugin.name = Butang dan gerak isyarat
keys.plugin.description = Fungsi setiap butang, zon ketikan dan leretan, diubah pada peranti.
keys.plugin.how = "Butang dan gerak isyarat menunjukkan fungsi setiap butang, zon ketikan dan leretan, dan membolehkan anda mengubahnya pada peranti.\n\nBuka dalam tetapan, di bawah Peranti. Mula-mula pilih tempat perubahan berlaku: Di mana-mana, Semasa membaca, Pada skrin utama, Dalam pustaka atau dalam satu alat. Kemudian pilih input, seperti butang yang ditahan atau leretan masuk dari tepi, dan pilih tindakan daripada senarai, yang boleh anda cari. Seperti piawai mengembalikan apa yang ditetapkan oleh pemalam dan susun atur butang.\n\nPada X4, perubahan yang akan menyebabkan tiada butang tinggal untuk memilih, kembali atau bergerak ke hadapan ditolak. Tetapkan semula butang dan gerak isyarat pada penghujung membatalkan setiap perubahan."
