rules.plugin.name = Peraturan
rules.plugin.description = Apabila sesuatu berlaku, melakukan sesuatu: cth. mod malam pada 22:00.
rules.plugin.how = "Peraturan melakukan sesuatu dengan sendirinya apabila sesuatu berlaku: mod malam dihidupkan setiap hari pada 22:00, atau katalog disegerakkan apabila PaperPaw bermula.\n\nPeraturan terdapat dalam Tetapan di bawah Suaikan, sebagai Peraturan. Tambah peraturan bertanya Bila? (PaperPaw bermula, waktu dalam sehari, buku dibuka atau ditutup, bateri, pengecasan, suis dan lain-lain) dan Kemudian apa? (jalankan tindakan, hidupkan atau matikan suis, tetapkan nombor, tunjukkan mesej). Ketik peraturan untuk menjedanya; tahannya (dengan butang, tahan Pilih) untuk syarat seperti Antara dua waktu dalam sehari, atau untuk mengalih keluarnya.\n\nTindakan, suis dan nombor untuk dipilih disusun mengikut pemalam: pilih pemalam, kemudian apa yang dibawanya; kembali keluar daripadanya semula. Tindakan yang berfungsi pada skrin yang ditunjukkan, seperti Kembali atau Halaman seterusnya, melakukan apa yang dilakukannya jika ditekan di situ.\n\nWaktu terpakai walau skrin mana pun yang dibuka. Dua peraturan yang saling membatalkan berhenti selepas beberapa langkah."
