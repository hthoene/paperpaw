mail.plugin.name = E-mel
mail.plugin.description = Membaca dan menghantar e-mel dengan kata laluan atau kata laluan apl (IMAP dan SMTP), tanpa log masuk pelayar.
mail.plugin.how = "E-mel membaca dan menghantar e-mel melalui IMAP dan SMTP. Ia log masuk dengan alamat dan kata laluan anda, tanpa log masuk pelayar, jadi ia berfungsi dengan mana-mana penyedia yang membenarkannya.\n\nSediakan akaun di bawah Tetapan, E-mel. Pilih penyedia anda, taip alamat dan kata laluan anda. Kebanyakan penyedia mahukan kata laluan apl: buat satu dalam tetapan keselamatan akaun anda dan gunakannya di sini. Kata laluan biasa anda selalunya tidak berfungsi, dan ia tidak pernah pergi ke mana-mana selain pelayan penyedia anda. Ia disimpan bersama kata laluan dan kunci.\n\nBuka E-mel dalam alat. Semak e-mel mengambil e-mel terkini dan folder. E-mel disimpan pada kad, jadi anda boleh membacanya tanpa rangkaian. Peranti menyambung, mengambil dan memutuskan sambungan, jadi Wi-Fi hanya hidup seketika.\n\nJika penyedia anda tiada dalam senarai, pilih Pelayan sendiri dan tetapkan nama pelayan, port dan keselamatan di bawah tetapan lanjutan. Pelayan yang sijilnya tidak dijamin oleh mana-mana pihak berkuasa bertanya sekali sama ada hendak mempercayainya; bandingkan cap jari dengan yang ditunjukkan oleh penyedia anda.\n\nE-mel dengan buku dilampirkan (EPUB, PDF dan sebagainya, sehingga 2 MB) mempunyai Buka buku di bawahnya: ia mengambil fail itu, meletakkannya dalam pustaka anda dan membukanya.\n\nUntuk melihat e-mel baharu tanpa membuka E-mel, hidupkan Semak e-mel baharu di latar belakang di bawah Tetapan, E-mel, dan pilih kekerapannya (setiap 15, 30 atau 60 minit). Ia mati sehingga anda menghidupkannya. Pembaca kemudian menyambung sesekali melalui sambungan selamat semasa ia sedar dan dalam talian, satu akaun demi satu akaun, dan mengemas kini bilangan belum dibaca pada Utama. Ia menggunakan sedikit bateri. Membuka E-mel menghentikan semakan yang sedang berjalan.\n\nWidget skrin utama menunjukkan bilangan e-mel belum dibaca, e-mel terkini dan yang diberi bintang, satu peti mel, dan pintasan untuk menulis e-mel."
