picture-home.plugin.name = Skrin utama bergambar
picture-home.plugin.description = Skrin utama dengan gambar anda sendiri di belakang widget, dan bar status yang anda tetapkan.
picture-home.plugin.how = "Skrin utama bergambar menggantikan skrin utama semasa ia dihidupkan: gambar anda sendiri di belakang widget, dan halaman widget serta alat yang anda susun. Matikannya dalam pengurus pemalam dan skrin utama terbina dalam kembali, dengan halamannya sendiri.\n\nLetakkan gambar (JPEG, PNG atau GIF) dalam folder pada kad (wallpapers secara lalai), kemudian pilih satu dalam Tetapan, Suaikan, Skrin utama bergambar. Muatan menyatakan cara ia memenuhi skrin (isi, seluruh gambar, regang, saiz asal, jubin), Kedudukan bahagian mana yang kekal, Zum seberapa besar, dan Cerahkan gambar seberapa pucat: gambar yang lebih pucat menjadikan widget lebih mudah dibaca. Gambar disediakan sekali bagi setiap saiz skrin, yang mengambil sedikit masa.\n\nWidget berada pada plat di atas gambar. Susun halaman seperti pada skrin utama terbina dalam: pensel di bawah halaman, atau Edit skrin utama dalam menu.\n\nBar status (masa, Wi-Fi, bateri, atau apa yang anda pilih) boleh dihidupkan, dimatikan atau automatik, di atas atau di bawah, lebar penuh atau pil kecil di kiri, tengah atau kanan, pada plat cerah, gelap atau kelabu atau pada gambar itu sendiri. Baris yang menamakan butang (pada X4) juga boleh dihidupkan, dimatikan atau automatik. Automatik bermakna tekanan butang menunjukkannya selama beberapa saat; tekanan itu tidak melakukan apa-apa yang lain.\n\nRender gambar menyatakan cara gambar dilukis: Tahap kelabu dalam setiap warna kelabu yang ada pada skrin (lebih perlahan pada X4), Berbintik dalam titik hitam putih (pantas), atau Automatik, seperti skrin utama terbina dalam: tahap kelabu apabila skrin dilukis, titik selepas perubahan pertama. Jika skrin tiada tahap kelabu, tahap kelabu bertukar menjadi titik."
