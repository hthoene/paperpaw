vocabulary.sd.readme = "Kad imbas daripada fail\n\nLetakkan satu fail di sini bagi setiap dek: Sepanyol.tsv menjadikan dek Sepanyol.\nFail: .tsv, .csv atau .txt, disimpan sebagai UTF-8, atau .apkg: dek Anki, dieksport dengan Sokong versi Anki yang lebih lama ditandakan. Tiga medan pertama nota-notanya menjadi depan, belakang dan contoh; penjadualan dan medianya tidak dibaca, dan PaperPaw tidak pernah menulis fail Anki.\n\nSatu kad pada setiap baris: depan, belakang dan contoh (pilihan), dipisahkan dengan tab, koma atau koma bertitik. Baris pertama boleh menamakan lajur: front, back, example. Contoh:\n\nKucing\tcat\tKucing itu tidur.\n\nKemudian buka Kad imbas pada pembaca, pilih Kad daripada SD dan kemudian Kemas kini dek daripada kad.\n\nBaik diketahui:\n- Dek kekal pada pembaca, bersama apa yang telah anda pelajari. Fail dibaca apabila ia baharu atau diubah, dan kadnya ditambah pada dek atau diubah di situ.\n- Ubah bahagian belakang atau contoh sesuatu kad dalam fail: kad berubah dan mengekalkan kemajuan anda.\n- Ubah teks depan sesuatu kad: ia dikira sebagai kad baharu, dan yang lama bermula semula. Kad dipadankan mengikut teks depannya, ruang dan huruf besar tidak dikira. Simpan dek ke fail (Kad daripada SD, Simpan dek pada kad) dan setiap kad mempunyai nombor dalam lajur id: ubah bahagian depan di sana, kekalkan dua baris pertama fail seperti sedia ada, dan kad mengekalkan apa yang telah anda pelajari.\n- Menyimpan menulis kad dalam dek. Apa yang ada dalam fail dan bukan kad (baris tanpa bahagian depan) tidak disimpan; fail yang ada di situ disalin ke _nama.bak.tsv.\n- Simpan fail sebagai CSV UTF-8 (bukan UTF-16, bukan format sendiri hamparan). Fail melebihi 4 MiB atau 20,000 baris tidak dibaca: pecahkannya.\n- Baris yang anda padam dalam fail tidak memadam kad dalam dek, melainkan anda menghidupkan Alih keluar kad yang tiada bagi dek itu. Maka kad pergi bersama apa yang telah anda pelajari.\n- Fail yang namanya bermula dengan _ tidak dibaca.\n"
