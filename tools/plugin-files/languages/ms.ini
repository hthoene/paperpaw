core.host-firmware.unknown-key = Perisian ini ditandatangani dengan kunci yang tidak dikenali. Pasang hanya jika anda mempercayai kunci yang ditunjukkan di sini.
core.host-firmware.downgrade = Versi lama ini tidak dapat memulihkan versi sebelumnya secara automatik. Untuk kembali, pasang semula PaperPaw dengan web flasher.
core.host-firmware.early-crash = Jika perisian baharu ranap sebelum semakan keselamatan permulaannya, peranti mungkin tidak lagi dapat dimulakan. Anda memerlukan web flasher untuk memulihkan PaperPaw.
