widgets.plugin.name = Pek widget
widgets.plugin.description = Banyak lagi widget untuk skrin utama: jam, kalendar, petikan, buku, nota dan lagi.
widgets.plugin.how = "Pek widget menambah banyak widget untuk skrin utama: jam (analog, perkataan, jubin, dunia), kalendar, tahun setakat ini, kiraan detik, fasa bulan, serta hari dan tarikh; petikan hari ini, nota, senarai tugasan, gambar, ucapan dan logo PaperPaw; dan bagi buku, sedang dibaca, kemajuan, seterusnya, siri, kegemaran, serlahan dan pustaka dalam angka. Widget bateri juga ada di dalamnya.\n\nTambahkannya dengan Edit skrin utama dalam menu (atau tekan lama pada skrin utama), kemudian Tambah widget. Setiap satu mempunyai tetapan sendiri, seperti bingkai, saiz dan penjajaran. Memilih widget yang berubah, seperti petikan hari ini, menunjukkan yang seterusnya. Petikan anda sendiri dimasukkan dalam quotes.txt dalam .paperpaw/plugins/widgets pada kad, setiap baris sebagai teks | pengarang. Widget masa memerlukan jam ditetapkan; Wi-Fi menetapkannya."
