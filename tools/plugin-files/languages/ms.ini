calibre.plugin.name = Pustaka wayarles
calibre.plugin.description = Menerima buku melalui rangkaian. Berfungsi sebagai peranti wayarles untuk calibre.
calibre.plugin.how = "Pustaka wayarles membolehkan peranti muncul dalam Calibre pada komputer anda sebagai peranti wayarles. Calibre kemudian boleh menghantar buku kepadanya, menyenaraikannya dan memadamnya. Buku masuk ke dalam pustaka.\n\nBuka Pustaka wayarles daripada menu Alat, dengan peranti dan komputer dalam rangkaian Wi-Fi yang sama. Dalam Calibre pilih Sambung/kongsi, kemudian Mulakan sambungan peranti wayarles. Apabila peranti menemui komputer anda, ia menunjukkan namanya; ketik Sambung (dengan butang, tekan Pilih). Calibre boleh menambah dan memadam buku di sini, jadi sambung hanya kepada komputer anda sendiri. Menutup skrin menamatkan sambungan.\n\nJika Calibre tidak ditemui dengan sendirinya, masukkan alamat komputernya dalam Tetapan, di bawah Pustaka, sebagai Alamat dalam bahagian Calibre. Jika Calibre menggunakan port selain 9090, tambahkannya sebagai :port, cth. 192.168.1.20:9091."
