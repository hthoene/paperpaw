update.plugin.description = Memasang kemas kini perisian tegar, daripada kad atau dimuat turun dari internet.
update.plugin.how = "Kemas kini memasang perisian tegar baharu, pada peranti yang PaperPaw sendiri menjadi perisian tegarnya, seperti X4. Anda menemuinya dalam tetapan, sebagai Kemas kini.\n\nCari dalam talian bertanya kepada pelayan kemas kini tentang PaperPaw yang lebih baharu dan memuat turunnya, yang mengambil beberapa minit melalui Wi-Fi. Atau salin fail kemas kini (berakhir dengan .bin, daripada paperpaw.org) ke dalam folder updates pada kad, contohnya dengan Pindahan Wi-Fi. Pasang kemudian mengambil kira-kira seminit dan peranti dimulakan semula; buku, tetapan dan kedudukan bacaan kekal.\n\nDengan Semak kemas kini dihidupkan (dalam tetapan, mati pada mulanya), peranti bertanya kira-kira seminggu sekali dengan sendirinya, hanya semasa Wi-Fi sudah hidup atau ia mengecas. PaperPaw yang lebih baharu yang ditemuinya menunggu di sini; tiada apa yang mengganggu bacaan anda. Carian menghantar apa yang dijalankan peranti, tanpa nama atau nombor peranti; untuk mengira peranti, juga sama ada anda yang meminta dan sama ada ia carian pertamanya pada hari, minggu atau bulan itu.\n\nJika pemalam yang anda gunakan belum mempunyai versi untuk keluaran baharu, kemas kini menunggu pemalam itu. Versi yang lebih lama hanya dipasang jika anda memilihnya.\n\nPerisian tegar lain, seperti CrossPoint, juga dipasang dari sini: letakkan failnya (berakhir dengan .bin) dalam folder updates, dan buka Kemas kini. PaperPaw menyemak bahawa ia perisian tegar yang lengkap untuk peranti ini dan tidak rosak, tetapi tidak dapat mengetahui siapa yang membuatnya, kerana ia tidak ditandatangani. Pasang juga menulisnya ke dalam separuh lagi flash, dan peranti memulakannya; PaperPaw kekal dalam separuhnya sehingga perisian tegar itu memasang sesuatu di atasnya. Untuk kembali ke PaperPaw kemudian, pasang fail pemasangannya (paperpaw-<peranti>-<versi>-install.bin) daripada menu perisian tegar lain itu, seperti kemas kini perisian tegar SD CrossPoint."
