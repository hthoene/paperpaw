power.plugin.name = Kuasa
power.plugin.description = Memilih mod kuasa, secara manual atau mengikut bateri: Biasa, Jimat, Luar talian.
power.plugin.how = "Kuasa memilih cara PaperPaw menggunakan bateri: Biasa, Jimat atau Luar talian. Jimat melakukan apa yang boleh ditunda pada saat yang lebih sesuai; Luar talian mengekalkan radio mati. Auto memilih mengikut bateri.\n\nUbah mod dalam panel pantas, tempat Kuasa menunjukkan mod secara bersebelahan, atau dalam Tetapan di bawah Kuasa. Di sana anda juga menetapkan paras apabila Auto bertukar kepada Jimat dan kepada Luar talian, dan sama ada ia kekal Biasa semasa mengecas.\n\nDalam baris status, Mod kuasa menunjukkan daun semasa jimat dan Wi-Fi bergaris semasa luar talian, dan tiada apa-apa dalam Biasa.\n\nTahan butang kuasa untuk membuka menu kecil: Tidur, Matikan (jika PaperPaw boleh), Mula semula, dan pada peranti sentuh Kunci sentuhan atau Buka kunci sentuhan. Tekanan singkat masih menidurkan peranti. Kembali meninggalkan menu."
