stats.plugin.name = Statistik bacaan
stats.plugin.description = Merekod berapa lama dan berapa banyak anda membaca, dengan kalendar dan angka setiap buku.
stats.plugin.how = "Statistik bacaan merekod berapa lama anda membaca setiap halaman. Anda melihatnya sebagai ringkasan dengan hari ini, minggu dan rentetan anda, sebagai kalendar, dan dengan angka setiap buku.\n\nBukanya daripada Alat, atau daripada Lagi dalam pembaca. Dalam tetapan, di bawah Statistik bacaan, anda boleh mematikan Rekod bacaan, menetapkan Sasaran harian, dan menetapkan Halaman terpendek dan Halaman terpanjang yang dikira, supaya menyelak sepintas lalu atau buku yang dibiarkan terbuka tidak mencemarkan angka.\n\nSegerak dengan KOReader berkongsi statistik dengan KOReader melalui folder WebDAV. Ia juga mengambil alih statistik KOReader pada peranti yang sama. Perakaman memerlukan jam ditetapkan: jika tidak, sambung ke Wi-Fi sekali."
