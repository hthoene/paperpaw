keyboard.plugin.name = Papan kekunci
keyboard.plugin.description = Memasukkan teks pada skrin, dengan sentuhan atau dengan butang.
keyboard.plugin.how = "Papan kekunci dibuka apabila sesuatu memerlukan teks: carian, kata laluan, nota atau tetapan. Ia berfungsi dengan sentuhan dan dengan butang sahaja.\n\nDengan butang, kiri dan kanan bergerak sepanjang baris, butang halaman bergerak antara baris, Pilih menekan kekunci dan Kembali membatalkan; kiri dan kanan berpusing mengelilingi baris, dan atas dan bawah kekal pada lajur anda. Shift menjadikan huruf seterusnya huruf besar; tekan dua kali untuk semua huruf besar, dan sekali lagi untuk berhenti. Tahan huruf (dengan butang: tahan Pilih padanya) untuk huruf besarnya, yang dipilih serta-merta, dan aksen seperti é dan è. OK menamatkan; dengan butang, tahan Kembali untuk menamatkan dari mana-mana (Kembali sahaja membatalkan), atau tahan Pilih pada kekunci yang bukan huruf. Tampal memasukkan teks papan keratan, dan Telefon, jika ditawarkan, membolehkan anda menaip pada telefon anda sebagai gantinya.\n\nDalam tetapan di bawah Peranti, Papan kekunci: Susun atur papan kekunci memilih susun atur. Secara lalai ia mengikut bahasa menu; dengan beberapa susun atur, satu kekunci bertukar antaranya. Saiz menjadikan kekunci dan huruf lebih besar; dengan butang sahaja, baris kekal seperti papan kekunci komputer. Pada skrin sentuh, Bentuk kekunci mengubah rupa kekunci. Huruf besar automatik memulakan setiap ayat dengan huruf besar."
