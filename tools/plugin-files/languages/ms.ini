news.plugin.name = Berita
news.plugin.description = Mengambil suapan berita (RSS, Atom) sebagai buku untuk dibaca.
news.plugin.how = "Berita menukar suapan RSS atau Atom menjadi buku. Setiap suapan menjadi satu buku dalam folder Berita pada pustaka, dengan artikel terbarunya sebagai teks biasa, untuk dibaca seperti mana-mana buku lain.\n\nBuka Berita daripada menu Alat dan pilih Tambah suapan; alamatnya terdapat pada laman web akhbar atau blog. Ambil berita mengambil semua suapan dan menggantikan buku terdahulu. Tahan suapan (dengan butang, tahan Pilih) untuk mengambil atau mengalih keluarnya secara berasingan. Suapan yang dialih keluar meninggalkan bukunya dalam pustaka.\n\nMengambil memerlukan rangkaian. Artikel setiap suapan (Tetapan, Pustaka) menetapkan bilangan artikel dalam setiap buku. Widget Tajuk berita menunjukkannya pada skrin utama."
