pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Pemasa fokus dengan pusingan kerja dan rehat, widget dan bilangan harian.
pomodoro.plugin.how = "Pemasa Pomodoro: bekerja dalam pusingan fokus, kemudian berehat. Ia tidak memerlukan penyediaan: 25 minit fokus, 5 minit rehat, dan selepas empat pusingan rehat panjang 15 minit.\n\nBuka Pomodoro daripada menu alat dan tekan Mula, atau tambah widgetnya pada skrin utama (tahan skrin utama, kemudian tambah widget): Pemasa Pomodoro menunjukkan fasa dan minit yang berbaki, Mula/jeda Pomodoro ialah butang, dan Pomodoro hari ini mengira pusingan yang anda selesaikan, dengan sasaran harian anda. Ketikan pada pemasa memulakan atau menjedanya; tahan untuk membuka skrin penuh.\n\nPemasa terus berjalan apabila anda meninggalkan skrin, dan diteruskan mengikut jam selepas dimulakan semula. Semasa pembaca tidur tiada apa yang berjalan: fasa yang tamat sementara itu dimaklumkan apabila ia bangun. Satu notis memberitahu anda apabila sesuatu fasa tamat. Untuk menjimatkan bateri, jam dikemas kini sekali seminit (setiap sepuluh saat pada minit terakhir pada skrin penuh) dan tidak pernah mengekalkan pembaca sedar.\n\nDi bawah Pomodoro dalam tetapan anda menetapkan tempoh dan bilangan pusingan satu set, dan sama ada fasa seterusnya bermula sendiri. Di bawah Lagi: kelipan skrin atau kelipan lampu depan apabila fasa tamat dan sasaran harian."
