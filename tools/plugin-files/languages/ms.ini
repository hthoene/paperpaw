setup.plugin.name = Persediaan
setup.plugin.description = Panduan ringkas melalui tetapan yang penting, pada permulaan pertama.
setup.plugin.how = "Persediaan ialah panduan ringkas melalui tetapan yang penting, ditunjukkan sekali sahaja, pada kali pertama PaperPaw bermula. Setiap halaman bertanya satu perkara, seperti bahasa, butang, saiz teks, zon waktu, Wi-Fi atau beberapa pemalam untuk ditambah, dengan jawapan yang sesuai sudah dipilih, jadi Seterusnya sentiasa betul. Langkah yang tidak diperlukan oleh peranti ini ditinggalkan.\n\nKetik butang, atau gunakan butang atas dan bawah dan Pilih. Langkau pada halaman pertama meninggalkan persediaan serta-merta. Halaman terakhir menyatakan dari mana buku anda datang.\n\nUntuk menjalankannya semula, buka tetapan dan pilih Sediakan PaperPaw. Segala yang dipilih di sini boleh diubah dalam tetapan kemudian."
