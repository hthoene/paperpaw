koreader.plugin.how = "Pemalam ini berkongsi penanda buku dan serlahan dengan KOReader bagi buku yang anda baca dalam kedua-duanya, pada satu peranti atau dalam folder pustaka yang disegerakkan antara peranti. Tiada apa yang perlu disediakan.\n\nApabila PaperPaw membuka buku yang turut dibuka KOReader, dan apabila anda mengubah penanda buku atau serlahannya, ia mengambil yang baharu daripada data KOReader di sebelah buku dan meninggalkan yang baharu di sini untuk diambil KOReader apabila ia membuka buku itu pada kali berikutnya. Tanda yang dialih keluar dan nota yang diubah turut dipindahkan.\n\nIni hanya berfungsi untuk buku EPUB. Jika fail pada satu pihak tidak dapat dibaca, tiada apa yang berubah pada kedua-dua pihak sehingga ia dapat dibaca."
