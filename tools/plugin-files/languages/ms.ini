translate.plugin.description = Menterjemah teks yang dipilih dalam talian, dengan DeepL.
translate.plugin.how = "Terjemahan menterjemah teks yang dipilih dalam talian dengan DeepL. Pilih teks dalam buku dan pilih Terjemah dalam menu teks yang dipilih: terjemahan muncul di atas halaman seperti entri kamus. Butang halaman atau ketikan menatalnya, dan Pilih atau ketikan di hujungnya menutupnya.\n\nIa memerlukan rangkaian dan kunci API DeepL anda sendiri, percuma di deepl.com (DeepL API Free, kira-kira 500,000 aksara sebulan). Sehingga anda memasukkannya, panel menyatakannya, dan ketikan memintanya.\n\nDalam tetapan, di bawah Bacaan, dalam bahagian Terjemahan, Terjemah kepada menetapkan bahasa; pada mulanya ia ialah bahasa PaperPaw sendiri."
