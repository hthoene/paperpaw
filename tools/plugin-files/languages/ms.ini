bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Memasangkan alat kawalan jauh, papan kekunci dan penderia, dan menyambungkannya.
bluetooth.plugin.how = "Bluetooth memasangkan alat kawalan jauh, papan kekunci dan penderia dengan pembaca, jika ia mempunyai Bluetooth (X4 Pro).\n\nTambah peranti mencari apa yang berada dalam jangkauan; letakkan peranti dalam mod pasangan dahulu. Pilihnya, dan sahkan pada pembaca (bandingkan nombor jika ada yang dipaparkan). Kekunci alat kawalan jauh atau papan kekunci kemudian menukar halaman dan bergerak melalui menu; ubah fungsi setiap kekunci di bawah Kawalan.\n\nAlat kawalan jauh menyatakan bila kekuncinya berfungsi: apabila dihidupkan di sini, semasa membaca (disambungkan semasa buku dibuka, menjimatkan bateri), atau sentiasa. Butang menu atau tekan lama pada peranti melupakannya.\n\nPenderia adalah untuk pemalam: hidupkan pemalam yang boleh menggunakannya. Bluetooth dimatikan apabila tiada apa-apa yang menggunakannya."
