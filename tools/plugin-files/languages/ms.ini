calendar.plugin.name = Kalendar
calendar.plugin.description = Kalendar anda pada pembaca: paparan agenda, hari, minggu dan bulan daripada CalDAV, iCal dan fail, hari lahir daripada kenalan, widget skrin utama dan skrin tidur.
calendar.plugin.how = "Kalendar anda pada pembaca: agenda beberapa hari akan datang, satu hari, satu minggu dan satu bulan, dengan acara kalendar CalDAV (Nextcloud, Radicale, Baïkal, Fastmail dan lain-lain), alamat iCal (.ics, webcal://), fail kalendar pada kad serta hari lahir dan ulang tahun kenalan anda (CardDAV). Pembaca hanya membaca kalendar; ia tidak pernah mengubahnya.\n\nBuka Kalendar daripada menu alat. Baris pertama menamakan paparan; pilihnya, atau tahan mana-mana baris atau tekan Menu, untuk bertukar antara Agenda, Hari, Minggu, Bulan dan Hari lahir, untuk menambah kalendar atau untuk menyegerak. Dalam Hari dan Minggu, dua baris pertama melangkah ke hari atau minggu sebelum dan selepas (kekunci halaman juga begitu); dalam Bulan, kekunci anak panah menggerakkan hari, kekunci halaman menggerakkan bulan, dan Pilih membuka hari itu. Pilih pada sesuatu acara menunjukkannya sepenuhnya: bila, di mana, kalendar mana dan bagaimana ia berulang. Kembali mundur satu langkah.\n\nTambah kalendar di bawah Kalendar (dalam menu, atau Kalendar dalam tetapan). Pilih jenisnya: akaun CalDAV (alamat pelayan sudah memadai, cth. cloud.example.com/remote.php/dav; setiap kalendar yang mempunyai acara menjadi sebahagian daripada paparan), alamat iCal (kalendar yang diterbitkan sebagai .ics), fail kalendar pada kad, atau kenalan (buku alamat CardDAV: pembaca menunjukkan hari lahir dan ulang tahun yang disimpan bersamanya). Masukkan alamat, bagi akaun nama pengguna dan kata laluan anda (sebaik-baiknya kata laluan apl; ia disimpan bersama kata laluan pembaca), dan satu nama. Setiap kalendar mempunyai penanda (titik, cincin, titik kelabu atau segi empat sama) yang boleh anda ubah, supaya anda dapat membezakannya; sehingga enam kalendar.\n\nAcara berulang (setiap hari, setiap minggu, setiap bulan, setiap tahun, dengan hari dalam seminggu, bilangan, tarikh tamat dan hari yang dikecualikan), acara sepanjang hari dan acara dalam zon waktu lain ditunjukkan mengikut jam pembaca sendiri. Pembaca menyimpan acara dari enam puluh hari sebelum hingga enam puluh hari selepas hari ini, paling banyak 240, dan menunjukkannya tanpa rangkaian. Peraturan yang tidak dapat dibacanya menunjukkan acaranya sekali sahaja.\n\nKalendar dibaca apabila anda membuka kalendar (paling kerap setiap lima minit), apabila anda memilih Segerak sekarang, dan, seperti yang anda tetapkan di bawah Kalendar dalam tetapan, apabila rangkaian sudah hidup atau apabila pengecasan bermula. Pembaca tidak pernah menghidupkan radionya untuk ini, kecuali apabila anda meminta Segerak sekarang.\n\nWidget untuk skrin utama (tahan skrin utama, kemudian tambah widget): Hari ini menunjukkan tarikh dan apa yang ada pada hari itu, Acara seterusnya menunjukkan acara yang berikutnya, Agenda menunjukkan beberapa hari akan datang, Bulan menunjukkan satu bulan dengan titik di bawah hari yang mempunyai acara, dan Hari lahir menunjukkan hari lahir seterusnya. Ketikan pada sesuatu acara membukanya, ketikan pada hari dalam bulan membuka hari itu. Skrin tidur boleh menunjukkan agenda hari ini: pilih Kalendar di bawah Skrin tidur dalam tetapan."
