aids.plugin.name = Bantuan membaca
aids.plugin.description = Permulaan perkataan tebal, perkataan diganti, gambar: teks seperti yang anda mahu.
aids.plugin.how = "Bantuan membaca mengubah rupa teks buku semasa anda membaca. Ia terpakai pada setiap buku. Permulaan perkataan tebal dan Ganti perkataan pada mulanya mati.\n\nAnda menemuinya dalam Tetapan, di bawah Bacaan, dalam bahagian Bantuan membaca. Permulaan perkataan tebal menebalkan separuh pertama setiap perkataan, yang dirasakan lebih mudah diikuti oleh sesetengah orang. Ganti perkataan menerima pasangan yang ditulis sebagai \"kemaskini = kemas kini; Tn. = Tuan\", dipisahkan dengan koma bertitik.\n\nHanya perkataan penuh yang diganti, tepat seperti yang anda tulis, jadi \"kemas\" tidak pernah mengubah sebahagian daripada perkataan yang lebih panjang. Fail buku itu sendiri tidak diubah.\n\nGambar dalam buku boleh ditunjukkan (seperti pada mulanya), ditukar menjadi baris ringkas seperti \"[Gambar: sebuah kapal di laut]\" yang menggunakan keterangan gambar itu, atau ditinggalkan. Halaman kemudian mempunyai lebih banyak ruang untuk teks, dan tiada apa-apa yang dinyahkod untuk gambar yang tidak ditunjukkan, sehingga halaman bertukar lebih pantas. Komik dan buku lain yang terdiri daripada gambar tidak diubah."
