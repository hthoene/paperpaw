diagnostics.plugin.name = Diagnostik
diagnostics.plugin.description = Skrin ujian dan semakan berpandu bagi setiap bahagian peranti.
diagnostics.plugin.how = "Diagnostik ialah skrin ujian untuk menyemak peranti: ia menunjukkan setiap tahap kelabu yang dapat dipaparkan panel, empat kotak untuk mencuba butang dan sentuhan, dan pembilang halaman dengan bar kemajuan untuk membandingkan mod segar semula.\n\nSkrin ujian tiada entri menu. Ia hanya menjadi skrin utama apabila tiada pemalam lain menawarkannya, atau apabila anda memilihnya di bawah Skrin dalam pengurus pemalam untuk tempat Skrin utama.\n\nPilih menandakan kotak yang difokuskan, dan butang anak panah bergerak antara kotak; dengan sentuhan, ketik kotak. Butang halaman menukar halaman ujian. Tahan Pilih, atau tahan jari pada skrin, untuk bermula semula.\n\nSemakan peranti, di bawah Alat jika PaperPaw ialah perisian tegar peranti, melalui setiap bahagian peranti satu halaman demi satu halaman: skrin, butang, sentuhan, lampu depan, bateri, kad, jam, Wi-Fi, tidur dan memori. Setiap halaman berakhir dengan Gagal, Langkau dan Lulus, dengan jawapan yang dicadangkan oleh ukurannya telah dipilih; bahagian yang tiada pada peranti dilangkau. Selepas setiap jawapan ia menulis laporan ke .paperpaw/plugins/diagnostics/device-check.txt, untuk ditampal ke dalam pull request. Kembali meninggalkannya, dan ia diteruskan di tempat ia berhenti apabila dibuka semula. Pada peranti yang hanya mempunyai butang, pilih Mula pada halaman butang dahulu; sehingga itu anak panah, Pilih dan Kembali berfungsi seperti pada setiap halaman."
