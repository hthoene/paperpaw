profiles.plugin.name = Profil bacaan
profiles.plugin.description = Set bernama bagi tetapan bacaan dan paparan, ditukar dengan satu ketikan.
profiles.plugin.how = "Profil menyimpan tetapan bacaan, tetapan paparan dan baris status anda di bawah satu nama, seperti Malam atau Cetakan besar, dan mengembalikannya dengan satu ketikan.\n\nBuka Profil dalam menu bacaan di bawah Lagi, atau dalam Tetapan di bawah Suaikan. Ketik profil untuk menggunakannya; yang sedang digunakan ditanda. Tahannya (dengan butang, tahan Pilih) untuk menyimpan tetapan semasa ke dalamnya, menamakannya semula atau mengalih keluarnya. Simpan sebagai profil baharu menyimpan apa yang ditetapkan sekarang.\n\nProfil seterusnya bertukar kepada yang berikutnya dalam senarai; letakkannya pada butang atau dalam peraturan."
