tasks.plugin.name = Tugasan
tasks.plugin.description = Senarai tugasan dengan tarikh akhir dan keutamaan, pada pembaca atau disegerakkan dengan pelayan CalDAV anda, dengan widget skrin utama.
tasks.plugin.how = "Senarai tugasan pada pembaca anda: tugasan dengan tarikh akhir dan keutamaan, ditandakan siap apabila selesai. Ia berfungsi tanpa penyediaan dan tanpa rangkaian, dan boleh disamakan dengan pelayan CalDAV (Nextcloud, Radicale, Baïkal, Fastmail dan lain-lain), supaya senarai yang sama ada pada telefon dan komputer anda.\n\nBuka Tugasan daripada menu alat. Baris pertama menamakan senarai yang ditunjukkan; pilihnya untuk senarai lain, untuk Hari ini dan lewat tempoh merentas semua senarai, untuk senarai baharu, untuk menyegerak, atau untuk menetapkan akaun. Tambah tugasan membuka papan kekunci. Pilih pada tugasan menandakannya siap (sekali lagi: belum siap). Tahan tugasan atau tekan Menu untuk mengubah tajuk, tarikh akhir (hari ini, esok, dalam seminggu, atau tarikh yang anda taip seperti 2026-12-24) atau keutamaannya, atau untuk mengalih keluarnya. Tugasan terbuka berada di hadapan, mengikut harinya kemudian keutamaan; yang siap kekal di penghujung selama seminggu (ditetapkan di bawah Tugasan dalam tetapan), kemudian ia meninggalkan pembaca.\n\nWidget untuk skrin utama (tahan skrin utama, kemudian tambah widget): Tugasan hari ini menunjukkan apa yang perlu disiapkan hari ini atau lewat tempoh, Senarai tugasan menunjukkan satu senarai, Tugasan terbuka mengiranya, dan Tugasan seterusnya menunjukkan yang perlu dibuat berikutnya. Ketikan pada tugasan dalam widget menandakannya siap; ketikan pada pengepala membuka senarai.\n\nUntuk menyegerak, pilih Akaun CalDAV daripada baris senarai dan masukkan alamat pelayan, nama pengguna anda dan kata laluan (sebaik-baiknya kata laluan apl). Alamat pelayan sudah memadai, cth. cloud.example.com/remote.php/dav; pembaca menemui senarai tugasan anda dari situ. Setiap senarai tugasan pada pelayan menjadi senarai pada pembaca. Pembaca menyegerak apabila anda membuka Tugasan, apabila anda memilih Segerak sekarang, dan apabila rangkaian sudah hidup; apa yang anda ubah tanpa rangkaian menunggu dan dihantar kemudian. Jika tugasan diubah pada pembaca dan di tempat lain sementara itu, versi pelayan diambil dan versi anda disimpan sebagai tugasan baharu di sebelahnya, supaya tiada apa yang hilang. Nota, penggera dan segala yang lain yang dimiliki tugasan pada pelayan kekal seperti sedia ada. Tugasan yang berulang ditunjukkan tetapi diubah di tempat anda membuatnya. Pembaca memuatkan sehingga 200 tugasan dalam 12 senarai."
