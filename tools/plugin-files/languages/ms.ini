about.plugin.name = Perihal
about.plugin.description = Versi dan lesen PaperPaw.
about.plugin.how = "Perihal menunjukkan versi PaperPaw yang anda miliki, lokasi kod sumbernya, dan lesen yang mengawalnya.\n\nAnda menemuinya di penghujung Tetapan, sebagai Perihal PaperPaw. Pilih baris dengan butang anak panah dan Pilih, atau ketiknya. Pemalam terbina dalam perisian tegar dan, pada peranti yang memuatkan pemalam dengan kod, cap jari yang mesti digunakan untuk membina pemalam sedemikian turut disenaraikan.\n\nLesen dibuka sebagai teks dalam pembaca, jadi anda menyelak halamannya seperti membaca buku. Ia mengandungi lesen PaperPaw sendiri dan lesen fon, ikon serta corak pemenggalan yang disertakan. Pemalam boleh menambah satu baris sendiri, seperti pencipta sesuatu tema."
