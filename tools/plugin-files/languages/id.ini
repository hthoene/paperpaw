update.plugin.name = Pembaruan
update.plugin.description = Memasang pembaruan firmware dari kartu atau diunduh dari internet.
update.plugin.how = "Pembaruan memasang firmware baru pada perangkat yang memakai PaperPaw sebagai firmware, seperti X4. Temukan pada setelan, sebagai Pembaruan.\n\nCari online meminta PaperPaw lebih baru dari server pembaruan dan mengunduhnya, yang perlu beberapa menit lewat Wi-Fi. Atau salin berkas pembaruan (berakhiran .bin, dari paperpaw.org) ke folder updates pada kartu, misalnya lewat Transfer Wi-Fi. Pemasangan lalu memerlukan sekitar satu menit dan perangkat mulai ulang; buku, setelan, dan posisi baca tetap ada.\n\nDengan Cari pembaruan aktif (pada setelan, awalnya nonaktif), perangkat memeriksa sendiri sekitar seminggu sekali, hanya saat Wi-Fi memang aktif atau sedang mengisi daya. PaperPaw baru yang ditemukan menunggu di sini tanpa mengganggu membaca. Pencarian mengirim versi yang digunakan, tanpa nama atau nomor perangkat; untuk menghitung perangkat, juga apakah Anda meminta pencarian dan apakah ini pencarian pertama pada hari, minggu, atau bulan tersebut.\n\nJika plugin yang dipakai belum memiliki versi yang cocok untuk rilis baru, pembaruan menunggunya. Versi lama hanya dipasang jika Anda memilihnya.\n\nFirmware lain, seperti CrossPoint, juga dapat dipasang dari sini: letakkan berkas .bin di folder updates, lalu buka Pembaruan. PaperPaw memeriksa apakah firmware lengkap dan tidak rusak untuk perangkat ini, tetapi tidak dapat memastikan pembuatnya karena tidak ditandatangani. Tetap pasang menulis ke separuh flash yang lain, lalu perangkat menjalankannya; PaperPaw tetap di separuhnya hingga firmware itu menimpanya. Untuk kembali ke PaperPaw, pasang berkas pemasangannya (paperpaw-<device>-<version>-install.bin) dari menu firmware lain, seperti SD firmware update pada CrossPoint."
