files.plugin.name = Penjelajah berkas
files.plugin.description = Menampilkan dan membuka buku serta folder di perangkat.
files.plugin.how = "Pustaka menampilkan buku dalam folder pustaka, masing-masing dengan sampul, judul, penulis, dan kemajuan baca. Buku terakhir yang dibaca ada di atas sebagai kartu: cukup ketuk atau tekan Pilih untuk melanjutkan. Saat mencari buku, pustaka menunjukkan jumlah yang sudah ditemukan.\n\nPilih tampilan di atas buku: semua, sedang dibaca, belum dibaca, selesai, atau rak (menurut penulis, seri, label, favorit, buku berikutnya dari setiap seri yang sudah dimulai). Ketuk buku untuk membaca; tahan (dengan tombol, tahan Pilih) untuk membuka, menandai selesai atau belum dibaca, melihat informasi, memindahkan ke arsip, atau menghapusnya. Ketuk judul untuk membuka menu pustaka: urutan, tampilan, pencarian, folder pustaka, dan setelan.\n\nFolder diatur lewat Setelan, Pustaka, Folder pustaka; di sana Anda juga bisa menampilkan buku sebagai kisi sampul. Untuk berkas lain, gunakan Berkas di menu Alat."
