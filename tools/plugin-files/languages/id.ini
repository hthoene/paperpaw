vocabulary.setting.sd-folder = Folder berkas set
vocabulary.setting.sd-folder.help = Pada kartu SD: berkas CSV, TSV, atau Anki di dalamnya adalah set.
vocabulary.sd.readme = "Kartu belajar dari berkas\n\nLetakkan satu berkas per set di sini: Spanyol.tsv membuat set Spanyol.\nBerkas: .tsv, .csv, atau .txt yang disimpan sebagai UTF-8, atau .apkg: set Anki yang diekspor dengan Support older Anki versions dicentang. Tiga kolom pertama catatan menjadi depan, belakang, dan contoh; jadwal dan media tidak dibaca, dan PaperPaw tidak pernah menulis berkas Anki.\n\nSatu kartu per baris: depan, belakang, dan contoh opsional, dipisahkan tab, koma, atau titik koma. Baris pertama boleh berisi nama kolom: front, back, example. Contoh:\n\nKatze\tkucing\tDie Katze schläft.\n\nLalu buka Kartu belajar pada pembaca, pilih Kartu belajar di SD, lalu Perbarui set dari kartu.\n\nPerlu diketahui:\n- Set tetap di pembaca bersama progres belajar Anda. Berkas dibaca saat baru atau berubah; kartunya ditambahkan ke set atau diubah di sana.\n- Ubah belakang atau contoh kartu dalam berkas: kartu berubah dan tetap menyimpan progres.\n- Ubah teks depan kartu: dianggap kartu baru dan kartu lama mulai dari awal. Kartu dicocokkan berdasarkan teks depan, tanpa membedakan spasi dan huruf besar. Simpan set ke berkas (Kartu belajar di SD, Simpan set ke kartu): tiap kartu mendapat nomor pada kolom id. Ubah depan di sana, pertahankan dua baris pertama berkas, dan kartu tetap menyimpan progres belajar.\n- Menyimpan akan menulis kartu pada set. Isi berkas yang bukan kartu (baris tanpa depan) tidak disimpan; berkas sebelumnya disalin ke _name.bak.tsv.\n- Simpan berkas sebagai CSV UTF-8 (bukan UTF-16 atau format asli spreadsheet). Berkas di atas 4 MiB atau 20.000 baris tidak dibaca: pecah berkas.\n- Menghapus baris pada berkas tidak menghapus kartu dalam set, kecuali Hapus kartu yang hilang diaktifkan untuk set itu. Jika aktif, kartu dan progres belajarnya hilang.\n- Berkas yang namanya diawali _ tidak dibaca.\n"
