plugin-manager.plugin.description = Uzskaita spraudņus un ieslēdz un izslēdz tos.
plugin-manager.plugin.how = "Spraudņu pārvaldnieks uzskaita katru spraudni ar tā versiju un aprakstu un ieslēdz un izslēdz spraudņus.\n\nTu to atradīsi iestatījumos kā Pārvaldīt spraudņus. Spraudņu iestatījumi ir atsevišķa lappuse, piemēram, katra spraudņa tīkla izmantošanai. Pieskaries spraudnim, lai to ieslēgtu vai izslēgtu (ar pogām izvēlies to). Izmaiņa stājas spēkā pēc restartēšanas: apakšā esošā josla tad piedāvā Restartēt tagad. Turi spraudni (ar pogām turi Izvēlēties), lai izlasītu, kā tas darbojas.\n\nSpraudni ar atzīmi Vienmēr ieslēgts nevar izslēgt, bet to, kam ir atzīme Nepieciešams, var tikai tad, kad cits spraudnis pārņem tā uzdevumu, citādi PaperPaw nebūtu ceļa atpakaļ. Sadaļā Ekrāni izvēlies, kurš spraudnis rāda vietu, ko piedāvā vairāki."
