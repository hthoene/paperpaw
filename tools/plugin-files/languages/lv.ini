menu.plugin.name = Izvēlne
menu.plugin.description = Izvēlne ekrāna apakšā ar darbībām un iestatījumiem.
menu.plugin.how = "Izvēlne uzskaita, ko vari darīt un iestatīt. Tā atveras ekrāna apakšā, virs tā, kas ir atvērts: lasīšanas laikā pieskaries ekrāna vidum vai nospied Izvēlēties. Pieskaries ierakstam vai izvēlies to, lai to izpildītu.\n\nIestatījumi izvēlnē rāda savu vērtību un mainās uz vietas, tāpēc izvēlne paliek atvērta. Ieraksts ar vairāk ierakstiem atver apakšizvēlni.\n\nVelc uz leju no augšējās malas, lai atvērtu ātro piekļuvi: to, ko maini bieži, kā pogas. Pieskaries pogai, lai to pārslēgtu, turi to, lai atvērtu tās iestatījumus. Tikai ar pogām bultiņu pogas izvēlas, Izvēlēties pārslēdz un Atpakaļ aizver. Sadaļā Izskats Izvēlnes rāda izvēlnes kā sarakstu vai kā flīzes."
