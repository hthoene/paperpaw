bluetooth.plugin.how = "Bluetooth savieno pārī tālvadības pultis, tastatūras un sensorus ar lasītāju, ja tam ir Bluetooth (X4 Pro).\n\nPievienot ierīci meklē to, kas ir tuvumā; vispirms ieslēdz ierīcei savienošanas pārī režīmu. Izvēlies to un apstiprini lasītājā (salīdzini skaitli, ja tāds tiek rādīts). Pults vai tastatūras taustiņi tad šķir lappuses un pārvietojas pa izvēlnēm; ko dara katrs taustiņš, maini sadaļā Vadība.\n\nPults norāda, kad to taustiņi darbojas: kad šeit ieslēgti, lasīšanas laikā (savienotas, kamēr grāmata ir atvērta, taupot akumulatoru) vai vienmēr. Izvēlnes poga vai ilga nospiešana uz ierīces to aizmirst.\n\nSensors ir paredzēts spraudņiem: ieslēdz, kurš spraudnis to drīkst izmantot. Bluetooth ir izslēgts, kamēr to neviens neizmanto."
