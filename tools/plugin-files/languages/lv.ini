dictionary.plugin.name = Vārdnīca
dictionary.plugin.description = Meklē vārdus StarDict vārdnīcās.
dictionary.plugin.how = "Vārdnīca meklē vārdu no grāmatas StarDict vārdnīcās un parāda skaidrojumus panelī virs ekrāna apakšējās daļas.\n\nLasītājā turi vārdu un izvēlies Meklēt vārdnīcā; ar pogām izmanto Atlasīt tekstu sadaļā Vairāk. Nokopē vārdnīcu mapes (ar .ifo, .idx un .dict failiem) mapē „dictionaries“ ierīcē, arī apakšmapes der, vai izvēlies citu mapi iestatījumos sadaļā Lasīšana kā Vārdnīcu mape (papildu iestatījums). Pirmā meklēšana sagatavo nelielu indeksu katrai vārdnīcai, kas aizņem brīdi.\n\nPanelī lappušu pogas vai Augšup un Lejup ritina garus skaidrojumus, un Atpakaļ to aizver. Ar pieskārienu pieskaries ārpus tā, lai aizvērtu."
