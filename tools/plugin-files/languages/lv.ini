aids.plugin.name = Lasīšanas palīglīdzekļi
aids.plugin.description = Treknināti vārdu sākumi, aizstāti vārdi, attēli: teksts tā, kā tu to vēlies.
aids.plugin.how = "Lasīšanas palīglīdzekļi maina grāmatas teksta izskatu lasīšanas laikā. Tie attiecas uz katru grāmatu. Treknināti vārdu sākumi un Aizstāt vārdus sākumā ir izslēgti.\n\nTu tos atradīsi iestatījumos sadaļā Lasīšana, apakšsadaļā Lasīšanas palīglīdzekļi. Treknināti vārdu sākumi trekni iestata katra vārda pirmo pusi, ko dažiem ir vieglāk lasīt. Aizstāt vārdus pieņem pārus, kas rakstīti kā „krāsa = color; Dr. = Doktors“, atdalītus ar semikoliem.\n\nTiek aizstāti tikai veseli vārdi, tieši tādi, kā tu tos uzrakstīji, tāpēc „color“ nekad nemaina daļu no garāka vārda. Pati grāmatas datne netiek mainīta.\n\nAttēlus grāmatās var rādīt (kā sākumā), pārvērst īsā rindā, piemēram, „[Attēls: kuģis jūrā]“, kas izmanto attēla aprakstu, vai izlaist. Tad lappusē ir vairāk vietas tekstam, un nerādītam attēlam nekas netiek dekodēts, kas paātrina lappušu šķiršanu. Komiksi un citas grāmatas, kas veidotas no attēliem, netiek mainītas."
aids.setting.bold-beginnings = Treknināti vārdu sākumi
aids.setting.bold-beginnings.help = Katra vārda pirmā puse treknrakstā, ko dažiem ir vieglāk lasīt.
