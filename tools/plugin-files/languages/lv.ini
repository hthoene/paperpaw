format-cbz.plugin.name = Komiksi
format-cbz.plugin.description = Atver komiksu arhīvus (.cbz), viens attēls katrā lappusē.
format-cbz.plugin.how = "Atver komiksu arhīvus (.cbz): viens attēls katrā lappusē, pielāgots ekrānam, secībā pēc to nosaukumiem (2 pirms 10).\n\nIevieto tos bibliotēkas mapē un atver no bibliotēkas; lappuses šķir kā jebkurā grāmatā. Lieli attēli pirmoreiz prasa brīdi, uz X4 vairāk nekā citur.\n\nLasīšanas iestatījumi (Iestatījumi, Lasīšana): „Panelis pa panelim“ rāda vienu lappuses paneli reizē, tik lielu, cik ekrāns ļauj, un lappušu šķiršana pāriet starp tiem; lappuse bez paneļiem tiek rādīta pilnībā. „Komiksa lappuses virzās“ atspoguļo lappušu šķiršanu mangai (no labās uz kreiso); grāmatas pašas ComicInfo.xml to norāda pati. Bibliotēka rāda grāmatas nosaukumu un tās sēriju un numuru no ComicInfo.xml."
format-cbz.title = Komikss (CBZ)
format-cbz.setting.direction = Komiksa lappuses virzās
format-cbz.setting.direction.help = Manga: lappušu šķiršana tiek atspoguļota.
format-cbz.direction.book = Kā grāmatā norādīts
format-cbz.direction.ltr = No kreisās uz labo
format-cbz.direction.rtl = No labās uz kreiso
format-cbz.setting.panels = Panelis pa panelim
format-cbz.setting.panels.help = Viens panelis reizē, lappušu šķiršana pāriet starp tiem.
format-docx.plugin.name = DOCX dokumenti
format-docx.plugin.description = Atver .docx failus, kā tos saglabā Word un citas programmas.
format-docx.plugin.how = "Atver .docx dokumentus kā grāmatas: virsrakstus ar satura rādītāju, sarakstus, tabulas, treknrakstu un slīprakstu, saites un attēlus (JPEG, PNG, GIF).\n\nIevieto failus bibliotēkas mapē un atver tos no bibliotēkas. Nosaukums un autors tiek ņemti no dokumenta rekvizītiem. Zemsvītras atsauces, galvenes un kājenes, kā arī komentāri netiek rādīti."
format-docx.title = DOCX dokuments
format-epub.plugin.name = EPUB
format-epub.plugin.description = Atver EPUB grāmatas ar to stiliem, satura rādītāju un attēliem.
format-epub.plugin.how = "EPUB grāmatas tiek atvērtas no bibliotēkas kā jebkura cita grāmata, ar satura rādītāju, attēliem un izdevēja veidojumu. Tīmekļa lapas (HTML), Markdown, FictionBook (.fb2) un komiksu arhīvi (.cbz) tiek atvērti tāpat, katrs kā savs spraudnis.\n\nNodaļa tiek pārveidota, kad to atver pirmoreiz, un saglabāta spraudņa kešatmiņā, tāpēc vēlāk tas notiek ātrāk un lielas grāmatas darbojas arī mazās ierīcēs. Satura rādītāju atradīsi sadaļā Saturs lasīšanas izvēlnē. Vai tiek lietots grāmatas paša veidojums, nosaka iestatījums Izdevēja formatējums sadaļā Lasīšana."
format-epub.title = EPUB e-grāmata
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Atver FictionBook grāmatas (.fb2, arī arhivētas).
format-fb2.plugin.how = "Atver FictionBook grāmatas (.fb2), kas ir izplatītas krievu un citām grāmatām, arī arhivētas (.fb2.zip), ar to nosaukumu, autoriem, vāku un nodaļām.\n\nIevieto tās bibliotēkas mapē; tās parādās bibliotēkā un tiek atvērtas kā jebkura cita grāmata."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Atver kā failus saglabātas tīmekļa lapas, rādot tikai to, kas jālasa.
format-html.plugin.how = "Atver kā failus saglabātas tīmekļa lapas (.html, .htm, .xhtml) kā grāmatas: tikai to, kas tur ir jālasa, bez izvēlnēm, reklāmām un tamlīdzīgi apkārt.\n\nIevieto failu bibliotēkas mapē un atver to no bibliotēkas kā jebkuru grāmatu. Saites lappuses iekšienē darbojas; attēli parādās tur, kur tie atrodas failā."
format-html.title = Tīmekļa lapa (HTML)
format-images.plugin.name = Attēli
format-images.plugin.description = Atver attēlus (.jpg, .png, .gif) kā grāmatas, viens attēls katrā lappusē.
format-images.plugin.how = "Attēli (.jpg, .png, .gif) tiek atvērti no bibliotēkas kā grāmatas, viens attēls katrā lappusē, pielāgots ekrānam.\n\nLai lasītu visu attēlu mapi, atver tās pirmo attēlu: mapē sekojošie attēli seko secībā pēc to nosaukumiem (2 pirms 10). Vēlāks attēls sākas tur; vieta katrā tiek atcerēta atsevišķi. No atvērtā attēla tiek lasīti līdz 300 mapes attēliem.\n\nFails, kas nav attēls vai ir pārāk liels, rāda savu nosaukumu. Daudziem attēliem ar savu nosaukumu labāka forma ir komiksu arhīvs (.cbz)."
format-images.title = Attēls
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Atver Markdown failus (.md), piemēram, piezīmes.
format-markdown.plugin.how = "Atver Markdown failus (.md), piemēram, piezīmes, kā grāmatas: virsrakstus, sarakstus, citātus un izcēlumus tā, kā tie domāti, nevis kā zīmes.\n\nIevieto failus bibliotēkas mapē un atver tos no bibliotēkas. Pirmais virsraksts kļūst par nosaukumu; attēli blakus failam parādās tur, kur teksts tos min."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI grāmatas
format-mobi.plugin.description = Atver .mobi un .azw failus bez DRM.
format-mobi.plugin.how = "MOBI grāmatas (.mobi, .azw) tiek atvērtas no bibliotēkas kā jebkura grāmata, bez iestatīšanas. Nosaukums, autori, valoda un vāks tiek ņemti no grāmatas, un satura saraksts tiek izveidots no tās virsrakstiem.\n\nGrāmata tiek pārveidota, kad to atver pirmoreiz, un garai tas aizņem dažas sekundes; pēc tam tā atveras uzreiz. Tiek rādīts teksts, virsraksti, treknraksts un slīpraksts, saites un attēli.\n\nGrāmatas ar DRM (lielākā daļa veikalā pirkto) nevar atvērt, tāpat kā grāmatas ar Huffman saspiešanu vai jaunākajā KF8 formā (.azw3): PaperPaw to norāda, kad tās atver. Kopija kā EPUB, izveidota ar tādu rīku kā Calibre, atveras vienmēr."
format-mobi.title = MOBI grāmatas
format-rtf.plugin.name = RTF dokumenti
format-rtf.plugin.description = Atver .rtf failus kā grāmatas.
format-rtf.title = RTF dokumenti
format-txt.plugin.name = Vienkāršs teksts
format-txt.plugin.description = Atver vienkāršus teksta failus (.txt).
format-txt.plugin.how = "Vienkārši teksta faili (.txt) tiek atvērti no bibliotēkas kā jebkura grāmata, bez iestatīšanas. Spraudnis lasa UTF-8, UTF-16 un Windows-1252 tekstu un pats atpazīst kodējumu.\n\nRindkopas seko faila tukšajām rindām; ja failā to nav, katra rinda ir rindkopa. Project Gutenberg failos licences teksts sākumā un beigās tiek izlaists, un nosaukums un autors tiek ņemti no galvenes.\n\nFails nekad netiek ielādēts pilnībā, tāpēc ļoti lieli teksti atveras arī mazās ierīcēs."
format-txt.title = Teksts
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Atver XTC un XTCH grāmatas, Xteink lasītāju iepriekš izveidotās lappuses.
format-xtc.plugin.how = "XTC un XTCH faili ir grāmatas, kuru lappuses jau ir izveidotas kā attēli, ko veido Xteink lasītāju pārveidotāji. Tās tiek atvērtas no bibliotēkas kā jebkura grāmata.\n\nTā kā katra lappuse ir fiksēts attēls, teksta izmēru nevar mainīt un citu fontu nevar iestatīt. Lappuses ir melnbaltas vai ar četriem pelēktoņiem. Katra lappuse tiek apstrādāta, kad to parāda, tāpēc vajag maz atmiņas, arī uz X4.\n\nNosaukums, autors un nodaļas tiek ņemti no faila, ja tajā tādi ir."
format-xtc.title = XTC lappuses
help.plugin.name = Padomi
help.plugin.description = Pirmoreiz atverot ekrānu, parāda, ko dara tā vadības elementi.
help.plugin.how = "Kad ekrāns tiek atvērts pirmoreiz, virs tā parādās īss paziņojums, kas pasaka, ko dara tā vadības elementi: ekrāna daļas, uz kurām iedarbojas pieskāriens, ierāmētas, un ko dara pogas.\n\nPieskāriens vai jebkura poga aizver paziņojumu, un tas šim ekrānam vairs neparādās. Vairs nerādīt padomus izslēdz visus.\n\nIestatījumos sadaļā Sistēma Padomi tos ieslēdz vai izslēdz, un Rādīt padomus atkal liek katra ekrāna paziņojumam parādīties vēlreiz."
