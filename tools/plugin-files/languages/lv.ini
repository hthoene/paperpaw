opds.plugin.name = OPDS katalogi
opds.plugin.description = Pārlūko OPDS katalogus, lejupielādē to grāmatas un uztur mapes sinhronizētas ar tiem.
opds.plugin.how = "OPDS katalogi ir tiešsaistes bibliotēkas, piemēram, Project Gutenberg, Calibre-Web, Kavita vai Komga. Šis spraudnis pārlūko un meklē tajos kā mapēs un lejupielādē to grāmatas bibliotēkā.\n\nAtver Katalogi no izvēlnes Rīki un izvēlies Pievienot katalogu: adrese un, ja katalogam vajadzīgs konts, lietotājvārds un parole. Pieskaries katalogam, lai to pārlūkotu; turi to (ar pogām turi Izvēlēties), lai sinhronizētu, rediģētu vai noņemtu.\n\nJa ir ieslēgts Sinhronizēt šo katalogu, Sinhronizēt katalogus lejupielādē tā jaunās grāmatas tā mapē. Grāmatas vienā sinhronizācijā ierobežo, cik grāmatu paņem viena sinhronizācija, lai liels katalogs nepiepildītu ierīci. Mākoņa mape (WebDAV) darbojas kataloga vietā."
