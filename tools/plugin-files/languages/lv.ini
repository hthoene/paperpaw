mail.plugin.name = E-pasts
mail.plugin.description = Lasa un sūta e-pastu ar paroli vai lietotnes paroli (IMAP un SMTP), bez pieteikšanās pārlūkā.
mail.plugin.how = "E-pasts lasa un sūta e-pastu pa IMAP un SMTP. Tas piesakās ar tavu adresi un paroli, bez pieteikšanās pārlūkā, tāpēc darbojas ar jebkuru pakalpojumu sniedzēju, kas to atļauj.\n\nIestati kontu sadaļā Iestatījumi, E-pasts. Izvēlies savu pakalpojumu sniedzēju, ievadi savu adresi un paroli. Lielākā daļa sniedzēju prasa lietotnes paroli: izveido to sava konta drošības iestatījumos un izmanto šeit. Tava parastā parole bieži nedarbojas, un tā nekur nenonāk, izņemot tavu sniedzēja serveri. Tā tiek glabāta kopā ar parolēm un atslēgām.\n\nAtver E-pasts sadaļā Rīki. Pārbaudīt pastu paņem jaunākos e-pastus un mapes. E-pasti tiek glabāti kartē, tāpēc tos vari lasīt bez tīkla. Ierīce savienojas, paņem un atvienojas, tāpēc Wi-Fi ir ieslēgts tikai uz brīdi.\n\nJa tava sniedzēja nav sarakstā, izvēlies Savi serveri un iestati serveru nosaukumus, portus un drošību papildu iestatījumos. Serveris, kura sertifikātu neviena iestāde neapliecina, vienreiz jautā, vai tam uzticēties; salīdzini pirkstu nospiedumu ar to, ko rāda tavs sniedzējs.\n\nE-pastam ar pievienotu grāmatu (EPUB, PDF un tamlīdzīgi, līdz 2 MB) zem tā ir Atvērt grāmatu: tas paņem failu, ievieto to tavā bibliotēkā un atver.\n\nLai redzētu jaunu pastu, neatverot E-pastu, ieslēdz Meklēt jaunu pastu fonā sadaļā Iestatījumi, E-pasts, un izvēlies, cik bieži (ik pēc 15, 30 vai 60 minūtēm). Tas ir izslēgts, līdz to ieslēdz. Lasītājs tad laiku pa laikam savienojas ar drošu savienojumu, kamēr tas ir nomodā un tiešsaistē, vienu kontu pēc otra, un atjaunina nelasīto e-pastu skaitu sākuma ekrānā. Tas patērē nedaudz akumulatora. E-pasta atvēršana aptur notiekošu pārbaudi.\n\nSākuma ekrāna logrīki rāda nelasīto e-pastu skaitu, jaunākos un ar zvaigznīti atzīmētos e-pastus, vienu pastkasti un saīsni e-pasta rakstīšanai."
