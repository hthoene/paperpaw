weather.plugin.name = Laikapstākļi
weather.plugin.description = Pašreizējie un nākamo dienu laikapstākļi kā logrīki no Open-Meteo.
weather.plugin.how = "Laikapstākļi rāda pašreizējos un nākamo dienu laikapstākļus kā logrīkus sākuma ekrānam no Open-Meteo, kam nav vajadzīgs konts vai atslēga. Laikapstākļi tagad rāda temperatūru, stāvokli un vēl izvēlei; Prognoze rāda nākamās dienas rindā vai sarakstā.\n\nVispirms izvēlies vietu: iestatījumos sadaļā Laikapstākļi, Vieta (ieraksti nosaukumu, tad izvēlies no atrastajām vietām). Tiek sūtītas tikai tās koordinātas, un tikai tad, kamēr tiek rādīts laikapstākļu logrīks. Pievieno logrīkus, rediģējot sākuma ekrānu.\n\nLaikapstākļi tiek ielādēti ne biežāk, kā nosaka Atjaunināt ne biežāk kā ik pēc, un tikai tad, kad ir tīkls: tas nekad pats neieslēdz Wi-Fi.\n\nLaikapstākļu dati no Open-Meteo.com (https://open-meteo.com), saskaņā ar licenci Creative Commons Attribution 4.0 (CC BY 4.0)."
