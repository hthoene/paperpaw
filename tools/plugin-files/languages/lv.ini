vocabulary.sd.readme = "Kartītes no failiem\n\nIevieto šeit failu katrai kavai: Spāņu.tsv izveido kavu Spāņu.\nFaili: .tsv, .csv vai .txt, saglabāti kā UTF-8, vai .apkg: Anki kava, eksportēta ar atzīmētu Atbalstīt vecākas Anki versijas. Tās piezīmju pirmie trīs lauki kļūst par priekšpusi, mugurpusi un piemēru; tās plānošana un multivide netiek lasīta, un PaperPaw nekad nerakstīs Anki failu.\n\nViena kartīte katrā rindā: priekšpuse, mugurpuse un piemērs (nav obligāts), atdalīti ar tabulāciju, komatu vai semikolu. Pirmā rinda var nosaukt kolonnas: front, back, example. Piemērs:\n\nkaķis\tcat\tKaķis guļ.\n\nPēc tam atver Kartītes lasītājā, izvēlies Kartītes no SD kartes un tad Atjaunināt kavas no kartes.\n\nVērts zināt:\n- Kavas paliek lasītājā ar to, ko iemācījies. Fails tiek nolasīts, kad tas ir jauns vai mainīts, un tā kartītes tiek pievienotas kavai vai tur mainītas.\n- Maini kartītes mugurpusi vai piemēru failā: kartīte mainās un patur tavu progresu.\n- Maini kartītes priekšpuses tekstu: tā skaitās jauna kartīte, un vecā sākas no jauna. Kartītes tiek saskaņotas pēc to priekšpuses teksta, atstarpes un lielie burti neskaitās. Saglabā kavu failā (Kartītes no SD kartes, Saglabāt kavu kartē), un katrai kartītei ir numurs kolonnā id: maini tur priekšpusi, atstāj faila pirmās divas rindas, kādas tās ir, un kartīte patur iemācīto.\n- Saglabāšana ieraksta kavas kartītes. Kas failā bija un nav kartīte (rinda bez priekšpuses), netiek paturēts; tur bijušais fails tiek nokopēts uz _nosaukums.bak.tsv.\n- Saglabā failu kā CSV UTF-8 (nevis UTF-16, nevis izklājlapas paša formātā). Fails, kas lielāks par 4 MiB vai ar vairāk nekā 20 000 rindām, netiek nolasīts: sadali to.\n- Rinda, ko failā izdzēs, kartīti kavā neizdzēš, ja vien šai kavai neieslēdz Noņemt trūkstošās kartītes. Tad kartīte pazūd kopā ar iemācīto.\n- Faili, kuru nosaukums sākas ar _, netiek lasīti.\n"
