update.plugin.name = Atjauninājums
update.plugin.description = Instalē programmaparatūras atjauninājumus no kartes vai lejupielādētus no interneta.
update.plugin.how = "Atjauninājums instalē jaunu programmaparatūru ierīcēs, kurās PaperPaw ir programmaparatūra, piemēram, X4. Tu to atradīsi iestatījumos kā Atjauninājums.\n\nMeklēt tiešsaistē jautā atjauninājumu serverim par jaunāku PaperPaw un lejupielādē to, kas pa Wi-Fi aizņem dažas minūtes. Vai nokopē atjauninājuma failu (ar paplašinājumu .bin, no paperpaw.org) kartes mapē updates, piemēram, ar Wi-Fi pārsūtīšanu. Instalēšana tad aizņem aptuveni minūti un ierīce restartējas; grāmatas, iestatījumi un lasīšanas vietas paliek.\n\nAr Meklēt atjauninājumus (iestatījumos, sākumā izslēgts) ierīce pati jautā aptuveni reizi nedēļā, tikai tad, kad Wi-Fi tāpat ir ieslēgts vai tā uzlādējas. Jaunāks PaperPaw, ko tā atrod, gaida šeit; nekas netraucē tavu lasīšanu. Meklēšana nosūta to, kas darbojas ierīcē, bez ierīces nosaukuma vai numura; ierīču skaitīšanai arī to, vai tu to pieprasīji un vai tā ir tās pirmā meklēšana dienā, nedēļā vai mēnesī.\n\nJa spraudņiem, ko izmanto, vēl nav jaunā laidiena versijas, atjauninājums tos gaida. Vecāka versija tiek instalēta tikai tad, ja to izvēlies.\n\nArī citu programmaparatūru, piemēram, CrossPoint, var instalēt no šejienes: ievieto tās failu (ar paplašinājumu .bin) mapē updates un atver Atjauninājums. PaperPaw pārbauda, vai tā ir pilnīga, nebojāta programmaparatūra šai ierīcei, bet nevar pateikt, kas to izveidojis, jo tā nav parakstīta. Tomēr instalēt ieraksta to otrajā zibatmiņas pusē, un ierīce to palaiž; PaperPaw paliek savā pusē, līdz šī programmaparatūra kaut ko instalē tam pāri. Lai vēlāk atgrieztos pie PaperPaw, instalē tā instalēšanas failu (paperpaw-<ierīce>-<versija>-install.bin) no citas programmaparatūras izvēlnes, piemēram, CrossPoint SD programmaparatūras atjauninājuma."
