smart-home.plugin.name = Viedā māja
smart-home.plugin.description = Vērtības un slēdži no tava Home Assistant pārskatā un kā sākuma ekrāna logrīki. Darbojas ar Home Assistant tavā mājas tīklā.
smart-home.plugin.how = "Viedā māja rāda vērtības un slēdžus no tava paša Home Assistant: temperatūras, mitrumu, enerģiju, durvis un logus, lampas, slēdžus un ainas. Tā runā ar tavu serveri pa tā REST API tavā mājas tīklā; nekas neiet caur citiem pakalpojumiem.\n\nAtver Viedā māja no rīku izvēlnes, tad Savienojums: ievadi sava Home Assistant adresi (piemēram, http://homeassistant.local:8123) un ilgstošu piekļuves žetonu (izveido to sava Home Assistant profila lappuses apakšā). Žetons tiek glabāts kopā ar parolēm un atslēgām, nekad iestatījumu failā. Vienkāršs http tiek izmantots tikai adresēm tavā mājas tīklā; serverim citur ieslēdz iestatījumos „Serveri ārpus mājas tīkla“ un izmanto https ar derīgu sertifikātu.\n\nIzvēlēties entītijas atver sarakstu ar to, kas ir tavā serverī: meklē pēc nosaukuma vai ID un izvēlies entītiju, lai to parādītu (izvēlies to vēlreiz, lai to noņemtu). Tai var piešķirt telpu, kas to grupē pārskatā un telpu logrīkos. Tiek paturētas līdz 24 entītijām. Pārskatā izvēlies lampu, slēdzi vai ainu, lai to pārslēgtu: rinda parāda servera atbildi. Sensoru, ko izvēlies, nolasa no jauna.\n\nLogrīki (turi sākuma ekrānu, tad pievieno logrīku): Viedās mājas vērtība rāda vienu rādījumu lielu, grupa uzskaita telpas entītijas, slēdzis ir poga vienai lampai vai slēdzim, un telpa ir kartīte ar telpas rādījumiem un slēdžiem. Katra logrīka iestatījumi norāda, kuru entītiju vai telpu tas rāda.\n\nMāja tiek nolasīta, kad atver pārskatu, kad pieprasi (rinda Atsvaidzināt tagad vai pieskāriens vērtības vai grupas logrīkam), kad lasītājs pamostas, ja Wi-Fi jau ir pieslēgts, un pēc tava iestatītā grafika, kamēr lādētājs ir pieslēgts. Tā nekad pati neieslēdz radio un nekad to neatstāj ieslēgtu."
