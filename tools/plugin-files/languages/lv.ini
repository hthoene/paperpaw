keys.plugin.name = Pogas un žesti
keys.plugin.description = Ko dara katra poga, pieskāriena zona un vilkšana, maināms ierīcē.
keys.plugin.how = "Pogas un žesti parāda, ko dara katra poga, pieskāriena zona un vilkšana, un ļauj to mainīt ierīcē.\n\nAtver to iestatījumos sadaļā Ierīce. Vispirms izvēlies, kur izmaiņa ir spēkā: Visur, Lasīšanas laikā, Sākuma ekrānā, Bibliotēkā vai vienā rīkā. Tad izvēlies ievadi, piemēram, turētu pogu vai vilkšanu no malas, un izvēlies darbību no saraksta, kurā var meklēt. Kā standarta atjauno to, ko iestata spraudņi un pogu izkārtojums.\n\nUz X4 izmaiņa, pēc kuras nepaliktu neviena poga, ar ko izvēlēties, atgriezties vai virzīties tālāk, tiek noraidīta. Atiestatīt pogas un žestus beigās atceļ visas izmaiņas."
