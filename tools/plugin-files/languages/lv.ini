files.plugin.name = Failu pārlūks
files.plugin.description = Rāda ierīcē esošās grāmatas un mapes un atver tās.
files.plugin.how = "Bibliotēka uzskaita grāmatas tavā bibliotēkas mapē, katru ar vāku, nosaukumu, autoru un to, cik tālu esi izlasījis. Grāmata, ko lasīji pēdējo, ir augšā kā kartīte, tāpēc lasīšanas turpināšanai pietiek ar vienu pieskārienu vai vienu Izvēlēties nospiešanu. Kamēr bibliotēka meklē grāmatas, tā parāda, cik jau atradusi.\n\nVirs grāmatām izvēlies, kas tiek rādīts: visas, tās, ko lasi, neizlasītās vai izlasītās, vai plaukti (pēc autora, sērijas, birkas, izlase, katras iesāktās sērijas nākamā grāmata). Pieskaries grāmatai, lai to lasītu; turi to (ar pogām turi Izvēlēties), lai to atvērtu, atzīmētu kā izlasītu vai neizlasītu, apskatītu tās informāciju, pārvietotu uz arhīvu vai dzēstu. Pieskaries nosaukumam, lai atvērtu bibliotēkas izvēlni: kā grāmatas tiek kārtotas un rādītas, meklēšana, bibliotēkas mape un iestatījumi.\n\nBibliotēkas mapi iestata iestatījumos sadaļā Bibliotēka kā Bibliotēkas mape; tur grāmatas var rādīt arī kā vāku režģi. Visiem citiem failiem izmanto Faili izvēlnē Rīki."
