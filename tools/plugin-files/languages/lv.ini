home.plugin.name = Sākuma ekrāns
home.plugin.description = Sākuma lapa: logrīku lappuses, piemēram, lasāmā grāmata un rīki.
home.plugin.how = "Sākuma ekrāns sastāv no lappusēm, katra ir logrīku un rīku režģis kā tālrunī. Sākumā pulkstenis, grāmata, ko lasi, un nesen lasītās grāmatas ir vienā lappusē, bet visi rīki nākamajā.\n\nPieskaries elementam, lai to atvērtu, un velc vai izmanto lappušu pogas, lai mainītu lappuses. Tikai ar pogām bultiņu pogas pāriet no viena elementa uz nākamo, un Izvēlēties to atver.\n\nLai pārkārtotu, turi sākuma ekrānu, pieskaries zīmulim zem lappuses vai izvēlnē izvēlies Rediģēt sākuma ekrānu. Velc elementus, lai tos pārvietotu, vai pieskaries kādam, lai redzētu tā opcijas, arī ar pogām. Tur ir arī Pievienot logrīku. Kolonnas un Rindas ir iestatījumos sadaļā Izskats, apakšsadaļā Sākuma ekrāns.\n\nPagrieztā ekrānā sākuma ekrāns rāda tos pašus elementus ar vairāk kolonnām, katra lappuse tiek piepildīta pirms nākamās, un kartītes nav platākas par aptuveni 110 mm; nekas, ko sakārtoji stateniski, netiek mainīts. Sakārto to uz sāna, un šis izkārtojums tiek paturēts šai orientācijai atsevišķi: jauni logrīki tiek pievienoti abiem. Atiestatīt horizontālo izkārtojumu sadaļā Pievienot (rediģēšanas laikā) atgriežas pie atvasinātā. Logrīka vai rīka noņemšana vienā orientācijā to nenoņem otrā."
