help.got-it = Skaidrs
help.no-more = Vairs nerādīt padomus
help.section = Padomi
help.setting.show = Padomi
help.setting.show.help = Pirmoreiz atverot ekrānu, īss paziņojums pasaka, ko dara tā vadības elementi.
help.setting.again = Rādīt padomus atkal
help.setting.again.help = Katra ekrāna padomi parādīsies vēlreiz, nākamreiz to atverot.
