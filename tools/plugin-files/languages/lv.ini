pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Koncentrēšanās taimeris ar darba un pārtraukumu cikliem, logrīkiem un dienas skaitītāju.
pomodoro.plugin.how = "Pomodoro taimeris: strādā koncentrētos ciklos, tad atpūties. Tam nav vajadzīga iestatīšana: 25 minūtes koncentrēšanās, 5 atpūtas un pēc četriem cikliem garš 15 minūšu pārtraukums.\n\nAtver Pomodoro no rīku izvēlnes un nospied Sākt vai pievieno tā logrīkus sākuma ekrānam (turi sākuma ekrānu, tad pievieno logrīku): Pomodoro taimeris rāda fāzi un atlikušās minūtes, Pomodoro sākt/pauze ir poga, un Pomodoro šodien skaita pabeigtos ciklus ar tavu dienas mērķi. Pieskāriens taimerim to sāk vai aptur; turi to, lai atvērtu pilnu ekrānu.\n\nTaimeris turpina darboties, kad pamet ekrānu, un pēc restartēšanas turpina pēc pulksteņa. Kamēr lasītājs guļ, nekas nedarbojas: fāze, kas šajā laikā beigusies, tiek paziņota pamostoties. Paziņojums norāda, kad fāze ir beigusies. Lai taupītu akumulatoru, pulkstenis atjaunojas reizi minūtē (pilnā ekrānā pēdējā minūtē ik pēc desmit sekundēm) un nekad neļauj lasītājam palikt nomodā.\n\nIestatījumos sadaļā Pomodoro iestati garumus un cikla kopas ciklu skaitu un to, vai nākamā fāze sākas pati. Sadaļā Vairāk: ekrāna uzplaiksnījums vai apgaismojuma mirkšķināšana, kad fāze beidzas, un dienas mērķis."
