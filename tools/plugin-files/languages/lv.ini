koreader.plugin.description = Kopīgo grāmatzīmes un izcēlumus ar KOReader grāmatām, kas tiek lasītas abās.
koreader.plugin.how = "Šis spraudnis kopīgo grāmatzīmes un izcēlumus ar KOReader grāmatām, kuras lasi abās, vienā ierīcē vai bibliotēkas mapē, kas tiek sinhronizēta starp ierīcēm. Nekas nav jāiestata.\n\nKad PaperPaw atver grāmatu, ko ir atvēris arī KOReader, un kad maini tās grāmatzīmes vai izcēlumus, tas pārņem jauno no KOReader datiem blakus grāmatai un atstāj šeit jauno, lai KOReader to paņemtu nākamreiz, kad atvērs grāmatu. Noņemtās atzīmes un mainītās piezīmes tiek pārnestas arī.\n\nTas darbojas tikai EPUB grāmatām. Ja vienas puses failu nevar nolasīt, nekas nemainās nevienā pusē, kamēr tas nav iespējams."
