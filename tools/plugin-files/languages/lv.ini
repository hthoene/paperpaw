rules.plugin.name = Noteikumi
rules.plugin.description = Kad kaut kas notiek, dara kaut ko: piem., nakts režīms plkst. 22:00.
rules.plugin.how = "Noteikums pats kaut ko dara, kad kaut kas notiek: nakts režīms katru dienu plkst. 22:00 vai katalogu sinhronizēšana, kad PaperPaw startē.\n\nNoteikumi ir iestatījumos sadaļā Pielāgot kā Noteikumi. Pievienot noteikumu jautā Kad? (PaperPaw startē, diennakts laiks, grāmata tiek atvērta vai aizvērta, akumulators, uzlāde, slēdzis un vairāk) un Ko tad? (izpildīt darbību, ieslēgt vai izslēgt slēdzi, iestatīt skaitli, parādīt ziņojumu). Pieskaries noteikumam, lai to pauzētu; turi to (ar pogām turi Izvēlēties), lai iestatītu nosacījumu, piemēram, Starp diviem diennakts laikiem, vai lai to noņemtu.\n\nDarbības, slēdži un skaitļi izvēlei ir sakārtoti pa spraudņiem: izvēlies spraudni, tad to, ko tas piedāvā; Atpakaļ atkal iziet no tā. Darbība, kas iedarbojas uz parādīto ekrānu, piemēram, Atpakaļ vai Nākamā lappuse, dara to, ko darītu, ja nospiestu tur.\n\nLaiki ir spēkā neatkarīgi no tā, kurš ekrāns ir atvērts. Divi noteikumi, kas viens otru atceļ, pēc dažiem soļiem apstājas."
