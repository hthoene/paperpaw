news.plugin.name = Ziņas
news.plugin.description = Ielādē ziņu plūsmas (RSS, Atom) kā grāmatas lasīšanai.
news.plugin.how = "Ziņas pārvērš RSS vai Atom plūsmas grāmatās. Katra plūsma kļūst par vienu grāmatu bibliotēkas mapē News ar jaunākajiem rakstiem kā vienkāršu tekstu, ko lasīt kā jebkuru citu grāmatu.\n\nAtver Ziņas no izvēlnes Rīki un izvēlies Pievienot plūsmu; tās adrese ir laikraksta vai emuāra vietnē. Ielādēt ziņas ielādē visas plūsmas un aizstāj iepriekšējās grāmatas. Turi plūsmu (ar pogām turi Izvēlēties), lai to ielādētu vai noņemtu atsevišķi. Noņemta plūsma atstāj savu grāmatu bibliotēkā.\n\nIelādēšanai nepieciešams tīkls. Raksti plūsmā (Iestatījumi, Bibliotēka) nosaka, cik rakstu satur katra grāmata. Logrīks Ziņu virsraksti tos rāda sākuma ekrānā."
