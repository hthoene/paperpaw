reader.plugin.name = Lasīšanas skats
reader.plugin.description = Rāda grāmatas lappuse pa lappusei, ar satura rādītāju un lasīšanas iestatījumiem.
reader.plugin.how = "Lasītājs rāda grāmatas lappuse pa lappusei. Atver grāmatu no bibliotēkas; pēdējā grāmata var atvērties startējot (iestatījums Startējot atvērt pēdējo grāmatu).\n\nPieskaries ekrāna kreisajai vai labajai pusei vai izmanto lappušu pogas, lai šķirtu lappuses. Pieskaries vidum vai nospied Izvēlēties, lai atvērtu lasīšanas izvēlni: Saturs, Meklēt, Pāriet uz lappusi, Fonts un izkārtojums, Grāmatzīmes un izcēlumi un vairāk. Uz leju no augšējās malas atver ātro piekļuvi, uz augšu no apakšējās malas atgriež sākumā; tāpat dara Atpakaļ turēšana.\n\nTuri Izvēlēties (vai turi attēlu), lai redzētu attēlu pilnekrānā: Pa kreisi un Pa labi pāriet starp lappuses attēliem. Izvēlēties tuvina līdz 2x, 3x un atpakaļ (skārienekrānā dubultpieskāriens); tuvinātam attēlam Pa kreisi un Pa labi to bīda uz sāniem, lappušu pogas (vai vilkšana) virzās tālāk, šķērsām un tad uz leju. Atpakaļ atgriežas pie pielāgota attēla, tad pie lappuses (skārienekrānā turi, lai pamestu). Pieskaries augšējam labajam stūrim, lai izveidotu grāmatzīmi. Turi vārdu, lai to izceltu. Ar pogām turi Pa kreisi: Pa kreisi un Pa labi pārvietojas pa vārdiem, lappušu pogas pa rindām, tās turot, nokļūst lappuses galos un pa rindkopām; Izvēlēties atver izcēluma joslu vārdam, Izvēlēties turot paplašina to līdz teikumam un rindkopai (tad Pa kreisi un Pa labi pārvieto beigas, turot tās, sākumu). Atlase turpinās pāri lappušu maiņai. Eksportēt kā Markdown saglabā tavas piezīmes."
