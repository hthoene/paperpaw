vocabulary.plugin.name = Vārdu krājums
vocabulary.plugin.description = Glabā vārdus, ko meklē, ar to teikumiem, un atkārto kartītes ar atkārtošanu laika intervālos, izveidotas tālrunī.
vocabulary.plugin.how = "Vārdu krājums glabā vārdus, ko meklē lasīšanas laikā, katru ar tā teikumu, lai tos vēlāk pārskatītu. Sarakstu atradīsi sadaļā Rīki, jaunākie vispirms; izvēlies vārdu, lai to meklētu vēlreiz. Pēdējā rinda, Eksportēt, saglabā tos kartīšu lietotnēm, piemēram, Anki. Saraksts glabā jaunākos 2000 vārdus: pārējo gadījumā vecākie pazūd, tāpēc eksportē tos vispirms, lai paturētu visus.\n\nKartītes, arī sadaļā Rīki, jautā tev ar atkārtošanu laika intervālos: pēc Parādīt atbildi novērtē katru kartīti ar Vēlreiz, Grūti, Labi vai Viegli, un tas nosaka, kad tā atgriežas. Veido kavas ar Rediģēt ar tālruni: noskenē kodu ar tālruni tajā pašā Wi-Fi, tad raksti kartītes vai pievieno daudzas uzreiz: atver tur kavu, izvēlies Daudz kartīšu uzreiz un izvēlies CSV, TSV vai TXT failu (viena kartīte katrā rindā: priekšpuse, mugurpuse, piemērs; UTF-8), ielīmē sarakstu vai ienes Anki kavu (.apkg, eksportētu ar Atbalstīt vecākas Anki versijas).\n\nVai izmanto failus SD kartē: ievieto CSV, TSV vai TXT failu vai Anki kavu (.apkg, eksportētu ar Atbalstīt vecākas Anki versijas) katrai kavai mapē Flashcards (Spāņu.tsv izveido kavu Spāņu; viena kartīte katrā rindā: priekšpuse, mugurpuse, piemērs; saglabāts kā UTF-8; pirmā rinda var nosaukt kolonnas front, back, example). Sadaļā Kartītes izvēlies Kartītes no SD kartes vai ļauj tam notikt, kad atver Kartītes. Kavas paliek lasītājā ar to, ko iemācījies, un fails tiek iekļauts savā kavā, kad vien tas ir jauns vai mainīts: maini kartītes mugurpusi vai piemēru failā, un kartīte mainās un patur savu progresu; maini priekšpuses tekstu, un tā skaitās jauna kartīte, vecā sākas no jauna (kartītes tiek atšķirtas pēc priekšpuses teksta; atstarpes un lielie burti neskaitās); rinda, ko izdzēs, kartīti neizdzēš (ja vien šai kavai nepārslēdz „kartītes, kuru failā trūkst“ uz Noņemt: tad kartīte tiek noņemta nākamajā atjaunināšanā kopā ar savu progresu, uz visiem laikiem, un nekas netiek noņemts, kamēr kāda faila rinda nav nolasāma). Saglabā kavu tās failā ar Saglabāt kartē: fails saņem kartīšu numurus (kolonna id), tāpēc vari rediģēt priekšpuses datorā, un kartītes patur iemācīto; fails patur tikai id, priekšpusi, mugurpusi un piemēru (citas kolonnas, komentāri un rindu secība netiek paturēti), un saglabāšana tiek noraidīta, kamēr kāda faila rinda nav bijusi nolasāma; tur bijušais fails pirmoreiz tiek nokopēts uz _nosaukums.bak.tsv (vēlāka saglabāšana šo kopiju neaizstāj). Fails, kas lielāks par 4 MiB vai ar vairāk nekā 20 000 rindām, netiek nolasīts, un tas jāsaglabā kā CSV UTF-8, nevis UTF-16. Pirmoreiz lasītājs izveido mapi ar piezīmi par to, kā tas darbojas.\n\nIestatījumos sadaļā Lasīšana Meklētie vārdi kļūst par kartītēm ievieto katru meklēto vārdu kavā Meklētie."
