settings.plugin.name = Iestatījumi
settings.plugin.description = Iestatījumu lappuses, veidotas no visu spraudņu iestatījumiem.
settings.plugin.how = "Iestatījumi rāda visu, ko var iestatīt PaperPaw un tā spraudņos, lappusēs. Spraudņiem nav vajadzīgs savs ekrāns: tas, ko tie deklarē, parādās šeit grupās, ar katra iestatījuma aprakstu zem tā.\n\nAtver tos ar Iestatījumi izvēlnē. Pieskaries grupai, lai to atvērtu, tad iestatījumam, lai to pārslēgtu vai izvēlētos; skaitļiem ir pogas − un +. Ar pogām pārej uz iestatījumu un nospied Izvēlēties: Pa kreisi un Pa labi maina skaitli, Izvēlēties to patur, Atpakaļ atjauno iepriekšējo vērtību.\n\nIzmaiņas stājas spēkā uzreiz. Meklēt atrod iestatījumu pēc vārdiem, un Papildu iestatījumi pievieno reti vajadzīgos. Atiestatīt noklusējumus un Atiestatīt visu vispirms jautā."
