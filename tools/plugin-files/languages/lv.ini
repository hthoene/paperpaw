fonts-browser.plugin.name = Vairāk fontu
fonts-browser.plugin.description = Rāda fontus no interneta, katru ar paraugu, un lejupielādē tos lasīšanai.
fonts-browser.plugin.how = "Vairāk fontu uzskaita fontus no fontu bibliotēkas internetā, katru nosaukumu ar paša fontu, un lejupielādē tos, ar kuriem vēlies lasīt.\n\nTu to atradīsi fontu saraksta beigās, kur tiek izvēlēts lasīšanas fonts: iestatījumos sadaļā Lasīšana kā Fonts; statusa joslām ir tāds pats ieraksts to fontam. Pieskaries fontam (ar pogām nospied Izvēlēties), lai redzētu to lielāku ar parauga teikumu, un izvēlies Lejupielādēt. Lejupielādes laikā vari pamest lappusi. Kad tā pabeigta, izvēlies Lasīt ar (fonta nosaukums) vai Izmantot statusa joslām. Atjaunināt paņem jaunāku versiju, Noņemt izdzēš fontu no ierīces.\n\nTam nepieciešams Wi-Fi.\n\nSAVI FONTI\n\nBlakus Vairāk fontu tajā pašā sarakstā ir Savi fonti, kas rāda šo palīdzības daļu. Savs fonts ir .ttf vai .otf fails, piemēram, no Google Fonts.\n\nAndroid un citās ierīcēs, kas zīmē fontu failus: nokopē failu mapē fonts (Android ierīcēs: PaperPaw/fonts koplietotajā krātuvē), restartē PaperPaw un izvēlies fontu iestatījumos sadaļā Lasīšana kā Fonts.\n\nXteink X4 un X4 Pro: šie lasītāji lasa fontu pakotnes, nevis fontu failus, jo fontu faili to atmiņā neietilptu. Izveido pakotni datorā ar paperpaw-fontgen katram stilam, kas tev ir (Regular ir obligāts):\n\npaperpaw-fontgen --family \"Mans fonts\" --regular MansFonts-Regular.ttf --bold MansFonts-Bold.ttf --italic MansFonts-Italic.ttf plugins\n\nTas izveido mapi plugins/font-mans-fonts. Nokopē to spraudņu mapē atmiņas kartē, restartē un izvēlies Mans fonts kā Fonts. Pakotne ar vienu stilu latīņu burtiem ir apmēram pusmegabaita; izlaistie stili tiek zīmēti ar regular stilu. Rīks norāda, cik no tevis pieprasītajiem burtiem fontam ir (--chars latin,cyrillic,greek pievieno rakstības): fonts bez tavas grāmatas burtiem tos nevar parādīt, tāpēc meklē tādu, kas aptver tās rakstību.\n\nFonti no Vairāk fontu darbojas tāpat un datoru neprasa.\n\nLai e-tintes panelī mazais teksts būtu asāks, komandai pievieno --hinting light: tas pieskaņo burtus pikseļu režģim, kā ir veidoti komplektā iekļautie fonti. Bez tā burti tiek zīmēti tā, kā fonta autors tos veidojis; --hinting normal un --hinting mono pieskaņo tos stiprāk. Fontus ar zīmēm virs vai zem burtiem, piemēram, arābu vai devanagari, labāk atstāt bez tā."
