sleep.plugin.name = Miega ekrāns
sleep.plugin.description = Rāda guļošu kaķi, grāmatas vāku, tavus attēlus vai ziņojumu, kamēr ierīce guļ.
sleep.plugin.how = "Miega ekrāns nosaka, ko ekrāns rāda, kamēr ierīce guļ. E-tinte patur attēlu bez strāvas.\n\nIzvēlies to iestatījumos sadaļā Ierīce, Miega ekrāns, ar Rādīt: guļošs kaķis (noklusējums), grāmatas vāks, mani attēli, logotips un „Guļ“, logrīki, lappuse tāda, kāda tā ir, vai lappuse ar attēlu. Mani attēli rāda Attēlu mapes failus cits pēc cita.\n\nBez vāka vai attēla tiek rādīts kaķis. Kur sistēma miega ekrānu zīmē pati, šie iestatījumi ir paslēpti.\n\nIzslēgšanas ekrāns, Rādīt, kad izslēgts, tiek uzzīmēts vienreiz, kad ierīci izslēdz, no enerģijas izvēlnes vai pēc laika, kas norādīts iestatījumā Izslēgt pēc miega (ne tad, kad strāvu atslēdz zems akumulators). Tas ir kā miega ekrāns, ja vien neizvēlies logotipu un „Izslēgts“, kaķi, vāku vai manus attēlus. Cits spraudnis tam var piedāvāt ekrānu.\n\nStartēšanas un restartēšanas ekrāns, Rādīt, startējot un Rādīt, restartējot, ir ierīces paša, ja vien cits spraudnis tiem nepiedāvā ekrānu. Spraudņi vēl nedarbojas, kamēr ierīce startē: startam izvēlētais ekrāns tiek uzzīmēts iepriekš, kad ierīci izslēdz vai restartē, un parādīts nākamajā startā. Ekrāns, kas nav laikā gatavs, vai bojāts attēls dod vietu ierīces paša ekrānam; ierīce katrā ziņā izslēdzas vai restartējas."
