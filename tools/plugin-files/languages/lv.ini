setup.plugin.name = Iestatīšana
setup.plugin.description = Īss ceļvedis pa svarīgākajiem iestatījumiem pirmajā startā.
setup.plugin.how = "Iestatīšana ir īss ceļvedis pa svarīgākajiem iestatījumiem, kas tiek parādīts vienreiz, kad PaperPaw startē pirmoreiz. Katra lappuse jautā vienu lietu, piemēram, valodu, pogas, teksta izmēru, laika joslu, Wi-Fi vai dažus pievienojamus spraudņus, ar jau izvēlētu saprātīgu atbildi, tāpēc Tālāk vienmēr der. Soļi, kas šai ierīcei nav vajadzīgi, tiek izlaisti.\n\nPieskaries pogām vai izmanto pogas augšup un lejup un Izvēlēties. Izlaist pirmajā lappusē uzreiz pamet iestatīšanu. Pēdējā lappuse pastāsta, no kurienes nāk tavas grāmatas.\n\nLai to palaistu vēlreiz, atver iestatījumus un izvēlies Iestatīt PaperPaw. Visu šeit izvēlēto vēlāk var mainīt iestatījumos."
