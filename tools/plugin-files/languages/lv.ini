widgets.plugin.name = Logrīku komplekts
widgets.plugin.description = Daudz vairāk logrīku sākuma ekrānam: pulksteņi, kalendārs, citāti, grāmatas, piezīmes un vairāk.
widgets.plugin.how = "Logrīku komplekts pievieno daudz logrīku sākuma ekrānam: pulksteņus (analogo, vārdu, flīžu, pasaules), kalendāru, gadu līdz šim, atpakaļskaitīšanu, Mēness fāzi un dienu un datumu; dienas citātu, piezīmes, darāmos darbus, attēlus, sveicienu un PaperPaw logotipu; un grāmatām tagad lasāmo, lasīšanas progresu, nākamo, sēriju, izlasi, izcēlumu un bibliotēku skaitļos. Tajā ir arī akumulatora logrīks.\n\nPievieno tos ar Rediģēt sākuma ekrānu izvēlnē (vai ilgi nospiežot sākuma ekrānu), tad Pievienot logrīku. Katram ir savi iestatījumi, piemēram, rāmis, izmērs un līdzinājums. Izvēloties mainīgu logrīku, piemēram, dienas citātu, tiek parādīts nākamais. Savi citāti tiek ierakstīti failā quotes.txt kartes mapē .paperpaw/plugins/widgets, katra rinda kā teksts | autors. Laika logrīkiem vajadzīgs iestatīts pulkstenis; to iestata Wi-Fi."
