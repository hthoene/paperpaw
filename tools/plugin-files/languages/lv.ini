about.plugin.name = Informācija
about.plugin.description = PaperPaw versija un licences.
about.plugin.how = "Informācija parāda, kāda PaperPaw versija tev ir, kur atrodas tās pirmkods un ar kādām licencēm tā tiek izplatīta.\n\nTu to atradīsi iestatījumu beigās kā Par PaperPaw. Izvēlies rindu ar bultiņu pogām un Izvēlēties vai pieskaries tai. Programmaparatūrā iebūvētie spraudņi un ierīcēs, kas ielādē spraudņus ar kodu, arī pirkstu nospiedums, kādam šādiem spraudņiem jābūt veidotiem, ir uzskaitīti arī tur.\n\nLicences atveras kā teksts lasītājā, tāpēc tu to pāršķir kā grāmatu. Tajā ir PaperPaw paša licence un to fontu, ikonu un vārdu dalīšanas šablonu licences, kas nāk līdzi. Spraudņi var pievienot savu rindu, piemēram, dizaina autoru."
