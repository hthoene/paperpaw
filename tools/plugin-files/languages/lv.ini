calendar.plugin.name = Kalendārs
calendar.plugin.description = Tavi kalendāri lasītājā: dienaskārtība, dienas, nedēļas un mēneša skati no CalDAV, iCal un failiem, dzimšanas dienas no kontaktpersonām, logrīki sākuma ekrānam un miega ekrāns.
calendar.plugin.how = "Tavi kalendāri lasītājā: tuvāko dienu dienaskārtība, diena, nedēļa un mēnesis ar CalDAV kalendāru (Nextcloud, Radicale, Baïkal, Fastmail un citu), iCal adrešu (.ics, webcal://), kartē esošu kalendāra failu notikumiem un kontaktpersonu dzimšanas dienām un jubilejām (CardDAV). Lasītājs kalendārus tikai nolasa; tas tos nekad nemaina.\n\nAtver Kalendārs no rīku izvēlnes. Pirmā rinda nosauc skatu; izvēlies to vai turi jebkuru rindu, vai nospied Izvēlne, lai pārslēgtos starp Dienaskārtība, Diena, Nedēļa, Mēnesis un Dzimšanas dienas, pievienotu kalendārus vai sinhronizētu. Dienas un nedēļas skatā pirmās divas rindas pāriet uz iepriekšējo un nākamo dienu vai nedēļu (to dara arī lappušu pogas); mēneša skatā bultiņu pogas pārvieto dienu, lappušu pogas mēnesi, un Izvēlēties atver dienu. Izvēlēties uz notikuma to parāda pilnībā: kad, kur, kurš kalendārs un kā tas atkārtojas. Atpakaļ atgriežas par vienu soli.\n\nPievieno kalendāru sadaļā Kalendāri (izvēlnē vai Kalendārs iestatījumos). Izvēlies tā veidu: CalDAV konts (pietiek ar servera adresi, piem., cloud.example.com/remote.php/dav; katrs kalendārs ar notikumiem kļūst par skata daļu), iCal adrese (kalendārs, kas publicēts kā .ics), kalendāra fails kartē vai kontaktpersonas (CardDAV adrešu grāmata: lasītājs rāda tajā saglabātās dzimšanas dienas un jubilejas). Ievadi adresi, kontam savu lietotājvārdu un paroli (vislabāk lietotnes paroli; tā tiek glabāta kopā ar lasītāja parolēm) un nosaukumu. Katram kalendāram ir atzīme (punkts, aplis, pelēks punkts vai kvadrāts), ko vari mainīt, lai tos atšķirtu; līdz sešiem kalendāriem.\n\nAtkārtojošies notikumi (katru dienu, katru nedēļu, katru mēnesi, katru gadu, ar nedēļas dienām, skaitu, beigu datumiem un izlaistām dienām), visas dienas notikumi un notikumi citās laika joslās tiek rādīti pēc lasītāja paša pulksteņa. Lasītājs paturē notikumus no sešdesmit dienām pirms līdz sešdesmit dienām pēc šodienas, ne vairāk kā 240, un rāda tos bez tīkla. Noteikumi, ko tas nevar nolasīt, parāda savu notikumu vienu reizi.\n\nKalendāri tiek nolasīti, kad atver kalendāru (ne biežāk kā reizi piecās minūtēs), kad izvēlies Sinhronizēt tagad un, kā iestatīji sadaļā Kalendārs iestatījumos, kad tīkls tāpat ir ieslēgts vai kad sākas uzlāde. Lasītājs šim nolūkam nekad neieslēdz savu radio, izņemot gadījumus, kad pieprasi Sinhronizēt tagad.\n\nLogrīki sākuma ekrānam (turi sākuma ekrānu, tad pievieno logrīku): Šodien rāda datumu un to, ko diena nes, Nākamais notikums nākamo notikumu, Dienaskārtība tuvākās dienas, Mēnesis mēnesi ar punktu zem dienām, kurās ir notikumi, un Dzimšanas dienas tuvākās dzimšanas dienas. Pieskāriens notikumam to atver, pieskāriens mēneša dienai atver šo dienu. Miega ekrāns var rādīt šodienas dienaskārtību: izvēlies Kalendārs sadaļā Miega ekrāns iestatījumos."
