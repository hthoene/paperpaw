translate.plugin.description = Tulko atlasīto tekstu tiešsaistē ar DeepL.
translate.plugin.how = "Tulkošana tulko atlasīto tekstu tiešsaistē ar DeepL. Atlasi tekstu grāmatā un atlasītā teksta izvēlnē izvēlies Tulkot: tulkojums parādās virs lappuses kā vārdnīcas ieraksts. Lappušu pogas vai pieskārieni to ritina, un Izvēlēties vai pieskāriens tā beigās to aizver.\n\nTai vajadzīgs tīkls un savs DeepL API atslēga, bezmaksas vietnē deepl.com (DeepL API Free, aptuveni 500 000 rakstzīmju mēnesī). Kamēr to neievadi, panelis to norāda, un pieskāriens to pieprasa.\n\nIestatījumos sadaļā Lasīšana, apakšsadaļā Tulkošana, Tulkot uz nosaka valodu; sākumā tā ir PaperPaw pašas valoda."
