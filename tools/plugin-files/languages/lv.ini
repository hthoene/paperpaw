keyboard.plugin.name = Tastatūra
keyboard.plugin.description = Ievada tekstu ekrānā, ar pieskārienu vai ar pogām.
keyboard.plugin.how = "Tastatūra tiek atvērta, kad kaut kam vajag tekstu: meklēšanai, parolei, piezīmei vai iestatījumam. Tā darbojas ar pieskārienu un tikai ar pogām.\n\nAr pogām Pa kreisi un Pa labi pārvietojas pa rindu, lappušu pogas starp rindām, Izvēlēties nospiež taustiņu un Atpakaļ atceļ; Pa kreisi un Pa labi iet apkārt rindai, Augšup un Lejup paliek tavā kolonnā. Shift padara nākamo burtu par lielo; nospiests divreiz tas padara lielus visus, un vēlreiz to beidz. Turi burtu (ar pogām: turi Izvēlēties uz tā), lai redzētu tā lielo burtu, izvēlētu uzreiz, un akcentus, piemēram, é un è; vācu valodā ä, ö, ü un ß nāk šādi no a, o, u un s (ar pogām tastatūra to norāda uz šiem burtiem). OK pabeidz ievadi; ar pogām turi Atpakaļ, lai pabeigtu no jebkuras vietas (Atpakaļ vien atceļ), vai turi Izvēlēties uz taustiņa, kas nav burts. Ielīmēt ievieto starpliktuves tekstu, un Tālrunis, kur tas tiek piedāvāts, ļauj tā vietā rakstīt tālrunī.\n\nIestatījumos sadaļā Ierīce, Tastatūra: Tastatūras izkārtojumi izvēlas izkārtojumus. Pēc noklusējuma tiek izmantota izvēlņu valoda; ja to ir vairāki, taustiņš pārslēdzas starp tiem. Umlaut taustiņi tā vietā piešķir ä, ö, ü un ß savus taustiņus. Izmērs palielina taustiņus un burtus; tikai ar pogām rindas paliek tādas pašas kā datora tastatūrai. Skārienekrānos Taustiņu forma maina taustiņu izskatu. Automātiskie lielie burti sāk katru teikumu ar lielo burtu."
