calibre.plugin.name = Bezvadu bibliotēka
calibre.plugin.description = Saņem grāmatas pa tīklu. Darbojas kā bezvadu ierīce programmai Calibre.
calibre.plugin.how = "Bezvadu bibliotēka ļauj ierīcei parādīties programmā Calibre tavā datorā kā bezvadu ierīcei. Tad Calibre var tai sūtīt grāmatas, uzskaitīt tās un dzēst. Grāmatas nonāk bibliotēkā.\n\nAtver Bezvadu bibliotēka no izvēlnes Rīki, ar ierīci un datoru vienā Wi-Fi tīklā. Programmā Calibre izvēlies Savienot/kopīgot, tad Sākt bezvadu ierīces savienojumu. Kad ierīce ir atradusi tavu datoru, tā parāda tā nosaukumu; pieskaries Savienot (ar pogām nospied Izvēlēties). Calibre šeit var pievienot un dzēst grāmatas, tāpēc savienojies tikai ar savu datoru. Ekrāna aizvēršana beidz savienojumu.\n\nJa Calibre netiek atrasts pats, ievadi tā datora adresi iestatījumos sadaļā Bibliotēka, Calibre daļā, kā Adrese. Ja Calibre izmanto citu portu nekā 9090, pievieno to kā :ports, piem., 192.168.1.20:9091."
