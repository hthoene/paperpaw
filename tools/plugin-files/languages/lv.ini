notes-vault.plugin.name = Piezīmju glabātava
notes-vault.plugin.description = Lasa Markdown piezīmju mapi pēc mapēm, birkām un pēdējām izmaiņām, ar logrīkiem sākuma ekrānam. Darbojas ar Obsidian glabātavām.
notes-vault.plugin.how = "Piezīmju glabātava lasa Markdown piezīmju mapi (vienkāršus .md failus, kā tos glabā piezīmju lietotnes). Tā darbojas ar Obsidian glabātavām.\n\nIzvēlies glabātavas mapi iestatījumos vai glabātavas lappusē sadaļā Rīki. Lappusē tad tiek piedāvātas mapes tādas, kādas tās ir kartē, pēdējās mainītās piezīmes, birkas un meklēšana piezīmju nosaukumos.\n\nPirmoreiz glabātava tiek indeksēta fonā, kamēr tās lappuse ir atvērta; glabātava ar tūkstošiem piezīmju aizņem dažas minūtes, pēc tam atveras uzreiz. Indekss tiek glabāts kartē un izveidots no jauna, kad glabātavas lappuse tiek atvērta pēc dažām stundām vai kad izvēlies Atjaunināt.\n\nPiezīme tiek atvērta lasītājā. Saites uz citām piezīmēm ([[Piezīme]], [[Piezīme|vārdi]], [[Piezīme#Virsraksts]]) tiek atrastas pēc piezīmes nosaukuma jebkur glabātavā; sekojot saitei, tiek atvērta šī piezīme, un Atpakaļ atgriež pie iepriekšējās piezīmes.\n\nNekas glabātavā nekad netiek mainīts. Logrīki sākuma ekrānam (jaunākās piezīmes, piesprausta piezīme, dienas piezīme, nejauša piezīme, birkas, meklēšana) tiek pievienoti sākuma ekrāna redaktorā. Logrīks var ņemt piezīmes tikai no vienas mapes: logrīka iestatījumos ieraksti mapes ceļu no kartes saknes (piemēram, Piezimes/Darbs); ja atstāts tukšs, tas ņem visas glabātavas piezīmes."
