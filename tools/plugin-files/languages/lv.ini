menu-editor.plugin.description = Pārkārto, noņem un pievieno visu izvēlņu ierakstus.
menu-editor.plugin.how = "Izvēlņu redaktors maina, kas ir izvēlnēs: pārvieto ierakstus uz augšu vai leju, noņem tos vai pievieno jaunus.\n\nTu to atradīsi iestatījumos sadaļā Pielāgot kā Pielāgot izvēlnes. Izvēlies izvēlni, tad ierakstu, lai to pārvietotu vai noņemtu; Pievienot ierakstu ievieto jaunu. Izmaiņas stājas spēkā uzreiz. Atiestatīt šo izvēlni atgriež izvēlni tādu, kādu to definē tās spraudņi, Atiestatīt visas izvēlnes dara to katrai.\n\nAizslēgt sevi nevar: ieraksts, kas ir ceļš uz iestatījumiem, paliek, līdz tu pievieno citu ceļu uz tiem."
