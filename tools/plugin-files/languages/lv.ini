diagnostics.plugin.name = Diagnostika
diagnostics.plugin.description = Testa ekrāns un vadīta visu ierīces daļu pārbaude.
diagnostics.plugin.how = "Diagnostika ir testa ekrāns ierīces pārbaudei: tas rāda katru pelēktoņu līmeni, ko panelis var attēlot, četrus lodziņus pogu un pieskārienu izmēģināšanai un lappušu skaitītāju ar progresa joslu, lai salīdzinātu atsvaidzināšanas veidus.\n\nTesta ekrānam nav izvēlnes ieraksta. Tas ir sākuma ekrāns tikai tad, ja neviens cits spraudnis tādu nepiedāvā, vai ja izvēlies to spraudņu pārvaldniekā sadaļā Ekrāni vietai Sākuma ekrāns.\n\nIzvēlēties atzīmē lodziņu ar fokusu, un bultiņu pogas pārvietojas starp lodziņiem; ar pieskārienu pieskaries lodziņam. Lappušu pogas šķir testa lappuses. Turi Izvēlēties vai turi pirkstu uz ekrāna, lai sāktu no jauna.\n\nIerīces pārbaude, sadaļā Rīki, ja PaperPaw ir ierīces programmaparatūra, vienu lappusi pēc otras iziet cauri visām ierīces daļām: ekrānam, pogām, pieskārieniem, apgaismojumam, akumulatoram, kartei, pulkstenim, Wi-Fi, miega režīmam un atmiņai. Katra lappuse beidzas ar Neizdevās, Izlaist un Kārtībā; izvēlēta ir atbilde, ko norāda mērījumi. Ierīcei trūkstošās daļas tiek izlaistas. Pēc katras atbildes tiek ierakstīts ziņojums failā .paperpaw/plugins/diagnostics/device-check.txt, ko ielīmēt pull request. Atpakaļ to pamet, un, atverot vēlreiz, tas turpinās tur, kur apstājās. Ierīcē tikai ar pogām vispirms pogu lappusē izvēlies Sākt; līdz tam bultiņas, Izvēlēties un Atpakaļ darbojas kā katrā lappusē."
