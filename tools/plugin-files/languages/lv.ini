notes-overview.plugin.name = Visas piezīmes
notes-overview.plugin.description = Visu grāmatu grāmatzīmes un izcēlumi vienā sarakstā un eksports kā My Clippings.txt.
notes-overview.plugin.how = "Visas piezīmes uzskaita katru grāmatu, kurā esi izveidojis grāmatzīmi vai izcēlumu, ar to skaitu. Atver to sadaļā Rīki. Izvēlies grāmatu, lai redzētu tās piezīmes, un piezīmi, lai atvērtu grāmatu šajā vietā.\n\nSaraksta beigās Eksportēt kā My Clippings.txt ieraksta visas piezīmes vienā failā mapē Exports blakus bibliotēkai tādā formā, kādu izmanto Kindle (UTF-8). Lietotnes, kas lasa Kindle failu My Clippings.txt, var to nolasīt. Piezīme pie izcēluma ir atsevišķs ieraksts, kā Kindle. Tā kā grāmatai šeit nav Kindle atrašanās vietu, „location“ ir tas, cik tālu grāmatā piezīme atrodas, procentos. Fails katru reizi tiek rakstīts no jauna; tas aizstāj iepriekšējo."
