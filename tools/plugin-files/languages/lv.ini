profiles.plugin.name = Lasīšanas profili
profiles.plugin.description = Nosaukti lasīšanas un attēlojuma iestatījumu komplekti, pārslēdzami ar pieskārienu.
profiles.plugin.how = "Profils glabā tavus lasīšanas iestatījumus, attēlojuma iestatījumus un statusa joslas ar nosaukumu, piemēram, Nakts vai Liels teksts, un atjauno tos ar pieskārienu.\n\nAtver Profili lasīšanas izvēlnē sadaļā Vairāk vai iestatījumos sadaļā Pielāgot. Pieskaries profilam, lai to izmantotu; lietotais ir atzīmēts. Turi to (ar pogām turi Izvēlēties), lai tajā saglabātu pašreizējos iestatījumus, pārdēvētu to vai noņemtu. Saglabāt kā jaunu profilu paglabā to, kas tagad ir iestatīts.\n\nNākamais profils pārslēdzas uz nākamo sarakstā; piešķir to pogai vai noteikumam."
