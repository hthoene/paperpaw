transfer.plugin.name = Pārsūtīšana
transfer.plugin.description = Ievieto grāmatas un citus failus ierīcē no pārlūka tajā pašā tīklā.
transfer.plugin.how = "Wi-Fi pārsūtīšana ievieto grāmatas un citus failus ierīcē no pārlūka tajā pašā tīklā, bez kabeļa vai lietotnes. Vari arī lejupielādēt failus, veidot mapes un dzēst.\n\nAtver to no Rīki. Ekrānā tiek rādīta adrese kā teksts un kā QR kods: atver to pārlūkā tālrunī vai datorā vai noskenē kodu. Adresē ir atslēga, kas katru reizi tiek izveidota no jauna, tāpēc citi tīklā tavus failus nevar sasniegt. Pārsūtīšana darbojas, kamēr ekrāns ir atvērts.\n\nKur PaperPaw pats pārvalda Wi-Fi, kā uz X4, Bez rūtera apakšā atver ierīces paša tīklu, kuram tālrunis pievienojas, noskenējot kodu."
