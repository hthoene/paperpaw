store.plugin.name = Spraudņu veikals
store.plugin.description = Atrod, instalē, atjaunina un noņem spraudņus šai ierīcei.
store.plugin.how = "Spraudņu veikals internetā atrod spraudņus šai ierīcei un instalē, atjaunina un noņem tos. Atver to no Rīki; tam vajadzīgs Wi-Fi.\n\nSākumā tiek rādīts, ko bibliotēka iesaka, kas ir jauns vai pašlaik populārs, tad grupas. Grupa rāda savus spraudņus godīgā sajaukumā, kas mainās katru dienu, lai katrs spraudnis tiktu redzēts; kārto tos no A līdz Z, pēc jaunākajiem vai pēc pēdējā atjauninājuma un garos sarakstos pārej uz burtu. Atver kādu, lai redzētu tā lappusi ar izmēru un atmiņu, ko tas aizņem, tad izvēlies Instalēt, Atjaunināt vai Noņemt. Atjaunināt visu atjaunina katru instalēto spraudni.\n\nKoda spraudņi darbojas ar pilnu piekļuvi ierīcei: veikals to norāda un vispirms jautā, un tie sāk darboties pēc restartēšanas. Ja kāds noiet greizi, PaperPaw startē bez koda spraudņiem un norāda, kuru. Spraudņu bibliotēka nosaka, no kurienes nāk saraksts.\n\nKopienas spraudņi sadaļā Iestatījumi, Sistēma rāda arī spraudņus, ko citi publicējuši GitHub. Neviens tos nav pārskatījis: tie ir atzīmēti kā Nepārbaudīts, koda spraudņa lappusē ir redzama atslēga, ar kuru tas parakstīts, un atjauninājums, kas parakstīts ar citu atslēgu, netiek instalēts.\n\nAvoti, pēdējā sākuma rinda, pievieno citu spraudņu sarakstus pēc to adreses (https://…/plugins.json), rāda vienu no tiem PaperPaw saraksta vietā vai noņem to. Rakstīšanas vietā ievieto failu sources.txt ar vienu adresi katrā rindā kartes mapē .paperpaw/plugins/store: adreses parādās sadaļā Avoti kā jaunas. PaperPaw avotu un tā spraudņus nepārbauda, un ierīce sazinās ar avota serveri. Avots paraksta savu sarakstu; ierīce paturas pirmā nolasītā saraksta atslēgu un turpmāk pieņem tikai sarakstus un koda spraudņus, kas parakstīti ar šo atslēgu. Spraudnis saņem atjauninājumus tikai no avota, no kura tas tika instalēts. PaperPaw paša bibliotēka vienmēr ir klāt, un to nevar noņemt; pametot veikalu, tiek atgriezta tā."
