battery.plugin.name = Akumulatora patēriņš
battery.plugin.description = Ieraksta akumulatora uzlādi un parāda, cik ilgi tas kalpo.
battery.plugin.how = "Akumulatora patēriņš apmēram reizi minūtē atzīmē uzlādes līmeni, kamēr ierīce ir nomodā, kopā ar to, ko tā darīja: ekrāna atsvaidzināšanas un pāršķirtās lappuses. No tā tiek aprēķināts, cik patērē stunda nomodā un 100 lappuses un cik ilgi akumulators kalpos šādā tempā.\n\nAtver Akumulators no izvēlnes Rīki. Tas rāda uzlādi tagad, šo nomoda laiku, līdz šim patēriņu no akumulatora un pēdējos nomoda laikus. Pāršķir ar lappušu pogām vai pieskaroties bultiņām augšpusē.\n\nLai skaitļi kaut ko nozīmētu, kādu laiku jālasa ar akumulatoru. Ierakstīšana pēc noklusējuma ir ieslēgta, un to var izslēgt iestatījumos sadaļā Ierīce, Enerģija kā Ierakstīt akumulatora patēriņu."
