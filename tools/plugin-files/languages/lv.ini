puzzles.plugin.name = Mīklas
puzzles.plugin.description = Sudoku, krustvārdu mīklas un šaha uzdevumi, bezsaistē, ar dienas mīklu.
puzzles.plugin.how = "Mīklas vilcienam un uzgaidāmajai telpai, viss bezsaistē: sudoku, krustvārdu mīklas un šaha uzdevumi. Atver Mīklas no rīku izvēlnes vai pievieno logrīku Dienas mīkla sākuma ekrānam (turi sākuma ekrānu, tad pievieno logrīku): tas rāda, cik tālu ir šodienas sudoku, un pieskāriens to atver. Dienas sudoku visu dienu ir tas pats.\n\nSudoku: Pa kreisi un Pa labi pārvieto kursoru lodziņu pa lodziņam, Augšup un Lejup (lappušu pogas) par vienu rindu. Izvēlēties atver ciparus: izvēlies vienu un vēlreiz izvēlies, lai to ievietotu, vai Notīrīt, lai iztukšotu lodziņu. Turi Izvēlēties (vai Izvēlne), lai nokļūtu pie pogām zem laukuma: Piezīmes pārvērš ciparus zīmuļa atzīmēs, Pārbaudīt atzīmē nepareizos lodziņus, Atsaukt atceļ pēdējo gājienu, Jauns sāk mīklu izvēlētajā līmenī (Viegls, Vidējs, Grūts). Katrai mīklai ir tieši viens atrisinājums. Spēle tiek saglabāta, kad pamet. Skārienekrānā pieskaries lodziņam.\n\nKrustvārdu mīklas: ievieto .puz (Across Lite) vai .ipuz failus atmiņas kartes mapē „puzzles“; neviena nav komplektā. Pārvietojies pa režģi, tad izvēlies, lai ar tastatūru ievadītu vārdu zem kursora (pasvītrojums atstāj lodziņu tukšu). Pogas pārslēdz horizontāli un vertikāli, parāda norāžu sarakstu, pārbauda burtus un atklāj vārdu. Burti tiek saglabāti katram failam. Sajauktos .puz failus nevar atvērt.\n\nŠaha uzdevumi: neliels komplekts no Lichess uzdevumu datubāzes (CC0). Pa kreisi un Pa labi lec no figūras uz figūru, izvēlies figūru, ko gribi pārvietot, tad ar Pa kreisi un Pa labi pa tās iespējamajiem laukumiem un vēlreiz izvēlies. Nepareizs gājiens tiek atsaukts. Padoms atzīmē figūru, kas jāpārvieto, Nākamais pāriet uz nākamo uzdevumu.\n\nLaukums pārzīmē tikai lodziņus, kas mainās. Statistika skaita atrisinātās mīklas."
