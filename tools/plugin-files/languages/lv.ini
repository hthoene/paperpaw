wifi.plugin.name = Wi-Fi
wifi.plugin.description = Pievienojas Wi-Fi tīkliem, kad vajag, un pēc tam izslēdz radio.
wifi.plugin.how = "Wi-Fi pievienojas tīklam, kad spraudnim vajadzīgs internets (katalogs, sinhronizācija, veikals, pārsūtīšana), un izslēdz radio atkal minūti pēc tam, kad to nekas neizmanto, vai uzreiz, kad tiek rādīts Sākums vai grāmata, lai taupītu akumulatoru un atmiņu.\n\nAtver Wi-Fi no Iestatījumi vai no Wi-Fi elementa statusa joslā. Tīkli uzskaita sasniedzamos tīklus; izvēlies vienu un ievadi tā paroli vai izvēlies Iestatīt ar tālruni un ievadi nosaukumu un paroli sava tālruņa pārlūkā, nevis ierīcē. Aizmirst noņem saglabātu tīklu.\n\nParoles paliek kartē, droši glabātas, un nekad vairs netiek rādītas. Sadaļā Savienoties, kad vajag iestati, cik ilgi Wi-Fi paliek ieslēgts pēc pēdējās izmantošanas, vai tas paliek ieslēgts uzlādes laikā un kurš saglabātais tīkls ir pirmais, ja sasniedzami vairāki."
