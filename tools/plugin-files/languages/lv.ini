tasks.plugin.name = Uzdevumi
tasks.plugin.description = Uzdevumu saraksti ar termiņiem un prioritātēm lasītājā vai sinhronizēti ar tavu CalDAV serveri, ar sākuma ekrāna logrīkiem.
tasks.plugin.how = "Uzdevumu saraksti tavā lasītājā: uzdevumi ar termiņu un prioritāti, kas tiek atķeksēti, kad ir izpildīti. Tie darbojas bez iestatīšanas un bez tīkla, un tos var uzturēt sinhronizētus ar CalDAV serveri (Nextcloud, Radicale, Baïkal, Fastmail un citiem), lai tie paši saraksti būtu tālrunī un datorā.\n\nAtver Uzdevumi no rīku izvēlnes. Pirmā rinda nosauc rādīto sarakstu; izvēlies to citam sarakstam, sadaļai Šodien un nokavētie visos sarakstos, jaunam sarakstam, sinhronizēšanai vai konta iestatīšanai. Pievienot uzdevumu atver tastatūru. Izvēlēties uz uzdevuma to atķeksē (vēlreiz: nav izpildīts). Turi uzdevumu vai nospied Izvēlne, lai mainītu tā nosaukumu, termiņu (šodien, rīt, pēc nedēļas vai ievadītu datumu, piemēram, 2026-12-24) vai prioritāti, vai lai to noņemtu. Neizpildītie uzdevumi ir pirmie, pēc dienas un tad pēc prioritātes; izpildītie paliek beigās nedēļu (iestatāms iestatījumos sadaļā Uzdevumi), tad tie pamet lasītāju.\n\nLogrīki sākuma ekrānam (turi sākuma ekrānu, tad pievieno logrīku): Uzdevumi šodien rāda, kas jāizpilda šodien vai ir nokavēts, Uzdevumu saraksts rāda vienu sarakstu, Neizpildītie uzdevumi tos saskaita, un Nākamais uzdevums rāda to, kas jādara nākamais. Pieskāriens uzdevumam logrīkā to atķeksē; pieskāriens virsrakstam atver sarakstus.\n\nLai sinhronizētu, saraksta rindā izvēlies CalDAV konts un ievadi servera adresi, savu lietotājvārdu un paroli (vislabāk lietotnes paroli). Pietiek ar servera adresi, piem., cloud.example.com/remote.php/dav; lasītājs no turienes atrod tavus uzdevumu sarakstus. Katrs servera uzdevumu saraksts kļūst par sarakstu lasītājā. Lasītājs sinhronizē, kad atver Uzdevumi, kad izvēlies Sinhronizēt tagad un kad tīkls tāpat ir ieslēgts; tas, ko maini bez tīkla, gaida un tiek nosūtīts vēlāk. Ja uzdevums šajā laikā tika mainīts gan lasītājā, gan citur, tiek paņemta servera versija, un tava tiek paturēta kā jauns uzdevums blakus, lai nekas netiktu zaudēts. Piezīmes, atgādinājumi un viss pārējais, kas uzdevumam ir serverī, paliek nemainīts. Atkārtojošies uzdevumi tiek rādīti, bet mainīti tur, kur tos izveidoji. Lasītājā ietilpst līdz 200 uzdevumiem 12 sarakstos."
