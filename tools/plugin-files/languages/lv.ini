stats.plugin.name = Lasīšanas statistika
stats.plugin.description = Ieraksta, cik ilgi un cik daudz lasi, ar kalendāru un katras grāmatas skaitļiem.
stats.plugin.how = "Lasīšanas statistika ieraksta, cik ilgi lasi katru lappusi. Tu to redzi kā pārskatu ar šodienu, nedēļu un savu sēriju, kā kalendāru un ar katras grāmatas skaitļiem.\n\nAtver to no Rīki vai no Vairāk lasītājā. Iestatījumos sadaļā Lasīšanas statistika vari izslēgt Ierakstīt lasīšanu, iestatīt Dienas mērķi un iestatīt Īsāko lappusi un Garāko lappusi, kas tiek skaitītas, lai pārlapošana vai atvērta atstāta grāmata neizkropļotu skaitļus.\n\nSinhronizēt ar KOReader kopīgo statistiku ar KOReader pa WebDAV mapi. Tā pārņem arī KOReader statistiku tajā pašā ierīcē. Ierakstīšanai jābūt iestatītam pulkstenim: ja tas nav iestatīts, vienreiz pievienojies Wi-Fi."
