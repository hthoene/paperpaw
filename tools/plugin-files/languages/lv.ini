lock.plugin.name = Ekrāna bloķēšana
lock.plugin.description = PIN, raksts vai parole, kad ierīce pamostas; pieskārieni bloķēti lasīšanas laikā.
lock.plugin.how = "Ekrāna bloķēšana prasa PIN, rakstu vai paroli, kad PaperPaw startē un kad ierīce pamostas. Sākumā tā ir izslēgta. Tā aizsargā tikai pret nejaušu lietošanu: kods un nepareizo mēģinājumu skaits tiek glabāti SD kartē, tāpēc ikviens, kas karti izņem, rediģē vai apmaina, tiek garām bloķēšanai.\n\nIestati to iestatījumos sadaļā Ierīce, Ekrāna bloķēšana: ievadi pašreizējo kodu, ja tāds ir, izvēlies veidu, tad jauno kodu divreiz. Raksts tiek piedāvāts tikai skārienekrānos.\n\nPēc pieciem nepareiziem mēģinājumiem nākamajam jāgaida pusminūte. Bloķēt tagad bloķē uzreiz, un to var piešķirt pogai, žestam vai noteikumam. Bloķēt pēc pamošanās var izslēgt, tad bloķē tikai īsts starts (ieslēgšana vai restartēšana), izņemot tur, kur katra pamošanās ir starts, kā X4 ar akumulatoru.\n\nBlakus ir pieskārienu bloķēšana: Bloķēt pieskārienus ātrajā piekļuvē un lasīšanas izvēlnē liek pieskārieniem, vilkšanai un pildspalvai neko nedarīt, bet pogas turpina darboties, piemēram, lai lasītu ar roku uz ekrāna. Lai atbloķētu, pieskaries divreiz ar vienu pirkstu un brīdi turi to; turot ieslēgšanas pogu, atveras izvēlne Barošana, kurā Atbloķēt pieskārienus to izdara ar pogām; uz X4 Pro turot sākuma taustiņu, atbloķē uzreiz."
