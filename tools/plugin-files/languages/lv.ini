power.plugin.name = Enerģija
power.plugin.description = Izvēlas enerģijas režīmu, ar roku vai pēc akumulatora: Normāls, Taupīšana, Bezsaiste.
power.plugin.how = "Enerģija izvēlas, kā PaperPaw tērē akumulatoru: Normāls, Taupīšana vai Bezsaiste. Taupīšana dara to, ko var atlikt, piemērotākos brīžos; Bezsaiste patur radio izslēgtu. Auto izvēlas pēc akumulatora.\n\nMaini režīmu ātrajā piekļuvē, kur Enerģija rāda režīmus blakus, vai iestatījumos sadaļā Enerģija. Tur iestati arī līmeņus, kad Auto pārslēdzas uz Taupīšanu un uz Bezsaisti, un vai uzlādes laikā tas paliek Normāls.\n\nStatusa joslās Enerģijas režīms rāda lapu taupīšanas laikā un pārsvītrotu Wi-Fi bezsaistē, un neko Normālā režīmā.\n\nTuri ieslēgšanas pogu, lai atvērtu nelielu izvēlni: Miega režīms, Izslēgt (kur PaperPaw to var), Restartēt un skārienierīcēs Bloķēt pieskārienus vai Atbloķēt pieskārienus. Īss nospiediens joprojām liek ierīcei iemigt. Atpakaļ pamet izvēlni."
