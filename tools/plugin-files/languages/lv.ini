file-manager.plugin.name = Failu pārvaldnieks
file-manager.plugin.description = Visas ierīces mapes un faili: atvērt, pārdēvēt, pārvietot, kopēt un dzēst.
file-manager.plugin.how = "Failu pārvaldnieks rāda katru ierīces krātuves mapi un failu, ne tikai tavas grāmatas, un ļauj tos atvērt, pārdēvēt, pārvietot, kopēt un dzēst, kā arī izveidot jaunas mapes.\n\nAtver Faili no izvēlnes Rīki. Pieskaries mapei, lai tajā ieietu; Atpakaļ pāriet uz augšējo mapi. Pieskaries failam vai turi jebkuru ierakstu (ar pogām turi Izvēlēties), lai redzētu, ko ar to var darīt. Pārvietot un Kopēt izvēlas ierakstu: ej uz mapi, kurā tam jāatrodas, un apakšā esošajā joslā izvēlies Ielīmēt šeit. Ar pogām nospied Lejup no pēdējā ieraksta, lai nonāktu joslā.\n\nFaili un mapes, kuru nosaukums sākas ar punktu, piemēram, PaperPaw paša dati, ir paslēptas. Lai tās redzētu, iestatījumos sadaļā Bibliotēka ieslēdz Paslēptie faili."
