anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Māca Anki kartītes, kurām pienācis laiks, tavā datorā un sūta atbildes atpakaļ, izmantojot AnkiConnect papildinājumu.
anki.plugin.how = "Anki ļauj lasītājā mācīties kartītes, kurām Anki tavā datorā ir pienācis laiks, un sūta tavas atbildes atpakaļ. Tas izmanto bezmaksas papildinājumu AnkiConnect (papildinājuma kods 2055492159) un nekad AnkiWeb. Sākumā tas ir izslēgts: pievieno to no spraudņu veikala.\n\nDatorā: instalē AnkiConnect programmā Anki (Rīki, Papildinājumi, Iegūt papildinājumus) un restartē Anki. Sinhronizējot, Anki jābūt atvērtam.\n\nPēc noklusējuma AnkiConnect atbild tikai datoram, kurā tas darbojas (127.0.0.1), tāpēc lasītājs tam nevar piekļūt. Atver Rīki, Papildinājumi, AnkiConnect, Konfigurācija un iestati „webBindAddress“ uz „0.0.0.0“ (klausīties mājas tīklā). Ports „webBindPort“ ir 8765, ja vien to nemaini. Ja tur iestati „apiKey“, ievadi šeit to pašu atslēgu. Pēc konfigurācijas maiņas restartē Anki un, ja tiek jautāts, atļauj Anki datora ugunsmūrī. Izmanto to tikai tīklā, kam uzticies: ikviens tajā var piekļūt AnkiConnect, tāpēc atslēga ir laba ideja.\n\nLasītājā: atver Anki sadaļā Rīki, tad sadaļā Dators ievadi datora adresi (piemēram, 192.168.1.20), portu, ja tas nav 8765, un API atslēgu, ja tādu iestatīji. Izvēlies kavu vai atstāj to tukšu, lai izmantotu visas kavas. Pēc tam, ieslēdzot Wi-Fi, izvēlies Sinhronizēt ar Anki: vispirms tiek nosūtītas gaidošās atbildes, pēc tam tiek paņemtas kartītes, kurām pienācis laiks (un tavi iestatītie jauno kartīšu skaits), ne vairāk kā 50. Izvēlies Mācīties, lai tās izietu bez tīkla: parādi atbildi un novērtē to ar Vēlreiz, Grūti, Labi vai Viegli. Tavas atbildes tiek glabātas lasītājā arī bez Wi-Fi un nonāk Anki nākamajā sinhronizācijā. Anki izlemj, kad kartīte atgriežas: kartīte, uz kuru atbildēji ar Vēlreiz, tiek paņemta atkal vēlākā sinhronizācijā, tiklīdz Anki paziņo, ka tai pienācis laiks.\n\nSinhronizēt, atverot Anki iestatījumos sinhronizē katru reizi, kad atver ekrānu. Nospiežot pogu, tīkls netiek izmantots nekad."
