picture-home.plugin.name = Attēlu sākuma ekrāns
picture-home.plugin.description = Sākuma ekrāns ar tavu attēlu aiz logrīkiem un statusa joslu, ko vari iestatīt.
picture-home.plugin.how = "Attēlu sākuma ekrāns aizstāj sākuma ekrānu, kamēr tas ir ieslēgts: tavs paša attēls aiz logrīkiem un logrīku un rīku lappuses, ko sakārto. Izslēdz to spraudņu pārvaldniekā, un iebūvētais sākuma ekrāns ir atpakaļ ar savām lappusēm.\n\nIevieto attēlus (JPEG, PNG vai GIF) kartes mapē (pēc noklusējuma wallpapers), tad izvēlies vienu sadaļā Iestatījumi, Pielāgot, Attēlu sākuma ekrāns. Pielāgošana nosaka, kā tas piepilda ekrānu (aizpildīt, viss attēls, izstiept, oriģinālizmērs, flīzēt), Pozīcija, kura daļa paliek, Tālummaiņa, cik liels, un Pagaismot attēlu, cik blāvs: blāvāks attēls logrīkus padara vieglāk lasāmus. Attēls tiek sagatavots vienreiz katram ekrāna izmēram, kas aizņem brīdi.\n\nLogrīki atrodas uz plāksnēm virs attēla. Sakārto lappusi kā iebūvētajā sākuma ekrānā: ar zīmuli zem lappuses vai Rediģēt sākuma ekrānu izvēlnē.\n\nStatusa josla (laiks, Wi-Fi, akumulators vai ko izvēlies) var būt ieslēgta, izslēgta vai automātiska, augšā vai apakšā, pilnā platumā vai maza tablete pa kreisi, vidū vai pa labi, uz gaišas, tumšas vai pelēkas plāksnes vai uz paša attēla. Rinda, kas nosauc pogas (uz X4), var būt arī ieslēgta, izslēgta vai automātiska. Automātiski nozīmē, ka pogas nospiešana parāda to uz dažām sekundēm; šī nospiešana neko citu nedara.\n\nAttēla attēlojums nosaka, kā attēls tiek zīmēts: Pelēktoņi visos pelēkajos toņos, kas ir ekrānam (lēnāk uz X4), Rastrēts melnbaltos punktos (ātri) vai Automātiski, kā iebūvētajā sākuma ekrānā: pelēktoņi, kad ekrāns tiek zīmēts, punkti pēc pirmās izmaiņas. Ja ekrānam nav pelēktoņu, pelēktoņi tiek aizstāti ar punktiem."
