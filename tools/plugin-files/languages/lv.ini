reading-goal.plugin.name = Lasīšanas mērķis
reading-goal.plugin.description = Minūtes lasīšanai dienā un kaķis sākuma ekrānā, kura garastāvoklis seko šodienas lasīšanai.
reading-goal.plugin.how = "Kaķis tavā sākuma ekrānā rāda, kā šodien sokas lasīšana: skumjš, kamēr vēl neesi lasījis, tā sev pēc mazliet, apmierināts no puses no tava dienas mērķa, laimīgs, tiklīdz esi to sasniedzis.\n\nPievieno logrīku Lasīšanas kaķis sākuma ekrānam (turi sākuma ekrānu, tad pievieno logrīku) vai izvēlies Šodienas lasīšanas kaķis kā miega ekrānu. Pieskāriens kaķim atver dienas mērķi; tas ir lasīšanas statistikas mērķis, kas skaita tavas lasīšanas minūtes.\n\nIestatījumos sadaļā Lasīšana Apmierināts no un Laimīgs no nosaka, no kādas mērķa daļas kaķis ir apmierināts vai laimīgs, un Savi attēli norāda attēlu mapi (sad, meh, content un happy), ko rādīt kaķu vietā. Attēli ir PNG vai JPEG faili; ja mapes nav, tiek rādīti kaķi."
