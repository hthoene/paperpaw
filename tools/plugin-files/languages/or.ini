about.intro = ଇ-ଇଙ୍କ ଡିଭାଇସ ପାଇଁ ପ୍ଲଗଇନରେ ଗଠିତ ଏକ ମାଗଣା ଇ-ରିଡର। Apache License 2.0 ଅଧୀନରେ ଲାଇସେନ୍ସପ୍ରାପ୍ତ; ଏଥିରେ ଥିବା ଅଂଶର ଲାଇସେନ୍ସ ନିମ୍ନରେ।
