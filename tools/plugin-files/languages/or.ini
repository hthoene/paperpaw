plugin-manager.plugin.name = ପ୍ଲଗଇନ ମ୍ୟାନେଜର
plugin-manager.plugin.description = ପ୍ଲଗଇନଗୁଡ଼ିକର ତାଲିକା ଦେଖାଏ ଓ ସେଗୁଡ଼ିକୁ ଚାଲୁ ଓ ବନ୍ଦ କରେ।
plugin-manager.plugin.how = "ପ୍ଲଗଇନ ମ୍ୟାନେଜର ପ୍ରତ୍ୟେକ ପ୍ଲଗଇନକୁ ତାହାର ସଂସ୍କରଣ ଓ ବିବରଣୀ ସହିତ ଦେଖାଏ, ଏବଂ ପ୍ଲଗଇନ ଚାଲୁ ଓ ବନ୍ଦ କରେ।\n\nଏହା ସେଟିଂସରେ “ପ୍ଲଗଇନ ପରିଚାଳନା” ଭାବେ ଅଛି। “ପ୍ଲଗଇନ ସେଟିଂସ” ପସନ୍ଦ ପାଇଁ ଏକ ଅଲଗା ପୃଷ୍ଠା, ଯେପରି ପ୍ରତ୍ୟେକ ପ୍ଲଗଇନର ନେଟୱାର୍କ ବ୍ୟବହାର। ପ୍ଲଗଇନ ଚାଲୁ ବା ବନ୍ଦ କରିବାକୁ ଏହାକୁ ଟାପ କରନ୍ତୁ (ବଟନ ସହିତ, ଏହାକୁ ବାଛନ୍ତୁ)। ପରିବର୍ତ୍ତନ ରିଷ୍ଟାର୍ଟ ପରେ ଲାଗୁ ହୁଏ: ତାପରେ ତଳର ବାର “ଏବେ ରିଷ୍ଟାର୍ଟ କରନ୍ତୁ” ଦେଖାଏ। ଏହା କିପରି କାମ କରେ ପଢ଼ିବାକୁ ପ୍ଲଗଇନକୁ ଧରି ରଖନ୍ତୁ (ବଟନ ସହିତ, “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)।\n\n“ସବୁବେଳେ ଚାଲୁ” ଚିହ୍ନିତ ପ୍ଲଗଇନ ବନ୍ଦ କରିହେବ ନାହିଁ, ଏବଂ “ଆବଶ୍ୟକ” ଚିହ୍ନିତ ପ୍ଲଗଇନ କେବଳ ଅନ୍ୟ ଏକ ପ୍ଲଗଇନ ତାହାର କାମ କଲେ ବନ୍ଦ ହୁଏ, ନହେଲେ PaperPaw ପାଇଁ ଫେରିବାର କୌଣସି ବାଟ ରହିବ ନାହିଁ। “ସ୍କ୍ରିନ”ରେ ଆପଣ ବାଛନ୍ତି, ଅନେକ ପ୍ଲଗଇନ ଦେଉଥିବା ସ୍ଥାନ କେଉଁ ପ୍ଲଗଇନ ଦେଖାଇବ।"
