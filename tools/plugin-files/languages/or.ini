puzzles.plugin.name = ପଜଲ
puzzles.plugin.description = ସୁଡୋକୁ, କ୍ରସୱାର୍ଡ ଓ ଚେସ ପଜଲ, ଅଫଲାଇନ, ଦିନର ପଜଲ ସହିତ।
puzzles.plugin.how = "ଟ୍ରେନ ଓ ଅପେକ୍ଷା ସମୟ ପାଇଁ ପଜଲ, ସବୁ ଅଫଲାଇନ: ସୁଡୋକୁ, କ୍ରସୱାର୍ଡ ଓ ଚେସ ପଜଲ। ଟୁଲ୍ସ ମେନୁରୁ “ପଜଲ” ଖୋଲନ୍ତୁ, କିମ୍ବା ହୋମ ସ୍କ୍ରିନରେ “ଦିନର ପଜଲ” ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ: ଆଜିର ସୁଡୋକୁ କେତେ ହୋଇଛି ଦେଖାଏ, ଟାପ କଲେ ଖୋଲେ। ଦିନର ସୁଡୋକୁ ସାରାଦିନ ସମାନ ରହେ।\n\nସୁଡୋକୁ: ବାମ/ଡାହାଣ କର୍ସରକୁ ଘର ଘର, ଉପର/ତଳ (ପୃଷ୍ଠା ବଟନ) ଧାଡ଼ି ଧାଡ଼ି ଘୁଞ୍ଚାଏ। “ବାଛନ୍ତୁ” ଅଙ୍କ ଖୋଲେ: ଗୋଟିଏ ବାଛି ପୁଣି ବାଛିଲେ ଲେଖାଯାଏ, “ଖାଲି” ଘରଟି ଖାଲି କରେ। ବୋର୍ଡ ତଳର ବଟନ ପାଇଁ “ବାଛନ୍ତୁ” (ବା ମେନୁ) ଧରି ରଖନ୍ତୁ: “ନୋଟ” ଅଙ୍କକୁ ପେନସିଲ ଚିହ୍ନ କରେ, “ଯାଞ୍ଚ” ଭୁଲ ଘର ଚିହ୍ନିତ କରେ, “ପୂର୍ବବତ୍” ଶେଷ ଚାଲ ଫେରାଏ, “ନୂଆ” ବଛା ସ୍ତରର (ସହଜ, ମଧ୍ୟମ, କଠିନ) ପଜଲ ଆରମ୍ଭ କରେ। ପ୍ରତ୍ୟେକ ପଜଲର ଠିକ ଗୋଟିଏ ସମାଧାନ। ଛାଡ଼ିଲେ ଖେଳ ସେଭ ରହେ। ଟଚ ସ୍କ୍ରିନରେ ଘରରେ ଟାପ କରନ୍ତୁ।\n\nକ୍ରସୱାର୍ଡ: ମେମୋରୀ କାର୍ଡର “puzzles” ଫୋଲ୍ଡରରେ .puz (Across Lite) ବା .ipuz ଫାଇଲ ରଖନ୍ତୁ; କୌଣସିଟି ସାଥିରେ ନାହିଁ। ଗ୍ରିଡରେ ଘୁଞ୍ଚି “ବାଛନ୍ତୁ” ଦବାଇ କୀବୋର୍ଡରେ କର୍ସର ତଳର ଶବ୍ଦ ଟାଇପ କରନ୍ତୁ (_ ଘର ଖାଲି ରଖେ)। ବଟନଗୁଡ଼ିକ ଆଡ଼ା/ଠିଆ ବଦଳାଏ, ସୂତ୍ର ତାଲିକା ଦେଖାଏ, ଅକ୍ଷର ଯାଞ୍ଚ କରେ ଓ ଶବ୍ଦ ଦେଖାଏ। ଅକ୍ଷର ପ୍ରତ୍ୟେକ ଫାଇଲ ପାଇଁ ସେଭ ରହେ। ସ୍କ୍ରାମ୍ବଲ୍ଡ .puz ଫାଇଲ ଖୋଲିହେବ ନାହିଁ।\n\nଚେସ ପଜଲ: Lichess ପଜଲ ଡାଟାବେସ (CC0)ର ଏକ ଛୋଟ ସେଟ। ବାମ/ଡାହାଣ ଗୋଟିରୁ ଗୋଟିକୁ ଯାଏ; ଘୁଞ୍ଚାଇବାକୁ ଥିବା ଗୋଟି ବାଛନ୍ତୁ, ତାପରେ ବାମ/ଡାହାଣରେ ଲକ୍ଷ୍ୟ ଘର ବାଛି ପୁଣି ବାଛନ୍ତୁ। ଭୁଲ ଚାଲ ଫେରାଯାଏ। “ସଙ୍କେତ” ଘୁଞ୍ଚାଇବାକୁ ଥିବା ଗୋଟି ଚିହ୍ନିତ କରେ, “ପରବର୍ତ୍ତୀ” ପରବର୍ତ୍ତୀ ପଜଲକୁ ଯାଏ।\n\n“ପରିସଂଖ୍ୟାନ” ଆପଣ ସମାଧାନ କରିଥିବା ପଜଲ ଗଣେ।"
