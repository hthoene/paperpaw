reader.sample.1 = ନଦୀକୂଳରେ ଭଉଣୀ ପାଖରେ ବସି ବସି ଓ କିଛି କରିବାକୁ ନଥିବାରୁ ଆଲିସ ବହୁତ କ୍ଳାନ୍ତ ହେବାକୁ ଲାଗିଲା: ଥରେ ଦୁଇଥର ସେ ଭଉଣୀ ପଢ଼ୁଥିବା ବହି ଭିତରକୁ ଚାହିଁଥିଲା, କିନ୍ତୁ ସେଥିରେ କୌଣସି ଛବି ବା କଥାବାର୍ତ୍ତା ନଥିଲା।
