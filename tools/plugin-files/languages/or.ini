power.plugin.name = ପାୱାର
power.plugin.description = ପାୱାର ମୋଡ ବାଛେ, ହାତରେ ବା ବ୍ୟାଟେରୀ ଅନୁସାରେ: ସାଧାରଣ, ସଞ୍ଚୟ, ଅଫଲାଇନ।
power.plugin.how = "“ପାୱାର” ବାଛେ PaperPaw ବ୍ୟାଟେରୀ କିପରି ଖର୍ଚ୍ଚ କରିବ: ସାଧାରଣ, ସଞ୍ଚୟ ବା ଅଫଲାଇନ। ସଞ୍ଚୟ ଅପେକ୍ଷା କରିପାରୁଥିବା କାମ ଉପଯୁକ୍ତ ସମୟରେ କରେ; ଅଫଲାଇନ ରେଡିଓ ବନ୍ଦ ରଖେ। ସ୍ୱୟଂ ବ୍ୟାଟେରୀ ଅନୁସାରେ ବାଛେ।\n\nକ୍ୱିକ ପ୍ୟାନେଲରେ, ଯେଉଁଠି “ପାୱାର” ମୋଡଗୁଡ଼ିକୁ ପାଖାପାଖି ଦେଖାଏ, କିମ୍ବା ସେଟିଂସର “ପାୱାର”ରେ ମୋଡ ବଦଳାନ୍ତୁ। ସେଠାରେ ସ୍ୱୟଂ କେଉଁ ସ୍ତରରେ ସଞ୍ଚୟ ଓ ଅଫଲାଇନକୁ ଯିବ, ଏବଂ ଚାର୍ଜ ହେବା ବେଳେ ସାଧାରଣ ରହିବ କି ନାହିଁ ମଧ୍ୟ ସେଟ କରନ୍ତୁ।\n\nଷ୍ଟାଟସ ଲାଇନରେ “ପାୱାର ମୋଡ” ସଞ୍ଚୟରେ ଏକ ପତ୍ର ଓ ଅଫଲାଇନରେ କଟା Wi-Fi ଦେଖାଏ, ସାଧାରଣରେ କିଛି ନୁହେଁ।\n\nଏକ ଛୋଟ ମେନୁ ପାଇଁ ପାୱାର ବଟନ ଧରି ରଖନ୍ତୁ: ସ୍ଲିପ, ବନ୍ଦ କରନ୍ତୁ (ଯେଉଁଠି PaperPaw ପାରେ), ରିଷ୍ଟାର୍ଟ, ଏବଂ ଟଚ ଡିଭାଇସରେ ଟଚ ଲକ ବା ଟଚ ଅନଲକ। ଛୋଟ ଦବାଇଲେ ଡିଭାଇସ ଆଗପରି ସ୍ଲିପକୁ ଯାଏ। “ପଛକୁ” ମେନୁ ବନ୍ଦ କରେ।"
