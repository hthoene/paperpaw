mail.plugin.name = ମେଲ
mail.plugin.description = ପାସୱାର୍ଡ ବା ଆପ ପାସୱାର୍ଡ ଦ୍ୱାରା ଇମେଲ ପଢ଼େ ଓ ପଠାଏ (IMAP ଓ SMTP), ବ୍ରାଉଜର ଲଗଇନ ବିନା।
mail.plugin.how = "ମେଲ IMAP ଓ SMTP ଦ୍ୱାରା ଇମେଲ ପଢ଼େ ଓ ପଠାଏ। ଏହା ଆପଣଙ୍କ ଠିକଣା ଓ ପାସୱାର୍ଡରେ ସାଇନ ଇନ କରେ, ବ୍ରାଉଜର ଲଗଇନ ବିନା, ତେଣୁ ଏହା ଅନୁମତି ଦେଉଥିବା ଯେକୌଣସି ପ୍ରୋଭାଇଡର ସହିତ କାମ କରେ।\n\nସେଟିଂସ, “ମେଲ” ତଳେ ଆକାଉଣ୍ଟ ସେଟ କରନ୍ତୁ: ପ୍ରୋଭାଇଡର ବାଛନ୍ତୁ, ଠିକଣା ଓ ପାସୱାର୍ଡ ଦିଅନ୍ତୁ। ଅଧିକାଂଶ ପ୍ରୋଭାଇଡର ଆପ ପାସୱାର୍ଡ ଚାହାନ୍ତି: ଆକାଉଣ୍ଟର ସୁରକ୍ଷା ସେଟିଂସରେ ତାହା ତିଆରି କରନ୍ତୁ। ପାସୱାର୍ଡ କେବଳ ପ୍ରୋଭାଇଡରର ସର୍ଭରକୁ ଯାଏ ଏବଂ ପାସୱାର୍ଡ ଓ କି ସହିତ ରହେ।\n\nଟୁଲ୍ସରେ ମେଲ ଖୋଲନ୍ତୁ। “ମେଲ ଯାଞ୍ଚ କରନ୍ତୁ” ନୂଆ ମେଲ ଓ ଫୋଲ୍ଡର ଆଣେ। ମେଲ କାର୍ଡରେ ରହେ, ତେଣୁ ନେଟୱାର୍କ ବିନା ପଢ଼ିହେବ; Wi-Fi କେବଳ କିଛି କ୍ଷଣ ପାଇଁ ଚାଲୁ ରହେ।\n\nପ୍ରୋଭାଇଡର ତାଲିକାରେ ନଥିଲେ “ନିଜ ସର୍ଭର” ବାଛି ଉନ୍ନତ ସେଟିଂସରେ ସର୍ଭର, ପୋର୍ଟ ଓ ସୁରକ୍ଷା ସେଟ କରନ୍ତୁ। ଅଜଣା ସର୍ଟିଫିକେଟ ଥିବା ସର୍ଭରକୁ ବିଶ୍ୱାସ କରିବେ କି ନାହିଁ ଥରେ ପଚରାଯାଏ; ଫିଙ୍ଗରପ୍ରିଣ୍ଟକୁ ପ୍ରୋଭାଇଡର ଦେଖାଉଥିବା ସହିତ ମିଳାନ୍ତୁ।\n\nବହି ସଂଲଗ୍ନ ଥିବା ମେଲ (EPUB, PDF ଇତ୍ୟାଦି, 2 MB ପର୍ଯ୍ୟନ୍ତ) ତଳେ “ବହି ଖୋଲନ୍ତୁ” ଥାଏ: ଏହା ଫାଇଲଟି ଆଣି ଲାଇବ୍ରେରୀରେ ରଖେ ଓ ଖୋଲେ।\n\nମେଲ ନଖୋଲି ନୂଆ ମେଲ ଦେଖିବାକୁ ସେଟିଂସ, “ମେଲ” ତଳେ “ପୃଷ୍ଠଭୂମିରେ ନୂଆ ମେଲ ଯାଞ୍ଚ କରନ୍ତୁ” ଚାଲୁ କରନ୍ତୁ ଏବଂ ସମୟ (15, 30 ବା 60 ମିନିଟ) ବାଛନ୍ତୁ। ଡିଭାଇସ ଜାଗ୍ରତ ଓ ଅନଲାଇନ ଥିବା ବେଳେ ଏହା ସୁରକ୍ଷିତ ସଂଯୋଗରେ ଯାଞ୍ଚ କରେ ଓ ହୋମରେ ଅପଠିତ ସଂଖ୍ୟା ଅପଡେଟ କରେ; ଏଥିରେ କିଛି ବ୍ୟାଟେରୀ ଲାଗେ।\n\nହୋମ ସ୍କ୍ରିନ ୱିଜେଟ ଅପଠିତ ସଂଖ୍ୟା, ସର୍ବଶେଷ ଓ ତାରକାଯୁକ୍ତ ମେଲ, ଏକ ମେଲବକ୍ସ ଏବଂ ମେଲ ଲେଖିବାର ସର୍ଟକଟ ଦେଖାଏ।"
