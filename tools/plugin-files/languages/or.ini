widgets.plugin.name = ୱିଜେଟ ପ୍ୟାକ
widgets.plugin.description = ହୋମ ସ୍କ୍ରିନ ପାଇଁ ଆହୁରି ଅନେକ ୱିଜେଟ: ଘଡ଼ି, କ୍ୟାଲେଣ୍ଡର, ଉଦ୍ଧୃତି, ବହି, ନୋଟ ଓ ଅଧିକ।
widgets.plugin.how = "ୱିଜେଟ ପ୍ୟାକ ହୋମ ସ୍କ୍ରିନ ପାଇଁ ଅନେକ ୱିଜେଟ ଯୋଡ଼େ: ଘଡ଼ି (ଆନାଲଗ, ଶବ୍ଦ, ଟାଇଲ, ବିଶ୍ୱ), କ୍ୟାଲେଣ୍ଡର, ବର୍ଷର ଅଗ୍ରଗତି, କାଉଣ୍ଟଡାଉନ, ଚନ୍ଦ୍ରର କଳା, ଦିନ ଓ ତାରିଖ; ଆଜିର ଉଦ୍ଧୃତି, ନୋଟ, କରିବାକୁ ଥିବା କାମ, ଛବି, ଅଭିବାଦନ ଓ PaperPaw ଲୋଗୋ; ଏବଂ ବହି ପାଇଁ: ଏବେ ପଢ଼ୁଛନ୍ତି, ପ୍ରଗତି, ପରବର୍ତ୍ତୀ, ସିରିଜ, ପସନ୍ଦର, ଏକ ହାଇଲାଇଟ ଓ ସଂଖ୍ୟାରେ ଲାଇବ୍ରେରୀ। ଏକ ବ୍ୟାଟେରୀ ୱିଜେଟ ମଧ୍ୟ ଅଛି।\n\nମେନୁରେ ହୋମ ସ୍କ୍ରିନ ସମ୍ପାଦନ କରନ୍ତୁ (କିମ୍ବା ହୋମ ସ୍କ୍ରିନରେ ଲମ୍ବା ଦବାନ୍ତୁ), ତାପରେ ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ। ପ୍ରତ୍ୟେକର ନିଜସ୍ୱ ସେଟିଂସ ଅଛି, ଯେପରି ଫ୍ରେମ, ଆକାର ଓ ସଜ୍ଜା। ବଦଳୁଥିବା ୱିଜେଟ, ଯେପରି ଆଜିର ଉଦ୍ଧୃତି, ବାଛିଲେ ପରବର୍ତ୍ତୀଟି ଦେଖାଏ। ଆପଣଙ୍କ ନିଜ ଉଦ୍ଧୃତି କାର୍ଡର .paperpaw/plugins/widgetsରେ quotes.txtକୁ ଯାଏ, ପ୍ରତି ଧାଡ଼ି ଟେକ୍ସଟ | ଲେଖକ ଭାବେ। ସମୟ ୱିଜେଟ ପାଇଁ ଘଡ଼ି ସେଟ ହୋଇଥିବା ଦରକାର; Wi-Fi ଏହାକୁ ସେଟ କରେ।"
