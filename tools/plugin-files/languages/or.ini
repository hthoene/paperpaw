format-docx.plugin.name = DOCX ଡକ୍ୟୁମେଣ୍ଟ
format-docx.plugin.description = Word ଓ ଅନ୍ୟ ପ୍ରୋଗ୍ରାମରେ ସେଭ ହୋଇଥିବା .docx ଫାଇଲ ଖୋଲେ।
format-docx.plugin.how = ".docx ଡକ୍ୟୁମେଣ୍ଟକୁ ବହି ଭାବେ ଖୋଲେ: ସୂଚୀପତ୍ର ସହ ହେଡିଂ, ତାଲିକା, ଟେବୁଲ, ବୋଲ୍ଡ ଓ ଇଟାଲିକ, ଲିଙ୍କ ଓ ଛବି (JPEG, PNG, GIF)।\n\nଫାଇଲଗୁଡ଼ିକୁ ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ ରଖି ଲାଇବ୍ରେରୀରୁ ଖୋଲନ୍ତୁ। ଶୀର୍ଷକ ଓ ଲେଖକ ଡକ୍ୟୁମେଣ୍ଟର ପ୍ରପର୍ଟିରୁ ଆସେ। ଫୁଟନୋଟ, ହେଡର ଓ ଫୁଟର, ଏବଂ ମନ୍ତବ୍ୟ ଦେଖାଯାଏ ନାହିଁ।"
format-docx.title = DOCX ଡକ୍ୟୁମେଣ୍ଟ
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB ବହିକୁ ସେଗୁଡ଼ିକର ଷ୍ଟାଇଲ, ସୂଚୀପତ୍ର ଓ ଛବି ସହ ଖୋଲେ।
format-epub.plugin.how = "EPUB ବହି ଅନ୍ୟ ବହି ପରି ଲାଇବ୍ରେରୀରୁ ଖୋଲେ, ସେଗୁଡ଼ିକର ସୂଚୀପତ୍ର, ଛବି ଓ ପ୍ରକାଶକଙ୍କ ଫର୍ମାଟିଂ ସହ। ୱେବ ପୃଷ୍ଠା (HTML), Markdown, FictionBook (.fb2) ଓ କମିକ ବହି ଆର୍କାଇଭ (.cbz) ସେହିପରି ଖୋଲେ, ପ୍ରତ୍ୟେକ ନିଜସ୍ୱ ପ୍ଲଗଇନ ଭାବେ।\n\nପ୍ରଥମ ଥର ଖୋଲିଲେ ଏକ ଅଧ୍ୟାୟ ରୂପାନ୍ତରିତ ହୋଇ ପ୍ଲଗଇନର କ୍ୟାଶରେ ରଖାଯାଏ, ତେଣୁ ପରେ ଶୀଘ୍ର ଖୋଲେ ଏବଂ ବଡ଼ ବହି ଛୋଟ ଡିଭାଇସରେ ମଧ୍ୟ ଚଳେ। ସୂଚୀପତ୍ର ପଢ଼ିବା ମେନୁର “ସୂଚୀପତ୍ର”ରେ ମିଳେ। ବହିର ନିଜ ଫର୍ମାଟିଂ ଲାଗୁ ହେବ କି ନାହିଁ, ତାହା ସେଟିଂସ › ପଢ଼ିବାରେ “ପ୍ରକାଶକଙ୍କ ଫର୍ମାଟିଂ” ସେଟିଂ।"
format-epub.title = EPUB ଇ-ବୁକ
format-fb2.plugin.name = FictionBook
