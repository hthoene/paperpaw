anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = ଆପଣଙ୍କ କମ୍ପ୍ୟୁଟରର Anki ରୁ ବାକି କାର୍ଡ ଅଧ୍ୟୟନ କରେ ଓ AnkiConnect ଆଡ-ଅନ ଦ୍ୱାରା ଉତ୍ତର ଫେରାଇ ପଠାଏ।
anki.plugin.how = "Anki ଦ୍ୱାରା ଆପଣ କମ୍ପ୍ୟୁଟରର Anki ରେ ବାକି ଥିବା କାର୍ଡ ଏହି ଡିଭାଇସରେ ଅଧ୍ୟୟନ କରିପାରିବେ, ଓ ଉତ୍ତର ଫେରାଇ ପଠାଯାଏ। ଏହା ମାଗଣା ଆଡ-ଅନ AnkiConnect (କୋଡ 2055492159) ବ୍ୟବହାର କରେ, AnkiWeb କେବେ ନୁହେଁ। ପ୍ରଥମେ ବନ୍ଦ: ପ୍ଲଗଇନ ଷ୍ଟୋରରୁ ଯୋଡ଼ନ୍ତୁ।\n\nକମ୍ପ୍ୟୁଟରରେ: Anki ରେ AnkiConnect ଇନଷ୍ଟଲ କରନ୍ତୁ (Tools, Add-ons, Get Add-ons) ଓ Anki ରିଷ୍ଟାର୍ଟ କରନ୍ତୁ। ସିଙ୍କ ବେଳେ Anki ଖୋଲା ରହିବା ଦରକାର। Tools, Add-ons, AnkiConnect, Config ଖୋଲି “webBindAddress” କୁ “0.0.0.0” କରନ୍ତୁ (ହୋମ ନେଟୱାର୍କରେ ଶୁଣିବ); ନଚେତ ଏହା କେବଳ ନିଜ କମ୍ପ୍ୟୁଟର (127.0.0.1) କୁ ଉତ୍ତର ଦିଏ। ପୋର୍ଟ “webBindPort” ସାଧାରଣତଃ 8765। ସେଠାରେ “apiKey” ସେଟ କଲେ, ଏଠାରେ ସେହି କି ଦିଅନ୍ତୁ। ତାପରେ Anki ରିଷ୍ଟାର୍ଟ କରନ୍ତୁ ଓ ଫାୟାରୱାଲ ପଚାରିଲେ ଅନୁମତି ଦିଅନ୍ତୁ। କେବଳ ଭରସାଯୋଗ୍ୟ ନେଟୱାର୍କରେ ବ୍ୟବହାର କରନ୍ତୁ: ସେଥିରେ ଥିବା ଯେକେହି AnkiConnect ପାଇପାରେ, ତେଣୁ ଏକ କି ଭଲ।\n\nଡିଭାଇସରେ: ଟୁଲ୍ସରୁ Anki ଖୋଲନ୍ତୁ, କମ୍ପ୍ୟୁଟରରେ ଠିକଣା (ଯେପରି 192.168.1.20), ପୋର୍ଟ 8765 ନହେଲେ ପୋର୍ଟ, ଓ API କି ଦିଅନ୍ତୁ। ଏକ ଡେକ ବାଛନ୍ତୁ, ବା ସବୁ ଡେକ ପାଇଁ ଖାଲି ରଖନ୍ତୁ। Wi-Fi ଚାଲୁ ରଖି Anki ସହ ସିଙ୍କ ବାଛନ୍ତୁ: ପ୍ରଥମେ ଅପେକ୍ଷାରତ ଉତ୍ତର ପଠାଯାଏ, ତାପରେ ବାକି କାର୍ଡ (ଓ ସେଟ କରିଥିବା ସଂଖ୍ୟାର ନୂଆ କାର୍ଡ) ଆଣାଯାଏ, ସର୍ବାଧିକ 50। ଅଧ୍ୟୟନ ବାଛି ନେଟୱାର୍କ ବିନା ସେଗୁଡ଼ିକ ଦେଖନ୍ତୁ: ଉତ୍ତର ଦେଖାନ୍ତୁ ଓ ପୁଣି, କଠିନ, ଭଲ ବା ସହଜ ଦିଅନ୍ତୁ। ଉତ୍ତର Wi-Fi ବିନା ମଧ୍ୟ ଡିଭାଇସରେ ରହେ ଓ ପରବର୍ତ୍ତୀ ସିଙ୍କରେ Anki କୁ ଯାଏ। କାର୍ଡ କେବେ ଫେରିବ ତାହା Anki ସ୍ଥିର କରେ।\n\nସେଟିଂସରେ “Anki ଖୋଲିଲେ ସିଙ୍କ” ପ୍ରତ୍ୟେକ ଥର ସ୍କ୍ରିନ ଖୋଲିଲେ ସିଙ୍କ କରେ। ବଟନ ଦବାଇଲେ କିଛି ନେଟୱାର୍କ ବ୍ୟବହାର କରେ ନାହିଁ।"
