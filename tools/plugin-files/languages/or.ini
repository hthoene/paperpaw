profiles.plugin.name = ପଢ଼ିବା ପ୍ରୋଫାଇଲ
profiles.plugin.description = ପଢ଼ିବା ଓ ଡିସପ୍ଲେ ସେଟିଂସର ନାମଯୁକ୍ତ ସେଟ, ଏକ ଟାପରେ ବଦଳାଯାଏ।
profiles.plugin.how = "ଏକ ପ୍ରୋଫାଇଲ ଆପଣଙ୍କ ପଢ଼ିବା ସେଟିଂସ, ଡିସପ୍ଲେ ସେଟିଂସ ଓ ଷ୍ଟାଟସ ଲାଇନକୁ “ରାତି” ବା “ବଡ଼ ଅକ୍ଷର” ପରି ଏକ ନାମରେ ରଖେ, ଏବଂ ଏକ ଟାପରେ ସେଗୁଡ଼ିକୁ ଫେରାଏ।\n\nପଢ଼ିବା ମେନୁର “ଅଧିକ”ରେ, କିମ୍ବା ସେଟିଂସର “କଷ୍ଟମାଇଜ”ରେ “ପ୍ରୋଫାଇଲ” ଖୋଲନ୍ତୁ। ବ୍ୟବହାର କରିବାକୁ ପ୍ରୋଫାଇଲରେ ଟାପ କରନ୍ତୁ; ବ୍ୟବହାରରେ ଥିବାଟି ଚିହ୍ନିତ ଥାଏ। ବର୍ତ୍ତମାନର ସେଟିଂସ ଏଥିରେ ସେଭ କରିବାକୁ, ନାମ ବଦଳାଇବାକୁ ବା ବାହାର କରିବାକୁ ଏହାକୁ ଧରି ରଖନ୍ତୁ (ବଟନ ସହିତ, “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)। “ନୂଆ ପ୍ରୋଫାଇଲ ଭାବେ ସେଭ କରନ୍ତୁ” ଏବେ ଯାହା ସେଟ ଅଛି ତାହା ରଖେ।\n\n“ପରବର୍ତ୍ତୀ ପ୍ରୋଫାଇଲ” ତାଲିକାର ପରବର୍ତ୍ତୀଟିକୁ ବଦଳାଏ; ଏହାକୁ ଏକ ବଟନ ବା ନିୟମରେ ଲଗାନ୍ତୁ।"
