vocabulary.plugin.name = ଶବ୍ଦଭଣ୍ଡାର
vocabulary.plugin.description = ଆପଣ ଅର୍ଥ ଖୋଜୁଥିବା ଶବ୍ଦକୁ ବାକ୍ୟ ସହ ରଖେ, ଏବଂ ଫୋନରେ ତିଆରି ଫ୍ଲାସ କାର୍ଡ ବ୍ୟବଧାନ ସହ ପୁନରାବୃତ୍ତିରେ ରିଭ୍ୟୁ କରାଏ।
vocabulary.plugin.how = "ପଢ଼ିବା ସମୟରେ ଆପଣ ଅର୍ଥ ଖୋଜୁଥିବା ଶବ୍ଦକୁ ଶବ୍ଦଭଣ୍ଡାର ତାହାର ବାକ୍ୟ ସହ ରଖେ। ଟୁଲ୍ସରେ ତାଲିକା ଅଛି, ନୂଆଟି ପ୍ରଥମେ; ଶବ୍ଦ ବାଛିଲେ ପୁଣି ଅର୍ଥ ଦେଖାଏ। ଶେଷ ଧାଡ଼ି ଏକ୍ସପୋର୍ଟ ସେଗୁଡ଼ିକୁ Anki ପରି ଆପ ପାଇଁ ସେଭ କରେ। ସର୍ବାଧିକ 2,000 ଶବ୍ଦ ରହେ, ତାପରେ ପୁରୁଣାଗୁଡ଼ିକ ଚାଲିଯାଏ।\n\nଟୁଲ୍ସରେ ଥିବା ଫ୍ଲାସ କାର୍ଡ ବ୍ୟବଧାନ ସହ ପୁନରାବୃତ୍ତିରେ ପଚାରେ: ଉତ୍ତର ଦେଖାନ୍ତୁ ପରେ ପୁଣି, କଠିନ, ଭଲ ବା ସହଜ ବାଛନ୍ତୁ; ତାହା ସ୍ଥିର କରେ କାର୍ଡ କେବେ ଫେରିବ। ଫୋନରେ ସମ୍ପାଦନ କରନ୍ତୁରେ ଡେକ ତିଆରି କରନ୍ତୁ: ସମାନ Wi-Fiରେ ଥିବା ଫୋନରେ କୋଡ ସ୍କାନ କରି କାର୍ଡ ଟାଇପ କରନ୍ତୁ, କିମ୍ବା ଏକାଥରେ ଅନେକ କାର୍ଡରେ CSV, TSV ବା TXT ଫାଇଲ (ପ୍ରତି ଧାଡ଼ିରେ ଗୋଟିଏ କାର୍ଡ: ସାମ୍ନା, ପଛ, ଉଦାହରଣ; UTF-8), ତାଲିକା ବା Anki ଡେକ (.apkg) ଯୋଡ଼ନ୍ତୁ।\n\nକିମ୍ବା SD କାର୍ଡର Flashcards ଫୋଲ୍ଡରରେ ପ୍ରତି ଡେକ ପାଇଁ ଗୋଟିଏ ଫାଇଲ ରଖନ୍ତୁ (Spanish.tsv ଡେକ Spanish ତିଆରି କରେ) ଓ ଫ୍ଲାସ କାର୍ଡରେ SD କାର୍ଡରେ ଥିବା କାର୍ଡ ବାଛନ୍ତୁ। ନୂଆ ବା ବଦଳିଥିବା ଫାଇଲ ତାହାର ଡେକରେ ମିଶେ, ଶିଖିଥିବା ରହେ; କାର୍ଡ ସାମ୍ନା ଟେକ୍ସଟରେ ଚିହ୍ନଟ ହୁଏ। ଫାଇଲରୁ ଡିଲିଟ ଧାଡ଼ି କାର୍ଡ ଡିଲିଟ କରେ ନାହିଁ, ଯଦି ସେହି ଡେକରେ “ଫାଇଲରେ ନଥିବା କାର୍ଡ” ବାହାର କରନ୍ତୁ ନୁହେଁ। କାର୍ଡରେ ସେଭ କରନ୍ତୁ ଡେକକୁ ଫାଇଲରେ ଲେଖେ (id, ସାମ୍ନା, ପଛ, ଉଦାହରଣ); ପୁରୁଣା ଫାଇଲ _name.bak.tsvରେ କପି ହୁଏ। 4 MiB ବା 20,000 ଧାଡ଼ିରୁ ବଡ଼ ଫାଇଲ ପଢ଼ାଯାଏ ନାହିଁ। ଫୋଲ୍ଡରରେ ଏକ ନିର୍ଦ୍ଦେଶିକା ଅଛି।\n\nସେଟିଂସ › ପଢ଼ିବାରେ, ଖୋଜାଯାଇଥିବା ଶବ୍ଦରୁ କାର୍ଡ ପ୍ରତ୍ୟେକ ଖୋଜାଯାଇଥିବା ଶବ୍ଦକୁ “ଖୋଜାଯାଇଥିବା” ଡେକରେ ରଖେ।"
