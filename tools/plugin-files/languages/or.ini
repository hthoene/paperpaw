format-fb2.plugin.how = "FictionBook ବହି (.fb2) ଖୋଲେ, ଯାହା Russian ଓ ଅନ୍ୟ ବହି ପାଇଁ ସାଧାରଣ, zip ହୋଇଥିଲେ ମଧ୍ୟ (.fb2.zip), ସେଗୁଡ଼ିକର ଶୀର୍ଷକ, ଲେଖକ, କଭର ଓ ଅଧ୍ୟାୟ ସହ।\n\nସେଗୁଡ଼ିକୁ ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ ରଖନ୍ତୁ; ସେଗୁଡ଼ିକ ଲାଇବ୍ରେରୀରେ ଦେଖାଯାଏ ଓ ଅନ୍ୟ ବହି ପରି ଖୋଲେ।"
