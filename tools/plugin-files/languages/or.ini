wallabag.bad-login = Wallabag ଲଗଇନ ଗ୍ରହଣ କଲା ନାହିଁ। ୟୁଜର ନାମ, ପାସୱାର୍ଡ ଓ API କ୍ଲାଏଣ୍ଟ ଯାଞ୍ଚ କରନ୍ତୁ।
