core.config-unreadable = {file} ପଢ଼ିହେଲା ନାହିଁ, ତେଣୁ ସେଟିଂସର ପରିବର୍ତ୍ତନ ସେଭ ହେଉନାହିଁ। କମ୍ପ୍ୟୁଟରରେ ଫାଇଲଟି ଠିକ କରନ୍ତୁ ବା ବାହାର କରନ୍ତୁ।
core.secrets-unreadable = {file} ପଢ଼ିହେଲା ନାହିଁ, ତେଣୁ ପାସୱାର୍ଡ ଓ କି ସେଭ ହେଉନାହିଁ। କମ୍ପ୍ୟୁଟରରେ ଫାଇଲଟି ଠିକ କରନ୍ତୁ ବା ବାହାର କରନ୍ତୁ।
core.secrets-unopened = ଏହି କାର୍ଡରେ ସେଭ ଥିବା କିଛି ପାସୱାର୍ଡ ଓ କି ଏଠାରେ ଖୋଲିହେବ ନାହିଁ: ସେଗୁଡ଼ିକ ଅନ୍ୟ ଏକ ଡିଭାଇସରେ ସେଭ ହୋଇଥିଲା, କିମ୍ବା ଏହି ଡିଭାଇସର କି ହଜିଯାଇଛି। ଯେଉଁଠି ପ୍ଲଗଇନ ମାଗେ, ସେଠାରେ ସେଗୁଡ଼ିକ ପୁଣି ଦିଅନ୍ତୁ।
core.secrets-unsupported = ଏହି ଡିଭାଇସ ଏବେ ପର୍ଯ୍ୟନ୍ତ ପାସୱାର୍ଡ ସେଭ କରିପାରିବ ନାହିଁ। paperpaw.orgରେ ଥିବା ୱେବ ଫ୍ଲାସର ଦ୍ୱାରା PaperPaw ଥରେ ପୁଣି ଇନଷ୍ଟଲ କରନ୍ତୁ, ତାପରେ ଏହା କାମ କରିବ।
core.card.missing = କୌଣସି ମେମୋରୀ କାର୍ଡ ମିଳିଲା ନାହିଁ, ତେଣୁ କିଛି ସେଭ ହେଉନାହିଁ। ଏକ FAT32 କାର୍ଡ ଲଗାଇ ରିଷ୍ଟାର୍ଟ କରନ୍ତୁ।
core.card.unreadable = ମେମୋରୀ କାର୍ଡ ପଢ଼ିହେଉନାହିଁ, ତେଣୁ କିଛି ସେଭ ହେଉନାହିଁ। ଅନ୍ୟ ଏକ କାର୍ଡ ଚେଷ୍ଟା କରନ୍ତୁ।
core.card.exfat-experimental = ଏହି ମେମୋରୀ କାର୍ଡ exFAT ଅଟେ। exFAT ସମର୍ଥନ ପରୀକ୍ଷାମୂଳକ; FAT32 ସବୁଠାରୁ ସୁରକ୍ଷିତ।
core.card.no-fat = ମେମୋରୀ କାର୍ଡଟି FAT32 ନୁହେଁ, ତେଣୁ କିଛି ସେଭ ହେଉନାହିଁ। କମ୍ପ୍ୟୁଟରରେ ଏହାକୁ FAT32 ଭାବେ ଫର୍ମାଟ କରନ୍ତୁ।
