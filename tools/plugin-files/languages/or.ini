read-later-cloud.from.help = Readwise Readerର କେଉଁଠାରୁ ଲେଖା ନିଆଯିବ: ଆପଣ Later ପାଇଁ ସେଭ କରିଥିବା, କିମ୍ବା ଆପଣଙ୍କ Inboxରେ ଥିବା।
read-later-cloud.help = ଆପଣଙ୍କ ଆକ୍ସେସ ଟୋକେନ ଦିଅନ୍ତୁ (readwise.io/access_token)। ଲେଖା “Reader” ଫୋଲ୍ଡରରେ ଛବି ବିନା ବହି ଭାବେ ଆସେ; ଶେଷ ପର୍ଯ୍ୟନ୍ତ ପଢ଼ାଯାଇଥିବା ଲେଖା ପରବର୍ତ୍ତୀ ଥର ଆଣିବା ବେଳେ ଆର୍କାଇଭ ହୁଏ।
