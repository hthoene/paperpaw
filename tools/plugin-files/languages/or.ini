opds.plugin.description = OPDS କ୍ୟାଟାଲଗ ବ୍ରାଉଜ କରେ, ସେଗୁଡ଼ିକର ବହି ଡାଉନଲୋଡ କରେ ଓ ଫୋଲ୍ଡରକୁ ସେଗୁଡ଼ିକ ସହିତ ସିଙ୍କ ରଖେ।
opds.plugin.how = "OPDS କ୍ୟାଟାଲଗ ହେଉଛି Project Gutenberg, Calibre-Web, Kavita ବା Komga ପରି ଅନଲାଇନ ଲାଇବ୍ରେରୀ। ଏହି ପ୍ଲଗଇନ ସେଗୁଡ଼ିକୁ ଫୋଲ୍ଡର ପରି ବ୍ରାଉଜ ଓ ସନ୍ଧାନ କରେ ଏବଂ ସେଗୁଡ଼ିକର ବହି ଲାଇବ୍ରେରୀକୁ ଡାଉନଲୋଡ କରେ।\n\nଟୁଲ୍ସ ମେନୁରୁ “କ୍ୟାଟାଲଗ” ଖୋଲି “କ୍ୟାଟାଲଗ ଯୋଡ଼ନ୍ତୁ” ବାଛନ୍ତୁ: ଏକ ଠିକଣା ଏବଂ, କ୍ୟାଟାଲଗ ଆକାଉଣ୍ଟ ମାଗିଲେ, ୟୁଜର ନାମ ଓ ପାସୱାର୍ଡ। ବ୍ରାଉଜ କରିବାକୁ କ୍ୟାଟାଲଗରେ ଟାପ କରନ୍ତୁ; ସିଙ୍କ, ଏଡିଟ ବା ବାହାର କରିବାକୁ ଏହାକୁ ଧରି ରଖନ୍ତୁ (ବଟନ ସହିତ, “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)।\n\n“ଏହି କ୍ୟାଟାଲଗ ସିଙ୍କ କରନ୍ତୁ” ଚାଲୁ ଥିଲେ, “କ୍ୟାଟାଲଗ ସିଙ୍କ କରନ୍ତୁ” ଏହାର ନୂଆ ବହି ଏହାର ଫୋଲ୍ଡରକୁ ଡାଉନଲୋଡ କରେ। “ସିଙ୍କ ପିଛା ବହି” ଗୋଟିଏ ସିଙ୍କରେ କେତୋଟି ବହି ଆସିବ ତାହା ସୀମିତ କରେ, ଯାହାଫଳରେ ବଡ଼ କ୍ୟାଟାଲଗ ଡିଭାଇସ ଭର୍ତ୍ତି କରେ ନାହିଁ। କ୍ୟାଟାଲଗ ବଦଳରେ ଏକ କ୍ଲାଉଡ ଫୋଲ୍ଡର (WebDAV) ମଧ୍ୟ କାମ କରେ।"
