format-txt.plugin.name = ସାଧା ଟେକ୍ସଟ
format-txt.plugin.description = ସାଧା ଟେକ୍ସଟ ଫାଇଲ (.txt) ଖୋଲେ।
format-txt.plugin.how = "ସାଧା ଟେକ୍ସଟ ଫାଇଲ (.txt) ଅନ୍ୟ ବହି ପରି ଲାଇବ୍ରେରୀରୁ ଖୋଲେ, କିଛି ସେଟଅପ ଦରକାର ନାହିଁ। ପ୍ଲଗଇନଟି UTF-8, UTF-16 ଓ Windows-1252 ଟେକ୍ସଟ ପଢ଼େ ଏବଂ ଏନକୋଡିଂ ନିଜେ ଚିହ୍ନେ।\n\nଅନୁଚ୍ଛେଦ ଫାଇଲର ଖାଲି ଧାଡ଼ି ଅନୁସାରେ ହୁଏ; ଫାଇଲରେ ଖାଲି ଧାଡ଼ି ନଥିଲେ ପ୍ରତ୍ୟେକ ଧାଡ଼ି ଏକ ଅନୁଚ୍ଛେଦ। Project Gutenberg ଫାଇଲରେ ଆରମ୍ଭ ଓ ଶେଷର ଲାଇସେନ୍ସ ଟେକ୍ସଟ ବାଦ ଦିଆଯାଏ, ଏବଂ ଶୀର୍ଷକ ଓ ଲେଖକ ହେଡରରୁ ନିଆଯାଏ।\n\nଫାଇଲଟି କେବେ ପୂରା ଲୋଡ ହୁଏ ନାହିଁ, ତେଣୁ ଛୋଟ ଡିଭାଇସରେ ମଧ୍ୟ ବହୁତ ବଡ଼ ଟେକ୍ସଟ ଖୋଲେ।"
format-txt.title = ସାଧା ଟେକ୍ସଟ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC ଓ XTCH ବହି ଖୋଲେ: Xteink ଡିଭାଇସ ପାଇଁ ପୂର୍ବରୁ ତିଆରି ପୃଷ୍ଠା।
format-xtc.plugin.how = "XTC ଓ XTCH ଫାଇଲ ଏପରି ବହି ଯାହାର ପୃଷ୍ଠା ପୂର୍ବରୁ ଛବି ଭାବେ ତିଆରି, ଯେପରି Xteink ଡିଭାଇସ ପାଇଁ କନଭର୍ଟର ତିଆରି କରେ। ଏଗୁଡ଼ିକ ଅନ୍ୟ ବହି ପରି ଲାଇବ୍ରେରୀରୁ ଖୋଲେ।\n\nପ୍ରତ୍ୟେକ ପୃଷ୍ଠା ଏକ ସ୍ଥିର ଛବି ହୋଇଥିବାରୁ ଟେକ୍ସଟର ଆକାର ବା ଫଣ୍ଟ ବଦଳାଯାଇପାରିବ ନାହିଁ। ପୃଷ୍ଠା କଳା-ଧଳା କିମ୍ବା ଚାରି ସ୍ତରର ଧୂସର। ପ୍ରତ୍ୟେକ ପୃଷ୍ଠା ଦେଖାଇବା ବେଳେ ଡିକୋଡ ହୁଏ, ତେଣୁ X4ରେ ମଧ୍ୟ କମ ମେମୋରୀ ଲାଗେ।\n\nଫାଇଲରେ ଥିଲେ ଶୀର୍ଷକ, ଲେଖକ ଓ ଅଧ୍ୟାୟ ସେଥିରୁ ନିଆଯାଏ।"
format-xtc.title = XTC ପୃଷ୍ଠା
help.plugin.name = ସୂଚନା
help.plugin.description = ଏକ ସ୍କ୍ରିନ ପ୍ରଥମ ଥର ଖୋଲିଲେ ତାହାର ନିୟନ୍ତ୍ରଣ କଣ କରେ ଦେଖାଏ।
help.plugin.how = "ଏକ ସ୍କ୍ରିନ ପ୍ରଥମ ଥର ଖୋଲିଲେ, ତାହା ଉପରେ ଏକ ଛୋଟ ନୋଟ କହେ ତାହାର ନିୟନ୍ତ୍ରଣ କଣ କରେ: ଟାପ କଲେ ସ୍କ୍ରିନର କେଉଁ ଅଂଶ କଣ କରେ (ଫ୍ରେମରେ ଦେଖାଯାଏ), ଏବଂ ବଟନଗୁଡ଼ିକ କଣ କରେ।\n\nଟାପ ବା ଯେକୌଣସି ବଟନ ନୋଟଟି ବନ୍ଦ କରେ, ଏବଂ ସେହି ସ୍କ୍ରିନ ପାଇଁ ତାହା ଆଉ ଆସେ ନାହିଁ। “ଆଉ ସୂଚନା ନାହିଁ” ସବୁ ସୂଚନା ବନ୍ଦ କରେ।\n\nସେଟିଂସରେ “ସିଷ୍ଟମ” ତଳେ “ସୂଚନା” ସେଗୁଡ଼ିକୁ ଚାଲୁ ବା ବନ୍ଦ କରେ, ଏବଂ “ସୂଚନା ପୁଣି ଦେଖାନ୍ତୁ” ପ୍ରତ୍ୟେକ ସ୍କ୍ରିନର ନୋଟ ଆଉ ଥରେ ଦେଖାଏ।"
help.title = ଏଠାରେ ଏହା କିପରି କାମ କରେ
