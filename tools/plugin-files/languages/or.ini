settings.plugin.description = ସେଟିଂସ ପୃଷ୍ଠା, ପ୍ରତ୍ୟେକ ପ୍ଲଗଇନର ସେଟିଂସରୁ ତିଆରି।
settings.plugin.how = "ସେଟିଂସ PaperPaw ଓ ତାହାର ପ୍ଲଗଇନରେ ଯାହା ସେଟ କରିହେବ ସବୁ ପୃଷ୍ଠାରେ ଦେଖାଏ। ପ୍ଲଗଇନର ନିଜ ସ୍କ୍ରିନ ଦରକାର ନାହିଁ: ସେମାନେ ଯାହା ଘୋଷଣା କରନ୍ତି ତାହା ଏଠାରେ ଗ୍ରୁପରେ ଦେଖାଯାଏ, ପ୍ରତ୍ୟେକ ସେଟିଂର ବିବରଣୀ ତାହା ତଳେ।\n\nମେନୁରେ “ସେଟିଂସ” ଦ୍ୱାରା ଖୋଲନ୍ତୁ। ଗ୍ରୁପ ଖୋଲିବାକୁ ତାହା ଉପରେ ଟାପ କରନ୍ତୁ, ତାପରେ ସେଟିଂ ଉପରେ ଟାପ କରି ଚାଲୁ/ବନ୍ଦ କରନ୍ତୁ ବା ବାଛନ୍ତୁ; ସଂଖ୍ୟାର − ଓ + ବଟନ ଅଛି। ବଟନରେ, ସେଟିଂକୁ ଯାଇ “ବାଛନ୍ତୁ” ଦବାନ୍ତୁ: ବାମ ଓ ଡାହାଣ ସଂଖ୍ୟା ବଦଳାଏ, “ବାଛନ୍ତୁ” ତାହା ରଖେ, “ପଛକୁ” ପୂର୍ବ ମୂଲ୍ୟକୁ ଫେରାଏ।\n\nପରିବର୍ତ୍ତନ ତୁରନ୍ତ ଲାଗୁ ହୁଏ। “ସନ୍ଧାନ” ଶବ୍ଦ ଦ୍ୱାରା ସେଟିଂ ଖୋଜେ ଓ “ଉନ୍ନତ ସେଟିଂସ” କ୍ୱଚିତ ଦରକାର ହେଉଥିବାଗୁଡ଼ିକ ଯୋଡ଼େ। “ଡିଫଲ୍ଟକୁ ରିସେଟ କରନ୍ତୁ” ଓ “ସବୁ ରିସେଟ କରନ୍ତୁ” ପ୍ରଥମେ ପଚାରେ।"
