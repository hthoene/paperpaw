keys.plugin.name = ବଟନ ଓ ଜେଶ୍ଚର
keys.plugin.description = ପ୍ରତ୍ୟେକ ବଟନ, ଟାପ ଜୋନ ଓ ସ୍ୱାଇପ କଣ କରେ, ଡିଭାଇସରେ ହିଁ ବଦଳାଯାଇପାରେ।
keys.plugin.how = "“ବଟନ ଓ ଜେଶ୍ଚର” ଦେଖାଏ ପ୍ରତ୍ୟେକ ବଟନ, ଟାପ ଜୋନ ଓ ସ୍ୱାଇପ କଣ କରେ, ଏବଂ ଡିଭାଇସରେ ତାହା ବଦଳାଇବାକୁ ଦିଏ।\n\nସେଟିଂସରେ “ଡିଭାଇସ” ତଳେ ଏହା ଖୋଲନ୍ତୁ। ପ୍ରଥମେ ବାଛନ୍ତୁ ପରିବର୍ତ୍ତନ କେଉଁଠି ଲାଗୁ ହେବ: “ସବୁଠି”, “ପଢ଼ିବା ବେଳେ”, “ହୋମ ସ୍କ୍ରିନରେ”, “ଲାଇବ୍ରେରୀରେ” ବା ଗୋଟିଏ ଟୁଲରେ। ତାପରେ ଏକ ଇନପୁଟ ବାଛନ୍ତୁ, ଯେପରି ଧରି ରଖାଯାଇଥିବା ବଟନ ବା ଧାରରୁ ଭିତରକୁ ସ୍ୱାଇପ, ଏବଂ ତାଲିକାରୁ ଏକ କାର୍ଯ୍ୟ ବାଛନ୍ତୁ, ଯାହା ସନ୍ଧାନ କରିହେବ। “ଷ୍ଟାଣ୍ଡାର୍ଡ” ପ୍ଲଗଇନ ଓ ବଟନ ଲେଆଉଟ ଯାହା ସେଟ କରେ ତାହା ଫେରାଏ।\n\nX4ରେ, ଯେଉଁ ପରିବର୍ତ୍ତନ ପରେ ବାଛିବା, ପଛକୁ ଯିବା ବା ଆଗକୁ ଯିବା ପାଇଁ କୌଣସି ବଟନ ରହିବ ନାହିଁ, ତାହା ଗ୍ରହଣ କରାଯାଏ ନାହିଁ। ଶେଷରେ ଥିବା “ବଟନ ଓ ଜେଶ୍ଚର ରିସେଟ କରନ୍ତୁ” ସବୁ ପରିବର୍ତ୍ତନ ଫେରାଏ।"
