notes-vault.plugin.name = ନୋଟ ଭଲ୍ଟ
notes-vault.plugin.description = Markdown ନୋଟର ଏକ ଫୋଲ୍ଡରକୁ ଫୋଲ୍ଡର, ଟ୍ୟାଗ ଓ ସଦ୍ୟ ପରିବର୍ତ୍ତନ ଅନୁସାରେ ପଢ଼େ, ହୋମ ସ୍କ୍ରିନ ପାଇଁ ୱିଜେଟ ସହିତ। Obsidian ଭଲ୍ଟ ସହିତ କାମ କରେ।
notes-vault.plugin.how = "“ନୋଟ ଭଲ୍ଟ” Markdown ନୋଟର ଏକ ଫୋଲ୍ଡର ପଢ଼େ (ନୋଟ ଆପ୍ସ ରଖୁଥିବା ସାଧାରଣ .md ଫାଇଲ)। ଏହା Obsidian ଭଲ୍ଟ ସହିତ କାମ କରେ।\n\nସେଟିଂସରେ, କିମ୍ବା ଟୁଲ୍ସରେ ଭଲ୍ଟର ପୃଷ୍ଠାରେ ଭଲ୍ଟ ଫୋଲ୍ଡର ବାଛନ୍ତୁ। ତାପରେ ପୃଷ୍ଠାଟି କାର୍ଡରେ ଥିବା ଫୋଲ୍ଡର, ଶେଷରେ ବଦଳିଥିବା ନୋଟ, ଟ୍ୟାଗ ଓ ନୋଟ ଶୀର୍ଷକରେ ସନ୍ଧାନ ଦେଖାଏ।\n\nପ୍ରଥମ ଥର, ପୃଷ୍ଠା ଖୋଲା ଥିବା ବେଳେ ଭଲ୍ଟର ଇଣ୍ଡେକ୍ସ ପୃଷ୍ଠଭୂମିରେ ତିଆରି ହୁଏ; ହଜାର ହଜାର ନୋଟରେ କିଛି ମିନିଟ ଲାଗେ, ତାପରେ ଏହା ତୁରନ୍ତ ଖୋଲେ। ଇଣ୍ଡେକ୍ସ କାର୍ଡରେ ରହେ, ଏବଂ କିଛି ଘଣ୍ଟା ପରେ ପୃଷ୍ଠା ଖୋଲିଲେ କିମ୍ବା “ଇଣ୍ଡେକ୍ସ ଅପଡେଟ କରନ୍ତୁ” ବାଛିଲେ ପୁଣି ତିଆରି ହୁଏ।\n\nନୋଟ ପଢ଼ିବା ସ୍କ୍ରିନରେ ଖୋଲେ। ଅନ୍ୟ ନୋଟର ଲିଙ୍କ ([[ନୋଟ]], [[ନୋଟ|ଶବ୍ଦ]], [[ନୋଟ#ଶୀର୍ଷକ]]) ଭଲ୍ଟର ଯେକୌଣସି ସ୍ଥାନରେ ନୋଟର ନାମରୁ ମିଳେ; ଲିଙ୍କ ଖୋଲିଲେ ସେହି ନୋଟ ଖୋଲେ, ଏବଂ “ପଛକୁ” ପୂର୍ବ ନୋଟକୁ ଫେରାଏ।\n\nଭଲ୍ଟରେ କିଛି କେବେ ବଦଳେ ନାହିଁ। ହୋମ ସ୍କ୍ରିନ ୱିଜେଟ (ସଦ୍ୟ ନୋଟ, ପିନ କରାଯାଇଥିବା ନୋଟ, ଦିନର ନୋଟ, ଅନିୟମିତ ନୋଟ, ଟ୍ୟାଗ, ସନ୍ଧାନ) ହୋମ ସ୍କ୍ରିନର ଏଡିଟରରେ ଯୋଡ଼ନ୍ତୁ। ଗୋଟିଏ ୱିଜେଟ କେବଳ ଗୋଟିଏ ଫୋଲ୍ଡରରୁ ନୋଟ ନେଇପାରେ: ୱିଜେଟର ସେଟିଂସରେ କାର୍ଡର ମୂଳରୁ ଫୋଲ୍ଡରର ପଥ ଲେଖନ୍ତୁ (ଯେପରି Notes/Work); ଖାଲି ରହିଲେ ଏହା ଭଲ୍ଟର ସବୁ ନୋଟ ନିଏ।"
