read-later-cloud.setup-needed = ପ୍ରଥମେ ଆପଣଙ୍କ Readwise Reader ଆକ୍ସେସ ଟୋକେନ ଦିଅନ୍ତୁ।
read-later-cloud.bad-token = Readwise ଆକ୍ସେସ ଟୋକେନ ଗ୍ରହଣ କଲା ନାହିଁ। readwise.io/access_tokenରେ ଏହାକୁ ଯାଞ୍ଚ କରନ୍ତୁ।
read-later-cloud.wait = Readwise ଟିକେ ଅପେକ୍ଷା କରିବାକୁ କହୁଛି। ଏକ ମିନିଟ ପରେ ପୁଣି ଆଣନ୍ତୁ।
read-later-cloud.no-network = ଲେଖା ଆଣିବାକୁ ନେଟୱାର୍କ ଦରକାର।
read-later-cloud.unreachable = Readwise ସହିତ ସଂଯୋଗ ହୋଇପାରୁନାହିଁ। Wi-Fi ସଂଯୋଗ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
read-later-cloud.unreadable = ଏହି ଡିଭାଇସରେ ଏହି ପ୍ଲଗଇନ ଅଣାଯାଇଥିବା ଲେଖାର ତାଲିକା ପଢ଼ିପାରୁନାହିଁ, ତେଣୁ କିଛି ବଦଳାଗଲା ନାହିଁ।
read-later-cloud.secret.account = Readwise Reader ଆକାଉଣ୍ଟ
read-later-cloud.too-big = ଏହି ଡିଭାଇସ ରଖିପାରୁଥିବାଠାରୁ Readwise ଅଧିକ ପଠାଇଲା, ତେଣୁ ଆଣିବା ବନ୍ଦ ହେଲା।
read-later-cloud.no-memory = Readwise Readerରୁ ଆଣିବାକୁ ଯଥେଷ୍ଟ ମେମୋରୀ ନଥିଲା। ଆଣିବା ବନ୍ଦ ହେଲା; ପରବର୍ତ୍ତୀ ଥର ଏହା ଆଗକୁ ଚାଲିବ।
read-later-cloud.not-kept = ଆକ୍ସେସ ଟୋକେନ ରଖିହେଲା ନାହିଁ। ଏହା ବହୁତ ଲମ୍ବା ନୁହେଁ ବୋଲି ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
reader.plugin.name = ରିଡର
reader.plugin.description = ବହିକୁ ପୃଷ୍ଠା ପରେ ପୃଷ୍ଠା ଦେଖାଏ, ସୂଚୀପତ୍ର ଓ ପଢ଼ିବା ସେଟିଂସ ସହିତ।
reader.plugin.how = "ରିଡର ବହିକୁ ପୃଷ୍ଠା ପରେ ପୃଷ୍ଠା ଦେଖାଏ। ଲାଇବ୍ରେରୀରୁ ବହି ଖୋଲନ୍ତୁ; ଶେଷ ବହି ଆରମ୍ଭରେ ପୁଣି ଖୋଲିପାରେ (ସେଟିଂ “ଆରମ୍ଭରେ ଶେଷ ବହି ଖୋଲନ୍ତୁ”)।\n\nପୃଷ୍ଠା ବଦଳାଇବାକୁ ସ୍କ୍ରିନର ବାମ ବା ଡାହାଣରେ ଟାପ କରନ୍ତୁ, କିମ୍ବା ପୃଷ୍ଠା ବଟନ ବ୍ୟବହାର କରନ୍ତୁ। ପଢ଼ିବା ମେନୁ ପାଇଁ ମଝିରେ ଟାପ କରନ୍ତୁ ବା “ବାଛନ୍ତୁ” ଦବାନ୍ତୁ: ସୂଚୀପତ୍ର, ସନ୍ଧାନ, ପୃଷ୍ଠାକୁ ଯାଆନ୍ତୁ, ଫଣ୍ଟ ଓ ଲେଆଉଟ, ବୁକମାର୍କ ଓ ହାଇଲାଇଟ ଇତ୍ୟାଦି। ଉପର ଧାରରୁ ତଳକୁ ସ୍ୱାଇପ କଲେ କ୍ୱିକ ପ୍ୟାନେଲ ଖୋଲେ, ତଳ ଧାରରୁ ଉପରକୁ ସ୍ୱାଇପ କଲେ ହୋମକୁ ଯାଏ; “ପଛକୁ” ଧରି ରଖିଲେ ମଧ୍ୟ।\n\nଛବି ପୂରା ସ୍କ୍ରିନରେ ଦେଖିବାକୁ “ବାଛନ୍ତୁ” (ବା ଛବିକୁ) ଧରି ରଖନ୍ତୁ: ବାମ ଓ ଡାହାଣ ପୃଷ୍ଠାର ଛବିଗୁଡ଼ିକ ଦେଇ ଯାଏ। “ବାଛନ୍ତୁ” 2x, 3x ଜୁମ କରେ ଓ ଫେରାଏ (ଟଚରେ ଡବଲ ଟାପ); ଜୁମରେ ବାମ ଓ ଡାହାଣ ପାର୍ଶ୍ୱକୁ ଘୁଞ୍ଚାଏ, ପୃଷ୍ଠା ବଟନ (ବା ସ୍ୱାଇପ) ଆଡ଼କୁ ଓ ତଳକୁ ଆଗକୁ ନିଏ। “ପଛକୁ” ଫିଟକୁ, ତାପରେ ପୃଷ୍ଠାକୁ ଫେରାଏ (ଟଚରେ ବାହାରିବାକୁ ଧରି ରଖନ୍ତୁ)। ବୁକମାର୍କ ପାଇଁ ଉପର ଡାହାଣ କୋଣରେ ଟାପ କରନ୍ତୁ। ହାଇଲାଇଟ ପାଇଁ ଶବ୍ଦକୁ ଧରି ରଖନ୍ତୁ। ବଟନ ସହିତ, ବାମ ଧରି ରଖନ୍ତୁ: ବାମ ଓ ଡାହାଣ ଶବ୍ଦ ଶବ୍ଦ, ପୃଷ୍ଠା ବଟନ ଧାଡ଼ି ଧାଡ଼ି ଘୁଞ୍ଚାଏ, ଧରି ରଖିଲେ ପୃଷ୍ଠାର ଶେଷକୁ ଓ ଅନୁଚ୍ଛେଦ ଅନୁସାରେ; “ବାଛନ୍ତୁ” ଶବ୍ଦ ପାଇଁ ହାଇଲାଇଟ ବାର ଖୋଲେ, ଧରି ରଖିଲେ ଚୟନକୁ ବାକ୍ୟ ଓ ଅନୁଚ୍ଛେଦ ପର୍ଯ୍ୟନ୍ତ ବଢ଼ାଏ (ତାପରେ ବାମ ଓ ଡାହାଣ ଶେଷ, ଧରି ରଖିଲେ ଆରମ୍ଭ ଘୁଞ୍ଚାଏ)। ଚୟନ ପୃଷ୍ଠା ବଦଳିଲେ ମଧ୍ୟ ଜାରି ରହେ। “Markdown ଭାବେ ଏକ୍ସପୋର୍ଟ” ଆପଣଙ୍କ ନୋଟ ସେଭ କରେ।"
