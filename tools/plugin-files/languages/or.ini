diagnostics.plugin.how = "ଡାଇଗ୍ନୋଷ୍ଟିକ୍ସ ଡିଭାଇସ ଯାଞ୍ଚ ପାଇଁ ଏକ ଟେଷ୍ଟ ସ୍କ୍ରିନ: ଏହା ପ୍ୟାନେଲର ପ୍ରତ୍ୟେକ ଧୂସର ସ୍ତର, ବଟନ ଓ ଟଚ ପରଖିବାକୁ ଚାରୋଟି ବାକ୍ସ, ଏବଂ ରିଫ୍ରେଶ ମୋଡ ତୁଳନା ପାଇଁ ପ୍ରୋଗ୍ରେସ ବାର ସହ ଏକ ପୃଷ୍ଠା କାଉଣ୍ଟର ଦେଖାଏ।\n\nଟେଷ୍ଟ ସ୍କ୍ରିନର କୌଣସି ମେନୁ ଏଣ୍ଟ୍ରି ନାହିଁ। ଅନ୍ୟ କୌଣସି ପ୍ଲଗଇନ ହୋମ ସ୍କ୍ରିନ ନଦେଲେ, କିମ୍ବା ପ୍ଲଗଇନ ମ୍ୟାନେଜରର “ସ୍କ୍ରିନ”ରେ “ହୋମ ସ୍କ୍ରିନ” ପାଇଁ ଏହାକୁ ବାଛିଲେ ହିଁ ଏହା ହୋମ ସ୍କ୍ରିନ ହୁଏ।\n\n“ବାଛନ୍ତୁ” ଫୋକସ ଥିବା ବାକ୍ସ ଚିହ୍ନିତ କରେ, ତୀର ବଟନ ବାକ୍ସ ମଧ୍ୟରେ ଘୁଞ୍ଚାଏ; ଟଚରେ ବାକ୍ସ ଟାପ କରନ୍ତୁ। ପୃଷ୍ଠା ବଟନ ଟେଷ୍ଟ ପୃଷ୍ଠା ବଦଳାଏ। ପୁଣି ଆରମ୍ଭ କରିବାକୁ “ବାଛନ୍ତୁ” ବା ସ୍କ୍ରିନରେ ଆଙ୍ଗୁଠି ଧରି ରଖନ୍ତୁ।\n\nଡିଭାଇସ ଯାଞ୍ଚ (ଟୁଲ୍ସରେ, ଯେଉଁଠି PaperPaw ଡିଭାଇସର ଫର୍ମୱେର) ଗୋଟିଏ ପରେ ଗୋଟିଏ ପୃଷ୍ଠାରେ ପ୍ରତ୍ୟେକ ଅଂଶ ଯାଞ୍ଚ କରେ: ସ୍କ୍ରିନ, ବଟନ, ଟଚ, ଫ୍ରଣ୍ଟ ଲାଇଟ, ବ୍ୟାଟେରୀ, କାର୍ଡ, ଘଡ଼ି, Wi-Fi, ସ୍ଲିପ ଓ ମେମୋରୀ। ପ୍ରତ୍ୟେକ ପୃଷ୍ଠା “ଫେଲ”, “ଛାଡ଼ନ୍ତୁ” ଓ “ପାସ” ସହ ଶେଷ ହୁଏ; ମାପ ଅନୁସାରେ ଉତ୍ତର ପୂର୍ବରୁ ବଛାଯାଇଥାଏ। ଡିଭାଇସରେ ନଥିବା ଅଂଶ ଛଡ଼ାଯାଏ। ପ୍ରତ୍ୟେକ ଉତ୍ତର ପରେ ଏହା .paperpaw/plugins/diagnostics/device-check.txtରେ ଏକ ରିପୋର୍ଟ ଲେଖେ, ଯାହା ଏକ pull requestରେ ପେଷ୍ଟ କରିହେବ। “ପଛକୁ” ଏଥିରୁ ବାହାରେ; ପୁଣି ଖୋଲିଲେ ଏହା ଯେଉଁଠି ଥିଲା ସେଠାରୁ ଚାଲେ। କେବଳ ବଟନ ଥିବା ଡିଭାଇସରେ ପ୍ରଥମେ ବଟନ ପୃଷ୍ଠାରେ “ଆରମ୍ଭ” ବାଛନ୍ତୁ; ସେପର୍ଯ୍ୟନ୍ତ ତୀର, “ବାଛନ୍ତୁ” ଓ “ପଛକୁ” ଅନ୍ୟ ପୃଷ୍ଠା ପରି କାମ କରେ।"
