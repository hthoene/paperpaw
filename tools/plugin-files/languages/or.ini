translate.plugin.how = "“ଅନୁବାଦ” DeepL ସହ ଚୟନିତ ଟେକ୍ସଟ ଅନଲାଇନ ଅନୁବାଦ କରେ। ବହିରେ ଟେକ୍ସଟ ଚୟନ କରି ଚୟନିତ ଟେକ୍ସଟର ମେନୁରେ “ଅନୁବାଦ କରନ୍ତୁ” ବାଛନ୍ତୁ: ଅଭିଧାନ ଏଣ୍ଟ୍ରି ପରି ଅନୁବାଦ ପୃଷ୍ଠା ଉପରେ ଦେଖାଯାଏ। ପୃଷ୍ଠା ବଟନ ବା ଟାପ ଏହାକୁ ସ୍କ୍ରୋଲ କରେ, ଓ ଶେଷରେ “ବାଛନ୍ତୁ” ବା ଏକ ଟାପ ଏହାକୁ ବନ୍ଦ କରେ।\n\nଏଥିପାଇଁ ନେଟୱାର୍କ ଓ ଆପଣଙ୍କ ନିଜର DeepL API କି ଦରକାର, deepl.comରେ ମାଗଣା (DeepL API Free, ମାସକୁ ପ୍ରାୟ 5,00,000 ଅକ୍ଷର)। ଏହା ଦେବା ପର୍ଯ୍ୟନ୍ତ ପ୍ୟାନେଲ ତାହା କହେ, ଓ ଟାପ କଲେ ଏହାକୁ ମାଗେ।\n\nସେଟିଂସରେ, “ପଢ଼ିବା” ତଳେ, “ଅନୁବାଦ” ବିଭାଗରେ “ଏହି ଭାଷାକୁ ଅନୁବାଦ” ଭାଷା ସ୍ଥିର କରେ; ପ୍ରଥମେ ଏହା PaperPawର ନିଜ ଭାଷା।"
