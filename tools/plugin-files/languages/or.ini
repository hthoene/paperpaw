diagnostics.check.screen.help = ପ୍ରତ୍ୟେକ ଧୂସର ସ୍ତର ନିଜସ୍ୱ ପଟି ଭାବେ ଦେଖାଯିବା ଉଚିତ। ପ୍ୟାଟର୍ନକୁ କିଛି ଥର ଓଲଟାନ୍ତୁ: ପୂର୍ବଟିର ଯାହା ରହିଯାଏ ତାହା ଘୋଷ୍ଟିଂ। ସମ୍ପୂର୍ଣ୍ଣ ରିଫ୍ରେଶ ତାହାକୁ ସଫା କରିବା ଉଚିତ।
