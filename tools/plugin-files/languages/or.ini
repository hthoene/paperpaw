smart-home.problem.no-network = କୌଣସି Wi-Fi ନେଟୱାର୍କ ନାହିଁ। ଘର ନେଟୱାର୍କ ସହ ସଂଯୋଗ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
