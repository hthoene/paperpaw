news.plugin.name = ସମ୍ବାଦ
news.plugin.description = ସମ୍ବାଦ ଫିଡ (RSS, Atom) ପଢ଼ିବା ପାଇଁ ବହି ଭାବେ ଆଣେ।
news.plugin.how = "ସମ୍ବାଦ RSS ବା Atom ଫିଡକୁ ବହିରେ ପରିଣତ କରେ। ପ୍ରତ୍ୟେକ ଫିଡ ଲାଇବ୍ରେରୀର News ଫୋଲ୍ଡରରେ ଗୋଟିଏ ବହି ହୁଏ, ତାହାର ନୂଆ ଲେଖାଗୁଡ଼ିକ ସାଧା ଟେକ୍ସଟ ଭାବେ, ଅନ୍ୟ ବହି ପରି ପଢ଼ିବା ପାଇଁ।\n\n“ଟୁଲ୍ସ” ମେନୁରୁ ସମ୍ବାଦ ଖୋଲି “ଫିଡ ଯୋଡ଼ନ୍ତୁ” ବାଛନ୍ତୁ; ଏହାର ଠିକଣା ଖବରକାଗଜ ବା ବ୍ଲଗର ୱେବସାଇଟରେ ଥାଏ। “ସମ୍ବାଦ ଆଣନ୍ତୁ” ସବୁ ଫିଡ ଆଣେ ଏବଂ ପୂର୍ବର ବହି ବଦଳାଏ। କେବଳ ଗୋଟିଏ ଫିଡ ଆଣିବା ବା ବାହାର କରିବା ପାଇଁ ତାହାକୁ ଧରି ରଖନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)। ବାହାର କରାଯାଇଥିବା ଫିଡର ବହି ଲାଇବ୍ରେରୀରେ ରହେ।\n\nଆଣିବା ପାଇଁ ନେଟୱାର୍କ ଦରକାର। “ପ୍ରତି ଫିଡରେ ଲେଖା” (ସେଟିଂସ, ଲାଇବ୍ରେରୀ) ପ୍ରତ୍ୟେକ ବହିରେ କେତୋଟି ଲେଖା ରହିବ ସେଟ କରେ। “ସମ୍ବାଦ ଶିରୋନାମା” ୱିଜେଟ ସେଗୁଡ଼ିକୁ ହୋମ ସ୍କ୍ରିନରେ ଦେଖାଏ।"
