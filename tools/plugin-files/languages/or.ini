pomodoro.plugin.name = ପୋମୋଡୋରୋ
pomodoro.plugin.description = କାମ ଓ ବିରତି ରାଉଣ୍ଡ, ୱିଜେଟ ଓ ଦୈନିକ ଗଣନା ସହିତ ଏକ ଫୋକସ ଟାଇମର।
pomodoro.plugin.how = "ଏକ ପୋମୋଡୋରୋ ଟାଇମର: ମନୋଯୋଗ ଦେଇ ରାଉଣ୍ଡରେ କାମ କରନ୍ତୁ, ତାପରେ ବିଶ୍ରାମ ନିଅନ୍ତୁ। କୌଣସି ସେଟଅପ ଦରକାର ନାହିଁ: 25 ମିନିଟ ଫୋକସ, 5 ମିନିଟ ବିଶ୍ରାମ, ଏବଂ ଚାରି ରାଉଣ୍ଡ ପରେ 15 ମିନିଟର ଲମ୍ବା ବିରତି।\n\nଟୁଲ୍ସ ମେନୁରୁ “ପୋମୋଡୋରୋ” ଖୋଲି “ଆରମ୍ଭ କରନ୍ତୁ” ଦବାନ୍ତୁ, କିମ୍ବା ହୋମ ସ୍କ୍ରିନରେ ଏହାର ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ (ହୋମ ସ୍କ୍ରିନ ଧରି ରଖି ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ): “ପୋମୋଡୋରୋ ଟାଇମର” ପର୍ଯ୍ୟାୟ ଓ ବାକି ମିନିଟ ଦେଖାଏ, “ପୋମୋଡୋରୋ ଆରମ୍ଭ/ବିରତି” ଏକ ବଟନ, ଏବଂ “ଆଜିର ପୋମୋଡୋରୋ” ଆପଣ ଶେଷ କରିଥିବା ରାଉଣ୍ଡ ଦୈନିକ ଲକ୍ଷ୍ୟ ସହିତ ଗଣେ। ଟାଇମରରେ ଟାପ କଲେ ଆରମ୍ଭ ବା ବିରତି ହୁଏ; ପୂରା ସ୍କ୍ରିନ ପାଇଁ ଧରି ରଖନ୍ତୁ।\n\nସ୍କ୍ରିନ ଛାଡ଼ିଲେ ମଧ୍ୟ ଟାଇମର ଚାଲୁ ରହେ, ଏବଂ ରିଷ୍ଟାର୍ଟ ପରେ ଘଡ଼ି ଅନୁସାରେ ଚାଲେ। ଡିଭାଇସ ସ୍ଲିପରେ ଥିବା ବେଳେ କିଛି ଚାଲେ ନାହିଁ: ମଝିରେ ଶେଷ ହୋଇଥିବା ପର୍ଯ୍ୟାୟ ଜାଗ୍ରତ ହେଲେ ଜଣାଯାଏ। ପର୍ଯ୍ୟାୟ ଶେଷ ହେଲେ ଏକ ସୂଚନା ଆସେ। ବ୍ୟାଟେରୀ ବଞ୍ଚାଇବାକୁ ଘଡ଼ି ମିନିଟକୁ ଥରେ ଅପଡେଟ ହୁଏ (ପୂରା ସ୍କ୍ରିନରେ ଶେଷ ମିନିଟରେ ଦଶ ସେକେଣ୍ଡରେ ଥରେ) ଏବଂ ଡିଭାଇସକୁ କେବେ ଜାଗ୍ରତ ରଖେ ନାହିଁ।\n\nସେଟିଂସର “ପୋମୋଡୋରୋ”ରେ ଅବଧି, ଗୋଟିଏ ସେଟର ରାଉଣ୍ଡ, ଏବଂ ପରବର୍ତ୍ତୀ ପର୍ଯ୍ୟାୟ ନିଜେ ଆରମ୍ଭ ହେବ କି ନାହିଁ ସେଟ କରନ୍ତୁ। “ଅଧିକ”ରେ: ପର୍ଯ୍ୟାୟ ଶେଷରେ ସ୍କ୍ରିନ ଫ୍ଲାସ ବା ଫ୍ରଣ୍ଟ ଲାଇଟ ଝଲକ, ଏବଂ ଦୈନିକ ଲକ୍ଷ୍ୟ।"
