bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = ରିମୋଟ, କିବୋର୍ଡ ଓ ସେନ୍ସର ପେୟାର କରେ ଓ ସଂଯୋଗ କରେ।
bluetooth.plugin.how = "Bluetooth ଡିଭାଇସରେ Bluetooth ଥିଲେ (X4 Pro) ରିମୋଟ, କିବୋର୍ଡ ଓ ସେନ୍ସର ପେୟାର କରେ।\n\nଡିଭାଇସ ଯୋଡ଼ନ୍ତୁ ପାଖରେ ଥିବା ଜିନିଷ ଖୋଜେ; ପ୍ରଥମେ ସେହି ଡିଭାଇସକୁ ପେୟାରିଂ ମୋଡରେ ରଖନ୍ତୁ। ଏହାକୁ ବାଛନ୍ତୁ, ଓ ଏହି ଡିଭାଇସରେ ନିଶ୍ଚିତ କରନ୍ତୁ (ସଂଖ୍ୟା ଦେଖାଗଲେ ତୁଳନା କରନ୍ତୁ)। ତାପରେ ରିମୋଟ ବା କିବୋର୍ଡର ବଟନ ପୃଷ୍ଠା ଓଲଟାଏ ଓ ମେନୁରେ ଘୁଞ୍ଚେ; ପ୍ରତ୍ୟେକ ବଟନ କଣ କରେ ତାହା ନିୟନ୍ତ୍ରଣରେ ବଦଳାନ୍ତୁ।\n\nରିମୋଟ କହେ ସେଗୁଡ଼ିକର ବଟନ କେବେ କାମ କରେ: ଏଠାରେ ଚାଲୁ କଲେ, ପଢ଼ିବାବେଳେ (ବହି ଖୋଲା ଥିବାବେଳେ ସଂଯୁକ୍ତ, ବ୍ୟାଟେରୀ ସଞ୍ଚୟ କରି), ବା ସବୁବେଳେ। ମେନୁ ବଟନ ବା ଏକ ଡିଭାଇସ ଉପରେ ଲମ୍ବା ଦବାଇଲେ ତାହାକୁ ଭୁଲିଯାଏ।\n\nସେନ୍ସର ପ୍ଲଗଇନ ପାଇଁ: କେଉଁ ପ୍ଲଗଇନ ଏହାକୁ ବ୍ୟବହାର କରିପାରିବ ତାହା ଚାଲୁ କରନ୍ତୁ। କିଛି ବ୍ୟବହାର ନକଲେ Bluetooth ବନ୍ଦ ରହେ।"
