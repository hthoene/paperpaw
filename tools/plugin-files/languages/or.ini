dictionary.plugin.name = ଅଭିଧାନ
dictionary.plugin.description = StarDict ଅଭିଧାନରେ ଶବ୍ଦର ଅର୍ଥ ଖୋଜେ।
dictionary.plugin.how = "ଅଭିଧାନ ବହିର ଏକ ଶବ୍ଦକୁ StarDict ଅଭିଧାନରେ ଖୋଜେ ଏବଂ ସ୍କ୍ରିନର ତଳ ଅଂଶ ଉପରେ ଏକ ପ୍ୟାନେଲରେ ଅର୍ଥ ଦେଖାଏ।\n\nପଢ଼ିବା ସମୟରେ ଏକ ଶବ୍ଦ ଧରି ରଖି “ଅର୍ଥ ଦେଖନ୍ତୁ” ବାଛନ୍ତୁ; ବଟନରେ “ଅଧିକ” ତଳେ “ଟେକ୍ସଟ ବାଛନ୍ତୁ” ବ୍ୟବହାର କରନ୍ତୁ। ଅଭିଧାନ ଫୋଲ୍ଡରଗୁଡ଼ିକ (.ifo, .idx ଓ .dict ଫାଇଲ ସହ) ଡିଭାଇସର \"dictionaries\" ଫୋଲ୍ଡରରେ କପି କରନ୍ତୁ, ସବଫୋଲ୍ଡର ମଧ୍ୟ ଚଳିବ, କିମ୍ବା ସେଟିଂସ › ପଢ଼ିବାରେ “ଅଭିଧାନ ଫୋଲ୍ଡର”ରେ (ଏକ ଉନ୍ନତ ସେଟିଂ) ଅନ୍ୟ ଫୋଲ୍ଡର ବାଛନ୍ତୁ। ପ୍ରଥମ ଥର ଖୋଜିବା ବେଳେ ପ୍ରତ୍ୟେକ ଅଭିଧାନ ପାଇଁ ଏକ ଛୋଟ ଇଣ୍ଡେକ୍ସ ତିଆରି ହୁଏ, ଏଥିରେ କିଛି ସମୟ ଲାଗେ।\n\nପ୍ୟାନେଲରେ ପୃଷ୍ଠା ବଟନ ବା ଉପରକୁ ଓ ତଳକୁ ଲମ୍ବା ଅର୍ଥ ସ୍କ୍ରୋଲ କରେ, “ପଛକୁ” ଏହାକୁ ବନ୍ଦ କରେ। ଟଚରେ ବନ୍ଦ କରିବାକୁ ଏହାର ବାହାରେ ଟାପ କରନ୍ତୁ।"
