transfer.plugin.description = ସମାନ ନେଟୱାର୍କରେ ଥିବା ଏକ ବ୍ରାଉଜରରୁ ଡିଭାଇସକୁ ବହି ଓ ଅନ୍ୟ ଫାଇଲ ପଠାନ୍ତୁ।
transfer.plugin.how = "Wi-Fi ଟ୍ରାନ୍ସଫର ସମାନ ନେଟୱାର୍କରେ ଥିବା ଏକ ବ୍ରାଉଜରରୁ କେବଲ ବା ଆପ ବିନା ଡିଭାଇସକୁ ବହି ଓ ଅନ୍ୟ ଫାଇଲ ପଠାଏ। ଆପଣ ଫାଇଲ ଆଣିପାରିବେ, ଫୋଲ୍ଡର ତିଆରି ଓ ଡିଲିଟ ମଧ୍ୟ କରିପାରିବେ।\n\nଏହାକୁ ଟୁଲ୍ସରୁ ଖୋଲନ୍ତୁ। ସ୍କ୍ରିନ ଏକ ଠିକଣା ଟେକ୍ସଟ ଓ QR କୋଡ ଭାବେ ଦେଖାଏ: ଫୋନ ବା କମ୍ପ୍ୟୁଟରର ବ୍ରାଉଜରରେ ଏହାକୁ ଖୋଲନ୍ତୁ, କିମ୍ବା କୋଡଟି ସ୍କାନ କରନ୍ତୁ। ଠିକଣାରେ ପ୍ରତି ଥର ନୂଆ ତିଆରି ଏକ କି ଥାଏ, ତେଣୁ ନେଟୱାର୍କର ଅନ୍ୟମାନେ ଆପଣଙ୍କ ଫାଇଲ ପାଇପାରିବେ ନାହିଁ। ସ୍କ୍ରିନ ଖୋଲା ଥିବା ପର୍ଯ୍ୟନ୍ତ ଟ୍ରାନ୍ସଫର ଚାଲେ।\n\nଯେଉଁଠି PaperPaw ନିଜେ Wi-Fi ଚଲାଏ, ଯେପରି X4ରେ, ତଳେ “ରାଉଟର ବିନା” ଡିଭାଇସର ନିଜ ନେଟୱାର୍କ ଖୋଲେ, ଯାହାରେ ଫୋନ ଏକ କୋଡ ସ୍କାନ କରି ଯୋଗ ଦିଏ।"
