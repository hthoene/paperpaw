format-html.plugin.how = "ଫାଇଲ ଭାବେ ସେଭ ହୋଇଥିବା ୱେବ ପୃଷ୍ଠା (.html, .htm, .xhtml) ବହି ଭାବେ ଖୋଲେ: କେବଳ ପଢ଼ିବା ଯୋଗ୍ୟ ଅଂଶ, ଚାରିପାଖର ମେନୁ, ବିଜ୍ଞାପନ ଆଦି ବିନା।\n\nଫାଇଲଟି ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ ରଖି ଅନ୍ୟ ବହି ପରି ଲାଇବ୍ରେରୀରୁ ଖୋଲନ୍ତୁ। ପୃଷ୍ଠା ଭିତରର ଲିଙ୍କ କାମ କରେ; ଛବି ଫାଇଲରେ ଯେଉଁଠି ଅଛି ସେଠାରେ ଦେଖାଯାଏ।"
