rules.plugin.name = ନିୟମ
rules.plugin.description = କିଛି ଘଟିଲେ କିଛି କରେ: ଯେପରି 22:00ରେ ନାଇଟ ମୋଡ।
rules.plugin.how = "ଏକ ନିୟମ କିଛି ଘଟିଲେ ନିଜେ କିଛି କରେ: ପ୍ରତିଦିନ 22:00ରେ ନାଇଟ ମୋଡ ଚାଲୁ, କିମ୍ବା PaperPaw ଆରମ୍ଭ ହେଲେ କାଟାଲଗ ସିଙ୍କ।\n\nନିୟମ ସେଟିଂସରେ “କଷ୍ଟମାଇଜ” ତଳେ “ନିୟମ” ଭାବେ ଅଛି। “ନିୟମ ଯୋଡ଼ନ୍ତୁ” ପଚାରେ “କେବେ?” (PaperPaw ଆରମ୍ଭ, ଦିନର ଏକ ସମୟ, ବହି ଖୋଲିବା ବା ବନ୍ଦ କରିବା, ବ୍ୟାଟେରୀ, ଚାର୍ଜିଂ, ଏକ ସୁଇଚ ଓ ଅଧିକ) ଓ “ତାପରେ କଣ?” (ଏକ କାର୍ଯ୍ୟ ଚଲାନ୍ତୁ, ସୁଇଚ ଚାଲୁ ବା ବନ୍ଦ କରନ୍ତୁ, ଏକ ସଂଖ୍ୟା ସେଟ କରନ୍ତୁ, ଏକ ବାର୍ତ୍ତା ଦେଖାନ୍ତୁ)। ନିୟମ ବିରତି କରିବାକୁ ତାହା ଉପରେ ଟାପ କରନ୍ତୁ; “ଦୁଇଟି ସମୟ ମଧ୍ୟରେ” ପରି ଏକ ସର୍ତ୍ତ ପାଇଁ ବା ବାହାର କରିବାକୁ ଧରି ରଖନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)।\n\nବାଛିବା ପାଇଁ କାର୍ଯ୍ୟ, ସୁଇଚ ଓ ସଂଖ୍ୟା ପ୍ଲଗଇନ ଅନୁସାରେ ସଜାଯାଇଛି: ପ୍ରଥମେ ପ୍ଲଗଇନ ବାଛନ୍ତୁ, ତାପରେ ତାହା ଯାହା ଆଣେ; “ପଛକୁ” ପୁଣି ବାହାରକୁ ନିଏ। ଦେଖାଯାଉଥିବା ସ୍କ୍ରିନରେ କାମ କରୁଥିବା କାର୍ଯ୍ୟ, ଯେପରି “ପଛକୁ” ବା “ପରବର୍ତ୍ତୀ ପୃଷ୍ଠା”, ସେଠାରେ ଦବାଇଲେ ଯାହା କରନ୍ତା ତାହା କରେ।\n\nସମୟ ଯେକୌଣସି ସ୍କ୍ରିନ ଖୋଲା ଥିଲେ ବି ଲାଗୁ ହୁଏ। ପରସ୍ପରକୁ ବାରମ୍ବାର ଓଲଟାଉଥିବା ଦୁଇଟି ନିୟମ କିଛି ପଦକ୍ଷେପ ପରେ ବନ୍ଦ ହୁଏ।"
