format-cbz.plugin.name = କମିକ ବହି
format-cbz.plugin.description = କମିକ ବହି ଆର୍କାଇଭ (.cbz) ଖୋଲେ, ପ୍ରତି ପୃଷ୍ଠାରେ ଗୋଟିଏ ଛବି।
format-cbz.plugin.how = "କମିକ ବହି ଆର୍କାଇଭ (.cbz) ଖୋଲେ: ପ୍ରତି ପୃଷ୍ଠାରେ ଗୋଟିଏ ଛବି, ସ୍କ୍ରିନରେ ଫିଟ, ନାମର କ୍ରମରେ (2 ପରେ 10)।\n\nସେଗୁଡ଼ିକୁ ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ ରଖି ଲାଇବ୍ରେରୀରୁ ଖୋଲନ୍ତୁ; ଅନ୍ୟ ବହି ପରି ପୃଷ୍ଠା ଓଲଟାନ୍ତୁ। ବଡ଼ ଛବି ପ୍ରଥମ ଥର କିଛି ସମୟ ନିଏ, X4ରେ ଅନ୍ୟଠାରୁ ଅଧିକ।\n\nପଢ଼ିବା ସେଟିଂସ (ସେଟିଂସ › ପଢ଼ିବା): “ପ୍ୟାନେଲ ପରେ ପ୍ୟାନେଲ” ପୃଷ୍ଠାର ଗୋଟିଏ ପ୍ୟାନେଲ ଥରକେ ସ୍କ୍ରିନ ଯେତେ ଅନୁମତି ଦିଏ ସେତେ ବଡ଼ କରି ଦେଖାଏ, ଏବଂ ପୃଷ୍ଠା ଓଲଟାଇବା ସେଗୁଡ଼ିକ ମଧ୍ୟରେ ଯାଏ; ପ୍ୟାନେଲ ନଥିବା ପୃଷ୍ଠା ପୂରା ଦେଖାଯାଏ। “କମିକ ପୃଷ୍ଠାର ଦିଗ” ମାଙ୍ଗା (ଡାହାଣରୁ ବାମ) ପାଇଁ ପୃଷ୍ଠା ଓଲଟାଇବାକୁ ଦର୍ପଣ କରେ; ବହିର ନିଜ ComicInfo.xml ଏହା ନିଜେ କହେ। ଲାଇବ୍ରେରୀ ComicInfo.xmlରୁ ବହିର ଶୀର୍ଷକ, ସିରିଜ ଓ ନମ୍ବର ଦେଖାଏ।"
