files.plugin.name = ଫାଇଲ ବ୍ରାଉଜର
files.plugin.description = ଡିଭାଇସରେ ଥିବା ବହି ଓ ଫୋଲ୍ଡରର ତାଲିକା ଦେଖାଏ ଓ ସେଗୁଡ଼ିକୁ ଖୋଲେ।
files.plugin.how = "ଲାଇବ୍ରେରୀ ଆପଣଙ୍କ ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରର ବହିଗୁଡ଼ିକୁ ତାଲିକାରେ ଦେଖାଏ, ପ୍ରତ୍ୟେକର କଭର, ଶୀର୍ଷକ, ଲେଖକ ଓ କେତେ ପଢ଼ାହୋଇଛି ସହ। ଶେଷରେ ପଢ଼ିଥିବା ବହି ଉପରେ ଏକ କାର୍ଡ ଭାବେ ରହେ, ତେଣୁ ପୁଣି ପଢ଼ିବାକୁ ଗୋଟିଏ ଟାପ, ବା “ବାଛନ୍ତୁ” ଥରେ ଦବାଇବା ଯଥେଷ୍ଟ। ଲାଇବ୍ରେରୀ ବହି ଖୋଜୁଥିବା ବେଳେ ଏପର୍ଯ୍ୟନ୍ତ କେତେ ମିଳିଲା ଦେଖାଏ।\n\nବହି ଉପରେ କଣ ଦେଖାଯିବ ବାଛନ୍ତୁ: ସବୁ ବହି, ପଢ଼ୁଥିବା, ଅପଠିତ ବା ଶେଷ ହୋଇଥିବା ବହି, କିମ୍ବା ସେଲଫ (ଲେଖକ, ସିରିଜ, ଟ୍ୟାଗ, ପସନ୍ଦର, ଆରମ୍ଭ କରିଥିବା ପ୍ରତ୍ୟେକ ସିରିଜର ପରବର୍ତ୍ତୀ ବହି ଅନୁସାରେ)। ପଢ଼ିବାକୁ ବହି ଟାପ କରନ୍ତୁ; ଖୋଲିବା, ଶେଷ ହୋଇଛି ବା ଅପଠିତ ଭାବେ ଚିହ୍ନିତ କରିବା, ସୂଚନା ଦେଖିବା, ଆର୍କାଇଭକୁ ଘୁଞ୍ଚାଇବା ବା ଡିଲିଟ କରିବାକୁ ଏହାକୁ ଧରି ରଖନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)। ଲାଇବ୍ରେରୀ ମେନୁ ପାଇଁ ଶୀର୍ଷକ ଟାପ କରନ୍ତୁ: ବହି କିପରି ସଜାଯିବ ଓ ଦେଖାଯିବ, ସନ୍ଧାନ, ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡର ଓ ସେଟିଂସ।\n\nଲାଇବ୍ରେରୀ ଫୋଲ୍ଡର ସେଟିଂସ › ଲାଇବ୍ରେରୀରେ “ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡର”ରେ ସେଟ ହୁଏ; ସେଠାରେ ବହିକୁ କଭର ଗ୍ରିଡ ଭାବେ ମଧ୍ୟ ଦେଖାଇପାରିବେ। ଅନ୍ୟ ସବୁ ଫାଇଲ ପାଇଁ ଟୁଲ୍ସ ମେନୁର “ଫାଇଲ” ବ୍ୟବହାର କରନ୍ତୁ।"
