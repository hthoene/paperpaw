calibre.plugin.name = ୱାୟରଲେସ ଲାଇବ୍ରେରୀ
calibre.plugin.description = ନେଟୱାର୍କ ଦେଇ ବହି ଗ୍ରହଣ କରେ। Calibre ପାଇଁ ଏକ ୱାୟରଲେସ ଡିଭାଇସ ଭାବେ କାମ କରେ।
calibre.plugin.how = "“ୱାୟରଲେସ ଲାଇବ୍ରେରୀ” ଦ୍ୱାରା ଡିଭାଇସଟି ଆପଣଙ୍କ କମ୍ପ୍ୟୁଟରର Calibreରେ ଏକ ୱାୟରଲେସ ଡିଭାଇସ ଭାବେ ଦେଖାଯାଏ। ତାପରେ Calibre ଏଥିକୁ ବହି ପଠାଇପାରିବ, ତାଲିକା କରିପାରିବ ଓ ଡିଲିଟ କରିପାରିବ। ବହିଗୁଡ଼ିକ ଲାଇବ୍ରେରୀକୁ ଯାଏ।\n\nଡିଭାଇସ ଓ କମ୍ପ୍ୟୁଟର ଏକା Wi-Fi ନେଟୱାର୍କରେ ଥିବାବେଳେ ଟୁଲ୍ସ ମେନୁରୁ “ୱାୟରଲେସ ଲାଇବ୍ରେରୀ” ଖୋଲନ୍ତୁ। Calibreରେ “Connect/share” ଓ ତାପରେ “Start wireless device connection” ବାଛନ୍ତୁ। ଡିଭାଇସ ଆପଣଙ୍କ କମ୍ପ୍ୟୁଟର ପାଇଲେ ତାହାର ନାମ ଦେଖାଏ; “ସଂଯୋଗ କରନ୍ତୁ” ଟାପ କରନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ” ଦବାନ୍ତୁ)। Calibre ଏଠାରେ ବହି ଯୋଡ଼ିପାରେ ଓ ଡିଲିଟ କରିପାରେ, ତେଣୁ କେବଳ ନିଜ କମ୍ପ୍ୟୁଟର ସହ ସଂଯୋଗ କରନ୍ତୁ। ସ୍କ୍ରିନ ବନ୍ଦ କଲେ ସଂଯୋଗ ଶେଷ ହୁଏ।\n\nCalibre ନିଜେ ନମିଳିଲେ, ତାହାର କମ୍ପ୍ୟୁଟରର ଠିକଣା ସେଟିଂସ › ଲାଇବ୍ରେରୀରେ Calibre ଅଂଶର “ଠିକଣା”ରେ ଲେଖନ୍ତୁ। Calibre 9090 ଛଡ଼ା ଅନ୍ୟ ପୋର୍ଟ ବ୍ୟବହାର କଲେ, ତାହାକୁ :ପୋର୍ଟ ଭାବେ ଯୋଡ଼ନ୍ତୁ, ଯଥା 192.168.1.20:9091।"
