about.plugin.name = ବିଷୟରେ
about.plugin.description = PaperPawର ସଂସ୍କରଣ ଓ ଲାଇସେନ୍ସ।
about.plugin.how = "ବିଷୟରେ ଦେଖାଏ ଆପଣଙ୍କ ପାଖରେ PaperPawର କେଉଁ ସଂସ୍କରଣ ଅଛି, ଏହାର ସୋର୍ସ କୋଡ କେଉଁଠି ଅଛି, ଏବଂ ଏହା କେଉଁ ଲାଇସେନ୍ସରେ ଆସେ।\n\nଏହା ସେଟିଂସର ଶେଷରେ “PaperPaw ବିଷୟରେ” ଭାବେ ମିଳେ। ତୀର ବଟନ ଓ ବାଛନ୍ତୁ ଦ୍ୱାରା ଏକ ଧାଡ଼ି ବାଛନ୍ତୁ, ବା ଏହାକୁ ଟାପ କରନ୍ତୁ। ଫର୍ମୱେରରେ ନିର୍ମିତ ପ୍ଲଗଇନ, ଏବଂ କୋଡ ସହ ପ୍ଲଗଇନ ଲୋଡ କରୁଥିବା ଡିଭାଇସରେ ସେପରି ପ୍ଲଗଇନ ଯେଉଁ ଫିଙ୍ଗରପ୍ରିଣ୍ଟ ପାଇଁ ନିର୍ମିତ ହେବା ଦରକାର, ତାହା ମଧ୍ୟ ତାଲିକାରେ ଅଛି।\n\nଲାଇସେନ୍ସ ପଢ଼ିବା ସ୍କ୍ରିନରେ ଏକ ଟେକ୍ସଟ ଭାବେ ଖୋଲେ, ତେଣୁ ଆପଣ ବହି ପରି ପୃଷ୍ଠା ଓଲଟାନ୍ତି। ଏଥିରେ PaperPawର ନିଜ ଲାଇସେନ୍ସ ଓ ଏହା ସହ ଆସୁଥିବା ଫଣ୍ଟ, ଆଇକନ ଓ ହାଇଫେନେସନ ପ୍ୟାଟର୍ନର ଲାଇସେନ୍ସ ଅଛି। ପ୍ଲଗଇନ ନିଜର ଏକ ଧାଡ଼ି ଯୋଡ଼ିପାରେ, ଯେପରି ଏକ ଥିମର ଲେଖକ।"
