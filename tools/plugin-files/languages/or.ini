menu.plugin.how = "ମେନୁରେ ଆପଣ କଣ କରିପାରିବେ ଓ ସେଟ କରିପାରିବେ ତାହାର ତାଲିକା ଅଛି। ଏହା ସ୍କ୍ରିନ ତଳେ, ଖୋଲା ଥିବା ଜିନିଷ ଉପରେ ଖୋଲେ: ପଢ଼ିବା ବେଳେ ସ୍କ୍ରିନର ମଝିରେ ଟାପ କରନ୍ତୁ ବା “ବାଛନ୍ତୁ” ଦବାନ୍ତୁ। ଏକ ଏଣ୍ଟ୍ରି ଚଲାଇବାକୁ ତାହାକୁ ଟାପ କରନ୍ତୁ ବା ବାଛନ୍ତୁ।\n\nମେନୁରେ ଥିବା ସେଟିଂସ ତାହାର ମୂଲ୍ୟ ଦେଖାଏ ଓ ସେଠାରେ ହିଁ ବଦଳେ, ତେଣୁ ମେନୁ ଖୋଲା ରହେ। ଅଧିକ ଏଣ୍ଟ୍ରି ଥିବା ଏକ ଏଣ୍ଟ୍ରି ସବମେନୁ ଖୋଲେ।\n\nକ୍ୱିକ ପ୍ୟାନେଲ ପାଇଁ ଉପର ଧାରରୁ ତଳକୁ ସ୍ୱାଇପ କରନ୍ତୁ: ଆପଣ ବାରମ୍ବାର ବଦଳାଉଥିବା ଜିନିଷ, ବଟନ ଭାବେ। ସୁଇଚ କରିବାକୁ ଏକ ବଟନ ଟାପ କରନ୍ତୁ, ତାହାର ସେଟିଂସ ପାଇଁ ଧରି ରଖନ୍ତୁ। କେବଳ ବଟନରେ, ତୀର ବଟନ ବାଛେ, “ବାଛନ୍ତୁ” ସୁଇଚ କରେ ଓ “ପଛକୁ” ବନ୍ଦ କରେ। “ରୂପ” ତଳେ “ମେନୁ” ମେନୁକୁ ତାଲିକା ବା ଟାଇଲ ଭାବେ ଦେଖାଏ।"
