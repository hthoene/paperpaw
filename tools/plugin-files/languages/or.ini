koreader.plugin.name = ହାଇଲାଇଟ ବାଣ୍ଟିବା
koreader.plugin.description = ଦୁଇଟିରେ ପଢ଼ାଯାଉଥିବା ବହି ପାଇଁ KOReader ସହିତ ବୁକମାର୍କ ଓ ହାଇଲାଇଟ ବାଣ୍ଟେ।
koreader.plugin.how = "ଏହି ପ୍ଲଗଇନ ଆପଣ ଉଭୟରେ ପଢ଼ୁଥିବା ବହି ପାଇଁ KOReader ସହିତ ବୁକମାର୍କ ଓ ହାଇଲାଇଟ ବାଣ୍ଟେ, ଗୋଟିଏ ଡିଭାଇସରେ କିମ୍ବା ଡିଭାଇସଗୁଡ଼ିକ ମଧ୍ୟରେ ସିଙ୍କ ହେଉଥିବା ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ। କିଛି ସେଟଅପ ଦରକାର ନାହିଁ।\n\nKOReader ମଧ୍ୟ ଖୋଲିଥିବା ଏକ ବହି PaperPaw ଖୋଲିଲେ, ଏବଂ ଆପଣ ତାହାର ବୁକମାର୍କ ବା ହାଇଲାଇଟ ବଦଳାଇଲେ, ଏହା ବହି ପାଖରେ ଥିବା KOReader ଡାଟାରୁ ନୂଆ ଜିନିଷ ନିଏ ଏବଂ ଏଠାର ନୂଆ ଜିନିଷ ରଖେ, ଯାହା KOReader ପରଥର ବହିଟି ଖୋଲିଲେ ନେବ। ବାହାର କରାଯାଇଥିବା ଚିହ୍ନ ଓ ବଦଳାଯାଇଥିବା ନୋଟ ମଧ୍ୟ ଯାଏ।\n\nଏହା କେବଳ EPUB ବହି ପାଇଁ କାମ କରେ। ଗୋଟିଏ ପାର୍ଶ୍ୱର ଫାଇଲ ପଢ଼ିହେଉନଥିଲେ, ତାହା ପଢ଼ିହେବା ପର୍ଯ୍ୟନ୍ତ କୌଣସି ପାର୍ଶ୍ୱରେ କିଛି ବଦଳେ ନାହିଁ।"
koreader.removed-there = KOReaderର ଫାଇଲରେ ଆଉ କୌଣସି ହାଇଲାଇଟ ନାହିଁ। ଏଠାରୁ ମଧ୍ୟ ସେଗୁଡ଼ିକ ବାହାର କରିବେ?
koreader.removed-there.text = ସେଗୁଡ଼ିକ KOReaderରେ ବାହାର କରାଯାଇଥାଇପାରେ, କିମ୍ବା ତାହାର ଫାଇଲ ଅନ୍ୟ ଡିଭାଇସରୁ ଆସିଛି। “ରଖନ୍ତୁ” ସେଗୁଡ଼ିକୁ ଏଠାରେ ରଖେ ଏବଂ KOReaderକୁ ପୁଣି ଦିଏ।
