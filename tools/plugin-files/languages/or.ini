smart-home.plugin.name = ସ୍ମାର୍ଟ ହୋମ
smart-home.plugin.description = ଆପଣଙ୍କ ନିଜ Home Assistantର ମୂଲ୍ୟ ଓ ସୁଇଚ ଏକ ଡ୍ୟାସବୋର୍ଡରେ ଓ ହୋମ ସ୍କ୍ରିନ ୱିଜେଟ ଭାବେ। ଘର ନେଟୱାର୍କରେ Home Assistant ସହ କାମ କରେ।
smart-home.plugin.how = "ସ୍ମାର୍ଟ ହୋମ ଆପଣଙ୍କ ନିଜ Home Assistantରୁ ମୂଲ୍ୟ ଓ ସୁଇଚ ଦେଖାଏ: ତାପମାତ୍ରା, ଆର୍ଦ୍ରତା, ଶକ୍ତି, କବାଟ ଓ ଝରକା, ଲାଇଟ, ସୁଇଚ ଓ ସିନ। ଏହା ଘର ନେଟୱାର୍କରେ REST API ଦ୍ୱାରା ସର୍ଭର ସହ କଥା ହୁଏ; ଅନ୍ୟ କୌଣସି ସେବା ଦେଇ କିଛି ଯାଏ ନାହିଁ।\n\nଟୁଲ୍ସ ମେନୁରୁ “ସ୍ମାର୍ଟ ହୋମ” ଖୋଲନ୍ତୁ, ତାପରେ “ସଂଯୋଗ”: Home Assistantର ଠିକଣା (ଯେପରି http://homeassistant.local:8123) ଓ ଏକ ଦୀର୍ଘସ୍ଥାୟୀ ଆକ୍ସେସ ଟୋକେନ ଦିଅନ୍ତୁ (Home Assistant ପ୍ରୋଫାଇଲ ପୃଷ୍ଠାର ତଳେ ତିଆରି କରନ୍ତୁ)। ଟୋକେନ ପାସୱାର୍ଡ ଓ କି ମଧ୍ୟରେ ରହେ। http କେବଳ ଘର ନେଟୱାର୍କରେ ଚାଲେ; ବାହାର ସର୍ଭର ପାଇଁ ସେଟିଂସରେ “ଘର ନେଟୱାର୍କ ବାହାରର ସର୍ଭର” ଚାଲୁ କରି ବୈଧ ସାର୍ଟିଫିକେଟ ସହ https ବ୍ୟବହାର କରନ୍ତୁ।\n\n“ଏଣ୍ଟିଟି ବାଛନ୍ତୁ” ସର୍ଭରର ଏଣ୍ଟିଟି ତାଲିକା ଖୋଲେ: ନାମ ବା id ଦ୍ୱାରା ସନ୍ଧାନ କରି ଦେଖାଇବାକୁ ବାଛନ୍ତୁ (ପୁଣି ବାଛିଲେ ହଟିଯାଏ)। ଏକ କୋଠରୀ ଦେଇପାରିବେ, ଯାହା ଡ୍ୟାସବୋର୍ଡ ଓ କୋଠରୀ ୱିଜେଟରେ ଗ୍ରୁପ କରେ। ସର୍ବାଧିକ 24ଟି ଏଣ୍ଟିଟି। ଡ୍ୟାସବୋର୍ଡରେ ଲାଇଟ, ସୁଇଚ ବା ସିନ ବାଛିଲେ ତାହା ସୁଇଚ ହୁଏ; ବଛା ସେନସର ପୁଣି ପଢ଼ାଯାଏ।\n\nୱିଜେଟ (ହୋମ ସ୍କ୍ରିନ ଧରି ରଖନ୍ତୁ, ତାପରେ ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ): ମୂଲ୍ୟ ଗୋଟିଏ ମାପ ବଡ଼ କରି ଦେଖାଏ, ଗ୍ରୁପ ଏକ କୋଠରୀର ଏଣ୍ଟିଟି ତାଲିକା ଦିଏ, ସୁଇଚ ଗୋଟିଏ ଲାଇଟ ବା ସୁଇଚ ପାଇଁ ବଟନ, କୋଠରୀ ମାପ ଓ ସୁଇଚ ସହ ଏକ କାର୍ଡ। ପ୍ରତ୍ୟେକ ୱିଜେଟର ସେଟିଂସରେ ଏହା କେଉଁ ଏଣ୍ଟିଟି ବା କୋଠରୀ ଦେଖାଏ ସ୍ଥିର ହୁଏ।\n\nଡ୍ୟାସବୋର୍ଡ ଖୋଲିଲେ, ଆପଣ ମାଗିଲେ (“ବର୍ତ୍ତମାନ ରିଫ୍ରେସ କରନ୍ତୁ” ବା ୱିଜେଟରେ ଟାପ), Wi-Fi ଚାଲୁ ଥିବା ବେଳେ ଡିଭାଇସ ଜାଗିଲେ, ଓ ଚାର୍ଜର ଲାଗିଥିବା ବେଳେ ସେଟ କରିଥିବା ସମୟ ଅନୁସାରେ ଘର ପଢ଼ାଯାଏ। ଏହା ନିଜେ କେବେ Wi-Fi ଚାଲୁ କରେ ନାହିଁ କି ଚାଲୁ ରଖେ ନାହିଁ।"
