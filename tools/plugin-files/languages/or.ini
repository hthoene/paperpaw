stats.plugin.name = ପଢ଼ିବା ପରିସଂଖ୍ୟାନ
stats.plugin.description = ଆପଣ କେତେ ସମୟ ଓ କେତେ ପଢ଼ନ୍ତି ରେକର୍ଡ କରେ, କ୍ୟାଲେଣ୍ଡର ଓ ପ୍ରତ୍ୟେକ ବହିର ସଂଖ୍ୟା ସହ।
stats.plugin.how = "ପଢ଼ିବା ପରିସଂଖ୍ୟାନ ଆପଣ ପ୍ରତ୍ୟେକ ପୃଷ୍ଠା କେତେ ସମୟ ପଢ଼ନ୍ତି ତାହା ରେକର୍ଡ କରେ। ଆପଣ ଏହାକୁ ଆଜି, ସପ୍ତାହ ଓ ଲଗାତାର ଦିନ ସହ ଏକ ସାରାଂଶ ଭାବେ, କ୍ୟାଲେଣ୍ଡର ଭାବେ, ଏବଂ ପ୍ରତ୍ୟେକ ବହିର ସଂଖ୍ୟା ସହ ଦେଖନ୍ତି।\n\n“ଟୁଲ୍ସ”ରୁ, କିମ୍ବା ପଢ଼ିବା ସମୟରେ “ଅଧିକ”ରୁ ଖୋଲନ୍ତୁ। ସେଟିଂସରେ “ପଢ଼ିବା ପରିସଂଖ୍ୟାନ” ତଳେ ଆପଣ “ପଢ଼ିବା ରେକର୍ଡ କରନ୍ତୁ” ବନ୍ଦ କରିପାରିବେ, “ଦୈନିକ ଲକ୍ଷ୍ୟ” ସେଟ କରିପାରିବେ, ଏବଂ ଗଣାଯାଉଥିବା “ସବୁଠୁ ଛୋଟ ପୃଷ୍ଠା” ଓ “ସବୁଠୁ ଲମ୍ବା ପୃଷ୍ଠା” ସେଟ କରିପାରିବେ, ଯାହାଫଳରେ ପୃଷ୍ଠା ଓଲଟାଇବା ବା ଖୋଲା ରହିଯାଇଥିବା ବହି ସଂଖ୍ୟାକୁ ବିଗାଡ଼େ ନାହିଁ।\n\n“KOReader ସହ ସିଙ୍କ” ଏକ WebDAV ଫୋଲ୍ଡର ଦ୍ୱାରା KOReader ସହ ପରିସଂଖ୍ୟାନ ଅଂଶୀଦାର କରେ। ଏହା ସେହି ଡିଭାଇସରେ ଥିବା KOReaderର ପରିସଂଖ୍ୟାନ ମଧ୍ୟ ନିଏ। ରେକର୍ଡିଂ ପାଇଁ ଘଡ଼ି ସେଟ ହୋଇଥିବା ଦରକାର: ସେଟ ହୋଇନଥିଲେ ଥରେ Wi-Fi ସହ ସଂଯୋଗ କରନ୍ତୁ।"
