about.plugins.help = ଏହି ଫର୍ମୱେରରେ କୋଡ ଥିବା ପ୍ଲଗଇନ, ସେଗୁଡ଼ିକର ସଂସ୍କରଣ ସହ। ଅପଡେଟ ସେଗୁଡ଼ିକୁ ପୁଣି ଆଣେ; ଯାହା ପାରିବ ନାହିଁ ତାହା ପ୍ରଥମେ ଜଣାଏ।
