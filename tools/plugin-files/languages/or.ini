wifi.plugin.how = "କୌଣସି ପ୍ଲଗଇନର ଇଣ୍ଟରନେଟ ଦରକାର ହେଲେ (କାଟାଲଗ, ସିଙ୍କ, ଷ୍ଟୋର, ଟ୍ରାନ୍ସଫର) Wi-Fi ଏକ ନେଟୱାର୍କରେ ଯୋଡ଼େ। ବ୍ୟାଟେରୀ ଓ ମେମୋରୀ ବଞ୍ଚାଇବାକୁ, କିଛି ବ୍ୟବହାର ନ କଲେ ଏକ ମିନିଟ ପରେ, କିମ୍ବା ହୋମ ବା ଏକ ବହି ଦେଖାଗଲେ ତୁରନ୍ତ ରେଡିଓ ପୁଣି ବନ୍ଦ ହୁଏ।\n\nସେଟିଂସରୁ, କିମ୍ବା ଷ୍ଟାଟସ ଲାଇନର Wi-Fi ଆଇଟମରୁ Wi-Fi ଖୋଲନ୍ତୁ। “ନେଟୱାର୍କ”ରେ ପାଖରେ ଥିବା ନେଟୱାର୍କ ତାଲିକା ଅଛି; ଗୋଟିଏ ବାଛି ଏହାର ପାସୱାର୍ଡ ଟାଇପ କରନ୍ତୁ, କିମ୍ବା “ଫୋନରେ ସେଟଅପ” ବାଛି ଡିଭାଇସ ବଦଳରେ ଫୋନର ବ୍ରାଉଜରରେ ନାମ ଓ ପାସୱାର୍ଡ ଟାଇପ କରନ୍ତୁ। “ଭୁଲିଯାଆନ୍ତୁ” ଏକ ସେଭ ଥିବା ନେଟୱାର୍କ ବାହାର କରେ।\n\nପାସୱାର୍ଡ କାର୍ଡରେ ସୁରକ୍ଷିତ ଭାବେ ରହେ ଏବଂ ଆଉ କେବେ ଦେଖାଯାଏ ନାହିଁ। “ଦରକାର ବେଳେ ଯୋଡ଼ନ୍ତୁ” ତଳେ ଆପଣ ସ୍ଥିର କରନ୍ତି: ଶେଷ ବ୍ୟବହାର ପରେ Wi-Fi କେତେ ସମୟ ଚାଲୁ ରହିବ, ଚାର୍ଜିଂ ବେଳେ ଚାଲୁ ରହିବ କି ନାହିଁ, ଏବଂ ଅନେକ ପାଖରେ ଥିଲେ କେଉଁ ସେଭ ଥିବା ନେଟୱାର୍କ ପ୍ରଥମେ ଆସିବ।"
