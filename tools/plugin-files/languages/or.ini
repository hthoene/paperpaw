diagnostics.check.wifi.title = Wi-Fi
diagnostics.check.wifi.help = ପହଞ୍ଚ ଭିତରେ ଥିବା ନେଟୱାର୍କ ଖୋଜାଯାଏ। ଗୋଟିଏ ସହ ଯୋଡ଼ି ହେବାକୁ Wi-Fi ପୃଷ୍ଠା ଖୋଲନ୍ତୁ।
diagnostics.check.sleep.title = ସ୍ଲିପ
diagnostics.check.sleep.help = “ଏବେ ସ୍ଲିପ” ବାଛନ୍ତୁ, ତାପରେ ପାୱାର ବଟନରେ ଡିଭାଇସ ଜଗାନ୍ତୁ। ଯାଞ୍ଚ ଆଗକୁ ଚାଲେ, ମେନୁରୁ ପୁଣି ଖୋଲିଲେ ମଧ୍ୟ।
