picture-home.plugin.name = ଛବି ହୋମ ସ୍କ୍ରିନ
picture-home.plugin.description = ୱିଜେଟ ପଛରେ ଆପଣଙ୍କ ନିଜ ଛବି ଓ ଆପଣ ସଜାଉଥିବା ଷ୍ଟାଟସ ବାର ସହିତ ଏକ ହୋମ ସ୍କ୍ରିନ।
picture-home.plugin.how = "“ଛବି ହୋମ ସ୍କ୍ରିନ” ଚାଲୁ ଥିବା ବେଳେ ହୋମ ସ୍କ୍ରିନକୁ ବଦଳାଏ: ୱିଜେଟ ପଛରେ ଆପଣଙ୍କ ଛବି, ଏବଂ ଆପଣ ସଜାଉଥିବା ୱିଜେଟ ଓ ଟୁଲ୍ସର ପୃଷ୍ଠା। ପ୍ଲଗଇନ ମ୍ୟାନେଜରରେ ଏହାକୁ ବନ୍ଦ କଲେ ମୂଳ ହୋମ ସ୍କ୍ରିନ ତାହାର ପୃଷ୍ଠା ସହିତ ଫେରିଆସେ।\n\nକାର୍ଡରେ ଏକ ଫୋଲ୍ଡରରେ (ମୂଳତଃ wallpapers) ଛବି (JPEG, PNG ବା GIF) ରଖନ୍ତୁ, ତାପରେ “ସେଟିଂସ › କଷ୍ଟମାଇଜ › ଛବି ହୋମ ସ୍କ୍ରିନ”ରେ ଗୋଟିଏ ବାଛନ୍ତୁ। “ଫିଟ” (ପୂରଣ, ପୂରା ଛବି, ଷ୍ଟ୍ରେଚ, ମୂଳ ଆକାର, ଟାଇଲ), “ସ୍ଥିତି”, “ଜୁମ” ଓ “ଛବି ହାଲୁକା” ସେଟ କରନ୍ତୁ: ଫିକା ଛବିରେ ୱିଜେଟ ପଢ଼ିବା ସହଜ। ପ୍ରତ୍ୟେକ ସ୍କ୍ରିନ ଆକାର ପାଇଁ ଛବି ଥରେ ପ୍ରସ୍ତୁତ ହୁଏ।\n\nୱିଜେଟ ଛବି ଉପରେ ପ୍ଲେଟରେ ରହେ। ମୂଳ ହୋମ ସ୍କ୍ରିନ ପରି ପୃଷ୍ଠା ସଜାନ୍ତୁ: ପୃଷ୍ଠା ତଳେ ପେନସିଲ, କିମ୍ବା ମେନୁରେ “ହୋମ ସ୍କ୍ରିନ ଏଡିଟ କରନ୍ତୁ”।\n\nଷ୍ଟାଟସ ବାର (ସମୟ, Wi-Fi, ବ୍ୟାଟେରୀ ବା ଆପଣ ଯାହା ବାଛନ୍ତି) ଚାଲୁ, ବନ୍ଦ ବା ସ୍ୱୟଂଚାଳିତ ହୋଇପାରେ; ଉପରେ ବା ତଳେ; ପୂରା ଚଉଡ଼ା ବା ବାମ, ମଝି ବା ଡାହାଣରେ ଛୋଟ ପିଲ; ହାଲୁକା, ଗାଢ଼ ବା ଧୂସର ପ୍ଲେଟରେ କିମ୍ବା ସିଧା ଛବି ଉପରେ। ବଟନର ନାମ ଥିବା ଧାଡ଼ି (X4ରେ) ମଧ୍ୟ ଚାଲୁ, ବନ୍ଦ ବା ସ୍ୱୟଂଚାଳିତ। ସ୍ୱୟଂଚାଳିତ: ବଟନ ଦବାଇଲେ କିଛି ସେକେଣ୍ଡ ପାଇଁ ଦେଖାଯାଏ; ସେହି ଦବାଇବା ଆଉ କିଛି କରେ ନାହିଁ।\n\n“ଛବି ରେଣ୍ଡରିଂ”: “ଧୂସର ସ୍ତର” ସ୍କ୍ରିନର ସବୁ ଧୂସର ସହିତ (X4ରେ ଧୀର), “ଡିଦରିଂ” କଳା-ଧଳା ବିନ୍ଦୁରେ (ଦ୍ରୁତ), କିମ୍ବା “ସ୍ୱୟଂଚାଳିତ” ମୂଳ ହୋମ ସ୍କ୍ରିନ ପରି: ସ୍କ୍ରିନ ଅଙ୍କାଯିବା ବେଳେ ଧୂସର ସ୍ତର, ପ୍ରଥମ ପରିବର୍ତ୍ତନ ପରେ ବିନ୍ଦୁ। ଧୂସର ସ୍ତର ନଥିବା ସ୍କ୍ରିନରେ ବିନ୍ଦୁ ବ୍ୟବହାର ହୁଏ।"
