notes-overview.plugin.description = ସବୁ ବହିର ବୁକମାର୍କ ଓ ହାଇଲାଇଟ ଗୋଟିଏ ତାଲିକାରେ, ଏବଂ My Clippings.txt ଭାବେ ଏକ୍ସପୋର୍ଟ।
notes-overview.plugin.how = "“ସବୁ ନୋଟ” ସେହି ସବୁ ବହିର ତାଲିକା ଦେଖାଏ ଯେଉଁଥିରେ ଆପଣ ବୁକମାର୍କ ବା ହାଇଲାଇଟ କରିଛନ୍ତି, କେତୋଟି ତାହା ସହିତ। ଏହାକୁ ଟୁଲ୍ସରେ ଖୋଲନ୍ତୁ। ଗୋଟିଏ ବହି ବାଛିଲେ ତାହାର ନୋଟ ଦେଖାଯାଏ, ଗୋଟିଏ ନୋଟ ବାଛିଲେ ବହିଟି ସେହି ସ୍ଥାନରେ ଖୋଲେ।\n\nତାଲିକାର ଶେଷରେ “My Clippings.txt ଭାବେ ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ” ସବୁ ନୋଟକୁ ଗୋଟିଏ ଫାଇଲରେ ଲେଖେ, ଲାଇବ୍ରେରୀ ପାଖରେ ଥିବା Exports ଫୋଲ୍ଡରରେ, Kindle ବ୍ୟବହାର କରୁଥିବା ରୂପରେ (UTF-8)। Kindleର My Clippings.txt ପଢ଼ୁଥିବା ଆପ୍ସ ଏହାକୁ ପଢ଼ିପାରିବେ। Kindle ପରି, ହାଇଲାଇଟ ଉପରେ ଥିବା ନୋଟ ଏକ ଅଲଗା ଏଣ୍ଟ୍ରି। ଏଠାରେ ବହିର Kindle ଲୋକେସନ ନଥିବାରୁ, “location” ହେଉଛି ନୋଟଟି ବହିର କେତେ ପ୍ରତିଶତରେ ଅଛି। ଫାଇଲଟି ପ୍ରତିଥର ନୂଆ କରି ଲେଖାଯାଏ ଓ ପୂର୍ବଟିକୁ ବଦଳାଏ।"
