menu-editor.plugin.name = ମେନୁ ଏଡିଟର
menu-editor.plugin.description = ପ୍ରତ୍ୟେକ ମେନୁର ଏଣ୍ଟ୍ରି ପୁଣି ସଜାଏ, ବାହାର କରେ ଓ ଯୋଡ଼େ।
menu-editor.plugin.how = "ମେନୁ ଏଡିଟର ମେନୁରେ କଣ ଅଛି ତାହା ବଦଳାଏ: ଏଣ୍ଟ୍ରି ଉପରକୁ ବା ତଳକୁ ଘୁଞ୍ଚାନ୍ତୁ, ବାହାର କରନ୍ତୁ, କିମ୍ବା ନୂଆ ଯୋଡ଼ନ୍ତୁ।\n\nସେଟିଂସରେ “କଷ୍ଟମାଇଜ” ତଳେ “ମେନୁ କଷ୍ଟମାଇଜ କରନ୍ତୁ” ଭାବେ ଏହା ମିଳେ। ଏକ ମେନୁ ବାଛନ୍ତୁ, ତାପରେ ଘୁଞ୍ଚାଇବା ବା ବାହାର କରିବା ପାଇଁ ଏକ ଏଣ୍ଟ୍ରି; “ଏଣ୍ଟ୍ରି ଯୋଡ଼ନ୍ତୁ” ନୂଆ ଏଣ୍ଟ୍ରି ରଖେ। ପରିବର୍ତ୍ତନ ତୁରନ୍ତ ଲାଗୁ ହୁଏ। “ଏହି ମେନୁ ରିସେଟ କରନ୍ତୁ” ମେନୁକୁ ତାହାର ପ୍ଲଗଇନ ଯେପରି ସ୍ଥିର କରେ ସେପରି ଫେରାଏ, “ସବୁ ମେନୁ ରିସେଟ କରନ୍ତୁ” ସବୁ ମେନୁ ପାଇଁ ଏହା କରେ।\n\nଆପଣ ନିଜକୁ ବାହାରେ ଅଟକାଇପାରିବେ ନାହିଁ: ସେଟିଂସକୁ ଯିବାର ବାଟ ଥିବା ଏଣ୍ଟ୍ରି, ଆପଣ ଅନ୍ୟ ଏକ ବାଟ ନ ଯୋଡ଼ିବା ପର୍ଯ୍ୟନ୍ତ ରହେ।"
