tasks.plugin.description = ଶେଷ ତାରିଖ ଓ ପ୍ରାଥମିକତା ସହ କରିବାକୁ ଥିବା କାମର ତାଲିକା, ଡିଭାଇସରେ ବା ଆପଣଙ୍କ CalDAV ସର୍ଭର ସହ ସିଙ୍କ, ହୋମ ସ୍କ୍ରିନ ୱିଜେଟ ସହ।
tasks.plugin.how = "ଆପଣଙ୍କ ଡିଭାଇସରେ କାର୍ଯ୍ୟ ତାଲିକା: ଶେଷ ତାରିଖ ଓ ପ୍ରାଥମିକତା ସହ କାର୍ଯ୍ୟ, ଶେଷ ହେଲେ ଟିକ କରାଯାଏ। ସେଟଅପ ବା ନେଟୱାର୍କ ବିନା କାମ କରେ, ଓ CalDAV ସର୍ଭର (Nextcloud, Radicale, Baïkal, Fastmail ଆଦି) ସହ ସିଙ୍କ ହୋଇପାରେ, ଯାହାଦ୍ୱାରା ଫୋନ ଓ କମ୍ପ୍ୟୁଟରରେ ସମାନ ତାଲିକା ଥାଏ।\n\nଟୁଲ୍ସ ମେନୁରୁ “କାର୍ଯ୍ୟ” ଖୋଲନ୍ତୁ। ପ୍ରଥମ ଧାଡ଼ି ଦେଖାଯାଉଥିବା ତାଲିକାର ନାମ; ଅନ୍ୟ ତାଲିକା, “ଆଜି ଓ ବିଳମ୍ବିତ”, ନୂଆ ତାଲିକା, ସିଙ୍କ ବା ଆକାଉଣ୍ଟ ପାଇଁ ଏହାକୁ ବାଛନ୍ତୁ। “ଏକ କାର୍ଯ୍ୟ ଯୋଡ଼ନ୍ତୁ” କିବୋର୍ଡ ଖୋଲେ। କାର୍ଯ୍ୟରେ “ବାଛନ୍ତୁ” ଏହାକୁ ଟିକ କରେ (ପୁଣି: ଶେଷ ହୋଇନାହିଁ)। ଶୀର୍ଷକ, ଶେଷ ତାରିଖ (ଆଜି, କାଲି, ଏକ ସପ୍ତାହରେ, ବା 2026-12-24 ପରି ଟାଇପ କରିଥିବା ତାରିଖ), ପ୍ରାଥମିକତା ବଦଳାଇବାକୁ ବା ବାହାର କରିବାକୁ କାର୍ଯ୍ୟଟି ଧରି ରଖନ୍ତୁ ବା “ମେନୁ” ଦବାନ୍ତୁ। ଖୋଲା କାର୍ଯ୍ୟ ଦିନ ଓ ପ୍ରାଥମିକତା ଅନୁସାରେ ପ୍ରଥମେ ଆସେ; ଶେଷ ହୋଇଥିବା ଏକ ସପ୍ତାହ ତଳେ ରହେ (ସେଟିଂସରେ “କାର୍ଯ୍ୟ”), ତାପରେ ଚାଲିଯାଏ।\n\nହୋମ ସ୍କ୍ରିନ ୱିଜେଟ (ହୋମ ସ୍କ୍ରିନ ଧରି ରଖି ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ): “ଆଜିର କାର୍ଯ୍ୟ”, “କାର୍ଯ୍ୟ ତାଲିକା”, “ଖୋଲା କାର୍ଯ୍ୟ” ଓ “ପରବର୍ତ୍ତୀ କାର୍ଯ୍ୟ”। ୱିଜେଟରେ କାର୍ଯ୍ୟ ଟାପ କଲେ ଟିକ ହୁଏ; ଶୀର୍ଷକ ଟାପ କଲେ ତାଲିକା ଖୋଲେ।\n\nସିଙ୍କ ପାଇଁ ତାଲିକା ଧାଡ଼ିରୁ “CalDAV ଆକାଉଣ୍ଟ” ବାଛି ସର୍ଭର ଠିକଣା, ଉପଯୋଗକର୍ତ୍ତା ନାମ ଓ ପାସୱାର୍ଡ (ଆପ ପାସୱାର୍ଡ ଭଲ) ଦିଅନ୍ତୁ। ସର୍ଭର ଠିକଣା ଯଥେଷ୍ଟ, ଯେପରି cloud.example.com/remote.php/dav; ସର୍ଭରର ପ୍ରତ୍ୟେକ କାର୍ଯ୍ୟ ତାଲିକା ଡିଭାଇସରେ ଏକ ତାଲିକା ହୁଏ। “କାର୍ଯ୍ୟ” ଖୋଲିଲେ, “ଏବେ ସିଙ୍କ କରନ୍ତୁ” ବାଛିଲେ ଓ ନେଟୱାର୍କ ଚାଲୁ ଥିଲେ ସିଙ୍କ ହୁଏ; ନେଟୱାର୍କ ବିନା ପରିବର୍ତ୍ତନ ପରେ ପଠାଯାଏ। ଦୁଇ ସ୍ଥାନରେ ବଦଳିଥିବା କାର୍ଯ୍ୟରେ ସର୍ଭରର ସଂସ୍କରଣ ନିଆଯାଏ ଓ ଆପଣଙ୍କର ନୂଆ କାର୍ଯ୍ୟ ଭାବେ ରହେ। ପୁନରାବୃତ୍ତ କାର୍ଯ୍ୟ ଯେଉଁଠି ତିଆରି, ସେଠାରେ ବଦଳାନ୍ତୁ। ଡିଭାଇସ 12ଟି ତାଲିକାରେ 200ଟି ପର୍ଯ୍ୟନ୍ତ କାର୍ଯ୍ୟ ରଖେ।"
