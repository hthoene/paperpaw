wallabag.unreachable = Wallabag ସହ ସଂଯୋଗ ହୋଇପାରୁନାହିଁ। Wi-Fi ସଂଯୋଗ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
wallabag.unreadable = Wallabag ଏହି ଡିଭାଇସରେ ଅଣାଯାଇଥିବା ଲେଖାର ତାଲିକା ପଢ଼ିପାରୁନାହିଁ, ତେଣୁ କିଛି ବଦଳାଗଲା ନାହିଁ।
wallabag.not-kept = Wallabag ପାସୱାର୍ଡ ବା ସିକ୍ରେଟ ରଖିପାରିଲା ନାହିଁ। ଏହା ବହୁତ ଲମ୍ବା ନୁହେଁ ବୋଲି ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
weather.plugin.name = ପାଣିପାଗ
weather.plugin.description = ବର୍ତ୍ତମାନର ଓ ଆଗାମୀ ଦିନର ପାଣିପାଗ ୱିଜେଟ ଭାବେ, Open-Meteoରୁ।
weather.plugin.how = "ପାଣିପାଗ ହୋମ ସ୍କ୍ରିନ ପାଇଁ ୱିଜେଟରେ ବର୍ତ୍ତମାନର ଓ ଆଗାମୀ ଦିନର ପାଣିପାଗ ଦେଖାଏ, Open-Meteoରୁ, ଯେଉଁଥିପାଇଁ କୌଣସି ଆକାଉଣ୍ଟ ବା କି ଦରକାର ନାହିଁ। ବର୍ତ୍ତମାନର ପାଣିପାଗ ତାପମାତ୍ରା, ଅବସ୍ଥା ଓ ବାଛିବା ପାଇଁ ଅଧିକ ଦେଖାଏ; ପୂର୍ବାନୁମାନ ଆଗାମୀ ଦିନଗୁଡ଼ିକୁ ଏକ ଧାଡ଼ିରେ ବା ତାଲିକାରେ ଦେଖାଏ।\n\nପ୍ରଥମେ ଏକ ସ୍ଥାନ ବାଛନ୍ତୁ: ସେଟିଂସରେ, ପାଣିପାଗ ତଳେ, ସ୍ଥାନ (ଏକ ନାମ ଟାଇପ କରି ମିଳିଥିବା ସ୍ଥାନରୁ ବାଛନ୍ତୁ)। କେବଳ ଏହାର ସ୍ଥାନାଙ୍କ ପଠାଯାଏ, ଏବଂ କେବଳ ପାଣିପାଗ ୱିଜେଟ ଦେଖାଯାଉଥିବା ସମୟରେ। ହୋମ ସ୍କ୍ରିନ ସମ୍ପାଦନ କରି ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ।\n\nପାଣିପାଗ “ସର୍ବାଧିକ ଏତିକି ସମୟରେ ଅପଡେଟ” ଯେତିକି କହେ ତାହାଠାରୁ ଅଧିକ ଥର ଅଣାଯାଏ ନାହିଁ, ଏବଂ କେବଳ ନେଟୱାର୍କ ଥିବା ସମୟରେ: ଏହା କେବେ ନିଜେ Wi-Fi ଚାଲୁ କରେ ନାହିଁ।\n\nପାଣିପାଗ ତଥ୍ୟ Open-Meteo.com (https://open-meteo.com)ରୁ, Creative Commons Attribution 4.0 ଲାଇସେନ୍ସ (CC BY 4.0) ଅଧୀନରେ।"
