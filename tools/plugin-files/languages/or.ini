setup.plugin.name = ସେଟଅପ
setup.plugin.description = ପ୍ରଥମ ଆରମ୍ଭରେ ଦରକାରୀ ସେଟିଂସ ଦେଇ ଏକ ଛୋଟ ଗାଇଡ।
setup.plugin.how = "ସେଟଅପ ହେଉଛି ଦରକାରୀ ସେଟିଂସ ଦେଇ ଏକ ଛୋଟ ଗାଇଡ, PaperPaw ପ୍ରଥମ ଥର ଆରମ୍ଭ ହେଲେ ଥରେ ଦେଖାଯାଏ। ପ୍ରତ୍ୟେକ ପୃଷ୍ଠା ଗୋଟିଏ କଥା ପଚାରେ, ଯେପରି ଭାଷା, ବଟନ, ଟେକ୍ସଟ ଆକାର, ଟାଇମ ଜୋନ, Wi-Fi ବା ଯୋଡ଼ିବା ପାଇଁ କିଛି ପ୍ଲଗଇନ, ଏବଂ ଏକ ଉପଯୁକ୍ତ ଉତ୍ତର ଆଗରୁ ବଛାଯାଇଥାଏ, ତେଣୁ “ପରବର୍ତ୍ତୀ” ସର୍ବଦା ଠିକ। ଏହି ଡିଭାଇସକୁ ଦରକାର ନଥିବା ପଦକ୍ଷେପ ବାଦ ଦିଆଯାଏ।\n\nବଟନ ଉପରେ ଟାପ କରନ୍ତୁ, କିମ୍ବା ଉପର ଓ ତଳ ବଟନ ଏବଂ “ବାଛନ୍ତୁ” ବ୍ୟବହାର କରନ୍ତୁ। ପ୍ରଥମ ପୃଷ୍ଠାରେ “ଛାଡ଼ନ୍ତୁ” ସେଟଅପ ତୁରନ୍ତ ଛାଡ଼େ। ଶେଷ ପୃଷ୍ଠା କହେ ଆପଣଙ୍କ ବହି କେଉଁଠାରୁ ଆସେ।\n\nପୁଣି ଚଲାଇବାକୁ ସେଟିଂସ ଖୋଲି “PaperPaw ସେଟଅପ କରନ୍ତୁ” ବାଛନ୍ତୁ। ଏଠାରେ ବଛାଯାଇଥିବା ସବୁକିଛି ପରେ ସେଟିଂସରେ ବଦଳାଯାଇପାରିବ।"
