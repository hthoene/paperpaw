lock.plugin.name = ସ୍କ୍ରିନ ଲକ
lock.plugin.description = ଡିଭାଇସ ଜାଗିଲେ PIN, ପ୍ୟାଟର୍ନ ବା ପାସୱାର୍ଡ; ପଢ଼ିବା ବେଳେ ଟଚ ଲକ।
lock.plugin.how = "ସ୍କ୍ରିନ ଲକ PaperPaw ଆରମ୍ଭ ହେଲେ ଓ ଡିଭାଇସ ଜାଗିଲେ PIN, ପ୍ୟାଟର୍ନ ବା ପାସୱାର୍ଡ ମାଗେ। ଆରମ୍ଭରେ ଏହା ବନ୍ଦ ଥାଏ। ଏହା କେବଳ ସାଧାରଣ ବ୍ୟବହାର ରୋକେ: କୋଡ ଓ ଭୁଲ ଚେଷ୍ଟାର ସଂଖ୍ୟା SD କାର୍ଡରେ ରହେ, ତେଣୁ ଯିଏ କାର୍ଡ ବାହାର କରେ, ଏଡିଟ କରେ ବା ବଦଳାଏ, ସେ ଲକ ପାର କରିପାରେ।\n\nସେଟିଂସରେ “ଡିଭାଇସ”, “ସ୍କ୍ରିନ ଲକ” ତଳେ ଏହା ସେଟ କରନ୍ତୁ: ବର୍ତ୍ତମାନର କୋଡ ଥିଲେ ତାହା ଦିଅନ୍ତୁ, ପ୍ରକାର ବାଛନ୍ତୁ, ତାପରେ ନୂଆ କୋଡ ଦୁଇଥର ଦିଅନ୍ତୁ। ପ୍ୟାଟର୍ନ କେବଳ ଟଚ ସ୍କ୍ରିନରେ ମିଳେ।\n\nପାଞ୍ଚଟି ଭୁଲ ଚେଷ୍ଟା ପରେ ପରବର୍ତ୍ତୀ ଚେଷ୍ଟା ପାଇଁ ଅଧ ମିନିଟ ଅପେକ୍ଷା କରିବାକୁ ହୁଏ। “ବର୍ତ୍ତମାନ ଲକ କରନ୍ତୁ” ତୁରନ୍ତ ଲକ କରେ ଏବଂ ଏକ ବଟନ, ଜେଶ୍ଚର ବା ନିୟମରେ ରଖାଯାଇପାରେ। “ଜାଗିବା ପରେ ଲକ” ବନ୍ଦ କଲେ କେବଳ ପ୍ରକୃତ ଆରମ୍ଭ (ଚାଲୁ କରିବା ବା ରିଷ୍ଟାର୍ଟ) ଲକ କରେ, କିନ୍ତୁ ଯେଉଁଠି ପ୍ରତ୍ୟେକ ଜାଗରଣ ଏକ ଆରମ୍ଭ, ଯେପରି ବ୍ୟାଟେରୀରେ X4, ସେଠାରେ ନୁହେଁ।\n\nଟଚ ଲକ: କ୍ୱିକ ପ୍ୟାନେଲ ଓ ପଢ଼ିବା ମେନୁରେ “ଟଚ ଲକ କରନ୍ତୁ” ଟାପ, ସ୍ୱାଇପ ଓ ପେନକୁ ନିଷ୍କ୍ରିୟ କରେ, କିନ୍ତୁ ବଟନ କାମ କରେ, ଯେପରି ସ୍କ୍ରିନରେ ହାତ ରଖି ପଢ଼ିବା ପାଇଁ। ଅନଲକ କରିବାକୁ ଗୋଟିଏ ଆଙ୍ଗୁଠିରେ ଦୁଇଥର ଟାପ କରି କିଛି କ୍ଷଣ ଧରି ରଖନ୍ତୁ; ପାୱାର ବଟନ ଧରି ରଖିଲେ ପାୱାର ମେନୁ ଖୋଲେ, ଯେଉଁଠି “ଟଚ ଅନଲକ କରନ୍ତୁ” ବଟନରେ ଅନଲକ କରେ; X4 Proରେ ହୋମ ବଟନ ଧରି ରଖିଲେ ତୁରନ୍ତ ଅନଲକ ହୁଏ।"
