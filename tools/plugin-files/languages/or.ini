store.plugin.how = "ପ୍ଲଗଇନ ଷ୍ଟୋର ଇଣ୍ଟରନେଟରୁ ଏହି ଡିଭାଇସ ପାଇଁ ପ୍ଲଗଇନ ଖୋଜେ, ଇନଷ୍ଟଲ, ଅପଡେଟ ଓ ବାହାର କରେ। ଏହାକୁ ଟୁଲ୍ସରୁ ଖୋଲନ୍ତୁ; Wi-Fi ଦରକାର।\n\nଆରମ୍ଭରେ ସୁପାରିଶ, ନୂଆ ଓ ଲୋକପ୍ରିୟ ପ୍ଲଗଇନ, ତାପରେ ଗୋଷ୍ଠୀ ଦେଖାଯାଏ। ଗୋଷ୍ଠୀର ତାଲିକା ପ୍ରତିଦିନ ବଦଳୁଥିବା ମିଶ୍ରଣରେ ଥାଏ; A ରୁ Z, ନୂଆ ବା ଶେଷ ଅପଡେଟ ଅନୁସାରେ ସଜାନ୍ତୁ, ଲମ୍ବା ତାଲିକାରେ ଏକ ଅକ୍ଷରକୁ ଯାଆନ୍ତୁ। ଗୋଟିଏ ଖୋଲିଲେ ତାହାର ଆକାର ଓ ମେମୋରୀ ଦେଖାଯାଏ; ତାପରେ ଇନଷ୍ଟଲ, ଅପଡେଟ ବା ବାହାର କରନ୍ତୁ। “ସବୁ ଅପଡେଟ କରନ୍ତୁ” ସବୁ ଇନଷ୍ଟଲ ହୋଇଥିବା ପ୍ଲଗଇନକୁ ଅପଡେଟ କରେ।\n\nକୋଡ ପ୍ଲଗଇନ ଡିଭାଇସର ପୂର୍ଣ୍ଣ ଆକ୍ସେସ ସହ ଚାଲେ: ଷ୍ଟୋର ଏହା କହି ପ୍ରଥମେ ପଚାରେ, ଓ ସେଗୁଡ଼ିକ ରିଷ୍ଟାର୍ଟ ପରେ ଆରମ୍ଭ ହୁଏ। କିଛି ଭୁଲ ହେଲେ PaperPaw କୋଡ ପ୍ଲଗଇନ ବିନା ଆରମ୍ଭ ହୁଏ ଓ କେଉଁଟି ତାହା କହେ। “ପ୍ଲଗଇନ ଲାଇବ୍ରେରୀ” ତାଲିକାର ଉତ୍ସ ସ୍ଥିର କରେ।\n\nସେଟିଂସ › ସିଷ୍ଟମରେ “କମ୍ୟୁନିଟି ପ୍ଲଗଇନ” ଅନ୍ୟମାନେ GitHubରେ ପ୍ରକାଶ କରିଥିବା ପ୍ଲଗଇନ ମଧ୍ୟ ଦେଖାଏ। ସେଗୁଡ଼ିକ “ଯାଞ୍ଚ ହୋଇନାହିଁ” ଭାବେ ଚିହ୍ନିତ, କୋଡ ପ୍ଲଗଇନର ପୃଷ୍ଠା ତାହାର ସାଇନ କି ଦେଖାଏ, ଓ ଅନ୍ୟ କି ଦ୍ୱାରା ସାଇନ ହୋଇଥିବା ଅପଡେଟ ଇନଷ୍ଟଲ ହୁଏ ନାହିଁ।\n\nଆରମ୍ଭର ଶେଷ ଧାଡ଼ି “ଉତ୍ସ” ଅନ୍ୟମାନଙ୍କ ପ୍ଲଗଇନ ତାଲିକା ଠିକଣା (https://…/plugins.json) ଦ୍ୱାରା ଯୋଡ଼େ, ଦେଖାଏ ବା ବାହାର କରେ। ଟାଇପ ବଦଳରେ, ଧାଡ଼ି ପ୍ରତି ଗୋଟିଏ ଠିକଣା ଥିବା sources.txt ଫାଇଲ କାର୍ଡର .paperpaw/plugins/storeରେ ରଖନ୍ତୁ। ଠିକଣାଗୁଡ଼ିକ “ଉତ୍ସ”ରେ ନୂଆ ଭାବେ ଦେଖାଯାଏ। PaperPaw ଉତ୍ସ ଓ ତାହାର ପ୍ଲଗଇନ ଯାଞ୍ଚ କରେ ନାହିଁ, ଓ ଡିଭାଇସ ଉତ୍ସର ସର୍ଭର ସହ ଯୋଗାଯୋଗ କରେ। ଡିଭାଇସ ପ୍ରଥମ ତାଲିକାର କି ମନେ ରଖେ ଓ ପରେ କେବଳ ସେହି କି ଦ୍ୱାରା ସାଇନ ହୋଇଥିବା ତାଲିକା ଓ କୋଡ ପ୍ଲଗଇନ ନିଏ। ପ୍ଲଗଇନ କେବଳ ନିଜ ଉତ୍ସରୁ ଅପଡେଟ ପାଏ। PaperPawର ନିଜ ଲାଇବ୍ରେରୀ ସବୁବେଳେ ରହେ ଓ ବାହାର କରିହୁଏ ନାହିଁ; ଷ୍ଟୋର ଛାଡ଼ିଲେ ତାହାକୁ ଫେରେ।"
