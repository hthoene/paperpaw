file-manager.plugin.name = ଫାଇଲ ମ୍ୟାନେଜର
file-manager.plugin.description = ଡିଭାଇସର ପ୍ରତ୍ୟେକ ଫୋଲ୍ଡର ଓ ଫାଇଲ: ଖୋଲନ୍ତୁ, ନାମ ବଦଳାନ୍ତୁ, ଘୁଞ୍ଚାନ୍ତୁ, କପି ଓ ଡିଲିଟ କରନ୍ତୁ।
file-manager.plugin.how = "ଫାଇଲ ମ୍ୟାନେଜର ଡିଭାଇସ ଷ୍ଟୋରେଜର ପ୍ରତ୍ୟେକ ଫୋଲ୍ଡର ଓ ଫାଇଲ ଦେଖାଏ, କେବଳ ଆପଣଙ୍କ ବହି ନୁହେଁ, ଏବଂ ସେଗୁଡ଼ିକୁ ଖୋଲିବା, ନାମ ବଦଳାଇବା, ଘୁଞ୍ଚାଇବା, କପି କରିବା, ଡିଲିଟ କରିବା ଓ ନୂଆ ଫୋଲ୍ଡର ତିଆରି କରିବାକୁ ଦିଏ।\n\nଟୁଲ୍ସ ମେନୁରୁ “ଫାଇଲ” ଖୋଲନ୍ତୁ। ଫୋଲ୍ଡର ଭିତରକୁ ଯିବାକୁ ତାହାକୁ ଟାପ କରନ୍ତୁ; “ପଛକୁ” ଉପର ଫୋଲ୍ଡରକୁ ଯାଏ। ଏକ ଫାଇଲରେ କଣ କରିହେବ ଦେଖିବାକୁ ତାହାକୁ ଟାପ କରନ୍ତୁ, କିମ୍ବା ଯେକୌଣସି ଏଣ୍ଟ୍ରି ଧରି ରଖନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ)। “ଘୁଞ୍ଚାନ୍ତୁ” ଓ “କପି କରନ୍ତୁ” ଏଣ୍ଟ୍ରିଟି ଉଠାଏ: ଯେଉଁ ଫୋଲ୍ଡରକୁ ଯିବ ସେଠାକୁ ଯାଇ ତଳ ବାରରେ “ଏଠାରେ ପେଷ୍ଟ କରନ୍ତୁ” ବାଛନ୍ତୁ। ବଟନରେ ବାରକୁ ଯିବାକୁ ଶେଷ ଏଣ୍ଟ୍ରିରୁ “ତଳକୁ” ଦବାନ୍ତୁ।\n\nଡଟ (.)ରେ ଆରମ୍ଭ ହେଉଥିବା ଫାଇଲ ଓ ଫୋଲ୍ଡର, ଯେପରି PaperPawର ନିଜ ଡାଟା, ଲୁଚି ରହେ। ସେଗୁଡ଼ିକ ଦେଖିବାକୁ ସେଟିଂସ › ଲାଇବ୍ରେରୀରେ “ଲୁଚିଥିବା ଫାଇଲ” ଚାଲୁ କରନ୍ତୁ।"
