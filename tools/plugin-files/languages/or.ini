battery.plugin.name = ବ୍ୟାଟେରୀ ବ୍ୟବହାର
battery.plugin.description = ବ୍ୟାଟେରୀ ରେକର୍ଡ କରେ ଓ ଏହା କେତେ ସମୟ ଚାଲେ ଦେଖାଏ।
battery.plugin.how = "ବ୍ୟାଟେରୀ ବ୍ୟବହାର ଡିଭାଇସ ଜାଗ୍ରତ ଥିବାବେଳେ ପ୍ରାୟ ପ୍ରତି ମିନିଟରେ ଥରେ ଚାର୍ଜ ଲେଖିରଖେ, ସେତେବେଳେ ଡିଭାଇସ କଣ କଲା ତାହା ସହ: ସ୍କ୍ରିନ ରିଫ୍ରେସ ଓ ଓଲଟାଯାଇଥିବା ପୃଷ୍ଠା। ସେଥିରୁ ଏହା ହିସାବ କରେ ଜାଗ୍ରତ ଥିବା ଏକ ଘଣ୍ଟା ଓ 100 ପୃଷ୍ଠା କେତେ ନିଏ, ଏବଂ ସେହି ଗତିରେ ବ୍ୟାଟେରୀ କେତେ ସମୟ ଚାଲିବ।\n\nଟୁଲ୍ସ ମେନୁରୁ ବ୍ୟାଟେରୀ ଖୋଲନ୍ତୁ। ଏହା ବର୍ତ୍ତମାନର ଚାର୍ଜ, ଏଥରର ଜାଗ୍ରତ ସମୟ, ଏପର୍ଯ୍ୟନ୍ତ ବ୍ୟାଟେରୀରେ ବ୍ୟବହାର ଓ ସାମ୍ପ୍ରତିକ ଜାଗ୍ରତ ସମୟ ଦେଖାଏ। ପୃଷ୍ଠା ବଟନ ଦ୍ୱାରା, ବା ଉପରେ ଥିବା ତୀର ଟାପ କରି ପୃଷ୍ଠା ବଦଳାନ୍ତୁ।\n\nସଂଖ୍ୟାଗୁଡ଼ିକ ଅର୍ଥପୂର୍ଣ୍ଣ ହେବା ପୂର୍ବରୁ ବ୍ୟାଟେରୀରେ କିଛି ସମୟ ପଢ଼ିବା ଦରକାର। ରେକର୍ଡିଂ ଡିଫଲ୍ଟ ଭାବେ ଚାଲୁ ଥାଏ ଓ ସେଟିଂସରେ, ଡିଭାଇସ, ପାୱାର ତଳେ “ବ୍ୟାଟେରୀ ବ୍ୟବହାର ରେକର୍ଡ କରନ୍ତୁ” ଭାବେ ବନ୍ଦ କରିହେବ।"
