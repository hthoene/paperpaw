plugin-manager.code.safe-mode-off = ସେଫ ମୋଡ ଦ୍ୱାରା ବନ୍ଦ: କୋଡ ଥିବା ପ୍ଲଗଇନଗୁଡ଼ିକୁ ଗୋଟି ଗୋଟି କରି ପୁଣି ଚାଲୁ କରନ୍ତୁ।
plugin-manager.code.not-installed = ଷ୍ଟୋର ବା ୱେବ ଫ୍ଲାସରରୁ ଇନଷ୍ଟଲ ହୋଇନାହିଁ: ଏହାର କୋଡ ଚାଲେ ନାହିଁ। ସେଠାରୁ ଇନଷ୍ଟଲ କରନ୍ତୁ।
