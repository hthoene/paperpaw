home.plugin.name = ହୋମ ସ୍କ୍ରିନ
home.plugin.description = ଆରମ୍ଭ ପୃଷ୍ଠା: ୱିଜେଟର ପୃଷ୍ଠା, ଯେପରି ପଢ଼ାଯାଉଥିବା ବହି ଓ ଟୁଲ୍ସ।
home.plugin.how = "ହୋମ ସ୍କ୍ରିନ କିଛି ପୃଷ୍ଠାରେ ଗଠିତ, ପ୍ରତ୍ୟେକ ପୃଷ୍ଠା ଫୋନ ପରି ୱିଜେଟ ଓ ଟୁଲ୍ସର ଏକ ଗ୍ରିଡ। ଆରମ୍ଭରେ ଘଡ଼ି, ଆପଣ ପଢ଼ୁଥିବା ବହି ଓ ନିକଟରେ ପଢ଼ାଯାଇଥିବା ବହି ଗୋଟିଏ ପୃଷ୍ଠାରେ, ଏବଂ ସବୁ ଟୁଲ୍ସ ପରବର୍ତ୍ତୀ ପୃଷ୍ଠାରେ ଥାଏ।\n\nଖୋଲିବାକୁ ଏକ ଆଇଟମ ଟାପ କରନ୍ତୁ; ପୃଷ୍ଠା ବଦଳାଇବାକୁ ସ୍ୱାଇପ କରନ୍ତୁ ବା ପୃଷ୍ଠା ବଟନ ଦବାନ୍ତୁ। କେବଳ ବଟନରେ, ତୀର ବଟନ ଗୋଟିଏ ଆଇଟମରୁ ଆରକୁ ଯାଏ ଏବଂ “ବାଛନ୍ତୁ” ତାହା ଖୋଲେ।\n\nସଜାଇବାକୁ ହୋମ ସ୍କ୍ରିନ ଧରି ରଖନ୍ତୁ, ପୃଷ୍ଠା ତଳେ ପେନସିଲ ଟାପ କରନ୍ତୁ ବା ମେନୁରେ “ହୋମ ସ୍କ୍ରିନ ଏଡିଟ କରନ୍ତୁ” ବାଛନ୍ତୁ। ଆଇଟମ ଘୁଞ୍ଚାଇବାକୁ ଟାଣନ୍ତୁ ବା ତାହାର ବିକଳ୍ପ ପାଇଁ ଟାପ କରନ୍ତୁ, ବଟନରେ ମଧ୍ୟ। “ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ” ମଧ୍ୟ ସେଠାରେ ଅଛି। “ସ୍ତମ୍ଭ” ଓ “ଧାଡ଼ି” ସେଟିଂସରେ “ରୂପ” ତଳେ “ହୋମ ସ୍କ୍ରିନ” ବିଭାଗରେ ଅଛି।\n\nସ୍କ୍ରିନ ଲ୍ୟାଣ୍ଡସ୍କେପରେ ଥିଲେ ହୋମ ସ୍କ୍ରିନ ସେହି ଆଇଟମ ଅଧିକ ସ୍ତମ୍ଭରେ ଦେଖାଏ, କାର୍ଡ ପ୍ରାୟ 110 ମି.ମି.ରୁ ଅଧିକ ଚଉଡ଼ା ନୁହେଁ; ସିଧା ସ୍କ୍ରିନରେ ସଜାଯାଇଥିବା କିଛି ବଦଳେ ନାହିଁ। ଲ୍ୟାଣ୍ଡସ୍କେପରେ ସଜାଇଲେ ସେହି ଲେଆଉଟ ସେହି ଦିଗ ପାଇଁ ଅଲଗା ରହେ; ନୂଆ ୱିଜେଟ ଦୁଇଟିରେ ଯୋଡ଼ାଯାଏ। ଏଡିଟ ବେଳେ “ଯୋଡ଼ନ୍ତୁ”ରେ ଥିବା “ଲ୍ୟାଣ୍ଡସ୍କେପ ଲେଆଉଟ ରିସେଟ କରନ୍ତୁ” ସ୍ୱୟଂଚାଳିତ ଲେଆଉଟକୁ ଫେରେ। ଗୋଟିଏ ଦିଗରୁ ବାହାର କରାଯାଇଥିବା ୱିଜେଟ ବା ଟୁଲ ଅନ୍ୟ ଦିଗରୁ ବାହାରେ ନାହିଁ।"
