fonts-browser.plugin.name = ଅଧିକ ଫଣ୍ଟ
fonts-browser.plugin.description = ଇଣ୍ଟରନେଟରୁ ଫଣ୍ଟ ଦେଖାଏ, ପ୍ରତ୍ୟେକ ଏକ ନମୁନା ସହ, ଏବଂ ପଢ଼ିବା ପାଇଁ ସେଗୁଡ଼ିକୁ ଡାଉନଲୋଡ କରେ।
fonts-browser.plugin.how = "“ଅଧିକ ଫଣ୍ଟ” ଇଣ୍ଟରନେଟର ଏକ ଫଣ୍ଟ ଲାଇବ୍ରେରୀରୁ ଫଣ୍ଟ ଦେଖାଏ, ପ୍ରତ୍ୟେକ ନାମ ତାହାର ନିଜ ଫଣ୍ଟରେ, ଏବଂ ଆପଣ ଚାହୁଁଥିବା ଫଣ୍ଟ ଡାଉନଲୋଡ କରେ।\n\nଏହା ସେଟିଂସ › ପଢ଼ିବା › “ଫଣ୍ଟ”ର ତାଲିକା ଶେଷରେ ଅଛି; ଷ୍ଟାଟସ ଲାଇନର ଫଣ୍ଟ ପାଇଁ ମଧ୍ୟ ସମାନ ଏଣ୍ଟ୍ରି ଅଛି। ନମୁନା ବାକ୍ୟ ସହ ବଡ଼ କରି ଦେଖିବାକୁ ଏକ ଫଣ୍ଟ ଟାପ କରନ୍ତୁ (ବଟନରେ “ବାଛନ୍ତୁ”), ତାପରେ “ଡାଉନଲୋଡ” ବାଛନ୍ତୁ। ଡାଉନଲୋଡ ବେଳେ ପୃଷ୍ଠା ଛାଡ଼ିପାରିବେ। ଶେଷ ହେଲେ “(ଫଣ୍ଟ ନାମ) ସହ ପଢ଼ନ୍ତୁ” ବା “ଷ୍ଟାଟସ ଲାଇନ ପାଇଁ ବ୍ୟବହାର କରନ୍ତୁ” ବାଛନ୍ତୁ। “ଅପଡେଟ” ନୂଆ ସଂସ୍କରଣ ଆଣେ, “ବାହାର କରନ୍ତୁ” ଫଣ୍ଟ ଡିଲିଟ କରେ। Wi-Fi ଦରକାର।\n\nନିଜ ଫଣ୍ଟ\n\nସେହି ତାଲିକାରେ “ନିଜ ଫଣ୍ଟ” ଏହି ସାହାଯ୍ୟ ଅଂଶ ଦେଖାଏ। ନିଜ ଫଣ୍ଟ ହେଉଛି ଏକ .ttf ବା .otf ଫାଇଲ, ଯଥା Google Fontsରୁ।\n\nAndroid ଓ ଫଣ୍ଟ ଫାଇଲ ଆଙ୍କୁଥିବା ଅନ୍ୟ ଡିଭାଇସରେ: ଫାଇଲଟି fonts ଫୋଲ୍ଡରରେ କପି କରନ୍ତୁ (Androidରେ ସେୟାର୍ଡ ଷ୍ଟୋରେଜର PaperPaw/fonts), PaperPaw ରିଷ୍ଟାର୍ଟ କରି ସେଟିଂସ › ପଢ଼ିବା › “ଫଣ୍ଟ”ରେ ବାଛନ୍ତୁ।\n\nXteink X4 ଓ X4 Proରେ: ଏମାନେ ଫଣ୍ଟ ଫାଇଲ ନୁହେଁ, ଫଣ୍ଟ ପ୍ୟାକ ପଢ଼ନ୍ତି, କାରଣ ଫାଇଲ ମେମୋରୀରେ ଫିଟ ହୁଏ ନାହିଁ। କମ୍ପ୍ୟୁଟରରେ paperpaw-fontgen ଦ୍ୱାରା ପ୍ରତ୍ୟେକ ଷ୍ଟାଇଲ ସହ ଏକ ପ୍ୟାକ ତିଆରି କରନ୍ତୁ (regular ଦରକାର):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nଏହା plugins/font-my-font ଫୋଲ୍ଡର ତିଆରି କରେ। ଏହାକୁ ମେମୋରୀ କାର୍ଡର plugins ଫୋଲ୍ଡରରେ କପି କରି ରିଷ୍ଟାର୍ଟ କରନ୍ତୁ ଓ “ଫଣ୍ଟ”ରେ My Font ବାଛନ୍ତୁ। ଛାଡ଼ିଥିବା ଷ୍ଟାଇଲ regularରେ ଆଙ୍କାଯାଏ। ଟୁଲ କହେ ଫଣ୍ଟରେ ମାଗିଥିବା ଅକ୍ଷରର କେତେ ଅଛି (--chars latin,cyrillic,greek ଲିପି ଯୋଡ଼େ): ବହିର ଲିପି ନଥିବା ଫଣ୍ଟ ତାହା ଦେଖାଇପାରିବ ନାହିଁ। “ଅଧିକ ଫଣ୍ଟ”ର ଫଣ୍ଟ ସେହିପରି କାମ କରେ, କମ୍ପ୍ୟୁଟର ବିନା।\n\ne-ink ପ୍ୟାନେଲରେ ଛୋଟ ଟେକ୍ସଟ ସ୍ପଷ୍ଟ କରିବାକୁ --hinting light ଯୋଡ଼ନ୍ତୁ: ଏହା ଅକ୍ଷରକୁ ପିକ୍ସେଲ ଗ୍ରିଡରେ ମିଳାଏ; --hinting normal ଓ --hinting mono ଅଧିକ ଜୋରରେ ମିଳାଏ। ଓଡ଼ିଆ, ଆରବୀ ବା ଦେବନାଗରୀ ପରି ଚିହ୍ନଯୁକ୍ତ ଫଣ୍ଟରେ ଏହା ନଯୋଡ଼ିବା ଭଲ।"
