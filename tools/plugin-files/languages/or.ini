reading-goal.plugin.name = ପଢ଼ିବା ଲକ୍ଷ୍ୟ
reading-goal.plugin.description = ଦିନକୁ କେତେ ମିନିଟ ପଢ଼ିବେ, ଓ ହୋମ ସ୍କ୍ରିନରେ ଏକ ବିଲେଇ ଯାହାର ମନ ଆଜିର ପଢ଼ିବା ଅନୁସାରେ ବଦଳେ।
reading-goal.plugin.how = "ହୋମ ସ୍କ୍ରିନରେ ଏକ ବିଲେଇ ଦେଖାଏ ଆଜି ପଢ଼ିବା କେମିତି ଚାଲିଛି: ଆପଣ ଏପର୍ଯ୍ୟନ୍ତ ନପଢ଼ିଲେ ଦୁଃଖୀ, ଟିକେ ପଢ଼ିବା ପରେ ସାଧାରଣ, ଦୈନିକ ଲକ୍ଷ୍ୟର ଅଧା ପରଠାରୁ ସନ୍ତୁଷ୍ଟ, ଲକ୍ଷ୍ୟ ପୂରଣ ହେଲେ ଖୁସି।\n\nହୋମ ସ୍କ୍ରିନରେ “ପଢ଼ିବା ବିଲେଇ” ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ (ହୋମ ସ୍କ୍ରିନ ଧରି ରଖନ୍ତୁ, ତାପରେ ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ), କିମ୍ବା ସ୍ଲିପ ସ୍କ୍ରିନ ଭାବେ “ଆଜିର ପଢ଼ିବା ବିଲେଇ” ବାଛନ୍ତୁ। ବିଲେଇ ଉପରେ ଟାପ କଲେ ଦୈନିକ ଲକ୍ଷ୍ୟ ଖୋଲେ; ଏହା ପଢ଼ିବା ପରିସଂଖ୍ୟାନର ଲକ୍ଷ୍ୟ, ଯାହା ଆପଣ ପଢ଼ିଥିବା ମିନିଟ ଗଣେ।\n\nସେଟିଂସରେ “ପଢ଼ିବା” ତଳେ, “ସନ୍ତୁଷ୍ଟ ଏଠାରୁ” ଓ “ଖୁସି ଏଠାରୁ” ସ୍ଥିର କରେ ଲକ୍ଷ୍ୟର କେତେ ଅଂଶରୁ ବିଲେଇ ସନ୍ତୁଷ୍ଟ ବା ଖୁସି ହେବ, ଏବଂ “ନିଜ ଛବି” ବିଲେଇ ବଦଳରେ ଦେଖାଇବା ପାଇଁ ଛବି (sad, meh, content ଓ happy) ଥିବା ଏକ ଫୋଲ୍ଡର। ଛବିଗୁଡ଼ିକ PNG ବା JPEG ଫାଇଲ; ଫୋଲ୍ଡର ନଥିଲେ ବିଲେଇ ଦେଖାଯାଏ।"
