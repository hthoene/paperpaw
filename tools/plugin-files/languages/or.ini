core.clean-up.text = ସେଗୁଡ଼ିକର ପଢ଼ିବା ସ୍ଥାନ, ବୁକମାର୍କ, ହାଇଲାଇଟ ଓ ନୋଟ ସବୁଦିନ ପାଇଁ ଚାଲିଯିବ। କମ୍ପ୍ୟୁଟରରେ ନାମ ବଦଳାଯାଇଥିବା ବା ଘୁଞ୍ଚାଯାଇଥିବା ବହି, କିମ୍ବା ଲଗାଯାଇନଥିବା ମେମୋରୀ କାର୍ଡରେ ଥିବା ବହି ମଧ୍ୟ ମିଳେ ନାହିଁ।
