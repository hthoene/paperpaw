format-images.plugin.name = ଛବି
format-images.plugin.description = ଛବି (.jpg, .png, .gif) ବହି ଭାବେ ଖୋଲେ, ପ୍ରତି ପୃଷ୍ଠାରେ ଗୋଟିଏ।
format-images.plugin.how = "ଛବି (.jpg, .png, .gif) ଲାଇବ୍ରେରୀରୁ ବହି ପରି ଖୋଲେ, ପ୍ରତି ପୃଷ୍ଠାରେ ଗୋଟିଏ ଛବି, ସ୍କ୍ରିନରେ ଫିଟ।\n\nଛବିର ପୂରା ଫୋଲ୍ଡର ପଢ଼ିବାକୁ ତାହାର ପ୍ରଥମ ଛବି ଖୋଲନ୍ତୁ: ଫୋଲ୍ଡରରେ ତାହା ପରର ଛବିଗୁଡ଼ିକ ନାମର କ୍ରମରେ (2 ପରେ 10) ଆସେ। ଫୋଲ୍ଡରର ପରବର୍ତ୍ତୀ ଏକ ଛବି ଖୋଲିଲେ ସେଠାରୁ ଆରମ୍ଭ ହୁଏ; ପ୍ରତ୍ୟେକର ପଢ଼ିବା ସ୍ଥାନ ଅଲଗା ମନେ ରଖାଯାଏ। 300 ପର୍ଯ୍ୟନ୍ତ ଛବିର ଫୋଲ୍ଡର ଆପଣ ଖୋଲିଥିବା ଛବିରୁ ପଢ଼ାଯାଏ।\n\nଛବି ନଥିବା ବା ବହୁତ ବଡ଼ ଫାଇଲ ବଦଳରେ ତାହାର ନାମ ଦେଖାଏ। ନିଜ ଶୀର୍ଷକ ଥିବା ଅନେକ ଛବିର ବହି ପାଇଁ କମିକ ବହି ଆର୍କାଇଭ (.cbz) ଭଲ ଫର୍ମ।"
format-images.title = ଛବି
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ଫାଇଲ (.md), ଯଥା ନୋଟ, ଖୋଲେ।
format-markdown.plugin.how = "Markdown ଫାଇଲ (.md), ଯେପରି ନୋଟ, ବହି ଭାବେ ଖୋଲେ: ହେଡିଂ, ତାଲିକା, ଉଦ୍ଧୃତି ଓ ଜୋର ଯେପରି ବୁଝାଯାଇଛି ସେପରି, ଚିହ୍ନ ଭାବେ ନୁହେଁ।\n\nଫାଇଲଗୁଡ଼ିକୁ ଲାଇବ୍ରେରୀ ଫୋଲ୍ଡରରେ ରଖି ଲାଇବ୍ରେରୀରୁ ଖୋଲନ୍ତୁ। ପ୍ରଥମ ହେଡିଂ ଏହାର ଶୀର୍ଷକ; ଫାଇଲ ପାଖରେ ଥିବା ଛବି ଟେକ୍ସଟ ଯେଉଁଠି ସେଗୁଡ଼ିକର ନାମ ନିଏ ସେଠାରେ ଦେଖାଯାଏ।"
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI ବହି
format-mobi.plugin.description = DRM ବିନା .mobi ଓ .azw ଫାଇଲ ଖୋଲେ।
format-mobi.plugin.how = "MOBI ବହି (.mobi, .azw) ଅନ୍ୟ ବହି ପରି ଲାଇବ୍ରେରୀରୁ ଖୋଲେ, କିଛି ସେଟଅପ ଦରକାର ନାହିଁ। ଶୀର୍ଷକ, ଲେଖକ, ଭାଷା ଓ କଭର ବହିରୁ ଆସେ, ଏବଂ ବିଷୟସୂଚୀ ତାହାର ଶିରୋନାମାରୁ ତିଆରି ହୁଏ।\n\nପ୍ରଥମ ଥର ଖୋଲିବା ବେଳେ ବହିଟି ରୂପାନ୍ତରିତ ହୁଏ, ଲମ୍ବା ବହି ପାଇଁ କିଛି ସେକେଣ୍ଡ ଲାଗେ; ତାପରେ ଏହା ତୁରନ୍ତ ଖୋଲେ। ଟେକ୍ସଟ, ଶିରୋନାମା, ବୋଲ୍ଡ ଓ ଇଟାଲିକ, ଲିଙ୍କ ଓ ଛବି ଦେଖାଯାଏ।\n\nDRM ଥିବା ବହି (ଦୋକାନରୁ କିଣାଯାଇଥିବା ଅଧିକାଂଶ ବହି), Huffman କମ୍ପ୍ରେସନ ଥିବା ବହି ବା ନୂଆ KF8 ଫର୍ମରେ (.azw3) ଥିବା ବହି ଖୋଲିହେବ ନାହିଁ: ଖୋଲିବା ବେଳେ PaperPaw ଏହା କହେ। Calibre ପରି ଏକ ଟୁଲରେ ତିଆରି EPUB କପି ସବୁବେଳେ ଖୋଲେ।"
format-mobi.title = MOBI ବହି
