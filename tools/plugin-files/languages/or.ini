sleep.plugin.description = ଡିଭାଇସ ସ୍ଲିପରେ ଥିବା ବେଳେ ଶୋଇଥିବା ବିଲେଇ, ବହିର କଭର, ଆପଣଙ୍କ ଛବି ବା ଏକ ବାର୍ତ୍ତା ଦେଖାଏ।
sleep.plugin.how = "ଡିଭାଇସ ସ୍ଲିପରେ ଥିବା ବେଳେ ସ୍କ୍ରିନ କଣ ଦେଖାଇବ, ତାହା ସ୍ଲିପ ସ୍କ୍ରିନ ସ୍ଥିର କରେ। e-ink ବିଦ୍ୟୁତ ବିନା ଛବି ରଖେ।\n\nସେଟିଂସରେ “ଡିଭାଇସ” › “ସ୍ଲିପ ସ୍କ୍ରିନ” › “ଦେଖାନ୍ତୁ”ରେ ବାଛନ୍ତୁ: ଶୋଇଥିବା ବିଲେଇ (ଡିଫଲ୍ଟ), ବହିର କଭର, ମୋ ଛବି, ଲୋଗୋ ଓ “ସ୍ଲିପ ମୋଡ”, ୱିଜେଟ, ପୃଷ୍ଠା ଯେପରି ଅଛି, କିମ୍ବା ଛବି ସହ ପୃଷ୍ଠା। “ମୋ ଛବି” ଛବି ଫୋଲ୍ଡରର ଫାଇଲ ଗୋଟିଏ ପରେ ଗୋଟିଏ ଦେଖାଏ। କଭର ବା ଛବି ନଥିଲେ ବିଲେଇ ଦେଖାଯାଏ। ଯେଉଁଠି ସିଷ୍ଟମ ନିଜେ ସ୍ଲିପ ସ୍କ୍ରିନ ଆଙ୍କେ, ସେଠାରେ ଏହି ସେଟିଂସ ଲୁଚିଥାଏ।\n\n“ବନ୍ଦ ହେଲେ ଦେଖାନ୍ତୁ” ସ୍କ୍ରିନ ଡିଭାଇସ ବନ୍ଦ ହେବା ବେଳେ ଥରେ ଆଙ୍କାଯାଏ (ପାୱାର ମେନୁରୁ ବା ସ୍ଲିପ ପରେ ବନ୍ଦ ହେବାର ସମୟ ପରେ; ବ୍ୟାଟେରୀ ସରିଗଲେ ନୁହେଁ)। ଲୋଗୋ ଓ “ବନ୍ଦ ହୋଇଛି”, ବିଲେଇ, କଭର ବା ମୋ ଛବି ନବାଛିଲେ ଏହା ସ୍ଲିପ ସ୍କ୍ରିନ ପରି। ଅନ୍ୟ ପ୍ଲଗଇନ ଏଥିପାଇଁ ସ୍କ୍ରିନ ଦେଇପାରେ।\n\n“ଆରମ୍ଭ ବେଳେ ଦେଖାନ୍ତୁ” ଓ “ରିଷ୍ଟାର୍ଟ ବେଳେ ଦେଖାନ୍ତୁ” ଡିଭାଇସର ନିଜସ୍ୱ, ଯଦି ଅନ୍ୟ ପ୍ଲଗଇନ ସ୍କ୍ରିନ ନଦିଏ। ଆରମ୍ଭ ବେଳେ ପ୍ଲଗଇନ ଚାଲେ ନାହିଁ: ଆରମ୍ଭ ପାଇଁ ବଛା ସ୍କ୍ରିନ ଡିଭାଇସ ବନ୍ଦ ବା ରିଷ୍ଟାର୍ଟ ହେବା ବେଳେ ଆଗରୁ ଆଙ୍କାଯାଏ ଓ ପରବର୍ତ୍ତୀ ଆରମ୍ଭରେ ଦେଖାଯାଏ। ସ୍କ୍ରିନ ସମୟରେ ପ୍ରସ୍ତୁତ ନହେଲେ ବା ଛବି ନଷ୍ଟ ହୋଇଥିଲେ ଡିଭାଇସର ନିଜସ୍ୱ ସ୍କ୍ରିନ ଦେଖାଯାଏ; ଡିଭାଇସ ଯେକୌଣସି ଅବସ୍ଥାରେ ବନ୍ଦ ବା ରିଷ୍ଟାର୍ଟ ହୁଏ।"
