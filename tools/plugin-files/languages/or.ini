update.plugin.name = ଅପଡେଟ
update.plugin.description = ମେମୋରୀ କାର୍ଡରୁ ବା ଇଣ୍ଟରନେଟରୁ ଡାଉନଲୋଡ କରି ଫାର୍ମୱେୟାର ଅପଡେଟ ଇନଷ୍ଟଲ କରେ।
update.plugin.how = "ଯେଉଁ ଡିଭାଇସରେ PaperPaw ହିଁ ଫାର୍ମୱେୟାର (ଯେପରି X4), ସେଠାରେ “ଅପଡେଟ” ନୂଆ ଫାର୍ମୱେୟାର ଇନଷ୍ଟଲ କରେ। ଏହା ସେଟିଂସରେ “ଅପଡେଟ” ଭାବେ ଅଛି।\n\n“ଅନଲାଇନ ସନ୍ଧାନ” ଅପଡେଟ ସର୍ଭରରୁ ନୂଆ PaperPaw ଖୋଜି ଡାଉନଲୋଡ କରେ, Wi-Fiରେ କିଛି ମିନିଟ ଲାଗେ। କିମ୍ବା ଏକ ଅପଡେଟ ଫାଇଲ (.bin, paperpaw.orgରୁ) କାର୍ଡର updates ଫୋଲ୍ଡରକୁ କପି କରନ୍ତୁ, ଯେପରି Wi-Fi ଟ୍ରାନ୍ସଫର ଦ୍ୱାରା। ଇନଷ୍ଟଲ ପ୍ରାୟ ଏକ ମିନିଟ ନିଏ ଓ ଡିଭାଇସ ରିଷ୍ଟାର୍ଟ ହୁଏ; ବହି, ସେଟିଂସ ଓ ପଢ଼ିବା ସ୍ଥାନ ରହେ।\n\n“ଅପଡେଟ ଖୋଜନ୍ତୁ” ଚାଲୁ ଥିଲେ (ସେଟିଂସରେ, ପ୍ରଥମେ ବନ୍ଦ), ଡିଭାଇସ ସପ୍ତାହକୁ ପ୍ରାୟ ଥରେ ନିଜେ ପଚାରେ, କେବଳ Wi-Fi ଚାଲୁ ଥିଲେ ବା ଚାର୍ଜ ହେଉଥିଲେ। ମିଳିଥିବା ନୂଆ PaperPaw ଏଠାରେ ଅପେକ୍ଷା କରେ; ପଢ଼ିବାରେ ବାଧା ନାହିଁ। ସନ୍ଧାନ କେବଳ ଡିଭାଇସ କଣ ଚଲାଉଛି ପଠାଏ, ଏହାର ନାମ ବା ନମ୍ବର ନୁହେଁ; ଡିଭାଇସ ଗଣିବା ପାଇଁ, ଆପଣ ପଚାରିଥିଲେ କି ନାହିଁ ଓ ଏହା ଦିନ, ସପ୍ତାହ ବା ମାସର ପ୍ରଥମ ସନ୍ଧାନ କି ନାହିଁ ମଧ୍ୟ।\n\nଆପଣ ବ୍ୟବହାର କରୁଥିବା ପ୍ଲଗଇନର ନୂଆ ରିଲିଜ ପାଇଁ ସଂସ୍କରଣ ନଥିଲେ ଅପଡେଟ ଅପେକ୍ଷା କରେ। ପୁରୁଣା ସଂସ୍କରଣ କେବଳ ଆପଣ ବାଛିଲେ ଇନଷ୍ଟଲ ହୁଏ।\n\nCrossPoint ପରି ଅନ୍ୟ ଫାର୍ମୱେୟାର ମଧ୍ୟ ଏଠାରୁ ଇନଷ୍ଟଲ ହୁଏ: ଏହାର .bin ଫାଇଲ updates ଫୋଲ୍ଡରରେ ରଖି “ଅପଡେଟ” ଖୋଲନ୍ତୁ। PaperPaw ଯାଞ୍ଚ କରେ ଯେ ଏହା ଏହି ଡିଭାଇସ ପାଇଁ ସମ୍ପୂର୍ଣ୍ଣ ଓ ଅକ୍ଷତ ଫାର୍ମୱେୟାର, କିନ୍ତୁ ସାଇନ ନଥିବାରୁ କିଏ ତିଆରି କଲା ଜାଣିପାରେ ନାହିଁ। “ତଥାପି ଇନଷ୍ଟଲ କରନ୍ତୁ” ଏହାକୁ ଫ୍ଲାସର ଅନ୍ୟ ଅଧାରେ ଲେଖି ଆରମ୍ଭ କରେ; ସେହି ଫାର୍ମୱେୟାର ତାହା ଉପରେ କିଛି ଇନଷ୍ଟଲ ନକରିବା ପର୍ଯ୍ୟନ୍ତ PaperPaw ନିଜ ଅଧାରେ ରହେ। PaperPawକୁ ଫେରିବାକୁ, ଅନ୍ୟ ଫାର୍ମୱେୟାରର ମେନୁରୁ (ଯେପରି CrossPointର SD firmware update) ଏହାର install ଫାଇଲ (paperpaw-<device>-<version>-install.bin) ଇନଷ୍ଟଲ କରନ୍ତୁ।"
