launcher-simple.plugin.name = ସରଳ ହୋମ
launcher-simple.plugin.description = ଏକ ଶାନ୍ତ ଆରମ୍ଭ ସ୍କ୍ରିନ: ବଡ଼ ଘଡ଼ି, କାର୍ଡ, ଏକ ଡକ ଏବଂ ଗୋଲାକାର ସୁଇଚର କ୍ୱିକ ପ୍ୟାନେଲ।
launcher-simple.plugin.how = "“ସରଳ ହୋମ” ଯେଉଁମାନଙ୍କୁ କେବଳ ମୂଳ ଜିନିଷ ଦରକାର, ସେମାନଙ୍କ ପାଇଁ ଏକ ଶାନ୍ତ ଆରମ୍ଭ ସ୍କ୍ରିନ: ଏକ ବଡ଼ ଘଡ଼ି, ଆପଣ ପଢ଼ୁଥିବା ବହି, ଲାଇବ୍ରେରୀ ଓ ଷ୍ଟୋର ବଡ଼ କାର୍ଡ ଭାବେ, ଏବଂ ତଳେ ତିନୋଟି ଆଇକନର ଏକ ଡକ। କିଛି ସେଟଅପ ଦରକାର ନାହିଁ।\n\nସେଟିଂସରେ ହୋମ ସ୍କ୍ରିନ ତଳେ ଏହା ବାଛନ୍ତୁ। ଏହାର କ୍ୱିକ ପ୍ୟାନେଲରେ (ଏହାକୁ ମଧ୍ୟ ସେଟିଂସରେ ପ୍ୟାନେଲ ଭାବେ ବାଛନ୍ତୁ) ବଡ଼ ଗୋଲାକାର ସୁଇଚ, ଫ୍ରଣ୍ଟ ଲାଇଟ ପାଇଁ ଏକ ବାର (ଡିଭାଇସରେ ଥିଲେ) ଓ ଟେକ୍ସଟ ଆକାର ପାଇଁ ଏକ ବାର ଅଛି। ବଟନରେ, ତୀର ବଟନ ଫୋକସ ଘୁଞ୍ଚାଏ ଏବଂ “ବାଛନ୍ତୁ” ସେହି ଅଂଶର କାମ କରେ; ବାରରେ ଏହା ଏକ ଦଶମାଂଶ ଯୋଡ଼େ, ଏବଂ ଶେଷରୁ ଆରମ୍ଭକୁ ଫେରେ। ଟଚରେ ଏକ ଅଂଶ ଟାପ କରନ୍ତୁ, କିମ୍ବା ବାରରେ ଯେଉଁଠି ଚାହାନ୍ତି ସେଠାରେ ଟାପ କରନ୍ତୁ।\n\nଲାଇବ୍ରେରୀ ଆପଣଙ୍କ ବହିକୁ କାର୍ଡ ଭାବେ ଦେଖାଏ, ଶେଷରେ ଖୋଲାଯାଇଥିବା ବହି ପ୍ରଥମେ, ଥରକେ ଏକ ପୃଷ୍ଠା, ଏବଂ ସାଧାରଣ ପଢ଼ିବା ସ୍କ୍ରିନ ଖୋଲେ।\n\nସେଟିଂସରେ “ସରଳ ହୋମ” ତଳେ ଏହାକୁ ନିଜ ପରି କରନ୍ତୁ: ମୁଖ୍ୟ ମେନୁ ପରି ଏଡିଟ ହେଉଥିବା ତିନୋଟି ତାଲିକା। “କାର୍ଡ”: ହୋମରେ କେଉଁ କାର୍ଡ, କେଉଁ କ୍ରମରେ। “ଡକ”: ଡକରେ କେଉଁ ଆଇକନ, ଯେକୌଣସି ପ୍ଲଗଇନର ଯେକୌଣସି କାର୍ଯ୍ୟ। “କ୍ୱିକ ପ୍ୟାନେଲ”: କେଉଁ ସୁଇଚ ଓ ବାର। ସ୍କ୍ରିନରେ ସ୍ଥାନ ନଥିବା କାର୍ଡ ଶେଷରୁ ବାଦ ପଡ଼େ। “ସରଳ ହୋମ” ତଳେ ତାରିଖ ଓ ବ୍ୟାଟେରୀ ଦେଖାଯିବ କି ନାହିଁ ମଧ୍ୟ ବାଛନ୍ତୁ।"
