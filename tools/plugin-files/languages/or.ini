joplin.plugin.name = ବହି ନୋଟ ସିଙ୍କ
joplin.plugin.description = ପ୍ରତ୍ୟେକ ବହିର ହାଇଲାଇଟ ଓ ନୋଟ ଗୋଟିଏ ନୋଟରେ ରଖେ। Joplin ସହିତ କାମ କରେ (Joplin Cloud, Joplin Server ବା WebDAV)।
joplin.title = ବହି ନୋଟ ସିଙ୍କ
joplin.send = Joplinକୁ ପଠାନ୍ତୁ
joplin.send.help = ଏକ୍ସପୋର୍ଟ ହୋଇଥିବା ନୋଟ ତୁରନ୍ତ ପଠାଯାଏ। ଯେଉଁ ନୋଟ ପଠାଯାଇପାରିଲା ନାହିଁ, ସେଗୁଡ଼ିକ ଅପେକ୍ଷା କରେ ଏବଂ ପରବର୍ତ୍ତୀ ଏକ୍ସପୋର୍ଟ ସହିତ, ଏହା ଦ୍ୱାରା, କିମ୍ବା ଏକ ନିୟମ ଦ୍ୱାରା ଯାଏ।
joplin.service = ସିଙ୍କ ସେବା
joplin.service.help = Joplin କାହା ସହିତ ସିଙ୍କ କରେ, Joplinରେ ସେଟ ହୋଇଥିବା ପରି: Joplin Cloud, ଆପଣଙ୍କ ନିଜ Joplin Server, କିମ୍ବା Nextcloud ପରି ଏକ WebDAV ଫୋଲ୍ଡର। କୌଣସି କମ୍ପ୍ୟୁଟର ଚାଲୁ ରହିବା ଦରକାର ନାହିଁ।
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = ଠିକଣା
joplin.address.help = Joplin Server: ଏହାର ଠିକଣା, ଯେପରି joplin.example.org। WebDAV: Joplin ଯେଉଁ ଫୋଲ୍ଡରକୁ ସିଙ୍କ କରେ, ତାହାର ସେଟିଂସରେ ଥିବା ପରି, ଯେପରି dav.example.org/Joplin।
joplin.email = ଇମେଲ
joplin.user = ୟୁଜର ନାମ
joplin.user.help = Joplin Cloud ଓ Joplin Server: ଆପଣ ସାଇନ ଇନ କରୁଥିବା ଇମେଲ (ଦୁଇ-ପର୍ଯ୍ୟାୟ ସାଇନ ଇନ ଏବେ ବ୍ୟବହାର ହୋଇପାରିବ ନାହିଁ)। WebDAV: ଫୋଲ୍ଡରର ୟୁଜର ନାମ।
joplin.password = ପାସୱାର୍ଡ
joplin.password.help = ଏହି ଡିଭାଇସରେ ଅନ୍ୟ ପାସୱାର୍ଡ ଓ କି ସହିତ ରଖାଯାଏ। Nextcloud ପାଇଁ ଆପ ପାସୱାର୍ଡ ମଧ୍ୟ କାମ କରେ।
joplin.secret = Joplin ପାସୱାର୍ଡ
joplin.not-kept = ପାସୱାର୍ଡ ଏହି ଡିଭାଇସରେ ରଖାଯାଇପାରିଲା ନାହିଁ।
joplin.notebook = ନୋଟବୁକ
joplin.notebook.help = PaperPaw Joplinରେ ତିଆରି କରୁଥିବା ନୋଟବୁକ, ପ୍ରତ୍ୟେକ ବହି ପାଇଁ ଗୋଟିଏ ନୋଟ ସହିତ। ପୁଣି ଏକ୍ସପୋର୍ଟ କଲେ ନୋଟଟି ଅପଡେଟ ହୁଏ, ଅନ୍ୟ ନୋଟବୁକକୁ ଘୁଞ୍ଚାଯାଇଥିଲେ ମଧ୍ୟ।
joplin.idle = ଏକ୍ସପୋର୍ଟ ହୋଇଥିବା ନୋଟ ତୁରନ୍ତ Joplinକୁ ପଠାଯାଏ।
joplin.waiting.one = ଗୋଟିଏ ବହିର ନୋଟ ପଠାଯିବାକୁ ଅପେକ୍ଷା କରୁଛି।
joplin.waiting.other = {count}ଟି ବହିର ନୋଟ ପଠାଯିବାକୁ ଅପେକ୍ଷା କରୁଛି।
joplin.sent.one = ଗୋଟିଏ ବହିର ନୋଟ Joplinରେ ଅଛି।
joplin.sent.other = {count}ଟି ବହିର ନୋଟ Joplinରେ ଅଛି।
joplin.some-failed = Joplinକୁ ପଠାଗଲା: {sent}। ପଠାଯାଇନାହିଁ: {failed}; ସେଗୁଡ଼ିକ ପରେ ପୁଣି ପଠାଯିବ।
joplin.apart.one = Joplinରେ ଗୋଟିଏ ନୋଟ ବଦଳାଯାଇଥିଲା, ତେଣୁ ତାହା ପାଖରେ ଏକ ନୂଆ ନୋଟ ତିଆରି ହେଲା।
joplin.apart.other = Joplinରେ {count}ଟି ନୋଟ ବଦଳାଯାଇଥିଲା, ତେଣୁ ସେଗୁଡ଼ିକ ପାଖରେ ନୂଆ ନୋଟ ତିଆରି ହେଲା।
joplin.nothing = Joplinକୁ ପଠାଯିବାକୁ କୌଣସି ନୋଟ ଅପେକ୍ଷା କରୁନାହିଁ।
joplin.no-network = Joplinକୁ ପଠାଇବା ପାଇଁ ନେଟୱାର୍କ ଦରକାର। ନୋଟ ଅପେକ୍ଷା କରିବ ଏବଂ ପରେ ପଠାଯିବ।
joplin.setup-needed = ପ୍ରଥମେ Joplin ସେଟଅପ କରନ୍ତୁ: ଏହା କେଉଁଠାକୁ ସିଙ୍କ କରେ, ଆପଣଙ୍କ ଆକାଉଣ୍ଟ ଓ ପାସୱାର୍ଡ।
joplin.no-time = ସମୟ ଏବେ ଜଣା ନାହିଁ। ନୋଟ ଅପେକ୍ଷା କରିବ ଏବଂ ପରେ ପଠାଯିବ।
joplin.unreachable = Joplin ସହିତ ସଂଯୋଗ ହୋଇପାରୁନାହିଁ। ନୋଟ ଅପେକ୍ଷା କରିବ ଏବଂ ପରେ ପଠାଯିବ।
joplin.failed = Joplin ଏକ ତ୍ରୁଟି ({status}) ସହିତ ଉତ୍ତର ଦେଲା। ନୋଟ ଅପେକ୍ଷା କରିବ ଏବଂ ପରେ ପଠାଯିବ।
joplin.bad-login = Joplin ଇମେଲ, ୟୁଜର ନାମ ବା ପାସୱାର୍ଡ ଗ୍ରହଣ କଲା ନାହିଁ। Joplin ସେଟଅପରେ ସେଗୁଡ଼ିକ ଯାଞ୍ଚ କରନ୍ତୁ।
joplin.no-server = ଏହି ଠିକଣାରେ କୌଣସି Joplin Server ନାହିଁ। Joplin ସେଟଅପରେ ଏହା ଯାଞ୍ଚ କରନ୍ତୁ।
joplin.bad-address = PaperPaw ଏହି ଠିକଣା ବ୍ୟବହାର କରିପାରିବ ନାହିଁ। Joplin ସେଟଅପରେ ଏହା ଯାଞ୍ଚ କରନ୍ତୁ।
joplin.no-data = ଏହି ଠିକଣାରେ କୌଣସି Joplin ନୋଟ ନାହିଁ। ଏହା ଯାଞ୍ଚ କରନ୍ତୁ, କିମ୍ବା ପ୍ରଥମେ Joplinକୁ ଏହା ସହିତ ସିଙ୍କ କରନ୍ତୁ।
joplin.encrypted = Joplinର ଏଣ୍ଡ-ଟୁ-ଏଣ୍ଡ ଏନକ୍ରିପସନ ଚାଲୁ ଅଛି। PaperPaw ନୋଟ ଏନକ୍ରିପ୍ଟ କରିପାରେ ନାହିଁ, ତେଣୁ କିଛି ପଠାଏ ନାହିଁ।
joplin.newer-target = Joplin ସେଠାରେ ନୋଟ ଏହି PaperPaw ଜାଣିଥିବାଠାରୁ ନୂଆ ଫର୍ମାଟରେ ରଖେ। ସେଗୁଡ଼ିକ ପଠାଇବାକୁ PaperPaw ଅପଡେଟ କରନ୍ତୁ।
joplin.older-target = Joplin ସେଠାରେ ନୋଟ ପୁରୁଣା ଫର୍ମାଟରେ ରଖେ। ଏହାକୁ ଅପଗ୍ରେଡ କରିବାକୁ Joplin ଖୋଲନ୍ତୁ, ତାପରେ ପୁଣି ପଠାନ୍ତୁ।
joplin.upgrading = Joplin ଏବେ ସେଠାରେ ନୋଟ ଅପଗ୍ରେଡ କରୁଛି। ସେଗୁଡ଼ିକ ଅପେକ୍ଷା କରିବ ଏବଂ ପରେ ପଠାଯିବ।
joplin.no-memory = ନୋଟ ପଠାଇବା ପାଇଁ ଯଥେଷ୍ଟ ମେମୋରୀ ନାହିଁ। ରିଷ୍ଟାର୍ଟ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
keyboard.plugin.name = କୀବୋର୍ଡ
keyboard.plugin.description = ସ୍କ୍ରିନରେ ଟେକ୍ସଟ ଲେଖେ, ଟଚ ବା ବଟନ ଦ୍ୱାରା।
keyboard.plugin.how = "କିଛି ଟେକ୍ସଟ ଦରକାର ହେଲେ କୀବୋର୍ଡ ଖୋଲେ: ସନ୍ଧାନ, ପାସୱାର୍ଡ, ନୋଟ ବା ସେଟିଂ। ଏହା ଟଚରେ ଓ କେବଳ ବଟନରେ ମଧ୍ୟ କାମ କରେ।\n\nବଟନରେ, ବାମ ଓ ଡାହାଣ ଧାଡ଼ିରେ ଘୁଞ୍ଚେ (ଧାଡ଼ି ଶେଷରୁ ପୁଣି ଆରମ୍ଭକୁ), ପୃଷ୍ଠା ବଟନ ଧାଡ଼ି ମଧ୍ୟରେ ଘୁଞ୍ଚେ ଓ ସ୍ତମ୍ଭ ରଖେ, “ବାଛନ୍ତୁ” କି ଦବାଏ ଏବଂ “ପଛକୁ” ବାତିଲ କରେ। ଶିଫ୍ଟ ପରବର୍ତ୍ତୀ ଅକ୍ଷରକୁ କ୍ୟାପିଟାଲ କରେ; ସବୁ କ୍ୟାପିଟାଲ ପାଇଁ ଦୁଇଥର ଦବାନ୍ତୁ, ବନ୍ଦ କରିବାକୁ ଆଉ ଥରେ। ଏକ ଅକ୍ଷର ଧରି ରଖିଲେ (ବଟନରେ: ତାହା ଉପରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ) ତାହାର କ୍ୟାପିଟାଲ ଓ é, è ପରି ଆକ୍ସେଣ୍ଟ ମିଳେ; ଜର୍ମାନରେ a, o, u ଓ sରୁ ä, ö, ü ଓ ß ଏପରି ମିଳେ। “ଠିକ ଅଛି” ଶେଷ କରେ; ବଟନରେ ଯେକୌଣସି ସ୍ଥାନରୁ ଶେଷ କରିବାକୁ “ପଛକୁ” ଧରି ରଖନ୍ତୁ, କିମ୍ବା ଅକ୍ଷର ନଥିବା କି ଉପରେ “ବାଛନ୍ତୁ” ଧରି ରଖନ୍ତୁ। “ପେଷ୍ଟ” କ୍ଲିପବୋର୍ଡର ଟେକ୍ସଟ ଦିଏ, ଏବଂ “ଫୋନ” (ଯେଉଁଠି ଅଛି) ଆପଣଙ୍କ ଫୋନରେ ଟାଇପ କରିବାକୁ ଦିଏ।\n\nସେଟିଂସରେ “ଡିଭାଇସ”, “କୀବୋର୍ଡ” ତଳେ: “କୀବୋର୍ଡ ଲେଆଉଟ” ଲେଆଉଟ ବାଛେ; ଡିଫଲ୍ଟ ଭାବେ ଏହା ମେନୁ ଭାଷା ଅନୁସରଣ କରେ, ଏକାଧିକ ଥିଲେ ଏକ କି ସେଗୁଡ଼ିକ ମଧ୍ୟରେ ବଦଳାଏ। “ଉମଲାଉଟ କି” ä, ö, ü ଓ ß ପାଇଁ ଅଲଗା କି ଦିଏ। “ଆକାର” କି ଓ ଅକ୍ଷର ବଡ଼ କରେ; କେବଳ ବଟନରେ ଧାଡ଼ି କମ୍ପ୍ୟୁଟର କୀବୋର୍ଡ ପରି ରହେ। ଟଚ ସ୍କ୍ରିନରେ “କିର ଆକୃତି” କିର ରୂପ ବଦଳାଏ। “ସ୍ୱୟଂଚାଳିତ କ୍ୟାପିଟାଲ” ପ୍ରତ୍ୟେକ ବାକ୍ୟ କ୍ୟାପିଟାଲରେ ଆରମ୍ଭ କରେ।"
