calendar.plugin.name = କ୍ୟାଲେଣ୍ଡର
calendar.plugin.description = ଡିଭାଇସରେ ଆପଣଙ୍କ କ୍ୟାଲେଣ୍ଡର: CalDAV, iCal ଓ ଫାଇଲରୁ ଏଜେଣ୍ଡା, ଦିନ, ସପ୍ତାହ ଓ ମାସ ଭ୍ୟୁ, ଯୋଗାଯୋଗରୁ ଜନ୍ମଦିନ, ହୋମ ୱିଜେଟ ଓ ଏକ ସ୍ଲିପ ସ୍କ୍ରିନ।
calendar.plugin.how = "ଡିଭାଇସରେ ଆପଣଙ୍କ କ୍ୟାଲେଣ୍ଡର: ଆଗାମୀ ଦିନଗୁଡ଼ିକର ଏଜେଣ୍ଡା, ଦିନ, ସପ୍ତାହ ଓ ମାସ। ଉତ୍ସ: CalDAV କ୍ୟାଲେଣ୍ଡର, iCal ଠିକଣା (.ics, webcal://), କାର୍ଡରେ କ୍ୟାଲେଣ୍ଡର ଫାଇଲ ଏବଂ ଯୋଗାଯୋଗର ଜନ୍ମଦିନ ଓ ବାର୍ଷିକୀ (CardDAV)। ଡିଭାଇସ କ୍ୟାଲେଣ୍ଡର କେବଳ ପଢ଼େ, କେବେ ବଦଳାଏ ନାହିଁ।\n\nଟୁଲ୍ସ ମେନୁରୁ “କ୍ୟାଲେଣ୍ଡର” ଖୋଲନ୍ତୁ। ଭ୍ୟୁ ବଦଳାଇବା, କ୍ୟାଲେଣ୍ଡର ଯୋଡ଼ିବା ବା ସିଙ୍କ କରିବା ପାଇଁ ପ୍ରଥମ ଧାଡ଼ି ବାଛନ୍ତୁ, କୌଣସି ଧାଡ଼ି ଧରି ରଖନ୍ତୁ ବା “ମେନୁ” ଦବାନ୍ତୁ। ଦିନ ଓ ସପ୍ତାହରେ ପ୍ରଥମ ଦୁଇ ଧାଡ଼ି (ଓ ପୃଷ୍ଠା ବଟନ) ପୂର୍ବ ବା ପରବର୍ତ୍ତୀକୁ ଯାଏ; ମାସରେ ତୀର ବଟନ ଦିନ ଓ ପୃଷ୍ଠା ବଟନ ମାସ ବଦଳାଏ, “ବାଛନ୍ତୁ” ଦିନଟି ଖୋଲେ। ଇଭେଣ୍ଟରେ “ବାଛନ୍ତୁ” ପୂରା ବିବରଣୀ ଦେଖାଏ। “ପଛକୁ” ଗୋଟିଏ ପାଦ ପଛକୁ ଯାଏ।\n\nମେନୁରେ ବା ସେଟିଂସ › କ୍ୟାଲେଣ୍ଡରରେ “କ୍ୟାଲେଣ୍ଡର” ତଳେ କ୍ୟାଲେଣ୍ଡର ଯୋଡ଼ନ୍ତୁ। ପ୍ରକାର ବାଛନ୍ତୁ: CalDAV ଆକାଉଣ୍ଟ (ସର୍ଭର ଠିକଣା ଯଥେଷ୍ଟ, ଯଥା cloud.example.com/remote.php/dav), iCal ଠିକଣା (.ics), କାର୍ଡରେ ଫାଇଲ, କିମ୍ବା ଯୋଗାଯୋଗ (CardDAV ଠିକଣା ବହି)। ଠିକଣା, ଆକାଉଣ୍ଟ ପାଇଁ ୟୁଜର ନାମ ଓ ପାସୱାର୍ଡ (ଭଲ ହେବ ଏକ ଆପ ପାସୱାର୍ଡ) ଏବଂ ଏକ ନାମ ଦିଅନ୍ତୁ। ପ୍ରତ୍ୟେକର ଏକ ବଦଳାଯୋଗ୍ୟ ଚିହ୍ନ (ବିନ୍ଦୁ, ବଳୟ, ଧୂସର ବିନ୍ଦୁ, ବର୍ଗ) ଅଛି; ସର୍ବାଧିକ 6ଟି କ୍ୟାଲେଣ୍ଡର।\n\nପୁନରାବୃତ୍ତ, ସାରାଦିନିଆ ଓ ଅନ୍ୟ ଟାଇମ ଜୋନର ଇଭେଣ୍ଟ ଡିଭାଇସର ଘଡ଼ି ଅନୁସାରେ ଦେଖାଯାଏ। ଆଜିର 60 ଦିନ ଆଗରୁ 60 ଦିନ ପରଯାଏ ସର୍ବାଧିକ 240 ଇଭେଣ୍ଟ ରଖାଯାଏ, ନେଟୱାର୍କ ବିନା ମଧ୍ୟ ଦେଖାଯାଏ।\n\nକ୍ୟାଲେଣ୍ଡର ଖୋଲିଲେ (5 ମିନିଟରେ ସର୍ବାଧିକ ଥରେ), “ଏବେ ସିଙ୍କ କରନ୍ତୁ” ବାଛିଲେ, ଏବଂ ସେଟିଂସ ଅନୁସାରେ ନେଟୱାର୍କ ଚାଲୁ ଥିଲେ ବା ଚାର୍ଜିଂ ଆରମ୍ଭ ହେଲେ ପଢ଼ାଯାଏ। କେବଳ “ଏବେ ସିଙ୍କ କରନ୍ତୁ” ପାଇଁ ରେଡିଓ ଚାଲୁ ହୁଏ।\n\nହୋମ ସ୍କ୍ରିନ ୱିଜେଟ (ହୋମ ସ୍କ୍ରିନ ଧରି ରଖି ୱିଜେଟ ଯୋଡ଼ନ୍ତୁ): ଆଜି, ପରବର୍ତ୍ତୀ ଇଭେଣ୍ଟ, ଏଜେଣ୍ଡା, ମାସ ଓ ଜନ୍ମଦିନ। ସ୍ଲିପ ସ୍କ୍ରିନ ଆଜିର ଏଜେଣ୍ଡା ଦେଖାଇପାରେ: ସେଟିଂସ › ସ୍ଲିପ ସ୍କ୍ରିନରେ “କ୍ୟାଲେଣ୍ଡର” ବାଛନ୍ତୁ।"
