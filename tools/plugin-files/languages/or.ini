diagnostics.check.battery.help = କେବଲ ଲଗାନ୍ତୁ ଓ କାଢ଼ନ୍ତୁ: ଏକ ମିନିଟ ଭିତରେ “ଚାର୍ଜିଂ” ବଦଳିବା ଉଚିତ।
