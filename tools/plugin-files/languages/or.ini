vocabulary.sd.save.linked = {file} ଲେଖେ: id, ସାମ୍ନା, ପଛ, ଉଦାହରଣ। ଅନ୍ୟ ସ୍ତମ୍ଭ ରହେ ନାହିଁ।
vocabulary.sd.save.new = {folder} ଫୋଲ୍ଡରରେ ଏକ ନୂଆ ଫାଇଲ {file} ଲେଖେ।
vocabulary.sd.mirror = {deck}: ଫାଇଲରେ ନଥିବା କାର୍ଡ
vocabulary.sd.mirror.on = ବାହାର କରନ୍ତୁ
vocabulary.sd.mirror.off = ରଖନ୍ତୁ
vocabulary.sd.mirror.help = ବାହାର କରନ୍ତୁ: {file}ରୁ ଡିଲିଟ ହୋଇଥିବା କାର୍ଡ ପରବର୍ତ୍ତୀ ଅପଡେଟରେ ତାହାର ପ୍ରଗତି ସହ ସବୁଦିନ ପାଇଁ ବାହାରିଯିବ। ରଖନ୍ତୁ: ଏହା ରହିବ।
vocabulary.sd.saving = {file} ସେଭ ହେଉଛି
vocabulary.sd.saved.one = {count}ଟି କାର୍ଡ {file}ରେ ସେଭ ହେଲା।
vocabulary.sd.saved.other = {count}ଟି କାର୍ଡ {file}ରେ ସେଭ ହେଲା।
vocabulary.sd.saved.unlinked = {file}ରେ ସେଭ ହେଲା, କିନ୍ତୁ ଡେକ ସହ ଲିଙ୍କ ଲେଖାଯାଇପାରିଲା ନାହିଁ: ପରବର୍ତ୍ତୀ ଅପଡେଟ ଫାଇଲଟି ପୁଣି ପଢ଼ିବ।
vocabulary.sd.save.backup = ପୂର୍ବରୁ ଥିବା ଫାଇଲଟି {file} ଭାବେ ରଖାଯାଇଛି।
vocabulary.sd.save.no-deck = ଏହି ଡେକ ଆଉ ନାହିଁ।
vocabulary.sd.save.unreadable = ଲିଙ୍କ ହୋଇଥିବା ଫାଇଲର ତାଲିକା ପଢ଼ିହେଲା ନାହିଁ, ତେଣୁ କିଛି ଲେଖାଗଲା ନାହିଁ। କାର୍ଡ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.save.full = କାର୍ଡ ଭର୍ତ୍ତି, ତେଣୁ କିଛି ଲେଖାଗଲା ନାହିଁ। କିଛି ସ୍ଥାନ ଖାଲି କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.save.too-large = ଏହି ଡେକ ଗୋଟିଏ ଫାଇଲ ପାଇଁ ବହୁତ ବଡ଼ (4 MiB, ଅପଡେଟ ପଢ଼ୁଥିବା ସର୍ବାଧିକ)। କାର୍ଡରେ ଥିବା ଫାଇଲ ଅପରିବର୍ତ୍ତିତ।
vocabulary.sd.save.failed = ଫାଇଲଟି ଲେଖାଯାଇପାରିଲା ନାହିଁ। କାର୍ଡରେ ଥିବା ଫାଇଲ ଅପରିବର୍ତ୍ତିତ। କାର୍ଡ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.save.not-updated = ସେଭ ହେଲା ନାହିଁ: କାର୍ଡରେ ଥିବା ଫାଇଲ ପ୍ରଥମେ ପଢ଼ିହେଲା ନାହିଁ, ଏବଂ ଏଥିରେ ଡେକରେ ଏପର୍ଯ୍ୟନ୍ତ ନଥିବା ପରିବର୍ତ୍ତନ ଥାଇପାରେ। ଫାଇଲଟି ଠିକ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.save.left-out = ସେଭ ହେଲା ନାହିଁ: ଫାଇଲର କିଛି ଧାଡ଼ି ପଢ଼ିହେଲା ନାହିଁ, ଏବଂ ସେଭ କଲେ ସେଗୁଡ଼ିକ ହଜିଯିବ। ଫାଇଲଟି ଠିକ କରନ୍ତୁ, ଅପଡେଟ କରନ୍ତୁ ଓ ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.save.anki = {file} ଏକ Anki ଫାଇଲ: ଏହା କେବଳ ପଢ଼ାଯାଏ, କେବେ ଲେଖାଯାଏ ନାହିଁ।
vocabulary.sd.save.anki-refused = ସେଭ ହେଲା ନାହିଁ: {file} ଏକ Anki ଡେକ, ଯାହାକୁ PaperPaw କେବଳ ପଢ଼େ। ଏହାକୁ ଅପଡେଟ କରିବାକୁ Ankiରୁ ଡେକଟି ପୁଣି ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ।
vocabulary.sd.removal-held = କୌଣସି କାର୍ଡ ବାହାର କରାଗଲା ନାହିଁ: କିଛି ଧାଡ଼ି ପଢ଼ିହେଲା ନାହିଁ।
vocabulary.sd.skipped.one = {count}ଟି ଧାଡ଼ି ଛାଡ଼ିଦିଆଗଲା
vocabulary.sd.skipped.other = {count}ଟି ଧାଡ଼ି ଛାଡ଼ିଦିଆଗଲା
vocabulary.sd.skipped-notes.one = {count}ଟି ନୋଟ ଛାଡ଼ିଦିଆଗଲା: ଏହା ବହୁତ ଲମ୍ବା (ଯେପରି ଏଥିରେ ଏକ ଛବି ଅଛି)
vocabulary.sd.skipped-notes.other = {count}ଟି ନୋଟ ଛାଡ଼ିଦିଆଗଲା: ସେଗୁଡ଼ିକ ବହୁତ ଲମ୍ବା (ଯେପରି ସେଥିରେ ଛବି ଅଛି)
vocabulary.sd.no-room = {count}ଟି ଧାଡ଼ି ଫିଟ ହେଲା ନାହିଁ: ଗୋଟିଏ ଡେକରେ 20,000 କାର୍ଡ ରହେ।
vocabulary.sd.outcome.same = ଶେଷ ଅପଡେଟ ପରଠାରୁ ବଦଳିନାହିଁ।
vocabulary.sd.outcome.unreadable = ଏହି ଫାଇଲ ପଢ଼ିହେଲା ନାହିଁ। କାର୍ଡ ଯାଞ୍ଚ କରି ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।
vocabulary.sd.outcome.too-many = ପୂର୍ବରୁ 50ଟି ଡେକ ଅଛି, ତେଣୁ ଏହି ଫାଇଲ ପଢ଼ାଗଲା ନାହିଁ। ପ୍ରଥମେ ଏକ ଡେକ ଡିଲିଟ କରନ୍ତୁ।
vocabulary.sd.outcome.crowded = ବହୁତ କାର୍ଡର ସାମ୍ନା ସମାନ, ତେଣୁ ଏହି ଫାଇଲ ପଢ଼ାଗଲା ନାହିଁ। ସାମ୍ନାଗୁଡ଼ିକ ଅଲଗା କରନ୍ତୁ।
vocabulary.sd.outcome.no-cards = କୌଣସି କାର୍ଡ ମିଳିଲା ନାହିଁ। କାର୍ଡ ହେଉଛି ସାମ୍ନା ଟେକ୍ସଟ ଥିବା ଏକ ଧାଡ଼ି; ସାମ୍ନା ହେଉଛି ପ୍ରଥମ ସ୍ତମ୍ଭ।
vocabulary.sd.outcome.too-large = ଏହି ଫାଇଲ ବହୁତ ବଡ଼: ସର୍ବାଧିକ 4 MiB ଓ 20,000 ଧାଡ଼ି। ଏହାକୁ ଅନେକ ଫାଇଲରେ ଭାଗ କରନ୍ତୁ।
vocabulary.sd.outcome.utf16 = ଏହି ଫାଇଲ UTF-16 ଭାବେ ସେଭ ହୋଇଛି। ଏହାକୁ CSV UTF-8 ଭାବେ ପୁଣି ସେଭ କରନ୍ତୁ (ସ୍ପ୍ରେଡସିଟରେ: CSV UTF-8)।
vocabulary.sd.outcome.no-notes = କୌଣସି ନୋଟ ମିଳିଲା ନାହିଁ: ଏହା Anki ଡେକ ନୁହେଁ, କିମ୍ବା ଏଥିରେ ନୋଟ ନାହିଁ। Ankiରୁ ଏହାକୁ Anki ଡେକ ପ୍ୟାକେଜ (.apkg) ଭାବେ ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ।
vocabulary.sd.outcome.newer-anki = ଏହି ଡେକ ସର୍ବଶେଷ Anki ଫର୍ମାଟରେ ଅଛି। Support older Anki versions ଟିକ କରି ଏହାକୁ ପୁଣି ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ।
vocabulary.sd.outcome.deck-too-large = ଏହି Anki ଡେକ ଏଠାରେ ପଢ଼ିବା ପାଇଁ ବହୁତ ବଡ଼: ସର୍ବାଧିକ 4,000 ଫାଇଲ, 4 MiB ନୋଟ ଓ 20,000 ନୋଟ। ମିଡିଆ ଓ ସିଡ୍ୟୁଲିଂ ବିନା ଏକ୍ସପୋର୍ଟ କରନ୍ତୁ, କିମ୍ବା ଏହାକୁ ଭାଗ କରନ୍ତୁ।
vocabulary.sd.line = ଧାଡ଼ି {line}
vocabulary.sd.fault.no-front = ସାମ୍ନା ସ୍ତମ୍ଭରେ କୌଣସି ଟେକ୍ସଟ ନାହିଁ। ସେଠାରେ ଶବ୍ଦଟି ରଖନ୍ତୁ।
vocabulary.sd.fault.not-utf8 = UTF-8 ଟେକ୍ସଟ ନୁହେଁ। ଫାଇଲଟି UTF-8 ଭାବେ ସେଭ କରନ୍ତୁ (ସ୍ପ୍ରେଡସିଟରେ: CSV UTF-8)।
vocabulary.sd.fault.too-long = 8 KiBରୁ ଲମ୍ବା। କାର୍ଡଟି ଛୋଟ କରନ୍ତୁ।
vocabulary.sd.fault.open-quote = ଏକ କୋଟ ଖୋଲାଯାଇଛି କିନ୍ତୁ ବନ୍ଦ ହୋଇନାହିଁ। ଏହାକୁ ବନ୍ଦ କରନ୍ତୁ ବା ବାହାର କରନ୍ତୁ।
vocabulary.setting.sd-auto = ଖୋଲିଲେ କାର୍ଡରୁ ଡେକ ଅପଡେଟ କରନ୍ତୁ
vocabulary.setting.sd-auto.help = ଫ୍ଲାସ କାର୍ଡ ଫୋଲ୍ଡରରେ ନୂଆ ବା ବଦଳିଥିବା ଫାଇଲ ପଢ଼େ।
vocabulary.setting.sd-folder = ଡେକ ଫାଇଲ ପାଇଁ ଫୋଲ୍ଡର
vocabulary.setting.sd-folder.help = SD କାର୍ଡରେ: ଏଥିରେ ଥିବା ପ୍ରତ୍ୟେକ CSV, TSV ବା Anki ଫାଇଲ ଏକ ଡେକ।
vocabulary.sd.readme = "ଫାଇଲରୁ ଫ୍ଲାସ କାର୍ଡ\n\nପ୍ରତି ଡେକ ପାଇଁ ଏଠାରେ ଗୋଟିଏ ଫାଇଲ ରଖନ୍ତୁ: Spanish.tsv ଡେକ Spanish ତିଆରି କରେ।\nଫାଇଲ: UTF-8 ଭାବେ ସେଭ ହୋଇଥିବା .tsv, .csv ବା .txt, କିମ୍ବା .apkg: Support older Anki versions ଟିକ କରି ଏକ୍ସପୋର୍ଟ ହୋଇଥିବା Anki ଡେକ। ଏହାର ନୋଟର ପ୍ରଥମ ତିନି ଫିଲ୍ଡ ସାମ୍ନା, ପଛ ଓ ଉଦାହରଣ ହୁଏ; ସିଡ୍ୟୁଲିଂ ଓ ମିଡିଆ ପଢ଼ାଯାଏ ନାହିଁ, PaperPaw କେବେ Anki ଫାଇଲ ଲେଖେ ନାହିଁ।\n\nପ୍ରତି ଧାଡ଼ିରେ ଗୋଟିଏ କାର୍ଡ: ସାମ୍ନା, ପଛ ଓ ଉଦାହରଣ (ଇଚ୍ଛାଧୀନ), ଟ୍ୟାବ, କମା ବା ସେମିକୋଲନ ଦ୍ୱାରା ଅଲଗା। ପ୍ରଥମ ଧାଡ଼ି ସ୍ତମ୍ଭର ନାମ ଦେଇପାରେ: front, back, example। ଉଦାହରଣ:\n\nବିଲେଇ\tcat\tବିଲେଇ ଶୋଇଛି।\n\nତାପରେ ଡିଭାଇସରେ ଫ୍ଲାସ କାର୍ଡ ଖୋଲନ୍ତୁ, SD କାର୍ଡରେ ଥିବା କାର୍ଡ ବାଛି ଡେକ ଅପଡେଟ କରନ୍ତୁ।\n\nଜାଣିରଖନ୍ତୁ:\n- ଡେକ ଶିଖିଥିବା ସହ ଡିଭାଇସରେ ରହେ। ନୂଆ ବା ବଦଳିଥିବା ଫାଇଲ ପଢ଼ାଯାଏ, ଏହାର କାର୍ଡ ଡେକରେ ଯୋଡ଼ାଯାଏ ବା ବଦଳେ।\n- ପଛ ବା ଉଦାହରଣ ବଦଳାଇଲେ କାର୍ଡ ବଦଳେ, ପ୍ରଗତି ରହେ।\n- ସାମ୍ନା ବଦଳାଇଲେ ତାହା ନୂଆ କାର୍ଡ, ପୁରୁଣାଟି ପୁଣି ଆରମ୍ଭରୁ। କାର୍ଡ ସାମ୍ନା ଟେକ୍ସଟରେ ଚିହ୍ନଟ ହୁଏ; ସ୍ପେସ ଓ ବଡ଼ ଅକ୍ଷର ଗଣାଯାଏ ନାହିଁ। ଡେକକୁ ଫାଇଲରେ ସେଭ କଲେ (SD କାର୍ଡରେ ଥିବା କାର୍ଡ, କାର୍ଡରେ ସେଭ କରନ୍ତୁ) id ସ୍ତମ୍ଭରେ ପ୍ରତ୍ୟେକ କାର୍ଡର ନମ୍ବର ରହେ: ସେଠାରେ ସାମ୍ନା ବଦଳାନ୍ତୁ, ପ୍ରଥମ ଦୁଇ ଧାଡ଼ି ଯେମିତି ଅଛି ରଖନ୍ତୁ, ଶିଖିଥିବା ରହିବ।\n- ସେଭ ଡେକର କାର୍ଡ ଲେଖେ; ସାମ୍ନା ବିନା ଧାଡ଼ି ରହେ ନାହିଁ; ପୁରୁଣା ଫାଇଲ _name.bak.tsvରେ କପି ହୁଏ।\n- CSV UTF-8 ଭାବେ ସେଭ କରନ୍ତୁ (UTF-16 ନୁହେଁ)। 4 MiB ବା 20,000 ଧାଡ଼ିରୁ ବଡ଼ ଫାଇଲ ପଢ଼ାଯାଏ ନାହିଁ: ଭାଗ କରନ୍ତୁ।\n- ଫାଇଲରୁ ଡିଲିଟ ଧାଡ଼ି ଡେକର କାର୍ଡ ଡିଲିଟ କରେ ନାହିଁ, ଯଦି ସେହି ଡେକରେ “ଫାଇଲରେ ନଥିବା କାର୍ଡ” ବାହାର କରନ୍ତୁ ନୁହେଁ; ତେବେ କାର୍ଡ ଶିଖିଥିବା ସହ ଚାଲିଯାଏ।\n- _ରେ ଆରମ୍ଭ ହେଉଥିବା ଫାଇଲ ପଢ଼ାଯାଏ ନାହିଁ।\n"
