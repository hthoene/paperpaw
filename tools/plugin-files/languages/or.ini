aids.plugin.name = ପଢ଼ିବା ସହାୟକ
aids.plugin.description = ମୋଟା ଶବ୍ଦ ଆରମ୍ଭ, ବଦଳା ଶବ୍ଦ, ଛବି: ଆପଣ ଯେପରି ଚାହାନ୍ତି ସେପରି ଟେକ୍ସଟ।
aids.plugin.how = "ପଢ଼ିବା ସହାୟକ ପଢ଼ିବାବେଳେ ବହିର ଟେକ୍ସଟ କିପରି ଦେଖାଯାଏ ତାହା ବଦଳାଏ। ଏଗୁଡ଼ିକ ସବୁ ବହିରେ ଲାଗୁ ହୁଏ। ମୋଟା ଶବ୍ଦ ଆରମ୍ଭ ଓ ଶବ୍ଦ ବଦଳାନ୍ତୁ ପ୍ରଥମେ ବନ୍ଦ ଥାଏ।\n\nଏଗୁଡ଼ିକ ସେଟିଂସରେ, ପଢ଼ିବା ତଳେ, ପଢ଼ିବା ସହାୟକ ବିଭାଗରେ ମିଳେ। ମୋଟା ଶବ୍ଦ ଆରମ୍ଭ ପ୍ରତ୍ୟେକ ଶବ୍ଦର ପ୍ରଥମ ଅଧା ମୋଟା କରେ, ଯାହା କିଛି ଲୋକଙ୍କୁ ପଢ଼ିବାରେ ସହଜ ଲାଗେ। ଶବ୍ଦ ବଦଳାନ୍ତୁ “colour = color; Mr. = Mister” ପରି ଲେଖାଯାଇଥିବା ଯୋଡ଼ି ନିଏ, ସେମିକୋଲନ ଦ୍ୱାରା ଅଲଗା।\n\nକେବଳ ପୂରା ଶବ୍ଦ ବଦଳେ, ଠିକ ଆପଣ ଯେପରି ଲେଖିଛନ୍ତି, ତେଣୁ “color” କେବେ ଏକ ଲମ୍ବା ଶବ୍ଦର ଅଂଶ ବଦଳାଏ ନାହିଁ। ବହି ଫାଇଲ ନିଜେ ବଦଳେ ନାହିଁ।\n\nବହିର ଛବି ଦେଖାଯାଇପାରେ (ପ୍ରଥମେ ସେପରି), ଛବିର ବର୍ଣ୍ଣନା ବ୍ୟବହାର କରି “[ଛବି: ସମୁଦ୍ରରେ ଏକ ଜାହାଜ]” ପରି ଏକ ଛୋଟ ଧାଡ଼ିରେ ବଦଳାଯାଇପାରେ, ବା ବାଦ ଦିଆଯାଇପାରେ। ତାହାହେଲେ ପୃଷ୍ଠାରେ ଟେକ୍ସଟ ପାଇଁ ଅଧିକ ସ୍ଥାନ ରହେ, ଏବଂ ନଦେଖାଯାଉଥିବା ଛବି ଡିକୋଡ ହୁଏ ନାହିଁ, ତେଣୁ ପୃଷ୍ଠା ଶୀଘ୍ର ଓଲଟେ। କମିକ୍ସ ଓ ଛବିରେ ଗଠିତ ଅନ୍ୟ ବହି ବଦଳେ ନାହିଁ।"
