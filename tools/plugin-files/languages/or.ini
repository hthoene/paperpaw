plugin-manager.code.no-room = ଏହାର କୋଡ ପାଇଁ ଆଉ ସ୍ଥାନ ନାହିଁ। କୋଡ ଥିବା ଅନ୍ୟ ଏକ ପ୍ଲଗଇନ ବନ୍ଦ କରନ୍ତୁ।
plugin-manager.code.no-room-flash = ଏହାର କୋଡ ପାଇଁ ଆଉ ସ୍ଥାନ ନାହିଁ। କୋଡ ଥିବା ଅନ୍ୟ ଏକ ପ୍ଲଗଇନ ବନ୍ଦ କରନ୍ତୁ, କିମ୍ବା ୱେବ ଫ୍ଲାସର (paperpaw.org) ଦ୍ୱାରା ପୂର୍ଣ୍ଣ ଲେଆଉଟ ଫ୍ଲାସ କରନ୍ତୁ: ଅନେକ ଗୁଣ ଅଧିକ ସ୍ଥାନ।
