plugin-manager.code.other-build = PaperPawର ଅନ୍ୟ ଏକ ପ୍ଲଗଇନ ଇଣ୍ଟରଫେସ ପାଇଁ ତିଆରି: ଏହି ଇଣ୍ଟରଫେସ ପାଇଁ ଏକ ବିଲ୍ଡର ଅପେକ୍ଷାରେ।
