core.usb-drive.text = USB ଡ୍ରାଇଭ ଭାବେ ସଂଯୁକ୍ତ: କାର୍ଡଟି କମ୍ପ୍ୟୁଟରରେ ଅଛି। ଏହାକୁ ଫେରାଇ ଆଣିବାକୁ ସେଠାରେ ଡ୍ରାଇଭଟି ଇଜେକ୍ଟ କରନ୍ତୁ, କିମ୍ବା “ପଛକୁ” ଦବାନ୍ତୁ; ତାପରେ “ଠିକ ଅଛି” ଦବାନ୍ତୁ। ଆପଣ କପି କରିଥିବା ଫାଇଲ ପରେ ଲାଇବ୍ରେରୀରେ ଦେଖାଯିବ।
core.usb-link.title = USB ଡେଭେଲପର ଟୁଲ୍ସକୁ ଅନୁମତି ଦେବେ?
core.usb-link.text = USB କେବଲରେ ଲାଗିଥିବା କମ୍ପ୍ୟୁଟର ବଟନ ଦବାଇପାରିବ, ସ୍କ୍ରିନସଟ ନେଇପାରିବ ଏବଂ ବହି ଓ ପ୍ଲଗଇନ ଫାଇଲ ପଢ଼ିପାରିବ ଓ ଲେଖିପାରିବ। ଏହା ଗୁପ୍ତ ତଥ୍ୟ ପଢ଼ିପାରିବ ନାହିଁ କିମ୍ବା କୋଡ ଇନଷ୍ଟଲ କରିପାରିବ ନାହିଁ। ଡିଭାଇସ ରିଷ୍ଟାର୍ଟ ହେଲେ ବା ସ୍ଲିପକୁ ଗଲେ, କେବଲ କାଢ଼ିଦେଲେ, କିମ୍ବା ଆପଣ ଏଠାରେ ବନ୍ଦ କଲେ ଏହା ବନ୍ଦ ହୋଇଯାଏ।
