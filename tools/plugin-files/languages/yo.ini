vocabulary.plugin.name = Àkójọ ọ̀rọ̀
vocabulary.plugin.description = Ó ń pa àwọn ọ̀rọ̀ tí o wá ìtumọ̀ wọn mọ́ pẹ̀lú gbólóhùn wọn, ó sì ń fi káàdì ìkẹ́kọ̀ọ́ tí o ṣe lórí fóònù dán ọ wò pẹ̀lú àtúnyẹ̀wò ní àlàfo àkókò.
vocabulary.plugin.how = "Àkójọ ọ̀rọ̀ ń pa àwọn ọ̀rọ̀ tí o wá ìtumọ̀ wọn nígbà tí o ń kàwé mọ́, ọ̀kọ̀ọ̀kan pẹ̀lú gbólóhùn rẹ̀, kí o lè tún wọn wò lẹ́yìn náà. Àkójọ náà wà nínú Irinṣẹ́, tuntun jùlọ ní àkọ́kọ́; yan ọ̀rọ̀ kan láti tún wá ìtumọ̀ rẹ̀. Ìlà ìkẹyìn, Gbé jáde, ń fi wọ́n pamọ́ fún áàpù káàdì ìkẹ́kọ̀ọ́ bí Anki. Àkójọ náà ń pa ọ̀rọ̀ 2,000 tuntun jùlọ mọ́: lẹ́yìn ìyẹn, àwọn tó pẹ́ jùlọ yóò lọ, kọ́kọ́ gbé wọn jáde láti pa gbogbo wọn mọ́.\n\nKáàdì ìkẹ́kọ̀ọ́, tó tún wà nínú Irinṣẹ́, ń dán ọ wò pẹ̀lú àtúnyẹ̀wò ní àlàfo àkókò: lẹ́yìn Fi ìdáhùn hàn, o ó fún káàdì kọ̀ọ̀kan ní Lẹ́ẹ̀kan sí i, Ó le, Dáadáa tàbí Ó rọrùn, èyí ló ń pinnu ìgbà tí yóò padà. Ṣe ìdìpọ̀ pẹ̀lú Ṣàtúnṣe pẹ̀lú fóònù: fi fóònù tó wà lórí Wi-Fi kan náà ka kóòdù náà, kí o tẹ káàdì tàbí fi ọ̀pọ̀ kún un lẹ́ẹ̀kan: ṣí ìdìpọ̀ kan níbẹ̀, yan Ọpọ̀ káàdì lẹ́ẹ̀kan kí o sì mú fáìlì CSV, TSV tàbí TXT (káàdì kan lórí ìlà kọ̀ọ̀kan: iwájú, ẹ̀yìn, àpẹẹrẹ; UTF-8), lẹ àkójọ kan síbẹ̀, tàbí mú ìdìpọ̀ Anki wá (.apkg, tí a gbé jáde pẹ̀lú “Support older Anki versions”). \n\nTàbí lo fáìlì lórí káàdì SD: fi fáìlì CSV, TSV tàbí TXT kan, tàbí ìdìpọ̀ Anki (.apkg, bí òkè), fún ìdìpọ̀ kọ̀ọ̀kan sínú fódà Flashcards (Spanish.tsv ń ṣe ìdìpọ̀ Spanish; káàdì kan lórí ìlà kọ̀ọ̀kan: iwájú, ẹ̀yìn, àpẹẹrẹ; UTF-8; ìlà àkọ́kọ́ lè sọ orúkọ àwọn òpó: front, back, example). Yan Ìdìpọ̀ lórí káàdì SD nínú Káàdì ìkẹ́kọ̀ọ́, tàbí jẹ́ kí ó ṣẹlẹ̀ nígbà tí o bá ṣí i. Àwọn ìdìpọ̀ yóò wà lórí ẹ̀rọ kíkà pẹ̀lú ohun tí o ti kọ́, a ó sì da fáìlì pọ̀ mọ́ ìdìpọ̀ rẹ̀ nígbàkígbà tí ó bá jẹ́ tuntun tàbí tí ó yí padà: yí ẹ̀yìn tàbí àpẹẹrẹ káàdì kan padà nínú fáìlì, káàdì náà yóò yí padà láìpàdánù ìtẹ̀síwájú rẹ̀; yí ọ̀rọ̀ iwájú padà, ó di káàdì tuntun, èyí àtijọ́ sì tún bẹ̀rẹ̀ (ọ̀rọ̀ iwájú ni a fi ń dá káàdì mọ̀ yàtọ̀; àlàfo àti lẹ́tà ńlá kò kà); ìlà tí o pa rẹ́ kò ní pa káàdì rẹ́ (àfi tí o bá ṣètò “káàdì tí kò sí nínú fáìlì” sí Yọ kúrò fún ìdìpọ̀ náà: nígbà náà a ó yọ káàdì náà títí láé pẹ̀lú ìtẹ̀síwájú rẹ̀ ní ìmúdójúìwọ̀n tó kàn, a kò sì ní yọ nǹkankan nígbà tí a kò bá lè ka ìlà kan nínú fáìlì). Fi ìdìpọ̀ kan pamọ́ sínú fáìlì rẹ̀ pẹ̀lú Fi pamọ́ sórí káàdì: fáìlì náà yóò gba nọ́ńbà àwọn káàdì (òpó id), kí o lè ṣàtúnṣe iwájú lórí kọ̀ǹpútà láìpàdánù ohun tí o ti kọ́; fáìlì náà ń pa id, iwájú, ẹ̀yìn àti àpẹẹrẹ nìkan mọ́ (a kò pa àwọn òpó míì, àlàyé àti ètò àwọn ìlà mọ́), a sì kọ̀ láti fi pamọ́ nígbà tí a kò bá lè ka ìlà kan; ní ìgbà àkọ́kọ́, a ó ṣe ẹ̀dà fáìlì tó wà níbẹ̀ sí _name.bak.tsv (fífi pamọ́ lẹ́yìn náà kò ní rọ́pò ẹ̀dà yẹn). A kò ní ka fáìlì tó ju 4 MiB tàbí ìlà 20,000 lọ, ó sì gbọ́dọ̀ jẹ́ CSV UTF-8, kì í ṣe UTF-16. Ní ìgbà àkọ́kọ́, ẹ̀rọ kíkà yóò ṣe fódà náà pẹ̀lú àkọsílẹ̀ lórí bí ó ṣe ń ṣiṣẹ́.\n\nNínú ètò, lábẹ́ Kíkà, Ṣe káàdì láti ọ̀rọ̀ tí o wá ń fi ọ̀rọ̀ kọ̀ọ̀kan tí o wá sínú ìdìpọ̀ Ọrọ̀ tí a wá."
