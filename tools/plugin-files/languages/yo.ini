translate.plugin.name = Ìtumọ̀
translate.plugin.description = Ó ń túmọ̀ ọ̀rọ̀ tí o yàn lórí ayélujára, pẹ̀lú DeepL.
translate.plugin.how = "Ìtumọ̀ ń túmọ̀ ọ̀rọ̀ tí o yàn lórí ayélujára pẹ̀lú DeepL. Yan ọ̀rọ̀ nínú ìwé kan kí o sì yan Túmọ̀ nínú mẹ́nù ọ̀rọ̀ tí o yàn: ìtumọ̀ náà yóò hàn lórí ojú-ìwé bí àlàyé nínú ìwé atúmọ̀ èdè. Bọ́tìnnì ojú-ìwé tàbí títẹ̀ ń yí i lọ, Yàn tàbí títẹ̀ ní òpin rẹ̀ sì ń pa á dé.\n\nÓ nílò nẹ́tíwọ́ọ̀kì àti kọ́kọ́rọ́ DeepL API tìrẹ, ní ọ̀fẹ́ ní deepl.com (DeepL API Free, nǹkan bí 500,000 lẹ́tà lóṣù). Títí o fi tẹ̀ ẹ́ sí i, pánẹ́ẹ̀lì náà yóò sọ bẹ́ẹ̀, títẹ̀ sì ń béèrè fún un.\n\nNínú ètò, lábẹ́ Kíkà, ní apá Ìtumọ̀, Túmọ̀ sí ń yan èdè náà; ní ìbẹ̀rẹ̀, èdè PaperPaw ni."
