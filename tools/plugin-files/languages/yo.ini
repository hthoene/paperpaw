pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Aago ìfọkànsí pẹ̀lú ìyípo iṣẹ́ àti ìsinmi, wíjẹ́ẹ̀tì àti oníkà ojoojúmọ́.
pomodoro.plugin.how = "Aago Pomodoro: ṣiṣẹ́ ní ìyípo ìfọkànsí, lẹ́yìn náà sinmi. Kò nílò ètò kankan: ìṣẹ́jú 25 ìfọkànsí, 5 ìsinmi, àti lẹ́yìn ìyípo mẹ́rin, ìsinmi gígùn ìṣẹ́jú 15.\n\nṢí Pomodoro láti inú mẹ́nù Irinṣẹ́ kí o sì tẹ̀ Bẹ̀rẹ̀, tàbí fi àwọn wíjẹ́ẹ̀tì rẹ̀ kún ìbòjú ilé (di ìbòjú ilé mú, lẹ́yìn náà fi wíjẹ́ẹ̀tì kún un): Aago Pomodoro ń fi ìpele àti ìṣẹ́jú tó kù hàn, Bẹ̀rẹ̀/dúró Pomodoro jẹ́ bọ́tìnnì, Pomodoro òní sì ń ka àwọn ìyípo tí o ti parí, pẹ̀lú àfojúsùn ojoojúmọ́ rẹ. Títẹ̀ aago náà ń bẹ̀rẹ̀ rẹ̀ tàbí dá a dúró; di í mú láti ṣí ìbòjú kíkún.\n\nAago náà ń bá a lọ nígbà tí o bá kúrò lórí ìbòjú, ó sì ń tẹ̀lé aago lẹ́yìn àtúnbẹ̀rẹ̀. Nígbà tí ẹ̀rọ kíkà bá ń sùn, kò sí nǹkan tó ń ṣiṣẹ́: ìpele tó parí láàrin àkókò yẹn ni a ó sọ fún ọ nígbà tí ó bá jí. Ìfitónilétí ń sọ fún ọ nígbà tí ìpele kan bá parí. Láti ṣọ́ bátìrì, aago ń ṣe ìmúdójúìwọ̀n lẹ́ẹ̀kan ní ìṣẹ́jú kan (ní gbogbo ìṣẹ́jú-àáyá mẹ́wàá ní ìṣẹ́jú tó kẹ́yìn lórí ìbòjú kíkún), kì í sì í jẹ́ kí ẹ̀rọ kíkà wà lójúfò.\n\nLábẹ́ Pomodoro nínú Ètò ni o ti ń ṣètò gígùn ìpele àti iye ìyípo nínú ẹgbẹ́ kan, àti bóyá ìpele tó kàn yóò bẹ̀rẹ̀ fúnra rẹ̀. Lábẹ́ Síwájú sí i: ìbòjú tó ń kọ mànà tàbí ìmọ́lẹ̀ iwájú tó ń ṣẹ́jú nígbà tí ìpele bá parí, àti àfojúsùn ojoojúmọ́."
