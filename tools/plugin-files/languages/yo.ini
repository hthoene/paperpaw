widgets.plugin.name = Àpò wíjẹ́ẹ̀tì
widgets.plugin.description = Ọpọ̀ wíjẹ́ẹ̀tì míì fún ìbòjú ilé: aago, kàlẹ́ńdà, àyọkà, ìwé, àkọsílẹ̀ àti síwájú sí i.
widgets.plugin.how = "Àpò wíjẹ́ẹ̀tì ń fi ọ̀pọ̀ wíjẹ́ẹ̀tì kún ìbòjú ilé: aago (ọlọ́wọ́, ọ̀rọ̀, nínú àpótí, àgbáyé), kàlẹ́ńdà, ọdún títí di báyìí, ìkàsẹ́yìn, ìpele òṣùpá, àti ọjọ́ ọ̀sẹ̀ àti ọjọ́ oṣù; àyọkà ọjọ́ òní, àkọsílẹ̀, ohun tí a ó ṣe, àwòrán, ìkíni àti àmì PaperPaw; àti fún ìwé, ìwé tí o ń kà, ìtẹ̀síwájú, èyí tó kàn, ọ̀wọ́, àwọn àyànfẹ́, àmì àfihàn kan àti ilé-ìkàwé ní iye. Wíjẹ́ẹ̀tì bátìrì náà wà nínú rẹ̀.\n\nFi wọ́n kún un pẹ̀lú Ṣàtúnṣe ìbòjú ilé nínú mẹ́nù (tàbí títẹ̀ mọ́lẹ̀ pẹ́ lórí ìbòjú ilé), lẹ́yìn náà Fi wíjẹ́ẹ̀tì kún un. Ọkọ̀ọ̀kan ní ètò tirẹ̀, bí àlà, ìwọ̀n àti ìtò. Yíyan wíjẹ́ẹ̀tì tó ń yí padà, bí àyọkà ọjọ́ òní, ń fi èyí tó kàn hàn. Àwọn àyọkà tìrẹ ń lọ sínú quotes.txt nínú .paperpaw/plugins/widgets lórí káàdì, ìlà kọ̀ọ̀kan bí ọ̀rọ̀ | òǹkọ̀wé. Àwọn wíjẹ́ẹ̀tì àkókò nílò kí a ṣètò aago; Wi-Fi ń ṣètò rẹ̀."
