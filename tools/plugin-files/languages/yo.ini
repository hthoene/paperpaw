notes-vault.plugin.name = Àpótí àkọsílẹ̀
notes-vault.plugin.description = Ń ka fódà àkọsílẹ̀ Markdown nípa fódà, tágì àti àyípadà tuntun, pẹ̀lú wíjẹ́ẹ̀tì fún ìbòjú ilé. Ó ń ṣiṣẹ́ pẹ̀lú àpótí Obsidian.
notes-vault.plugin.how = "Àpótí àkọsílẹ̀ ń ka fódà àkọsílẹ̀ Markdown (fáìlì .md lásán, bí áàpù àkọsílẹ̀ ṣe ń tọ́jú wọn). Ó ń ṣiṣẹ́ pẹ̀lú àpótí Obsidian.\n\nYàn fódà àpótí náà nínú ètò, tàbí lórí ojú-ìwé àpótí náà nínú irinṣẹ́. Ojú-ìwé náà yóò wá fi àwọn fódà hàn bí wọ́n ṣe wà lórí káàdì, àwọn àkọsílẹ̀ tí a yí padà kẹ́yìn, àwọn tágì, àti ìwádìí nínú àkọlé àwọn àkọsílẹ̀.\n\nNí ìgbà àkọ́kọ́, a ń ṣe atọ́ka àpótí náà lábẹ́lẹ̀ nígbà tí ojú-ìwé rẹ̀ wà ní ṣíṣí; àpótí tó ní ẹgbẹẹgbẹ̀rún àkọsílẹ̀ ń gba ìṣẹ́jú díẹ̀, lẹ́yìn náà yóò máa ṣí lẹ́sẹ̀kẹsẹ̀. A ń tọ́jú atọ́ka náà sórí káàdì, a sì ń tún un ṣe nígbà tí ojú-ìwé àpótí bá ṣí lẹ́yìn wákàtí díẹ̀, tàbí nígbà tí o bá yàn Ṣe atọ́ka lọ́tun.\n\nÀkọsílẹ̀ kan ń ṣí nínú Kíkà. A ń rí ìjápọ̀ sí àkọsílẹ̀ míì ([[Àkọsílẹ̀]], [[Àkọsílẹ̀|ọ̀rọ̀]], [[Àkọsílẹ̀#Àkọlé]]) nípa orúkọ àkọsílẹ̀ náà níbikíbi nínú àpótí; títẹ̀lé ọ̀kan ń ṣí àkọsílẹ̀ náà, Padà sì ń mú ọ padà sí àkọsílẹ̀ tó ṣáájú.\n\nA kì í yí nǹkankan padà nínú àpótí láé. O lè fi àwọn wíjẹ́ẹ̀tì fún ìbòjú ilé (àkọsílẹ̀ àìpẹ́, àkọsílẹ̀ tí a so mọ́, àkọsílẹ̀ ọjọ́ òní, àkọsílẹ̀ àìròtẹ́lẹ̀, tágì, ìwádìí) kún un nínú olóòtú ìbòjú ilé. Wíjẹ́ẹ̀tì kan lè mú àwọn àkọsílẹ̀ rẹ̀ láti fódà kan ṣoṣo: kọ ipa ọ̀nà fódà náà láti gbòǹgbò káàdì (fún àpẹẹrẹ Àkọsílẹ̀/Iṣẹ́) nínú ètò wíjẹ́ẹ̀tì náà; tí ó bá ṣófo, yóò mú gbogbo àkọsílẹ̀ inú àpótí."
