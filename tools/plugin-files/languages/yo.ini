update.dual-boot.help = PaperPaw ń pín ẹ̀rọ yìí pẹ̀lú fámúwíà míì, nítorí náà kò ní fi ìmúdójúìwọ̀n sórí ẹ̀rọ níbí. Ṣe ìmúdójúìwọ̀n PaperPaw pẹ̀lú irinṣẹ́ tí o fi ṣètò rẹ̀. Kò sí fámúwíà kejì lórí ẹ̀rọ yìí? Sọ bẹ́ẹ̀ pẹ̀lú bọ́tìnnì ìsàlẹ̀, tàbí tún PaperPaw fi sórí ẹ̀rọ lórí USB ní paperpaw.org/flash.
