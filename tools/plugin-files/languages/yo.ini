plugin-manager.plugin.name = Olùṣàkóso àfikún
plugin-manager.plugin.description = Ń ṣe àkójọ àwọn àfikún, ó sì ń tàn wọ́n tàbí pa wọ́n.
plugin-manager.plugin.how = "Olùṣàkóso àfikún ń ṣe àkójọ gbogbo àfikún pẹ̀lú ẹ̀yà àti àpèjúwe rẹ̀, ó sì ń tan àwọn àfikún tàbí pa wọ́n.\n\nWàá rí i nínú Ètò, bí Ṣàkóso àfikún. Ètò àfikún jẹ́ ojú-ìwé ọ̀tọ̀ fún àwọn ààyò bíi lílo nẹ́tíwọ́ọ̀kì àfikún kọ̀ọ̀kan. Tẹ̀ àfikún kan láti tàn án tàbí pa á (pẹ̀lú bọ́tìnnì, yàn án). Àyípadà náà máa ṣiṣẹ́ lẹ́yìn àtúnbẹ̀rẹ̀: ọ̀pá ìsàlẹ̀ yóò sì fi Tún bẹ̀rẹ̀ báyìí hàn. Di àfikún kan mú (pẹ̀lú bọ́tìnnì, di Yàn mú) láti ka bí ó ṣe ń ṣiṣẹ́.\n\nA kò lè pa àfikún tí a sàmì sí Títàn nígbà gbogbo, a sì lè pa èyí tí a sàmì sí Dandan kìkì nígbà tí àfikún míì bá ń ṣe iṣẹ́ rẹ̀, bí bẹ́ẹ̀ kọ́ PaperPaw kò ní ní ọ̀nà láti padà. Lábẹ́ Ìbòjú ni o ti ń yan àfikún tí yóò fi ibi kan hàn tí ọ̀pọ̀ àfikún ń pèsè."
