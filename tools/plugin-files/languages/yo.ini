power.plugin.name = Agbára
power.plugin.description = Ń yan ipò agbára, ní ọwọ́ tàbí ní ìbámu pẹ̀lú bátìrì: Déédé, Ìṣúnná, Àìsopọ̀.
power.plugin.how = "Agbára ń yan bí PaperPaw ṣe ń lo bátìrì: Déédé, Ìṣúnná tàbí Àìsopọ̀. Ìṣúnná ń ṣe ohun tó lè dúró ní àkókò tó dára jù; Àìsopọ̀ ń jẹ́ kí rédíò wà ní pípa. Aládàáṣe ń yan ní ìbámu pẹ̀lú bátìrì.\n\nYí ipò padà nínú Pánẹ́ẹ̀lì kíákíá, níbi tí Agbára ti ń fi àwọn ipò hàn lẹ́gbẹ̀ẹ́ ara wọn, tàbí nínú Ètò lábẹ́ Agbára. Níbẹ̀ ni o tún ti ń ṣètò ìpele tí Aládàáṣe yóò ti yí sí Ìṣúnná àti sí Àìsopọ̀, àti bóyá yóò dúró ní Déédé nígbà gbígba agbára.\n\nNínú àwọn ìlà ipò, Ipò agbára ń fi ewé hàn nígbà ìṣúnná àti Wi-Fi tí a fa ìlà kọjá nígbà àìsopọ̀, kò sì fi nǹkankan hàn ní Déédé.\n\nDi bọ́tìnnì Agbára mú láti ṣí mẹ́nù kékeré kan: Sùn, Pa ẹ̀rọ (níbi tí PaperPaw bá ti lè ṣe bẹ́ẹ̀), Tún bẹ̀rẹ̀, àti lórí ẹ̀rọ ìfọwọ́kàn, Tì ìfọwọ́kàn tàbí Ṣí ìfọwọ́kàn. Títẹ̀ kúkúrú ṣì ń mú ẹ̀rọ sùn. Padà ń jáde kúrò nínú mẹ́nù."
