core.host-firmware.question = Ṣé kí a fi sọ́fítíwià ẹ̀rọ {name} ({version}) sórí ẹ̀rọ?
core.host-firmware.foreign = Èyí yóò fi sọ́fítíwià ẹ̀rọ míì rọ́pò PaperPaw. PaperPaw kò ní tún bẹ̀rẹ̀ fúnra rẹ̀ mọ́.
core.host-firmware.no-undo = PaperPaw kò lè yí àyípadà yìí padà. Láti padà, lo ọ̀nà ìmúpadàbọ̀sípò sọ́fítíwià kejì tàbí tún PaperPaw fi sórí ẹ̀rọ pẹ̀lú web flasher.
core.host-firmware.kept = PaperPaw yóò wà nínú ìrántí ẹ̀rọ. A kò ní yí fáìlì orí káàdì ìrántí padà.
core.host-firmware.unsigned = A kò buwọ́ lu sọ́fítíwià yìí. Ìtò fáìlì rẹ̀ àti bóyá ó bá ẹ̀rọ mu nìkan ni a yẹ̀wò; a kò fìdí orísun rẹ̀ múlẹ̀.
core.host-firmware.unknown-key = Kọ́kọ́rọ́ tí a kò mọ̀ ni a fi buwọ́ lu sọ́fítíwià yìí. Fi sórí ẹ̀rọ kìkì tí o bá gbẹ́kẹ̀lé kọ́kọ́rọ́ tí a fi hàn níbí.
core.host-firmware.downgrade = Ẹ̀yà àtijọ́ yìí kò lè dá ẹ̀yà ti tẹ́lẹ̀ padà fúnra rẹ̀. Láti padà, tún PaperPaw fi sórí ẹ̀rọ pẹ̀lú web flasher.
core.host-firmware.early-crash = Tí sọ́fítíwià tuntun bá dákẹ́ kí ó tó ṣe àyẹ̀wò àìléwu ìbẹ̀rẹ̀ rẹ̀, ẹ̀rọ náà lè má bẹ̀rẹ̀ mọ́. Wàá nílò web flasher láti dá PaperPaw padà.
core.host-remove.question = Ṣé kí a yọ {name} kúrò? Kí ló yẹ kó ṣẹlẹ̀ sí dátà rẹ̀ tí a fi pamọ́?
core.host-remove.keep = Yọ kúrò, pa dátà mọ́
core.host-remove.delete = Yọ kúrò, pa dátà rẹ́
core.host-remove.warning = Pípa dátà rẹ̀ rẹ́ yóò tún pa ètò àti fáìlì rẹ̀ tí a fi pamọ́ rẹ́. A kò lè yí èyí padà.
core.host-wifi.join = {plugin} fẹ́ sopọ̀ mọ́ Wi-Fi “{network}”. Ṣé o gbà?
core.host-wifi.hotspot = {plugin} fẹ́ bẹ̀rẹ̀ hotspot Wi-Fi “{network}”. Ṣé o gbà?
core.host-ui.phone-locked = A kò lè tẹ ọ̀rọ̀ lórí fóònù nígbà tí ẹ̀rọ bá wà ní títìpa.
core.host-ui.typing-stopped = Ìmúdójúìwọ̀n lójú ẹsẹ̀ ti dúró nítorí pé ọ̀rọ̀ náà ti gùn jù. O lè máa tẹ̀ ẹ́ lọ; a ó fi gbogbo ọ̀rọ̀ náà ránṣẹ́ nígbà tí o bá yàn án.
core.host-ui.text-full = Ọrọ̀ náà ti gùn jù. Ṣe é ní kúkúrú kí o sì tún gbìyànjú. A kò gé nǹkankan kúrò.
core.host-ui.clipboard-full = Ọrọ̀ náà ti gùn jù fún pátákó ẹ̀dà. Ṣe ẹ̀dà ọ̀rọ̀ tí a yàn tó kúrú jù. Ọrọ̀ tó wà nínú pátákó ẹ̀dà tẹ́lẹ̀ kò yí padà.
core.host-ui.clipboard-card = A kò lè ka pátákó ẹ̀dà tàbí kọ sí i. Rí i dájú pé káàdì ìrántí wà nínú ẹ̀rọ àti pé a lè kà á.
core.host-ui.card-full = Káàdì ìrántí ti kún. Ṣe àyè díẹ̀ kí o sì tún gbìyànjú.
core.host-ui.card-error = A kò lè ka ọ̀rọ̀ náà tàbí fi pamọ́ sórí káàdì ìrántí. Yẹ káàdì náà wò kí o sì tún gbìyànjú.
core.host-permission.library = Ó lè ka gbogbo ilé-ìkàwé rẹ, ibi tí o kà dé, àti àmì àfihàn àti àkọsílẹ̀ láti gbogbo àfikún, ó sì lè yí wọn padà.
core.host-library.import-failed = A kò lè fi ìwé náà kún ilé-ìkàwé. Yẹ káàdì ìrántí wò kí o sì tún gbìyànjú.
core.host-library.name-taken = Ìwé kan ti ní orúkọ yìí tẹ́lẹ̀. Yan orúkọ míì.
core.host-library.replace-denied = Àfikún yìí kò lè rọ́pò ìwé yẹn. Ìwé tí òun fúnra rẹ̀ fi kún, tí a kò sì tíì gbé kúrò láti ìgbà náà, nìkan ló lè rọ́pò.
core.host-safe-mode.power-escape = A pa àfikún {plugin} nítorí pé kò dáhùn mọ́ nígbà tí o di bọ́tìnnì Agbára mú láti tún ẹ̀rọ bẹ̀rẹ̀.
