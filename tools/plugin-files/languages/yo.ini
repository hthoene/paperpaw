menu-editor.plugin.name = Olóòtú mẹ́nù
menu-editor.plugin.description = Ó ń tún àwọn àṣàyàn gbogbo mẹ́nù tò, ó ń yọ wọ́n kúrò, ó sì ń fi kún wọn.
menu-editor.plugin.how = "Olóòtú mẹ́nù ń yí ohun tó wà nínú mẹ́nù padà: sún àṣàyàn sókè tàbí sísàlẹ̀, yọ wọ́n kúrò, tàbí fi tuntun kún un.\n\nWá a nínú Ètò lábẹ́ Ìṣàdáni, bí Ṣàdáni mẹ́nù. Yan mẹ́nù kan, lẹ́yìn náà àṣàyàn kan láti sún un tàbí yọ ọ́ kúrò; Fi àṣàyàn kún un ń fi tuntun sí i. Àyípadà ń ṣiṣẹ́ lẹ́sẹ̀kẹsẹ̀. Dá mẹ́nù yìí padà ń dá mẹ́nù kan padà sí bí àwọn àfikún rẹ̀ ṣe ṣètò rẹ̀, Dá gbogbo mẹ́nù padà ń ṣe bẹ́ẹ̀ fún gbogbo wọn.\n\nO kò lè tì ara rẹ mọ́ òde: àṣàyàn tó jẹ́ ọ̀nà sí ètò yóò dúró títí o fi fi ọ̀nà míì sí i kún un."
