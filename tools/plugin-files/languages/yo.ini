koreader.plugin.name = Pínpín àmì àfihàn
koreader.plugin.description = Ó ń pín àmì ìwé àti àmì àfihàn pẹ̀lú KOReader fún àwọn ìwé tí a ń kà nínú méjèèjì.
koreader.plugin.how = "Àfikún yìí ń pín àmì ìwé àti àmì àfihàn pẹ̀lú KOReader fún àwọn ìwé tí o ń kà nínú méjèèjì, lórí ẹ̀rọ kan tàbí nínú fódà ilé-ìkàwé tí a ń mú ṣiṣẹ́pọ̀ láàrin àwọn ẹ̀rọ. Kò sí nǹkan láti ṣètò.\n\nNígbà tí PaperPaw bá ṣí ìwé kan tí KOReader náà ti ṣí, àti nígbà tí o bá yí àmì ìwé tàbí àmì àfihàn rẹ̀ padà, ó ń gba ohun tuntun láti inú dátà KOReader tó wà lẹ́gbẹ̀ẹ́ ìwé náà, ó sì ń fi ohun tuntun ti ibí sílẹ̀ fún KOReader láti gbà nígbà tó bá tún ṣí ìwé náà. Àmì tí a yọ kúrò àti àkọsílẹ̀ tí a yí padà náà ń kọjá.\n\nÈyí ń ṣiṣẹ́ fún ìwé EPUB nìkan. Bí a kò bá lè ka fáìlì ẹ̀gbẹ́ kan, kò sí ohun tí yóò yí padà ní ẹ̀gbẹ́ kankan títí a ó fi lè kà á."
koreader.removed-there = Fáìlì KOReader kò ní àmì àfihàn mọ́. Ṣé kí a yọ wọ́n kúrò níbí náà?
koreader.removed-there.text = Bóyá a yọ wọ́n kúrò nínú KOReader, tàbí fáìlì rẹ̀ wá láti ẹ̀rọ míì. Pa mọ́ ń fi wọ́n sílẹ̀ níbí, ó sì ń tún fi wọ́n fún KOReader.
