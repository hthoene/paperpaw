wallabag.unreadable = Wallabag kò lè ka àkójọ àwọn àpilẹ̀kọ tí ó ti gbà wá sórí ẹ̀rọ yìí, nítorí náà a kò yí nǹkankan padà.
wallabag.not-kept = Wallabag kò lè fi ọ̀rọ̀ aṣínà tàbí àṣírí náà pamọ́. Ṣàyẹ̀wò pé kò gùn jù, kí o sì gbìyànjú lẹ́ẹ̀kan sí i.
weather.plugin.name = Ojú ọjọ́
weather.plugin.description = Ojú ọjọ́ ìsinsìnyí àti ti àwọn ọjọ́ tó ń bọ̀ bí wíjẹ́ẹ̀tì, láti Open-Meteo.
weather.plugin.how = "Ojú ọjọ́ ń fi ojú ọjọ́ ìsinsìnyí àti ti àwọn ọjọ́ tó ń bọ̀ hàn bí wíjẹ́ẹ̀tì fún ìbòjú ilé, láti Open-Meteo, tí kò nílò àkáǹtì tàbí kọ́kọ́rọ́. Ojú ọjọ́ báyìí ń fi ìwọ̀n ooru hàn, bí ojú ọjọ́ ṣe rí àti àwọn nǹkan míì tí o lè yàn; Àsọtẹ́lẹ̀ ń fi àwọn ọjọ́ tó ń bọ̀ hàn ní ìlà kan tàbí bí àkójọ.\n\nKọ́kọ́ yan ibì kan: nínú ètò, lábẹ́ Ojú ọjọ́, níbi Ibi (tẹ orúkọ kan, lẹ́yìn náà yàn án nínú àwọn ibi tí a rí). Kóódínétì rẹ̀ nìkan ni a ń fi ránṣẹ́, kìkì nígbà tí wíjẹ́ẹ̀tì ojú ọjọ́ kan bá wà lójú ìbòjú. Fi àwọn wíjẹ́ẹ̀tì náà kún un nípa ṣíṣàtúnṣe ìbòjú ilé.\n\nA kò ní gba ojú ọjọ́ wá ju bí Ìmúdójúìwọ̀n ní gbogbo ṣe sọ lọ, kìkì nígbà tí nẹ́tíwọ́ọ̀kì bá wà: kì í tan Wi-Fi fúnra rẹ̀ láé.\n\nDátà ojú ọjọ́ láti ọwọ́ Open-Meteo.com (https://open-meteo.com), lábẹ́ ìwé àṣẹ Creative Commons Attribution 4.0 (CC BY 4.0)."
