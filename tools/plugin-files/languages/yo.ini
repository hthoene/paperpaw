keys.plugin.name = Bọ́tìnnì àti ìfarajúwe
keys.plugin.description = Ohun tí bọ́tìnnì, agbègbè títẹ̀ àti fífà ìka kọ̀ọ̀kan ń ṣe, tí o lè yí padà lórí ẹ̀rọ.
keys.plugin.how = "“Bọ́tìnnì àti ìfarajúwe” ń fi ohun tí bọ́tìnnì, agbègbè títẹ̀ àti fífà ìka kọ̀ọ̀kan ń ṣe hàn, ó sì ń jẹ́ kí o yí i padà lórí ẹ̀rọ.\n\nṢí i nínú ètò, lábẹ́ Ẹrọ. Kọ́kọ́ yan ibi tí àyípadà yóò wúlò: Ibi gbogbo, Nígbà kíkà, Lórí ìbòjú ilé, Nínú ilé-ìkàwé tàbí nínú irinṣẹ́ kan. Lẹ́yìn náà, yan ìfiwọlé kan, bí bọ́tìnnì tí a dì mú tàbí fífà ìka wọlé láti etí, kí o sì yan iṣẹ́ kan nínú àkójọ, tí o lè wá nínú rẹ̀. “Bí ìlànà” ń dá ohun tí àwọn àfikún àti ìtò bọ́tìnnì ṣètò padà.\n\nLórí X4, a kọ àyípadà tí kò ní fi bọ́tìnnì kankan sílẹ̀ láti yàn, láti padà tàbí láti tẹ̀síwájú. “Dá bọ́tìnnì àti ìfarajúwe padà” ní ìsàlẹ̀ ń yí gbogbo àyípadà padà."
