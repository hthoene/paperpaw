setup.plugin.name = Ìṣètò
setup.plugin.description = Ìtọ́sọ́nà kúkúrú nípa àwọn ètò pàtàkì, ní ìbẹ̀rẹ̀ àkọ́kọ́.
setup.plugin.how = "Ìṣètò jẹ́ ìtọ́sọ́nà kúkúrú nípa àwọn ètò pàtàkì. Ó ń hàn lẹ́ẹ̀kan, nígbà àkọ́kọ́ tí PaperPaw bá bẹ̀rẹ̀. Ojú-ìwé kọ̀ọ̀kan ń béèrè nǹkan kan, bí èdè, bọ́tìnnì, ìwọ̀n ọ̀rọ̀, agbègbè àkókò, Wi-Fi tàbí àfikún díẹ̀ láti fi kún un, a sì ti yan ìdáhùn tó bọ́gbọ́n mu tẹ́lẹ̀, nítorí náà Tókàn máa ń tọ̀nà nígbà gbogbo. A fo àwọn ìgbésẹ̀ tí ẹ̀rọ yìí kò nílò.\n\nTẹ̀ àwọn bọ́tìnnì lójú ìbòjú, tàbí lo bọ́tìnnì sókè àti sísàlẹ̀ àti Yàn. Fo kọjá lórí ojú-ìwé àkọ́kọ́ ń jáde kúrò nínú ìṣètò lẹ́sẹ̀kẹsẹ̀. Ojú-ìwé tó kẹ́yìn ń sọ ibi tí ìwé rẹ ti ń wá.\n\nLáti tún un ṣe, ṣí ètò kí o sì yan Ṣètò PaperPaw. Gbogbo ohun tí o yàn níbí ni o lè yí padà nínú ètò lẹ́yìn náà."
