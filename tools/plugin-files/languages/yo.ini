format-cbz.plugin.name = Ìwé kọ́míìkì
format-cbz.plugin.description = Ń ṣí àkójọ ìwé kọ́míìkì (.cbz), àwòrán kan fún ojú-ìwé kan.
format-cbz.plugin.how = "Ń ṣí àkójọ ìwé kọ́míìkì (.cbz): àwòrán kan fún ojú-ìwé kan, tí a mú bá ìbòjú mu, ní ìtẹ̀léra orúkọ wọn (2 ṣáájú 10).\n\nFi wọ́n sínú fódà ilé-ìkàwé kí o sì ṣí wọn láti inú ilé-ìkàwé; yí ojú-ìwé padà bí nínú ìwé èyíkéyìí. Àwòrán ńlá ń gba àkókò díẹ̀ ní ìgbà àkọ́kọ́, lórí X4 ju ibòmíràn lọ.\n\nÈtò kíkà (Ètò, Kíkà): “Àwòrán sí àwòrán” ń fi àwòrán kékeré kan nínú ojú-ìwé hàn lẹ́ẹ̀kan, bí ó ti tóbi tó tí ìbòjú gbà, yíyí ojú-ìwé sì ń lọ láti ọ̀kan sí èkejì; ojú-ìwé tí kò ní àwòrán kékeré ń hàn ní odindi. “Ìtọ́sọ́nà ojú-ìwé kọ́míìkì” ń yí yíyí ojú-ìwé padà fún manga (láti ọ̀tún sí òsì); ComicInfo.xml ìwé náà fúnra rẹ̀ ń sọ èyí. Ilé-ìkàwé ń fi àkọlé ìwé, ọ̀wọ́ rẹ̀ àti nọ́mbà rẹ̀ láti ComicInfo.xml hàn."
