dictionary.plugin.name = Ìwé atúmọ̀
dictionary.plugin.description = Ó ń wá ọ̀rọ̀ nínú ìwé atúmọ̀ StarDict.
dictionary.plugin.how = "Ìwé atúmọ̀ ń wá ọ̀rọ̀ kan láti inú ìwé nínú ìwé atúmọ̀ StarDict, ó sì ń fi ìtumọ̀ hàn nínú pánẹ́ẹ̀lì lórí apá ìsàlẹ̀ ìbòjú.\n\nNínú kíkà, di ọ̀rọ̀ kan mú kí o sì yan Wá ìtumọ̀; pẹ̀lú bọ́tìnnì, lo Yan ọ̀rọ̀ lábẹ́ Síwájú sí i. Ṣe ẹ̀dà àwọn fódà ìwé atúmọ̀ (tó ní fáìlì .ifo, .idx àti .dict) sínú fódà \"dictionaries\" lórí ẹ̀rọ, pẹ̀lú àwọn fódà inú rẹ̀, tàbí yan fódà míì nínú Ètò, lábẹ́ Kíkà, bí Fódà ìwé atúmọ̀ (ètò onípele gíga). Wíwá àkọ́kọ́ ń pèsè atọ́ka kékeré fún ìwé atúmọ̀ kọ̀ọ̀kan, èyí sì ń gba àkókò díẹ̀.\n\nNínú pánẹ́ẹ̀lì, bọ́tìnnì ojú-ìwé tàbí Sókè àti Sísàlẹ̀ ń yí ìtumọ̀ gígùn, Padà sì ń pa á dé. Pẹ̀lú ìfọwọ́kàn, tẹ̀ ìta rẹ̀ láti pa á dé."
