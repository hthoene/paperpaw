reading-goal.plugin.name = Àfojúsùn kíkà
reading-goal.plugin.description = Ìṣẹ́jú kíkà lójoojúmọ́, àti ológbò kan lórí ìbòjú ilé tí ìṣesí rẹ̀ ń tẹ̀lé kíkà òní.
reading-goal.plugin.how = "Ológbò kan lórí ìbòjú ilé rẹ ń fi bí kíkà òní ṣe ń lọ hàn: inú rẹ̀ bàjẹ́ nígbà tí o kò tíì kàwé, ó rí bẹ́ẹ̀ bẹ́ẹ̀ lẹ́yìn díẹ̀, ó ní ìtẹ́lọ́rùn láti ìdajì àfojúsùn ojoojúmọ́ rẹ, inú rẹ̀ sì dùn nígbà tí o bá ti dé àfojúsùn náà.\n\nFi wíjẹ́ẹ̀tì Ológbò kíkà kún ìbòjú ilé (di ìbòjú ilé mú, lẹ́yìn náà fi wíjẹ́ẹ̀tì kan kún un), tàbí yan Ológbò kíkà ti òní bí ìbòjú oorun. Títẹ̀ ológbò náà ń ṣí àfojúsùn ojoojúmọ́; òun ni àfojúsùn ìṣirò kíkà, tí ó ń ka ìṣẹ́jú tí o fi kàwé.\n\nNínú Ètò, lábẹ́ Kíkà, Ìtẹ́lọ́rùn láti àti Ayọ̀ láti ń ṣètò ìpín àfojúsùn tí ológbò náà yóò fi ní ìtẹ́lọ́rùn tàbí ayọ̀, Àwòrán tìrẹ sì ń yan fódà àwòrán (sad, meh, content àti happy) tí yóò hàn dípò àwọn ológbò. Àwọn àwòrán náà jẹ́ fáìlì PNG tàbí JPEG; tí kò bá sí fódà, àwọn ológbò ni yóò hàn."
