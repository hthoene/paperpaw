format-cbz.setting.panels.help = Àwòrán kékeré kan lẹ́ẹ̀kan, yíyí ojú-ìwé ń lọ láti ọ̀kan sí èkejì.
format-docx.plugin.name = Ìwé DOCX
format-docx.plugin.description = Ń ṣí fáìlì .docx, bí Word àti àwọn ètò míì ṣe ń fi wọ́n pamọ́.
format-docx.plugin.how = "Ń ṣí ìwé .docx bí ìwé kíkà: àwọn àkọlé pẹ̀lú àkójọ àkóónú, àkójọ, tábìlì, lẹ́tà dúdú àti lẹ́tà dídà, ìjápọ̀ àti àwòrán (JPEG, PNG, GIF).\n\nFi àwọn fáìlì náà sínú fódà ilé-ìkàwé kí o sì ṣí wọn láti inú ilé-ìkàwé. Àkọlé àti òǹkọ̀wé wá láti inú àbùdá ìwé náà. Àkọsílẹ̀ ìsàlẹ̀ ojú-ìwé, àkọlé òkè àti ìsàlẹ̀ ojú-ìwé, àti ọ̀rọ̀ àsọyé kò ní hàn."
format-docx.title = Ìwé DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Ń ṣí ìwé EPUB pẹ̀lú ìtò wọn, àkójọ àkóónú àti àwòrán.
format-epub.plugin.how = "Ìwé EPUB ń ṣí láti inú ilé-ìkàwé bí ìwé èyíkéyìí, pẹ̀lú àkójọ àkóónú wọn, àwòrán àti ìtò akéde. Ojú-ìwé wẹ́ẹ̀bù (HTML), Markdown, FictionBook (.fb2) àti àkójọ ìwé kọ́míìkì (.cbz) ń ṣí ní ọ̀nà kan náà, ọ̀kọ̀ọ̀kan bí àfikún tirẹ̀.\n\nA ń yí orí kan padà nígbà àkọ́kọ́ tí o bá ṣí i, a sì ń pa á mọ́ sínú ibi ìpamọ́ ìgbà díẹ̀ (cache) àfikún náà, nítorí náà ó ń yára lẹ́yìn náà, ìwé ńlá sì ń ṣiṣẹ́ lórí ẹ̀rọ kékeré. Wá àkójọ àkóónú lábẹ́ Àkóónú nínú mẹ́nù kíkà. Ètò Ìtò akéde, lábẹ́ Kíkà, ló ń pinnu bóyá ìtò ìwé náà fúnra rẹ̀ yóò ṣiṣẹ́."
format-epub.title = Ìwé EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Ń ṣí ìwé FictionBook (.fb2, àti èyí tí a fún pọ̀).
format-fb2.plugin.how = "Ń ṣí ìwé FictionBook (.fb2), tó wọ́pọ̀ fún ìwé Rọ́ṣíà àti àwọn míì, àti èyí tí a fún pọ̀ (.fb2.zip), pẹ̀lú àkọlé wọn, àwọn òǹkọ̀wé, èèpo àti orí.\n\nFi wọ́n sínú fódà ilé-ìkàwé; wọ́n ń hàn nínú ilé-ìkàwé, wọ́n sì ń ṣí bí ìwé èyíkéyìí."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Ń ṣí ojú-ìwé wẹ́ẹ̀bù tí a fi pamọ́ bí fáìlì, ó sì ń fi ohun tí a ó kà nìkan hàn.
format-html.plugin.how = "Ń ṣí ojú-ìwé wẹ́ẹ̀bù tí a fi pamọ́ bí fáìlì (.html, .htm, .xhtml) bí ìwé: ohun tí ó wà fún kíkà nìkan, láìsí mẹ́nù, ìpolówó àti irú wọn tó yí i ká.\n\nFi fáìlì náà sínú fódà ilé-ìkàwé kí o sì ṣí i láti inú ilé-ìkàwé bí ìwé èyíkéyìí. Ìjápọ̀ inú ojú-ìwé náà ń ṣiṣẹ́; àwòrán ń hàn níbi tí wọ́n wà nínú fáìlì."
format-html.title = Ojú-ìwé wẹ́ẹ̀bù (HTML)
format-images.plugin.name = Àwòrán
format-images.plugin.description = Ń ṣí àwòrán (.jpg, .png, .gif) bí ìwé, ojú-ìwé kan fún ọ̀kọ̀ọ̀kan.
format-images.plugin.how = "Àwòrán (.jpg, .png, .gif) ń ṣí láti inú ilé-ìkàwé bí ìwé, àwòrán kan fún ojú-ìwé kan, tí a mú bá ìbòjú mu.\n\nLáti ka gbogbo fódà àwòrán kan, ṣí àwòrán àkọ́kọ́ rẹ̀: àwọn àwòrán tó wà lẹ́yìn rẹ̀ nínú fódà yóò tẹ̀lé e, ní ìtẹ̀léra orúkọ wọn (2 ṣáájú 10). Àwòrán tó wà lẹ́yìn nínú fódà ń bẹ̀rẹ̀ níbẹ̀; a ń rántí ibi tí o kà dé nínú ọ̀kọ̀ọ̀kan lọ́tọ̀ọ̀tọ̀. A ń ka àwòrán tó tó 300 nínú fódà kan láti èyí tí o ṣí.\n\nFáìlì tí kì í ṣe àwòrán, tàbí tó tóbi jù, ń fi orúkọ rẹ̀ hàn dípò. Fún ìwé tó ní ọ̀pọ̀ àwòrán pẹ̀lú àkọlé tirẹ̀, àkójọ ìwé kọ́míìkì (.cbz) ni ọ̀nà tó dára jù."
format-images.title = Àwòrán
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Ń ṣí fáìlì Markdown (.md), bí àkọsílẹ̀.
format-markdown.plugin.how = "Ń ṣí fáìlì Markdown (.md), bí àkọsílẹ̀, bí ìwé: àwọn àkọlé, àkójọ, àyọkà àti ìtẹnumọ́ bí ó ṣe yẹ, kì í ṣe bí àmì.\n\nFi àwọn fáìlì náà sínú fódà ilé-ìkàwé kí o sì ṣí wọn láti inú ilé-ìkàwé. Àkọlé àkọ́kọ́ ni àkọlé rẹ̀; àwòrán tó wà lẹ́gbẹ̀ẹ́ fáìlì ń hàn níbi tí ọ̀rọ̀ ti dárúkọ wọn."
format-markdown.title = Markdown
format-mobi.plugin.name = Ìwé MOBI
format-mobi.plugin.description = Ó ń ṣí fáìlì .mobi àti .azw tí kò ní DRM.
format-mobi.plugin.how = "Ìwé MOBI (.mobi, .azw) ń ṣí láti inú ilé-ìkàwé bí ìwé èyíkéyìí, láìsí ohun tí o ní láti ṣètò. Àkọlé, àwọn òǹkọ̀wé, èdè àti èèpo wá láti inú ìwé náà, a sì ṣe àkójọ àkóónú láti inú àwọn àkọlé rẹ̀.\n\nA máa ń yí ìwé náà padà nígbà àkọ́kọ́ tí o bá ṣí i, èyí sì máa ń gba ìṣẹ́jú-àáyá díẹ̀ fún ìwé gígùn; lẹ́yìn náà yóò máa ṣí lẹ́sẹ̀kẹsẹ̀. A ń fi ọ̀rọ̀, àkọlé, ọ̀rọ̀ nípọn àti ọ̀rọ̀ dídagun, ìjápọ̀ àti àwòrán hàn.\n\nA kò lè ṣí ìwé tó ní DRM (ọ̀pọ̀ ìwé tí a rà ní ṣọ́ọ̀bù), tàbí ìwé tó ní ìfúnpọ̀ Huffman tàbí tó wà ní ìrísí KF8 tuntun (.azw3): PaperPaw yóò sọ bẹ́ẹ̀ nígbà tí o bá ṣí wọn. Ẹdà EPUB, tí a fi irinṣẹ́ bí Calibre ṣe, máa ń ṣí nígbà gbogbo."
format-mobi.title = Ìwé MOBI
format-rtf.plugin.name = Fáìlì RTF
format-rtf.plugin.description = Ó ń ṣí fáìlì .rtf bí ìwé.
format-rtf.title = Fáìlì RTF
format-txt.plugin.name = Ọrọ̀ lásán
format-txt.plugin.description = Ó ń ṣí fáìlì ọ̀rọ̀ lásán (.txt).
format-txt.plugin.how = "Fáìlì ọ̀rọ̀ lásán (.txt) ń ṣí láti inú ilé-ìkàwé bí ìwé èyíkéyìí, láìsí ohun tí o ní láti ṣètò. Àfikún náà ń ka ọ̀rọ̀ UTF-8, UTF-16 àti Windows-1252, ó sì ń dá ọ̀nà ìkọ̀wé (encoding) fáìlì mọ̀ fúnra rẹ̀.\n\nÌpínrọ̀ ń tẹ̀lé àwọn ìlà òfìfo inú fáìlì; bí fáìlì kò bá ní ìkankan, ìlà kọ̀ọ̀kan jẹ́ ìpínrọ̀ kan. Nínú fáìlì Project Gutenberg, a fi ọ̀rọ̀ ìwé-àṣẹ ní ìbẹ̀rẹ̀ àti ní òpin sílẹ̀, a sì ń mú àkọlé àti òǹkọ̀wé láti orí fáìlì.\n\nA kì í gbé gbogbo fáìlì wọlé lẹ́ẹ̀kan, nítorí náà ọ̀rọ̀ tó tóbi gan-an pàápàá ń ṣí lórí ẹ̀rọ kékeré."
format-txt.title = Ọrọ̀ lásán
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Ó ń ṣí ìwé XTC àti XTCH, ojú-ìwé tí a ti ṣe sílẹ̀ fún ẹ̀rọ kíkà Xteink.
format-xtc.plugin.how = "Fáìlì XTC àti XTCH jẹ́ ìwé tí a ti ṣe ojú-ìwé wọn sílẹ̀ bí àwòrán, bí àwọn ètò ìyípadà fún ẹ̀rọ kíkà Xteink ṣe ń ṣe wọ́n. Wọ́n ń ṣí láti inú ilé-ìkàwé bí ìwé èyíkéyìí.\n\nNítorí pé àwòrán tí kò lè yí padà ni ojú-ìwé kọ̀ọ̀kan, a kò lè yí ìwọ̀n ọ̀rọ̀ padà tàbí lo fọ́ǹtì míì. Ojú-ìwé jẹ́ dúdú àti funfun tàbí ní eérú mẹ́rin. A ń tú ojú-ìwé kọ̀ọ̀kan nígbà tí a bá fi í hàn, nítorí náà ìrántí díẹ̀ ni ó nílò, lórí X4 pàápàá.\n\nA ń mú àkọlé, òǹkọ̀wé àti àwọn orí láti inú fáìlì nígbà tí ó bá ní wọn."
format-xtc.title = Ojú-ìwé XTC
help.plugin.name = Ìtọ́ni
help.plugin.description = Ó ń fi ohun tí àwọn ìdarí ìbòjú kan ń ṣe hàn, nígbà àkọ́kọ́ tí ó bá ṣí.
help.plugin.how = "Nígbà àkọ́kọ́ tí ìbòjú kan bá ṣí, àkọsílẹ̀ kúkúrú lórí rẹ̀ ń sọ ohun tí àwọn ìdarí rẹ̀ ń ṣe: àwọn apá ìbòjú tí títẹ̀ ń lọ, pẹ̀lú àlà yí wọn ká, àti ohun tí àwọn bọ́tìnnì ń ṣe.\n\nTítẹ̀ tàbí bọ́tìnnì èyíkéyìí ń pa àkọsílẹ̀ náà dé, kò sì ní padà wá fún ìbòjú yẹn mọ́. “Kò sí ìtọ́ni mọ́” ń pa gbogbo wọn.\n\nNínú ètò, lábẹ́ Sístẹ́mù, “Ìtọ́ni” ń tàn wọ́n tàbí pa wọ́n, “Tún ìtọ́ni fi hàn” sì ń mú kí àkọsílẹ̀ ìbòjú kọ̀ọ̀kan hàn lẹ́ẹ̀kan sí i."
help.title = Bí ó ṣe ń ṣiṣẹ́ níbí
help.got-it = Ó yé mi
help.no-more = Kò sí ìtọ́ni mọ́
