calibre.plugin.name = Ilé-ìkàwé aláìlókùn
calibre.plugin.description = Ó ń gba ìwé lórí nẹ́tíwọ́ọ̀kì. Ó ń ṣiṣẹ́ bí ẹ̀rọ aláìlókùn fún calibre.
calibre.plugin.how = "Ilé-ìkàwé aláìlókùn ń jẹ́ kí ẹ̀rọ náà hàn nínú Calibre lórí kọ̀ǹpútà rẹ bí ẹ̀rọ aláìlókùn. Calibre lè fi ìwé ránṣẹ́ sí i, ṣe àkójọ wọn, kí ó sì pa wọ́n rẹ́. Àwọn ìwé náà ń lọ sínú ilé-ìkàwé.\n\nṢí Ilé-ìkàwé aláìlókùn láti inú mẹ́nù Irinṣẹ́, kí ẹ̀rọ àti kọ̀ǹpútà wà lórí nẹ́tíwọ́ọ̀kì Wi-Fi kan náà. Nínú Calibre yan Connect/share, lẹ́yìn náà Start wireless device connection. Nígbà tí ẹ̀rọ bá ti rí kọ̀ǹpútà rẹ, á fi orúkọ rẹ̀ hàn; tẹ̀ Sopọ̀ (pẹ̀lú bọ́tìnnì, tẹ̀ Yàn). Calibre lè fi ìwé kún un tàbí pa ìwé rẹ́ níbí, nítorí náà sopọ̀ mọ́ kọ̀ǹpútà tìrẹ nìkan. Pípa ìbòjú náà dé ń parí ìsopọ̀.\n\nTí a kò bá rí Calibre fúnra rẹ̀, tẹ àdírẹ́sì kọ̀ǹpútà rẹ̀ nínú Ètò, lábẹ́ Ilé-ìkàwé, bí Àdírẹ́sì ní apá Calibre. Tí Calibre bá ń lo pọ́ọ̀tì míì yàtọ̀ sí 9090, fi kún un bí :pọ́ọ̀tì, fún àpẹẹrẹ 192.168.1.20:9091."
