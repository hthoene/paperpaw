home.plugin.name = Ìbòjú ilé
home.plugin.description = Ojú-ìwé ìbẹ̀rẹ̀: àwọn ojú-ìwé wíjẹ́ẹ̀tì, bí ìwé tí o ń kà àti àwọn irinṣẹ́.
home.plugin.how = "Ìbòjú ilé ní àwọn ojú-ìwé, ọ̀kọ̀ọ̀kan sì ní wíjẹ́ẹ̀tì àti irinṣẹ́ tí a tò sí ìlà àti òpó bí ti fóònù. Ní ìbẹ̀rẹ̀, aago, ìwé tí o ń kà àti àwọn ìwé tí o kà láìpẹ́ wà lójú-ìwé kan, gbogbo irinṣẹ́ sì wà lójú-ìwé tó tẹ̀lé e.\n\nTẹ̀ nǹkan kan láti ṣí i, kí o sì fa ìka tàbí lo bọ́tìnnì ojú-ìwé láti yí ojú-ìwé padà. Pẹ̀lú bọ́tìnnì nìkan, bọ́tìnnì ọfà ń lọ láti nǹkan kan sí èkejì, “Yàn” sì ń ṣí i.\n\nLáti tún un tò, di ìbòjú ilé mú, tẹ̀ pẹ́ńsùlù lábẹ́ ojú-ìwé tàbí yan “Ṣàtúnṣe ìbòjú ilé” nínú mẹ́nù. Fa àwọn nǹkan láti sún wọn tàbí tẹ̀ ọ̀kan fún àwọn àṣàyàn rẹ̀, pẹ̀lú bọ́tìnnì pàápàá. “Fi wíjẹ́ẹ̀tì kún un” wà níbẹ̀ pẹ̀lú. “Òpó” àti “Ìlà” wà nínú ètò, lábẹ́ Ìrísí, ní abala Ìbòjú ilé.\n\nLórí ìbòjú tí a yí sí ẹ̀gbẹ́, ìbòjú ilé ń fi àwọn nǹkan kan náà hàn pẹ̀lú òpó púpọ̀ sí i, ojú-ìwé kọ̀ọ̀kan ń kún kí èkejì tó bẹ̀rẹ̀, káàdì kò sì fẹ̀ ju nǹkan bí 110 mm lọ; ohunkóhun tí o tò ní ìdúró kò ní yí padà. Tò ó ní ẹ̀gbẹ́, a ó sì pa ìtò yẹn mọ́ fún ipò ẹ̀gbẹ́ nìkan: a ń fi wíjẹ́ẹ̀tì tuntun kún méjèèjì. “Dá ìtò ẹ̀gbẹ́ padà” nínú “Fi kún” (nígbà àtúnṣe) ń padà sí èyí tí a mú jáde láti ìtò ìdúró. Yíyọ wíjẹ́ẹ̀tì tàbí irinṣẹ́ kúrò ní ipò kan kò yọ ọ́ kúrò ní èkejì."
