joplin.bad-login = Joplin kò gba í-meèlì, orúkọ oníṣe tàbí ọ̀rọ̀ aṣínà náà. Ṣàyẹ̀wò wọn nínú ètò Joplin.
joplin.no-server = Kò sí Joplin Server ní àdírẹ́sì yìí. Ṣàyẹ̀wò rẹ̀ nínú ètò Joplin.
joplin.bad-address = PaperPaw kò lè lo àdírẹ́sì yìí. Ṣàyẹ̀wò rẹ̀ nínú ètò Joplin.
joplin.no-data = Kò sí àkọsílẹ̀ Joplin ní àdírẹ́sì yìí. Ṣàyẹ̀wò rẹ̀, tàbí kọ́kọ́ mú Joplin ṣọ̀kan pẹ̀lú rẹ̀.
joplin.encrypted = Ìfipamọ́ àṣírí láti òpin dé òpin ti Joplin wà ní títàn. PaperPaw kò lè sọ àkọsílẹ̀ di àṣírí, nítorí náà kò fi ìkankan ránṣẹ́.
joplin.newer-target = Joplin ń pa àkọsílẹ̀ ibẹ̀ mọ́ ní ìrísí tuntun ju èyí tí PaperPaw yìí mọ̀ lọ. Ṣe ìmúdójúìwọ̀n PaperPaw láti fi wọ́n ránṣẹ́.
joplin.older-target = Joplin ń pa àkọsílẹ̀ ibẹ̀ mọ́ ní ìrísí àtijọ́. Ṣí Joplin láti ṣe ìmúdójúìwọ̀n rẹ̀, lẹ́yìn náà tún fi ránṣẹ́.
joplin.upgrading = Joplin ń ṣe ìmúdójúìwọ̀n àkọsílẹ̀ ibẹ̀ lọ́wọ́lọ́wọ́. Wọn yóò dúró, a ó sì fi wọ́n ránṣẹ́ nígbà míì.
joplin.no-memory = Ìrántí kò tó láti fi àkọsílẹ̀ ránṣẹ́. Tún ẹ̀rọ bẹ̀rẹ̀ kí o sì gbìyànjú lẹ́ẹ̀kan sí i.
keyboard.plugin.name = Kíbọ́ọ̀dù
keyboard.plugin.description = Ó ń tẹ ọ̀rọ̀ sórí ìbòjú, pẹ̀lú ìfọwọ́kàn tàbí pẹ̀lú bọ́tìnnì.
keyboard.plugin.how = "Kíbọ́ọ̀dù ń ṣí nígbàkígbà tí nǹkan kan bá nílò ọ̀rọ̀: ìwákiri, ọ̀rọ̀ aṣínà, àkọsílẹ̀ tàbí ètò kan. Ó ń ṣiṣẹ́ pẹ̀lú ìfọwọ́kàn àti pẹ̀lú bọ́tìnnì nìkan.\n\nPẹ̀lú bọ́tìnnì, Òsì àti Ọtún ń rìn lórí ìlà kan, bọ́tìnnì ojú-ìwé ń lọ láti ìlà kan sí èkejì, “Yàn” ń tẹ bọ́tìnnì kan, “Padà” sì ń fagilé; Òsì àti Ọtún ń yí ká ìlà kan, Sókè àti Sísàlẹ̀ sì ń dúró nínú òpó rẹ. “Lẹ́tà ńlá” ń sọ lẹ́tà tó kàn di ńlá; tẹ̀ ẹ́ lẹ́ẹ̀mejì fún gbogbo lẹ́tà ńlá, kí o sì tún tẹ̀ ẹ́ lẹ́ẹ̀kan láti dá a dúró. Di lẹ́tà kan mú (pẹ̀lú bọ́tìnnì: di “Yàn” mú lórí rẹ̀) fún lẹ́tà ńlá rẹ̀, tí a yàn lẹ́sẹ̀kẹsẹ̀, àti àmì bí é àti è; ní èdè Jámánì, ä, ö, ü àti ß ń wá bẹ́ẹ̀ láti a, o, u àti s (pẹ̀lú bọ́tìnnì, kíbọ́ọ̀dù ń sọ bẹ́ẹ̀ lórí àwọn lẹ́tà yẹn). “Ó dáa” ń parí; pẹ̀lú bọ́tìnnì, di “Padà” mú láti parí láti ibikíbi (“Padà” nìkan ń fagilé), tàbí di “Yàn” mú lórí bọ́tìnnì tí kì í ṣe lẹ́tà. “Lẹ̀” ń fi ọ̀rọ̀ inú pátákó ẹ̀dà sí i, “Fóònù”, níbi tí ó bá wà, sì ń jẹ́ kí o tẹ ọ̀rọ̀ náà lórí fóònù rẹ dípò.\n\nNínú ètò, lábẹ́ Ẹrọ, Kíbọ́ọ̀dù: “Ìtò kíbọ́ọ̀dù” ń yan àwọn ìtò. Ní ìbẹ̀rẹ̀, ó ń tẹ̀lé èdè mẹ́nù; tí ó bá ju ọ̀kan lọ, bọ́tìnnì kan ń yí láti ọ̀kan sí èkejì. “Bọ́tìnnì umlaut” ń fún ä, ö, ü àti ß ní bọ́tìnnì tiwọn dípò. “Ìwọ̀n” ń mú kí bọ́tìnnì àti lẹ́tà tóbi sí i; pẹ̀lú bọ́tìnnì nìkan, àwọn ìlà ń dúró bí ti kíbọ́ọ̀dù kọ̀ǹpútà. Lórí ìbòjú ìfọwọ́kàn, “Ìrísí bọ́tìnnì” ń yí bí bọ́tìnnì ṣe rí padà. “Lẹ́tà ńlá aládàáṣe” ń bẹ̀rẹ̀ gbólóhùn kọ̀ọ̀kan pẹ̀lú lẹ́tà ńlá."
