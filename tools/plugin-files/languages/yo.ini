core.secrets-unopened = A kò lè ṣí àwọn ọ̀rọ̀ aṣínà àti kọ́kọ́rọ́ kan tí a fi pamọ́ sórí káàdì yìí níbí: orí ẹ̀rọ míì ni a ti fi wọ́n pamọ́, tàbí kọ́kọ́rọ́ ẹ̀rọ yìí ti sọnù. Tún wọ́n tẹ̀ níbi tí àfikún kan bá ti béèrè fún wọn.
