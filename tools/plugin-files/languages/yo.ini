news.plugin.name = Ìròyìn
news.plugin.description = Ó ń gba fíìdì ìròyìn (RSS, Atom) wá bí ìwé láti kà.
news.plugin.how = "Ìròyìn ń sọ fíìdì RSS tàbí Atom di ìwé. Fíìdì kọ̀ọ̀kan ń di ìwé kan nínú fódà News ti ilé-ìkàwé, pẹ̀lú àwọn àpilẹ̀kọ rẹ̀ tuntun jùlọ bí ọ̀rọ̀ lásán, láti kà bí ìwé míì.\n\nṢí Ìròyìn láti inú mẹ́nù Irinṣẹ́ kí o sì yan Fi fíìdì kún un; àdírẹ́sì rẹ̀ wà lórí ojú-òpó wẹ́ẹ̀bù ìwé ìròyìn tàbí búlọ́ọ̀gì náà. Gba ìròyìn wá ń gba gbogbo fíìdì, ó sì ń rọ́pò àwọn ìwé ti tẹ́lẹ̀. Di fíìdì kan mú (pẹ̀lú bọ́tìnnì, di Yàn mú) láti gbà á nìkan tàbí yọ ọ́ kúrò. Fíìdì tí a yọ kúrò ń fi ìwé rẹ̀ sílẹ̀ nínú ilé-ìkàwé.\n\nGbígbà nílò nẹ́tíwọ́ọ̀kì. Àpilẹ̀kọ fún fíìdì kan (Ètò, Ilé-ìkàwé) ń sọ iye àpilẹ̀kọ tí ìwé kọ̀ọ̀kan ń ní. Wíjẹ́ẹ̀tì Àkọlé ìròyìn ń fi wọ́n hàn lórí ìbòjú ilé."
