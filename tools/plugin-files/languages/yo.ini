update.plugin.name = Ìmúdójúìwọ̀n
update.plugin.description = Ó ń fi ìmúdójúìwọ̀n fámúwíà sórí ẹ̀rọ, láti orí káàdì tàbí tí a gbà sílẹ̀ láti ayélujára.
update.plugin.how = "Ìmúdójúìwọ̀n ń fi fámúwíà tuntun sórí ẹ̀rọ, lórí ẹ̀rọ tí PaperPaw jẹ́ fámúwíà rẹ̀, bí X4. Ìwọ yóò rí i nínú ètò, bí Ìmúdójúìwọ̀n.\n\nWá lórí ayélujára ń béèrè lọ́wọ́ sáfà ìmúdójúìwọ̀n fún PaperPaw tuntun, ó sì ń gbà á sílẹ̀, èyí tó ń gba ìṣẹ́jú díẹ̀ lórí Wi-Fi. Tàbí ṣe ẹ̀dà fáìlì ìmúdójúìwọ̀n kan (tó parí pẹ̀lú .bin, láti paperpaw.org) sínú fódà updates lórí káàdì, fún àpẹẹrẹ pẹ̀lú Gbígbé lórí Wi-Fi. Fi sórí ẹ̀rọ yóò wá gba nǹkan bí ìṣẹ́jú kan, ẹ̀rọ náà yóò sì tún bẹ̀rẹ̀; ìwé, ètò àti ibi tí o kà dé yóò wà bí wọ́n ṣe wà.\n\nTí Wá ìmúdójúìwọ̀n bá wà ní títàn (nínú ètò, ó wà ní pípa ní ìbẹ̀rẹ̀), ẹ̀rọ náà yóò béèrè fúnra rẹ̀ ní nǹkan bí ẹ̀ẹ̀kan lọ́sẹ̀, kìkì nígbà tí Wi-Fi bá ti wà ní títàn tẹ́lẹ̀ tàbí tí ó ń gba agbára. PaperPaw tuntun tí ó bá rí yóò dúró síbí; kò sí ohun tí yóò dí kíkà rẹ lọ́wọ́. Ìwádìí kan ń fi ohun tí ẹ̀rọ náà ń lò ránṣẹ́, kì í ṣe orúkọ tàbí nọ́ńbà rẹ̀; láti ka iye ẹ̀rọ, ó tún ń sọ bóyá ìwọ lo béèrè àti bóyá ìwádìí àkọ́kọ́ rẹ̀ ní ọjọ́, ọ̀sẹ̀ tàbí oṣù náà ni.\n\nTí àwọn àfikún tí o ń lò kò bá tíì ní ẹ̀yà fún ìtújáde tuntun náà, ìmúdójúìwọ̀n náà yóò dúró dè wọ́n. A ó fi ẹ̀yà àtijọ́ sórí ẹ̀rọ kìkì tí o bá yàn án.\n\nFámúwíà míì, bí CrossPoint, náà lè wọlé láti ibí: fi fáìlì rẹ̀ (tó parí pẹ̀lú .bin) sínú fódà updates, kí o sì ṣí Ìmúdójúìwọ̀n. PaperPaw ń yẹ̀ ẹ́ wò pé fámúwíà pípé fún ẹ̀rọ yìí ni, tí kò bàjẹ́, ṣùgbọ́n kò lè sọ ẹni tó ṣe é, nítorí a kò buwọ́ lù ú. Fi sórí ẹ̀rọ ṣá ń kọ ọ́ sínú ìdajì kejì ìrántí flash, ẹ̀rọ náà yóò sì bẹ̀rẹ̀ rẹ̀; PaperPaw yóò wà nínú ìdajì tirẹ̀ títí fámúwíà náà yóò fi fi nǹkan sórí rẹ̀. Láti padà sí PaperPaw lẹ́yìn náà, fi fáìlì ìfisórí rẹ̀ (paperpaw-<device>-<version>-install.bin) sórí ẹ̀rọ láti inú mẹ́nù fámúwíà kejì, bí SD firmware update ti CrossPoint."
