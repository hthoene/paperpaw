settings.plugin.name = Ètò
settings.plugin.description = Àwọn ojú-ìwé ètò, tí a kọ́ láti inú ètò gbogbo àfikún.
settings.plugin.how = "Ètò ń fi gbogbo ohun tí a lè ṣètò nínú PaperPaw àti àwọn àfikún rẹ̀ hàn, ní ojú-ìwé. Àwọn àfikún kò nílò ìbòjú tiwọn: ohun tí wọ́n kéde ń hàn níbí, ní ẹgbẹ́-ẹgbẹ́, pẹ̀lú àpèjúwe ètò kọ̀ọ̀kan nísàlẹ̀ rẹ̀.\n\nṢí i pẹ̀lú Ètò nínú mẹ́nù. Tẹ̀ ẹgbẹ́ kan láti ṣí i, lẹ́yìn náà tẹ̀ ètò kan láti tàn án tàbí pa á, tàbí láti yàn án; nọ́ńbà ní bọ́tìnnì − àti +. Pẹ̀lú bọ́tìnnì, lọ sí ètò kan kí o sì tẹ̀ Yàn: òsì àti ọ̀tún ń yí nọ́ńbà padà, Yàn ń pa á mọ́, Padà ń dá iye ti tẹ́lẹ̀ padà.\n\nÀwọn àyípadà ń ṣiṣẹ́ lẹ́sẹ̀kẹsẹ̀. Wá ń rí ètò nípa ọ̀rọ̀, Ètò onípele gíga sì ń fi àwọn tí a kì í sábà nílò kún un. Dá ìlànà padà àti Dá gbogbo rẹ̀ padà ń kọ́kọ́ béèrè."
