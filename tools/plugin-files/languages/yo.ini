sleep.plugin.name = Ìbòjú oorun
sleep.plugin.description = Ó ń fi ológbò tó ń sùn, èèpo ìwé, àwòrán rẹ tàbí ọ̀rọ̀ kan hàn nígbà tí ẹ̀rọ bá ń sùn.
sleep.plugin.how = "Ìbòjú oorun ń pinnu ohun tí ìbòjú ń fi hàn nígbà tí ẹ̀rọ bá ń sùn. E-ink máa ń pa àwòrán mọ́ láìsí agbára.\n\nYàn án nínú ètò, lábẹ́ Ẹrọ, Ìbòjú oorun, ní Fi hàn: ológbò tó ń sùn (ìlànà), èèpo ìwé, àwòrán mi, lógò àti “Ó ń sùn”, wíjẹ́ẹ̀tì, ojú-ìwé bí ó ti wà, tàbí ojú-ìwé pẹ̀lú àwòrán. Àwòrán mi ń fi àwọn fáìlì inú fódà àwòrán hàn ní ọ̀kọ̀ọ̀kan.\n\nTí kò bá sí èèpo tàbí àwòrán, ológbò ni yóò hàn. Níbi tí sístẹ́mù fúnra rẹ̀ bá ń ya ìbòjú oorun, a fi àwọn ètò yìí pamọ́.\n\nÌbòjú pípa, Fi hàn nígbà pípa, ni a ń yà lẹ́ẹ̀kan bí a ṣe ń pa ẹ̀rọ, láti mẹ́nù Agbára tàbí lẹ́yìn àkókò Pa lẹ́yìn oorun (kì í ṣe nígbà tí bátìrì tó ti lọ sílẹ̀ bá gé agbára). Ó dà bí ìbòjú oorun àyàfi tí o bá yan lógò àti “A ti pa á”, ológbò, èèpo ìwé tàbí àwòrán mi. Àfikún míì lè pèsè ìbòjú fún un.\n\nÌbòjú ìbẹ̀rẹ̀ àti ti àtúnbẹ̀rẹ̀, Fi hàn nígbà ìbẹ̀rẹ̀ àti Fi hàn nígbà àtúnbẹ̀rẹ̀, jẹ́ ti ẹ̀rọ fúnra rẹ̀ àyàfi tí àfikún míì bá pèsè ìbòjú fún wọn. Àwọn àfikún kò tíì ń ṣiṣẹ́ nígbà tí ẹ̀rọ ń bẹ̀rẹ̀: a ń ya ìbòjú tí a yàn fún ìbẹ̀rẹ̀ sílẹ̀ ṣáájú, bí ẹ̀rọ ṣe ń pa tàbí ń tún bẹ̀rẹ̀, a sì ń fi hàn ní ìbẹ̀rẹ̀ tó kàn. Ìbòjú tí kò bá ṣetán lásìkò, tàbí àwòrán tó ti bàjẹ́, yóò fi ààyè sílẹ̀ fún ti ẹ̀rọ; ẹ̀rọ yóò pa tàbí tún bẹ̀rẹ̀ lọ́nàkọnà."
