aids.plugin.name = Ìrànlọ́wọ́ kíkà
aids.plugin.description = Ìbẹ̀rẹ̀ ọ̀rọ̀ tó nípọn, ọ̀rọ̀ tí a pààrọ̀, àwòrán: ọ̀rọ̀ bí o ṣe fẹ́ ẹ.
aids.plugin.how = "Ìrànlọ́wọ́ kíkà ń yí bí ọ̀rọ̀ ìwé ṣe rí padà nígbà tí o bá ń kà. Wọ́n kan gbogbo ìwé. Ìbẹ̀rẹ̀ ọ̀rọ̀ tó nípọn àti Pààrọ̀ ọ̀rọ̀ wà ní pípa lákọ̀ọ́kọ́.\n\nÌwọ yóò rí wọn nínú Ètò, lábẹ́ Kíkà, ní abala Ìrànlọ́wọ́ kíkà. Ìbẹ̀rẹ̀ ọ̀rọ̀ tó nípọn ń kọ ìdajì àkọ́kọ́ ọ̀rọ̀ kọ̀ọ̀kan ní lẹ́tà tó nípọn, èyí tí àwọn kan rí pé ó rọrùn láti tẹ̀lé. Pààrọ̀ ọ̀rọ̀ ń gba àwọn méjì-méjì tí a kọ bí “ojo = òjò; Dr. = Dókítà”, tí a fi àmì ìdánudúró (;) yà sọ́tọ̀.\n\nỌrọ̀ odidi nìkan ni a ń pààrọ̀, gẹ́gẹ́ bí o ṣe kọ wọ́n gan-an, nítorí náà “ojo” kò ní yí apá kan ọ̀rọ̀ tó gùn jù padà láé. A kò yí fáìlì ìwé fúnra rẹ̀ padà.\n\nÀwòrán nínú ìwé lè hàn (bí ti ìbẹ̀rẹ̀), lè di ìlà kúkúrú bí “[Àwòrán: ọkọ̀ ojú omi lórí òkun]” tó ń lo àpèjúwe àwòrán náà, tàbí kí a fi wọ́n sílẹ̀. Ojú-ìwé yóò wá ní àyè púpọ̀ sí i fún ọ̀rọ̀, a kò sì ní ṣí àwòrán tí a kò fi hàn rárá, èyí tó ń jẹ́ kí ojú-ìwé yí kíákíá. Ìwé àwòrán ẹ̀fẹ̀ àti àwọn ìwé mìíràn tí a fi àwòrán ṣe kò ní yípadà."
