files.plugin.name = Olùwò fáìlì
files.plugin.description = Ń ṣe àkójọ àwọn ìwé àti fódà tó wà lórí ẹ̀rọ, ó sì ń ṣí wọn.
files.plugin.how = "Ilé-ìkàwé ń ṣe àkójọ àwọn ìwé tó wà nínú fódà ilé-ìkàwé rẹ, ọ̀kọ̀ọ̀kan pẹ̀lú èèpo rẹ̀, àkọlé, òǹkọ̀wé àti bí o ti kà á jìnnà tó. Ìwé tí o kà kẹ́yìn wà lókè bí káàdì, nítorí náà títẹ̀ kan, tàbí títẹ̀ Yàn lẹ́ẹ̀kan, ló tó láti máa bá kíkà lọ. Nígbà tí ilé-ìkàwé bá ń wá ìwé, ó ń sọ iye tí ó ti rí títí di ìsinsìnyí.\n\nYan ohun tí yóò hàn lókè àwọn ìwé: gbogbo wọn, èyí tí o ń kà, èyí tí o kò tíì kà tàbí èyí tí o ti kà tán, tàbí àwọn pẹpẹ ìwé (nípa òǹkọ̀wé, ọ̀wọ́, tágì, àyànfẹ́, ìwé tó kàn nínú ọ̀wọ́ kọ̀ọ̀kan tí o ti bẹ̀rẹ̀). Tẹ̀ ìwé kan láti kà á; di í mú (pẹ̀lú bọ́tìnnì, di Yàn mú) láti ṣí i, sàmì sí i bí èyí tí o ti kà tán tàbí tí o kò tíì kà, wo ìsọfúnni rẹ̀, sún un sí àpamọ́ tàbí pa á rẹ́. Tẹ̀ àkọlé fún mẹ́nù ilé-ìkàwé: bí a ṣe ń to ìwé àti bí a ṣe ń fi wọ́n hàn, ìwádìí, fódà ilé-ìkàwé àti ètò.\n\nA ń ṣètò fódà ilé-ìkàwé nínú Ètò, lábẹ́ Ilé-ìkàwé, bí Fódà ilé-ìkàwé; níbẹ̀ o tún lè fi àwọn ìwé hàn bí àtẹ èèpo. Fún gbogbo fáìlì míì, lo Fáìlì nínú mẹ́nù Irinṣẹ́."
