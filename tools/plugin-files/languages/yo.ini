vocabulary.sd.nomemory = Ìrántí kò tó láti ka àwọn fáìlì lórí káàdì. Tún gbìyànjú.
vocabulary.sd.nocard = A kò lè ka káàdì náà. Rí i dájú pé ó wà nínú ẹ̀rọ, lẹ́yìn náà tún gbìyànjú.
