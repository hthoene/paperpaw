notes-overview.plugin.name = Gbogbo àkọsílẹ̀
notes-overview.plugin.description = Àmì ìwé àti àmì àfihàn gbogbo ìwé nínú àkójọ kan, àti gbígbé jáde bí My Clippings.txt.
notes-overview.plugin.how = "Gbogbo àkọsílẹ̀ ń ṣe àkójọ gbogbo ìwé tí o ti fi àmì ìwé tàbí àmì àfihàn sí, pẹ̀lú iye wọn. Ṣí i nínú Irinṣẹ́. Yàn ìwé kan láti rí àwọn àkọsílẹ̀ rẹ̀, àti àkọsílẹ̀ kan láti ṣí ìwé náà níbẹ̀.\n\nNí ìparí àkójọ náà, Gbé jáde bí My Clippings.txt ń kọ gbogbo àkọsílẹ̀ sínú fáìlì kan, nínú fódà Exports lẹ́gbẹ̀ẹ́ ilé-ìkàwé, ní ìrísí tí Kindle ń lò (UTF-8). Áàpù tó ń ka My Clippings.txt ti Kindle lè kà á. Àkọsílẹ̀ lórí àmì àfihàn jẹ́ ohun kan fúnra rẹ̀, bí ti Kindle. Nítorí pé ìwé kan níbí kò ní ipò Kindle, “location” ni bí àkọsílẹ̀ náà ti jìn tó nínú ìwé, ní ìpín ọgọ́rùn-ún. A ń tún fáìlì náà kọ ní ìgbà kọ̀ọ̀kan; ó ń rọ́pò ti tẹ́lẹ̀."
