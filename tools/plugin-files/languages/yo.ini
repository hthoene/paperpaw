profiles.plugin.name = Pírófáìlì kíkà
profiles.plugin.description = Àwọn àkójọ ètò kíkà àti ìfihàn tí a sọ lórúkọ, tí o lè yí pẹ̀lú títẹ̀ kan.
profiles.plugin.how = "Pírófáìlì kan ń pa ètò kíkà rẹ, ètò ìfihàn àti àwọn ìlà ipò mọ́ lábẹ́ orúkọ kan, bíi Alẹ́ tàbí Lẹ́tà ńlá, ó sì ń dá wọn padà pẹ̀lú títẹ̀ kan.\n\nṢí Pírófáìlì nínú mẹ́nù kíkà lábẹ́ Síwájú sí i, tàbí nínú Ètò lábẹ́ Ìṣàdáni. Tẹ̀ pírófáìlì kan láti lò ó; a sàmì sí èyí tó wà ní lílò. Di í mú (pẹ̀lú bọ́tìnnì, di Yàn mú) láti fi ètò ìsinsìnyí pamọ́ sínú rẹ̀, láti tún un sọ lórúkọ tàbí láti yọ ọ́ kúrò. Fi pamọ́ bí pírófáìlì tuntun ń pa ohun tí a ṣètò báyìí mọ́.\n\nPírófáìlì tó kàn ń yí sí èyí tó tẹ̀lé e nínú àkójọ; fi í sí bọ́tìnnì kan tàbí sínú òfin kan."
