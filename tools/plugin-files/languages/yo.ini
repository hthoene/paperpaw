mail.plugin.name = Í-meèlì
mail.plugin.description = Ó ń ka í-meèlì, ó sì ń fi ránṣẹ́ pẹ̀lú ọ̀rọ̀ aṣínà tàbí ọ̀rọ̀ aṣínà áàpù (IMAP àti SMTP), láìsí wíwọlé nínú aṣàwákiri.
mail.plugin.how = "Í-meèlì ń ka í-meèlì, ó sì ń fi ránṣẹ́ lórí IMAP àti SMTP. Ó ń wọlé pẹ̀lú àdírẹ́sì rẹ àti ọ̀rọ̀ aṣínà, láìsí wíwọlé nínú aṣàwákiri, nítorí náà ó ń ṣiṣẹ́ pẹ̀lú olùpèsè èyíkéyìí tó bá gbà bẹ́ẹ̀.\n\nṢètò àkáǹtì lábẹ́ Ètò, Í-meèlì. Yan olùpèsè rẹ, tẹ àdírẹ́sì rẹ àti ọ̀rọ̀ aṣínà. Ọpọ̀ olùpèsè ń fẹ́ ọ̀rọ̀ aṣínà áàpù: ṣe ọ̀kan nínú ètò ààbò àkáǹtì rẹ kí o sì lò ó níbí. Ọrọ̀ aṣínà rẹ déédé kì í sábà ṣiṣẹ́, kì í sì í lọ sí ibòmíràn àfi sáfà olùpèsè rẹ. A ń pa á mọ́ pẹ̀lú àwọn ọ̀rọ̀ aṣínà àti kọ́kọ́rọ́.\n\nṢí Í-meèlì nínú Irinṣẹ́. Wo í-meèlì ń gba àwọn í-meèlì tuntun jùlọ àti àwọn fódà wá. A ń pa àwọn í-meèlì mọ́ sórí káàdì, nítorí náà o lè kà wọ́n láìsí nẹ́tíwọ́ọ̀kì. Ẹrọ náà ń sopọ̀, ó ń gbà wọ́n, ó sì ń já ìsopọ̀, nítorí náà Wi-Fi ń wà ní títàn fún ìgbà díẹ̀ nìkan.\n\nBí olùpèsè rẹ kò bá sí nínú àkójọ, yan Sáfà tìrẹ kí o sì ṣètò orúkọ sáfà, pọ́ọ̀tù àti ààbò lábẹ́ ètò ìlọsíwájú. Sáfà tí kò sí aláṣẹ kankan tó fọwọ́ sí ìwé-ẹ̀rí rẹ̀ yóò béèrè lẹ́ẹ̀kan bóyá kí o gbẹ́kẹ̀lé e; fi àtẹ̀ka rẹ̀ wé èyí tí olùpèsè rẹ fi hàn.\n\nÍ-meèlì tí ìwé kan so mọ́ (EPUB, PDF àti irú wọn, tó 2 MB) ní Ṣí ìwé lábẹ́ rẹ̀: ó ń gba fáìlì náà, ó ń fi sínú ilé-ìkàwé rẹ, ó sì ń ṣí i.\n\nLáti rí í-meèlì tuntun láìṣí Í-meèlì, tan Wá í-meèlì tuntun lábẹ́lẹ̀ lábẹ́ Ètò, Í-meèlì, kí o sì yan bí ó ṣe máa ń wáyé tó (ní ìṣẹ́jú 15, 30 tàbí 60). Ó wà ní pípa títí o fi tàn án. Ẹrọ kíkà yóò máa sopọ̀ lẹ́ẹ̀kọ̀ọ̀kan lórí ìsopọ̀ tó ní ààbò nígbà tí ó bá jí tí ó sì wà lórí ayélujára, àkáǹtì kan lẹ́yìn èkejì, yóò sì ṣe ìmúdójúìwọ̀n iye í-meèlì tí a kò kà lórí Ilé. Ó ń lo bátìrì díẹ̀. Ṣíṣí Í-meèlì ń dá àyẹ̀wò tó ń lọ lọ́wọ́ dúró.\n\nWíjẹ́ẹ̀tì ìbòjú ilé ń fi iye í-meèlì tí a kò kà hàn, àwọn tuntun jùlọ àti àwọn tí a fi ìràwọ̀ sí, àpò í-meèlì kan, àti ọ̀nà àbùjá láti kọ í-meèlì."
