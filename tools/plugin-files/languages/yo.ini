diagnostics.plugin.name = Àyẹ̀wò
diagnostics.plugin.description = Ìbòjú ìdánwò àti àyẹ̀wò onítọ̀sọ́nà fún gbogbo apá ẹ̀rọ kan.
diagnostics.plugin.how = "Àyẹ̀wò jẹ́ ìbòjú ìdánwò fún yíyẹ ẹ̀rọ wò: ó ń fi gbogbo ìpele eérú tí pánẹ́ẹ̀lì lè fi hàn hàn, àpótí mẹ́rin láti dán bọ́tìnnì àti ìfọwọ́kàn wò, àti oníkà ojú-ìwé pẹ̀lú ọ̀pá ìlọsíwájú láti fi àwọn ọ̀nà ìsọdọ̀tun wé ara wọn.\n\nÌbòjú ìdánwò kò ní ibì kan nínú mẹ́nù. Ó jẹ́ ìbòjú ilé nìkan nígbà tí kò sí àfikún míì tó ń pèsè ọ̀kan, tàbí nígbà tí o bá yàn án lábẹ́ Ìbòjú nínú olùṣàkóso àfikún fún ibi Ìbòjú ilé.\n\nYàn ń sàmì sí àpótí tó wà ní ojú, bọ́tìnnì ọfà sì ń lọ láàrin àwọn àpótí; pẹ̀lú ìfọwọ́kàn, tẹ̀ àpótí kan. Bọ́tìnnì ojú-ìwé ń yí ojú-ìwé ìdánwò. Di Yàn mú, tàbí di ìka mú lórí ìbòjú, láti bẹ̀rẹ̀ láti ìbẹ̀rẹ̀.\n\nÀyẹ̀wò ẹ̀rọ, lábẹ́ Irinṣẹ́ níbi tí PaperPaw ti jẹ́ ẹ̀yà àìrídìmú ẹ̀rọ náà, ń lọ nínú gbogbo apá ẹ̀rọ kan ní ojú-ìwé kan lẹ́ẹ̀kan: ìbòjú, bọ́tìnnì, ìfọwọ́kàn, ìmọ́lẹ̀ iwájú, bátìrì, káàdì, aago, Wi-Fi, oorun àti ìrántí. Ojú-ìwé kọ̀ọ̀kan ń parí pẹ̀lú Kùnà, Fò ó àti Yege, a sì ti yan ìdáhùn tí àwọn ìwọ̀n rẹ̀ dábàá; a ń fo àwọn apá tí ẹ̀rọ kò ní. Lẹ́yìn ìdáhùn kọ̀ọ̀kan, ó ń kọ ìròyìn sí .paperpaw/plugins/diagnostics/device-check.txt, láti lẹ̀ mọ́ pull request. Padà ń jáde, yóò sì máa bá a lọ láti ibi tí ó dé nígbà tí a bá tún ṣí i. Lórí ẹ̀rọ tí ó ní bọ́tìnnì nìkan, kọ́kọ́ yan Bẹ̀rẹ̀ lórí ojú-ìwé bọ́tìnnì; títí di ìgbà náà ọfà, Yàn àti Padà ń ṣiṣẹ́ bí ti gbogbo ojú-ìwé."
