menu.plugin.name = Mẹ́nù
menu.plugin.description = Mẹ́nù ní ìsàlẹ̀ ìbòjú, pẹ̀lú àwọn ìgbésẹ̀ àti ètò.
menu.plugin.how = "Mẹ́nù ń ṣe àkójọ ohun tí o lè ṣe àti ohun tí o lè ṣètò. Ó ń ṣí ní ìsàlẹ̀ ìbòjú, lórí ohunkóhun tó wà ní ṣíṣí: nígbà kíkà, tẹ̀ àárín ìbòjú tàbí tẹ̀ Yàn. Tẹ̀ àṣàyàn kan tàbí yàn án láti ṣe é.\n\nÈtò nínú mẹ́nù ń fi iye wọn hàn, wọ́n sì ń yí padà níbẹ̀ gan-an, nítorí náà mẹ́nù ń wà ní ṣíṣí. Àṣàyàn tó ní àṣàyàn míì nínú ń ṣí mẹ́nù kékeré.\n\nFa ìka sísàlẹ̀ láti etí òkè fún pánẹ́ẹ̀lì kíákíá: ohun tí o máa ń yí padà lóòrèkóòrè, bí bọ́tìnnì. Tẹ̀ bọ́tìnnì kan láti yí i padà, di í mú fún ètò rẹ̀. Pẹ̀lú bọ́tìnnì nìkan, bọ́tìnnì ọfà ń yàn, Yàn ń yí i padà, Padà sì ń pa á dé. Lábẹ́ Ìrísí, Mẹ́nù ń fi mẹ́nù hàn bí àkójọ tàbí bí àpótí."
