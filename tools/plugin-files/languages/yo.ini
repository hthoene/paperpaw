core.setting.padding.help = Àyè láàárín àkóónú wíjẹ́ẹ̀tì àti etí rẹ̀ tàbí àlà rẹ̀.
core.setting.font = Fọ́ǹtì
core.setting.font.help = Fọ́ǹtì wíjẹ́ẹ̀tì yìí. Ọrọ̀ tó tóbi jù fún fọ́ǹtì láti inú káàdì yóò wà ní fọ́ǹtì mẹ́nù.
core.setting.size = Ìwọ̀n
core.setting.size.help = Bí ọ̀rọ̀ wíjẹ́ẹ̀tì ṣe tóbi tó. Níbi tí kò bá ti gbà, a ó dín in kù.
