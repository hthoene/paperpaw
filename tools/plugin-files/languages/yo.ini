file-manager.plugin.name = Olùṣàkóso fáìlì
file-manager.plugin.description = Gbogbo fódà àti fáìlì lórí ẹ̀rọ: ṣí wọn, yí orúkọ wọn padà, sún wọn, ṣe ẹ̀dà wọn kí o sì pa wọ́n rẹ́.
file-manager.plugin.how = "Olùṣàkóso fáìlì ń fi gbogbo fódà àti fáìlì tó wà nínú ibi ìpamọ́ ẹ̀rọ hàn, kì í ṣe ìwé rẹ nìkan, ó sì ń jẹ́ kí o ṣí wọn, tún wọn sọ lórúkọ, sún wọn, ṣe ẹ̀dà wọn, pa wọ́n rẹ́, kí o sì ṣe fódà tuntun.\n\nṢí Fáìlì láti inú mẹ́nù Irinṣẹ́. Tẹ̀ fódà kan láti wọ inú rẹ̀; Padà ń lọ sí fódà tó wà lókè rẹ̀. Tẹ̀ fáìlì kan, tàbí di ohunkóhun mú (pẹ̀lú bọ́tìnnì, di Yàn mú), láti rí ohun tí o lè fi ṣe. Sún àti Ṣe ẹ̀dà ń mú ohun náà: lọ sí fódà tí ó yẹ kí ó wà, kí o sì yan Lẹ̀ ẹ́ síbí nínú ọ̀pá ní ìsàlẹ̀. Pẹ̀lú bọ́tìnnì, tẹ̀ Sísàlẹ̀ láti ohun tó kẹ́yìn láti dé ọ̀pá náà.\n\nFáìlì àti fódà tí orúkọ wọn bẹ̀rẹ̀ pẹ̀lú àmì (.), bí dátà PaperPaw fúnra rẹ̀, ń farasin. Láti rí wọn, tan Fáìlì tó farasin nínú Ètò, lábẹ́ Ilé-ìkàwé."
