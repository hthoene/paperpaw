calendar.plugin.name = Kàlẹ́ńdà
calendar.plugin.description = Àwọn kàlẹ́ńdà rẹ lórí ẹ̀rọ kíkà: àkójọ ìṣẹ̀lẹ̀, ọjọ́, ọ̀sẹ̀ àti oṣù láti CalDAV, iCal àti fáìlì, ọjọ́ ìbí láti ọ̀dọ̀ olùbásọ̀rọ̀, wíjẹ́ẹ̀tì ìbòjú ilé àti ìbòjú oorun.
calendar.plugin.how = "Àwọn kàlẹ́ńdà rẹ lórí ẹ̀rọ kíkà: àkójọ ìṣẹ̀lẹ̀ ọjọ́ tó ń bọ̀, ọjọ́ kan, ọ̀sẹ̀ kan àti oṣù kan, pẹ̀lú ìṣẹ̀lẹ̀ láti kàlẹ́ńdà CalDAV (Nextcloud, Radicale, Baïkal, Fastmail àti àwọn míì), àdírẹ́sì iCal (.ics, webcal://), fáìlì kàlẹ́ńdà lórí káàdì, àti ọjọ́ ìbí àti àyájọ́ àwọn olùbásọ̀rọ̀ rẹ (CardDAV). Ẹrọ kíkà ń ka kàlẹ́ńdà nìkan; kì í yí wọn padà láé.\n\nṢí Kàlẹ́ńdà láti inú mẹ́nù Irinṣẹ́. Ìlà àkọ́kọ́ ń sọ irú ìfihàn; yàn án, tàbí di ìlà èyíkéyìí mú tàbí tẹ̀ Mẹ́nù, láti yí padà láàrin Àkójọ ìṣẹ̀lẹ̀, Ọjọ́, Ọsẹ̀, Oṣù àti Ọjọ́ ìbí, láti fi kàlẹ́ńdà kún un tàbí láti mú wọn ṣiṣẹ́pọ̀. Nínú Ọjọ́ àti Ọsẹ̀, ìlà méjì àkọ́kọ́ ń lọ sí ọjọ́ tàbí ọ̀sẹ̀ tó ṣáájú àti tó tẹ̀lé e (bọ́tìnnì ojú-ìwé pẹ̀lú); nínú Oṣù, bọ́tìnnì ọfà ń sún ọjọ́, ti ojú-ìwé ń sún oṣù, Yàn sì ń ṣí ọjọ́ náà. Yàn lórí ìṣẹ̀lẹ̀ kan ń fi í hàn lódindi: ìgbà, ibi, kàlẹ́ńdà wo àti bí ó ṣe ń tún ṣẹlẹ̀. Padà ń padà sẹ́yìn ní ìgbésẹ̀ kan.\n\nFi kàlẹ́ńdà kún un lábẹ́ Kàlẹ́ńdà (nínú mẹ́nù, tàbí Kàlẹ́ńdà nínú ètò). Yan irú rẹ̀: àkáǹtì CalDAV (àdírẹ́sì sáfà ti tó, bí cloud.example.com/remote.php/dav; gbogbo kàlẹ́ńdà tó ní ìṣẹ̀lẹ̀ á hàn), àdírẹ́sì iCal (kàlẹ́ńdà tí a tẹ̀ jáde bí .ics), fáìlì kàlẹ́ńdà lórí káàdì, tàbí olùbásọ̀rọ̀ (ìwé àdírẹ́sì CardDAV: ẹ̀rọ kíkà ń fi ọjọ́ ìbí àti àyájọ́ tí wọ́n ní hàn). Tẹ àdírẹ́sì, fún àkáǹtì orúkọ olùmúlò rẹ àti ọ̀rọ̀ aṣínà (ọ̀rọ̀ aṣínà áàpù ló dára jù; a ń pa á mọ́ pẹ̀lú àwọn ọ̀rọ̀ aṣínà ẹ̀rọ kíkà), àti orúkọ kan. Kàlẹ́ńdà kọ̀ọ̀kan ní àmì (kókó, òrùka, kókó eérú tàbí onígun mẹ́rin) tí o lè yí padà láti dá wọn mọ̀ yàtọ̀; tó kàlẹ́ńdà mẹ́fà.\n\nÌṣẹ̀lẹ̀ tó ń tún ṣẹlẹ̀ (lójoojúmọ́, lọ́sọ̀ọ̀sẹ̀, lóṣooṣù, lọ́dọọdún, pẹ̀lú ọjọ́ ọ̀sẹ̀, iye ìgbà, ọjọ́ ìparí àti ọjọ́ tí a fò), ìṣẹ̀lẹ̀ gbogbo ọjọ́ àti ìṣẹ̀lẹ̀ ní agbègbè àkókò míì ń hàn ní àkókò aago ẹ̀rọ kíkà. Ẹrọ kíkà ń pa ìṣẹ̀lẹ̀ mọ́ láti ọjọ́ 60 ṣáájú òní dé ọjọ́ 60 lẹ́yìn rẹ̀, 240 ní púpọ̀ jù, ó sì ń fi wọ́n hàn láìsí nẹ́tíwọ́ọ̀kì. Òfin tí kò lè kà ń fi ìṣẹ̀lẹ̀ rẹ̀ hàn lẹ́ẹ̀kan.\n\nA ń ka kàlẹ́ńdà nígbà tí o bá ṣí i (ẹ̀ẹ̀kan ní ìṣẹ́jú 5 ní púpọ̀ jù), nígbà tí o bá yan Mú ṣiṣẹ́pọ̀ báyìí, àti, bí o ṣe ṣètò lábẹ́ Kàlẹ́ńdà nínú ètò, nígbà tí nẹ́tíwọ́ọ̀kì bá ti wà ní títàn tàbí tí gbígba agbára bá bẹ̀rẹ̀. Ẹrọ kíkà kì í tan rédíò rẹ̀ fún èyí láé, àfi tí o bá béèrè Mú ṣiṣẹ́pọ̀ báyìí.\n\nWíjẹ́ẹ̀tì fún ìbòjú ilé (di ìbòjú ilé mú, kí o fi wíjẹ́ẹ̀tì kún un): Òní: ọjọ́ náà àti ohun tí ó ní; Ìṣẹ̀lẹ̀ tó kàn: ìṣẹ̀lẹ̀ tó kàn; Àkójọ ìṣẹ̀lẹ̀: àwọn ọjọ́ tó ń bọ̀; Oṣù: oṣù kan pẹ̀lú kókó lábẹ́ ọjọ́ tó ní ìṣẹ̀lẹ̀; Ọjọ́ ìbí: ọjọ́ ìbí tó ń bọ̀. Títẹ̀ ìṣẹ̀lẹ̀ kan tàbí ọjọ́ kan nínú oṣù ń ṣí i. Ìbòjú oorun lè fi àkójọ ìṣẹ̀lẹ̀ òní hàn: yan Kàlẹ́ńdà lábẹ́ Ìbòjú oorun nínú ètò."
