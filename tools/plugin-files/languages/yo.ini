reader.plugin.name = Kíkà ìwé
reader.plugin.description = Ń fi ìwé hàn ní ojú-ìwé kọ̀ọ̀kan, pẹ̀lú àkóónú àti ètò kíkà.
reader.plugin.how = "Kíkà ìwé ń fi ìwé hàn ní ojú-ìwé kọ̀ọ̀kan. Ṣí ìwé kan láti inú ilé-ìkàwé; ìwé tó kẹ́yìn lè ṣí ní ìbẹ̀rẹ̀ (ètò Ṣí ìwé tó kẹ́yìn ní ìbẹ̀rẹ̀).\n\nTẹ̀ apá òsì tàbí ọ̀tún ìbòjú, tàbí lo bọ́tìnnì ojú-ìwé, láti yí ojú-ìwé. Tẹ̀ àárín tàbí tẹ̀ Yàn fún mẹ́nù kíkà: Àkóónú, Wá, Lọ sí ojú-ìwé, Fọ́ǹtì àti ìtò, Àmì ìwé àti àmì àfihàn àti àwọn míì. Fífà sísàlẹ̀ láti etí òkè ń ṣí Pánẹ́ẹ̀lì kíákíá, fífà sókè láti etí ìsàlẹ̀ ń lọ sí Ilé; dídi Padà mú náà ń ṣe bẹ́ẹ̀.\n\nDi Yàn mú (tàbí di àwòrán kan mú) láti wo àwòrán ní ìbòjú kíkún: Òsì àti Ọtún ń lọ láàrin àwọn àwòrán ojú-ìwé náà. Yàn ń sún un mọ́ ní 2x, 3x àti padà (tẹ̀ lẹ́ẹ̀mejì lórí ìfọwọ́kàn); nígbà tí a ti sún un mọ́, Òsì àti Ọtún ń sún un sí ẹ̀gbẹ́, bọ́tìnnì ojú-ìwé (tàbí fífà) ń lọ síwájú ní ìbú, lẹ́yìn náà sísàlẹ̀. Padà ń padà sí ìwọ̀n tó bá ìbòjú mu, lẹ́yìn náà sí ojú-ìwé (lórí ìfọwọ́kàn, di í mú láti kúrò). Tẹ̀ igun òkè ọ̀tún fún àmì ìwé. Di ọ̀rọ̀ kan mú láti fi àmì àfihàn sí i. Pẹ̀lú bọ́tìnnì, di Òsì mú: Òsì àti Ọtún ń sún ní ọ̀rọ̀ kọ̀ọ̀kan, bọ́tìnnì ojú-ìwé ní ìlà kọ̀ọ̀kan, dídi wọ́n mú ń lọ sí òpin ojú-ìwé àti ní ìpínrọ̀ kọ̀ọ̀kan; Yàn ń ṣí ọ̀pá àmì àfihàn fún ọ̀rọ̀ náà, dídi Yàn mú ń fẹ̀ ẹ́ dé gbólóhùn àti ìpínrọ̀ (lẹ́yìn náà Òsì àti Ọtún ń sún òpin rẹ̀, dídi wọ́n mú ń sún ìbẹ̀rẹ̀ rẹ̀). Àṣàyàn ń bá a lọ kọjá yíyí ojú-ìwé. Gbé jáde bí Markdown ń fi àkọsílẹ̀ rẹ pamọ́."
