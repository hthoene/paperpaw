store.plugin.name = Ọjà àfikún
store.plugin.description = Ó ń wá àfikún fún ẹ̀rọ yìí, ó ń fi wọ́n sórí ẹ̀rọ, ó ń ṣe ìmúdójúìwọ̀n wọn, ó sì ń yọ wọ́n kúrò.
store.plugin.how = "Ọjà àfikún ń wá àfikún fún ẹ̀rọ yìí lórí ayélujára, ó ń fi wọ́n sórí ẹ̀rọ, ó ń ṣe ìmúdójúìwọ̀n wọn, ó sì ń yọ wọ́n kúrò. Ṣí i láti inú Irinṣẹ́; ó nílò Wi-Fi.\n\nÌbẹ̀rẹ̀ rẹ̀ ń fi ohun tí ilé-ìkàwé dámọ̀ràn hàn, ohun tó jẹ́ tuntun tàbí tó gbajúmọ̀ báyìí, lẹ́yìn náà àwọn ẹgbẹ́. Ẹgbẹ́ kan ń to àwọn àfikún rẹ̀ ní àdàlù tó tọ́, tó ń yí padà lójoojúmọ́, kí gbogbo àfikún lè hàn; to wọ́n láti A dé Z, nípa èyí tó tuntun jùlọ tàbí ìmúdójúìwọ̀n tó kẹ́yìn, kí o sì lọ sí lẹ́tà kan nínú àkójọ gígùn. Ṣí ọ̀kan láti rí ojú-ìwé rẹ̀, pẹ̀lú ìwọ̀n rẹ̀ àti ìrántí tó ń lò, lẹ́yìn náà yan Fi sórí ẹ̀rọ, Ṣe ìmúdójúìwọ̀n tàbí Yọ kúrò. Ṣe ìmúdójúìwọ̀n gbogbo ń mú gbogbo àfikún tí a fi sórí ẹ̀rọ dójú ìwọ̀n.\n\nÀfikún kóòdù ń ṣiṣẹ́ pẹ̀lú àṣẹ kíkún lórí ẹ̀rọ: ọjà náà ń sọ bẹ́ẹ̀, ó ń kọ́kọ́ béèrè, wọ́n sì ń bẹ̀rẹ̀ lẹ́yìn àtúnbẹ̀rẹ̀. Tí ọ̀kan bá bàjẹ́, PaperPaw á bẹ̀rẹ̀ láìsí àfikún kóòdù, á sì sọ èyí tó jẹ́. Ilé-ìkàwé àfikún ni ó ń pinnu ibi tí àkójọ náà ti wá.\n\nÀfikún àwùjọ, nínú Ètò, Sístẹ́mù, tún ń to àwọn àfikún tí àwọn míì tẹ̀ jáde lórí GitHub. Kò sí ẹni tó yẹ̀ wọ́n wò: a sàmì sí wọn bí Láìyẹ̀wò, ojú-ìwé àfikún kóòdù kan ń fi kọ́kọ́rọ́ tí a fi fọwọ́ sí i hàn, a kò sì ní fi ìmúdójúìwọ̀n tí kọ́kọ́rọ́ míì fọwọ́ sí sórí ẹ̀rọ.\n\nOrísun, ìlà tó kẹ́yìn ní ìbẹ̀rẹ̀, ń fi àkójọ àfikún àwọn míì kún un nípa àdírẹ́sì wọn (https://…/plugins.json), ń to ọ̀kan nínú wọn dípò ti PaperPaw, tàbí ń yọ ọ́ kúrò. Dípò títẹ̀, fi fáìlì sources.txt tí àdírẹ́sì kan wà ní ìlà kọ̀ọ̀kan sínú .paperpaw/plugins/store lórí káàdì: àwọn àdírẹ́sì náà á hàn lábẹ́ Orísun bí tuntun. PaperPaw kò ṣàyẹ̀wò orísun kankan tàbí àwọn àfikún rẹ̀, ẹ̀rọ náà sì ń kàn sí sáfà orísun náà. Orísun kan ń fọwọ́ sí àkójọ rẹ̀; ẹ̀rọ náà ń pa kọ́kọ́rọ́ àkójọ àkọ́kọ́ tó kà mọ́, láti ìgbà náà lọ ó ń gba kìkì àkójọ àti àfikún kóòdù tí a fi kọ́kọ́rọ́ náà fọwọ́ sí. Àfikún kan ń gba ìmúdójúìwọ̀n rẹ̀ láti orísun tí a ti fi sórí ẹ̀rọ nìkan. Ilé-ìkàwé PaperPaw fúnra rẹ̀ máa ń wà níbẹ̀ nígbà gbogbo, a kò sì lè yọ ọ́ kúrò; kíkúrò nínú ọjà ń dá a padà sí i."
