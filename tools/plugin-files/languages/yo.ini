bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Ń so rìmóòtù, kíbọ́ọ̀dù àti sẹ́ńsọ̀ pọ̀, ó sì ń sopọ̀ mọ́ wọn.
bluetooth.plugin.how = "Bluetooth ń so rìmóòtù, kíbọ́ọ̀dù àti sẹ́ńsọ̀ pọ̀ mọ́ ẹ̀rọ kíkà, níbi tí ó bá ní Bluetooth (X4 Pro).\n\nFi ẹ̀rọ kún un ń wá ohun tó wà nítòsí; kọ́kọ́ fi ẹ̀rọ náà sí ipò ìsopọ̀. Yan án, kí o sì fọwọ́ sí i lórí ẹ̀rọ kíkà (fi nọ́ńbà wéra níbi tí ọ̀kan bá hàn). Bọ́tìnnì rìmóòtù tàbí kíbọ́ọ̀dù yóò wá máa yí ojú-ìwé, wọn yóò sì máa rìn nínú mẹ́nù; yí ohun tí bọ́tìnnì kọ̀ọ̀kan ń ṣe padà lábẹ́ Ìdarí.\n\nRìmóòtù ń sọ ìgbà tí bọ́tìnnì wọn ń ṣiṣẹ́: nígbà tí a bá tàn án níbí, nígbà kíkà (ó ń sopọ̀ nígbà tí ìwé kan bá ṣí, èyí ń dín ìlò bátìrì kù), tàbí nígbà gbogbo. Bọ́tìnnì mẹ́nù tàbí títẹ̀ pẹ́ lórí ẹ̀rọ kan ń gbàgbé rẹ̀.\n\nSẹ́ńsọ̀ wà fún àfikún: tan àfikún tí ó lè lò ó. Bluetooth máa ń wà ní pípa nígbà tí kò sí ohun tí ń lò ó."
