battery.plugin.name = Ìlò bátìrì
battery.plugin.description = Ń ṣàkọsílẹ̀ bátìrì, ó sì ń fi bí ó ṣe ń pẹ́ tó hàn.
battery.plugin.how = "Ìlò bátìrì ń kọ iye agbára sílẹ̀ ní nǹkan bí ìṣẹ́jú kọ̀ọ̀kan nígbà tí ẹ̀rọ bá wà lójúfò, pẹ̀lú ohun tí ó ṣe: ìsọdọ̀tun ìbòjú àti ojú-ìwé tí a yí. Láti ibẹ̀ ni ó ti ń ṣírò iye tí wákàtí kan lójúfò àti ojú-ìwé 100 ń ná, àti bí bátìrì yóò ṣe pẹ́ tó ní ìwọ̀n yẹn.\n\nṢí Bátìrì láti mẹ́nù Irinṣẹ́. Ó ń fi agbára ìsinsìnyí hàn, ìgbà yìí lójúfò, ìlò lórí bátìrì títí di báyìí àti àwọn ìgbà lójúfò rẹ àìpẹ́. Ó ń yí ojú-ìwé pẹ̀lú bọ́tìnnì ojú-ìwé, tàbí nípa títẹ̀ àwọn ọfà lókè.\n\nÓ nílò kíkà fún ìgbà díẹ̀ lórí bátìrì kí àwọn nọ́ńbà tó ní ìtumọ̀. Ṣíṣàkọsílẹ̀ wà ní títàn ní ìbẹ̀rẹ̀, a sì lè pa á nínú Ètò, lábẹ́ Ẹrọ, Agbára, bí Ṣàkọsílẹ̀ ìlò bátìrì."
