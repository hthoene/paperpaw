vocabulary.web.import-help = Fi fáìlì CSV, TSV tàbí TXT kún un pẹ̀lú káàdì kan lórí ìlà kọ̀ọ̀kan, tàbí ìdìpọ̀ tí a gbé jáde láti Anki (.apkg, pẹ̀lú “Support older Anki versions”), tàbí lẹ àkójọ kan síbí. Àwọn káàdì yóò lọ sínú ìdìpọ̀ yìí. Ìlà kọ̀ọ̀kan: iwájú, ẹ̀yìn àti àpẹẹrẹ (àṣàyàn), tí a yà sọ́tọ̀ pẹ̀lú tab, kọ́má tàbí sẹ́míkólọ́nù. Àpẹẹrẹ: Katze;cat;Die Katze schläft. Fáìlì gbọ́dọ̀ jẹ́ ọ̀rọ̀ UTF-8; káàdì 20,000 ló pọ̀ jùlọ nínú ìdìpọ̀ kan.
