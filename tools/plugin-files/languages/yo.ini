picture-home.plugin.name = Ìbòjú ilé àwòrán
picture-home.plugin.description = Ìbòjú ilé pẹ̀lú àwòrán tìrẹ lẹ́yìn àwọn wíjẹ́ẹ̀tì, àti ọ̀pá ipò tí o ṣètò.
picture-home.plugin.how = "Ìbòjú ilé àwòrán ń rọ́pò ìbòjú ilé nígbà tó bá wà ní títàn: àwòrán tìrẹ lẹ́yìn àwọn wíjẹ́ẹ̀tì, àti àwọn ojú-ìwé wíjẹ́ẹ̀tì àti irinṣẹ́ tí o tò. Pa á nínú olùṣàkóso àfikún, ìbòjú ilé tí ó wà nínú ẹ̀rọ yóò sì padà, pẹ̀lú àwọn ojú-ìwé tirẹ̀.\n\nFi àwòrán (JPEG, PNG tàbí GIF) sínú fódà kan lórí káàdì (wallpapers ní ìbẹ̀rẹ̀), lẹ́yìn náà yàn ọ̀kan nínú Ètò, Ìṣàdáni, Ìbòjú ilé àwòrán. Ìbámu sọ bí ó ṣe ń kún ìbòjú (kún un, gbogbo àwòrán, nà án, ìwọ̀n àkọ́kọ́, tò ó), Ipò sọ apá wo ni yóò dúró, Ìsúnmọ́ sọ bí ó ti tóbi tó, Mú àwòrán fẹ́ẹ́rẹ́ sì sọ bí ó ti rọ̀ tó: àwòrán tó fẹ́ẹ́rẹ́ jù ń jẹ́ kí wíjẹ́ẹ̀tì rọrùn láti kà. A ń pèsè àwòrán náà lẹ́ẹ̀kan fún ìwọ̀n ìbòjú kọ̀ọ̀kan, èyí sì ń gba ìṣẹ́jú díẹ̀.\n\nÀwọn wíjẹ́ẹ̀tì wà lórí àwo lórí àwòrán náà. Tò ojú-ìwé náà bí ti ìbòjú ilé inú ẹ̀rọ: pẹ́ńsù ní ìsàlẹ̀ ojú-ìwé, tàbí Ṣàtúnṣe ìbòjú ilé nínú mẹ́nù.\n\nỌpá ipò (àkókò, Wi-Fi, bátìrì, tàbí ohun tí o yàn) lè wà ní títàn, ní pípa tàbí aládàáṣe, lókè tàbí nísàlẹ̀, ní ìbú kíkún tàbí bí kápúsù kékeré ní òsì, àárín tàbí ọ̀tún, lórí àwo fẹ́ẹ́rẹ́, dúdú tàbí eérú tàbí lórí àwòrán fúnra rẹ̀. Ìlà tó ń dárúkọ àwọn bọ́tìnnì (lórí X4) náà lè wà ní títàn, ní pípa tàbí aládàáṣe. Aládàáṣe túmọ̀ sí pé títẹ̀ bọ́tìnnì kan ń fi wọ́n hàn fún ìṣẹ́jú-àáyá díẹ̀; títẹ̀ yẹn kò ṣe nǹkan míì.\n\nÌyàwòrán sọ bí a ṣe ń ya àwòrán náà: Ìpele eérú ní gbogbo eérú tí ìbòjú ní (ó lọ́ra lórí X4), Kóńkó ní kóńkó dúdú àti funfun (ó yára), tàbí Aládàáṣe, bí ìbòjú ilé inú ẹ̀rọ ṣe ń ṣe é: ìpele eérú nígbà tí a bá ya ìbòjú, kóńkó lẹ́yìn àyípadà àkọ́kọ́. Níbi tí ìbòjú kò bá ní ìpele eérú, ìpele eérú yóò di kóńkó."
