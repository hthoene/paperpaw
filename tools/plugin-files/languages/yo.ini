picture-home.setting.plate.help = Àwo kan lábẹ́ wíjẹ́ẹ̀tì kọ̀ọ̀kan: déédé (funfun), eérú fẹ́ẹ́rẹ́, tàbí láìní àwọ̀, kí àwòrán lè hàn láti abẹ́ rẹ̀. Fún àwòrán dúdú, yàn àwọ̀ ọ̀rọ̀ fẹ́ẹ́rẹ́ nínú Àwọ̀ wíjẹ́ẹ̀tì náà.
