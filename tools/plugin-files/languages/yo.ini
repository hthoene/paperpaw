joplin.no-network = Fífi ránṣẹ́ sí Joplin nílò nẹ́tíwọ́ọ̀kì. Àkọsílẹ̀ yóò dúró, a ó sì fi wọ́n ránṣẹ́ nígbà míì.
joplin.setup-needed = Kọ́kọ́ ṣètò Joplin: ibi tí ó ń bá ṣe ìmúṣọ̀kan, àkáǹtì rẹ àti ọ̀rọ̀ aṣínà.
joplin.no-time = A kò tíì mọ àkókò. Àkọsílẹ̀ yóò dúró, a ó sì fi wọ́n ránṣẹ́ nígbà míì.
joplin.unreachable = A kò lè dé ọ̀dọ̀ Joplin. Àkọsílẹ̀ yóò dúró, a ó sì fi wọ́n ránṣẹ́ nígbà míì.
