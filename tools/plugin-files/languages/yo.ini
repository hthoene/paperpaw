vocabulary.web.not-utf8 = Fáìlì yìí kì í ṣe ọ̀rọ̀ UTF-8. Nínú áàpù táblì tàbí olóòtú ọ̀rọ̀ rẹ, fi í pamọ́ bí CSV (UTF-8) kí o sì tún un yàn.
vocabulary.web.partial = Káàdì tí a fi kún: {count}. Ìdìpọ̀ náà ti kún (káàdì 20,000): a fi èyí tó kù sílẹ̀. Lo ìdìpọ̀ míì fún wọn.
vocabulary.web.full = Ìdìpọ̀ yìí ti kún (káàdì 20,000). Ṣe ìdìpọ̀ míì fún púpọ̀ sí i.
