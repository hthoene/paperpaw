lock.plugin.name = Títìpa ìbòjú
lock.plugin.description = PIN, àpẹẹrẹ tàbí ọ̀rọ̀ aṣínà nígbà tí ẹ̀rọ bá jí; títìpa ìfọwọ́kàn nígbà kíkà.
lock.plugin.how = "Títìpa ìbòjú ń béèrè PIN, àpẹẹrẹ tàbí ọ̀rọ̀ aṣínà nígbà tí PaperPaw bá bẹ̀rẹ̀ àti nígbà tí ẹ̀rọ bá jí. Ó wà ní pípa ní àkọ́kọ́. Ó ń dá ìlò àìròtẹ́lẹ̀ dúró nìkan: kóòdù náà àti iye ìgbìyànjú tí kò tọ̀nà wà lórí káàdì SD, nítorí náà ẹnikẹ́ni tó bá yọ káàdì náà, tó ṣàtúnṣe rẹ̀ tàbí tó pààrọ̀ rẹ̀ lè kọjá títìpa náà.\n\nṢètò rẹ̀ nínú ètò, lábẹ́ Ẹrọ, Títìpa ìbòjú: tẹ kóòdù tí ò ń lò bí ó bá wà, yan irú rẹ̀, lẹ́yìn náà kóòdù tuntun lẹ́ẹ̀mejì. Àpẹẹrẹ wà lórí ìbòjú ìfọwọ́kàn nìkan.\n\nLẹ́yìn ìgbìyànjú márùn-ún tí kò tọ̀nà, èyí tó kàn yóò dúró fún ìdajì ìṣẹ́jú. Tìpa báyìí ń tìpa lẹ́sẹ̀kẹsẹ̀, a sì lè fi í sí bọ́tìnnì, ìfarajúwe tàbí òfin kan. A lè pa Tìpa lẹ́yìn jíjí, kí ìbẹ̀rẹ̀ gidi nìkan (títan ẹ̀rọ tàbí títún bẹ̀rẹ̀) máa tìpa, àfi níbi tí jíjí kọ̀ọ̀kan jẹ́ ìbẹ̀rẹ̀, bíi lórí X4 tó ń lo bátìrì.\n\nTítìpa ìfọwọ́kàn, lẹ́gbẹ̀ẹ́ rẹ̀: Tìpa ìfọwọ́kàn nínú pánẹ́ẹ̀lì kíákíá àti mẹ́nù kíkà ń mú kí títẹ̀, fífà àti pẹ́ẹ̀nì má ṣe nǹkankan, nígbà tí bọ́tìnnì ṣì ń ṣiṣẹ́, fún àpẹẹrẹ láti kà pẹ̀lú ọwọ́ lórí ìbòjú. Láti ṣí i, tẹ̀ lẹ́ẹ̀mejì pẹ̀lú ìka kan kí o sì dì í mọ́lẹ̀ fún ìgbà díẹ̀; dídi bọ́tìnnì agbára mú ń ṣí mẹ́nù Agbára, níbi tí Ṣí ìfọwọ́kàn ti ń ṣe é pẹ̀lú bọ́tìnnì; lórí X4 Pro, dídi bọ́tìnnì ilé mú ń ṣí i lẹ́sẹ̀kẹsẹ̀."
