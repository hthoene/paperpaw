wifi.plugin.description = Ó ń dara pọ̀ mọ́ nẹ́tíwọ́ọ̀kì Wi-Fi nígbà tó bá yẹ, ó sì ń pa rédíò lẹ́yìn náà.
wifi.plugin.how = "Wi-Fi ń dara pọ̀ mọ́ nẹ́tíwọ́ọ̀kì nígbà tí àfikún kan bá nílò ayélujára (kátálọ́gì, ìmúṣọ̀kan, ọjà, gbígbé fáìlì), ó sì ń pa rédíò padà ní ìṣẹ́jú kan lẹ́yìn tí kò sí ohun tó ń lò ó, tàbí lẹ́sẹ̀kẹsẹ̀ tí Ilé tàbí ìwé kan bá hàn, láti dá bátìrì àti ìrántí sí.\n\nṢí Wi-Fi láti inú Ètò, tàbí láti inú Wi-Fi lórí ìlà ipò. Nẹ́tíwọ́ọ̀kì ń ṣe àkójọ àwọn tó wà nítòsí; yan ọ̀kan kí o sì tẹ ọ̀rọ̀ aṣínà rẹ̀, tàbí yan Ṣètò pẹ̀lú fóònù kí o sì tẹ orúkọ àti ọ̀rọ̀ aṣínà nínú aṣàwákiri fóònù rẹ dípò lórí ẹ̀rọ. Gbàgbé ń yọ nẹ́tíwọ́ọ̀kì tí a fi pamọ́ kúrò.\n\nÀwọn ọ̀rọ̀ aṣínà ń wà lórí káàdì ní ààbò, a kò sì ní fi wọ́n hàn mọ́ láé. Lábẹ́ Sopọ̀ nígbà tó bá yẹ, o lè ṣètò bí Wi-Fi ṣe máa wà ní títàn pẹ́ tó lẹ́yìn ìlò rẹ̀ kẹ́yìn, bóyá yóò wà ní títàn nígbà gbígba agbára, àti nẹ́tíwọ́ọ̀kì tí a fi pamọ́ wo ló kọ́kọ́ wá nígbà tí ọ̀pọ̀ bá wà nítòsí."
