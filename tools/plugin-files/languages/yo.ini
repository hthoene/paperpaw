smart-home.plugin.name = Ilé ọlọ́gbọ́n
smart-home.plugin.description = Iye àti súwíṣì láti Home Assistant tìrẹ lórí pátákó àti bí wíjẹ́ẹ̀tì ìbòjú ilé. Ó ń ṣiṣẹ́ pẹ̀lú Home Assistant lórí nẹ́tíwọ́ọ̀kì ilé rẹ.
smart-home.plugin.how = "Ilé ọlọ́gbọ́n ń fi iye àti súwíṣì láti Home Assistant tìrẹ hàn: ìgbóná, ọ̀rinrin, agbára iná, ilẹ̀kùn àti fèrèsé, iná, súwíṣì àti ìran. Ó ń bá sáfà rẹ sọ̀rọ̀ lórí REST API rẹ̀ nínú nẹ́tíwọ́ọ̀kì ilé rẹ; kò sí nǹkan tó ń gba iṣẹ́ míì kọjá.\n\nṢí Ilé ọlọ́gbọ́n láti inú mẹ́nù Irinṣẹ́, lẹ́yìn náà Ìsopọ̀: tẹ àdírẹ́sì Home Assistant rẹ (fún àpẹẹrẹ http://homeassistant.local:8123) àti tókìn ìwọlé onígbà-pípẹ́ (ṣe é nísàlẹ̀ ojú-ìwé profaili Home Assistant rẹ). A ń pa tókìn mọ́ pẹ̀lú ọ̀rọ̀ aṣínà àti kọ́kọ́rọ́, kì í ṣe nínú fáìlì ètò láéláé. A ń lo http lásán fún àdírẹ́sì inú nẹ́tíwọ́ọ̀kì ilé rẹ nìkan; fún sáfà ní ibòmíràn, tan “Sáfà lóde nẹ́tíwọ́ọ̀kì ilé” nínú ètò kí o sì lo https pẹ̀lú sẹ̀tífíkéètì tó fẹsẹ̀ múlẹ̀.\n\nYan ohun èlò ń ṣí àkójọ ohun tí sáfà rẹ ní: wá pẹ̀lú orúkọ tàbí id kí o sì yan ohun èlò kan láti fi í hàn (yàn án lẹ́ẹ̀kan sí i láti mú un kúrò). O lè fún un ní yàrá kan, tí yóò kó o jọ sórí pátákó àti nínú wíjẹ́ẹ̀tì yàrá. A ń pa tó ohun èlò 24 mọ́. Lórí pátákó, yan iná, súwíṣì tàbí ìran kan láti yí i padà: ìlà náà ń fi ìdáhùn sáfà hàn. Sẹ́ńsọ̀ tí o bá yàn ni a ó tún kà.\n\nWíjẹ́ẹ̀tì (di ìbòjú ilé mú, lẹ́yìn náà fi wíjẹ́ẹ̀tì kún un): Iye ilé ọlọ́gbọ́n ń fi ìwọ̀n kan hàn ní ńlá, àkójọ ń to àwọn ohun èlò yàrá kan, súwíṣì jẹ́ bọ́tìnnì fún iná tàbí súwíṣì kan, yàrá sì jẹ́ káàdì pẹ̀lú ìwọ̀n àti súwíṣì yàrá kan. Ètò wíjẹ́ẹ̀tì kọ̀ọ̀kan ń sọ ohun èlò tàbí yàrá tí ó ń fi hàn.\n\nA ń ka ilé nígbà tí o bá ṣí pátákó, nígbà tí o bá béèrè (ìlà Sọ dọ̀tun báyìí tàbí títẹ̀ wíjẹ́ẹ̀tì iye tàbí àkójọ), nígbà tí ẹ̀rọ kíkà bá jí níbi tí Wi-Fi ti wà ní títàn tẹ́lẹ̀, àti ní ìgbà tí o ṣètò nígbà tí ṣájà bá wà lára ẹ̀rọ. Kì í tan rédíò fúnra rẹ̀, kì í sì í fi í sílẹ̀ ní títàn."
