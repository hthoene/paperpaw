joplin.plugin.name = Ìmúṣọ̀kan àkọsílẹ̀ ìwé
joplin.plugin.description = Ó ń pa àmì àfihàn àti àkọsílẹ̀ ìwé kọ̀ọ̀kan mọ́ sínú àkọsílẹ̀ kan. Ó ń ṣiṣẹ́ pẹ̀lú Joplin (Joplin Cloud, Joplin Server tàbí WebDAV).
joplin.title = Ìmúṣọ̀kan àkọsílẹ̀ ìwé
joplin.send = Fi ránṣẹ́ sí Joplin
joplin.send.help = A ń fi àkọsílẹ̀ tí a gbé jáde ránṣẹ́ lẹ́sẹ̀kẹsẹ̀. Àkọsílẹ̀ tí a kò lè fi ránṣẹ́ yóò dúró, wọn yóò sì lọ pẹ̀lú ìgbéjáde tó kàn, pẹ̀lú èyí, tàbí nípasẹ̀ òfin kan.
joplin.service = Ìmúṣọ̀kan pẹ̀lú
joplin.service.help = Ohun tí Joplin ń bá ṣe ìmúṣọ̀kan, bí a ti ṣètò rẹ̀ nínú Joplin: Joplin Cloud, Joplin Server tìrẹ, tàbí fódà WebDAV bí Nextcloud. Kò sí kọ̀ǹpútà tí ó nílò láti máa ṣiṣẹ́.
