core.firmware.foreign.2 = PaperPaw kò ní yí èyí padà. Fámúwíà kejì tàbí irinṣẹ́ flash ló lè dá ọ padà (web flasher ń ṣiṣẹ́).
core.firmware.foreign.3 = PaperPaw yóò wà nínú flash, a kò sì ní fọwọ́ kan fáìlì rẹ lórí káàdì.
core.firmware.foreign.4 = A kò buwọ́ lù ú; a kàn yẹ̀ ẹ́ wò bí boot loader ṣe máa bẹ̀rẹ̀ rẹ̀ ni.
