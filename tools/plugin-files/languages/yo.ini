launcher-simple.plugin.name = Ilé rírọrùn
launcher-simple.plugin.description = Ìbòjú ìbẹ̀rẹ̀ tó parọ́rọ́: aago ńlá, káàdì, ọ̀pá ìsàlẹ̀ àti pánẹ́ẹ̀lì kíákíá tó ní ìyípadà roboto.
launcher-simple.plugin.how = "Ilé rírọrùn jẹ́ ìbòjú ìbẹ̀rẹ̀ tó parọ́rọ́ fún àwọn tí wọ́n nílò ohun pàtàkì nìkan: aago ńlá, ìwé tí o ń kà, ilé-ìkàwé àti ọjà bí káàdì ńlá, àti ọ̀pá àmì mẹ́ta ní ìsàlẹ̀. Kò nílò ìṣètò kankan.\n\nYàn án nínú Ètò, lábẹ́ ìbòjú ilé. Pánẹ́ẹ̀lì kíákíá rẹ̀ (yàn án bí pánẹ́ẹ̀lì nínú Ètò náà) ní ìyípadà roboto ńlá, ọ̀pá fún ìmọ́lẹ̀ iwájú níbi tí ẹ̀rọ bá ní ọ̀kan, àti ọ̀pá fún ìwọ̀n ọ̀rọ̀. Pẹ̀lú bọ́tìnnì, bọ́tìnnì ọfà ń sún ojú-àfiyèsí, Yàn sì ń ṣe ohun tí apá náà sọ; lórí ọ̀pá, ó ń fi ìdá kan nínú mẹ́wàá kún un, láti òpin ó sì ń padà sí ìbẹ̀rẹ̀. Pẹ̀lú ìfọwọ́kàn, tẹ̀ apá kan, tàbí tẹ̀ ọ̀pá níbi tí o fẹ́.\n\nIlé-ìkàwé ń fi àwọn ìwé rẹ hàn bí káàdì, ìwé tí o ṣí kẹ́yìn ní àkọ́kọ́, ojú-ìwé kan lẹ́ẹ̀kan, ó sì ń ṣí kíkà déédé.\n\nṢe é bí o ṣe fẹ́ nínú Ètò, lábẹ́ Ilé rírọrùn: àkójọ mẹ́ta tí o ń ṣàtúnṣe bí o ṣe ń ṣàtúnṣe mẹ́nù àkọ́kọ́. Káàdì: àwọn káàdì wo ni ilé ń fi hàn àti ní ìtò wo. Ọpá ìsàlẹ̀: àwọn àmì wo ni ọ̀pá náà ní, ìgbésẹ̀ èyíkéyìí ti àfikún èyíkéyìí. Pánẹ́ẹ̀lì kíákíá: ìyípadà àti ọ̀pá wo ni ó ń fi hàn. Káàdì tí ìbòjú kò ní àyè fún ni a ó fi sílẹ̀, láti òpin. Lábẹ́ Ilé rírọrùn, o tún lè yàn bóyá ọjọ́ àti bátìrì yóò hàn."
