anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Kọ́ àwọn káàdì Anki tí àkókò wọn ti tó lórí kọ̀ǹpútà rẹ, kí o sì fi ìdáhùn rẹ ránṣẹ́ padà, nípasẹ̀ àfikún AnkiConnect.
anki.plugin.how = "Anki ń jẹ́ kí o kọ́ àwọn káàdì tí àkókò wọn ti tó nínú Anki lórí kọ̀ǹpútà rẹ lórí ẹ̀rọ kíkà, ó sì ń fi ìdáhùn rẹ ránṣẹ́ padà. Ó ń lo àfikún ọ̀fẹ́ AnkiConnect (kóòdù àfikún 2055492159), kì í sì í lo AnkiWeb láé. Ó wà ní pípa lákọ̀ọ́kọ́: fi í kún un láti Ọjà àfikún.\n\nLórí kọ̀ǹpútà: fi AnkiConnect sínú Anki (Tools, Add-ons, Get Add-ons), kí o sì tún Anki bẹ̀rẹ̀. Anki gbọ́dọ̀ wà ní ṣíṣí nígbà tí o bá ń mú ṣiṣẹ́pọ̀.\n\nNí ìbẹ̀rẹ̀, AnkiConnect ń dá kọ̀ǹpútà tí ó ń ṣiṣẹ́ lórí rẹ̀ nìkan lóhùn (127.0.0.1), nítorí náà ẹ̀rọ kíkà kò lè dé ọ̀dọ̀ rẹ̀. Ṣí Tools, Add-ons, AnkiConnect, Config, kí o sì ṣètò “webBindAddress” sí “0.0.0.0” (gbọ́ lórí nẹ́tíwọ́ọ̀kì ilé). Pọ́ọ̀tì náà, “webBindPort”, jẹ́ 8765 àyàfi tí o bá yí i padà. Tí o bá ṣètò “apiKey” níbẹ̀, tẹ̀ kọ́kọ́rọ́ kan náà síbí. Tún Anki bẹ̀rẹ̀ lẹ́yìn tí o bá yí ìṣètò padà, kí o sì gba Anki láàyè kọjá firewall kọ̀ǹpútà tí ó bá béèrè. Lo èyí lórí nẹ́tíwọ́ọ̀kì tí o gbẹ́kẹ̀lé nìkan: ẹnikẹ́ni tó wà lórí rẹ̀ lè dé AnkiConnect, nítorí náà kọ́kọ́rọ́ dára.\n\nLórí ẹ̀rọ kíkà: ṣí Anki láti Irinṣẹ́, lẹ́yìn náà tẹ̀ àdírẹ́sì kọ̀ǹpútà (bí àpẹẹrẹ 192.168.1.20) sí abẹ́ Kọ̀ǹpútà, pọ́ọ̀tì tí kì í bá ṣe 8765, àti kọ́kọ́rọ́ API tí o bá ṣètò ọ̀kan. Yan Àkójọ káàdì, tàbí fi í sílẹ̀ ní òfìfo fún gbogbo àkójọ. Lẹ́yìn náà yan Mú ṣiṣẹ́pọ̀ pẹ̀lú Anki, pẹ̀lú Wi-Fi ní títàn: a kọ́kọ́ fi àwọn ìdáhùn rẹ tó ń dúró ránṣẹ́, lẹ́yìn náà a gba àwọn káàdì tí àkókò wọn ti tó (àti iye káàdì tuntun tí o ṣètò), 50 ní púpọ̀ jùlọ. Yan Kọ́ láti lọ nípasẹ̀ wọn láìsí nẹ́tíwọ́ọ̀kì: fi ìdáhùn hàn, kí o sì yan Lẹ́ẹ̀kan sí i, Ó le, Ó dára tàbí Ó rọrùn. A ń pa ìdáhùn rẹ mọ́ lórí ẹ̀rọ kíkà, kódà láìsí Wi-Fi, wọ́n sì ń lọ sí Anki pẹ̀lú ìmúṣiṣẹ́pọ̀ tó kàn. Anki ló ń pinnu ìgbà tí káàdì kan yóò padà: káàdì tí o dáhùn ní Lẹ́ẹ̀kan sí i ni ìmúṣiṣẹ́pọ̀ mìíràn yóò tún gbà nígbà tí Anki bá sọ pé àkókò rẹ̀ ti tó.\n\nMú ṣiṣẹ́pọ̀ nígbà tí Anki bá ṣí, nínú ètò, ń mú ṣiṣẹ́pọ̀ ní gbogbo ìgbà tí o bá ṣí ìbòjú náà. Kò sí ohun tó ń lo nẹ́tíwọ́ọ̀kì nígbà tí o bá tẹ̀ bọ́tìnnì."
