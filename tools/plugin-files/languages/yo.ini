about.title = Nípa PaperPaw
about.intro = Áàpù kíkà ìwé ọ̀fẹ́ fún ẹ̀rọ e-ink, tí a fi àfikún kọ́. Ó wà lábẹ́ ìwé àṣẹ Apache License 2.0; ohun tí ó kó mọ́ra wà lábẹ́ àwọn ìwé àṣẹ wọ̀nyí.
