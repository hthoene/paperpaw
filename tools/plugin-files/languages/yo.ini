about.plugins.help = Àwọn àfikún onínú kóòdù nínú sọ́fítíwià yìí, pẹ̀lú ẹ̀yà wọn. Ìmúdójúìwọ̀n ń mú àwọn kan náà wá padà; èyí tí kò bá lè ṣe bẹ́ẹ̀ yóò kọ́kọ́ sọ ọ́.
