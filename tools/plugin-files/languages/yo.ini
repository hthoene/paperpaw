vocabulary.web.header = Ìlà àkọ́kọ́ ń sọ orúkọ àwọn òpó
vocabulary.web.file = Tàbí fáìlì kan
vocabulary.web.send = Fi àwọn káàdì kún un
vocabulary.web.read = Ó ń ka ìdìpọ̀ náà…
