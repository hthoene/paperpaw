vocabulary.sd.fault.not-utf8 = Kì í ṣe ọ̀rọ̀ UTF-8. Fi fáìlì náà pamọ́ bí UTF-8 (nínú áàpù táblì: CSV UTF-8).
vocabulary.sd.fault.too-long = Ó gùn ju 8 KiB lọ. Jẹ́ kí káàdì náà kúrú sí i.
vocabulary.sd.fault.open-quote = A ṣí àmì àyọkà kan, a kò sì pa á dé. Pa á dé tàbí yọ ọ́ kúrò.
vocabulary.setting.sd-auto = Ṣe ìmúdójúìwọ̀n ìdìpọ̀ láti káàdì nígbà ṣíṣí
vocabulary.setting.sd-auto.help = Káàdì ìkẹ́kọ̀ọ́ yóò ka àwọn fáìlì inú fódà tó jẹ́ tuntun tàbí tó ti yí padà.
vocabulary.setting.sd-folder = Fódà fún fáìlì ìdìpọ̀
vocabulary.setting.sd-folder.help = Lórí káàdì SD: fáìlì CSV, TSV tàbí Anki nínú rẹ̀ jẹ́ ìdìpọ̀ kan.
vocabulary.sd.readme = "Káàdì ìkẹ́kọ̀ọ́ láti inú fáìlì\n\nFi fáìlì kan síbí fún ìdìpọ̀ kọ̀ọ̀kan: Spanish.tsv ń ṣe ìdìpọ̀ Spanish.\nFáìlì: .tsv, .csv tàbí .txt, tí a fi pamọ́ bí UTF-8, tàbí .apkg: ìdìpọ̀ Anki, tí a gbé jáde pẹ̀lú “Support older Anki versions” ní títàn. Àwọn pápá mẹ́ta àkọ́kọ́ nínú àkọsílẹ̀ rẹ̀ yóò di iwájú, ẹ̀yìn àti àpẹẹrẹ; a kò ka ètò àkókò àti mídíà rẹ̀, PaperPaw kò sì kọ fáìlì Anki rárá.\n\nKáàdì kan lórí ìlà kọ̀ọ̀kan: iwájú, ẹ̀yìn àti àpẹẹrẹ kan (àṣàyàn), tí a yà sọ́tọ̀ pẹ̀lú tab, kọ́má tàbí sẹ́míkólọ́nù. Ìlà àkọ́kọ́ lè sọ orúkọ àwọn òpó: front, back, example. Àpẹẹrẹ:\n\nKatze\tcat\tDie Katze schläft.\n\nLẹ́yìn náà ṣí Káàdì ìkẹ́kọ̀ọ́ lórí ẹ̀rọ kíkà, yan Ìdìpọ̀ lórí káàdì SD, lẹ́yìn náà Ṣe ìmúdójúìwọ̀n àwọn ìdìpọ̀.\n\nÓ dáa kí o mọ̀:\n- Àwọn ìdìpọ̀ yóò wà lórí ẹ̀rọ kíkà, pẹ̀lú ohun tí o ti kọ́. A ń ka fáìlì nígbà tí ó bá jẹ́ tuntun tàbí tí ó bá yí padà, a ó sì fi àwọn káàdì rẹ̀ kún ìdìpọ̀ tàbí yí wọn padà níbẹ̀.\n- Yí ẹ̀yìn tàbí àpẹẹrẹ káàdì kan padà nínú fáìlì: káàdì náà yóò yí padà, yóò sì pa ìtẹ̀síwájú rẹ mọ́.\n- Yí ọ̀rọ̀ iwájú káàdì kan padà: a ó kà á sí káàdì tuntun, èyí àtijọ́ yóò sì bẹ̀rẹ̀ láti ìbẹ̀rẹ̀. Ọrọ̀ iwájú ni a fi ń bá àwọn káàdì mu, àlàfo àti lẹ́tà ńlá kò kà. Fi ìdìpọ̀ kan pamọ́ sínú fáìlì (Ìdìpọ̀ lórí káàdì SD, Fi ìdìpọ̀ pamọ́ sórí káàdì), káàdì kọ̀ọ̀kan yóò sì ní nọ́ńbà nínú òpó id: yí iwájú kan padà níbẹ̀, fi ìlà méjì àkọ́kọ́ fáìlì sílẹ̀ bí wọ́n ṣe wà, káàdì náà yóò sì pa ohun tí o ti kọ́ mọ́.\n- Fífi pamọ́ ń kọ àwọn káàdì ìdìpọ̀ náà. Ohun tó wà nínú fáìlì tí kì í ṣe káàdì (ìlà tí kò ní iwájú) ni a kò ní pa mọ́; a ó ṣe ẹ̀dà fáìlì tó wà níbẹ̀ sí _name.bak.tsv.\n- Fi fáìlì náà pamọ́ bí CSV UTF-8 (kì í ṣe UTF-16, kì í ṣe fọ́ọ̀mátì ti áàpù táblì fúnra rẹ̀). A kò ní ka fáìlì tó ju 4 MiB tàbí ìlà 20,000 lọ: pín in.\n- Ìlà tí o pa rẹ́ nínú fáìlì kò ní pa káàdì rẹ́ nínú ìdìpọ̀, àfi tí o bá ṣètò “káàdì tí kò sí nínú fáìlì” sí Yọ kúrò fún ìdìpọ̀ náà. Nígbà náà káàdì náà yóò lọ pẹ̀lú ohun tí o ti kọ́.\n- A kò ní ka fáìlì tí orúkọ rẹ̀ bẹ̀rẹ̀ pẹ̀lú _.\n"
