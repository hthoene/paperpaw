joplin.not-kept = A kò lè pa ọ̀rọ̀ aṣínà mọ́ lórí ẹ̀rọ yìí.
joplin.notebook = Ìwé àkọsílẹ̀
joplin.notebook.help = Ìwé àkọsílẹ̀ tí PaperPaw ń ṣe nínú Joplin, pẹ̀lú àkọsílẹ̀ kan fún ìwé kọ̀ọ̀kan. Gbígbé jáde lẹ́ẹ̀kan sí i ń ṣe ìmúdójúìwọ̀n àkọsílẹ̀ náà, bí a tilẹ̀ ti gbé e lọ sí ìwé àkọsílẹ̀ míì.
