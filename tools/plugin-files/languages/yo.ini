puzzles.plugin.name = Àdìtú
puzzles.plugin.description = Sudoku, ọ̀rọ̀-àgbélébùú àti àdìtú ṣẹ́ẹ̀sì, láìsí ìsopọ̀, pẹ̀lú àdìtú ojoojúmọ́.
puzzles.plugin.how = "Àdìtú fún inú ọkọ̀ ojú-irin àti yàrá ìdúró, gbogbo rẹ̀ láìsí ìsopọ̀: sudoku, ọ̀rọ̀-àgbélébùú àti àdìtú ṣẹ́ẹ̀sì. Ṣí Àdìtú láti inú mẹ́nù Irinṣẹ́, tàbí fi wíjẹ́ẹ̀tì Àdìtú òní kún ìbòjú ilé (di ìbòjú ilé mú, lẹ́yìn náà fi wíjẹ́ẹ̀tì kún un): ó ń fi bí sudoku òní ṣe jìnnà tó hàn, títẹ̀ sì ń ṣí i. Sudoku òní kan náà ni ní gbogbo ọjọ́.\n\nSudoku: Òsì àti Ọtún ń sún kọ́sọ̀ ní àpótí kan lẹ́ẹ̀kan, Sókè àti Sísàlẹ̀ (bọ́tìnnì ojú-ìwé) ní ìlà kan. Yàn ń ṣí àwọn nọ́ńbà: mú ọ̀kan kí o sì tún yàn láti fi í sí i, tàbí Pa rẹ́ láti sọ àpótí di òfo. Di Yàn mú (tàbí Mẹ́nù) láti dé àwọn bọ́tìnnì lábẹ́ pátákó: Àkọsílẹ̀ ń sọ àwọn nọ́ńbà di àmì pẹ́ńsù, Ṣàyẹ̀wò ń sàmì sí àwọn àpótí tí kò tọ́, Dá padà ń dá ìgbésẹ̀ tó kẹ́yìn padà, Tuntun ń bẹ̀rẹ̀ àdìtú ní ìpele tí o yàn (Rọrùn, Àárín, Le). Àdìtú kọ̀ọ̀kan ní ojútùú kan ṣoṣo. A ń pa eré náà mọ́ nígbà tí o bá kúrò. Lórí ìbòjú ìfọwọ́kàn, tẹ̀ àpótí kan.\n\nỌrọ̀-àgbélébùú: fi fáìlì .puz (Across Lite) tàbí .ipuz sínú fódà “puzzles” lórí káàdì ìrántí; kò sí èyí tí a fi kún un. Sún lórí àwọ̀n, lẹ́yìn náà yàn láti tẹ ọ̀rọ̀ tó wà lábẹ́ kọ́sọ̀ lórí pátákó ìtẹ̀wé (àmì ìlà ìsàlẹ̀ _ ń fi àpótí sílẹ̀ ní òfo). Àwọn bọ́tìnnì ń yí padà láàrin Ìbú àti Òòró, ń fi àkójọ àwọn olobó hàn, ń ṣàyẹ̀wò àwọn lẹ́tà, wọ́n sì ń ṣí ọ̀rọ̀ náà payá. A ń pa àwọn lẹ́tà mọ́ fún fáìlì kọ̀ọ̀kan. A kò lè ṣí fáìlì .puz tí a ti dì ní kóòdù.\n\nÀdìtú ṣẹ́ẹ̀sì: àkójọ kékeré láti inú ibi ìpamọ́ àdìtú Lichess (CC0). Òsì àti Ọtún ń fò láti ọmọ ayò kan sí òmíràn; yan èyí tí o fẹ́ sún, lẹ́yìn náà lo Òsì àti Ọtún láti lọ láàrin ibi tí ó lè lọ, kí o sì tún yàn. A ń dá ìgbésẹ̀ tí kò tọ́ padà. Ìtọ́sọ́nà ń sàmì sí ọmọ ayò tí o yẹ kí o sún, Tókàn ń lọ sí àdìtú tó kàn.\n\nPátákó náà ń tún àwọn àpótí tó yí padà nìkan yà. Ìṣirò ń ka àwọn àdìtú tí o ti yanjú."
