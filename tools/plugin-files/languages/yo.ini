stats.plugin.name = Ìṣirò kíkà
stats.plugin.description = Ó ń ṣe àkọsílẹ̀ bí o ṣe kà pẹ́ tó àti iye tí o kà, pẹ̀lú kàlẹ́ńdà àti iye ìwé kọ̀ọ̀kan.
stats.plugin.how = "Ìṣirò kíkà ń ṣe àkọsílẹ̀ bí o ṣe pẹ́ tó lórí ojú-ìwé kọ̀ọ̀kan. O ń rí i bí àkópọ̀ pẹ̀lú òní, ọ̀sẹ̀ àti ọjọ́ léraléra rẹ, bí kàlẹ́ńdà, àti pẹ̀lú iye ìwé kọ̀ọ̀kan.\n\nṢí i láti inú Irinṣẹ́, tàbí láti Síwájú sí i nínú kíkà. Nínú ètò, lábẹ́ Ìṣirò kíkà, o lè pa Ṣe àkọsílẹ̀ kíkà, ṣètò Àfojúsùn ojoojúmọ́, kí o sì ṣètò Ojú-ìwé tó kúrú jù àti Ojú-ìwé tó gùn jù tí a ń kà, kí yíyí ojú-ìwé kọjá tàbí ìwé tí a fi sílẹ̀ ní ṣíṣí má bàa ba iye jẹ́.\n\nMú ṣiṣẹ́pọ̀ pẹ̀lú KOReader ń pín ìṣirò pẹ̀lú KOReader nípasẹ̀ fódà WebDAV. Ó tún ń gba ìṣirò KOReader tó wà lórí ẹ̀rọ kan náà wọlé. Àkọsílẹ̀ nílò kí aago wà ní títọ́: níbi tí kò bá rí bẹ́ẹ̀, sopọ̀ mọ́ Wi-Fi lẹ́ẹ̀kan."
