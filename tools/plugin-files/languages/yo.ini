vocabulary.sd.saved.unlinked = A ti fi pamọ́ sínú {file}, ṣùgbọ́n a kò lè kọ ìsopọ̀ sí ìdìpọ̀ náà: ìmúdójúìwọ̀n tó kàn yóò tún ka fáìlì náà.
vocabulary.sd.save.backup = A pa fáìlì tó wà níbẹ̀ tẹ́lẹ̀ mọ́ bí {file}.
vocabulary.sd.save.no-deck = Ìdìpọ̀ yìí kò sí mọ́.
vocabulary.sd.save.unreadable = A kò lè ka àkójọ àwọn fáìlì tó ní ìsopọ̀, nítorí náà a kò kọ nǹkankan. Yẹ káàdì wò kí o sì tún gbìyànjú.
vocabulary.sd.save.full = Káàdì ti kún, nítorí náà a kò kọ nǹkankan. Ṣe àyè díẹ̀ kí o sì tún gbìyànjú.
vocabulary.sd.save.too-large = Ìdìpọ̀ yìí ti tóbi jù fún fáìlì kan (4 MiB, èyí tó pọ̀ jùlọ tí ìmúdójúìwọ̀n ń kà). Fáìlì tó wà lórí káàdì kò yí padà.
vocabulary.sd.save.failed = A kò lè kọ fáìlì náà. Fáìlì tó wà lórí káàdì kò yí padà. Yẹ káàdì wò kí o sì tún gbìyànjú.
vocabulary.sd.save.not-updated = A kò fi pamọ́: a kò lè kọ́kọ́ ka fáìlì tó wà lórí káàdì, ó sì lè ní àyípadà tí ìdìpọ̀ kò tíì ní. Tún fáìlì náà ṣe kí o sì tún gbìyànjú.
vocabulary.sd.save.left-out = A kò fi pamọ́: a kò lè ka àwọn ìlà kan nínú fáìlì, fífi pamọ́ yóò sì pa wọ́n rẹ́. Tún fáìlì náà ṣe, ṣe ìmúdójúìwọ̀n, kí o sì tún gbìyànjú.
vocabulary.sd.save.anki = Fáìlì Anki ni {file}: kíkà nìkan ni a ń kà á, a kì í kọ sí i.
vocabulary.sd.save.anki-refused = A kò fi pamọ́: ìdìpọ̀ Anki ni {file}, kíkà nìkan ni PaperPaw ń kà á. Tún ìdìpọ̀ náà gbé jáde láti Anki láti ṣe ìmúdójúìwọ̀n rẹ̀.
vocabulary.sd.removal-held = A kò yọ káàdì kankan kúrò: a kò lè ka àwọn ìlà kan.
vocabulary.sd.skipped.other = A fi ìlà {count} sílẹ̀
vocabulary.sd.skipped-notes.other = A fi àkọsílẹ̀ {count} sílẹ̀: wọ́n gùn jù (bí àpẹẹrẹ, àwòrán wà nínú wọn)
vocabulary.sd.no-room = Ìlà {count} kò ráàyè: káàdì 20,000 ni ìdìpọ̀ kan ń gbà.
vocabulary.sd.outcome.same = Kò yí padà láti ìmúdójúìwọ̀n tó kọjá.
vocabulary.sd.outcome.unreadable = A kò lè ka fáìlì yìí. Yẹ káàdì wò kí o sì tún gbìyànjú.
vocabulary.sd.outcome.too-many = Ìdìpọ̀ 50 ti wà tẹ́lẹ̀, nítorí náà a kò ka fáìlì yìí. Kọ́kọ́ pa ìdìpọ̀ kan rẹ́.
vocabulary.sd.outcome.crowded = Káàdì tó pọ̀ jù ní iwájú kan náà, nítorí náà a kò ka fáìlì yìí. Jẹ́ kí iwájú wọn yàtọ̀ síra.
vocabulary.sd.outcome.no-cards = A kò rí káàdì kankan. Káàdì jẹ́ ìlà tó ní ọ̀rọ̀ iwájú; iwájú ni òpó àkọ́kọ́.
vocabulary.sd.outcome.too-large = Fáìlì yìí ti tóbi jù: 4 MiB àti ìlà 20,000 ló pọ̀ jùlọ. Pín in sí fáìlì mélòó kan.
vocabulary.sd.outcome.utf16 = A fi fáìlì yìí pamọ́ bí UTF-16. Tún un fi pamọ́ bí CSV UTF-8 (nínú áàpù táblì: CSV UTF-8).
vocabulary.sd.outcome.no-notes = A kò rí àkọsílẹ̀ kankan: èyí kì í ṣe ìdìpọ̀ Anki, tàbí kò ní àkọsílẹ̀. Gbé e jáde láti Anki bí àpò ìdìpọ̀ Anki (.apkg).
vocabulary.sd.outcome.newer-anki = Ìdìpọ̀ yìí wà ní fọ́ọ̀mátì Anki tuntun jùlọ. Tún un gbé jáde pẹ̀lú “Support older Anki versions” ní títàn.
vocabulary.sd.outcome.deck-too-large = Ìdìpọ̀ Anki yìí ti tóbi jù láti kà níbí: fáìlì 4,000, àkọsílẹ̀ 4 MiB àti àkọsílẹ̀ 20,000 ló pọ̀ jùlọ. Gbé e jáde láìsí mídíà àti láìsí ètò àkókò, tàbí pín in.
vocabulary.sd.line = Ìlà {line}
