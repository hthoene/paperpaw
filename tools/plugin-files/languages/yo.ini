rules.plugin.name = Òfin
rules.plugin.description = Nígbà tí nǹkan bá ṣẹlẹ̀, ó ń ṣe nǹkan: fún àpẹẹrẹ ipò alẹ́ ní 22:00.
rules.plugin.how = "Òfin kan ń ṣe nǹkan fúnra rẹ̀ nígbà tí nǹkan bá ṣẹlẹ̀: títan ipò alẹ́ lójoojúmọ́ ní 22:00, tàbí mímú àwọn kátálọ́gì ṣiṣẹ́pọ̀ nígbà tí PaperPaw bá bẹ̀rẹ̀.\n\nÀwọn òfin wà nínú Ètò lábẹ́ Ìṣàdáni, bí Òfin. Fi òfin kún un ń béèrè Nígbà wo? (PaperPaw bẹ̀rẹ̀, àkókò kan lójúmọ́, ìwé tí a ṣí tàbí tí a pa dé, bátìrì, gbígba agbára, ìyípadà kan àti síwájú sí i) àti Kí ló kàn? (ṣe iṣẹ́ kan, tan ìyípadà kan tàbí pa á, ṣètò nọ́ńbà kan, fi ìfiránṣẹ́ kan hàn). Tẹ̀ òfin kan láti dá a dúró fún ìgbà díẹ̀; di í mú (pẹ̀lú bọ́tìnnì, di Yàn mú) fún àdéhùn kan bí Láàárín àkókò méjì lójúmọ́, tàbí láti yọ ọ́ kúrò.\n\nÀwọn iṣẹ́, ìyípadà àti nọ́ńbà tí o lè yàn wà ní ìsọ̀rí àfikún: yan àfikún náà, lẹ́yìn náà ohun tí ó mú wá; Padà ń jáde kúrò nínú rẹ̀ lẹ́ẹ̀kan sí i. Iṣẹ́ tí ó ń ṣiṣẹ́ lórí ìbòjú tí ó hàn, bí Padà tàbí Ojú-ìwé tó kàn, ń ṣe ohun tí yóò ṣe bí a bá tẹ̀ ẹ́ níbẹ̀.\n\nÀkókò ń ṣiṣẹ́ ohunkóhun tí ìbòjú tí ó ṣí bá jẹ́. Òfin méjì tí ń yí iṣẹ́ ara wọn padà ń dúró lẹ́yìn ìgbésẹ̀ díẹ̀."
