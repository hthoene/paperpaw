opds.plugin.name = Kátálọ́gì OPDS
opds.plugin.description = Ń ṣàwárí kátálọ́gì OPDS, ń gba ìwé wọn sílẹ̀, ó sì ń mú fódà ṣiṣẹ́pọ̀ pẹ̀lú wọn.
opds.plugin.how = "Kátálọ́gì OPDS jẹ́ ilé-ìkàwé orí ayélujára bí Project Gutenberg, Calibre-Web, Kavita tàbí Komga. Àfikún yìí ń ṣàwárí wọn, ó sì ń wá nínú wọn bí fódà, ó sì ń gba ìwé wọn sílẹ̀ sínú ilé-ìkàwé.\n\nṢí Kátálọ́gì láti mẹ́nù Irinṣẹ́ kí o sì yàn Fi kátálọ́gì kún un: àdírẹ́sì kan àti, tí kátálọ́gì náà bá nílò àkáǹtì, orúkọ olùmúlò àti ọ̀rọ̀ aṣínà. Tẹ̀ kátálọ́gì kan láti wò ó; di í mú (pẹ̀lú bọ́tìnnì, di Yàn mú) láti mú un ṣiṣẹ́pọ̀, ṣàtúnṣe rẹ̀ tàbí yọ ọ́ kúrò.\n\nTí Mú kátálọ́gì yìí ṣiṣẹ́pọ̀ bá wà ní títàn, Mú kátálọ́gì ṣiṣẹ́pọ̀ ń gba àwọn ìwé tuntun rẹ̀ sílẹ̀ sínú fódà rẹ̀. Ìwé fún ìmúṣiṣẹ́pọ̀ kan ń ṣe òǹkà iye tí ìmúṣiṣẹ́pọ̀ kan lè gbà, kí kátálọ́gì ńlá má bàa kún ẹ̀rọ. Fódà ìkùukùu (WebDAV) náà ń ṣiṣẹ́ dípò kátálọ́gì kan."
