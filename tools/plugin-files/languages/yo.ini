fonts-browser.plugin.name = Fọ́ǹtì míì
fonts-browser.plugin.description = Ń fi fọ́ǹtì láti ayélujára hàn, ọ̀kọ̀ọ̀kan pẹ̀lú àpẹẹrẹ, ó sì ń gbà wọ́n sílẹ̀ láti fi kàwé.
fonts-browser.plugin.how = "Fọ́ǹtì míì ń ṣe àkójọ fọ́ǹtì láti ilé-ìkàwé fọ́ǹtì kan lórí ayélujára, a kọ orúkọ ọ̀kọ̀ọ̀kan ní fọ́ǹtì tirẹ̀, ó sì ń gba àwọn tí o fẹ́ fi kàwé sílẹ̀.\n\nÌwọ yóò rí i ní ìparí àkójọ fọ́ǹtì níbi tí a ti ń yan fọ́ǹtì kíkà, nínú Ètò, lábẹ́ Kíkà, bí Fọ́ǹtì; àwọn ìlà ipò ní ohun kan náà fún fọ́ǹtì wọn. Tẹ̀ fọ́ǹtì kan (pẹ̀lú bọ́tìnnì, tẹ̀ Yàn) láti rí i ní títóbi pẹ̀lú gbólóhùn àpẹẹrẹ, lẹ́yìn náà yan Gbà á sílẹ̀. O lè kúrò lójú-ìwé náà nígbà tí ó ń gbà á sílẹ̀. Nígbà tó bá parí, yan Fi (orúkọ fọ́ǹtì) kàwé, tàbí Lò ó fún àwọn ìlà ipò. Ṣe ìmúdójúìwọ̀n ń mú ẹ̀yà tuntun wá, Yọ kúrò ń pa fọ́ǹtì náà rẹ́ lórí ẹ̀rọ.\n\nÓ nílò Wi-Fi.\n\nFỌǸTÌ TÌRẸ\n\nLẹ́gbẹ̀ẹ́ Fọ́ǹtì míì, àkójọ kan náà ní Fọ́ǹtì tìrẹ, tó ń fi apá ìrànlọ́wọ́ yìí hàn. Fọ́ǹtì tìrẹ jẹ́ fáìlì .ttf tàbí .otf, fún àpẹẹrẹ láti Google Fonts.\n\nLórí Android àti àwọn ẹ̀rọ míì tó ń ya fáìlì fọ́ǹtì: ṣe ẹ̀dà fáìlì náà sínú fódà fonts (lórí Android: PaperPaw/fonts nínú ibi ìpamọ́ àpapọ̀), tún PaperPaw bẹ̀rẹ̀, kí o sì yan fọ́ǹtì náà nínú Ètò, lábẹ́ Kíkà, bí Fọ́ǹtì.\n\nLórí Xteink X4 àti X4 Pro: àwọn ẹ̀rọ kíkà wọ̀nyí ń ka àpò fọ́ǹtì, kì í ṣe fáìlì fọ́ǹtì, nítorí fáìlì fọ́ǹtì kò ní gbà nínú ìrántí wọn. Ṣe àpò kan lórí kọ̀ǹpútà pẹ̀lú paperpaw-fontgen, fún ẹ̀yà kọ̀ọ̀kan tí o ní (regular ṣe pàtàkì):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nÈyí ń ṣe fódà plugins/font-my-font. Ṣe ẹ̀dà rẹ̀ sínú fódà plugins lórí káàdì ìrántí, tún ẹ̀rọ bẹ̀rẹ̀, kí o sì yan My Font bí Fọ́ǹtì. Àpò ẹ̀yà kan jẹ́ nǹkan bí ìdajì megabyte fún lẹ́tà Látìn; àwọn ẹ̀yà tí o fi sílẹ̀ ni a ó yà ní regular. Irinṣẹ́ náà ń sọ iye nínú àwọn lẹ́tà tí o béèrè tí fọ́ǹtì náà ní (--chars latin,cyrillic,greek ń fi àwọn ìkọ̀wé míì kún un): fọ́ǹtì tí kò ní lẹ́tà ìwé rẹ kò lè fi wọ́n hàn, nítorí náà wá èyí tó bo ìkọ̀wé rẹ̀.\n\nFọ́ǹtì láti Fọ́ǹtì míì ń ṣiṣẹ́ bákan náà, wọn kò sì nílò kọ̀ǹpútà.\n\nFún ọ̀rọ̀ kékeré tó mọ́ kedere lórí ìbòjú e-ink, fi --hinting light kún àṣẹ náà: ó ń mú àwọn lẹ́tà bá àtẹ píksẹ́ẹ̀lì mu, bí a ṣe ṣe àwọn fọ́ǹtì ìpìlẹ̀. Láìsí rẹ̀, a ń ya àwọn lẹ́tà bí olùṣe fọ́ǹtì ṣe ṣe wọ́n; --hinting normal àti --hinting mono ń mú wọn bá a mu jù bẹ́ẹ̀ lọ. Fọ́ǹtì tí wọ́n ní àmì lókè tàbí nísàlẹ̀ lẹ́tà, bí Lárúbáwá tàbí Devanagari, dára jù láìsí rẹ̀."
