transfer.plugin.name = Gbígbé fáìlì
transfer.plugin.description = Fi ìwé àti fáìlì míì sórí ẹ̀rọ láti aṣàwákiri kan nínú nẹ́tíwọ́ọ̀kì kan náà.
transfer.plugin.how = "Gbígbé lórí Wi-Fi ń fi ìwé àti fáìlì míì sórí ẹ̀rọ láti aṣàwákiri kan nínú nẹ́tíwọ́ọ̀kì kan náà, láìsí okùn tàbí áàpù. O tún lè mú fáìlì wá, ṣe fódà àti pa nǹkan rẹ́.\n\nṢí i láti Irinṣẹ́. Ìbòjú náà ń fi àdírẹ́sì kan hàn bí ọ̀rọ̀ àti bí kóòdù QR: ṣí i nínú aṣàwákiri lórí fóònù tàbí kọ̀ǹpútà, tàbí ṣe sikánì kóòdù náà. Àdírẹ́sì náà ní kọ́kọ́rọ́ kan tí a ń ṣe ní tuntun ní gbogbo ìgbà, kí àwọn míì nínú nẹ́tíwọ́ọ̀kì má bàa dé ọ̀dọ̀ fáìlì rẹ. Gbígbé náà ń ṣiṣẹ́ níwọ̀n ìgbà tí ìbòjú náà bá wà ní ṣíṣí.\n\nNíbi tí PaperPaw fúnra rẹ̀ ti ń ṣàkóso Wi-Fi, bí lórí X4, Láìsí rọ́útà ní ìsàlẹ̀ ń ṣí nẹ́tíwọ́ọ̀kì ti ẹ̀rọ náà fúnra rẹ̀, tí fóònù yóò darapọ̀ mọ́ nípa ṣíṣe sikánì kóòdù kan."
