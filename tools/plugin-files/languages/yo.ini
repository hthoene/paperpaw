tasks.plugin.name = Iṣẹ́
tasks.plugin.description = Àkójọ iṣẹ́ pẹ̀lú ọjọ́ ìparí àti ìpele pàtàkì, lórí ẹ̀rọ kíkà tàbí ní ìmúṣiṣẹ́pọ̀ pẹ̀lú sáfà CalDAV rẹ, pẹ̀lú wíjẹ́ẹ̀tì fún ìbòjú ilé.
tasks.plugin.how = "Àkójọ iṣẹ́ lórí ẹ̀rọ kíkà rẹ: iṣẹ́ pẹ̀lú ọjọ́ ìparí àti ìpele pàtàkì, tí o ń sàmì sí nígbà tí wọ́n bá parí. Wọn kò nílò ìṣètò tàbí nẹ́tíwọ́ọ̀kì, a sì lè mú wọn ṣiṣẹ́pọ̀ pẹ̀lú sáfà CalDAV (Nextcloud, Radicale, Baïkal, Fastmail àti àwọn míì), kí àwọn àkójọ kan náà lè wà lórí fóònù àti kọ̀ǹpútà rẹ.\n\nṢí Iṣẹ́ láti inú mẹ́nù Irinṣẹ́. Ìlà àkọ́kọ́ ń sọ àkójọ tó ń hàn; yàn án fún àkójọ míì, fún Òní àti èyí tó ti pẹ́ nínú gbogbo àkójọ, fún àkójọ tuntun, láti mú ṣiṣẹ́pọ̀, tàbí láti ṣètò àkáǹtì. Fi iṣẹ́ kún un ń ṣí kíbọ́ọ̀dù. Yàn lórí iṣẹ́ kan ń sàmì sí i pé ó ti parí (lẹ́ẹ̀kan sí i: kò tíì parí). Di iṣẹ́ kan mú tàbí tẹ̀ Mẹ́nù láti yí àkọlé rẹ̀ padà, ọjọ́ ìparí rẹ̀ (òní, ọ̀la, lẹ́yìn ọ̀sẹ̀ kan, tàbí ọjọ́ tí o tẹ̀ bí 2026-12-24) tàbí ìpele pàtàkì rẹ̀, tàbí láti yọ ọ́ kúrò. Àwọn iṣẹ́ tí kò tíì parí ló ń kọ́kọ́ hàn, ní títẹ̀lé ọjọ́ wọn àti lẹ́yìn náà ìpele pàtàkì; àwọn tó ti parí ń wà ní ìsàlẹ̀ fún ọ̀sẹ̀ kan (ṣètò rẹ̀ lábẹ́ Iṣẹ́ nínú ètò), lẹ́yìn náà wọ́n á kúrò lórí ẹ̀rọ kíkà.\n\nWíjẹ́ẹ̀tì fún ìbòjú ilé (di ìbòjú ilé mú, lẹ́yìn náà fi wíjẹ́ẹ̀tì kún un): Iṣẹ́ òní ń fi ohun tó yẹ kó parí lónìí tàbí tó ti pẹ́ hàn, Àkójọ iṣẹ́ ń fi àkójọ kan hàn, Iṣẹ́ tó kù ń ka iye wọn, Iṣẹ́ tó kàn sì ń fi èyí tí o máa ṣe tẹ̀lé e hàn. Títẹ̀ iṣẹ́ kan nínú wíjẹ́ẹ̀tì ń sàmì sí i pé ó ti parí; títẹ̀ àkọlé kan ń ṣí àwọn àkójọ.\n\nLáti mú ṣiṣẹ́pọ̀, yan Àkáǹtì CalDAV láti ìlà àkójọ, kí o sì tẹ àdírẹ́sì sáfà, orúkọ olùmúlò rẹ àti ọ̀rọ̀ aṣínà (ó dára jù kí ó jẹ́ ọ̀rọ̀ aṣínà áàpù). Àdírẹ́sì sáfà ti tó, fún àpẹẹrẹ cloud.example.com/remote.php/dav; ẹ̀rọ kíkà yóò rí àwọn àkójọ iṣẹ́ rẹ láti ibẹ̀. Àkójọ iṣẹ́ kọ̀ọ̀kan lórí sáfà ń di àkójọ kan lórí ẹ̀rọ kíkà. Ẹrọ kíkà ń mú ṣiṣẹ́pọ̀ nígbà tí o bá ṣí Iṣẹ́, nígbà tí o bá yan Mú ṣiṣẹ́pọ̀ báyìí, àti nígbà tí nẹ́tíwọ́ọ̀kì bá ti wà ní títàn tẹ́lẹ̀; ohun tí o yí padà láìsí nẹ́tíwọ́ọ̀kì yóò dúró, a ó sì fi ránṣẹ́ lẹ́yìn náà. Tí a bá yí iṣẹ́ kan padà lórí ẹ̀rọ kíkà àti níbòmíràn ní àkókò kan náà, a ó mú ẹ̀yà ti sáfà, a ó sì pa tìrẹ mọ́ bí iṣẹ́ tuntun lẹ́gbẹ̀ẹ́ rẹ̀, kí nǹkankan má bàa sọnù. Àkọsílẹ̀, ìdágìrì àti gbogbo ohun míì tí iṣẹ́ kan ní lórí sáfà yóò wà bí wọ́n ṣe wà. Iṣẹ́ tó ń tún ṣẹlẹ̀ ń hàn, ṣùgbọ́n ibi tí o ti dá wọn ni o ti lè yí wọn padà. Ẹrọ kíkà lè gba iṣẹ́ tó tó 200 nínú àkójọ 12."
