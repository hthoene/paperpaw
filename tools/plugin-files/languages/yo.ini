about.plugin.name = Nípa
about.plugin.description = Ẹyà PaperPaw àti ìwé àṣẹ rẹ̀.
about.plugin.how = "Nípa ń fi ẹ̀yà PaperPaw tí o ní hàn, ibi tí kóòdù orísun rẹ̀ wà, àti lábẹ́ ìwé àṣẹ wo ni ó wá.\n\nÌwọ yóò rí i ní òpin Ètò, bí Nípa PaperPaw. Yan ìlà kan pẹ̀lú bọ́tìnnì ọfà àti Yàn, tàbí tẹ̀ ẹ́. Àwọn àfikún tí a kọ́ sínú sọ́fítíwià ẹ̀rọ náà wà nínú àkójọ pẹ̀lú, àti, lórí ẹ̀rọ tí ń gbé àfikún onínú kóòdù wọlé, àmì ìdánimọ̀ tí a gbọ́dọ̀ kọ́ irú àfikún bẹ́ẹ̀ fún.\n\nÌwé àṣẹ ń ṣí bí ọ̀rọ̀ nínú kíkà, nítorí náà o ń yí ojú-ìwé rẹ̀ bí ìwé. Ó ní ìwé àṣẹ PaperPaw fúnra rẹ̀ àti ti fọ́ǹtì, àmì àwòrán àti àpẹẹrẹ pípín ọ̀rọ̀ tó wá pẹ̀lú rẹ̀. Àfikún lè fi ìlà tiwọn kún un, bí orúkọ ẹni tó ṣe àwòṣe kan."
