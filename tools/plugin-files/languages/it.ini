vocabulary.sd.readme = "Schede da file\n\nMetti qui un file per ogni mazzo: Spagnolo.tsv crea il mazzo Spagnolo.\nFile: .tsv, .csv o .txt, salvati in UTF-8, oppure .apkg: un mazzo Anki esportato selezionando Support older Anki versions. I primi tre campi delle note diventano fronte, retro ed esempio; pianificazione e contenuti multimediali non vengono letti, e PaperPaw non scrive mai un file Anki.\n\nUna scheda per riga: fronte, retro ed esempio facoltativo, separati da tabulazione, virgola o punto e virgola. La prima riga può indicare le colonne: front, back, example. Esempio:\n\nKatze\tcat\tDie Katze schläft.\n\nApri poi Schede sul lettore, scegli Schede sulla scheda SD e Aggiorna mazzi dalla scheda.\n\nDa sapere:\n- I mazzi restano sul lettore con i progressi di apprendimento. Un file viene letto quando è nuovo o modificato; le schede vengono aggiunte o aggiornate nel mazzo.\n- Se cambi il retro o l’esempio di una scheda nel file, la scheda cambia e conserva i progressi.\n- Se cambi il testo sul fronte, viene considerata una nuova scheda e quella precedente ricomincia da zero. Le schede vengono abbinate per il testo sul fronte, ignorando spazi e maiuscole. Salva un mazzo in un file (Schede sulla scheda SD, Salva mazzo sulla scheda): ogni scheda avrà un numero nella colonna id. Se cambi un fronte lì e lasci invariate le prime due righe del file, la scheda conserva i progressi.\n- Il salvataggio scrive le schede del mazzo. Ciò che nel file non è una scheda (una riga senza fronte) non viene conservato; il file precedente viene copiato in _name.bak.tsv.\n- Salva il file come CSV UTF-8 (non UTF-16 né nel formato nativo del foglio di calcolo). Un file oltre 4 MiB o 20.000 righe non viene letto: dividilo.\n- Eliminare una riga dal file non elimina la scheda dal mazzo, salvo attivare Rimuovi schede mancanti per quel mazzo. In quel caso la scheda viene rimossa insieme ai progressi.\n- I file con nome che inizia con _ non vengono letti.\n"
