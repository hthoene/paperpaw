update.plugin.how = "Aggiornamento installa un nuovo firmware sui dispositivi in cui PaperPaw è il firmware, come l’X4. Si trova nelle impostazioni, alla voce Aggiornamento.\n\nCerca online chiede al server di aggiornamento una versione più recente di PaperPaw e la scarica; servono alcuni minuti tramite Wi-Fi. Puoi anche copiare un file di aggiornamento (con estensione .bin, da paperpaw.org) nella cartella updates sulla scheda, per esempio con Trasferimento Wi-Fi. L’installazione richiede circa un minuto, poi il dispositivo si riavvia; libri, impostazioni e posizioni di lettura restano.\n\nAttivando Cerca aggiornamenti nelle impostazioni (inizialmente disattivato), il dispositivo verifica da solo circa una volta a settimana, solo quando il Wi-Fi è già attivo o durante la ricarica. Una nuova versione attende qui senza interrompere la lettura. La ricerca invia la versione in uso, senza nome o numero del dispositivo; per contare i dispositivi, indica anche se hai avviato tu la ricerca e se è la prima del giorno, della settimana o del mese.\n\nSe un plugin in uso non ha ancora una versione compatibile, l’aggiornamento attende. Una versione precedente viene installata solo se la scegli.\n\nPuoi installare da qui anche un altro firmware, come CrossPoint: metti il suo file .bin nella cartella updates e apri Aggiornamento. PaperPaw verifica che sia un firmware completo e integro per questo dispositivo, ma non può identificarne l’autore perché non è firmato. Installa comunque lo scrive nell’altra metà della memoria flash, e il dispositivo lo avvia; PaperPaw resta nella sua metà finché l’altro firmware non vi scrive sopra. Per tornare a PaperPaw, installa il suo file di installazione (paperpaw-<device>-<version>-install.bin) dal menu dell’altro firmware, per esempio SD firmware update in CrossPoint."
