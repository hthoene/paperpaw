files.plugin.name = Esplora file
files.plugin.description = Elenca e apre i libri e le cartelle sul dispositivo.
files.plugin.how = "La biblioteca elenca i libri nella tua cartella di biblioteca, con copertina, titolo, autore e avanzamento di lettura. Il libro letto per ultimo appare in alto come scheda: basta un tocco o una pressione di Scegli per continuare. Mentre cerca i libri, la biblioteca indica quanti ne ha già trovati.\n\nScegli cosa mostrare sopra i libri: tutti, quelli in lettura, non letti o letti, oppure gli scaffali (per autore, serie, etichetta, preferiti, prossimo libro di ogni serie iniziata). Tocca un libro per leggerlo; tienilo premuto (con i pulsanti, tieni premuto Scegli) per aprirlo, segnarlo come letto o non letto, vederne le informazioni, archiviarlo o eliminarlo. Tocca il titolo per aprire il menu della biblioteca: ordinamento, visualizzazione, ricerca, cartella della biblioteca e impostazioni.\n\nLa cartella si sceglie in Impostazioni, Biblioteca, Cartella della biblioteca; qui puoi anche mostrare i libri come griglia di copertine. Per gli altri file, usa File nel menu Strumenti."
