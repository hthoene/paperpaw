update.plugin.description = Installe les mises à jour du micrologiciel depuis la carte ou Internet.
update.plugin.how = "Mise à jour installe un nouveau micrologiciel sur les appareils dont PaperPaw est le micrologiciel, comme le X4. Vous la trouverez dans les réglages, sous Mise à jour.\n\nRechercher en ligne demande au serveur une version plus récente de PaperPaw et la télécharge, ce qui prend quelques minutes en Wi-Fi. Vous pouvez aussi copier un fichier de mise à jour (en .bin, depuis paperpaw.org) dans le dossier updates de la carte, par exemple par transfert Wi-Fi. L’installation prend environ une minute, puis l’appareil redémarre ; livres, réglages et positions de lecture sont conservés.\n\nSi Rechercher les mises à jour est activé dans les réglages (désactivé au départ), l’appareil vérifie environ une fois par semaine, uniquement lorsque le Wi-Fi est déjà actif ou pendant la charge. Une nouvelle version vous attend ici sans interrompre la lecture. La recherche envoie la version utilisée, sans nom ni numéro de l’appareil ; pour compter les appareils, elle indique aussi si vous avez lancé la recherche et s’il s’agit de la première du jour, de la semaine ou du mois.\n\nSi un plugin utilisé n’a pas encore de version compatible, la mise à jour attend. Une ancienne version ne s’installe que si vous la choisissez.\n\nUn autre micrologiciel, comme CrossPoint, peut aussi s’installer ici : placez son fichier .bin dans le dossier updates, puis ouvrez Mise à jour. PaperPaw vérifie qu’il s’agit d’un micrologiciel complet et intact pour cet appareil, mais ne peut pas identifier son auteur car il n’est pas signé. Installer quand même l’écrit dans l’autre moitié de la mémoire flash, puis l’appareil le démarre ; PaperPaw reste dans sa moitié jusqu’à ce que l’autre micrologiciel l’écrase. Pour revenir à PaperPaw, installez son fichier d’installation (paperpaw-<device>-<version>-install.bin) depuis le menu de l’autre micrologiciel, par exemple SD firmware update dans CrossPoint."
