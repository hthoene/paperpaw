files.plugin.name = Explorateur de fichiers
files.plugin.description = Affiche et ouvre les livres et les dossiers de l’appareil.
files.plugin.how = "La bibliothèque liste les livres de votre dossier de bibliothèque, avec leur couverture, titre, auteur et progression. Le dernier livre lu apparaît en haut sous forme de carte : touchez-le ou appuyez sur Sélectionner pour reprendre la lecture. Pendant la recherche de livres, la bibliothèque indique combien elle en a trouvé.\n\nAu-dessus des livres, choisissez quoi afficher : tous les livres, ceux en cours, non lus ou terminés, ou les étagères (par auteur, série, étiquette, favoris, prochain livre de chaque série commencée). Touchez un livre pour le lire ; maintenez-le (avec les touches, maintenez Sélectionner) pour l’ouvrir, le marquer comme terminé ou non lu, voir ses informations, l’archiver ou le supprimer. Touchez le titre pour ouvrir le menu : tri, affichage, recherche, dossier de bibliothèque et réglages.\n\nLe dossier se choisit dans Réglages, sous Bibliothèque, à Dossier de bibliothèque ; vous pouvez aussi y afficher les livres en grille de couvertures. Pour les autres fichiers, utilisez Fichiers dans le menu Outils."
