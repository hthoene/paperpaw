vocabulary.setting.sd-folder.help = Sur la carte SD : chaque fichier CSV, TSV ou Anki de ce dossier forme un paquet.
vocabulary.sd.readme = "Cartes de révision depuis des fichiers\n\nPlacez ici un fichier par paquet : Espagnol.tsv crée le paquet Espagnol.\nFichiers : .tsv, .csv ou .txt en UTF-8, ou .apkg, paquet Anki exporté avec la prise en charge des anciennes versions d’Anki. Les trois premiers champs deviennent recto, verso et exemple. La planification et les médias sont ignorés. PaperPaw ne modifie jamais un fichier Anki.\n\nUne carte par ligne : recto, verso et exemple facultatif, séparés par tabulation, virgule ou point-virgule. La première ligne peut nommer les colonnes : front, back, example. Exemple :\n\nKatze\tchat\tDie Katze schläft.\n\nSur la liseuse, ouvrez Cartes de révision, puis Cartes sur la carte SD et Mettre les paquets à jour depuis la carte.\n\nÀ savoir :\n- Les paquets et votre progression restent sur la liseuse. Les fichiers nouveaux ou modifiés sont lus pour ajouter ou modifier leurs cartes.\n- Modifier le verso ou l’exemple dans le fichier met la carte à jour en conservant votre progression.\n- Modifier le recto crée une nouvelle carte et fait repartir l’ancienne de zéro. Les cartes sont associées par leur recto, sans tenir compte des espaces et majuscules. Enregistrez un paquet dans un fichier (Cartes sur la carte SD, Enregistrer le paquet sur la carte) pour attribuer un numéro à chaque carte dans la colonne id. Vous pouvez alors modifier un recto en conservant votre progression, à condition de garder les deux premières lignes du fichier intactes.\n- L’enregistrement écrit les cartes du paquet. Les lignes sans recto ne sont pas conservées. L’ancien fichier est copié vers _name.bak.tsv.\n- Enregistrez en CSV UTF-8, pas en UTF-16 ni au format du tableur. Un fichier de plus de 4 Mio ou 20 000 lignes n’est pas lu : scindez-le.\n- Supprimer une ligne du fichier ne supprime pas la carte du paquet, sauf si vous activez la suppression des cartes absentes pour ce paquet. La carte et sa progression sont alors supprimées.\n- Les fichiers dont le nom commence par _ sont ignorés.\n"
