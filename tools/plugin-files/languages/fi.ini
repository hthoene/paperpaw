update.plugin.name = Päivitä
update.plugin.description = Asentaa laiteohjelmiston päivityksiä kortilta tai verkosta.
update.plugin.how = "Päivitys asentaa uuden laiteohjelmiston laitteisiin, joissa PaperPaw toimii laiteohjelmistona, kuten X4:ään. Se löytyy asetusten Päivitys-kohdasta.\n\nHae verkosta kysyy päivityspalvelimelta uudempaa PaperPaw'ta ja lataa sen. Tämä vie muutaman minuutin Wi-Fi-yhteydellä. Voit myös kopioida päivitystiedoston (.bin-päätteinen, paperpaw.org-sivustolta) kortin updates-kansioon esimerkiksi Wi-Fi-siirrolla. Asennus kestää noin minuutin ja laite käynnistyy uudelleen; kirjat, asetukset ja lukukohdat säilyvät.\n\nKun Etsi päivityksiä on käytössä (asetuksissa, aluksi pois), laite tarkistaa päivitykset noin kerran viikossa itsestään, vain Wi-Fi-yhteyden ollessa jo päällä tai ladattaessa. Löytynyt uudempi PaperPaw odottaa täällä; lukemista ei keskeytetä. Haku lähettää laitteen ohjelmistotiedot, ei laitteen nimeä tai numeroa; laitemäärien laskentaa varten myös sen, pyysitkö hakua ja onko se päivän, viikon tai kuukauden ensimmäinen.\n\nJos käyttämillesi laajennuksille ei vielä ole uuden julkaisun versiota, päivitys odottaa niitä. Vanhempi versio asennetaan vain valitsemalla se.\n\nMyös toisen laiteohjelmiston, kuten CrossPointin, voi asentaa täältä: laita sen .bin-tiedosto updates-kansioon ja avaa Päivitys. PaperPaw tarkistaa, että tiedosto on kokonainen, ehjä laiteohjelmisto tälle laitteelle, mutta ei voi varmistaa tekijää, koska allekirjoitusta ei ole. Asenna silti kirjoittaa sen flash-muistin toiseen puoliskoon ja käynnistää sen; PaperPaw säilyy omassa puoliskossaan, kunnes toinen laiteohjelmisto asentaa jotain sen päälle. Palaa myöhemmin PaperPaw'hun asentamalla sen asennustiedosto (paperpaw-<device>-<version>-install.bin) toisen laiteohjelmiston valikosta, kuten CrossPointin SD firmware update -kohdasta."
