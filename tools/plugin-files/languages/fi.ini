files.plugin.name = Tiedostoselain
files.plugin.description = Luettelee ja avaa laitteen kirjat ja kansiot.
files.plugin.how = "Kirjasto näyttää kirjastokansiosi kirjat kansineen, nimineen, tekijöineen ja lukutilanteineen. Viimeksi lukemasi kirja on ylimpänä korttina, joten lukeminen jatkuu yhdellä napautuksella tai OK-painalluksella. Kirjoja etsiessään kirjasto näyttää tähän asti löydetyn määrän.\n\nValitse kirjojen yläpuolelta, mitä näytetään: kaikki kirjat, aloitetut, lukemattomat tai luetut, tai hyllyt (tekijän, sarjan tai tunnisteen mukaan, suosikit ja aloitettujen sarjojen seuraavat kirjat). Napauta kirjaa lukeaksesi; pidä sitä painettuna (painikkeilla: pidä OK pohjassa) avataksesi sen, merkitäksesi sen luetuksi tai lukemattomaksi, katsoaksesi tiedot, siirtääksesi arkistoon tai poistaaksesi. Napauta otsikkoa avataksesi kirjastovalikon: lajittelu ja näkymä, haku, kirjastokansio ja asetukset.\n\nKirjastokansio asetetaan asetusten Kirjasto-kohdassa; siellä kirjat voi myös näyttää kansiruudukkona. Kaikki muut tiedostot löytyvät Työkalut-valikon Tiedostot-kohdasta."
