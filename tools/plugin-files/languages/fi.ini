vocabulary.sd.readme = "Muistikortit tiedostoista\n\nLaita tänne tiedosto kutakin pakkaa kohti: Espanja.tsv luo pakan Espanja.\nTiedostot: .tsv, .csv tai .txt UTF-8-muodossa tai .apkg: Anki-pakka, joka on viety valinnalla Support older Anki versions. Muistiinpanojen kolme ensimmäistä kenttää tulevat etupuoleksi, takapuoleksi ja esimerkiksi; ajoituksia ja mediaa ei lueta, eikä PaperPaw koskaan kirjoita Anki-tiedostoa.\n\nYksi kortti riville: etupuoli, takapuoli ja esimerkki (valinnainen), erotettu sarkaimella, pilkulla tai puolipisteellä. Ensimmäinen rivi voi nimetä sarakkeet: front, back, example. Esimerkki:\n\nKatze;kissa;Die Katze schläft.\n\nAvaa sitten lukulaitteen Muistikortit, valitse Kortit SD-kortilla ja Päivitä pakat.\n\nHyvä tietää:\n- Pakat ja oppimasi säilyvät lukulaitteella. Uusi tai muuttunut tiedosto luetaan ja sen kortit lisätään pakkaan tai päivitetään siellä.\n- Jos muutat kortin takapuolta tai esimerkkiä tiedostossa, kortti muuttuu ja edistyminen säilyy.\n- Jos muutat etupuolen tekstiä, se lasketaan uudeksi kortiksi ja vanha aloittaa alusta. Kortit tunnistetaan etupuolen tekstistä; välilyöntejä ja kirjainkokoa ei huomioida. Kun tallennat pakan tiedostoon (Kortit SD-kortilla, Tallenna pakka kortille), jokainen kortti saa numeron id-sarakkeeseen: muuta etupuolta siellä ja säilytä tiedoston kaksi ensimmäistä riviä ennallaan, niin opittu säilyy.\n- Tallennus kirjoittaa pakan kortit. Muut rivit (ilman etupuolta) eivät säily; aiempi tiedosto kopioidaan nimelle _name.bak.tsv.\n- Tallenna CSV UTF-8 -muotoon (ei UTF-16 eikä taulukkolaskennan oma muoto). Yli 4 MiB:n tai 20 000 rivin tiedostoa ei lueta: jaa se.\n- Tiedostosta poistettu rivi ei poista korttia pakasta, ellet ota käyttöön pakan puuttuvien korttien poistoa. Silloin myös opittu poistuu.\n- Alaviivalla _ alkavia tiedostonimiä ei lueta.\n"
