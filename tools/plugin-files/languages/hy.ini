settings.plugin.how = "«Կարգավորումներ»-ը էջերով ցույց է տալիս այն ամենը, ինչ կարելի է կարգավորել PaperPaw-ում և դրա պլագիններում։ Պլագիններին սեփական էկրան պետք չէ՝ այն, ինչ դրանք հայտարարում են, հայտնվում է այստեղ՝ խմբերով, յուրաքանչյուր կարգավորման նկարագրությունը՝ դրա տակ։\n\nԲացեք այն ընտրացանկի «Կարգավորումներ»-ով։ Հպեք խմբին՝ այն բացելու համար, ապա կարգավորմանը՝ այն փոխարկելու կամ ընտրելու համար, թվերն ունեն − և + կոճակներ։ Կոճակներով անցեք կարգավորմանը և սեղմեք «Ընտրել»՝ ձախն ու աջը փոխում են թիվը, «Ընտրել»-ը պահում է այն, «Հետ»-ը վերադարձնում է նախորդ արժեքը։\n\nՓոփոխությունները կիրառվում են անմիջապես։ «Որոնում»-ը գտնում է կարգավորումը բառերով, իսկ «Ընդլայնված կարգավորումներ»-ը ավելացնում է հազվադեպ անհրաժեշտները։ «Վերականգնել կանխադրվածը» և «Վերականգնել ամբողջը» նախ հարցնում են։"
