battery.plugin.description = Գրանցում է մարտկոցի վիճակը և ցույց տալիս, թե որքան է այն բավականացնում։
battery.plugin.how = "«Մարտկոցի ծախս»-ը մոտավորապես րոպեն մեկ գրանցում է լիցքը, մինչ սարքն արթուն է, ինչպես նաև այն, ինչ սարքն արել է՝ էկրանի թարմացումները և թերթված էջերը։ Դրանից այն հաշվում է, թե որքան են ծախսում արթուն մեկ ժամը և 100 էջը, և որքան կբավականացնի մարտկոցը այդ տեմպով։\n\nԲացեք «Մարտկոց»-ը «Գործիքներ» ընտրացանկից։ Այն ցույց է տալիս ընթացիկ լիցքը, արթնության այս շրջանը, մինչ այժմ մարտկոցով ծախսը և արթնության վերջին շրջանները։ Էջերը թերթվում են էջաշրջման կոճակներով կամ վերևի սլաքներին հպելով։\n\nՈրոշ ժամանակ մարտկոցով ընթերցելուց հետո միայն թվերը իմաստ կունենան։ Գրանցումն ըստ նախնականի միացված է, և այն կարելի է անջատել Կարգավորումներում՝ «Սարք», «Սնուցում» բաժնում, «Գրանցել մարտկոցի ծախսը» անունով։"
