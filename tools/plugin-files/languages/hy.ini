files.plugin.name = Ֆայլերի դիտարկիչ
files.plugin.description = Ցուցակում է սարքի գրքերն ու պանակները և բացում դրանք։
files.plugin.how = "Գրադարանը ցուցակում է ձեր գրադարանի պանակի գրքերը՝ յուրաքանչյուրը իր շապիկով, վերնագրով, հեղինակով և թե որքան եք կարդացել։ Վերջին կարդացած գիրքը վերևում է՝ որպես քարտ, այնպես որ ընթերցումը շարունակելու համար բավական է մեկ հպում կամ «Ընտրել»-ի մեկ սեղմում։ Մինչ գրադարանը գրքեր է որոնում, այն ցույց է տալիս, թե քանիսն է գտել մինչ այժմ։\n\nԸնտրեք, թե ինչ ցուցադրել գրքերի վերևում՝ բոլորը, այն գրքերը, որոնք կարդում եք, չկարդացածները կամ ավարտվածները, կամ դարակները (ըստ հեղինակի, շարքի, պիտակի, ընտրյալներ, ձեր սկսած յուրաքանչյուր շարքի հաջորդ գիրքը)։ Հպեք գրքին՝ այն կարդալու համար. սեղմած պահեք այն (կոճակներով՝ սեղմած պահեք «Ընտրել»)՝ այն բացելու, ավարտված կամ չկարդացած նշելու, տեղեկությունները տեսնելու, արխիվ տեղափոխելու կամ ջնջելու համար։ Հպեք վերնագրին՝ գրադարանի ընտրացանկի համար՝ ինչպես են գրքերը դասավորվում և ցուցադրվում, որոնում, գրադարանի պանակը և կարգավորումներ։\n\nԳրադարանի պանակը սահմանվում է կարգավորումներում՝ «Գրադարան» բաժնում, որպես «Գրադարանի պանակ». այնտեղ կարող եք նաև գրքերը ցուցադրել որպես շապիկների ցանց։ Մնացած բոլոր ֆայլերի համար օգտագործեք «Ֆայլեր»-ը «Գործիքներ» ընտրացանկում։"
