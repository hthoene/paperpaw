format-cbz.plugin.name = Կոմիքսներ
format-cbz.plugin.description = Բացում է կոմիքսների արխիվներ (.cbz)՝ մեկ նկար մեկ էջում։
format-cbz.plugin.how = "Բացում է կոմիքսների արխիվներ (.cbz)՝ մեկ նկար մեկ էջում, էկրանին հարմարեցված, ըստ անունների հերթականության (2-ը՝ 10-ից առաջ)։\n\nԴրեք դրանք գրադարանի պանակում և բացեք գրադարանից. էջերը թերթեք ինչպես ցանկացած գրքում։ Մեծ նկարներն առաջին անգամ մի պահ են պահանջում, X4-ում՝ ավելի, քան այլուր։\n\nԸնթերցման կարգավորումներ (Կարգավորումներ, Ընթերցում)՝ «Վահանակ առ վահանակ»-ը ցույց է տալիս էջի մեկ վահանակը միանգամից, որքան թույլ է տալիս էկրանը, և էջաշրջումն անցնում է դրանցով. առանց վահանակների էջը ցուցադրվում է ամբողջությամբ։ «Կոմիքսի էջերի ուղղությունը» հայելային է դարձնում էջաշրջումը մանգայի համար (աջից ձախ). գրքի սեփական ComicInfo.xml-ն ինքն է դա նշում։ Գրադարանը ցույց է տալիս գրքի վերնագիրը, շարքն ու համարը ComicInfo.xml-ից։"
