koreader.plugin.name = Ընդգծումների փոխանակում
koreader.plugin.description = Կիսվում է էջանիշերով և ընդգծումներով KOReader-ի հետ այն գրքերի համար, որոնք կարդում եք երկուսում էլ։
koreader.plugin.how = "Այս պլագինը կիսվում է էջանիշերով և ընդգծումներով KOReader-ի հետ այն գրքերի համար, որոնք կարդում եք երկուսում էլ՝ նույն սարքում կամ սարքերի միջև համաժամեցվող գրադարանի պանակում։ Կարգավորելու ոչինչ չկա։\n\nԵրբ PaperPaw-ը բացում է գիրք, որը KOReader-ը նույնպես բացել է, և երբ փոխում եք նրա էջանիշերը կամ ընդգծումները, այն վերցնում է նորը KOReader-ի տվյալներից գրքի կողքին և այստեղի նորը թողնում է, որպեսզի KOReader-ը վերցնի այն հաջորդ անգամ գիրքը բացելիս։ Փոխանցվում են նաև հեռացված նշագրումներն ու փոխված նշումները։\n\nՍա աշխատում է միայն EPUB գրքերի համար։ Եթե կողմերից մեկի ֆայլը հնարավոր չէ կարդալ, ոչ մի կողմում ոչինչ չի փոխվում, մինչև այն կարդացվի։"
koreader.removed-there = KOReader-ի ֆայլում այլևս ընդգծումներ չկան։ Հեռացնե՞լ դրանք նաև այստեղ։
koreader.removed-there.text = Հնարավոր է՝ դրանք հեռացվել են KOReader-ում, կամ նրա ֆայլը եկել է այլ սարքից։ «Թողնել»-ը պահում է դրանք այստեղ և նորից տալիս է KOReader-ին։
