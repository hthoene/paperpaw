profiles.plugin.name = Ընթերցման պրոֆիլներ
profiles.plugin.description = Ընթերցման և ցուցադրման կարգավորումների անվանված հավաքածուներ, որոնք փոխվում են մեկ հպումով։
profiles.plugin.how = "Պրոֆիլը պահում է ձեր ընթերցման կարգավորումները, ցուցադրման կարգավորումները և կարգավիճակի տողերը մեկ անվան տակ, օրինակ՝ «Գիշեր» կամ «Խոշոր տառեր», և վերադարձնում դրանք մեկ հպումով։\n\nԲացեք «Պրոֆիլներ»-ը ընթերցման ընտրացանկի «Ավելին» բաժնում կամ «Կարգավորումներ › Հարմարեցում» բաժնում։ Հպեք պրոֆիլին՝ այն օգտագործելու համար. օգտագործվողը նշված է։ Սեղմած պահեք այն (կոճակներով՝ սեղմած պահեք «Ընտրել»)՝ ընթացիկ կարգավորումներն այնտեղ պահելու, վերանվանելու կամ հեռացնելու համար։ «Պահել որպես նոր պրոֆիլ»-ը պահում է այն, ինչ հիմա կարգավորված է։\n\n«Հաջորդ պրոֆիլ»-ը անցնում է ցանկի հաջորդին. դրեք այն կոճակի վրա կամ կանոնի մեջ։"
