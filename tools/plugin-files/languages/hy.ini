store.plugin.name = Պլագինների խանութ
store.plugin.description = Գտնում, տեղադրում, թարմացնում և հեռացնում է այս սարքի պլագինները։
store.plugin.how = "Պլագինների խանութը ինտերնետում գտնում է այս սարքի պլագինները, տեղադրում, թարմացնում և հեռացնում դրանք։ Բացեք այն «Գործիքներ»-ից, դրա համար Wi-Fi է պետք։\n\nՄեկնարկային էջը ցույց է տալիս, թե ինչ է առաջարկում գրադարանը, ինչն է նոր կամ հիմա հայտնի, ապա խմբերը։ Խումբը ցույց է տալիս իր պլագինները արդար խառնուրդով, որն ամեն օր փոխվում է, որպեսզի յուրաքանչյուր պլագին երևա։ Դասավորեք դրանք A-ից Z, ըստ նորության կամ վերջին թարմացման, իսկ երկար ցանկերում անցեք որևէ տառի։ Բացեք պլագինը՝ դրա էջը տեսնելու համար՝ չափով և զբաղեցրած հիշողությամբ, ապա ընտրեք «Տեղադրել», «Թարմացնել» կամ «Հեռացնել»։ «Թարմացնել բոլորը»-ն թարմացնում է բոլոր տեղադրված պլագինները։\n\nԿոդային պլագիններն աշխատում են սարքի լիարժեք հասանելիությամբ՝ խանութն այդ մասին ասում է և նախապես հարցնում, իսկ դրանք մեկնարկում են վերագործարկումից հետո։ Եթե դրանցից մեկը խափանվի, PaperPaw-ը կմեկնարկի առանց կոդային պլագինների և կասի, թե որը։ «Պլագինների գրադարան»-ը որոշում է, թե որտեղից է գալիս ցանկը։\n\n«Համայնքի պլագիններ»-ը («Կարգավորումներ», «Համակարգ») ցույց է տալիս նաև այն պլագինները, որոնք ուրիշները հրապարակել են GitHub-ում։ Դրանք ոչ ոք չի ստուգել՝ դրանք նշված են որպես «Չստուգված», կոդային պլագինի էջը ցույց է տալիս այն բանալին, որով այն ստորագրված է, իսկ այլ բանալիով ստորագրված թարմացումը չի տեղադրվում։\n\n«Աղբյուրներ»-ը՝ մեկնարկային էջի վերջին տողը, ավելացնում է ուրիշների պլագինների ցանկերը՝ ըստ դրանց հասցեի (https://…/plugins.json), ցույց է տալիս դրանցից մեկը PaperPaw-ի ցանկի փոխարեն կամ հեռացնում այն։ Մուտքագրելու փոխարեն քարտի .paperpaw/plugins/store պանակում դրեք sources.txt ֆայլ՝ ամեն տողում մեկ հասցե։ Հասցեները կհայտնվեն «Աղբյուրներ»-ում որպես նոր։ PaperPaw-ը չի ստուգում աղբյուրը կամ դրա պլագինները, և սարքը կապվում է աղբյուրի սերվերի հետ։ Աղբյուրն իր ցանկը ստորագրում է, սարքը պահում է իր կարդացած առաջին ցանկի բանալին և դրանից հետո ընդունում է միայն այդ բանալիով ստորագրված ցանկեր և կոդային պլագիններ։ Պլագինը թարմացումներ ստանում է միայն այն աղբյուրից, որտեղից տեղադրվել է։ PaperPaw-ի սեփական գրադարանը միշտ առկա է և հնարավոր չէ հեռացնել, խանութից դուրս գալիս կրկին այն է ցուցադրվում։"
