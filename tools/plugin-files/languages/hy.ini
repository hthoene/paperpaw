vocabulary.sd.save.not-updated = Չպահվեց՝ քարտի ֆայլը նախ հնարավոր չեղավ կարդալ, և այն կարող է փոփոխություններ ունենալ, որոնք կապուկը դեռ չունի։ Ուղղեք ֆայլը և նորից փորձեք։
