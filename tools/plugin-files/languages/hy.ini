lock.plugin.name = Էկրանի կողպում
lock.plugin.description = PIN, նախշ կամ գաղտնաբառ, երբ սարքն արթնանում է։ Հպումը կողպվում է ընթերցելիս։
lock.plugin.how = "Էկրանի կողպումը PIN, նախշ կամ գաղտնաբառ է խնդրում, երբ PaperPaw-ը մեկնարկում է և երբ սարքն արթնանում է։ Սկզբում այն անջատված է։ Այն պաշտպանում է միայն պատահական օգտագործումից՝ կոդը և սխալ փորձերի քանակը պահվում են SD քարտի վրա, ուստի նա, ով հանում, խմբագրում կամ փոխում է քարտը, շրջանցում է կողպումը։\n\nԿարգավորեք այն կարգավորումներում՝ «Սարք», «Էկրանի կողպում»՝ մուտքագրեք գործող կոդը, եթե այն կա, ընտրեք տեսակը, ապա նոր կոդը երկու անգամ։ Նախշն առաջարկվում է միայն սենսորային էկրաններում։\n\nՀինգ սխալ փորձից հետո հաջորդը սպասում է կես րոպե։ «Կողպել հիմա»-ն կողպում է անմիջապես և կարող է կցվել կոճակի, ժեստի կամ կանոնի։ «Կողպել արթնանալուց հետո»-ն կարելի է անջատել, որպեսզի կողպի միայն իրական մեկնարկը (միացում կամ վերագործարկում), բացառությամբ այն դեպքերի, երբ ամեն արթնացում մեկնարկ է, ինչպես X4-ում մարտկոցով աշխատելիս։\n\nՀպման կողպում՝ դրա կողքին։ «Կողպել հպումը» արագ վահանակում և ընթերցման ընտրացանկում անգործուն է դարձնում հպումները, սահեցումները և գրիչը, մինչդեռ կոճակները շարունակում են աշխատել, օրինակ՝ էկրանին ձեռք դրած կարդալու համար։ Ապակողպելու համար հպեք երկու անգամ մեկ մատով և մի պահ պահեք այն սեղմած։ Սնուցման կոճակը սեղմած պահելը բացում է «Սնուցում» ընտրացանկը, որտեղ «Ապակողպել հպումը» դա անում է կոճակներով։ X4 Pro-ում գլխավոր կոճակը սեղմած պահելն ապակողպում է անմիջապես։"
