mail.plugin.name = Փոստ
mail.plugin.description = Կարդում և ուղարկում է էլ. նամակներ գաղտնաբառով կամ հավելվածի գաղտնաբառով (IMAP և SMTP), առանց դիտարկիչով մուտքի։
mail.plugin.how = "«Փոստ»-ը կարդում և ուղարկում է էլ. նամակներ IMAP-ի և SMTP-ի միջոցով։ Այն մուտք է գործում ձեր հասցեով և գաղտնաբառով, առանց դիտարկիչով մուտքի, ուստի աշխատում է ցանկացած մատակարարի հետ, որը դա թույլ է տալիս։\n\nՀաշիվը կարգավորեք «Կարգավորումներ», «Փոստ» բաժնում։ Ընտրեք ձեր մատակարարը, մուտքագրեք հասցեն և գաղտնաբառը։ Մատակարարների մեծ մասը պահանջում է հավելվածի գաղտնաբառ՝ ստեղծեք այն ձեր հաշվի անվտանգության կարգավորումներում և օգտագործեք այստեղ։ Ձեր սովորական գաղտնաբառը հաճախ չի աշխատում, և այն երբեք չի ուղարկվում այլ տեղ, քան ձեր մատակարարի սերվերը։ Այն պահվում է գաղտնաբառերի և բանալիների հետ։\n\nԲացեք «Փոստ»-ը գործիքներում։ «Ստուգել փոստը»-ն ստանում է վերջին նամակները և պանակները։ Նամակները պահվում են քարտի վրա, ուստի կարող եք կարդալ դրանք առանց ցանցի։ Սարքը միանում է, ստանում և անջատվում, ուստի Wi-Fi-ը միացված է միայն մի պահ։\n\nԵթե ձեր մատակարարը ցանկում չէ, ընտրեք «Սեփական սերվերներ» և լրացուցիչ կարգավորումներում նշեք սերվերների անունները, պորտերը և անվտանգությունը։ Այն սերվերը, որի վկայագիրը ոչ մի կենտրոն չի հաստատում, մեկ անգամ հարցնում է՝ վստահե՞լ նրան։ Համեմատեք մատնահետքը ձեր մատակարարի ցույց տվածի հետ։\n\nԳիրք կցված նամակի (EPUB, PDF և նմանատիպ, մինչև 2 ՄԲ) տակ կա «Բացել գիրքը»՝ այն ստանում է ֆայլը, դնում ձեր գրադարանում և բացում։\n\nՆոր նամակներն առանց «Փոստ»-ը բացելու տեսնելու համար միացրեք «Ստուգել նոր նամակները ֆոնում»-ը «Կարգավորումներ», «Փոստ» բաժնում և ընտրեք հաճախականությունը (15, 30 կամ 60 րոպեն մեկ)։ Այն անջատված է, մինչև չմիացնեք։ Այդ դեպքում ընթերցիչը, երբ արթուն է և առցանց, ժամանակ առ ժամանակ միանում է անվտանգ կապով՝ մեկ հաշիվը մյուսից հետո, և թարմացնում է չկարդացված նամակների թիվը գլխավոր էկրանին։ Այն որոշ չափով սպառում է մարտկոցը։ «Փոստ»-ը բացելը դադարեցնում է ընթացող ստուգումը։\n\nԳլխավոր էկրանի վիջեթները ցույց են տալիս չկարդացված նամակների թիվը, վերջին և աստղանշված նամակները, մեկ փոստարկղ և նամակ գրելու դյուրանցում։"
