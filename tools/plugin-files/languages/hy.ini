update.plugin.description = Տեղադրում է որոնվածի թարմացումներ՝ քարտից կամ ինտերնետից ներբեռնված։
update.plugin.how = "«Թարմացում»-ը տեղադրում է նոր որոնված այն սարքերում, որտեղ PaperPaw-ը որոնվածն է, օրինակ՝ X4-ում։ Այն կգտնեք կարգավորումներում՝ «Թարմացում» անունով։\n\n«Որոնել առցանց»-ը թարմացման սերվերից խնդրում է PaperPaw-ի ավելի նոր տարբերակ և ներբեռնում այն, ինչը Wi-Fi-ով մի քանի րոպե է տևում։ Կամ պատճենեք թարմացման ֆայլը (.bin վերջավորությամբ, paperpaw.org կայքից) քարտի updates պանակ, օրինակ՝ «Wi-Fi փոխանցում»-ով։ Այնուհետև «Տեղադրել»-ը տևում է մոտ մեկ րոպե, և սարքը վերագործարկվում է, գրքերը, կարգավորումները և ընթերցման դիրքերը մնում են։\n\nԵրբ «Ստուգել թարմացումները» կարգավորումը միացված է (սկզբում անջատված է), սարքն ինքն է ստուգում մոտավորապես շաբաթը մեկ՝ միայն երբ Wi-Fi-ն առանց այդ էլ միացված է կամ սարքը լիցքավորվում է։ Գտնված ավելի նոր PaperPaw-ը սպասում է այստեղ, ոչինչ չի ընդհատում ձեր ընթերցանությունը։ Որոնման ժամանակ ուղարկվում է այն, ինչ աշխատում է սարքում՝ առանց սարքի անվան կամ համարի, իսկ սարքերը հաշվելու համար՝ նաև այն, թե արդյոք դուք եք խնդրել, և արդյոք դա օրվա, շաբաթվա կամ ամսվա առաջին որոնումն է։\n\nԵթե ձեր օգտագործած պլագինները դեռ չունեն տարբերակ նոր թողարկման համար, թարմացումը սպասում է դրանց։ Ավելի հին տարբերակ տեղադրվում է միայն եթե այն ընտրեք։\n\nԱյլ որոնված, օրինակ՝ CrossPoint-ը, նույնպես տեղադրվում է այստեղից՝ դրեք դրա ֆայլը (.bin վերջավորությամբ) updates պանակում և բացեք «Թարմացում»-ը։ PaperPaw-ը ստուգում է, որ դա այս սարքի ամբողջական և չվնասված որոնված է, բայց չի կարող ասել, թե ով է այն ստեղծել, քանի որ այն ստորագրված չէ։ «Տեղադրել այնուամենայնիվ»-ը այն գրում է ֆլեշ հիշողության մյուս կեսում, և սարքը մեկնարկում է այն, PaperPaw-ը մնում է իր կեսում, մինչև այդ որոնվածը ինչ-որ բան տեղադրի դրա վրա։ Հետագայում PaperPaw-ին վերադառնալու համար տեղադրեք դրա տեղադրման ֆայլը (paperpaw-<device>-<version>-install.bin) մյուս որոնվածի ընտրացանկից, օրինակ՝ CrossPoint-ի «SD firmware update»-ից։"
