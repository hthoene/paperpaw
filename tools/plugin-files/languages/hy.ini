core.secrets-unreadable = Չհաջողվեց կարդալ {file} ֆայլը, ուստի գաղտնաբառերն ու բանալիները չեն պահվում։ Ուղղեք կամ հեռացրեք ֆայլը համակարգչում։
core.secrets-unopened = Այս քարտի որոշ պահված գաղտնաբառեր և բանալիներ այստեղ հնարավոր չէ բացել՝ դրանք պահվել են այլ սարքում, կամ այս սարքի բանալին կորել է։ Մուտքագրեք դրանք նորից այնտեղ, որտեղ պլագինը դրանք կխնդրի։
core.secrets-unsupported = Այս սարքը դեռ չի կարող գաղտնաբառեր պահել։ Մեկ անգամ նորից տեղադրեք PaperPaw-ը paperpaw.org կայքի վեբ-ֆլեշերով, և այն կաշխատի։
core.card.missing = Հիշողության քարտ չի գտնվել, ուստի ոչինչ չի պահվում։ Տեղադրեք FAT32 քարտ և վերագործարկեք։
