smart-home.plugin.description = Ձեր սեփական Home Assistant-ի արժեքներն ու փոխարկիչները՝ վահանակում և որպես գլխավոր էկրանի վիջեթներ։ Աշխատում է ձեր տնային ցանցի Home Assistant-ի հետ։
smart-home.plugin.how = "«Խելացի տուն»-ը ցույց է տալիս ձեր սեփական Home Assistant-ի արժեքներն ու փոխարկիչները՝ ջերմաստիճան, խոնավություն, էներգիա, դռներ և պատուհաններ, լույսեր, փոխարկիչներ և տեսարաններ։ Այն կապվում է ձեր սերվերի հետ դրա REST API-ով՝ ձեր տնային ցանցում, ոչինչ չի անցնում որևէ այլ ծառայության միջով։\n\nԲացեք «Խելացի տուն»-ը գործիքների ընտրացանկից, ապա «Միացում»՝ մուտքագրեք ձեր Home Assistant-ի հասցեն (օրինակ՝ http://homeassistant.local:8123) և երկարաժամկետ մուտքի տոկեն (ստեղծեք այն Home Assistant-ի ձեր պրոֆիլի էջի ներքևում)։ Տոկենը պահվում է գաղտնաբառերի և բանալիների մեջ, երբեք՝ կարգավորումների ֆայլում։ Պարզ http-ն օգտագործվում է միայն ձեր տնային ցանցի հասցեների համար, այլ տեղում գտնվող սերվերի համար կարգավորումներում միացրեք «Տնային ցանցից դուրս սերվերներ»-ը և օգտագործեք https՝ վավեր վկայագրով։\n\n«Ընտրել օբյեկտներ»-ը բացում է ցանկ այն ամենի, ինչ կա ձեր սերվերում՝ որոնեք ըստ անվան կամ id-ի և ընտրեք օբյեկտը՝ այն ցուցադրելու համար (նորից ընտրեք՝ հեռացնելու համար)։ Կարող եք նրան սենյակ տալ, որը խմբավորում է այն վահանակում և սենյակի վիջեթներում։ Պահվում է մինչև 24 օբյեկտ։ Վահանակում ընտրեք լույսը, փոխարկիչը կամ տեսարանը՝ այն փոխարկելու համար՝ տողը ցույց է տալիս սերվերի պատասխանը։ Ընտրված սենսորը նորից է կարդացվում։\n\nՎիջեթներ (սեղմած պահեք գլխավոր էկրանը, ապա ավելացրեք վիջեթ)՝ «Խելացի տան արժեք»-ը մեծ ցույց է տալիս մեկ ցուցմունք, «խումբ»-ը թվարկում է սենյակի օբյեկտները, «փոխարկիչ»-ը կոճակ է մեկ լույսի կամ փոխարկիչի համար, իսկ «սենյակ»-ը քարտ է՝ սենյակի ցուցմունքներով և փոխարկիչներով։ Յուրաքանչյուր վիջեթի կարգավորումները նշում են, թե որ օբյեկտը կամ սենյակն է այն ցուցադրում։\n\nՏունը կարդացվում է, երբ բացում եք վահանակը, երբ խնդրում եք («Թարմացնել» տողը կամ հպում արժեքի կամ խմբի վիջեթին), երբ ընթերցիչն արթնանում է արդեն միացված Wi-Fi-ով, և ձեր սահմանած ժամանակացույցով, մինչ լիցքավորիչը միացված է։ Այն երբեք ինքնուրույն չի միացնում ռադիոն և երբեք չի պահում այն միացված։"
