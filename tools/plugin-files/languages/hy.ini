calendar.plugin.description = Ձեր օրացույցները սարքում՝ օրակարգ, օր, շաբաթ և ամիս CalDAV-ից, iCal-ից և ֆայլերից, ծննդյան օրեր կոնտակտներից, վիջեթներ գլխավոր էկրանի համար և քնի էկրան։
calendar.plugin.how = "Ձեր օրացույցները սարքում՝ օրակարգ, օր, շաբաթ և ամիս՝ CalDAV օրացույցների (Nextcloud, Radicale, Baïkal, Fastmail և այլն), iCal հասցեների (.ics, webcal://) և քարտի օրացույցային ֆայլերի միջոցառումներով, ինչպես նաև կոնտակտների (CardDAV) ծննդյան օրերով ու տարեդարձերով։ Սարքը օրացույցները միայն կարդում է։\n\nԲացեք «Օրացույց»-ը գործիքների ընտրացանկից։ Ընտրեք առաջին տողը (դիտման ձևը), սեղմած պահեք որևէ տող կամ սեղմեք «Ընտրացանկ»՝ Օրակարգի, Օրվա, Շաբաթվա, Ամսվա և Ծննդյան օրերի միջև անցնելու, օրացույցներ ավելացնելու կամ համաժամացնելու համար։ Օր և Շաբաթ դիտումներում առաջին երկու տողերը և էջաշրջման կոճակները տանում են նախորդ կամ հաջորդ օրը կամ շաբաթը։ Ամիս դիտումում սլաքները տեղափոխում են օրը, էջաշրջման կոճակները՝ ամիսը, «Ընտրել»-ը բացում է օրը։ «Ընտրել»-ը միջոցառման վրա ցույց է տալիս այն ամբողջությամբ։ «Հետ»-ը տանում է մեկ քայլ ետ։\n\nՕրացույց ավելացրեք «Օրացույցներ» բաժնում (ընտրացանկում կամ կարգավորումների «Օրացույց»-ում)։ Ընտրեք տեսակը՝ CalDAV հաշիվ (բավական է սերվերի հասցեն, օր.՝ cloud.example.com/remote.php/dav), iCal հասցե (.ics), քարտի օրացույցային ֆայլ կամ կոնտակտներ (CardDAV հասցեագիրք)։ Մուտքագրեք հասցեն, հաշվի դեպքում՝ օգտանունն ու գաղտնաբառը (լավագույնը՝ հավելվածի գաղտնաբառ), և անուն։ Յուրաքանչյուր օրացույց իր նշանն ունի, որը կարող եք փոխել։ Առավելագույնը վեց օրացույց։\n\nԿրկնվող, ամբողջ օրվա և այլ ժամային գոտիների միջոցառումները ցուցադրվում են սարքի ժամացույցով։ Սարքը պահում է այսօրվանից 60 օր առաջ և հետո միջոցառումները (առավելագույնը 240) և ցույց է տալիս դրանք առանց ցանցի։\n\nՕրացույցները կարդացվում են, երբ բացում եք օրացույցը (առավելագույնը հինգ րոպեն մեկ), երբ ընտրում եք «Համաժամացնել հիմա», և, ըստ կարգավորումների «Օրացույց» բաժնի, երբ ցանցն արդեն միացված է կամ սկսվում է լիցքավորումը։ Սարքը ռադիոմոդուլը միացնում է միայն «Համաժամացնել հիմա»-ի համար։\n\nԳլխավոր էկրանի վիջեթներ (սեղմած պահեք էկրանը և ավելացրեք վիջեթ)՝ «Այսօր»՝ ամսաթիվը և օրվա միջոցառումները, «Հաջորդ միջոցառումը»՝ մոտակա միջոցառումը, «Օրակարգ»՝ առաջիկա օրերը, «Ամիս»՝ ամիսը՝ միջոցառումներով օրերի տակ կետով, «Ծննդյան օրեր»՝ մոտակա ծննդյան օրերը։ Հպումը բացում է միջոցառումը կամ ամսվա օրը։ Քնի էկրանը կարող է ցույց տալ այսօրվա օրակարգը. կարգավորումների «Քնի էկրան» բաժնում ընտրեք «Օրացույց»։"
