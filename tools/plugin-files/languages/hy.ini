notes-vault.plugin.name = Նշումների պահոց
notes-vault.plugin.description = Կարդում է Markdown նշումների պանակը՝ ըստ պանակների, պիտակների և վերջին փոփոխությունների, գլխավոր էկրանի վիջեթներով։ Աշխատում է Obsidian պահոցների հետ։
notes-vault.plugin.how = "«Նշումների պահոց» պլագինը կարդում է Markdown նշումների պանակը (պարզ .md ֆայլեր, ինչպես դրանք պահում են նշումների հավելվածները)։ Աշխատում է Obsidian պահոցների հետ։\n\nԸնտրեք պահոցի պանակը կարգավորումներում կամ պահոցի էջում՝ «Գործիքներ» ընտրացանկում։ Այնուհետև էջն առաջարկում է պանակները՝ ինչպես դրանք քարտի վրա են, վերջին փոփոխված նշումները, պիտակները և որոնում նշումների վերնագրերում։\n\nԱռաջին անգամ պահոցը ինդեքսավորվում է ֆոնային ռեժիմում, քանի դեռ դրա էջը բաց է. հազարավոր նշումներով պահոցի համար դա տևում է մի քանի րոպե, իսկ հետո այն բացվում է անմիջապես։ Ինդեքսը պահվում է քարտի վրա և նորից է ստեղծվում, երբ պահոցի էջը բացվում է մի քանի ժամ անց, կամ երբ ընտրում եք «Թարմացնել»։\n\nՆշումը բացվում է ընթերցիչում։ Այլ նշումների հղումները ([[Նշում]], [[Նշում|բառեր]], [[Նշում#Վերնագիր]]) գտնվում են նշման անունով պահոցի ցանկացած տեղում. հղումով անցնելը բացում է այդ նշումը, իսկ «Հետ»-ը վերադարձնում է նախորդ նշմանը։\n\nՊահոցում ոչինչ երբեք չի փոխվում։ Գլխավոր էկրանի վիջեթները (վերջին նշումներ, ամրացված նշում, օրվա նշում, պատահական նշում, պիտակներ, որոնում) ավելացվում են գլխավոր էկրանի խմբագրիչում։ Վիջեթը կարող է նշումներ վերցնել միայն մեկ պանակից. վիջեթի կարգավորումներում գրեք պանակի ուղին քարտի արմատից (օրինակ՝ Notes/Work). եթե դաշտը դատարկ է, այն վերցնում է պահոցի բոլոր նշումները։"
