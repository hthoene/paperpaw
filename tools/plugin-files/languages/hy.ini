launcher-simple.plugin.description = Հանգիստ մեկնարկային էկրան՝ մեծ ժամացույց, քարտեր, պատկերակների շարք և կլոր անջատիչներով արագ վահանակ։
launcher-simple.plugin.how = "«Պարզ գլխավոր էկրան»-ը հանգիստ մեկնարկային էկրան է նրանց համար, ում պետք է միայն հիմնականը՝ մեծ ժամացույց, ընթերցվող գիրքը, գրադարանը և խանութը որպես մեծ քարտեր, և ներքևում երեք պատկերակների շարք։ Այն կարգավորում չի պահանջում։\n\nԸնտրեք այն կարգավորումներում՝ գլխավոր էկրանի բաժնում։ Նրա արագ վահանակն (այն նույնպես ընտրեք որպես վահանակ կարգավորումներում) ունի մեծ կլոր անջատիչներ, լուսավորման սանդղակ, եթե սարքն ունի այն, և տեքստի չափի սանդղակ։ Կոճակներով սլաքային կոճակները տեղափոխում են ընտրությունը, իսկ «Ընտրել»-ը կատարում է այն, ինչ ասում է տարրը։ Սանդղակի վրա այն ավելացնում է մեկ տասներորդ, իսկ վերջից վերադառնում է սկիզբ։ Հպումով հպեք տարրին կամ սանդղակի վրա այն տեղում, որտեղ ուզում եք։\n\nԳրադարանը ցույց է տալիս ձեր գրքերը որպես քարտեր՝ վերջին բացվածը առաջինը, մեկ էջով, և բացում է սովորական ընթերցիչը։\n\nՀարմարեցրեք այն կարգավորումներում՝ «Պարզ գլխավոր էկրան» բաժնում։ Երեք ցանկ, որոնք խմբագրում եք այնպես, ինչպես գլխավոր ընտրացանկը։ «Քարտեր»՝ որ քարտերն է ցույց տալիս էկրանը և ինչ հերթականությամբ։ «Պատկերակների շարք»՝ որ պատկերակներն են այնտեղ՝ ցանկացած պլագինի ցանկացած գործողություն։ «Արագ վահանակ»՝ որ անջատիչներն ու սանդղակներն է այն ցույց տալիս։ Այն քարտը, որի համար էկրանին տեղ չկա, բաց է թողնվում՝ վերջից սկսած։ «Պարզ գլխավոր էկրան» բաժնում ընտրում եք նաև՝ ցուցադրե՞լ ամսաթիվը և մարտկոցը։"
