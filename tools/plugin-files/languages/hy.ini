menu.plugin.description = Ընտրացանկը էկրանի ներքևում՝ գործողություններով և կարգավորումներով։
menu.plugin.how = "Ընտրացանկը ցույց է տալիս, թե ինչ կարող եք անել և կարգավորել։ Այն բացվում է էկրանի ներքևում՝ բաց եղածի վրա։ Ընթերցելիս հպեք էկրանի մեջտեղին կամ սեղմեք «Ընտրել»։ Հպեք կամ ընտրեք կետը՝ այն գործարկելու համար։\n\nԸնտրացանկի կարգավորումները ցույց են տալիս իրենց արժեքը և փոխվում են տեղում, ուստի ընտրացանկը մնում է բաց։ Այլ կետեր պարունակող կետը բացում է ենթացանկ։\n\nՍահեցրեք վերևի եզրից վար՝ արագ վահանակի համար՝ այն, ինչ հաճախ եք փոխում, որպես կոճակներ։ Հպեք կոճակին՝ այն փոխարկելու համար, սեղմած պահեք՝ նրա կարգավորումների համար։ Միայն կոճակներով սլաքային կոճակներն ընտրում են, «Ընտրել»-ը փոխարկում է, իսկ «Հետ»-ը փակում է։ «Արտաքին տեսք» բաժնում «Ընտրացանկեր»-ը ցույց է տալիս ընտրացանկերը որպես ցանկ կամ սալիկներ։"
