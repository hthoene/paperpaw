bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Զուգակցում և միացնում է հեռակառավարման վահանակներ, ստեղնաշարեր և սենսորներ։
bluetooth.plugin.how = "Bluetooth-ը ընթերցիչի հետ զուգակցում է հեռակառավարման վահանակներ, ստեղնաշարեր և սենսորներ, եթե այն ունի Bluetooth (X4 Pro)։\n\n«Ավելացնել սարք»-ը փնտրում է այն, ինչ հասանելի է մոտակայքում։ Նախ սարքը դրեք զուգակցման ռեժիմի։ Ընտրեք այն և հաստատեք ընթերցիչում (համեմատեք թիվը, եթե այն ցուցադրվի)։ Այնուհետև վահանակի կամ ստեղնաշարի կոճակները թերթում են էջերը և շարժվում ընտրացանկերում։ Յուրաքանչյուր կոճակի գործողությունը փոխեք «Կառավարում» բաժնում։\n\n«Վահանակներ»-ը որոշում է, թե երբ են աշխատում դրանց կոճակները՝ երբ այստեղ միացված են, ընթերցելիս (միացված են, քանի դեռ գիրքը բաց է, ինչը խնայում է մարտկոցը) կամ միշտ։ Ընտրացանկի կոճակը կամ սարքի վրա երկար սեղմումը մոռանում է այն։\n\nՍենսորը պլագինների համար է՝ միացրեք, թե որ պլագինը կարող է այն օգտագործել։ Bluetooth-ն անջատված է, երբ ոչինչ այն չի օգտագործում։"
