aids.plugin.name = Ընթերցման օգնականներ
aids.plugin.description = Թավ բառասկզբեր, փոխարինված բառեր, նկարներ՝ տեքստն այնպես, ինչպես ուզում եք։
aids.plugin.how = "Ընթերցման օգնականները փոխում են գրքի տեքստի տեսքը ընթերցելիս։ Դրանք վերաբերում են բոլոր գրքերին։ «Թավ բառասկզբեր»-ը և «Փոխարինել բառերը»-ն սկզբում անջատված են։\n\nԴրանք կգտնեք Կարգավորումներում, «Ընթերցում» բաժնի «Ընթերցման օգնականներ» խմբում։ «Թավ բառասկզբեր»-ը յուրաքանչյուր բառի առաջին կեսը դարձնում է թավ, ինչը որոշ մարդկանց համար հեշտացնում է ընթերցումը։ «Փոխարինել բառերը»-ն ընդունում է զույգեր՝ գրված «Երեւան = Երևան; պրն։ = պարոն» տեսքով, բաժանված կետ-ստորակետով։\n\nՓոխարինվում են միայն ամբողջական բառերը՝ ճիշտ այնպես, ինչպես գրել եք, այնպես որ «Երեւան»-ը երբեք չի փոխում ավելի երկար բառի մասը։ Գրքի ֆայլն ինքը չի փոխվում։\n\nԳրքերի նկարները կարելի է ցուցադրել (ինչպես սկզբում), փոխարինել կարճ տողով, օրինակ՝ «[Նկար՝ նավ ծովում]», որն օգտագործում է նկարի նկարագրությունը, կամ բաց թողնել։ Այդ դեպքում էջում ավելի շատ տեղ կա տեքստի համար, և չցուցադրվող նկարի համար ոչինչ չի վերծանվում, ինչն արագացնում է էջաշրջումը։ Կոմիքսները և նկարներից կազմված այլ գրքերը չեն փոխվում։"
