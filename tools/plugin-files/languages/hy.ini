translate.plugin.description = Թարգմանում է ընտրված տեքստը առցանց՝ DeepL-ով։
translate.plugin.how = "«Թարգմանություն»-ը առցանց թարգմանում է ընտրված տեքստը DeepL-ով։ Ընտրեք տեքստ գրքում և ընտրված տեքստի ընտրացանկում ընտրեք «Թարգմանել»՝ թարգմանությունը կհայտնվի էջի վրա՝ բառարանային հոդվածի պես։ Էջաշրջման կոճակները կամ հպումները թերթում են այն, իսկ «Ընտրել»-ը կամ հպումը դրա վերջում փակում է այն։\n\nԴրա համար անհրաժեշտ են ցանց և ձեր սեփական DeepL API բանալին՝ անվճար deepl.com կայքում (DeepL API Free, ամսական մոտ 500 000 նիշ)։ Քանի դեռ այն չեք մուտքագրել, վահանակն այդ մասին ասում է, իսկ հպումը խնդրում է այն։\n\nԿարգավորումներում՝ «Ընթերցում» բաժնի «Թարգմանություն» հատվածում, «Թարգմանության լեզու»-ն որոշում է լեզուն, սկզբում դա PaperPaw-ի լեզուն է։"
