about.plugin.name = Մասին
about.plugin.description = PaperPaw-ի տարբերակը և լիցենզիաները։
about.plugin.how = "«Մասին»-ը ցույց է տալիս, թե PaperPaw-ի որ տարբերակն ունեք, որտեղ է դրա ելակոդը և ինչ լիցենզիաներով է այն տարածվում։\n\nԱյն կգտնեք Կարգավորումների վերջում՝ «PaperPaw-ի մասին» անունով։ Ընտրեք տողը սլաքների կոճակներով և «Ընտրել»-ով, կամ հպեք դրան։ Այնտեղ նշված են նաև որոնվածում ներկառուցված պլագինները, իսկ կոդով պլագիններ բեռնող սարքերում՝ այն մատնահետքը, որի համար պետք է կառուցված լինեն այդպիսի պլագինները։\n\n«Լիցենզիաներ»-ը բացվում է որպես տեքստ ընթերցիչում, այնպես որ այն թերթում եք գրքի պես։ Այն պարունակում է PaperPaw-ի սեփական լիցենզիան և դրա հետ եկող տառատեսակների, պատկերակների և տողադարձի նմուշների լիցենզիաները։ Պլագինները կարող են ավելացնել իրենց տողը, օրինակ՝ թեմայի հեղինակին։"
