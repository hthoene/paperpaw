plugin-manager.code.no-room-flash = Դրա կոդի համար տեղ չի մնացել։ Անջատեք կոդով մեկ այլ պլագին կամ վեբ-ֆլեշերով (paperpaw.org) տեղադրեք ամբողջական դասավորությունը՝ մի քանի անգամ ավելի շատ տեղ։
