fonts-browser.plugin.name = Այլ տառատեսակներ
fonts-browser.plugin.description = Ցույց է տալիս համացանցի տառատեսակներ՝ յուրաքանչյուրը նմուշով, և ներբեռնում դրանք ընթերցելու համար։
fonts-browser.plugin.how = "«Այլ տառատեսակներ»-ը ցուցակում է համացանցային գրադարանի տառատեսակները՝ յուրաքանչյուր անունն իր տառատեսակով, և ներբեռնում է նրանք, որոնցով ուզում եք կարդալ։\n\nԱյն տառատեսակների ցանկի վերջում է, որտեղ ընտրվում է ընթերցման տառատեսակը՝ կարգավորումներում, «Ընթերցում» բաժնում, որպես «Տառատեսակ». կարգավիճակի տողերն իրենց տառատեսակի համար ունեն նույն տարրը։ Հպեք տառատեսակին (կոճակներով՝ «Ընտրել»)՝ այն խոշոր տեսնելու նմուշ նախադասությամբ, ապա ընտրեք «Ներբեռնել»։ Ներբեռնման ընթացքում կարող եք լքել էջը։ Հետո ընտրեք «Կարդալ…» (տառատեսակի անունով) կամ «Օգտագործել կարգավիճակի տողերի համար»։ «Թարմացնել»-ը բերում է նոր տարբերակ, «Հեռացնել»-ը ջնջում է տառատեսակը սարքից։\n\nԱնհրաժեշտ է Wi-Fi։\n\nՁԵՐ ՍԵՓԱԿԱՆ ՏԱՌԱՏԵՍԱԿՆԵՐԸ\n\nՆույն ցանկի «Ձեր սեփական տառատեսակները» տարրը ցույց է տալիս օգնության այս մասը։ Սեփական տառատեսակը .ttf կամ .otf ֆայլ է, օրինակ՝ Google Fonts-ից։\n\nAndroid-ում և տառատեսակների ֆայլեր նկարող այլ սարքերում՝ պատճենեք ֆայլը fonts պանակում (Android-ում՝ PaperPaw/fonts ընդհանուր հիշողության մեջ), վերագործարկեք PaperPaw-ը և ընտրեք տառատեսակը «Ընթերցում» բաժնում՝ որպես «Տառատեսակ»։\n\nXteink X4-ը և X4 Pro-ն կարդում են տառատեսակների փաթեթներ, ոչ թե ֆայլեր, որոնք չեն տեղավորվի դրանց հիշողության մեջ։ Համակարգչում paperpaw-fontgen-ով ստեղծեք փաթեթ ձեր ունեցած ոճերով (regular-ը պարտադիր է)՝\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nՍա ստեղծում է plugins/font-my-font պանակը։ Պատճենեք այն հիշողության քարտի plugins պանակում, վերագործարկեք և որպես «Տառատեսակ» ընտրեք My Font։ Մեկ ոճը լատինական տառերի համար մոտ կես մեգաբայթ է. բաց թողնված ոճերը նկարվում են regular-ով։ Գործիքն ասում է, թե պահանջված տառերից քանիսն ունի տառատեսակը (--chars latin,cyrillic,greek-ը ավելացնում է գրեր)։ Առանց ձեր գրքի տառերի տառատեսակը չի կարող դրանք ցույց տալ, ուստի ընտրեք դրա գիրն ընդգրկողը։\n\n«Այլ տառատեսակներ»-ի տառատեսակներն աշխատում են նույն կերպ՝ առանց համակարգչի։\n\nE-ink էկրանին ավելի հստակ մանր տեքստի համար ավելացրեք --hinting light՝ այն տառերը հարմարեցնում է պիքսելային ցանցին, ինչպես ստանդարտ տառատեսակներում։ Առանց դրա տառերը նկարվում են ըստ հեղինակի նախագծի. --hinting normal-ը և --hinting mono-ն ավելի ուժեղ են հարմարեցնում։ Նշաններով գրերի (արաբական, դևանագարի) տառատեսակները լավ է թողնել առանց դրա։"
