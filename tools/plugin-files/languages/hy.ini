news.plugin.how = "«Լուրեր»-ը RSS կամ Atom լրահոսերը վերածում է գրքերի։ Յուրաքանչյուր լրահոս դառնում է մեկ գիրք գրադարանի «Լուրեր» պանակում՝ իր ամենանոր հոդվածներով որպես պարզ տեքստ, որը կարդում եք ինչպես ցանկացած այլ գիրք։\n\nԲացեք «Լուրեր»-ը «Գործիքներ» ընտրացանկից և ընտրեք «Ավելացնել լրահոս»։ Նրա հասցեն թերթի կամ բլոգի կայքում է։ «Ստանալ լուրերը»-ն ստանում է բոլոր լրահոսերը և փոխարինում նախորդ գրքերը։ Սեղմած պահեք լրահոսը (կոճակներով՝ սեղմած պահեք «Ընտրել»-ը)՝ միայն այն ստանալու կամ հեռացնելու համար։ Հեռացված լրահոսի գիրքը մնում է գրադարանում։\n\nՍտանալու համար ցանց է պետք։ «Հոդվածներ մեկ լրահոսից» (Կարգավորումներ, Գրադարան) սահմանում է, թե քանի հոդված է պարունակում յուրաքանչյուր գիրք։ «Լուրերի վերնագրեր» վիջեթը ցույց է տալիս դրանք գլխավոր էկրանին։"
