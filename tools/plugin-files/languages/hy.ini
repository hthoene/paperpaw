picture-home.plugin.description = Գլխավոր էկրան՝ վիջեթների հետևում ձեր սեփական նկարով և ձեր կարգավորած կարգավիճակի գոտիով։
picture-home.plugin.how = "Երբ միացված է, «Նկարով գլխավոր էկրան»-ը փոխարինում է գլխավոր էկրանին՝ ձեր սեփական նկարը վիջեթների հետևում, և վիջեթների ու գործիքների էջեր, որոնք դուք եք դասավորում։ Անջատեք այն պլագինների կառավարիչում, և ներկառուցված գլխավոր էկրանը կվերադառնա իր էջերով։\n\nՏեղադրեք նկարներ (JPEG, PNG կամ GIF) քարտի պանակում (ըստ նախնականի՝ wallpapers), ապա ընտրեք մեկը «Կարգավորումներ › Հարմարեցում › Նկարով գլխավոր էկրան» բաժնում։ «Տեղավորում»-ը որոշում է, թե ինչպես է այն լցնում էկրանը (լցնել, ամբողջ նկարը, ձգել, բնօրինակ չափ, սալիկներով), «Դիրք»-ը՝ որ մասն է մնում, «Մասշտաբ»-ը՝ որքան մեծ, իսկ «Բացացնել նկարը»՝ որքան գունատ. ավելի գունատ նկարի վրա վիջեթներն ավելի հեշտ են կարդացվում։ Նկարը պատրաստվում է մեկ անգամ յուրաքանչյուր էկրանի չափի համար, ինչը մի պահ է տևում։\n\nՎիջեթները նկարի վրա հիմքերի վրա են։ Էջը դասավորեք ինչպես ներկառուցված գլխավոր էկրանին՝ էջի տակի մատիտով կամ ընտրացանկի «Խմբագրել գլխավոր էկրանը» կետով։\n\nԿարգավիճակի գոտին (ժամ, Wi-Fi, մարտկոց կամ այն, ինչ ընտրեք) կարող է լինել միացված, անջատված կամ ավտոմատ, վերևում կամ ներքևում, ամբողջ լայնությամբ կամ փոքր օվալ ձախում, մեջտեղում կամ աջում, բաց, մուգ կամ մոխրագույն հիմքի վրա կամ հենց նկարի վրա։ Կոճակների անունների տողը (X4-ում) նույնպես կարող է լինել միացված, անջատված կամ ավտոմատ։ «Ավտոմատ» նշանակում է, որ կոճակի սեղմումը դրանք ցույց է տալիս մի քանի վայրկյան, և այդ սեղմումն այլ բան չի անում։\n\n«Նկարի ցուցադրում»-ը որոշում է, թե ինչպես է նկարվում նկարը՝ «Մոխրագույնի աստիճաններ»՝ էկրանի բոլոր մոխրագույն երանգներով (X4-ում ավելի դանդաղ), «Կետավոր»՝ սև և սպիտակ կետերով (արագ), կամ «Ավտոմատ»՝ ինչպես ներկառուցված գլխավոր էկրանը. մոխրագույնի աստիճաններ, երբ էկրանը նկարվում է, կետեր՝ առաջին փոփոխությունից հետո։ Որտեղ էկրանը մոխրագույնի աստիճաններ չունի, դրանք փոխարինվում են կետերով։"
