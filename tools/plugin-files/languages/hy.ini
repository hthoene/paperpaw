weather.plugin.name = Եղանակ
weather.plugin.description = Ներկայիս եղանակը և առաջիկա օրերը՝ որպես վիջեթներ, Open-Meteo-ից։
weather.plugin.how = "«Եղանակ»-ը գլխավոր էկրանի վիջեթներով ցույց է տալիս ներկայիս եղանակը և առաջիկա օրերը՝ Open-Meteo-ից, որը հաշիվ կամ բանալի չի պահանջում։ «Եղանակը հիմա»-ն ցույց է տալիս ջերմաստիճանը, եղանակային վիճակը և ընտրովի այլ տվյալներ, «Կանխատեսում»-ը՝ առաջիկա օրերը տողով կամ ցանկով։\n\nՆախ ընտրեք վայրը՝ կարգավորումներում՝ «Եղանակ» բաժնում, «Վայր» (մուտքագրեք անունը, ապա ընտրեք այն գտնված վայրերից)։ Ուղարկվում են միայն նրա կոորդինատները և միայն այն ժամանակ, երբ եղանակի վիջեթ է ցուցադրվում։ Վիջեթներն ավելացրեք՝ խմբագրելով գլխավոր էկրանը։\n\nԵղանակը բերվում է ոչ ավելի հաճախ, քան նշված է «Թարմացնել առավելագույնը» կարգավորումում, և միայն երբ ցանց կա. այն երբեք ինքնուրույն չի միացնում Wi-Fi-ը։\n\nԵղանակային տվյալները՝ Open-Meteo.com-ից (https://open-meteo.com), Creative Commons Attribution 4.0 լիցենզիայով (CC BY 4.0)։"
