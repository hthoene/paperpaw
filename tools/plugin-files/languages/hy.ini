keys.plugin.description = Ինչ է անում յուրաքանչյուր կոճակ, հպման գոտի և սահեցում։ Փոխվում է սարքում։
keys.plugin.how = "«Կոճակներ և ժեստեր»-ը ցույց է տալիս, թե ինչ է անում յուրաքանչյուր կոճակ, հպման գոտի և սահեցում, և թույլ է տալիս փոխել դա սարքում։\n\nԲացեք այն կարգավորումներում՝ «Սարք» բաժնում։ Նախ ընտրեք, թե որտեղ է գործում փոփոխությունը՝ «Ամենուր», «Ընթերցելիս», «Գլխավոր էկրանին», «Գրադարանում» կամ որևէ գործիքում։ Ապա ընտրեք մուտքը, օրինակ՝ սեղմած պահված կոճակ կամ սահեցում եզրից դեպի ներս, և ընտրեք գործողություն ցանկից, որում կարելի է որոնել։ «Ստանդարտ»-ը վերադարձնում է այն, ինչ սահմանել են պլագինները և կոճակների դասավորությունը։\n\nX4-ում մերժվում է այն փոփոխությունը, որից հետո չի մնա ընտրելու, հետ գնալու կամ առաջ շարժվելու կոճակ։ Վերջում «Վերակայել կոճակներն ու ժեստերը»-ն հետ է բերում բոլոր փոփոխությունները։"
