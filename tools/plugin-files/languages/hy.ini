tasks.plugin.name = Առաջադրանքներ
tasks.plugin.description = Անելիքների ցանկեր՝ վերջնաժամկետներով և առաջնահերթություններով, սարքում կամ համաժամացված ձեր CalDAV սերվերի հետ, գլխավոր էկրանի վիջեթներով։
tasks.plugin.how = "Անելիքների ցանկեր ձեր սարքում՝ առաջադրանքներ վերջնաժամկետով և առաջնահերթությամբ, որոնք կատարելիս նշում եք։ Դրանք աշխատում են առանց կարգավորման և ցանցի, և կարող են համաժամացվել CalDAV սերվերի հետ (Nextcloud, Radicale, Baïkal, Fastmail և այլն), որպեսզի նույն ցանկերը լինեն ձեր հեռախոսում և համակարգչում։\n\nԲացեք «Առաջադրանքներ»-ը գործիքների ընտրացանկից։ Առաջին տողում ցանկի անունն է՝ ընտրեք այն՝ այլ ցանկի, բոլոր ցանկերի «Այսօր և ժամկետանց» առաջադրանքների, նոր ցանկի, համաժամացման կամ հաշվի կարգավորման համար։ «Ավելացնել առաջադրանք»-ը բացում է ստեղնաշարը։ «Ընտրել»-ն առաջադրանքը նշում է կատարված (կրկին՝ չկատարված)։ Սեղմած պահեք առաջադրանքը կամ սեղմեք «Ընտրացանկ»՝ վերնագիրը, վերջնաժամկետը (այսօր, վաղը, մեկ շաբաթից կամ մուտքագրված ամսաթիվ, օր.՝ 2026-12-24) կամ առաջնահերթությունը փոխելու կամ այն հեռացնելու համար։ Բաց առաջադրանքները առաջինն են՝ ըստ օրվա, ապա առաջնահերթության. կատարվածները մեկ շաբաթ մնում են վերջում (փոխվում է կարգավորումների «Առաջադրանքներ» բաժնում), ապա հեռանում են սարքից։\n\nԳլխավոր էկրանի վիջեթներ (սեղմած պահեք էկրանը և ավելացրեք վիջեթ)՝ «Այսօրվա առաջադրանքներ»՝ այսօրվա և ժամկետանց առաջադրանքները, «Առաջադրանքների ցանկ»՝ մեկ ցանկ, «Բաց առաջադրանքներ»՝ դրանց թիվը, «Հաջորդ առաջադրանք»՝ հաջորդ անելիքը։ Վիջեթում առաջադրանքին հպելը նշում է այն կատարված, վերնագրին հպելը բացում է ցանկերը։\n\nՀամաժամացնելու համար ցանկի տողից ընտրեք «CalDAV հաշիվ» և մուտքագրեք սերվերի հասցեն, օգտանունը և գաղտնաբառը (լավագույնը՝ հավելվածի գաղտնաբառ)։ Բավական է սերվերի հասցեն, օր.՝ cloud.example.com/remote.php/dav. սարքն ինքը կգտնի ձեր առաջադրանքների ցանկերը, և դրանցից յուրաքանչյուրը կդառնա ցանկ սարքում։ Սարքը համաժամացնում է, երբ բացում եք «Առաջադրանքներ»-ը, երբ ընտրում եք «Համաժամացնել հիմա», և երբ ցանցն արդեն միացված է։ Առանց ցանցի արված փոփոխություններն ուղարկվում են ավելի ուշ։ Եթե առաջադրանքը միաժամանակ փոխվել է սարքում և այլ տեղում, վերցվում է սերվերի տարբերակը, իսկ ձերը պահվում է որպես նոր առաջադրանք կողքին՝ ոչինչ չի կորչում։ Նշումները, զարթուցիչները և առաջադրանքի մնացած տվյալները սերվերում մնում են անփոփոխ։ Կրկնվող առաջադրանքները ցուցադրվում են, բայց փոխվում են այնտեղ, որտեղ ստեղծել եք դրանք։ Սարքը պահում է մինչև 200 առաջադրանք 12 ցանկում։"
