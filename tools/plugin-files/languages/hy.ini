anki.help = Սովորեք ձեր համակարգչի Anki-ի քարտերը։ «Համաժամեցնել»-ը բերում է ժամկետը հասած քարտերը և հետ ուղարկում ձեր պատասխանները։ Anki-ն այնտեղ պետք է բաց լինի՝ AnkiConnect հավելումով։ Տե՛ս «Ինչպես է աշխատում»։
