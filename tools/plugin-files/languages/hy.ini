reading-goal.plugin.name = Ընթերցման նպատակ
reading-goal.plugin.description = Օրական ընթերցման րոպեներ և կատու գլխավոր էկրանին, որի տրամադրությունը կախված է այսօրվա ընթերցանությունից։
reading-goal.plugin.how = "Գլխավոր էկրանի կատուն ցույց է տալիս, թե ինչպես է ընթանում այսօրվա ընթերցանությունը՝ տխուր է, քանի դեռ չեք կարդացել, այնպես-այնպես՝ մի քիչ կարդալուց հետո, գոհ՝ օրական նպատակի կեսից սկսած, երջանիկ՝ երբ նպատակին հասել եք։\n\nԳլխավոր էկրանին ավելացրեք «Ընթերցող կատու» վիջեթը (սեղմած պահեք գլխավոր էկրանը, ապա ավելացրեք վիջեթ), կամ որպես քնի էկրան ընտրեք «Այսօրվա ընթերցող կատուն»։ Կատվին հպելը բացում է օրական նպատակը՝ դա ընթերցման վիճակագրության նպատակն է, որը հաշվում է ձեր կարդացած րոպեները։\n\nԿարգավորումներում՝ «Ընթերցում» բաժնում, «Գոհ է՝ սկսած» և «Երջանիկ է՝ սկսած» կարգավորումները որոշում են, նպատակի որ մասից սկսած կատուն գոհ կամ երջանիկ է, իսկ «Սեփական նկարներ»-ը՝ նկարների պանակ (sad, meh, content և happy), որոնք ցուցադրվում են կատուների փոխարեն։ Նկարները PNG կամ JPEG ֆայլեր են, առանց պանակի ցուցադրվում են կատուները։"
