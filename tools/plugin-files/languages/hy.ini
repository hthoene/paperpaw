plugin-manager.plugin.how = "Պլագինների կառավարիչը ցույց է տալիս յուրաքանչյուր պլագին՝ իր տարբերակով և նկարագրությամբ, և միացնում ու անջատում է պլագինները։\n\nԱյն կգտնեք «Կարգավորումներ»-ում՝ «Կառավարել պլագինները» անունով։ «Պլագինների կարգավորումներ»-ն առանձին էջ է այնպիսի նախընտրությունների համար, ինչպիսին է յուրաքանչյուր պլագինի ցանցի օգտագործումը։ Հպեք պլագինին՝ այն միացնելու կամ անջատելու համար (կոճակներով՝ ընտրեք այն)։ Փոփոխությունը կիրառվում է վերագործարկումից հետո. ներքևի գոտին այդ ժամանակ առաջարկում է «Վերագործարկել հիմա»։ Սեղմած պահեք պլագինը (կոճակներով՝ սեղմած պահեք «Ընտրել»)՝ կարդալու, թե ինչպես է այն աշխատում։\n\n«Միշտ միացված» նշված պլագինը հնարավոր չէ անջատել, իսկ «Պարտադիր» նշվածը՝ միայն այն բանից հետո, երբ մեկ այլ պլագին կատարի դրա գործը, այլապես PaperPaw-ը վերադարձի ճանապարհ չէր ունենա։ «Էկրաններ» բաժնում ընտրում եք, թե որ պլագինը ցույց տա այն տեղը, որ մի քանիսն են առաջարկում։"
