diagnostics.plugin.name = Ախտորոշում
diagnostics.plugin.description = Թեստային էկրան և սարքի յուրաքանչյուր մասի ուղղորդվող ստուգում։
diagnostics.plugin.how = "«Ախտորոշում»-ը թեստային էկրան է սարքը ստուգելու համար. այն ցույց է տալիս մոխրագույնի բոլոր մակարդակները, որոնք էկրանը կարող է ցուցադրել, չորս վանդակ՝ կոճակներն ու հպումը փորձելու համար, և էջերի հաշվիչ՝ առաջընթացի գոտիով՝ թարմացման ռեժիմները համեմատելու համար։\n\nԹեստային էկրանն ընտրացանկում տեղ չունի։ Այն գլխավոր էկրան է միայն այնքան ժամանակ, քանի դեռ ոչ մի այլ պլագին գլխավոր էկրան չի առաջարկում, կամ երբ պլագինների կառավարչի «Էկրաններ» բաժնում այն ընտրում եք «Գլխավոր էկրան» տեղի համար։\n\n«Ընտրել»-ը նշում է ընտրված վանդակը, իսկ սլաքների կոճակները տեղափոխում են վանդակների միջև. հպումով՝ հպեք վանդակին։ Էջաշրջման կոճակները թերթում են թեստային էջերը։ Սեղմած պահեք «Ընտրել»-ը կամ մատը պահեք էկրանին՝ սկզբից սկսելու համար։\n\nՍարքի ստուգումը, որը «Գործիքներ»-ում է այնտեղ, որտեղ PaperPaw-ը սարքի որոնվածն է, էջ առ էջ անցնում է սարքի բոլոր մասերով՝ էկրան, կոճակներ, հպում, լուսավորում, մարտկոց, քարտ, ժամացույց, Wi-Fi, քնի ռեժիմ և հիշողություն։ Յուրաքանչյուր էջ ավարտվում է «Ձախողում», «Բաց թողնել» և «Անցավ» կոճակներով, և ընտրված է այն պատասխանը, որ առաջարկում են չափումները. սարքում բացակայող մասերը բաց են թողնվում։ Յուրաքանչյուր պատասխանից հետո այն հաշվետվություն է գրում .paperpaw/plugins/diagnostics/device-check.txt ֆայլում՝ pull request-ում տեղադրելու համար։ «Հետ»-ը դուրս է գալիս, և նորից բացելիս այն շարունակում է այնտեղից, որտեղ կանգնել էր։ Միայն կոճակներով սարքում նախ ընտրեք «Սկսել» կոճակների էջում. մինչ այդ սլաքները, «Ընտրել»-ը և «Հետ»-ն աշխատում են, ինչպես ամեն էջում։"
