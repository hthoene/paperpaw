power.plugin.name = Սնուցում
power.plugin.description = Ընտրում է սնուցման ռեժիմը՝ ձեռքով կամ ըստ մարտկոցի՝ Սովորական, Խնայողական, Անցանց։
power.plugin.how = "«Սնուցում»-ը ընտրում է, թե ինչպես է PaperPaw-ը ծախսում մարտկոցը՝ Սովորական, Խնայողական կամ Անցանց։ Խնայողականը սպասել կարողացող գործերը կատարում է ավելի հարմար պահերին, Անցանցը ռադիոն անջատված է պահում։ Ավտոն ընտրում է ըստ մարտկոցի։\n\nՌեժիմը փոխեք արագ վահանակում, որտեղ «Սնուցում»-ը ռեժիմները ցույց է տալիս կողք կողքի, կամ «Կարգավորումներ»-ի «Սնուցում» բաժնում։ Այնտեղ նաև սահմանում եք այն մակարդակները, որոնցում Ավտոն անցնում է Խնայողականի և Անցանցի, և արդյոք լիցքավորելիս այն մնում է Սովորական։\n\nԿարգավիճակի տողերում «Սնուցման ռեժիմ»-ը ցույց է տալիս տերև՝ խնայողական ռեժիմում, խաչված Wi-Fi՝ անցանց ռեժիմում, և ոչինչ՝ Սովորականում։\n\nՍեղմած պահեք սնուցման կոճակը՝ փոքր ընտրացանկ բացելու համար՝ Քնի ռեժիմ, Անջատել (որտեղ PaperPaw-ը կարող է), Վերագործարկել, իսկ սենսորային սարքերում՝ Կողպել հպումը կամ Ապակողպել հպումը։ Կարճ սեղմումը, ինչպես առաջ, սարքը քնի ռեժիմ է անցկացնում։ «Հետ»-ը փակում է ընտրացանկը։"
