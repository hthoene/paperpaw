file-manager.plugin.name = Ֆայլերի կառավարիչ
file-manager.plugin.description = Սարքի բոլոր պանակներն ու ֆայլերը՝ բացել, վերանվանել, տեղափոխել, պատճենել և ջնջել դրանք։
file-manager.plugin.how = "Ֆայլերի կառավարիչը ցույց է տալիս սարքի հիշողության բոլոր պանակներն ու ֆայլերը, ոչ միայն ձեր գրքերը, և թույլ է տալիս բացել, վերանվանել, տեղափոխել, պատճենել և ջնջել դրանք, ինչպես նաև նոր պանակներ ստեղծել։\n\nԲացեք «Ֆայլեր»-ը «Գործիքներ» ընտրացանկից։ Հպեք պանակին՝ դրա մեջ մտնելու համար. «Հետ»-ը տանում է վերին պանակ։ Հպեք ֆայլին կամ սեղմած պահեք ցանկացած տարր (կոճակներով՝ սեղմած պահեք «Ընտրել»)՝ տեսնելու, թե ինչ կարելի է անել դրա հետ։ «Տեղափոխել»-ն ու «Պատճենել»-ը վերցնում են տարրը. գնացեք այն պանակը, որտեղ այն պետք է լինի, և ներքևի գոտում ընտրեք «Տեղադրել այստեղ»։ Կոճակներով գոտուն հասնելու համար վերջին տարրից սեղմեք «Վար»։\n\nԿետով սկսվող ֆայլերն ու պանակները, օրինակ՝ PaperPaw-ի սեփական տվյալները, թաքցված են։ Դրանք տեսնելու համար կարգավորումներում՝ «Գրադարան» բաժնում, միացրեք «Թաքցված ֆայլեր»-ը։"
