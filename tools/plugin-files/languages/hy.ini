setup.plugin.name = Կարգավորման օգնական
setup.plugin.description = Կարճ ուղեցույց կարևոր կարգավորումներով՝ առաջին մեկնարկին։
setup.plugin.how = "Կարգավորման օգնականը կարճ ուղեցույց է կարևոր կարգավորումներով, որը ցուցադրվում է մեկ անգամ՝ PaperPaw-ի առաջին մեկնարկին։ Յուրաքանչյուր էջ հարցնում է մեկ բան, օրինակ՝ լեզուն, կոճակները, տեքստի չափը, ժամային գոտին, Wi-Fi-ը կամ մի քանի պլագին ավելացնելը, և խելամիտ պատասխանն արդեն ընտրված է, այնպես որ «Հաջորդը» միշտ ճիշտ է։ Այն քայլերը, որոնք այս սարքին պետք չեն, բաց են թողնվում։\n\nՀպեք կոճակներին կամ օգտագործեք վեր և վար կոճակները և «Ընտրել»-ը։ Առաջին էջի «Բաց թողնել»-ը անմիջապես դուրս է գալիս կարգավորումից։ Վերջին էջը պատմում է, թե որտեղից են գալիս ձեր գրքերը։\n\nՆորից գործարկելու համար բացեք կարգավորումները և ընտրեք «Կարգավորել PaperPaw-ը»։ Այստեղ ընտրված ամեն ինչ կարելի է հետո փոխել կարգավորումներում։"
