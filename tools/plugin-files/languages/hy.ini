vocabulary.plugin.name = Բառապաշար
vocabulary.plugin.description = Պահում է ձեր որոնած բառերը՝ իրենց նախադասություններով, և ընդմիջումային կրկնությամբ անցնում հեռախոսում ստեղծված ֆլեշքարտերը։
vocabulary.plugin.how = "«Բառապաշար»-ը պահում է ընթերցելիս ձեր որոնած բառերը՝ յուրաքանչյուրն իր նախադասությամբ, հետո վերանայելու համար։ Ցանկը «Գործիքներ»-ում է, նորերը՝ առաջինը. ընտրեք բառը՝ այն նորից որոնելու համար։ Վերջին տողը՝ «Արտահանել»-ը, պահում է դրանք Anki-ի նման ֆլեշքարտերի հավելվածների համար։ Ցանկը պահում է վերջին 2000 բառը, ավելի հները դուրս են գալիս, ուստի ժամանակին արտահանեք։\n\nՖլեշքարտերը, նույնպես «Գործիքներ»-ում, ստուգում են ձեզ ընդմիջումային կրկնությամբ. «Ցույց տալ պատասխանը»-ից հետո գնահատեք քարտը՝ «Կրկին», «Դժվար», «Լավ» կամ «Հեշտ», և դա որոշում է, թե երբ այն կվերադառնա։ Կապուկներ ստեղծեք «Խմբագրել հեռախոսով»-ով. սկանավորեք կոդը նույն Wi-Fi ցանցի հեռախոսով, ապա մուտքագրեք քարտեր կամ բացեք կապուկը, ընտրեք «Շատ քարտեր միանգամից» և վերցրեք CSV, TSV կամ TXT ֆայլ (UTF-8, ոչ UTF-16, յուրաքանչյուր տողում մեկ քարտ՝ առջևի կողմ, հետևի կողմ, օրինակ), տեղադրեք ցանկ կամ բերեք Anki կապուկ (.apkg, արտահանված «Support older Anki versions» ընտրանքով)։\n\nԿամ օգտագործեք SD քարտը. Flashcards պանակում յուրաքանչյուր կապուկի համար դրեք նույնպիսի ֆայլ կամ .apkg (Իսպաներեն.tsv-ն ստեղծում է «Իսպաներեն» կապուկը. առաջին տողը կարող է անվանել front, back, example սյունակները)։ Ֆլեշքարտերում ընտրեք «Քարտեր SD քարտում», կամ դա կարվի բացելիս։ Նոր կամ փոխված ֆայլը միաձուլվում է իր կապուկին, իսկ ձեր սովորածը մնում է սարքում։ Հետևի կողմը կամ օրինակը փոխելիս քարտը պահպանում է առաջընթացը, առջևի տեքստը փոխելիս այն դառնում է նոր քարտ։ Ջնջված տողը քարտը չի ջնջում, եթե կապուկի համար «Ֆայլից բացակայող քարտերը» չդնեք «Հեռացնել» (այդ դեպքում քարտն իր առաջընթացով ընդմիշտ կհեռացվի հաջորդ թարմացմամբ)։ «Պահել քարտում»-ը պահում է կապուկն իր ֆայլում՝ քարտերի համարներով (id սյունակ), որպեսզի համակարգչում առջևի կողմերը խմբագրելիս սովորածը չկորչի։ Ֆայլում մնում են միայն id, առջևի և հետևի կողմերը և օրինակը. այլ սյունակներն ու մեկնաբանությունները չեն պահվում։ Առաջին պահելիս հին ֆայլը պատճենվում է _անուն.bak.tsv։ Պահելը մերժվում է, եթե ֆայլի որևէ տող չի կարդացվում։ 4 ՄիԲ-ից կամ 20 000 տողից մեծ ֆայլը չի կարդացվում։ Առաջին անգամ սարքը ստեղծում է պանակը՝ աշխատանքի կարգի մասին նշումով։\n\nԿարգավորումներում՝ «Ընթերցում» բաժնում, «Քարտեր որոնված բառերից»-ը յուրաքանչյուր որոնված բառ դնում է «Որոնվածներ» կապուկում։"
