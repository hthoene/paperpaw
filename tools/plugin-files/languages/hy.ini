joplin.notebook = Նոթատետր
joplin.notebook.help = Նոթատետրը, որը PaperPaw-ը ստեղծում է Joplin-ում՝ յուրաքանչյուր գրքի համար մեկ գրառմամբ։ Կրկին արտահանելը թարմացնում է գրառումը, նույնիսկ եթե այն տեղափոխվել է այլ նոթատետր։
