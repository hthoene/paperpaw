vocabulary.sd.outcome.too-large = Այս ֆայլը չափազանց մեծ է՝ առավելագույնը 4 ՄիԲ և 20 000 տող։ Բաժանեք այն մի քանի ֆայլի։
vocabulary.sd.outcome.utf16 = Այս ֆայլը պահված է որպես UTF-16։ Նորից պահեք այն որպես CSV UTF-8 (աղյուսակային ծրագրում՝ CSV UTF-8)։
vocabulary.sd.outcome.no-notes = Նշումներ չգտնվեցին. սա Anki կապուկ չէ, կամ նշումներ չունի։ Արտահանեք այն Anki-ից որպես Anki կապուկի փաթեթ (.apkg)։
vocabulary.sd.outcome.newer-anki = Այս կապուկը Anki-ի ամենանոր ձևաչափով է։ Նորից արտահանեք այն՝ նշելով «Support older Anki versions»-ը։
vocabulary.sd.outcome.deck-too-large = Այս Anki կապուկը չափազանց մեծ է այստեղ կարդալու համար՝ առավելագույնը 4000 ֆայլ, 4 ՄիԲ նշումներ և 20 000 նշում։ Արտահանեք այն առանց մեդիայի և առանց ժամանակացույցի կամ բաժանեք այն։
vocabulary.sd.line = Տող {line}
vocabulary.sd.fault.no-front = Առջևի կողմի սյունակում տեքստ չկա։ Գրեք բառն այնտեղ։
vocabulary.sd.fault.not-utf8 = UTF-8 տեքստ չէ։ Պահեք ֆայլը որպես UTF-8 (աղյուսակային ծրագրում՝ CSV UTF-8)։
