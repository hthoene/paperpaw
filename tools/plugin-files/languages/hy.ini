stats.plugin.how = "Ընթերցման վիճակագրությունը գրանցում է, թե որքան երկար եք կարդում յուրաքանչյուր էջը։ Դուք այն տեսնում եք որպես ամփոփում՝ այսօրվա, շաբաթվա և ձեր անընդմեջ օրերի շարքի հետ, որպես օրացույց և յուրաքանչյուր գրքի թվերով։\n\nԲացեք այն «Գործիքներ»-ից կամ ընթերցման ընթացքում «Ավելին»-ից։ Կարգավորումներում՝ «Ընթերցման վիճակագրություն» բաժնում, կարող եք անջատել «Գրանցել ընթերցումը», սահմանել «Օրական նպատակ», ինչպես նաև «Ամենակարճ էջ» և «Ամենաերկար էջ», որոնք հաշվվում են, որպեսզի թերթելը կամ բաց թողնված գիրքը չաղավաղեն թվերը։\n\n«Համաժամացում KOReader-ի հետ»-ը կիսում է վիճակագրությունը KOReader-ի հետ WebDAV պանակի միջոցով։ Այն նաև վերցնում է նույն սարքի KOReader-ի վիճակագրությունը։ Գրանցման համար ժամացույցը պետք է կարգավորված լինի՝ եթե այն կարգավորված չէ, մեկ անգամ միացեք Wi-Fi-ին։"
