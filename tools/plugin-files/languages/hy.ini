menu-editor.plugin.name = Ընտրացանկերի խմբագրիչ
menu-editor.plugin.description = Վերադասավորում, հեռացնում և ավելացնում է բոլոր ընտրացանկերի կետերը։
menu-editor.plugin.how = "Ընտրացանկերի խմբագրիչը փոխում է ընտրացանկերի բովանդակությունը՝ տեղափոխեք կետերը վեր կամ վար, հեռացրեք դրանք կամ ավելացրեք նորերը։\n\nԱյն կգտնեք կարգավորումներում՝ «Հարմարեցում» բաժնում, որպես «Հարմարեցնել ընտրացանկերը»։ Ընտրեք ընտրացանկը, ապա կետը՝ այն տեղափոխելու կամ հեռացնելու համար։ «Ավելացնել կետ»-ը նորն է ավելացնում։ Փոփոխությունները գործում են անմիջապես։ «Վերակայել այս ընտրացանկը»-ն ընտրացանկը վերադարձնում է այնպիսին, ինչպես սահմանել են նրա պլագինները, «Վերակայել բոլոր ընտրացանկերը»-ն նույնն անում է բոլորի համար։\n\nԴուք չեք կարող ինքներդ ձեզ արգելափակել՝ այն կետը, որը տանում է դեպի կարգավորումներ, մնում է, մինչև դրանց տանող մեկ այլ ճանապարհ չավելացնեք։"
