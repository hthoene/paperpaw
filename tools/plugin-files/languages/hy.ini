pomodoro.plugin.name = Պոմոդորո
pomodoro.plugin.description = Կենտրոնացման ժամաչափ՝ աշխատանքի և ընդմիջման փուլերով, վիջեթներով և օրական հաշվարկով։
pomodoro.plugin.how = "Պոմոդորո ժամաչափ՝ աշխատեք կենտրոնացված փուլերով, ապա հանգստացեք։ Կարգավորում պետք չէ՝ 25 րոպե կենտրոնացում, 5 րոպե հանգիստ, իսկ չորս փուլից հետո՝ 15 րոպե երկար ընդմիջում։\n\nԲացեք «Պոմոդորո»-ն «Գործիքներ» ընտրացանկից և սեղմեք «Սկսել», կամ ավելացրեք դրա վիջեթները գլխավոր էկրանին (սեղմած պահեք գլխավոր էկրանը, ապա ավելացրեք վիջեթ)՝ «Պոմոդորո ժամաչափ»-ը ցույց է տալիս փուլը և մնացած րոպեները, «Պոմոդորո՝ սկսել/դադար»-ը կոճակ է, իսկ «Պոմոդորո այսօր»-ը հաշվում է ձեր ավարտած փուլերը՝ ձեր օրական նպատակով։ Ժամաչափին հպելը սկսում է կամ դադարեցնում այն. սեղմած պահեք այն՝ լիաէկրան տեսքը բացելու համար։\n\nԺամաչափը շարունակում է աշխատել, երբ դուրս եք գալիս էկրանից, և վերագործարկումից հետո շարունակում է ըստ ժամացույցի։ Երբ սարքը քնի ռեժիմում է, ոչինչ չի աշխատում. այդ ընթացքում ավարտված փուլի մասին հայտնվում է արթնանալիս։ Ծանուցումը տեղեկացնում է, երբ փուլն ավարտվում է։ Մարտկոցը խնայելու համար ժամացույցը թարմացվում է րոպեն մեկ (լիաէկրան տեսքում վերջին րոպեին՝ ամեն տասը վայրկյանը մեկ) և երբեք սարքը արթուն չի պահում։\n\nԿարգավորումների «Պոմոդորո» բաժնում սահմանում եք տևողությունները և մեկ շարքի փուլերը, ինչպես նաև՝ արդյոք հաջորդ փուլն ինքնուրույն սկսվի։ «Ավելին» բաժնում՝ էկրանի թարթում կամ առջևի լույսի թարթում փուլի ավարտին և օրական նպատակ։"
