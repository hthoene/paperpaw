notes-overview.plugin.how = "«Բոլոր նշումները» պլագինը ցույց է տալիս բոլոր գրքերը, որոնցում էջանիշ կամ ընդգծում եք արել, և դրանց քանակը։ Բացեք այն «Գործիքներ» ընտրացանկում։ Ընտրեք գիրքը՝ դրա նշումները տեսնելու համար, և նշումը՝ գիրքն այդ տեղում բացելու համար։\n\nՑանկի վերջում «Արտահանել որպես My Clippings.txt» կետը բոլոր նշումները գրում է մեկ ֆայլում՝ գրադարանի կողքին գտնվող Exports պանակում, այն ձևաչափով, որն օգտագործում է Kindle-ը (UTF-8)։ Kindle-ի My Clippings.txt ֆայլը կարդացող հավելվածները կարող են կարդալ այն։ Ընդգծման վրա արված նշումն առանձին գրառում է, ինչպես Kindle-ում։ Քանի որ այստեղ գիրքը Kindle-ի դիրքեր չունի, «location»-ը ցույց է տալիս, թե գրքի որ մասում է նշումը՝ տոկոսներով։ Ֆայլն ամեն անգամ նորից է գրվում և փոխարինում նախորդին։"
