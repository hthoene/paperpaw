opds.plugin.name = OPDS կատալոգներ
opds.plugin.description = Դիտում է OPDS կատալոգները, ներբեռնում դրանց գրքերը և պանակները համաժամացնում դրանց հետ։
opds.plugin.how = "OPDS կատալոգներն առցանց գրադարաններ են, ինչպիսիք են Project Gutenberg-ը, Calibre-Web-ը, Kavita-ն կամ Komga-ն։ Այս պլագինը դիտում և որոնում է դրանցում պանակների պես և ներբեռնում դրանց գրքերը գրադարան։\n\nԲացեք «Կատալոգներ» բաժինը «Գործիքներ» ընտրացանկից և ընտրեք «Ավելացնել կատալոգ»՝ հասցե և, եթե կատալոգը հաշիվ է պահանջում, օգտանուն և գաղտնաբառ։ Հպեք կատալոգին՝ այն դիտելու համար. սեղմած պահեք այն (կոճակներով՝ սեղմած պահեք «Ընտրել»)՝ համաժամացնելու, խմբագրելու կամ հեռացնելու համար։\n\nԵրբ «Համաժամացնել այս կատալոգը» միացված է, «Համաժամացնել կատալոգները» կետը ներբեռնում է դրա նոր գրքերը դրա պանակ։ «Գրքեր մեկ համաժամացմամբ» կարգավորումը սահմանափակում է, թե քանի գիրք է բերում մեկ համաժամացումը, որպեսզի մեծ կատալոգը չլցնի սարքը։ Կատալոգի փոխարեն կարող է աշխատել նաև ամպային պանակ (WebDAV)։"
