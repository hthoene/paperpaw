joplin.bad-login = Joplin-ը չընդունեց էլ. փոստը, օգտանունը կամ գաղտնաբառը։ Ստուգեք դրանք Joplin-ի կարգավորումներում։
joplin.no-server = Այս հասցեում Joplin Server չկա։ Ստուգեք այն Joplin-ի կարգավորումներում։
joplin.bad-address = PaperPaw-ը չի կարող օգտագործել այս հասցեն։ Ստուգեք այն Joplin-ի կարգավորումներում։
joplin.no-data = Այս հասցեում Joplin-ի գրառումներ չկան։ Ստուգեք այն կամ նախ համաժամեցրեք Joplin-ը դրա հետ։
joplin.encrypted = Joplin-ի ծայրից ծայր գաղտնագրումը միացված է։ PaperPaw-ը չի կարող գաղտնագրել նշումները, ուստի ոչինչ չի ուղարկում։
joplin.newer-target = Joplin-ն այնտեղ գրառումները պահում է ավելի նոր ձևաչափով, քան գիտի PaperPaw-ի այս տարբերակը։ Թարմացրեք PaperPaw-ը՝ դրանք ուղարկելու համար։
joplin.older-target = Joplin-ն այնտեղ գրառումները պահում է ավելի հին ձևաչափով։ Բացեք Joplin-ը՝ այն թարմացնելու համար, ապա նորից ուղարկեք։
joplin.upgrading = Joplin-ը հենց հիմա թարմացնում է այնտեղի գրառումները։ Նշումները կսպասեն և կուղարկվեն ավելի ուշ։
joplin.no-memory = Նշումներն ուղարկելու համար բավարար հիշողություն չկա։ Վերագործարկեք և նորից փորձեք։
keyboard.plugin.name = Ստեղնաշար
keyboard.plugin.description = Տեքստի մուտքագրում էկրանին՝ հպումով կամ կոճակներով։
keyboard.plugin.how = "Ստեղնաշարը բացվում է, երբ որևէ բանի համար տեքստ է պետք՝ որոնում, գաղտնաբառ, նշում կամ կարգավորում։ Այն աշխատում է հպումով և միայն կոճակներով։\n\nԿոճակներով ձախն ու աջը շարժվում են տողի երկայնքով, էջաշրջման կոճակները՝ տողերի միջև, «Ընտրել»-ը սեղմում է ստեղնը, իսկ «Հետ»-ը չեղարկում է։ Ձախն ու աջը պտտվում են տողի շուրջ, իսկ վերն ու վարը մնում են ձեր սյունակում։ Shift-ը հաջորդ տառը դարձնում է մեծատառ։ Սեղմեք երկու անգամ՝ բոլորը մեծատառ դարձնելու համար, և ևս մեկ անգամ՝ դադարեցնելու համար։ Սեղմած պահեք տառը (կոճակներով՝ սեղմած պահեք «Ընտրել»-ը նրա վրա)՝ նրա մեծատառը, որն ընտրվում է անմիջապես, և այնպիսի նշանավոր տառեր, ինչպիսիք են é և è։ Գերմաներենում ä, ö, ü և ß ստացվում են այդպես a, o, u և s տառերից (կոճակներով ստեղնաշարն այդ մասին նշում է այդ տառերի վրա)։ «Եղավ»-ն ավարտում է։ Կոճակներով սեղմած պահեք «Հետ»-ը՝ ցանկացած տեղից ավարտելու համար (միայն «Հետ»-ը չեղարկում է), կամ սեղմած պահեք «Ընտրել»-ը տառ չհանդիսացող ստեղնի վրա։ «Տեղադրել»-ը տեղադրում է սեղմատախտակի տեքստը, իսկ «Հեռախոս»-ը, որտեղ առաջարկվում է, թույլ է տալիս փոխարենը գրել ձեր հեռախոսով։\n\nԿարգավորումներում՝ «Սարք», «Ստեղնաշար»՝ «Ստեղնաշարի դասավորություններ»-ն ընտրում է դասավորությունները։ Լռելյայն այն հետևում է ընտրացանկի լեզվին։ Մի քանիսի դեպքում ստեղնը փոխարկում է դրանց միջև։ «Ումլաուտի ստեղներ»-ը ä, ö, ü և ß տառերի համար առանձին ստեղներ է տալիս։ «Չափ»-ը մեծացնում է ստեղներն ու տառերը։ Միայն կոճակներով տողերը մնում են համակարգչի ստեղնաշարի տողերը։ Սենսորային էկրաններում «Ստեղների ձև»-ը փոխում է ստեղների տեսքը։ «Ավտոմատ մեծատառեր»-ը յուրաքանչյուր նախադասություն սկսում է մեծատառով։"
