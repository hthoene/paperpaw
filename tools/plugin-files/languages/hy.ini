sleep.plugin.name = Քնի էկրան
sleep.plugin.description = Քնած կատու, գրքի շապիկ, ձեր նկարները կամ հաղորդագրություն, մինչ սարքը քնի ռեժիմում է։
sleep.plugin.how = "Քնի էկրանը որոշում է, թե ինչ է ցույց տալիս էկրանը, մինչ սարքը քնի ռեժիմում է։ E-ink էկրանը պահում է պատկերն առանց հոսանքի։\n\nԸնտրեք այն կարգավորումներում՝ «Սարք», «Քնի էկրան», «Ցուցադրել» կետով՝ քնած կատու (կանխադրված), գրքի շապիկ, իմ նկարները, լոգոն և «Քնած է», վիջեթներ, էջը՝ ինչպես կա, կամ էջը՝ նկարով։ «Իմ նկարները» ցույց է տալիս «Նկարներ» պանակի ֆայլերը մեկը մյուսի հետևից։\n\nԱռանց շապիկի կամ նկարի ցուցադրվում է կատուն։ Որտեղ համակարգն ինքն է նկարում քնի էկրանը, այս կարգավորումները թաքցված են։\n\nԱնջատման էկրանը՝ «Ցուցադրել անջատելիս», նկարվում է մեկ անգամ, երբ սարքն անջատվում է սնուցման ընտրացանկից կամ «Անջատել քնից հետո»-ի ժամանակից հետո (ոչ այն դեպքում, երբ մարտկոցի ցածր լիցքն է անջատում հոսանքը)։ Այն նույնն է, ինչ քնի էկրանը, եթե չընտրեք լոգոն և «Անջատված է», կատուն, շապիկը կամ իմ նկարները։ Մեկ այլ պլագին կարող է դրա համար էկրան առաջարկել։\n\nՄեկնարկի և վերագործարկման էկրանները՝ «Ցուցադրել մեկնարկելիս» և «Ցուցադրել վերագործարկելիս», սարքի սեփականն են, եթե մեկ այլ պլագին դրանց համար էկրան չի առաջարկում։ Մինչ սարքը մեկնարկում է, պլագինները դեռ չեն աշխատում՝ մեկնարկի համար ընտրված էկրանը նկարվում է նախապես, երբ սարքն անջատվում կամ վերագործարկվում է, և ցուցադրվում է հաջորդ մեկնարկին։ Ժամանակին պատրաստ չեղած էկրանը կամ վնասված նկարը զիջում է սարքի սեփականին, սարքը ամեն դեպքում անջատվում կամ վերագործարկվում է։"
