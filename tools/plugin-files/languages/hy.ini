reader.plugin.name = Ընթերցիչ
reader.plugin.description = Ցույց է տալիս գրքերը էջ առ էջ՝ բովանդակությամբ և ընթերցման կարգավորումներով։
reader.plugin.how = "Ընթերցիչը ցույց է տալիս գրքերը էջ առ էջ։ Բացեք գիրքը գրադարանից. վերջին գիրքը կարող է բացվել մեկնարկի ժամանակ («Մեկնարկին բացել վերջին գիրքը» կարգավորումը)։\n\nԷջ թերթելու համար հպեք էկրանի ձախ կամ աջ մասին կամ օգտագործեք էջաշրջման կոճակները։ Հպեք մեջտեղին կամ սեղմեք «Ընտրել»՝ ընթերցման ընտրացանկի համար՝ Բովանդակություն, Որոնում, Անցնել էջին, Տառատեսակ և դասավորություն, Էջանիշեր և ընդգծումներ և այլն։ Վերին եզրից ներքև սահեցնելը բացում է արագ վահանակը, ներքևի եզրից վերև սահեցնելը՝ գլխավոր էկրանը. նույնն է անում «Հետ»-ը սեղմած պահելը։\n\nՍեղմած պահեք «Ընտրել»-ը (կամ սեղմած պահեք նկարը)՝ նկարը լիաէկրան տեսնելու համար՝ Ձախ և Աջ կոճակներն անցնում են էջի նկարներով։ «Ընտրել»-ը մեծացնում է 2x, 3x և հետ (սենսորային էկրանին՝ կրկնակի հպում). մեծացված վիճակում Ձախ և Աջ կոճակները տեղաշարժում են կողքի, էջաշրջման կոճակները (կամ սահեցումները)՝ առաջ ու ներքև։ «Հետ»-ը վերադարձնում է էկրանին տեղավորված տեսքին, ապա էջին (սենսորային էկրանին դուրս գալու համար սեղմած պահեք)։ Էջանիշի համար հպեք վերին աջ անկյանը։ Բառն ընդգծելու համար սեղմած պահեք այն։ Կոճակներով սեղմած պահեք Ձախը՝ Ձախ և Աջ կոճակները տեղաշարժում են բառ առ բառ, էջաշրջման կոճակները՝ տող առ տող, դրանք սեղմած պահելը տանում է էջի ծայրերը և պարբերություն առ պարբերություն. «Ընտրել»-ը բացում է բառի ընդգծման գոտին, «Ընտրել»-ը սեղմած պահելը ընդլայնում է այն մինչև նախադասություն և պարբերություն (այդ ժամանակ Ձախ և Աջ կոճակները տեղաշարժում են վերջը, դրանք սեղմած պահելը՝ սկիզբը)։ Ընտրությունը շարունակվում է էջաշրջումների ընթացքում։ «Արտահանել որպես Markdown»-ը պահում է ձեր նշումները։"
