widgets.plugin.name = Վիջեթների փաթեթ
widgets.plugin.description = Շատ այլ վիջեթներ գլխավոր էկրանի համար՝ ժամացույցներ, օրացույց, մեջբերումներ, գրքեր, նշումներ և այլն։
widgets.plugin.how = "Վիջեթների փաթեթը գլխավոր էկրանին ավելացնում է բազմաթիվ վիջեթներ՝ ժամացույցներ (սլաքավոր, բառերով, սալիկներով, համաշխարհային), օրացույց, տարվա անցած մասը, հետհաշվարկ, լուսնի փուլը, օրն ու ամսաթիվը. օրվա մեջբերում, նշումներ, անելիքներ, նկարներ, ողջույն և PaperPaw-ի լոգոն. իսկ գրքերի համար՝ ընթերցվողը, առաջընթացը, հաջորդը, շարքը, ընտրյալները, ընդգծում և գրադարանը թվերով։ Կա նաև մարտկոցի վիջեթ։\n\nԱվելացրեք դրանք ընտրացանկի «Խմբագրել գլխավոր էկրանը»-ով (կամ գլխավոր էկրանը սեղմած պահելով), ապա՝ «Ավելացնել վիջեթ»։ Յուրաքանչյուրն ունի իր կարգավորումները, օրինակ՝ շրջանակ, չափ և հավասարեցում։ Փոփոխվող վիջեթն ընտրելիս, օրինակ՝ օրվա մեջբերումը, ցույց է տրվում հաջորդը։ Ձեր սեփական մեջբերումները դրեք քարտի .paperpaw/plugins/widgets պանակի quotes.txt ֆայլում՝ յուրաքանչյուր տողում տեքստ | հեղինակ։ Ժամանակի վիջեթների համար ժամացույցը պետք է սահմանված լինի. Wi-Fi-ը սահմանում է այն։"
