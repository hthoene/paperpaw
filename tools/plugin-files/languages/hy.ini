format-docx.plugin.name = DOCX փաստաթղթեր
format-docx.plugin.description = Բացում է .docx ֆայլեր, ինչպես պահում են Word-ը և այլ ծրագրեր։
format-docx.plugin.how = "Բացում է .docx փաստաթղթերը որպես գրքեր՝ վերնագրեր՝ բովանդակությամբ, ցանկեր, աղյուսակներ, թավ և շեղ տառեր, հղումներ և նկարներ (JPEG, PNG, GIF)։\n\nԴրեք ֆայլերը գրադարանի պանակում և բացեք գրադարանից։ Վերնագիրն ու հեղինակը վերցվում են փաստաթղթի հատկություններից։ Ծանոթագրությունները, էջագլուխներն ու էջատակերը և մեկնաբանությունները չեն ցուցադրվում։"
format-docx.title = DOCX փաստաթուղթ
format-epub.plugin.name = EPUB
format-epub.plugin.description = Բացում է EPUB գրքերը՝ իրենց ոճերով, բովանդակությամբ և պատկերներով։
format-epub.plugin.how = "EPUB գրքերը բացվում են գրադարանից ինչպես ցանկացած այլ գիրք՝ իրենց բովանդակությամբ, պատկերներով և հրատարակչի ձևավորմամբ։ Վեբ էջերը (HTML), Markdown-ը, FictionBook-ը (.fb2) և կոմիքսների արխիվները (.cbz) բացվում են նույն կերպ՝ յուրաքանչյուրը որպես առանձին պլագին։\n\nԳլուխը փոխարկվում է առաջին անգամ բացելիս և պահվում պլագինի քեշում, այնպես որ հետո ավելի արագ է բացվում, և մեծ գրքերն աշխատում են նաև փոքր սարքերում։ Բովանդակությունը գտեք ընթերցման ընտրացանկում՝ «Բովանդակություն» կետում։ Արդյոք գրքի սեփական ձևավորումը կիրառվում է, որոշում է «Հրատարակչի ձևավորում» կարգավորումը՝ «Ընթերցում» բաժնում։"
format-epub.title = EPUB էլեկտրոնային գիրք
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Բացում է FictionBook գրքեր (.fb2, նաև սեղմված)։
format-fb2.plugin.how = "Բացում է FictionBook գրքեր (.fb2), որոնք տարածված են ռուսերեն և այլ գրքերի համար, նաև սեղմված (.fb2.zip)՝ իրենց վերնագրով, հեղինակներով, շապիկով և գլուխներով։\n\nԴրեք դրանք գրադարանի պանակում. դրանք երևում են գրադարանում և բացվում ինչպես ցանկացած այլ գիրք։"
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Բացում է ֆայլերով պահված վեբ էջեր՝ ցույց տալով միայն կարդալու բանը։
format-html.plugin.how = "Բացում է ֆայլերով պահված վեբ էջերը (.html, .htm, .xhtml) որպես գրքեր՝ միայն այն, ինչ կարդալու է, առանց շրջապատող ընտրացանկերի, գովազդի և նմանատիպ բաների։\n\nԴրեք ֆայլը գրադարանի պանակում և բացեք այն գրադարանից ինչպես ցանկացած գիրք։ Էջի ներսի հղումներն աշխատում են. նկարները ցուցադրվում են այնտեղ, որտեղ դրանք ֆայլում են։"
format-html.title = Վեբ էջ (HTML)
format-images.plugin.name = Նկարներ
format-images.plugin.description = Բացում է նկարներ (.jpg, .png, .gif) որպես գրքեր՝ յուրաքանչյուրը մեկ էջում։
format-images.plugin.how = "Նկարները (.jpg, .png, .gif) բացվում են գրադարանից ինչպես գրքեր՝ մեկ նկար մեկ էջում, էկրանին հարմարեցված։\n\nՆկարների ամբողջ պանակը կարդալու համար բացեք դրա առաջին նկարը՝ պանակում դրան հաջորդող նկարները հետևում են ըստ անունների հերթականության (2-ը՝ 10-ից առաջ)։ Պանակում ավելի հետո եկող նկարից սկսելիս դիտումը սկսվում է այնտեղից. յուրաքանչյուրում դիրքը հիշվում է առանձին։ Մինչև 300 նկարով պանակը կարդացվում է այն նկարից, որը բացում եք։\n\nԱյն ֆայլը, որը նկար չէ կամ չափազանց մեծ է, փոխարենը ցույց է տալիս իր անունը։ Իր սեփական վերնագրով շատ նկարներից բաղկացած գրքի համար ավելի լավ ձև է կոմիքսների արխիվը (.cbz)։"
format-images.title = Նկար
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Բացում է Markdown ֆայլեր (.md), օր.՝ նշումներ։
format-markdown.plugin.how = "Բացում է Markdown ֆայլերը (.md), օրինակ՝ նշումները, որպես գրքեր՝ վերնագրեր, ցանկեր, մեջբերումներ և շեշտադրումներ՝ ինչպես նախատեսված են, ոչ թե որպես նշաններ։\n\nԴրեք ֆայլերը գրադարանի պանակում և բացեք դրանք գրադարանից։ Առաջին վերնագիրը դրա վերնագիրն է. ֆայլի կողքին դրված նկարները ցուցադրվում են այնտեղ, որտեղ տեքստը նշում է դրանք։"
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI գրքեր
format-mobi.plugin.description = Բացում է .mobi և .azw ֆայլեր առանց DRM-ի։
format-mobi.plugin.how = "MOBI գրքերը (.mobi, .azw) բացվում են գրադարանից ինչպես ցանկացած գիրք՝ առանց որևէ կարգավորման։ Վերնագիրը, հեղինակները, լեզուն և շապիկը վերցվում են գրքից, իսկ բովանդակությունը կազմվում է նրա վերնագրերից։\n\nԳիրքը փոխարկվում է առաջին անգամ բացելիս, ինչը երկար գրքի դեպքում տևում է մի քանի վայրկյան, այնուհետև այն բացվում է անմիջապես։ Ցուցադրվում են տեքստը, վերնագրերը, թավ և շեղ տառերը, հղումներն ու նկարները։\n\nDRM-ով գրքերը (խանութից գնված գրքերի մեծ մասը) հնարավոր չէ բացել, ինչպես նաև Huffman սեղմումով կամ ավելի նոր KF8 ձևաչափով (.azw3) գրքերը։ PaperPaw-ը այդ մասին հայտնում է բացելիս։ EPUB պատճենը, որը ստեղծված է, օրինակ, Calibre-ով, միշտ բացվում է։"
format-mobi.title = MOBI գրքեր
format-rtf.plugin.name = RTF փաստաթղթեր
format-rtf.plugin.description = Բացում է .rtf ֆայլերը որպես գրքեր։
format-rtf.title = RTF փաստաթղթեր
format-txt.plugin.name = Պարզ տեքստ
format-txt.plugin.description = Բացում է պարզ տեքստային ֆայլեր (.txt)։
format-txt.plugin.how = "Պարզ տեքստային ֆայլերը (.txt) բացվում են գրադարանից ինչպես ցանկացած գիրք՝ առանց որևէ կարգավորման։ Պլագինը կարդում է UTF-8, UTF-16 և Windows-1252 տեքստ և ինքն է որոշում կոդավորումը։\n\nՊարբերությունները բաժանվում են ֆայլի դատարկ տողերով, իսկ եթե դրանք չկան, յուրաքանչյուր տող առանձին պարբերություն է։ Project Gutenberg-ի ֆայլերում սկզբի և վերջի լիցենզիայի տեքստը բաց է թողնվում, իսկ վերնագիրն ու հեղինակը վերցվում են գլխամասից։\n\nՖայլը երբեք ամբողջությամբ չի բեռնվում, ուստի շատ մեծ տեքստերը բացվում են նաև փոքր սարքերում։"
format-txt.title = Պարզ տեքստ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Բացում է XTC և XTCH գրքեր՝ Xteink ընթերցիչների նախապես պատրաստված էջերը։
format-xtc.plugin.how = "XTC և XTCH ֆայլերը գրքեր են, որոնց էջերն արդեն պատրաստված են որպես նկարներ։ Դրանք ստեղծում են Xteink ընթերցիչների համար նախատեսված փոխարկիչները։ Դրանք բացվում են գրադարանից ինչպես ցանկացած գիրք։\n\nՔանի որ յուրաքանչյուր էջ անփոփոխ նկար է, տեքստի չափը հնարավոր չէ փոխել կամ այլ տառատեսակ ընտրել։ Էջերը սև-սպիտակ են կամ ունեն մոխրագույնի չորս երանգ։ Յուրաքանչյուր էջ վերծանվում է ցուցադրվելիս, ուստի քիչ հիշողություն է պետք, նաև X4-ում։\n\nՎերնագիրը, հեղինակը և գլուխները վերցվում են ֆայլից, եթե այնտեղ կան։"
format-xtc.title = XTC էջեր
help.plugin.name = Հուշումներ
help.plugin.description = Ցույց է տալիս, թե ինչ են անում էկրանի կառավարման տարրերը, երբ այն առաջին անգամ է բացվում։
help.plugin.how = "Երբ էկրանն առաջին անգամ է բացվում, նրա վրա կարճ նշում է հայտնվում, թե ինչ են անում կառավարման տարրերը՝ էկրանի այն մասերը, որոնց կարելի է հպել (շրջանակված), և ինչ են անում կոճակները։\n\nՀպումը կամ ցանկացած կոճակ փակում է նշումը, և այդ էկրանի համար այն այլևս չի հայտնվում։ «Այլևս հուշումներ չցուցադրել»-ն անջատում է բոլորը։\n\nԿարգավորումներում՝ «Համակարգ» բաժնում, «Հուշումներ»-ը միացնում կամ անջատում է դրանք, իսկ «Նորից ցույց տալ հուշումները»-ն ևս մեկ անգամ ցույց է տալիս յուրաքանչյուր էկրանի նշումը։"
help.title = Ինչպես է սա աշխատում
help.got-it = Հասկանալի է
help.no-more = Այլևս հուշումներ չցուցադրել
help.section = Հուշումներ
help.setting.show = Հուշումներ
help.setting.show.help = Երբ էկրանն առաջին անգամ է բացվում, կարճ նշումը բացատրում է նրա կառավարման տարրերը։
help.setting.again = Նորից ցույց տալ հուշումները
help.setting.again.help = Յուրաքանչյուր էկրանի հուշումները կցուցադրվեն ևս մեկ անգամ, հաջորդ բացելիս։
help.again-done = Հուշումները նորից կցուցադրվեն յուրաքանչյուր էկրանի հաջորդ բացելիս։
home.plugin.name = Գլխավոր էկրան
home.plugin.description = Մեկնարկային էջը՝ վիջեթների էջեր, օրինակ՝ ընթերցվող գիրքը և գործիքները։
home.plugin.how = "Գլխավոր էկրանը կազմված է էջերից, որոնցից յուրաքանչյուրը վիջեթների և գործիքների ցանց է, ինչպես հեռախոսում։ Սկզբում ժամացույցը, ընթերցվող գիրքը և վերջերս կարդացված գրքերը մեկ էջում են, իսկ բոլոր գործիքները՝ հաջորդում։\n\nՀպեք տարրին՝ այն բացելու համար, և սահեցրեք կամ օգտագործեք էջաշրջման կոճակները՝ էջը փոխելու համար։ Միայն կոճակներով սլաքային կոճակները տեղափոխում են մի տարրից մյուսը, իսկ «Ընտրել»-ը բացում է այն։\n\nՎերադասավորելու համար սեղմած պահեք գլխավոր էկրանը, հպեք էջի տակի մատիտին կամ ընտրացանկում ընտրեք «Խմբագրել գլխավոր էկրանը»։ Քաշեք տարրերը՝ տեղափոխելու համար, կամ հպեք մեկին՝ նրա ընտրանքների համար, նաև կոճակներով։ Այնտեղ է նաև «Ավելացնել վիջեթ»-ը։ «Սյունակներ»-ը և «Տողեր»-ը կարգավորումներում են՝ «Արտաքին տեսք» բաժնի «Գլխավոր էկրան» հատվածում։\n\nԿողքի շրջված էկրանին գլխավոր էկրանը ցույց է տալիս նույն տարրերը ավելի շատ սյունակներով, յուրաքանչյուր էջը լցվում է մինչև հաջորդը, և քարտերը մոտ 110 մմ-ից լայն չեն։ Ուղղահայաց դասավորածը չի փոխվում։ Եթե դասավորեք այն կողքի վրա, այդ դասավորությունը կպահվի առանձին այդ դիրքի համար։ Նոր վիջեթներն ավելացվում են երկուսին էլ։ «Ավելացնել»-ի (խմբագրելիս) «Վերակայել հորիզոնական դասավորությունը»-ն վերադարձնում է ստացված դասավորությունը։ Մի դիրքում վիջեթը կամ գործիքը հեռացնելը այն չի հեռացնում մյուսից։"
