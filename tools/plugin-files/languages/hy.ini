transfer.plugin.description = Տեղադրեք գրքեր և այլ ֆայլեր սարքում նույն ցանցի դիտարկիչից։
transfer.plugin.how = "«Wi-Fi փոխանցում»-ը գրքեր և այլ ֆայլեր է տեղադրում սարքում նույն ցանցի դիտարկիչից՝ առանց մալուխի կամ հավելվածի։ Կարող եք նաև ֆայլեր վերցնել, պանակներ ստեղծել և ջնջել։\n\nԲացեք այն «Գործիքներ»-ից։ Էկրանը ցույց է տալիս հասցե՝ որպես տեքստ և որպես QR կոդ։ Բացեք այն հեռախոսի կամ համակարգչի դիտարկիչում կամ սկանավորեք կոդը։ Հասցեն պարունակում է ամեն անգամ նոր ստեղծվող բանալի, որպեսզի ցանցի մյուս օգտատերերը չկարողանան մուտք գործել ձեր ֆայլերին։ Փոխանցումն աշխատում է, քանի դեռ էկրանը բաց է։\n\nՈրտեղ PaperPaw-ն ինքն է կառավարում Wi-Fi-ը, ինչպես X4-ում, ներքևի «Առանց երթուղիչի» կոճակը բացում է սարքի սեփական ցանցը, որին հեռախոսը միանում է կոդը սկանավորելով։"
