rules.plugin.how = "Կանոնը ինքնուրույն ինչ-որ բան է անում, երբ ինչ-որ բան տեղի է ունենում՝ գիշերային ռեժիմը միանում է ամեն օր 22:00-ին, կամ կատալոգները համաժամացվում են PaperPaw-ի մեկնարկին։\n\nԿանոնները Կարգավորումներում են՝ «Հարմարեցում» բաժնում, «Կանոններ» անունով։ «Ավելացնել կանոն»-ը հարցնում է «Ե՞րբ» (PaperPaw-ի մեկնարկ, օրվա ժամ, գրքի բացում կամ փակում, մարտկոց, լիցքավորում, փոխարկիչ և այլն) և «Ի՞նչ անել» (կատարել գործողություն, միացնել կամ անջատել փոխարկիչ, սահմանել թիվ, ցույց տալ հաղորդագրություն)։ Հպեք կանոնին՝ այն դադարեցնելու համար, սեղմած պահեք այն (կոճակներով՝ սեղմած պահեք «Ընտրել»-ը)՝ «Օրվա երկու ժամի միջև» նման պայմանի կամ հեռացնելու համար։\n\nԸնտրելու գործողությունները, փոխարկիչներն ու թվերը դասավորված են ըստ պլագինների՝ ընտրեք պլագինը, ապա այն, ինչ այն բերում է, «Հետ»-ը դուրս է բերում։ Ցուցադրված էկրանի վրա աշխատող գործողությունը, օրինակ՝ «Հետ» կամ «Հաջորդ էջ», անում է այն, ինչ կաներ այնտեղ սեղմելիս։\n\nԺամերը գործում են՝ ինչ էկրան էլ բաց լինի։ Իրար անընդհատ չեղարկող երկու կանոններ կանգ են առնում մի քանի քայլից հետո։"
