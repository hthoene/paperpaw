read-later-cloud.help = Մուտքագրեք ձեր մուտքի տոկենը (readwise.io/access_token)։ Հոդվածները գալիս են «Reader» պանակ որպես գրքեր՝ առանց նկարների. մինչև վերջ կարդացվածները արխիվացվում են հաջորդ ստացման ժամանակ։
