puzzles.plugin.description = Սուդոկու, խաչբառեր և շախմատային խնդիրներ՝ անցանց, օրվա գլուխկոտրուկով։
puzzles.plugin.how = "Գլուխկոտրուկներ գնացքի և սպասասրահի համար, ամբողջովին անցանց՝ սուդոկու, խաչբառեր և շախմատային խնդիրներ։ Բացեք «Գլուխկոտրուկներ»-ը «Գործիքներ» ընտրացանկից կամ ավելացրեք «Օրվա գլուխկոտրուկ» վիջեթը գլխավոր էկրանին (սեղմած պահեք գլխավոր էկրանը, ապա ավելացրեք վիջեթ)՝ այն ցույց է տալիս, թե որքան է առաջ գնացել այսօրվա սուդոկուն, և հպումը բացում է այն։ Օրվա սուդոկուն ամբողջ օրը նույնն է։\n\nՍուդոկու՝ ձախ և աջ կոճակները կուրսորը տեղափոխում են վանդակ առ վանդակ, վեր և վար (էջաշրջման կոճակները)՝ մեկ տողով։ «Ընտրել»-ը բացում է թվանշանները՝ ընտրեք մեկը և նորից սեղմեք «Ընտրել»՝ այն դնելու համար, կամ «Մաքրել»՝ վանդակը դատարկելու համար։ Սեղմած պահեք «Ընտրել»-ը (կամ «Ընտրացանկ»-ը)՝ տախտակի տակի կոճակներին անցնելու համար՝ «Նշումներ»-ը թվանշանները դարձնում է մատիտով նշումներ, «Ստուգել»-ը նշում է սխալ վանդակները, «Հետարկել»-ը չեղարկում է վերջին քայլը, «Նոր»-ը սկսում է ձեր ընտրած մակարդակի գլուխկոտրուկ (Հեշտ, Միջին, Դժվար)։ Յուրաքանչյուր գլուխկոտրուկ ունի ճիշտ մեկ լուծում։ Խաղը պահվում է, երբ դուրս եք գալիս։ Սենսորային էկրանին հպեք վանդակին։\n\nԽաչբառեր՝ տեղադրեք .puz (Across Lite) կամ .ipuz ֆայլեր հիշողության քարտի «puzzles» պանակում. դրանք ներառված չեն։ Շարժվեք ցանցում, ապա սեղմեք «Ընտրել»՝ կուրսորի տակի բառը ստեղնաշարով մուտքագրելու համար (ընդգծման նշանը վանդակը դատարկ է թողնում)։ Կոճակները փոխում են հորիզոնականն ու ուղղահայացը, ցույց են տալիս հարցերի ցանկը, ստուգում են տառերը և բացահայտում բառը։ Տառերը պահվում են յուրաքանչյուր ֆայլի համար։ Կոդավորված .puz ֆայլերը հնարավոր չէ բացել։\n\nՇախմատային խնդիրներ՝ փոքր հավաքածու Lichess-ի խնդիրների բազայից (CC0)։ Ձախ և աջ կոճակները ցատկում են խաղաքարից խաղաքար, ընտրեք այն խաղաքարը, որը ցանկանում եք տեղափոխել, ապա ձախով և աջով անցեք այն վանդակներով, ուր այն կարող է գնալ, և նորից սեղմեք «Ընտրել»։ Սխալ քայլը հետ է վերցվում։ «Հուշում»-ը նշում է տեղափոխվող խաղաքարը, «Հաջորդը»՝ անցնում հաջորդ խնդրին։\n\nՏախտակը վերանկարում է միայն փոփոխվող վանդակները։ «Վիճակագրություն»-ը հաշվում է ձեր լուծած գլուխկոտրուկները։"
