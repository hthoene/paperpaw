calibre.plugin.description = Ստանում է գրքեր ցանցով։ Աշխատում է որպես անլար սարք Calibre-ի համար։
calibre.plugin.how = "«Անլար գրադարան»-ը թույլ է տալիս, որ սարքը ձեր համակարգչի Calibre-ում երևա որպես անլար սարք։ Այդ դեպքում Calibre-ը կարող է գրքեր ուղարկել նրան, ցուցակագրել և ջնջել դրանք։ Գրքերը հայտնվում են գրադարանում։\n\nԲացեք «Անլար գրադարան»-ը «Գործիքներ» ընտրացանկից, երբ սարքն ու համակարգիչը նույն Wi-Fi ցանցում են։ Calibre-ում ընտրեք «Connect/share», ապա «Start wireless device connection»։ Երբ սարքը գտնի ձեր համակարգիչը, ցույց կտա դրա անունը. հպեք «Միանալ» (կոճակներով՝ սեղմեք «Ընտրել»)։ Calibre-ը կարող է այստեղ գրքեր ավելացնել և ջնջել, ուստի միացեք միայն ձեր սեփական համակարգչին։ Էկրանը փակելով կապն ավարտվում է։\n\nԵթե Calibre-ն ինքնուրույն չի գտնվում, մուտքագրեք նրա համակարգչի հասցեն կարգավորումներում՝ «Գրադարան» բաժնում, Calibre-ի մասում՝ որպես «Հասցե»։ Եթե Calibre-ն օգտագործում է 9090-ից տարբեր պորտ, ավելացրեք այն որպես :պորտ, օր.՝ 192.168.1.20:9091։"
