anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Սովորում է համակարգչի Anki-ի ժամկետը հասած քարտերը և հետ ուղարկում ձեր պատասխանները AnkiConnect հավելումի միջոցով։
anki.plugin.how = "Anki-ն թույլ է տալիս ընթերցիչում սովորել ձեր համակարգչի Anki-ում ժամկետը հասած քարտերը և հետ է ուղարկում ձեր պատասխանները։ Այն օգտագործում է անվճար AnkiConnect հավելումը (հավելումի կոդը՝ 2055492159) և երբեք AnkiWeb-ը։ Սկզբում այն անջատված է՝ ավելացրեք այն «Պլագինների խանութ»-ից։\n\nՀամակարգչում՝ տեղադրեք AnkiConnect-ը Anki-ում (Tools, Add-ons, Get Add-ons) և վերագործարկեք Anki-ն։ Համաժամեցման ժամանակ Anki-ն պետք է բաց լինի։\n\nԸստ նախնականի AnkiConnect-ը պատասխանում է միայն այն համակարգչին, որում աշխատում է (127.0.0.1), ուստի ընթերցիչը չի կարող հասնել դրան։ Բացեք Tools, Add-ons, AnkiConnect, Config և «webBindAddress»-ի արժեքը դարձրեք «0.0.0.0» (լսել տնային ցանցում)։ Պորտը՝ «webBindPort», 8765 է, եթե այն չփոխեք։ Եթե այնտեղ «apiKey» եք սահմանում, նույն բանալին մուտքագրեք այստեղ։ Կարգավորումը փոխելուց հետո վերագործարկեք Anki-ն և թույլատրեք Anki-ն համակարգչի firewall-ում, եթե այն հարցնի։ Օգտագործեք սա միայն այն ցանցում, որին վստահում եք՝ դրանում ցանկացած ոք կարող է հասնել AnkiConnect-ին, ուստի բանալին լավ միտք է։\n\nԸնթերցիչում՝ բացեք Anki-ն «Գործիքներ»-ից, ապա «Համակարգիչ» դաշտում մուտքագրեք համակարգչի հասցեն (օրինակ՝ 192.168.1.20), պորտը, եթե այն 8765 չէ, և API բանալին, եթե սահմանել եք։ Ընտրեք կապուկ կամ թողեք դատարկ՝ բոլոր կապուկների համար։ Ապա ընտրեք «Համաժամեցնել Anki-ի հետ»՝ Wi-Fi-ը միացված։ Նախ ուղարկվում են սպասող պատասխանները, ապա բերվում են ժամկետը հասած քարտերը (և ձեր սահմանած քանակով նոր քարտեր), առավելագույնը 50։ Ընտրեք «Սովորել»՝ դրանք առանց ցանցի անցնելու համար՝ ցույց տվեք պատասխանը և գնահատեք այն՝ «Կրկին», «Դժվար», «Լավ» կամ «Հեշտ»։ Ձեր պատասխանները պահվում են ընթերցիչում, նաև առանց Wi-Fi-ի, և Anki են ուղարկվում հաջորդ համաժամեցմամբ։ Anki-ն է որոշում, թե երբ է քարտը վերադառնում՝ «Կրկին» պատասխանած քարտը նորից կբերվի հետագա համաժամեցմամբ, երբ Anki-ն ասի, որ դրա ժամկետը հասել է։\n\n«Համաժամեցնել Anki-ն բացելիս» կարգավորումը համաժամեցնում է ամեն անգամ, երբ բացում եք էկրանը։ Կոճակ սեղմելիս ոչինչ ցանց չի օգտագործում։"
