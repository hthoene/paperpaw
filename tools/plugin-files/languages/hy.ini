dictionary.plugin.how = "Բառարանը որոնում է գրքի բառը StarDict բառարաններում և ցույց է տալիս սահմանումները էկրանի ստորին մասի վրա բացվող վահանակում։\n\nԸնթերցելիս սեղմած պահեք բառը և ընտրեք «Որոնել». կոճակներով՝ «Ավելին»-ում օգտագործեք «Ընտրել տեքստ»։ Պատճենեք բառարանների պանակները (.ifo, .idx և .dict ֆայլերով) սարքի «dictionaries» պանակում՝ ներառյալ ենթապանակները, կամ ընտրեք այլ պանակ կարգավորումներում՝ «Ընթերցում» բաժնում, որպես «Բառարանների պանակ» (ընդլայնված կարգավորում)։ Առաջին որոնումը յուրաքանչյուր բառարանի համար պատրաստում է փոքր ինդեքս, ինչը մի պահ է տևում։\n\nՎահանակում էջաշրջման կոճակները կամ «Վեր»-ն ու «Վար»-ը ոլորում են երկար սահմանումները, իսկ «Հետ»-ը փակում է այն։ Հպումով՝ հպեք վահանակից դուրս՝ այն փակելու համար։"
