wifi.plugin.name = Wi-Fi
wifi.plugin.description = Միանում է Wi-Fi ցանցերին, երբ պետք է, և հետո անջատում ռադիոն։
wifi.plugin.how = "Wi-Fi-ը միանում է ցանցին, երբ պլագինին համացանց է պետք (կատալոգ, համաժամացում, խանութ, փոխանցում), և նորից անջատում է ռադիոն, երբ այն մեկ րոպե չի օգտագործվում, կամ անմիջապես, երբ բացվում է գլխավոր էկրանը կամ գիրքը՝ մարտկոցն ու հիշողությունը խնայելու համար։\n\nԲացեք Wi-Fi-ը կարգավորումներից կամ կարգավիճակի տողի Wi-Fi տարրից։ «Ցանցեր»-ը ցույց է տալիս հասանելի ցանցերը. ընտրեք մեկը և մուտքագրեք դրա գաղտնաբառը, կամ ընտրեք «Կարգավորել հեռախոսով» և անունն ու գաղտնաբառը մուտքագրեք հեռախոսի դիտարկիչում՝ սարքի փոխարեն։ «Մոռանալ»-ը հեռացնում է պահված ցանցը։\n\nԳաղտնաբառերը մնում են քարտի վրա՝ ապահով պահված, և այլևս երբեք չեն ցուցադրվում։ «Միանալ ըստ անհրաժեշտության» բաժնում կարգավորում եք, թե որքան ժամանակ է Wi-Fi-ը միացված մնում վերջին օգտագործումից հետո, արդյոք այն միացված է մնում լիցքավորման ընթացքում, և որ պահված ցանցն է առաջինը, երբ մի քանիսը հասանելի են։"
