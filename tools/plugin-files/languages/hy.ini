vocabulary.sd.fault.open-quote = Չակերտը բացված է և չի փակված։ Փակեք կամ հեռացրեք այն։
vocabulary.setting.sd-auto = Բացելիս թարմացնել կապուկները քարտից
vocabulary.setting.sd-auto.help = Ֆլեշքարտերը կարդում են պանակի նոր կամ փոխված ֆայլերը։
vocabulary.setting.sd-folder = Կապուկների ֆայլերի պանակ
vocabulary.setting.sd-folder.help = SD քարտում. դրա մեջ յուրաքանչյուր CSV, TSV կամ Anki ֆայլ կապուկ է։
vocabulary.sd.readme = "Ֆլեշքարտեր ֆայլերից\n\nՅուրաքանչյուր կապուկի համար այստեղ դրեք մեկ ֆայլ. Spanish.tsv-ն ստեղծում է Spanish կապուկը։\nՖայլեր՝ .tsv, .csv կամ .txt, պահված UTF-8-ով, կամ .apkg՝ Anki կապուկ, արտահանված «Support older Anki versions» նշված ընտրանքով։ Նրա նշումների առաջին երեք դաշտերը դառնում են առջևի կողմ, հետևի կողմ և օրինակ. ժամանակացույցը և մեդիան չեն կարդացվում, և PaperPaw-ը երբեք Anki ֆայլ չի գրում։\n\nՅուրաքանչյուր տողում մեկ քարտ՝ առջևի կողմ, հետևի կողմ և օրինակ (ըստ ցանկության)՝ բաժանված տաբով, ստորակետով կամ կետ-ստորակետով։ Առաջին տողը կարող է անվանել սյունակները՝ front, back, example։ Օրինակ՝\n\nKatze\tկատու\tDie Katze schläft.\n\nԱպա սարքում բացեք «Ֆլեշքարտեր»-ը, ընտրեք «Քարտեր SD քարտում», հետո՝ «Թարմացնել կապուկները»։\n\nԼավ է իմանալ՝\n- Կապուկները ձեր սովորածի հետ մնում են սարքում։ Ֆայլը կարդացվում է, երբ նոր է կամ փոխված, և նրա քարտերը ավելացվում են կապուկին կամ փոխվում այնտեղ։\n- Փոխեք ֆայլում քարտի հետևի կողմը կամ օրինակը՝ քարտը կփոխվի և կպահպանի ձեր առաջընթացը։\n- Փոխեք քարտի առջևի տեքստը՝ այն կհամարվի նոր քարտ, իսկ հինը կսկսվի զրոյից։ Քարտերը համընկնում են ըստ առջևի տեքստի, բացատներն ու մեծատառերը հաշվի չեն առնվում։ Պահեք կապուկը ֆայլում («Քարտեր SD քարտում», «Պահել ... քարտում»), և յուրաքանչյուր քարտ id սյունակում համար կստանա. այնտեղ փոխեք առջևի կողմը, ֆայլի առաջին երկու տողերը թողեք ինչպես կան, և քարտը կպահպանի ձեր սովորածը։\n- Պահելը գրում է կապուկի քարտերը։ Այն, ինչ ֆայլում կար և քարտ չէ (առանց առջևի կողմի տող), չի պահվում. նախկին ֆայլը պատճենվում է _name.bak.tsv։\n- Պահեք ֆայլը որպես CSV UTF-8 (ոչ UTF-16, ոչ էլ աղյուսակային ծրագրի սեփական ձևաչափով)։ 4 ՄիԲ-ից կամ 20 000 տողից մեծ ֆայլը չի կարդացվում. բաժանեք այն։\n- Ֆայլում ջնջված տողը կապուկի քարտը չի ջնջում, եթե միայն այդ կապուկի համար չմիացնեք բացակայող քարտերի հեռացումը։ Այդ դեպքում քարտը հեռանում է ձեր սովորածի հետ։\n- _-ով սկսվող անուններով ֆայլերը չեն կարդացվում։\n"
