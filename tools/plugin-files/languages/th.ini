vocabulary.sd.readme = "บัตร​คำ​จาก​ไฟล์\n\nวาง​ไฟล์​ไว้​ที่นี่​ชุด​ละ​ไฟล์: Spanish.tsv จะ​สร้าง​ชุด​บัตร​คำ​ชื่อ Spanish\nไฟล์​ที่​ใช้ได้: .tsv, .csv หรือ .txt บันทึก​เป็น UTF-8 หรือ .apkg (ชุด​บัตร​คำ Anki ที่​ส่งออก​โดย​ติ๊ก รองรับ Anki เวอร์ชัน​เก่า) ช่อง​สาม​ช่อง​แรก​จะ​เป็น​ด้านหน้า ด้านหลัง และ​ตัวอย่าง\n\nบัตร​คำ 1 ใบ​ต่อ​บรรทัด: ด้านหน้า ด้านหลัง และ​ตัวอย่าง (ไม่​บังคับ) คั่น​ด้วย​แท็บ จุลภาค หรือ​อัฒภาค บรรทัด​แรก​จะ​ระบุชื่อ​คอลัมน์​ก็ได้: front, back, example ตัวอย่าง:\n\nKatze	cat	Die Katze schläft.\n\nจากนั้น​เปิด บัตร​คำ บน​เครื่อง เลือก บัตร​คำ​ใน​การ์ด SD แล้ว​เลือก อัปเดต​ชุด​บัตร​คำ\n\nควร​รู้:\n- ชุด​บัตร​คำ​อยู่​บน​เครื่อง พร้อม​ความคืบหน้า​ใน​การเรียน ไฟล์​จะ​ถูก​อ่าน​เมื่อ​เป็น​ไฟล์​ใหม่​หรือ​มี​การเปลี่ยนแปลง\n- แก้​ด้านหลัง​หรือ​ตัวอย่าง​ใน​ไฟล์ บัตร​คำ​จะ​เปลี่ยน​และ​ยังคง​ความคืบหน้า​ไว้\n- แก้​ข้อความ​ด้านหน้า จะ​นับ​เป็น​บัตร​คำ​ใหม่ และ​ใบ​เก่า​จะ​เริ่มต้น​ใหม่ บัตร​คำ​จับคู่​กัน​ด้วย​ข้อความ​ด้านหน้า ช่องว่าง​และ​ตัวพิมพ์​ใหญ่​เล็ก​ไม่​นับ หาก​บันทึก​ชุด​ลง​ไฟล์ (บัตร​คำ​ใน​การ์ด SD แล้ว​เลือก บันทึก ลง​การ์ด) ทุก​ใบ​จะ​มี​หมายเลข​ใน​คอลัมน์ id แก้​ด้านหน้า​ตรงนั้น​โดย​คง​สอง​บรรทัด​แรก​ไว้ บัตร​คำ​จะ​ยังคง​ความคืบหน้า\n- การ​บันทึก​จะ​เขียน​บัตร​คำ​ของ​ชุด สิ่ง​ที่​ไม่​ใช่​บัตร​คำ​จะ​ไม่​ถูก​เก็บ ไฟล์​เดิม​จะ​ถูก​คัดลอก​ไป​เป็น _name.bak.tsv\n- บันทึก​เป็น CSV UTF-8 ไฟล์​ที่​เกิน 4 MiB หรือ 20,000 บรรทัด​จะ​ไม่​ถูก​อ่าน ให้​แยก​ไฟล์\n- บรรทัด​ที่​ลบ​ใน​ไฟล์​จะ​ไม่​ลบ​บัตร​คำ​ใน​ชุด เว้นแต่​เปิด ลบ ของ บัตร​คำ​ที่​ไม่​มี​ใน​ไฟล์ สำหรับ​ชุด​นั้น\n- ไฟล์​ที่​ชื่อ​ขึ้นต้น​ด้วย _ จะ​ไม่​ถูก​อ่าน\n"
