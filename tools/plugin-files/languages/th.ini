files.plugin.how = "คลัง​หนังสือ​แสดง​รายการ​หนังสือ​ใน​โฟลเดอร์​คลัง​หนังสือ แต่ละ​เล่ม​มี​ปก ชื่อเรื่อง ผู้แต่ง และ​ความคืบหน้า​ใน​การ​อ่าน หนังสือ​ที่​อ่าน​ล่าสุด​จะ​อยู่​บนสุด​เป็น​การ์ด จึง​อ่าน​ต่อ​ได้​ด้วย​การ​แตะ​หรือ​กด​เลือก​ครั้ง​เดียว ขณะที่​คลัง​หนังสือ​กำลัง​ค้นหา​หนังสือ จะแจ้ง​ว่า​พบ​แล้ว​กี่​เล่ม\n\nเหนือ​รายการ​หนังสือ เลือก​สิ่ง​ที่จะ​แสดง​ได้: ทั้งหมด เล่ม​ที่​กำลัง​อ่าน เล่ม​ที่​ยัง​ไม่​ได้​อ่าน หรือ​เล่ม​ที่​อ่าน​จบ​แล้ว หรือ​ชั้น​หนังสือ (ตาม​ผู้แต่ง ซีรีส์ แท็ก รายการ​โปรด เล่ม​ถัดไป​ของ​แต่ละ​ซีรีส์​ที่​เริ่ม​อ่าน) แตะ​หนังสือ​เพื่อ​อ่าน กด​ค้าง​ที่​หนังสือ (ถ้า​ใช้​ปุ่ม ให้​กด​เลือก​ค้าง) เพื่อ​เปิด ทำเครื่องหมาย​ว่า​อ่าน​จบ​หรือยัง​ไม่​ได้​อ่าน ดู​ข้อมูล ย้าย​ไป​ที่เก็บ​ถาวร หรือ​ลบ แตะ​ที่​ชื่อเรื่อง​เพื่อ​เปิด​เมนู​คลัง​หนังสือ: การเรียง​และ​การแสดง​หนังสือ การ​ค้นหา โฟลเดอร์​คลัง​หนังสือ และ​การ​ตั้งค่า\n\nโฟลเดอร์​คลัง​หนังสือ​ตั้ง​ได้​ใน การ​ตั้งค่า ภายใต้ คลัง​หนังสือ ที่ โฟลเดอร์​คลัง​หนังสือ และ​ยัง​แสดง​หนังสือ​เป็นตาราง​ปก​ได้​ที่นั่น​ด้วย สำหรับ​ไฟล์​อื่น​ทั้งหมด ใช้ ไฟล์ ใน​เมนู​เครื่องมือ"
