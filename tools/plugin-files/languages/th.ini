update.plugin.name = อัปเดต
update.plugin.description = ติดตั้ง​อัปเดต​เฟิร์มแวร์ จาก​การ์ด​หรือ​ดาวน์โหลด​จาก​อินเทอร์เน็ต
update.plugin.how = "อัปเดต​ใช้​ติดตั้ง​เฟิร์มแวร์​ใหม่ บน​อุปกรณ์​ที่ PaperPaw เป็น​เฟิร์มแวร์​เอง อยู่​ใน​การ​ตั้งค่า\n\nค้นหา​ออนไลน์ จะ​ถาม​เซิร์ฟเวอร์​อัปเดต​หา PaperPaw ที่​ใหม่​กว่า​แล้ว​ดาวน์โหลด​มา หรือ​จะ​คัดลอก​ไฟล์​อัปเดต (.bin จาก paperpaw.org) ไป​ไว้​ใน​โฟลเดอร์ updates บน​การ์ด​ก็ได้ จากนั้น ติดตั้ง ใช้เวลา​ราว 1 นาที แล้ว​อุปกรณ์​จะ​รี​สตาร์ต หนังสือ การ​ตั้งค่า และ​ตำแหน่ง​ที่​อ่าน​ค้าง​ไว้​ไม่​หาย\n\nเมื่อ​เปิด ตรวจหา​อัปเดต อุปกรณ์​จะ​ถาม​เอง​ราว​สัปดาห์​ละ​ครั้ง เฉพาะ​ตอนที่ Wi-Fi เปิด​อยู่แล้ว​หรือ​กำลัง​ชาร์จ PaperPaw ที่​ใหม่​กว่า​จะ​รอ​อยู่​ที่นี่ การ​ค้นหา​จะ​ส่ง​ข้อมูล​ว่า​อุปกรณ์​ใช้​อะไร​อยู่ โดย​ไม่​มีชื่อ​หรือ​หมายเลข​ของ​อุปกรณ์ และ​เพื่อ​นับ​จำนวน​อุปกรณ์ จะ​ส่ง​ด้วยว่า​สั่ง​ค้นหา​เอง​หรือไม่ และ​เป็นการ​ค้นหา​ครั้งแรก​ของ​วัน สัปดาห์ หรือ​เดือน​หรือไม่\n\nหาก​ปลั๊ก​อิน​ที่​ใช้​อยู่​ยัง​ไม่​มี​เวอร์ชัน​สำหรับ​รุ่นใหม่ การ​อัปเดต​จะ​รอ เวอร์ชัน​ที่​เก่า​กว่า​จะ​ติดตั้ง​ก็ต่อเมื่อ​เลือก​เอง\n\nเฟิร์มแวร์​อื่น เช่น CrossPoint ก็​ติดตั้ง​จาก​ที่นี่​ได้ ใส่​ไฟล์​ของ​เฟิร์มแวร์​นั้น (.bin) ใน​โฟลเดอร์ updates แล้ว​เปิด อัปเดต PaperPaw จะ​ตรวจ​ว่า​เป็น​เฟิร์มแวร์​ครบถ้วน ไม่​เสียหาย และ​ตรง​กับ​อุปกรณ์​นี้ แต่​บอก​ไม่​ได้​ว่า​ใคร​สร้าง เพราะ​ไม่​ได้​ลงนาม​ไว้ ติดตั้ง​อยู่ดี จะ​เขียน​ลง​ใน​อีก​ครึ่งหนึ่ง​ของ​แฟลช แล้ว​อุปกรณ์​จะ​เริ่ม​ด้วย​เฟิร์มแวร์​นั้น PaperPaw ยังอยู่​ใน​ครึ่ง​ของ​ตน​จนกว่า​เฟิร์มแวร์​นั้น​จะ​ติดตั้ง​ทับ หาก​ต้องการ​กลับมา​ใช้ PaperPaw ให้​ติดตั้ง​ไฟล์​ติดตั้ง​ของ PaperPaw (paperpaw-<device>-<version>-install.bin) จาก​เมนู​ของ​เฟิร์มแวร์​อื่น"
