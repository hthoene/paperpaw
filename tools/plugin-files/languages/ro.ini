update.plugin.name = Actualizare
update.plugin.description = Instalează actualizări de firmware, de pe card sau descărcate de pe internet.
update.plugin.how = "Actualizare instalează firmware nou, pe dispozitivele unde PaperPaw este firmware-ul, precum X4. O găsiți în setări, ca Actualizare.\n\nCăutare online întreabă serverul de actualizări dacă există un PaperPaw mai nou și îl descarcă, ceea ce durează câteva minute prin Wi-Fi. Sau copiați un fișier de actualizare (cu extensia .bin, de pe paperpaw.org) în dosarul updates de pe card, de exemplu prin transfer Wi-Fi. Instalarea durează apoi cam un minut, iar dispozitivul repornește; cărțile, setările și pozițiile de citire rămân.\n\nCu Căutare actualizări pornită (în setări, oprită la început), dispozitivul întreabă singur cam o dată pe săptămână, doar cât timp Wi-Fi este oricum pornit sau se încarcă. Un PaperPaw mai nou găsit așteaptă aici; nimic nu vă întrerupe lectura. O căutare trimite ce rulează dispozitivul, fără un nume sau un număr al lui; pentru a număra dispozitivele, trimite și dacă ați cerut dumneavoastră și dacă este prima sa căutare din zi, săptămână sau lună.\n\nDacă pluginurile pe care le folosiți nu au încă o versiune pentru noua ediție, actualizarea le așteaptă. O versiune mai veche se instalează doar dacă o alegeți.\n\nUn alt firmware, precum CrossPoint, se instalează și de aici: puneți fișierul său (cu extensia .bin) în dosarul updates și deschideți Actualizare. PaperPaw verifică dacă este un firmware întreg pentru acest dispozitiv, nedeteriorat, dar nu poate spune cine l-a făcut, deoarece nu este semnat. Instalare oricum îl scrie în cealaltă jumătate a memoriei flash, iar dispozitivul îl pornește; PaperPaw rămâne în jumătatea sa până când acel firmware instalează ceva peste el. Pentru a reveni la PaperPaw mai târziu, instalați fișierul său de instalare (paperpaw-<dispozitiv>-<versiune>-install.bin) din meniul celuilalt firmware, precum actualizarea de firmware de pe SD a CrossPoint."
