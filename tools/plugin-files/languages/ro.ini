files.plugin.name = Browser de fișiere
files.plugin.description = Listează cărțile și dosarele de pe dispozitiv și le deschide.
files.plugin.how = "Biblioteca listează cărțile din dosarul bibliotecii, fiecare cu coperta, titlul, autorul și cât ați citit din ea. Cartea citită ultima stă deasupra ca un card, așa că reluarea citirii înseamnă o atingere sau o apăsare pe Selectare. Cât timp biblioteca caută cărți, spune câte a găsit până acum.\n\nAlegeți ce se afișează deasupra cărților: toate, cele pe care le citiți, necitite sau terminate, ori rafturile (după autor, serie, etichetă, favorite, următoarea carte din fiecare serie începută). Atingeți o carte pentru a o citi; țineți-o apăsată (cu butoane, țineți apăsat Selectare) pentru a o deschide, a o marca drept terminată sau necitită, a vedea informațiile ei, a o muta în arhivă sau a o șterge. Atingeți titlul pentru meniul bibliotecii: cum sunt sortate și afișate cărțile, căutare, dosarul bibliotecii și setări.\n\nDosarul bibliotecii se stabilește în Setări, la Bibliotecă, ca Dosarul bibliotecii; acolo puteți afișa și cărțile ca o grilă de coperți. Pentru orice alt fișier, folosiți Fișiere din meniul Instrumente."
