vocabulary.setting.sd-folder = Dosar pentru fișierele seturilor
vocabulary.setting.sd-folder.help = Pe cardul SD: un fișier CSV, TSV sau Anki din el este un set.
vocabulary.sd.readme = "Cartonașe din fișiere\n\nPuneți aici câte un fișier pentru fiecare set: Spaniola.tsv creează setul Spaniola.\nFișiere: .tsv, .csv sau .txt, salvate ca UTF-8, sau .apkg: un set Anki, exportat cu Support older Anki versions bifat. Primele trei câmpuri ale notelor sale devin față, spate și exemplu; programarea și media nu sunt citite, iar PaperPaw nu scrie niciodată un fișier Anki.\n\nUn cartonaș pe fiecare rând: față, spate și un exemplu (opțional), separate printr-o tabulare, o virgulă sau un punct și virgulă. Primul rând poate numi coloanele: front, back, example. Exemplu:\n\nKatze\tcat\tDie Katze schläft.\n\nApoi deschideți Cartonașe pe cititor, alegeți Cartonașe de pe cardul SD și apoi Actualizare seturi.\n\nBine de știut:\n- Seturile rămân pe cititor, cu ce ați învățat. Un fișier este citit când este nou sau modificat, iar cartonașele sale sunt adăugate la set sau modificate acolo.\n- Schimbați spatele sau exemplul unui cartonaș în fișier: cartonașul se schimbă și își păstrează progresul.\n- Schimbați textul feței unui cartonaș: contează ca un cartonaș nou, iar cel vechi o ia de la început. Cartonașele sunt potrivite după textul feței, spațiile și majusculele nu contează. Salvați un set într-un fișier (Cartonașe de pe cardul SD, Salvare set pe card) și fiecare cartonaș are un număr în coloana id: schimbați acolo o față, lăsați primele două rânduri ale fișierului neschimbate, iar cartonașul păstrează ce ați învățat.\n- Salvarea scrie cartonașele setului. Ce era în fișier și nu este cartonaș (un rând fără față) nu se păstrează; fișierul care era acolo este copiat în _nume.bak.tsv.\n- Salvați fișierul ca CSV UTF-8 (nu UTF-16, nu formatul propriu al unui tabel). Un fișier de peste 4 MiB sau 20.000 de rânduri nu este citit: împărțiți-l.\n- Un rând pe care îl ștergeți în fișier nu șterge cartonașul din set, decât dacă activați Eliminare cartonașe lipsă pentru acel set. Atunci cartonașul pleacă odată cu ce ați învățat.\n- Fișierele al căror nume începe cu _ nu sunt citite.\n"
