picture-home.plugin.name = Şəkilli ana ekran
picture-home.plugin.description = Vidcetlərin arxasında öz şəkliniz və özünüz qurduğunuz status sətri olan ana ekran.
picture-home.plugin.how = "“Şəkilli ana ekran” aktiv olduğu müddətdə ana ekranı əvəz edir: vidcetlərin arxasında öz şəkliniz, özünüz düzdüyünüz vidcet və alət səhifələri. Onu plagin menecerində söndürün, daxili ana ekran öz səhifələri ilə geri qayıdır.\n\nŞəkilləri (JPEG, PNG və ya GIF) kartdakı qovluğa qoyun (standart olaraq wallpapers), sonra birini Ayarlar › Fərdiləşdir › Şəkilli ana ekran bölməsində seçin. “Uyğunlaşdırma” onun ekranı necə doldurduğunu (doldur, bütöv şəkil, dart, orijinal ölçü, təkrarla), “Mövqe” hansı hissənin qaldığını, “Böyütmə” nə qədər böyük olduğunu, “Şəkli açıqlaşdır” isə nə qədər solğun olduğunu bildirir: daha solğun şəkil vidcetləri oxumağı asanlaşdırır. Şəkil hər ekran ölçüsü üçün bir dəfə hazırlanır, bu bir az vaxt aparır.\n\nVidcetlər şəklin üzərində lövhələrdə durur. Səhifəni daxili ana ekrandakı kimi düzün: səhifənin altındakı qələmlə və ya menyuda “Ana ekranı redaktə et” ilə.\n\nStatus sətri (saat, Wi-Fi, batareya və ya seçdiyiniz) aktiv, deaktiv və ya avtomatik ola bilər, yuxarıda və ya aşağıda, tam enində və ya solda, ortada ya da sağda kiçik kapsul şəklində, açıq, tünd və ya boz lövhədə ya da birbaşa şəklin üzərində. Düymələri adlandıran sətir (X4-də) də aktiv, deaktiv və ya avtomatik ola bilər. Avtomatik o deməkdir ki, düyməyə basdıqda onlar bir neçə saniyə görünür; bu basma başqa heç nə etmir.\n\n“Şəklin təsviri” şəklin necə çəkildiyini bildirir: “Boz çalarlar” ekranın bütün boz çalarları ilə (X4-də daha yavaş), “Nöqtəli” ağ-qara nöqtələrlə (sürətli), və ya “Avtomatik”, daxili ana ekrandakı kimi: ekran çəkiləndə boz çalarlar, ilk dəyişiklikdən sonra nöqtələr. Ekranda boz çalarlar yoxdursa, onların yerinə nöqtələr işlənir."
