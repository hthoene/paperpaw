update.plugin.name = Yeniləmə
update.plugin.description = Proqram təminatı yeniləmələrini kartdan və ya internetdən endirərək quraşdırır.
update.plugin.how = "Yeniləmə PaperPaw-un proqram təminatı olduğu cihazlarda, məsələn, X4-də yeni proqram təminatı quraşdırır. Onu ayarlarda “Yeniləmə” adı ilə tapa bilərsiniz.\n\n“Onlayn axtar” yeniləmə serverindən daha yeni PaperPaw olub-olmadığını soruşur və onu endirir; Wi-Fi ilə bu bir neçə dəqiqə çəkir. Və ya yeniləmə faylını (.bin ilə bitən, paperpaw.org saytından) kartdakı updates qovluğuna köçürün, məsələn, Wi-Fi ilə ötürmə vasitəsilə. Bundan sonra quraşdırma təxminən bir dəqiqə çəkir və cihaz yenidən başlayır; kitablar, ayarlar və oxuma yerləri qalır.\n\n“Yeniləmələri yoxla” aktiv olanda (ayarlarda, əvvəlcə deaktivdir) cihaz təxminən həftədə bir dəfə özü soruşur, yalnız Wi-Fi onsuz da aktiv olanda və ya cihaz şarj olunanda. Tapdığı yeni PaperPaw burada gözləyir; oxumanıza heç nə mane olmur. Axtarış cihazda nəyin işlədiyini göndərir, cihazın adını və nömrəsini yox; cihazları saymaq üçün həmçinin sizin soruşub-soruşmadığınızı və bunun günün, həftənin və ya ayın ilk axtarışı olub-olmadığını göndərir.\n\nİstifadə etdiyiniz plaginlərin yeni buraxılış üçün hələ versiyası yoxdursa, yeniləmə onları gözləyir. Köhnə versiya yalnız siz onu seçsəniz quraşdırılır.\n\nCrossPoint kimi başqa proqram təminatı da buradan quraşdırılır: onun faylını (.bin ilə bitən) updates qovluğuna qoyun və Yeniləməni açın. PaperPaw onun bu cihaz üçün tam və zədəsiz proqram təminatı olduğunu yoxlayır, lakin imzalanmadığı üçün onu kimin hazırladığını bilə bilmir. “Yenə də quraşdır” onu flash yaddaşın digər yarısına yazır və cihaz onu başladır; PaperPaw həmin proqram təminatı onun üzərinə nəsə quraşdırana qədər öz yarısında qalır. Sonra PaperPaw-a qayıtmaq üçün onun quraşdırma faylını (paperpaw-<device>-<version>-install.bin) digər proqram təminatının menyusundan, məsələn, CrossPoint-in SD firmware update funksiyası ilə quraşdırın."
