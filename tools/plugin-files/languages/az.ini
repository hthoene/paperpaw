vocabulary.sd.readme = "Fayllardan öyrənmə kartları\n\nHər dəst üçün bura bir fayl qoyun: İspanca.tsv İspanca dəstini yaradır.\nFayllar: UTF-8 kimi yadda saxlanılmış .tsv, .csv və ya .txt, yaxud .apkg: “Support older Anki versions” işarələnərək ixrac edilmiş Anki dəsti. Onun qeydlərinin ilk üç sahəsi ön üz, arxa üz və nümunə olur; təkrar cədvəli və media oxunmur, PaperPaw isə heç vaxt Anki faylı yazmır.\n\nHər sətirdə bir kart: ön üz, arxa üz və nümunə (istəyə görə), tab, vergül və ya nöqtəli vergüllə ayrılmış. Birinci sətir sütunları adlandıra bilər: front, back, example. Nümunə:\n\nKatze\tpişik\tDie Katze schläft.\n\nSonra oxuyucuda Öyrənmə kartlarını açın, SD kartdakı kartlar, sonra isə Dəstləri yenilə seçin.\n\nBilməli olduqlarınız:\n- Dəstlər öyrəndiklərinizlə birlikdə oxuyucuda qalır. Fayl yeni və ya dəyişdirilmiş olduqda oxunur və onun kartları dəstə əlavə edilir və ya orada dəyişdirilir.\n- Faylda kartın arxa üzünü və ya nümunəsini dəyişin: kart dəyişir və irəliləyişinizi saxlayır.\n- Kartın ön üz mətnini dəyişin: bu yeni kart sayılır, köhnəsi isə sıfırdan başlayır. Kartlar ön üz mətninə görə uyğunlaşdırılır, boşluqlar və böyük-kiçik hərflər nəzərə alınmır. Dəsti fayla yazın (SD kartdakı kartlar, Dəsti karta yaz) və hər kartın id sütununda nömrəsi olacaq: orada ön üzü dəyişin, faylın ilk iki sətrini olduğu kimi saxlayın və kart öyrəndiklərinizi saxlayacaq.\n- Yazma dəstin kartlarını yazır. Faylda olub kart olmayan şey (ön üzü olmayan sətir) saxlanılmır; əvvəlki fayl _ad.bak.tsv faylına köçürülür.\n- Faylı CSV UTF-8 kimi yadda saxlayın (UTF-16 və ya cədvəl proqramının öz formatı kimi yox). 4 MiB-dan və ya 20.000 sətirdən böyük fayl oxunmur: onu bölün.\n- Faylda sildiyiniz sətir dəstdəki kartı silmir, əgər həmin dəst üçün “faylda olmayan kartlar” ayarında Sil seçməmisinizsə. Onda kart öyrəndiklərinizlə birlikdə silinir.\n- Adı _ ilə başlayan fayllar oxunmur.\n"
