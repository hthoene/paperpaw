reading-goal.plugin.name = Oxuma hədəfi
reading-goal.plugin.description = Gündəlik oxuma dəqiqələri və ana ekranda əhvalı bugünkü oxumaya uyğun dəyişən pişik.
reading-goal.plugin.how = "Ana ekranınızdakı pişik bugünkü oxumanın necə getdiyini göstərir: hələ oxumamısınızsa, kədərlidir; bir az oxuyandan sonra elə-belədir; gündəlik hədəfin yarısından razıdır; hədəfə çatanda isə xoşbəxtdir.\n\nAna ekrana Oxuyan pişik vidcetini əlavə edin (ana ekranı basılı saxlayın, sonra vidcet əlavə edin) və ya yuxu ekranı kimi Bugünkü oxuyan pişik seçimini edin. Pişiyə toxunma gündəlik hədəfi açır; bu, oxuduğunuz dəqiqələri sayan oxuma statistikasının hədəfidir.\n\nAyarlarda, Oxuma bölməsində, Razılıq həddi və Xoşbəxtlik həddi pişiyin hədəfin hansı hissəsindən razı və ya xoşbəxt olacağını, Xüsusi şəkillər isə pişiklərin yerinə göstəriləcək şəkillər qovluğunu (sad, meh, content və happy) təyin edir. Şəkillər PNG və ya JPEG fayllarıdır; qovluq yoxdursa, pişiklər göstərilir."
