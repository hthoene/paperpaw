smart-home.plugin.name = Ağıllı ev
smart-home.plugin.description = Öz Home Assistant serverinizdən dəyərlər və keçiricilər paneldə və ana ekran vidcetlərində. Ev şəbəkənizdəki Home Assistant ilə işləyir.
smart-home.plugin.how = "Ağıllı ev öz Home Assistant serverinizdən dəyərləri və keçiriciləri göstərir: temperatur, rütubət, enerji, qapılar və pəncərələr, işıqlar, keçiricilər və səhnələr. O, ev şəbəkənizdə serverinizlə REST API vasitəsilə əlaqə saxlayır; heç nə başqa xidmətdən keçmir.\n\nAlətlər menyusundan Ağıllı ev, sonra Bağlantı bölməsini açın: Home Assistant ünvanınızı (məsələn, http://homeassistant.local:8123) və uzunmüddətli giriş tokenini yazın (onu Home Assistant profil səhifənizin aşağısında yaradın). Token ayarlar faylında deyil, parollar və açarlar arasında saxlanılır. Sadə http yalnız ev şəbəkənizdəki ünvanlar üçün istifadə olunur; başqa yerdəki server üçün ayarlarda “Ev şəbəkəsindən kənar serverlər” ayarını aktiv edin və etibarlı sertifikatlı https istifadə edin.\n\nObyektləri seç serverinizdə olanların siyahısını açır: ada və ya ID-yə görə axtarın və göstərmək üçün obyekti seçin (onu yığışdırmaq üçün yenidən seçin). Ona otaq verə bilərsiniz; bu, onu paneldə və otaq vidcetlərində qruplaşdırır. Ən çoxu 24 obyekt saxlanılır. Paneldə işığı, keçiricini və ya səhnəni dəyişmək üçün onu seçin: sətir serverin cavabını göstərir. Seçdiyiniz sensor yenidən oxunur.\n\nVidcetlər (ana ekranı basılı saxlayın, sonra vidcet əlavə edin): Ağıllı ev dəyəri bir göstəricini böyük göstərir, qrup otağın obyektlərini sadalayır, keçirici bir işıq və ya keçirici üçün düymədir, otaq isə otağın göstəriciləri və keçiriciləri olan kartdır. Hər vidcetin ayarlarında onun hansı obyekti və ya otağı göstərdiyi yazılıb.\n\nEv məlumatları paneli açanda, istədiyiniz zaman (İndi yenilə sətri və ya dəyər, yaxud qrup vidcetinə toxunma), Wi-Fi artıq qoşulu olarkən oxuyucu oyananda və şarj cihazı qoşulu olarkən təyin etdiyiniz qrafiklə oxunur. O, radionu heç vaxt özü yandırmır və heç vaxt yanılı saxlamır."
