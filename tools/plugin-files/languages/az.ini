format-cbz.plugin.name = Komikslər
format-cbz.plugin.description = Komiks arxivlərini (.cbz) açır, hər səhifədə bir şəkil.
format-cbz.plugin.how = "Komiks arxivlərini (.cbz) açır: hər səhifədə ekrana uyğunlaşdırılmış bir şəkil, adlarının sırası ilə (2, 10-dan əvvəl).\n\nOnları kitabxana qovluğuna qoyun və kitabxanadan açın; səhifələri istənilən kitabdakı kimi çevirin. Böyük şəkillər ilk dəfə bir az vaxt aparır, X4-də başqa yerlərdən daha çox.\n\nOxuma ayarları (Ayarlar, Oxuma): “Kadr-kadr” səhifənin hər dəfə bir kadrını ekranın imkan verdiyi qədər böyük göstərir və səhifə çevirmə onlar arasında keçir; kadrları olmayan səhifə tam göstərilir. “Komiks səhifələrinin istiqaməti” manqa üçün səhifə çevirməni güzgü kimi tərsinə çevirir (sağdan sola); kitabın öz ComicInfo.xml faylı bunu özü bildirir. Kitabxana kitabın adını, seriyasını və nömrəsini ComicInfo.xml-dən göstərir."
