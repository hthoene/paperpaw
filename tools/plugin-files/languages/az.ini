dictionary.plugin.description = Sözləri StarDict lüğətlərində axtarır.
dictionary.plugin.how = "Lüğət kitabdakı sözü StarDict lüğətlərində axtarır və izahları ekranın aşağı hissəsini örtən paneldə göstərir.\n\nOxuyucuda sözü basılı saxlayın və Lüğətdə axtar seçin; düymələrlə Daha çox altında Mətn seç istifadə edin. Lüğət qovluqlarını (.ifo, .idx və .dict faylları ilə) cihazdakı “dictionaries” qovluğuna köçürün (alt qovluqlar da olar) və ya Ayarlarda, Oxuma altında Lüğət qovluğu (əlavə ayar) üçün başqa qovluq seçin. İlk axtarış hər lüğət üçün kiçik indeks hazırlayır, bu bir az vaxt aparır.\n\nPaneldə səhifə düymələri və ya Yuxarı və Aşağı uzun izahları sürüşdürür, Geri onu bağlayır. Toxunma ilə bağlamaq üçün panelin xaricinə toxunun."
