notes-vault.plugin.name = Qeyd anbarı
notes-vault.plugin.description = Markdown qeydləri olan qovluğu qovluqlara, teqlərə və son dəyişikliklərə görə oxuyur, ana ekran üçün vidcetləri var. Obsidian anbarları ilə işləyir.
notes-vault.plugin.how = "“Qeyd anbarı” Markdown qeydləri olan qovluğu (qeyd tətbiqlərinin saxladığı kimi sadə .md faylları) oxuyur. Obsidian anbarları ilə işləyir.\n\nAnbarın qovluğunu ayarlarda və ya alətlərdəki anbar səhifəsində seçin. Sonra səhifə qovluqları kartdakı kimi, son dəyişdirilmiş qeydləri, teqləri və qeyd başlıqlarında axtarışı təklif edir.\n\nİlk dəfə anbar, səhifəsi açıq olduğu müddətdə arxa planda indekslənir; minlərlə qeydi olan anbar bir neçə dəqiqə çəkir, sonra dərhal açılır. İndeks kartda saxlanılır və anbarın səhifəsi bir neçə saatdan sonra açıldıqda və ya siz “Yenilə” seçdikdə yenidən yaradılır.\n\nQeyd oxuyucuda açılır. Digər qeydlərə keçidlər ([[Qeyd]], [[Qeyd|sözlər]], [[Qeyd#Başlıq]]) anbarın istənilən yerində qeydin adına görə tapılır; keçidə toxunmaq həmin qeydi açır, Geri isə əvvəlki qeydə qaytarır.\n\nAnbarda heç nə heç vaxt dəyişdirilmir. Ana ekran üçün vidcetlər (son qeydlər, bərkidilmiş qeyd, günün qeydi, təsadüfi qeyd, teqlər, axtarış) ana ekranın redaktorunda əlavə edilir. Vidcet qeydləri yalnız bir qovluqdan götürə bilər: vidcetin ayarlarında qovluğun kartın kökündən yolunu yazın (məsələn, Qeydlər/İş); boş qalsa, anbarın bütün qeydlərini götürür."
