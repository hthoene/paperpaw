transfer.plugin.how = "Wi-Fi ilə ötürmə kitabları və digər faylları kabel və tətbiq olmadan, eyni şəbəkədəki brauzerdən cihaza köçürür. Faylları cihazdan götürmək, qovluq yaratmaq və silmək də mümkündür.\n\nOnu Alətlər bölməsindən açın. Ekranda ünvan mətn və QR kod kimi göstərilir: onu telefon və ya kompüterdəki brauzerdə açın, yaxud kodu skan edin. Ünvanda hər dəfə yenidən yaradılan açar var, ona görə şəbəkədəki başqaları fayllarınıza çata bilmir. Ötürmə ekran açıq olduqca işləyir.\n\nPaperPaw Wi-Fi-ı özü idarə etdiyi cihazlarda, məsələn, X4-də, aşağıdakı “Routersiz” düyməsi cihazın öz şəbəkəsini açır; telefon kodu skan edərək ona qoşulur."
