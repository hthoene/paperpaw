store.plugin.name = Plagin mağazası
store.plugin.description = Bu cihaz üçün plaginləri tapır, quraşdırır, yeniləyir və silir.
store.plugin.how = "Plagin mağazası bu cihaz üçün plaginləri internetdə tapır, onları quraşdırır, yeniləyir və silir. Onu Alətlər bölməsindən açın; Wi-Fi lazımdır.\n\nBaşlanğıc səhifəsi kitabxananın tövsiyə etdiklərini, yeni və hazırda populyar olanları, sonra isə qrupları göstərir. Qrup öz plaginlərini hər gün dəyişən ədalətli qarışıqda göstərir ki, hər plagin görünsün; onları A-dan Z-yə, ən yeniyə və ya son yeniləməyə görə sıralayın, uzun siyahılarda isə hərfə keçin. Plaginin səhifəsini açın: orada ölçüsü və tutduğu yaddaş göstərilir; sonra Quraşdır, Yenilə və ya Sil seçin. Hamısını yenilə quraşdırılmış bütün plaginləri yeniləyir.\n\nKod plaginləri cihaza tam girişlə işləyir: mağaza bunu bildirir və əvvəlcə soruşur, onlar isə yenidən başladandan sonra işə düşür. Biri xəta versə, PaperPaw kod plaginləri olmadan başlayır və hansı olduğunu bildirir. Siyahının haradan gəldiyini Plagin kitabxanası təyin edir.\n\nAyarlar, Sistem bölməsindəki İcma plaginləri başqalarının GitHub-da dərc etdiyi plaginləri də göstərir. Onları heç kim yoxlamayıb: onlar Yoxlanılmayıb kimi işarələnir, kod plagininin səhifəsi onun imzalandığı açarı göstərir, başqa açarla imzalanmış yeniləmə isə quraşdırılmır.\n\nBaşlanğıc səhifəsinin son sətri olan Mənbələr başqalarının plagin siyahılarını ünvanı ilə (https://…/plugins.json) əlavə edir, onlardan birini PaperPaw siyahısının yerinə göstərir və ya onu silir. Yazmaq əvəzinə kartda .paperpaw/plugins/store qovluğuna hər sətirdə bir ünvan olan sources.txt faylı qoyun: ünvanlar Mənbələr bölməsində yeni kimi görünəcək. PaperPaw mənbəni və onun plaginlərini yoxlamır, cihaz isə mənbənin serverinə qoşulur. Mənbə öz siyahısını imzalayır; cihaz oxuduğu ilk siyahının açarını yadda saxlayır və bundan sonra yalnız həmin açarla imzalanmış siyahıları və kod plaginlərini qəbul edir. Plagin yeniləmələri yalnız quraşdırıldığı mənbədən alır. PaperPaw-un öz kitabxanası həmişə var və silinə bilməz; mağazadan çıxanda yenidən o göstərilir."
