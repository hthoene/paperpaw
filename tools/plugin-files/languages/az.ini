rules.plugin.name = Qaydalar
rules.plugin.description = Nəsə baş verəndə nəsə edir: məsələn, saat 22:00-da gecə rejimi.
rules.plugin.how = "Qayda nəsə baş verəndə öz-özünə nəsə edir: məsələn, hər gün saat 22:00-da gecə rejimini aktiv edir və ya PaperPaw başlayanda kataloqları sinxronlaşdırır.\n\nQaydalar Ayarlarda, Fərdiləşdir bölməsində, Qaydalar adı altındadır. Qayda əlavə et soruşur: Nə vaxt? (PaperPaw başlayanda, günün müəyyən vaxtı, kitab açılanda və ya bağlananda, batareya, şarj, keçirici və s.) və Sonra nə? (əməliyyat icra et, keçiricini aktiv və ya deaktiv et, rəqəm təyin et, mesaj göstər). Qaydaya fasilə vermək üçün ona toxunun; şərt əlavə etmək (məsələn, Günün iki vaxtı arasında) və ya silmək üçün onu basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın).\n\nSeçiləcək əməliyyatlar, keçiricilər və rəqəmlər plaginlərə görə qruplaşdırılıb: əvvəlcə plagini, sonra onun gətirdiyini seçin; Geri yenidən çıxır. Göstərilən ekranda işləyən əməliyyat, məsələn, Geri və ya Növbəti səhifə, orada basılsaydı nə edərdisə, onu edir.\n\nVaxtlar hansı ekran açıq olursa olsun işləyir. Bir-birini daim ləğv edən iki qayda bir neçə addımdan sonra dayanır."
