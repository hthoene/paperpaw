weather.plugin.name = Hava
weather.plugin.description = Open-Meteo-dan indiki hava və növbəti günlər vidcet kimi.
weather.plugin.how = "Hava plagini ana ekran üçün vidcetlərdə indiki havanı və növbəti günləri göstərir. Məlumat Open-Meteo xidmətindən gəlir, hesab və ya açar lazım deyil. “İndiki hava” temperaturu, hava şəraitini və seçdiyiniz digər məlumatları göstərir; “Proqnoz” növbəti günləri yan-yana və ya siyahı kimi göstərir.\n\nƏvvəlcə yer seçin: ayarlarda, “Hava” bölməsində “Yer” sətrində (adı yazın, sonra tapılan yerlərdən seçin). Yalnız onun koordinatları göndərilir, həm də yalnız hava vidceti göstərilərkən. Vidcetləri ana ekranı redaktə edərkən əlavə edin.\n\nHava ən çox “Ən çox hər … yenilə” ayarında göstərilən tezlikdə və yalnız şəbəkə olduqda gətirilir: Wi-Fi-ı heç vaxt özü yandırmır.\n\nHava məlumatları Open-Meteo.com (https://open-meteo.com) saytından, Creative Commons Attribution 4.0 lisenziyası (CC BY 4.0) ilə."
