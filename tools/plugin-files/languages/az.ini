mail.plugin.name = Poçt
mail.plugin.description = Parol və ya tətbiq parolu ilə (IMAP və SMTP) e-poçt oxuyur və göndərir, brauzerdə giriş olmadan.
mail.plugin.how = "Poçt e-poçtu IMAP və SMTP ilə oxuyur və göndərir. O, ünvanınız və parolla, brauzerdə giriş olmadan daxil olur, ona görə buna icazə verən istənilən provayderlə işləyir.\n\nHesabı Ayarlarda, “Poçt” altında qurun. Provayderinizi seçin, ünvanınızı və parolu yazın. Əksər provayderlər tətbiq parolu tələb edir: onu hesabınızın təhlükəsizlik ayarlarında yaradın və burada istifadə edin. Adi parolunuz çox vaxt işləmir və o, provayderinizin serverindən başqa heç yerə getmir. O, parollar və açarlarla birlikdə saxlanılır.\n\nPoçtu alətlərdə açın. “Poçtu yoxla” ən son məktubları və qovluqları yükləyir. Məktublar kartda saxlanılır, ona görə onları şəbəkəsiz oxuya bilərsiniz. Cihaz qoşulur, yükləyir və ayrılır, ona görə Wi-Fi yalnız bir anlıq aktiv olur.\n\nProvayderiniz siyahıda yoxdursa, “Xüsusi serverlər” seçin və server adlarını, portları və təhlükəsizliyi təkmil ayarlarda təyin edin. Sertifikatına heç bir mərkəzin zəmanət vermədiyi server ona etibar edilib-edilməməsini bir dəfə soruşur; barmaq izini provayderinizin göstərdiyi ilə müqayisə edin.\n\nKitab qoşulmuş məktubun (EPUB, PDF və s., 2 MB-a qədər) altında “Kitabı aç” var: faylı yükləyir, kitabxananıza qoyur və açır.\n\nPoçtu açmadan yeni məktubları görmək üçün Ayarlarda, “Poçt” altında “Arxa planda yeni poçtu yoxla” ayarını aktiv edin və nə qədər tez-tez olacağını seçin (hər 15, 30 və ya 60 dəqiqədən bir). Siz aktiv edənə qədər deaktivdir. Oxuyucu oyaq və onlayn olduqca vaxtaşırı təhlükəsiz bağlantı ilə qoşulur, hesabları bir-bir yoxlayır və ana ekranda oxunmamışların sayını yeniləyir. Bu, bir qədər batareya sərf edir. Poçtu açmaq gedən yoxlamanı dayandırır.\n\nAna ekran vidcetləri oxunmamışların sayını, ən son və ulduzlu məktubları, bir poçt qutusunu və məktub yazmaq üçün qısayolu göstərir."
