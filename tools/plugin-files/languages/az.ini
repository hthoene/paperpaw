profiles.plugin.name = Oxuma profilləri
profiles.plugin.description = Oxuma və ekran ayarlarının adlandırılmış dəstləri, bir toxunuşla dəyişdirilir.
profiles.plugin.how = "Profil oxuma ayarlarınızı, ekran ayarlarınızı və status sətirlərinizi “Gecə” və ya “Böyük şrift” kimi bir ad altında saxlayır və bir toxunuşla geri qaytarır.\n\n“Profillər”i oxuma menyusunda “Daha çox” bölməsində və ya Ayarlarda “Fərdiləşdir” bölməsində açın. İstifadə etmək üçün profilə toxunun; istifadədə olan işarələnib. Cari ayarları ona yazmaq, adını dəyişmək və ya silmək üçün onu basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın). “Yeni profil kimi saxla” hazırkı ayarları saxlayır.\n\n“Növbəti profil” siyahıdakı növbəti profilə keçir; onu düyməyə və ya qaydaya təyin edin."
