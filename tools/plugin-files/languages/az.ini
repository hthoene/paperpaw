keyboard.plugin.name = Klaviatura
keyboard.plugin.description = Ekranda toxunma və ya düymələrlə mətn daxil edir.
keyboard.plugin.how = "Klaviatura mətn lazım olan hər yerdə açılır: axtarış, parol, qeyd və ya ayar üçün. O, həm toxunma ilə, həm də yalnız düymələrlə işləyir.\n\nDüymələrlə sol və sağ sıra boyunca hərəkət edir, səhifə düymələri sıralar arasında keçir, “Seç” klavişi basır, “Geri” isə ləğv edir; sol və sağ sıranın sonundan əvvəlinə keçir, yuxarı və aşağı sizin sütununuzda qalır. Shift növbəti hərfi böyük edir; hamısının böyük olması üçün onu iki dəfə, dayandırmaq üçün isə bir dəfə də basın. Hərfi basılı saxlayanda (düymələrlə: onun üzərində “Seç” basılı saxlayın) onun dərhal seçilmiş böyük forması və é, è kimi aksentli variantları çıxır; alman dilində ä, ö, ü və ß belə a, o, u və s hərflərindən alınır (düymələrlə klaviatura bunu həmin hərflərin üstündə göstərir). OK yazmanı bitirir; düymələrlə istənilən yerdən bitirmək üçün “Geri” basılı saxlayın (təkcə “Geri” ləğv edir) və ya hərf olmayan klavişin üzərində “Seç” basılı saxlayın. “Yapışdır” mübadilə buferindəki mətni daxil edir, “Telefon” isə, təklif olunan yerdə, əvəzinə telefonunuzda yazmağa imkan verir.\n\nAyarlarda, “Cihaz”, “Klaviatura” altında: “Klaviatura düzümləri” düzümləri seçir. Standart olaraq menyu dilinə uyğundur; bir neçəsi seçiləndə bir klaviş onlar arasında keçir. “Umlaut klavişləri” bunun əvəzinə ä, ö, ü və ß üçün ayrıca klavişlər verir. “Ölçü” klavişləri və hərfləri böyüdür; yalnız düymələrlə sıralar kompüter klaviaturasındakı kimi qalır. Sensor ekranlarda “Klaviş forması” klavişlərin görünüşünü dəyişir. “Avtomatik böyük hərf” hər cümləni böyük hərflə başladır."
