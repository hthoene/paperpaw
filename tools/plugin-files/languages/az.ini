format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB kitablarını üslubları, mündəricatı və şəkilləri ilə açır.
format-epub.plugin.how = "EPUB kitabları kitabxanadan istənilən digər kitab kimi mündəricatı, şəkilləri və nəşriyyatın tərtibatı ilə açılır. Veb səhifələr (HTML), Markdown, FictionBook (.fb2) və komiks arxivləri (.cbz) də eyni cür açılır, hər biri ayrıca plagin kimi.\n\nFəsil ilk dəfə açılanda çevrilir və plaginin keşində saxlanılır, ona görə sonra daha tez açılır, böyük kitablar isə kiçik cihazlarda da işləyir. Mündəricatı oxuma menyusunda “Mündəricat” altında tapın. Kitabın öz tərtibatının tətbiq edilib-edilməməsini Oxuma bölməsindəki “Nəşriyyat formatı” ayarı müəyyən edir."
format-epub.title = EPUB e-kitabı
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook kitablarını (.fb2, sıxılmış da) açır.
format-fb2.plugin.how = "Rus və digər kitablarda geniş yayılmış FictionBook kitablarını (.fb2), sıxılmış olanları da (.fb2.zip) adı, müəllifləri, üz qabığı və fəsilləri ilə açır.\n\nOnları kitabxana qovluğuna qoyun; onlar kitabxanada görünür və istənilən digər kitab kimi açılır."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Fayl kimi saxlanılmış veb səhifələri açır, yalnız oxunacaq hissəni göstərir.
format-html.plugin.how = "Fayl kimi saxlanılmış veb səhifələri (.html, .htm, .xhtml) kitab kimi açır: ətrafındakı menyular, reklamlar və s. olmadan yalnız oxunacaq hissəni.\n\nFaylı kitabxana qovluğuna qoyun və istənilən kitab kimi kitabxanadan açın. Səhifə daxilindəki keçidlər işləyir; şəkillər faylda olduqları yerdə görünür."
format-html.title = Veb səhifə (HTML)
format-images.plugin.name = Şəkillər
format-images.plugin.description = Şəkilləri (.jpg, .png, .gif) kitab kimi açır, hər biri bir səhifə.
format-images.plugin.how = "Şəkillər (.jpg, .png, .gif) kitabxanadan kitab kimi açılır: hər səhifədə ekrana uyğunlaşdırılmış bir şəkil.\n\nBütün şəkil qovluğunu oxumaq üçün onun ilk şəklini açın: qovluqda ondan sonrakı şəkillər adlarının sırası ilə (2, 10-dan əvvəl) gəlir. Qovluqda daha sonrakı şəkil açılırsa, oxuma oradan başlayır; hər birində yer ayrıca yadda saxlanılır. Açdığınız şəkildən başlayaraq qovluğun 300-ə qədər şəkli oxunur.\n\nŞəkil olmayan və ya çox böyük olan fayl əvəzinə öz adını göstərir. Öz adı olan çoxlu şəkildən ibarət kitab üçün komiks arxivi (.cbz) daha yaxşı formadır."
format-images.title = Şəkil
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown fayllarını (.md), məs. qeydləri açır.
format-markdown.plugin.how = "Qeydlər kimi Markdown fayllarını (.md) kitab kimi açır: başlıqlar, siyahılar, sitatlar və vurğular işarə kimi deyil, nəzərdə tutulduğu kimi göstərilir.\n\nFaylları kitabxana qovluğuna qoyun və kitabxanadan açın. İlk başlıq onun adı olur; faylın yanındakı şəkillər mətnin onları çəkdiyi yerdə görünür."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI kitablar
format-mobi.plugin.description = DRM-siz .mobi və .azw fayllarını açır.
format-mobi.plugin.how = "MOBI kitablar (.mobi, .azw) kitabxanadan istənilən kitab kimi açılır, heç nə qurmaq lazım deyil. Ad, müəlliflər, dil və üz qabığı kitabın özündən götürülür, mündəricat isə onun başlıqlarından yaradılır.\n\nKitab ilk dəfə açılanda çevrilir; uzun kitabda bu bir neçə saniyə çəkir, sonra isə dərhal açılır. Mətn, başlıqlar, qalın və kursiv, keçidlər və şəkillər göstərilir.\n\nDRM-li kitablar (mağazadan alınan kitabların çoxu), Huffman sıxılmalı və ya daha yeni KF8 formatında (.azw3) olan kitablar açıla bilmir: onları açanda PaperPaw bunu bildirir. Calibre kimi alətlə hazırlanmış EPUB nüsxəsi həmişə açılır."
format-mobi.title = MOBI kitablar
format-rtf.plugin.name = RTF sənədlər
format-rtf.plugin.description = .rtf fayllarını kitab kimi açır.
format-rtf.title = RTF sənədlər
format-txt.plugin.name = Sadə mətn
format-txt.plugin.description = Sadə mətn fayllarını (.txt) açır.
format-txt.plugin.how = "Sadə mətn faylları (.txt) kitabxanadan istənilən kitab kimi açılır, heç nə qurmaq lazım deyil. Plagin UTF-8, UTF-16 və Windows-1252 mətnlərini oxuyur və kodlaşdırmanı özü müəyyən edir.\n\nAbzaslar fayldakı boş sətirlərə görə ayrılır; faylda boş sətir yoxdursa, hər sətir ayrıca abzasdır. Project Gutenberg fayllarında əvvəldəki və sondakı lisenziya mətni buraxılır, ad və müəllif isə faylın başlığından götürülür.\n\nFayl heç vaxt bütövlükdə yüklənmir, ona görə çox böyük mətnlər kiçik cihazlarda da açılır."
format-txt.title = Sadə mətn
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC və XTCH kitablarını – Xteink oxuyucuları üçün əvvəlcədən hazırlanmış səhifələri açır.
format-xtc.plugin.how = "XTC və XTCH faylları səhifələri artıq şəkil kimi hazırlanmış kitablardır; onları Xteink oxuyucuları üçün çeviricilər yaradır. Onlar kitabxanadan istənilən kitab kimi açılır.\n\nHər səhifə sabit şəkil olduğu üçün mətnin ölçüsünü və şriftini dəyişmək olmur. Səhifələr ağ-qaradır və ya dörd boz çalarlıdır. Hər səhifə yalnız göstəriləndə açılır, ona görə az yaddaş lazımdır, X4-də də.\n\nAd, müəllif və fəsillər faylda varsa, oradan götürülür."
format-xtc.title = XTC səhifələri
help.plugin.name = Göstərişlər
help.plugin.description = Ekran ilk dəfə açılanda onun idarəetməsinin nə etdiyini göstərir.
help.plugin.how = "Ekran ilk dəfə açılanda onun üstündə qısa qeyd idarəetmənin nə etdiyini deyir: toxunmaların aid olduğu ekran hissələri çərçivəyə alınır, düymələrin nə etdiyi də yazılır.\n\nToxunma və ya istənilən düymə qeydi bağlayır və o, həmin ekranda bir daha çıxmır. “Göstəriş lazım deyil” hamısını söndürür.\n\nAyarlarda, “Sistem” altında “Göstərişlər” onları yandırır və ya söndürür, “Göstərişləri yenə göstər” isə hər ekranın qeydini bir dəfə də göstərir."
