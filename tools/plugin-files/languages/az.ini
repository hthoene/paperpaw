setup.plugin.name = Quraşdırma
setup.plugin.description = İlk başlanğıcda vacib ayarlar üzrə qısa bələdçi.
setup.plugin.how = "Quraşdırma vacib ayarlar üzrə qısa bələdçidir və yalnız bir dəfə, PaperPaw ilk dəfə başlayanda göstərilir. Hər səhifə bir şey soruşur, məsələn, dil, düymələr, mətn ölçüsü, saat qurşağı, Wi-Fi və ya əlavə ediləcək bir neçə plagin; məqsədəuyğun cavab artıq seçilib, ona görə Növbəti həmişə doğrudur. Bu cihaza lazım olmayan addımlar buraxılır.\n\nDüymələrə toxunun və ya yuxarı və aşağı düymələrindən və Seç düyməsindən istifadə edin. Birinci səhifədəki Ötür quraşdırmadan dərhal çıxır. Son səhifə kitablarınızın haradan gəldiyini izah edir.\n\nOnu yenidən işə salmaq üçün ayarları açın və PaperPaw-u quraşdır seçin. Burada seçilən hər şeyi sonra ayarlarda dəyişmək olar."
