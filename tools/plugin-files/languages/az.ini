anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Kompüterinizdəki Anki-nin vaxtı çatmış kartlarını öyrənir və cavablarınızı AnkiConnect əlavəsi vasitəsilə geri göndərir.
anki.plugin.how = "Anki kompüterinizdəki Anki-də vaxtı çatmış kartları oxuyucuda öyrənməyə imkan verir və cavablarınızı geri göndərir. O, pulsuz AnkiConnect əlavəsindən (əlavə kodu 2055492159) istifadə edir, AnkiWeb-dən isə heç vaxt. Əvvəlcə deaktivdir: onu Plagin mağazasından əlavə edin.\n\nKompüterdə: Anki-də AnkiConnect əlavəsini quraşdırın (Tools, Add-ons, Get Add-ons) və Anki-ni yenidən başladın. Sinxronlaşdırma zamanı Anki açıq olmalıdır.\n\nStandart olaraq AnkiConnect yalnız işlədiyi kompüterə (127.0.0.1) cavab verir, ona görə oxuyucu ona çata bilmir. Tools, Add-ons, AnkiConnect, Config açın və “webBindAddress” dəyərini “0.0.0.0” edin (ev şəbəkəsini dinləmək). Port, yəni “webBindPort”, dəyişməsəniz 8765-dir. Orada “apiKey” təyin etsəniz, burada eyni açarı daxil edin. Konfiqurasiyanı dəyişdikdən sonra Anki-ni yenidən başladın və soruşarsa, kompüterin firewall-unda Anki-yə icazə verin. Bundan yalnız etibar etdiyiniz şəbəkədə istifadə edin: orada hər kəs AnkiConnect-ə çata bilər, ona görə açar təyin etmək yaxşı fikirdir.\n\nOxuyucuda: Alətlərdən Anki-ni açın, sonra Kompüter bölməsinə kompüterin ünvanını (məsələn, 192.168.1.20), 8765 deyilsə portu və təyin etmisinizsə API açarını daxil edin. Dəstə seçin və ya bütün dəstələr üçün boş saxlayın. Sonra Wi-Fi aktiv olduqda Anki ilə sinxronlaşdır seçin: əvvəlcə gözləyən cavablarınız göndərilir, sonra vaxtı çatmış kartlar (və təyin etdiyiniz sayda yeni kart), ən çox 50, gətirilir. Onları şəbəkəsiz keçmək üçün Öyrən seçin: cavabı göstərin və Yenidən, Çətin, Yaxşı və ya Asan kimi qiymətləndirin. Cavablarınız Wi-Fi olmadan da oxuyucuda saxlanılır və növbəti sinxronlaşdırma ilə Anki-yə gedir. Kartın nə vaxt qayıdacağına Anki qərar verir: Yenidən cavablandırdığınız kart Anki onun vaxtının çatdığını bildirəndə sonrakı sinxronlaşdırma ilə yenidən gətirilir.\n\nAyarlardakı Anki açılanda sinxronlaşdır ekranı hər dəfə açdığınızda sinxronlaşdırır. Düymə basanda heç nə şəbəkədən istifadə etmir."
