puzzles.plugin.name = Tapmacalar
puzzles.plugin.description = Sudoku, krossvordlar və şahmat tapşırıqları, oflayn, günün tapmacası ilə.
puzzles.plugin.how = "Qatar və gözləmə zalı üçün tapmacalar, hamısı oflayn: sudoku, krossvordlar və şahmat tapşırıqları. “Tapmacalar”ı alətlər menyusundan açın və ya “Günün tapmacası” vidcetini ana ekrana əlavə edin (ana ekranı basılı saxlayın, sonra vidcet əlavə edin): o, bugünkü sudokunun nə qədər irəlilədiyini göstərir, toxunduqda isə onu açır. Günün sudokusu bütün gün eynidir.\n\nSudoku: sol və sağ kursoru xana-xana, yuxarı və aşağı (səhifə düymələri) bir sıra hərəkət etdirir. Seç rəqəmləri açır: birini götürün və onu yazmaq üçün yenidən seçin, ya da xananı boşaltmaq üçün “Təmizlə”. Lövhənin altındakı düymələrə keçmək üçün Seç (və ya Menyu) düyməsini basılı saxlayın: “Qeydlər” rəqəmləri karandaş işarələrinə çevirir, “Yoxla” səhv xanaları işarələyir, “Geri al” son gedişi geri qaytarır, “Yeni” seçdiyiniz səviyyədə (Asan, Orta, Çətin) tapmaca başladır. Hər tapmacanın dəqiq bir həlli var. Çıxdıqda oyun saxlanılır. Sensor ekranda xanaya toxunun.\n\nKrossvordlar: .puz (Across Lite) və ya .ipuz fayllarını yaddaş kartındakı “puzzles” qovluğuna qoyun; heç biri daxil deyil. Şəbəkədə hərəkət edin, sonra kursorun altındakı sözü klaviaturada yazmaq üçün seçin (alt xətt xananı boş saxlayır). Düymələr üfüqi və şaquli arasında keçir, suallar siyahısını göstərir, hərfləri yoxlayır və sözü açır. Hərflər hər fayl üçün saxlanılır. Şifrələnmiş .puz faylları açıla bilməz.\n\nŞahmat tapşırıqları: Lichess tapşırıqlar bazasından kiçik dəst (CC0). Sol və sağ fiqurdan fiqura keçir, hərəkət etdirmək istədiyiniz fiquru seçin, sonra sol və sağla onun gedə biləcəyi xanaları gəzin və yenidən seçin. Səhv gediş geri qaytarılır. “İpucu” gediləcək fiquru işarələyir, “Növbəti” növbəti tapşırığa keçir.\n\nLövhə yalnız dəyişən xanaları yenidən çəkir. “Statistika” həll etdiyiniz tapmacaları sayır."
