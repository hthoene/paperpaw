opds.plugin.name = OPDS kataloqları
opds.plugin.description = OPDS kataloqlarına baxır, onların kitablarını endirir və qovluqları onlarla sinxron saxlayır.
opds.plugin.how = "OPDS kataloqları Project Gutenberg, Calibre-Web, Kavita və ya Komga kimi onlayn kitabxanalardır. Bu plagin onlara qovluq kimi baxır, onlarda axtarır və kitablarını kitabxanaya endirir.\n\nAlətlər menyusunda “Kataloqlar”ı açın və “Kataloq əlavə et” seçin: ünvan, kataloq hesab tələb edirsə, istifadəçi adı və parol. Kataloqa baxmaq üçün ona toxunun; sinxronlaşdırmaq, redaktə etmək və ya silmək üçün onu basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın).\n\n“Bu kataloqu sinxronlaşdır” aktiv olduqda “Kataloqları sinxronlaşdır” onun yeni kitablarını öz qovluğuna endirir. “Hər sinxronda kitab” bir sinxronizasiyanın neçə kitab gətirəcəyini məhdudlaşdırır ki, böyük kataloq cihazı doldurmasın. Kataloq əvəzinə bulud qovluğu (WebDAV) da işləyir."
