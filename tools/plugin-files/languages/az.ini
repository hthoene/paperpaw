keys.plugin.name = Düymələr və jestlər
keys.plugin.description = Hər düymənin, toxunma zonasının və sürüşdürmənin nə etdiyi; cihazın özündə dəyişdirilir.
keys.plugin.how = "“Düymələr və jestlər” hər düymənin, toxunma zonasının və sürüşdürmənin nə etdiyini göstərir və bunu cihazın özündə dəyişməyə imkan verir.\n\nOnu ayarlarda, “Cihaz” altında açın. Əvvəlcə dəyişikliyin harada tətbiq olunacağını seçin: “Hər yerdə”, “Oxuyarkən”, “Ana ekranda”, “Kitabxanada” və ya bir alətdə. Sonra basılı saxlanan düymə və ya kənardan içəri sürüşdürmə kimi bir giriş seçin və axtarış edə biləcəyiniz siyahıdan əməliyyat seçin. “Standart” plaginlərin və düymə düzümünün təyin etdiyini geri qaytarır.\n\nX4-də seçmək, geri qayıtmaq və ya irəli keçmək üçün heç bir düymə saxlamayan dəyişiklik qəbul edilmir. Sondakı “Düymələri və jestləri sıfırla” bütün dəyişiklikləri geri alır."
