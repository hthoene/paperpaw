vocabulary.plugin.name = Söz ehtiyatı
vocabulary.plugin.description = Axtardığınız sözləri cümlələri ilə saxlayır və telefonda hazırlanmış öyrənmə kartlarını aralıqlı təkrarla soruşur.
vocabulary.plugin.how = "Söz ehtiyatı oxuyarkən axtardığınız sözləri, hər birini öz cümləsi ilə, sonra təkrar baxmaq üçün saxlayır. Siyahını Alətlərdə tapa bilərsiniz, ən yeniləri əvvəldə; sözü yenidən axtarmaq üçün onu seçin. Sonuncu sətir, İxrac et, sözləri Anki kimi kart tətbiqləri üçün yadda saxlayır. Siyahı ən yeni 2.000 sözü saxlayır: bundan artıq olanda ən köhnələri silinir, ona görə hamısını saxlamaq üçün əvvəlcə onları ixrac edin.\n\nÖyrənmə kartları, yenə Alətlərdə, aralıqlı təkrarla sizi yoxlayır: Cavabı göstər seçdikdən sonra hər kartı Yenə, Çətin, Yaxşı və ya Asan ilə qiymətləndirirsiniz və bu, kartın nə vaxt qayıdacağını müəyyən edir. Dəstləri Telefonla redaktə et ilə yaradın: kodu eyni Wi-Fi şəbəkəsindəki telefonla skan edin, sonra kartları yazın və ya bir dəfəyə çoxunu əlavə edin: orada dəsti açın, Bir dəfəyə çox kart seçin və CSV, TSV və ya TXT faylı seçin (hər sətirdə bir kart: ön üz, arxa üz, nümunə; UTF-8), siyahı yapışdırın və ya Anki dəsti gətirin (.apkg, “Support older Anki versions” ilə ixrac edilmiş).\n\nVə ya SD kartdakı fayllardan istifadə edin: hər dəst üçün Flashcards qovluğuna bir CSV, TSV və ya TXT faylı, yaxud Anki dəsti (.apkg, “Support older Anki versions” ilə ixrac edilmiş) qoyun (İspanca.tsv İspanca dəstini yaradır; hər sətirdə bir kart: ön üz, arxa üz, nümunə; UTF-8 kimi yadda saxlanılmış; birinci sətir sütunları front, back, example kimi adlandıra bilər). Öyrənmə kartlarında SD kartdakı kartlar seçin və ya qoyun bu, Öyrənmə kartlarını açanda özü baş versin. Dəstlər öyrəndiklərinizlə birlikdə oxuyucuda qalır və fayl yeni və ya dəyişdirilmiş olduqda öz dəstinə birləşdirilir: faylda kartın arxa üzünü və ya nümunəsini dəyişsəniz, kart dəyişir və irəliləyişini saxlayır; ön üz mətnini dəyişsəniz, bu yeni kart sayılır, köhnəsi sıfırdan başlayır (kartlar ön üz mətninə görə fərqləndirilir; boşluqlar və böyük-kiçik hərflər nəzərə alınmır); sildiyiniz sətir kartı silmir (əgər həmin dəst üçün “faylda olmayan kartlar” ayarında Sil seçməmisinizsə: onda kart növbəti yeniləmədə irəliləyişi ilə birlikdə birdəfəlik silinir, faylın hansısa sətri oxuna bilmədiyi müddətdə isə heç nə silinmir). Dəsti Karta yaz ilə öz faylına yazın: fayl kartların nömrələrini (id sütunu) alır, beləliklə ön üzləri kompüterdə redaktə edə bilərsiniz və kartlar öyrəndiklərinizi saxlayır; fayl yalnız id, ön üz, arxa üz və nümunəni saxlayır (digər sütunlar, şərhlər və sətirlərin sırası saxlanılmır), faylın hansısa sətri oxuna bilmədikdə isə yazma rədd edilir; əvvəlki fayl ilk dəfə _ad.bak.tsv faylına köçürülür (sonrakı yazma bu nüsxəni əvəz etmir). 4 MiB-dan və ya 20.000 sətirdən böyük fayl oxunmur və o, UTF-16 deyil, CSV UTF-8 kimi yadda saxlanılmalıdır. İlk dəfə oxuyucu qovluğu necə işlədiyini izah edən qeydlə birlikdə yaradır.\n\nAyarlarda, Oxuma altında, Axtarılan sözlərdən kart yarat hər axtarılan sözü Axtarılanlar dəstinə əlavə edir."
