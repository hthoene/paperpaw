bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Pultları, klaviaturaları və sensorları cütləşdirir və qoşur.
bluetooth.plugin.how = "Bluetooth oxuyucuda Bluetooth varsa (X4 Pro), pultları, klaviaturaları və sensorları onunla cütləşdirir.\n\nCihaz əlavə et əlçatan cihazları axtarır; əvvəlcə cihazı cütləşdirmə rejiminə keçirin. Onu seçin və oxuyucuda təsdiq edin (rəqəm göstərilirsə, müqayisə edin). Bundan sonra pultun və ya klaviaturanın düymələri səhifə çevirir və menyularda hərəkət edir; hər düymənin nə etdiyini İdarəetmə bölməsində dəyişin.\n\nPultlar onların düymələrinin nə vaxt işlədiyini bildirir: burada aktiv edildikdə, oxuma zamanı (kitab açıq olduqca qoşulur, batareyaya qənaət edir) və ya həmişə. Cihazda Menyu düyməsi və ya uzun basma onu unudur.\n\nSensor plaginlər üçündür: hansı plaginin ondan istifadə edə biləcəyini aktiv edin. Heç nə istifadə etmədikdə Bluetooth deaktiv olur."
