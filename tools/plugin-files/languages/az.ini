settings.plugin.name = Ayarlar
settings.plugin.description = Bütün plaginlərin ayarlarından qurulan ayar səhifələri.
settings.plugin.how = "Ayarlar PaperPaw və onun plaginlərində tənzimlənə bilən hər şeyi səhifə-səhifə göstərir. Plaginlərə öz ekranı lazım deyil: onların bildirdikləri burada qruplar şəklində görünür, hər ayarın təsviri isə onun altında olur.\n\nOnu menyudakı Ayarlar ilə açın. Qrupu açmaq üçün ona, sonra ayarı dəyişmək və ya seçmək üçün ayara toxunun; rəqəmlərin − və + düymələri var. Düymələrlə ayara keçin və Seç düyməsini basın: sol və sağ rəqəmi dəyişir, Seç onu saxlayır, Geri əvvəlki dəyəri qaytarır.\n\nDəyişikliklər dərhal tətbiq olunur. Axtarış ayarı sözlərə görə tapır, Əlavə ayarlar isə nadir hallarda lazım olanları da göstərir. Standarta sıfırla və Hamısını sıfırla əvvəlcə soruşur."
