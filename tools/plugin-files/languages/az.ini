wifi.plugin.name = Wi-Fi
wifi.plugin.description = Lazım olduqda Wi-Fi şəbəkələrinə qoşulur, sonra isə Wi-Fi modulunu söndürür.
wifi.plugin.how = "Plaginə internet lazım olduqda (kataloq, sinxronizasiya, mağaza, ötürmə) Wi-Fi şəbəkəyə qoşulur, batareyaya və yaddaşa qənaət etmək üçün isə heç nə istifadə etmədikdən bir dəqiqə sonra, yaxud Ana ekran və ya kitab göründükdə dərhal Wi-Fi modulunu söndürür.\n\nWi-Fi bölməsini Ayarlardan və ya status sətrindəki Wi-Fi elementindən açın. Şəbəkələr əhatə dairəsindəki şəbəkələri göstərir: birini seçib parolunu yazın və ya Telefonla qur seçimini edin və adı ilə parolu cihazda deyil, telefonunuzun brauzerində yazın. Unut saxlanmış şəbəkəni silir.\n\nParollar kartda təhlükəsiz saxlanılır və bir daha göstərilmir. Lazım olduqda qoşul bölməsində Wi-Fi modulunun son istifadədən sonra nə qədər aktiv qalacağını, şarj zamanı aktiv qalıb-qalmayacağını və bir neçə şəbəkə əhatədə olduqda hansı saxlanmış şəbəkənin birinci seçiləcəyini təyin edirsiniz."
