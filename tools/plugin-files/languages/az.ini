pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = İş və fasilə raundları, vidcetlər və gündəlik sayğacı olan fokus taymeri.
pomodoro.plugin.how = "Pomodoro taymeri: diqqətli raundlarla işləyin, sonra dincəlin. Heç bir quraşdırma tələb etmir: 25 dəqiqə fokus, 5 dəqiqə istirahət, dörd raunddan sonra isə 15 dəqiqəlik uzun fasilə.\n\nPomodoro-nu alətlər menyusundan açın və “Başla” basın, ya da onun vidcetlərini ana ekrana əlavə edin (ana ekranı basılı saxlayın, sonra vidcet əlavə edin): “Pomodoro taymeri” mərhələni və qalan dəqiqələri göstərir, “Pomodoro başla/fasilə” düymədir, “Pomodoro bu gün” isə bitirdiyiniz raundları gündəlik hədəfinizlə birlikdə sayır. Taymerə toxunmaq onu başladır və ya dayandırır; tam ekranı açmaq üçün onu basılı saxlayın.\n\nEkrandan çıxdıqda taymer işləməyə davam edir, yenidən başladıqdan sonra isə saata görə davam edir. Oxuyucu yuxu rejimində olanda heç nə işləmir: bu arada bitən mərhələ oyananda bildirilir. Mərhələ bitəndə bildiriş sizə xəbər verir. Batareyaya qənaət üçün saat dəqiqədə bir dəfə yenilənir (tam ekranda son dəqiqədə hər on saniyədən bir) və oxuyucunu heç vaxt oyaq saxlamır.\n\nAyarlarda “Pomodoro” bölməsində müddətləri, bir dəstdəki raundların sayını və növbəti mərhələnin özü başlayıb-başlamamasını təyin edirsiniz. “Daha çox” bölməsində: mərhələ bitəndə ekranın yanıb-sönməsi və ya işığın sayrışması, həmçinin gündəlik hədəf."
