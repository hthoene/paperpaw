translate.plugin.name = Tərcümə
translate.plugin.description = Seçilmiş mətni DeepL ilə onlayn tərcümə edir.
translate.plugin.how = "Tərcümə seçilmiş mətni DeepL ilə onlayn tərcümə edir. Kitabda mətni seçin və seçilmiş mətnin menyusunda “Tərcümə et” seçin: tərcümə lüğət məqaləsi kimi səhifənin üstündə görünür. Səhifə düymələri və ya toxunmalar onu sürüşdürür, Seç düyməsi və ya sonunda toxunma onu bağlayır.\n\nBunun üçün şəbəkə və deepl.com saytında pulsuz əldə edilən öz DeepL API açarınız lazımdır (DeepL API Free, ayda təxminən 500.000 simvol). Açarı daxil edənə qədər panel bunu bildirir, toxunduqda isə açarı soruşur.\n\nAyarlarda, Oxuma bölməsində, Tərcümə hissəsində “Tərcümə dili” dili təyin edir; əvvəlcə PaperPaw-un öz dilidir."
