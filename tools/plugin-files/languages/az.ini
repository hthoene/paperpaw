sleep.plugin.name = Yuxu ekranı
sleep.plugin.description = Cihaz yuxu rejimində olanda yatan pişik, kitabın üz qabığı, şəkilləriniz və ya mesaj göstərir.
sleep.plugin.how = "Yuxu ekranı cihaz yuxu rejimində olanda ekranda nə göstəriləcəyini müəyyən edir. E-ink ekran təsviri enerjisiz saxlayır.\n\nOnu ayarlarda, Cihaz, Yuxu ekranı bölməsində, Göstər ayarı ilə seçin: yatan pişik (standart), kitabın üz qabığı, mənim şəkillərim, loqo və “Yuxu rejimində”, vidcetlər, səhifə olduğu kimi və ya şəkilli səhifə. Mənim şəkillərim Şəkillər qovluğundakı faylları bir-bir göstərir.\n\nÜz qabığı və ya şəkil yoxdursa, pişik göstərilir. Yuxu ekranını sistemin özü çəkdiyi yerdə bu ayarlar gizlədilir.\n\nSöndürmə ekranı (Söndürüləndə göstər) cihaz söndürüləndə bir dəfə çəkilir: qidalanma menyusundan və ya Yuxudan sonra söndür ayarındakı vaxt keçəndə (batareya bitib enerji kəsiləndə yox). Siz loqo və “Söndürülüb”, pişik, üz qabığı və ya mənim şəkillərim seçməsəniz, o, yuxu ekranı kimidir. Başqa plagin onun üçün ekran təklif edə bilər.\n\nBaşlanğıc və yenidən başlatma ekranı (Başlayanda göstər və Yenidən başlayanda göstər), başqa plagin onlar üçün ekran təklif etmirsə, cihazın öz ekranıdır. Cihaz başlayarkən plaginlər hələ işləmir: başlanğıc üçün seçilmiş ekran əvvəlcədən, cihaz söndürüləndə və ya yenidən başladılanda çəkilir və növbəti başlanğıcda göstərilir. Vaxtında hazır olmayan ekran və ya zədələnmiş şəkil cihazın öz ekranına yer verir; cihaz hər halda söndürülür və ya yenidən başladılır."
