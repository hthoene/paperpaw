battery.plugin.name = Batareya sərfi
battery.plugin.description = Batareyanı qeydə alır və onun nə qədər davam etdiyini göstərir.
battery.plugin.how = "Batareya sərfi cihaz oyaq olduqca təxminən dəqiqədə bir dəfə şarj səviyyəsini və cihazın nə etdiyini qeyd edir: ekran yeniləmələri və çevrilən səhifələr. Bundan oyaq keçən bir saatın və 100 səhifənin nə qədər sərf etdiyini və bu tempdə batareyanın nə qədər davam edəcəyini hesablayır.\n\nBatareyanı Alətlər menyusundan açın. O, indiki şarjı, bu dəfəki oyaqlıq müddətini, indiyədək batareya ilə sərfi və son oyaqlıq müddətlərinizi göstərir. Səhifə düymələri ilə və ya yuxarıdakı oxlara toxunaraq vərəqlənir.\n\nRəqəmlərin mənalı olması üçün bir müddət batareya ilə oxumaq lazımdır. Qeydə alma standart olaraq aktivdir və Ayarlarda, Cihaz, Enerji altında Batareya sərfini qeydə al ilə söndürülə bilər."
