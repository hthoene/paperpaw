menu.plugin.name = Menyu
menu.plugin.description = Ekranın aşağısında əməliyyatlar və ayarlar olan menyu.
menu.plugin.how = "Menyu nə edə və nəyi ayarlaya biləcəyinizi göstərir. O, ekranın aşağısında, açıq olan hər şeyin üstündə açılır: oxuyarkən ekranın ortasına toxunun və ya Seç düyməsini basın. Elementi işə salmaq üçün ona toxunun və ya onu seçin.\n\nMenyudakı ayarlar öz dəyərini göstərir və yerindəcə dəyişir, ona görə menyu açıq qalır. Daxilində başqa elementlər olan element alt menyu açır.\n\nSürətli panel üçün yuxarı kənardan aşağı sürüşdürün: tez-tez dəyişdiyiniz şeylər, düymələr şəklində. Düyməni keçirmək üçün ona toxunun, ayarları üçün basılı saxlayın. Yalnız düymələrlə ox düymələri seçir, “Seç” keçirir, “Geri” isə bağlayır. “Görünüş” altında “Menyular” menyuları siyahı və ya plitələr şəklində göstərir."
