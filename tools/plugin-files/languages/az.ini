widgets.plugin.name = Vidcet paketi
widgets.plugin.description = Ana ekran üçün daha çox vidcet: saatlar, təqvim, sitatlar, kitablar, qeydlər və s.
widgets.plugin.how = "Vidcet paketi ana ekrana çoxlu vidcet əlavə edir: saatlar (əqrəbli, sözlü, kafelli, dünya saatı), təqvim, ilin keçən hissəsi, geri sayım, Ayın fazası, gün və tarix; günün sitatı, qeydlər, tapşırıqlar, şəkillər, salamlama və PaperPaw loqosu; kitablar üçün isə indi oxunan, irəliləyiş, növbəti kitab, seriya, sevimlilər, vurğulama və rəqəmlərlə kitabxana. Batareya vidceti də buradadır.\n\nOnları menyuda “Ana ekranı redaktə et” ilə (və ya ana ekranda uzun basmaqla), sonra “Vidcet əlavə et” ilə əlavə edin. Hər birinin çərçivə, ölçü və düzləndirmə kimi öz ayarları var. Dəyişən vidceti, məsələn, günün sitatını seçdikdə növbətisi göstərilir. Öz sitatlarınızı kartdakı .paperpaw/plugins/widgets qovluğunda quotes.txt faylına yazın, hər sətirdə: mətn | müəllif. Vaxt vidcetləri üçün saat qurulmalıdır; onu Wi-Fi qurur."
