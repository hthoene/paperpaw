launcher-simple.plugin.name = Sadə ana ekran
launcher-simple.plugin.description = Sakit başlanğıc ekranı: böyük saat, kartlar, dok və dairəvi keçiricili sürətli panel.
launcher-simple.plugin.how = "Sadə ana ekran yalnız əsas şeylərə ehtiyacı olanlar üçün sakit başlanğıc ekranıdır: böyük saat, oxuduğunuz kitab, böyük kartlar şəklində kitabxana və mağaza, aşağıda isə üç nişanlı dok. Heç bir quraşdırma tələb etmir.\n\nOnu Ayarlarda, ana ekran bölməsində seçin. Onun sürətli panelində (onu da Ayarlarda panel kimi seçin) böyük dairəvi keçiricilər, cihazda işıq varsa işıq üçün zolaq və mətn ölçüsü üçün zolaq var. Düymələrlə ox düymələri fokusu hərəkət etdirir, “Seç” isə hissənin dediyini edir; zolaqda onda bir əlavə edir, sondan isə əvvələ qayıdır. Toxunma ilə hissəyə toxunun və ya zolağa istədiyiniz yerdə toxunun.\n\nKitabxana kitablarınızı kartlar şəklində, sonuncu açılanı birinci olmaqla, səhifə-səhifə göstərir və adi oxuyucunu açır.\n\nOnu Ayarlarda, “Sadə ana ekran” altında fərdiləşdirin: əsas menyu kimi redaktə etdiyiniz üç siyahı var. Kartlar: ana ekranın hansı kartları hansı ardıcıllıqla göstərdiyi. Dok: dokda hansı nişanların olduğu, istənilən plaginin istənilən əməliyyatı. Sürətli panel: hansı keçirici və zolaqları göstərdiyi. Ekranda yer olmayan kart sondan başlayaraq buraxılır. “Sadə ana ekran” altında tarixin və batareyanın göstərilib-göstərilməməsini də seçirsiniz."
