diagnostics.plugin.name = Diaqnostika
diagnostics.plugin.description = Test ekranı və cihazın hər hissəsinin addım-addım yoxlanışı.
diagnostics.plugin.how = "Diaqnostika cihazı yoxlamaq üçün test ekranıdır: ekranın göstərə bildiyi hər boz çaları, düymələri və toxunmanı sınamaq üçün dörd xana, yeniləmə rejimlərini müqayisə etmək üçün isə irəliləyiş zolaqlı səhifə sayğacı göstərir.\n\nTest ekranının menyuda bəndi yoxdur. O, yalnız başqa heç bir plagin ana ekran təklif etmədikdə və ya onu plagin menecerində Ekranlar altında Ana ekran yeri üçün seçdikdə ana ekran olur.\n\nSeç fokusdakı xananı işarələyir, ox düymələri xanalar arasında keçir; toxunma ilə xanaya toxunun. Səhifə düymələri test səhifələrini çevirir. Yenidən başlamaq üçün Seç düyməsini və ya barmağınızı ekranda basılı saxlayın.\n\nCihaz yoxlanışı (PaperPaw cihazın proqram təminatı olduqda Alətlər altında) cihazın hər hissəsini bir-bir, səhifə-səhifə keçir: ekran, düymələr, toxunma, işıq, batareya, kart, saat, Wi-Fi, yuxu rejimi və yaddaş. Hər səhifə Uğursuz, Ötür və Uğurlu ilə bitir; ölçmələrin təklif etdiyi cavab seçilmiş olur. Cihazda olmayan hissələr ötürülür. Hər cavabdan sonra o, pull request-ə yapışdırmaq üçün .paperpaw/plugins/diagnostics/device-check.txt faylına hesabat yazır. Geri ondan çıxır, yenidən açanda qaldığı yerdən davam edir. Yalnız düymələri olan cihazda əvvəlcə düymələr səhifəsində Başla seçin; o vaxta qədər oxlar, Seç və Geri hər səhifədəki kimi işləyir."
