stats.plugin.description = Nə qədər vaxt və nə qədər oxuduğunuzu təqvim və hər kitabın rəqəmləri ilə qeyd edir.
stats.plugin.how = "Oxuma statistikası hər səhifəni nə qədər oxuduğunuzu qeyd edir. Onu bu gün, həftə və ardıcıl seriyanızla icmal kimi, təqvim kimi və hər kitabın rəqəmləri ilə görürsünüz.\n\nOnu Alətlərdən və ya oxuyucuda Daha çox menyusundan açın. Ayarlarda, Oxuma statistikası bölməsində, Oxumanı qeyd et ayarını deaktiv edə, Gündəlik hədəf təyin edə və nəzərə alınan Ən qısa səhifə və Ən uzun səhifə müddətlərini təyin edə bilərsiniz ki, vərəqləmə və ya açıq qalmış kitab rəqəmləri təhrif etməsin.\n\nKOReader ilə sinxronlaşdır statistikanı WebDAV qovluğu vasitəsilə KOReader ilə bölüşür. O, eyni cihazdakı KOReader statistikasını da qəbul edir. Qeyd üçün saat qurulmalıdır: qurulmayıbsa, bir dəfə Wi-Fi şəbəkəsinə qoşulun."
