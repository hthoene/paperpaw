lock.plugin.name = Ekran kilidi
lock.plugin.description = Cihaz oyananda PIN, naxış və ya parol; oxuyarkən toxunma kilidi.
lock.plugin.how = "Ekran kilidi PaperPaw başlayanda və cihaz oyananda PIN, naxış və ya parol soruşur. Əvvəlcə deaktivdir. O, yalnız təsadüfi istifadənin qarşısını alır: kod və yanlış cəhdlərin sayı SD kartda saxlanılır, ona görə kartı çıxaran, redaktə edən və ya dəyişən kilidi keçə bilər.\n\nOnu ayarlarda, “Cihaz”, “Ekran kilidi” altında qurun: varsa, istifadə olunan kodu daxil edin, növü seçin, sonra yeni kodu iki dəfə daxil edin. Naxış yalnız sensor ekranlarda təklif olunur.\n\nBeş yanlış cəhddən sonra növbəti cəhd yarım dəqiqə gözləyir. “İndi kilidlə” dərhal kilidləyir və düyməyə, jestə və ya qaydaya təyin edilə bilər. “Oyandıqdan sonra kilidlə” deaktiv edilə bilər, onda yalnız real başlanğıc (yandırma və ya yenidən başlatma) kilidləyir; hər oyanmanın başlanğıc olduğu hallar istisnadır, məsələn, batareya ilə işləyən X4.\n\nYanında toxunma kilidi var: sürətli paneldə və oxuma menyusunda “Toxunmanı kilidlə” toxunma, sürüşdürmə və qələmi təsirsiz edir, düymələr isə işləməyə davam edir, məsələn, əliniz ekranın üstündə olarkən oxumaq üçün. Kilidi açmaq üçün bir barmaqla iki dəfə toxunun və barmağı bir an saxlayın; qidalanma düyməsini basılı saxlamaq “Qidalanma” menyusunu açır, orada “Toxunmanın kilidini aç” bunu düymələrlə edir; X4 Pro-da ana ekran düyməsini basılı saxlamaq kilidi dərhal açır."
