reader.plugin.name = Oxuyucu
reader.plugin.description = Kitabları səhifə-səhifə göstərir, mündəricat və oxuma ayarları ilə.
reader.plugin.how = "Oxuyucu kitabları səhifə-səhifə göstərir. Kitabı kitabxanadan açın; sonuncu kitab başlanğıcda yenidən açıla bilər (“Başlanğıcda son kitabı aç” ayarı).\n\nSəhifə çevirmək üçün ekranın sol və ya sağ tərəfinə toxunun, ya da səhifə düymələrindən istifadə edin. Oxuma menyusu üçün ortaya toxunun və ya Seç düyməsini basın: Mündəricat, Axtarış, Səhifəyə keç, Şrift və tərtibat, Əlfəcinlər və vurğulamalar və s. Yuxarı kənardan aşağı sürüşdürmək sürətli paneli açır, aşağı kənardan yuxarı sürüşdürmək ana ekrana aparır; Geri düyməsini basılı saxlamaq da belədir.\n\nŞəkli tam ekranda görmək üçün Seç düyməsini (və ya şəkli) basılı saxlayın: sol və sağ səhifənin şəkilləri arasında keçir. Seç 2x, 3x böyüdür və geri qaytarır (sensorda iki dəfə toxunun); böyüdülmüş halda sol və sağ yana sürüşdürür, səhifə düymələri (və ya sürüşdürmə) eninə, sonra aşağı irəliləyir. Geri əvvəlcə ekrana sığdırır, sonra səhifəyə qaytarır (sensorda çıxmaq üçün basılı saxlayın). Əlfəcin üçün yuxarı sağ küncə toxunun. Sözü vurğulamaq üçün onu basılı saxlayın. Düymələrlə sol düyməni basılı saxlayın: sol və sağ sözbəsöz, səhifə düymələri sətirbəsətir hərəkət edir, onları basılı saxlamaq səhifənin kənarlarına və abzasbaabzas aparır; Seç söz üçün vurğulama panelini açır, Seç düyməsini basılı saxlamaq seçimi cümləyə və abzasa genişləndirir (sonra sol və sağ sonu, basılı saxlandıqda isə əvvəli hərəkət etdirir). Seçim səhifə çevrildikdə də davam edir. “Markdown kimi ixrac et” qeydlərinizi yadda saxlayır."
