format-docx.plugin.name = DOCX sənədləri
format-docx.plugin.description = Word və digər proqramların saxladığı .docx fayllarını açır.
format-docx.plugin.how = "DOCX sənədlərini (.docx) kitab kimi açır: mündəricatlı başlıqlar, siyahılar, cədvəllər, qalın və kursiv, keçidlər və şəkillər (JPEG, PNG, GIF).\n\nFaylları kitabxana qovluğuna qoyun və kitabxanadan açın. Ad və müəllif sənədin xüsusiyyətlərindən götürülür. Haşiyələr, yuxarı və aşağı kolontitullar, şərhlər göstərilmir."
