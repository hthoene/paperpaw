home.plugin.name = Ana ekran
home.plugin.description = Başlanğıc ekranı: oxunan kitab və alətlər kimi vidcetlərdən ibarət səhifələr.
home.plugin.how = "Ana ekran səhifələrdən ibarətdir, hər biri telefondakı kimi vidcet və alətlər şəbəkəsidir. Əvvəlcə saat, oxuduğunuz kitab və son oxunan kitablar bir səhifədə, bütün alətlər isə növbəti səhifədədir.\n\nElementi açmaq üçün ona toxunun, səhifəni dəyişmək üçün sürüşdürün və ya səhifə düymələrindən istifadə edin. Yalnız düymələrlə ox düymələri bir elementdən digərinə keçir, “Seç” isə onu açır.\n\nYerləşməni dəyişmək üçün ana ekranı basılı saxlayın, səhifənin altındakı karandaşa toxunun və ya menyuda “Ana ekranı redaktə et” seçin. Elementləri köçürmək üçün sürükləyin və ya seçimlərini görmək üçün birinə toxunun, düymələrlə də olar. “Vidcet əlavə et” də oradadır. “Sütunlar” və “Sətirlər” ayarlarda, “Görünüş” altında, “Ana ekran” bölməsindədir.\n\nYan çevrilmiş ekranda ana ekran eyni elementləri daha çox sütunla göstərir, hər səhifə növbətisindən əvvəl dolur, kartlar isə təxminən 110 mm-dən enli olmur; şaquli vəziyyətdə düzdüyünüz heç nə dəyişmir. Onu üfüqi vəziyyətdə düzsəniz, bu tərtibat yalnız həmin istiqamət üçün ayrıca saxlanılır: yeni vidcetlər hər ikisinə əlavə olunur. Redaktə zamanı “Əlavə et” içindəki “Üfüqi tərtibatı sıfırla” avtomatik tərtibata qayıdır. Vidceti və ya aləti bir istiqamətdə silmək onu digərindən silmir."
