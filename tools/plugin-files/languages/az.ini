koreader.plugin.name = Vurğulama paylaşımı
koreader.plugin.description = Hər ikisində oxunan kitablar üçün əlfəcin və vurğulamaları KOReader ilə paylaşır.
koreader.plugin.how = "Bu plagin həm burada, həm də KOReader-də oxuduğunuz kitablar üçün əlfəcin və vurğulamaları KOReader ilə paylaşır: bir cihazda və ya cihazlar arasında sinxronlaşdırılan kitabxana qovluğunda. Heç nə qurmaq lazım deyil.\n\nPaperPaw KOReader-in də açdığı kitabı açanda və siz onun əlfəcin və ya vurğulamalarını dəyişəndə, kitabın yanındakı KOReader məlumatlarından yeni olanı götürür, buradakı yeniləri isə KOReader-in kitabı növbəti dəfə açanda götürməsi üçün saxlayır. Silinmiş işarələr və dəyişdirilmiş qeydlər də ötürülür.\n\nBu yalnız EPUB kitabları üçün işləyir. Tərəflərdən birinin faylı oxuna bilmirsə, oxunana qədər heç bir tərəfdə heç nə dəyişmir."
