notes-overview.plugin.name = Bütün qeydlər
notes-overview.plugin.description = Bütün kitabların əlfəcinləri və vurğulamaları bir siyahıda, həmçinin My Clippings.txt kimi ixrac.
notes-overview.plugin.how = "“Bütün qeydlər” əlfəcin və ya vurğulama etdiyiniz hər kitabı onların sayı ilə göstərir. Onu Alətlərdə açın. Qeydlərini görmək üçün kitab seçin, kitabı həmin yerdə açmaq üçün isə qeyd seçin.\n\nSiyahının sonunda “My Clippings.txt kimi ixrac et” bütün qeydləri bir fayla, kitabxananın yanındakı Exports qovluğuna, Kindle-ın istifadə etdiyi formada (UTF-8) yazır. Kindle-ın My Clippings.txt faylını oxuyan tətbiqlər onu oxuya bilər. Vurğulamaya yazılmış qeyd, Kindle-da olduğu kimi, ayrıca yazıdır. Buradakı kitabda Kindle mövqeləri olmadığı üçün “location” qeydin kitabın neçə faizində olduğunu göstərir. Fayl hər dəfə yenidən yazılır və əvvəlkini əvəz edir."
