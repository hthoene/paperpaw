plugin-manager.plugin.name = Plagin meneceri
plugin-manager.plugin.description = Plaginləri göstərir və onları aktiv və ya deaktiv edir.
plugin-manager.plugin.how = "Plagin meneceri hər plagini versiyası və təsviri ilə göstərir, plaginləri aktiv və ya deaktiv edir.\n\nOnu Ayarlarda “Plaginləri idarə et” kimi tapın. “Plagin ayarları” hər plaginin şəbəkə istifadəsi kimi seçimlər üçün ayrıca səhifədir. Plagini aktiv və ya deaktiv etmək üçün ona toxunun (düymələrlə: onu seçin). Dəyişiklik yenidən başladıqdan sonra qüvvəyə minir: o zaman aşağıdakı zolaq “İndi yenidən başlat” təklif edir. Plaginin necə işlədiyini oxumaq üçün onu basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın).\n\n“Həmişə aktiv” işarəli plagin söndürülə bilməz, “Vacib” işarəli plagin isə yalnız başqa plagin onun işini görəndə söndürülə bilər, əks halda PaperPaw üçün geri yol qalmazdı. “Ekranlar” bölməsində bir neçə plaginin təklif etdiyi yeri hansı plaginin göstərəcəyini seçirsiniz."
