calendar.plugin.name = Təqvim
calendar.plugin.description = Təqvimləriniz oxuyucuda: CalDAV, iCal və fayllardan gündəlik, gün, həftə və ay görünüşləri, kontaktlardan ad günləri, ana ekran vidcetləri və yuxu ekranı.
calendar.plugin.how = "Təqvimləriniz oxuyucuda: növbəti günlərin gündəliyi, gün, həftə və ay görünüşü; CalDAV təqvimlərinin (Nextcloud, Radicale, Baïkal, Fastmail və başqaları), iCal ünvanlarının (.ics, webcal://), kartdakı təqvim fayllarının tədbirləri, həmçinin kontaktlarınızın (CardDAV) ad günləri və ildönümləri ilə. Oxuyucu təqvimləri yalnız oxuyur, onları heç vaxt dəyişmir.\n\nTəqvimi alətlər menyusundan açın. Birinci sətir görünüşün adını göstərir; Gündəlik, Gün, Həftə, Ay və Ad günləri arasında keçmək, təqvim əlavə etmək və ya sinxronlaşdırmaq üçün onu seçin, yaxud istənilən sətri basılı saxlayın və ya Menyu düyməsini basın. Gün və Həftə görünüşündə ilk iki sətir əvvəlki və növbəti günə və ya həftəyə keçir (səhifə düymələri də); Ay görünüşündə ox düymələri günü, səhifə düymələri ayı dəyişir, Seç isə günü açır. Tədbirdə Seç onu tam göstərir: nə vaxt, harada, hansı təqvimdə və necə təkrarlanır. Geri bir addım geri qayıdır.\n\nTəqvimi Təqvimlər bölməsində əlavə edin (menyuda və ya ayarlarda Təqvim altında). Növünü seçin: CalDAV hesabı (serverin ünvanı kifayətdir, məs. cloud.example.com/remote.php/dav; tədbirləri olan hər təqvim görünüşə daxil olur), iCal ünvanı (.ics kimi dərc olunmuş təqvim), kartdakı təqvim faylı və ya kontaktlar (CardDAV ünvan kitabı: oxuyucu orada saxlanılan ad günlərini və ildönümlərini göstərir). Ünvanı, hesab üçün istifadəçi adınızı və parolu (ən yaxşısı tətbiq parolu; o, oxuyucunun parolları ilə birgə saxlanılır), sonra adı daxil edin. Hər təqvimin dəyişə biləcəyiniz işarəsi var (nöqtə, halqa, boz nöqtə və ya kvadrat), belə ki, onları bir-birindən ayıra bilərsiniz; ən çoxu altı təqvim.\n\nTəkrarlanan tədbirlər (gündəlik, həftəlik, aylıq, illik, həftənin günləri, say, bitmə tarixi və buraxılan günlərlə), bütün günlük tədbirlər və başqa saat qurşaqlarındakı tədbirlər oxuyucunun öz saatı ilə göstərilir. Oxuyucu bu gündən altmış gün əvvəldən altmış gün sonraya qədər, ən çoxu 240 tədbiri saxlayır və onları şəbəkəsiz göstərir. Oxuya bilmədiyi qaydaların tədbiri bir dəfə göstərilir.\n\nTəqvimlər onları açdığınız zaman (ən çoxu beş dəqiqədə bir), İndi sinxronlaşdır seçəndə, həmçinin ayarlarda Təqvim altında seçdiyiniz kimi şəbəkə onsuz da aktiv olanda və ya şarj başlayanda oxunur. Oxuyucu bunun üçün radionu heç vaxt özü yandırmır, yalnız İndi sinxronlaşdır seçdiyiniz hal istisnadır.\n\nAna ekran üçün vidcetlər (ana ekranı basılı saxlayın, sonra vidcet əlavə edin): Bu gün tarixi və günün planlarını, Növbəti tədbir ən yaxın tədbiri, Gündəlik növbəti günləri, Ay tədbirli günlərin altında nöqtə olan ayı, Ad günləri isə yaxın ad günlərini göstərir. Tədbirə toxunma onu, ayın gününə toxunma həmin günü açır. Yuxu ekranı bu günün gündəliyini göstərə bilər: ayarlarda Yuxu ekranı altında Təqvim seçin."
