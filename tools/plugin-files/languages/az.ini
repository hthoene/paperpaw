aids.plugin.name = Oxuma köməkçiləri
aids.plugin.description = Qalın söz başlanğıcları, əvəz edilən sözlər, şəkillər: mətn istədiyiniz kimi.
aids.plugin.how = "Oxuma köməkçiləri oxuduğunuz zaman kitab mətninin görünüşünü dəyişir. Onlar bütün kitablara aiddir. Qalın söz başlanğıcları və Sözləri əvəz et əvvəlcə deaktivdir.\n\nOnları Ayarlarda, Oxuma altında, Oxuma köməkçiləri bölməsində tapa bilərsiniz. Qalın söz başlanğıcları hər sözün ilk yarısını qalın yazır, bəzi insanlar üçün bu, oxumağı asanlaşdırır. Sözləri əvəz et “rəng = boya; Dr. = Doktor” kimi yazılmış, nöqtəli vergüllə ayrılmış cütləri qəbul edir.\n\nYalnız bütöv sözlər, tam yazdığınız kimi əvəz olunur, ona görə “boya” heç vaxt daha uzun sözün bir hissəsini dəyişmir. Kitab faylının özü dəyişdirilmir.\n\nKitablardakı şəkillər göstərilə (əvvəlcə belədir), şəklin təsvirindən istifadə edən “[Şəkil: dənizdə gəmi]” kimi qısa sətirlə əvəz oluna və ya buraxıla bilər. Onda səhifədə mətn üçün daha çox yer olur və göstərilməyən şəkil üçün heç nə açılmır, bu da səhifələri daha tez çevirir. Komikslər və şəkillərdən ibarət digər kitablar dəyişdirilmir."
