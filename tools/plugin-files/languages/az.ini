calibre.plugin.name = Simsiz kitabxana
calibre.plugin.description = Kitabları şəbəkə üzərindən qəbul edir. Calibre üçün simsiz cihaz kimi işləyir.
calibre.plugin.how = "Simsiz kitabxana cihazı kompüterinizdəki Calibre proqramında simsiz cihaz kimi göstərir. Calibre ona kitab göndərə, onların siyahısını göstərə və onları silə bilir. Kitablar kitabxanaya düşür.\n\nCihaz və kompüter eyni Wi-Fi şəbəkəsində olanda Simsiz kitabxananı Alətlər menyusundan açın. Calibre-də Qoşul/paylaş, sonra Simsiz cihaz bağlantısını başlat seçin. Cihaz kompüterinizi tapanda onun adını göstərir; Qoşul düyməsinə toxunun (düymələrlə Seç basın). Calibre burada kitab əlavə edib silə bilir, ona görə yalnız öz kompüterinizə qoşulun. Ekranı bağlamaq bağlantını bitirir.\n\nCalibre özü tapılmasa, onun kompüterinin ünvanını Ayarlarda, Kitabxana altında, Calibre hissəsində Ünvan kimi daxil edin. Calibre 9090-dan fərqli port istifadə edirsə, onu :port kimi əlavə edin, məs. 192.168.1.20:9091."
