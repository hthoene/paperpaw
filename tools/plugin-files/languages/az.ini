power.plugin.name = Enerji
power.plugin.description = Enerji rejimini əllə və ya batareyaya görə seçir: Normal, Qənaət, Oflayn.
power.plugin.how = "“Enerji” PaperPaw-un batareyanı necə xərclədiyini seçir: Normal, Qənaət və ya Oflayn. Qənaət gözləyə bilən işləri daha uyğun anlarda görür; Oflayn radionu söndürülmüş saxlayır. Avto batareyaya görə seçir.\n\nRejimi sürətli paneldə, “Enerji”nin rejimləri yan-yana göstərdiyi yerdə, və ya Ayarlarda “Enerji” bölməsində dəyişin. Orada həmçinin Avto-nun hansı səviyyələrdə Qənaət və Oflayn rejimə keçdiyini və şarj zamanı Normal qalıb-qalmadığını təyin edirsiniz.\n\nStatus sətirlərində “Enerji rejimi” qənaət zamanı yarpaq, oflayn zamanı üstündən xətt çəkilmiş Wi-Fi göstərir, Normal rejimdə isə heç nə göstərmir.\n\nKiçik menyunu açmaq üçün qidalanma düyməsini basılı saxlayın: Yuxu rejimi, Söndür (PaperPaw bacardığı yerdə), Yenidən başlat, sensor cihazlarda isə Toxunmanı kilidlə və ya Toxunmanın kilidini aç. Qısa basma əvvəlki kimi cihazı yuxu rejiminə keçirir. Geri menyudan çıxır."
