files.plugin.how = "Kitabxana kitabxana qovluğunuzdakı kitabları siyahıda göstərir: hər birinin üz qabığı, adı, müəllifi və nə qədər oxunduğu ilə. Sonuncu oxuduğunuz kitab yuxarıda kart kimi durur, ona görə oxumağa davam etmək üçün bir toxunuş və ya Seç düyməsinə bir basış kifayətdir. Kitabxana kitabları axtararkən indiyə qədər neçəsini tapdığını göstərir.\n\nKitabların üstündə nəyin göstəriləcəyini seçin: hamısı, oxuduqlarınız, oxunmamış və ya bitmiş kitablar, yaxud rəflər (müəllif, seriya, teq, seçilmişlər üzrə, başladığınız hər seriyanın növbəti kitabı). Oxumaq üçün kitaba toxunun; onu açmaq, bitmiş və ya oxunmamış kimi işarələmək, məlumatına baxmaq, arxivə köçürmək və ya silmək üçün basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın). Kitabxana menyusu üçün başlığa toxunun: kitabların necə sıralanıb göstərildiyi, axtarış, kitabxana qovluğu və ayarlar.\n\nKitabxana qovluğu Ayarlarda, Kitabxana bölməsində “Kitabxana qovluğu” kimi təyin edilir; orada kitabları üz qabıqlarından ibarət şəbəkə kimi də göstərmək olar. Bütün digər fayllar üçün Alətlər menyusundakı “Fayllar”dan istifadə edin."
