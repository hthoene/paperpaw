news.plugin.name = Xəbərlər
news.plugin.description = Xəbər lentlərini (RSS, Atom) oxumaq üçün kitab kimi yükləyir.
news.plugin.how = "Xəbərlər RSS və ya Atom lentlərini kitablara çevirir. Hər lent kitabxananın News qovluğunda bir kitab olur: ən yeni məqalələri sadə mətn kimi, istənilən başqa kitab kimi oxunur.\n\nXəbərləri Alətlər menyusundan açın və “Lent əlavə et” seçin; lentin ünvanı qəzetin və ya bloqun saytında olur. “Xəbərləri yüklə” bütün lentləri yükləyir və əvvəlki kitabları əvəz edir. Lenti ayrıca yükləmək və ya silmək üçün onu basılı saxlayın (düymələrlə Seç düyməsini basılı saxlayın). Silinmiş lentin kitabı kitabxanada qalır.\n\nYükləmək üçün şəbəkə lazımdır. “Hər lentdə məqalə” (Ayarlar, Kitabxana) hər kitabda neçə məqalə olacağını təyin edir. “Xəbər başlıqları” vidceti onları ana ekranda göstərir."
