menu-editor.plugin.name = Menyu redaktoru
menu-editor.plugin.description = Hər menyunun elementlərinin sırasını dəyişir, onları silir və əlavə edir.
menu-editor.plugin.how = "Menyu redaktoru menyularda nə olduğunu dəyişir: elementləri yuxarı və ya aşağı köçürün, silin və ya yenilərini əlavə edin.\n\nOnu Ayarlarda, “Fərdiləşdir” altında “Menyuları fərdiləşdir” kimi tapın. Menyu seçin, sonra köçürmək və ya silmək üçün element seçin; “Element əlavə et” yenisini əlavə edir. Dəyişikliklər dərhal tətbiq olunur. “Bu menyunu sıfırla” menyunu plaginlərinin təyin etdiyi vəziyyətə qaytarır, “Bütün menyuları sıfırla” bunu hamısı üçün edir.\n\nAyarlara yolu özünüzə bağlaya bilməzsiniz: ayarlara aparan element siz ora başqa yol əlavə edənə qədər qalır."
