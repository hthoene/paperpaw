about.plugin.name = Haqqında
about.plugin.description = PaperPaw versiyası və lisenziyaları.
about.plugin.how = "Haqqında bölməsi PaperPaw proqramının hansı versiyasının sizdə olduğunu, mənbə kodunun harada olduğunu və hansı lisenziyalarla yayıldığını göstərir.\n\nOnu Ayarların sonunda, PaperPaw haqqında kimi tapa bilərsiniz. Ox düymələri və Seç ilə sətri seçin və ya ona toxunun. Proşivkaya daxil edilmiş plaginlər və kodlu plaginləri yükləyən cihazlarda belə plaginlərin hansı barmaq izi üçün qurulmalı olduğu da orada göstərilir.\n\nLisenziyalar oxuyucuda mətn kimi açılır, ona görə onu kitab kimi vərəqləyirsiniz. Orada PaperPaw-un öz lisenziyası, həmçinin onunla gələn şriftlərin, nişanların və sözkeçirmə nümunələrinin lisenziyaları var. Plaginlər öz sətirlərini əlavə edə bilər, məsələn, mövzunun müəllifini."
