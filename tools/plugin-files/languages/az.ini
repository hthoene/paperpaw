file-manager.plugin.name = Fayl meneceri
file-manager.plugin.description = Cihazdakı bütün qovluq və fayllar: açın, adını dəyişin, köçürün, kopyalayın və silin.
file-manager.plugin.how = "Fayl meneceri yalnız kitablarınızı deyil, cihazın yaddaşındakı bütün qovluq və faylları göstərir; onları açmağa, adını dəyişməyə, köçürməyə, kopyalamağa, silməyə və yeni qovluqlar yaratmağa imkan verir.\n\n“Fayllar”ı Alətlər menyusundan açın. Qovluğa daxil olmaq üçün ona toxunun; Geri bir üst qovluğa qaytarır. Onunla nə etmək olduğunu görmək üçün fayla toxunun və ya istənilən elementi basılı saxlayın (düymələrlə: Seç düyməsini basılı saxlayın). “Köçür” və “Kopyala” elementi yadda saxlayır: onun aid olduğu qovluğa keçin və aşağıdakı zolaqda “Bura yapışdır” seçin. Düymələrlə zolağa çatmaq üçün sonuncu elementdən Aşağı basın.\n\nNöqtə ilə başlayan fayl və qovluqlar, məsələn PaperPaw-un öz məlumatları, gizlidir. Onları görmək üçün Ayarlarda, Kitabxana bölməsində “Gizli fayllar”ı aktiv edin."
