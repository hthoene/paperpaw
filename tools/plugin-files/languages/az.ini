tasks.plugin.name = Tapşırıqlar
tasks.plugin.description = Son tarixli və prioritetli tapşırıq siyahıları: oxuyucuda və ya CalDAV serverinizlə sinxron, ana ekran vidcetləri ilə.
tasks.plugin.how = "Oxuyucunuzda tapşırıq siyahıları: son tarixi və prioriteti olan tapşırıqlar, yerinə yetiriləndə işarələnir. Onlar heç bir quraşdırma və şəbəkə olmadan işləyir, həmçinin CalDAV serveri (Nextcloud, Radicale, Baïkal, Fastmail və s.) ilə sinxronlaşdırıla bilər; belə ki, eyni siyahılar telefonunuzda və kompüterinizdə də olur.\n\nTapşırıqları alətlər menyusundan açın. Birinci sətir göstərilən siyahının adını göstərir; başqa siyahı, bütün siyahılar üzrə “Bu gün və gecikmiş”, yeni siyahı, sinxronizasiya və ya hesab ayarı üçün onu seçin. “Tapşırıq əlavə et” klaviaturanı açır. Tapşırıqda Seç onu yerinə yetirilmiş kimi işarələyir (yenidən basanda: yerinə yetirilməyib). Başlığını, son tarixini (bu gün, sabah, bir həftəyə və ya 2026-12-24 kimi daxil etdiyiniz tarix) və ya prioritetini dəyişmək, yaxud onu silmək üçün tapşırığı basılı saxlayın və ya Menyu düyməsini basın. Açıq tapşırıqlar əvvəldə gəlir, gününə, sonra prioritetinə görə; yerinə yetirilənlər bir həftə sonda qalır (ayarlarda Tapşırıqlar bölməsində təyin olunur), sonra oxuyucudan silinir.\n\nAna ekran vidcetləri (ana ekranı basılı saxlayın, sonra vidcet əlavə edin): “Bu günün tapşırıqları” bu gün vaxtı çatanları və ya gecikənləri, “Tapşırıq siyahısı” bir siyahını göstərir, “Açıq tapşırıqlar” onları sayır, “Növbəti tapşırıq” isə növbəti görüləcək işi göstərir. Vidcetdə tapşırığa toxunmaq onu işarələyir; başlığa toxunmaq siyahıları açır.\n\nSinxronizasiya üçün siyahı sətrindən “CalDAV hesabı” seçin və serverin ünvanını, istifadəçi adınızı və parolu (ən yaxşısı tətbiq parolu) daxil edin. Serverin ünvanı kifayətdir, məsələn, cloud.example.com/remote.php/dav; oxuyucu tapşırıq siyahılarınızı oradan tapır. Serverdəki hər tapşırıq siyahısı oxuyucuda bir siyahı olur. Oxuyucu siz Tapşırıqları açanda, “İndi sinxronlaşdır” seçəndə və şəbəkə onsuz da aktiv olanda sinxronlaşdırır; şəbəkəsiz etdiyiniz dəyişikliklər gözləyir və sonra göndərilir. Tapşırıq bu arada həm oxuyucuda, həm də başqa yerdə dəyişdirilibsə, serverin versiyası götürülür, sizinki isə onun yanında yeni tapşırıq kimi saxlanılır, beləliklə heç nə itmir. Tapşırığın serverdəki qeydləri, xatırlatmaları və digər hər şeyi olduğu kimi qalır. Təkrarlanan tapşırıqlar göstərilir, lakin onları yaratdığınız yerdə dəyişdirilir. Oxuyucu 12 siyahıda 200-ə qədər tapşırıq saxlayır."
