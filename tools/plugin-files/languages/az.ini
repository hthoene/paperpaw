fonts-browser.plugin.name = Daha çox şrift
fonts-browser.plugin.description = İnternetdəki şriftləri nümunə ilə göstərir və oxumaq üçün endirir.
fonts-browser.plugin.how = "“Daha çox şrift” internetdəki şrift kitabxanasından şriftləri siyahıda göstərir, hər adı öz şriftində yazır və oxumaq istədiklərinizi endirir.\n\nOnu oxuma şriftinin seçildiyi şrift siyahısının sonunda tapırsınız: Ayarlarda, Oxuma bölməsində “Şrift” kimi; status sətirlərinin şrifti üçün də eyni element var. Şriftə toxunun (düymələrlə: Seç düyməsini basın) ki, onu nümunə cümlə ilə daha böyük görəsiniz, sonra “Endir” seçin. Endirilərkən səhifədən çıxa bilərsiniz. Bitəndə “(şriftin adı) ilə oxu” və ya “Status sətirləri üçün istifadə et” seçin. “Yenilə” daha yeni versiyanı gətirir, “Sil” şrifti cihazdan silir.\n\nBunun üçün Wi-Fi lazımdır.\n\nÖZ ŞRİFTLƏRİNİZ\n\nEyni siyahıda “Daha çox şrift”in yanında “Öz şriftləriniz” var, o, yardımın bu hissəsini göstərir. Öz şriftiniz .ttf və ya .otf faylıdır, məsələn Google Fonts-dan.\n\nAndroid və şrift fayllarını çəkə bilən digər cihazlarda: faylı fonts qovluğuna kopyalayın (Android-də: ümumi yaddaşda PaperPaw/fonts), PaperPaw-u yenidən başladın və şrifti Ayarlarda, Oxuma bölməsində “Şrift” kimi seçin.\n\nXteink X4 və X4 Pro-da: bu oxuyucular şrift fayllarını deyil, şrift paketlərini oxuyur, çünki şrift faylları onların yaddaşına sığmır. Kompüterdə paperpaw-fontgen ilə əlinizdə olan hər üslub üçün paket yaradın (adi üslub mütləqdir):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nBu, plugins/font-my-font qovluğunu yaradır. Onu yaddaş kartındakı plugins qovluğuna kopyalayın, yenidən başladın və “Şrift” kimi My Font seçin. Bir üslublu paket Latın hərfləri üçün təxminən yarım meqabaytdır; buraxdığınız üslublar adi üslubla çəkilir. Alət istədiyiniz hərflərdən neçəsinin şriftdə olduğunu bildirir (--chars latin,cyrillic,greek əlifbalar əlavə edir): kitabınızın hərfləri olmayan şrift onları göstərə bilməz, ona görə onun əlifbasını əhatə edən şrift axtarın.\n\n“Daha çox şrift”dən gələn şriftlər də eyni cür işləyir və kompüter tələb etmir.\n\nE-ink ekranda kiçik mətnin daha aydın olması üçün əmrə --hinting light əlavə edin: o, hərfləri standart şriftlərdə olduğu kimi piksel şəbəkəsinə uyğunlaşdırır. Onsuz hərflər şriftin dizayn edildiyi kimi çəkilir; --hinting normal və --hinting mono onları daha güclü uyğunlaşdırır. Ərəb və ya Devanaqari kimi işarəli şriftləri onsuz saxlamaq daha yaxşıdır."
