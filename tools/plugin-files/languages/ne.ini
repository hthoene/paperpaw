update.plugin.how = "अपडेटले नयाँ फर्मवेयर इन्स्टल गर्छ, PaperPaw नै फर्मवेयर भएका उपकरणमा, जस्तै X4। यो सेटिङमा अपडेट नामले भेटिन्छ।\n\nअनलाइन खोज अपडेट सर्भरसँग नयाँ PaperPaw सोध्छ र डाउनलोड गर्छ; वाइफाइमा केही मिनेट लाग्छ। वा अपडेट फाइल (.bin, paperpaw.org बाट) कार्डको updates फोल्डरमा कपी गर्नुहोस्, जस्तै वाइफाइ ट्रान्सफरबाट। इन्स्टल गर्न करिब एक मिनेट लाग्छ र उपकरण रिस्टार्ट हुन्छ; पुस्तक, सेटिङ र पढाइको स्थान उस्तै रहन्छ।\n\nअपडेट खोज्नुहोस् खोल्दा (सेटिङमा, सुरुमा बन्द) उपकरणले हप्तामा एक पटक आफैँ खोज्छ, वाइफाइ पहिले नै चालू हुँदा वा चार्ज हुँदा मात्र। भेटिएको नयाँ PaperPaw यहाँ पर्खन्छ; पढ्दा केहीले बाधा गर्दैन। खोजले उपकरणमा के चलिरहेको छ त्यति मात्र पठाउँछ, उपकरणको नाम वा नम्बर होइन।\n\nतपाईंले प्रयोग गरेका प्लगइनमा नयाँ संस्करणको संस्करण अझै छैन भने अपडेट तिनलाई पर्खन्छ।\n\nCrossPoint जस्तो अर्को फर्मवेयर पनि यहाँबाट इन्स्टल हुन्छ: यसको फाइल (.bin) updates फोल्डरमा राख्नुहोस् र अपडेट खोल्नुहोस्। PaperPaw ले यो यस उपकरणका लागि पूर्ण र अक्षत फर्मवेयर हो कि जाँच्छ, तर यो हस्ताक्षर गरिएको नभएकाले कसले बनायो भन्न सक्दैन। तैपनि इन्स्टल गर्नुहोस्ले यसलाई फ्ल्यासको अर्को आधा भागमा लेख्छ र उपकरणले सुरु गर्छ। PaperPaw मा फर्कन यसको इन्स्टल फाइल (paperpaw-<device>-<version>-install.bin) अर्को फर्मवेयरको मेनुबाट इन्स्टल गर्नुहोस्।"
