vocabulary.sd.outcome.same = पछिल्लो अपडेटपछि परिवर्तन भएको छैन।
vocabulary.sd.outcome.unreadable = यो फाइल पढ्न सकिएन। कार्ड जाँच गरेर फेरि प्रयास गर्नुहोस्।
vocabulary.sd.outcome.too-many = पहिल्यै 50 डेक छन्, त्यसैले यो फाइल पढिएन। पहिले एउटा डेक मेट्नुहोस्।
vocabulary.sd.outcome.crowded = धेरै कार्डको अगाडिको भाग उही छ, त्यसैले यो फाइल पढिएन। अगाडिका भाग फरक बनाउनुहोस्।
vocabulary.sd.outcome.no-cards = कुनै कार्ड भेटिएन। कार्ड भनेको अगाडिको पाठ भएको लाइन हो; अगाडिको भाग पहिलो स्तम्भमा हुन्छ।
vocabulary.sd.outcome.too-large = यो फाइल धेरै ठूलो छ: बढीमा 4 MiB र 20,000 लाइन। यसलाई धेरै फाइलमा बाँड्नुहोस्।
vocabulary.sd.outcome.utf16 = यो फाइल UTF-16 को रूपमा सुरक्षित गरिएको छ। यसलाई फेरि CSV UTF-8 को रूपमा सुरक्षित गर्नुहोस् (स्प्रेडसिटमा: CSV UTF-8)।
vocabulary.sd.outcome.no-notes = कुनै नोट भेटिएन: यो Anki डेक होइन, वा यसमा नोट छैनन्। यसलाई Anki बाट Anki डेक प्याकेज (.apkg) को रूपमा निर्यात गर्नुहोस्।
vocabulary.sd.outcome.newer-anki = यो डेक सबैभन्दा नयाँ Anki ढाँचामा छ। “पुराना Anki संस्करण समर्थन गर्नुहोस्” छानेर फेरि निर्यात गर्नुहोस्।
vocabulary.sd.outcome.deck-too-large = यो Anki डेक यहाँ पढ्न धेरै ठूलो छ: बढीमा 4,000 फाइल, 4 MiB नोट र 20,000 नोट। यसलाई मिडिया र तालिका बिना निर्यात गर्नुहोस्, वा बाँड्नुहोस्।
vocabulary.sd.line = लाइन {line}
vocabulary.sd.fault.no-front = अगाडिको भागको स्तम्भमा पाठ छैन। त्यहाँ शब्द राख्नुहोस्।
vocabulary.sd.fault.not-utf8 = UTF-8 पाठ होइन। फाइललाई UTF-8 को रूपमा सुरक्षित गर्नुहोस् (स्प्रेडसिटमा: CSV UTF-8)।
vocabulary.sd.fault.too-long = 8 KiB भन्दा लामो। कार्ड छोटो बनाउनुहोस्।
vocabulary.sd.fault.open-quote = उद्धरण चिन्ह खोलिएको छ तर बन्द गरिएको छैन। यसलाई बन्द गर्नुहोस् वा हटाउनुहोस्।
vocabulary.setting.sd-auto = खोल्दा कार्डबाट डेक अपडेट गर्नुहोस्
vocabulary.setting.sd-auto.help = फ्ल्यास कार्डले फोल्डरका नयाँ वा परिवर्तित फाइल पढ्छ।
vocabulary.setting.sd-folder = डेकका फाइलका लागि फोल्डर
vocabulary.setting.sd-folder.help = SD कार्डमा: त्यसमा रहेको CSV, TSV वा Anki फाइल एउटा डेक हो।
vocabulary.sd.readme = "फाइलबाट फ्ल्यास कार्ड\n\nहरेक डेकका लागि यहाँ एउटा फाइल राख्नुहोस्: Spanish.tsv ले Spanish डेक बनाउँछ।\nफाइल: .tsv, .csv वा .txt, UTF-8 को रूपमा सुरक्षित गरिएको, वा .apkg: Anki डेक, “पुराना Anki संस्करण समर्थन गर्नुहोस्” छानेर निर्यात गरिएको। यसका नोटका पहिलो तीन फिल्ड अगाडि, पछाडि र उदाहरण बन्छन्; यसको तालिका र मिडिया पढिँदैनन्, र PaperPaw ले कहिल्यै Anki फाइल लेख्दैन।\n\nहरेक लाइनमा एउटा कार्ड: अगाडि, पछाडि र उदाहरण (ऐच्छिक), ट्याब, अल्पविराम वा अर्धविरामले छुट्याइएको। पहिलो लाइनले स्तम्भको नाम दिन सक्छ: front, back, example. उदाहरण:\n\nKatze\tcat\tDie Katze schläft.\n\nत्यसपछि रिडरमा फ्ल्यास कार्ड खोल्नुहोस्, SD कार्डका कार्ड छान्नुहोस् र त्यसपछि कार्डबाट डेक अपडेट गर्नुहोस् छान्नुहोस्।\n\nजान्नुपर्ने कुरा:\n- डेक रिडरमै रहन्छन्, तपाईंले सिकेकासहित। फाइल नयाँ वा परिवर्तित हुँदा पढिन्छ, र यसका कार्ड डेकमा थपिन्छन् वा त्यहाँ परिवर्तन गरिन्छन्।\n- फाइलमा कार्डको पछाडि वा उदाहरण बदल्नुहोस्: कार्ड बदलिन्छ र तपाईंको प्रगति रहन्छ।\n- कार्डको अगाडिको पाठ बदल्नुहोस्: त्यो नयाँ कार्ड मानिन्छ, र पुरानो फेरि सुरु हुन्छ। कार्ड तिनको अगाडिको पाठबाट चिनिन्छन्, खाली ठाउँ र ठूला अक्षर गनिँदैनन्। डेक फाइलमा सुरक्षित गर्नुहोस् (SD कार्डका कार्ड, डेक कार्डमा सुरक्षित गर्नुहोस्) र हरेक कार्डले id स्तम्भमा एउटा नम्बर पाउँछ: त्यहाँ अगाडिको भाग बदल्नुहोस्, फाइलका पहिलो दुई लाइन जस्ताको तस्तै राख्नुहोस्, र कार्डले तपाईंको प्रगति राख्छ।\n- सुरक्षित गर्दा डेकका कार्ड लेखिन्छन्। फाइलमा भएको तर कार्ड नभएको कुरा (अगाडिको भाग नभएको लाइन) राखिँदैन; त्यहाँ भएको फाइल _name.bak.tsv मा कपी गरिन्छ।\n- फाइलमा तपाईंले मेटेको लाइनले डेकको कार्ड मेट्दैन, जबसम्म तपाईंले त्यो डेकका लागि हराएका कार्ड हटाउनुहोस् खुला गर्नुहुन्न। त्यसपछि कार्ड प्रगतिसहित जान्छ।\n"
