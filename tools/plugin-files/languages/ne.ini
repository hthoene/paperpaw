update.not-dual.warning = "त्यसपछि PaperPaw ले यहाँ अपडेट इन्स्टल गर्नेछ। यस उपकरणमा अर्को फर्मवेयर अझै इन्स्टल भएको रहेछ भने अपडेटले त्यसलाई मेट्न सक्छ। यो लागू गर्न PaperPaw रिस्टार्ट हुन्छ।\nपछि फिर्ता गर्न: अपडेट, “डुअल-बुट फेरि पत्ता लगाउनुहोस्”, वा paperpaw.ini मा dual-boot = auto।"
