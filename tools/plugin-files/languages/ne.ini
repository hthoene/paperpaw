update.dual-boot.help = PaperPaw ले यो उपकरण अर्को फर्मवेयरसँग बाँडेको छ, त्यसैले यहाँ अपडेट इन्स्टल गर्दैन। यो सेटअप गर्दा प्रयोग गरेको टुलले PaperPaw अपडेट गर्नुहोस्। यस उपकरणमा दोस्रो फर्मवेयर छैन? तलको बटनले त्यो भन्नुहोस्, वा paperpaw.org/flash मा USB बाट PaperPaw फेरि फ्ल्यास गर्नुहोस्।
