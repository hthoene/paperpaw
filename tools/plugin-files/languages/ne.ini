vocabulary.sd.save.unreadable = जोडिएका फाइलको सूची पढ्न सकिएन, त्यसैले केही लेखिएन। कार्ड जाँच गरेर फेरि प्रयास गर्नुहोस्।
vocabulary.sd.save.full = कार्ड भरिएको छ, त्यसैले केही लेखिएन। केही ठाउँ खाली गरेर फेरि प्रयास गर्नुहोस्।
vocabulary.sd.save.too-large = यो डेक एउटा फाइलका लागि धेरै ठूलो छ (4 MiB, अपडेटले यति नै पढ्छ)। कार्डको फाइल परिवर्तन भएको छैन।
vocabulary.sd.save.failed = फाइल लेख्न सकिएन। कार्डको फाइल परिवर्तन भएको छैन। कार्ड जाँच गरेर फेरि प्रयास गर्नुहोस्।
vocabulary.sd.save.not-updated = सुरक्षित गरिएन: कार्डको फाइल पहिले पढ्न सकिएन, र त्यसमा डेकमा अझै नभएका परिवर्तन हुन सक्छन्। फाइल मर्मत गरेर फेरि प्रयास गर्नुहोस्।
vocabulary.sd.save.left-out = सुरक्षित गरिएन: फाइलका केही लाइन पढ्न सकिएन, र सुरक्षित गर्दा तिनी हराउँछन्। फाइल मर्मत गर्नुहोस्, अपडेट गर्नुहोस् र फेरि प्रयास गर्नुहोस्।
vocabulary.sd.save.anki = {file} Anki फाइल हो: यो पढिन्छ मात्र, कहिल्यै लेखिँदैन।
