files.plugin.description = यन्त्रका पुस्तक र फोल्डर देखाउँछ र खोल्छ।
files.plugin.how = "पुस्तकालयले तपाईंको पुस्तकालय फोल्डरका पुस्तकहरू देखाउँछ, प्रत्येकको कभर, शीर्षक, लेखक र कति पढिएको छ भन्ने सहित। तपाईंले पछिल्लो पटक पढेको पुस्तक माथि कार्डका रूपमा हुन्छ, त्यसैले पढ्न जारी राख्न एक ट्याप वा चयन एक पटक थिच्नु पर्याप्त छ। पुस्तक खोज्दै गर्दा पुस्तकालयले अहिलेसम्म कति भेटियो भनी बताउँछ।\n\nपुस्तकहरूमाथि के देखाउने छान्नुहोस्: सबै, पढ्दै गरेका, नपढेका वा पढिसकेका, वा दराज (लेखक, शृङ्खला, ट्याग, मनपर्ने, सुरु गरेका हरेक शृङ्खलाको अर्को पुस्तक)। पढ्न पुस्तकमा ट्याप गर्नुहोस्; खोल्न, पढिसकेको वा नपढेको चिन्ह लगाउन, जानकारी हेर्न, अभिलेखमा सार्न वा मेट्न यसलाई थिचिराख्नुहोस् (बटनले चलाउँदा चयन थिचिराख्नुहोस्)। पुस्तकालय मेनुका लागि शीर्षकमा ट्याप गर्नुहोस्: पुस्तकको क्रम र प्रदर्शन, खोज, पुस्तकालय फोल्डर र सेटिङ।\n\nपुस्तकालय फोल्डर सेटिङमा पुस्तकालय अन्तर्गत पुस्तकालय फोल्डरमा तोकिन्छ; त्यहीँ पुस्तकहरू कभरको ग्रिडमा पनि देखाउन सकिन्छ। अन्य सबै फाइलका लागि औजार मेनुको फाइलहरू प्रयोग गर्नुहोस्।"
