calendar.plugin.name = Calendari
calendar.plugin.description = Els teus calendaris al lector: vistes d'agenda, dia, setmana i mes a partir de CalDAV, iCal i fitxers, aniversaris dels contactes, ginys d'inici i una pantalla de repòs.
calendar.plugin.how = "Els teus calendaris al lector: una agenda dels propers dies, un dia, una setmana i un mes, amb els esdeveniments dels calendaris CalDAV (Nextcloud, Radicale, Baïkal, Fastmail i altres), de les adreces iCal (.ics, webcal://), dels fitxers de calendari de la targeta i els aniversaris i les efemèrides dels teus contactes (CardDAV). El lector només llegeix els calendaris; mai no els modifica.\n\nObre Calendari des del menú Eines. La primera fila indica la vista; tria-la, o mantén premuda qualsevol fila o prem Menú, per canviar entre Agenda, Dia, Setmana, Mes i Aniversaris, afegir calendaris o sincronitzar. A Dia i Setmana, les dues primeres files van al dia o a la setmana anterior i posterior (els botons de pàgina també); a Mes, els botons de fletxa mouen el dia, els botons de pàgina el mes, i Selecciona obre el dia. Selecciona sobre un esdeveniment el mostra sencer: quan, on, quin calendari i com es repeteix. Enrere torna un pas enrere.\n\nAfegeix un calendari a Calendaris (al menú, o Calendari a la configuració). Tria'n el tipus: un compte CalDAV (n'hi ha prou amb l'adreça del servidor, p. ex. cloud.example.com/remote.php/dav; cada calendari amb esdeveniments passa a formar part de la vista), una adreça iCal (un calendari publicat com a .ics), un fitxer de calendari a la targeta, o contactes (una llibreta d'adreces CardDAV: el lector mostra els aniversaris i les efemèrides que hi ha desats). Introdueix l'adreça, per a un compte el teu nom d'usuari i una contrasenya (millor una contrasenya d'aplicació; es guarda amb les contrasenyes del lector) i un nom. Cada calendari té una marca (un punt, un anell, un punt gris o un quadrat) que pots canviar per distingir-los; fins a sis calendaris.\n\nEls esdeveniments que es repeteixen (diaris, setmanals, mensuals, anuals, amb dies de la setmana, recomptes, dates de finalització i dies exclosos), els esdeveniments de tot el dia i els esdeveniments en altres fusos horaris es mostren amb el rellotge del mateix lector. El lector conserva els esdeveniments des de seixanta dies abans fins a seixanta dies després d'avui, com a màxim 240, i els mostra sense xarxa. Les regles que no pot llegir mostren el seu esdeveniment una sola vegada.\n\nEls calendaris es llegeixen quan obres el calendari (com a màxim cada cinc minuts), quan tries Sincronitza ara i, segons el que indiquis a Calendari a la configuració, quan la xarxa ja està activada o quan comença la càrrega. El lector mai no activa la ràdio per a això, excepte quan demanes Sincronitza ara.\n\nGinys per a la pantalla d'inici (mantén premuda la pantalla d'inici i afegeix un giny): Avui mostra la data i el que té el dia, Proper esdeveniment l'esdeveniment que ve a continuació, Agenda els propers dies, Mes un mes amb un punt sota els dies que tenen esdeveniments, i Aniversaris els propers aniversaris. Un toc sobre un esdeveniment l'obre, un toc sobre un dia del mes obre aquell dia. La pantalla de repòs pot mostrar l'agenda d'avui: tria Calendari a Pantalla de repòs a la configuració."
