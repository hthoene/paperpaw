vocabulary.setting.sd-folder.help = A la targeta SD: un fitxer CSV, TSV o d'Anki d'aquesta carpeta és una baralla.
vocabulary.sd.readme = "Targetes de memorització de fitxers\n\nPosa aquí un fitxer per a cada baralla: Castellà.tsv crea la baralla Castellà.\nFitxers: .tsv, .csv o .txt, desats com a UTF-8, o .apkg: una baralla d'Anki, exportada amb Admet versions antigues d'Anki marcat. Els tres primers camps de les seves notes es converteixen en davant, darrere i exemple; no se'n llegeixen ni la planificació ni els multimèdia, i PaperPaw no escriu mai un fitxer d'Anki.\n\nUna targeta a cada línia: davant, darrere i un exemple (opcional), separats per un tabulador, una coma o un punt i coma. La primera línia pot anomenar les columnes: front, back, example. Exemple:\n\ngat\tcat\tEl gat dorm.\n\nDesprés obre Targetes de memorització al lector, tria Targetes de la targeta SD i després Actualitza les baralles de la targeta.\n\nÉs bo saber:\n- Les baralles es queden al lector, amb el que has après. Un fitxer es llegeix quan és nou o ha canviat, i les seves targetes s'afegeixen a la baralla o s'hi canvien.\n- Canvia el darrere o l'exemple d'una targeta al fitxer: la targeta canvia i conserva el teu progrés.\n- Canvia el text del davant d'una targeta: compta com a targeta nova, i l'antiga torna a començar. Les targetes es reconeixen pel text del davant; els espais i les majúscules no compten. Desa una baralla en un fitxer (Targetes de la targeta SD, Desa la baralla a la targeta) i cada targeta té un número a la columna id: canvia-hi un davant, deixa les dues primeres línies del fitxer tal com són, i la targeta conserva el que has après.\n- Desar escriu les targetes de la baralla. El que hi havia al fitxer i no és una targeta (una línia sense davant) no es conserva; el fitxer que hi havia es copia a _nom.bak.tsv.\n- Desa el fitxer com a CSV UTF-8 (no UTF-16, ni el format propi d'un full de càlcul). Un fitxer de més de 4 MiB o de 20.000 línies no es llegeix: divideix-lo.\n- Una línia que suprimeixes al fitxer no suprimeix la targeta de la baralla, tret que activis Elimina les targetes que falten per a aquella baralla. Aleshores la targeta se'n va amb el que has après.\n- Els fitxers el nom dels quals comença per _ no es llegeixen.\n"
