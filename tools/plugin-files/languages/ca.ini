file-manager.plugin.name = Gestor de fitxers
file-manager.plugin.description = Totes les carpetes i fitxers del dispositiu: obre'ls, canvia'n el nom, mou-los, copia'ls i suprimeix-los.
file-manager.plugin.how = "El gestor de fitxers mostra totes les carpetes i fitxers de l'emmagatzematge del dispositiu, no només els teus llibres, i et deixa obrir-los, canviar-ne el nom, moure'ls, copiar-los i suprimir-los, i crear carpetes noves.\n\nObre Fitxers des del menú Eines. Toca una carpeta per entrar-hi; Enrere va a la carpeta de dalt. Toca un fitxer, o mantén premuda qualsevol entrada (amb botons, mantén premut Selecciona), per veure què se'n pot fer. Mou i Copia recorden l'entrada: ves a la carpeta on ha d'anar i tria Enganxa aquí a la barra de sota. Amb botons, prem Avall des de l'última entrada per arribar a la barra.\n\nEls fitxers i les carpetes que comencen amb un punt, com les dades pròpies de PaperPaw, estan amagats. Per veure'ls, activa Fitxers amagats a Configuració, a Biblioteca."
