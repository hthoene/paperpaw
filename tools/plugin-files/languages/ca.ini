bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Vincula comandaments, teclats i sensors, i els connecta.
bluetooth.plugin.how = "Bluetooth vincula comandaments, teclats i sensors amb el lector, en els models que tenen Bluetooth (el X4 Pro).\n\nAfegeix un dispositiu cerca el que hi ha a l'abast; posa primer el dispositiu en mode de vinculació. Tria'l i confirma al lector (compara el número si se'n mostra un). Les tecles d'un comandament o d'un teclat canvien de pàgina i es mouen pels menús; canvia el que fa cada tecla a Controls.\n\nComandaments diu quan funcionen les seves tecles: quan s'activen aquí, durant la lectura (connectat mentre hi ha un llibre obert, estalvia bateria) o sempre. El botó de menú o una pulsació llarga sobre un dispositiu l'oblida.\n\nUn sensor és per als connectors: activa quin connector el pot fer servir. Bluetooth està desactivat sempre que no l'usa res."
