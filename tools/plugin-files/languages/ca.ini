widgets.plugin.name = Paquet de ginys
widgets.plugin.description = Molts més ginys per a la pantalla d'inici: rellotges, un calendari, citacions, llibres, notes i més.
widgets.plugin.how = "El paquet de ginys afegeix molts ginys per a la pantalla d'inici: rellotges (analògic, de paraules, de rajoles, mundial), un calendari, l'any fins ara, una compte enrere, la fase de la lluna, i dia i data; una citació del dia, notes, tasques pendents, imatges, una salutació i el logotip de PaperPaw; i per als llibres, lectura actual, progrés, el següent, sèrie, preferits, un ressaltat i la biblioteca en xifres. També hi ha un giny de bateria.\n\nAfegeix-los amb Edita la pantalla d'inici al menú (o amb una pulsació llarga a la pantalla d'inici) i després Afegeix un giny. Cadascun té una configuració pròpia, com marc, mida i alineació. Si tries un giny que canvia, com la citació del dia, mostra el següent. Les teves pròpies citacions van a quotes.txt a .paperpaw/plugins/widgets de la targeta, cada línia com a text | autor. Els ginys d'hora necessiten el rellotge ajustat; la Wi-Fi l'ajusta."
