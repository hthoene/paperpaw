vocabulary.plugin.name = Vocabulari
vocabulary.plugin.description = Conserva les paraules que cerques, amb les seves frases, i repassa targetes de memorització amb repetició espaiada, creades al telèfon.
vocabulary.plugin.how = "Vocabulari conserva les paraules que cerques mentre llegeixes, cadascuna amb la seva frase, per repassar-les més tard. Trobaràs la llista a Eines, amb les més noves primer; tria una paraula per tornar-la a cercar. L'última fila, Exporta, les desa per a aplicacions de targetes de memorització com Anki. La llista conserva les 2.000 paraules més noves: a partir d'aquí se n'van les més antigues, així que exporta-les abans per conservar-les totes.\n\nLes targetes de memorització, també a Eines, t'interroguen amb repetició espaiada: després de Mostra la resposta valores cada targeta amb De nou, Difícil, Bé o Fàcil, i això decideix quan torna. Crea baralles amb Edita amb el telèfon: escaneja el codi amb un telèfon de la mateixa Wi-Fi, i després escriu targetes o afegeix-ne moltes de cop: obre-hi una baralla, tria Moltes targetes de cop i escull un fitxer CSV, TSV o TXT (una targeta a cada línia: davant, darrere, exemple; UTF-8), enganxa una llista o porta una baralla d'Anki (.apkg, exportada amb Admet versions antigues d'Anki).\n\nO fes servir fitxers de la targeta SD: posa un fitxer CSV, TSV o TXT, o una baralla d'Anki (.apkg, exportada amb Admet versions antigues d'Anki), per a cada baralla a la carpeta Flashcards (Espanyol.tsv crea la baralla Espanyol; una targeta a cada línia: davant, darrere, exemple; desat com a UTF-8; una primera línia pot anomenar les columnes front, back, example). Tria Targetes de la targeta SD a Targetes de memorització, o deixa que passi quan obres Targetes de memorització. Les baralles es queden al lector amb el que has après, i un fitxer es fusiona amb la seva baralla quan és nou o ha canviat: canvia el darrere o l'exemple d'una targeta al fitxer i la targeta canvia i conserva el seu progrés; canvia el text del davant i compta com a targeta nova, i l'antiga torna a començar (les targetes es distingeixen pel text del davant; els espais i les majúscules no compten); una línia que suprimeixes no suprimeix la targeta (tret que per a aquella baralla estableixis «Targetes que falten al fitxer» a Elimina: aleshores la targeta s'elimina en la propera actualització amb el seu progrés, per sempre, i no s'elimina res mentre alguna línia del fitxer no es pugui llegir). Desa una baralla al seu fitxer amb Desa a la targeta: el fitxer rep els números de les targetes (la columna id), de manera que pots editar els davants en un ordinador i les targetes conserven el que has après; el fitxer només conserva id, davant, darrere i exemple (les altres columnes, els comentaris i l'ordre de les línies no es conserven), i es rebutja desar mentre alguna línia del fitxer no s'hagi pogut llegir; el fitxer que hi havia es copia a _nom.bak.tsv la primera vegada (un desament posterior no substitueix aquesta còpia). Un fitxer de més de 4 MiB o de 20.000 línies no es llegeix, i s'ha de desar com a CSV UTF-8, no UTF-16. La primera vegada, el lector crea la carpeta amb una nota sobre com funciona.\n\nA la configuració, a Lectura, Les paraules cercades es converteixen en targetes posa cada paraula cercada a la baralla Cercades."
