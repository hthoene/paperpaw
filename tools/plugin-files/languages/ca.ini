reader.plugin.name = Lector
reader.plugin.description = Mostra llibres pàgina a pàgina, amb índex i configuració de lectura.
reader.plugin.how = "El lector mostra els llibres pàgina a pàgina. Obre un llibre des de la biblioteca; l'últim llibre es pot tornar a obrir a l'inici (opció Obre l'últim llibre a l'inici).\n\nToca l'esquerra o la dreta de la pantalla, o fes servir els botons de pàgina, per canviar de pàgina. Toca el centre o prem Selecciona per al menú de lectura: Contingut, Cerca, Ves a la pàgina, Tipus de lletra i disseny, Marcadors i ressaltats i més. Cap avall des de la vora superior obre el tauler ràpid, cap amunt des de la vora inferior va a l'inici; mantenir premut Enrere també.\n\nMantén premut Selecciona (o mantén una imatge) per veure una imatge a pantalla completa: Esquerra i Dreta recorren les imatges de la pàgina. Selecciona amplia a 2x, 3x i torna enrere (doble toc en tàctil); ampliada, Esquerra i Dreta la desplacen de costat, els botons de pàgina (o els lliscaments) avancen en horitzontal i cap avall. Enrere torna a l'ajust, i després a la pàgina (en tàctil, mantén premut per sortir). Toca la cantonada superior dreta per posar un marcador. Mantén premuda una paraula per ressaltar-la. Amb botons, mantén premut Esquerra: Esquerra i Dreta es mouen de paraula en paraula, els botons de pàgina de línia en línia, mantenir-los va als extrems de la pàgina i de paràgraf en paràgraf; Selecciona obre la barra de ressaltat per a la paraula, mantenir premut Selecciona l'amplia a la frase i al paràgraf (aleshores Esquerra i Dreta mouen el final, mantenir-los l'inici). Una selecció continua en canviar de pàgina. Exporta com a Markdown desa les teves notes."
