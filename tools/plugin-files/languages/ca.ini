update.plugin.name = Actualització
update.plugin.description = Instal·la actualitzacions del microprogramari, des de la targeta o baixades d'internet.
update.plugin.how = "Actualització instal·la microprogramari nou, en dispositius on PaperPaw és el microprogramari, com l'X4. El trobaràs a la configuració, com a Actualització.\n\nCerca en línia pregunta al servidor d'actualitzacions si hi ha un PaperPaw més nou i el baixa, cosa que triga uns quants minuts per Wi-Fi. O copia un fitxer d'actualització (acabat en .bin, de paperpaw.org) a la carpeta updates de la targeta, per exemple amb Transferència per Wi-Fi. Instal·la triga aleshores aproximadament un minut i el dispositiu es reinicia; els llibres, la configuració i les posicions de lectura es conserven.\n\nAmb Cerca actualitzacions activat (a la configuració, desactivat al principi), el dispositiu ho pregunta aproximadament una vegada per setmana per si sol, només mentre la Wi-Fi ja està activada o carrega. Un PaperPaw més nou que trobi espera aquí; res no interromp la lectura. Una cerca envia el que executa el dispositiu, sense cap nom ni número seu; per comptar dispositius, també si ho has demanat tu i si és la primera cerca del dia, de la setmana o del mes.\n\nSi els connectors que fas servir encara no tenen versió per a la nova versió, l'actualització els espera. Una versió més antiga només s'instal·la si la tries.\n\nUn altre microprogramari, com CrossPoint, també s'instal·la des d'aquí: posa el seu fitxer (acabat en .bin) a la carpeta updates i obre Actualització. PaperPaw comprova que és un microprogramari complet per a aquest dispositiu, sense malmetre, però no pot saber qui l'ha fet, perquè no està signat. Instal·la igualment l'escriu a l'altra meitat de la memòria flaix, i el dispositiu l'inicia; PaperPaw es queda a la seva meitat fins que aquest microprogramari hi instal·li alguna cosa a sobre. Per tornar a PaperPaw més endavant, instal·la el seu fitxer d'instal·lació (paperpaw-<dispositiu>-<versió>-install.bin) des del menú de l'altre microprogramari, com l'actualització de microprogramari des de la SD de CrossPoint."
