menu.style.list = Llista
menu.style.tiles = Mosaics
menu.setting.style.help = Els menús com una llista, o com a mosaics amb les seves icones a la part superior de la pantalla.
menu.help.panel = El tauler ràpid: el que canvies sovint, com la llum i el mode nocturn.
menu.help.panel-tap = Toca un botó per commutar-lo.
menu.help.panel-close = Toca fora del tauler per tancar-lo.
menu.help.panel-buttons = Els botons de fletxa: trien. Selecciona: commuta. Enrere: tanca.
menu-editor.plugin.name = Editor de menús
menu-editor.plugin.description = Reordena, elimina i afegeix les entrades de tots els menús.
menu-editor.plugin.how = "L'editor de menús canvia el contingut dels menús: mou les entrades amunt o avall, elimina-les o n'afegeix de noves.\n\nEl trobaràs a Configuració, a Personalitza, com a Personalitza els menús. Tria un menú i després una entrada per moure-la o eliminar-la; Afegeix una entrada n'hi posa una de nova. Els canvis s'apliquen de seguida. Restableix aquest menú torna un menú a com el defineixen els seus connectors, Restableix tots els menús ho fa per a tots.\n\nNo et pots quedar tancat fora: una entrada que és el camí a la configuració es manté fins que hi afegeixis un altre camí."
