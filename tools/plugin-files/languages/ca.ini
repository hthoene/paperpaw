menu.plugin.name = Menú
menu.plugin.description = El menú a la part inferior de la pantalla, amb accions i configuració.
menu.plugin.how = "El menú llista el que pots fer i configurar. S'obre a la part inferior de la pantalla, sobre el que hi hagi obert: durant la lectura, toca el centre de la pantalla o prem Selecciona. Toca o selecciona una entrada per executar-la.\n\nLes opcions de configuració del menú mostren el seu valor i canvien al mateix lloc, de manera que el menú es manté obert. Una entrada amb més entrades obre un submenú.\n\nLlisca cap avall des de la vora superior per veure el tauler ràpid: el que canvies sovint, com a botons. Toca un botó per commutar-lo, mantén-lo premut per veure'n la configuració. Només amb botons, els botons de fletxa trien, Selecciona commuta i Enrere tanca. A Aparença, Menús mostra els menús com una llista o com a mosaics."
