home.plugin.name = Pantalla d'inici
home.plugin.description = La pàgina d'inici: pàgines de ginys, com el llibre que estàs llegint i les eines.
home.plugin.how = "La pantalla d'inici està feta de pàgines, cadascuna una quadrícula de ginys i eines com en un telèfon. Al principi, el rellotge, el llibre que estàs llegint i els llibres llegits recentment són en una pàgina, i totes les eines a la següent.\n\nToca un element per obrir-lo, i llisca o fes servir els botons de pàgina per canviar de pàgina. Només amb botons, els botons de fletxa van d'un element al següent i Selecciona l'obre.\n\nPer reorganitzar-la, mantén premuda la pantalla d'inici, toca el llapis sota la pàgina o tria Edita la pantalla d'inici al menú. Arrossega els elements per moure'ls o toca'n un per veure'n les opcions, també amb botons. Allà també hi ha Afegeix un giny. Columnes i Files són a la configuració, a Aparença, a la secció Pantalla d'inici.\n\nEn una pantalla girada de costat, la pantalla d'inici mostra els mateixos elements amb més columnes, cada pàgina plena abans de la següent, i targetes no més amples d'uns 110 mm; res del que hagis organitzat en vertical es modifica. Organitza-la de costat i aquest disseny es conserva per a aquesta orientació per separat: els ginys nous s'afegeixen a tots dos. Restableix el disseny horitzontal a Afegeix (mentre edites) torna al derivat. Eliminar un giny o una eina en una orientació no l'elimina de l'altra."
