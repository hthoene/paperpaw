settings.plugin.name = Configuració
settings.plugin.description = Les pàgines de configuració, creades a partir de les opcions de tots els connectors.
settings.plugin.how = "La configuració mostra tot el que es pot configurar a PaperPaw i els seus connectors, en pàgines. Els connectors no necessiten cap pantalla pròpia: el que declaren apareix aquí, en grups, amb la descripció de cada opció a sota.\n\nObre-la amb Configuració al menú. Toca un grup per obrir-lo, i després una opció per activar-la o triar-la; els nombres tenen botons − i +. Amb botons, ves a una opció i prem Selecciona: esquerra i dreta canvien un nombre, Selecciona el conserva, Enrere torna al valor anterior.\n\nEls canvis s'apliquen de seguida. Cerca troba una opció per paraules i Configuració avançada afegeix les que rarament calen. Restableix els valors per defecte i Restableix-ho tot ho pregunten abans."
