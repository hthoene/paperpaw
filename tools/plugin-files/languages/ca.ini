puzzles.plugin.name = Enigmes
puzzles.plugin.description = Sudokus, mots encreuats i problemes d'escacs, fora de línia, amb una enigma del dia.
puzzles.plugin.how = "Enigmes per al tren i la sala d'espera, tot fora de línia: sudokus, mots encreuats i problemes d'escacs. Obre Enigmes des del menú d'eines, o afegeix el giny Enigma del dia a la pantalla d'inici (mantén premuda la pantalla d'inici i afegeix un giny): mostra com va el sudoku d'avui, i un toc l'obre. El sudoku del dia és el mateix durant tot el dia.\n\nSudoku: esquerra i dreta mouen el cursor casella a casella, amunt i avall (els botons de pàgina) d'una fila. Selecciona obre els dígits: tria'n un i torna a seleccionar per posar-lo, o Esborra per buidar la casella. Mantén premut Selecciona (o Menú) per arribar als botons sota el tauler: Notes converteix els dígits en anotacions a llapis, Comprova marca les caselles errònies, Desfés retira l'última jugada, Nou inicia una enigma del nivell que triïs (Fàcil, Mitjà, Difícil). Cada enigma té exactament una solució. La partida es conserva quan surts. En una pantalla tàctil, toca una casella.\n\nMots encreuats: posa fitxers .puz (Across Lite) o .ipuz a la carpeta «puzzles» de la targeta de memòria; no se n'inclou cap. Mou-te per la quadrícula i després selecciona per escriure amb el teclat la paraula sota el cursor (un guió baix deixa una casella buida). Els botons canvien entre horitzontal i vertical, mostren la llista de definicions, comproven les lletres i revelen la paraula. Les lletres es conserven per a cada fitxer. Els fitxers .puz amb la solució xifrada no es poden obrir.\n\nProblemes d'escacs: un petit conjunt de la base de dades de problemes de Lichess (CC0). Esquerra i dreta salten de peça en peça, selecciona la peça que vols moure, després esquerra i dreta pels llocs on pot anar, i torna a seleccionar. Una jugada errònia es retira. Pista marca la peça a moure, Següent va al problema següent.\n\nEl tauler només redibuixa les caselles que canvien. Estadístiques compta les enigmes que has resolt."
