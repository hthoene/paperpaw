lock.plugin.name = Bloqueig de pantalla
lock.plugin.description = Un PIN, un patró o una contrasenya quan el dispositiu es desperta; tàctil bloquejat durant la lectura.
lock.plugin.how = "El bloqueig de pantalla demana un PIN, un patró o una contrasenya quan s'inicia PaperPaw i quan el dispositiu es desperta. Al principi està desactivat. Només impedeix l'ús ocasional: el codi i el nombre d'intents erronis es desen a la targeta SD, de manera que qui la tregui, l'editi o l'intercanviï se salta el bloqueig.\n\nConfigura'l a la configuració, a Dispositiu, Bloqueig de pantalla: introdueix el codi en ús si n'hi ha, tria el tipus i després el codi nou dues vegades. El patró només s'ofereix en pantalles tàctils.\n\nDesprés de cinc intents erronis, el següent espera mig minut. Bloqueja ara bloqueja de seguida i es pot posar en un botó, un gest o una regla. Bloqueja en despertar es pot desactivar, de manera que només bloqueja un inici real (engegada o reinici), excepte quan cada despertar és un inici, com a l'X4 amb bateria.\n\nAl costat, el bloqueig del tàctil: Bloqueja el tàctil al tauler ràpid i al menú de lectura fa que els tocs, els lliscaments i el llapis no facin res mentre els botons continuen funcionant, p. ex. per llegir amb una mà sobre la pantalla. Per desbloquejar, toca dues vegades amb un dit i mantén-lo premut un moment; mantenir premut el botó d'engegada obre el menú d'energia, on Desbloqueja el tàctil ho fa amb els botons; a l'X4 Pro, mantenir premuda la tecla d'inici desbloqueja de seguida."
