files.plugin.description = Llista els llibres i les carpetes del dispositiu i els obre.
files.plugin.how = "La biblioteca llista els llibres de la carpeta de la biblioteca, cadascun amb la coberta, el títol, l'autor i quant n'has llegit. El llibre que has llegit per última vegada és a dalt com a targeta, de manera que continuar llegint costa un toc, o una pulsació de Selecciona. Mentre la biblioteca cerca llibres, diu quants n'ha trobat fins ara.\n\nTria què es mostra sobre els llibres: tots, els que estàs llegint, els no llegits o els llegits, o les prestatgeries (per autor, sèrie, etiqueta, preferits, el llibre següent de cada sèrie que has començat). Toca un llibre per llegir-lo; mantén-lo premut (amb botons, mantén premut Selecciona) per obrir-lo, marcar-lo com a llegit o no llegit, veure'n la informació, moure'l a l'arxiu o suprimir-lo. Toca el títol per al menú de la biblioteca: com s'ordenen i es mostren els llibres, la cerca, la carpeta de la biblioteca i la configuració.\n\nLa carpeta de la biblioteca s'estableix a Configuració, a Biblioteca, com a Carpeta de la biblioteca; allà també pots mostrar els llibres com una quadrícula de cobertes. Per a tots els altres fitxers, fes servir Fitxers al menú Eines."
