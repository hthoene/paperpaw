profiles.plugin.name = Perfils de lectura
profiles.plugin.description = Conjunts amb nom de configuració de lectura i de pantalla, que es canvien amb un toc.
profiles.plugin.how = "Un perfil desa sota un nom la teva configuració de lectura, la configuració de pantalla i les línies d'estat, com Nit o Lletra gran, i les recupera amb un toc.\n\nObre Perfils al menú de lectura, a Més, o a Configuració, a Personalitza. Toca un perfil per fer-lo servir; el que està en ús queda marcat. Mantén-lo premut (amb botons, mantén premut Selecciona) per desar-hi la configuració actual, canviar-ne el nom o eliminar-lo. Desa com a perfil nou conserva el que està configurat ara.\n\nPerfil següent canvia al següent de la llista; posa'l en un botó o en una regla."
