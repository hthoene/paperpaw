about.plugin.name = Quant a
about.plugin.description = La versió i les llicències de PaperPaw.
about.plugin.how = "Quant a mostra quina versió de PaperPaw tens, on és el seu codi font i sota quines llicències es distribueix.\n\nEl trobaràs al final de la Configuració, com a Quant a PaperPaw. Tria una fila amb els botons de fletxa i Selecciona, o toca-la. També s'hi llisten els connectors integrats al microprogramari i, en dispositius que carreguen connectors amb codi, l'empremta digital per a la qual s'han de compilar aquests connectors.\n\nLlicències s'obre com a text al lector, de manera que passes les pàgines com en un llibre. Conté la llicència pròpia de PaperPaw i les dels tipus de lletra, les icones i els patrons de partició de paraules que s'hi inclouen. Els connectors poden afegir-hi una línia pròpia, com l'autor d'un tema."
