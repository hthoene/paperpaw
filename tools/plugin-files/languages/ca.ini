power.plugin.name = Energia
power.plugin.description = Tria el mode d'energia, a mà o segons la bateria: Normal, Estalvi, Fora de línia.
power.plugin.how = "Energia tria com gasta PaperPaw la bateria: Normal, Estalvi o Fora de línia. Estalvi fa en moments millors el que pot esperar; Fora de línia manté la ràdio apagada. Auto tria segons la bateria.\n\nCanvia el mode al tauler ràpid, on Energia mostra els modes un al costat de l'altre, o a Configuració, a Energia. Allà també estableixes els nivells en què Auto passa a Estalvi i a Fora de línia, i si es manté en Normal mentre carrega.\n\nA les línies d'estat, Mode d'energia mostra una fulla durant l'estalvi i una Wi-Fi ratllada quan està fora de línia, i res en Normal.\n\nMantén premut el botó d'engegada per obrir un petit menú: Suspèn, Apaga (on PaperPaw pot), Reinicia, i en dispositius tàctils Bloqueja el tàctil o Desbloqueja el tàctil. Una pulsació curta continua posant el dispositiu en repòs. Enrere surt del menú."
