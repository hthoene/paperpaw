keyboard.plugin.name = Teclat
keyboard.plugin.description = Introdueix text a la pantalla, amb el tàctil o amb els botons.
keyboard.plugin.how = "El teclat s'obre sempre que alguna cosa necessita text: una cerca, una contrasenya, una nota o una opció de configuració. Funciona amb el tàctil i només amb botons.\n\nAmb botons, esquerra i dreta es mouen per una fila, els botons de pàgina es mouen entre files, Selecciona prem una tecla i Enrere cancel·la; esquerra i dreta donen la volta a una fila, i amunt i avall es mantenen a la teva columna. Maj. fa que la lletra següent sigui majúscula; prem-lo dues vegades per a totes majúscules, i una altra per deixar-ho. Mantén premuda una lletra (amb botons: mantén premut Selecciona sobre ella) per obtenir-ne la majúscula, triada de seguida, i accents com é i è; en alemany, ä, ö, ü i ß surten així de a, o, u i s (amb botons, el teclat ho indica en aquestes lletres). D'acord acaba; amb botons, mantén premut Enrere per acabar des de qualsevol lloc (Enrere sol cancel·la), o mantén premut Selecciona sobre una tecla que no sigui una lletra. Enganxa insereix el text del porta-retalls i Telèfon, quan s'ofereix, et deixa escriure al telèfon.\n\nA la configuració, a Dispositiu, Teclat: Disposicions del teclat tria les disposicions. Per defecte segueix l'idioma dels menús; si en tries diverses, una tecla canvia entre elles. Tecles de dièresi dona tecles pròpies per a ä, ö, ü i ß. Mida fa més grans les tecles i les lletres; només amb botons, les files són les d'un teclat d'ordinador. A les pantalles tàctils, Forma de les tecles canvia l'aspecte de les tecles. Majúscules automàtiques comença cada frase amb una majúscula."
