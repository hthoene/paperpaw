sleep.plugin.name = Pantalla de repòs
sleep.plugin.description = Mostra un gat dormint, la coberta del llibre, les teves imatges o un missatge mentre el dispositiu està en repòs.
sleep.plugin.how = "La pantalla de repòs decideix què mostra la pantalla mentre el dispositiu està en repòs. La tinta electrònica manté la imatge sense corrent.\n\nTria-la a la configuració, a Dispositiu, Pantalla de repòs, amb Mostra: un gat dormint (per defecte), la coberta del llibre, les meves imatges, el logotip i «En repòs», ginys, la pàgina tal com és, o la pàgina amb una imatge. Les meves imatges mostra els fitxers de la carpeta d'imatges un darrere l'altre.\n\nSense coberta o sense imatge, es mostra el gat. Si el sistema dibuixa la pantalla de repòs per si mateix, aquesta configuració s'amaga.\n\nLa pantalla d'apagat, Mostra en apagar, es dibuixa una vegada quan s'apaga el dispositiu, des del menú d'engegada o passat el temps d'Apaga després del repòs (no quan una bateria baixa talla el corrent). És com la pantalla de repòs tret que triïs el logotip i «Apagat», el gat, la coberta o les meves imatges. Un altre connector pot oferir-hi una pantalla.\n\nLa pantalla d'inici i la de reinici, Mostra en iniciar i Mostra en reiniciar, són les pròpies del dispositiu tret que un altre connector n'ofereixi una. Els connectors encara no s'executen mentre s'inicia el dispositiu: la pantalla triada per a l'inici es dibuixa abans, quan el dispositiu s'apaga o es reinicia, i es mostra en l'inici següent. Una pantalla que no està a punt a temps, o una imatge malmesa, cedeix el lloc a la del dispositiu; el dispositiu s'apaga o es reinicia en tot cas."
