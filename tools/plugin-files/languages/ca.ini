pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Un temporitzador de concentració amb rondes de feina i de pausa, ginys i un recompte diari.
pomodoro.plugin.how = "Un temporitzador Pomodoro: treballa en rondes de concentració i després descansa. No necessita configuració: 25 minuts de concentració, 5 de descans i, després de quatre rondes, una pausa llarga de 15.\n\nObre Pomodoro des del menú d'eines i prem Inicia, o afegeix-ne els ginys a la pantalla d'inici (mantén premuda la pantalla d'inici i afegeix un giny): Temporitzador Pomodoro mostra la fase i els minuts que queden, Pomodoro inicia/pausa és un botó, i Pomodoro d'avui compta les rondes que has acabat, amb el teu objectiu diari. Un toc sobre el temporitzador l'inicia o el pausa; mantén-lo premut per obrir la pantalla completa.\n\nEl temporitzador continua en marxa quan surts de la pantalla, i continua segons el rellotge després de reiniciar. Mentre el lector està en repòs no s'executa res: una fase que hagi acabat mentrestant s'indica quan es desperta. Un avís t'indica quan s'acaba una fase. Per estalviar bateria, el rellotge s'actualitza un cop per minut (cada deu segons en l'últim minut a la pantalla completa) i mai no manté el lector despert.\n\nA Pomodoro, a la configuració, estableixes les durades i les rondes d'un conjunt, i si la fase següent s'inicia per si sola. A Més: un parpelleig de la pantalla o un llampec de la llum frontal quan acaba una fase i un objectiu diari."
