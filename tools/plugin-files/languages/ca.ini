wifi.plugin.name = Wi-Fi
wifi.plugin.description = Es connecta a xarxes Wi-Fi quan cal i després apaga la ràdio.
wifi.plugin.how = "La Wi-Fi es connecta a una xarxa quan un connector necessita internet (un catàleg, una sincronització, la botiga, una transferència) i torna a apagar la ràdio un minut després que res no la faci servir, o de seguida quan es mostra Inici o un llibre, per estalviar bateria i memòria.\n\nObre Wi-Fi des de Configuració, o des de l'element Wi-Fi de la línia d'estat. Xarxes llista les que són a l'abast; tria'n una i escriu-ne la contrasenya, o tria Configura amb un telèfon i escriu el nom i la contrasenya al navegador del telèfon en lloc de fer-ho al dispositiu. Oblida elimina una xarxa desada.\n\nLes contrasenyes es queden a la targeta, guardades de manera segura, i no es tornen a mostrar mai. A Connecta quan calgui estableixes quant de temps continua activada la Wi-Fi després de l'últim ús, si continua activada mentre carrega, i quina xarxa desada va primer quan n'hi ha diverses a l'abast."
