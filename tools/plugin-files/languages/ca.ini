format-cbz.setting.direction = Sentit de lectura del còmic
format-cbz.setting.direction.help = Manga: els canvis de pàgina s'inverteixen.
format-cbz.direction.book = Segons el llibre
format-cbz.direction.ltr = D'esquerra a dreta
format-cbz.direction.rtl = De dreta a esquerra
format-cbz.setting.panels = Vinyeta a vinyeta
format-cbz.setting.panels.help = Una vinyeta alhora, els canvis de pàgina les van recorrent.
format-docx.plugin.name = Documents DOCX
format-docx.plugin.description = Obre fitxers .docx, tal com els desen Word i altres programes.
format-docx.plugin.how = "Obre documents .docx com a llibres: títols amb índex, llistes, taules, negreta i cursiva, enllaços i imatges (JPEG, PNG, GIF).\n\nPosa els fitxers a la carpeta de la biblioteca i obre'ls des de la biblioteca. El títol i l'autor surten de les propietats del document. Les notes a peu de pàgina, les capçaleres i els peus de pàgina, i els comentaris no es mostren."
format-docx.title = Document DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Obre llibres EPUB amb els seus estils, índex i imatges.
format-epub.plugin.how = "Els llibres EPUB s'obren des de la biblioteca com qualsevol altre llibre, amb el seu índex, les imatges i l'estil de l'editorial. Les pàgines web (HTML), Markdown, FictionBook (.fb2) i els arxius de còmics (.cbz) s'obren igual, cadascun com a connector propi.\n\nUn capítol es converteix la primera vegada que l'obres i es guarda a la memòria cau del connector, de manera que després és més ràpid i els llibres grans funcionen en dispositius petits. Trobaràs l'índex a Contingut al menú de lectura. Si s'aplica l'estil del mateix llibre ho determina l'opció Format de l'editorial, a Lectura."
format-epub.title = Llibre electrònic EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Obre llibres FictionBook (.fb2, també comprimits).
format-fb2.plugin.how = "Obre llibres FictionBook (.fb2), habituals per a llibres russos i d'altres, també comprimits (.fb2.zip), amb el seu títol, autors, coberta i capítols.\n\nPosa'ls a la carpeta de la biblioteca; apareixen a la biblioteca i s'obren com qualsevol altre llibre."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Obre pàgines web desades com a fitxers, mostrant només el que cal llegir.
format-html.plugin.how = "Obre pàgines web desades com a fitxers (.html, .htm, .xhtml) com a llibres: només el que cal llegir, sense menús, publicitat i similars al voltant.\n\nPosa el fitxer a la carpeta de la biblioteca i obre'l des de la biblioteca com qualsevol llibre. Els enllaços dins de la pàgina funcionen; les imatges apareixen on són al fitxer."
format-html.title = Pàgina web (HTML)
format-images.plugin.name = Imatges
format-images.plugin.description = Obre imatges (.jpg, .png, .gif) com a llibres, una pàgina per imatge.
format-images.plugin.how = "Les imatges (.jpg, .png, .gif) s'obren des de la biblioteca com a llibres, una imatge per pàgina, ajustada a la pantalla.\n\nPer llegir una carpeta sencera d'imatges, obre'n la primera: les imatges següents de la carpeta la segueixen, segons l'ordre dels seus noms (2 abans de 10). Una imatge posterior de la carpeta comença allà; la posició de cadascuna es recorda per separat. Es llegeix una carpeta de fins a 300 imatges a partir de la que obres.\n\nUn fitxer que no és una imatge, o que és massa gran, mostra el seu nom en lloc seu. Per a un llibre amb moltes imatges i títol propi, un arxiu de còmic (.cbz) és la millor forma."
format-images.title = Imatge
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Obre fitxers Markdown (.md), p. ex. notes.
format-markdown.plugin.how = "Obre fitxers Markdown (.md), com notes, com a llibres: títols, llistes, citacions i èmfasi tal com es pretén, no com a signes.\n\nPosa els fitxers a la carpeta de la biblioteca i obre'ls des de la biblioteca. El primer títol és el títol del llibre; les imatges al costat del fitxer apareixen on les anomena el text."
format-markdown.title = Markdown
format-mobi.plugin.name = Llibres MOBI
format-mobi.plugin.description = Obre fitxers .mobi i .azw sense DRM.
format-mobi.plugin.how = "Els llibres MOBI (.mobi, .azw) s'obren des de la biblioteca com qualsevol llibre, sense res a configurar. El títol, els autors, l'idioma i la coberta surten del llibre, i la llista de continguts es crea a partir dels seus títols.\n\nEl llibre es converteix la primera vegada que l'obres, cosa que en un de llarg triga uns quants segons; després s'obre a l'instant. Es mostren el text, els títols, la negreta i la cursiva, els enllaços i les imatges.\n\nEls llibres amb DRM (la majoria dels comprats en una botiga) no es poden obrir, ni tampoc els llibres amb compressió Huffman o en la forma KF8 més nova (.azw3): PaperPaw ho diu quan els obres. Una còpia en EPUB, feta amb una eina com Calibre, sempre s'obre."
format-mobi.title = Llibres MOBI
format-rtf.plugin.name = Documents RTF
format-rtf.plugin.description = Obre fitxers .rtf com a llibres.
format-rtf.title = Documents RTF
format-txt.plugin.name = Text sense format
format-txt.plugin.description = Obre fitxers de text sense format (.txt).
format-txt.plugin.how = "Els fitxers de text sense format (.txt) s'obren des de la biblioteca com qualsevol llibre, sense res a configurar. El connector llegeix text UTF-8, UTF-16 i Windows-1252 i detecta la codificació per si sol.\n\nEls paràgrafs segueixen les línies en blanc del fitxer; si un fitxer no en té, cada línia és un paràgraf. En els fitxers del Projecte Gutenberg, el text de la llicència a l'inici i al final s'omet, i el títol i l'autor es prenen de la capçalera.\n\nEl fitxer no es carrega mai sencer, de manera que fins i tot els textos molt grans s'obren en dispositius petits."
format-txt.title = Text sense format
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Obre llibres XTC i XTCH, les pàgines ja renderitzades dels lectors Xteink.
format-xtc.plugin.how = "Els fitxers XTC i XTCH són llibres les pàgines dels quals ja estan renderitzades com a imatges, creats per convertidors per als lectors Xteink. S'obren des de la biblioteca com qualsevol llibre.\n\nCom que cada pàgina és una imatge fixa, no es pot canviar la mida del text ni posar-lo en un altre tipus de lletra. Les pàgines són en blanc i negre o tenen quatre grisos. Cada pàgina es descodifica quan es mostra, de manera que cal poca memòria, també a l'X4.\n\nEl títol, l'autor i els capítols es prenen del fitxer quan en té."
format-xtc.title = Pàgines XTC
help.plugin.name = Consells
help.plugin.description = Mostra què fan els controls d'una pantalla, la primera vegada que s'obre.
help.plugin.how = "La primera vegada que s'obre una pantalla, una breu nota a sobre diu què fan els seus controls: les parts de la pantalla on actua un toc, emmarcades, i què fan els botons.\n\nUn toc o qualsevol botó tanca la nota, i no torna a aparèixer per a aquesta pantalla. No mostris més consells els desactiva tots.\n\nA la configuració, a Sistema, Consells els activa o els desactiva, i Torna a mostrar els consells fa que la nota de cada pantalla es mostri una vegada més."
