stats.plugin.name = Estadístiques de lectura
stats.plugin.description = Registra quant de temps i quant llegeixes, amb un calendari i les xifres de cada llibre.
stats.plugin.how = "Estadístiques de lectura registra quant de temps llegeixes cada pàgina. Les veus com a resum amb avui, la setmana i la teva ratxa, com a calendari, i amb les xifres de cada llibre.\n\nObre-les des d'Eines, o des de Més al lector. A la configuració, a Estadístiques de lectura, pots desactivar Registra la lectura, fixar un Objectiu diari, i fixar la Pàgina més curta i la Pàgina més llarga que compten, perquè fullejar o un llibre deixat obert no distorsionin les xifres.\n\nSincronitza amb KOReader comparteix les estadístiques amb KOReader mitjançant una carpeta WebDAV. També incorpora les estadístiques de KOReader al mateix dispositiu. El registre necessita que el rellotge estigui ajustat: si no ho és, connecta't una vegada a la Wi-Fi."
