plugin-manager.plugin.name = Gestor de connectors
plugin-manager.plugin.description = Llista els connectors i els activa i desactiva.
plugin-manager.plugin.how = "El gestor de connectors llista cada connector amb la seva versió i descripció, i activa i desactiva connectors.\n\nEl trobaràs a Configuració, com a Gestiona els connectors. Configuració dels connectors és una pàgina independent per a preferències com l'ús de la xarxa de cada connector. Toca un connector per activar-lo o desactivar-lo (amb botons, selecciona'l). El canvi s'aplica després de reiniciar: la barra de sota ofereix aleshores Reinicia ara. Mantén premut un connector (amb botons, mantén premut Selecciona) per llegir com funciona.\n\nUn connector marcat Sempre activat no es pot desactivar, i un marcat Necessari només quan un altre connector fa la seva feina, o PaperPaw no tindria manera de tornar enrere. A Pantalles tries quin connector mostra un lloc que n'ofereixen diversos."
