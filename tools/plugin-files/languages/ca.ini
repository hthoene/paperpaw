tasks.plugin.name = Tasques
tasks.plugin.description = Llistes de tasques pendents amb dates de venciment i prioritats, al lector o sincronitzades amb el teu servidor CalDAV, amb ginys per a la pantalla d'inici.
tasks.plugin.how = "Llistes de tasques pendents al teu lector: tasques amb data de venciment i prioritat, que marques quan estan fetes. Funcionen sense configuració ni xarxa, i es poden mantenir sincronitzades amb un servidor CalDAV (Nextcloud, Radicale, Baïkal, Fastmail i altres), de manera que les mateixes llistes són al telèfon i a l'ordinador.\n\nObre Tasques des del menú d'eines. La primera fila indica la llista mostrada; tria-la per a una altra llista, per a Avui i endarrerides de totes les llistes, per a una llista nova, per sincronitzar o per establir el compte. Afegeix una tasca obre el teclat. Selecciona sobre una tasca la marca com a feta (una altra vegada: no feta). Mantén premuda una tasca o prem Menú per canviar-ne el títol, la data de venciment (avui, demà, d'aquí a una setmana, o una data que escriguis com 2026-12-24) o la prioritat, o per eliminar-la. Les tasques obertes van primer, per dia i després per prioritat; les fetes es queden al final durant una setmana (es pot canviar a Tasques a la configuració) i després surten del lector.\n\nGinys per a la pantalla d'inici (mantén premuda la pantalla d'inici i afegeix un giny): Tasques d'avui mostra el que venç avui o està endarrerit, Llista de tasques mostra una llista, Tasques obertes les compta, i Tasca següent mostra la que toca fer després. Un toc sobre una tasca d'un giny la marca com a feta; un toc sobre un títol obre les llistes.\n\nPer sincronitzar, tria Compte CalDAV a la fila de llistes i introdueix l'adreça del servidor, el teu nom d'usuari i una contrasenya (millor una contrasenya d'aplicació). N'hi ha prou amb l'adreça del servidor, p. ex. cloud.example.com/remote.php/dav; el lector hi troba les teves llistes de tasques. Cada llista de tasques del servidor es converteix en una llista al lector. El lector sincronitza quan obres Tasques, quan tries Sincronitza ara i quan la xarxa ja està activada; el que canvies sense xarxa espera i s'envia més tard. Si una tasca s'ha canviat al lector i en un altre lloc mentrestant, es pren la versió del servidor i la teva es conserva com a tasca nova al costat, de manera que no es perd res. Les notes, les alarmes i tota la resta que una tasca té al servidor es queden com són. Les tasques que es repeteixen es mostren però es canvien on les has creat. El lector admet fins a 200 tasques en 12 llistes."
