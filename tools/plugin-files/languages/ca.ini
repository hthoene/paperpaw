fonts-browser.plugin.name = Més tipus de lletra
fonts-browser.plugin.description = Mostra tipus de lletra d'internet, cadascun amb una mostra, i els baixa per llegir-hi.
fonts-browser.plugin.how = "Més tipus de lletra llista tipus de lletra d'una biblioteca de tipus de lletra d'internet, cada nom escrit amb el seu propi tipus, i baixa els que vols fer servir per llegir.\n\nEl trobaràs al final de la llista de tipus de lletra on es tria el tipus de lletra de lectura, a Configuració, a Lectura, com a Tipus de lletra; les línies d'estat tenen la mateixa entrada per al seu tipus de lletra. Toca un tipus de lletra (amb botons, prem Selecciona) per veure'l més gran amb una frase d'exemple i tria Baixa. Pots sortir de la pàgina mentre es baixa. Quan acabi, tria Llegeix amb (el nom del tipus de lletra) o Fes-lo servir a les línies d'estat. Actualitza obté una versió més nova, Elimina suprimeix el tipus de lletra del dispositiu.\n\nNecessita Wi-Fi.\n\nELS TEUS PROPIS TIPUS DE LLETRA\n\nAl costat de Més tipus de lletra, la mateixa llista té Els teus tipus de lletra, que mostra aquesta part de l'ajuda. Un tipus de lletra propi és un fitxer .ttf o .otf, per exemple de Google Fonts.\n\nA Android i altres dispositius que dibuixen fitxers de tipus de lletra: copia el fitxer a la carpeta fonts (a Android: PaperPaw/fonts a l'emmagatzematge compartit), reinicia PaperPaw i tria el tipus de lletra a Configuració, a Lectura, com a Tipus de lletra.\n\nA Xteink X4 i X4 Pro: aquests lectors llegeixen paquets de tipus de lletra, no fitxers de tipus de lletra, perquè els fitxers no hi cabrien a la memòria. Crea un paquet en un ordinador amb paperpaw-fontgen, per a cada estil que tinguis (el normal és necessari):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nAixò crea la carpeta plugins/font-my-font. Copia-la a la carpeta plugins de la targeta de memòria, reinicia i tria My Font com a Tipus de lletra. Un paquet d'un sol estil ocupa uns mig megabyte per a lletres llatines; els estils que ometis es dibuixen amb el normal. L'eina diu quantes de les lletres que demanes té el tipus de lletra (--chars latin,cyrillic,greek hi afegeix escriptures): un tipus de lletra sense les lletres del teu llibre no les pot mostrar, així que busca'n un que cobreixi la seva escriptura.\n\nEls tipus de lletra de Més tipus de lletra funcionen igual i no necessiten ordinador.\n\nPer a un text petit més nítid al panell de tinta electrònica, afegeix --hinting light a l'ordre: ajusta les lletres a la quadrícula de píxels, com estan fets els tipus de lletra per defecte. Sense això, les lletres es dibuixen tal com les va dissenyar el tipus de lletra; --hinting normal i --hinting mono les ajusten més fortament. Els tipus de lletra amb marques, com l'àrab o el devanagari, és millor deixar-los sense."
