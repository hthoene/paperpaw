transfer.plugin.name = Transferència
transfer.plugin.description = Posa llibres i altres fitxers al dispositiu des d'un navegador de la mateixa xarxa.
transfer.plugin.how = "La transferència per Wi-Fi posa llibres i altres fitxers al dispositiu des d'un navegador de la mateixa xarxa, sense cable ni aplicació. També pots obtenir fitxers, crear carpetes i suprimir.\n\nObre-la des d'Eines. La pantalla mostra una adreça com a text i com a codi QR: obre-la en un navegador d'un telèfon o d'un ordinador, o escaneja el codi. L'adreça conté una clau que es crea de nou cada vegada, de manera que altres usuaris de la xarxa no poden accedir als teus fitxers. La transferència funciona mentre la pantalla està oberta.\n\nOn PaperPaw gestiona la Wi-Fi per si mateix, com a l'X4, Sense encaminador, a la part inferior, obre una xarxa pròpia del dispositiu, a la qual el telèfon s'uneix escanejant un codi."
