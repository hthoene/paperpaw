calibre.plugin.name = Biblioteca sense fil
calibre.plugin.description = Rep llibres per la xarxa. Funciona com a dispositiu sense fil per a Calibre.
calibre.plugin.how = "Biblioteca sense fil fa que el dispositiu aparegui a Calibre, a l'ordinador, com a dispositiu sense fil. Calibre li pot enviar llibres, llistar-los i suprimir-los. Els llibres van a la biblioteca.\n\nObre Biblioteca sense fil des del menú Eines, amb el dispositiu i l'ordinador a la mateixa xarxa Wi-Fi. A Calibre tria Connecta/comparteix i després Inicia la connexió del dispositiu sense fil. Quan el dispositiu ha trobat l'ordinador, en mostra el nom; toca Connecta (amb botons, prem Selecciona). Calibre pot afegir i suprimir llibres aquí, així que connecta't només al teu propi ordinador. Si tanques la pantalla, la connexió s'acaba.\n\nSi Calibre no es troba per si sol, introdueix l'adreça del seu ordinador a Configuració, a Biblioteca, com a Adreça a la part de Calibre. Si Calibre fa servir un port diferent del 9090, afegeix-lo com a :port, p. ex. 192.168.1.20:9091."
