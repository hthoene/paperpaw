keys.plugin.name = Botons i gestos
keys.plugin.description = Què fa cada botó, zona de toc i lliscament, canviat al mateix dispositiu.
keys.plugin.how = "Botons i gestos mostra què fa cada botó, zona de toc i lliscament, i et deixa canviar-ho al mateix dispositiu.\n\nObre'l a la configuració, a Dispositiu. Tria primer on s'aplica un canvi: A tot arreu, Durant la lectura, A la pantalla d'inici, A la biblioteca o en una eina. Després tria una entrada, com un botó mantingut premut o un lliscament des d'una vora, i tria una acció de la llista, en què pots cercar. Estàndard restableix el que defineixen els connectors i la disposició dels botons.\n\nA l'X4, es rebutja un canvi que deixaria sense cap botó per seleccionar, tornar enrere o avançar. Restableix els botons i els gestos, al final, desfà tots els canvis."
