news.plugin.name = Notícies
news.plugin.description = Obté canals de notícies (RSS, Atom) com a llibres per llegir.
news.plugin.how = "Notícies converteix canals RSS o Atom en llibres. Cada canal es converteix en un llibre a la carpeta News de la biblioteca, amb els seus articles més recents com a text sense format, per llegir com qualsevol altre llibre.\n\nObre Notícies des del menú Eines i tria Afegeix un canal; l'adreça és al lloc web del diari o del blog. Obtén les notícies obté tots els canals i substitueix els llibres anteriors. Mantén premut un canal (amb botons, mantén premut Selecciona) per obtenir-lo o eliminar-lo per separat. Un canal eliminat deixa el seu llibre a la biblioteca.\n\nObtenir-les necessita una xarxa. Articles per canal (Configuració, Biblioteca) fixa quants articles conté cada llibre. El giny Titulars de notícies els mostra a la pantalla d'inici."
