aids.plugin.name = Ajudes de lectura
aids.plugin.description = Inicis de paraula en negreta, paraules substituïdes, imatges: el text com el vols.
aids.plugin.how = "Les ajudes de lectura canvien l'aspecte del text d'un llibre mentre llegeixes. S'apliquen a tots els llibres. Inicis de paraula en negreta i Substitueix paraules estan desactivats al principi.\n\nLes trobaràs a la Configuració, a Lectura, a la secció Ajudes de lectura. Inicis de paraula en negreta posa en negreta la primera meitat de cada paraula, cosa que a algunes persones els fa més fàcil seguir el text. Substitueix paraules agafa parelles escrites com «Sr. = Senyor; p. ex. = per exemple», separades per punts i coma.\n\nNomés se substitueixen paraules senceres, exactament com les has escrit, de manera que una part d'una paraula més llarga no es toca mai. El fitxer del llibre en si no es modifica.\n\nLes imatges dels llibres es poden mostrar (com al principi), convertir en una línia curta com «[Imatge: un vaixell al mar]» que fa servir la descripció de la imatge, o ometre. Així una pàgina té més espai per al text, i no es descodifica res d'una imatge que no es mostra, cosa que fa que les pàgines canviïn més de pressa. Els còmics i altres llibres fets d'imatges no es modifiquen."
