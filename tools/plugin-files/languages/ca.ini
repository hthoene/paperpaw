diagnostics.plugin.name = Diagnòstic
diagnostics.plugin.description = Una pantalla de proves i una comprovació guiada de totes les parts d'un dispositiu.
diagnostics.plugin.how = "Diagnòstic és una pantalla de proves per comprovar un dispositiu: mostra tots els nivells de gris que pot mostrar el panell, quatre requadres per provar els botons i el tàctil, i un comptador de pàgines amb una barra de progrés per comparar els modes d'actualització.\n\nLa pantalla de proves no té cap entrada de menú. Només és la pantalla d'inici mentre cap altre connector no n'ofereix una, o quan la tries a Pantalles al gestor de connectors per al lloc Pantalla d'inici.\n\nSelecciona marca el requadre amb el focus, i els botons de fletxa es mouen entre els requadres; amb el tàctil, toca un requadre. Els botons de pàgina passen les pàgines de prova. Mantén premut Selecciona, o mantén un dit a la pantalla, per tornar a començar.\n\nLa comprovació del dispositiu, a Eines, quan PaperPaw és el microprogramari del dispositiu, repassa totes les parts d'un dispositiu pàgina a pàgina: la pantalla, els botons, el tàctil, la llum frontal, la bateria, la targeta, el rellotge, la Wi-Fi, el repòs i la memòria. Cada pàgina acaba amb Fallit, Omet i Superat, amb la resposta que suggereixen les mesures ja triada; les parts que un dispositiu no té s'ometen. Després de cada resposta escriu un informe a .paperpaw/plugins/diagnostics/device-check.txt, per enganxar-lo en una sol·licitud d'extracció. Enrere en surt, i quan l'obres de nou continua on era. En un dispositiu només amb botons, tria primer Comença a la pàgina dels botons; fins aleshores, les fletxes, Selecciona i Enrere funcionen com a totes les pàgines."
