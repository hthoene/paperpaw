opds.plugin.name = Catàlegs OPDS
opds.plugin.description = Explora catàlegs OPDS, en baixa els llibres i manté carpetes sincronitzades amb ells.
opds.plugin.how = "Els catàlegs OPDS són biblioteques en línia com Project Gutenberg, Calibre-Web, Kavita o Komga. Aquest connector les explora i hi fa cerques com si fossin carpetes i baixa els seus llibres a la biblioteca.\n\nObre Catàlegs des del menú Eines i tria Afegeix un catàleg: una adreça i, si el catàleg necessita un compte, un nom d'usuari i una contrasenya. Toca un catàleg per explorar-lo; mantén-lo premut (amb botons, mantén premut Selecciona) per sincronitzar-lo, editar-lo o eliminar-lo.\n\nAmb Sincronitza aquest catàleg activat, Sincronitza els catàlegs baixa els seus llibres nous a la seva carpeta. Llibres per sincronització limita quants en baixa una sincronització, perquè un catàleg gran no ompli el dispositiu. Una Carpeta al núvol (WebDAV) funciona en lloc d'un catàleg."
