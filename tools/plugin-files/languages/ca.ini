mail.plugin.name = Correu
mail.plugin.description = Llegeix i envia correu electrònic amb una contrasenya o una contrasenya d'aplicació (IMAP i SMTP), sense inici de sessió al navegador.
mail.plugin.how = "Correu llegeix i envia correu electrònic per IMAP i SMTP. Inicia la sessió amb la teva adreça i una contrasenya, sense inici de sessió al navegador, de manera que funciona amb qualsevol proveïdor que ho permeti.\n\nConfigura un compte a Configuració, Correu. Tria el proveïdor, escriu la teva adreça i la contrasenya. La majoria de proveïdors demanen una contrasenya d'aplicació: crea'n una a la configuració de seguretat del teu compte i fes-la servir aquí. La teva contrasenya normal sovint no funciona, i no va enlloc excepte al servidor del teu proveïdor. Es guarda amb les contrasenyes i les claus.\n\nObre Correu a les eines. Comprova el correu obté els últims missatges i les carpetes. Els missatges es guarden a la targeta, de manera que els pots llegir sense xarxa. El dispositiu es connecta, obté i es desconnecta, així que la Wi-Fi només està activada un moment.\n\nSi el teu proveïdor no és a la llista, tria Servidors propis i indica els noms dels servidors, els ports i la seguretat a la configuració avançada. Un servidor el certificat del qual no avala cap autoritat pregunta una vegada si hi confies; compara l'empremta digital amb la que mostra el teu proveïdor.\n\nUn missatge amb un llibre adjunt (EPUB, PDF i similars, fins a 2 MB) té a sota Obre el llibre: obté el fitxer, el posa a la teva biblioteca i l'obre.\n\nPer veure el correu nou sense obrir Correu, activa Comprova el correu nou en segon pla a Configuració, Correu, i tria amb quina freqüència (cada 15, 30 o 60 minuts). Està desactivat fins que l'actives. Aleshores el lector es connecta de tant en tant per una connexió segura mentre és despert i té xarxa, un compte darrere l'altre, i actualitza el nombre de missatges no llegits a l'Inici. Gasta una mica de bateria. Obrir Correu atura una comprovació en curs.\n\nEls ginys de la pantalla d'inici mostren el nombre de missatges no llegits, els últims i els destacats, una bústia, i una drecera per escriure un missatge."
