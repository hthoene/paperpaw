anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Estudia les targetes pendents d'Anki a l'ordinador i hi envia les respostes, mitjançant el complement AnkiConnect.
anki.plugin.how = "Anki et permet estudiar al lector les targetes que toca repassar a Anki, a l'ordinador, i hi envia les respostes. Fa servir el complement lliure AnkiConnect (codi de complement 2055492159) i mai AnkiWeb. Al principi està desactivat: afegeix-lo des de la botiga de connectors.\n\nA l'ordinador: instal·la AnkiConnect a Anki (Eines, Complements, Obtén complements) i reinicia Anki. Anki ha d'estar obert durant la sincronització.\n\nPer defecte AnkiConnect només respon a l'ordinador on s'executa (127.0.0.1), de manera que el lector no hi pot accedir. Obre Eines, Complements, AnkiConnect, Configuració i posa «webBindAddress» a «0.0.0.0» (escolta a la xarxa domèstica). El port, «webBindPort», és 8765 llevat que el canviïs. Si hi defineixes una «apiKey», introdueix aquí la mateixa clau. Reinicia Anki després de canviar la configuració i permet Anki al tallafoc de l'ordinador si ho pregunta. Fes-ho servir només en una xarxa de confiança: qualsevol que hi sigui pot accedir a AnkiConnect, per això convé una clau.\n\nAl lector: obre Anki des d'Eines, i després introdueix l'adreça de l'ordinador (per exemple 192.168.1.20) a Ordinador, el port si no és 8765 i la clau d'API si n'has definit una. Tria una Baralla, o deixa-ho buit per a totes les baralles. Després tria Sincronitza amb Anki, amb la Wi-Fi activada: primer s'envien les respostes pendents, i després s'obtenen les targetes que toca repassar (i el nombre de targetes noves que hagis indicat), com a màxim 50. Tria Estudia per repassar-les, sense xarxa: mostra la resposta i valora-la amb De nou, Difícil, Bé o Fàcil. Les respostes es conserven al lector, també sense Wi-Fi, i van a Anki amb la sincronització següent. Anki decideix quan torna una targeta: una targeta que has respost amb De nou es torna a obtenir en una sincronització posterior quan Anki indiqui que toca.\n\nSincronitza en obrir, a la configuració, sincronitza cada vegada que obres la pantalla. Prémer un botó mai no fa servir la xarxa."
