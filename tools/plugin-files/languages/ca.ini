smart-home.plugin.name = Domòtica
smart-home.plugin.description = Valors i interruptors del teu propi Home Assistant en un tauler i com a ginys de la pantalla d'inici. Funciona amb Home Assistant a la teva xarxa domèstica.
smart-home.plugin.how = "Domòtica mostra valors i interruptors del teu propi Home Assistant: temperatures, humitat, energia, portes i finestres, llums, interruptors i escenes. Parla amb el teu servidor per la seva API REST a la teva xarxa domèstica; no hi intervé cap altre servei.\n\nObre Domòtica des del menú d'eines i després Connexió: escriu l'adreça del teu Home Assistant (per exemple http://homeassistant.local:8123) i un token d'accés de llarga durada (en pots crear un a la part inferior de la pàgina del teu perfil de Home Assistant). El token es guarda entre les contrasenyes i les claus, mai en un fitxer de configuració. L'http senzill només es fa servir per a adreces de la teva xarxa domèstica; per a un servidor en un altre lloc, activa «Servidors fora de la xarxa domèstica» a la configuració i fes servir https amb un certificat vàlid.\n\nTria entitats obre una llista del que té el teu servidor: cerca per nom o id i selecciona una entitat per mostrar-la (torna-la a seleccionar per treure-la). Li pots donar una estança, que l'agrupa al tauler i als ginys d'estança. Se'n conserven fins a 24. Al tauler, selecciona un llum, un interruptor o una escena per accionar-lo: la fila mostra la resposta del servidor. Un sensor que seleccionis es torna a llegir.\n\nGinys (mantén premuda la pantalla d'inici i afegeix un giny): Valor de domòtica mostra una lectura en gran, grup llista les entitats d'una estança, interruptor és un botó per a un llum o un interruptor, i estança és una targeta amb les lectures i els interruptors d'una estança. La configuració de cada giny diu quina entitat o estança mostra.\n\nLa casa es llegeix quan obres el tauler, quan ho demanes (la fila Actualitza ara o un toc en un giny de valor o de grup), quan el lector es desperta si la Wi-Fi ja està activada, i segons la periodicitat que indiquis mentre el carregador està connectat. Mai no activa la ràdio per si sol i mai no la manté activada."
