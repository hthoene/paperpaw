format-cbz.plugin.name = Còmics
format-cbz.plugin.description = Obre arxius de còmics (.cbz), una imatge per pàgina.
format-cbz.plugin.how = "Obre arxius de còmics (.cbz): una imatge per pàgina, ajustada a la pantalla, segons l'ordre dels seus noms (2 abans de 10).\n\nPosa'ls a la carpeta de la biblioteca i obre'ls des de la biblioteca; passa les pàgines com en qualsevol llibre. Les imatges grans triguen un moment la primera vegada, a l'X4 més que en altres llocs.\n\nConfiguració de lectura (Configuració, Lectura): «Vinyeta a vinyeta» mostra una sola vinyeta de la pàgina alhora, tan gran com permet la pantalla, i els canvis de pàgina les van recorrent; una pàgina sense vinyetes es mostra sencera. «Sentit de lectura del còmic» inverteix els canvis de pàgina per al manga (de dreta a esquerra); el ComicInfo.xml del mateix llibre ja ho indica. La biblioteca mostra el títol d'un llibre i la seva sèrie i número a partir de ComicInfo.xml."
