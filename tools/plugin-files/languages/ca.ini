setup.plugin.name = Configuració inicial
setup.plugin.description = Una breu guia per les opcions que importen, en el primer inici.
setup.plugin.how = "La configuració inicial és una breu guia per les opcions que importen, que es mostra una sola vegada, la primera vegada que s'inicia PaperPaw. Cada pàgina pregunta una cosa, com l'idioma, els botons, la mida del text, el fus horari, la Wi-Fi o uns quants connectors per afegir, amb una resposta sensata ja triada, de manera que Següent sempre va bé. Els passos que aquest dispositiu no necessita s'ometen.\n\nToca els botons, o fes servir els botons amunt i avall i Selecciona. Omet a la primera pàgina surt de la configuració de seguida. L'última pàgina diu d'on vénen els teus llibres.\n\nPer tornar-la a executar, obre la configuració i tria Configura PaperPaw. Tot el que s'hi triï es pot canviar després a la configuració."
