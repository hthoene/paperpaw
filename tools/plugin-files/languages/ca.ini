notes-vault.plugin.name = Dipòsit de notes
notes-vault.plugin.description = Llegeix una carpeta de notes Markdown per carpetes, etiquetes i últims canvis, amb ginys per a la pantalla d'inici. Funciona amb dipòsits d'Obsidian.
notes-vault.plugin.how = "Dipòsit de notes llegeix una carpeta de notes Markdown (fitxers .md senzills, tal com les desen les aplicacions de notes). Funciona amb dipòsits d'Obsidian.\n\nTria la carpeta del dipòsit a la configuració, o a la pàgina del dipòsit a les eines. La pàgina ofereix aleshores les carpetes tal com són a la targeta, les últimes notes canviades, les etiquetes i una cerca als títols de les notes.\n\nLa primera vegada, el dipòsit s'indexa en segon pla mentre la seva pàgina està oberta; un dipòsit de milers de notes triga uns quants minuts, i després s'obre a l'instant. L'índex es desa a la targeta i es torna a fer quan s'obre la pàgina del dipòsit al cap d'unes hores, o quan tries Actualitza.\n\nUna nota s'obre al lector. Els enllaços a altres notes ([[Nota]], [[Nota|paraules]], [[Nota#Títol]]) es troben pel nom de la nota en qualsevol lloc del dipòsit; seguir-ne un obre aquella nota, i Enrere torna a la nota anterior.\n\nMai no es canvia res del dipòsit. Els ginys per a la pantalla d'inici (notes recents, una nota fixada, una nota del dia, una nota a l'atzar, etiquetes, cerca) s'afegeixen a l'editor de la pantalla d'inici. Un giny pot prendre les notes d'una sola carpeta: escriu la ruta de la carpeta des de l'arrel de la targeta (per exemple Notes/Feina) a la configuració del giny; si es deixa buit, pren totes les notes del dipòsit."
