store.plugin.name = Botiga de connectors
store.plugin.description = Cerca, instal·la, actualitza i elimina connectors per a aquest dispositiu.
store.plugin.how = "La botiga de connectors cerca a internet connectors per a aquest dispositiu i els instal·la, actualitza i elimina. Obre-la des d'Eines; necessita Wi-Fi.\n\nL'inici mostra el que recomana la biblioteca, el que és nou o popular ara, i després els grups. Un grup llista els seus connectors en una barreja equitativa que canvia cada dia, perquè tots els connectors es vegin; ordena'ls de la A a la Z, per novetat o per última actualització, i vés a una lletra en llistes llargues. Obre'n un per veure'n la pàgina, amb la mida i la memòria que ocupa, i després tria Instal·la, Actualitza o Elimina. Actualitza-ho tot posa al dia tots els connectors instal·lats.\n\nEls connectors amb codi s'executen amb accés complet al dispositiu: la botiga ho diu i ho pregunta primer, i s'inicien després de reiniciar. Si un va malament, PaperPaw s'inicia sense connectors amb codi i diu quin. Biblioteca de connectors indica d'on ve la llista.\n\nConnectors de la comunitat, a Configuració, Sistema, també llista connectors que altres han publicat a GitHub. Ningú no els ha revisat: estan marcats com a Sense revisar, la pàgina d'un connector amb codi mostra la clau amb què està signat, i una actualització signada amb una altra clau no s'instal·la.\n\nFonts, l'última fila de l'inici, afegeix llistes de connectors d'altres per la seva adreça (https://…/plugins.json), en llista una en lloc de la de PaperPaw, o l'elimina. En lloc d'escriure, posa un fitxer sources.txt amb una adreça a cada línia a .paperpaw/plugins/store de la targeta: les adreces apareixen a Fonts com a noves. PaperPaw no comprova una font ni els seus connectors, i el dispositiu contacta amb el servidor de la font. Una font signa la seva llista; el dispositiu conserva la clau de la primera llista que llegeix i a partir d'aleshores només accepta llistes i connectors amb codi signats amb aquesta clau. Un connector només rep les actualitzacions de la font des de la qual s'ha instal·lat. La biblioteca pròpia de PaperPaw sempre hi és i no es pot eliminar; en sortir de la botiga es torna a ella."
