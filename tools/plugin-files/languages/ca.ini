weather.plugin.name = Temps
weather.plugin.description = El temps d'ara i dels propers dies com a ginys, d'Open-Meteo.
weather.plugin.how = "El temps mostra el temps d'ara i dels propers dies com a ginys per a la pantalla d'inici, d'Open-Meteo, que no necessita compte ni clau. Temps ara mostra la temperatura, l'estat del cel i més coses a triar; Previsió mostra els propers dies en una fila o en una llista.\n\nTria primer un lloc: a la configuració, a Temps, Lloc (escriu un nom i després tria'l entre els llocs trobats). Només se n'envien les coordenades, i només mentre es mostra un giny del temps. Afegeix els ginys editant la pantalla d'inici.\n\nEl temps s'obté com a màxim tan sovint com diu Actualitza com a màxim cada, i només si hi ha xarxa: mai no activa la Wi-Fi per si sol.\n\nDades meteorològiques d'Open-Meteo.com (https://open-meteo.com), sota la llicència Creative Commons Reconeixement 4.0 (CC BY 4.0)."
