translate.plugin.description = Tradueix en línia el text seleccionat, amb DeepL.
translate.plugin.how = "La traducció tradueix en línia el text seleccionat amb DeepL. Selecciona text en un llibre i tria Tradueix al menú del text seleccionat: la traducció apareix sobre la pàgina com una entrada de diccionari. Els botons de pàgina o els tocs la desplacen, i Selecciona o un toc al final la tanca.\n\nNecessita una xarxa i una clau d'API de DeepL pròpia, gratuïta a deepl.com (DeepL API Free, uns 500.000 caràcters al mes). Mentre no la introdueixis, el tauler ho diu, i un toc la demana.\n\nA la configuració, a Lectura, a la secció Traducció, Tradueix a estableix l'idioma; al principi és el de PaperPaw."
