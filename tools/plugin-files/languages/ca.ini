battery.plugin.name = Ús de la bateria
battery.plugin.description = Registra la bateria i mostra quant dura.
battery.plugin.how = "Ús de la bateria anota la càrrega aproximadament cada minut mentre el dispositiu és actiu, juntament amb el que ha fet: actualitzacions de pantalla i pàgines canviades. Amb això calcula quant gasten una hora activa i 100 pàgines, i quant dura la bateria a aquest ritme.\n\nObre Bateria des del menú Eines. Mostra la càrrega actual, aquesta sessió, l'ús amb bateria fins ara i les teves últimes sessions. Es pagina amb els botons de pàgina, o tocant les fletxes de dalt.\n\nCal una estona de lectura amb bateria perquè les xifres vulguin dir alguna cosa. El registre està activat per defecte i es pot desactivar a Configuració, a Dispositiu, Energia, com a Registra l'ús de la bateria."
