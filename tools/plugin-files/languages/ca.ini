reading-goal.plugin.name = Objectiu de lectura
reading-goal.plugin.description = Minuts per llegir al dia, i un gat a la pantalla d'inici l'estat d'ànim del qual segueix la lectura d'avui.
reading-goal.plugin.how = "Un gat a la pantalla d'inici mostra com va la lectura d'avui: trist mentre encara no has llegit, així així després d'una mica, content a partir de la meitat de l'objectiu diari, feliç quan l'has assolit.\n\nAfegeix el giny Gat de lectura a la pantalla d'inici (mantén premuda la pantalla d'inici i afegeix un giny), o tria El gat de lectura d'avui com a pantalla de repòs. Un toc sobre el gat obre l'objectiu diari; és l'objectiu de les estadístiques de lectura, que compten els minuts que llegeixes.\n\nA la configuració, a Lectura, Content a partir de i Feliç a partir de estableixen a partir de quina part de l'objectiu el gat està content o feliç, i Imatges pròpies una carpeta d'imatges (sad, meh, content i happy) que es mostren en lloc dels gats. Les imatges són fitxers PNG o JPEG; sense carpeta, es mostren els gats."
