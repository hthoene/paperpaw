notes-overview.plugin.name = Totes les notes
notes-overview.plugin.description = Els marcadors i els ressaltats de tots els llibres en una sola llista, i una exportació com a My Clippings.txt.
notes-overview.plugin.how = "Totes les notes llista cada llibre en què has fet un marcador o un ressaltat, amb quants n'hi ha. Obre-ho a Eines. Tria un llibre per veure'n les notes, i una nota per obrir el llibre en aquell lloc.\n\nAl final de la llista, Exporta com a My Clippings.txt escriu totes les notes en un sol fitxer, a la carpeta Exports al costat de la biblioteca, en la forma que fa servir un Kindle (UTF-8). Les aplicacions que llegeixen el My Clippings.txt d'un Kindle el poden llegir. Una nota d'un ressaltat és una entrada pròpia, com en un Kindle. Com que aquí un llibre no té ubicacions de Kindle, «location» és el punt del llibre on és la nota, en percentatge. El fitxer s'escriu de nou cada vegada; substitueix l'anterior."
