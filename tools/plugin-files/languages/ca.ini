picture-home.plugin.name = Pantalla d'inici amb imatge
picture-home.plugin.description = Una pantalla d'inici amb una imatge teva darrere dels ginys, i una barra d'estat que tu configures.
picture-home.plugin.how = "La pantalla d'inici amb imatge substitueix la pantalla d'inici mentre està activada: una imatge teva darrere dels ginys, i les pàgines de ginys i eines que organitzes. Desactiva-la al gestor de connectors i torna la pantalla d'inici integrada, amb les seves pròpies pàgines.\n\nPosa imatges (JPEG, PNG o GIF) en una carpeta de la targeta (per defecte wallpapers) i tria'n una a Configuració, Personalitza, Pantalla d'inici amb imatge. Ajust indica com omple la pantalla (omple, imatge sencera, estira, mida original, mosaic), Posició quina part es queda, Zoom com de gran, i Aclareix la imatge com de pàl·lida: una imatge més pàl·lida fa que els ginys es llegeixin millor. La imatge es prepara una vegada per a cada mida de pantalla, cosa que triga un moment.\n\nEls ginys reposen sobre bases damunt la imatge. Organitza la pàgina com a la pantalla d'inici integrada: amb el llapis sota la pàgina, o amb Edita la pantalla d'inici al menú.\n\nLa barra d'estat (hora, Wi-Fi, bateria o el que triïs) pot ser activada, desactivada o automàtica, a dalt o a baix, d'amplada completa o una petita càpsula a l'esquerra, al centre o a la dreta, sobre una base clara, fosca o grisa o sobre la imatge mateixa. La fila que anomena els botons (a l'X4) també pot ser activada, desactivada o automàtica. Automàtica vol dir que prémer un botó la mostra durant uns segons; aquesta pulsació no fa res més.\n\nRepresentació de la imatge indica com es dibuixa la imatge: Nivells de gris en tots els grisos que té la pantalla (més lent a l'X4), Tramat en punts en blanc i negre (ràpid) o Automàtica, com fa la pantalla d'inici integrada: nivells de gris quan es dibuixa la pantalla, punts després del primer canvi. Si una pantalla no té nivells de gris, els nivells de gris es converteixen en punts."
