dictionary.plugin.name = Diccionari
dictionary.plugin.description = Cerca paraules en diccionaris StarDict.
dictionary.plugin.how = "El diccionari cerca una paraula d'un llibre en diccionaris StarDict i mostra les definicions en un tauler sobre la part inferior de la pantalla.\n\nAl lector, mantén premuda una paraula i tria Cerca; amb botons, fes servir Selecciona text a Més. Copia les carpetes dels diccionaris (amb fitxers .ifo, .idx i .dict) a la carpeta «dictionaries» del dispositiu, també amb subcarpetes, o tria una altra carpeta a Configuració, a Lectura, com a Carpeta de diccionaris (una opció avançada). La primera cerca prepara un petit índex per a cada diccionari, cosa que triga un moment.\n\nAl tauler, els botons de pàgina o Amunt i Avall desplacen les definicions llargues, i Enrere el tanca. Amb el tàctil, toca fora del tauler per tancar-lo."
