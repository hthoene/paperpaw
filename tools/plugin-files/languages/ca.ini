rules.plugin.name = Regles
rules.plugin.description = Quan passa alguna cosa, en fa una altra: p. ex. mode nocturn a les 22:00.
rules.plugin.how = "Una regla fa alguna cosa per si sola quan passa alguna cosa: activar el mode nocturn cada dia a les 22:00, o sincronitzar els catàlegs quan s'inicia PaperPaw.\n\nLes regles són a Configuració, a Personalitza, com a Regles. Afegeix una regla pregunta Quan? (s'inicia PaperPaw, una hora del dia, s'obre o es tanca un llibre, la bateria, la càrrega, un interruptor i més) i Què llavors? (executar una acció, activar o desactivar un interruptor, establir un nombre, mostrar un missatge). Toca una regla per posar-la en pausa; mantén-la premuda (amb botons, mantén premut Selecciona) per a una condició com Entre dues hores del dia, o per eliminar-la.\n\nLes accions, els interruptors i els nombres per triar surten per connector: tria el connector i després el que aporta; enrere en surt de nou. Una acció que actua sobre la pantalla mostrada, com Enrere o Pàgina següent, fa el que faria si es premés allà.\n\nLes hores s'apliquen sigui quina sigui la pantalla oberta. Dues regles que es desfan l'una a l'altra s'aturen al cap d'uns quants passos."
