koreader.plugin.name = Compartició de ressaltats
koreader.plugin.description = Comparteix marcadors i ressaltats amb KOReader per als llibres llegits en tots dos.
koreader.plugin.how = "Aquest connector comparteix marcadors i ressaltats amb KOReader per als llibres que llegeixes en tots dos, en un dispositiu o en una carpeta de biblioteca sincronitzada entre dispositius. No hi ha res a configurar.\n\nQuan PaperPaw obre un llibre que KOReader també ha obert, i quan canvies els seus marcadors o ressaltats, pren el que és nou de les dades de KOReader al costat del llibre i deixa el que és nou aquí perquè KOReader ho reculli la propera vegada que obri el llibre. Les marques eliminades i les notes canviades també hi passen.\n\nAixò només funciona amb llibres EPUB. Si no es pot llegir el fitxer d'una banda, no canvia res a cap banda fins que es pugui."
koreader.removed-there = El fitxer de KOReader ja no té ressaltats. Vols eliminar-los també aquí?
koreader.removed-there.text = Potser s'han eliminat a KOReader, o el seu fitxer venia d'un altre dispositiu. Conserva els deixa aquí i els torna a donar a KOReader.
