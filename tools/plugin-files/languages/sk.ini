files.plugin.how = "Knižnica zobrazuje knihy v priečinku knižnice s obálkou, názvom, autorom a postupom čítania. Naposledy čítaná kniha je navrchu ako karta, takže pokračovať môžeš jedným ťuknutím alebo stlačením OK. Pri hľadaní kníh knižnica ukazuje počet už nájdených.\n\nNad knihami vyber, čo sa zobrazuje: všetky knihy, rozčítané, neprečítané, prečítané alebo police (podľa autora, série, značky, obľúbené a ďalšia kniha každej začatej série). Ťukni na knihu a čítaj; podrž ju (tlačidlami: podrž OK) na otvorenie, označenie za prečítanú alebo neprečítanú, zobrazenie údajov, presun do archívu či vymazanie. Ťuknutím na názov otvoríš ponuku knižnice: triedenie a zobrazenie, hľadanie, priečinok knižnice a nastavenia.\n\nPriečinok knižnice sa nastavuje v Nastaveniach pod Knižnicou; tam môžeš knihy zobraziť aj ako mriežku obálok. Na všetky ostatné súbory slúžia Súbory v ponuke Nástroje."
