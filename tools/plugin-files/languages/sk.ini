vocabulary.sd.readme = "Kartičky zo súborov\n\nVlož sem súbor pre každý balíček: Spanielcina.tsv vytvorí balíček Spanielcina.\nSúbory: .tsv, .csv alebo .txt, uložené ako UTF-8, alebo .apkg: balíček Anki exportovaný so zaškrtnutou voľbou Support older Anki versions. Prvé tri polia poznámok budú predná strana, zadná strana a príklad; rozvrh a médiá sa nečítajú a PaperPaw nikdy nezapisuje do súborov Anki.\n\nJedna kartička na riadok: predná a zadná strana a príklad (voliteľný), oddelené tabulátorom, čiarkou alebo bodkočiarkou. Prvý riadok môže pomenovať stĺpce: front, back, example. Príklad:\n\nKatze\tmačka\tDie Katze schläft.\n\nPotom v čítačke otvor Kartičky, vyber Kartičky na SD karte a Aktualizovať balíčky.\n\nDobré vedieť:\n- Balíčky zostávajú v čítačke aj s tým, čo si sa naučil. Súbor sa číta, keď je nový alebo zmenený, a jeho kartičky sa pridajú do balíčka alebo sa v ňom zmenia.\n- Zmeň zadnú stranu alebo príklad kartičky v súbore: kartička sa zmení a zachová postup učenia.\n- Zmeň prednú stranu: počíta sa ako nová kartička a pôvodná začína odznova. Kartičky sa párujú podľa prednej strany bez ohľadu na medzery a veľkosť písmen. Ulož balíček do súboru (Kartičky na SD karte, Uložiť balíček na kartu) a každá kartička dostane číslo v stĺpci id: zmeň tam prednú stranu, prvé dva riadky súboru ponechaj a kartička zachová, čo si sa naučil.\n- Uloženie zapíše kartičky balíčka. Obsah súboru, ktorý nie je kartičkou (riadok bez prednej strany), sa nezachová; predošlý súbor sa skopíruje do _name.bak.tsv.\n- Ulož súbor ako CSV UTF-8 (nie UTF-16 ani vlastný formát tabuľkového programu). Súbor väčší než 4 MiB alebo 20 000 riadkov sa nečíta: rozdeľ ho.\n- Riadok vymazaný zo súboru nevymaže kartičku v balíčku, pokiaľ pre balíček nezapneš Odstrániť chýbajúce kartičky. Potom kartička zmizne aj s postupom učenia.\n- Súbory s názvami začínajúcimi na _ sa nečítajú.\n"
