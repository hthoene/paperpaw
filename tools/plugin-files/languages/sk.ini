update.plugin.name = Aktualizácia
update.plugin.description = Inštaluje aktualizácie firmvéru z karty alebo stiahnuté z internetu.
update.plugin.how = "Aktualizácia inštaluje nový firmvér na zariadeniach, kde je PaperPaw firmvérom, napríklad X4. Nájdeš ju v nastaveniach ako Aktualizácia.\n\nHľadať online sa opýta aktualizačného servera na novší PaperPaw a stiahne ho, čo cez Wi-Fi trvá niekoľko minút. Alebo skopíruj aktualizačný súbor (s príponou .bin z paperpaw.org) do priečinka updates na karte, napríklad prenosom cez Wi-Fi. Inštalácia trvá asi minútu a zariadenie sa reštartuje; knihy, nastavenia a pozície čítania zostanú.\n\nAk je zapnuté Hľadať aktualizácie (v nastaveniach, spočiatku vypnuté), zariadenie sa samo pýta približne raz týždenne, iba keď je Wi-Fi už zapnuté alebo sa nabíja. Nájdený novší PaperPaw počká tu; čítanie sa nepreruší. Vyhľadávanie odosiela verziu systému bez mena či čísla zariadenia; na počítanie zariadení aj to, či si hľadanie vyžiadal a či ide o prvé hľadanie daného dňa, týždňa alebo mesiaca.\n\nAk používané doplnky ešte nemajú verziu pre nové vydanie, aktualizácia na ne počká. Staršia verzia sa nainštaluje, iba ak ju vyberieš.\n\nOdtiaľto sa dá nainštalovať aj iný firmvér, napríklad CrossPoint: vlož jeho súbor (s príponou .bin) do priečinka updates a otvor Aktualizáciu. PaperPaw overí, či ide o celý a nepoškodený firmvér pre toto zariadenie, no nedokáže určiť autora, pretože nie je podpísaný. Inštalovať aj tak ho zapíše do druhej polovice pamäte flash a zariadenie ho spustí; PaperPaw zostane vo svojej polovici, kým ho tento firmvér neprepíše. Na neskorší návrat k PaperPawu nainštaluj jeho inštalačný súbor (paperpaw-<device>-<version>-install.bin) z ponuky druhého firmvéru, napríklad SD firmware update v CrossPointe."
