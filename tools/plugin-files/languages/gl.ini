translate.plugin.description = Traduce o texto seleccionado en liña, con DeepL.
translate.plugin.how = "Tradución traduce o texto seleccionado en liña con DeepL. Selecciona texto nun libro e escolle Traducir no menú do texto seleccionado: a tradución aparece sobre a páxina como unha entrada de dicionario. Os botóns de páxina ou os toques desprázana, e Escoller ou un toque ao final péchaa.\n\nPrecisa unha rede e unha clave da API de DeepL propia, gratuíta en deepl.com (DeepL API Free, uns 500.000 caracteres ao mes). Mentres non a introduzas, o panel dío e un toque pídea.\n\nNa configuración, en Lectura, na sección Tradución, Traducir a define o idioma; ao principio é o propio de PaperPaw."
