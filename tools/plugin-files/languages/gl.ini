wifi.plugin.name = Wi-Fi
wifi.plugin.description = Conéctase a redes Wi-Fi cando se precisa e despois apaga a radio.
wifi.plugin.how = "Wi-Fi conéctase a unha rede cando un complemento precisa internet (un catálogo, unha sincronización, a tenda, unha transferencia) e apaga a radio de novo un minuto despois de que ninguén a use, ou ao instante cando se amosa Inicio ou un libro, para aforrar batería e memoria.\n\nAbre Wi-Fi desde Configuración, ou desde o elemento Wi-Fi da liña de estado. Redes lista as que están ao alcance; escolle unha e escribe o seu contrasinal, ou escolle Configurar co teléfono e escribe o nome e o contrasinal no navegador do teléfono en vez de no dispositivo. Esquecer retira unha rede gardada.\n\nOs contrasinais quedan na tarxeta, gardados con seguridade, e nunca se amosan de novo. En Conectar cando se precise defines canto tempo segue activado o Wi-Fi despois do seu último uso, se segue activado durante a carga e que rede gardada vai primeiro cando hai varias ao alcance."
