menu-editor.plugin.name = Editor de menús
menu-editor.plugin.description = Reordena, retira e engade as entradas de todos os menús.
menu-editor.plugin.how = "O editor de menús cambia o que conteñen os menús: move as entradas cara arriba ou abaixo, retíraas ou engade novas.\n\nAtópao en Configuración, en Personalizar, como Personalizar os menús. Escolle un menú e despois unha entrada para movela ou retirala; Engadir unha entrada pon unha nova. Os cambios aplícanse ao instante. Restablecer este menú devolve un menú a como o definen os seus complementos, Restablecer todos os menús fai o mesmo con todos.\n\nNon podes quedar fóra: unha entrada que é o camiño cara á configuración queda ata que engadas outro camiño cara a ela."
