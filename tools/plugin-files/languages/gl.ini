widgets.plugin.name = Paquete de trebellos
widgets.plugin.description = Moitos máis trebellos para a pantalla de inicio: reloxos, un calendario, citas, libros, notas e máis.
widgets.plugin.how = "O paquete de trebellos engade moitos trebellos para a pantalla de inicio: reloxos (analóxico, de palabras, de mosaicos, mundial), un calendario, o ano ata agora, unha conta atrás, a fase da lúa, e día e data; unha cita do día, notas, tarefas pendentes, imaxes, unha saudación e o logotipo de PaperPaw; e, para libros, o que estás lendo, o progreso, o seguinte, series, favoritos, un realce e a biblioteca en números. Tamén inclúe un trebello da batería.\n\nEngádeos con Editar a pantalla de inicio no menú (ou cunha pulsación longa na pantalla de inicio) e despois Engadir un trebello. Cada un ten axustes propios, como marco, tamaño e aliñación. Escoller un trebello que cambia, como a cita do día, amosa a seguinte. As túas propias citas van en quotes.txt en .paperpaw/plugins/widgets da tarxeta, cada liña como texto | autor. Os trebellos de hora precisan o reloxo axustado; o Wi-Fi axústao."
