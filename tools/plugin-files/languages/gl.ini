lock.plugin.name = Bloqueo da pantalla
lock.plugin.description = Un PIN, un padrón ou un contrasinal ao espertar o dispositivo; tacto bloqueado durante a lectura.
lock.plugin.how = "O bloqueo da pantalla pide un PIN, un padrón ou un contrasinal cando PaperPaw se inicia e cando o dispositivo esperta. Ao principio está desactivado. Só impide o uso casual: o código e o número de intentos errados gárdanse na tarxeta SD, así que quen retire a tarxeta, a edite ou a troque pasa o bloqueo.\n\nDefíneo na configuración, en Dispositivo, Bloqueo da pantalla: introduce o código actual se hai un, escolle o tipo e despois o novo código dúas veces. O padrón só se ofrece en pantallas táctiles.\n\nTras cinco intentos errados, o seguinte espera medio minuto. Bloquear agora bloquea ao instante e pódese poñer nun botón, un xesto ou unha regra. Bloquear ao espertar pódese desactivar, de modo que só bloquea un inicio real (acendido ou reinicio), salvo onde cada espertar é un inicio, como no X4 con batería.\n\nBloqueo do tacto, xunto a el: Bloquear o tacto no panel rápido e no menú de lectura fai que os toques, os deslizamentos e o lapis non fagan nada mentres os botóns seguen funcionando, p. ex. para ler cunha man sobre a pantalla. Para desbloquear, toca dúas veces cun dedo e mantenno un momento; manter premido o botón de acendido abre o menú de enerxía, onde Desbloquear o tacto o fai cos botóns; no X4 Pro, manter premida a tecla de inicio desbloquea ao instante."
