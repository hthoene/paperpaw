weather.plugin.name = Tempo
weather.plugin.description = O tempo agora e nos próximos días como trebellos, desde Open-Meteo.
weather.plugin.how = "Tempo amosa o tempo agora e nos próximos días como trebellos para a pantalla de inicio, desde Open-Meteo, que non precisa conta nin clave. Tempo agora amosa a temperatura, o estado e máis a escoller; Previsión amosa os próximos días nunha fila ou nunha lista.\n\nEscolle primeiro un lugar: na configuración, en Tempo, Lugar (escribe un nome e escolle entre os lugares atopados). Só se envían as súas coordenadas, e só mentres se amosa un trebello do tempo. Engade os trebellos editando a pantalla de inicio.\n\nO tempo obtense como máximo tan a miúdo como indica Actualizar como máximo cada, e só mentres hai rede: nunca acende o Wi-Fi por si mesmo.\n\nDatos meteorolóxicos de Open-Meteo.com (https://open-meteo.com), baixo a licenza Creative Commons Attribution 4.0 (CC BY 4.0)."
