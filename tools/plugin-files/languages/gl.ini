format-cbz.plugin.name = Cómics
format-cbz.plugin.description = Abre arquivos de cómics (.cbz), unha imaxe por páxina.
format-cbz.plugin.how = "Abre arquivos de cómics (.cbz): unha imaxe por páxina, axustada á pantalla, na orde dos seus nomes (2 antes de 10).\n\nPónos no cartafol da biblioteca e ábreos desde a biblioteca; pasa as páxinas como en calquera libro. As imaxes grandes tardan un momento a primeira vez, no X4 máis ca noutros lugares.\n\nConfiguración da lectura (Configuración, Lectura): «Viñeta a viñeta» amosa unha viñeta dunha páxina cada vez, tan grande como permita a pantalla, e os cambios de páxina pasan por elas; unha páxina sen viñetas amósase completa. «Sentido das páxinas do cómic» inverte os cambios de páxina para manga (da dereita á esquerda); o propio ComicInfo.xml do libro indícao por si só. A biblioteca amosa o título dun libro e a súa serie e número desde ComicInfo.xml."
format-cbz.title = Cómic (CBZ)
format-cbz.setting.direction = Sentido das páxinas do cómic
format-cbz.setting.direction.help = Manga: os cambios de páxina inverten o sentido.
format-cbz.direction.book = Como di o libro
format-cbz.direction.ltr = Da esquerda á dereita
format-cbz.direction.rtl = Da dereita á esquerda
format-cbz.setting.panels = Viñeta a viñeta
format-cbz.setting.panels.help = Unha viñeta cada vez; os cambios de páxina pasan por elas.
format-docx.plugin.name = Documentos DOCX
format-docx.plugin.description = Abre ficheiros .docx, tal como os gardan Word e outros programas.
format-docx.plugin.how = "Abre documentos .docx como libros: títulos cun índice, listas, táboas, negra e cursiva, ligazóns e imaxes (JPEG, PNG, GIF).\n\nPon os ficheiros no cartafol da biblioteca e ábreos desde a biblioteca. O título e o autor proceden das propiedades do documento. As notas ao pé, as cabeceiras e os pés de páxina e os comentarios non se amosan."
format-docx.title = Documento DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Abre libros EPUB cos seus estilos, índice e imaxes.
format-epub.plugin.how = "Os libros EPUB ábrense desde a biblioteca como calquera outro libro, co seu índice, imaxes e o estilo da editorial. As páxinas web (HTML), Markdown, FictionBook (.fb2) e os arquivos de cómics (.cbz) ábrense do mesmo xeito, cada un como un complemento propio.\n\nUn capítulo convértese a primeira vez que o abres e gárdase na caché do complemento, así que despois é máis rápido e os libros grandes funcionan en dispositivos pequenos. Atopa o índice en Contido, no menú de lectura. Que se aplique ou non o estilo propio do libro depende da configuración Formato da editorial, en Lectura."
format-epub.title = Libro electrónico EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Abre libros FictionBook (.fb2, tamén comprimidos).
format-fb2.plugin.how = "Abre libros FictionBook (.fb2), habituais para libros rusos e doutros idiomas, tamén comprimidos (.fb2.zip), co seu título, autores, cuberta e capítulos.\n\nPónos no cartafol da biblioteca; aparecen na biblioteca e ábrense como calquera outro libro."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Abre páxinas web gardadas como ficheiros, amosando só o que hai que ler.
format-html.plugin.how = "Abre páxinas web gardadas como ficheiros (.html, .htm, .xhtml) como libros: só o que hai que ler, sen menús, publicidade e cousas así arredor.\n\nPon o ficheiro no cartafol da biblioteca e ábreo desde a biblioteca como calquera libro. As ligazóns dentro da páxina funcionan; as imaxes aparecen onde están no ficheiro."
format-html.title = Páxina web (HTML)
format-images.plugin.name = Imaxes
format-images.plugin.description = Abre imaxes (.jpg, .png, .gif) como libros, unha páxina cada unha.
format-images.plugin.how = "As imaxes (.jpg, .png, .gif) ábrense desde a biblioteca como libros, unha imaxe por páxina, axustada á pantalla.\n\nPara ler un cartafol enteiro de imaxes, abre a súa primeira imaxe: as imaxes seguintes do cartafol continúan na orde dos seus nomes (2 antes de 10). Unha imaxe posterior do cartafol comeza aí; o punto de lectura de cada unha lémbrase por separado. Lense ata 300 imaxes dun cartafol, a partir da que abras.\n\nUn ficheiro que non é unha imaxe, ou que é demasiado grande, amosa o seu nome no seu lugar. Para un libro de moitas imaxes con título propio, un arquivo de cómics (.cbz) é a mellor forma."
format-images.title = Imaxe
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Abre ficheiros Markdown (.md), p. ex. notas.
format-markdown.plugin.how = "Abre ficheiros Markdown (.md), como notas, como libros: títulos, listas, citas e énfases tal como se pretende, non como signos.\n\nPon os ficheiros no cartafol da biblioteca e ábreos desde a biblioteca. O primeiro título é o seu título; as imaxes xunto ao ficheiro aparecen onde o texto as nomea."
format-markdown.title = Markdown
format-mobi.plugin.name = Libros MOBI
format-mobi.plugin.description = Abre ficheiros .mobi e .azw sen DRM.
format-mobi.plugin.how = "Os libros MOBI (.mobi, .azw) ábrense desde a biblioteca como calquera libro, sen nada que configurar. O título, os autores, o idioma e a cuberta proceden do libro, e a lista de contidos faise a partir dos seus títulos.\n\nO libro convértese a primeira vez que o abres, o que leva uns segundos se é longo; despois ábrese ao instante. Amósanse o texto, os títulos, a negra e a cursiva, as ligazóns e as imaxes.\n\nOs libros con DRM (a maioría dos comprados nunha tenda) non se poden abrir, nin tampouco os libros con compresión Huffman ou na forma KF8 máis nova (.azw3): PaperPaw avísao cando os abres. Unha copia en EPUB, feita cunha ferramenta como Calibre, sempre se abre."
format-mobi.title = Libros MOBI
format-rtf.plugin.name = Documentos RTF
format-rtf.plugin.description = Abre ficheiros .rtf como libros.
format-rtf.title = Documentos RTF
format-txt.plugin.name = Texto simple
format-txt.plugin.description = Abre ficheiros de texto simple (.txt).
format-txt.plugin.how = "Os ficheiros de texto simple (.txt) ábrense desde a biblioteca como calquera libro, sen nada que configurar. O complemento le texto en UTF-8, UTF-16 e Windows-1252 e atopa a codificación por si só.\n\nOs parágrafos seguen as liñas en branco do ficheiro; se un ficheiro non ten ningunha, cada liña é un parágrafo. Nos ficheiros do Proxecto Gutenberg omítese o texto da licenza ao principio e ao final, e o título e o autor tómanse da cabeceira.\n\nO ficheiro nunca se carga enteiro, así que mesmo os textos moi grandes se abren en dispositivos pequenos."
format-txt.title = Texto simple
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Abre libros XTC e XTCH, as páxinas prerrenderizadas dos lectores Xteink.
format-xtc.plugin.how = "Os ficheiros XTC e XTCH son libros cuxas páxinas xa están renderizadas como imaxes, feitos por conversores para os lectores Xteink. Ábrense desde a biblioteca como calquera libro.\n\nComo cada páxina é unha imaxe fixa, o texto non se pode redimensionar nin pór noutro tipo de letra. As páxinas son en branco e negro ou teñen catro grises. Cada páxina descodifícase cando se amosa, así que precisa pouca memoria, tamén no X4.\n\nO título, o autor e os capítulos tómanse do ficheiro cando os ten."
format-xtc.title = Páxinas XTC
help.plugin.name = Pistas
help.plugin.description = Amosa o que fan os controis dunha pantalla a primeira vez que se abre.
help.plugin.how = "A primeira vez que se abre unha pantalla, unha nota breve sobre ela di o que fan os seus controis: as partes da pantalla ás que vai un toque, enmarcadas, e o que fan os botóns.\n\nUn toque ou calquera botón pecha a nota, e non volve para esa pantalla. Non amosar máis pistas desactiva todas.\n\nNa configuración, en Sistema, Pistas actívaas ou desactívaas, e Amosar as pistas de novo fai que a nota de cada pantalla apareza unha vez máis."
help.title = Como funciona aquí
help.got-it = Entendido
help.no-more = Non amosar máis pistas
