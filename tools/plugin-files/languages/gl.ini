file-manager.plugin.name = Xestor de ficheiros
file-manager.plugin.description = Todos os cartafoles e ficheiros do dispositivo: abrir, renomear, mover, copiar e eliminar.
file-manager.plugin.how = "O xestor de ficheiros amosa todos os cartafoles e ficheiros do almacenamento do dispositivo, non só os teus libros, e permite abrilos, renomealos, movelos, copialos e eliminalos, e crear novos cartafoles.\n\nAbre Ficheiros desde o menú Ferramentas. Toca un cartafol para entrar nel; Atrás vai ao cartafol superior. Toca un ficheiro, ou mantén premida calquera entrada (cos botóns, mantén premido Escoller), para ver o que se pode facer con ela. Mover e Copiar elixen a entrada: vai ao cartafol ao que pertence e escolle Pegar aquí na barra da parte inferior. Cos botóns, preme Abaixo desde a última entrada para chegar á barra.\n\nOs ficheiros e cartafoles que empezan por un punto, como os datos propios de PaperPaw, están agochados. Para velos, activa Ficheiros agochados en Configuración, en Biblioteca."
