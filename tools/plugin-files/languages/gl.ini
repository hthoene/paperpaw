koreader.plugin.name = Compartir realces
koreader.plugin.description = Comparte marcadores e realces con KOReader para libros lidos en ambos.
koreader.plugin.how = "Este complemento comparte marcadores e realces con KOReader para libros que lees en ambos, nun dispositivo ou nun cartafol da biblioteca sincronizado entre dispositivos. Non hai nada que configurar.\n\nCando PaperPaw abre un libro que KOReader tamén abriu, e cando cambias os seus marcadores ou realces, toma o novo dos datos de KOReader xunto ao libro e deixa o novo daquí para que KOReader o recolla a próxima vez que abra o libro. As marcas retiradas e as notas cambiadas tamén pasan dun lado a outro.\n\nIsto só funciona con libros EPUB. Se o ficheiro dun lado non se pode ler, non cambia nada en ningún dos lados ata que se poida."
