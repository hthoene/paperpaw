calendar.plugin.name = Calendario
calendar.plugin.description = Os teus calendarios no lector: vistas de axenda, día, semana e mes desde CalDAV, iCal e ficheiros, aniversarios dos contactos, trebellos para o inicio e unha pantalla de suspensión.
calendar.plugin.how = "Os teus calendarios no lector: unha axenda dos próximos días, un día, unha semana e un mes, cos eventos de calendarios CalDAV (Nextcloud, Radicale, Baïkal, Fastmail e outros), de enderezos iCal (.ics, webcal://), de ficheiros de calendario da tarxeta e os aniversarios e efemérides dos teus contactos (CardDAV). O lector só le os calendarios; nunca os modifica.\n\nAbre Calendario desde o menú de ferramentas. A primeira fila indica a vista; escóllea, ou mantén premida calquera fila ou preme Menú, para cambiar entre Axenda, Día, Semana, Mes e Aniversarios, para engadir calendarios ou para sincronizar. En Día e Semana, as dúas primeiras filas avanzan ou retroceden un día ou unha semana (as teclas de páxina tamén); en Mes, as teclas de frecha moven o día, as teclas de páxina o mes e Escoller abre o día. Escoller sobre un evento amósao completo: cando, onde, que calendario e como se repite. Atrás retrocede un paso.\n\nEngade un calendario en Calendarios (no menú ou en Calendario na configuración). Escolle o seu tipo: unha conta CalDAV (abonda co enderezo do servidor, p. ex. cloud.example.com/remote.php/dav; cada calendario con eventos pasa a formar parte da vista), un enderezo iCal (un calendario publicado como .ics), un ficheiro de calendario da tarxeta ou contactos (unha axenda de enderezos CardDAV: o lector amosa os aniversarios e as efemérides gardados neles). Introduce o enderezo, para unha conta o teu nome de usuario e un contrasinal (mellor un contrasinal de aplicación; gárdase cos contrasinais do lector) e un nome. Cada calendario ten unha marca (un punto, un anel, un punto gris ou un cadrado) que podes cambiar para distinguilos; ata seis calendarios.\n\nOs eventos repetidos (diarios, semanais, mensuais, anuais, con días da semana, recontos, datas de fin e días omitidos), os eventos de todo o día e os eventos noutros fusos horarios amósanse co reloxo propio do lector. O lector garda os eventos desde sesenta días antes ata sesenta días despois de hoxe, como máximo 240, e amósaos sen rede. As regras que non pode ler amosan o seu evento unha soa vez.\n\nOs calendarios lense cando abres o calendario (como máximo cada cinco minutos), cando escolles Sincronizar agora e, segundo o que definas en Calendario na configuración, cando a rede está activada de todos os xeitos ou cando empeza a carga. O lector nunca acende a súa radio para isto, salvo cando pides Sincronizar agora.\n\nTrebellos para a pantalla de inicio (mantén premida a pantalla de inicio e engade un trebello): Hoxe amosa a data e o que ofrece o día, Seguinte evento o evento que vén a continuación, Axenda os próximos días, Mes un mes cun punto baixo os días con eventos e Aniversarios os próximos aniversarios. Tocar un evento ábreo; tocar un día do mes abre ese día. A pantalla de suspensión pode amosar a axenda de hoxe: escolle Calendario en Pantalla de suspensión na configuración."
