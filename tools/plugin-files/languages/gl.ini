anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Estuda as tarxetas pendentes de Anki no teu ordenador e devolve as túas respostas, co complemento AnkiConnect.
anki.plugin.how = "Anki permite estudar no lector as tarxetas pendentes de Anki no teu ordenador e devolve as túas respostas. Usa o complemento libre AnkiConnect (código de complemento 2055492159) e nunca AnkiWeb. Ao principio está desactivado: engádeo desde a tenda de complementos.\n\nNo ordenador: instala AnkiConnect en Anki (Ferramentas, Complementos, Obter complementos) e reinicia Anki. Anki debe estar aberto durante a sincronización.\n\nPor omisión AnkiConnect só responde ao ordenador no que se executa (127.0.0.1), polo que o lector non pode acceder a el. Abre Ferramentas, Complementos, AnkiConnect, Configuración e pon «webBindAddress» a «0.0.0.0» (escoitar na rede doméstica). O porto, «webBindPort», é 8765 salvo que o cambies. Se aí defines unha «apiKey», introduce aquí a mesma clave. Reinicia Anki tras cambiar a configuración e permite Anki no cortalumes do ordenador se llo pregunta. Usa isto só nunha rede na que confíes: calquera persoa nela pode acceder a AnkiConnect, así que convén usar unha clave.\n\nNo lector: abre Anki desde Ferramentas e introduce o enderezo do ordenador (por exemplo 192.168.1.20) en Ordenador, o porto se non é 8765 e a clave da API se definiches unha. Escolle unha Baralla ou déixaa baleira para todas as barallas. Despois escolle Sincronizar con Anki, co Wi-Fi activado: primeiro envíanse as túas respostas pendentes e despois obtéñense as tarxetas pendentes (e o número de tarxetas novas que definiches), como máximo 50. Escolle Estudar para repasalas sen rede: amosa a resposta e valórala como Outra vez, Difícil, Ben ou Doado. As túas respostas gárdanse no lector, tamén sen Wi-Fi, e van a Anki coa seguinte sincronización. Anki decide cando volve unha tarxeta: unha tarxeta á que respondeches Outra vez obtense de novo nunha sincronización posterior cando Anki diga que está pendente.\n\nSincronizar ao abrir Anki, na configuración, sincroniza cada vez que abres a pantalla. Nada usa a rede cando premes unha tecla."
