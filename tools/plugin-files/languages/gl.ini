vocabulary.plugin.name = Vocabulario
vocabulary.plugin.description = Garda as palabras que buscas, coas súas frases, e repasa tarxetas de estudo con repetición espazada, feitas no teu teléfono.
vocabulary.plugin.how = "Vocabulario garda as palabras que buscas mentres lees, cada unha coa súa frase, para repasalas máis tarde. Atopas a lista en Ferramentas, coas máis novas primeiro; escolle unha palabra para buscala de novo. A última fila, Exportar, gárdaas para aplicacións de tarxetas de estudo como Anki. A lista conserva as 2.000 palabras máis novas: máis alá, as máis antigas desaparecen, así que expórtaas antes para conservalas todas.\n\nAs tarxetas de estudo, tamén en Ferramentas, fanche preguntas con repetición espazada: despois de Amosar a resposta valoras cada tarxeta como Outra vez, Difícil, Ben ou Doado, e iso decide cando volve. Crea barallas con Editar co teléfono: escanea o código cun teléfono da mesma rede Wi-Fi e despois escribe tarxetas ou engade moitas de vez: abre alí unha baralla, escolle Moitas tarxetas de vez e elixe un ficheiro CSV, TSV ou TXT (unha tarxeta en cada liña: anverso, reverso, exemplo; UTF-8), pega unha lista ou trae unha baralla de Anki (.apkg, exportada con Admitir versións antigas de Anki). \n\nOu usa ficheiros da tarxeta SD: pon un ficheiro CSV, TSV ou TXT, ou unha baralla de Anki (.apkg, exportada con Admitir versións antigas de Anki), para cada baralla no cartafol Flashcards (Galego.tsv crea a baralla Galego; unha tarxeta en cada liña: anverso, reverso, exemplo; gardado como UTF-8; a primeira liña pode nomear as columnas front, back, example). Escolle Tarxetas da tarxeta SD en Tarxetas de estudo, ou deixa que pase cando abras Tarxetas de estudo. As barallas quedan no lector co que aprendeches, e un ficheiro intégrase na súa baralla cando é novo ou cambiou: se cambias o reverso ou o exemplo dunha tarxeta no ficheiro, a tarxeta cambia e conserva o seu progreso; se cambias o texto do anverso, conta como unha tarxeta nova e a antiga comeza de cero (as tarxetas distínguense polo texto do anverso; os espazos e as maiúsculas non contan); unha liña que elimines non elimina a tarxeta (salvo que definas «tarxetas que faltan no ficheiro» como Retirar para esa baralla: entón a tarxeta retírase na seguinte actualización co seu progreso, para sempre, e non se retira nada mentres algunha liña do ficheiro non se poida ler). Garda unha baralla no seu ficheiro con Gardar na tarxeta: o ficheiro recibe os números das tarxetas (a columna id), así que podes editar anversos nun ordenador e as tarxetas conservan o que aprendeches; o ficheiro só conserva id, anverso, reverso e exemplo (outras columnas, comentarios e a orde das liñas non se conservan), e rexéitase gardar mentres algunha liña do ficheiro non se puido ler; o ficheiro que había copiase a _nome.bak.tsv a primeira vez (un gardado posterior non substitúe esa copia). Un ficheiro de máis de 4 MiB ou 20.000 liñas non se le, e hai que gardalo como CSV UTF-8, non UTF-16. A primeira vez, o lector crea o cartafol cunha nota sobre como funciona.\n\nNa configuración, en Lectura, Palabras buscadas como tarxetas pon cada palabra buscada na baralla Buscadas."
