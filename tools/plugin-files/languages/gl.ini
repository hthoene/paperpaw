plugin-manager.plugin.name = Xestor de complementos
plugin-manager.plugin.description = Lista os complementos e actívaos e desactívaos.
plugin-manager.plugin.how = "O xestor de complementos lista todos os complementos coa súa versión e descrición, e activa e desactiva complementos.\n\nAtópao en Configuración, como Xestionar complementos. Configuración dos complementos é unha páxina aparte para preferencias como o uso da rede de cada complemento. Toca un complemento para activalo ou desactivalo (cos botóns, escóllao). O cambio aplícase tras un reinicio: a barra da parte inferior ofrece entón Reiniciar agora. Mantén premido un complemento (cos botóns, mantén premido Escoller) para ler como funciona.\n\nUn complemento marcado como Sempre activado non se pode desactivar, e un marcado como Necesario só cando outro complemento fai o seu traballo, ou PaperPaw non tería forma de volver atrás. En Pantallas escolles que complemento amosa un lugar que ofrecen varios."
