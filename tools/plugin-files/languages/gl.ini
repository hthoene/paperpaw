news.plugin.name = Novas
news.plugin.description = Obtén fontes de novas (RSS, Atom) como libros para ler.
news.plugin.how = "Novas converte fontes RSS ou Atom en libros. Cada fonte pasa a ser un libro no cartafol News da biblioteca, cos seus artigos máis recentes como texto simple, para ler como calquera outro libro.\n\nAbre Novas desde o menú Ferramentas e escolle Engadir unha fonte; o seu enderezo está no sitio web do xornal ou do blog. Obter as novas obtén todas as fontes e substitúe os libros anteriores. Mantén premida unha fonte (cos botóns, mantén premido Escoller) para obtela ou retirala soa. Unha fonte retirada deixa o seu libro na biblioteca.\n\nObter precisa unha rede. Artigos por fonte (Configuración, Biblioteca) define cantos artigos contén cada libro. O trebello Titulares das novas amósaos na pantalla de inicio."
