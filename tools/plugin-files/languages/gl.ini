tasks.plugin.name = Tarefas
tasks.plugin.description = Listas de tarefas con datas de vencemento e prioridades, no lector ou sincronizadas co teu servidor CalDAV, con trebellos para a pantalla de inicio.
tasks.plugin.how = "Listas de tarefas no teu lector: tarefas cunha data de vencemento e unha prioridade, que se marcan cando están feitas. Funcionan sen configuración e sen rede, e pódense manter sincronizadas cun servidor CalDAV (Nextcloud, Radicale, Baïkal, Fastmail e outros), así que as mesmas listas están no teu teléfono e no teu ordenador.\n\nAbre Tarefas desde o menú de ferramentas. A primeira fila nomea a lista amosada; escóllea para outra lista, para Hoxe e vencidas en todas as listas, para unha lista nova, para sincronizar ou para definir a conta. Engadir unha tarefa abre o teclado. Escoller sobre unha tarefa márcaa como feita (de novo: non feita). Mantén premida unha tarefa ou preme Menú para cambiar o seu título, a súa data de vencemento (hoxe, mañá, nunha semana, ou unha data que escribas como 2026-12-24) ou a súa prioridade, ou para retirala. As tarefas abertas van primeiro, polo seu día e despois pola prioridade; as feitas quedan ao final durante unha semana (pódese definir en Tarefas, na configuración) e despois saen do lector.\n\nTrebellos para a pantalla de inicio (mantén premida a pantalla de inicio e engade un trebello): Tarefas de hoxe amosa o que vence hoxe ou xa venceu, Lista de tarefas amosa unha lista, Tarefas abertas cóntaas e Seguinte tarefa amosa a que hai que facer a continuación. Un toque nunha tarefa dun trebello márcaa como feita; un toque nun título abre as listas.\n\nPara sincronizar, escolle Conta CalDAV na fila da lista e introduce o enderezo do servidor, o teu nome de usuario e un contrasinal (mellor un contrasinal de aplicación). Abonda co enderezo do servidor, p. ex. cloud.example.com/remote.php/dav; o lector atopa as túas listas de tarefas a partir de aí. Cada lista de tarefas do servidor pasa a ser unha lista no lector. O lector sincroniza cando abres Tarefas, cando escolles Sincronizar agora e cando a rede está activada de todos os xeitos; o que cambies sen rede agarda e envíase máis tarde. Se unha tarefa cambiou no lector e noutro lugar entrementres, toma a versión do servidor e a túa consérvase como unha nova tarefa xunto a ela, así que non se perde nada. As notas, as alarmas e todo o demais que unha tarefa ten no servidor quedan como están. As tarefas que se repiten amósanse, pero cámbianse onde as creaches. O lector garda ata 200 tarefas en 12 listas."
