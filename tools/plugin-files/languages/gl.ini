notes-vault.plugin.name = Cofre de notas
notes-vault.plugin.description = Le un cartafol de notas Markdown por cartafoles, etiquetas e últimos cambios, con trebellos para a pantalla de inicio. Funciona con cofres de Obsidian.
notes-vault.plugin.how = "Cofre de notas le un cartafol de notas Markdown (ficheiros .md simples, como os gardan as aplicacións de notas). Funciona con cofres de Obsidian.\n\nEscolle o cartafol do cofre na configuración, ou na páxina do cofre en Ferramentas. A páxina ofrece entón os cartafoles como están na tarxeta, as notas cambiadas por última vez, as etiquetas e unha busca nos títulos das notas.\n\nA primeira vez, o cofre indéxase en segundo plano mentres a súa páxina está aberta; un cofre de miles de notas leva uns minutos, e despois ábrese ao instante. O índice gárdase na tarxeta e faise de novo cando se abre a páxina do cofre pasadas unhas horas, ou cando escolles Actualizar.\n\nUnha nota ábrese no lector. As ligazóns a outras notas ([[Nota]], [[Nota|palabras]], [[Nota#Título]]) atópanse polo nome da nota en calquera lugar do cofre; seguir unha abre esa nota, e Atrás volve á nota anterior.\n\nNunca se cambia nada no cofre. Os trebellos para a pantalla de inicio (notas recentes, unha nota fixada, unha nota do día, unha nota aleatoria, etiquetas, busca) engádense no editor da pantalla de inicio. Un trebello pode tomar as súas notas dun só cartafol: escribe a ruta do cartafol desde a raíz da tarxeta (por exemplo Notas/Traballo) na configuración do trebello; se queda baleiro, toma todas as notas do cofre."
