picture-home.plugin.name = Pantalla de inicio con imaxe
picture-home.plugin.description = Unha pantalla de inicio coa túa propia imaxe detrás dos trebellos e unha barra de estado que configuras ti.
picture-home.plugin.how = "A pantalla de inicio con imaxe substitúe a pantalla de inicio mentres está activada: a túa propia imaxe detrás dos trebellos e as páxinas de trebellos e ferramentas que organizas. Desactívaa no xestor de complementos e volve a pantalla de inicio integrada, coas súas propias páxinas.\n\nPon imaxes (JPEG, PNG ou GIF) nun cartafol da tarxeta (por omisión wallpapers) e escolle unha en Configuración, Personalizar, Pantalla de inicio con imaxe. Axuste indica como enche a pantalla (encher, imaxe enteira, estirar, tamaño orixinal, mosaico), Posición que parte queda, Zoom canto de grande, e Aclarar a imaxe canto de pálida: unha imaxe máis pálida fai os trebellos máis fáciles de ler. A imaxe prepárase unha vez para cada tamaño de pantalla, o que leva un momento.\n\nOs trebellos asentan en placas sobre a imaxe. Organiza a páxina como na pantalla de inicio integrada: o lapis debaixo da páxina, ou Editar a pantalla de inicio no menú.\n\nA barra de estado (hora, Wi-Fi, batería ou o que escollas) pode estar activada, desactivada ou en automático, na parte superior ou inferior, a ancho completo ou como unha pequena píldora á esquerda, no centro ou á dereita, sobre unha placa clara, escura ou gris ou sobre a propia imaxe. A fila que nomea os botóns (no X4) tamén pode estar activada, desactivada ou en automático. Automático significa que premer un botón a amosa durante uns segundos; esa pulsación non fai nada máis.\n\nRepresentación da imaxe indica como se debuxa a imaxe: Niveis de gris en todos os grises que ten a pantalla (máis lento no X4), Tramado en puntos brancos e negros (rápido) ou Automático, como fai a pantalla de inicio integrada: niveis de gris cando se debuxa a pantalla, puntos despois do primeiro cambio. Onde unha pantalla non ten niveis de gris, os niveis de gris pasan a puntos."
