pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Un temporizador de concentración con roldas de traballo e pausa, trebellos e un reconto diario.
pomodoro.plugin.how = "Un temporizador Pomodoro: traballa en roldas de concentración e despois descansa. Non precisa configuración: 25 minutos de concentración, 5 de descanso e, tras catro roldas, unha pausa longa de 15.\n\nAbre Pomodoro desde o menú de ferramentas e preme Iniciar, ou engade os seus trebellos á pantalla de inicio (mantén premida a pantalla de inicio e engade un trebello): Temporizador Pomodoro amosa a fase e os minutos que quedan, Iniciar/pausar Pomodoro é un botón, e Pomodoro de hoxe conta as roldas que rematas, co teu obxectivo diario. Un toque no temporizador iníciao ou páusao; mantenno premido para abrir a pantalla completa.\n\nO temporizador segue en marcha cando saes da pantalla e continúa segundo o reloxo tras un reinicio. Mentres o lector está suspendido non se executa nada: unha fase que rematou entrementres avísase ao espertar. Un aviso indícache cando remata unha fase. Para aforrar batería, o reloxo actualízase unha vez por minuto (cada dez segundos no último minuto na pantalla completa) e nunca mantén esperto o lector.\n\nEn Configuración, en Pomodoro, defines as duracións e as roldas dunha serie, e se a seguinte fase comeza por si soa. En Máis: un parpadeo da pantalla ou un pestanexo da luz frontal cando remata unha fase e un obxectivo diario."
