sleep.plugin.name = Pantalla de suspensión
sleep.plugin.description = Amosa un gato durmindo, a cuberta do libro, as túas imaxes ou unha mensaxe mentres o dispositivo está suspendido.
sleep.plugin.how = "A pantalla de suspensión decide o que amosa a pantalla mentres o dispositivo está suspendido. A tinta electrónica conserva a imaxe sen corrente.\n\nEscóllea na configuración, en Dispositivo, Pantalla de suspensión, con Amosar: un gato durmindo (o predeterminado), a cuberta do libro, as miñas imaxes, o logotipo e «Suspendido», trebellos, a páxina tal como está, ou a páxina cunha imaxe. As miñas imaxes amosa os ficheiros do cartafol de imaxes un tras outro.\n\nSen cuberta nin imaxe amósase o gato. Onde o sistema debuxa a pantalla de suspensión por si mesmo, estes axustes están agochados.\n\nA pantalla de apagado, Amosar ao apagar, debúxase unha vez cando o dispositivo se apaga, desde o menú de enerxía ou despois do tempo de Apagar tras a suspensión (non cando unha batería baixa corta a corrente). É como a pantalla de suspensión, salvo que escollas o logotipo e «Apagado», o gato, a cuberta ou as miñas imaxes. Outro complemento pode ofrecer unha pantalla para iso.\n\nA pantalla de inicio e a de reinicio, Amosar ao iniciar e Amosar ao reiniciar, son as propias do dispositivo, salvo que outro complemento ofreza unha pantalla para elas. Os complementos aínda non se executan mentres o dispositivo se inicia: a pantalla escollida para o inicio debúxase de antemán, cando o dispositivo se apaga ou se reinicia, e amósase no seguinte inicio. Unha pantalla que non está lista a tempo, ou unha imaxe danada, cede o lugar á do dispositivo; o dispositivo apágase ou reiníciase en todo caso."
