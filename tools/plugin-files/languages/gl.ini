keys.plugin.name = Botóns e xestos
keys.plugin.description = O que fai cada botón, zona de toque e deslizamento, cambiado no dispositivo.
keys.plugin.how = "Botóns e xestos amosa o que fai cada botón, zona de toque e deslizamento, e permite cambialo no dispositivo.\n\nAbre a función na configuración, en Dispositivo. Primeiro escolle onde se aplica un cambio: En todas partes, Durante a lectura, Na pantalla de inicio, Na biblioteca ou nunha ferramenta. Despois elixe unha entrada, como un botón mantido ou un deslizamento desde un bordo, e escolle unha acción da lista, na que podes buscar. Como é habitual devolve o que definen os complementos e a disposición dos botóns.\n\nNo X4, rexéitase un cambio que deixaría sen botón para escoller, volver atrás ou avanzar. Restablecer botóns e xestos, ao final, desfai todos os cambios."
