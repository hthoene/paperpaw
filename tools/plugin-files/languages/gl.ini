setup.end.help = Pon libros no cartafol «/books» do dispositivo cun ordenador, ou envíaos por Wi-Fi desde un teléfono ou un ordenador (Ferramentas, Transferencia por Wi-Fi). Os catálogos tamén os traen, e Calibre onde estea engadido. Todo o que escollas aquí pódese cambiar na configuración.
