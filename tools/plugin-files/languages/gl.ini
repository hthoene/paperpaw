transfer.plugin.name = Transferencia
transfer.plugin.description = Pon libros e outros ficheiros no dispositivo desde un navegador da mesma rede.
transfer.plugin.how = "A transferencia por Wi-Fi pon libros e outros ficheiros no dispositivo desde un navegador da mesma rede, sen cable nin aplicación. Tamén podes obter ficheiros, crear cartafoles e eliminar.\n\nAbre a transferencia desde Ferramentas. A pantalla amosa un enderezo como texto e como código QR: ábreo nun navegador nun teléfono ou ordenador, ou escanea o código. O enderezo leva unha clave feita de novo cada vez, así que outros da rede non poden acceder aos teus ficheiros. A transferencia execútase mentres a pantalla está aberta.\n\nOnde PaperPaw xestiona o Wi-Fi por si mesmo, como no X4, Sen router, na parte inferior, abre unha rede propia do dispositivo, á que se une o teléfono escaneando un código."
