reader.plugin.name = Lector
reader.plugin.description = Amosa libros páxina a páxina, con índice e configuración de lectura.
reader.plugin.how = "O lector amosa libros páxina a páxina. Abre un libro desde a biblioteca; o último libro pode reabrirse ao iniciar (opción Abrir o último libro ao iniciar).\n\nToca a esquerda ou a dereita da pantalla, ou usa os botóns de páxina, para pasar páxinas. Toca o centro ou preme Escoller para o menú de lectura: Contido, Buscar, Ir á páxina, Tipo de letra e deseño, Marcadores e realces e máis. Cara abaixo desde o bordo superior abre o panel rápido, cara arriba desde o bordo inferior vai ao inicio; manter premido Atrás tamén.\n\nMantén premido Escoller (ou mantén premida unha imaxe) para ver unha imaxe a pantalla completa: Esquerda e Dereita pasan polas imaxes da páxina. Escoller amplía a 2x, 3x e volve (dobre toque co tacto); ampliada, Esquerda e Dereita desprazan de lado, os botóns de páxina (ou os deslizamentos) avanzan en horizontal e despois cara abaixo. Atrás volve ao axuste, despois á páxina (mantén premido para saír co tacto). Toca a esquina superior dereita para un marcador. Mantén premida unha palabra para realzala. Cos botóns, mantén premido Esquerda: Esquerda e Dereita móvense por palabra, os botóns de páxina por liña, mantelos premidos vai aos extremos da páxina e móvese por parágrafo; Escoller abre a barra de realce para a palabra, manter premido Escoller amplíaa á frase e ao parágrafo (despois Esquerda e Dereita moven o final, mantelos premidos o principio). Unha selección continúa ao pasar páxina. Exportar como Markdown garda as túas notas."
