update.plugin.name = Actualización
update.plugin.description = Instala actualizacións de firmware, desde a tarxeta ou descargadas de internet.
update.plugin.how = "Actualización instala firmware novo, nos dispositivos nos que PaperPaw é o firmware, como o X4. Atópaa na configuración, como Actualización.\n\nBuscar en liña pregunta ao servidor de actualizacións por un PaperPaw máis novo e descárgao, o que leva uns minutos por Wi-Fi. Ou copia un ficheiro de actualización (que remata en .bin, de paperpaw.org) no cartafol updates da tarxeta, por exemplo con Transferencia por Wi-Fi. Instalar leva entón aproximadamente un minuto e o dispositivo reiníciase; os libros, a configuración e os puntos de lectura quedan.\n\nCon Buscar actualizacións activado (na configuración, desactivado ao principio), o dispositivo pregunta unha vez por semana por si só, só mentres o Wi-Fi está activado de todos os xeitos ou está cargando. Un PaperPaw máis novo que atope agarda aquí; nada interrompe a túa lectura. Unha busca envía o que executa o dispositivo, sen nome nin número del; para contar dispositivos, tamén se o pediches ti e se é a súa primeira busca do día, da semana ou do mes.\n\nSe os complementos que usas aínda non teñen versión para a nova edición, a actualización agarda por eles. Unha versión máis antiga só se instala se a escolles.\n\nOutro firmware, como CrossPoint, tamén se instala desde aquí: pon o seu ficheiro (que remata en .bin) no cartafol updates e abre Actualización. PaperPaw comproba que é un firmware completo para este dispositivo, sen danos, pero non pode saber quen o fixo, porque non está asinado. Instalar igualmente escríbeo na outra metade da memoria flash e o dispositivo iníciao; PaperPaw queda na súa metade ata que ese firmware instale algo por riba. Para volver a PaperPaw máis tarde, instala o seu ficheiro de instalación (paperpaw-<device>-<version>-install.bin) desde o menú do outro firmware, como a actualización de firmware desde SD de CrossPoint."
