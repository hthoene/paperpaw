menu.plugin.name = Menú
menu.plugin.description = O menú da parte inferior da pantalla, con accións e configuración.
menu.plugin.how = "O menú lista o que podes facer e configurar. Ábrese na parte inferior da pantalla, sobre o que estea aberto: durante a lectura, toca o centro da pantalla ou preme Escoller. Toca ou escolle unha entrada para executala.\n\nOs axustes do menú amosan o seu valor e cambian no sitio, así que o menú segue aberto. Unha entrada con máis entradas abre un submenú.\n\nDesliza cara abaixo desde o bordo superior para o panel rápido: o que cambias a miúdo, como botóns. Toca un botón para activalo, mantenno premido para ver a súa configuración. Só con botóns, os botóns de frecha escollen, Escoller activa e Atrás pecha. En Aspecto, Menús amosa os menús como lista ou como mosaicos."
