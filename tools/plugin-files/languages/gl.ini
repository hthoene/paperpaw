mail.plugin.name = Correo
mail.plugin.description = Le e envía correo electrónico cun contrasinal ou un contrasinal de aplicación (IMAP e SMTP), sen inicio de sesión no navegador.
mail.plugin.how = "Correo le e envía correo electrónico por IMAP e SMTP. Inicia sesión co teu enderezo e un contrasinal, sen inicio de sesión no navegador, así que funciona con calquera provedor que o permita.\n\nConfigura unha conta en Configuración, Correo. Escolle o teu provedor, escribe o teu enderezo e o contrasinal. A maioría dos provedores piden un contrasinal de aplicación: crea un na configuración de seguridade da túa conta e úsao aquí. O teu contrasinal habitual moitas veces non funciona, e nunca vai a ningún lugar salvo ao servidor do teu provedor. Gárdase cos contrasinais e as claves.\n\nAbre Correo en Ferramentas. Comprobar o correo obtén os correos máis recentes e os cartafoles. Os correos gárdanse na tarxeta, así que podes lelos sen rede. O dispositivo conéctase, obtén e desconéctase, así que o Wi-Fi só está activado un momento.\n\nSe o teu provedor non está na lista, escolle Servidores propios e define os nomes dos servidores, os portos e a seguridade na configuración avanzada. Un servidor cuxo certificado non avala ningunha autoridade pregunta unha vez se confías nel; compara a pegada dixital coa que amosa o teu provedor.\n\nUn correo cun libro anexo (EPUB, PDF e similares, ata 2 MB) ten Abrir o libro debaixo: obtén o ficheiro, ponao na túa biblioteca e ábreo.\n\nPara ver correo novo sen abrir Correo, activa Buscar correo novo en segundo plano en Configuración, Correo, e escolle con que frecuencia (cada 15, 30 ou 60 minutos). Está desactivado ata que o actives. O lector conéctase entón de cando en cando por unha conexión segura mentres está esperto e con conexión, unha conta despois da outra, e actualiza o número de non lidos en Inicio. Usa algo de batería. Abrir Correo detén unha comprobación en curso.\n\nOs trebellos da pantalla de inicio amosan o número de correos non lidos, os últimos e os destacados, unha caixa de correo e un atallo para escribir un correo."
