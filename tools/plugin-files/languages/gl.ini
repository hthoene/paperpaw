battery.plugin.name = Consumo da batería
battery.plugin.description = Rexistra a batería e amosa canto dura.
battery.plugin.how = "Consumo da batería anota a carga aproximadamente cada minuto mentres o dispositivo está esperto, xunto co que fixo: actualizacións de pantalla e páxinas pasadas. Con iso calcula canto consumen unha hora esperto e 100 páxinas, e canto dura a batería a ese ritmo.\n\nAbre Batería desde o menú Ferramentas. Amosa a carga agora, este tempo esperto, o consumo con batería ata o de agora e os teus últimos tempos esperto. Pásase de páxina cos botóns de páxina ou tocando as frechas da parte superior.\n\nPrecisa un tempo de lectura con batería para que as cifras signifiquen algo. O rexistro está activado por omisión e pódese desactivar en Configuración, en Dispositivo, Enerxía, como Rexistrar o consumo da batería."
