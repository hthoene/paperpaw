about.plugin.name = Acerca de
about.plugin.description = A versión e as licenzas de PaperPaw.
about.plugin.how = "Acerca de amosa que versión de PaperPaw tes, onde está o seu código fonte e con que licenzas se distribúe.\n\nAtópalo ao final da Configuración, como Acerca de PaperPaw. Escolle unha fila cos botóns de frecha e Escoller, ou tócaa. Tamén se enumeran os complementos integrados no firmware e, nos dispositivos que cargan complementos con código, a pegada dixital para a que deben estar construídos eses complementos.\n\nLicenzas ábrese como un texto no lector, así que pasas as páxinas como nun libro. Inclúe a licenza propia de PaperPaw e as dos tipos de letra, iconas e patróns de separación silábica que vén con el. Os complementos poden engadir unha liña propia, como o autor dun tema."
