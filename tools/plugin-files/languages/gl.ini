dictionary.plugin.name = Dicionario
dictionary.plugin.description = Busca palabras en dicionarios StarDict.
dictionary.plugin.how = "O dicionario busca unha palabra dun libro en dicionarios StarDict e amosa as definicións nun panel sobre a parte inferior da pantalla.\n\nNo lector, mantén premida unha palabra e escolle Buscar; cos botóns, usa Seleccionar texto en Máis. Copia os cartafoles de dicionarios (cos ficheiros .ifo, .idx e .dict) no cartafol «dictionaries» do dispositivo, tamén valen subcartafoles, ou escolle outro cartafol en Configuración, en Lectura, como Cartafol de dicionarios (unha configuración avanzada). A primeira busca prepara un pequeno índice para cada dicionario, o que leva un momento.\n\nNo panel, os botóns de páxina ou Arriba e Abaixo desprazan as definicións longas e Atrás péchao. Co tacto, toca fóra del para pechalo."
