vocabulary.sd.readme = "Tarxetas de estudo desde ficheiros\n\nPon aquí un ficheiro por cada baralla: Galego.tsv crea a baralla Galego.\nFicheiros: .tsv, .csv ou .txt, gardados como UTF-8, ou .apkg: unha baralla de Anki, exportada con Admitir versións antigas de Anki marcado. Os tres primeiros campos das súas notas pasan a ser anverso, reverso e exemplo; a súa planificación e a multimedia non se len, e PaperPaw nunca escribe un ficheiro de Anki.\n\nUnha tarxeta en cada liña: anverso, reverso e un exemplo (opcional), separados por un tabulador, unha coma ou un punto e coma. A primeira liña pode nomear as columnas: front, back, example. Exemplo:\n\nGato\tcat\tO gato durme.\n\nDespois abre Tarxetas de estudo no lector, escolle Tarxetas da tarxeta SD e logo Actualizar as barallas desde a tarxeta.\n\nÉ bo saber:\n- As barallas quedan no lector, co que aprendeches. Un ficheiro lese cando é novo ou cambiou, e as súas tarxetas engádense á baralla ou cámbianse nela.\n- Se cambias o reverso ou o exemplo dunha tarxeta no ficheiro: a tarxeta cambia e conserva o teu progreso.\n- Se cambias o texto do anverso dunha tarxeta: conta como unha tarxeta nova, e a antiga comeza de cero. As tarxetas identifícanse polo texto do anverso; os espazos e as maiúsculas non contan. Garda unha baralla nun ficheiro (Tarxetas da tarxeta SD, Gardar a baralla na tarxeta) e cada tarxeta terá un número na columna id: cambia alí un anverso, mantén as dúas primeiras liñas do ficheiro como están, e a tarxeta conserva o que aprendeches.\n- Gardar escribe as tarxetas da baralla. O que había no ficheiro e non é unha tarxeta (unha liña sen anverso) non se conserva; o ficheiro que había copiase a _nome.bak.tsv.\n- Garda o ficheiro como CSV UTF-8 (non UTF-16, nin o formato propio dunha folla de cálculo). Un ficheiro de máis de 4 MiB ou 20.000 liñas non se le: divídeo.\n- Unha liña que elimines no ficheiro non elimina a tarxeta da baralla, salvo que actives Retirar as tarxetas que faltan para esa baralla. Entón a tarxeta vai co que aprendeches.\n- Os ficheiros cuxo nome comeza por _ non se len.\n"
