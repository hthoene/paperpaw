opds.plugin.name = Catálogos OPDS
opds.plugin.description = Explora catálogos OPDS, descarga os seus libros e mantén cartafoles sincronizados con eles.
opds.plugin.how = "Os catálogos OPDS son bibliotecas en liña como Project Gutenberg, Calibre-Web, Kavita ou Komga. Este complemento explóraos e búscaos como cartafoles e descarga os seus libros na biblioteca.\n\nAbre Catálogos desde o menú Ferramentas e escolle Engadir un catálogo: un enderezo e, se o catálogo precisa unha conta, un nome de usuario e un contrasinal. Toca un catálogo para exploralo; mantenno premido (cos botóns, mantén premido Escoller) para sincronizalo, editalo ou retiralo.\n\nCon Sincronizar este catálogo activado, Sincronizar catálogos descarga os seus libros novos no seu cartafol. Libros por sincronización limita cantos obtén cada sincronización, para que un catálogo grande non encha o dispositivo. Un cartafol na nube (WebDAV) funciona no lugar dun catálogo."
