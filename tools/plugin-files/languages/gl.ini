puzzles.plugin.name = Pasatempos
puzzles.plugin.description = Sudoku, crucigramas e problemas de xadrez, sen conexión, cun pasatempo do día.
puzzles.plugin.how = "Pasatempos para o tren e a sala de espera, todo sen conexión: sudoku, crucigramas e problemas de xadrez. Abre Pasatempos desde o menú de ferramentas, ou engade o trebello Pasatempo do día á pantalla de inicio (mantén premida a pantalla de inicio e engade un trebello): amosa canto levas do sudoku de hoxe, e un toque ábreo. O sudoku do día é o mesmo todo o día.\n\nSudoku: esquerda e dereita moven o cursor cadrado a cadrado, arriba e abaixo (os botóns de páxina) unha fila. Escoller abre os díxitos: escolle un e escolle de novo para poñelo, ou Limpar para baleirar o cadrado. Mantén premido Escoller (ou Menú) para chegar aos botóns baixo o taboleiro: Notas converte os díxitos en marcas de lapis, Comprobar marca os cadrados errados, Desfacer retira a última xogada, Novo inicia un pasatempo do nivel que escollas (Fácil, Medio, Difícil). Cada pasatempo ten exactamente unha solución. A partida gárdase ao saír. Nunha pantalla táctil, toca un cadrado.\n\nCrucigramas: pon ficheiros .puz (Across Lite) ou .ipuz no cartafol «puzzles» da tarxeta de memoria; non se inclúe ningún. Móvete pola grella e despois escolle para escribir no teclado a palabra que está baixo o cursor (un guión baixo deixa un cadrado baleiro). Os botóns cambian entre horizontal e vertical, amosan a lista de pistas, comproban as letras e revelan a palabra. As letras gárdanse para cada ficheiro. Os ficheiros .puz cifrados non se poden abrir.\n\nProblemas de xadrez: un pequeno conxunto da base de datos de problemas de Lichess (CC0). Esquerda e dereita saltan de peza en peza; escolle a peza que queres mover, despois esquerda e dereita polos lugares aos que pode ir, e escolle de novo. Unha xogada errada retírase. Pista marca a peza que se debe mover, Seguinte vai ao seguinte problema.\n\nO taboleiro só volve debuxar os cadrados que cambian. Estatísticas conta os pasatempos que resolviches."
