diagnostics.plugin.name = Diagnóstico
diagnostics.plugin.description = Unha pantalla de proba e unha comprobación guiada de cada parte dun dispositivo.
diagnostics.plugin.how = "Diagnóstico é unha pantalla de proba para comprobar un dispositivo: amosa todos os niveis de gris que pode mostrar o panel, catro caixas para probar os botóns e o tacto, e un contador de páxinas cunha barra de progreso para comparar os modos de actualización.\n\nA pantalla de proba non ten entrada de menú. Só é a pantalla de inicio mentres ningún outro complemento ofreza unha, ou cando a escolles en Pantallas no xestor de complementos para o lugar Pantalla de inicio.\n\nEscoller marca a caixa co foco e os botóns de frecha móvense entre as caixas; co tacto, toca unha caixa. Os botóns de páxina pasan as páxinas de proba. Mantén premido Escoller, ou mantén un dedo sobre a pantalla, para comezar de novo.\n\nA comprobación do dispositivo, en Ferramentas onde PaperPaw é o firmware do dispositivo, repasa cada parte dun dispositivo páxina a páxina: a pantalla, os botóns, o tacto, a luz frontal, a batería, a tarxeta, o reloxo, o Wi-Fi, a suspensión e a memoria. Cada páxina remata con Fallo, Omitir e Superado, coa resposta que suxiren as medicións xa escollida; as partes que un dispositivo non ten omítense. Despois de cada resposta escribe un informe en .paperpaw/plugins/diagnostics/device-check.txt, para pegalo nunha solicitude de integración (pull request). Atrás sae, e ao abrilo de novo continúa onde estaba. Nun dispositivo só con botóns, escolle primeiro Iniciar na páxina de botóns; ata entón as frechas, Escoller e Atrás funcionan como en todas as páxinas."
