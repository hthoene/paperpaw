fonts-browser.plugin.name = Máis tipos de letra
fonts-browser.plugin.description = Amosa tipos de letra de internet, cada un cunha mostra, e descárgaos para ler con eles.
fonts-browser.plugin.how = "Máis tipos de letra lista tipos de letra dunha biblioteca de tipos de letra de internet, cada nome composto no seu propio tipo de letra, e descarga os que queres usar para ler.\n\nAtópao ao final da lista de tipos de letra onde se escolle o tipo de letra de lectura, en Configuración, en Lectura, como Tipo de letra; as liñas de estado teñen a mesma entrada para o seu tipo de letra. Toca un tipo de letra (cos botóns, preme Escoller) para velo máis grande cunha frase de mostra e escolle Descargar. Podes saír da páxina mentres descarga. Cando remate, escolle Ler con (o nome do tipo de letra) ou Usar para as liñas de estado. Actualizar obtén unha versión máis recente, Retirar elimina o tipo de letra do dispositivo.\n\nPrecisa Wi-Fi.\n\nTIPOS DE LETRA PROPIOS\n\nXunto a Máis tipos de letra, a mesma lista ten Tipos de letra propios, que amosa esta parte da axuda. Un tipo de letra propio é un ficheiro .ttf ou .otf, por exemplo de Google Fonts.\n\nEn Android e noutros dispositivos que debuxan ficheiros de tipos de letra: copia o ficheiro no cartafol fonts (en Android: PaperPaw/fonts no almacenamento compartido), reinicia PaperPaw e escolle o tipo de letra en Configuración, en Lectura, como Tipo de letra.\n\nNos Xteink X4 e X4 Pro: estes lectores len paquetes de tipos de letra, non ficheiros de tipos de letra, porque os ficheiros non cabrían na súa memoria. Crea un paquete nun ordenador con paperpaw-fontgen, para cada estilo que teñas (o normal é necesario):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nIsto crea o cartafol plugins/font-my-font. Cópiao no cartafol plugins da tarxeta de memoria, reinicia e escolle My Font como Tipo de letra. Un paquete dun estilo ocupa aproximadamente medio megabyte para letras latinas; os estilos que omitas debúxanse co normal. A ferramenta di cantas das letras que pides ten o tipo de letra (--chars latin,cyrillic,greek engade alfabetos): un tipo de letra sen as letras do teu libro non pode amosalas, así que busca un que cubra o seu alfabeto.\n\nOs tipos de letra de Máis tipos de letra funcionan do mesmo xeito e non precisan ordenador.\n\nPara un texto pequeno máis nítido no panel de tinta electrónica, engade --hinting light ao comando: axusta as letras á retícula de píxeles, como están feitos os tipos de letra predeterminados. Sen iso as letras debúxanse como as deseñou o tipo de letra; --hinting normal e --hinting mono axústanas con máis forza. Os tipos de letra con signos, como o árabe ou o devanágari, é mellor deixalos sen iso."
