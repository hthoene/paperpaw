help.setting.again.help = As pistas de cada pantalla amósanse unha vez máis a próxima vez que se abra.
help.again-done = As pistas amósanse de novo a próxima vez que se abra cada pantalla.
home.plugin.name = Pantalla de inicio
home.plugin.description = A páxina de inicio: páxinas de trebellos, como o libro que estás lendo e as ferramentas.
home.plugin.how = "A pantalla de inicio está feita de páxinas, cada unha unha grella de trebellos e ferramentas como nun teléfono. Ao principio o reloxo, o libro que estás lendo e os libros lidos recentemente están nunha páxina, e todas as ferramentas na seguinte.\n\nToca un elemento para abrilo e desliza o dedo ou usa os botóns de páxina para cambiar de páxina. Só con botóns, os botóns de frecha pasan dun elemento ao seguinte e Escoller ábreo.\n\nPara reorganizala, mantén premida a pantalla de inicio, toca o lapis debaixo da páxina ou escolle Editar a pantalla de inicio no menú. Arrastra os elementos para movelos ou toca un para ver as súas opcións, tamén cos botóns. Engadir un trebello tamén está aí. Columnas e Filas están na configuración, en Aspecto, na sección Pantalla de inicio.\n\nNunha pantalla xirada de lado, a pantalla de inicio amosa os mesmos elementos con máis columnas, cada páxina chea antes da seguinte, e tarxetas non máis anchas de aproximadamente 110 mm; non se cambia nada do que organizaches en vertical. Se a organizas de lado, ese deseño consérvase para esa orientación por separado: os novos trebellos engádense a ambos. Restablecer o deseño horizontal en Engadir (ao editar) volve ao derivado. Retirar un trebello ou unha ferramenta nunha orientación non o retira da outra."
