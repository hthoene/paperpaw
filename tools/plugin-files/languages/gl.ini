files.plugin.name = Explorador de ficheiros
files.plugin.description = Lista os libros e cartafoles do dispositivo e ábreos.
files.plugin.how = "A biblioteca lista os libros do teu cartafol da biblioteca, cada un coa súa cuberta, título, autor e canto levas lido. O libro que liches por último aparece enriba como unha tarxeta, así que continuar a ler leva un toque ou unha pulsación de Escoller. Mentres a biblioteca busca libros, di cantos atopou ata o momento.\n\nEscolle o que se amosa sobre os libros: todos, os que estás lendo, os non lidos ou os rematados, ou os andeis (por autor, serie, etiqueta, favoritos, o seguinte libro de cada serie que comezaches). Toca un libro para lelo; mantenno premido (cos botóns, mantén premido Escoller) para abrilo, marcalo como lido ou non lido, ver a súa información, movelo ao arquivo ou eliminalo. Toca o título para abrir o menú da biblioteca: como se ordenan e amosan os libros, a busca, o cartafol da biblioteca e a configuración.\n\nO cartafol da biblioteca defínese en Configuración, en Biblioteca, como Cartafol da biblioteca; aí tamén podes amosar os libros como unha grella de cubertas. Para calquera outro ficheiro, usa Ficheiros no menú Ferramentas."
