smart-home.plugin.name = Casa intelixente
smart-home.plugin.description = Valores e interruptores do teu propio Home Assistant nun panel e como trebellos da pantalla de inicio. Funciona con Home Assistant na túa rede doméstica.
smart-home.plugin.how = "Casa intelixente amosa valores e interruptores do teu propio Home Assistant: temperaturas, humidade, enerxía, portas e fiestras, luces, interruptores e escenas. Comunícase co teu servidor pola súa API REST na túa rede doméstica; nada pasa por ningún outro servizo.\n\nAbre Casa intelixente desde o menú de ferramentas e despois Conexión: escribe o enderezo do teu Home Assistant (por exemplo http://homeassistant.local:8123) e un token de acceso de longa duración (crea un na parte inferior da páxina do teu perfil de Home Assistant). O token gárdase entre os contrasinais e as claves, nunca nun ficheiro de configuración. O http simple só se usa para enderezos da túa rede doméstica; para un servidor noutro lugar activa «Servidores fóra da rede doméstica» na configuración e usa https cun certificado válido.\n\nEscoller entidades abre unha lista do que ten o teu servidor: busca por nome ou id e escolle unha entidade para amosala (escóllea de novo para retirala). Podes darlle unha sala, que a agrupa no panel e nos trebellos de sala. Gárdanse ata 24 entidades. No panel, escolle unha luz, un interruptor ou unha escena para accionala: a fila amosa a resposta do servidor. Un sensor que escollas lese de novo.\n\nTrebellos (mantén premida a pantalla de inicio e engade un trebello): Valor da casa intelixente amosa unha lectura en grande, Grupo lista as entidades dunha sala, Interruptor é un botón para unha luz ou un interruptor, e Sala é unha tarxeta coas lecturas e os interruptores dunha sala. A configuración de cada trebello indica que entidade ou sala amosa.\n\nA casa lese cando abres o panel, cando o pides (a fila Actualizar agora ou un toque nun trebello de valor ou de grupo), cando o lector esperta onde o Wi-Fi xa está activo, e segundo o calendario que definas mentres o cargador está conectado. Nunca acende a radio por si mesmo e nunca a mantén acesa."
