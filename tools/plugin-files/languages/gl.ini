power.plugin.name = Enerxía
power.plugin.description = Escolle o modo de enerxía, a man ou segundo a batería: Normal, Aforro, Sen conexión.
power.plugin.how = "Enerxía escolle como gasta PaperPaw a batería: Normal, Aforro ou Sen conexión. Aforro fai o que pode esperar en momentos mellores; Sen conexión mantén a radio apagada. Auto escolle segundo a batería.\n\nCambia o modo no panel rápido, onde Enerxía amosa os modos un xunto ao outro, ou en Configuración, en Enerxía. Aí tamén defines os niveis nos que Auto pasa a Aforro e a Sen conexión, e se segue en Normal durante a carga.\n\nNas liñas de estado, Modo de enerxía amosa unha folla durante o aforro e un Wi-Fi tachado en modo sen conexión, e nada en Normal.\n\nMantén premido o botón de acendido para abrir un pequeno menú: Suspender, Apagar (onde PaperPaw pode), Reiniciar e, en dispositivos táctiles, Bloquear o tacto ou Desbloquear o tacto. Unha pulsación curta segue suspendendo o dispositivo. Atrás sae do menú."
