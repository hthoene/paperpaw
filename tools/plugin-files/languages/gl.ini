bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Vincula mandos, teclados e sensores, e conéctaos.
bluetooth.plugin.how = "Bluetooth vincula mandos, teclados e sensores co lector, onde ten Bluetooth (o X4 Pro).\n\nEngadir un dispositivo busca o que está ao alcance; pon antes o dispositivo en modo de vinculación. Escóllao e confirma no lector (compara o número onde apareza). As teclas dun mando ou dun teclado pasan entón as páxinas e móvense polos menús; cambia o que fai cada tecla en Controis.\n\nMandos di cando funcionan as súas teclas: cando se activan aquí, durante a lectura (conectado mentres hai un libro aberto, o que aforra batería) ou sempre. O botón de menú ou unha pulsación longa sobre un dispositivo esquécello.\n\nUn sensor é para complementos: activa que complemento pode usalo. Bluetooth está desactivado sempre que ninguén o usa."
