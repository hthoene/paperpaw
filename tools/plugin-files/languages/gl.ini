keyboard.plugin.name = Teclado
keyboard.plugin.description = Introduce texto na pantalla, co tacto ou cos botóns.
keyboard.plugin.how = "O teclado ábrese sempre que algo precisa texto: unha busca, un contrasinal, unha nota ou unha configuración. Funciona co tacto e só con botóns.\n\nCos botóns, esquerda e dereita móvense ao longo dunha fila, os botóns de páxina móvense entre filas, Escoller preme unha tecla e Atrás cancela; esquerda e dereita dan a volta a unha fila, e arriba e abaixo manteñen a túa columna. Maiúsculas fai maiúscula a seguinte letra; prémea dúas veces para todas maiúsculas e unha vez máis para parar. Mantén premida unha letra (cos botóns: mantén premido Escoller sobre ela) para a súa maiúscula, escollida ao instante, e acentos como é e è; en alemán, ä, ö, ü e ß saen así de a, o, u e s (cos botóns, o teclado indícao nesas letras). Aceptar remata; cos botóns, mantén premido Atrás para rematar desde calquera lugar (Atrás soa cancela), ou mantén premido Escoller sobre unha tecla que non sexa letra. Pegar insire o texto do portapapeis e Teléfono, onde se ofreza, permite escribir no teléfono no seu lugar.\n\nNa configuración, en Dispositivo, Teclado: Disposicións de teclado escolle as disposicións. Por omisión segue o idioma do menú; con varias, unha tecla cambia entre elas. Teclas con diérese dá no seu lugar teclas propias para ä, ö, ü e ß. Tamaño fai máis grandes as teclas e as letras; só con botóns, as filas seguen sendo as dun teclado de ordenador. Nas pantallas táctiles, Forma das teclas cambia o aspecto das teclas. Maiúsculas automáticas comeza cada frase con maiúscula."
