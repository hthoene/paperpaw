settings.plugin.name = Configuración
settings.plugin.description = As páxinas de configuración, construídas coa configuración de todos os complementos.
settings.plugin.how = "Configuración amosa todo o que se pode configurar en PaperPaw e nos seus complementos, en páxinas. Os complementos non precisan unha pantalla propia: o que declaran aparece aquí, en grupos, coa descrición de cada axuste debaixo.\n\nÁbrea con Configuración no menú. Toca un grupo para abrilo e despois un axuste para activalo ou escollelo; os números teñen botóns − e +. Cos botóns, vai a un axuste e preme Escoller: esquerda e dereita cambian un número, Escoller consérvao, Atrás volve ao valor anterior.\n\nOs cambios aplícanse ao instante. Buscar atopa un axuste por palabras e Configuración avanzada engade os que raramente se precisan. Restablecer valores predeterminados e Restablecer todo preguntan primeiro."
