setup.plugin.name = Configuración inicial
setup.plugin.description = Unha guía curta polos axustes que importan, no primeiro inicio.
setup.plugin.how = "A configuración inicial é unha guía curta polos axustes que importan, que se amosa unha vez, a primeira vez que se inicia PaperPaw. Cada páxina pregunta unha cousa, como o idioma, os botóns, o tamaño do texto, o fuso horario, o Wi-Fi ou uns poucos complementos que engadir, cunha resposta razoable xa escollida, así que Seguinte sempre vale. Os pasos que este dispositivo non precisa omítense.\n\nToca os botóns, ou usa os botóns de arriba e abaixo e Escoller. Omitir na primeira páxina sae da configuración ao instante. A última páxina di de onde veñen os teus libros.\n\nPara executala de novo, abre a configuración e escolle Configurar PaperPaw. Todo o que escollas aquí pódese cambiar despois na configuración."
