stats.plugin.name = Estatísticas de lectura
stats.plugin.description = Rexistra canto tempo e canto lees, cun calendario e os números de cada libro.
stats.plugin.how = "As estatísticas de lectura rexistran canto tempo lees cada páxina. Véselas como un resumo con hoxe, a semana e a túa racha, como un calendario e cos números de cada libro.\n\nAbre as estatísticas desde Ferramentas, ou desde Máis no lector. Na configuración, en Estatísticas de lectura, podes desactivar Rexistrar a lectura, definir un Obxectivo diario e definir a Páxina máis curta e a Páxina máis longa que contan, para que folear ou deixar un libro aberto non falsee os números.\n\nSincronizar con KOReader comparte as estatísticas con KOReader a través dun cartafol WebDAV. Tamén incorpora as estatísticas de KOReader no mesmo dispositivo. O rexistro precisa que o reloxo estea axustado: se non o está, conéctate unha vez ao Wi-Fi."
