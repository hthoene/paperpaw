profiles.plugin.name = Perfís de lectura
profiles.plugin.description = Conxuntos con nome de axustes de lectura e pantalla, que se cambian cun toque.
profiles.plugin.how = "Un perfil garda os teus axustes de lectura, os axustes de pantalla e as liñas de estado baixo un nome, como Noite ou Letra grande, e devólveos cun toque.\n\nAbre Perfís no menú de lectura, en Máis, ou en Configuración, en Personalizar. Toca un perfil para usalo; o que está en uso aparece marcado. Mantenno premido (cos botóns, mantén premido Escoller) para gardar nel a configuración actual, renomealo ou retiralo. Gardar como novo perfil conserva o que está definido agora.\n\nPerfil seguinte pasa ao seguinte da lista; ponos nun botón ou nunha regra."
