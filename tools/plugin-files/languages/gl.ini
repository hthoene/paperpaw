notes-overview.plugin.name = Todas as notas
notes-overview.plugin.description = Os marcadores e os realces de todos os libros nunha lista, e unha exportación como My Clippings.txt.
notes-overview.plugin.how = "Todas as notas lista cada libro no que fixeches un marcador ou un realce, co número. Ábrea en Ferramentas. Escolle un libro para ver as súas notas e unha nota para abrir o libro nese lugar.\n\nAo final da lista, Exportar como My Clippings.txt escribe todas as notas nun ficheiro, no cartafol Exports xunto á biblioteca, na forma que usa un Kindle (UTF-8). As aplicacións que len o My Clippings.txt dun Kindle poden lelo. Unha nota sobre un realce é unha entrada propia, como nun Kindle. Como un libro aquí non ten localizacións de Kindle, «location» é a posición da nota no libro, en porcentaxe. O ficheiro escríbese de novo cada vez; substitúe o anterior."
