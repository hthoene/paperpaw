store.plugin.name = Tenda de complementos
store.plugin.description = Atopa, instala, actualiza e retira complementos para este dispositivo.
store.plugin.how = "A tenda de complementos atopa complementos para este dispositivo en internet e instálaos, actualízaos e retíraos. Ábrea desde Ferramentas; precisa Wi-Fi.\n\nO inicio amosa o que recomenda a biblioteca, o que é novo ou popular agora e despois os grupos. Un grupo lista os seus complementos nunha mestura xusta que cambia cada día, para que se vexa todos os complementos; ordénaos de A a Z, por máis novos ou por última actualización, e vai a unha letra nas listas longas. Abre un para ver a súa páxina, co seu tamaño e a memoria que ocupa, e despois escolle Instalar, Actualizar ou Retirar. Actualizar todo pon ao día todos os complementos instalados.\n\nOs complementos con código execútanse con acceso total ao dispositivo: a tenda dío e pregunta primeiro, e comezan tras un reinicio. Se un falla, PaperPaw inícase sen complementos con código e di cal foi. Biblioteca de complementos define de onde vén a lista.\n\nComplementos da comunidade, en Configuración, Sistema, tamén lista complementos que outros publicaron en GitHub. Ninguén os revisou: están marcados como Sen revisar, a páxina dun complemento con código amosa a clave coa que está asinado, e unha actualización asinada por outra clave non se instala.\n\nFontes, a última fila do inicio, engade listas de complementos doutras persoas polo seu enderezo (https://…/plugins.json), lista unha delas no lugar da de PaperPaw ou retírala. En vez de escribir, pon un ficheiro sources.txt cun enderezo en cada liña en .paperpaw/plugins/store na tarxeta: os enderezos aparecen en Fontes como novos. PaperPaw non comproba unha fonte nin os seus complementos, e o dispositivo contacta co servidor da fonte. Unha fonte asina a súa lista; o dispositivo garda a clave da primeira lista que le e desde entón só acepta listas e complementos con código asinados con esa clave. Un complemento recibe as súas actualizacións só da fonte desde a que se instalou. A biblioteca propia de PaperPaw sempre está aí e non se pode retirar; saír da tenda volve a ela."
