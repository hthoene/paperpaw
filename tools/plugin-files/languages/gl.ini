aids.plugin.name = Axudas de lectura
aids.plugin.description = Inicios de palabra en negra, palabras substituídas, imaxes: o texto como o queres.
aids.plugin.how = "As axudas de lectura cambian o aspecto do texto dun libro mentres lees. Aplícanse a todos os libros. Inicios de palabra en negra e Substituír palabras están desactivados ao principio.\n\nAtópalas en Configuración, en Lectura, na sección Axudas de lectura. Inicios de palabra en negra pon en negra a primeira metade de cada palabra, o que a algunhas persoas lles facilita o seguimento. Substituír palabras toma pares escritos como «colour = color; Mr. = Mister», separados por punto e coma.\n\nSó se substitúen palabras enteiras, exactamente como as escribiches, así que «color» nunca cambia parte dunha palabra máis longa. O ficheiro do libro non se modifica.\n\nAs imaxes dos libros poden amosarse (como ao principio), converterse nunha liña curta como «[Imaxe: un barco no mar]» que usa a descrición da imaxe, ou omitirse. Entón unha páxina ten máis espazo para texto e non se decodifica nada para unha imaxe que non se amosa, o que fai que as páxinas pasen máis rápido. Os cómics e outros libros feitos de imaxes non se modifican."
