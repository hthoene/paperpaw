reading-goal.plugin.name = Obxectivo de lectura
reading-goal.plugin.description = Minutos de lectura ao día e un gato na pantalla de inicio cuxo humor segue a lectura de hoxe.
reading-goal.plugin.how = "Un gato na túa pantalla de inicio amosa como vai a lectura de hoxe: triste mentres aínda non liches, así así despois dun pouco, contento a partir da metade do teu obxectivo diario, feliz cando o acadas.\n\nEngade o trebello Gato lector á pantalla de inicio (mantén premida a pantalla de inicio e engade un trebello), ou escolle O gato lector de hoxe como pantalla de suspensión. Un toque no gato abre o obxectivo diario; é o obxectivo das estatísticas de lectura, que contan os minutos que lees.\n\nNa configuración, en Lectura, Contento desde e Feliz desde definen a partir de que parte do obxectivo o gato está contento ou feliz, e Imaxes propias un cartafol de imaxes (sad, meh, content e happy) que se amosan no lugar dos gatos. As imaxes son ficheiros PNG ou JPEG; sen cartafol, aparecen os gatos."
