calibre.plugin.name = Biblioteca sen fíos
calibre.plugin.description = Recibe libros pola rede. Funciona como dispositivo sen fíos para Calibre.
calibre.plugin.how = "A biblioteca sen fíos fai que o dispositivo apareza en Calibre, no teu ordenador, como dispositivo sen fíos. Calibre pode entón enviarlle libros, listalos e eliminalos. Os libros van á biblioteca.\n\nAbre Biblioteca sen fíos desde o menú Ferramentas, co dispositivo e o ordenador na mesma rede Wi-Fi. En Calibre escolle Conectar/compartir e despois Iniciar a conexión de dispositivo sen fíos. Cando o dispositivo atope o teu ordenador, amosa o seu nome; toca Conectar (cos botóns, preme Escoller). Calibre pode engadir e eliminar libros aquí, así que conéctate só ao teu propio ordenador. Pechar a pantalla remata a conexión.\n\nSe Calibre non se atopa por si só, introduce o enderezo do seu ordenador en Configuración, en Biblioteca, como Enderezo na parte de Calibre. Se Calibre usa un porto distinto de 9090, engádeo como :porto, p. ex. 192.168.1.20:9091."
