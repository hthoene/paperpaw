rules.plugin.name = Regras
rules.plugin.description = Cando pasa algo, fai algo: p. ex. modo nocturno ás 22:00.
rules.plugin.how = "Unha regra fai algo por si soa cando pasa algo: modo nocturno todos os días ás 22:00, ou os catálogos sincronizados cando se inicia PaperPaw.\n\nAs regras están en Configuración, en Personalizar, como Regras. Engadir unha regra pregunta Cando? (PaperPaw inícase, unha hora do día, un libro aberto ou pechado, a batería, a carga, un interruptor e máis) e Entón que? (executar unha acción, activar ou desactivar un interruptor, definir un número, amosar unha mensaxe). Toca unha regra para poñela en pausa; mantenna premida (cos botóns, mantén premido Escoller) para unha condición como Entre dúas horas do día, ou para retirala.\n\nAs accións, os interruptores e os números que se poden escoller veñen por complemento: escolle o complemento e despois o que achega; Atrás sae del de novo. Unha acción que actúa sobre a pantalla amosada, como Atrás ou Páxina seguinte, fai o que faría se se premese alí.\n\nAs horas aplícanse sexa cal for a pantalla aberta. Dúas regras que se desfán mutuamente detéñense tras uns poucos pasos."
