transfer.plugin.name = Prijenos
transfer.plugin.description = Stavlja knjige i druge datoteke na uređaj iz preglednika u istoj mreži.
transfer.plugin.how = "Wi-Fi prijenos stavlja knjige i druge datoteke na uređaj iz preglednika u istoj mreži, bez kabla i aplikacije. Možeš i preuzimati datoteke, praviti foldere i brisati.\n\nOtvori ga iz Alata. Ekran prikazuje adresu kao tekst i kao QR kod: otvori je u pregledniku na telefonu ili računaru ili skeniraj kod. Adresa sadrži ključ koji se svaki put pravi iznova, pa drugi u mreži ne mogu doći do tvojih datoteka. Prijenos radi dok je ekran otvoren.\n\nGdje PaperPaw sam upravlja Wi-Fi mrežom, kao na X4, Bez rutera pri dnu otvara vlastitu mrežu uređaja, kojoj se telefon pridružuje skeniranjem koda."
