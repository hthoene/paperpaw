fonts-browser.plugin.name = Više fontova
fonts-browser.plugin.description = Prikazuje fontove s interneta, svaki s uzorkom, i preuzima ih za čitanje.
fonts-browser.plugin.how = "Više fontova navodi fontove iz biblioteke fontova na internetu, svaki naziv ispisan vlastitim fontom, i preuzima one kojima želiš čitati.\n\nNalaziš ga na kraju liste fontova gdje se bira font za čitanje, u Postavkama, pod Čitanje, kao Font; statusne trake imaju isti unos za svoj font. Dodirni font (s tipkama pritisni Odaberi) da ga vidiš veći s primjerom rečenice, zatim odaberi Preuzmi. Stranicu možeš napustiti dok se preuzima. Kad je gotovo, odaberi Čitaj s (naziv fonta) ili Koristi za statusne trake. Ažuriraj preuzima noviju verziju, Ukloni briše font s uređaja.\n\nTrebaju mu Wi-Fi.\n\nVLASTITI FONTOVI\n\nUz Više fontova, ista lista ima Vlastiti fontovi, koji prikazuje ovaj dio pomoći. Vlastiti font je .ttf ili .otf datoteka, na primjer s Google Fonts.\n\nNa Androidu i drugim uređajima koji crtaju datoteke fontova: kopiraj datoteku u folder fonts (na Androidu: PaperPaw/fonts u zajedničkoj pohrani), ponovo pokreni PaperPaw i odaberi font u Postavkama, pod Čitanje, kao Font.\n\nNa Xteink X4 i X4 Pro: ovi čitači čitaju pakete fontova, a ne datoteke fontova, jer datoteke fontova ne bi stale u njihovu memoriju. Napravi paket na računaru pomoću paperpaw-fontgen, za svaki stil koji imaš (običan je obavezan):\n\npaperpaw-fontgen --family \"Moj font\" --regular MojFont-Regular.ttf --bold MojFont-Bold.ttf --italic MojFont-Italic.ttf plugins\n\nOvo pravi folder plugins/font-moj-font. Kopiraj ga u folder plugins na memorijskoj kartici, ponovo pokreni i odaberi Moj font kao Font. Paket jednog stila ima oko pola megabajta za latinična slova; stilovi koje izostaviš crtaju se običnim. Alat kaže koliko traženih slova font ima (--chars latin,cyrillic,greek dodaje pisma): font bez slova tvoje knjige ne može ih prikazati, zato potraži onaj koji pokriva njeno pismo.\n\nFontovi iz Više fontova rade na isti način i ne trebaju računar.\n\nZa oštriji mali tekst na e-ink panelu, dodaj --hinting light u naredbu: prilagođava slova mreži piksela, kao što su napravljeni podrazumijevani fontovi. Bez toga slova se crtaju kako ih je font dizajnirao; --hinting normal i --hinting mono prilagođavaju ih jače. Fontove sa znakovima poput arapskog ili devanagarija najbolje je ostaviti bez toga."
