files.plugin.name = Preglednik datoteka
files.plugin.description = Navodi knjige i foldere na uređaju i otvara ih.
files.plugin.how = "Biblioteka navodi knjige u folderu tvoje biblioteke, svaku s naslovnicom, naslovom, autorom i koliko si je pročitao. Knjiga koju si posljednju čitao stoji na vrhu kao kartica, pa nastavak čitanja traži jedan dodir ili jedan pritisak na Odaberi. Dok biblioteka traži knjige, prikazuje koliko ih je dosad pronašla.\n\nOdaberi šta se prikazuje iznad knjiga: sve, one koje čitaš, nepročitane ili pročitane, ili police (po autoru, seriji, oznaci, omiljene, sljedeća knjiga svake serije koju si započeo). Dodirni knjigu da je čitaš; drži je (s tipkama drži Odaberi) da je otvoriš, označiš kao pročitanu ili nepročitanu, vidiš njene informacije, premjestiš u arhivu ili izbrišeš. Dodirni naslov za meni biblioteke: kako se knjige sortiraju i prikazuju, pretraga, folder biblioteke i postavke.\n\nFolder biblioteke podešava se u Postavkama, pod Biblioteka, kao Folder biblioteke; tamo možeš i prikazati knjige kao mrežu naslovnica. Za sve druge datoteke koristi Datoteke u meniju Alati."
