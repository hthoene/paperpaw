opds.plugin.name = OPDS katalozi
opds.plugin.description = Pregleda OPDS kataloge, preuzima njihove knjige i održava foldere usklađenim s njima.
opds.plugin.how = "OPDS katalozi su online biblioteke poput Project Gutenberga, Calibre-Weba, Kavite ili Komge. Ovaj dodatak ih pregleda i pretražuje kao foldere i preuzima njihove knjige u biblioteku.\n\nOtvori Kataloge iz menija Alati i odaberi Dodaj katalog: adresa i, ako katalog traži račun, korisničko ime i lozinka. Dodirni katalog da ga pregledaš; drži ga (s tipkama drži Odaberi) da ga sinhroniziraš, urediš ili ukloniš.\n\nKad je uključeno Sinhroniziraj ovaj katalog, Sinhroniziraj kataloge preuzima njegove nove knjige u njegov folder. Knjiga po sinhronizaciji ograničava koliko ih jedna sinhronizacija preuzima, da veliki katalog ne napuni uređaj. Umjesto kataloga može i Cloud folder (WebDAV)."
