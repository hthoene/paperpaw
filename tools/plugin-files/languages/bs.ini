anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Uči kartice koje su na redu iz programa Anki na tvom računaru i šalje tvoje odgovore nazad, putem dodatka AnkiConnect.
anki.plugin.how = "Anki ti omogućava da na čitaču učiš kartice koje su na redu u programu Anki na tvom računaru i šalje tvoje odgovore nazad. Koristi besplatni dodatak AnkiConnect (kod dodatka 2055492159) i nikad AnkiWeb. Isprva je isključen: dodaj ga iz prodavnice dodataka.\n\nNa računaru: instaliraj AnkiConnect u programu Anki (Alati, Dodaci, Preuzmi dodatke) i ponovo pokreni Anki. Anki mora biti otvoren dok sinhroniziraš.\n\nPodrazumijevano AnkiConnect odgovara samo računaru na kojem radi (127.0.0.1), pa čitač ne može doći do njega. Otvori Alati, Dodaci, AnkiConnect, Konfiguracija i postavi \"webBindAddress\" na \"0.0.0.0\" (osluškuje na kućnoj mreži). Port, \"webBindPort\", je 8765 osim ako ga ne promijeniš. Ako tamo postaviš \"apiKey\", unesi isti ključ ovdje. Ponovo pokreni Anki nakon promjene konfiguracije i dozvoli Anki kroz zaštitni zid računara ako pita. Koristi ovo samo na mreži kojoj vjeruješ: svako na njoj može doći do AnkiConnecta, pa je ključ dobra ideja.\n\nNa čitaču: otvori Anki iz Alata, zatim unesi adresu računara (na primjer 192.168.1.20) pod Računar, port ako nije 8765 i API ključ ako si ga postavio. Odaberi Špil ili ga ostavi praznim za sve špilove. Zatim odaberi Sinhroniziraj s Anki, uz uključen Wi-Fi: prvo se šalju tvoji odgovori koji čekaju, zatim se preuzimaju kartice koje su na redu (i broj novih kartica koji si postavio), najviše 50. Odaberi Uči da ih proučiš, bez mreže: prikaži odgovor i ocijeni ga sa Ponovo, Teško, Dobro ili Lako. Tvoji odgovori se čuvaju na čitaču, i bez Wi-Fi-ja, i odlaze u Anki pri sljedećoj sinhronizaciji. Anki odlučuje kada se kartica vraća: kartica na koju si odgovorio sa Ponovo preuzima se opet pri kasnijoj sinhronizaciji čim Anki kaže da je na redu.\n\nSinhroniziraj pri otvaranju, u postavkama, sinhronizira svaki put kad otvoriš ekran. Ništa ne koristi mrežu kad pritisneš tipku."
