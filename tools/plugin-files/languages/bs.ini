profiles.plugin.name = Profili čitanja
profiles.plugin.description = Imenovani skupovi postavki čitanja i prikaza, mijenjaju se dodirom.
profiles.plugin.how = "Profil pod jednim imenom pamti tvoje postavke čitanja, postavke prikaza i statusne trake, poput Noć ili Krupan tekst, i vraća ih dodirom.\n\nOtvori Profile u meniju čitanja pod Više ili u Postavkama pod Prilagođavanje. Dodirni profil da ga koristiš; onaj koji je u upotrebi je označen. Drži ga (s tipkama drži Odaberi) da u njega sačuvaš trenutne postavke, preimenuješ ga ili ukloniš. Sačuvaj kao novi profil pamti ono što je sada podešeno.\n\nSljedeći profil prelazi na sljedeći na listi; stavi ga na tipku ili u pravilo."
