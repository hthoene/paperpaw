settings.plugin.name = Postavke
settings.plugin.description = Stranice postavki, napravljene iz postavki svakog dodatka.
settings.plugin.how = "Postavke prikazuju sve što se može podesiti u PaperPaw-u i njegovim dodacima, na stranicama. Dodacima ne treba vlastiti ekran: ono što prijave pojavljuje se ovdje, u grupama, s opisom svake postavke ispod nje.\n\nOtvori ih s Postavke u meniju. Dodirni grupu da je otvoriš, zatim postavku da je prebaciš ili odabereš; brojevi imaju dugmad − i +. S tipkama pređi na postavku i pritisni Odaberi: lijevo i desno mijenjaju broj, Odaberi ga zadržava, Nazad vraća raniju vrijednost.\n\nPromjene važe odmah. Traži pronalazi postavku po riječima, a Napredne postavke dodaju rijetko potrebne. Vrati na zadano i Vrati sve prvo pitaju."
