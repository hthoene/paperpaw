vocabulary.sd.readme = "Kartice iz datoteka\n\nStavi ovdje datoteku za svaki špil: Spanish.tsv pravi špil Spanish.\nDatoteke: .tsv, .csv ili .txt, sačuvane kao UTF-8, ili .apkg: Anki špil, izvezen s označenim Podrži starije verzije Anki-ja. Prva tri polja njegovih bilješki postaju prednja strana, zadnja strana i primjer; njegov raspored učenja i mediji se ne čitaju, a PaperPaw nikad ne upisuje Anki datoteku.\n\nJedna kartica u svakom redu: prednja strana, zadnja strana i primjer (neobavezno), odvojeni tabulatorom, zarezom ili tačkom i zarezom. Prvi red može imenovati kolone: front, back, example. Primjer:\n\nmačka\tcat\tMačka spava.\n\nZatim otvori Kartice na čitaču, odaberi Kartice sa SD kartice, pa Ažuriraj špilove s kartice.\n\nDobro je znati:\n- Špilovi ostaju na čitaču, s onim što si naučio. Datoteka se čita kad je nova ili promijenjena, a njene kartice se dodaju špilu ili se tamo mijenjaju.\n- Promijeni zadnju stranu ili primjer kartice u datoteci: kartica se mijenja i zadržava tvoj napredak.\n- Promijeni tekst prednje strane kartice: računa se kao nova kartica, a stara počinje ispočetka. Kartice se prepoznaju po tekstu prednje strane, razmaci i velika slova se ne računaju. Sačuvaj špil u datoteku (Kartice sa SD kartice, Sačuvaj špil na karticu) i svaka kartica ima broj u koloni id: promijeni tamo prednju stranu, ostavi prva dva reda datoteke kakva jesu, a kartica zadržava ono što si naučio.\n- Čuvanje upisuje kartice špila. Ono što je bilo u datoteci a nije kartica (red bez prednje strane) ne čuva se; datoteka koja je tamo bila kopira se u _naziv.bak.tsv.\n- Sačuvaj datoteku kao CSV UTF-8 (ne UTF-16, ne vlastiti format tabele). Datoteka veća od 4 MiB ili s više od 20.000 redova ne čita se: podijeli je.\n- Red koji izbrišeš u datoteci ne briše karticu u špilu, osim ako za taj špil uključiš Ukloni kartice koje nedostaju. Tada kartica nestaje s onim što si naučio.\n- Datoteke čiji naziv počinje s _ ne čitaju se.\n"
