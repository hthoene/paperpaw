wifi.plugin.how = "Wi-Fi se povezuje na mrežu kad dodatku treba internet (katalog, sinhronizacija, prodavnica, prijenos) i ponovo isključuje radio minut nakon što ga više niko ne koristi, ili odmah kad se prikaže početni ekran ili knjiga, radi štednje baterije i memorije.\n\nOtvori Wi-Fi iz Postavki ili iz stavke Wi-Fi u statusnoj traci. Mreže navodi one u dometu; odaberi jednu i upiši njenu lozinku ili odaberi Podesi telefonom i upiši naziv i lozinku u pregledniku svog telefona umjesto na uređaju. Zaboravi uklanja sačuvanu mrežu.\n\nLozinke ostaju na kartici, sigurno pohranjene, i nikad se više ne prikazuju. Pod Poveži kad je potrebno podešavaš koliko dugo Wi-Fi ostaje uključen nakon posljednje upotrebe, ostaje li uključen dok se puni i koja sačuvana mreža ide prva kad je više njih u dometu."
