weather.plugin.name = Vrijeme
weather.plugin.description = Vrijeme sada i narednih dana kao vidžeti, iz Open-Meteo.
weather.plugin.how = "Vrijeme prikazuje vrijeme sada i narednih dana kao vidžete za početni ekran, iz Open-Meteo, kojem ne treba račun ni ključ. Vrijeme sada prikazuje temperaturu, stanje i više po izboru; Prognoza prikazuje naredne dane u nizu ili listi.\n\nPrvo odaberi mjesto: u postavkama, pod Vrijeme, Mjesto (upiši naziv, zatim ga odaberi među pronađenim mjestima). Šalju se samo njegove koordinate, i to samo dok je prikazan vidžet vremena. Vidžete dodaj uređivanjem početnog ekrana.\n\nVrijeme se preuzima najviše onoliko često koliko kaže Ažuriraj najviše svakih, i to samo dok postoji mreža: nikad sam ne uključuje Wi-Fi.\n\nPodaci o vremenu: Open-Meteo.com (https://open-meteo.com), pod licencom Creative Commons Imenovanje 4.0 (CC BY 4.0)."
