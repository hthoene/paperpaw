notes-overview.plugin.name = Sve bilješke
notes-overview.plugin.description = Obilježivači i isticanja svih knjiga na jednoj listi te izvoz kao My Clippings.txt.
notes-overview.plugin.how = "Sve bilješke navodi svaku knjigu u kojoj si napravio obilježivač ili isticanje, s brojem. Otvori ga u Alatima. Odaberi knjigu da vidiš njene bilješke, a bilješku da otvoriš knjigu na tom mjestu.\n\nNa kraju liste Izvezi kao My Clippings.txt upisuje sve bilješke u jednu datoteku, u folder Exports pored biblioteke, u obliku koji koristi Kindle (UTF-8). Aplikacije koje čitaju Kindleov My Clippings.txt mogu je pročitati. Bilješka uz isticanje je zaseban unos, kao na Kindleu. Budući da knjiga ovdje nema Kindle lokacije, „location“ je koliko je bilješka daleko u knjizi, u postocima. Datoteka se upisuje iznova svaki put; zamjenjuje prethodnu."
