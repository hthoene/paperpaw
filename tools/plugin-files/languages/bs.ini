help.setting.show = Savjeti
help.setting.show.help = Kad se ekran prvi put otvori, kratka napomena kaže šta rade njegove kontrole.
help.setting.again = Ponovo prikaži savjete
help.setting.again.help = Savjeti svakog ekrana prikazuju se još jednom, pri sljedećem otvaranju.
help.again-done = Savjeti se prikazuju ponovo, pri sljedećem otvaranju svakog ekrana.
home.plugin.name = Početni ekran
home.plugin.description = Početna stranica: stranice s vidžetima, poput knjige koja se čita, i alata.
home.plugin.how = "Početni ekran sastavljen je od stranica, svaka je mreža vidžeta i alata kao na telefonu. Isprva su sat, knjiga koju čitaš i nedavno pročitane knjige na jednoj stranici, a svi alati na sljedećoj.\n\nDodirni stavku da je otvoriš, a povuci ili koristi tipke za listanje da promijeniš stranicu. Samo s tipkama, tipke sa strelicama prelaze s jedne stavke na sljedeću, a Odaberi je otvara.\n\nDa ga preurediš, drži početni ekran, dodirni olovku ispod stranice ili odaberi Uredi početni ekran u meniju. Povuci stavke da ih premjestiš ili dodirni jednu za njene opcije, i s tipkama. Tu je i Dodaj vidžet. Kolone i Redovi nalaze se u postavkama, pod Izgled, u odjeljku Početni ekran.\n\nNa ekranu okrenutom na bok početni ekran prikazuje iste stavke s više kolona, svaka stranica se popuni prije sljedeće, a kartice nisu šire od oko 110 mm; ništa što si uredio uspravno se ne mijenja. Ako ga urediš na boku, taj raspored se čuva zasebno za tu orijentaciju: novi vidžeti dodaju se u oba. Vrati pejzažni raspored u Dodaj (tokom uređivanja) vraća na izvedeni raspored. Uklanjanje vidžeta ili alata u jednoj orijentaciji ne uklanja ga iz druge."
