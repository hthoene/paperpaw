mail.plugin.name = E-pošta
mail.plugin.description = Čita i šalje e-poštu s lozinkom ili lozinkom za aplikaciju (IMAP i SMTP), bez prijave u pregledniku.
mail.plugin.how = "E-pošta čita i šalje poruke putem IMAP-a i SMTP-a. Prijavljuje se tvojom adresom i lozinkom, bez prijave u pregledniku, pa radi sa svakim davaocem usluge koji to dozvoljava.\n\nPodesi račun pod Postavke, E-pošta. Odaberi davaoca usluge, upiši adresu i lozinku. Većina davalaca traži lozinku za aplikaciju: napravi je u sigurnosnim postavkama svog računa i koristi je ovdje. Tvoja uobičajena lozinka često ne radi, a nikad ne ide nigdje osim na server tvog davaoca. Čuva se uz lozinke i ključeve.\n\nOtvori E-poštu u alatima. Provjeri poštu preuzima najnovije poruke i foldere. Poruke ostaju na kartici, pa ih možeš čitati bez mreže. Uređaj se poveže, preuzme i odspoji, pa je Wi-Fi uključen samo trenutak.\n\nAko tvog davaoca nema na listi, odaberi Vlastiti serveri i podesi nazive servera, portove i sigurnost pod naprednim postavkama. Server čiji certifikat nijedno tijelo ne garantuje pita jednom da li mu vjeruješ; uporedi otisak s onim koji prikazuje tvoj davalac.\n\nPoruka s priloženom knjigom (EPUB, PDF i slično, do 2 MB) ima ispod sebe Otvori knjigu: preuzima datoteku, stavlja je u tvoju biblioteku i otvara je.\n\nDa vidiš novu poštu bez otvaranja E-pošte, uključi Provjeravaj novu poštu u pozadini pod Postavke, E-pošta, i odaberi koliko često (svakih 15, 30 ili 60 minuta). Isključeno je dok ga ne uključiš. Čitač se tada povremeno povezuje sigurnom vezom dok je budan i na mreži, jedan račun za drugim, i ažurira broj nepročitanih na početnom ekranu. Troši nešto baterije. Otvaranje E-pošte zaustavlja provjeru koja je u toku.\n\nVidžeti početnog ekrana prikazuju broj nepročitanih, najnovije i poruke sa zvjezdicom, jedno sanduče i prečicu za pisanje poruke."
