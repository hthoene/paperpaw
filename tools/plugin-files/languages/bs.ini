update.plugin.name = Ažuriranje
update.plugin.description = Instalira ažuriranja firmvera, s kartice ili preuzeta s interneta.
update.plugin.how = "Ažuriranje instalira novi firmver, na uređajima na kojima je PaperPaw firmver, poput X4. Nalaziš ga u postavkama, kao Ažuriranje.\n\nTraži online pita server za ažuriranja za noviji PaperPaw i preuzima ga, što traje nekoliko minuta putem Wi-Fi mreže. Ili kopiraj datoteku ažuriranja (koja završava na .bin, s paperpaw.org) u folder updates na kartici, na primjer putem Wi-Fi prijenosa. Instalacija tada traje oko minut i uređaj se ponovo pokreće; knjige, postavke i mjesta čitanja ostaju.\n\nUz Traži ažuriranja (u postavkama, isprva isključeno) uređaj sam pita otprilike jednom sedmično, samo dok je Wi-Fi ionako uključen ili se puni. Noviji PaperPaw koji pronađe čeka ovdje; ništa ne prekida tvoje čitanje. Pretraga šalje ono što uređaj pokreće, bez imena i broja uređaja; radi brojanja uređaja i je li si ti pitao te je li to njegova prva pretraga dana, sedmice ili mjeseca.\n\nAko dodaci koje koristiš još nemaju verziju za novo izdanje, ažuriranje ih čeka. Starija verzija se instalira samo ako je ti odabereš.\n\nI drugi firmver, poput CrossPointa, može se instalirati odavde: stavi njegovu datoteku (koja završava na .bin) u folder updates i otvori Ažuriranje. PaperPaw provjerava da je to cijeli firmver za ovaj uređaj, neoštećen, ali ne može reći ko ga je napravio, jer nije potpisan. Instaliraj svejedno upisuje ga u drugu polovinu fleša, a uređaj ga pokreće; PaperPaw ostaje u svojoj polovini dok taj firmver ne instalira nešto preko njega. Da se kasnije vratiš na PaperPaw, instaliraj njegovu instalacijsku datoteku (paperpaw-<uređaj>-<verzija>-install.bin) iz menija drugog firmvera, poput CrossPointovog ažuriranja firmvera s SD kartice."
