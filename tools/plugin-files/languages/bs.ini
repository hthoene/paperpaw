battery.plugin.name = Potrošnja baterije
battery.plugin.description = Bilježi bateriju i pokazuje koliko dugo traje.
battery.plugin.how = "Potrošnja baterije bilježi napunjenost otprilike jednom u minuti dok je uređaj aktivan, zajedno s onim što je radio: osvježavanja ekrana i okrenute stranice. Iz toga računa koliko troši sat aktivnosti i 100 stranica te koliko dugo baterija traje tim tempom.\n\nOtvori Bateriju iz menija Alati. Prikazuje trenutnu napunjenost, ovo aktivno razdoblje, dosadašnju potrošnju na bateriji i tvoja nedavna aktivna razdoblja. Listaš tipkama za listanje ili dodirom na strelice na vrhu.\n\nPotrebno je neko vrijeme čitanja na bateriji prije nego brojke išta znače. Bilježenje je isprva uključeno i može se isključiti u Postavkama, pod Uređaj, Napajanje, kao Bilježi potrošnju baterije."
