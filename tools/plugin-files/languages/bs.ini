notes-vault.plugin.name = Trezor bilješki
notes-vault.plugin.description = Čita folder Markdown bilješki po folderima, oznakama i posljednjim promjenama, s vidžetima za početni ekran. Radi s Obsidian trezorima.
notes-vault.plugin.how = "Trezor bilješki čita folder Markdown bilješki (obične .md datoteke, kako ih čuvaju aplikacije za bilješke). Radi s Obsidian trezorima.\n\nOdaberi folder trezora u postavkama ili na stranici trezora u alatima. Stranica tada nudi foldere kakvi su na kartici, posljednje promijenjene bilješke, oznake i pretragu naslova bilješki.\n\nPrvi put se trezor indeksira u pozadini dok je njegova stranica otvorena; trezor s hiljadama bilješki traje nekoliko minuta, a zatim se otvara odmah. Indeks se čuva na kartici i pravi se iznova kad se stranica trezora otvori nakon nekoliko sati ili kad odabereš Ažuriraj.\n\nBilješka se otvara u čitaču. Veze na druge bilješke ([[Bilješka]], [[Bilješka|riječi]], [[Bilješka#Naslov]]) pronalaze se po nazivu bilješke bilo gdje u trezoru; praćenje veze otvara tu bilješku, a Nazad vraća na prethodnu bilješku.\n\nNišta u trezoru se nikad ne mijenja. Vidžeti za početni ekran (nedavne bilješke, zakačena bilješka, bilješka dana, nasumična bilješka, oznake, pretraga) dodaju se u uređivaču početnog ekrana. Vidžet može uzimati bilješke samo iz jednog foldera: upiši putanju foldera od korijena kartice (na primjer Notes/Work) u postavkama vidžeta; ako ostane prazno, uzima sve bilješke trezora."
