setup.plugin.name = Podešavanje
setup.plugin.description = Kratki vodič kroz važne postavke, pri prvom pokretanju.
setup.plugin.how = "Podešavanje je kratki vodič kroz postavke koje su važne, prikazan jednom, pri prvom pokretanju PaperPaw-a. Svaka stranica pita po jednu stvar, poput jezika, tipki, veličine teksta, vremenske zone, Wi-Fi mreže ili nekoliko dodataka za dodavanje, s razumnim odgovorom već odabranim, pa je Dalje uvijek u redu. Koraci koji ovom uređaju nisu potrebni izostavljaju se.\n\nDodirni dugmad ili koristi tipke gore i dolje i Odaberi. Preskoči na prvoj stranici odmah napušta podešavanje. Posljednja stranica kaže odakle dolaze tvoje knjige.\n\nDa ga pokreneš ponovo, otvori postavke i odaberi Podesi PaperPaw. Sve odabrano ovdje može se kasnije promijeniti u postavkama."
