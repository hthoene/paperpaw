bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Uparuje daljinske upravljače, tastature i senzore te ih povezuje.
bluetooth.plugin.how = "Bluetooth uparuje daljinske upravljače, tastature i senzore s čitačem, tamo gdje ima Bluetooth (X4 Pro).\n\nDodaj uređaj traži ono što je u dometu; prvo stavi uređaj u način uparivanja. Odaberi ga i potvrdi na čitaču (uporedi broj gdje se prikaže). Tipke daljinskog upravljača ili tastature tada listaju stranice i kreću se kroz menije; šta svaka tipka radi mijenjaš pod Upravljanje.\n\nDaljinski upravljači kaže kada njihove tipke rade: kad su ovdje uključeni, tokom čitanja (povezani dok je knjiga otvorena, štedi bateriju) ili uvijek. Dugme menija ili dugi pritisak na uređaj briše ga iz memorije.\n\nSenzor je za dodatke: uključi koji dodatak ga smije koristiti. Bluetooth je isključen kad ga ništa ne koristi."
