tasks.plugin.name = Zadaci
tasks.plugin.description = Liste zadataka s rokovima i prioritetima, na čitaču ili sinhronizirane s tvojim CalDAV serverom, s vidžetima za početni ekran.
tasks.plugin.how = "Liste zadataka na tvom čitaču: zadaci s rokom i prioritetom, koji se označe kad su gotovi. Rade bez podešavanja i bez mreže, a mogu se uskladiti s CalDAV serverom (Nextcloud, Radicale, Baïkal, Fastmail i drugi), pa su iste liste na tvom telefonu i računaru.\n\nOtvori Zadatke iz menija alata. Prvi red navodi prikazanu listu; odaberi ga za drugu listu, za Danas i zakašnjelo preko svih lista, za novu listu, za sinhronizaciju ili za podešavanje računa. Dodaj zadatak otvara tastaturu. Odaberi na zadatku označava ga gotovim (ponovo: nije gotovo). Drži zadatak ili pritisni Meni da promijeniš njegov naslov, rok (danas, sutra, za sedmicu ili datum koji upišeš poput 2026-12-24) ili prioritet, ili da ga ukloniš. Otvoreni zadaci su prvi, po danu pa po prioritetu; završeni ostaju na kraju sedmicu dana (podešava se pod Zadaci u postavkama), zatim napuštaju čitač.\n\nVidžeti za početni ekran (drži početni ekran, zatim dodaj vidžet): Zadaci danas prikazuje šta dospijeva danas ili je zakašnjelo, Lista zadataka prikazuje jednu listu, Otvoreni zadaci ih broji, a Sljedeći zadatak prikazuje onaj koji je sljedeći na redu. Dodir na zadatak u vidžetu označava ga gotovim; dodir na naslov otvara liste.\n\nZa sinhronizaciju odaberi CalDAV račun iz reda liste i unesi adresu servera, svoje korisničko ime i lozinku (najbolje lozinku za aplikaciju). Dovoljna je adresa servera, npr. cloud.example.com/remote.php/dav; čitač odatle pronalazi tvoje liste zadataka. Svaka lista zadataka servera postaje lista na čitaču. Čitač sinhronizira kad otvoriš Zadatke, kad odabereš Sinhroniziraj odmah i kad je mreža ionako uključena; ono što promijeniš bez mreže čeka i šalje se kasnije. Ako je zadatak u međuvremenu promijenjen na čitaču i negdje drugdje, uzima se verzija servera, a tvoja se čuva kao novi zadatak pored nje, da ništa ne propadne. Bilješke, alarmi i sve ostalo što zadatak ima na serveru ostaju kakvi jesu. Zadaci koji se ponavljaju prikazuju se, ali se mijenjaju tamo gdje si ih napravio. Čitač drži do 200 zadataka u 12 lista."
