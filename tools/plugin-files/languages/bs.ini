store.plugin.name = Prodavnica dodataka
store.plugin.description = Pronalazi, instalira, ažurira i uklanja dodatke za ovaj uređaj.
store.plugin.how = "Prodavnica dodataka pronalazi dodatke za ovaj uređaj na internetu te ih instalira, ažurira i uklanja. Otvori je iz Alata; treba joj Wi-Fi.\n\nPočetak prikazuje šta biblioteka preporučuje, šta je novo ili trenutno popularno, zatim grupe. Grupa navodi svoje dodatke u poštenom miksu koji se mijenja svaki dan, da se svaki dodatak vidi; poredaj ih od A do Z, po najnovijim ili po posljednjem ažuriranju i idi na slovo u dugim listama. Otvori jedan da vidiš njegovu stranicu, s veličinom i memorijom koju zauzima, zatim odaberi Instaliraj, Ažuriraj ili Ukloni. Ažuriraj sve ažurira svaki instalirani dodatak.\n\nDodaci s kodom rade s punim pristupom uređaju: prodavnica to kaže i prvo pita, a pokreću se nakon ponovnog pokretanja. Ako jedan pođe po zlu, PaperPaw se pokreće bez dodataka s kodom i kaže koji je. Biblioteka dodataka određuje odakle dolazi lista.\n\nDodaci zajednice, u Postavkama, Sistem, navodi i dodatke koje su drugi objavili na GitHubu. Niko ih nije pregledao: označeni su kao Neprovjereno, stranica dodatka s kodom prikazuje ključ kojim je potpisan, a ažuriranje potpisano drugim ključem se ne instalira.\n\nIzvori, posljednji red početka, dodaju liste dodataka drugih po njihovoj adresi (https://…/plugins.json), prikazuju jednu od njih umjesto PaperPaw-ove ili je uklanjaju. Umjesto upisivanja, stavi datoteku sources.txt s jednom adresom u svakom redu u .paperpaw/plugins/store na kartici: adrese se pod Izvori prikazuju kao nove. PaperPaw ne provjerava izvor ni njegove dodatke, a uređaj se povezuje sa serverom izvora. Izvor potpisuje svoju listu; uređaj pamti ključ prve pročitane liste i od tada prihvata samo liste i dodatke s kodom potpisane tim ključem. Dodatak dobija ažuriranja samo iz izvora iz kojeg je instaliran. PaperPaw-ova vlastita biblioteka uvijek je tu i ne može se ukloniti; napuštanjem prodavnice vraća se na nju."
