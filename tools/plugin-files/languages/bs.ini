diagnostics.plugin.name = Dijagnostika
diagnostics.plugin.description = Ekran za testiranje i vođena provjera svakog dijela uređaja.
diagnostics.plugin.how = "Dijagnostika je ekran za testiranje uređaja: prikazuje svaki nivo sive koji panel može prikazati, četiri polja za isprobavanje tipki i dodira te brojač stranica s trakom napretka za poređenje načina osvježavanja.\n\nEkran za testiranje nema stavku u meniju. Početni je ekran samo dok nijedan drugi dodatak ne nudi svoj ili kad ga odabereš pod Ekrani u upravitelju dodataka za mjesto Početni ekran.\n\nOdaberi označava polje u fokusu, a tipke sa strelicama prelaze između polja; dodirom dodirni polje. Tipke za listanje okreću testne stranice. Drži Odaberi ili drži prst na ekranu da počneš ispočetka.\n\nProvjera uređaja, pod Alati gdje je PaperPaw firmver uređaja, prolazi kroz svaki dio uređaja stranicu po stranicu: ekran, tipke, dodir, prednje svjetlo, bateriju, karticu, sat, Wi-Fi, spavanje i memoriju. Svaka stranica završava s Neuspjelo, Preskoči i Prošlo, a odabran je odgovor koji sugeriraju mjerenja; dijelovi koje uređaj nema preskaču se. Nakon svakog odgovora upisuje izvještaj u .paperpaw/plugins/diagnostics/device-check.txt, za lijepljenje u pull request. Nazad ga napušta, a pri ponovnom otvaranju nastavlja gdje je stao. Na uređaju samo s tipkama prvo odaberi Počni na stranici tipki; do tada strelice, Odaberi i Nazad rade kao na svakoj stranici."
