format-cbz.plugin.name = Stripovi
format-cbz.plugin.description = Otvara arhive stripova (.cbz), jedna slika po stranici.
format-cbz.plugin.how = "Otvara arhive stripova (.cbz): jedna slika po stranici, prilagođena ekranu, redoslijedom njihovih naziva (2 prije 10).\n\nStavi ih u folder biblioteke i otvori iz biblioteke; stranice okreći kao u svakoj knjizi. Velike slike trebaju trenutak prvi put, na X4 više nego drugdje.\n\nPostavke čitanja (Postavke, Čitanje): „Kadar po kadar“ prikazuje po jedan kadar stranice, onoliko velik koliko ekran dopušta, a okretanje stranica prolazi kroz njih; stranica bez kadrova prikazuje se cijela. „Smjer stranica stripa“ zrcali okretanje stranica za mangu (zdesna nalijevo); ComicInfo.xml knjige to sam kaže. Biblioteka prikazuje naslov knjige te njenu seriju i broj iz ComicInfo.xml."
format-cbz.title = Strip (CBZ)
format-cbz.setting.direction = Smjer stranica stripa
format-cbz.setting.direction.help = Manga: okretanje stranica je zrcaljeno.
format-cbz.direction.book = Kako knjiga kaže
format-cbz.direction.ltr = Slijeva nadesno
format-cbz.direction.rtl = Zdesna nalijevo
format-cbz.setting.panels = Kadar po kadar
format-cbz.setting.panels.help = Po jedan kadar, okretanje stranica prolazi kroz njih.
format-docx.plugin.name = DOCX dokumenti
format-docx.plugin.description = Otvara .docx datoteke, kako ih čuvaju Word i drugi programi.
format-docx.plugin.how = "Otvara .docx dokumente kao knjige: naslove sa sadržajem, liste, tabele, podebljano i kurziv, veze i slike (JPEG, PNG, GIF).\n\nStavi datoteke u folder biblioteke i otvori ih iz biblioteke. Naslov i autor dolaze iz svojstava dokumenta. Fusnote, zaglavlja i podnožja te komentari se ne prikazuju."
format-docx.title = DOCX dokument
format-epub.plugin.name = EPUB
format-epub.plugin.description = Otvara EPUB knjige s njihovim stilovima, sadržajem i slikama.
format-epub.plugin.how = "EPUB knjige otvaraju se iz biblioteke kao i svaka druga knjiga, s njihovim sadržajem, slikama i izdavačevim oblikovanjem. Web stranice (HTML), Markdown, FictionBook (.fb2) i arhive stripova (.cbz) otvaraju se na isti način, svaki kao zaseban dodatak.\n\nPoglavlje se pretvara pri prvom otvaranju i čuva u kešu dodatka, pa je poslije brže i velike knjige rade na malim uređajima. Sadržaj nalaziš pod Sadržaj u meniju čitanja. Važi li oblikovanje same knjige, određuje postavka Formatiranje izdavača, pod Čitanje."
format-epub.title = EPUB e-knjiga
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Otvara FictionBook knjige (.fb2, i u zip formatu).
format-fb2.plugin.how = "Otvara FictionBook knjige (.fb2), uobičajene za ruske i druge knjige, i u zip formatu (.fb2.zip), s naslovom, autorima, naslovnicom i poglavljima.\n\nStavi ih u folder biblioteke; prikazuju se u biblioteci i otvaraju kao i svaka druga knjiga."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Otvara web stranice sačuvane kao datoteke, prikazujući samo ono što se čita.
format-html.plugin.how = "Otvara web stranice sačuvane kao datoteke (.html, .htm, .xhtml) kao knjige: samo ono što treba čitati, bez menija, reklama i sličnog oko toga.\n\nStavi datoteku u folder biblioteke i otvori je iz biblioteke kao svaku knjigu. Veze unutar stranice rade; slike se prikazuju gdje su u datoteci."
format-html.title = Web stranica (HTML)
format-images.plugin.name = Slike
format-images.plugin.description = Otvara slike (.jpg, .png, .gif) kao knjige, po jedna stranica.
format-images.plugin.how = "Slike (.jpg, .png, .gif) otvaraju se iz biblioteke kao knjige, jedna slika po stranici, prilagođena ekranu.\n\nDa pročitaš cijeli folder slika, otvori njegovu prvu sliku: slike poslije nje u folderu slijede redoslijedom njihovih naziva (2 prije 10). Kasnija slika počinje od te; mjesto u svakoj pamti se posebno. Folder do 300 slika čita se od one koju otvoriš.\n\nDatoteka koja nije slika, ili je prevelika, prikazuje svoj naziv umjesto toga. Za knjigu s mnogo slika i vlastitim naslovom bolji oblik je arhiva stripova (.cbz)."
format-images.title = Slika
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Otvara Markdown datoteke (.md), npr. bilješke.
format-markdown.plugin.how = "Otvara Markdown datoteke (.md), poput bilješki, kao knjige: naslove, liste, citate i naglašavanje onako kako su zamišljeni, a ne kao znakove.\n\nStavi datoteke u folder biblioteke i otvori ih iz biblioteke. Prvi naslov postaje njen naslov; slike pored datoteke prikazuju se tamo gdje ih tekst navodi."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI knjige
format-mobi.plugin.description = Otvara .mobi i .azw datoteke bez DRM-a.
format-mobi.plugin.how = "MOBI knjige (.mobi, .azw) otvaraju se iz biblioteke kao i svaka knjiga, bez ikakvog podešavanja. Naslov, autori, jezik i naslovnica dolaze iz knjige, a lista sadržaja pravi se iz njenih naslova.\n\nKnjiga se pretvara pri prvom otvaranju, što za dugu traje nekoliko sekundi; poslije se otvara odmah. Prikazuju se tekst, naslovi, podebljano i kurziv, veze i slike.\n\nKnjige s DRM-om (većina kupljenih u prodavnici) ne mogu se otvoriti, kao ni knjige s Huffmanovom kompresijom ili u novijem KF8 obliku (.azw3): PaperPaw to kaže kad ih otvoriš. Kopija kao EPUB, napravljena alatom poput Calibrea, uvijek se otvara."
format-mobi.title = MOBI knjige
format-rtf.plugin.name = RTF dokumenti
format-rtf.plugin.description = Otvara .rtf datoteke kao knjige.
format-rtf.title = RTF dokumenti
format-txt.plugin.name = Običan tekst
format-txt.plugin.description = Otvara obične tekstualne datoteke (.txt).
format-txt.plugin.how = "Obične tekstualne datoteke (.txt) otvaraju se iz biblioteke kao i svaka knjiga, bez ikakvog podešavanja. Dodatak čita UTF-8, UTF-16 i Windows-1252 tekst i sam prepoznaje kodiranje.\n\nPasusi prate prazne redove u datoteci; ako ih datoteka nema, svaki red je pasus. U datotekama s Project Gutenberga tekst licence na početku i kraju se izostavlja, a naslov i autor uzimaju se iz zaglavlja.\n\nDatoteka se nikad ne učitava cijela, pa se vrlo veliki tekstovi otvaraju i na malim uređajima."
format-txt.title = Običan tekst
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Otvara XTC i XTCH knjige, unaprijed iscrtane stranice čitača Xteink.
format-xtc.plugin.how = "XTC i XTCH datoteke su knjige čije su stranice već iscrtane kao slike, kako ih prave konverteri za čitače Xteink. Otvaraju se iz biblioteke kao i svaka knjiga.\n\nBudući da je svaka stranica fiksna slika, tekst se ne može povećati niti postaviti u drugi font. Stranice su crno-bijele ili imaju četiri nijanse sive. Svaka stranica se dekodira kad se prikaže, pa je potrebno malo memorije, i na X4.\n\nNaslov, autor i poglavlja uzimaju se iz datoteke ako ih ima."
format-xtc.title = XTC stranice
help.plugin.name = Savjeti
help.plugin.description = Pokazuje šta rade kontrole ekrana, pri prvom otvaranju.
help.plugin.how = "Kad se ekran prvi put otvori, kratka napomena preko njega kaže šta rade njegove kontrole: dijelovi ekrana na koje djeluje dodir, uokvireni, i šta rade tipke.\n\nDodir ili bilo koja tipka zatvara napomenu, i ona se za taj ekran više ne vraća. Više bez savjeta isključuje sve.\n\nU postavkama, pod Sistem, Savjeti ih uključuju ili isključuju, a Ponovo prikaži savjete čini da se napomena svakog ekrana prikaže još jednom."
