vocabulary.plugin.name = Vokabular
vocabulary.plugin.description = Čuva riječi koje potražiš, s njihovim rečenicama, i ponavlja kartice s raspoređenim ponavljanjem, napravljene na telefonu.
vocabulary.plugin.how = "Vokabular čuva riječi koje potražiš tokom čitanja, svaku s njenom rečenicom, da ih kasnije preispitaš. Listu nalaziš u Alatima, najnovije prvo; odaberi riječ da je ponovo potražiš. Posljednji red, Izvezi, čuva ih za aplikacije s karticama poput Anki. Lista čuva najnovijih 2.000 riječi: preko toga najstarije nestaju, pa ih prvo izvezi da zadržiš sve.\n\nKartice, također u Alatima, ispituju te raspoređenim ponavljanjem: nakon Prikaži odgovor ocijeniš svaku karticu sa Ponovo, Teško, Dobro ili Lako, a to određuje kada se vraća. Špilove praviš s Uredi telefonom: skeniraj kod telefonom u istoj Wi-Fi mreži, zatim upiši kartice ili dodaj mnogo odjednom: tamo otvori špil, odaberi Mnogo kartica odjednom i izaberi CSV, TSV ili TXT datoteku (kartica u svakom redu: prednja strana, zadnja strana, primjer; UTF-8), zalijepi listu ili donesi Anki špil (.apkg, izvezen s Podrži starije verzije Anki-ja). \n\nIli koristi datoteke na SD kartici: stavi CSV, TSV ili TXT datoteku ili Anki špil (.apkg, izvezen s Podrži starije verzije Anki-ja) za svaki špil u folder Flashcards (Spanish.tsv pravi špil Spanish; jedna kartica u svakom redu: prednja strana, zadnja strana, primjer; sačuvano kao UTF-8; prvi red može imenovati kolone front, back, example). Odaberi Kartice sa SD kartice u Karticama ili neka se to desi kad otvoriš Kartice. Špilovi ostaju na čitaču s onim što si naučio, a datoteka se spaja u svoj špil kad god je nova ili promijenjena: promijeni zadnju stranu ili primjer kartice u datoteci i kartica se mijenja i zadržava svoj napredak; promijeni tekst prednje strane i računa se kao nova kartica, stara počinje ispočetka (kartice se razlikuju po tekstu prednje strane; razmaci i velika slova se ne računaju); red koji izbrišeš ne briše karticu (osim ako za taj špil postaviš „kartice koje nedostaju u datoteci“ na Ukloni: tada se kartica pri sljedećem ažuriranju uklanja s napretkom, trajno, a ništa se ne uklanja dok se neki red datoteke ne može pročitati). Sačuvaj špil u njegovu datoteku s Sačuvaj na karticu: datoteka dobija brojeve kartica (kolona id), pa možeš mijenjati prednje strane na računaru, a kartice zadržavaju ono što si naučio; datoteka zadržava samo id, prednju stranu, zadnju stranu i primjer (druge kolone, komentari i redoslijed redova ne čuvaju se), a čuvanje se odbija dok se neki red datoteke nije mogao pročitati; datoteka koja je tamo bila kopira se u _naziv.bak.tsv prvi put (kasnije čuvanje ne zamjenjuje tu kopiju). Datoteka veća od 4 MiB ili s više od 20.000 redova ne čita se, a mora biti sačuvana kao CSV UTF-8, ne UTF-16. Prvi put čitač pravi folder s napomenom kako radi.\n\nU postavkama, pod Čitanje, Potražene riječi postaju kartice stavlja svaku potraženu riječ u špil Potraženo."
