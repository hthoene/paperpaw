menu.plugin.name = Meni
menu.plugin.description = Meni pri dnu ekrana, s radnjama i postavkama.
menu.plugin.how = "Meni navodi šta možeš raditi i podešavati. Otvara se pri dnu ekrana, iznad onoga što je otvoreno: tokom čitanja dodirni sredinu ekrana ili pritisni Odaberi. Dodirni ili odaberi stavku da je izvršiš.\n\nPostavke u meniju prikazuju svoju vrijednost i mijenjaju se na mjestu, pa meni ostaje otvoren. Stavka s više stavki otvara podmeni.\n\nPovuci prema dolje od gornjeg ruba za brzi panel: ono što često mijenjaš, kao dugmad. Dodirni dugme da ga prebaciš, drži ga za njegove postavke. Samo s tipkama, tipke sa strelicama biraju, Odaberi prebacuje, a Nazad zatvara. Pod Izgled, Meniji prikazuje menije kao listu ili kao pločice."
