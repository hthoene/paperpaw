picture-home.plugin.name = Početni ekran sa slikom
picture-home.plugin.description = Početni ekran s tvojom vlastitom slikom iza vidžeta i statusnom trakom koju podešavaš.
picture-home.plugin.how = "Početni ekran sa slikom zamjenjuje početni ekran dok je uključen: tvoja vlastita slika iza vidžeta i stranice vidžeta i alata koje urediš. Isključi ga u upravitelju dodataka i ugrađeni početni ekran se vraća, s vlastitim stranicama.\n\nStavi slike (JPEG, PNG ili GIF) u folder na kartici (podrazumijevano wallpapers), zatim odaberi jednu u Postavke, Prilagođavanje, Početni ekran sa slikom. Prilagodba kaže kako popunjava ekran (ispuna, cijela slika, razvlačenje, originalna veličina, popločavanje), Položaj koji dio ostaje, Zumiranje koliko je velika, a Posvijetli sliku koliko je blijeda: blijeda slika olakšava čitanje vidžeta. Slika se priprema jednom za svaku veličinu ekrana, što traje trenutak.\n\nVidžeti stoje na podlogama preko slike. Uredi stranicu kao na ugrađenom početnom ekranu: olovkom ispod stranice ili Uredi početni ekran u meniju.\n\nStatusna traka (vrijeme, Wi-Fi, baterija ili što odabereš) može biti uključena, isključena ili automatska, na vrhu ili pri dnu, pune širine ili mala kapsula lijevo, u sredini ili desno, na svijetloj, tamnoj ili sivoj podlozi ili na samoj slici. Red koji imenuje tipke (na X4) također može biti uključen, isključen ili automatski. Automatski znači da ih pritisak tipke prikazuje nekoliko sekundi; taj pritisak ne radi ništa drugo.\n\nPrikaz slike kaže kako se slika crta: Nivoi sive u svakoj sivoj koju ekran ima (sporije na X4), Rasterski u crno-bijelim tačkama (brzo) ili Automatski, kao ugrađeni početni ekran: nivoi sive kad se ekran iscrtava, tačke nakon prve promjene. Gdje ekran nema nivoe sive, nivoi sive prelaze u tačke."
