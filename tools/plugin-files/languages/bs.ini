calendar.plugin.name = Kalendar
calendar.plugin.description = Tvoji kalendari na čitaču: pregledi agende, dana, sedmice i mjeseca iz CalDAV-a, iCal-a i datoteka, rođendani iz kontakata, vidžeti i ekran spavanja.
calendar.plugin.how = "Tvoji kalendari na čitaču: agenda narednih dana, dan, sedmica i mjesec, s događajima iz CalDAV kalendara (Nextcloud, Radicale, Baïkal, Fastmail i drugi), iCal adresa (.ics, webcal://), datoteka kalendara na kartici te rođendanima i godišnjicama tvojih kontakata (CardDAV). Čitač kalendare samo čita; nikad ih ne mijenja.\n\nOtvori Kalendar iz menija alata. Prvi red navodi prikaz; odaberi ga, ili drži bilo koji red ili pritisni Meni, da se prebacuješ između Agende, Dana, Sedmice, Mjeseca i Rođendana, da dodaš kalendare ili da sinhroniziraš. U Danu i Sedmici prva dva reda vraćaju na prethodni dan ili sedmicu i pomiču na sljedeći (tipke za listanje to također rade); u Mjesecu tipke sa strelicama pomjeraju dan, tipke za listanje mjesec, a Odaberi otvara dan. Odaberi na događaju prikazuje ga cijelog: kada, gdje, koji kalendar i kako se ponavlja. Nazad vraća jedan korak.\n\nDodaj kalendar pod Kalendari (u meniju ili Kalendar u postavkama). Odaberi njegovu vrstu: CalDAV račun (dovoljna je adresa servera, npr. cloud.example.com/remote.php/dav; svaki kalendar s događajima postaje dio prikaza), iCal adresu (kalendar objavljen kao .ics), datoteku kalendara na kartici ili kontakte (CardDAV imenik: čitač prikazuje rođendane i godišnjice pohranjene uz njih). Unesi adresu, za račun svoje korisničko ime i lozinku (najbolje lozinku za aplikaciju; čuva se uz lozinke čitača) te naziv. Svaki kalendar ima oznaku (tačku, prsten, sivu tačku ili kvadrat) koju možeš promijeniti da ih razlikuješ; najviše šest kalendara.\n\nPonavljajući događaji (dnevni, sedmični, mjesečni, godišnji, s danima u sedmici, brojem ponavljanja, krajnjim datumima i izostavljenim danima), cjelodnevni događaji i događaji u drugim vremenskim zonama prikazuju se po vremenu čitača. Čitač čuva događaje od šezdeset dana prije do šezdeset dana poslije danas, najviše 240, i prikazuje ih bez mreže. Pravila koja ne može pročitati prikazuju svoj događaj jednom.\n\nKalendari se čitaju kad otvoriš kalendar (najviše svakih pet minuta), kad odabereš Sinhroniziraj odmah i, kako postaviš pod Kalendar u postavkama, kad je mreža ionako uključena ili kad počne punjenje. Čitač zbog toga nikad ne uključuje bežični radio, osim kad zatražiš Sinhroniziraj odmah.\n\nVidžeti za početni ekran (drži početni ekran, zatim dodaj vidžet): Danas prikazuje datum i šta dan donosi, Sljedeći događaj događaj koji slijedi, Agenda naredne dane, Mjesec mjesec s tačkom ispod dana koji imaju događaje, a Rođendani sljedeće rođendane. Dodir na događaj otvara ga, dodir na dan u mjesecu otvara taj dan. Ekran spavanja može prikazati današnju agendu: odaberi Kalendar pod Ekran spavanja u postavkama."
