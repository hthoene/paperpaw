reading-goal.plugin.name = Cilj čitanja
reading-goal.plugin.description = Minute čitanja dnevno i mačka na početnom ekranu čije raspoloženje prati današnje čitanje.
reading-goal.plugin.how = "Mačka na tvom početnom ekranu pokazuje kako ide današnje čitanje: tužna dok još nisi čitao, onako nakon malo čitanja, zadovoljna od polovine tvog dnevnog cilja, sretna kad ga dostigneš.\n\nDodaj vidžet Mačka čitanja na početni ekran (drži početni ekran, zatim dodaj vidžet) ili odaberi Današnju mačku čitanja kao ekran spavanja. Dodir na mačku otvara dnevni cilj; to je cilj statistike čitanja, koja broji minute koje čitaš.\n\nU postavkama, pod Čitanje, Zadovoljna od i Sretna od određuju od kojeg dijela cilja je mačka zadovoljna ili sretna, a Vlastite slike folder sa slikama (sad, meh, content i happy) koje se prikazuju umjesto mačaka. Slike su PNG ili JPEG datoteke; bez foldera prikazuju se mačke."
