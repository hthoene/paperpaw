file-manager.plugin.description = Svaki folder i datoteka na uređaju: otvaranje, preimenovanje, premještanje, kopiranje i brisanje.
file-manager.plugin.how = "Upravitelj datotekama prikazuje svaki folder i datoteku u pohrani uređaja, ne samo tvoje knjige, i omogućava da ih otvaraš, preimenuješ, premještaš, kopiraš i brišeš te da praviš nove foldere.\n\nOtvori Datoteke iz menija Alati. Dodirni folder da uđeš u njega; Nazad vodi u folder iznad. Dodirni datoteku ili drži bilo koju stavku (s tipkama drži Odaberi) da vidiš šta se s njom može uraditi. Premjesti i Kopiraj pamte stavku: idi u folder kojem pripada i odaberi Zalijepi ovdje u traci pri dnu. S tipkama pritisni Dolje od posljednje stavke da dođeš do trake.\n\nDatoteke i folderi koji počinju tačkom, poput PaperPaw-ovih vlastitih podataka, skriveni su. Da ih vidiš, uključi Skrivene datoteke u Postavkama, pod Biblioteka."
