koreader.plugin.name = Dijeljenje isticanja
koreader.plugin.description = Dijeli obilježivače i isticanja s KOReaderom za knjige koje se čitaju u oba.
koreader.plugin.how = "Ovaj dodatak dijeli obilježivače i isticanja s KOReaderom za knjige koje čitaš u oba, na jednom uređaju ili u folderu biblioteke koji se sinhronizira između uređaja. Ništa se ne mora podešavati.\n\nKad PaperPaw otvori knjigu koju je otvorio i KOReader, i kad promijeniš njene obilježivače ili isticanja, preuzima novo iz podataka KOReadera pored knjige, a novo odavde ostavlja KOReaderu da ga preuzme pri sljedećem otvaranju knjige. Uklonjene oznake i promijenjene bilješke također prelaze.\n\nOvo radi samo za EPUB knjige. Ako se datoteka jedne strane ne može pročitati, ništa se ne mijenja ni na jednoj strani dok ne bude moguće."
