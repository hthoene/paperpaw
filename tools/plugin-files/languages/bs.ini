stats.plugin.name = Statistika čitanja
stats.plugin.description = Bilježi koliko dugo i koliko čitaš, s kalendarom i brojkama svake knjige.
stats.plugin.how = "Statistika čitanja bilježi koliko dugo čitaš svaku stranicu. Vidiš je kao pregled s danas, sedmicom i tvojim nizom, kao kalendar i s brojkama svake knjige.\n\nOtvori je iz Alata ili iz Više u čitaču. U postavkama, pod Statistika čitanja, možeš isključiti Bilježi čitanje, postaviti Dnevni cilj te postaviti Najkraću stranicu i Najdužu stranicu koje se računaju, da listanje ili otvorena knjiga ne iskrive brojke.\n\nSinhroniziraj s KOReaderom dijeli statistiku s KOReaderom putem WebDAV foldera. Također preuzima statistiku KOReadera na istom uređaju. Bilježenje zahtijeva podešen sat: gdje nije, jednom se poveži na Wi-Fi."
