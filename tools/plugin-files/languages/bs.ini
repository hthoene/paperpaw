rules.plugin.name = Pravila
rules.plugin.description = Kad se nešto dogodi, uradi nešto: npr. noćni način u 22:00.
rules.plugin.how = "Pravilo samo nešto radi kad se nešto dogodi: noćni način uključen svaki dan u 22:00 ili katalozi sinhronizirani kad se PaperPaw pokrene.\n\nPravila su u Postavkama pod Prilagođavanje, kao Pravila. Dodaj pravilo pita Kada? (PaperPaw se pokrene, doba dana, knjiga se otvori ili zatvori, baterija, punjenje, prekidač i više) i Šta onda? (izvrši radnju, uključi ili isključi prekidač, postavi broj, prikaži poruku). Dodirni pravilo da ga pauziraš; drži ga (s tipkama drži Odaberi) za uvjet poput Između dva doba dana ili da ga ukloniš.\n\nRadnje, prekidači i brojevi za odabir dolaze po dodacima: odaberi dodatak, zatim ono što donosi; nazad ponovo izlazi iz njega. Radnja koja djeluje na prikazani ekran, poput Nazad ili Sljedeća stranica, radi ono što bi radila da je pritisnuta tamo.\n\nVremena važe bez obzira koji je ekran otvoren. Dva pravila koja se međusobno poništavaju zaustavljaju se nakon nekoliko koraka."
