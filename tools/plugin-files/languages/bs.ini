calibre.plugin.name = Bežična biblioteka
calibre.plugin.description = Prima knjige putem mreže. Radi kao bežični uređaj za Calibre.
calibre.plugin.how = "Bežična biblioteka omogućava da se uređaj u Calibreu na tvom računaru pojavi kao bežični uređaj. Calibre mu tada može slati knjige, navoditi ih i brisati. Knjige idu u biblioteku.\n\nOtvori Bežičnu biblioteku iz menija Alati, s uređajem i računarom u istoj Wi-Fi mreži. U Calibreu odaberi Poveži/Dijeli, zatim Pokreni vezu s bežičnim uređajem. Kad uređaj pronađe tvoj računar, prikazuje njegov naziv; dodirni Poveži (s tipkama pritisni Odaberi). Calibre ovdje može dodavati i brisati knjige, pa se povezuj samo s vlastitim računarom. Zatvaranjem ekrana veza se prekida.\n\nAko Calibre nije pronađen sam od sebe, unesi adresu njegovog računara u Postavkama, pod Biblioteka, kao Adresa u dijelu Calibre. Ako Calibre koristi port različit od 9090, dodaj ga kao :port, npr. 192.168.1.20:9091."
