power.plugin.name = Napajanje
power.plugin.description = Bira način napajanja, ručno ili prema bateriji: Normalno, Štednja, Bez mreže.
power.plugin.how = "Napajanje bira kako PaperPaw troši bateriju: Normalno, Štednja ili Bez mreže. Štednja radi ono što može čekati u povoljnijim trenucima; Bez mreže drži bežični radio isključenim. Auto bira prema bateriji.\n\nNačin mijenjaš u brzom panelu, gdje Napajanje prikazuje načine jedan pored drugog, ili u Postavkama pod Napajanje. Tamo podešavaš i nivoe pri kojima Auto prelazi na Štednju i na Bez mreže te ostaje li Normalno dok se puni.\n\nU statusnim trakama Način napajanja prikazuje list tokom štednje i precrtani Wi-Fi kad je bez mreže, a u Normalno ne prikazuje ništa.\n\nDrži tipku za napajanje da otvoriš mali meni: Spavanje, Isključi (gdje PaperPaw to može), Ponovo pokreni, a na uređajima s dodirom Zaključaj dodir ili Otključaj dodir. Kratak pritisak i dalje šalje uređaj na spavanje. Nazad napušta meni."
