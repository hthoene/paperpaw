translate.plugin.description = Prevodi odabrani tekst online, pomoću DeepL-a.
translate.plugin.how = "Prijevod prevodi odabrani tekst online pomoću DeepL-a. Odaberi tekst u knjizi i odaberi Prevedi u meniju odabranog teksta: prijevod se prikazuje preko stranice kao stavka rječnika. Tipke za listanje ili dodiri ga pomjeraju, a Odaberi ili dodir na njegovom kraju zatvara ga.\n\nTreba mu mreža i vlastiti DeepL API ključ, besplatan na deepl.com (DeepL API Free, oko 500.000 znakova mjesečno). Dok ga ne uneseš, panel to kaže, a dodir ga traži.\n\nU postavkama, pod Čitanje, u odjeljku Prijevod, Prevedi na određuje jezik; isprva je to PaperPaw-ov vlastiti."
