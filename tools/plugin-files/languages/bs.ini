lock.plugin.name = Zaključavanje ekrana
lock.plugin.description = PIN, uzorak ili lozinka pri buđenju uređaja; dodir zaključan tokom čitanja.
lock.plugin.how = "Zaključavanje ekrana traži PIN, uzorak ili lozinku kad se PaperPaw pokrene i kad se uređaj probudi. Isprva je isključeno. Štiti samo od usputne upotrebe: kod i broj pogrešnih pokušaja čuvaju se na SD kartici, pa ko izvadi karticu, uredi je ili zamijeni, zaobilazi zaključavanje.\n\nPodesi ga u postavkama, pod Uređaj, Zaključavanje ekrana: unesi kod koji je u upotrebi ako ga ima, odaberi vrstu, zatim novi kod dvaput. Uzorak se nudi samo na ekranima osjetljivim na dodir.\n\nNakon pet pogrešnih pokušaja sljedeći čeka pola minute. Zaključaj odmah zaključava odmah i može se staviti na tipku, pokret ili pravilo. Zaključavanje nakon buđenja može se isključiti, tako da zaključava samo pravi početak (uključivanje ili ponovno pokretanje), osim gdje je svako buđenje početak, kao na X4 na bateriji.\n\nUz to zaključavanje dodira: Zaključaj dodir u brzom panelu i meniju čitanja čini da dodiri, povlačenja i olovka ne rade ništa, dok tipke i dalje rade, npr. da čitaš s rukom na ekranu. Za otključavanje dodirni dvaput jednim prstom i zadrži ga trenutak; držanje tipke za napajanje otvara meni napajanja, u kojem Otključaj dodir to radi tipkama; na X4 Pro držanje tipke Početna otključava odmah."
