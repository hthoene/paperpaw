menu-editor.plugin.name = Uređivač menija
menu-editor.plugin.description = Preuređuje, uklanja i dodaje stavke svakog menija.
menu-editor.plugin.how = "Uređivač menija mijenja šta meniji sadrže: pomjeraj stavke gore ili dolje, uklanjaj ih ili dodaj nove.\n\nNalazi se u Postavkama pod Prilagođavanje, kao Prilagodi menije. Odaberi meni, zatim stavku da je pomjeriš ili ukloniš; Dodaj stavku ubacuje novu. Promjene važe odmah. Vrati ovaj meni vraća meni na način na koji ga definišu njegovi dodaci, Vrati sve menije to radi za svaki.\n\nNe možeš sebe zaključati: stavka koja je put do postavki ostaje dok ne dodaš drugi put do njih."
