keyboard.plugin.name = Tastatura
keyboard.plugin.description = Unosi tekst na ekranu, dodirom ili tipkama.
keyboard.plugin.how = "Tastatura se otvara kad god nešto treba tekst: pretraga, lozinka, bilješka ili postavka. Radi dodirom i samo s tipkama.\n\nS tipkama, lijevo i desno kreću se duž reda, tipke za listanje prelaze između redova, Odaberi pritiska tipku, a Nazad otkazuje; lijevo i desno kruže po redu, a gore i dolje ostaju u tvojoj koloni. Shift čini sljedeće slovo velikim; pritisni ga dvaput za sva velika, i još jednom da prestane. Drži slovo (s tipkama: drži Odaberi na njemu) za njegovo veliko slovo, odmah odabrano, i akcente poput é i è; u njemačkom ä, ö, ü i ß tako dolaze od a, o, u i s (s tipkama tastatura to kaže na tim slovima). OK završava unos; s tipkama drži Nazad da završiš s bilo kojeg mjesta (samo Nazad otkazuje) ili drži Odaberi na tipki koja nije slovo. Zalijepi umeće tekst iz međuspremnika, a Telefon, gdje se nudi, omogućava da umjesto toga tipkaš na telefonu.\n\nU postavkama pod Uređaj, Tastatura: Rasporedi tastature bira rasporede. Podrazumijevano prati jezik menija; s više njih, jedna tipka prebacuje između njih. Tipke za umlaute daju ä, ö, ü i ß vlastite tipke. Veličina povećava tipke i slova; samo s tipkama redovi ostaju kao na računarskoj tastaturi. Na ekranima osjetljivim na dodir Oblik tipki mijenja kako tipke izgledaju. Automatska velika slova počinju svaku rečenicu velikim slovom."
