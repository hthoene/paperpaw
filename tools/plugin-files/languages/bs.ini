plugin-manager.plugin.name = Upravitelj dodataka
plugin-manager.plugin.description = Navodi dodatke te ih uključuje i isključuje.
plugin-manager.plugin.how = "Upravitelj dodataka navodi svaki dodatak s verzijom i opisom te uključuje i isključuje dodatke.\n\nNalazi se u Postavkama, kao Upravljanje dodacima. Postavke dodataka su zasebna stranica za opcije poput korištenja mreže svakog dodatka. Dodirni dodatak da ga uključiš ili isključiš (s tipkama ga odaberi). Promjena važi nakon ponovnog pokretanja: traka pri dnu tada nudi Ponovo pokreni odmah. Drži dodatak (s tipkama drži Odaberi) da pročitaš kako radi.\n\nDodatak označen kao Uvijek uključen ne može se isključiti, a onaj označen kao Potreban tek kad drugi dodatak preuzme njegov posao, inače PaperPaw ne bi imao put nazad. Pod Ekrani biraš koji dodatak prikazuje mjesto koje nudi više njih."
