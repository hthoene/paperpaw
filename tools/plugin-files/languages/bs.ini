keys.plugin.name = Tipke i pokreti
keys.plugin.description = Šta radi svaka tipka, zona dodira i povlačenje, mijenjano na uređaju.
keys.plugin.how = "Tipke i pokreti prikazuje šta radi svaka tipka, zona dodira i povlačenje te omogućava da to promijeniš na uređaju.\n\nOtvori ga u postavkama, pod Uređaj. Prvo odaberi gdje se promjena primjenjuje: Svugdje, Tokom čitanja, Na početnom ekranu, U biblioteci ili u jednom alatu. Zatim odaberi ulaz, poput držane tipke ili povlačenja od ruba, i radnju s liste, koju možeš pretraživati. Standardno vraća ono što postavljaju dodaci i raspored tipki.\n\nNa X4 se odbija promjena nakon koje ne bi ostala nijedna tipka za odabir, vraćanje ili kretanje naprijed. Vrati tipke i pokrete na početno na kraju poništava svaku promjenu."
