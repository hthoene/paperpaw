smart-home.plugin.name = Pametni dom
smart-home.plugin.description = Vrijednosti i prekidači iz tvog vlastitog Home Assistanta na nadzornoj ploči i kao vidžeti početnog ekrana. Radi s Home Assistantom u tvojoj kućnoj mreži.
smart-home.plugin.how = "Pametni dom prikazuje vrijednosti i prekidače iz tvog vlastitog Home Assistanta: temperature, vlažnost, energiju, vrata i prozore, svjetla, prekidače i scene. Razgovara s tvojim serverom putem njegovog REST API-ja u tvojoj kućnoj mreži; ništa ne ide preko neke druge usluge.\n\nOtvori Pametni dom iz menija alata, zatim Veza: upiši adresu svog Home Assistanta (na primjer http://homeassistant.local:8123) i dugotrajni pristupni token (napravi ga pri dnu stranice profila u Home Assistantu). Token se čuva među lozinkama i ključevima, nikad u datoteci postavki. Običan http koristi se samo za adrese u tvojoj kućnoj mreži; za server drugdje uključi „Serveri izvan kućne mreže“ u postavkama i koristi https s važećim certifikatom.\n\nOdaberi entitete otvara listu onoga što tvoj server ima: traži po nazivu ili ID-u i odaberi entitet da ga prikažeš (ponovo ga odaberi da ga ukloniš). Možeš mu dati sobu, koja ga grupira na nadzornoj ploči i u vidžetima soba. Čuva se do 24 entiteta. Na nadzornoj ploči odaberi svjetlo, prekidač ili scenu da ga prebaciš: red prikazuje odgovor servera. Senzor koji odabereš čita se ponovo.\n\nVidžeti (drži početni ekran, zatim dodaj vidžet): Vrijednost pametnog doma prikazuje jedno očitanje krupno, grupa navodi entitete jedne sobe, prekidač je dugme za jedno svjetlo ili prekidač, a soba je kartica s očitanjima i prekidačima jedne sobe. Postavke svakog vidžeta kažu koji entitet ili sobu prikazuje.\n\nDom se čita kad otvoriš nadzornu ploču, kad zatražiš (red Osvježi odmah ili dodir na vidžet vrijednosti ili grupe), kad se čitač probudi tamo gdje je Wi-Fi već uspostavljen i prema rasporedu koji podesiš dok je punjač priključen. Nikad sam ne uključuje radio i nikad ga ne drži uključenim."
