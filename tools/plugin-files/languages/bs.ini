dictionary.plugin.name = Rječnik
dictionary.plugin.description = Traži riječi u StarDict rječnicima.
dictionary.plugin.how = "Rječnik traži riječ iz knjige u StarDict rječnicima i prikazuje definicije u panelu preko donjeg dijela ekrana.\n\nU čitaču drži riječ i odaberi Potraži; s tipkama koristi Odaberi tekst pod Više. Kopiraj foldere rječnika (s datotekama .ifo, .idx i .dict) u folder \"dictionaries\" na uređaju, podfolderi su dozvoljeni, ili odaberi drugi folder u Postavkama, pod Čitanje, kao Folder rječnika (napredna postavka). Prvo traženje priprema mali indeks za svaki rječnik, što traje trenutak.\n\nU panelu tipke za listanje ili Gore i Dolje pomjeraju duge definicije, a Nazad ga zatvara. Dodirom dodirni izvan njega da ga zatvoriš."
