aids.plugin.name = Pomoć pri čitanju
aids.plugin.description = Podebljani počeci riječi, zamijenjene riječi, slike: tekst kakav želiš.
aids.plugin.how = "Pomoć pri čitanju mijenja kako tekst knjige izgleda dok čitaš. Važi za svaku knjigu. Podebljani počeci riječi i Zamjena riječi isprva su isključeni.\n\nNalaziš ih u Postavkama, u dijelu Čitanje, u odjeljku Pomoć pri čitanju. Podebljani počeci riječi podebljavaju prvu polovinu svake riječi, što nekima olakšava praćenje. Zamjena riječi prima parove zapisane kao \"hljeb = kruh; sedmica = tjedan\", razdvojene tačkom i zarezom.\n\nZamjenjuju se samo cijele riječi, tačno onako kako si ih napisao, pa se dio duže riječi nikad ne mijenja. Sama datoteka knjige se ne mijenja.\n\nSlike u knjigama mogu se prikazati (kao isprva), pretvoriti u kratak red poput \"[Slika: brod na moru]\" koji koristi opis slike, ili izostaviti. Stranica tada ima više prostora za tekst, a ništa se ne dekodira za sliku koja se ne prikazuje, zbog čega se stranice brže okreću. Stripovi i druge knjige sastavljene od slika ne mijenjaju se."
