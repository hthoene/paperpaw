about.plugin.name = O aplikaciji
about.plugin.description = Verzija i licence PaperPaw-a.
about.plugin.how = "O aplikaciji pokazuje koju verziju PaperPaw-a imaš, gdje je njegov izvorni kod i pod kojim licencama dolazi.\n\nNalazi se na kraju Postavki, kao O PaperPaw-u. Odaberi red tipkama sa strelicama i Odaberi, ili ga dodirni. Ugrađeni dodaci u firmveru i, na uređajima koji učitavaju dodatke s kodom, otisak za koji takvi dodaci moraju biti napravljeni, također su navedeni.\n\nLicence se otvaraju kao tekst u čitaču, pa ih listaš kao knjigu. Sadrže PaperPaw-ovu vlastitu licencu i licence fontova, ikona i uzoraka za rastavljanje riječi koji dolaze s njim. Dodaci mogu dodati vlastiti red, poput autora teme."
