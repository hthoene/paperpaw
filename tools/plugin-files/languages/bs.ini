widgets.plugin.name = Paket vidžeta
widgets.plugin.description = Još mnogo vidžeta za početni ekran: satovi, kalendar, citati, knjige, bilješke i više.
widgets.plugin.how = "Paket vidžeta dodaje mnogo vidžeta za početni ekran: satove (analogni, riječima, u pločicama, svjetski), kalendar, godinu dosad, odbrojavanje, mjesečevu fazu te dan i datum; citat dana, bilješke, zadatke, slike, pozdrav i PaperPaw logotip; a za knjige trenutno čitanje, napredak, sljedeće na redu, seriju, omiljene, jedno isticanje i biblioteku u brojkama. U njemu je i vidžet baterije.\n\nDodaj ih s Uredi početni ekran u meniju (ili dugim pritiskom na početni ekran), zatim Dodaj vidžet. Svaki ima vlastite postavke, poput okvira, veličine i poravnanja. Odabir vidžeta koji se mijenja, poput citata dana, prikazuje sljedeći. Vlastiti citati idu u quotes.txt u .paperpaw/plugins/widgets na kartici, svaki red kao tekst | autor. Vidžetima vremena treba podešen sat; Wi-Fi ga podešava."
