reader.plugin.name = Čitač
reader.plugin.description = Prikazuje knjige stranicu po stranicu, sa sadržajem i postavkama čitanja.
reader.plugin.how = "Čitač prikazuje knjige stranicu po stranicu. Otvori knjigu iz biblioteke; posljednja knjiga može se ponovo otvoriti pri pokretanju (postavka Otvori posljednju knjigu pri pokretanju).\n\nDodirni lijevu ili desnu stranu ekrana ili koristi tipke za listanje da okrećeš stranice. Dodirni sredinu ili pritisni Odaberi za meni čitanja: Sadržaj, Traži, Idi na stranicu, Font i raspored, Obilježivači i isticanja i više. Povlačenje dolje od gornjeg ruba otvara brzi panel, gore od donjeg ruba vodi na početni ekran; tako radi i držanje Nazad.\n\nDrži Odaberi (ili drži sliku) da vidiš sliku preko cijelog ekrana: Lijevo i Desno prolaze kroz slike stranice. Odaberi zumira na 2x, 3x i nazad (dvostruki dodir na dodir); uvećano, Lijevo i Desno pomjeraju u stranu, tipke za listanje (ili povlačenje) idu dalje poprijeko i prema dolje. Nazad vraća na prilagođeno, zatim na stranicu (na dodir drži za izlaz). Dodirni gornji desni ugao za obilježivač. Drži riječ da je istakneš. S tipkama drži Lijevo: Lijevo i Desno pomjeraju po riječ, tipke za listanje po red, njihovo držanje ide na krajeve stranice i po pasus; Odaberi otvara traku isticanja za riječ, držanje Odaberi proširuje je na rečenicu i pasus (tada Lijevo i Desno pomjeraju kraj, njihovo držanje početak). Odabir se nastavlja preko okretanja stranica. Izvezi kao Markdown čuva tvoje bilješke."
