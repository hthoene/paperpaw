pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Tajmer za fokus s krugovima rada i pauze, vidžetima i dnevnim brojačem.
pomodoro.plugin.how = "Pomodoro tajmer: radi u fokusiranim krugovima, zatim se odmori. Ne treba podešavanje: 25 minuta fokusa, 5 odmora, a nakon četiri kruga duga pauza od 15.\n\nOtvori Pomodoro iz menija alata i pritisni Start ili dodaj njegove vidžete na početni ekran (drži početni ekran, zatim dodaj vidžet): Pomodoro tajmer prikazuje fazu i preostale minute, Pomodoro start/pauza je dugme, a Pomodoro danas broji krugove koje si završio, s tvojim dnevnim ciljem. Dodir na tajmer pokreće ga ili pauzira; drži ga da otvoriš cijeli ekran.\n\nTajmer nastavlja raditi kad napustiš ekran i nakon ponovnog pokretanja nastavlja prema satu. Dok čitač spava, ništa ne radi: faza koja je u međuvremenu završila javlja se pri buđenju. Napomena te obavještava kad je faza gotova. Radi štednje baterije sat se ažurira jednom u minuti (svakih deset sekundi u posljednjoj minuti na cijelom ekranu) i nikad ne drži čitač budnim.\n\nPod Pomodoro u postavkama podešavaš trajanja i krugove jednog niza te počinje li sljedeća faza sama. Pod Više: bljesak ekrana ili treptaj prednjeg svjetla kad faza završi i dnevni cilj."
