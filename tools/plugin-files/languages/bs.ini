sleep.plugin.description = Prikazuje usnulu mačku, naslovnicu knjige, tvoje slike ili poruku dok uređaj spava.
sleep.plugin.how = "Ekran spavanja određuje šta ekran prikazuje dok uređaj spava. E-ink zadržava sliku bez napajanja.\n\nOdaberi ga u postavkama, pod Uređaj, Ekran spavanja, uz Prikaži: usnula mačka (podrazumijevano), naslovnica knjige, moje slike, logotip i \"Spavanje\", vidžeti, stranica kakva jeste ili stranica sa slikom. Moje slike prikazuje datoteke iz foldera sa slikama jednu za drugom.\n\nBez naslovnice ili slike prikazuje se mačka. Gdje sistem sam crta ekran spavanja, ove postavke su skrivene.\n\nEkran isključenja, Prikaži pri isključenju, crta se jednom kad se uređaj isključi, iz menija napajanja ili nakon vremena iz Isključi nakon spavanja (ne kad prazna baterija prekine napajanje). Isti je kao ekran spavanja osim ako odabereš logotip i \"Isključeno\", mačku, naslovnicu ili moje slike. Drugi dodatak može ponuditi ekran za to.\n\nEkran pokretanja i ponovnog pokretanja, Prikaži pri pokretanju i Prikaži pri ponovnom pokretanju, su vlastiti ekrani uređaja osim ako drugi dodatak ne nudi ekran za njih. Dodaci još ne rade dok se uređaj pokreće: ekran odabran za pokretanje crta se unaprijed, dok se uređaj isključuje ili ponovo pokreće, i prikazuje pri sljedećem pokretanju. Ekran koji nije spreman na vrijeme ili oštećena slika ustupaju mjesto ekranu uređaja; uređaj se u svakom slučaju isključuje ili ponovo pokreće."
