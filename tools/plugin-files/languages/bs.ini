puzzles.plugin.name = Zagonetke
puzzles.plugin.description = Sudoku, ukrštenice i šahovske zagonetke, bez mreže, sa zagonetkom dana.
puzzles.plugin.how = "Zagonetke za vlak i čekaonicu, sve bez mreže: sudoku, ukrštenice i šahovske zagonetke. Otvori Zagonetke iz menija alata ili dodaj vidžet Zagonetka dana na početni ekran (drži početni ekran, zatim dodaj vidžet): prikazuje koliko je današnji sudoku odmakao, a dodir ga otvara. Sudoku dana je isti cijeli dan.\n\nSudoku: lijevo i desno pomjeraju kursor polje po polje, gore i dolje (tipke za listanje) za jedan red. Odaberi otvara cifre: odaberi jednu i ponovo Odaberi da je upišeš, ili Obriši da isprazniš polje. Drži Odaberi (ili Meni) da dođeš do dugmadi ispod ploče: Bilješke pretvara cifre u olovkom označene, Provjeri označava pogrešna polja, Poništi vraća posljednji potez, Novi pokreće zagonetku nivoa koji odabereš (Lako, Srednje, Teško). Svaka zagonetka ima tačno jedno rješenje. Igra se čuva kad izađeš. Na ekranu osjetljivom na dodir dodirni polje.\n\nUkrštenice: stavi .puz (Across Lite) ili .ipuz datoteke u folder \"puzzles\" na memorijskoj kartici; nijedna nije uključena. Kreći se po mreži, zatim odaberi da tastaturom upišeš riječ ispod kursora (donja crta ostavlja polje praznim). Dugmad prebacuju između vodoravno i okomito, prikazuju listu tragova, provjeravaju slova i otkrivaju riječ. Slova se čuvaju za svaku datoteku. Šifrirane .puz datoteke ne mogu se otvoriti.\n\nŠahovske zagonetke: mali skup iz Lichess baze zagonetki (CC0). Lijevo i desno skaču s figure na figuru, odaberi figuru koju želiš pomjeriti, zatim lijevo i desno kroz mjesta kamo može ići i ponovo odaberi. Pogrešan potez se vraća. Savjet označava figuru koju treba pomjeriti, Dalje ide na sljedeću zagonetku.\n\nTabla ponovo crta samo polja koja se mijenjaju. Statistika broji zagonetke koje si riješio."
