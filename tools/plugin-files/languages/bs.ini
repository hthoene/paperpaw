news.plugin.name = Vijesti
news.plugin.description = Preuzima izvore vijesti (RSS, Atom) kao knjige za čitanje.
news.plugin.how = "Vijesti pretvaraju RSS ili Atom izvore u knjige. Svaki izvor postaje jedna knjiga u folderu News biblioteke, s najnovijim člancima kao običnim tekstom, za čitanje kao svaka druga knjiga.\n\nOtvori Vijesti iz menija Alati i odaberi Dodaj izvor; njegova adresa je na web stranici novina ili bloga. Preuzmi vijesti preuzima sve izvore i zamjenjuje ranije knjige. Drži izvor (s tipkama drži Odaberi) da ga preuzmeš ili ukloniš zasebno. Uklonjeni izvor ostavlja svoju knjigu u biblioteci.\n\nPreuzimanje zahtijeva mrežu. Članaka po izvoru (Postavke, Biblioteka) određuje koliko članaka sadrži svaka knjiga. Vidžet Naslovi vijesti prikazuje ih na početnom ekranu."
