rules.plugin.name = Правила
rules.plugin.description = Када се нешто догоди, ради нешто: нпр. ноћни режим у 22:00.
rules.plugin.how = "Правило само ради нешто када се нешто догоди: ноћни режим укључен сваки дан у 22:00, или каталози синхронизовани када се PaperPaw покрене.\n\nПравила су у Подешавањима под Прилагођавање, као Правила. Додај правило пита Када? (PaperPaw се покреће, доба дана, књига се отвара или затвара, батерија, пуњење, прекидач и више) и Шта тада? (покрени радњу, укључи или искључи прекидач, постави број, прикажи поруку). Додирни правило да га паузираш; држи га (са дугмадима држи Изабери) за услов као што је Између два доба дана, или да га уклониш.\n\nРадње, прекидачи и бројеви за избор долазе по додатку: изабери додатак, па шта он доноси; назад поново излази из њега. Радња која делује на приказани екран, као Назад или Следећа страница, ради оно што би урадила да је притиснута тамо.\n\nВремена важе који год екран да је отворен. Два правила која стално поништавају једно друго зауставе се после неколико корака."
