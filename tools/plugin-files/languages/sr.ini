lock.plugin.name = Закључавање екрана
lock.plugin.description = PIN, шаблон или лозинка када се уређај пробуди; додир закључан током читања.
lock.plugin.how = "Закључавање екрана тражи PIN, шаблон или лозинку када се PaperPaw покрене и када се уређај пробуди. У почетку је искључено. Чува само од успутне употребе: код и број погрешних покушаја чувају се на SD картици, па ко извади картицу, измени је или замени, заобилази закључавање.\n\nПодеси га у подешавањима, под Уређај, Закључавање екрана: унеси код који се користи ако га има, изабери врсту, па нови код двапут. Шаблон се нуди само на екранима осетљивим на додир.\n\nПосле пет погрешних покушаја следећи чека пола минута. Закључај сада закључава одмах и може да се стави на дугме, покрет или правило. Закључавање после буђења може да се искључи, тако да закључава само прави почетак (укључивање или поновно покретање), осим тамо где је свако буђење почетак, као на X4 на батерију.\n\nУз то закључавање додира: Закључај додир у брзом панелу и менију читања чини да додири, превлачења и оловка не раде ништа, док дугмад и даље раде, нпр. да читаш са руком на екрану. Да откључаш, додирни двапут једним прстом и задржи га тренутак; држање дугмета за напајање отвара мени Напајање, у ком Откључај додир то ради дугмадима; на X4 Pro држање тастера за почетни екран откључава одмах."
