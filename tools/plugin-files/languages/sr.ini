news.plugin.name = Вести
news.plugin.description = Преузима изворе вести (RSS, Atom) као књиге за читање.
news.plugin.how = "Вести претварају RSS или Atom изворе у књиге. Сваки извор постаје једна књига у фолдеру News библиотеке, са најновијим чланцима као обичним текстом, за читање као свака друга књига.\n\nОтвори Вести из менија Алати и изабери Додај фид; његова адреса је на веб сајту новина или блога. Преузми вести преузима све изворе и замењује раније књиге. Држи фид (са дугмадима држи Изабери) да га преузмеш или уклониш посебно. Уклоњени фид оставља своју књигу у библиотеци.\n\nПреузимање захтева мрежу. Чланака по фиду (Подешавања, Библиотека) одређује колико чланака свака књига садржи. Виџет Наслови вести приказује их на почетном екрану."
