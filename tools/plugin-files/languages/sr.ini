koreader.plugin.name = Дељење истицања
koreader.plugin.description = Дели обележиваче и истицања са KOReader-ом за књиге које се читају у оба.
koreader.plugin.how = "Овај додатак дели обележиваче и истицања са KOReader-ом за књиге које читаш у оба, на једном уређају или у фолдеру библиотеке који се синхронизује између уређаја. Ништа не треба подесити.\n\nКада PaperPaw отвори књигу коју је отворио и KOReader, и када промениш њене обележиваче или истицања, преузима оно што је ново из KOReader-ових података поред књиге, а оно што је ново овде оставља KOReader-у да преузме следећи пут када отвори књигу. Уклоњене ознаке и измењене белешке такође прелазе на другу страну.\n\nОво ради само за EPUB књиге. Ако датотека једне стране не може да се прочита, ништа се не мења ни на једној страни док не може."
koreader.removed-there = KOReader-ова датотека више нема истицања. Уклонити их и овде?
koreader.removed-there.text = Можда су уклоњена у KOReader-у или је његова датотека дошла са другог уређаја. Задржи их оставља овде и поново даје KOReader-у.
