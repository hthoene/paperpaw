format-cbz.plugin.name = Стрипови
format-cbz.plugin.description = Отвара архиве стрипова (.cbz), једна слика по страници.
format-cbz.plugin.how = "Отвара архиве стрипова (.cbz): једна слика по страници, прилагођена екрану, по редоследу њихових имена (2 пре 10).\n\nСтави их у фолдер библиотеке и отвори из библиотеке; странице листај као у било којој књизи. Велике слике први пут захтевају тренутак, на X4 више него другде.\n\nПодешавања читања (Подешавања, Читање): „Панел по панел“ приказује по један панел странице, колико год екран допушта, а листање корача кроз њих; страница без панела приказује се цела. „Странице стрипа иду“ огледално окреће листање за мангу (здесна налево); сама ComicInfo.xml књиге то каже. Библиотека приказује наслов књиге и њену серију и број из ComicInfo.xml."
format-cbz.title = Стрип (CBZ)
format-cbz.setting.direction = Странице стрипа иду
format-cbz.setting.direction.help = Манга: листање је огледално.
format-cbz.direction.book = Како књига каже
format-cbz.direction.ltr = Слева надесно
format-cbz.direction.rtl = Здесна налево
format-cbz.setting.panels = Панел по панел
format-cbz.setting.panels.help = По један панел, листање корача кроз њих.
format-docx.plugin.name = DOCX документи
format-docx.plugin.description = Отвара .docx датотеке, какве чувају Word и други програми.
format-docx.plugin.how = "Отвара .docx документе као књиге: наслове са садржајем, листе, табеле, подебљано и курзив, везе и слике (JPEG, PNG, GIF).\n\nСтави датотеке у фолдер библиотеке и отвори их из библиотеке. Наслов и аутор потичу из својстава документа. Фусноте, заглавља и подножја, и коментари се не приказују."
format-docx.title = DOCX документ
format-epub.plugin.name = EPUB
format-epub.plugin.description = Отвара EPUB књиге са њиховим стиловима, садржајем и сликама.
format-epub.plugin.how = "EPUB књиге се отварају из библиотеке као било која друга књига, са садржајем, сликама и стилизовањем издавача. Веб странице (HTML), Markdown, FictionBook (.fb2) и архиве стрипова (.cbz) отварају се на исти начин, свака као посебан додатак.\n\nПоглавље се претвара први пут када га отвориш и чува у кешу додатка, па је после брже и велике књиге раде на малим уређајима. Садржај налазиш под Садржај у менију читања. Да ли важи стилизовање саме књиге одређује подешавање Формат издавача, под Читање."
format-epub.title = EPUB е-књига
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Отвара FictionBook књиге (.fb2, и запаковане).
format-fb2.plugin.how = "Отвара FictionBook књиге (.fb2), честе за руске и друге књиге, и запаковане (.fb2.zip), са насловом, ауторима, корицама и поглављима.\n\nСтави их у фолдер библиотеке; приказују се у библиотеци и отварају као свака друга књига."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Отвара веб странице сачуване као датотеке, приказујући само оно што је за читање.
format-html.plugin.how = "Отвара веб странице сачуване као датотеке (.html, .htm, .xhtml) као књиге: само оно што је за читање, без менија, реклама и слично око тога.\n\nСтави датотеку у фолдер библиотеке и отвори је из библиотеке као било коју књигу. Везе унутар странице раде; слике се приказују тамо где су у датотеци."
format-html.title = Веб страница (HTML)
format-images.plugin.name = Слике
format-images.plugin.description = Отвара слике (.jpg, .png, .gif) као књиге, по једна страница.
format-images.plugin.how = "Слике (.jpg, .png, .gif) отварају се из библиотеке као књиге, једна слика по страници, прилагођена екрану.\n\nДа прочиташ цео фолдер слика, отвори његову прву слику: слике после ње у фолдеру следе по редоследу својих имена (2 пре 10). Каснија слика почиње тамо; место у свакој памти се посебно. Фолдер до 300 слика чита се од оне коју отвориш.\n\nДатотека која није слика, или је превелика, приказује своје име уместо тога. За књигу са много слика са сопственим насловом боља је форма архива стрипа (.cbz)."
format-images.title = Слика
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Отвара Markdown датотеке (.md), нпр. белешке.
format-markdown.plugin.how = "Отвара Markdown датотеке (.md), као што су белешке, као књиге: наслове, листе, цитате и истицања онако како су замишљени, а не као знакове.\n\nСтави датотеке у фолдер библиотеке и отвори их из библиотеке. Први наслов постаје његов наслов; слике поред датотеке приказују се тамо где их текст помиње."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI књиге
format-mobi.plugin.description = Отвара .mobi и .azw датотеке без DRM-а.
format-mobi.plugin.how = "MOBI књиге (.mobi, .azw) отварају се из библиотеке као свака књига, без икаквог подешавања. Наслов, аутори, језик и корице потичу из књиге, а листа садржаја прави се од њених наслова.\n\nКњига се претвара први пут када је отвориш, што код дуге траје неколико секунди; после се отвара одмах. Приказују се текст, наслови, подебљано и курзив, везе и слике.\n\nКњиге са DRM-ом (већина књига купљених у продавници) не могу да се отворе, као ни књиге са Huffman компресијом или у новијем KF8 облику (.azw3): PaperPaw то каже када их отвориш. Копија као EPUB, направљена алатом као што је Calibre, увек се отвара."
format-mobi.title = MOBI књиге
format-rtf.plugin.name = RTF документи
format-rtf.plugin.description = Отвара .rtf датотеке као књиге.
format-rtf.title = RTF документи
format-txt.plugin.name = Обичан текст
format-txt.plugin.description = Отвара обичне текстуалне датотеке (.txt).
format-txt.plugin.how = "Обичне текстуалне датотеке (.txt) отварају се из библиотеке као свака књига, без икаквог подешавања. Додатак чита UTF-8, UTF-16 и Windows-1252 текст и сам препознаје кодирање.\n\nПасуси следе празне редове у датотеци; ако је датотека нема, сваки ред је пасус. У датотекама са Project Gutenberg-а текст лиценце на почетку и на крају се изоставља, а наслов и аутор узимају се из заглавља.\n\nДатотека се никад не учитава цела, па се и веома велики текстови отварају на малим уређајима."
format-txt.title = Обичан текст
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Отвара XTC и XTCH књиге, унапред исцртане странице Xteink читача.
format-xtc.plugin.how = "XTC и XTCH датотеке су књиге чије су странице већ исцртане као слике, какве праве конвертори за Xteink читаче. Отварају се из библиотеке као свака књига.\n\nПошто је свака страница непроменљива слика, величина текста не може да се мења нити фонт да се замени. Странице су црно-беле или имају четири сива тона. Свака страница се декодира када се прикаже, па је потребно мало меморије, и на X4.\n\nНаслов, аутор и поглавља узимају се из датотеке ако их она има."
format-xtc.title = XTC странице
help.plugin.name = Савети
help.plugin.description = Показује шта раде контроле екрана, када се први пут отвори.
help.plugin.how = "Када се екран први пут отвори, кратка белешка преко њега каже шта раде његове контроле: делови екрана на које делује додир, уоквирени, и шта раде дугмад.\n\nДодир или било које дугме затвара белешку и она се за тај екран више не појављује. Без више савета искључује све.\n\nУ подешавањима, под Систем, Савети их укључује или искључује, а Прикажи савете поново чини да се белешка сваког екрана још једном прикаже."
