store.plugin.name = Продавница додатака
store.plugin.description = Налази, инсталира, ажурира и уклања додатке за овај уређај.
store.plugin.how = "Продавница додатака налази додатке за овај уређај на интернету и инсталира их, ажурира и уклања. Отвори је из Алата; потребан је Wi-Fi.\n\nПочетак приказује шта библиотека препоручује, шта је ново или тренутно популарно, па групе. Група наводи своје додатке у мешаном редоследу који се мења свакодневно, да би сваки био виђен; сортирај их од А до Ш, по најновијима или по последњем ажурирању и у дугим листама иди на слово. Отвори један да видиш његову страницу, са величином и меморијом коју заузима, па изабери Инсталирај, Ажурирај или Уклони. Ажурирај све доводи сваки инсталирани додатак на актуелну верзију.\n\nДодаци са кодом раде са пуним приступом уређају: продавница то каже и прво пита, а покрећу се после поновног покретања. Ако један крене лоше, PaperPaw се покреће без додатака са кодом и каже који је био. Библиотека додатака одређује одакле долази листа.\n\nДодаци заједнице, у Подешавањима, Систем, наводе и додатке које су други објавили на GitHub-у. Нико их није прегледао: означени су као Непрегледано, страница додатка са кодом приказује кључ којим је потписан, а ажурирање потписано другим кључем се не инсталира.\n\nИзвори, последњи ред почетка, додаје листе додатака других по њиховој адреси (https://…/plugins.json), наводи једну од њих уместо PaperPaw-ове или је уклања. Уместо куцања, стави датотеку sources.txt са по једном адресом у сваком реду у .paperpaw/plugins/store на картици: адресе се појављују под Извори као нове. PaperPaw не проверава извор нити његове додатке, а уређај контактира сервер извора. Извор потписује своју листу; уређај памти кључ прве прочитане листе и од тада прихвата само листе и додатке са кодом потписане тим кључем. Додатак добија ажурирања само из извора из ког је инсталиран. PaperPaw-ова библиотека је увек ту и не може да се уклони; напуштање продавнице враћа на њу."
