smart-home.plugin.description = Вредности и прекидачи из твог Home Assistant-а на контролној табли и као виџети почетног екрана. Ради са Home Assistant-ом у кућној мрежи.
smart-home.plugin.how = "Паметни дом приказује вредности и прекидаче из твог Home Assistant-а: температуре, влажност, енергију, врата и прозоре, светла, прекидаче и сцене. Разговара са твојим сервером преко његовог REST API-ја у кућној мрежи; ништа не иде преко неке друге услуге.\n\nОтвори Паметни дом из менија алата, па Веза: унеси адресу свог Home Assistant-а (на пример http://homeassistant.local:8123) и дугорочни приступни токен (направи га при дну странице профила у Home Assistant-у). Токен се чува међу лозинкама и кључевима, никад у датотеци подешавања. Обичан http користи се само за адресе у твојој кућној мрежи; за сервер негде другде укључи „Сервери ван кућне мреже“ у подешавањима и користи https са важећим сертификатом.\n\nИзабери ентитете отвара листу онога што твој сервер има: тражи по имену или ID-у и изабери ентитет да га прикажеш (изабери га поново да га уклониш). Можеш да му даш просторију, која га групише на контролној табли и у виџетима просторија. Чува се до 24 ентитета. На контролној табли изабери светло, прекидач или сцену да га пребациш: ред приказује одговор сервера. Сензор који изабереш чита се поново.\n\nВиџети (држи почетни екран, па додај виџет): Вредност паметног дома приказује једно очитавање крупно, група наводи ентитете једне просторије, прекидач је дугме за једно светло или прекидач, а просторија је картица са очитавањима и прекидачима једне просторије. Подешавања сваког виџета кажу који ентитет или просторију приказује.\n\nДом се чита када отвориш контролну таблу, када затражиш (ред Освежи сада или додир на виџет вредности или групе), када се читач пробуди где је Wi-Fi већ укључен, и по распореду који подесиш док је пуњач прикључен. Никад сам не укључује радио и никад га не оставља укљученим."
