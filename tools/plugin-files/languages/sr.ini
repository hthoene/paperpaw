file-manager.plugin.name = Менаџер датотека
file-manager.plugin.description = Сваки фолдер и датотека на уређају: отварање, преименовање, премештање, копирање и брисање.
file-manager.plugin.how = "Менаџер датотека приказује сваки фолдер и датотеку у меморији уређаја, не само твоје књиге, и омогућава да их отвараш, преименујеш, премешташ, копираш и бришеш и да правиш нове фолдере.\n\nОтвори Датотеке из менија Алати. Додирни фолдер да уђеш у њега; Назад води у фолдер изнад. Додирни датотеку, или држи било коју ставку (са дугмадима држи Изабери), да видиш шта може да се уради с њом. Премести и Копирај бирају ставку: иди у фолдер у који припада и изабери Налепи овде у траци при дну. Са дугмадима притисни Доле од последње ставке да дођеш до траке.\n\nДатотеке и фолдери чије име почиње тачком, као што су подаци самог PaperPaw-а, скривени су. Да их видиш, укључи Скривене датотеке у Подешавањима, под Библиотека."
