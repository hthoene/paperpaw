vocabulary.plugin.name = Речи
vocabulary.plugin.description = Чува речи које тражиш у речнику, са њиховим реченицама, и понавља картице за учење са распоређеним понављањем, направљене на телефону.
vocabulary.plugin.how = "Речи чувају речи потражене током читања, сваку са реченицом, за касније. Листа је у Алатима, најновије прво; изабери реч да је поново потражиш. Последњи ред, Извоз, чува их за апликације картица за учење као Anki. Листа чува 2.000 најновијих речи; старије нестају, па прво извези да задржиш све.\n\nКартице за учење, такође у Алатима, испитују те распоређеним понављањем: после Прикажи одговор оцени картицу са Поново, Тешко, Добро или Лако, што одређује кад се враћа. Шпилове прави са Уреди помоћу телефона: скенирај код телефоном у истом Wi-Fi-ју, па куцај картице или додај много одједном: отвори шпил, изабери Много картица одједном и CSV, TSV или TXT датотеку (картица по реду: предња, задња страна, пример; UTF-8), налепи листу или донеси Anki шпил (.apkg, извезен са Подржи старије Anki верзије). \n\nИли користи SD картицу: за сваки шпил стави CSV, TSV или TXT датотеку или Anki шпил (.apkg, извезен као горе) у фолдер Flashcards (Spanish.tsv прави шпил Spanish; картица по реду: предња, задња страна, пример; UTF-8; први ред може именовати колоне front, back, example). Изабери Картице са SD картице у Картицама за учење, или их само отвори. Шпилови остају на читачу са наученим, а нова или измењена датотека се спаја у свој шпил: измењена задња страна или пример мења картицу уз задржан напредак; измењена предња страна значи нову картицу, а стара креће изнова (картице се разликују по предњој страни, без обзира на размаке и велика слова); обрисан ред не брише картицу (осим ако за шпил подесиш „картице које недостају у датотеци“ на Уклони: тада се при следећем ажурирању картица трајно брише са напретком, али ништа док неки ред није читљив). Сачувај на картицу уписује шпил у датотеку са бројевима картица (колона id), па предње стране мењаш на рачунару, а картице задржавају научено; у датотеци остају само id, предња, задња страна и пример (остале колоне, коментари и редослед се губе), а чување се одбија док неки ред није читљив; стара датотека се први пут копира у _name.bak.tsv (касније се не замењује). Датотека преко 4 MiB или 20.000 редова се не чита; мора бити CSV UTF-8, не UTF-16. Читач први пут прави фолдер са упутством.\n\nУ подешавањима, под Читање, Потражене речи постају картице ставља сваку потражену реч у шпил Потражено."
