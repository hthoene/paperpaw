profiles.plugin.name = Профили читања
profiles.plugin.description = Именовани скупови подешавања читања и приказа, мењани једним додиром.
profiles.plugin.how = "Профил памти твоја подешавања читања, подешавања приказа и статусне линије под једним именом, као Ноћ или Крупан текст, и враћа их једним додиром.\n\nОтвори Профиле у менију читања под Више, или у Подешавањима под Прилагођавање. Додирни профил да га користиш; онај који се користи је означен. Држи га (са дугмадима држи Изабери) да у њега сачуваш тренутна подешавања, преименујеш га или уклониш. Сачувај као нови профил памти оно што је сада подешено.\n\nСледећи профил прелази на следећи са листе; стави га на дугме или у правило."
