reading-goal.plugin.name = Циљ читања
reading-goal.plugin.description = Минута читања дневно и мачка на почетном екрану чије расположење прати данашње читање.
reading-goal.plugin.how = "Мачка на твом почетном екрану показује како иде данашње читање: тужна док ништа није прочитано, онако-онако после мало, задовољна од половине твог дневног циља, срећна када га постигнеш.\n\nДодај виџет Читалачка мачка на почетни екран (држи почетни екран, па додај виџет), или изабери Данашња читалачка мачка као екран спавања. Додир на мачку отвара дневни циљ; то је циљ статистике читања, која броји минуте које читаш.\n\nУ подешавањима, под Читање, Задовољна од и Срећна од одређују од ког дела циља је мачка задовољна или срећна, а Сопствене слике фолдер са сликама (sad, meh, content и happy) које се приказују уместо мачака. Слике су PNG или JPEG датотеке; без фолдера приказују се мачке."
