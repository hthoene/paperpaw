stats.plugin.description = Бележи колико дуго и колико читаш, са календаром и бројевима сваке књиге.
stats.plugin.how = "Статистика читања бележи колико дуго читаш сваку страницу. Видиш је као преглед са данас, недељом и својим низом, као календар и са бројевима сваке књиге.\n\nОтвори је из Алата, или из Више у читачу. У подешавањима, под Статистика читања, можеш да искључиш Бележи читање, подесиш Дневни циљ и подесиш Најкраћа страница и Најдужа страница које се рачунају, да прелиставање или остављена отворена књига не квари бројеве.\n\nСинхронизуј са KOReader-ом дели статистику са KOReader-ом преко WebDAV фолдера. Преузима и статистику KOReader-а на истом уређају. Бележење захтева подешен сат: где није, повежи се једном на Wi-Fi."
