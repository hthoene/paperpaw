sleep.plugin.name = Екран спавања
sleep.plugin.description = Приказује мачку која спава, корице књиге, твоје слике или поруку док уређај спава.
sleep.plugin.how = "Екран спавања одређује шта екран приказује док уређај спава. Е-мастило задржава слику без струје.\n\nИзабери га у подешавањима, под Уређај, Екран спавања, са Приказ: мачка која спава (подразумевано), корице књиге, моје слике, логотип и „Спавање“, виџети, страница каква јесте, или страница са сликом. Моје слике приказује датотеке из фолдера са сликама једну за другом.\n\nБез корица или слике приказује се мачка. Где систем сам исцртава екран спавања, ова подешавања су скривена.\n\nЕкран при искључењу, Приказ при искључењу, исцртава се једном када се уређај искључује, из менија напајања или после времена из Искључи после спавања (не када слаба батерија прекине напајање). Исти је као екран спавања осим ако изабереш логотип и „Искључено“, мачку, корице или моје слике. Други додатак може да понуди екран за њега.\n\nЕкран при покретању и поновном покретању, Приказ при покретању и Приказ при поновном покретању, је сопствени екран уређаја осим ако други додатак не нуди екран за њих. Додаци још не раде док се уређај покреће: екран изабран за покретање исцртава се унапред, када се уређај искључује или поново покреће, и приказује при следећем покретању. Екран који није спреман на време, или слика која је оштећена, уступа место екрану уређаја; уређај се у сваком случају искључује или поново покреће."
