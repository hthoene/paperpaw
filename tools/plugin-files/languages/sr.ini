weather.plugin.name = Време
weather.plugin.description = Време сада и наредних дана као виџети, са Open-Meteo.
weather.plugin.how = "Време приказује време сада и наредних дана као виџете за почетни екран, са Open-Meteo, који не захтева налог ни кључ. Време сада приказује температуру, стање и још ствари за избор; Прогноза приказује наредне дане у реду или листи.\n\nПрво изабери место: у подешавањима, под Време, Место (укуцај име, па га изабери међу пронађеним местима). Шаљу се само његове координате, и само док је виџет времена приказан. Виџете додајеш уређивањем почетног екрана.\n\nВреме се преузима највише толико често колико каже Ажурирај највише сваких, и само док постоји мрежа: никад сам не укључује Wi-Fi.\n\nПодаци о времену од Open-Meteo.com (https://open-meteo.com), под лиценцом Creative Commons Attribution 4.0 (CC BY 4.0)."
