aids.plugin.name = Помоћ при читању
aids.plugin.description = Подебљани почеци речи, замењене речи, слике: текст како желиш.
aids.plugin.how = "Помоћ при читању мења како текст књиге изгледа док читаш. Важи за сваку књигу. Подебљани почеци речи и Замена речи су у почетку искључени.\n\nНалази се у Подешавањима, под Читање, у одељку Помоћ при читању. Подебљани почеци речи подебљава прву половину сваке речи, што неки лакше прате. Замена речи прима парове записане као „нпр = на пример; тзв = такозвани“, раздвојене тачком и зарезом.\n\nЗамењују се само целе речи, тачно онако како су уписане, па „нпр“ никад не мења део дуже речи. Сама датотека књиге се не мења.\n\nСлике у књигама могу да се приказују (као у почетку), претворе у кратак ред као „[Слика: брод на мору]“ који користи опис слике, или изоставе. Страница тада има више простора за текст, а за слику која се не приказује ништа се не декодира, што убрзава листање. Стрипови и друге књиге састављене од слика не мењају се."
