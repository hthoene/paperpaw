keyboard.plugin.name = Тастатура
keyboard.plugin.description = Уноси текст на екрану, додиром или помоћу дугмади.
keyboard.plugin.how = "Тастатура се отвара кад год нешто захтева текст: претрага, лозинка, белешка или подешавање. Ради додиром и само са дугмадима.\n\nСа дугмадима, лево и десно крећу се дуж реда, дугмад за листање између редова, Изабери притиска тастер, а Назад отказује; лево и десно иду унаоколо по реду, а горе и доле остају у твојој колони. Shift чини следеће слово великим; притисни га двапут за сва велика, и још једном да престане. Држи слово (са дугмадима: држи Изабери на њему) за његово велико слово, изабрано одмах, и за наглашена слова као што су é и è. OK завршава; са дугмадима, држи Назад да завршиш са било ког места (само Назад отказује), или држи Изабери на тастеру који није слово. Налепи умеће текст из привремене меморије, а Телефон, где је понуђен, омогућава да уместо тога куцаш на телефону.\n\nУ подешавањима под Уређај, Тастатура: Распореди тастатуре бира распореде. Подразумевано прати језик менија; са више њих, један тастер пребацује између њих. Тастери за умлауте даје им посебне тастере за ä, ö, ü и ß. Величина чини тастере и слова већим; само са дугмадима, редови остају као на тастатури рачунара. На екранима осетљивим на додир, Облик тастера мења како тастери изгледају. Аутоматска велика слова почиње сваку реченицу великим словом."
