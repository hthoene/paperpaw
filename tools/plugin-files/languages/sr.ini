transfer.plugin.how = "Wi-Fi пренос ставља књиге и друге датотеке на уређај из прегледача у истој мрежи, без кабла и апликације. Можеш и да преузимаш датотеке, правиш фолдере и бришеш.\n\nОтвори га из Алата. Екран приказује адресу као текст и као QR код: отвори је у прегледачу на телефону или рачунару, или скенирај код. Адреса садржи кључ који се прави изнова сваки пут, па остали у мрежи не могу да дођу до твојих датотека. Пренос ради док је екран отворен.\n\nГде PaperPaw сам управља Wi-Fi-јем, као на X4, Без рутера при дну отвара сопствену мрежу уређаја, којој се телефон придружује скенирањем кода."
