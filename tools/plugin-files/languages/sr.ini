diagnostics.plugin.name = Дијагностика
diagnostics.plugin.description = Тест екран и вођена провера сваког дела уређаја.
diagnostics.plugin.how = "Дијагностика је тест екран за проверу уређаја: приказује сваки ниво сиве који панел може да прикаже, четири поља за испробавање дугмади и додира и бројач страница са траком напретка за поређење режима освежавања.\n\nТест екран нема ставку у менију. Он је почетни екран само док га ниједан други додатак не нуди, или када га изабереш под Екрани у менаџеру додатака за место Почетни екран.\n\nИзабери означава поље у фокусу, а дугмад са стрелицама прелазе између поља; додиром додирни поље. Дугмад за листање листају тест странице. Држи Изабери, или држи прст на екрану, да почнеш изнова.\n\nПровера уређаја, под Алати где је PaperPaw фирмвер уређаја, пролази кроз сваки део уређаја страницу по страницу: екран, дугмад, додир, предње светло, батерију, картицу, сат, Wi-Fi, спавање и меморију. Свака страница се завршава са Неисправно, Прескочи и Исправно, а изабран је одговор који мерења сугеришу; делови које уређај нема се прескачу. После сваког одговора пише извештај у .paperpaw/plugins/diagnostics/device-check.txt, за убацивање у pull request. Назад га напушта, а при следећем отварању наставља тамо где је стао. На уређају само са дугмадима прво изабери Почни на страници дугмади; до тада стрелице, Изабери и Назад раде као на свакој страници."
