puzzles.plugin.name = Загонетке
puzzles.plugin.description = Судоку, укрштенице и шаховски задаци, без мреже, са загонетком дана.
puzzles.plugin.how = "Загонетке за воз и чекаоницу, све без мреже: судоку, укрштенице и шаховски задаци. Отвори Загонетке из менија алата или додај виџет Загонетка дана на почетни екран (држи почетни екран, па додај виџет): приказује докле је стигао данашњи судоку, а додир га отвара. Судоку дана је исти цео дан.\n\nСудоку: лево и десно померају курсор поље по поље, горе и доле (дугмад за листање) за један ред. Изабери отвара цифре: изабери једну и поново Изабери да је упишеш, или Обриши да испразниш поље. Држи Изабери (или Мени) да дођеш до дугмади испод табле: Белешке претвара цифре у оловка ознаке, Провери означава погрешна поља, Поништи враћа последњи потез, Ново почиње загонетку изабраног нивоа (Лако, Средње, Тешко). Свака загонетка има тачно једно решење. Игра се чува када изађеш. На екрану осетљивом на додир додирни поље.\n\nУкрштенице: стави .puz (Across Lite) или .ipuz датотеке у фолдер „puzzles“ на меморијској картици; ниједна није укључена. Крећи се по мрежи, па изабери да укуцаш реч испод курсора на тастатури (доња црта оставља поље празним). Дугмад пребацују између водоравно и усправно, приказују листу дефиниција, проверавају слова и откривају реч. Слова се чувају за сваку датотеку. Скремблиране .puz датотеке не могу да се отворе.\n\nШаховски задаци: мали скуп из Lichess базе задатака (CC0). Лево и десно скачу са фигуре на фигуру, изабери фигуру коју желиш да помериш, па лево и десно кроз места на која може да иде, и поново изабери. Погрешан потез се поништава. Савет означава фигуру која треба да се помери, Даље иде на следећи задатак.\n\nТабла поново исцртава само поља која се мењају. Статистика броји решене загонетке."
