notes-overview.plugin.name = Све белешке
notes-overview.plugin.description = Обележивачи и истицања свих књига на једној листи, и извоз као My Clippings.txt.
notes-overview.plugin.how = "Све белешке наводи сваку књигу у којој постоји обележивач или истицање, са бројем. Отвори га у Алатима. Изабери књигу да видиш њене белешке, а белешку да отвориш књигу на том месту.\n\nНа крају листе, Извези као My Clippings.txt уписује све белешке у једну датотеку, у фолдер Exports поред библиотеке, у облику који користи Kindle (UTF-8). Апликације које читају Kindle-ов My Clippings.txt могу да је прочитају. Белешка уз истицање је посебан унос, као на Kindle-у. Пошто књига овде нема Kindle локације, „location“ је колико је белешка дубоко у књизи, у процентима. Датотека се сваки пут пише изнова; замењује претходну."
