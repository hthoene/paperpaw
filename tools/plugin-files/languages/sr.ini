opds.plugin.name = OPDS каталози
opds.plugin.description = Прегледа OPDS каталоге, преузима њихове књиге и одржава фолдере усклађеним са њима.
opds.plugin.how = "OPDS каталози су онлајн библиотеке као што су Project Gutenberg, Calibre-Web, Kavita или Komga. Овај додатак их прегледа и претражује као фолдере и преузима њихове књиге у библиотеку.\n\nОтвори Каталоге из менија Алати и изабери Додај каталог: адреса и, ако каталог захтева налог, корисничко име и лозинка. Додирни каталог да га прегледаш; држи га (са дугмадима држи Изабери) да га синхронизујеш, измениш или уклониш.\n\nКада је укључено Синхронизуј овај каталог, Синхронизуј каталоге преузима његове нове књиге у његов фолдер. Књига по синхронизацији ограничава колико их једна синхронизација преузима, па велики каталог не напуни уређај. Уместо каталога може и Фолдер у облаку (WebDAV)."
