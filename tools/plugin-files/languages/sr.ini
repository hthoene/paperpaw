pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Тајмер за фокус са круговима рада и пауза, виџетима и дневним бројачем.
pomodoro.plugin.how = "Pomodoro тајмер: радиш у фокусираним круговима, па се одмараш. Не захтева подешавање: 25 минута фокуса, 5 одмора, а после четири круга дуга пауза од 15.\n\nОтвори Pomodoro из менија алата и притисни Почни, или додај његове виџете на почетни екран (држи почетни екран, па додај виџет): Pomodoro тајмер приказује фазу и преостале минуте, Pomodoro старт/пауза је дугме, а Pomodoro данас броји завршене кругове, са твојим дневним циљем. Додир на тајмер га покреће или паузира; држи га да отвориш цео екран.\n\nТајмер наставља да ради када напустиш екран и наставља по сату после поновног покретања. Док читач спава, ништа не ради: фаза која је у међувремену завршена јавља се при буђењу. Обавештење ти каже када је фаза готова. Да би штедео батерију, сат се ажурира једном у минути (сваких десет секунди у последњем минуту на целом екрану) и никад не држи читач будним.\n\nПод Pomodoro у подешавањима подешаваш дужине и кругове једног скупа, и да ли следећа фаза почиње сама. Под Више: бљесак екрана или треперење предњег светла када се фаза заврши и дневни циљ."
