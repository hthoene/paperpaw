bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Упарује даљинске управљаче, тастатуре и сензоре и повезује их.
bluetooth.plugin.how = "Bluetooth упарује даљинске управљаче, тастатуре и сензоре са читачем, тамо где има Bluetooth (X4 Pro).\n\nДодај уређај тражи шта је у домету; прво пребаци уређај у режим упаривања. Изабери га и потврди на читачу (упореди број где се појави). Тастери даљинског или тастатуре затим листају странице и крећу се кроз меније; шта сваки тастер ради мења се под Управљање.\n\nДаљински управљачи кажу када њихови тастери раде: када је овде укључено, током читања (повезано док је књига отворена, штеди батерију) или увек. Дугме менија или дуги притисак на уређају заборавља га.\n\nСензор је за додатке: укључи који додатак сме да га користи. Bluetooth је искључен кад год га ништа не користи."
