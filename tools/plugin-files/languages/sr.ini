setup.plugin.name = Подешавање
setup.plugin.description = Кратак водич кроз важна подешавања, при првом покретању.
setup.plugin.how = "Подешавање је кратак водич кроз важна подешавања, приказан једном, када се PaperPaw први пут покрене. Свака страница пита једну ствар, као што су језик, дугмад, величина текста, временска зона, Wi-Fi или неколико додатака за додавање, са паметним одговором већ изабраним, па је Даље увек у реду. Кораци који овом уређају нису потребни изостављају се.\n\nДодирни дугмад, или користи дугмад горе и доле и Изабери. Прескочи на првој страници одмах напушта подешавање. Последња страница каже одакле долазе твоје књиге.\n\nДа га поново покренеш, отвори подешавања и изабери Подеси PaperPaw. Све изабрано овде може касније да се промени у подешавањима."
