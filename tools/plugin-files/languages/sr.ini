calibre.plugin.name = Бежична библиотека
calibre.plugin.description = Прима књиге преко мреже. Ради као бежични уређај за Calibre.
calibre.plugin.how = "Бежична библиотека омогућава да се уређај појави у Calibre-у на твом рачунару као бежични уређај. Calibre му тада може слати књиге, листати их и брисати. Књиге иду у библиотеку.\n\nОтвори Бежичну библиотеку из менија Алати, са уређајем и рачунаром у истој Wi-Fi мрежи. У Calibre-у изабери Connect/share, затим Start wireless device connection. Када уређај пронађе твој рачунар, приказује његово име; додирни Повежи (са дугмадима притисни Изабери). Calibre овде може да додаје и брише књиге, зато се повезуј само са својим рачунаром. Затварање екрана прекида везу.\n\nАко Calibre не буде пронађен сам, унеси адресу његовог рачунара у Подешавањима, под Библиотека, као Адреса у делу Calibre. Ако Calibre користи порт различит од 9090, додај га као :порт, нпр. 192.168.1.20:9091."
