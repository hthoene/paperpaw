fonts-browser.plugin.name = Још фонтова
fonts-browser.plugin.description = Приказује фонтове са интернета, сваки са узорком, и преузима их за читање.
fonts-browser.plugin.how = "Још фонтова наводи фонтове из библиотеке фонтова на интернету, свако име исписано својим фонтом, и преузима оне којима желиш да читаш.\n\nНалази се на крају листе фонтова где се бира фонт за читање, у Подешавањима, под Читање, као Фонт; статусне линије имају исту ставку за свој фонт. Додирни фонт (са дугмадима притисни Изабери) да га видиш веће са узорком реченице, па изабери Преузми. Док се преузима, можеш да напустиш страницу. Када је готово, изабери Читај са (име фонта) или Користи за статусне линије. Ажурирај преузима новију верзију, Уклони брише фонт са уређаја.\n\nПотребан је Wi-Fi.\n\nТВОЈИ ФОНТОВИ\n\nУз Још фонтова иста листа има ставку Твоји фонтови, која приказује овај део помоћи. Твој фонт је .ttf или .otf датотека, на пример са Google Fonts.\n\nНа Android-у и другим уређајима који исцртавају датотеке фонтова: копирај датотеку у фолдер fonts (на Android-у: PaperPaw/fonts у заједничкој меморији), поново покрени PaperPaw и изабери фонт у Подешавањима, под Читање, као Фонт.\n\nНа Xteink X4 и X4 Pro: ови читачи читају пакете фонтова, а не датотеке фонтова, јер датотеке фонтова не би стале у њихову меморију. Направи пакет на рачунару помоћу paperpaw-fontgen, за сваки стил који имаш (обичан је потребан):\n\npaperpaw-fontgen --family \"Moj font\" --regular MojFont-Regular.ttf --bold MojFont-Bold.ttf --italic MojFont-Italic.ttf plugins\n\nТо прави фолдер plugins/font-moj-font. Копирај га у фолдер plugins на меморијској картици, поново покрени и изабери Moj font као Фонт. Пакет једног стила има око пола мегабајта за латинична слова; стилови које изоставиш исцртавају се обичним. Алат каже колико тражених слова фонт има (--chars latin,cyrillic,greek додаје писма): фонт без слова твоје књиге не може да их прикаже, зато тражи онај који покрива њено писмо.\n\nФонтови из Још фонтова раде на исти начин и не требају рачунар.\n\nЗа оштрији мали текст на е-мастило панелу, додај --hinting light команди: прилагођава слова мрежи пиксела, као што су направљени подразумевани фонтови. Без тога слова се исцртавају како их је фонт осмислио; --hinting normal и --hinting mono прилагођавају их јаче. Фонтове са ознакама, као арапски или деванагари, најбоље је оставити без тога."
