reader.plugin.name = Читач
reader.plugin.description = Приказује књиге страницу по страницу, са садржајем и подешавањима читања.
reader.plugin.how = "Читач приказује књиге страницу по страницу. Отвори књигу из библиотеке; последња књига може да се поново отвори при покретању (подешавање Отвори последњу књигу при покретању).\n\nДодирни лево или десно на екрану, или користи дугмад за листање, да окрећеш странице. Додирни средину или притисни Изабери за мени читања: Садржај, Претрага, Иди на страницу, Фонт и распоред, Обележивачи и истицања и више. Надоле од горње ивице отвара брзи панел, нагоре од доње ивице води на почетни екран; тако ради и држање Назад.\n\nДржи Изабери (или држи слику) да видиш слику преко целог екрана: Лево и Десно корачају кроз слике странице. Изабери увећава на 2x, 3x и назад (двоструки додир на додир екрану); увећано, Лево и Десно померају у страну, дугмад за листање (или превлачења) иду даље преко и надоле. Назад враћа на прилагођено, затим на страницу (држи да изађеш на додир екрану). Додирни горњи десни угао за обележивач. Држи реч да је истакнеш. Са дугмадима, држи Лево: Лево и Десно крећу по реч, дугмад за листање по ред, њихово држање иде на ивице странице и по пасус; Изабери отвара траку за истицање за реч, држање Изабери проширује на реченицу и пасус (тада Лево и Десно померају крај, њихово држање почетак). Избор се наставља преко окретања страница. Извези као Markdown чува твоје белешке."
