calendar.plugin.name = Календар
calendar.plugin.description = Твоји календари на читачу: приказ распореда, дана, недеље и месеца из CalDAV-а, iCal-а и датотека, рођендани из контаката, виџети за почетни екран и екран спавања.
calendar.plugin.how = "Календари на читачу: распоред наредних дана, дан, недеља и месец, са догађајима CalDAV календара (Nextcloud, Radicale, Baïkal, Fastmail и др.), iCal адреса (.ics, webcal://), датотека календара на картици и рођенданима и годишњицама контаката (CardDAV). Читач календаре само чита, не мења их.\n\nОтвори Календар из менија алата. Први ред именује приказ; изабери га, држи било који ред или притисни Мени да пређеш на Распоред, Дан, Недељу, Месец или Рођендане, додаш календар или синхронизујеш. У Дану и Недељи прва два реда (и дугмад за листање) иду дан или недељу назад или напред; у Месецу стрелице мењају дан, дугмад за листање месец, а Изабери отвара дан. Изабери на догађају приказује све: када, где, календар и понављање. Назад враћа корак.\n\nКалендар додај под Календари (у менију или Календар у подешавањима). Врсте: CalDAV налог (довољна је адреса сервера, нпр. cloud.example.com/remote.php/dav; сваки календар са догађајима улази у приказ), iCal адреса (календар објављен као .ics), датотека на картици или контакти (CardDAV адресар: рођендани и годишњице из њега). Унеси адресу, за налог корисничко име и лозинку (најбоље лозинку апликације; чува се уз лозинке читача) и име. Сваки календар има промењиву ознаку (тачка, прстен, сива тачка или квадрат) да их разликујеш; до шест календара.\n\nПонављајући догађаји (дневни, недељни, месечни, годишњи, са данима у недељи, бројем понављања, крајњим датумом и изостављеним данима), целодневни и они у другим временским зонама приказују се по сату читача. Читач чува догађаје 60 дана уназад и унапред од данас, највише 240, и приказује их без мреже. Догађај са нечитљивим правилом приказује се једном.\n\nКалендари се читају кад отвориш Календар (највише на пет минута), на Синхронизуј сада и, како подесиш под Календар у подешавањима, кад је мрежа ионако укључена или кад почне пуњење. Радио се због тога укључује само на Синхронизуј сада.\n\nВиџети почетног екрана (држи га, па додај виџет): Данас (датум и шта дан носи), Следећи догађај, Распоред (наредни дани), Месец (тачка испод дана са догађајима) и Рођендани (следећи рођендани). Додир на догађај или дан месеца отвара га. Екран спавања може приказати данашњи распоред: изабери Календар под Екран спавања у подешавањима."
