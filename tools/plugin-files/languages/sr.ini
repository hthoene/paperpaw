power.plugin.name = Напајање
power.plugin.description = Бира режим напајања, ручно или према батерији: Нормално, Штедња, Ван мреже.
power.plugin.how = "Напајање бира како PaperPaw троши батерију: Нормално, Штедња или Ван мреже. Штедња ради оно што може да сачека у бољим тренуцима; Ван мреже држи радио искљученим. Аутоматски бира према батерији.\n\nПромени режим у брзом панелу, где Напајање приказује режиме један поред другог, или у Подешавањима под Напајање. Тамо подешаваш и нивое на којима Аутоматски прелази на Штедњу и на Ван мреже, и да ли остаје Нормално током пуњења.\n\nУ статусним линијама Режим напајања приказује лист током штедње и прецртан Wi-Fi када је ван мреже, а у нормалном ништа.\n\nДржи дугме за напајање да отвориш мали мени: Спавање, Искључи (где PaperPaw може), Поново покрени, а на уређајима осетљивим на додир Закључај додир или Откључај додир. Кратак притисак и даље успављује уређај. Назад напушта мени."
