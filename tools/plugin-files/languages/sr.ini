picture-home.plugin.name = Почетни екран са сликом
picture-home.plugin.description = Почетни екран са твојом сопственом сликом иза виџета и статусном траком коју подешаваш.
picture-home.plugin.how = "Почетни екран са сликом замењује почетни екран док је укључен: твоја слика иза виџета и странице виџета и алата које уређујеш. Искључи га у менаџеру додатака и уграђени почетни екран се враћа, са својим страницама.\n\nСтави слике (JPEG, PNG или GIF) у фолдер на картици (подразумевано wallpapers), па изабери једну у Подешавања, Прилагођавање, Почетни екран са сликом. Прилагођавање каже како попуњава екран (попуни, цела слика, развуци, оригинална величина, поплочај), Положај који део остаје, Зум колико је велика, а Осветли слику колико је бледа: блеђа слика олакшава читање виџета. Слика се припрема једном за сваку величину екрана, што траје тренутак.\n\nВиџети стоје на подлогама преко слике. Уреди страницу као на уграђеном почетном екрану: оловком испод странице или Уреди почетни екран у менију.\n\nСтатусна трака (време, Wi-Fi, батерија, или шта изабереш) може бити укључена, искључена или аутоматска, при врху или при дну, пуне ширине или мали овал лево, у средини или десно, на светлој, тамној или сивој подлози или на самој слици. Ред који именује дугмад (на X4) такође може бити укључен, искључен или аутоматски. Аутоматски значи да га притисак на дугме приказује неколико секунди; тај притисак не ради ништа друго.\n\nИсцртавање слике одређује како се слика црта: Нијансе сиве у свим нијансама сиве које екран има (спорије на X4), Растерски у црно-белим тачкама (брзо), или Аутоматски, као на уграђеном почетном екрану: нијансе сиве када се екран исцрта, тачке после прве промене. Где екран нема нијансе сиве, нијансе сиве прелазе у тачке."
