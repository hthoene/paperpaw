menu-editor.plugin.name = Уређивач менија
menu-editor.plugin.description = Мења редослед, уклања и додаје ставке сваког менија.
menu-editor.plugin.how = "Уређивач менија мења шта менији садрже: помери ставке горе или доле, уклони их или додај нове.\n\nНађи га у Подешавањима под Прилагођавање, као Прилагоди меније. Изабери мени, па ставку да је преместиш или уклониш; Додај ставку убацује нову. Измене важе одмах. Ресетуј овај мени враћа мени на то како га дефинишу његови додаци, Ресетуј све меније то чини за сваки.\n\nНе можеш да се закључаш напоље: ставка која је пут до подешавања остаје док не додаш други пут до њих."
