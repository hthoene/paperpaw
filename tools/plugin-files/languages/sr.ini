files.plugin.name = Датотеке
files.plugin.description = Приказује књиге и фолдере на уређају и отвара их.
files.plugin.how = "Библиотека приказује књиге из твог фолдера библиотеке, сваку са корицама, насловом, аутором и колико је прочитана. Књига коју си последњу читао стоји на врху као картица, па наставак читања захтева један додир или један притисак на Изабери. Док библиотека тражи књиге, каже колико их је до сада пронашла.\n\nИзнад књига бираш шта се приказује: све, оне које читаш, непрочитане или прочитане, или полице (по аутору, серији, тагу, омиљене, следећа књига сваке започете серије). Додирни књигу да је читаш; држи је (са дугмадима држи Изабери) да је отвориш, означиш као прочитану или непрочитану, видиш њене информације, преместиш у архиву или обришеш. Додирни наслов за мени библиотеке: како се књиге сортирају и приказују, претрага, фолдер библиотеке и подешавања.\n\nФолдер библиотеке подешава се у Подешавањима, под Библиотека, као Фолдер библиотеке; тамо књиге можеш да прикажеш и као мрежу корица. За све остале датотеке користи Датотеке у менију Алати."
