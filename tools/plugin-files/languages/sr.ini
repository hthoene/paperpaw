menu.plugin.name = Мени
menu.plugin.description = Мени при дну екрана, са радњама и подешавањима.
menu.plugin.how = "Мени наводи шта можеш да радиш и подешаваш. Отвара се при дну екрана, изнад онога што је отворено: током читања додирни средину екрана или притисни Изабери. Додирни или изабери ставку да је извршиш.\n\nПодешавања у менију приказују своју вредност и мењају се на месту, па мени остаје отворен. Ставка са још ставки отвара подмени.\n\nПревуци надоле од горње ивице за брзи панел: оно што често мењаш, као дугмад. Додирни дугме да га пребациш, држи га за његова подешавања. Само са дугмадима, дугмад са стрелицама бирају, Изабери пребацује, а Назад затвара. Под Изглед, Менији приказује меније као листу или као плочице."
