notes-vault.plugin.name = Збирка белешки
notes-vault.plugin.description = Чита фолдер Markdown белешки по фолдерима, таговима и последњим изменама, са виџетима за почетни екран. Ради са Obsidian трезорима.
notes-vault.plugin.how = "Збирка белешки чита фолдер Markdown белешки (обичне .md датотеке, какве чувају апликације за белешке). Ради са Obsidian трезорима.\n\nИзабери фолдер збирке у подешавањима, или на страници збирке у алатима. Страница затим нуди фолдере какви су на картици, последње измењене белешке, тагове и претрагу по насловима белешки.\n\nПрви пут збирка се индексира у позадини док је њена страница отворена; збирка од хиљада белешки траје неколико минута, па се отвара одмах. Индекс се чува на картици и прави поново када се страница збирке отвори после неколико сати, или када изабереш Ажурирај.\n\nБелешка се отвара у читачу. Везе ка другим белешкама ([[Белешка]], [[Белешка|речи]], [[Белешка#Наслов]]) налазе се по имену белешке било где у збирци; праћење везе отвара ту белешку, а Назад враћа на претходну белешку.\n\nНишта у збирци се никад не мења. Виџети за почетни екран (последње белешке, закачена белешка, белешка дана, насумична белешка, тагови, претрага) додају се у уређивачу почетног екрана. Виџет може да узима белешке само из једног фолдера: упиши путању фолдера од корена картице (на пример Белешке/Посао) у подешавањима виџета; ако остане празно, узима све белешке збирке."
