help.setting.again.help = Савети сваког екрана приказују се још једном, када се следећи пут отвори.
help.again-done = Савети се приказују поново када се следећи пут отвори сваки екран.
home.plugin.name = Почетни екран
home.plugin.description = Почетна страница: странице са виџетима, као што су књига која се чита и алати.
home.plugin.how = "Почетни екран се састоји од страница, свака је мрежа виџета и алата као на телефону. У почетку су сат, књига коју читаш и недавно читане књиге на једној страници, а сви алати на следећој.\n\nДодирни ставку да је отвориш, а превуци или користи дугмад за листање да промениш страницу. Само са дугмадима, дугмад са стрелицама прелазе са једне ставке на следећу, а Изабери је отвара.\n\nДа га преуредиш, држи почетни екран, додирни оловку испод странице или изабери Уреди почетни екран у менију. Превуци ставке да их преместиш или додирни једну за њене опције, и са дугмадима. Ту је и Додај виџет. Колоне и Редови налазе се у подешавањима, под Изглед, у одељку Почетни екран.\n\nНа екрану окренутом на страну, почетни екран приказује исте ставке са више колона, свака страница се попуни пре следеће, а картице нису шире од око 110 mm; ништа што је уређено усправно не мења се. Уреди га на страни и тај распоред се за ту оријентацију чува посебно: нови виџети се додају у обе. Ресетуј водоравни распоред у Додај (током уређивања) враћа на изведени. Уклањање виџета или алата у једној оријентацији не уклања га из друге."
