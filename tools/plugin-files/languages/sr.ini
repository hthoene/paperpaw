tasks.plugin.name = Задаци
tasks.plugin.description = Листе обавеза са роковима и приоритетима, на читачу или синхронизоване са твојим CalDAV сервером, са виџетима за почетни екран.
tasks.plugin.how = "Листе обавеза на твом читачу: задаци са роком и приоритетом, штиклирани када су готови. Раде без подешавања и без мреже, а могу да се држе усклађеним са CalDAV сервером (Nextcloud, Radicale, Baïkal, Fastmail и други), па су исте листе на твом телефону и рачунару.\n\nОтвори Задатке из менија алата. Први ред именује приказану листу; изабери га за другу листу, за Данас и закаснеле са свих листа, за нову листу, да синхронизујеш или да подесиш налог. Додај задатак отвара тастатуру. Изабери на задатку га штиклира (поново: није готово). Држи задатак или притисни Мени да му промениш наслов, рок (данас, сутра, за недељу дана или датум који укуцаш, као 24.12.2026) или приоритет, или да га уклониш. Отворени задаци су први, по дану, па по приоритету; готови остају на крају недељу дана (подешава се под Задаци у подешавањима), па напуштају читач.\n\nВиџети за почетни екран (држи почетни екран, па додај виџет): Задаци данас приказује шта је данас на реду или касни, Листа задатака приказује једну листу, Отворени задаци их броји, а Следећи задатак приказује онај који је следећи на реду. Додир на задатак у виџету га штиклира; додир на наслов отвара листе.\n\nДа синхронизујеш, изабери CalDAV налог у реду листе и унеси адресу сервера, своје корисничко име и лозинку (најбоље лозинку апликације). Довољна је адреса сервера, нпр. cloud.example.com/remote.php/dav; читач одатле налази твоје листе задатака. Свака листа задатака са сервера постаје листа на читачу. Читач синхронизује када отвориш Задатке, када изабереш Синхронизуј сада и када је мрежа ионако укључена; оно што промениш без мреже чека и шаље се касније. Ако је задатак у међувремену измењен и на читачу и негде другде, узима се верзија сервера, а твоја остаје као нови задатак поред ње, да ништа не нестане. Белешке, подсетници и све остало што задатак има на серверу остаје непромењено. Задаци који се понављају се приказују, али се мењају тамо где си их направио. Читач прима до 200 задатака у 12 листа."
