dictionary.plugin.name = Речник
dictionary.plugin.description = Тражи речи у StarDict речницима.
dictionary.plugin.how = "Речник тражи реч из књиге у StarDict речницима и приказује дефиниције у панелу преко доњег дела екрана.\n\nУ читачу држи реч и изабери Потражи; са дугмадима користи Изабери текст под Више. Копирај фолдере речника (са .ifo, .idx и .dict датотекама) у фолдер „dictionaries“ на уређају, подфолдери су дозвољени, или изабери други фолдер у Подешавањима, под Читање, као Фолдер речника (напредно подешавање). Прво тражење припрема мали индекс за сваки речник, што траје тренутак.\n\nУ панелу дугмад за листање или Горе и Доле померају дугачке дефиниције, а Назад га затвара. Додиром изван њега затвараш га."
