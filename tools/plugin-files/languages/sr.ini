update.dual-boot.help = PaperPaw дели овај уређај са другим фирмвером, па овде не инсталира ажурирања. Ажурирај PaperPaw алатом којим си ово поставио. Нема другог фирмвера на овом уређају? Реци то дугметом испод, или поново флешуј PaperPaw преко USB-а на paperpaw.org/flash.
