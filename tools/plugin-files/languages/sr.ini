mail.plugin.name = Е-пошта
mail.plugin.description = Чита и шаље е-пошту са лозинком или лозинком апликације (IMAP и SMTP), без пријаве у прегледачу.
mail.plugin.how = "Е-пошта чита и шаље е-пошту преко IMAP-а и SMTP-а. Пријављује се твојом адресом и лозинком, без пријаве у прегледачу, па ради са сваким провајдером који то дозвољава.\n\nПодеси налог у Подешавањима, Е-пошта. Изабери свог провајдера, унеси своју адресу и лозинку. Већина провајдера тражи лозинку апликације: направи је у безбедносним подешавањима свог налога и користи је овде. Твоја уобичајена лозинка често не ради, а никад не иде никуда осим на сервер твог провајдера. Чува се уз лозинке и кључеве.\n\nОтвори Е-пошту у алатима. Провери пошту преузима најновије поруке и фолдере. Поруке се чувају на картици, па можеш да их читаш без мреже. Уређај се повеже, преузме и прекине везу, па је Wi-Fi укључен само накратко.\n\nАко твог провајдера нема на листи, изабери Сопствени сервери и подеси имена сервера, портове и безбедност под напредним подешавањима. Сервер за чији сертификат не јамчи ниједан ауторитет једном пита да ли му верујеш; упореди отисак са оним који приказује твој провајдер.\n\nПорука са приложеном књигом (EPUB, PDF и слично, до 2 MB) испод себе има Отвори књигу: преузима датотеку, ставља је у твоју библиотеку и отвара је.\n\nДа видиш нову пошту без отварања Е-поште, укључи Проверавај нову пошту у позадини под Подешавања, Е-пошта, и изабери колико често (сваких 15, 30 или 60 минута). Искључено је док не укључиш. Читач се тада с времена на време безбедно повезује док је будан и на мрежи, један налог за другим, и ажурира број непрочитаних на почетном екрану. Троши мало батерије. Отварање Е-поште зауставља проверу која је у току.\n\nВиџети почетног екрана приказују број непрочитаних порука, најновије и означене поруке, једно сандуче и пречицу за писање поруке."
