about.plugin.name = О програму
about.plugin.description = Верзија и лиценце PaperPaw-а.
about.plugin.how = "О програму показује коју верзију PaperPaw-а имаш, где је његов изворни код и под којим лиценцама се дистрибуира.\n\nНалази се на крају Подешавања, као О програму PaperPaw. Изабери ред дугмадима са стрелицама и Изабери, или га додирни. Наведени су и додаци уграђени у фирмвер и, на уређајима који учитавају додатке са кодом, отисак за који такви додаци морају бити направљени.\n\nЛиценце се отварају као текст у читачу, па листаш као кроз књигу. Садржи лиценцу самог PaperPaw-а и лиценце фонтова, иконица и образаца за растављање речи који долазе уз њега. Додаци могу да додају свој ред, на пример аутора теме."
