settings.plugin.name = Подешавања
settings.plugin.description = Странице подешавања, састављене од подешавања сваког додатка.
settings.plugin.how = "Подешавања приказују све што може да се подеси у PaperPaw-у и његовим додацима, по страницама. Додацима није потребан сопствени екран: оно што пријаве појављује се овде, у групама, са описом сваког подешавања испод њега.\n\nОтвори их са Подешавања у менију. Додирни групу да је отвориш, па подешавање да га пребациш или изабереш; бројеви имају дугмад − и +. Са дугмадима, пређи на подешавање и притисни Изабери: лево и десно мењају број, Изабери га задржава, Назад враћа претходну вредност.\n\nИзмене важе одмах. Претрага налази подешавање по речима, а Напредна подешавања додају она која су ретко потребна. Врати на подразумевано и Ресетуј све прво питају."
