keys.plugin.name = Дугмад и покрети
keys.plugin.description = Шта ради свако дугме, зона додира и превлачење, мењано на уређају.
keys.plugin.how = "Дугмад и покрети показује шта ради свако дугме, зона додира и превлачење, и омогућава да то промениш на уређају.\n\nОтвори га у подешавањима, под Уређај. Прво изабери где се измена примењује: Свуда, Током читања, На почетном екрану, У библиотеци или у једном алату. Затим изабери улаз, као што је држано дугме или превлачење унутра од ивице, и изабери радњу са листе, која може да се претражује. Стандардно враћа оно што одређују додаци и распоред дугмади.\n\nНа X4 се одбија измена после које не би остало дугме за избор, повратак или кретање даље. Ресетуј дугмад и покрете на крају поништава сваку измену."
