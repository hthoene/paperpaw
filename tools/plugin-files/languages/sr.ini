wifi.plugin.name = Wi-Fi
wifi.plugin.description = Повезује се на Wi-Fi мреже када је потребно и после искључује радио.
wifi.plugin.how = "Wi-Fi се повезује на мрежу када додатку треба интернет (каталог, синхронизација, продавница, пренос) и поново искључује радио минут након што га ништа не користи, или одмах када се прикаже Почетна или књига, ради штедње батерије и меморије.\n\nОтвори Wi-Fi из Подешавања, или преко ставке Wi-Fi у статусној линији. Мреже наводи оне у домету; изабери једну и укуцај њену лозинку, или изабери Подеси помоћу телефона и укуцај име и лозинку у прегледачу свог телефона уместо на уређају. Заборави уклања сачувану мрежу.\n\nЛозинке остају на картици, безбедно сачуване, и никад се више не приказују. Под Повежи се када је потребно подешаваш колико дуго Wi-Fi остаје укључен после последње употребе, да ли остаје укључен током пуњења и која сачувана мрежа је прва када је у домету више њих."
