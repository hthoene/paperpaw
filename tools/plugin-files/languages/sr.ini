anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Учи картице из Anki-ја на твом рачунару које су на реду и шаље твоје одговоре назад, преко додатка AnkiConnect.
anki.plugin.how = "Anki ти омогућава да на читачу учиш картице које су у Anki-ју на твом рачунару на реду и шаље твоје одговоре назад. Користи бесплатан додатак AnkiConnect (код додатка 2055492159) и никад AnkiWeb. У почетку је искључен: додај га из продавнице додатака.\n\nНа рачунару: инсталирај AnkiConnect у Anki-ју (Алати, Додаци, Преузми додатке) и поново покрени Anki. Anki мора бити отворен док синхронизујеш.\n\nПодразумевано AnkiConnect одговара само рачунару на којем ради (127.0.0.1), па читач не може да допре до њега. Отвори Алати, Додаци, AnkiConnect, Конфигурација и постави „webBindAddress“ на „0.0.0.0“ (слуша на кућној мрежи). Порт, „webBindPort“, је 8765 осим ако га не промениш. Ако тамо поставиш „apiKey“, унеси исти кључ овде. Поново покрени Anki после промене конфигурације и дозволи Anki кроз заштитни зид рачунара ако пита. Користи ово само на мрежи којој верујеш: свако на њој може да допре до AnkiConnect-а, па је кључ добра идеја.\n\nНа читачу: отвори Anki из Алата, затим унеси адресу рачунара (на пример 192.168.1.20) под Рачунар, порт ако није 8765 и API кључ ако си га поставио. Изабери Шпил или остави празно за све шпилове. Затим изабери Синхронизуј са Anki-јем, са укљученим Wi-Fi-јем: прво се шаљу твоји одговори који чекају, па се преузимају картице на реду (и онолико нових колико је подешено), највише 50. Изабери Учи да их прођеш без мреже: прикажи одговор и оцени га са Поново, Тешко, Добро или Лако. Твоји одговори се чувају на читачу, и без Wi-Fi-ја, и одлазе у Anki при следећој синхронизацији. Anki одлучује када се картица враћа: картица оцењена са Поново преузима се поново при некој каснијој синхронизацији када Anki јави да је на реду.\n\nСинхронизуј при отварању Anki-ја, у подешавањима, синхронизује сваки пут када отвориш екран. Ништа не користи мрежу када притиснеш тастер."
