widgets.plugin.name = Пакет виџета
widgets.plugin.description = Још много виџета за почетни екран: сатови, календар, цитати, књиге, белешке и више.
widgets.plugin.how = "Пакет виџета додаје много виџета за почетни екран: сатове (аналогни, речима, плочице, светски), календар, годину до сада, одбројавање, месечеву фазу, и дан и датум; цитат дана, белешке, обавезе, слике, поздрав и PaperPaw логотип; а за књиге, шта се сада чита, напредак, следеће на реду, серију, омиљене, истицање и библиотеку у бројевима. Ту је и виџет батерије.\n\nДодај их са Уреди почетни екран у менију (или дугим притиском на почетни екран), па Додај виџет. Сваки има сопствена подешавања, као што су оквир, величина и поравнање. Избор виџета који се мења, као цитат дана, приказује следећи. Твоји цитати иду у quotes.txt у .paperpaw/plugins/widgets на картици, сваки ред као текст | аутор. Виџетима за време потребан је подешен сат; Wi-Fi га подешава."
