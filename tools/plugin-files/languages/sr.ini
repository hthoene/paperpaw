plugin-manager.plugin.name = Менаџер додатака
plugin-manager.plugin.description = Наводи додатке и укључује и искључује их.
plugin-manager.plugin.how = "Менаџер додатака наводи сваки додатак са његовом верзијом и описом и укључује и искључује додатке.\n\nНалази се у Подешавањима, као Управљање додацима. Подешавања додатака је посебна страница за поставке као што је мрежна употреба сваког додатка. Додирни додатак да га укључиш или искључиш (са дугмадима га изабери). Промена важи после поновног покретања: трака при дну тада нуди Поново покрени сада. Држи додатак (са дугмадима држи Изабери) да прочиташ како функционише.\n\nДодатак означен са Увек укључено не може да се искључи, а онај означен са Потребно тек када други додатак преузме његов посао, иначе PaperPaw не би имао пут назад. Под Екрани бираш који додатак приказује место које нуди више њих."
