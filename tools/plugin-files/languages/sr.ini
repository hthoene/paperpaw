update.plugin.name = Ажурирање
update.plugin.description = Инсталира ажурирања фирмвера, са картице или преузета са интернета.
update.plugin.how = "Ажурирање инсталира нови фирмвер, на уређајима где је PaperPaw фирмвер, као што је X4. Налази се у подешавањима, као Ажурирање.\n\nПотражи на мрежи пита сервер за ажурирања за новији PaperPaw и преузима га, што траје неколико минута преко Wi-Fi-ја. Или копирај датотеку ажурирања (са завршетком .bin, са paperpaw.org) у фолдер updates на картици, на пример помоћу Wi-Fi преноса. Инсталирај тада траје око минут и уређај се поново покреће; књиге, подешавања и места читања остају.\n\nУ Тражи ажурирања (у подешавањима, у почетку искључено) уређај сам пита отприлике једном недељно, само док је Wi-Fi ионако укључен или се пуни. Новији PaperPaw који пронађе чека овде; ништа не прекида твоје читање. Претрага шаље шта уређај покреће, без имена или броја уређаја; ради бројања уређаја и да ли си ти питао и да ли је то прва претрага у дану, недељи или месецу.\n\nАко додаци које користиш још немају верзију за ново издање, ажурирање чека на њих. Старија верзија се инсталира само ако је изабереш.\n\nОдавде може да се инсталира и други фирмвер, као што је CrossPoint: стави његову датотеку (са завршетком .bin) у фолдер updates и отвори Ажурирање. PaperPaw проверава да ли је то цео, неоштећен фирмвер за овај уређај, али не може да каже ко га је направио, јер није потписан. Ипак инсталирај га уписује у другу половину флеша, а уређај га покреће; PaperPaw остаје у својој половини док тај фирмвер не инсталира нешто преко ње. Да се касније вратиш на PaperPaw, инсталирај његову инсталациону датотеку (paperpaw-<уређај>-<верзија>-install.bin) из менија другог фирмвера, као што је CrossPoint-ово ажурирање фирмвера са SD картице."
