vocabulary.sd.readme = "Картице за учење из датотека\n\nСтави овде по једну датотеку за сваки шпил: Spanish.tsv прави шпил Spanish.\nДатотеке: .tsv, .csv или .txt, сачуване као UTF-8, или .apkg: Anki шпил, извезен са штиклираним Подржи старије Anki верзије. Прва три поља његових белешки постају предња страна, задња страна и пример; његов распоред учења и медији се не читају, а PaperPaw никад не уписује Anki датотеку.\n\nПо једна картица у сваком реду: предња страна, задња страна и пример (необавезно), раздвојени табулатором, зарезом или тачком и зарезом. Први ред може да именује колоне: front, back, example. Пример:\n\nKatze\tмачка\tDie Katze schläft.\n\nЗатим отвори Картице за учење на читачу, изабери Картице са SD картице, па Ажурирај шпилове са картице.\n\nДобро је знати:\n- Шпилови остају на читачу, са оним што је научено. Датотека се чита када је нова или измењена, а њене картице се додају шпилу или се тамо мењају.\n- Промени задњу страну или пример картице у датотеци: картица се мења и задржава твој напредак.\n- Промени текст предње стране картице: то се рачуна као нова картица, а стара почиње изнова. Картице се упарују по тексту предње стране, размаци и велика слова се не рачунају. Сачувај шпил у датотеку (Картице са SD картице, Сачувај шпил на картицу) и свака картица има број у колони id: промени тамо предњу страну, остави прва два реда датотеке како јесу, и картица задржава оно што је научено.\n- Чување уписује картице шпила. Оно што је било у датотеци а није картица (ред без предње стране) не чува се; датотека која је била ту копира се у _name.bak.tsv.\n- Сачувај датотеку као CSV UTF-8 (не UTF-16, не у сопственом формату табеларног програма). Датотека преко 4 MiB или 20.000 редова се не чита: подели је.\n- Ред који обришеш у датотеци не брише картицу у шпилу, осим ако за тај шпил укључиш Уклони картице које недостају. Тада картица одлази са оним што је научено.\n- Датотеке чије име почиње са _ не читају се.\n"
