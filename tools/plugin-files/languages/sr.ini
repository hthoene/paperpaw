battery.plugin.name = Потрошња батерије
battery.plugin.description = Бележи батерију и показује колико траје.
battery.plugin.how = "Потрошња батерије бележи напуњеност отприлике једном у минути док је уређај будан, заједно са оним што је радио: освежавања екрана и окренуте странице. Из тога израчунава колико троше сат будног рада и 100 страница и колико батерија траје тим темпом.\n\nОтвори Батерија из менија Алати. Приказује тренутну напуњеност, ово будно време, потрошњу на батерији до сада и твоја недавна будна времена. Листа се дугмадима за листање или додиром на стрелице при врху.\n\nПотребно је неко време читања на батерији да би бројеви нешто значили. Бележење је подразумевано укључено и може да се искључи у Подешавањима, под Уређај, Напајање, као Бележи потрошњу батерије."
