translate.plugin.description = Преводи изабрани текст на мрежи, помоћу DeepL-а.
translate.plugin.how = "Превод преводи изабрани текст на мрежи помоћу DeepL-а. Изабери текст у књизи и изабери Преведи у менију изабраног текста: превод се појављује преко странице као одредница у речнику. Дугмад за листање или додири га померају, а Изабери или додир на његовом крају га затвара.\n\nПотребна је мрежа и твој сопствени DeepL API кључ, бесплатан на deepl.com (DeepL API Free, око 500.000 знакова месечно). Док га не унесеш, панел то каже, а додир га тражи.\n\nУ подешавањима, под Читање, у одељку Превод, Преведи на одређује језик; у почетку је то језик PaperPaw-а."
