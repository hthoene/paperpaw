files.plugin.name = فائل براؤزر
files.plugin.description = ڈیوائس پر کتابوں اور فولڈرز کی فہرست دکھاتا ہے اور انہیں کھولتا ہے۔
files.plugin.how = "لائبریری آپ کے لائبریری فولڈر کی کتابیں دکھاتی ہے، ہر ایک کے سرورق، عنوان، مصنف اور اب تک کے مطالعے کے ساتھ۔ جو کتاب آپ نے آخر میں پڑھی وہ سب سے اوپر کارڈ کی صورت میں ہوتی ہے، اس لیے پڑھنا جاری رکھنے کے لیے ایک ٹیپ، یا منتخب کریں کا ایک دباؤ کافی ہے۔ لائبریری کتابیں ڈھونڈ رہی ہو تو بتاتی ہے کہ اب تک کتنی ملی ہیں۔\n\nکتابوں کے اوپر چنیں کہ کیا دکھایا جائے: تمام، زیرِ مطالعہ، ان پڑھی یا ختم شدہ کتابیں، یا شیلفیں (مصنف، سلسلے، ٹیگ، پسندیدہ کے لحاظ سے، اور شروع کیے ہوئے ہر سلسلے کی اگلی کتاب)۔ کتاب پڑھنے کے لیے اسے ٹیپ کریں؛ اسے دبائے رکھیں (بٹنوں کے ساتھ، منتخب کریں دبائے رکھیں) تاکہ اسے کھولیں، ختم شدہ یا ان پڑھی نشان زد کریں، اس کی معلومات دیکھیں، آرکائیو میں منتقل کریں یا حذف کریں۔ لائبریری مینو کے لیے عنوان کو ٹیپ کریں: کتابیں کیسے ترتیب دی اور دکھائی جائیں، تلاش، لائبریری فولڈر اور سیٹنگز۔\n\nلائبریری فولڈر سیٹنگز میں، لائبریری کے تحت، لائبریری فولڈر میں طے ہوتا ہے؛ وہیں کتابیں سرورقوں کی گرڈ کی صورت میں بھی دکھائی جا سکتی ہیں۔ باقی ہر فائل کے لیے ٹولز مینو میں فائلیں استعمال کریں۔"
