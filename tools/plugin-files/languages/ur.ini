update.plugin.name = اپ ڈیٹ
update.plugin.description = فرم ویئر اپ ڈیٹ انسٹال کرتا ہے، کارڈ سے یا انٹرنیٹ سے ڈاؤن لوڈ کر کے۔
update.plugin.how = "اپ ڈیٹ نیا فرم ویئر انسٹال کرتا ہے، ان ڈیوائسز پر جہاں PaperPaw خود فرم ویئر ہے، جیسے X4۔ یہ آپ کو سیٹنگز میں اپ ڈیٹ کے نام سے ملے گا۔\n\nآن لائن تلاش کریں اپ ڈیٹ سرور سے نئے PaperPaw کے بارے میں پوچھتا ہے اور اسے ڈاؤن لوڈ کرتا ہے، جس میں Wi-Fi پر چند منٹ لگتے ہیں۔ یا اپ ڈیٹ فائل (جو .bin پر ختم ہو، paperpaw.org سے) کارڈ پر updates فولڈر میں کاپی کریں، مثلاً Wi-Fi ٹرانسفر سے۔ پھر انسٹال میں تقریباً ایک منٹ لگتا ہے اور ڈیوائس ری اسٹارٹ ہو جاتی ہے؛ کتابیں، سیٹنگز اور پڑھنے کے مقام برقرار رہتے ہیں۔\n\nاپ ڈیٹ کی جانچ (سیٹنگز میں، شروع میں بند) آن ہو تو ڈیوائس تقریباً ہفتے میں ایک بار خود پوچھتی ہے، صرف تب جب Wi-Fi پہلے سے آن ہو یا وہ چارج ہو رہی ہو۔ جو نیا PaperPaw ملے وہ یہاں انتظار کرتا ہے؛ آپ کے مطالعے میں کوئی خلل نہیں پڑتا۔ تلاش میں یہ بھیجا جاتا ہے کہ ڈیوائس پر کیا چل رہا ہے، ڈیوائس کا کوئی نام یا نمبر نہیں؛ ڈیوائسز گننے کے لیے یہ بھی کہ آپ نے خود پوچھا تھا یا نہیں اور یہ دن، ہفتے یا مہینے کی اس کی پہلی تلاش ہے یا نہیں۔\n\nاگر آپ کے استعمال کے پلگ اِنز کا نئے ورژن کے لیے ابھی کوئی ورژن نہیں، تو اپ ڈیٹ ان کا انتظار کرتا ہے۔ پرانا ورژن صرف تب انسٹال ہوتا ہے جب آپ اسے چنیں۔\n\nدوسرا فرم ویئر، جیسے CrossPoint، بھی یہاں سے انسٹال ہو جاتا ہے: اس کی فائل (جو .bin پر ختم ہو) updates فولڈر میں رکھیں اور اپ ڈیٹ کھولیں۔ PaperPaw جانچتا ہے کہ یہ اس ڈیوائس کے لیے مکمل، بغیر نقصان کا فرم ویئر ہے، لیکن یہ نہیں بتا سکتا کہ اسے کس نے بنایا، کیونکہ اس پر دستخط نہیں ہوتے۔ پھر بھی انسٹال کریں اسے فلیش کے دوسرے حصے میں لکھتا ہے اور ڈیوائس اسے شروع کر دیتی ہے؛ PaperPaw اپنے حصے میں رہتا ہے جب تک وہ فرم ویئر اس کے اوپر کچھ انسٹال نہ کرے۔ بعد میں PaperPaw پر واپس جانے کے لیے اس کی انسٹال فائل (paperpaw-<device>-<version>-install.bin) دوسرے فرم ویئر کے مینو سے انسٹال کریں، جیسے CrossPoint کا SD فرم ویئر اپ ڈیٹ۔"
