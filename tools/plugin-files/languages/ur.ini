vocabulary.sd.readme = "فائلوں سے فلیش کارڈز\n\nہر ڈیک کے لیے یہاں ایک فائل رکھیں: Spanish.tsv سے ڈیک Spanish بنتا ہے۔\nفائلیں: .tsv، .csv یا .txt، جو UTF-8 میں محفوظ ہوں، یا .apkg: Anki ڈیک، جو پرانے Anki ورژنز کی معاونت پر نشان لگا کر برآمد کیا گیا ہو۔ اس کے نوٹس کے پہلے تین خانے سامنے، پیچھے اور مثال بنتے ہیں؛ اس کی شیڈولنگ اور میڈیا نہیں پڑھے جاتے، اور PaperPaw کبھی Anki فائل نہیں لکھتا۔\n\nہر لائن میں ایک کارڈ: سامنے، پیچھے اور مثال (اختیاری)، ٹیب، کاما یا سیمی کولن سے الگ۔ پہلی لائن کالموں کے نام بتا سکتی ہے: front, back, example۔ مثال:\n\nKatze\tcat\tDie Katze schläft.\n\nپھر ریڈر پر فلیش کارڈز کھولیں، SD کارڈ پر کارڈز چنیں اور پھر کارڈ سے ڈیکس اپ ڈیٹ کریں چنیں۔\n\nجاننا اچھا ہے:\n- ڈیکس ریڈر پر رہتے ہیں، آپ کی سیکھی ہوئی چیزوں کے ساتھ۔ فائل نئی یا تبدیل شدہ ہو تو پڑھی جاتی ہے، اور اس کے کارڈز ڈیک میں شامل یا وہاں تبدیل کیے جاتے ہیں۔\n- فائل میں کسی کارڈ کا پچھلا حصہ یا مثال بدلیں: کارڈ بدل جاتا ہے اور آپ کی پیش رفت برقرار رہتی ہے۔\n- کسی کارڈ کا سامنے کا متن بدلیں: یہ نیا کارڈ شمار ہوتا ہے، اور پرانا نئے سرے سے شروع ہوتا ہے۔ کارڈز سامنے کے متن سے پہچانے جاتے ہیں، خالی جگہیں اور بڑے چھوٹے حروف شمار نہیں ہوتے۔ ڈیک کو فائل میں محفوظ کریں (SD کارڈ پر کارڈز، ڈیک کو کارڈ پر محفوظ کریں) تو ہر کارڈ کا id کالم میں ایک نمبر ہوتا ہے: وہاں سامنے کا متن بدلیں، فائل کی پہلی دو لائنیں جیسی ہیں ویسی رکھیں، تو کارڈ اپنی سیکھی ہوئی چیزیں برقرار رکھتا ہے۔\n- محفوظ کرنے سے ڈیک کے کارڈز لکھے جاتے ہیں۔ جو فائل میں تھا اور کارڈ نہیں ہے (بغیر سامنے کے متن والی لائن) وہ محفوظ نہیں رہتا؛ پہلے سے موجود فائل _name.bak.tsv میں کاپی ہو جاتی ہے۔\n- فائل کو CSV UTF-8 کے طور پر محفوظ کریں (UTF-16 نہیں، اسپریڈ شیٹ کا اپنا فارمیٹ نہیں)۔ 4 MiB سے بڑی یا 20,000 لائنوں سے زیادہ کی فائل نہیں پڑھی جاتی: اسے تقسیم کریں۔\n- فائل میں حذف کی گئی لائن سے ڈیک کا کارڈ حذف نہیں ہوتا، جب تک آپ اس ڈیک کے لیے غائب کارڈز ہٹائیں آن نہ کریں۔ تب کارڈ سیکھی ہوئی چیزوں سمیت چلا جاتا ہے۔\n- جن فائلوں کے نام _ سے شروع ہوں وہ نہیں پڑھی جاتیں۔\n"
