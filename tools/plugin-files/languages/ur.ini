vocabulary.sd.readme = "فائلوں سے فلیش کارڈز\n\nہر ڈیک کے لیے یہاں ایک فائل رکھیں: Spanish.tsv سے ڈیک Spanish بنتا ہے۔\nفائلیں: .tsv، .csv یا .txt، جو UTF-8 میں محفوظ ہوں، یا .apkg: Anki ڈیک، جو Support older Anki versions پر نشان لگا کر ایکسپورٹ کیا گیا ہو۔ اس کے نوٹس کے پہلے تین فیلڈ سامنے، پیچھے اور مثال بنتے ہیں؛ اس کی شیڈولنگ اور میڈیا نہیں پڑھے جاتے، اور PaperPaw کبھی Anki فائل نہیں لکھتا۔\n\nہر لائن میں ایک کارڈ: سامنے، پیچھے اور مثال (اختیاری)، جو ٹیب، کاما یا سیمی کولن سے الگ ہوں۔ پہلی لائن کالموں کے نام بتا سکتی ہے: front، back، example۔ مثال:\n\nKatze\tcat\tDie Katze schläft.\n\nپھر ریڈر پر فلیش کارڈز کھولیں، SD کارڈ پر کارڈز چنیں اور پھر کارڈ سے ڈیکس اپ ڈیٹ کریں۔\n\nجاننے کی باتیں:\n- ڈیکس ریڈر پر رہتے ہیں، آپ کی سیکھی ہوئی پیش رفت کے ساتھ۔ فائل تب پڑھی جاتی ہے جب وہ نئی ہو یا بدلی ہو، اور اس کے کارڈ ڈیک میں شامل ہوتے ہیں یا وہاں بدل جاتے ہیں۔\n- فائل میں کسی کارڈ کا پیچھے یا مثال بدلیں: کارڈ بدل جاتا ہے اور آپ کی پیش رفت برقرار رہتی ہے۔\n- کسی کارڈ کا سامنے کا متن بدلیں: وہ نیا کارڈ شمار ہوتا ہے، اور پرانا نئے سرے سے شروع ہوتا ہے۔ کارڈز کو ان کے سامنے کے متن سے ملایا جاتا ہے، خالی جگہیں اور بڑے چھوٹے حروف شمار نہیں ہوتے۔ ڈیک کو فائل میں محفوظ کریں (SD کارڈ پر کارڈز، ڈیک کارڈ پر محفوظ کریں) تو ہر کارڈ کا id کالم میں ایک نمبر ہوتا ہے: وہاں سامنے کا متن بدلیں، فائل کی پہلی دو لائنیں جیسی ہیں ویسی رہنے دیں، اور کارڈ اپنی پیش رفت برقرار رکھتا ہے۔\n- محفوظ کرنا ڈیک کے کارڈ لکھتا ہے۔ جو فائل میں تھا اور کارڈ نہیں ہے (سامنے کے بغیر لائن) وہ نہیں رہتا؛ پہلے سے موجود فائل _name.bak.tsv میں کاپی ہو جاتی ہے۔\n- فائل کو CSV UTF-8 کے طور پر محفوظ کریں (UTF-16 نہیں، اسپریڈ شیٹ کا اپنا فارمیٹ نہیں)۔ 4 MiB سے بڑی یا 20,000 لائنوں سے زیادہ کی فائل نہیں پڑھی جاتی: اسے تقسیم کریں۔\n- فائل میں جو لائن آپ حذف کریں وہ ڈیک کا کارڈ حذف نہیں کرتی، جب تک آپ اس ڈیک کے لیے گمشدہ کارڈ ہٹائیں آن نہ کریں۔ پھر کارڈ پیش رفت سمیت چلا جاتا ہے۔\n- جن فائلوں کے نام _ سے شروع ہوں وہ نہیں پڑھی جاتیں۔\n"
