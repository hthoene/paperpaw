rules.plugin.name = Правілы
rules.plugin.description = Калі нешта адбываецца, робіць нешта: напрыклад, начны рэжым у 22:00.
rules.plugin.how = "Правіла само нешта робіць, калі нешта адбываецца: начны рэжым штодня ў 22:00 або сінхранізацыя каталогаў пры запуску PaperPaw.\n\nПравілы знаходзяцца ў наладах у раздзеле «Падладзіць» як «Правілы». «Дадаць правіла» пытае «Калі?» (запуск PaperPaw, час сутак, адкрыццё або закрыццё кнігі, акумулятар, зарадка, пераключальнік і іншае) і «Што тады?» (выканаць дзеянне, уключыць або выключыць пераключальнік, задаць лік, паказаць паведамленне). Націсні правіла, каб прыпыніць яго; утрымай яго (на кнопках — утрымай «Выбраць») для ўмовы, напрыклад «Паміж двума часамі сутак», або каб прыбраць.\n\nДзеянні, пераключальнікі і лікі для выбару прыходзяць па плагінах: абяры плагін, потым тое, што ён прапануе; «Назад» зноў выходзіць з яго. Дзеянне, якое працуе на паказаным экране, напрыклад «Назад» або «Наступная старонка», робіць тое, што зрабіла б пры націсканні там.\n\nЧас дзейнічае, які б экран ні быў адкрыты. Два правілы, якія адмяняюць адно аднаго, спыняюцца пасля некалькіх крокаў."
