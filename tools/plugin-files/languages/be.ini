reading-goal.plugin.name = Мэта чытання
reading-goal.plugin.description = Хвіліны для чытання на дзень і кот на галоўным экране, настрой якога залежыць ад сённяшняга чытання.
reading-goal.plugin.how = "Кот на тваім галоўным экране паказвае, як ідзе сённяшняе чытанне: сумны, пакуль ты яшчэ не чытаў, так сабе пасля нядоўгага чытання, задаволены ад паловы тваёй штодзённай мэты, шчаслівы, калі ты яе дасягнуў.\n\nДадай віджэт «Кот-чытач» на галоўны экран (утрымай галоўны экран, потым дадай віджэт) або выберы «Кот сённяшняга чытання» як экран сну. Дотык да ката адкрывае штодзённую мэту; гэта мэта статыстыкі чытання, якая лічыць хвіліны, што ты чытаеш.\n\nУ наладах, у раздзеле «Чытанне», «Задаволены з» і «Шчаслівы з» задаюць, з якой долі мэты кот задаволены або шчаслівы, а «Свае відарысы» — папку з відарысамі (сумны, так сабе, задаволены і шчаслівы) для паказу замест катоў. Відарысы — файлы PNG або JPEG; калі папкі няма, паказваюцца каты."
