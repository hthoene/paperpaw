update.dual-boot.help = PaperPaw дзеліць гэтую прыладу з іншай прашыўкай, таму тут абнаўленняў не ўсталёўвае. Абнаўляй PaperPaw інструментам, якім ты гэта наладзіў. На прыладзе няма другой прашыўкі? Скажы пра гэта кнопкай ніжэй або перапрашый PaperPaw па USB на paperpaw.org/flash.
