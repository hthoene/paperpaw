file-manager.plugin.name = Файлавы менеджар
file-manager.plugin.description = Кожная папка і файл на прыладзе: адкрываць, пераймяноўваць, перамяшчаць, капіяваць і выдаляць.
file-manager.plugin.how = "«Файлы» паказваюць кожную папку і файл у сховішчы прылады, а не толькі твае кнігі, і дазваляюць адкрываць, пераймяноўваць, перамяшчаць, капіяваць і выдаляць іх, а таксама ствараць новыя папкі.\n\nАдкрый «Файлы» ў меню «Інструменты». Націсні папку, каб зайсці ў яе; «Назад» вядзе ў папку вышэй. Націсні файл або ўтрымай любы пункт (на кнопках — утрымай «Выбраць»), каб убачыць, што з ім можна рабіць. «Перамясціць» і «Капіяваць» запамінаюць пункт: перайдзі ў папку, куды ён павінен трапіць, і выберы «Уставіць сюды» на панэлі ўнізе. На кнопках, каб дайсці да панэлі, націскай «Уніз» ад апошняга пункта.\n\nФайлы і папкі, назвы якіх пачынаюцца з кропкі, напрыклад уласныя даныя PaperPaw, схаваныя. Каб іх убачыць, уключы «Схаваныя файлы» ў наладах, у раздзеле «Бібліятэка»."
