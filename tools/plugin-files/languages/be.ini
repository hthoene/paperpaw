keys.plugin.name = Кнопкі і жэсты
keys.plugin.description = Што робіць кожная кнопка, зона дотыку і правядзенне; змяняецца на самой прыладзе.
keys.plugin.how = "«Кнопкі і жэсты» паказвае, што робіць кожная кнопка, зона дотыку і правядзенне, і дазваляе змяніць гэта на самой прыладзе.\n\nАдкрый яго ў наладах, у раздзеле «Прылада». Спачатку выберы, дзе дзейнічае змена: «Усюды», «Падчас чытання», «На галоўным экране», «У бібліятэцы» або ў адным інструменце. Потым абяры ўвод, напрыклад утрыманую кнопку або правядзенне ад краю, і выберы дзеянне са спісу, у якім можна шукаць. «Стандартна» вяртае тое, што задаюць плагіны і раскладка кнопак.\n\nНа X4 змена, пасля якой не застанецца кнопкі для выбару, вяртання назад або руху далей, адхіляецца. «Скінуць кнопкі і жэсты» ў канцы адмяняе ўсе змены."
