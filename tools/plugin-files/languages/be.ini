opds.plugin.name = Каталогі OPDS
opds.plugin.description = Праглядае каталогі OPDS, спампоўвае іх кнігі і падтрымлівае ў адпаведнасці з імі папкі.
opds.plugin.how = "Каталогі OPDS — гэта анлайн-бібліятэкі, напрыклад Project Gutenberg, Calibre-Web, Kavita або Komga. Гэты плагін праглядае іх і шукае ў іх, як у папках, і спампоўвае іх кнігі ў бібліятэку.\n\nАдкрый «Каталогі» ў меню «Інструменты» і выберы «Дадаць каталог»: адрас і, калі каталогу патрэбен уліковы запіс, імя карыстальніка і пароль. Націсні каталог, каб праглядзець яго; утрымай яго (на кнопках — утрымай «Выбраць»), каб сінхранізаваць, змяніць або прыбраць.\n\nКалі ўключана «Сінхранізаваць гэты каталог», «Сінхранізаваць каталогі» спампоўвае яго новыя кнігі ў яго папку. «Кніг за сінхранізацыю» абмяжоўвае, колькі атрымлівае адна сінхранізацыя, каб вялікі каталог не запоўніў прыладу. Замест каталога працуе «Воблачная папка (WebDAV)»."
