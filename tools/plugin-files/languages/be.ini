mail.plugin.name = Пошта
mail.plugin.description = Чытае і адпраўляе электронную пошту з паролем або паролем праграмы (IMAP і SMTP), без уваходу праз браўзер.
mail.plugin.how = "«Пошта» чытае і адпраўляе электронную пошту праз IMAP і SMTP. Яна ўваходзіць з тваім адрасам і паролем, без уваходу праз браўзер, таму працуе з любым правайдарам, які гэта дазваляе.\n\nНаладзь уліковы запіс у «Налады», «Пошта». Выберы свайго правайдара, увядзі адрас і пароль. Большасць правайдараў патрабуюць пароль праграмы: стварыце яго ў наладах бяспекі свайго ўліковага запісу і выкарыстай тут. Звычайны пароль часта не падыходзіць, і ён ніколі нікуды не трапляе, акрамя сервера твайго правайдара. Ён захоўваецца разам з паролямі і ключамі.\n\nАдкрый «Пошту» ў інструментах. «Праверыць пошту» атрымлівае апошнія лісты і папкі. Лісты захоўваюцца на карце, таму іх можна чытаць без сеткі. Прылада злучаецца, атрымлівае і адключаецца, таму Wi-Fi уключаны толькі на кароткі момант.\n\nКалі твайго правайдара няма ў спісе, выберы «Свае серверы» і задай назвы сервераў, парты і бяспеку ў дадатковых наладах. Сервер, сертыфікат якога ніхто не пацвярджае, адзін раз пытае, ці давяраць яму; параўнай адбітак з тым, што паказвае твой правайдар.\n\nУ ліста з далучанай кнігай (EPUB, PDF і падобнае, да 2 МБ) пад ім ёсць «Адкрыць кнігу»: яна атрымлівае файл, кладзе яго ў тваю бібліятэку і адкрывае.\n\nКаб бачыць новую пошту, не адкрываючы «Пошту», уключы «Правяраць новую пошту ў фоне» ў «Налады», «Пошта» і выберы, як часта (кожныя 15, 30 або 60 хвілін). Да ўключэння яна выключана. Чытанка тады час ад часу злучаецца па абароненым злучэнні, пакуль не спіць і ёсць сетка, адзін уліковы запіс за другім, і абнаўляе колькасць непрачытаных на галоўным экране. Гэта расходуе трохі акумулятара. Адкрыццё «Пошты» спыняе праверку, якая ідзе.\n\nВіджэты галоўнага экрана паказваюць колькасць непрачытаных, апошнія і лісты з зоркай, адну паштовую скрыню і ярлык для напісання ліста."
