files.plugin.name = Агляд файлаў
files.plugin.description = Паказвае кнігі і папкі на прыладзе і адкрывае іх.
files.plugin.how = "«Бібліятэка» паказвае кнігі з тваёй папкі бібліятэкі, кожную з вокладкай, назвай, аўтарам і тым, наколькі ты яе прачытаў. Кніга, якую ты чытаў апошняй, стаіць зверху карткай, таму працяг чытання — адзін дотык або адно націсканне «Выбраць». Пакуль бібліятэка шукае кнігі, яна паказвае, колькі іх ужо знайшла.\n\nНад кнігамі выберы, што паказваць: усе, тыя, што ты чытаеш, непрачытаныя або дачытаныя, або паліцы (па аўтарах, серыях, тэгах, абранае, наступная кніга кожнай пачатай серыі). Націсні кнігу, каб чытаць; утрымай яе (на кнопках — утрымай «Выбраць»), каб адкрыць, пазначыць дачытанай або непрачытанай, убачыць звесткі пра яе, перамясціць у архіў або выдаліць. Націсні назву, каб адкрыць меню бібліятэкі: як сартуюцца і паказваюцца кнігі, пошук, папка бібліятэкі і налады.\n\nПапка бібліятэкі задаецца ў наладах, у раздзеле «Бібліятэка», як «Папка бібліятэкі»; там жа можна паказваць кнігі сеткай вокладак. Для ўсіх іншых файлаў скарыстайся «Файламі» ў меню «Інструменты»."
