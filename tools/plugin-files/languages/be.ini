end-of-book.plugin.how = Калі ты даходзіш да апошняй старонкі кнігі, экран прапануе наступную кнігу яе серыі (або бібліятэку), дазваляе паставіць кнізе ад адной да пяці зорак і паказвае, ці пазначана яна як дачытаная. Націсні «Назад», каб вярнуцца на апошнюю старонку.
