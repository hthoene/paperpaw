picture-home.plugin.name = Галоўны экран з малюнкам
picture-home.plugin.description = Галоўны экран з тваім уласным малюнкам за віджэтамі і наладжвальным радком стану.
picture-home.plugin.how = "«Галоўны экран з малюнкам» замяняе галоўны экран, пакуль уключаны: твой уласны малюнак за віджэтамі і старонкі віджэтаў і інструментаў, якія ты пабудаваў. Выключы яго ў кіраванні плагінамі, і вернецца ўбудаваны галоўны экран са сваімі старонкамі.\n\nПалажы малюнкі (JPEG, PNG або GIF) у папку на карце (стандартна wallpapers), потым выберы адзін у «Налады», «Падладзіць», «Галоўны экран з малюнкам». «Падгонка» кажа, як ён запаўняе экран (запоўніць, увесь малюнак, расцягнуць, арыгінальны памер, плітка), «Пазіцыя» — якая частка застаецца, «Маштаб» — наколькі вялікі, а «Асвятліць малюнак» — наколькі бледны: бледнейшы малюнак палягчае чытанне віджэтаў. Малюнак падрыхтоўваецца адзін раз для кожнага памеру экрана, на гэта трэба імгненне.\n\nВіджэты стаяць на падкладках над малюнкам. Перабудоўвай старонку, як на ўбудаваным галоўным экране: аловак пад старонкай або «Змяніць галоўны экран» у меню.\n\nРадок стану (час, Wi-Fi, акумулятар або тое, што ты абярэш) можа быць уключаны, выключаны або аўтаматычны, уверсе або ўнізе, на ўсю шырыню або маленькай таблеткай злева, пасярэдзіне ці справа, на светлай, цёмнай або шэрай падкладцы або проста на малюнку. Радок з назвамі кнопак (на X4) таксама можа быць уключаны, выключаны або аўтаматычны. «Аўтаматычна» азначае, што націсканне кнопкі паказвае іх на некалькі секунд; гэта націсканне больш нічога не робіць.\n\n«Рэндэрынг малюнка» кажа, як малюецца малюнак: «Адценні шэрага» — у кожным адценні шэрага, якое ёсць у экрана (павольней на X4), «Растравы» — чорна-белымі кропкамі (хутка) або «Аўтаматычна», як на ўбудаваным галоўным экране: адценні шэрага, калі экран малюецца, кропкі пасля першай змены. Там, дзе ў экрана няма адценняў шэрага, замест іх выкарыстоўваюцца кропкі."
