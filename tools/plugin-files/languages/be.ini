reader.plugin.name = Чытанне
reader.plugin.description = Паказвае кнігі па старонках, са зместам і наладамі чытання.
reader.plugin.how = "Чытанне паказвае кнігі па старонках. Адкрый кнігу з бібліятэкі; апошняя кніга можа адкрывацца пры запуску (налада «Адкрываць апошнюю кнігу пры запуску»).\n\nНацісні злева або справа на экране або скарыстайся кнопкамі старонак, каб гартаць. Націсні сярэдзіну або кнопку «Выбраць», каб адкрыць меню чытання: «Змест», «Пошук», «Перайсці на старонку», «Шрыфт і макет», «Закладкі і вылучэнні» і іншае. Уніз ад верхняга краю адкрывае хуткую панэль, уверх ад ніжняга краю вядзе на галоўны экран; тое самае робіць утрыманне «Назад».\n\nУтрымай «Выбраць» (або ўтрымай відарыс), каб убачыць відарыс на ўвесь экран: «Улева» і «Управа» пераходзяць па відарысах старонкі. «Выбраць» павялічвае ў 2 разы, у 3 разы і назад (двайны дотык на сэнсарным экране); пры павелічэнні «Улева» і «Управа» перасоўваюць убок, кнопкі старонак (або правядзенні) — далей па гарызанталі і вертыкалі. «Назад» вяртае да падгонкі, потым да старонкі (для выхаду на сэнсарным экране ўтрымай). Дакраніся да верхняга правага кута, каб паставіць закладку. Утрымай слова, каб вылучыць яго. На кнопках утрымай «Улева»: «Улева» і «Управа» перамяшчаюць па словах, кнопкі старонак — па радках, утрыманне іх ідзе да канцоў старонкі і па абзацах; «Выбраць» адкрывае панэль вылучэння для слова, утрыманне «Выбраць» пашырае яго да сказа і абзаца (потым «Улева» і «Управа» перасоўваюць канец, утрыманне іх — пачатак). Вылучэнне працягваецца пры гартанні старонак. «Экспарт як Markdown» захоўвае твае нататкі."
