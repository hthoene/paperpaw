vocabulary.sd.readme = "Картачкі з файлаў\n\nПакладзі сюды файл для кожнай калоды: Spanish.tsv стварае калоду Spanish.\nФайлы: .tsv, .csv або .txt, захаваныя як UTF-8, або .apkg: калода Anki, экспартаваная з адзначанай «Падтрымка старэйшых версій Anki». Першыя тры палі яе нататак становяцца пярэднім бокам, адваротным бокам і прыкладам; яе планаванне і медыя не чытаюцца, а PaperPaw ніколі не запісвае файл Anki.\n\nАдна картка ў кожным радку: перад, адваротны бок і прыклад (неабавязкова), падзеленыя табуляцыяй, коскай або кропкай з коскай. Першы радок можа называць слупкі: front, back, example. Прыклад:\n\nKatze\tкошка\tDie Katze schläft.\n\nПотым адкрый «Картачкі» на чытанцы, выберы «Карткі на SD-карце», а затым «Абнавіць калоды з карты».\n\nКарысна ведаць:\n- Калоды застаюцца на чытанцы з тым, што ты вывучыў. Файл чытаецца, калі ён новы або зменены, і яго карткі дадаюцца ў калоду або змяняюцца ў ёй.\n- Змяні адваротны бок або прыклад карткі ў файле: картка зменіцца і захавае твой прагрэс.\n- Змяні тэкст пярэдняга боку карткі: яна будзе лічыцца новай карткай, а старая пачынае нанова. Карткі супастаўляюцца па тэксце пярэдняга боку, прабелы і вялікія літары не ўлічваюцца. Захавай калоду ў файл («Карткі на SD-карце», «Захаваць калоду на карту»), і кожная картка атрымае нумар у слупку id: змяні там перад, пакінь першыя два радкі файла як ёсць, і картка захавае вывучанае.\n- Захаванне запісвае карткі калоды. Тое, што было ў файле і не з'яўляецца карткай (радок без пярэдняга боку), не захоўваецца; файл, што быў там, капіруецца ў _name.bak.tsv.\n- Захавай файл як CSV UTF-8 (не UTF-16, не ўласны фармат электроннай табліцы). Файл болей за 4 МіБ або 20 000 радкоў не чытаецца: раздзялі яго.\n- Радок, які ты выдаліў у файле, не выдаляе картку ў калодзе, калі толькі ты не ўключыш для гэтай калоды «Выдаляць адсутныя карткі». Тады картка знікае разам з вывучаным.\n- Файлы, назвы якіх пачынаюцца з _, не чытаюцца.\n"
