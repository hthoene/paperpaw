anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Вывучае карткі Anki, якія трэба паўтарыць, на тваім камп'ютары і адпраўляе адказы назад праз дадатак AnkiConnect.
anki.plugin.how = "«Anki» дазваляе вывучаць на чытанцы карткі, якія трэба паўтарыць у Anki на тваім камп'ютары, і адпраўляе твае адказы назад. Ён карыстаецца бясплатным дадаткам AnkiConnect (код дадатка 2055492159) і ніколі не звяртаецца да AnkiWeb. Спачатку ён выключаны: дадай яго з крамы плагінаў.\n\nНа камп'ютары: усталюй AnkiConnect у Anki (Інструменты, Дадаткі, Атрымаць дадаткі) і перазапусці Anki. Падчас сінхранізацыі Anki павінен быць адкрыты.\n\nСтандартна AnkiConnect адказвае толькі таму камп'ютару, на якім працуе (127.0.0.1), таму чытанка да яго не дастае. Адкрый Інструменты, Дадаткі, AnkiConnect, Канфігурацыя і ўстаў «webBindAddress» значэнне «0.0.0.0» (слухаць хатнюю сетку). Порт, «webBindPort», роўны 8765, пакуль ты яго не зменіш. Калі ты там задаў «apiKey», увядзі тут той самы ключ. Пасля змены канфігурацыі перазапусці Anki і дазволь Anki ў брандмаўэры камп'ютара, калі ён спытае. Карыстайся гэтым толькі ў сетцы, якой давяраеш: любы ў ёй можа дастаць да AnkiConnect, таму ключ — добрая думка.\n\nНа чытанцы: адкрый Anki ў «Інструментах», потым увядзі адрас камп'ютара (напрыклад 192.168.1.20) у полі «Камп'ютар», порт, калі ён не 8765, і ключ API, калі ты яго задаў. Выберы калоду або пакінь пустым для ўсіх калод. Затым выберы «Сінхранізаваць з Anki» пры ўключаным Wi-Fi: спачатку адпраўляюцца твае адказы, што чакаюць, потым атрымліваюцца карткі, якія трэба паўтарыць (і столькі новых, колькі ты задаў), не больш за 50. Выберы «Вывучаць», каб прайсці іх без сеткі: паказаць адказ і ацаніць яго як «Яшчэ раз», «Цяжка», «Добра» або «Лёгка». Твае адказы захоўваюцца на чытанцы, і без Wi-Fi таксама, і пойдуць у Anki з наступнай сінхранізацыяй. Anki вырашае, калі картка вернецца: картка, на якую ты адказаў «Яшчэ раз», будзе атрымана зноў пры пазнейшай сінхранізацыі, як толькі Anki скажа, што яе пара паўтарыць.\n\n«Сінхранізаваць пры адкрыцці Anki» ў наладах сінхранізуе кожны раз, калі ты адкрываеш экран. Націсканне кнопкі ніколі не выкарыстоўвае сетку."
