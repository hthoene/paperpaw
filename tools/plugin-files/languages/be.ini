fonts-browser.plugin.name = Яшчэ шрыфты
fonts-browser.plugin.description = Паказвае шрыфты з інтэрнэту, кожны з узорам, і спампоўвае іх для чытання.
fonts-browser.plugin.how = "«Яшчэ шрыфты» паказвае шрыфты з бібліятэкі шрыфтоў у інтэрнэце, кожную назву ў яе ўласным шрыфце, і спампоўвае тыя, якімі ты хочаш чытаць.\n\nЗнойдзеш яго ў канцы спісу шрыфтоў, дзе выбіраецца шрыфт чытання, у наладах, у раздзеле «Чытанне», у пункце «Шрыфт»; у радкоў стану такі ж пункт для іх шрыфта. Націсні шрыфт (на кнопках — «Выбраць»), каб убачыць яго буйней з узорам сказа, потым выберы «Спампаваць». Старонку можна пакінуць, пакуль ідзе спампоўка. Калі скончыцца, выберы «Чытаць шрыфтом (назва шрыфта)» або «Выкарыстоўваць для радкоў стану». «Абнавіць» атрымлівае новую версію, «Выдаліць» выдаляе шрыфт з прылады.\n\nПатрэбны Wi-Fi.\n\nУЛАСНЫЯ ШРЫФТЫ\n\nПобач з «Яшчэ шрыфты» ў тым жа спісе ёсць «Уласныя шрыфты», якія паказваюць гэтую частку даведкі. Уласны шрыфт — гэта файл .ttf або .otf, напрыклад з Google Fonts.\n\nНа Android і іншых прыладах, якія малююць файлы шрыфтоў: скапіруй файл у папку fonts (на Android: PaperPaw/fonts у агульным сховішчы), перазапусці PaperPaw і выберы шрыфт у наладах, у раздзеле «Чытанне», у пункце «Шрыфт».\n\nНа Xteink X4 і X4 Pro: гэтыя чытанкі чытаюць наборы шрыфтоў, а не файлы шрыфтоў, бо файлы шрыфтоў не змясціліся б у іх памяці. Стварай набор на камп'ютары праз paperpaw-fontgen, для кожнага наяўнага стылю (звычайны абавязковы):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nГэта стварае папку plugins/font-my-font. Скапіруй яе ў папку plugins на карце памяці, перазапусці і выберы My Font як «Шрыфт». Набор з аднаго стылю займае каля паловы мегабайта для лацінскіх літар; пропушчаныя стылі малююцца звычайным. Інструмент паведамляе, колькі з запатрабаваных літар ёсць у шрыфце (--chars latin,cyrillic,greek дадае пісьмовыя сістэмы): шрыфт без літар тваёй кнігі не можа іх паказаць, таму шукай такі, што ахоплівае яе пісьмо.\n\nШрыфты з «Яшчэ шрыфты» працуюць гэтак жа і не патрабуюць камп'ютара.\n\nКаб дробны тэкст на e-ink-панэлі быў выразнейшы, дадай да каманды --hinting light: гэта падганяе літары пад піксельную сетку, як зроблены стандартныя шрыфты. Без гэтага літары малююцца так, як іх задумаў дызайнер шрыфта; --hinting normal і --hinting mono падганяюць іх мацней. Шрыфты з дыякрытычнымі знакамі, напрыклад арабскія або дэванагары, лепш пакідаць без гэтага."
