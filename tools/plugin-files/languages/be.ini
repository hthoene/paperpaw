setup.end.help = Пакладзі кнігі ў папку «/books» на прыладзе з камп'ютара або адпраў іх па Wi-Fi з тэлефона ці камп'ютара («Інструменты», «Перадача па Wi-Fi»). Кнігі прыносяць таксама каталогі, а таксама Calibre, калі ён дададзены. Усё, што абрана тут, можна змяніць у наладах.
