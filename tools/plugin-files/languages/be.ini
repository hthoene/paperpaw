sleep.plugin.name = Экран сну
sleep.plugin.description = Паказвае кошку, якая спіць, вокладку кнігі, твае малюнкі або паведамленне, пакуль прылада спіць.
sleep.plugin.how = "«Экран сну» вызначае, што паказвае экран, пакуль прылада спіць. E-ink захоўвае малюнак без сілкавання.\n\nВыберы яго ў наладах, у раздзеле «Прылада», «Экран сну», у пункце «Паказваць»: кот, які спіць (стандартна), вокладка кнігі, мае малюнкі, лагатып і «Сплю», віджэты, старонка як ёсць або старонка з малюнкам. «Мае малюнкі» паказваюць файлы з папкі «Pictures» адзін за адным.\n\nБез вокладкі або малюнка паказваецца кот. Там, дзе экран сну малюе сама сістэма, гэтыя налады схаваныя.\n\nЭкран выключэння, «Паказваць пры выключэнні», малюецца адзін раз, калі прылада выключаецца, праз меню сілкавання або пасля часу «Выключыць пасля сну» (не тады, калі нізкі зарад акумулятара адрэзаў сілкаванне). Ён такі, як экран сну, калі ты не абярэш лагатып і «Выключана», ката, вокладку або мае малюнкі. Іншы плагін можа прапанаваць для яго экран.\n\nЭкраны запуску і перазапуску, «Паказваць пры запуску» і «Паказваць пры перазапуску», — уласныя ў прылады, калі іншы плагін не прапануе для іх экран. Плагіны пры запуску прылады яшчэ не працуюць: экран, абраны для запуску, малюецца загадзя, калі прылада выключаецца або перазапускаецца, і паказваецца пры наступным запуску. Экран, які не гатовы своечасова, або пашкоджаны малюнак саступаюць уласнаму экрану прылады; прылада ў любым выпадку выключаецца або перазапускаецца."
