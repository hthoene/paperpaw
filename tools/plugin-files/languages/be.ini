store.plugin.name = Крама плагінаў
store.plugin.description = Знаходзіць, усталёўвае, абнаўляе і выдаляе плагіны для гэтай прылады.
store.plugin.how = "«Крама плагінаў» знаходзіць у інтэрнэце плагіны для гэтай прылады і ўсталёўвае, абнаўляе і выдаляе іх. Адкрывай яе з «Інструментаў»; патрэбны Wi-Fi.\n\nНа пачатковай старонцы паказана тое, што рэкамендуе каталог, што новае або папулярнае цяпер, потым групы. Група пералічвае свае плагіны ў справядлівым змешаным парадку, які мяняецца штодня, каб кожны плагін быў заўважаны; можна сартаваць іх ад А да Я, па навізне або па апошнім абнаўленні і пераходзіць да літары ў доўгіх спісах. Адкрый адзін, каб убачыць яго старонку з памерам і памяццю, якую ён займае, потым выберы «Усталяваць», «Абнавіць» або «Выдаліць». «Абнавіць усе» абнаўляе кожны ўсталяваны плагін.\n\nПлагіны з кодам працуюць з поўным доступам да прылады: крама кажа пра гэта і спачатку пытае, і яны запускаюцца пасля перазапуску. Калі адзін з іх збоіць, PaperPaw запускаецца без плагінаў з кодам і называе, які менавіта. «Каталог плагінаў» вызначае, адкуль бярэцца спіс.\n\n«Плагіны супольнасці» ў «Налады», «Сістэма» пералічваюць таксама плагіны, якія іншыя апублікавалі на GitHub. Іх ніхто не правяраў: яны пазначаны «Неправерана», на старонцы плагіна з кодам паказаны ключ, якім ён падпісаны, і абнаўленне, падпісанае іншым ключом, не ўсталёўваецца.\n\n«Крыніцы», апошні радок пачатковай старонкі, дадае спісы плагінаў іншых па іх адрасе (https://…/plugins.json), паказвае адзін з іх замест спіса PaperPaw або выдаляе яго. Замест набору можна пакласці файл sources.txt з адным адрасам у кожным радку ў .paperpaw/plugins/store на карце: адрасы з'явяцца ў «Крыніцах» як новыя. PaperPaw не правярае крыніцу або яе плагіны, і прылада звяртаецца да сервера крыніцы. Крыніца падпісвае свой спіс; прылада запамінае ключ першага спіса, які чытае, і потым прымае толькі спісы і плагіны з кодам, падпісаныя гэтым ключом. Плагін атрымлівае абнаўленні толькі з той крыніцы, з якой быў усталяваны. Уласная бібліятэка PaperPaw заўсёды ёсць і не выдаляецца; выхад з крамы вяртае да яе."
