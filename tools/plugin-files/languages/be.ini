setup.plugin.name = Першапачатковая наладка
setup.plugin.description = Кароткі спіс важных налад пры першым запуску.
setup.plugin.how = "«Першапачатковая наладка» — кароткі экскурс па важных наладах, які паказваецца адзін раз, пры першым запуску PaperPaw. Кожная старонка пытае адно: напрыклад мову, кнопкі, памер тэксту, часавы пояс, Wi-Fi або некалькі плагінаў для дадавання, з разумным адказам, які ўжо абраны, таму «Далей» заўсёды падыходзіць. Крокі, якія гэтай прыладзе не патрэбны, прапускаюцца.\n\nНаціскай кнопкі або карыстайся кнопкамі «Уверх», «Уніз» і «Выбраць». «Прапусціць» на першай старонцы адразу выходзіць з наладкі. Апошняя старонка кажа, адкуль браць кнігі.\n\nКаб запусціць яе зноў, адкрый налады і выберы «Наладзіць PaperPaw». Усё, што абрана тут, можна пазней змяніць у наладах."
