aids.plugin.name = Дапамога ў чытанні
aids.plugin.description = Тлустыя пачаткі слоў, замена слоў, відарысы: тэкст такі, як табе трэба.
aids.plugin.how = "«Дапамога ў чытанні» змяняе выгляд тэксту кнігі падчас чытання. Дзейнічае для кожнай кнігі. Тлустыя пачаткі слоў і замена слоў спачатку выключаны.\n\nЗнойдзеш яе ў наладах, у раздзеле «Чытанне», у групе «Памочнікі чытання». «Тлустыя пачаткі слоў» набіраюць тлустым першую палову кожнага слова — некаторым так лягчэй сачыць за тэкстам. «Замена слоў» прымае пары, запісаныя як «тэл. = тэлефон; г.зн. = гэта значыць», падзеленыя кропкамі з коскай.\n\nЗамяняюцца толькі цэлыя словы, дакладна так, як ты іх напісаў, таму частка даўжэйшага слова ніколі не мяняецца. Сам файл кнігі не змяняецца.\n\nВідарысы ў кнігах можна паказваць (спачатку так), замяніць кароткім радком, напрыклад «[Відарыс: карабель у моры]», які бярэ апісанне відарыса, або прапускаць. Тады на старонцы больш месца для тэксту, і для непаказанага відарыса нічога не дэкадуецца, таму старонкі перагортваюцца хутчэй. Коміксы і іншыя кнігі з відарысаў не змяняюцца."
