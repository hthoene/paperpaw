diagnostics.plugin.name = Дыягностыка
diagnostics.plugin.description = Экран праверкі і пакрокавая праверка кожнай часткі прылады.
diagnostics.plugin.how = "«Дыягностыка» — гэта экран праверкі прылады: ён паказвае кожны ўзровень шэрага, які можа адлюстраваць панэль, чатыры блокі для праверкі кнопак і дотыку, а таксама лічыльнік старонак са шкалой прагрэсу для параўнання рэжымаў абнаўлення.\n\nУ экрана праверкі няма пункта меню. Ён — галоўны экран, толькі калі ніякі іншы плагін яго не прапануе, або калі ты выбіраеш яго ў кіраванні плагінамі ў раздзеле «Экраны» для месца «Галоўны экран».\n\n«Выбраць» адзначае блок у фокусе, а стрэлкі пераключаюцца паміж блокамі; пры дотыку націсні блок. Кнопкі старонак гартаюць старонкі праверкі. Утрымай «Выбраць» або палец на экране, каб пачаць нанова.\n\nПраверка прылады, у «Інструментах», калі PaperPaw — прашыўка прылады, па адной старонцы праходзіць кожную частку прылады: экран, кнопкі, дотык, падсветку, акумулятар, карту, гадзіннік, Wi-Fi, сон і памяць. Кожная старонка заканчваецца кнопкамі «Збой», «Прапусціць» і «Пройдзена»; абрана адказ, які падказваюць вымярэнні. Часткі, якіх у прыладзе няма, прапускаюцца. Пасля кожнага адказу ён запісвае справаздачу ў .paperpaw/plugins/diagnostics/device-check.txt, каб уставіць у pull request. «Назад» выходзіць з яе, і пры наступным адкрыцці яна працягваецца з таго ж месца. На прыладзе толькі з кнопкамі спачатку выберы «Пачаць» на старонцы кнопак; да таго стрэлкі, «Выбраць» і «Назад» працуюць, як на кожнай старонцы."
