weather.plugin.name = Надвор'е
weather.plugin.description = Надвор'е цяпер і на наступныя дні ў выглядзе віджэтаў, з Open-Meteo.
weather.plugin.how = "«Надвор'е» паказвае надвор'е цяпер і на наступныя дні ў выглядзе віджэтаў для галоўнага экрана, з Open-Meteo, якому не патрэбны ўліковы запіс або ключ. «Надвор'е цяпер» паказвае тэмпературу, стан і яшчэ нешта на выбар; «Прагноз» паказвае наступныя дні радком або спісам.\n\nСпачатку выберы месца: у наладах, у «Надвор'е», «Месца» (набяры назву, потым абяры са знойдзеных месцаў). Адпраўляюцца толькі яго каардынаты, і толькі пакуль паказваецца віджэт надвор'я. Віджэты дадаюцца праз змену галоўнага экрана.\n\nНадвор'е атрымліваецца не часцей, чым кажа «Абнаўляць не часцей за», і толькі пакуль ёсць сетка: яно ніколі само не ўключае Wi-Fi.\n\nДаныя пра надвор'е ад Open-Meteo.com (https://open-meteo.com) па ліцэнзіі Creative Commons Attribution 4.0 (CC BY 4.0)."
