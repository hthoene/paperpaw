stats.plugin.name = Статыстыка чытання
stats.plugin.description = Запісвае, як доўга і колькі ты чытаеш, з календаром і лічбамі кожнай кнігі.
stats.plugin.how = "«Статыстыка чытання» запісвае, як доўга ты чытаеш кожную старонку. Ты бачыш яе як агляд з сённяшнім днём, тыднем і серыяй, як каляндар і з лічбамі кожнай кнігі.\n\nАдкрый яе ў «Інструментах» або ў «Яшчэ» ў чытанні. У наладах, у «Статыстыка чытання», можна выключыць «Запісваць чытанне», задаць «Мэта на дзень» і «Найкарацейшая старонка» і «Найдаўжэйшая старонка», якія ўлічваюцца, каб гартанне або адкрытая кніга не скажалі лічбы.\n\n«Сінхранізацыя з KOReader» дзеліцца статыстыкай з KOReader праз папку WebDAV. Яна таксама ўлічвае статыстыку KOReader на той жа прыладзе. Для запісу трэба, каб гадзіннік быў наладжаны: калі не, адзін раз падключыся да Wi-Fi."
