lock.plugin.name = Блакіроўка экрана
lock.plugin.description = PIN-код, графічны ключ або пароль пры абуджэнні прылады; дотык блакіруецца падчас чытання.
lock.plugin.how = "Блакіроўка экрана просіць PIN-код, графічны ключ або пароль, калі PaperPaw запускаецца і калі прылада абуджаецца. Спачатку яна выключана. Яна абараняе толькі ад выпадковага карыстання: код і лічыльнік няўдалых спроб захоўваюцца на SD-карце, таму той, хто выцягне карту, адрэдагуе яе або падмяніць, абыдзе блакіроўку.\n\nНаладзь яе ў наладах, у раздзеле «Прылада», «Блакіроўка экрана»: увядзі бягучы код, калі ён ёсць, выберы тып, потым двойчы новы код. Графічны ключ прапануецца толькі на сэнсарных экранах.\n\nПасля пяці няўдалых спроб наступная чакае паўхвіліны. «Заблакіраваць зараз» блакіруе адразу і можа быць прызначана кнопцы, жэсту або правілу. «Блакіраваць пасля абуджэння» можна выключыць, каб блакіраваў толькі сапраўдны запуск (уключэнне або перазапуск), акрамя выпадкаў, калі кожнае абуджэнне — гэта запуск, як на X4 ад акумулятара.\n\nБлакіроўка дотыку побач: «Заблакіраваць дотык» у хуткай панэлі і меню чытання робіць так, што дотыкі, правядзенні і пяро нічога не робяць, а кнопкі працуюць, напрыклад каб чытаць, трымаючы руку на экране. Каб разблакіраваць, двойчы дакраніся адным пальцам і ўтрымай яго на момант; утрыманне кнопкі сілкавання адкрывае меню сілкавання, дзе «Разблакіраваць дотык» робіць гэта кнопкамі; на X4 Pro утрыманне кнопкі «Галоўная» разблакіроўвае адразу."
