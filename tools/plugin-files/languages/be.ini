notes-overview.plugin.name = Усе нататкі
notes-overview.plugin.description = Закладкі і вылучэнні ўсіх кніг у адным спісе і экспарт у My Clippings.txt.
notes-overview.plugin.how = "«Усе нататкі» паказваюць кожную кнігу, у якой ты зрабіў закладку або вылучэнне, і іх колькасць. Адкрый яго ў «Інструментах». Выберы кнігу, каб убачыць яе нататкі, а потым нататку, каб адкрыць кнігу ў гэтым месцы.\n\nУ канцы спісу «Экспарт як My Clippings.txt» запісвае ўсе нататкі ў адзін файл, у папку Exports побач з бібліятэкай, у форме, якую выкарыстоўвае Kindle (UTF-8). Праграмы, якія чытаюць My Clippings.txt з Kindle, могуць прачытаць і яго. Нататка да вылучэння — асобны запіс, як на Kindle. Бо ў кнізе тут няма пазіцый Kindle, «пазіцыя» — гэта наколькі далёка ў кнізе нататка, у працэнтах. Файл запісваецца нанова кожны раз; ён замяняе папярэдні."
