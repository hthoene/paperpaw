koreader.plugin.name = Агульныя вылучэнні
koreader.plugin.description = Дзеліцца закладкамі і вылучэннямі з KOReader для кніг, якія чытаюцца ў абедзвюх праграмах.
koreader.plugin.how = "Гэты плагін дзеліцца закладкамі і вылучэннямі з KOReader для кніг, якія ты чытаеш у абедзвюх праграмах, на адной прыладзе або ў папцы бібліятэкі, сінхранізаванай паміж прыладамі. Нічога наладжваць не трэба.\n\nКалі PaperPaw адкрывае кнігу, якую KOReader таксама адкрываў, і калі ты змяняеш яе закладкі або вылучэнні, ён пераймае новае з даных KOReader побач з кнігай, а тое, што новае тут, пакідае KOReader, каб той забраў гэта пры наступным адкрыцці кнігі. Выдаленыя пазнакі і змененыя нататкі пераходзяць таксама.\n\nЭта функцыя працуе толькі для кніг EPUB. Калі файл з аднаго боку нельга прачытаць, нічога не змяняецца ні з аднаго боку, пакуль не стане магчыма."
koreader.removed-there = У файле KOReader вылучэнняў больш няма. Выдаліць іх і тут?
koreader.removed-there.text = Іх маглі выдаліць у KOReader, або яго файл прыйшоў з іншай прылады. «Пакінуць» пакідае іх тут і зноў перадае KOReader.
