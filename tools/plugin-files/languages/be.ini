power.plugin.name = Сілкаванне
power.plugin.description = Выбірае рэжым сілкавання, уручную або па акумулятары: звычайны, эканомія, аўтаномны.
power.plugin.how = "«Сілкаванне» вызначае, як PaperPaw расходуе акумулятар: «Звычайны», «Эканомія» або «Аўтаномна». «Эканомія» робіць тое, што можа пачакаць, у лепшыя моманты; «Аўтаномна» трымае радыё выключаным. «Аўто» выбірае па акумулятары.\n\nЗмяні рэжым у хуткай панэлі, дзе «Сілкаванне» паказвае рэжымы побач, або ў наладах у «Сілкаванне». Там жа ты задаеш узроўні, пры якіх «Аўто» пераключаецца ў «Эканомію» і ў «Аўтаномна», і ці застаецца ён «Звычайным» падчас зарадкі.\n\nУ радках стану «Рэжым сілкавання» паказвае лісток пры эканоміі і перакрэслены Wi-Fi пры аўтаномным рэжыме, а ў звычайным нічога.\n\nУтрымай кнопку сілкавання, каб адкрыць маленькае меню: «Сон», «Выключыць» (дзе PaperPaw можа), «Перазапусціць», а на сэнсарных прыладах «Заблакіраваць дотык» або «Разблакіраваць дотык». Кароткае націсканне па-ранейшаму кладзе прыладу спаць. «Назад» выходзіць з меню."
