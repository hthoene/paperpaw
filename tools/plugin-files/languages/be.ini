transfer.plugin.name = Перадача
transfer.plugin.description = Кладзе кнігі і іншыя файлы на прыладу з браўзера ў той жа сетцы.
transfer.plugin.how = "«Перадача па Wi-Fi» кладзе кнігі і іншыя файлы на прыладу з браўзера ў той жа сетцы, без кабеля і праграмы. Таксама можна атрымліваць файлы, ствараць папкі і выдаляць.\n\nАдкрый яе з «Інструментаў». Экран паказвае адрас тэкстам і QR-кодам: адкрый яго ў браўзеры на тэлефоне ці камп'ютары або адскануй код. Адрас змяшчае ключ, які ствараецца нанова кожны раз, таму іншыя ў сетцы не змогуць дастаць да тваіх файлаў. Перадача працуе, пакуль экран адкрыты.\n\nТам, дзе PaperPaw сам запускае Wi-Fi, як на X4, «Без маршрутызатара» ўнізе адкрывае ўласную сетку прылады, да якой тэлефон падключаецца, скануючы код."
