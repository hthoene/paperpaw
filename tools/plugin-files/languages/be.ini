pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Таймер засяроджанасці з раундамі працы і перапынкамі, віджэтамі і лічыльнікам за дзень.
pomodoro.plugin.how = "Таймер Pomodoro: працуй засяроджанымі раундамі, потым адпачывай. Наладжваць нічога не трэба: 25 хвілін засяроджанасці, 5 адпачынку, а пасля чатырох раундаў доўгі перапынак на 15.\n\nАдкрый «Pomodoro» ў меню інструментаў і націсні «Пачаць» або дадай яго віджэты на галоўны экран (утрымай галоўны экран, потым дадай віджэт): «Таймер Pomodoro» паказвае фазу і хвіліны, што засталіся, «Pomodoro пачаць/паўза» — кнопка, а «Pomodoro сёння» лічыць завершаныя раунды з тваёй мэтай на дзень. Дотык да таймера запускае або спыняе яго; утрымай, каб адкрыць поўны экран.\n\nТаймер працягвае ісці, калі ты пакідаеш экран, і працягвае па гадзінніку пасля перазапуску. Пакуль чытанка спіць, нічога не ідзе: фаза, што скончылася за гэты час, паведамляецца пры абуджэнні. Паведамленне кажа, калі фаза скончылася. Каб эканоміць акумулятар, гадзіннік абнаўляецца раз на хвіліну (раз на дзесяць секунд у апошнюю хвіліну на поўным экране) і ніколі не трымае чытанку няспячай.\n\nУ наладах у «Pomodoro» ты задаеш працягласць і колькасць раундаў у наборы, а таксама ці пачынаецца наступная фаза сама. У «Яшчэ»: успышка экрана або міргненне падсветкі, калі фаза скончылася, і мэта на дзень."
