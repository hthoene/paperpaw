tasks.plugin.name = Задачы
tasks.plugin.description = Спісы спраў з тэрмінамі і прыярытэтамі на чытанцы або сінхранізаваныя з тваім серверам CalDAV, з віджэтамі галоўнага экрана.
tasks.plugin.how = "Спісы спраў на тваёй чытанцы: задачы з тэрмінам і прыярытэтам, якія адзначаюцца, калі зроблены. Яны працуюць без наладак і без сеткі і могуць сінхранізавацца з серверам CalDAV (Nextcloud, Radicale, Baïkal, Fastmail і іншыя), каб тыя ж спісы былі на тэлефоне і камп'ютары.\n\nАдкрый «Задачы» ў меню інструментаў. Першы радок называе паказаны спіс; выберы яго, каб перайсці да іншага спіса, да «Сёння і пратэрмінаваныя» па ўсіх спісах, да новага спіса, каб сінхранізаваць або задаць уліковы запіс. «Дадаць задачу» адкрывае клавіятуру. «Выбраць» на задачы адзначае яе зробленай (яшчэ раз: не зроблена). Утрымай задачу або націсні «Меню», каб змяніць яе назву, тэрмін (сёння, заўтра, праз тыдзень або дату, якую ты ўводзіш, напрыклад 2026-12-24) або прыярытэт, або каб прыбраць яе. Незробленыя задачы ідуць першымі, па дні, потым па прыярытэце; зробленыя застаюцца ў канцы тыдзень (задаецца ў наладах у «Задачы»), потым яны пакідаюць чытанку.\n\nВіджэты для галоўнага экрана (утрымай галоўны экран, потым дадай віджэт): «Задачы сёння» паказвае тое, што трэба зрабіць сёння або што пратэрмінавана, «Спіс задач» — адзін спіс, «Адкрытыя задачы» лічыць іх, а «Наступная задача» — тую, якую рабіць наступнай. Дотык да задачы ў віджэце адзначае яе; дотык да загалоўка адкрывае спісы.\n\nКаб сінхранізаваць, выберы «Уліковы запіс CalDAV» у радку спіса і ўвядзі адрас сервера, імя карыстальніка і пароль (лепш пароль праграмы). Хопіць адраса сервера, напрыклад cloud.example.com/remote.php/dav; адтуль чытанка знаходзіць твае спісы задач. Кожны спіс задач сервера становіцца спісам на чытанцы. Чытанка сінхранізуецца, калі ты адкрываеш «Задачы», калі выбіраеш «Сінхранізаваць зараз» і калі сетка і так уключана; тое, што ты змяніў без сеткі, чакае і адпраўляецца пазней. Калі задачу змянілі на чытанцы і тым часам яшчэ дзесьці, бярэцца версія сервера, а твая захоўваецца як новая задача побач, таму нічога не губляецца. Нататкі, будзільнікі і ўсё астатняе, што мае задача на серверы, застаюцца як ёсць. Задачы, што паўтараюцца, паказваюцца, але мяняюцца там, дзе ты іх стварыў. Чытанка трымае да 200 задач у 12 спісах."
