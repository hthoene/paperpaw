calibre.plugin.name = Бесправадная бібліятэка
calibre.plugin.description = Атрымлівае кнігі па сетцы. Працуе як бесправадная прылада для Calibre.
calibre.plugin.how = "«Бесправадная бібліятэка» дазваляе прыладзе з'яўляцца ў Calibre на тваім камп'ютары як бесправадная прылада. Тады Calibre можа адпраўляць на яе кнігі, паказваць іх спіс і выдаляць іх. Кнігі трапляюць у бібліятэку.\n\nАдкрый «Бесправадную бібліятэку» ў меню «Інструменты», калі прылада і камп'ютар у адной сетцы Wi-Fi. У Calibre выберы «Падключыць/падзяліцца», потым «Запусціць злучэнне з бесправаднымі прыладамі». Калі прылада знойдзе твой камп'ютар, яна пакажа яго назву; націсні «Падключыць» (на кнопках — «Выбраць»). Calibre можа тут дадаваць і выдаляць кнігі, таму падключайся толькі да ўласнага камп'ютара. Закрыццё экрана завяршае злучэнне.\n\nКалі Calibre не знаходзіцца сам, увядзі адрас яго камп'ютара ў наладах, у раздзеле «Бібліятэка», у частцы Calibre, у полі «Адрас». Калі Calibre карыстаецца портам, адрозным ад 9090, дадай яго як :порт, напрыклад 192.168.1.20:9091."
