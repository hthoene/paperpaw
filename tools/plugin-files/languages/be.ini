translate.plugin.description = Перакладае вылучаны тэкст у сетцы праз DeepL.
translate.plugin.how = "«Пераклад» перакладае вылучаны тэкст у сетцы праз DeepL. Вылучы тэкст у кнізе і выберы «Перакласці» ў меню вылучанага тэксту: пераклад з'явіцца над старонкай, як артыкул слоўніка. Кнопкі старонак або дотыкі пракручваюць яго, а «Выбраць» або дотык у яго канцы закрывае.\n\nПатрэбны сетка і ўласны ключ DeepL API, бясплатны на deepl.com (DeepL API Free, каля 500 000 сімвалаў у месяц). Пакуль ты яго не ўвёў, панэль кажа пра гэта, і дотык просіць увесці.\n\nУ наладах, у раздзеле «Чытанне», у групе «Пераклад» «Перакладаць на» задае мову; спачатку гэта мова PaperPaw."
