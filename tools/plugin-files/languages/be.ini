plugin-manager.plugin.name = Кіраванне плагінамі
plugin-manager.plugin.description = Пералічвае плагіны, уключае і выключае іх.
plugin-manager.plugin.how = "«Кіраванне плагінамі» пералічвае кожны плагін з версіяй і апісаннем, уключае і выключае плагіны.\n\nЗнойдзеш яго ў наладах як «Кіраванне плагінамі». «Налады плагінаў» — асобная старонка для параметраў, напрыклад выкарыстання сеткі кожным плагінам. Націсні плагін, каб уключыць або выключыць яго (на кнопках — выберы яго). Змена дзейнічае пасля перазапуску: панэль унізе тады прапануе «Перазапусціць зараз». Утрымай плагін (на кнопках — утрымай «Выбраць»), каб прачытаць, як ён працуе.\n\nПлагін з пазнакай «Заўсёды ўключаны» выключыць нельга, а з пазнакай «Патрэбны» — толькі калі іншы плагін выконвае яго працу, інакш у PaperPaw не было б шляху назад. У раздзеле «Экраны» ты выбіраеш, які плагін паказвае месца, якое прапануюць некалькі."
