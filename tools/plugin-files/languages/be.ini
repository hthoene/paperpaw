update.plugin.name = Абнаўленне
update.plugin.description = Усталёўвае абнаўленні прашыўкі з карты або спампаваныя з інтэрнэту.
update.plugin.how = "«Абнаўленне» ўсталёўвае новую прашыўку на прыладах, дзе PaperPaw — прашыўка, напрыклад на X4. Знойдзеш яго ў наладах як «Абнаўленне».\n\n«Шукаць у сетцы» пытае ў сервера абнаўленняў больш новы PaperPaw і спампоўвае яго, на гэта па Wi-Fi трэба некалькі хвілін. Або скапіруй файл абнаўлення (з пашырэннем .bin, з paperpaw.org) у папку updates на карце, напрыклад праз «Перадачу па Wi-Fi». «Усталяваць» тады займае каля хвіліны, і прылада перазапускаецца; кнігі, налады і месцы чытання застаюцца.\n\nПры ўключаным «Шукаць абнаўленні» (у наладах, спачатку выключана) прылада сама пытае прыкладна раз на тыдзень, толькі пакуль Wi-Fi і так уключаны або ідзе зарадка. Больш новы PaperPaw, які яна знойдзе, чакае тут; ніхто не перапыняе твайго чытання. Пошук адпраўляе тое, што працуе на прыладзе, без назвы або нумара прылады; для падліку прылад — таксама, ці ты пытаў сам і ці гэта першы пошук за дзень, тыдзень або месяц.\n\nКалі ў плагінаў, якімі ты карыстаешся, яшчэ няма версіі для новага выпуску, абнаўленне чакае іх. Больш старая версія ўсталёўваецца, толькі калі ты яе выбярэш.\n\nІншая прашыўка, напрыклад CrossPoint, таксама ўсталёўваецца адсюль: пакладзі яе файл (з пашырэннем .bin) у папку updates і адкрый «Абнаўленне». PaperPaw правярае, што гэта цэльная прашыўка для гэтай прылады, непашкоджаная, але не можа сказаць, хто яе зрабіў, бо яна не падпісана. «Усталяваць усё роўна» запісвае яе ў другую палову флэш-памяці, і прылада яе запускае; PaperPaw застаецца ў сваёй палове, пакуль гэтая прашыўка не ўсталюе нешта паверх яго. Каб вярнуцца да PaperPaw пазней, усталюй яго файл усталёўкі (paperpaw-<прылада>-<версія>-install.bin) з меню іншай прашыўкі, напрыклад з «SD firmware update» у CrossPoint."
