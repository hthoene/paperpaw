profiles.plugin.description = Названыя наборы налад чытання і экрана, якія пераключаюцца дотыкам.
profiles.plugin.how = "Профіль захоўвае пад назвай налады чытання, налады экрана і радкі стану, напрыклад «Ноч» або «Буйны шрыфт», і вяртае іх дотыкам.\n\nАдкрый «Профілі» ў меню чытання ў «Яшчэ» або ў наладах у «Падладзіць». Націсні профіль, каб выкарыстоўваць яго; той, што ў выкарыстанні, пазначаны. Утрымай яго (на кнопках — утрымай «Выбраць»), каб захаваць у яго бягучыя налады, перайменаваць або прыбраць. «Захаваць як новы профіль» захоўвае тое, што зададзена цяпер.\n\n«Наступны профіль» пераключае на наступны ў спісе; прызнач яго кнопцы або правілу."
