menu-editor.plugin.name = Рэдактар меню
menu-editor.plugin.description = Пераставіць, прыбраць і дадаць пункты ў кожным меню.
menu-editor.plugin.how = "Рэдактар меню змяняе, што ёсць у меню: перасоўвай пункты ўверх або ўніз, прыбірай іх або дадавай новыя.\n\nЗнойдзеш яго ў наладах у раздзеле «Падладзіць» як «Змяніць меню». Выберы меню, потым пункт, каб перамясціць або прыбраць яго; «Дадаць пункт» уставіць новы. Змены дзейнічаюць адразу. «Скінуць гэта меню» вяртае меню да таго, як яго вызначаюць плагіны, «Скінуць усе меню» робіць так для кожнага.\n\nЗаблакіраваць сябе нельга: пункт, які вядзе ў налады, застаецца, пакуль ты не дадасі іншы шлях да іх."
