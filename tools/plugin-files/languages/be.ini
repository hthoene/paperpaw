puzzles.plugin.name = Галаваломкі
puzzles.plugin.description = Судоку, крыжаванкі і шахматныя задачы, без сеткі, з галаваломкай дня.
puzzles.plugin.how = "Галаваломкі ў цягніку і ў чаканні, усе без сеткі: судоку, крыжаванкі і шахматныя задачы. Адкрый «Галаваломкі» ў меню інструментаў або дадай віджэт «Галаваломка дня» на галоўны экран (утрымай галоўны экран, потым дадай віджэт): ён паказвае, наколькі пройдзена сённяшняе судоку, а дотык адкрывае яго. Судоку дня на працягу дня адно і тое ж.\n\nСудоку: «Улева» і «Управа» перасоўваюць курсор клетка за клеткай, «Уверх» і «Уніз» (кнопкі старонак) — на радок. «Выбраць» адкрывае лічбы: абяры адну і націсні «Выбраць» яшчэ раз, каб паставіць, або «Ачысціць», каб спарожніць клетку. Утрымай «Выбраць» (або «Меню»), каб дайсці да кнопак пад полем: «Нататкі» робяць лічбы алоўкавымі пазнакамі, «Праверыць» пазначае няправільныя клеткі, «Адмяніць» вяртае апошні ход, «Новая» пачынае галаваломку выбранага ўзроўню (Лёгкі, Сярэдні, Цяжкі). У кожнай галаваломкі роўна адно рашэнне. Гульня захоўваецца, калі ты выходзіш. На сэнсарным экране дакраніся да клеткі.\n\nКрыжаванкі: пакладзі файлы .puz (Across Lite) або .ipuz у папку «puzzles» на карце памяці; у камплекце іх няма. Перамяшчайся па сетцы, потым выберы, каб на клавіятуры ўвесці слова пад курсорам (знак падкрэслівання пакідае клетку пустой). Кнопкі пераключаюць гарызанталь і вертыкаль, паказваюць спіс падказак, правяраюць літары і паказваюць слова. Літары захоўваюцца для кожнага файла. Зашыфраваныя файлы .puz адкрыць нельга.\n\nШахматныя задачы: невялікі набор з базы задач Lichess (CC0). «Улева» і «Управа» пераскокваюць з фігуры на фігуру, выберы фігуру, якую хочаш хадзіць, потым «Улева» і «Управа» па тым, куды яна можа пайсці, і зноў выберы. Няправільны ход вяртаецца. «Падказка» пазначае фігуру для ходу, «Далей» пераходзіць да наступнай задачы.\n\nПоле перамалёўвае толькі клеткі, якія змяняюцца. «Статыстыка» лічыць рашаныя галаваломкі."
