smart-home.plugin.name = Разумны дом
smart-home.plugin.description = Значэнні і пераключальнікі з твайго Home Assistant на панэлі і ў выглядзе віджэтаў галоўнага экрана. Працуе з Home Assistant у тваёй хатняй сетцы.
smart-home.plugin.how = "«Разумны дом» паказвае значэнні і пераключальнікі з твайго ўласнага Home Assistant: тэмпературу, вільготнасць, энергію, дзверы і вокны, святло, выключальнікі і сцэны. Ён размаўляе з тваім серверам праз яго REST API у хатняй сетцы; нічога не ідзе праз іншыя сэрвісы.\n\nАдкрый «Разумны дом» у меню інструментаў, потым «Злучэнне»: увядзі адрас свайго Home Assistant (напрыклад http://homeassistant.local:8123) і доўгатэрміновы токен доступу (створы яго ўнізе старонкі свайго профілю ў Home Assistant). Токен захоўваецца сярод пароляў і ключоў, ніколі не ў файле налад. Звычайны http выкарыстоўваецца толькі для адрасоў у тваёй хатняй сетцы; для сервера ў іншым месцы ўключы «Серверы па-за хатняй сеткай» у наладах і выкарыстоўвай https з дзеючым сертыфікатам.\n\n«Выбраць сутнасці» адкрывае спіс таго, што ёсць на тваім серверы: шукай па назве або ідэнтыфікатары і выберы сутнасць, каб паказаць яе (выберы яшчэ раз, каб прыбраць). Можна задаць ёй пакой, які групуе яе на панэлі і ў віджэтах пакояў. Захоўваецца да 24 сутнасцей. На панэлі выберы святло, выключальнік або сцэну, каб пераключыць яе: радок паказвае адказ сервера. Датчык, які ты выбіраеш, чытаецца зноў.\n\nВіджэты (утрымай галоўны экран, потым дадай віджэт): «Значэнне разумнага дома» паказвае адно паказанне буйна, «група» пералічвае сутнасці пакоя, «пераключальнік» — кнопка для аднаго святла або выключальніка, а «пакой» — картка з паказаннямі і пераключальнікамі пакоя. У наладах кожнага віджэта сказана, якую сутнасць або пакой ён паказвае.\n\nДом чытаецца, калі ты адкрываеш панэль, калі просіш (радок «Абнавіць» або дотык да віджэта значэння ці групы), калі чытанка абуджаецца там, дзе Wi-Fi ужо ўключаны, і па раскладзе, які ты задаў, пакуль падключана зарадка. Ён ніколі сам не ўключае радыё і ніколі не трымае яго ўключаным."
