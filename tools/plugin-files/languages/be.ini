menu.plugin.name = Меню
menu.plugin.description = Меню ўнізе экрана з дзеяннямі і наладамі.
menu.plugin.how = "Меню паказвае, што можна рабіць і наладжваць. Яно адкрываецца ўнізе экрана, над тым, што адкрыта: падчас чытання націсні сярэдзіну экрана або кнопку «Выбраць». Націсні пункт або выберы яго, каб выканаць.\n\nНалады ў меню паказваюць сваё значэнне і змяняюцца на месцы, таму меню застаецца адкрытым. Пункт з іншымі пунктамі адкрывае падменю.\n\nПравядзі пальцам уніз ад верхняга краю, каб адкрыць хуткую панэль: тое, што ты змяняеш часта, у выглядзе кнопак. Націсні кнопку, каб пераключыць, утрымай — для яе налад. Толькі з кнопкамі стрэлкі выбіраюць, «Выбраць» пераключае, а «Назад» закрывае. У раздзеле «Выгляд» пункт «Меню» паказвае меню спісам або пліткамі."
