notes-vault.plugin.name = Сховішча нататак
notes-vault.plugin.description = Чытае папку нататак Markdown па папках, тэгах і апошніх змінах, з віджэтамі для галоўнага экрана. Працуе з сховішчамі Obsidian.
notes-vault.plugin.how = "«Сховішча нататак» чытае папку нататак Markdown (простыя файлы .md, як іх захоўваюць праграмы для нататак). Працуе са сховішчамі Obsidian.\n\nВыберы папку сховішча ў наладах або на старонцы сховішча ў інструментах. Старонка тады прапануе папкі такімі, якія яны на карце, нататкі з апошнімі зменамі, тэгі і пошук у назвах нататак.\n\nПершы раз сховішча індэксуецца ў фоне, пакуль адкрыта яго старонка; сховішча з тысячамі нататак займае некалькі хвілін, потым адкрываецца адразу. Індэкс захоўваецца на карце і будуецца нанова, калі старонка сховішча адкрываецца праз некалькі гадзін або калі ты выбіраеш «Абнавіць».\n\nНататка адкрываецца ў чытанні. Спасылкі на іншыя нататкі ([[Нататка]], [[Нататка|словы]], [[Нататка#Загаловак]]) шукаюцца па назве нататкі ва ўсім сховішчы; пераход па спасылцы адкрывае тую нататку, а «Назад» вяртае да папярэдняй.\n\nНічога ў сховішчы ніколі не змяняецца. Віджэты для галоўнага экрана (нядаўнія нататкі, замацаваная нататка, нататка дня, выпадковая нататка, тэгі, пошук) дадаюцца ў рэдактары галоўнага экрана. Віджэт можа браць нататкі толькі з адной папкі: запішы шлях да папкі ад кораня карты (напрыклад Notes/Work) у наладах віджэта; калі пуста, ён бярэ ўсе нататкі сховішча."
