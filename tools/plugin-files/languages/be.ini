bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Спалучае пульты, клавіятуры і датчыкі і падключае іх.
bluetooth.plugin.how = "«Bluetooth» спалучае з чытанкай пульты, клавіятуры і датчыкі, калі ў яе ёсць Bluetooth (X4 Pro).\n\n«Дадаць прыладу» шукае тое, што побач; спачатку пераключы прыладу ў рэжым спалучэння. Выберы яе і пацвердзі на чытанцы (там, дзе паказваецца лічба, параўнай яе). Кнопкі пульта або клавіятуры потым гартаюць старонкі і перамяшчаюцца па меню; што робіць кожная кнопка, мяняецца ў раздзеле «Кіраванне».\n\n«Пульты» вызначаюць, калі іх кнопкі працуюць: калі ўключана тут, падчас чытання (злучаны, пакуль адкрыта кніга; эканоміць акумулятар) або заўсёды. Кнопка меню або доўгае націсканне на прыладзе забывае яе.\n\nДатчык — для плагінаў: уключы, які плагін можа ім карыстацца. Bluetooth выключаны, пакуль ім ніхто не карыстаецца."
