dictionary.plugin.name = Слоўнік
dictionary.plugin.description = Шукае словы ў слоўніках StarDict.
dictionary.plugin.how = "«Слоўнік» шукае слова з кнігі ў слоўніках StarDict і паказвае азначэнні ў панэлі над ніжняй часткай экрана.\n\nУ чытанні ўтрымай слова і выберы «Шукаць у слоўніку»; з кнопкамі скарыстайся «Вылучыць тэкст» у меню «Яшчэ». Скапіруй папкі слоўнікаў (з файламі .ifo, .idx і .dict) у папку «dictionaries» на прыладзе, падпапкі таксама падыдуць, або выберы іншую папку ў наладах, у раздзеле «Чытанне», у полі «Папка слоўнікаў» (дадатковая налада). Пры першым пошуку для кожнага слоўніка складаецца невялікі індэкс, на гэта трэба імгненне.\n\nУ панэлі кнопкі старонак або «Уверх» і «Уніз» пракручваюць доўгія азначэнні, а «Назад» закрывае яе. Пры дотыку націсні па-за ёй, каб закрыць."
