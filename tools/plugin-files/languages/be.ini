widgets.plugin.name = Набор віджэтаў
widgets.plugin.description = Шмат іншых віджэтаў для галоўнага экрана: гадзіннікі, каляндар, цытаты, кнігі, нататкі і іншае.
widgets.plugin.how = "«Набор віджэтаў» дадае шмат віджэтаў для галоўнага экрана: гадзіннікі (аналагавы, словамі, пліткамі, сусветны), каляндар, год на сённяшні дзень, зваротны адлік, фазу месяца, дзень і дату; цытату дня, нататкі, спісы спраў, малюнкі, прывітанне і лагатып PaperPaw; а для кніг — «Чытаю зараз», прагрэс, «Далей», серыю, абранае, вылучэнне і бібліятэку ў лічбах. Ёсць таксама віджэт акумулятара.\n\nДадавай іх праз «Змяніць галоўны экран» у меню (або доўгім націсканнем на галоўным экране), потым «Дадаць віджэт». У кожнага ёсць свае налады, напрыклад рамка, памер і выраўноўванне. Націск на віджэт, які змяняецца, напрыклад цытату дня, паказвае наступны. Свае цытаты кладзі ў quotes.txt у .paperpaw/plugins/widgets на карце, кожны радок у выглядзе «тэкст | аўтар». Віджэтам часу патрэбны наладжаны гадзіннік; яго ўсталёўвае Wi-Fi."
