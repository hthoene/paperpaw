news.plugin.name = Навіны
news.plugin.description = Атрымлівае навінавыя стужкі (RSS, Atom) як кнігі для чытання.
news.plugin.how = "«Навіны» ператвараюць стужкі RSS або Atom у кнігі. Кожная стужка становіцца адной кнігай у папцы «News» бібліятэкі, з яе найноўшымі артыкуламі простым тэкстам, якую можна чытаць, як любую іншую кнігу.\n\nАдкрый «Навіны» ў меню «Інструменты» і выберы «Дадаць стужку»; яе адрас ёсць на сайце газеты або блога. «Атрымаць навіны» атрымлівае ўсе стужкі і замяняе раней атрыманыя кнігі. Утрымай стужку (на кнопках — утрымай «Выбраць»), каб атрымаць або прыбраць толькі яе. Прыбраная стужка пакідае сваю кнігу ў бібліятэцы.\n\nДля атрымання патрэбна сетка. Налада «Артыкулаў на стужку» (Налады, Бібліятэка) вызначае, колькі артыкулаў у кожнай кнізе. Віджэт «Загалоўкі навін» паказвае іх на галоўным экране."
