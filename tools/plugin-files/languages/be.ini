about.plugin.name = Пра праграму
about.plugin.description = Версія PaperPaw і ліцэнзіі.
about.plugin.how = "«Пра праграму» паказвае, якая ў цябе версія PaperPaw, дзе яго зыходны код і на якіх ліцэнзіях ён распаўсюджваецца.\n\nЗнойдзеш яго ў канцы налад пад назвай «Пра PaperPaw». Выберы радок стрэлкамі і кнопкай «Выбраць» або дакраніся да яго. Убудаваныя ў прашыўку плагіны і, на прыладах, якія загружаюць плагіны з кодам, адбітак, для якога такія плагіны павінны быць створаны, таксама пералічаны.\n\n«Ліцэнзіі» адкрываюцца тэкстам у чытанні, таму іх можна гартаць як кнігу. У іх ліцэнзія самога PaperPaw і ліцэнзіі шрыфтоў, значкоў і шаблонаў пераносаў, якія ідуць разам з ім. Плагіны могуць дадаць свой радок, напрыклад аўтара тэмы."
