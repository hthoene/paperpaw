wifi.plugin.name = Wi-Fi
wifi.plugin.description = Падключаецца да сетак Wi-Fi, калі трэба, і потым выключае радыё.
wifi.plugin.how = "«Wi-Fi» падключаецца да сеткі, калі плагіну патрэбны інтэрнэт (каталог, сінхранізацыя, крама, перадача), і выключае радыё праз хвіліну пасля таго, як ім ніхто не карыстаецца, або адразу, калі паказваецца галоўны экран або кніга, каб эканоміць акумулятар і памяць.\n\nАдкрый «Wi-Fi» у наладах або праз пункт Wi-Fi у радку стану. «Сеткі» пералічваюць тыя, што ў зоне дасяжнасці; выберы адну і ўвядзі пароль або выберы «Наладзіць з тэлефона» і ўвядзі назву і пароль у браўзеры тэлефона замест прылады. «Забыць» выдаляе захаваную сетку.\n\nПаролі застаюцца на карце, захаваныя бяспечна, і ніколі больш не паказваюцца. У «Падключацца па патрэбе» ты задаеш, як доўга Wi-Fi застаецца ўключаным пасля апошняга выкарыстання, ці застаецца ўключаным падчас зарадкі і якая захаваная сетка першая, калі ў зоне дасяжнасці іх некалькі."
