settings.plugin.name = Налады
settings.plugin.description = Старонкі налад, пабудаваныя з налад кожнага плагіна.
settings.plugin.how = "«Налады» паказваюць усё, што можна наладзіць у PaperPaw і яго плагінах, па старонках. Плагінам не патрэбны ўласны экран: тое, што яны абвяшчаюць, з'яўляецца тут, па групах, з апісаннем кожнай налады пад ёй.\n\nАдкрый іх пунктам «Налады» ў меню. Націсні групу, каб адкрыць яе, потым наладу, каб пераключыць або выбраць; у лікаў ёсць кнопкі − і +. З кнопкамі перайдзі да налады і націсні «Выбраць»: «Улева» і «Управа» мяняюць лік, «Выбраць» захоўвае, «Назад» вяртае ранейшае значэнне.\n\nЗмены дзейнічаюць адразу. «Пошук» знаходзіць наладу па словах, а «Дадатковыя налады» дадаюць тыя, што патрэбны рэдка. «Скінуць да стандартных» і «Скінуць усё» спачатку перапытваюць."
