battery.plugin.name = Расход акумулятара
battery.plugin.description = Запісвае зарад і паказвае, на колькі яго хапае.
battery.plugin.how = "«Расход акумулятара» прыкладна раз на хвіліну занатоўвае зарад, пакуль прылада не спіць, разам з тым, што яна рабіла: абнаўленнямі экрана і перагорнутымі старонкамі. З гэтага вылічваецца, колькі ідзе на гадзіну няспання і на 100 старонак, і на колькі хопіць акумулятара пры такім тэмпе.\n\nАдкрый «Акумулятар» у меню «Інструменты». Ён паказвае цяперашні зарад, гэты перыяд няспання, расход ад акумулятара на цяперашні момант і апошнія перыяды няспання. Лістаецца кнопкамі старонак або дотыкам да стрэлак уверсе.\n\nКаб лічбы нешта значылі, патрэбна нейкі час чытання ад акумулятара. Запіс уключаны стандартна і выключаецца ў наладах, у раздзеле «Прылада», «Сілкаванне», як «Запісваць расход акумулятара»."
