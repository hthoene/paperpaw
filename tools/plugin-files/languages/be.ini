calendar.plugin.name = Каляндар
calendar.plugin.description = Твае календары на чытанцы: расклад, дзень, тыдзень і месяц з CalDAV, iCal і файлаў, дні нараджэння з кантактаў, віджэты галоўнага экрана і экран сну.
calendar.plugin.how = "Твае календары на чытанцы: расклад на бліжэйшыя дні, дзень, тыдзень і месяц з падзеямі календароў CalDAV (Nextcloud, Radicale, Baïkal, Fastmail і іншых), адрасоў iCal (.ics, webcal://), файлаў календароў на карце, а таксама дні нараджэння і гадавіны з тваіх кантактаў (CardDAV). Чытанка толькі чытае календары; яна ніколі іх не змяняе.\n\nАдкрый «Каляндар» у меню інструментаў. Першы радок называе від; выберы яго, або ўтрымай любы радок, або націсні «Меню», каб пераключацца паміж «Расклад», «Дзень», «Тыдзень», «Месяц» і «Дні нараджэння», дадаваць календары або сінхранізаваць. У «Дзень» і «Тыдзень» першыя два радкі пераходзяць на дзень або тыдзень назад і наперад (кнопкі старонак таксама); у «Месяц» стрэлкі перасоўваюць дзень, кнопкі старонак — месяц, а «Выбраць» адкрывае дзень. «Выбраць» на падзеі паказвае яе цалкам: калі, дзе, які каляндар і як паўтараецца. «Назад» вяртае на крок назад.\n\nДадай каляндар у «Календары» (у меню або «Каляндар» у наладах). Выберы яго тып: уліковы запіс CalDAV (досыць адраса сервера, напрыклад cloud.example.com/remote.php/dav; кожны каляндар з падзеямі становіцца часткай віду), адрас iCal (каляндар, апублікаваны як .ics), файл календара на карце або кантакты (адрасная кніга CardDAV: чытанка паказвае захаваныя ў ёй дні нараджэння і гадавіны). Увядзі адрас, для ўліковага запісу — імя карыстальніка і пароль (лепш пароль праграмы; ён захоўваецца разам з паролямі чытанкі) і назву. У кожнага календара ёсць пазнака (кропка, кольца, шэрая кропка або квадрат), якую можна змяніць, каб іх адрозніваць; календароў да шасці.\n\nПаўтаральныя падзеі (штодня, штотыдзень, штомесяц, штогод, з днямі тыдня, колькасцю, датамі заканчэння і прапушчанымі днямі), падзеі на ўвесь дзень і падзеі ў іншых часавых паясах паказваюцца па ўласным часе чытанкі. Чытанка захоўвае падзеі ад шасцідзесяці дзён таму да шасцідзесяці дзён наперад ад сённяшняга дня, не больш за 240, і паказвае іх без сеткі. Правілы, якія яна не можа прачытаць, паказваюць сваю падзею адзін раз.\n\nКалендары чытаюцца, калі ты адкрываеш каляндар (не часцей чым раз у пяць хвілін), калі выбіраеш «Сінхранізаваць зараз» і, як ты задаеш у наладах у «Каляндар», калі сетка і так уключана або калі пачынаецца зарадка. Чытанка ніколі не ўключае для гэтага свой радыёмодуль, акрамя выпадку, калі ты просіш «Сінхранізаваць зараз».\n\nВіджэты для галоўнага экрана (утрымай галоўны экран, потым дадай віджэт): «Сёння» паказвае дату і тое, што дзень прыносіць, «Наступная падзея» — наступную падзею, «Расклад» — бліжэйшыя дні, «Месяц» — месяц з кропкай пад днямі, у якія ёсць падзеі, а «Дні нараджэння» — бліжэйшыя дні нараджэння. Дотык да падзеі адкрывае яе, дотык да дня месяца адкрывае гэты дзень. Экран сну можа паказваць расклад на сёння: выберы «Каляндар» у наладах у раздзеле «Экран сну»."
