format-cbz.plugin.how = "Адкрывае архівы коміксаў (.cbz): адзін малюнак на старонку, падагнаны пад экран, у парадку іх назваў (2 перад 10).\n\nПалажы іх у папку бібліятэкі і адкрывай з бібліятэкі; старонкі гартаюцца, як у любой кнізе. Вялікія малюнкі першы раз адкрываюцца не імгненна, на X4 даўжэй, чым на іншых.\n\nНалады чытання (Налады, Чытанне): «Па кадрах» паказвае адзін кадр старонкі за раз, такім буйным, як дазваляе экран, і перагортванне праходзіць па іх; старонка без кадраў паказваецца цалкам. «Напрамак старонак коміксу» люструе перагортванне для манга (справа налева); уласны ComicInfo.xml кнігі кажа пра гэта сам. Бібліятэка паказвае назву кнігі і яе серыю і нумар з ComicInfo.xml."
format-cbz.title = Комікс (CBZ)
format-cbz.setting.direction = Напрамак старонак коміксу
format-cbz.setting.direction.help = Манга: перагортванне старонак люстраванае.
format-cbz.direction.book = Як у кнізе
format-cbz.direction.ltr = Злева направа
format-cbz.direction.rtl = Справа налева
format-cbz.setting.panels = Па кадрах
format-cbz.setting.panels.help = Па адным кадры; перагортванне праходзіць па іх.
format-docx.plugin.name = Дакументы DOCX
format-docx.plugin.description = Адкрывае файлы .docx, захаваныя ў Word і іншых праграмах.
format-docx.plugin.how = "Адкрывае дакументы .docx як кнігі: загалоўкі са зместам, спісы, табліцы, тлусты шрыфт і курсіў, спасылкі і відарысы (JPEG, PNG, GIF).\n\nПалажы файлы ў папку бібліятэкі і адкрывай з бібліятэкі. Назва і аўтар бяруцца з уласцівасцей дакумента. Зноскі, верхнія і ніжнія калонтытулы і каментарыі не паказваюцца."
format-docx.title = Дакумент DOCX
format-epub.plugin.name = EPUB
format-epub.plugin.description = Адкрывае кнігі EPUB з іх стылямі, зместам і відарысамі.
format-epub.plugin.how = "Кнігі EPUB адкрываюцца з бібліятэкі, як любыя іншыя кнігі, з іх зместам, відарысамі і афармленнем выдаўца. Вэб-старонкі (HTML), Markdown, FictionBook (.fb2) і архівы коміксаў (.cbz) адкрываюцца гэтак жа, кожны ўласным плагінам.\n\nРаздзел пераўтвараецца пры першым адкрыцці і захоўваецца ў кэшы плагіна, таму потым ён адкрываецца хутчэй, і вялікія кнігі працуюць на малых прыладах. Змест знойдзеш у меню чытання пад «Змест». Ці ўжываецца ўласнае афармленне кнігі, залежыць ад налады «Афармленне выдаўца» ў раздзеле «Чытанне»."
format-epub.title = Электронная кніга EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Адкрывае кнігі FictionBook (.fb2, таксама ў архіве).
format-fb2.plugin.how = "Адкрывае кнігі FictionBook (.fb2), распаўсюджаныя сярод рускіх і іншых кніг, таксама ў архіве (.fb2.zip), з назвай, аўтарамі, вокладкай і раздзеламі.\n\nПалажы іх у папку бібліятэкі; яны паказваюцца ў бібліятэцы і адкрываюцца, як любыя іншыя кнігі."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Адкрывае вэб-старонкі, захаваныя як файлы, паказваючы толькі тое, што трэба чытаць.
format-html.plugin.how = "Адкрывае вэб-старонкі, захаваныя як файлы (.html, .htm, .xhtml), як кнігі: толькі тое, што трэба чытаць, без меню, рэкламы і таго, што вакол.\n\nПалажы файл у папку бібліятэкі і адкрый яго з бібліятэкі, як кнігу. Спасылкі ўнутры старонкі працуюць; відарысы паказваюцца там, дзе яны ў файле."
format-html.title = Вэб-старонка (HTML)
format-images.plugin.name = Відарысы
format-images.plugin.description = Адкрывае відарысы (.jpg, .png, .gif) як кнігі, па адным на старонку.
format-images.plugin.how = "Відарысы (.jpg, .png, .gif) адкрываюцца з бібліятэкі, як кнігі, па адным відарысе на старонку, падагнаныя пад экран.\n\nКаб прачытаць цэлую папку відарысаў, адкрый першы з іх: відарысы пасля яго ў папцы ідуць следам, у парадку іх назваў (2 перад 10). Відарыс далей у папцы пачынаецца з яго; месца ў кожным запамінаецца асобна. Папка да 300 відарысаў чытаецца ад таго, які ты адкрыў.\n\nФайл, які не з'яўляецца відарысам або занадта вялікі, паказвае сваю назву. Для кнігі з многіх відарысаў з уласнай назвай лепшая форма — архіў коміксаў (.cbz)."
format-images.title = Відарыс
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Адкрывае файлы Markdown (.md), напрыклад нататкі.
format-markdown.plugin.how = "Адкрывае файлы Markdown (.md), напрыклад нататкі, як кнігі: загалоўкі, спісы, цытаты і вылучэнні такімі, якімі яны задуманы, а не знакамі.\n\nПалажы файлы ў папку бібліятэкі і адкрывай з бібліятэкі. Першы загаловак — яго назва; відарысы побач з файлам паказваюцца там, дзе іх называе тэкст."
format-markdown.title = Markdown
format-mobi.plugin.name = Кнігі MOBI
format-mobi.plugin.description = Адкрывае файлы .mobi і .azw без DRM.
format-mobi.plugin.how = "Кнігі MOBI (.mobi, .azw) адкрываюцца з бібліятэкі, як любыя кнігі, без якіх-небудзь налад. Назва, аўтары, мова і вокладка бяруцца з кнігі, а змест будуецца з яе загалоўкаў.\n\nКніга пераўтвараецца пры першым адкрыцці, што для доўгай займае некалькі секунд; потым яна адкрываецца адразу. Паказваюцца тэкст, загалоўкі, тлусты шрыфт і курсіў, спасылкі і відарысы.\n\nКнігі з DRM (большасць кніг, купленых у крамах) адкрыць нельга, як і кнігі са сціскам Хафмана або ў новай форме KF8 (.azw3): PaperPaw паведаміць пра гэта пры адкрыцці. Копія ў EPUB, зробленая такім інструментам, як Calibre, адкрываецца заўсёды."
format-mobi.title = Кнігі MOBI
format-rtf.plugin.name = Дакументы RTF
format-rtf.plugin.description = Адкрывае файлы .rtf як кнігі.
format-rtf.title = Дакументы RTF
format-txt.plugin.name = Просты тэкст
format-txt.plugin.description = Адкрывае файлы простага тэксту (.txt).
format-txt.plugin.how = "Файлы простага тэксту (.txt) адкрываюцца з бібліятэкі, як любыя кнігі, без якіх-небудзь налад. Плагін чытае тэкст у UTF-8, UTF-16 і Windows-1252 і сам вызначае кадзіроўку.\n\nАбзацы ідуць па пустых радках у файле; калі іх няма, кожны радок — абзац. У файлах Project Gutenberg тэкст ліцэнзіі ў пачатку і ў канцы прапускаецца, а назва і аўтар бяруцца з загалоўка.\n\nФайл ніколі не загружаецца цалкам, таму вельмі вялікія тэксты адкрываюцца і на малых прыладах."
format-txt.title = Просты тэкст
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Адкрывае кнігі XTC і XTCH, загадзя адрэндэраваныя старонкі чытанак Xteink.
format-xtc.plugin.how = "Файлы XTC і XTCH — гэта кнігі, старонкі якіх ужо адрэндэраваны як відарысы, так, як гэта робяць канвертары для чытанак Xteink. Яны адкрываюцца з бібліятэкі, як любыя кнігі.\n\nБо кожная старонка — гэта нязменны відарыс, тэкст нельга павялічыць або набраць іншым шрыфтам. Старонкі чорна-белыя або з чатырма адценнямі шэрага. Кожная старонка дэкадуецца, калі паказваецца, таму патрэбна мала памяці, таксама на X4.\n\nНазва, аўтар і раздзелы бяруцца з файла, калі яны ў ім ёсць."
format-xtc.title = Старонкі XTC
help.plugin.name = Падказкі
help.plugin.description = Паказвае, што робяць элементы кіравання экрана, пры яго першым адкрыцці.
help.plugin.how = "Пры першым адкрыцці экрана над ім з'яўляецца кароткая заўвага, што робяць яго элементы кіравання: часткі экрана, куды ідзе дотык, у рамцы, і што робяць кнопкі.\n\nДотык або любая кнопка закрывае заўвагу, і для гэтага экрана яна болей не вяртаецца. «Больш не паказваць падказкі» выключае іх усе.\n\nУ наладах, у раздзеле «Сістэма», «Падказкі» ўключае або выключае іх, а «Паказаць падказкі зноў» зноў паказвае заўвагу кожнага экрана адзін раз."
help.title = Як гэта працуе тут
help.got-it = Зразумела
help.no-more = Больш не паказваць падказкі
help.section = Падказкі
help.setting.show = Падказкі
help.setting.show.help = Пры першым адкрыцці экрана кароткая заўвага кажа, што робяць яго элементы кіравання.
help.setting.again = Паказаць падказкі зноў
help.setting.again.help = Падказкі кожнага экрана паказваюцца яшчэ раз пры наступным адкрыцці.
help.again-done = Падказкі паказваюцца зноў, калі кожны экран адкрыецца наступны раз.
home.plugin.name = Галоўны экран
home.plugin.description = Стартавая старонка: старонкі віджэтаў, напрыклад кніга, якую чытаеш, і інструменты.
home.plugin.how = "Галоўны экран складаецца са старонак, кожная з якіх — сетка віджэтаў і інструментаў, як на тэлефоне. Спачатку гадзіннік, кніга, якую ты чытаеш, і нядаўна чытаныя кнігі стаяць на адной старонцы, а ўсе інструменты — на наступнай.\n\nНаціскай элемент, каб адкрыць яго, і правядзі пальцам або скарыстай кнопкі старонак, каб змяніць старонку. Толькі з кнопкамі стрэлкі пераходзяць ад аднаго элемента да наступнага, а «Выбраць» адкрывае.\n\nКаб перастаўляць, утрымай галоўны экран, націсні аловак пад старонкай або выберы ў меню «Змяніць галоўны экран». Перацягвай элементы, каб перамясціць іх, або націсні адзін для яго параметраў, таксама з кнопкамі. Там жа і «Дадаць віджэт». «Слупкі» і «Радкі» знаходзяцца ў наладах, у раздзеле «Выгляд», у групе «Галоўны экран».\n\nНа экране, павернутым набок, галоўны экран паказвае тыя ж элементы з большай колькасцю слупкоў, кожная старонка запаўняецца перад наступнай, а карткі не шырэй за каля 110 мм; тое, што ты наладзіў вертыкальна, не змяняецца. Налады гарызантальна — і гэты макет захоўваецца для арыентацыі асобна: новыя віджэты дадаюцца ў абодва. «Скінуць гарызантальны макет» у «Дадаць» (пры змяненні) вяртае да вытворнага макета. Выдаленне віджэта або інструмента ў адной арыентацыі не выдаляе яго з другой."
