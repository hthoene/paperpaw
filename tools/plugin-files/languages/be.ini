keyboard.plugin.name = Клавіятура
keyboard.plugin.description = Уводзіць тэкст на экране дотыкам або кнопкамі.
keyboard.plugin.how = "Клавіятура адкрываецца, калі нешта патрабуе тэксту: пошук, пароль, нататка або налада. Яна працуе дотыкам і толькі кнопкамі.\n\nНа кнопках «Улева» і «Управа» перамяшчаюць па радку, кнопкі старонак — паміж радкамі, «Выбраць» націскае клавішу, а «Назад» скасоўвае; «Улева» і «Управа» ідуць па коле ў радку, а «Уверх» і «Уніз» трымаюцца твайго слупка. Shift робіць наступную літару вялікай; націсні двойчы, каб усе былі вялікімі, і яшчэ раз, каб спыніць. Утрымай літару (на кнопках: утрымай на ёй «Выбраць»), каб атрымаць вялікую, якая абіраецца адразу, і знакі з дыякрытыкай, напрыклад é і è; у нямецкай ä, ö, ü і ß атрымліваюцца так з a, o, u і s (на кнопках клавіятура паведамляе пра гэта на гэтых літарах). «OK» завяршае; на кнопках утрымай «Назад», каб завяршыць адкуль заўгодна (адно «Назад» скасоўвае), або ўтрымай «Выбраць» на клавішы, якая не літара. «Уставіць» устаўляе тэкст з буфера, а «Тэлефон», дзе ён прапанаваны, дазваляе ўводзіць тэкст на тэлефоне.\n\nУ наладах, у раздзеле «Прылада», «Клавіятура»: «Раскладкі клавіятуры» выбірае раскладкі. Стандартна яна ідзе за мовай меню; калі іх некалькі, клавіша пераключае паміж імі. «Клавішы з умлаўтам» дае ўласныя клавішы для ä, ö, ü і ß. «Памер» робіць клавішы і літары большымі; толькі з кнопкамі радкі застаюцца такімі, як на клавіятуры камп'ютара. На сэнсарных экранах «Форма клавіш» змяняе выгляд клавіш. «Аўтаматычныя вялікія літары» пачынае кожны сказ з вялікай літары."
