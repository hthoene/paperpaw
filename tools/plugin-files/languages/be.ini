vocabulary.plugin.name = Слоўнікавы запас
vocabulary.plugin.description = Захоўвае словы, якія ты шукаеш, з іх сказамі і паўтарае картачкі з інтэрвальным паўтарэннем, створаныя на тэлефоне.
vocabulary.plugin.how = "«Слоўнікавы запас» захоўвае словы, якія ты шукаеш падчас чытання, кожнае са сказам, каб праглядзець пазней. Спіс знойдзеш у «Інструментах», найноўшыя спачатку; выберы слова, каб шукаць яго зноў. Апошні радок, «Экспарт», захоўвае іх для праграм з картачкамі, напрыклад Anki. У спісе захоўваюцца найноўшыя 2 000 слоў: далей самыя старыя выпадаюць, таму экспартуй іх спачатку, каб захаваць усе.\n\n«Картачкі», таксама ў «Інструментах», правяраюць цябе з інтэрвальным паўтарэннем: пасля «Паказаць адказ» ты ацэньваеш кожную картку як «Яшчэ раз», «Цяжка», «Добра» або «Лёгка», і гэта вызначае, калі яна вернецца. Калоды стварай праз «Змяняць на тэлефоне»: адскануй код тэлефонам у той жа сетцы Wi-Fi, потым набірай карткі або дадавай многа адразу: адкрый там калоду, выберы «Многа картак адразу» і абяры файл CSV, TSV або TXT (картка ў кожным радку: перад, адваротны бок, прыклад; UTF-8), устаў спіс або прынясі калоду Anki (.apkg, экспартаваную з «Падтрымка старэйшых версій Anki»).\n\nАбо выкарыстоўвай файлы на SD-карце: пакладзі файл CSV, TSV або TXT або калоду Anki (.apkg, экспартаваную з «Падтрымка старэйшых версій Anki») для кожнай калоды ў папку Flashcards (Spanish.tsv стварае калоду Spanish; адна картка ў кожным радку: перад, адваротны бок, прыклад; захавана як UTF-8; першы радок можа называць слупкі front, back, example). Выберы «Карткі на SD-карце» ў «Картачкі» або дазволь гэтаму здарыцца, калі ты адкрываеш «Картачкі». Калоды застаюцца на чытанцы з тым, што ты вывучыў, і файл зліваецца ў сваю калоду, калі ён новы або зменены: змяні адваротны бок або прыклад карткі ў файле, і картка зменіцца і захавае свой прагрэс; змяні тэкст пярэдняга боку, і яна будзе лічыцца новай карткай, а старая пачынае нанова (карткі адрозніваюцца па тэксце пярэдняга боку; прабелы і вялікія літары не ўлічваюцца); радок, які ты выдаліў, картку не выдаляе (калі ты не задаў для гэтай калоды «карткі, якіх няма ў файле» значэнне «Выдаляць»: тады картка выдаляецца пры наступным абнаўленні разам з прагрэсам, назаўсёды, і нічога не выдаляецца, пакуль нейкі радок файла нельга прачытаць). Захавай калоду ў яе файл праз «Захаваць на карту»: файл атрымлівае нумары картак (слупок id), таму можна рэдагаваць пярэднія бакі на камп'ютары, і карткі захоўваюць вывучанае; файл захоўвае толькі id, перад, адваротны бок і прыклад (іншыя слупкі, каментарыі і парадак радкоў не захоўваюцца), а захаванне адхіляецца, пакуль нейкі радок файла нельга было прачытаць; файл, што быў там, капіруецца ў _name.bak.tsv першы раз (пазнейшае захаванне гэтую копію не замяняе). Файл болей за 4 МіБ або 20 000 радкоў не чытаецца, і яго трэба захаваць як CSV UTF-8, а не UTF-16. Першы раз чытанка стварае папку з заўвагай, як гэта працуе.\n\nУ наладах, у раздзеле «Чытанне», «Знойдзеныя словы становяцца карткамі» кладзе кожнае знойдзенае слова ў калоду «Looked up»."
