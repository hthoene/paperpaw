notes-vault.plugin.name = ਨੋਟ ਵਾਲਟ
notes-vault.plugin.description = Markdown ਨੋਟਾਂ ਦਾ ਫ਼ੋਲਡਰ ਫ਼ੋਲਡਰਾਂ, ਟੈਗਾਂ ਅਤੇ ਤਾਜ਼ਾ ਤਬਦੀਲੀਆਂ ਮੁਤਾਬਕ ਪੜ੍ਹਦਾ ਹੈ, ਹੋਮ ਸਕ੍ਰੀਨ ਲਈ ਵਿਜੇਟਾਂ ਸਮੇਤ। Obsidian ਵਾਲਟਾਂ ਨਾਲ ਕੰਮ ਕਰਦਾ ਹੈ।
notes-vault.plugin.how = "“ਨੋਟ ਵਾਲਟ” Markdown ਨੋਟਾਂ ਦਾ ਫ਼ੋਲਡਰ ਪੜ੍ਹਦਾ ਹੈ (ਸਧਾਰਨ .md ਫ਼ਾਈਲਾਂ, ਜਿਵੇਂ ਨੋਟ ਐਪਾਂ ਰੱਖਦੀਆਂ ਹਨ)। ਇਹ Obsidian ਵਾਲਟਾਂ ਨਾਲ ਕੰਮ ਕਰਦਾ ਹੈ।\n\nਵਾਲਟ ਦਾ ਫ਼ੋਲਡਰ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਜਾਂ ਟੂਲ ਵਿੱਚ ਵਾਲਟ ਦੇ ਪੰਨੇ 'ਤੇ ਚੁਣੋ। ਫਿਰ ਪੰਨਾ ਕਾਰਡ ਵਾਲੇ ਫ਼ੋਲਡਰ, ਤਾਜ਼ਾ ਬਦਲੇ ਨੋਟ, ਟੈਗ ਅਤੇ ਨੋਟਾਂ ਦੇ ਸਿਰਲੇਖਾਂ ਵਿੱਚ ਖੋਜ ਦਿੰਦਾ ਹੈ।\n\nਪਹਿਲੀ ਵਾਰ ਵਾਲਟ ਦਾ ਇੰਡੈਕਸ ਪਿਛੋਕੜ ਵਿੱਚ ਬਣਦਾ ਹੈ ਜਦੋਂ ਤੱਕ ਉਸ ਦਾ ਪੰਨਾ ਖੁੱਲ੍ਹਾ ਹੈ; ਹਜ਼ਾਰਾਂ ਨੋਟਾਂ ਨੂੰ ਕੁਝ ਮਿੰਟ ਲੱਗਦੇ ਹਨ, ਫਿਰ ਇਹ ਤੁਰੰਤ ਖੁੱਲ੍ਹਦਾ ਹੈ। ਇੰਡੈਕਸ ਕਾਰਡ 'ਤੇ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਕੁਝ ਘੰਟਿਆਂ ਬਾਅਦ ਪੰਨਾ ਖੋਲ੍ਹਣ 'ਤੇ ਜਾਂ “ਅੱਪਡੇਟ” ਚੁਣਨ 'ਤੇ ਦੁਬਾਰਾ ਬਣਦਾ ਹੈ।\n\nਨੋਟ ਰੀਡਰ ਵਿੱਚ ਖੁੱਲ੍ਹਦਾ ਹੈ। ਦੂਜੇ ਨੋਟਾਂ ਦੇ ਲਿੰਕ ([[Note]], [[Note|words]], [[Note#Heading]]) ਵਾਲਟ ਵਿੱਚ ਕਿਤੇ ਵੀ ਨੋਟ ਦੇ ਨਾਂ ਨਾਲ ਲੱਭੇ ਜਾਂਦੇ ਹਨ; ਲਿੰਕ ਉਹ ਨੋਟ ਖੋਲ੍ਹਦਾ ਹੈ, ਅਤੇ “ਵਾਪਸ” ਪਿਛਲੇ ਨੋਟ 'ਤੇ ਲੈ ਜਾਂਦਾ ਹੈ।\n\nਵਾਲਟ ਵਿੱਚ ਕਦੇ ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ ਜਾਂਦਾ। ਹੋਮ ਸਕ੍ਰੀਨ ਦੇ ਵਿਜੇਟ (ਤਾਜ਼ਾ ਨੋਟ, ਪਿੰਨ ਕੀਤਾ ਨੋਟ, ਅੱਜ ਦਾ ਨੋਟ, ਬੇਤਰਤੀਬ ਨੋਟ, ਟੈਗ, ਖੋਜ) ਹੋਮ ਸਕ੍ਰੀਨ ਦੇ ਸੰਪਾਦਕ ਵਿੱਚ ਸ਼ਾਮਲ ਕਰੋ। ਵਿਜੇਟ ਸਿਰਫ਼ ਇੱਕ ਫ਼ੋਲਡਰ ਦੇ ਨੋਟ ਲੈ ਸਕਦਾ ਹੈ: ਵਿਜੇਟ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਕਾਰਡ ਦੇ ਮੂਲ ਤੋਂ ਫ਼ੋਲਡਰ ਦਾ ਪਾਥ ਲਿਖੋ (ਜਿਵੇਂ Notes/Work); ਖਾਲੀ ਛੱਡਣ 'ਤੇ ਇਹ ਵਾਲਟ ਦੇ ਸਾਰੇ ਨੋਟ ਲੈਂਦਾ ਹੈ।"
