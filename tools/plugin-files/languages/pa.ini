core.firmware.signed = {key} ਦੇ ਦਸਤਖਤ।
core.firmware.other-key = ਅਜਿਹੀ ਕੁੰਜੀ ਦੇ ਦਸਤਖਤ ਜੋ PaperPaw ਦੀ ਨਹੀਂ ਹੈ: {fingerprint}। ਇਸ ਨੂੰ ਤਾਂ ਹੀ ਸਥਾਪਤ ਕਰੋ ਜੇ ਤੁਹਾਨੂੰ ਇਸ 'ਤੇ ਭਰੋਸਾ ਹੈ।
core.firmware.unsigned = ਦਸਤਖਤ ਨਹੀਂ ਹਨ।
core.firmware.older = ਇਹ ਪੁਰਾਣਾ ਵਰਜਨ ਹੈ, ਜਾਂ ਉਹੀ ਵਰਜਨ।
core.firmware.foreign.1 = ਇਹ PaperPaw ਨਹੀਂ, ਕੋਈ ਹੋਰ ਫ਼ਰਮਵੇਅਰ ਹੈ। PaperPaw ਆਪਣੇ-ਆਪ ਦੁਬਾਰਾ ਸ਼ੁਰੂ ਨਹੀਂ ਹੁੰਦਾ।
core.firmware.foreign.2 = PaperPaw ਇਸ ਨੂੰ ਵਾਪਸ ਨਹੀਂ ਕਰਦਾ। ਵਾਪਸ ਆਉਣਾ ਦੂਜੇ ਫ਼ਰਮਵੇਅਰ ਜਾਂ ਕਿਸੇ ਫ਼ਲੈਸ਼ ਟੂਲ 'ਤੇ ਨਿਰਭਰ ਹੈ (ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਕੰਮ ਕਰਦਾ ਹੈ)।
core.firmware.foreign.3 = PaperPaw ਫ਼ਲੈਸ਼ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ ਅਤੇ ਕਾਰਡ 'ਤੇ ਤੁਹਾਡੀਆਂ ਫ਼ਾਈਲਾਂ ਨੂੰ ਛੂਹਿਆ ਨਹੀਂ ਜਾਂਦਾ।
