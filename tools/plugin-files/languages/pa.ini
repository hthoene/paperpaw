bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = ਰਿਮੋਟ, ਕੀਬੋਰਡ ਅਤੇ ਸੈਂਸਰ ਜੋੜਾਬੱਧ ਕਰਦਾ ਹੈ ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਕਨੈਕਟ ਕਰਦਾ ਹੈ।
bluetooth.plugin.how = "Bluetooth ਰਿਮੋਟ, ਕੀਬੋਰਡ ਅਤੇ ਸੈਂਸਰ ਰੀਡਰ ਨਾਲ ਜੋੜਾਬੱਧ ਕਰਦਾ ਹੈ, ਜਿੱਥੇ ਰੀਡਰ ਵਿੱਚ Bluetooth ਹੋਵੇ (X4 Pro)।\n\n“ਡੀਵਾਈਸ ਸ਼ਾਮਲ ਕਰੋ” ਨੇੜੇ ਦੇ ਡੀਵਾਈਸ ਖੋਜਦਾ ਹੈ; ਪਹਿਲਾਂ ਡੀਵਾਈਸ ਨੂੰ ਜੋੜਾਬੱਧ ਮੋਡ ਵਿੱਚ ਪਾਓ। ਉਸ ਨੂੰ ਚੁਣੋ, ਅਤੇ ਰੀਡਰ 'ਤੇ ਪੁਸ਼ਟੀ ਕਰੋ (ਜੇ ਕੋਈ ਨੰਬਰ ਦਿਸੇ ਤਾਂ ਉਸ ਨੂੰ ਮਿਲਾਓ)। ਫਿਰ ਰਿਮੋਟ ਜਾਂ ਕੀਬੋਰਡ ਦੇ ਬਟਨ ਪੰਨੇ ਪਲਟਦੇ ਹਨ ਅਤੇ ਮੀਨੂ ਵਿੱਚ ਚੱਲਦੇ ਹਨ; ਹਰ ਬਟਨ ਕੀ ਕਰੇ, ਇਹ “ਕੰਟਰੋਲ” ਵਿੱਚ ਬਦਲੋ।\n\n“ਰਿਮੋਟ” ਦੱਸਦਾ ਹੈ ਕਿ ਉਹਨਾਂ ਦੇ ਬਟਨ ਕਦੋਂ ਕੰਮ ਕਰਦੇ ਹਨ: ਇੱਥੇ ਚਾਲੂ ਕਰਨ 'ਤੇ, ਪੜ੍ਹਦੇ ਸਮੇਂ (ਕਿਤਾਬ ਖੁੱਲ੍ਹੀ ਹੋਣ 'ਤੇ ਕਨੈਕਟ, ਬੈਟਰੀ ਬਚਦੀ ਹੈ), ਜਾਂ ਹਮੇਸ਼ਾ। ਮੀਨੂ ਬਟਨ ਨਾਲ ਜਾਂ ਕਿਸੇ ਡੀਵਾਈਸ ਨੂੰ ਦਬਾਈ ਰੱਖਣ ਨਾਲ ਉਹ ਭੁਲਾ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ।\n\nਸੈਂਸਰ ਪਲੱਗਇਨਾਂ ਲਈ ਹੈ: ਚਾਲੂ ਕਰੋ ਕਿ ਕਿਹੜਾ ਪਲੱਗਇਨ ਇਸ ਨੂੰ ਵਰਤ ਸਕਦਾ ਹੈ। ਜਦੋਂ ਕੋਈ ਇਸ ਨੂੰ ਨਹੀਂ ਵਰਤਦਾ, Bluetooth ਬੰਦ ਰਹਿੰਦਾ ਹੈ।"
