stats.plugin.name = ਪੜ੍ਹਨ ਦੇ ਅੰਕੜੇ
stats.plugin.description = ਤੁਸੀਂ ਕਿੰਨਾ ਸਮਾਂ ਅਤੇ ਕਿੰਨਾ ਪੜ੍ਹਦੇ ਹੋ, ਦਰਜ ਕਰਦਾ ਹੈ, ਕੈਲੰਡਰ ਅਤੇ ਹਰ ਕਿਤਾਬ ਦੇ ਅੰਕੜਿਆਂ ਨਾਲ।
stats.plugin.how = "ਪੜ੍ਹਨ ਦੇ ਅੰਕੜੇ ਦਰਜ ਕਰਦੇ ਹਨ ਕਿ ਤੁਸੀਂ ਹਰ ਪੰਨਾ ਕਿੰਨੀ ਦੇਰ ਪੜ੍ਹਦੇ ਹੋ। ਤੁਸੀਂ ਇਹਨਾਂ ਨੂੰ ਅੱਜ, ਹਫ਼ਤੇ ਅਤੇ ਲਗਾਤਾਰ ਦਿਨਾਂ ਵਾਲੀ ਝਲਕ, ਕੈਲੰਡਰ, ਅਤੇ ਹਰ ਕਿਤਾਬ ਦੇ ਅੰਕੜਿਆਂ ਵਜੋਂ ਦੇਖਦੇ ਹੋ।\n\nਇਹਨਾਂ ਨੂੰ “ਟੂਲ” ਤੋਂ ਜਾਂ ਰੀਡਰ ਵਿੱਚ “ਹੋਰ” ਤੋਂ ਖੋਲ੍ਹੋ। ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਪੜ੍ਹਨ ਦੇ ਅੰਕੜੇ” ਹੇਠਾਂ ਤੁਸੀਂ “ਪੜ੍ਹਨਾ ਦਰਜ ਕਰੋ” ਬੰਦ ਕਰ ਸਕਦੇ ਹੋ, “ਰੋਜ਼ਾਨਾ ਟੀਚਾ” ਸੈੱਟ ਕਰ ਸਕਦੇ ਹੋ, ਅਤੇ ਗਿਣੇ ਜਾਣ ਵਾਲੇ “ਸਭ ਤੋਂ ਛੋਟਾ ਪੰਨਾ” ਅਤੇ “ਸਭ ਤੋਂ ਲੰਬਾ ਪੰਨਾ” ਸੈੱਟ ਕਰ ਸਕਦੇ ਹੋ, ਤਾਂ ਜੋ ਪੰਨੇ ਪਲਟਣਾ ਜਾਂ ਖੁੱਲ੍ਹੀ ਛੱਡੀ ਕਿਤਾਬ ਅੰਕੜੇ ਨਾ ਵਿਗਾੜੇ।\n\n“KOReader ਨਾਲ ਸਿੰਕ ਕਰੋ” ਇੱਕ WebDAV ਫ਼ੋਲਡਰ ਰਾਹੀਂ ਅੰਕੜੇ KOReader ਨਾਲ ਸਾਂਝੇ ਕਰਦਾ ਹੈ। ਇਹ ਉਸੇ ਡੀਵਾਈਸ 'ਤੇ KOReader ਦੇ ਅੰਕੜੇ ਵੀ ਲੈ ਲੈਂਦਾ ਹੈ। ਦਰਜ ਕਰਨ ਲਈ ਘੜੀ ਸੈੱਟ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ: ਜੇ ਨਹੀਂ, ਤਾਂ ਇੱਕ ਵਾਰ Wi-Fi ਨਾਲ ਕਨੈਕਟ ਕਰੋ।"
