opds.plugin.name = OPDS ਕੈਟਾਲਾਗ
opds.plugin.description = OPDS ਕੈਟਾਲਾਗ ਬ੍ਰਾਊਜ਼ ਕਰਦਾ ਹੈ, ਉਹਨਾਂ ਦੀਆਂ ਕਿਤਾਬਾਂ ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ ਅਤੇ ਫ਼ੋਲਡਰਾਂ ਨੂੰ ਉਹਨਾਂ ਨਾਲ ਸਿੰਕ ਰੱਖਦਾ ਹੈ।
opds.plugin.how = "OPDS ਕੈਟਾਲਾਗ ਆਨਲਾਈਨ ਲਾਇਬ੍ਰੇਰੀਆਂ ਹਨ, ਜਿਵੇਂ Project Gutenberg, Calibre-Web, Kavita ਜਾਂ Komga। ਇਹ ਪਲੱਗਇਨ ਇਹਨਾਂ ਨੂੰ ਫ਼ੋਲਡਰਾਂ ਵਾਂਗ ਬ੍ਰਾਊਜ਼ ਕਰਦਾ ਅਤੇ ਖੋਜਦਾ ਹੈ ਅਤੇ ਇਹਨਾਂ ਦੀਆਂ ਕਿਤਾਬਾਂ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ।\n\nਟੂਲ ਮੀਨੂ ਤੋਂ “ਕੈਟਾਲਾਗ” ਖੋਲ੍ਹੋ ਅਤੇ “ਕੈਟਾਲਾਗ ਸ਼ਾਮਲ ਕਰੋ” ਚੁਣੋ: ਇੱਕ ਪਤਾ ਅਤੇ, ਜੇ ਕੈਟਾਲਾਗ ਨੂੰ ਖਾਤਾ ਚਾਹੀਦਾ ਹੈ, ਵਰਤੋਂਕਾਰ ਨਾਂ ਅਤੇ ਪਾਸਵਰਡ। ਬ੍ਰਾਊਜ਼ ਕਰਨ ਲਈ ਕੈਟਾਲਾਗ 'ਤੇ ਟੈਪ ਕਰੋ; ਸਿੰਕ ਕਰਨ, ਸੋਧਣ ਜਾਂ ਹਟਾਉਣ ਲਈ ਇਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ: “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)।\n\nਜਦੋਂ “ਇਹ ਕੈਟਾਲਾਗ ਸਿੰਕ ਕਰੋ” ਚਾਲੂ ਹੋਵੇ, “ਕੈਟਾਲਾਗ ਸਿੰਕ ਕਰੋ” ਇਸ ਦੀਆਂ ਨਵੀਆਂ ਕਿਤਾਬਾਂ ਇਸ ਦੇ ਫ਼ੋਲਡਰ ਵਿੱਚ ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ। “ਪ੍ਰਤੀ ਸਿੰਕ ਕਿਤਾਬਾਂ” ਸੀਮਤ ਕਰਦਾ ਹੈ ਕਿ ਇੱਕ ਸਿੰਕ ਕਿੰਨੀਆਂ ਲਿਆਵੇ, ਤਾਂ ਜੋ ਵੱਡਾ ਕੈਟਾਲਾਗ ਡੀਵਾਈਸ ਨਾ ਭਰ ਦੇਵੇ। ਕੈਟਾਲਾਗ ਦੀ ਥਾਂ ਕਲਾਊਡ ਫ਼ੋਲਡਰ (WebDAV) ਵੀ ਕੰਮ ਕਰਦਾ ਹੈ।"
