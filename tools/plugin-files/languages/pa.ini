wallabag.bad-login = Wallabag ਨੇ ਲੌਗਇਨ ਸਵੀਕਾਰ ਨਹੀਂ ਕੀਤਾ। ਵਰਤੋਂਕਾਰ ਨਾਂ, ਪਾਸਵਰਡ ਅਤੇ API ਕਲਾਇੰਟ ਜਾਂਚੋ।
