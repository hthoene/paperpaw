launcher-simple.plugin.name = ਸਧਾਰਨ ਹੋਮ
launcher-simple.plugin.description = ਇੱਕ ਸ਼ਾਂਤ ਸ਼ੁਰੂਆਤੀ ਸਕ੍ਰੀਨ: ਵੱਡੀ ਘੜੀ, ਕਾਰਡ, ਇੱਕ ਡੌਕ ਅਤੇ ਗੋਲ ਸਵਿੱਚਾਂ ਵਾਲਾ ਤਤਕਾਲ ਪੈਨਲ।
launcher-simple.plugin.how = "“ਸਧਾਰਨ ਹੋਮ” ਉਹਨਾਂ ਲਈ ਸ਼ਾਂਤ ਸ਼ੁਰੂਆਤੀ ਸਕ੍ਰੀਨ ਹੈ ਜਿਹਨਾਂ ਨੂੰ ਸਿਰਫ਼ ਮੂਲ ਚੀਜ਼ਾਂ ਚਾਹੀਦੀਆਂ ਹਨ: ਵੱਡੀ ਘੜੀ, ਪੜ੍ਹੀ ਜਾ ਰਹੀ ਕਿਤਾਬ, ਲਾਇਬ੍ਰੇਰੀ ਅਤੇ ਸਟੋਰ ਵੱਡੇ ਕਾਰਡਾਂ ਵਜੋਂ, ਅਤੇ ਹੇਠਾਂ ਤਿੰਨ ਆਈਕਨਾਂ ਵਾਲਾ ਡੌਕ। ਕੁਝ ਸੈੱਟ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ।\n\nਇਸ ਨੂੰ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਹੋਮ ਸਕ੍ਰੀਨ ਹੇਠਾਂ ਚੁਣੋ। ਇਸ ਦੇ ਤਤਕਾਲ ਪੈਨਲ (ਇਸ ਨੂੰ ਵੀ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਪੈਨਲ ਵਜੋਂ ਚੁਣੋ) ਵਿੱਚ ਵੱਡੇ ਗੋਲ ਸਵਿੱਚ, ਫ਼ਰੰਟਲਾਈਟ ਲਈ ਪੱਟੀ (ਜਿੱਥੇ ਡੀਵਾਈਸ ਵਿੱਚ ਹੋਵੇ) ਅਤੇ ਟੈਕਸਟ ਦੇ ਆਕਾਰ ਲਈ ਪੱਟੀ ਹੈ। ਬਟਨਾਂ ਨਾਲ, ਤੀਰ ਕੁੰਜੀਆਂ ਫ਼ੋਕਸ ਹਿਲਾਉਂਦੀਆਂ ਹਨ ਅਤੇ “ਚੁਣੋ” ਉਹ ਕਰਦਾ ਹੈ ਜੋ ਹਿੱਸੇ 'ਤੇ ਲਿਖਿਆ ਹੈ; ਪੱਟੀ 'ਤੇ ਇਹ ਦਸਵਾਂ ਹਿੱਸਾ ਵਧਾਉਂਦਾ ਹੈ, ਅਤੇ ਅੰਤ ਤੋਂ ਸ਼ੁਰੂ 'ਤੇ ਮੁੜਦਾ ਹੈ। ਟੱਚ ਨਾਲ, ਕਿਸੇ ਹਿੱਸੇ 'ਤੇ ਟੈਪ ਕਰੋ, ਜਾਂ ਪੱਟੀ 'ਤੇ ਜਿੱਥੇ ਚਾਹੋ ਉੱਥੇ ਟੈਪ ਕਰੋ।\n\nਲਾਇਬ੍ਰੇਰੀ ਤੁਹਾਡੀਆਂ ਕਿਤਾਬਾਂ ਕਾਰਡਾਂ ਵਜੋਂ ਦਿਖਾਉਂਦੀ ਹੈ, ਆਖਰੀ ਵਾਰ ਖੋਲ੍ਹੀ ਕਿਤਾਬ ਪਹਿਲਾਂ, ਇੱਕ ਵਾਰ ਵਿੱਚ ਇੱਕ ਪੰਨਾ, ਅਤੇ ਸਧਾਰਨ ਰੀਡਰ ਖੋਲ੍ਹਦੀ ਹੈ।\n\nਇਸ ਨੂੰ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਸਧਾਰਨ ਹੋਮ” ਹੇਠਾਂ ਆਪਣਾ ਬਣਾਓ: ਤਿੰਨ ਸੂਚੀਆਂ, ਜੋ ਮੁੱਖ ਮੀਨੂ ਵਾਂਗ ਸੰਪਾਦਿਤ ਹੁੰਦੀਆਂ ਹਨ। ਕਾਰਡ: ਹੋਮ ਕਿਹੜੇ ਕਾਰਡ ਕਿਸ ਤਰਤੀਬ ਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ। ਡੌਕ: ਡੌਕ ਵਿੱਚ ਕਿਹੜੇ ਆਈਕਨ ਹਨ, ਕਿਸੇ ਵੀ ਪਲੱਗਇਨ ਦੀ ਕੋਈ ਵੀ ਕਾਰਵਾਈ। ਤਤਕਾਲ ਪੈਨਲ: ਇਹ ਕਿਹੜੇ ਸਵਿੱਚ ਅਤੇ ਪੱਟੀਆਂ ਦਿਖਾਉਂਦਾ ਹੈ। ਜਿਸ ਕਾਰਡ ਲਈ ਸਕ੍ਰੀਨ 'ਤੇ ਥਾਂ ਨਹੀਂ, ਉਹ ਅੰਤ ਤੋਂ ਛੱਡ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ। “ਸਧਾਰਨ ਹੋਮ” ਹੇਠਾਂ ਤੁਸੀਂ ਇਹ ਵੀ ਚੁਣਦੇ ਹੋ ਕਿ ਤਾਰੀਖ ਅਤੇ ਬੈਟਰੀ ਦਿਖਣ ਜਾਂ ਨਹੀਂ।"
