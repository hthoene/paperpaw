plugin-manager.code.not-installed = ਸਟੋਰ ਜਾਂ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਤੋਂ ਸਥਾਪਤ ਨਹੀਂ ਕੀਤਾ: ਇਸ ਦਾ ਕੋਡ ਨਹੀਂ ਚੱਲਦਾ। ਇਸ ਨੂੰ ਉੱਥੋਂ ਸਥਾਪਤ ਕਰੋ।
plugin-manager.code.unsigned = ਦਸਤਖ਼ਤ ਨਹੀਂ: ਬਿਨਾਂ ਜਾਂਚ ਦੇ ਚੱਲਦਾ ਹੈ।
plugin-manager.code.changed = ਸਥਾਪਤ ਕਰਨ ਤੋਂ ਬਾਅਦ ਇਸ ਦਾ ਕੋਡ ਬਦਲਿਆ ਗਿਆ: ਇਹ ਨਹੀਂ ਚੱਲਦਾ। ਇਸ ਨੂੰ ਦੁਬਾਰਾ ਸਥਾਪਤ ਕਰੋ।
