widgets.plugin.name = ਵਿਜੇਟ ਪੈਕ
widgets.plugin.description = ਹੋਮ ਸਕ੍ਰੀਨ ਲਈ ਕਈ ਹੋਰ ਵਿਜੇਟ: ਘੜੀਆਂ, ਕੈਲੰਡਰ, ਹਵਾਲੇ, ਕਿਤਾਬਾਂ, ਨੋਟ ਅਤੇ ਹੋਰ।
widgets.plugin.how = "ਵਿਜੇਟ ਪੈਕ ਹੋਮ ਸਕ੍ਰੀਨ ਲਈ ਕਈ ਵਿਜੇਟ ਜੋੜਦਾ ਹੈ: ਘੜੀਆਂ (ਸੂਈਆਂ ਵਾਲੀ, ਸ਼ਬਦਾਂ ਵਾਲੀ, ਟਾਈਲਾਂ ਵਾਲੀ, ਵਿਸ਼ਵ), ਕੈਲੰਡਰ, ਹੁਣ ਤੱਕ ਦਾ ਸਾਲ, ਉਲਟੀ ਗਿਣਤੀ, ਚੰਦ ਦਾ ਪੜਾਅ, ਅਤੇ ਦਿਨ ਤੇ ਤਾਰੀਖ; ਅੱਜ ਦਾ ਹਵਾਲਾ, ਨੋਟ, ਕਰਨ ਵਾਲੇ ਕੰਮ, ਤਸਵੀਰਾਂ, ਸਵਾਗਤ ਅਤੇ PaperPaw ਲੋਗੋ; ਅਤੇ ਕਿਤਾਬਾਂ ਲਈ ਹੁਣ ਪੜ੍ਹ ਰਹੇ ਹੋ, ਪ੍ਰਗਤੀ, ਅੱਗੇ ਪੜ੍ਹਨ ਲਈ, ਲੜੀ, ਮਨਪਸੰਦ, ਇੱਕ ਹਾਈਲਾਈਟ ਅਤੇ ਅੰਕੜਿਆਂ ਵਿੱਚ ਲਾਇਬ੍ਰੇਰੀ। ਇੱਕ ਬੈਟਰੀ ਵਿਜੇਟ ਵੀ ਹੈ।\n\nਇਹਨਾਂ ਨੂੰ ਮੀਨੂ ਵਿੱਚ “ਹੋਮ ਸਕ੍ਰੀਨ ਸੋਧੋ” (ਜਾਂ ਹੋਮ ਸਕ੍ਰੀਨ ਨੂੰ ਦਬਾਈ ਰੱਖ ਕੇ), ਫਿਰ “ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ” ਨਾਲ ਜੋੜੋ। ਹਰ ਇੱਕ ਦੀਆਂ ਆਪਣੀਆਂ ਸੈਟਿੰਗਾਂ ਹਨ, ਜਿਵੇਂ ਫ਼ਰੇਮ, ਆਕਾਰ ਅਤੇ ਇਕਸਾਰਤਾ। ਬਦਲਣ ਵਾਲਾ ਵਿਜੇਟ, ਜਿਵੇਂ ਅੱਜ ਦਾ ਹਵਾਲਾ, ਚੁਣਨ 'ਤੇ ਅਗਲਾ ਦਿਖਾਉਂਦਾ ਹੈ। ਤੁਹਾਡੇ ਆਪਣੇ ਹਵਾਲੇ ਕਾਰਡ 'ਤੇ .paperpaw/plugins/widgets ਵਿੱਚ quotes.txt ਵਿੱਚ ਜਾਂਦੇ ਹਨ, ਹਰ ਲਾਈਨ ਟੈਕਸਟ | ਲੇਖਕ ਵਜੋਂ। ਸਮੇਂ ਵਾਲੇ ਵਿਜੇਟਾਂ ਲਈ ਘੜੀ ਸੈੱਟ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ; Wi-Fi ਇਸ ਨੂੰ ਸੈੱਟ ਕਰਦਾ ਹੈ।"
widgets.time.unknown = ਸਮਾਂ ਹਾਲੇ ਪਤਾ ਨਹੀਂ। Wi-Fi ਘੜੀ ਸੈੱਟ ਕਰਦਾ ਹੈ।
