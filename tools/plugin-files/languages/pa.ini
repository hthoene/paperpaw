puzzles.plugin.name = ਪਹੇਲੀਆਂ
puzzles.plugin.description = ਸੁਡੋਕੂ, ਕ੍ਰਾਸਵਰਡ ਅਤੇ ਸ਼ਤਰੰਜ ਪਹੇਲੀਆਂ, ਆਫ਼ਲਾਈਨ, ਅੱਜ ਦੀ ਪਹੇਲੀ ਸਮੇਤ।
puzzles.plugin.how = "ਰੇਲ ਅਤੇ ਉਡੀਕ ਲਈ ਪਹੇਲੀਆਂ, ਸਭ ਆਫ਼ਲਾਈਨ: ਸੁਡੋਕੂ, ਕ੍ਰਾਸਵਰਡ ਅਤੇ ਸ਼ਤਰੰਜ ਪਹੇਲੀਆਂ। ਟੂਲ ਮੀਨੂ ਤੋਂ “ਪਹੇਲੀਆਂ” ਖੋਲ੍ਹੋ, ਜਾਂ ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ “ਅੱਜ ਦੀ ਪਹੇਲੀ” ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ: ਇਹ ਅੱਜ ਦੇ ਸੁਡੋਕੂ ਦੀ ਪ੍ਰਗਤੀ ਦਿਖਾਉਂਦਾ ਹੈ, ਟੈਪ ਇਸ ਨੂੰ ਖੋਲ੍ਹਦਾ ਹੈ। ਅੱਜ ਦਾ ਸੁਡੋਕੂ ਸਾਰਾ ਦਿਨ ਇੱਕੋ ਰਹਿੰਦਾ ਹੈ।\n\nਸੁਡੋਕੂ: ਖੱਬੇ/ਸੱਜੇ ਕਰਸਰ ਨੂੰ ਇੱਕ ਖਾਨਾ, ਉੱਪਰ/ਹੇਠਾਂ (ਪੰਨਾ ਬਟਨ) ਇੱਕ ਕਤਾਰ ਹਿਲਾਉਂਦੇ ਹਨ। “ਚੁਣੋ” ਅੰਕ ਖੋਲ੍ਹਦਾ ਹੈ: ਅੰਕ ਚੁਣ ਕੇ ਫਿਰ “ਚੁਣੋ” ਨਾਲ ਭਰੋ, ਜਾਂ “ਸਾਫ਼ ਕਰੋ” ਨਾਲ ਖਾਨਾ ਖਾਲੀ ਕਰੋ। “ਚੁਣੋ” (ਜਾਂ “ਮੀਨੂ”) ਦਬਾਈ ਰੱਖ ਕੇ ਬੋਰਡ ਹੇਠਲੇ ਬਟਨਾਂ 'ਤੇ ਜਾਓ: “ਨੋਟ” ਅੰਕਾਂ ਨੂੰ ਪੈਨਸਿਲ ਨਿਸ਼ਾਨ ਬਣਾਉਂਦਾ ਹੈ, “ਜਾਂਚੋ” ਗਲਤ ਖਾਨੇ ਚਿੰਨ੍ਹਿਤ ਕਰਦਾ ਹੈ, “ਵਾਪਸ ਲਓ” ਆਖਰੀ ਚਾਲ ਵਾਪਸ ਲੈਂਦਾ ਹੈ, “ਨਵਾਂ” ਚੁਣੇ ਪੱਧਰ (ਆਸਾਨ, ਦਰਮਿਆਨਾ, ਔਖਾ) ਦੀ ਪਹੇਲੀ ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ। ਹਰ ਪਹੇਲੀ ਦਾ ਇੱਕੋ ਹੱਲ ਹੈ। ਛੱਡਣ 'ਤੇ ਖੇਡ ਰੱਖੀ ਜਾਂਦੀ ਹੈ। ਟੱਚ ਸਕ੍ਰੀਨ 'ਤੇ ਖਾਨੇ 'ਤੇ ਟੈਪ ਕਰੋ।\n\nਕ੍ਰਾਸਵਰਡ: .puz (Across Lite) ਜਾਂ .ipuz ਫ਼ਾਈਲਾਂ ਮੈਮਰੀ ਕਾਰਡ ਦੇ “puzzles” ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ; ਕੋਈ ਨਾਲ ਨਹੀਂ ਆਉਂਦੀ। ਗਰਿੱਡ 'ਤੇ ਚੱਲੋ, ਫਿਰ ਕਰਸਰ ਵਾਲਾ ਸ਼ਬਦ ਕੀਬੋਰਡ 'ਤੇ ਲਿਖਣ ਲਈ ਚੁਣੋ (_ ਖਾਨਾ ਖਾਲੀ ਛੱਡਦਾ ਹੈ)। ਬਟਨ ਲੇਟਵਾਂ/ਖੜ੍ਹਵਾਂ ਬਦਲਦੇ, ਸੰਕੇਤ ਦਿਖਾਉਂਦੇ, ਅੱਖਰ ਜਾਂਚਦੇ ਅਤੇ ਸ਼ਬਦ ਦੱਸਦੇ ਹਨ। ਅੱਖਰ ਹਰ ਫ਼ਾਈਲ ਲਈ ਰੱਖੇ ਜਾਂਦੇ ਹਨ। ਇਨਕ੍ਰਿਪਟ ਕੀਤੀਆਂ .puz ਫ਼ਾਈਲਾਂ ਨਹੀਂ ਖੁੱਲ੍ਹਦੀਆਂ।\n\nਸ਼ਤਰੰਜ ਪਹੇਲੀਆਂ: Lichess ਡਾਟਾਬੇਸ (CC0) ਤੋਂ ਇੱਕ ਛੋਟਾ ਸੈੱਟ। ਖੱਬੇ/ਸੱਜੇ ਮੋਹਰੇ ਤੋਂ ਮੋਹਰੇ 'ਤੇ ਜਾਂਦੇ ਹਨ; ਚਲਾਉਣ ਵਾਲਾ ਮੋਹਰਾ ਚੁਣੋ, ਫਿਰ ਖੱਬੇ/ਸੱਜੇ ਨਾਲ ਉਸ ਦੀ ਮੰਜ਼ਿਲ ਚੁਣ ਕੇ ਫਿਰ “ਚੁਣੋ” ਦਬਾਓ। ਗਲਤ ਚਾਲ ਵਾਪਸ ਲਈ ਜਾਂਦੀ ਹੈ। “ਸੰਕੇਤ” ਚਲਾਉਣ ਵਾਲਾ ਮੋਹਰਾ ਦੱਸਦਾ ਹੈ, “ਅੱਗੇ” ਅਗਲੀ ਪਹੇਲੀ 'ਤੇ ਜਾਂਦਾ ਹੈ।\n\nਬੋਰਡ ਸਿਰਫ਼ ਬਦਲੇ ਖਾਨੇ ਦੁਬਾਰਾ ਬਣਾਉਂਦਾ ਹੈ। “ਅੰਕੜੇ” ਹੱਲ ਕੀਤੀਆਂ ਪਹੇਲੀਆਂ ਗਿਣਦਾ ਹੈ।"
