notes-overview.export.help = ਸਾਰੇ ਨੋਟ ਇੱਕ ਫ਼ਾਈਲ ਵਿੱਚ, ਈ-ਰੀਡਰਾਂ ਵਾਲੇ My Clippings.txt ਫ਼ਾਰਮੈਟ ਵਿੱਚ, ਲਾਇਬ੍ਰੇਰੀ ਦੇ ਨਾਲ ਵਾਲੇ “Exports” ਫ਼ੋਲਡਰ ਵਿੱਚ।
notes-overview.export.help.more = ਸਾਰੇ ਨੋਟ ਇੱਕ ਫ਼ਾਈਲ ਵਿੱਚ, ਈ-ਰੀਡਰਾਂ ਵਾਲੇ My Clippings.txt ਫ਼ਾਰਮੈਟ ਵਿੱਚ, ਲਾਇਬ੍ਰੇਰੀ ਦੇ ਨਾਲ ਵਾਲੇ “Exports” ਫ਼ੋਲਡਰ ਵਿੱਚ। ਸੂਚੀ 200 ਕਿਤਾਬਾਂ ਦਿਖਾਉਂਦੀ ਹੈ, ਫ਼ਾਈਲ ਵਿੱਚ ਸਾਰੀਆਂ ਹਨ।
