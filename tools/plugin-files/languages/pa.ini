file-manager.plugin.name = ਫ਼ਾਈਲ ਮੈਨੇਜਰ
file-manager.plugin.description = ਡੀਵਾਈਸ ਦਾ ਹਰ ਫ਼ੋਲਡਰ ਅਤੇ ਫ਼ਾਈਲ: ਖੋਲ੍ਹੋ, ਨਾਂ ਬਦਲੋ, ਲਿਜਾਓ, ਕਾਪੀ ਕਰੋ ਅਤੇ ਮਿਟਾਓ।
file-manager.plugin.how = "ਫ਼ਾਈਲ ਮੈਨੇਜਰ ਡੀਵਾਈਸ ਦੀ ਸਟੋਰੇਜ ਦਾ ਹਰ ਫ਼ੋਲਡਰ ਅਤੇ ਫ਼ਾਈਲ ਦਿਖਾਉਂਦਾ ਹੈ, ਸਿਰਫ਼ ਤੁਹਾਡੀਆਂ ਕਿਤਾਬਾਂ ਨਹੀਂ, ਅਤੇ ਤੁਸੀਂ ਉਹਨਾਂ ਨੂੰ ਖੋਲ੍ਹ ਸਕਦੇ ਹੋ, ਨਾਂ ਬਦਲ ਸਕਦੇ ਹੋ, ਲਿਜਾ, ਕਾਪੀ ਕਰ ਅਤੇ ਮਿਟਾ ਸਕਦੇ ਹੋ, ਅਤੇ ਨਵੇਂ ਫ਼ੋਲਡਰ ਬਣਾ ਸਕਦੇ ਹੋ।\n\n“ਟੂਲ” ਮੀਨੂ ਤੋਂ “ਫ਼ਾਈਲਾਂ” ਖੋਲ੍ਹੋ। ਫ਼ੋਲਡਰ ਵਿੱਚ ਜਾਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ; “ਵਾਪਸ” ਉੱਪਰਲੇ ਫ਼ੋਲਡਰ ਵਿੱਚ ਲੈ ਜਾਂਦਾ ਹੈ। ਫ਼ਾਈਲ 'ਤੇ ਟੈਪ ਕਰੋ, ਜਾਂ ਕੋਈ ਐਂਟਰੀ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ), ਤਾਂ ਦਿਸਦਾ ਹੈ ਕਿ ਉਸ ਨਾਲ ਕੀ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ। “ਲਿਜਾਓ” ਅਤੇ “ਕਾਪੀ ਕਰੋ” ਐਂਟਰੀ ਨੂੰ ਚੁੱਕ ਲੈਂਦੇ ਹਨ: ਜਿਸ ਫ਼ੋਲਡਰ ਵਿੱਚ ਉਸ ਨੂੰ ਰੱਖਣਾ ਹੈ ਉੱਥੇ ਜਾਓ ਅਤੇ ਹੇਠਲੀ ਪੱਟੀ ਵਿੱਚ “ਇੱਥੇ ਪੇਸਟ ਕਰੋ” ਚੁਣੋ। ਬਟਨਾਂ ਨਾਲ, ਪੱਟੀ ਤੱਕ ਪਹੁੰਚਣ ਲਈ ਆਖਰੀ ਐਂਟਰੀ ਤੋਂ “ਹੇਠਾਂ” ਦਬਾਓ।\n\nਬਿੰਦੀ ਨਾਲ ਸ਼ੁਰੂ ਹੋਣ ਵਾਲੀਆਂ ਫ਼ਾਈਲਾਂ ਅਤੇ ਫ਼ੋਲਡਰ, ਜਿਵੇਂ PaperPaw ਦਾ ਆਪਣਾ ਡਾਟਾ, ਲੁਕੇ ਹੁੰਦੇ ਹਨ। ਉਹਨਾਂ ਨੂੰ ਦੇਖਣ ਲਈ ਸੈਟਿੰਗਾਂ › ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ “ਲੁਕੀਆਂ ਫ਼ਾਈਲਾਂ” ਚਾਲੂ ਕਰੋ।"
