diagnostics.plugin.name = ਡਾਇਗਨੌਸਟਿਕਸ
diagnostics.plugin.description = ਇੱਕ ਟੈਸਟ ਸਕ੍ਰੀਨ ਅਤੇ ਡੀਵਾਈਸ ਦੇ ਹਰ ਹਿੱਸੇ ਦੀ ਕਦਮ-ਦਰ-ਕਦਮ ਜਾਂਚ।
diagnostics.plugin.how = "ਡਾਇਗਨੌਸਟਿਕਸ ਡੀਵਾਈਸ ਦੀ ਜਾਂਚ ਲਈ ਟੈਸਟ ਸਕ੍ਰੀਨ ਹੈ: ਇਹ ਪੈਨਲ ਦਾ ਹਰ ਸਲੇਟੀ ਪੱਧਰ, ਬਟਨ ਅਤੇ ਟੱਚ ਅਜ਼ਮਾਉਣ ਲਈ ਚਾਰ ਖਾਨੇ, ਅਤੇ ਰਿਫ੍ਰੈਸ਼ ਮੋਡਾਂ ਦੀ ਤੁਲਨਾ ਲਈ ਪ੍ਰਗਤੀ ਪੱਟੀ ਵਾਲਾ ਪੰਨਾ ਗਿਣਤੀਕਾਰ ਦਿਖਾਉਂਦੀ ਹੈ।\n\nਟੈਸਟ ਸਕ੍ਰੀਨ ਮੀਨੂ ਵਿੱਚ ਨਹੀਂ ਹੈ। ਇਹ ਤਾਂ ਹੀ ਹੋਮ ਸਕ੍ਰੀਨ ਹੁੰਦੀ ਹੈ ਜੇ ਕੋਈ ਹੋਰ ਪਲੱਗਇਨ ਹੋਮ ਸਕ੍ਰੀਨ ਨਾ ਦੇਵੇ, ਜਾਂ ਤੁਸੀਂ ਪਲੱਗਇਨ ਮੈਨੇਜਰ ਵਿੱਚ “ਸਕ੍ਰੀਨਾਂ” ਹੇਠ “ਹੋਮ ਸਕ੍ਰੀਨ” ਥਾਂ ਲਈ ਇਸ ਨੂੰ ਚੁਣੋ।\n\n“ਚੁਣੋ” ਫ਼ੋਕਸ ਵਾਲੇ ਖਾਨੇ 'ਤੇ ਨਿਸ਼ਾਨ ਲਾਉਂਦਾ ਹੈ ਅਤੇ ਤੀਰ ਬਟਨ ਖਾਨਿਆਂ ਵਿਚਕਾਰ ਜਾਂਦੇ ਹਨ; ਟੱਚ ਨਾਲ ਖਾਨੇ 'ਤੇ ਟੈਪ ਕਰੋ। ਪੰਨਾ ਬਟਨ ਟੈਸਟ ਪੰਨੇ ਪਲਟਦੇ ਹਨ। ਮੁੜ ਸ਼ੁਰੂ ਕਰਨ ਲਈ “ਚੁਣੋ” ਜਾਂ ਸਕ੍ਰੀਨ 'ਤੇ ਉਂਗਲ ਦਬਾਈ ਰੱਖੋ।\n\nਡੀਵਾਈਸ ਜਾਂਚ (“ਟੂਲ” ਹੇਠ, ਜਿੱਥੇ PaperPaw ਡੀਵਾਈਸ ਦਾ ਫ਼ਰਮਵੇਅਰ ਹੈ) ਹਰ ਹਿੱਸੇ ਨੂੰ ਇੱਕ-ਇੱਕ ਪੰਨੇ 'ਤੇ ਜਾਂਚਦੀ ਹੈ: ਸਕ੍ਰੀਨ, ਬਟਨ, ਟੱਚ, ਫ਼ਰੰਟਲਾਈਟ, ਬੈਟਰੀ, ਕਾਰਡ, ਘੜੀ, Wi-Fi, ਸਲੀਪ ਅਤੇ ਮੈਮਰੀ। ਹਰ ਪੰਨਾ “ਫ਼ੇਲ੍ਹ”, “ਛੱਡੋ” ਅਤੇ “ਪਾਸ” ਨਾਲ ਖਤਮ ਹੁੰਦਾ ਹੈ; ਮਾਪ ਮੁਤਾਬਕ ਜਵਾਬ ਪਹਿਲਾਂ ਹੀ ਚੁਣਿਆ ਹੁੰਦਾ ਹੈ। ਜੋ ਹਿੱਸੇ ਡੀਵਾਈਸ ਵਿੱਚ ਨਹੀਂ, ਉਹ ਛੱਡੇ ਜਾਂਦੇ ਹਨ। ਹਰ ਜਵਾਬ ਤੋਂ ਬਾਅਦ ਰਿਪੋਰਟ .paperpaw/plugins/diagnostics/device-check.txt ਵਿੱਚ ਲਿਖੀ ਜਾਂਦੀ ਹੈ, ਪੁੱਲ ਰਿਕਵੈਸਟ ਵਿੱਚ ਪੇਸਟ ਕਰਨ ਲਈ। “ਵਾਪਸ” ਨਾਲ ਬਾਹਰ ਆਓ; ਦੁਬਾਰਾ ਖੋਲ੍ਹਣ 'ਤੇ ਜਾਂਚ ਉੱਥੋਂ ਹੀ ਜਾਰੀ ਰਹਿੰਦੀ ਹੈ। ਸਿਰਫ਼ ਬਟਨਾਂ ਵਾਲੇ ਡੀਵਾਈਸ 'ਤੇ ਬਟਨ ਪੰਨੇ 'ਤੇ ਪਹਿਲਾਂ “ਸ਼ੁਰੂ ਕਰੋ” ਚੁਣੋ; ਉਦੋਂ ਤੱਕ ਤੀਰ, “ਚੁਣੋ” ਅਤੇ “ਵਾਪਸ” ਹਰ ਪੰਨੇ ਵਾਂਗ ਕੰਮ ਕਰਦੇ ਹਨ।"
