power.plugin.description = ਪਾਵਰ ਮੋਡ ਚੁਣਦਾ ਹੈ, ਹੱਥੀਂ ਜਾਂ ਬੈਟਰੀ ਮੁਤਾਬਕ: ਸਧਾਰਨ, ਬੱਚਤ, ਆਫ਼ਲਾਈਨ।
power.plugin.how = "“ਪਾਵਰ” ਚੁਣਦਾ ਹੈ ਕਿ PaperPaw ਬੈਟਰੀ ਕਿਵੇਂ ਖਰਚ ਕਰੇ: ਸਧਾਰਨ, ਬੱਚਤ ਜਾਂ ਆਫ਼ਲਾਈਨ। “ਬੱਚਤ” ਉਡੀਕ ਸਕਣ ਵਾਲੇ ਕੰਮ ਵਧੀਆ ਮੌਕਿਆਂ 'ਤੇ ਕਰਦਾ ਹੈ; “ਆਫ਼ਲਾਈਨ” ਰੇਡੀਓ ਬੰਦ ਰੱਖਦਾ ਹੈ। “ਸਵੈਚਲਿਤ” ਬੈਟਰੀ ਮੁਤਾਬਕ ਚੁਣਦਾ ਹੈ।\n\nਮੋਡ ਤਤਕਾਲ ਪੈਨਲ ਵਿੱਚ ਬਦਲੋ, ਜਿੱਥੇ “ਪਾਵਰ” ਮੋਡਾਂ ਨੂੰ ਨਾਲ-ਨਾਲ ਦਿਖਾਉਂਦਾ ਹੈ, ਜਾਂ “ਸੈਟਿੰਗਾਂ” ਵਿੱਚ “ਪਾਵਰ” ਹੇਠਾਂ। ਉੱਥੇ ਤੁਸੀਂ ਇਹ ਪੱਧਰ ਵੀ ਤੈਅ ਕਰਦੇ ਹੋ ਜਿਨ੍ਹਾਂ 'ਤੇ “ਸਵੈਚਲਿਤ” ਬੱਚਤ ਅਤੇ ਆਫ਼ਲਾਈਨ 'ਤੇ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਕੀ ਚਾਰਜ ਹੋਣ ਦੌਰਾਨ ਇਹ ਸਧਾਰਨ ਰਹੇ।\n\nਸਥਿਤੀ ਪੱਟੀਆਂ ਵਿੱਚ “ਪਾਵਰ ਮੋਡ” ਬੱਚਤ ਦੌਰਾਨ ਪੱਤਾ ਅਤੇ ਆਫ਼ਲਾਈਨ ਦੌਰਾਨ ਕੱਟਿਆ ਹੋਇਆ Wi-Fi ਦਿਖਾਉਂਦਾ ਹੈ, ਅਤੇ ਸਧਾਰਨ ਵਿੱਚ ਕੁਝ ਨਹੀਂ।\n\nਛੋਟਾ ਮੀਨੂ ਖੋਲ੍ਹਣ ਲਈ ਪਾਵਰ ਬਟਨ ਦਬਾਈ ਰੱਖੋ: ਸਲੀਪ, ਬੰਦ ਕਰੋ (ਜਿੱਥੇ PaperPaw ਕਰ ਸਕਦਾ ਹੈ), ਮੁੜ-ਚਾਲੂ ਕਰੋ, ਅਤੇ ਟੱਚ ਡੀਵਾਈਸਾਂ 'ਤੇ ਟੱਚ ਲੌਕ ਕਰੋ ਜਾਂ ਟੱਚ ਅਨਲੌਕ ਕਰੋ। ਥੋੜ੍ਹਾ ਦਬਾਉਣ ਨਾਲ ਡੀਵਾਈਸ ਪਹਿਲਾਂ ਵਾਂਗ ਸਲੀਪ ਵਿੱਚ ਜਾਂਦਾ ਹੈ। “ਵਾਪਸ” ਮੀਨੂ ਤੋਂ ਬਾਹਰ ਆਉਂਦਾ ਹੈ।"
