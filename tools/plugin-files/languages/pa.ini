fonts-browser.plugin.name = ਹੋਰ ਫ਼ੌਂਟ
fonts-browser.plugin.description = ਇੰਟਰਨੈੱਟ ਤੋਂ ਫ਼ੌਂਟ ਦਿਖਾਉਂਦਾ ਹੈ, ਹਰ ਇੱਕ ਨਮੂਨੇ ਨਾਲ, ਅਤੇ ਪੜ੍ਹਨ ਲਈ ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ।
fonts-browser.plugin.how = "“ਹੋਰ ਫ਼ੌਂਟ” ਇੰਟਰਨੈੱਟ ਦੀ ਇੱਕ ਫ਼ੌਂਟ ਲਾਇਬ੍ਰੇਰੀ ਦੇ ਫ਼ੌਂਟ ਦਿਖਾਉਂਦਾ ਹੈ, ਹਰ ਨਾਂ ਉਸ ਦੇ ਆਪਣੇ ਫ਼ੌਂਟ ਵਿੱਚ, ਅਤੇ ਜੋ ਤੁਸੀਂ ਚਾਹੋ ਉਹ ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ।\n\nਇਹ ਸੈਟਿੰਗਾਂ › ਪੜ੍ਹਨਾ › ਫ਼ੌਂਟ ਵਿੱਚ ਫ਼ੌਂਟ ਸੂਚੀ ਦੇ ਅੰਤ ਵਿੱਚ ਹੈ; ਸਥਿਤੀ ਪੱਟੀਆਂ ਦੇ ਫ਼ੌਂਟ ਲਈ ਵੀ ਇਹੀ ਐਂਟਰੀ ਹੈ। ਨਮੂਨਾ ਵਾਕ ਨਾਲ ਵੱਡਾ ਦੇਖਣ ਲਈ ਫ਼ੌਂਟ 'ਤੇ ਟੈਪ ਕਰੋ (ਬਟਨਾਂ ਨਾਲ “ਚੁਣੋ”), ਫਿਰ “ਡਾਊਨਲੋਡ ਕਰੋ” ਚੁਣੋ; ਇਸ ਦੌਰਾਨ ਤੁਸੀਂ ਪੰਨਾ ਛੱਡ ਸਕਦੇ ਹੋ। ਫਿਰ “(ਨਾਂ) ਨਾਲ ਪੜ੍ਹੋ” ਜਾਂ “ਸਥਿਤੀ ਪੱਟੀਆਂ ਲਈ ਵਰਤੋ” ਚੁਣੋ। “ਅੱਪਡੇਟ ਕਰੋ” ਨਵਾਂ ਵਰਜਨ ਲਿਆਉਂਦਾ ਹੈ, “ਹਟਾਓ” ਫ਼ੌਂਟ ਮਿਟਾਉਂਦਾ ਹੈ। Wi-Fi ਚਾਹੀਦਾ ਹੈ।\n\nਤੁਹਾਡੇ ਆਪਣੇ ਫ਼ੌਂਟ\n\nਆਪਣਾ ਫ਼ੌਂਟ .ttf ਜਾਂ .otf ਫ਼ਾਈਲ ਹੁੰਦਾ ਹੈ, ਜਿਵੇਂ Google Fonts ਤੋਂ।\n\nAndroid ਅਤੇ ਫ਼ੌਂਟ ਫ਼ਾਈਲਾਂ ਵਰਤਣ ਵਾਲੇ ਹੋਰ ਡੀਵਾਈਸਾਂ 'ਤੇ: ਫ਼ਾਈਲ fonts ਫ਼ੋਲਡਰ ਵਿੱਚ ਕਾਪੀ ਕਰੋ (Android 'ਤੇ ਸਾਂਝੀ ਸਟੋਰੇਜ ਵਿੱਚ PaperPaw/fonts), PaperPaw ਮੁੜ-ਚਾਲੂ ਕਰੋ ਅਤੇ ਸੈਟਿੰਗਾਂ › ਪੜ੍ਹਨਾ › ਫ਼ੌਂਟ ਵਿੱਚ ਚੁਣੋ।\n\nXteink X4 ਅਤੇ X4 Pro ਫ਼ੌਂਟ ਫ਼ਾਈਲਾਂ ਦੀ ਥਾਂ ਫ਼ੌਂਟ ਪੈਕ ਪੜ੍ਹਦੇ ਹਨ, ਕਿਉਂਕਿ ਫ਼ਾਈਲਾਂ ਮੈਮਰੀ ਵਿੱਚ ਨਹੀਂ ਸਮਾਉਂਦੀਆਂ। ਕੰਪਿਊਟਰ 'ਤੇ paperpaw-fontgen ਨਾਲ ਪੈਕ ਬਣਾਓ, ਹਰ ਸਟਾਈਲ ਲਈ (regular ਲਾਜ਼ਮੀ ਹੈ):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nਇਹ plugins/font-my-font ਫ਼ੋਲਡਰ ਬਣਾਉਂਦਾ ਹੈ। ਇਸ ਨੂੰ ਮੈਮਰੀ ਕਾਰਡ ਦੇ plugins ਫ਼ੋਲਡਰ ਵਿੱਚ ਕਾਪੀ ਕਰੋ, ਮੁੜ-ਚਾਲੂ ਕਰੋ ਅਤੇ “ਫ਼ੌਂਟ” ਵਿੱਚ My Font ਚੁਣੋ। ਛੱਡੇ ਸਟਾਈਲ regular ਵਿੱਚ ਬਣਦੇ ਹਨ। ਟੂਲ ਦੱਸਦਾ ਹੈ ਕਿ ਮੰਗੇ ਅੱਖਰਾਂ ਵਿੱਚੋਂ ਫ਼ੌਂਟ ਵਿੱਚ ਕਿੰਨੇ ਹਨ (--chars latin,cyrillic,greek ਲਿਪੀਆਂ ਜੋੜਦਾ ਹੈ): ਆਪਣੀ ਕਿਤਾਬ ਦੀ ਲਿਪੀ ਵਾਲਾ ਫ਼ੌਂਟ ਲੱਭੋ। “ਹੋਰ ਫ਼ੌਂਟ” ਦੇ ਫ਼ੌਂਟ ਬਿਨਾਂ ਕੰਪਿਊਟਰ ਇਸੇ ਤਰ੍ਹਾਂ ਕੰਮ ਕਰਦੇ ਹਨ।\n\ne-ink 'ਤੇ ਛੋਟੇ ਟੈਕਸਟ ਨੂੰ ਵਧੇਰੇ ਸਾਫ਼ ਕਰਨ ਲਈ ਕਮਾਂਡ ਵਿੱਚ --hinting light ਜੋੜੋ: ਇਹ ਅੱਖਰਾਂ ਨੂੰ ਪਿਕਸਲ ਗਰਿੱਡ ਨਾਲ ਮਿਲਾਉਂਦਾ ਹੈ, ਮਿਆਰੀ ਫ਼ੌਂਟਾਂ ਵਾਂਗ; --hinting normal ਅਤੇ mono ਹੋਰ ਜ਼ੋਰ ਨਾਲ। ਮਾਤਰਾਵਾਂ ਵਾਲੀਆਂ ਲਿਪੀਆਂ, ਜਿਵੇਂ ਅਰਬੀ ਜਾਂ ਦੇਵਨਾਗਰੀ, ਲਈ ਇਸ ਤੋਂ ਬਿਨਾਂ ਬਿਹਤਰ ਹੈ।"
