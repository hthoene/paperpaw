dictionary.plugin.name = ਸ਼ਬਦਕੋਸ਼
dictionary.plugin.description = StarDict ਸ਼ਬਦਕੋਸ਼ਾਂ ਵਿੱਚ ਸ਼ਬਦਾਂ ਦੇ ਅਰਥ ਲੱਭਦਾ ਹੈ।
dictionary.plugin.how = "ਸ਼ਬਦਕੋਸ਼ ਕਿਤਾਬ ਦੇ ਕਿਸੇ ਸ਼ਬਦ ਨੂੰ StarDict ਸ਼ਬਦਕੋਸ਼ਾਂ ਵਿੱਚ ਲੱਭਦਾ ਹੈ ਅਤੇ ਅਰਥ ਸਕ੍ਰੀਨ ਦੇ ਹੇਠਲੇ ਹਿੱਸੇ ਉੱਤੇ ਇੱਕ ਪੈਨਲ ਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ।\n\nਰੀਡਰ ਵਿੱਚ ਸ਼ਬਦ ਦਬਾਈ ਰੱਖੋ ਅਤੇ “ਅਰਥ ਦੇਖੋ” ਚੁਣੋ; ਬਟਨਾਂ ਨਾਲ “ਹੋਰ” ਹੇਠ “ਟੈਕਸਟ ਚੁਣੋ” ਵਰਤੋ। ਸ਼ਬਦਕੋਸ਼ ਫ਼ੋਲਡਰ (.ifo, .idx ਅਤੇ .dict ਫ਼ਾਈਲਾਂ ਵਾਲੇ) ਡੀਵਾਈਸ ਦੇ “dictionaries” ਫ਼ੋਲਡਰ ਵਿੱਚ ਕਾਪੀ ਕਰੋ (ਸਬ-ਫ਼ੋਲਡਰਾਂ ਸਮੇਤ), ਜਾਂ ਸੈਟਿੰਗਾਂ › ਪੜ੍ਹਨਾ ਵਿੱਚ “ਸ਼ਬਦਕੋਸ਼ ਫ਼ੋਲਡਰ” (ਉੱਨਤ ਸੈਟਿੰਗ) 'ਤੇ ਕੋਈ ਹੋਰ ਫ਼ੋਲਡਰ ਚੁਣੋ। ਪਹਿਲੀ ਵਾਰ ਅਰਥ ਲੱਭਣ 'ਤੇ ਹਰ ਸ਼ਬਦਕੋਸ਼ ਲਈ ਇੱਕ ਛੋਟਾ ਇੰਡੈਕਸ ਬਣਦਾ ਹੈ, ਇਸ ਵਿੱਚ ਥੋੜ੍ਹਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ।\n\nਪੈਨਲ ਵਿੱਚ ਪੰਨਾ ਬਟਨ ਜਾਂ “ਉੱਪਰ” ਅਤੇ “ਹੇਠਾਂ” ਲੰਮੇ ਅਰਥ ਸਕ੍ਰੋਲ ਕਰਦੇ ਹਨ, ਅਤੇ “ਵਾਪਸ” ਇਸ ਨੂੰ ਬੰਦ ਕਰਦਾ ਹੈ। ਟੱਚ ਨਾਲ, ਬੰਦ ਕਰਨ ਲਈ ਇਸ ਤੋਂ ਬਾਹਰ ਟੈਪ ਕਰੋ।"
