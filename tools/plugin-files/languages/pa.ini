menu-editor.plugin.name = ਮੀਨੂ ਸੰਪਾਦਕ
menu-editor.plugin.description = ਹਰ ਮੀਨੂ ਦੀਆਂ ਐਂਟਰੀਆਂ ਦੀ ਤਰਤੀਬ ਬਦਲਦਾ, ਹਟਾਉਂਦਾ ਅਤੇ ਸ਼ਾਮਲ ਕਰਦਾ ਹੈ।
menu-editor.plugin.how = "ਮੀਨੂ ਸੰਪਾਦਕ ਬਦਲਦਾ ਹੈ ਕਿ ਮੀਨੂ ਵਿੱਚ ਕੀ ਹੈ: ਐਂਟਰੀਆਂ ਉੱਪਰ ਜਾਂ ਹੇਠਾਂ ਕਰੋ, ਹਟਾਓ, ਜਾਂ ਨਵੀਆਂ ਸ਼ਾਮਲ ਕਰੋ।\n\nਇਹ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਵਿਉਂਤਬੱਧ ਕਰੋ” ਹੇਠਾਂ “ਮੀਨੂ ਵਿਉਂਤਬੱਧ ਕਰੋ” ਵਜੋਂ ਮਿਲਦਾ ਹੈ। ਕੋਈ ਮੀਨੂ ਚੁਣੋ, ਫਿਰ ਥਾਂ ਬਦਲਣ ਜਾਂ ਹਟਾਉਣ ਲਈ ਕੋਈ ਐਂਟਰੀ; “ਐਂਟਰੀ ਸ਼ਾਮਲ ਕਰੋ” ਨਵੀਂ ਪਾਉਂਦਾ ਹੈ। ਤਬਦੀਲੀਆਂ ਤੁਰੰਤ ਲਾਗੂ ਹੁੰਦੀਆਂ ਹਨ। “ਇਹ ਮੀਨੂ ਰੀਸੈੱਟ ਕਰੋ” ਮੀਨੂ ਨੂੰ ਉਸ ਦੇ ਪਲੱਗਇਨਾਂ ਵਾਲੇ ਰੂਪ 'ਤੇ ਵਾਪਸ ਲਿਆਉਂਦਾ ਹੈ, “ਸਾਰੇ ਮੀਨੂ ਰੀਸੈੱਟ ਕਰੋ” ਹਰ ਮੀਨੂ ਲਈ ਇਹ ਕਰਦਾ ਹੈ।\n\nਤੁਸੀਂ ਆਪਣੇ-ਆਪ ਨੂੰ ਬਾਹਰ ਨਹੀਂ ਕਰ ਸਕਦੇ: ਜੋ ਐਂਟਰੀ ਸੈਟਿੰਗਾਂ ਤੱਕ ਜਾਣ ਦਾ ਰਾਹ ਹੈ, ਉਹ ਉਦੋਂ ਤੱਕ ਰਹਿੰਦੀ ਹੈ ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਉੱਥੇ ਜਾਣ ਦਾ ਕੋਈ ਹੋਰ ਰਾਹ ਸ਼ਾਮਲ ਨਹੀਂ ਕਰਦੇ।"
