vocabulary.sd.mirror.help = ਹਟਾਓ: {file} ਵਿੱਚੋਂ ਮਿਟਾਇਆ ਕਾਰਡ ਅਗਲੇ ਅੱਪਡੇਟ 'ਤੇ ਆਪਣੀ ਪ੍ਰਗਤੀ ਸਮੇਤ ਹਮੇਸ਼ਾ ਲਈ ਹਟ ਜਾਂਦਾ ਹੈ। ਰੱਖੋ: ਇਹ ਰਹਿੰਦਾ ਹੈ।
vocabulary.sd.saving = {file} ਰੱਖਿਅਤ ਹੋ ਰਹੀ ਹੈ
