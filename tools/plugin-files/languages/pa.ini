wallabag.unreachable = Wallabag ਤੱਕ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ। Wi-Fi ਕਨੈਕਸ਼ਨ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
wallabag.unreadable = Wallabag ਇਸ ਡੀਵਾਈਸ 'ਤੇ ਲਿਆਂਦੇ ਲੇਖਾਂ ਦੀ ਆਪਣੀ ਸੂਚੀ ਨਹੀਂ ਪੜ੍ਹ ਸਕਦਾ, ਇਸ ਲਈ ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ ਗਿਆ।
wallabag.not-kept = Wallabag ਪਾਸਵਰਡ ਜਾਂ ਸੀਕ੍ਰੇਟ ਰੱਖ ਨਹੀਂ ਸਕਿਆ। ਜਾਂਚੋ ਕਿ ਇਹ ਬਹੁਤ ਲੰਮਾ ਨਾ ਹੋਵੇ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
weather.plugin.name = ਮੌਸਮ
weather.plugin.description = ਹੁਣ ਦਾ ਅਤੇ ਅਗਲੇ ਦਿਨਾਂ ਦਾ ਮੌਸਮ ਵਿਜੇਟਾਂ ਵਜੋਂ, Open-Meteo ਤੋਂ।
weather.plugin.how = "ਮੌਸਮ ਹੋਮ ਸਕ੍ਰੀਨ ਲਈ ਵਿਜੇਟਾਂ ਵਜੋਂ ਹੁਣ ਦਾ ਅਤੇ ਅਗਲੇ ਦਿਨਾਂ ਦਾ ਮੌਸਮ ਦਿਖਾਉਂਦਾ ਹੈ, Open-Meteo ਤੋਂ, ਜਿਸ ਲਈ ਕੋਈ ਖਾਤਾ ਜਾਂ ਕੁੰਜੀ ਨਹੀਂ ਚਾਹੀਦੀ। “ਹੁਣ ਦਾ ਮੌਸਮ” ਤਾਪਮਾਨ, ਹਾਲਤ ਅਤੇ ਚੁਣਨ ਲਈ ਹੋਰ ਚੀਜ਼ਾਂ ਦਿਖਾਉਂਦਾ ਹੈ; “ਪੂਰਵ-ਅਨੁਮਾਨ” ਅਗਲੇ ਦਿਨ ਇੱਕ ਕਤਾਰ ਜਾਂ ਸੂਚੀ ਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ।\n\nਪਹਿਲਾਂ ਥਾਂ ਚੁਣੋ: ਸੈਟਿੰਗਾਂ ਵਿੱਚ, ਮੌਸਮ ਹੇਠਾਂ, ਥਾਂ (ਨਾਂ ਲਿਖੋ, ਫਿਰ ਮਿਲੀਆਂ ਥਾਵਾਂ ਵਿੱਚੋਂ ਚੁਣੋ)। ਸਿਰਫ਼ ਇਸ ਦੇ ਨਿਰਦੇਸ਼-ਅੰਕ ਭੇਜੇ ਜਾਂਦੇ ਹਨ, ਅਤੇ ਸਿਰਫ਼ ਉਦੋਂ ਜਦੋਂ ਕੋਈ ਮੌਸਮ ਵਿਜੇਟ ਦਿਸਦਾ ਹੋਵੇ। ਵਿਜੇਟ ਹੋਮ ਸਕ੍ਰੀਨ ਨੂੰ ਸੋਧ ਕੇ ਸ਼ਾਮਲ ਕਰੋ।\n\nਮੌਸਮ ਵੱਧ ਤੋਂ ਵੱਧ ਓਨੀ ਵਾਰ ਲਿਆਂਦਾ ਜਾਂਦਾ ਹੈ ਜਿੰਨਾ “ਵੱਧ ਤੋਂ ਵੱਧ ਹਰ ਇੰਨੇ ਸਮੇਂ ਬਾਅਦ ਅੱਪਡੇਟ” ਕਹਿੰਦਾ ਹੈ, ਅਤੇ ਸਿਰਫ਼ ਨੈੱਟਵਰਕ ਹੋਣ 'ਤੇ: ਇਹ ਕਦੇ ਆਪਣੇ ਆਪ Wi-Fi ਚਾਲੂ ਨਹੀਂ ਕਰਦਾ।\n\nਮੌਸਮ ਡਾਟਾ Open-Meteo.com (https://open-meteo.com) ਤੋਂ, Creative Commons Attribution 4.0 ਲਾਇਸੈਂਸ (CC BY 4.0) ਅਧੀਨ।"
