format-cbz.plugin.name = ਕਾਮਿਕ ਕਿਤਾਬਾਂ
format-cbz.plugin.description = ਕਾਮਿਕ ਕਿਤਾਬ ਆਰਕਾਈਵ (.cbz) ਖੋਲ੍ਹਦਾ ਹੈ, ਹਰ ਪੰਨੇ 'ਤੇ ਇੱਕ ਤਸਵੀਰ।
format-cbz.plugin.how = "ਕਾਮਿਕ ਕਿਤਾਬ ਆਰਕਾਈਵ (.cbz) ਖੋਲ੍ਹਦਾ ਹੈ: ਹਰ ਪੰਨੇ 'ਤੇ ਇੱਕ ਤਸਵੀਰ, ਸਕ੍ਰੀਨ ਮੁਤਾਬਕ, ਨਾਂਵਾਂ ਦੇ ਕ੍ਰਮ ਵਿੱਚ (2 ਪਹਿਲਾਂ, 10 ਬਾਅਦ ਵਿੱਚ)।\n\nਉਹਨਾਂ ਨੂੰ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਖੋਲ੍ਹੋ; ਪੰਨੇ ਕਿਸੇ ਵੀ ਕਿਤਾਬ ਵਾਂਗ ਪਲਟੋ। ਵੱਡੀਆਂ ਤਸਵੀਰਾਂ ਨੂੰ ਪਹਿਲੀ ਵਾਰ ਥੋੜ੍ਹਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ, X4 'ਤੇ ਹੋਰਾਂ ਨਾਲੋਂ ਵੱਧ।\n\nਪੜ੍ਹਨ ਦੀਆਂ ਸੈਟਿੰਗਾਂ (ਸੈਟਿੰਗਾਂ › ਪੜ੍ਹਨਾ): “ਪੈਨਲ ਦਰ ਪੈਨਲ” ਇੱਕ ਵਾਰ ਵਿੱਚ ਪੰਨੇ ਦਾ ਇੱਕ ਪੈਨਲ, ਸਕ੍ਰੀਨ ਜਿੰਨਾ ਵੱਡਾ, ਦਿਖਾਉਂਦਾ ਹੈ, ਅਤੇ ਪੰਨਾ ਪਲਟਣਾ ਇੱਕ-ਇੱਕ ਪੈਨਲ ਅੱਗੇ ਜਾਂਦਾ ਹੈ; ਬਿਨਾਂ ਪੈਨਲਾਂ ਵਾਲਾ ਪੰਨਾ ਪੂਰਾ ਦਿਸਦਾ ਹੈ। “ਕਾਮਿਕ ਪੰਨਿਆਂ ਦੀ ਦਿਸ਼ਾ” ਮਾਂਗਾ ਲਈ ਪੰਨਾ ਪਲਟਣਾ ਉਲਟਾਉਂਦੀ ਹੈ (ਸੱਜੇ ਤੋਂ ਖੱਬੇ); ਕਿਤਾਬ ਦੀ ਆਪਣੀ ComicInfo.xml ਇਹ ਆਪਣੇ-ਆਪ ਦੱਸਦੀ ਹੈ। ਲਾਇਬ੍ਰੇਰੀ ComicInfo.xml ਤੋਂ ਕਿਤਾਬ ਦਾ ਸਿਰਲੇਖ, ਲੜੀ ਅਤੇ ਨੰਬਰ ਦਿਖਾਉਂਦੀ ਹੈ।"
