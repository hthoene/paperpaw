battery.plugin.name = ਬੈਟਰੀ ਦੀ ਵਰਤੋਂ
battery.plugin.description = ਬੈਟਰੀ ਦਾ ਰਿਕਾਰਡ ਰੱਖਦਾ ਹੈ ਅਤੇ ਦਿਖਾਉਂਦਾ ਹੈ ਕਿ ਇਹ ਕਿੰਨੀ ਦੇਰ ਚੱਲਦੀ ਹੈ।
battery.plugin.how = "“ਬੈਟਰੀ ਦੀ ਵਰਤੋਂ” ਡੀਵਾਈਸ ਦੇ ਜਾਗਦੇ ਸਮੇਂ ਲਗਭਗ ਹਰ ਮਿੰਟ ਚਾਰਜ ਨੋਟ ਕਰਦਾ ਹੈ, ਨਾਲ ਹੀ ਇਹ ਵੀ ਕਿ ਡੀਵਾਈਸ ਨੇ ਕੀ ਕੀਤਾ: ਸਕ੍ਰੀਨ ਰਿਫ੍ਰੈਸ਼ ਅਤੇ ਪਲਟੇ ਪੰਨੇ। ਇਸ ਤੋਂ ਇਹ ਹਿਸਾਬ ਲਾਉਂਦਾ ਹੈ ਕਿ ਜਾਗਣ ਦੇ ਇੱਕ ਘੰਟੇ ਅਤੇ 100 ਪੰਨਿਆਂ 'ਤੇ ਕਿੰਨੀ ਬੈਟਰੀ ਲੱਗਦੀ ਹੈ, ਅਤੇ ਇਸ ਰਫ਼ਤਾਰ ਨਾਲ ਬੈਟਰੀ ਕਿੰਨੀ ਦੇਰ ਚੱਲੇਗੀ।\n\n“ਟੂਲ” ਮੀਨੂ ਤੋਂ “ਬੈਟਰੀ” ਖੋਲ੍ਹੋ। ਇਹ ਮੌਜੂਦਾ ਚਾਰਜ, ਇਸ ਵਾਰ ਦਾ ਜਾਗਣਾ, ਹੁਣ ਤੱਕ ਬੈਟਰੀ 'ਤੇ ਵਰਤੋਂ ਅਤੇ ਹਾਲ ਹੀ ਵਿੱਚ ਜਾਗਣ ਦੇ ਸਮੇਂ ਦਿਖਾਉਂਦਾ ਹੈ। ਪੰਨਾ ਬਟਨਾਂ ਨਾਲ, ਜਾਂ ਉੱਪਰਲੇ ਤੀਰਾਂ 'ਤੇ ਟੈਪ ਕਰ ਕੇ ਪੰਨੇ ਬਦਲੋ।\n\nਅੰਕੜੇ ਭਰੋਸੇਯੋਗ ਹੋਣ ਲਈ ਕੁਝ ਦੇਰ ਬੈਟਰੀ 'ਤੇ ਪੜ੍ਹਨਾ ਪੈਂਦਾ ਹੈ। ਰਿਕਾਰਡਿੰਗ ਸ਼ੁਰੂ ਤੋਂ ਚਾਲੂ ਹੈ ਅਤੇ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਡੀਵਾਈਸ”, “ਪਾਵਰ” ਹੇਠ “ਬੈਟਰੀ ਦੀ ਵਰਤੋਂ ਰਿਕਾਰਡ ਕਰੋ” ਨਾਲ ਬੰਦ ਕੀਤੀ ਜਾ ਸਕਦੀ ਹੈ।"
