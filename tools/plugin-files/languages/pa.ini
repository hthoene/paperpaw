aids.plugin.name = ਪੜ੍ਹਨ ਵਿੱਚ ਮਦਦ
aids.plugin.description = ਸ਼ਬਦਾਂ ਦੀ ਮੋਟੀ ਸ਼ੁਰੂਆਤ, ਬਦਲੇ ਸ਼ਬਦ, ਤਸਵੀਰਾਂ: ਟੈਕਸਟ ਜਿਵੇਂ ਤੁਸੀਂ ਚਾਹੋ।
aids.plugin.how = "“ਪੜ੍ਹਨ ਵਿੱਚ ਮਦਦ” ਬਦਲਦੀ ਹੈ ਕਿ ਪੜ੍ਹਦੇ ਸਮੇਂ ਕਿਤਾਬ ਦਾ ਟੈਕਸਟ ਕਿਵੇਂ ਦਿਸਦਾ ਹੈ। ਇਹ ਹਰ ਕਿਤਾਬ 'ਤੇ ਲਾਗੂ ਹੁੰਦੀ ਹੈ। “ਸ਼ਬਦਾਂ ਦੀ ਮੋਟੀ ਸ਼ੁਰੂਆਤ” ਅਤੇ “ਸ਼ਬਦ ਬਦਲੋ” ਸ਼ੁਰੂ ਵਿੱਚ ਬੰਦ ਹਨ।\n\nਇਹ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਪੜ੍ਹਨਾ” ਹੇਠ, “ਪੜ੍ਹਨ ਵਿੱਚ ਮਦਦ” ਭਾਗ ਵਿੱਚ ਮਿਲਦੀ ਹੈ। “ਸ਼ਬਦਾਂ ਦੀ ਮੋਟੀ ਸ਼ੁਰੂਆਤ” ਹਰ ਸ਼ਬਦ ਦਾ ਪਹਿਲਾ ਅੱਧ ਮੋਟਾ ਕਰਦੀ ਹੈ, ਜੋ ਕੁਝ ਲੋਕਾਂ ਨੂੰ ਪੜ੍ਹਨ ਵਿੱਚ ਸੌਖਾ ਲੱਗਦਾ ਹੈ। “ਸ਼ਬਦ ਬਦਲੋ” ਵਿੱਚ ਜੋੜੇ “colour = color; Mr. = Mister” ਵਾਂਗ ਲਿਖੋ, ਅਰਧ-ਵਿਰਾਮ (;) ਨਾਲ ਵੱਖ ਕਰ ਕੇ।\n\nਸਿਰਫ਼ ਪੂਰੇ ਸ਼ਬਦ ਬਦਲੇ ਜਾਂਦੇ ਹਨ, ਬਿਲਕੁਲ ਜਿਵੇਂ ਤੁਸੀਂ ਲਿਖੇ, ਇਸ ਲਈ “color” ਕਦੇ ਕਿਸੇ ਲੰਮੇ ਸ਼ਬਦ ਦਾ ਹਿੱਸਾ ਨਹੀਂ ਬਦਲਦਾ। ਕਿਤਾਬ ਦੀ ਫ਼ਾਈਲ ਨਹੀਂ ਬਦਲਦੀ।\n\nਕਿਤਾਬਾਂ ਦੀਆਂ ਤਸਵੀਰਾਂ ਦਿਖਾਈਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ (ਸ਼ੁਰੂ ਵਿੱਚ ਇਵੇਂ), ਤਸਵੀਰ ਦੇ ਵੇਰਵੇ ਵਾਲੀ ਛੋਟੀ ਲਾਈਨ ਬਣ ਸਕਦੀਆਂ ਹਨ, ਜਿਵੇਂ “[ਤਸਵੀਰ: ਸਮੁੰਦਰ ਵਿੱਚ ਜਹਾਜ਼]”, ਜਾਂ ਛੱਡੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ। ਫਿਰ ਪੰਨੇ 'ਤੇ ਟੈਕਸਟ ਲਈ ਵੱਧ ਥਾਂ ਹੁੰਦੀ ਹੈ, ਅਤੇ ਨਾ ਦਿਖਾਈ ਤਸਵੀਰ ਡੀਕੋਡ ਨਹੀਂ ਹੁੰਦੀ, ਜਿਸ ਨਾਲ ਪੰਨੇ ਤੇਜ਼ੀ ਨਾਲ ਪਲਟਦੇ ਹਨ। ਕੌਮਿਕਸ ਅਤੇ ਤਸਵੀਰਾਂ ਤੋਂ ਬਣੀਆਂ ਹੋਰ ਕਿਤਾਬਾਂ ਨਹੀਂ ਬਦਲਦੀਆਂ।"
