pomodoro.plugin.name = ਪੋਮੋਡੋਰੋ
pomodoro.plugin.description = ਕੰਮ ਅਤੇ ਬ੍ਰੇਕ ਦੇ ਗੇੜਾਂ ਵਾਲਾ ਫ਼ੋਕਸ ਟਾਈਮਰ, ਵਿਜੇਟਾਂ ਅਤੇ ਰੋਜ਼ਾਨਾ ਗਿਣਤੀ ਸਮੇਤ।
pomodoro.plugin.how = "ਪੋਮੋਡੋਰੋ ਟਾਈਮਰ: ਧਿਆਨ ਨਾਲ ਗੇੜਾਂ ਵਿੱਚ ਕੰਮ ਕਰੋ, ਫਿਰ ਆਰਾਮ ਕਰੋ। ਕੋਈ ਸੈੱਟਅੱਪ ਨਹੀਂ ਚਾਹੀਦਾ: 25 ਮਿੰਟ ਫ਼ੋਕਸ, 5 ਮਿੰਟ ਆਰਾਮ, ਅਤੇ ਚਾਰ ਗੇੜਾਂ ਤੋਂ ਬਾਅਦ 15 ਮਿੰਟ ਦੀ ਲੰਬੀ ਬ੍ਰੇਕ।\n\nਟੂਲ ਮੀਨੂ ਤੋਂ ਪੋਮੋਡੋਰੋ ਖੋਲ੍ਹੋ ਅਤੇ “ਸ਼ੁਰੂ ਕਰੋ” ਦਬਾਓ, ਜਾਂ ਇਸ ਦੇ ਵਿਜੇਟ ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ ਸ਼ਾਮਲ ਕਰੋ (ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ, ਫਿਰ ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ): “ਪੋਮੋਡੋਰੋ ਟਾਈਮਰ” ਪੜਾਅ ਅਤੇ ਬਾਕੀ ਮਿੰਟ ਦਿਖਾਉਂਦਾ ਹੈ, “ਪੋਮੋਡੋਰੋ ਸ਼ੁਰੂ/ਰੋਕੋ” ਇੱਕ ਬਟਨ ਹੈ, ਅਤੇ “ਪੋਮੋਡੋਰੋ ਅੱਜ” ਤੁਹਾਡੇ ਪੂਰੇ ਕੀਤੇ ਗੇੜ ਤੁਹਾਡੇ ਰੋਜ਼ਾਨਾ ਟੀਚੇ ਸਮੇਤ ਗਿਣਦਾ ਹੈ। ਟਾਈਮਰ 'ਤੇ ਟੈਪ ਇਸ ਨੂੰ ਸ਼ੁਰੂ ਜਾਂ ਰੋਕਦਾ ਹੈ; ਪੂਰੀ ਸਕ੍ਰੀਨ ਖੋਲ੍ਹਣ ਲਈ ਦਬਾਈ ਰੱਖੋ।\n\nਸਕ੍ਰੀਨ ਛੱਡਣ 'ਤੇ ਟਾਈਮਰ ਚੱਲਦਾ ਰਹਿੰਦਾ ਹੈ, ਅਤੇ ਮੁੜ-ਚਾਲੂ ਹੋਣ ਤੋਂ ਬਾਅਦ ਘੜੀ ਮੁਤਾਬਕ ਜਾਰੀ ਰਹਿੰਦਾ ਹੈ। ਰੀਡਰ ਦੇ ਸਲੀਪ ਦੌਰਾਨ ਕੁਝ ਨਹੀਂ ਚੱਲਦਾ: ਇਸ ਦੌਰਾਨ ਖਤਮ ਹੋਇਆ ਪੜਾਅ ਜਾਗਣ 'ਤੇ ਦੱਸਿਆ ਜਾਂਦਾ ਹੈ। ਪੜਾਅ ਖਤਮ ਹੋਣ 'ਤੇ ਸੂਚਨਾ ਮਿਲਦੀ ਹੈ। ਬੈਟਰੀ ਬਚਾਉਣ ਲਈ ਘੜੀ ਮਿੰਟ ਵਿੱਚ ਇੱਕ ਵਾਰ ਅੱਪਡੇਟ ਹੁੰਦੀ ਹੈ (ਪੂਰੀ ਸਕ੍ਰੀਨ 'ਤੇ ਆਖਰੀ ਮਿੰਟ ਵਿੱਚ ਹਰ ਦਸ ਸਕਿੰਟ) ਅਤੇ ਰੀਡਰ ਨੂੰ ਕਦੇ ਜਗਾਈ ਨਹੀਂ ਰੱਖਦੀ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਪੋਮੋਡੋਰੋ” ਹੇਠਾਂ ਤੁਸੀਂ ਲੰਬਾਈਆਂ, ਇੱਕ ਸੈੱਟ ਦੇ ਗੇੜ, ਅਤੇ ਅਗਲਾ ਪੜਾਅ ਆਪੇ ਸ਼ੁਰੂ ਹੋਵੇ ਜਾਂ ਨਹੀਂ, ਤੈਅ ਕਰਦੇ ਹੋ। “ਹੋਰ” ਹੇਠਾਂ: ਪੜਾਅ ਖਤਮ ਹੋਣ 'ਤੇ ਸਕ੍ਰੀਨ ਦੀ ਚਮਕ ਜਾਂ ਫ਼ਰੰਟਲਾਈਟ ਦਾ ਝਪਕਣਾ, ਅਤੇ ਰੋਜ਼ਾਨਾ ਟੀਚਾ।"
