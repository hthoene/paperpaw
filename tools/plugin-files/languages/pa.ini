sleep.plugin.name = ਸਲੀਪ ਸਕ੍ਰੀਨ
sleep.plugin.description = ਡੀਵਾਈਸ ਦੇ ਸਲੀਪ ਦੌਰਾਨ ਸੁੱਤੀ ਬਿੱਲੀ, ਕਿਤਾਬ ਦਾ ਕਵਰ, ਤੁਹਾਡੀਆਂ ਤਸਵੀਰਾਂ ਜਾਂ ਕੋਈ ਸੁਨੇਹਾ ਦਿਖਾਉਂਦਾ ਹੈ।
sleep.plugin.how = "ਸਲੀਪ ਸਕ੍ਰੀਨ ਤੈਅ ਕਰਦੀ ਹੈ ਕਿ ਡੀਵਾਈਸ ਦੇ ਸਲੀਪ ਦੌਰਾਨ ਸਕ੍ਰੀਨ 'ਤੇ ਕੀ ਦਿਸੇ। ਈ-ਇੰਕ ਬਿਜਲੀ ਤੋਂ ਬਿਨਾਂ ਵੀ ਤਸਵੀਰ ਰੱਖਦੀ ਹੈ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਡੀਵਾਈਸ”, “ਸਲੀਪ ਸਕ੍ਰੀਨ” ਹੇਠਾਂ “ਦਿਖਾਓ” ਨਾਲ ਚੁਣੋ: ਸੁੱਤੀ ਬਿੱਲੀ (ਮਿਆਰੀ), ਕਿਤਾਬ ਦਾ ਕਵਰ, ਮੇਰੀਆਂ ਤਸਵੀਰਾਂ, ਲੋਗੋ ਅਤੇ “ਸਲੀਪ ਵਿੱਚ”, ਵਿਜੇਟ, ਪੰਨਾ ਜਿਵੇਂ ਹੈ, ਜਾਂ ਤਸਵੀਰ ਵਾਲਾ ਪੰਨਾ। “ਮੇਰੀਆਂ ਤਸਵੀਰਾਂ” ਤਸਵੀਰਾਂ ਵਾਲੇ ਫ਼ੋਲਡਰ ਦੀਆਂ ਫ਼ਾਈਲਾਂ ਵਾਰੀ-ਵਾਰੀ ਦਿਖਾਉਂਦਾ ਹੈ। ਕਵਰ ਜਾਂ ਤਸਵੀਰ ਨਾ ਹੋਵੇ ਤਾਂ ਬਿੱਲੀ ਦਿਸਦੀ ਹੈ। ਜਿੱਥੇ ਸਿਸਟਮ ਖੁਦ ਸਲੀਪ ਸਕ੍ਰੀਨ ਬਣਾਉਂਦਾ ਹੈ, ਉੱਥੇ ਇਹ ਸੈਟਿੰਗਾਂ ਲੁਕੀਆਂ ਹੁੰਦੀਆਂ ਹਨ।\n\nਬੰਦ ਸਕ੍ਰੀਨ (“ਬੰਦ ਹੋਣ 'ਤੇ ਦਿਖਾਓ”) ਡੀਵਾਈਸ ਬੰਦ ਹੋਣ ਵੇਲੇ ਇੱਕ ਵਾਰ ਬਣਦੀ ਹੈ: ਪਾਵਰ ਮੀਨੂ ਤੋਂ ਜਾਂ ਸਲੀਪ ਤੋਂ ਬਾਅਦ ਬੰਦ ਹੋਣ ਦੇ ਸਮੇਂ ਮਗਰੋਂ (ਘੱਟ ਬੈਟਰੀ ਨਾਲ ਬਿਜਲੀ ਕੱਟਣ 'ਤੇ ਨਹੀਂ)। ਇਹ ਸਲੀਪ ਸਕ੍ਰੀਨ ਵਰਗੀ ਹੁੰਦੀ ਹੈ, ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਲੋਗੋ ਅਤੇ “ਬੰਦ ਹੈ”, ਬਿੱਲੀ, ਕਵਰ ਜਾਂ ਮੇਰੀਆਂ ਤਸਵੀਰਾਂ ਨਾ ਚੁਣੋ। ਕੋਈ ਹੋਰ ਪਲੱਗਇਨ ਇਸ ਲਈ ਸਕ੍ਰੀਨ ਦੇ ਸਕਦਾ ਹੈ।\n\nਸ਼ੁਰੂ ਅਤੇ ਮੁੜ-ਚਾਲੂ ਹੋਣ ਦੀ ਸਕ੍ਰੀਨ (“ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਦਿਖਾਓ”, “ਮੁੜ-ਚਾਲੂ ਹੋਣ 'ਤੇ ਦਿਖਾਓ”) ਡੀਵਾਈਸ ਦੀ ਆਪਣੀ ਹੁੰਦੀ ਹੈ, ਜਦੋਂ ਤੱਕ ਕੋਈ ਹੋਰ ਪਲੱਗਇਨ ਸਕ੍ਰੀਨ ਨਾ ਦੇਵੇ। ਸ਼ੁਰੂ ਹੋਣ ਵੇਲੇ ਪਲੱਗਇਨ ਹਾਲੇ ਨਹੀਂ ਚੱਲਦੇ: ਚੁਣੀ ਸਕ੍ਰੀਨ ਪਹਿਲਾਂ ਹੀ, ਬੰਦ ਜਾਂ ਮੁੜ-ਚਾਲੂ ਹੋਣ ਵੇਲੇ, ਬਣਾਈ ਜਾਂਦੀ ਹੈ ਅਤੇ ਅਗਲੀ ਸ਼ੁਰੂਆਤ 'ਤੇ ਦਿਸਦੀ ਹੈ। ਸਮੇਂ ਸਿਰ ਤਿਆਰ ਨਾ ਹੋਈ ਸਕ੍ਰੀਨ ਜਾਂ ਖਰਾਬ ਤਸਵੀਰ ਦੀ ਥਾਂ ਡੀਵਾਈਸ ਦੀ ਆਪਣੀ ਦਿਸਦੀ ਹੈ।"
