lock.plugin.name = ਸਕ੍ਰੀਨ ਲਾਕ
lock.plugin.description = ਡੀਵਾਈਸ ਜਾਗਣ 'ਤੇ ਪਿੰਨ, ਪੈਟਰਨ ਜਾਂ ਪਾਸਵਰਡ; ਪੜ੍ਹਦੇ ਸਮੇਂ ਟੱਚ ਲਾਕ।
lock.plugin.how = "ਸਕ੍ਰੀਨ ਲਾਕ PaperPaw ਸ਼ੁਰੂ ਹੋਣ ਅਤੇ ਡੀਵਾਈਸ ਜਾਗਣ 'ਤੇ ਪਿੰਨ, ਪੈਟਰਨ ਜਾਂ ਪਾਸਵਰਡ ਮੰਗਦਾ ਹੈ। ਸ਼ੁਰੂ ਵਿੱਚ ਇਹ ਬੰਦ ਹੁੰਦਾ ਹੈ। ਇਹ ਸਿਰਫ਼ ਆਮ ਵਰਤੋਂ ਰੋਕਦਾ ਹੈ: ਕੋਡ ਅਤੇ ਗਲਤ ਕੋਸ਼ਿਸ਼ਾਂ ਦੀ ਗਿਣਤੀ SD ਕਾਰਡ 'ਤੇ ਰੱਖੀ ਜਾਂਦੀ ਹੈ, ਇਸ ਲਈ ਜੋ ਕਾਰਡ ਕੱਢਦਾ, ਬਦਲਦਾ ਜਾਂ ਸੰਪਾਦਿਤ ਕਰਦਾ ਹੈ, ਉਹ ਲਾਕ ਪਾਰ ਕਰ ਲੈਂਦਾ ਹੈ।\n\nਇਸ ਨੂੰ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਡੀਵਾਈਸ” › “ਸਕ੍ਰੀਨ ਲਾਕ” ਵਿੱਚ ਸੈੱਟ ਕਰੋ: ਜੇ ਕੋਈ ਕੋਡ ਵਰਤੋਂ ਵਿੱਚ ਹੈ ਤਾਂ ਉਹ ਦਾਖਲ ਕਰੋ, ਕਿਸਮ ਚੁਣੋ, ਫਿਰ ਨਵਾਂ ਕੋਡ ਦੋ ਵਾਰ। ਪੈਟਰਨ ਸਿਰਫ਼ ਟੱਚ ਸਕ੍ਰੀਨਾਂ 'ਤੇ ਮਿਲਦਾ ਹੈ।\n\nਪੰਜ ਗਲਤ ਕੋਸ਼ਿਸ਼ਾਂ ਤੋਂ ਬਾਅਦ ਅਗਲੀ ਲਈ ਅੱਧਾ ਮਿੰਟ ਉਡੀਕ ਕਰਨੀ ਪੈਂਦੀ ਹੈ। “ਹੁਣੇ ਲਾਕ ਕਰੋ” ਤੁਰੰਤ ਲਾਕ ਕਰਦਾ ਹੈ ਅਤੇ ਬਟਨ, ਇਸ਼ਾਰੇ ਜਾਂ ਨਿਯਮ 'ਤੇ ਲਾਇਆ ਜਾ ਸਕਦਾ ਹੈ। “ਜਾਗਣ ਤੋਂ ਬਾਅਦ ਲਾਕ” ਬੰਦ ਕੀਤਾ ਜਾ ਸਕਦਾ ਹੈ, ਤਾਂ ਜੋ ਸਿਰਫ਼ ਅਸਲ ਸ਼ੁਰੂਆਤ (ਪਾਵਰ ਚਾਲੂ ਜਾਂ ਮੁੜ-ਚਾਲੂ) ਲਾਕ ਕਰੇ, ਸਿਵਾਏ ਜਿੱਥੇ ਹਰ ਜਾਗਣਾ ਸ਼ੁਰੂਆਤ ਹੈ, ਜਿਵੇਂ ਬੈਟਰੀ 'ਤੇ X4।\n\nਟੱਚ ਲਾਕ: ਤਤਕਾਲ ਪੈਨਲ ਅਤੇ ਪੜ੍ਹਨ ਵਾਲੇ ਮੀਨੂ ਵਿੱਚ “ਟੱਚ ਲਾਕ ਕਰੋ” ਨਾਲ ਟੈਪ, ਸਵਾਈਪ ਅਤੇ ਪੈੱਨ ਕੁਝ ਨਹੀਂ ਕਰਦੇ, ਪਰ ਬਟਨ ਕੰਮ ਕਰਦੇ ਹਨ, ਜਿਵੇਂ ਸਕ੍ਰੀਨ 'ਤੇ ਹੱਥ ਰੱਖ ਕੇ ਪੜ੍ਹਨ ਲਈ। ਅਨਲਾਕ ਕਰਨ ਲਈ ਇੱਕ ਉਂਗਲ ਨਾਲ ਦੋ ਵਾਰ ਟੈਪ ਕਰੋ ਅਤੇ ਪਲ ਭਰ ਦਬਾਈ ਰੱਖੋ; ਪਾਵਰ ਬਟਨ ਦਬਾਈ ਰੱਖਣ ਨਾਲ ਪਾਵਰ ਮੀਨੂ ਖੁੱਲ੍ਹਦਾ ਹੈ, ਜਿੱਥੇ “ਟੱਚ ਅਨਲਾਕ ਕਰੋ” ਬਟਨਾਂ ਨਾਲ ਇਹ ਕਰਦਾ ਹੈ; X4 Pro 'ਤੇ ਹੋਮ ਕੁੰਜੀ ਦਬਾਈ ਰੱਖਣ ਨਾਲ ਤੁਰੰਤ ਅਨਲਾਕ ਹੁੰਦਾ ਹੈ।"
