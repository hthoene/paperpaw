home.plugin.name = ਹੋਮ ਸਕ੍ਰੀਨ
home.plugin.description = ਸ਼ੁਰੂਆਤੀ ਪੰਨਾ: ਵਿਜੇਟਾਂ ਦੇ ਪੰਨੇ, ਜਿਵੇਂ ਪੜ੍ਹੀ ਜਾ ਰਹੀ ਕਿਤਾਬ ਅਤੇ ਟੂਲ।
home.plugin.how = "ਹੋਮ ਸਕ੍ਰੀਨ ਪੰਨਿਆਂ ਦੀ ਬਣੀ ਹੈ, ਹਰ ਪੰਨਾ ਫ਼ੋਨ ਵਾਂਗ ਵਿਜੇਟਾਂ ਅਤੇ ਟੂਲਾਂ ਦਾ ਗਰਿੱਡ। ਸ਼ੁਰੂ ਵਿੱਚ ਘੜੀ, ਪੜ੍ਹੀ ਜਾ ਰਹੀ ਕਿਤਾਬ ਅਤੇ ਹਾਲ ਹੀ ਵਿੱਚ ਪੜ੍ਹੀਆਂ ਕਿਤਾਬਾਂ ਇੱਕ ਪੰਨੇ 'ਤੇ ਹੁੰਦੀਆਂ ਹਨ, ਅਤੇ ਸਾਰੇ ਟੂਲ ਅਗਲੇ ਪੰਨੇ 'ਤੇ।\n\nਕੋਈ ਆਈਟਮ ਖੋਲ੍ਹਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ, ਅਤੇ ਪੰਨਾ ਬਦਲਣ ਲਈ ਸਵਾਈਪ ਕਰੋ ਜਾਂ ਪੰਨਾ ਬਟਨ ਵਰਤੋ। ਸਿਰਫ਼ ਬਟਨਾਂ ਨਾਲ, ਤੀਰ ਬਟਨ ਇੱਕ ਆਈਟਮ ਤੋਂ ਅਗਲੀ 'ਤੇ ਜਾਂਦੇ ਹਨ ਅਤੇ “ਚੁਣੋ” ਉਸ ਨੂੰ ਖੋਲ੍ਹਦਾ ਹੈ।\n\nਤਰਤੀਬ ਬਦਲਣ ਲਈ ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ, ਪੰਨੇ ਹੇਠਾਂ ਪੈਨਸਿਲ 'ਤੇ ਟੈਪ ਕਰੋ ਜਾਂ ਮੀਨੂ ਵਿੱਚ “ਹੋਮ ਸਕ੍ਰੀਨ ਸੰਪਾਦਿਤ ਕਰੋ” ਚੁਣੋ। ਆਈਟਮਾਂ ਦੀ ਥਾਂ ਬਦਲਣ ਲਈ ਉਹਨਾਂ ਨੂੰ ਖਿੱਚੋ ਜਾਂ ਵਿਕਲਪਾਂ ਲਈ ਕਿਸੇ 'ਤੇ ਟੈਪ ਕਰੋ, ਬਟਨਾਂ ਨਾਲ ਵੀ। “ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ” ਵੀ ਉੱਥੇ ਹੈ। “ਕਾਲਮ” ਅਤੇ “ਕਤਾਰਾਂ” ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਦਿੱਖ” ਹੇਠਾਂ, “ਹੋਮ ਸਕ੍ਰੀਨ” ਭਾਗ ਵਿੱਚ ਹਨ।\n\nਜਦੋਂ ਸਕ੍ਰੀਨ ਪਾਸੇ ਵੱਲ ਘੁਮਾਈ ਹੋਵੇ, ਹੋਮ ਸਕ੍ਰੀਨ ਉਹੀ ਆਈਟਮਾਂ ਵੱਧ ਕਾਲਮਾਂ ਨਾਲ ਦਿਖਾਉਂਦੀ ਹੈ, ਅਗਲੇ ਪੰਨੇ ਤੋਂ ਪਹਿਲਾਂ ਹਰ ਪੰਨਾ ਭਰਦਾ ਹੈ, ਅਤੇ ਕਾਰਡ ਲਗਭਗ 110 ਮਿ.ਮੀ. ਤੋਂ ਚੌੜੇ ਨਹੀਂ ਹੁੰਦੇ; ਸਿੱਧੀ ਸਕ੍ਰੀਨ 'ਤੇ ਤੁਹਾਡੀ ਬਣਾਈ ਤਰਤੀਬ ਨਹੀਂ ਬਦਲਦੀ। ਪਾਸੇ ਵੱਲ ਤਰਤੀਬ ਬਦਲੋ ਤਾਂ ਉਹ ਲੇਆਉਟ ਸਿਰਫ਼ ਉਸ ਦਿਸ਼ਾ ਲਈ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ: ਨਵੇਂ ਵਿਜੇਟ ਦੋਹਾਂ ਵਿੱਚ ਸ਼ਾਮਲ ਹੁੰਦੇ ਹਨ। (ਸੰਪਾਦਨ ਦੌਰਾਨ) “ਸ਼ਾਮਲ ਕਰੋ” ਵਿੱਚ “ਲੈਂਡਸਕੇਪ ਲੇਆਉਟ ਰੀਸੈੱਟ ਕਰੋ” ਆਪਣੇ-ਆਪ ਬਣੇ ਲੇਆਉਟ 'ਤੇ ਵਾਪਸ ਜਾਂਦਾ ਹੈ। ਇੱਕ ਦਿਸ਼ਾ ਵਿੱਚ ਕੋਈ ਵਿਜੇਟ ਜਾਂ ਟੂਲ ਹਟਾਉਣ ਨਾਲ ਉਹ ਦੂਜੀ ਵਿੱਚੋਂ ਨਹੀਂ ਹਟਦਾ।"
