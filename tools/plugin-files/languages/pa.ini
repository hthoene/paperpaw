reading-goal.plugin.name = ਪੜ੍ਹਨ ਦਾ ਟੀਚਾ
reading-goal.plugin.description = ਰੋਜ਼ ਪੜ੍ਹਨ ਦੇ ਮਿੰਟ, ਅਤੇ ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ ਇੱਕ ਬਿੱਲੀ ਜਿਸ ਦਾ ਮੂਡ ਅੱਜ ਦੇ ਪੜ੍ਹਨ ਮੁਤਾਬਕ ਬਦਲਦਾ ਹੈ।
reading-goal.plugin.how = "ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ ਇੱਕ ਬਿੱਲੀ ਦਿਖਾਉਂਦੀ ਹੈ ਕਿ ਅੱਜ ਪੜ੍ਹਨਾ ਕਿਵੇਂ ਚੱਲ ਰਿਹਾ ਹੈ: ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਨਹੀਂ ਪੜ੍ਹਿਆ ਉਦਾਸ, ਥੋੜ੍ਹਾ ਪੜ੍ਹਨ ਮਗਰੋਂ ਠੀਕ-ਠਾਕ, ਅੱਧੇ ਰੋਜ਼ਾਨਾ ਟੀਚੇ ਤੋਂ ਸੰਤੁਸ਼ਟ, ਅਤੇ ਟੀਚਾ ਪੂਰਾ ਹੋਣ 'ਤੇ ਖੁਸ਼।\n\nਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ “ਪੜ੍ਹਨ ਵਾਲੀ ਬਿੱਲੀ” ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ (ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ, ਫਿਰ ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ), ਜਾਂ ਸਲੀਪ ਸਕ੍ਰੀਨ ਵਜੋਂ “ਅੱਜ ਦੀ ਪੜ੍ਹਨ ਵਾਲੀ ਬਿੱਲੀ” ਚੁਣੋ। ਬਿੱਲੀ 'ਤੇ ਟੈਪ ਕਰਨ ਨਾਲ ਰੋਜ਼ਾਨਾ ਟੀਚਾ ਖੁੱਲ੍ਹਦਾ ਹੈ; ਇਹ ਪੜ੍ਹਨ ਦੇ ਅੰਕੜਿਆਂ ਦਾ ਟੀਚਾ ਹੈ, ਜੋ ਤੁਹਾਡੇ ਪੜ੍ਹਨ ਦੇ ਮਿੰਟ ਗਿਣਦੇ ਹਨ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਪੜ੍ਹਨਾ” ਹੇਠਾਂ, “ਸੰਤੁਸ਼ਟ ਹੋਣ ਲਈ” ਅਤੇ “ਖੁਸ਼ ਹੋਣ ਲਈ” ਦੱਸਦੇ ਹਨ ਕਿ ਟੀਚੇ ਦੇ ਕਿੰਨੇ ਹਿੱਸੇ ਤੋਂ ਬਿੱਲੀ ਸੰਤੁਸ਼ਟ ਜਾਂ ਖੁਸ਼ ਹੈ, ਅਤੇ “ਆਪਣੀਆਂ ਤਸਵੀਰਾਂ” ਬਿੱਲੀਆਂ ਦੀ ਥਾਂ ਤਸਵੀਰਾਂ (sad, meh, content ਅਤੇ happy) ਵਾਲਾ ਫ਼ੋਲਡਰ ਚੁਣਦਾ ਹੈ। ਤਸਵੀਰਾਂ PNG ਜਾਂ JPEG ਫ਼ਾਈਲਾਂ ਹੁੰਦੀਆਂ ਹਨ; ਫ਼ੋਲਡਰ ਤੋਂ ਬਿਨਾਂ ਬਿੱਲੀਆਂ ਦਿਸਦੀਆਂ ਹਨ।"
