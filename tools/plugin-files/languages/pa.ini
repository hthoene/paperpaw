keys.plugin.name = ਬਟਨ ਅਤੇ ਇਸ਼ਾਰੇ
keys.plugin.description = ਹਰ ਬਟਨ, ਟੈਪ ਖੇਤਰ ਅਤੇ ਸਵਾਈਪ ਕੀ ਕਰਦਾ ਹੈ, ਡੀਵਾਈਸ 'ਤੇ ਹੀ ਬਦਲੋ।
keys.plugin.how = "“ਬਟਨ ਅਤੇ ਇਸ਼ਾਰੇ” ਦਿਖਾਉਂਦਾ ਹੈ ਕਿ ਹਰ ਬਟਨ, ਟੈਪ ਖੇਤਰ ਅਤੇ ਸਵਾਈਪ ਕੀ ਕਰਦਾ ਹੈ, ਅਤੇ ਤੁਹਾਨੂੰ ਇਹ ਡੀਵਾਈਸ 'ਤੇ ਬਦਲਣ ਦਿੰਦਾ ਹੈ।\n\nਇਸ ਨੂੰ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਡੀਵਾਈਸ” ਹੇਠਾਂ ਖੋਲ੍ਹੋ। ਪਹਿਲਾਂ ਚੁਣੋ ਕਿ ਤਬਦੀਲੀ ਕਿੱਥੇ ਲਾਗੂ ਹੋਵੇ: “ਹਰ ਥਾਂ”, “ਪੜ੍ਹਦੇ ਸਮੇਂ”, “ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ”, “ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ” ਜਾਂ ਕਿਸੇ ਇੱਕ ਟੂਲ ਵਿੱਚ। ਫਿਰ ਕੋਈ ਇਨਪੁਟ ਚੁਣੋ, ਜਿਵੇਂ ਦਬਾਈ ਰੱਖਿਆ ਬਟਨ ਜਾਂ ਕਿਨਾਰੇ ਤੋਂ ਅੰਦਰ ਸਵਾਈਪ, ਅਤੇ ਸੂਚੀ ਵਿੱਚੋਂ ਕੋਈ ਕਾਰਵਾਈ ਚੁਣੋ, ਜਿਸ ਵਿੱਚ ਤੁਸੀਂ ਖੋਜ ਸਕਦੇ ਹੋ। “ਮਿਆਰੀ” ਉਹ ਵਾਪਸ ਲਿਆਉਂਦਾ ਹੈ ਜੋ ਪਲੱਗਇਨਾਂ ਅਤੇ ਬਟਨ ਲੇਆਉਟ ਨੇ ਸੈੱਟ ਕੀਤਾ ਸੀ।\n\nX4 'ਤੇ, ਅਜਿਹੀ ਤਬਦੀਲੀ ਨਹੀਂ ਮੰਨੀ ਜਾਂਦੀ ਜਿਸ ਨਾਲ ਚੁਣਨ, ਵਾਪਸ ਜਾਣ ਜਾਂ ਅੱਗੇ ਜਾਣ ਲਈ ਕੋਈ ਬਟਨ ਨਾ ਬਚੇ। ਅੰਤ ਵਿੱਚ “ਬਟਨ ਅਤੇ ਇਸ਼ਾਰੇ ਰੀਸੈੱਟ ਕਰੋ” ਹਰ ਤਬਦੀਲੀ ਵਾਪਸ ਲੈ ਲੈਂਦਾ ਹੈ।"
