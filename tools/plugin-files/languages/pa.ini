files.plugin.name = ਫ਼ਾਈਲ ਬ੍ਰਾਊਜ਼ਰ
files.plugin.description = ਡੀਵਾਈਸ 'ਤੇ ਕਿਤਾਬਾਂ ਅਤੇ ਫ਼ੋਲਡਰਾਂ ਦੀ ਸੂਚੀ ਦਿਖਾਉਂਦਾ ਹੈ ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਖੋਲ੍ਹਦਾ ਹੈ।
files.plugin.how = "ਲਾਇਬ੍ਰੇਰੀ ਤੁਹਾਡੇ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਦੀਆਂ ਕਿਤਾਬਾਂ ਦਿਖਾਉਂਦੀ ਹੈ, ਹਰ ਇੱਕ ਆਪਣੇ ਕਵਰ, ਸਿਰਲੇਖ, ਲੇਖਕ ਅਤੇ ਪ੍ਰਗਤੀ ਨਾਲ। ਆਖਰੀ ਵਾਰ ਪੜ੍ਹੀ ਕਿਤਾਬ ਸਭ ਤੋਂ ਉੱਪਰ ਕਾਰਡ ਵਜੋਂ ਹੁੰਦੀ ਹੈ, ਇਸ ਲਈ ਅੱਗੇ ਪੜ੍ਹਨ ਲਈ ਇੱਕ ਟੈਪ ਜਾਂ “ਚੁਣੋ” ਦਬਾਉਣਾ ਕਾਫ਼ੀ ਹੈ। ਕਿਤਾਬਾਂ ਲੱਭਦੇ ਸਮੇਂ ਲਾਇਬ੍ਰੇਰੀ ਦੱਸਦੀ ਹੈ ਕਿ ਹੁਣ ਤੱਕ ਕਿੰਨੀਆਂ ਮਿਲੀਆਂ ਹਨ।\n\nਕਿਤਾਬਾਂ ਦੇ ਉੱਪਰ ਚੁਣੋ ਕਿ ਕੀ ਦਿਸੇ: ਸਾਰੀਆਂ, ਜੋ ਤੁਸੀਂ ਪੜ੍ਹ ਰਹੇ ਹੋ, ਨਾ ਪੜ੍ਹੀਆਂ ਜਾਂ ਪੂਰੀਆਂ ਪੜ੍ਹੀਆਂ, ਜਾਂ ਸ਼ੈਲਫ਼ਾਂ (ਲੇਖਕ, ਲੜੀ, ਟੈਗ, ਮਨਪਸੰਦ, ਅਤੇ ਸ਼ੁਰੂ ਕੀਤੀ ਹਰ ਲੜੀ ਦੀ ਅਗਲੀ ਕਿਤਾਬ)। ਪੜ੍ਹਨ ਲਈ ਕਿਤਾਬ 'ਤੇ ਟੈਪ ਕਰੋ; ਖੋਲ੍ਹਣ, ਪੂਰੀ ਪੜ੍ਹੀ ਜਾਂ ਨਾ ਪੜ੍ਹੀ ਨਿਸ਼ਾਨਬੱਧ ਕਰਨ, ਜਾਣਕਾਰੀ ਦੇਖਣ, ਆਰਕਾਈਵ ਵਿੱਚ ਲਿਜਾਣ ਜਾਂ ਮਿਟਾਉਣ ਲਈ ਉਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)। ਲਾਇਬ੍ਰੇਰੀ ਮੀਨੂ ਲਈ ਸਿਰਲੇਖ 'ਤੇ ਟੈਪ ਕਰੋ: ਕਿਤਾਬਾਂ ਦੀ ਛਾਂਟੀ ਅਤੇ ਦਿੱਖ, ਖੋਜ, ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਅਤੇ ਸੈਟਿੰਗਾਂ।\n\nਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਸੈਟਿੰਗਾਂ › ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ “ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ” 'ਤੇ ਸੈੱਟ ਹੁੰਦਾ ਹੈ; ਉੱਥੇ ਤੁਸੀਂ ਕਿਤਾਬਾਂ ਨੂੰ ਕਵਰਾਂ ਦੇ ਗਰਿੱਡ ਵਜੋਂ ਵੀ ਦਿਖਾ ਸਕਦੇ ਹੋ। ਹੋਰ ਹਰ ਫ਼ਾਈਲ ਲਈ “ਟੂਲ” ਮੀਨੂ ਵਿੱਚ “ਫ਼ਾਈਲਾਂ” ਵਰਤੋ।"
