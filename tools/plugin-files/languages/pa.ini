update.plugin.name = ਅੱਪਡੇਟ
update.plugin.description = ਕਾਰਡ ਤੋਂ ਜਾਂ ਇੰਟਰਨੈੱਟ ਤੋਂ ਡਾਊਨਲੋਡ ਕੀਤੇ ਫ਼ਰਮਵੇਅਰ ਅੱਪਡੇਟ ਸਥਾਪਤ ਕਰਦਾ ਹੈ।
update.plugin.how = "“ਅੱਪਡੇਟ” ਉਹਨਾਂ ਡੀਵਾਈਸਾਂ 'ਤੇ ਨਵਾਂ ਫ਼ਰਮਵੇਅਰ ਸਥਾਪਤ ਕਰਦਾ ਹੈ ਜਿੱਥੇ PaperPaw ਹੀ ਫ਼ਰਮਵੇਅਰ ਹੈ, ਜਿਵੇਂ X4। ਇਹ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਅੱਪਡੇਟ” ਵਜੋਂ ਮਿਲਦਾ ਹੈ।\n\n“ਆਨਲਾਈਨ ਖੋਜੋ” ਅੱਪਡੇਟ ਸਰਵਰ ਤੋਂ ਨਵਾਂ PaperPaw ਡਾਊਨਲੋਡ ਕਰਦਾ ਹੈ (Wi-Fi 'ਤੇ ਕੁਝ ਮਿੰਟ)। ਜਾਂ paperpaw.org ਤੋਂ .bin ਅੱਪਡੇਟ ਫ਼ਾਈਲ ਕਾਰਡ ਦੇ updates ਫ਼ੋਲਡਰ ਵਿੱਚ ਕਾਪੀ ਕਰੋ, ਜਿਵੇਂ Wi-Fi ਟ੍ਰਾਂਸਫ਼ਰ ਨਾਲ। ਸਥਾਪਨਾ ਲਗਭਗ ਇੱਕ ਮਿੰਟ ਲੈਂਦੀ ਹੈ ਅਤੇ ਡੀਵਾਈਸ ਮੁੜ-ਚਾਲੂ ਹੁੰਦਾ ਹੈ; ਕਿਤਾਬਾਂ, ਸੈਟਿੰਗਾਂ ਅਤੇ ਪੜ੍ਹਨ ਦੀਆਂ ਥਾਵਾਂ ਰਹਿੰਦੀਆਂ ਹਨ।\n\n“ਅੱਪਡੇਟਾਂ ਦੀ ਜਾਂਚ ਕਰੋ” ਚਾਲੂ ਹੋਣ 'ਤੇ (ਸ਼ੁਰੂ ਵਿੱਚ ਬੰਦ) ਡੀਵਾਈਸ ਹਫ਼ਤੇ ਵਿੱਚ ਲਗਭਗ ਇੱਕ ਵਾਰ ਆਪੇ ਪੁੱਛਦਾ ਹੈ, ਸਿਰਫ਼ ਜਦੋਂ Wi-Fi ਪਹਿਲਾਂ ਹੀ ਚਾਲੂ ਹੋਵੇ ਜਾਂ ਇਹ ਚਾਰਜ ਹੋ ਰਿਹਾ ਹੋਵੇ। ਮਿਲਿਆ ਨਵਾਂ PaperPaw ਇੱਥੇ ਉਡੀਕਦਾ ਹੈ; ਤੁਹਾਡਾ ਪੜ੍ਹਨਾ ਨਹੀਂ ਰੁਕਦਾ। ਖੋਜ ਸਿਰਫ਼ ਇਹ ਭੇਜਦੀ ਹੈ ਕਿ ਡੀਵਾਈਸ ਕੀ ਚਲਾਉਂਦਾ ਹੈ, ਕੋਈ ਨਾਂ ਜਾਂ ਨੰਬਰ ਨਹੀਂ; ਗਿਣਤੀ ਲਈ ਇਹ ਵੀ ਕਿ ਤੁਸੀਂ ਖੁਦ ਪੁੱਛਿਆ ਜਾਂ ਨਹੀਂ ਅਤੇ ਕੀ ਇਹ ਦਿਨ, ਹਫ਼ਤੇ ਜਾਂ ਮਹੀਨੇ ਦੀ ਪਹਿਲੀ ਖੋਜ ਹੈ।\n\nਜੇ ਤੁਹਾਡੇ ਪਲੱਗਇਨਾਂ ਦਾ ਨਵੀਂ ਰਿਲੀਜ਼ ਲਈ ਵਰਜਨ ਹਾਲੇ ਨਹੀਂ, ਤਾਂ ਅੱਪਡੇਟ ਉਡੀਕਦਾ ਹੈ। ਪੁਰਾਣਾ ਵਰਜਨ ਸਿਰਫ਼ ਤੁਹਾਡੇ ਚੁਣਨ 'ਤੇ ਸਥਾਪਤ ਹੁੰਦਾ ਹੈ।\n\nਹੋਰ ਫ਼ਰਮਵੇਅਰ, ਜਿਵੇਂ CrossPoint, ਵੀ ਇੱਥੋਂ ਸਥਾਪਤ ਹੁੰਦਾ ਹੈ: ਇਸ ਦੀ .bin ਫ਼ਾਈਲ updates ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ “ਅੱਪਡੇਟ” ਖੋਲ੍ਹੋ। PaperPaw ਜਾਂਚਦਾ ਹੈ ਕਿ ਇਹ ਇਸ ਡੀਵਾਈਸ ਲਈ ਪੂਰਾ ਅਤੇ ਠੀਕ ਫ਼ਰਮਵੇਅਰ ਹੈ, ਪਰ ਦਸਤਖਤ ਨਾ ਹੋਣ ਕਰਕੇ ਬਣਾਉਣ ਵਾਲਾ ਨਹੀਂ ਦੱਸ ਸਕਦਾ। “ਫਿਰ ਵੀ ਸਥਾਪਤ ਕਰੋ” ਇਸ ਨੂੰ ਫ਼ਲੈਸ਼ ਦੇ ਦੂਜੇ ਅੱਧ ਵਿੱਚ ਲਿਖਦਾ ਹੈ ਅਤੇ ਡੀਵਾਈਸ ਇਸ ਨੂੰ ਚਲਾਉਂਦਾ ਹੈ; PaperPaw ਆਪਣੇ ਅੱਧ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ ਜਦੋਂ ਤੱਕ ਉਹ ਫ਼ਰਮਵੇਅਰ ਉਸ ਉੱਤੇ ਕੁਝ ਸਥਾਪਤ ਨਾ ਕਰੇ। PaperPaw 'ਤੇ ਵਾਪਸ ਆਉਣ ਲਈ ਦੂਜੇ ਫ਼ਰਮਵੇਅਰ ਦੇ ਮੀਨੂ ਤੋਂ paperpaw-<device>-<version>-install.bin ਸਥਾਪਤ ਕਰੋ।"
