store.source.key-changed.help = ਇਸ ਦੀ ਸੂਚੀ 'ਤੇ ਉਸ ਸਮੇਂ ਨਾਲੋਂ ਵੱਖਰੀ ਕੁੰਜੀ ਦੇ ਦਸਤਖਤ ਹਨ ਜਦੋਂ ਤੁਸੀਂ ਇਸ ਨੂੰ ਸ਼ਾਮਲ ਕੀਤਾ ਸੀ, ਇਸ ਲਈ ਕੁਝ ਨਹੀਂ ਪੜ੍ਹਿਆ ਗਿਆ। PaperPaw ਦੇ ਪਲੱਗਇਨਾਂ 'ਤੇ ਮੁੜਨ ਲਈ ਵਾਪਸ ਜਾਓ। ਸਰੋਤ ਨੂੰ ਹਟਾ ਕੇ ਦੁਬਾਰਾ ਸਿਰਫ਼ ਤਾਂ ਸ਼ਾਮਲ ਕਰੋ ਜੇ ਤੁਹਾਨੂੰ ਇਸ ਤਬਦੀਲੀ 'ਤੇ ਭਰੋਸਾ ਹੈ।
