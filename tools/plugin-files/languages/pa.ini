vocabulary.sd.saved.other = {count} ਕਾਰਡ {file} ਵਿੱਚ ਰੱਖਿਅਤ ਕੀਤੇ ਗਏ।
vocabulary.sd.saved.unlinked = {file} ਵਿੱਚ ਰੱਖਿਅਤ ਕੀਤਾ ਗਿਆ, ਪਰ ਡੈੱਕ ਨਾਲ ਜੋੜ ਲਿਖਿਆ ਨਹੀਂ ਜਾ ਸਕਿਆ: ਅਗਲਾ ਅੱਪਡੇਟ ਫ਼ਾਈਲ ਦੁਬਾਰਾ ਪੜ੍ਹੇਗਾ।
vocabulary.sd.save.backup = ਪਹਿਲਾਂ ਵਾਲੀ ਫ਼ਾਈਲ {file} ਵਜੋਂ ਰੱਖੀ ਗਈ ਹੈ।
vocabulary.sd.save.no-deck = ਇਹ ਡੈੱਕ ਹੁਣ ਮੌਜੂਦ ਨਹੀਂ।
vocabulary.sd.save.unreadable = ਜੁੜੀਆਂ ਫ਼ਾਈਲਾਂ ਦੀ ਸੂਚੀ ਪੜ੍ਹੀ ਨਹੀਂ ਜਾ ਸਕੀ, ਇਸ ਲਈ ਕੁਝ ਨਹੀਂ ਲਿਖਿਆ ਗਿਆ। ਕਾਰਡ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.save.full = ਕਾਰਡ ਭਰ ਗਿਆ ਹੈ, ਇਸ ਲਈ ਕੁਝ ਨਹੀਂ ਲਿਖਿਆ ਗਿਆ। ਕੁਝ ਥਾਂ ਖਾਲੀ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.save.too-large = ਇਹ ਡੈੱਕ ਇੱਕ ਫ਼ਾਈਲ ਲਈ ਬਹੁਤ ਵੱਡਾ ਹੈ (4 MiB, ਅੱਪਡੇਟ ਇਸ ਤੋਂ ਵੱਧ ਨਹੀਂ ਪੜ੍ਹਦਾ)। ਕਾਰਡ ਵਾਲੀ ਫ਼ਾਈਲ ਨਹੀਂ ਬਦਲੀ।
vocabulary.sd.save.failed = ਫ਼ਾਈਲ ਲਿਖੀ ਨਹੀਂ ਜਾ ਸਕੀ। ਕਾਰਡ ਵਾਲੀ ਫ਼ਾਈਲ ਨਹੀਂ ਬਦਲੀ। ਕਾਰਡ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.save.not-updated = ਰੱਖਿਅਤ ਨਹੀਂ ਹੋਇਆ: ਕਾਰਡ ਵਾਲੀ ਫ਼ਾਈਲ ਪਹਿਲਾਂ ਪੜ੍ਹੀ ਨਹੀਂ ਜਾ ਸਕੀ, ਅਤੇ ਉਸ ਵਿੱਚ ਅਜਿਹੀਆਂ ਤਬਦੀਲੀਆਂ ਹੋ ਸਕਦੀਆਂ ਹਨ ਜੋ ਡੈੱਕ ਵਿੱਚ ਹਾਲੇ ਨਹੀਂ ਹਨ। ਫ਼ਾਈਲ ਠੀਕ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.save.left-out = ਰੱਖਿਅਤ ਨਹੀਂ ਹੋਇਆ: ਫ਼ਾਈਲ ਦੀਆਂ ਕੁਝ ਲਾਈਨਾਂ ਪੜ੍ਹੀਆਂ ਨਹੀਂ ਜਾ ਸਕੀਆਂ, ਅਤੇ ਰੱਖਿਅਤ ਕਰਨ ਨਾਲ ਉਹ ਗੁੰਮ ਹੋ ਜਾਣਗੀਆਂ। ਫ਼ਾਈਲ ਠੀਕ ਕਰੋ, ਅੱਪਡੇਟ ਕਰੋ, ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.save.anki = {file} ਇੱਕ Anki ਫ਼ਾਈਲ ਹੈ: ਇਹ ਸਿਰਫ਼ ਪੜ੍ਹੀ ਜਾਂਦੀ ਹੈ, ਕਦੇ ਲਿਖੀ ਨਹੀਂ ਜਾਂਦੀ।
vocabulary.sd.save.anki-refused = ਰੱਖਿਅਤ ਨਹੀਂ ਹੋਇਆ: {file} ਇੱਕ Anki ਡੈੱਕ ਹੈ, ਜਿਸ ਨੂੰ PaperPaw ਸਿਰਫ਼ ਪੜ੍ਹਦਾ ਹੈ। ਇਸ ਨੂੰ ਅੱਪਡੇਟ ਕਰਨ ਲਈ Anki ਤੋਂ ਡੈੱਕ ਦੁਬਾਰਾ ਐਕਸਪੋਰਟ ਕਰੋ।
vocabulary.sd.removal-held = ਕੋਈ ਕਾਰਡ ਨਹੀਂ ਹਟਾਇਆ ਗਿਆ: ਕੁਝ ਲਾਈਨਾਂ ਪੜ੍ਹੀਆਂ ਨਹੀਂ ਜਾ ਸਕੀਆਂ।
