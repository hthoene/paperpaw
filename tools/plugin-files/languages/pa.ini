core.host-firmware.foreign = ਇਹ PaperPaw ਦੀ ਥਾਂ ਕੋਈ ਹੋਰ ਡੀਵਾਈਸ ਸਾਫ਼ਟਵੇਅਰ ਲਗਾ ਦਿੰਦਾ ਹੈ। PaperPaw ਆਪਣੇ-ਆਪ ਦੁਬਾਰਾ ਸ਼ੁਰੂ ਨਹੀਂ ਹੋਵੇਗਾ।
core.host-firmware.no-undo = PaperPaw ਇਹ ਤਬਦੀਲੀ ਵਾਪਸ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਵਾਪਸ ਆਉਣ ਲਈ ਦੂਜੇ ਸਾਫ਼ਟਵੇਅਰ ਦਾ ਰਿਕਵਰੀ ਵਿਕਲਪ ਵਰਤੋ ਜਾਂ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਨਾਲ PaperPaw ਮੁੜ-ਸਥਾਪਤ ਕਰੋ।
core.host-firmware.kept = PaperPaw ਡੀਵਾਈਸ ਦੀ ਮੈਮਰੀ ਵਿੱਚ ਰਹਿੰਦਾ ਹੈ। ਮੈਮਰੀ ਕਾਰਡ ਦੀਆਂ ਫ਼ਾਈਲਾਂ ਨਹੀਂ ਬਦਲਦੀਆਂ।
core.host-firmware.unsigned = ਇਸ ਸਾਫ਼ਟਵੇਅਰ 'ਤੇ ਦਸਤਖਤ ਨਹੀਂ ਹਨ। ਸਿਰਫ਼ ਇਸ ਦੀ ਫ਼ਾਈਲ ਬਣਤਰ ਅਤੇ ਡੀਵਾਈਸ ਨਾਲ ਅਨੁਕੂਲਤਾ ਜਾਂਚੀ ਜਾਂਦੀ ਹੈ; ਇਸ ਦੇ ਸਰੋਤ ਦੀ ਪੁਸ਼ਟੀ ਨਹੀਂ ਹੁੰਦੀ।
core.host-firmware.unknown-key = ਇਸ ਸਾਫ਼ਟਵੇਅਰ 'ਤੇ ਕਿਸੇ ਅਣਜਾਣ ਕੁੰਜੀ ਨਾਲ ਦਸਤਖਤ ਕੀਤੇ ਗਏ ਹਨ। ਇਸ ਨੂੰ ਤਾਂ ਹੀ ਸਥਾਪਤ ਕਰੋ ਜੇ ਤੁਹਾਨੂੰ ਇੱਥੇ ਦਿਖਾਈ ਕੁੰਜੀ 'ਤੇ ਭਰੋਸਾ ਹੈ।
core.host-firmware.downgrade = ਇਹ ਪੁਰਾਣਾ ਵਰਜਨ ਪਿਛਲੇ ਵਰਜਨ ਨੂੰ ਆਪਣੇ-ਆਪ ਬਹਾਲ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਵਾਪਸ ਆਉਣ ਲਈ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਨਾਲ PaperPaw ਮੁੜ-ਸਥਾਪਤ ਕਰੋ।
core.host-firmware.early-crash = ਜੇ ਨਵਾਂ ਸਾਫ਼ਟਵੇਅਰ ਆਪਣੀ ਸ਼ੁਰੂਆਤੀ ਸੁਰੱਖਿਆ ਜਾਂਚ ਤੋਂ ਪਹਿਲਾਂ ਕ੍ਰੈਸ਼ ਹੋ ਜਾਵੇ, ਤਾਂ ਡੀਵਾਈਸ ਚਾਲੂ ਹੋਣਾ ਬੰਦ ਕਰ ਸਕਦਾ ਹੈ। PaperPaw ਬਹਾਲ ਕਰਨ ਲਈ ਤੁਹਾਨੂੰ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਦੀ ਲੋੜ ਪਵੇਗੀ।
core.host-remove.question = ਕੀ {name} ਹਟਾਉਣਾ ਹੈ? ਇਸ ਦੇ ਰੱਖਿਅਤ ਡਾਟੇ ਦਾ ਕੀ ਕਰਨਾ ਹੈ?
core.host-remove.keep = ਹਟਾਓ ਅਤੇ ਡਾਟਾ ਰੱਖੋ
core.host-remove.delete = ਹਟਾਓ ਅਤੇ ਡਾਟਾ ਮਿਟਾਓ
core.host-remove.warning = ਡਾਟਾ ਮਿਟਾਉਣ ਨਾਲ ਇਸ ਦੀਆਂ ਰੱਖਿਅਤ ਸੈਟਿੰਗਾਂ ਅਤੇ ਫ਼ਾਈਲਾਂ ਵੀ ਮਿਟ ਜਾਂਦੀਆਂ ਹਨ। ਇਸ ਨੂੰ ਵਾਪਸ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।
core.host-wifi.join = {plugin} Wi-Fi “{network}” ਨਾਲ ਕਨੈਕਟ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ। ਕੀ ਇਜਾਜ਼ਤ ਦੇਣੀ ਹੈ?
core.host-wifi.hotspot = {plugin} Wi-Fi ਹੌਟਸਪੌਟ “{network}” ਚਾਲੂ ਕਰਨਾ ਚਾਹੁੰਦਾ ਹੈ। ਕੀ ਇਜਾਜ਼ਤ ਦੇਣੀ ਹੈ?
core.host-ui.phone-locked = ਡੀਵਾਈਸ ਲੌਕ ਹੋਣ ਵੇਲੇ ਫ਼ੋਨ 'ਤੇ ਟਾਈਪ ਕਰਨਾ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।
core.host-ui.typing-stopped = ਟੈਕਸਟ ਬਹੁਤ ਲੰਮਾ ਹੋਣ ਕਰਕੇ ਲਾਈਵ ਅੱਪਡੇਟ ਰੁਕ ਗਏ ਹਨ। ਤੁਸੀਂ ਟਾਈਪ ਕਰਦੇ ਰਹਿ ਸਕਦੇ ਹੋ; ਪੁਸ਼ਟੀ ਕਰਨ 'ਤੇ ਪੂਰਾ ਟੈਕਸਟ ਭੇਜਿਆ ਜਾਵੇਗਾ।
core.host-ui.text-full = ਟੈਕਸਟ ਬਹੁਤ ਲੰਮਾ ਹੈ। ਇਸ ਨੂੰ ਛੋਟਾ ਕਰ ਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ। ਕੁਝ ਵੀ ਕੱਟਿਆ ਨਹੀਂ ਗਿਆ।
core.host-ui.clipboard-full = ਕਲਿੱਪਬੋਰਡ ਲਈ ਟੈਕਸਟ ਬਹੁਤ ਲੰਮਾ ਹੈ। ਛੋਟੀ ਚੋਣ ਕਾਪੀ ਕਰੋ। ਕਲਿੱਪਬੋਰਡ ਦਾ ਪਿਛਲਾ ਟੈਕਸਟ ਨਹੀਂ ਬਦਲਿਆ।
core.host-ui.clipboard-card = ਕਲਿੱਪਬੋਰਡ ਪੜ੍ਹਿਆ ਜਾਂ ਲਿਖਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਜਾਂਚ ਕਰੋ ਕਿ ਮੈਮਰੀ ਕਾਰਡ ਲੱਗਿਆ ਹੋਇਆ ਹੈ ਅਤੇ ਪੜ੍ਹਿਆ ਜਾ ਸਕਦਾ ਹੈ।
core.host-ui.card-full = ਮੈਮਰੀ ਕਾਰਡ ਭਰ ਗਿਆ ਹੈ। ਕੁਝ ਥਾਂ ਖਾਲੀ ਕਰ ਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
core.host-ui.card-error = ਮੈਮਰੀ ਕਾਰਡ 'ਤੇ ਟੈਕਸਟ ਪੜ੍ਹਿਆ ਜਾਂ ਰੱਖਿਅਤ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਿਆ। ਕਾਰਡ ਦੀ ਜਾਂਚ ਕਰ ਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
core.host-permission.library = ਤੁਹਾਡੀ ਪੂਰੀ ਲਾਇਬ੍ਰੇਰੀ, ਪੜ੍ਹਨ ਦੀਆਂ ਥਾਂਵਾਂ, ਅਤੇ ਹਰ ਪਲੱਗਇਨ ਦੀਆਂ ਹਾਈਲਾਈਟਾਂ ਅਤੇ ਨੋਟ ਪੜ੍ਹ ਸਕਦਾ ਹੈ, ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਬਦਲ ਸਕਦਾ ਹੈ।
core.host-library.import-failed = ਕਿਤਾਬ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਸ਼ਾਮਲ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕੀ। ਮੈਮਰੀ ਕਾਰਡ ਦੀ ਜਾਂਚ ਕਰ ਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
core.host-library.name-taken = ਇਸ ਨਾਂ ਦੀ ਕਿਤਾਬ ਪਹਿਲਾਂ ਹੀ ਮੌਜੂਦ ਹੈ। ਕੋਈ ਹੋਰ ਨਾਂ ਚੁਣੋ।
core.host-library.replace-denied = ਇਹ ਪਲੱਗਇਨ ਉਸ ਕਿਤਾਬ ਨੂੰ ਨਹੀਂ ਬਦਲ ਸਕਦਾ। ਇਹ ਸਿਰਫ਼ ਉਹ ਕਿਤਾਬਾਂ ਬਦਲ ਸਕਦਾ ਹੈ ਜੋ ਇਸ ਨੇ ਖੁਦ ਸ਼ਾਮਲ ਕੀਤੀਆਂ ਹੋਣ ਅਤੇ ਜਿਨ੍ਹਾਂ ਦੀ ਥਾਂ ਉਦੋਂ ਤੋਂ ਨਾ ਬਦਲੀ ਹੋਵੇ।
core.host-safe-mode.power-escape = ਪਲੱਗਇਨ {plugin} ਬੰਦ ਕਰ ਦਿੱਤਾ ਗਿਆ, ਕਿਉਂਕਿ ਜਦੋਂ ਤੁਸੀਂ ਡੀਵਾਈਸ ਮੁੜ-ਚਾਲੂ ਕਰਨ ਲਈ ਪਾਵਰ ਬਟਨ ਦਬਾਈ ਰੱਖਿਆ, ਇਹ ਜਵਾਬ ਨਹੀਂ ਦੇ ਰਿਹਾ ਸੀ।
