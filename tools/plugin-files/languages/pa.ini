menu.plugin.description = ਸਕ੍ਰੀਨ ਦੇ ਹੇਠਾਂ ਮੀਨੂ, ਕਾਰਵਾਈਆਂ ਅਤੇ ਸੈਟਿੰਗਾਂ ਨਾਲ।
menu.plugin.how = "ਮੀਨੂ ਦੱਸਦਾ ਹੈ ਕਿ ਤੁਸੀਂ ਕੀ ਕਰ ਅਤੇ ਸੈੱਟ ਕਰ ਸਕਦੇ ਹੋ। ਇਹ ਸਕ੍ਰੀਨ ਦੇ ਹੇਠਾਂ, ਜੋ ਵੀ ਖੁੱਲ੍ਹਾ ਹੋਵੇ ਉਸ ਦੇ ਉੱਪਰ ਖੁੱਲ੍ਹਦਾ ਹੈ: ਪੜ੍ਹਦੇ ਸਮੇਂ ਸਕ੍ਰੀਨ ਦੇ ਵਿਚਕਾਰ ਟੈਪ ਕਰੋ ਜਾਂ “ਚੁਣੋ” ਦਬਾਓ। ਕੋਈ ਐਂਟਰੀ ਚਲਾਉਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ ਜਾਂ ਉਸ ਨੂੰ ਚੁਣੋ।\n\nਮੀਨੂ ਵਿੱਚ ਸੈਟਿੰਗਾਂ ਆਪਣਾ ਮੁੱਲ ਦਿਖਾਉਂਦੀਆਂ ਹਨ ਅਤੇ ਉੱਥੇ ਹੀ ਬਦਲਦੀਆਂ ਹਨ, ਇਸ ਲਈ ਮੀਨੂ ਖੁੱਲ੍ਹਾ ਰਹਿੰਦਾ ਹੈ। ਜਿਸ ਐਂਟਰੀ ਵਿੱਚ ਹੋਰ ਐਂਟਰੀਆਂ ਹੋਣ, ਉਹ ਉਪ-ਮੀਨੂ ਖੋਲ੍ਹਦੀ ਹੈ।\n\nਤਤਕਾਲ ਪੈਨਲ ਲਈ ਉੱਪਰਲੇ ਕਿਨਾਰੇ ਤੋਂ ਹੇਠਾਂ ਸਵਾਈਪ ਕਰੋ: ਜੋ ਤੁਸੀਂ ਅਕਸਰ ਬਦਲਦੇ ਹੋ, ਬਟਨਾਂ ਵਜੋਂ। ਬਟਨ ਬਦਲਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ, ਉਸ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਲਈ ਦਬਾਈ ਰੱਖੋ। ਸਿਰਫ਼ ਬਟਨਾਂ ਨਾਲ: ਤੀਰ ਬਟਨ ਚੁਣਦੇ ਹਨ, “ਚੁਣੋ” ਬਦਲਦਾ ਹੈ ਅਤੇ “ਵਾਪਸ” ਬੰਦ ਕਰਦਾ ਹੈ। “ਦਿੱਖ” ਹੇਠਾਂ “ਮੀਨੂ” ਮੀਨੂ ਨੂੰ ਸੂਚੀ ਜਾਂ ਟਾਈਲਾਂ ਵਜੋਂ ਦਿਖਾਉਂਦਾ ਹੈ।"
