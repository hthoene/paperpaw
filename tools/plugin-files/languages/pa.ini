core.usb-drive.text = USB ਡਰਾਈਵ ਵਜੋਂ ਕਨੈਕਟ ਹੈ: ਕਾਰਡ ਕੰਪਿਊਟਰ ਕੋਲ ਹੈ। ਇਸ ਨੂੰ ਵਾਪਸ ਲੈਣ ਲਈ ਉੱਥੇ ਡਰਾਈਵ ਬਾਹਰ ਕੱਢੋ, ਜਾਂ “ਵਾਪਸ” ਦਬਾਓ; ਫਿਰ “ਠੀਕ ਹੈ” ਦਬਾਓ। ਤੁਹਾਡੇ ਵੱਲੋਂ ਕਾਪੀ ਕੀਤੀਆਂ ਫ਼ਾਈਲਾਂ ਬਾਅਦ ਵਿੱਚ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਦਿਸਣਗੀਆਂ।
core.usb-link.title = ਕੀ USB ਡਿਵੈਲਪਰ ਟੂਲਾਂ ਦੀ ਇਜਾਜ਼ਤ ਦੇਣੀ ਹੈ?
core.usb-link.text = USB ਕੇਬਲ ਨਾਲ ਜੁੜਿਆ ਕੰਪਿਊਟਰ ਬਟਨ ਦਬਾ ਸਕੇਗਾ, ਸਕ੍ਰੀਨਸ਼ਾਟ ਲੈ ਸਕੇਗਾ ਅਤੇ ਕਿਤਾਬਾਂ ਤੇ ਪਲੱਗਇਨ ਫ਼ਾਈਲਾਂ ਪੜ੍ਹ ਅਤੇ ਲਿਖ ਸਕੇਗਾ। ਇਹ ਗੁਪਤ ਜਾਣਕਾਰੀ ਨਹੀਂ ਪੜ੍ਹ ਸਕਦਾ ਅਤੇ ਕੋਡ ਸਥਾਪਤ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਡੀਵਾਈਸ ਦੇ ਮੁੜ-ਚਾਲੂ ਹੋਣ ਜਾਂ ਸਲੀਪ ਵਿੱਚ ਜਾਣ 'ਤੇ, ਕੇਬਲ ਕੱਢਣ 'ਤੇ, ਜਾਂ ਤੁਹਾਡੇ ਵੱਲੋਂ ਇੱਥੇ ਬੰਦ ਕਰਨ 'ਤੇ ਇਹ ਬੰਦ ਹੋ ਜਾਂਦਾ ਹੈ।
