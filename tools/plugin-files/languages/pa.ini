diagnostics.check.screen.help = ਹਰ ਸਲੇਟੀ ਪੱਧਰ ਆਪਣੀ ਵੱਖਰੀ ਪੱਟੀ ਵਜੋਂ ਦਿਸਣਾ ਚਾਹੀਦਾ ਹੈ। ਪੈਟਰਨ ਕੁਝ ਵਾਰ ਉਲਟਾਓ: ਪਿਛਲੇ ਪੈਟਰਨ ਦਾ ਜੋ ਬਚਿਆ ਰਹਿੰਦਾ ਹੈ ਉਹ ਘੋਸਟਿੰਗ ਹੈ। ਪੂਰਾ ਰਿਫ੍ਰੈਸ਼ ਇਸ ਨੂੰ ਸਾਫ਼ ਕਰ ਦੇਣਾ ਚਾਹੀਦਾ ਹੈ।
diagnostics.check.buttons.title = ਬਟਨ
diagnostics.check.buttons.help = “ਸ਼ੁਰੂ ਕਰੋ” ਚੁਣੋ, ਫਿਰ ਹਰ ਬਟਨ ਮੰਗੇ ਜਾਣ 'ਤੇ ਦਬਾਓ। ਜੇ ਕੋਈ ਕੰਮ ਨਾ ਕਰੇ, ਤਾਂ ਅੱਗੇ ਵਧਣ ਲਈ ਕੋਈ ਹੋਰ ਬਟਨ ਦਬਾਈ ਰੱਖੋ।
