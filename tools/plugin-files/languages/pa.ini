about.plugins.help = ਇਸ ਫ਼ਰਮਵੇਅਰ ਵਿੱਚ ਕੋਡ ਵਾਲੇ ਪਲੱਗਇਨ, ਉਹਨਾਂ ਦੇ ਵਰਜਨਾਂ ਸਮੇਤ। ਅੱਪਡੇਟ ਇਹੀ ਪਲੱਗਇਨ ਦੁਬਾਰਾ ਲਿਆਉਂਦਾ ਹੈ; ਜੋ ਨਹੀਂ ਲਿਆ ਸਕਦਾ, ਉਹ ਪਹਿਲਾਂ ਦੱਸ ਦਿੰਦਾ ਹੈ।
