vocabulary.plugin.name = ਸ਼ਬਦਾਵਲੀ
vocabulary.plugin.description = ਤੁਹਾਡੇ ਦੇਖੇ ਸ਼ਬਦ ਉਹਨਾਂ ਦੇ ਵਾਕਾਂ ਸਮੇਤ ਰੱਖਦੀ ਹੈ, ਅਤੇ ਫ਼ੋਨ 'ਤੇ ਬਣਾਏ ਫ਼ਲੈਸ਼ ਕਾਰਡ ਅੰਤਰਾਲ ਦੁਹਰਾਈ ਨਾਲ ਦੁਹਰਾਉਂਦੀ ਹੈ।
vocabulary.plugin.how = "ਸ਼ਬਦਾਵਲੀ ਪੜ੍ਹਦੇ ਸਮੇਂ ਤੁਹਾਡੇ ਦੇਖੇ ਸ਼ਬਦ, ਹਰ ਇੱਕ ਉਸ ਦੇ ਵਾਕ ਸਮੇਤ, ਬਾਅਦ ਲਈ ਰੱਖਦੀ ਹੈ। ਸੂਚੀ ਟੂਲ ਵਿੱਚ ਹੈ, ਨਵੇਂ ਪਹਿਲਾਂ; ਸ਼ਬਦ ਦਾ ਅਰਥ ਦੁਬਾਰਾ ਦੇਖਣ ਲਈ ਉਸ ਨੂੰ ਚੁਣੋ। ਆਖਰੀ ਕਤਾਰ “ਐਕਸਪੋਰਟ” ਇਹਨਾਂ ਨੂੰ Anki ਵਰਗੀਆਂ ਐਪਾਂ ਲਈ ਰੱਖਿਅਤ ਕਰਦੀ ਹੈ। ਸੂਚੀ ਨਵੇਂ 2000 ਸ਼ਬਦ ਰੱਖਦੀ ਹੈ, ਪੁਰਾਣੇ ਹਟ ਜਾਂਦੇ ਹਨ: ਸਾਰੇ ਰੱਖਣ ਲਈ ਪਹਿਲਾਂ ਐਕਸਪੋਰਟ ਕਰੋ।\n\nਫ਼ਲੈਸ਼ ਕਾਰਡ (ਟੂਲ ਵਿੱਚ) ਅੰਤਰਾਲ ਦੁਹਰਾਈ ਨਾਲ ਪੁੱਛਦੇ ਹਨ: “ਜਵਾਬ ਦਿਖਾਓ” ਤੋਂ ਬਾਅਦ ਹਰ ਕਾਰਡ ਨੂੰ ਦੁਬਾਰਾ, ਔਖਾ, ਚੰਗਾ ਜਾਂ ਆਸਾਨ ਚੁਣੋ; ਇਸ ਤੋਂ ਤੈਅ ਹੁੰਦਾ ਹੈ ਕਿ ਕਾਰਡ ਕਦੋਂ ਮੁੜ ਆਵੇ। ਡੈੱਕ “ਫ਼ੋਨ ਨਾਲ ਸੋਧੋ” ਨਾਲ ਬਣਾਓ: ਉਸੇ Wi-Fi ਵਿੱਚ ਫ਼ੋਨ ਨਾਲ ਕੋਡ ਸਕੈਨ ਕਰੋ ਅਤੇ ਕਾਰਡ ਲਿਖੋ, ਜਾਂ ਡੈੱਕ ਖੋਲ੍ਹ ਕੇ “ਇੱਕੋ ਵਾਰ ਕਈ ਕਾਰਡ” ਚੁਣੋ: CSV, TSV ਜਾਂ TXT ਫ਼ਾਈਲ (ਹਰ ਲਾਈਨ 'ਤੇ ਇੱਕ ਕਾਰਡ: ਅਗਲਾ ਪਾਸਾ, ਪਿਛਲਾ ਪਾਸਾ, ਉਦਾਹਰਨ; UTF-8), ਚਿਪਕਾਈ ਸੂਚੀ, ਜਾਂ Anki ਡੈੱਕ (.apkg, “Support older Anki versions” ਨਾਲ ਐਕਸਪੋਰਟ ਕੀਤਾ)।\n\nਜਾਂ SD ਕਾਰਡ ਦੇ Flashcards ਫ਼ੋਲਡਰ ਵਿੱਚ ਹਰ ਡੈੱਕ ਲਈ ਅਜਿਹੀ ਇੱਕ ਫ਼ਾਈਲ ਰੱਖੋ (Spanish.tsv ਤੋਂ ਡੈੱਕ Spanish ਬਣਦਾ ਹੈ) ਅਤੇ ਫ਼ਲੈਸ਼ ਕਾਰਡ ਵਿੱਚ “SD ਕਾਰਡ ਤੋਂ ਕਾਰਡ” ਚੁਣੋ, ਜਾਂ ਖੋਲ੍ਹਣ 'ਤੇ ਇਹ ਆਪੇ ਹੋਣ ਦਿਓ। ਨਵੀਂ ਜਾਂ ਬਦਲੀ ਫ਼ਾਈਲ ਆਪਣੇ ਡੈੱਕ ਵਿੱਚ ਮਿਲਾਈ ਜਾਂਦੀ ਹੈ। ਪਿਛਲਾ ਪਾਸਾ ਜਾਂ ਉਦਾਹਰਨ ਬਦਲਣ 'ਤੇ ਕਾਰਡ ਆਪਣੀ ਪ੍ਰਗਤੀ ਰੱਖਦਾ ਹੈ; ਅਗਲਾ ਪਾਸਾ ਬਦਲਣ 'ਤੇ ਇਹ ਨਵਾਂ ਕਾਰਡ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ (ਖਾਲੀ ਥਾਂ ਅਤੇ ਵੱਡੇ-ਛੋਟੇ ਅੱਖਰ ਨਹੀਂ ਗਿਣੇ ਜਾਂਦੇ)। ਫ਼ਾਈਲ ਵਿੱਚੋਂ ਮਿਟਾਈ ਲਾਈਨ ਕਾਰਡ ਨਹੀਂ ਮਿਟਾਉਂਦੀ, ਜਦੋਂ ਤੱਕ ਉਸ ਡੈੱਕ ਲਈ “ਫ਼ਾਈਲ ਵਿੱਚ ਨਾ ਮਿਲੇ ਕਾਰਡ” “ਹਟਾਓ” 'ਤੇ ਨਾ ਹੋਵੇ। “ਕਾਰਡ 'ਤੇ ਰੱਖਿਅਤ ਕਰੋ” ਡੈੱਕ ਨੂੰ id ਕਾਲਮ ਸਮੇਤ ਫ਼ਾਈਲ ਵਿੱਚ ਲਿਖਦਾ ਹੈ (ਹੋਰ ਕਾਲਮ ਨਹੀਂ ਰਹਿੰਦੇ; ਪੁਰਾਣੀ ਫ਼ਾਈਲ ਪਹਿਲੀ ਵਾਰ _name.bak.tsv ਵਿੱਚ ਕਾਪੀ ਹੁੰਦੀ ਹੈ)। 4 MiB ਜਾਂ 20000 ਲਾਈਨਾਂ ਤੋਂ ਵੱਡੀ ਫ਼ਾਈਲ ਨਹੀਂ ਪੜ੍ਹੀ ਜਾਂਦੀ; ਇਹ CSV UTF-8 ਹੋਵੇ, UTF-16 ਨਹੀਂ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ, ਪੜ੍ਹਨਾ ਹੇਠਾਂ, “ਦੇਖੇ ਸ਼ਬਦਾਂ ਦੇ ਕਾਰਡ” ਹਰ ਦੇਖੇ ਸ਼ਬਦ ਨੂੰ “ਦੇਖੇ ਗਏ” ਡੈੱਕ ਵਿੱਚ ਪਾਉਂਦਾ ਹੈ।"
