plugin-manager.plugin.name = ਪਲੱਗਇਨ ਮੈਨੇਜਰ
plugin-manager.plugin.description = ਪਲੱਗਇਨਾਂ ਦੀ ਸੂਚੀ ਦਿਖਾਉਂਦਾ ਹੈ ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਚਾਲੂ ਅਤੇ ਬੰਦ ਕਰਦਾ ਹੈ।
plugin-manager.plugin.how = "ਪਲੱਗਇਨ ਮੈਨੇਜਰ ਹਰ ਪਲੱਗਇਨ ਨੂੰ ਉਸ ਦੇ ਵਰਜਨ ਅਤੇ ਵੇਰਵੇ ਸਮੇਤ ਦਿਖਾਉਂਦਾ ਹੈ, ਅਤੇ ਪਲੱਗਇਨਾਂ ਨੂੰ ਚਾਲੂ ਅਤੇ ਬੰਦ ਕਰਦਾ ਹੈ।\n\nਇਹ “ਸੈਟਿੰਗਾਂ” ਵਿੱਚ “ਪਲੱਗਇਨ ਪ੍ਰਬੰਧਿਤ ਕਰੋ” ਵਜੋਂ ਮਿਲਦਾ ਹੈ। “ਪਲੱਗਇਨ ਸੈਟਿੰਗਾਂ” ਤਰਜੀਹਾਂ ਲਈ ਇੱਕ ਵੱਖਰਾ ਪੰਨਾ ਹੈ, ਜਿਵੇਂ ਹਰ ਪਲੱਗਇਨ ਦੀ ਨੈੱਟਵਰਕ ਵਰਤੋਂ। ਪਲੱਗਇਨ ਨੂੰ ਚਾਲੂ ਜਾਂ ਬੰਦ ਕਰਨ ਲਈ ਇਸ 'ਤੇ ਟੈਪ ਕਰੋ (ਬਟਨਾਂ ਨਾਲ: ਇਸ ਨੂੰ ਚੁਣੋ)। ਤਬਦੀਲੀ ਮੁੜ-ਚਾਲੂ ਕਰਨ ਤੋਂ ਬਾਅਦ ਲਾਗੂ ਹੁੰਦੀ ਹੈ: ਫਿਰ ਹੇਠਲੀ ਪੱਟੀ “ਹੁਣੇ ਮੁੜ-ਚਾਲੂ ਕਰੋ” ਦਿੰਦੀ ਹੈ। ਪਲੱਗਇਨ ਕਿਵੇਂ ਕੰਮ ਕਰਦਾ ਹੈ, ਇਹ ਪੜ੍ਹਨ ਲਈ ਇਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ: “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)।\n\n“ਹਮੇਸ਼ਾ ਚਾਲੂ” ਵਾਲਾ ਪਲੱਗਇਨ ਬੰਦ ਨਹੀਂ ਹੋ ਸਕਦਾ, ਅਤੇ “ਲੋੜੀਂਦਾ” ਵਾਲਾ ਸਿਰਫ਼ ਤਦ ਜਦੋਂ ਕੋਈ ਹੋਰ ਪਲੱਗਇਨ ਉਸ ਦਾ ਕੰਮ ਕਰੇ, ਨਹੀਂ ਤਾਂ PaperPaw ਕੋਲ ਵਾਪਸੀ ਦਾ ਕੋਈ ਰਾਹ ਨਾ ਰਹਿੰਦਾ। “ਸਕ੍ਰੀਨਾਂ” ਹੇਠਾਂ ਤੁਸੀਂ ਚੁਣਦੇ ਹੋ ਕਿ ਜਿਹੜੀ ਥਾਂ ਕਈ ਪਲੱਗਇਨ ਦਿੰਦੇ ਹਨ, ਉਹ ਕਿਹੜਾ ਪਲੱਗਇਨ ਦਿਖਾਵੇ।"
