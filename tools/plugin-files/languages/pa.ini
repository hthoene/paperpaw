plugin-manager.code.safe-mode = ਇਸ ਵਾਰ ਲੋਡ ਨਹੀਂ ਹੋਇਆ (ਸੁਰੱਖਿਅਤ ਮੋਡ): ਮੁੜ-ਚਾਲੂ ਕਰਨ ਤੋਂ ਬਾਅਦ ਲੋਡ ਹੋਵੇਗਾ।
