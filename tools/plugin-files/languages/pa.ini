vocabulary.sd.skipped.other = {count} ਲਾਈਨਾਂ ਛੱਡੀਆਂ ਗਈਆਂ
vocabulary.sd.skipped-notes.one = {count} ਨੋਟ ਛੱਡਿਆ ਗਿਆ: ਇਹ ਬਹੁਤ ਲੰਮਾ ਹੈ (ਜਿਵੇਂ ਇਸ ਵਿੱਚ ਤਸਵੀਰ ਹੈ)
vocabulary.sd.skipped-notes.other = {count} ਨੋਟ ਛੱਡੇ ਗਏ: ਇਹ ਬਹੁਤ ਲੰਮੇ ਹਨ (ਜਿਵੇਂ ਇਹਨਾਂ ਵਿੱਚ ਤਸਵੀਰ ਹੈ)
vocabulary.sd.no-room = {count} ਲਾਈਨਾਂ ਨਹੀਂ ਸਮਾਈਆਂ: ਇੱਕ ਡੈੱਕ ਵਿੱਚ 20000 ਕਾਰਡ ਆਉਂਦੇ ਹਨ।
vocabulary.sd.outcome.same = ਪਿਛਲੇ ਅੱਪਡੇਟ ਤੋਂ ਬਾਅਦ ਨਹੀਂ ਬਦਲੀ।
vocabulary.sd.outcome.unreadable = ਇਹ ਫ਼ਾਈਲ ਪੜ੍ਹੀ ਨਹੀਂ ਜਾ ਸਕੀ। ਕਾਰਡ ਜਾਂਚੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
vocabulary.sd.outcome.too-many = ਪਹਿਲਾਂ ਹੀ 50 ਡੈੱਕ ਹਨ, ਇਸ ਲਈ ਇਹ ਫ਼ਾਈਲ ਨਹੀਂ ਪੜ੍ਹੀ ਗਈ। ਪਹਿਲਾਂ ਕੋਈ ਡੈੱਕ ਮਿਟਾਓ।
vocabulary.sd.outcome.crowded = ਬਹੁਤ ਸਾਰੇ ਕਾਰਡਾਂ ਦਾ ਅਗਲਾ ਪਾਸਾ ਇੱਕੋ ਹੈ, ਇਸ ਲਈ ਇਹ ਫ਼ਾਈਲ ਨਹੀਂ ਪੜ੍ਹੀ ਗਈ। ਅਗਲੇ ਪਾਸੇ ਵੱਖ-ਵੱਖ ਕਰੋ।
vocabulary.sd.outcome.no-cards = ਕੋਈ ਕਾਰਡ ਨਹੀਂ ਮਿਲਿਆ। ਕਾਰਡ ਅਗਲੇ ਪਾਸੇ ਦੇ ਟੈਕਸਟ ਵਾਲੀ ਲਾਈਨ ਹੈ; ਅਗਲਾ ਪਾਸਾ ਪਹਿਲਾ ਕਾਲਮ ਹੈ।
vocabulary.sd.outcome.too-large = ਇਹ ਫ਼ਾਈਲ ਬਹੁਤ ਵੱਡੀ ਹੈ: ਵੱਧ ਤੋਂ ਵੱਧ 4 MiB ਅਤੇ 20000 ਲਾਈਨਾਂ। ਇਸ ਨੂੰ ਕਈ ਫ਼ਾਈਲਾਂ ਵਿੱਚ ਵੰਡੋ।
vocabulary.sd.outcome.utf16 = ਇਹ ਫ਼ਾਈਲ UTF-16 ਵਜੋਂ ਰੱਖਿਅਤ ਹੈ। ਇਸ ਨੂੰ ਦੁਬਾਰਾ CSV UTF-8 ਵਜੋਂ ਰੱਖਿਅਤ ਕਰੋ (ਸਪ੍ਰੈਡਸ਼ੀਟ ਵਿੱਚ: CSV UTF-8)।
vocabulary.sd.outcome.no-notes = ਕੋਈ ਨੋਟ ਨਹੀਂ ਮਿਲਿਆ: ਇਹ Anki ਡੈੱਕ ਨਹੀਂ ਹੈ, ਜਾਂ ਇਸ ਵਿੱਚ ਨੋਟ ਨਹੀਂ ਹਨ। ਇਸ ਨੂੰ Anki ਤੋਂ Anki ਡੈੱਕ ਪੈਕੇਜ (.apkg) ਵਜੋਂ ਐਕਸਪੋਰਟ ਕਰੋ।
vocabulary.sd.outcome.newer-anki = ਇਹ ਡੈੱਕ Anki ਦੇ ਸਭ ਤੋਂ ਨਵੇਂ ਫ਼ਾਰਮੈਟ ਵਿੱਚ ਹੈ। “Support older Anki versions” 'ਤੇ ਨਿਸ਼ਾਨ ਲਾ ਕੇ ਇਸ ਨੂੰ ਦੁਬਾਰਾ ਐਕਸਪੋਰਟ ਕਰੋ।
vocabulary.sd.outcome.deck-too-large = ਇਹ Anki ਡੈੱਕ ਇੱਥੇ ਪੜ੍ਹਨ ਲਈ ਬਹੁਤ ਵੱਡਾ ਹੈ: ਵੱਧ ਤੋਂ ਵੱਧ 4000 ਫ਼ਾਈਲਾਂ, 4 MiB ਨੋਟ ਅਤੇ 20000 ਨੋਟ। ਇਸ ਨੂੰ ਮੀਡੀਆ ਅਤੇ ਸਮਾਂ-ਸੂਚੀ ਤੋਂ ਬਿਨਾਂ ਐਕਸਪੋਰਟ ਕਰੋ, ਜਾਂ ਵੰਡੋ।
vocabulary.sd.line = ਲਾਈਨ {line}
vocabulary.sd.fault.no-front = ਅਗਲੇ ਪਾਸੇ ਵਾਲੇ ਕਾਲਮ ਵਿੱਚ ਕੋਈ ਟੈਕਸਟ ਨਹੀਂ। ਉੱਥੇ ਸ਼ਬਦ ਲਿਖੋ।
vocabulary.sd.fault.not-utf8 = UTF-8 ਟੈਕਸਟ ਨਹੀਂ। ਫ਼ਾਈਲ ਨੂੰ UTF-8 ਵਜੋਂ ਰੱਖਿਅਤ ਕਰੋ (ਸਪ੍ਰੈਡਸ਼ੀਟ ਵਿੱਚ: CSV UTF-8)।
vocabulary.sd.fault.too-long = 8 KiB ਤੋਂ ਲੰਮਾ। ਕਾਰਡ ਛੋਟਾ ਕਰੋ।
vocabulary.sd.fault.open-quote = ਇੱਕ ਹਵਾਲਾ ਚਿੰਨ੍ਹ ਖੁੱਲ੍ਹਾ ਹੈ ਅਤੇ ਬੰਦ ਨਹੀਂ ਹੋਇਆ। ਇਸ ਨੂੰ ਬੰਦ ਕਰੋ ਜਾਂ ਹਟਾਓ।
vocabulary.setting.sd-auto = ਖੋਲ੍ਹਣ 'ਤੇ ਕਾਰਡ ਤੋਂ ਡੈੱਕ ਅੱਪਡੇਟ ਕਰੋ
vocabulary.setting.sd-auto.help = ਫ਼ਲੈਸ਼ ਕਾਰਡ ਫ਼ੋਲਡਰ ਦੀਆਂ ਨਵੀਆਂ ਜਾਂ ਬਦਲੀਆਂ ਫ਼ਾਈਲਾਂ ਪੜ੍ਹਦੇ ਹਨ।
vocabulary.setting.sd-folder = ਡੈੱਕ ਫ਼ਾਈਲਾਂ ਦਾ ਫ਼ੋਲਡਰ
vocabulary.setting.sd-folder.help = SD ਕਾਰਡ 'ਤੇ: ਇਸ ਵਿੱਚ ਹਰ CSV, TSV ਜਾਂ Anki ਫ਼ਾਈਲ ਇੱਕ ਡੈੱਕ ਹੈ।
vocabulary.sd.readme = "ਫ਼ਾਈਲਾਂ ਤੋਂ ਫ਼ਲੈਸ਼ ਕਾਰਡ\n\nਇੱਥੇ ਹਰ ਡੈੱਕ ਲਈ ਇੱਕ ਫ਼ਾਈਲ ਰੱਖੋ: Spanish.tsv ਤੋਂ ਡੈੱਕ Spanish ਬਣਦਾ ਹੈ।\nਫ਼ਾਈਲਾਂ: .tsv, .csv ਜਾਂ .txt (UTF-8), ਜਾਂ .apkg: Anki ਡੈੱਕ, “Support older Anki versions” ਨਾਲ ਐਕਸਪੋਰਟ ਕੀਤਾ। ਇਸ ਦੇ ਨੋਟਾਂ ਦੇ ਪਹਿਲੇ ਤਿੰਨ ਖੇਤਰ ਅਗਲਾ ਪਾਸਾ, ਪਿਛਲਾ ਪਾਸਾ ਅਤੇ ਉਦਾਹਰਨ ਬਣਦੇ ਹਨ; ਸਮਾਂ-ਸੂਚੀ ਅਤੇ ਮੀਡੀਆ ਨਹੀਂ ਪੜ੍ਹੇ ਜਾਂਦੇ, ਅਤੇ PaperPaw ਕਦੇ Anki ਫ਼ਾਈਲ ਨਹੀਂ ਲਿਖਦਾ।\n\nਹਰ ਲਾਈਨ 'ਤੇ ਇੱਕ ਕਾਰਡ: ਅਗਲਾ ਪਾਸਾ, ਪਿਛਲਾ ਪਾਸਾ ਅਤੇ ਉਦਾਹਰਨ (ਵਿਕਲਪਿਕ), ਟੈਬ, ਕੌਮੇ ਜਾਂ ਸੈਮੀਕੋਲਨ ਨਾਲ ਵੱਖ। ਪਹਿਲੀ ਲਾਈਨ ਕਾਲਮਾਂ ਦੇ ਨਾਂ ਦੇ ਸਕਦੀ ਹੈ: front, back, example। ਉਦਾਹਰਨ:\n\nKatze\tcat\tDie Katze schläft.\n\nਫਿਰ ਰੀਡਰ 'ਤੇ ਫ਼ਲੈਸ਼ ਕਾਰਡ ਖੋਲ੍ਹੋ, “SD ਕਾਰਡ ਤੋਂ ਕਾਰਡ” ਅਤੇ ਫਿਰ “ਡੈੱਕ ਅੱਪਡੇਟ ਕਰੋ” ਚੁਣੋ।\n\nਜਾਣਨਯੋਗ:\n- ਡੈੱਕ ਤੁਹਾਡੀ ਪ੍ਰਗਤੀ ਸਮੇਤ ਰੀਡਰ 'ਤੇ ਰਹਿੰਦੇ ਹਨ। ਨਵੀਂ ਜਾਂ ਬਦਲੀ ਫ਼ਾਈਲ ਪੜ੍ਹੀ ਜਾਂਦੀ ਹੈ ਅਤੇ ਉਸ ਦੇ ਕਾਰਡ ਡੈੱਕ ਵਿੱਚ ਸ਼ਾਮਲ ਹੁੰਦੇ ਜਾਂ ਬਦਲਦੇ ਹਨ।\n- ਪਿਛਲਾ ਪਾਸਾ ਜਾਂ ਉਦਾਹਰਨ ਬਦਲੋ: ਕਾਰਡ ਬਦਲਦਾ ਹੈ ਅਤੇ ਪ੍ਰਗਤੀ ਰੱਖਦਾ ਹੈ।\n- ਅਗਲਾ ਪਾਸਾ ਬਦਲੋ: ਇਹ ਨਵਾਂ ਕਾਰਡ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪੁਰਾਣਾ ਮੁੜ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ (ਖਾਲੀ ਥਾਂ ਅਤੇ ਵੱਡੇ-ਛੋਟੇ ਅੱਖਰ ਨਹੀਂ ਗਿਣੇ ਜਾਂਦੇ)। ਡੈੱਕ ਨੂੰ ਫ਼ਾਈਲ ਵਿੱਚ ਰੱਖਿਅਤ ਕਰੋ (“SD ਕਾਰਡ ਤੋਂ ਕਾਰਡ”, “ਕਾਰਡ 'ਤੇ ਰੱਖਿਅਤ ਕਰੋ”): ਹਰ ਕਾਰਡ ਨੂੰ id ਕਾਲਮ ਵਿੱਚ ਨੰਬਰ ਮਿਲਦਾ ਹੈ; ਫਿਰ ਅਗਲਾ ਪਾਸਾ ਬਦਲਣ 'ਤੇ, ਫ਼ਾਈਲ ਦੀਆਂ ਪਹਿਲੀਆਂ ਦੋ ਲਾਈਨਾਂ ਜਿਵੇਂ ਹਨ ਰੱਖ ਕੇ, ਕਾਰਡ ਪ੍ਰਗਤੀ ਰੱਖਦਾ ਹੈ।\n- ਰੱਖਿਅਤ ਕਰਨਾ ਡੈੱਕ ਦੇ ਕਾਰਡ ਲਿਖਦਾ ਹੈ; ਬਿਨਾਂ ਅਗਲੇ ਪਾਸੇ ਵਾਲੀਆਂ ਲਾਈਨਾਂ ਨਹੀਂ ਰਹਿੰਦੀਆਂ; ਪੁਰਾਣੀ ਫ਼ਾਈਲ _name.bak.tsv ਵਿੱਚ ਕਾਪੀ ਹੁੰਦੀ ਹੈ।\n- ਫ਼ਾਈਲ CSV UTF-8 ਵਜੋਂ ਰੱਖਿਅਤ ਕਰੋ (UTF-16 ਨਹੀਂ)। 4 MiB ਜਾਂ 20000 ਲਾਈਨਾਂ ਤੋਂ ਵੱਡੀ ਫ਼ਾਈਲ ਨਹੀਂ ਪੜ੍ਹੀ ਜਾਂਦੀ: ਇਸ ਨੂੰ ਵੰਡੋ।\n- ਫ਼ਾਈਲ ਵਿੱਚੋਂ ਮਿਟਾਈ ਲਾਈਨ ਡੈੱਕ ਦਾ ਕਾਰਡ ਨਹੀਂ ਮਿਟਾਉਂਦੀ, ਜਦੋਂ ਤੱਕ ਉਸ ਡੈੱਕ ਲਈ “ਫ਼ਾਈਲ ਵਿੱਚ ਨਾ ਮਿਲੇ ਕਾਰਡ: ਹਟਾਓ” ਚਾਲੂ ਨਾ ਹੋਵੇ। ਫਿਰ ਕਾਰਡ ਪ੍ਰਗਤੀ ਸਮੇਤ ਹਟ ਜਾਂਦਾ ਹੈ।\n- _ ਨਾਲ ਸ਼ੁਰੂ ਹੋਣ ਵਾਲੇ ਨਾਂਵਾਂ ਦੀਆਂ ਫ਼ਾਈਲਾਂ ਨਹੀਂ ਪੜ੍ਹੀਆਂ ਜਾਂਦੀਆਂ।\n"
