news.plugin.name = ਖ਼ਬਰਾਂ
news.plugin.description = ਖ਼ਬਰ ਫ਼ੀਡਾਂ (RSS, Atom) ਨੂੰ ਪੜ੍ਹਨ ਲਈ ਕਿਤਾਬਾਂ ਵਜੋਂ ਲਿਆਉਂਦਾ ਹੈ।
news.plugin.how = "“ਖ਼ਬਰਾਂ” RSS ਜਾਂ Atom ਫ਼ੀਡਾਂ ਨੂੰ ਕਿਤਾਬਾਂ ਵਿੱਚ ਬਦਲਦਾ ਹੈ। ਹਰ ਫ਼ੀਡ ਲਾਇਬ੍ਰੇਰੀ ਦੇ News ਫ਼ੋਲਡਰ ਵਿੱਚ ਇੱਕ ਕਿਤਾਬ ਬਣਦੀ ਹੈ, ਜਿਸ ਵਿੱਚ ਉਸ ਦੇ ਸਭ ਤੋਂ ਨਵੇਂ ਲੇਖ ਸਾਦੇ ਟੈਕਸਟ ਵਜੋਂ ਹੁੰਦੇ ਹਨ, ਕਿਸੇ ਵੀ ਹੋਰ ਕਿਤਾਬ ਵਾਂਗ ਪੜ੍ਹਨ ਲਈ।\n\n“ਟੂਲ” ਮੀਨੂ ਤੋਂ “ਖ਼ਬਰਾਂ” ਖੋਲ੍ਹੋ ਅਤੇ “ਫ਼ੀਡ ਸ਼ਾਮਲ ਕਰੋ” ਚੁਣੋ; ਉਸ ਦਾ ਪਤਾ ਅਖ਼ਬਾਰ ਜਾਂ ਬਲੌਗ ਦੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਹੁੰਦਾ ਹੈ। “ਖ਼ਬਰਾਂ ਲਿਆਓ” ਸਾਰੀਆਂ ਫ਼ੀਡਾਂ ਲਿਆਉਂਦਾ ਹੈ ਅਤੇ ਪਹਿਲੀਆਂ ਕਿਤਾਬਾਂ ਦੀ ਥਾਂ ਲੈਂਦਾ ਹੈ। ਕਿਸੇ ਇੱਕ ਫ਼ੀਡ ਨੂੰ ਲਿਆਉਣ ਜਾਂ ਹਟਾਉਣ ਲਈ ਉਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ, “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)। ਹਟਾਈ ਫ਼ੀਡ ਦੀ ਕਿਤਾਬ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ।\n\nਲਿਆਉਣ ਲਈ ਨੈੱਟਵਰਕ ਚਾਹੀਦਾ ਹੈ। “ਪ੍ਰਤੀ ਫ਼ੀਡ ਲੇਖ” (“ਸੈਟਿੰਗਾਂ” › “ਲਾਇਬ੍ਰੇਰੀ”) ਤੈਅ ਕਰਦਾ ਹੈ ਕਿ ਹਰ ਕਿਤਾਬ ਵਿੱਚ ਕਿੰਨੇ ਲੇਖ ਹੋਣ। “ਖ਼ਬਰਾਂ ਦੀਆਂ ਸੁਰਖੀਆਂ” ਵਿਜੇਟ ਉਹਨਾਂ ਨੂੰ ਹੋਮ ਸਕ੍ਰੀਨ 'ਤੇ ਦਿਖਾਉਂਦਾ ਹੈ।"
