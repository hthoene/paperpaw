store.plugin.how = "ਪਲੱਗਇਨ ਸਟੋਰ ਇੰਟਰਨੈੱਟ ਤੋਂ ਇਸ ਡੀਵਾਈਸ ਲਈ ਪਲੱਗਇਨ ਲੱਭਦਾ, ਸਥਾਪਤ ਕਰਦਾ, ਅੱਪਡੇਟ ਕਰਦਾ ਅਤੇ ਹਟਾਉਂਦਾ ਹੈ। ਇਸ ਨੂੰ “ਟੂਲ” ਤੋਂ ਖੋਲ੍ਹੋ; Wi-Fi ਚਾਹੀਦਾ ਹੈ।\n\nਸ਼ੁਰੂ ਵਿੱਚ ਸਿਫ਼ਾਰਸ਼ੀ, ਨਵੇਂ ਅਤੇ ਹੁਣ ਪ੍ਰਸਿੱਧ ਪਲੱਗਇਨ, ਫਿਰ ਗਰੁੱਪ ਹਨ। ਗਰੁੱਪ ਆਪਣੇ ਪਲੱਗਇਨ ਰੋਜ਼ ਬਦਲਦੇ ਨਿਰਪੱਖ ਮਿਸ਼ਰਣ ਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ; A ਤੋਂ Z, ਨਵੇਂ ਜਾਂ ਆਖਰੀ ਅੱਪਡੇਟ ਮੁਤਾਬਕ ਛਾਂਟੋ। ਕੋਈ ਪਲੱਗਇਨ ਖੋਲ੍ਹ ਕੇ ਉਸ ਦਾ ਆਕਾਰ ਅਤੇ ਮੈਮਰੀ ਦੇਖੋ, ਫਿਰ “ਸਥਾਪਤ ਕਰੋ”, “ਅੱਪਡੇਟ” ਜਾਂ “ਹਟਾਓ” ਚੁਣੋ। “ਸਭ ਅੱਪਡੇਟ ਕਰੋ” ਸਾਰੇ ਪਲੱਗਇਨ ਨਵੇਂ ਕਰਦਾ ਹੈ।\n\nਕੋਡ ਪਲੱਗਇਨ ਡੀਵਾਈਸ ਤੱਕ ਪੂਰੀ ਪਹੁੰਚ ਨਾਲ ਚੱਲਦੇ ਹਨ: ਸਟੋਰ ਪਹਿਲਾਂ ਪੁੱਛਦਾ ਹੈ, ਅਤੇ ਉਹ ਮੁੜ-ਚਾਲੂ ਹੋਣ ਤੋਂ ਬਾਅਦ ਚੱਲਦੇ ਹਨ। ਗੜਬੜ ਹੋਣ 'ਤੇ PaperPaw ਕੋਡ ਪਲੱਗਇਨਾਂ ਤੋਂ ਬਿਨਾਂ ਚੱਲਦਾ ਹੈ ਅਤੇ ਦੱਸਦਾ ਹੈ ਕਿਹੜਾ ਸੀ। “ਪਲੱਗਇਨ ਲਾਇਬ੍ਰੇਰੀ” ਸੂਚੀ ਦਾ ਸਰੋਤ ਤੈਅ ਕਰਦੀ ਹੈ।\n\n“ਸੈਟਿੰਗਾਂ”, “ਸਿਸਟਮ” ਵਿੱਚ “ਕਮਿਊਨਿਟੀ ਪਲੱਗਇਨ” GitHub 'ਤੇ ਦੂਜਿਆਂ ਦੇ ਪਲੱਗਇਨ ਵੀ ਦਿਖਾਉਂਦਾ ਹੈ। ਇਹ “ਬਿਨਾਂ ਸਮੀਖਿਆ” ਹਨ; ਕੋਡ ਪਲੱਗਇਨ ਦਾ ਪੰਨਾ ਉਸ ਦੀ ਦਸਤਖਤ ਕੁੰਜੀ ਦਿਖਾਉਂਦਾ ਹੈ, ਅਤੇ ਹੋਰ ਕੁੰਜੀ ਵਾਲਾ ਅੱਪਡੇਟ ਸਥਾਪਤ ਨਹੀਂ ਹੁੰਦਾ।\n\n“ਸਰੋਤ” (ਸ਼ੁਰੂ ਦੀ ਆਖਰੀ ਕਤਾਰ) ਦੂਜਿਆਂ ਦੀਆਂ ਪਲੱਗਇਨ ਸੂਚੀਆਂ ਪਤੇ (https://…/plugins.json) ਨਾਲ ਸ਼ਾਮਲ ਕਰਦਾ, ਦਿਖਾਉਂਦਾ ਜਾਂ ਹਟਾਉਂਦਾ ਹੈ। ਜਾਂ ਕਾਰਡ 'ਤੇ .paperpaw/plugins/store ਵਿੱਚ sources.txt ਫ਼ਾਈਲ ਰੱਖੋ, ਹਰ ਲਾਈਨ 'ਤੇ ਇੱਕ ਪਤਾ। PaperPaw ਸਰੋਤਾਂ ਦੀ ਜਾਂਚ ਨਹੀਂ ਕਰਦਾ। ਡੀਵਾਈਸ ਪਹਿਲੀ ਸੂਚੀ ਦੀ ਕੁੰਜੀ ਯਾਦ ਰੱਖਦਾ ਹੈ ਅਤੇ ਫਿਰ ਸਿਰਫ਼ ਉਸੇ ਕੁੰਜੀ ਨਾਲ ਦਸਤਖਤ ਕੀਤੀਆਂ ਸੂਚੀਆਂ ਅਤੇ ਕੋਡ ਪਲੱਗਇਨ ਲੈਂਦਾ ਹੈ। ਪਲੱਗਇਨ ਨੂੰ ਅੱਪਡੇਟ ਸਿਰਫ਼ ਉਸੇ ਸਰੋਤ ਤੋਂ ਮਿਲਦੇ ਹਨ। PaperPaw ਦੀ ਆਪਣੀ ਲਾਇਬ੍ਰੇਰੀ ਹਮੇਸ਼ਾ ਰਹਿੰਦੀ ਹੈ।"
