setup.plugin.name = ਸੈੱਟਅੱਪ
setup.plugin.description = ਪਹਿਲੀ ਵਾਰ ਸ਼ੁਰੂ ਕਰਨ 'ਤੇ ਜ਼ਰੂਰੀ ਸੈਟਿੰਗਾਂ ਦੀ ਛੋਟੀ ਗਾਈਡ।
setup.plugin.how = "ਸੈੱਟਅੱਪ ਜ਼ਰੂਰੀ ਸੈਟਿੰਗਾਂ ਦੀ ਇੱਕ ਛੋਟੀ ਗਾਈਡ ਹੈ, ਜੋ PaperPaw ਦੇ ਪਹਿਲੀ ਵਾਰ ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਇੱਕ ਵਾਰ ਦਿਸਦੀ ਹੈ। ਹਰ ਪੰਨਾ ਇੱਕ ਗੱਲ ਪੁੱਛਦਾ ਹੈ, ਜਿਵੇਂ ਭਾਸ਼ਾ, ਬਟਨ, ਟੈਕਸਟ ਦਾ ਆਕਾਰ, ਸਮਾਂ ਖੇਤਰ, Wi-Fi ਜਾਂ ਸ਼ਾਮਲ ਕਰਨ ਲਈ ਕੁਝ ਪਲੱਗਇਨ, ਅਤੇ ਇੱਕ ਸਮਝਦਾਰ ਜਵਾਬ ਪਹਿਲਾਂ ਹੀ ਚੁਣਿਆ ਹੁੰਦਾ ਹੈ, ਇਸ ਲਈ “ਅੱਗੇ” ਹਮੇਸ਼ਾ ਠੀਕ ਹੈ। ਜਿਹੜੇ ਕਦਮ ਇਸ ਡੀਵਾਈਸ ਨੂੰ ਨਹੀਂ ਚਾਹੀਦੇ, ਉਹ ਛੱਡ ਦਿੱਤੇ ਜਾਂਦੇ ਹਨ।\n\nਬਟਨਾਂ 'ਤੇ ਟੈਪ ਕਰੋ, ਜਾਂ ਉੱਪਰ ਅਤੇ ਹੇਠਾਂ ਵਾਲੇ ਬਟਨ ਅਤੇ “ਚੁਣੋ” ਵਰਤੋ। ਪਹਿਲੇ ਪੰਨੇ 'ਤੇ “ਛੱਡੋ” ਸੈੱਟਅੱਪ ਤੁਰੰਤ ਬੰਦ ਕਰਦਾ ਹੈ। ਆਖਰੀ ਪੰਨਾ ਦੱਸਦਾ ਹੈ ਕਿ ਤੁਹਾਡੀਆਂ ਕਿਤਾਬਾਂ ਕਿੱਥੋਂ ਆਉਂਦੀਆਂ ਹਨ।\n\nਇਸ ਨੂੰ ਦੁਬਾਰਾ ਚਲਾਉਣ ਲਈ ਸੈਟਿੰਗਾਂ ਖੋਲ੍ਹੋ ਅਤੇ “PaperPaw ਸੈੱਟ ਕਰੋ” ਚੁਣੋ। ਇੱਥੇ ਚੁਣੀ ਹਰ ਚੀਜ਼ ਬਾਅਦ ਵਿੱਚ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਬਦਲੀ ਜਾ ਸਕਦੀ ਹੈ।"
