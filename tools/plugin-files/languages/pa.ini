smart-home.plugin.name = ਸਮਾਰਟ ਹੋਮ
smart-home.plugin.description = ਤੁਹਾਡੇ ਆਪਣੇ Home Assistant ਦੇ ਮੁੱਲ ਅਤੇ ਸਵਿੱਚ, ਡੈਸ਼ਬੋਰਡ 'ਤੇ ਅਤੇ ਹੋਮ ਸਕ੍ਰੀਨ ਵਿਜੇਟਾਂ ਵਜੋਂ। ਤੁਹਾਡੇ ਘਰੇਲੂ ਨੈੱਟਵਰਕ 'ਤੇ Home Assistant ਨਾਲ ਕੰਮ ਕਰਦਾ ਹੈ।
smart-home.plugin.how = "ਸਮਾਰਟ ਹੋਮ ਤੁਹਾਡੇ ਆਪਣੇ Home Assistant ਦੇ ਮੁੱਲ ਅਤੇ ਸਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ: ਤਾਪਮਾਨ, ਨਮੀ, ਊਰਜਾ, ਦਰਵਾਜ਼ੇ-ਖਿੜਕੀਆਂ, ਲਾਈਟਾਂ, ਸਵਿੱਚ ਅਤੇ ਸੀਨ। ਇਹ ਘਰੇਲੂ ਨੈੱਟਵਰਕ 'ਤੇ REST API ਰਾਹੀਂ ਸਿੱਧਾ ਤੁਹਾਡੇ ਸਰਵਰ ਨਾਲ ਗੱਲ ਕਰਦਾ ਹੈ।\n\nਟੂਲ ਮੀਨੂ ਤੋਂ ਸਮਾਰਟ ਹੋਮ ਖੋਲ੍ਹੋ, ਫਿਰ “ਕਨੈਕਸ਼ਨ”: ਪਤਾ (ਜਿਵੇਂ http://homeassistant.local:8123) ਅਤੇ ਲੰਬੇ ਸਮੇਂ ਵਾਲਾ ਐਕਸੈਸ ਟੋਕਨ ਲਿਖੋ (Home Assistant ਦੇ ਪ੍ਰੋਫ਼ਾਈਲ ਪੰਨੇ ਦੇ ਹੇਠਾਂ ਬਣਾਓ)। ਟੋਕਨ ਪਾਸਵਰਡਾਂ ਅਤੇ ਕੁੰਜੀਆਂ ਵਿੱਚ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ। http ਸਿਰਫ਼ ਘਰੇਲੂ ਨੈੱਟਵਰਕ 'ਤੇ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ; ਬਾਹਰਲੇ ਸਰਵਰ ਲਈ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਘਰੇਲੂ ਨੈੱਟਵਰਕ ਤੋਂ ਬਾਹਰਲੇ ਸਰਵਰ” ਚਾਲੂ ਕਰੋ ਅਤੇ ਜਾਇਜ਼ ਸਰਟੀਫ਼ਿਕੇਟ ਵਾਲਾ https ਵਰਤੋ।\n\n“ਇਕਾਈਆਂ ਚੁਣੋ” ਸਰਵਰ ਦੀ ਸੂਚੀ ਖੋਲ੍ਹਦਾ ਹੈ: ਨਾਂ ਜਾਂ id ਨਾਲ ਖੋਜੋ ਅਤੇ ਦਿਖਾਉਣ ਲਈ ਇਕਾਈ ਚੁਣੋ (ਦੁਬਾਰਾ ਚੁਣਨ ਨਾਲ ਹਟਦੀ ਹੈ)। ਇਸ ਨੂੰ ਕਮਰਾ ਦੇ ਸਕਦੇ ਹੋ, ਜੋ ਡੈਸ਼ਬੋਰਡ ਅਤੇ ਕਮਰਾ ਵਿਜੇਟਾਂ ਵਿੱਚ ਸਮੂਹ ਬਣਾਉਂਦਾ ਹੈ। 24 ਤੱਕ ਇਕਾਈਆਂ ਰੱਖੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਡੈਸ਼ਬੋਰਡ 'ਤੇ ਲਾਈਟ, ਸਵਿੱਚ ਜਾਂ ਸੀਨ ਚੁਣਨ ਨਾਲ ਉਹ ਬਦਲਦਾ ਹੈ; ਚੁਣਿਆ ਸੈਂਸਰ ਦੁਬਾਰਾ ਪੜ੍ਹਿਆ ਜਾਂਦਾ ਹੈ।\n\nਵਿਜੇਟ (ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ, ਫਿਰ ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ): ਮੁੱਲ, ਸਮੂਹ (ਇੱਕ ਕਮਰੇ ਦੀਆਂ ਇਕਾਈਆਂ), ਸਵਿੱਚ ਅਤੇ ਕਮਰਾ (ਕਮਰੇ ਦੇ ਮੁੱਲਾਂ ਅਤੇ ਸਵਿੱਚਾਂ ਵਾਲਾ ਕਾਰਡ)। ਹਰ ਵਿਜੇਟ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਦੱਸਦੀਆਂ ਹਨ ਕਿ ਉਹ ਕੀ ਦਿਖਾਉਂਦਾ ਹੈ।\n\nਘਰ ਉਦੋਂ ਪੜ੍ਹਿਆ ਜਾਂਦਾ ਹੈ ਜਦੋਂ ਤੁਸੀਂ ਡੈਸ਼ਬੋਰਡ ਖੋਲ੍ਹਦੇ ਹੋ, ਜਦੋਂ ਕਹਿੰਦੇ ਹੋ (“ਹੁਣੇ ਤਾਜ਼ਾ ਕਰੋ” ਜਾਂ ਵਿਜੇਟ 'ਤੇ ਟੈਪ), ਜਦੋਂ ਰੀਡਰ Wi-Fi ਚਾਲੂ ਹੁੰਦਿਆਂ ਜਾਗਦਾ ਹੈ, ਅਤੇ ਚਾਰਜਰ ਲੱਗਿਆ ਹੋਣ 'ਤੇ ਤੁਹਾਡੇ ਸੈੱਟ ਸਮੇਂ ਮੁਤਾਬਕ। ਇਹ Wi-Fi ਕਦੇ ਆਪਣੇ-ਆਪ ਚਾਲੂ ਨਹੀਂ ਕਰਦਾ।"
