koreader.plugin.name = ਹਾਈਲਾਈਟ ਸਾਂਝੀਆਂ ਕਰਨਾ
koreader.plugin.description = ਦੋਹਾਂ ਵਿੱਚ ਪੜ੍ਹੀਆਂ ਕਿਤਾਬਾਂ ਲਈ ਬੁੱਕਮਾਰਕ ਅਤੇ ਹਾਈਲਾਈਟਾਂ KOReader ਨਾਲ ਸਾਂਝੀਆਂ ਕਰਦਾ ਹੈ।
koreader.plugin.how = "ਇਹ ਪਲੱਗਇਨ ਉਹਨਾਂ ਕਿਤਾਬਾਂ ਲਈ ਬੁੱਕਮਾਰਕ ਅਤੇ ਹਾਈਲਾਈਟਾਂ KOReader ਨਾਲ ਸਾਂਝੀਆਂ ਕਰਦਾ ਹੈ ਜੋ ਤੁਸੀਂ ਦੋਹਾਂ ਵਿੱਚ ਪੜ੍ਹਦੇ ਹੋ, ਇੱਕੋ ਡੀਵਾਈਸ 'ਤੇ ਜਾਂ ਡੀਵਾਈਸਾਂ ਵਿਚਕਾਰ ਸਿੰਕ ਕੀਤੇ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ। ਕੁਝ ਵੀ ਸੈੱਟ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ।\n\nਜਦੋਂ PaperPaw ਅਜਿਹੀ ਕਿਤਾਬ ਖੋਲ੍ਹਦਾ ਹੈ ਜੋ KOReader ਨੇ ਵੀ ਖੋਲ੍ਹੀ ਹੈ, ਅਤੇ ਜਦੋਂ ਤੁਸੀਂ ਉਸ ਦੇ ਬੁੱਕਮਾਰਕ ਜਾਂ ਹਾਈਲਾਈਟਾਂ ਬਦਲਦੇ ਹੋ, ਤਾਂ ਇਹ ਕਿਤਾਬ ਦੇ ਨਾਲ ਪਏ KOReader ਦੇ ਡਾਟੇ ਵਿੱਚੋਂ ਨਵਾਂ ਲੈ ਲੈਂਦਾ ਹੈ, ਅਤੇ ਇੱਥੇ ਦਾ ਨਵਾਂ KOReader ਲਈ ਛੱਡ ਦਿੰਦਾ ਹੈ, ਜੋ ਅਗਲੀ ਵਾਰ ਕਿਤਾਬ ਖੋਲ੍ਹਣ 'ਤੇ ਉਸ ਨੂੰ ਲੈ ਲੈਂਦਾ ਹੈ। ਹਟਾਏ ਨਿਸ਼ਾਨ ਅਤੇ ਬਦਲੇ ਨੋਟ ਵੀ ਪਹੁੰਚ ਜਾਂਦੇ ਹਨ।\n\nਇਹ ਸਿਰਫ਼ EPUB ਕਿਤਾਬਾਂ ਲਈ ਕੰਮ ਕਰਦਾ ਹੈ। ਜੇ ਕਿਸੇ ਇੱਕ ਪਾਸੇ ਦੀ ਫ਼ਾਈਲ ਪੜ੍ਹੀ ਨਾ ਜਾ ਸਕੇ, ਤਾਂ ਜਦੋਂ ਤੱਕ ਉਹ ਪੜ੍ਹੀ ਨਾ ਜਾ ਸਕੇ, ਕਿਸੇ ਵੀ ਪਾਸੇ ਕੁਝ ਨਹੀਂ ਬਦਲਦਾ।"
koreader.removed-there = KOReader ਦੀ ਫ਼ਾਈਲ ਵਿੱਚ ਹੁਣ ਕੋਈ ਹਾਈਲਾਈਟ ਨਹੀਂ। ਕੀ ਇੱਥੋਂ ਵੀ ਹਟਾਉਣੀਆਂ ਹਨ?
koreader.removed-there.text = ਹੋ ਸਕਦਾ ਹੈ ਇਹ KOReader ਵਿੱਚ ਹਟਾਈਆਂ ਗਈਆਂ ਹੋਣ, ਜਾਂ ਉਸ ਦੀ ਫ਼ਾਈਲ ਕਿਸੇ ਹੋਰ ਡੀਵਾਈਸ ਤੋਂ ਆਈ ਹੋਵੇ। “ਰੱਖੋ” ਇਹਨਾਂ ਨੂੰ ਇੱਥੇ ਰੱਖਦਾ ਹੈ ਅਤੇ KOReader ਨੂੰ ਮੁੜ ਦੇ ਦਿੰਦਾ ਹੈ।
