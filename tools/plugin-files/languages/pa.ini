wallabag.help = Wallabag ਵਿੱਚ “API clients management” ਹੇਠਾਂ ਇੱਕ API ਕਲਾਇੰਟ ਬਣਾਓ ਅਤੇ ਇੱਥੇ ਉਸ ਦੀ ID ਅਤੇ ਸੀਕ੍ਰੇਟ ਦਾਖਲ ਕਰੋ। ਨਾ ਪੜ੍ਹੇ ਲੇਖ “Wallabag” ਫ਼ੋਲਡਰ ਵਿੱਚ ਆਉਂਦੇ ਹਨ; ਅੰਤ ਤੱਕ ਪੜ੍ਹੇ ਲੇਖ ਅਗਲੀ ਵਾਰ ਲਿਆਉਣ 'ਤੇ ਪੁਰਾਲੇਖ ਵਿੱਚ ਜਾਂਦੇ ਹਨ।
