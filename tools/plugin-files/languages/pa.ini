tasks.plugin.name = ਕੰਮ
tasks.plugin.description = ਨਿਯਤ ਤਾਰੀਖਾਂ ਅਤੇ ਤਰਜੀਹਾਂ ਵਾਲੀਆਂ ਕੰਮ-ਸੂਚੀਆਂ, ਰੀਡਰ 'ਤੇ ਜਾਂ ਤੁਹਾਡੇ CalDAV ਸਰਵਰ ਨਾਲ ਸਿੰਕ, ਹੋਮ ਸਕ੍ਰੀਨ ਵਿਜੇਟਾਂ ਸਮੇਤ।
tasks.plugin.how = "ਤੁਹਾਡੇ ਰੀਡਰ 'ਤੇ ਕੰਮ-ਸੂਚੀਆਂ: ਨਿਯਤ ਤਾਰੀਖ ਅਤੇ ਤਰਜੀਹ ਵਾਲੇ ਕੰਮ, ਜੋ ਪੂਰੇ ਹੋਣ 'ਤੇ ਨਿਸ਼ਾਨਬੱਧ ਹੁੰਦੇ ਹਨ। ਬਿਨਾਂ ਸੈੱਟਅੱਪ ਅਤੇ ਨੈੱਟਵਰਕ ਦੇ ਚੱਲਦੇ ਹਨ, ਅਤੇ CalDAV ਸਰਵਰ (Nextcloud, Radicale, Baïkal, Fastmail ਆਦਿ) ਨਾਲ ਸਿੰਕ ਹੋ ਸਕਦੇ ਹਨ।\n\n“ਟੂਲ” ਮੀਨੂ ਤੋਂ “ਕੰਮ” ਖੋਲ੍ਹੋ। ਪਹਿਲੀ ਕਤਾਰ ਦਿਖਾਈ ਸੂਚੀ ਦਾ ਨਾਂ ਹੈ; ਇਸ ਨੂੰ ਚੁਣ ਕੇ ਹੋਰ ਸੂਚੀ, “ਅੱਜ ਅਤੇ ਬਕਾਇਆ”, ਨਵੀਂ ਸੂਚੀ, ਸਿੰਕ ਜਾਂ ਖਾਤਾ ਚੁਣੋ। “ਕੰਮ ਸ਼ਾਮਲ ਕਰੋ” ਕੀ-ਬੋਰਡ ਖੋਲ੍ਹਦਾ ਹੈ। ਕੰਮ 'ਤੇ “ਚੁਣੋ” ਇਸ ਨੂੰ ਪੂਰਾ ਕਰਦਾ ਹੈ (ਦੁਬਾਰਾ: ਪੂਰਾ ਨਹੀਂ)। ਸਿਰਲੇਖ, ਨਿਯਤ ਤਾਰੀਖ (ਜਿਵੇਂ 2026-12-24) ਜਾਂ ਤਰਜੀਹ ਬਦਲਣ ਜਾਂ ਹਟਾਉਣ ਲਈ ਕੰਮ ਦਬਾਈ ਰੱਖੋ ਜਾਂ “ਮੀਨੂ” ਦਬਾਓ। ਪੂਰੇ ਹੋਏ ਕੰਮ ਇੱਕ ਹਫ਼ਤਾ ਅੰਤ ਵਿੱਚ ਰਹਿੰਦੇ ਹਨ (“ਸੈਟਿੰਗਾਂ” ਵਿੱਚ “ਕੰਮ” ਹੇਠ ਬਦਲੋ)।\n\nਹੋਮ ਸਕ੍ਰੀਨ ਵਿਜੇਟ (ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ, ਫਿਰ ਵਿਜੇਟ ਸ਼ਾਮਲ ਕਰੋ): “ਅੱਜ ਦੇ ਕੰਮ”, “ਕੰਮ-ਸੂਚੀ”, “ਬਾਕੀ ਕੰਮ” ਅਤੇ “ਅਗਲਾ ਕੰਮ”। ਵਿਜੇਟ ਵਿੱਚ ਕੰਮ 'ਤੇ ਟੈਪ ਇਸ ਨੂੰ ਪੂਰਾ ਕਰਦਾ ਹੈ; ਸਿਰਲੇਖ 'ਤੇ ਟੈਪ ਸੂਚੀਆਂ ਖੋਲ੍ਹਦਾ ਹੈ।\n\nਸਿੰਕ ਲਈ “CalDAV ਖਾਤਾ” ਵਿੱਚ ਸਰਵਰ ਦਾ ਪਤਾ (ਜਿਵੇਂ cloud.example.com/remote.php/dav), ਵਰਤੋਂਕਾਰ ਨਾਂ ਅਤੇ ਪਾਸਵਰਡ (ਬਿਹਤਰ: ਐਪ ਪਾਸਵਰਡ) ਦਿਓ। ਸਰਵਰ ਦੀ ਹਰ ਕੰਮ-ਸੂਚੀ ਰੀਡਰ 'ਤੇ ਸੂਚੀ ਬਣਦੀ ਹੈ। ਰੀਡਰ “ਕੰਮ” ਖੋਲ੍ਹਣ 'ਤੇ, “ਹੁਣੇ ਸਿੰਕ ਕਰੋ” 'ਤੇ ਅਤੇ ਨੈੱਟਵਰਕ ਚਾਲੂ ਹੋਣ 'ਤੇ ਸਿੰਕ ਕਰਦਾ ਹੈ; ਬਿਨਾਂ ਨੈੱਟਵਰਕ ਦੀਆਂ ਤਬਦੀਲੀਆਂ ਬਾਅਦ ਵਿੱਚ ਭੇਜੀਆਂ ਜਾਂਦੀਆਂ ਹਨ। ਦੋਹੀਂ ਪਾਸੀਂ ਬਦਲੇ ਕੰਮ ਦਾ ਸਰਵਰ ਵਾਲਾ ਵਰਜਨ ਲਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਤੁਹਾਡਾ ਨਵੇਂ ਕੰਮ ਵਜੋਂ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ। ਦੁਹਰਾਉਣ ਵਾਲੇ ਕੰਮ ਉੱਥੇ ਬਦਲੋ ਜਿੱਥੇ ਬਣਾਏ ਸਨ। ਰੀਡਰ 12 ਸੂਚੀਆਂ ਵਿੱਚ 200 ਕੰਮ ਤੱਕ ਰੱਖਦਾ ਹੈ।"
