transfer.plugin.name = ਟ੍ਰਾਂਸਫ਼ਰ
transfer.plugin.description = ਉਸੇ ਨੈੱਟਵਰਕ ਦੇ ਬ੍ਰਾਊਜ਼ਰ ਤੋਂ ਕਿਤਾਬਾਂ ਅਤੇ ਹੋਰ ਫ਼ਾਈਲਾਂ ਡੀਵਾਈਸ 'ਤੇ ਪਾਓ।
transfer.plugin.how = "Wi-Fi ਟ੍ਰਾਂਸਫ਼ਰ ਉਸੇ ਨੈੱਟਵਰਕ ਦੇ ਬ੍ਰਾਊਜ਼ਰ ਤੋਂ, ਬਿਨਾਂ ਕੇਬਲ ਜਾਂ ਐਪ ਦੇ, ਕਿਤਾਬਾਂ ਅਤੇ ਹੋਰ ਫ਼ਾਈਲਾਂ ਡੀਵਾਈਸ 'ਤੇ ਪਾਉਂਦਾ ਹੈ। ਤੁਸੀਂ ਫ਼ਾਈਲਾਂ ਲੈ ਵੀ ਸਕਦੇ ਹੋ, ਫ਼ੋਲਡਰ ਬਣਾ ਅਤੇ ਮਿਟਾ ਸਕਦੇ ਹੋ।\n\nਇਸ ਨੂੰ “ਟੂਲ” ਤੋਂ ਖੋਲ੍ਹੋ। ਸਕ੍ਰੀਨ ਇੱਕ ਪਤਾ ਟੈਕਸਟ ਅਤੇ QR ਕੋਡ ਵਜੋਂ ਦਿਖਾਉਂਦੀ ਹੈ: ਇਸ ਨੂੰ ਫ਼ੋਨ ਜਾਂ ਕੰਪਿਊਟਰ ਦੇ ਬ੍ਰਾਊਜ਼ਰ ਵਿੱਚ ਖੋਲ੍ਹੋ, ਜਾਂ ਕੋਡ ਸਕੈਨ ਕਰੋ। ਪਤੇ ਵਿੱਚ ਹਰ ਵਾਰ ਨਵੀਂ ਬਣੀ ਕੁੰਜੀ ਹੁੰਦੀ ਹੈ, ਇਸ ਲਈ ਨੈੱਟਵਰਕ ਦੇ ਹੋਰ ਲੋਕ ਤੁਹਾਡੀਆਂ ਫ਼ਾਈਲਾਂ ਤੱਕ ਨਹੀਂ ਪਹੁੰਚ ਸਕਦੇ। ਸਕ੍ਰੀਨ ਖੁੱਲ੍ਹੀ ਰਹਿਣ ਤੱਕ ਟ੍ਰਾਂਸਫ਼ਰ ਚੱਲਦਾ ਹੈ।\n\nਜਿੱਥੇ PaperPaw ਖੁਦ Wi-Fi ਚਲਾਉਂਦਾ ਹੈ, ਜਿਵੇਂ X4 'ਤੇ, ਹੇਠਾਂ “ਰਾਊਟਰ ਤੋਂ ਬਿਨਾਂ” ਡੀਵਾਈਸ ਦਾ ਆਪਣਾ ਨੈੱਟਵਰਕ ਖੋਲ੍ਹਦਾ ਹੈ, ਜਿਸ ਨਾਲ ਫ਼ੋਨ ਕੋਡ ਸਕੈਨ ਕਰਕੇ ਜੁੜਦਾ ਹੈ।"
