core.action.clean-up = ਸਟੋਰੇਜ ਸਾਫ਼ ਕਰੋ
core.clean-up.question.one = ਨਾ ਮਿਲੀ ਕਿਤਾਬ ਦੇ ਨੋਟ ਹਟਾਉਣੇ ਹਨ?
core.clean-up.question.other = ਨਾ ਮਿਲੀਆਂ {count} ਕਿਤਾਬਾਂ ਦੇ ਨੋਟ ਹਟਾਉਣੇ ਹਨ?
core.clean-up.text = ਉਹਨਾਂ ਦੀ ਪੜ੍ਹਨ ਦੀ ਥਾਂ, ਬੁੱਕਮਾਰਕ, ਹਾਈਲਾਈਟਾਂ ਅਤੇ ਨੋਟ ਹਮੇਸ਼ਾ ਲਈ ਮਿਟ ਜਾਂਦੇ ਹਨ। ਜਿਸ ਕਿਤਾਬ ਦਾ ਨਾਂ ਜਾਂ ਥਾਂ ਕੰਪਿਊਟਰ 'ਤੇ ਬਦਲੀ ਗਈ ਹੋਵੇ, ਜਾਂ ਜੋ ਨਾ ਲੱਗੇ ਮੈਮਰੀ ਕਾਰਡ 'ਤੇ ਹੋਵੇ, ਉਹ ਵੀ ਨਹੀਂ ਮਿਲਦੀ।
core.clean-up.yes = ਹਟਾਓ
core.clean-up.no = ਰੱਖੋ
core.clean-up-failed = ਕੁਝ ਵੀ ਸਾਫ਼ ਨਹੀਂ ਹੋਇਆ: ਮੈਮਰੀ ਕਾਰਡ ਦਾ ਇੱਕ ਫ਼ੋਲਡਰ ਪੜ੍ਹਿਆ ਨਹੀਂ ਜਾ ਸਕਿਆ।
core.cleaned-up = ਸਾਫ਼ ਹੋ ਗਿਆ: ਜੋ ਕਿਤਾਬਾਂ ਹੁਣ ਨਹੀਂ ਹਨ, ਉਹਨਾਂ ਦੀਆਂ {count} ਬਚੀਆਂ ਚੀਜ਼ਾਂ
core.offline.title = ਆਫ਼ਲਾਈਨ ਮੋਡ
core.offline.text = ਇਸ ਲਈ ਨੈੱਟਵਰਕ ਚਾਹੀਦਾ ਹੈ। ਕੀ ਆਨਲਾਈਨ ਜਾਣਾ ਹੈ?
core.offline.go-online = ਆਨਲਾਈਨ ਜਾਓ
core.offline.not-now = ਹੁਣ ਨਹੀਂ
core.screenshot-saved = {path} ਵਜੋਂ ਰੱਖਿਅਤ ਕੀਤਾ ਗਿਆ।
core.screenshot-failed = ਸਕ੍ਰੀਨਸ਼ਾਟ ਰੱਖਿਅਤ ਨਹੀਂ ਹੋ ਸਕਿਆ।
core.screenshot-full = ਸਕ੍ਰੀਨਸ਼ਾਟ ਰੱਖਿਅਤ ਨਹੀਂ ਹੋ ਸਕਿਆ: ਕਾਰਡ ਭਰ ਗਿਆ ਹੈ।
core.screenshot-unwritten = ਸਕ੍ਰੀਨਸ਼ਾਟ ਰੱਖਿਅਤ ਨਹੀਂ ਹੋ ਸਕਿਆ: ਕਾਰਡ 'ਤੇ ਲਿਖਿਆ ਨਹੀਂ ਜਾ ਸਕਿਆ।
core.config-unreadable = {file} ਪੜ੍ਹੀ ਨਹੀਂ ਜਾ ਸਕੀ, ਇਸ ਲਈ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਤਬਦੀਲੀਆਂ ਰੱਖਿਅਤ ਨਹੀਂ ਹੁੰਦੀਆਂ। ਕੰਪਿਊਟਰ 'ਤੇ ਫ਼ਾਈਲ ਠੀਕ ਕਰੋ ਜਾਂ ਹਟਾਓ।
core.secrets-unreadable = {file} ਪੜ੍ਹੀ ਨਹੀਂ ਜਾ ਸਕੀ, ਇਸ ਲਈ ਪਾਸਵਰਡ ਅਤੇ ਕੁੰਜੀਆਂ ਰੱਖਿਅਤ ਨਹੀਂ ਹੁੰਦੀਆਂ। ਕੰਪਿਊਟਰ 'ਤੇ ਫ਼ਾਈਲ ਠੀਕ ਕਰੋ ਜਾਂ ਹਟਾਓ।
core.secrets-unopened = ਇਸ ਕਾਰਡ 'ਤੇ ਰੱਖਿਅਤ ਕੁਝ ਪਾਸਵਰਡ ਅਤੇ ਕੁੰਜੀਆਂ ਇੱਥੇ ਖੁੱਲ੍ਹ ਨਹੀਂ ਸਕਦੀਆਂ: ਉਹ ਕਿਸੇ ਹੋਰ ਡੀਵਾਈਸ 'ਤੇ ਰੱਖਿਅਤ ਕੀਤੀਆਂ ਗਈਆਂ ਸਨ, ਜਾਂ ਇਸ ਡੀਵਾਈਸ ਦੀ ਕੁੰਜੀ ਗੁੰਮ ਹੋ ਗਈ। ਜਿੱਥੇ ਕੋਈ ਪਲੱਗਇਨ ਇਹਨਾਂ ਨੂੰ ਮੰਗੇ, ਉੱਥੇ ਦੁਬਾਰਾ ਦਾਖਲ ਕਰੋ।
core.secrets-unsupported = ਇਹ ਡੀਵਾਈਸ ਹਾਲੇ ਪਾਸਵਰਡ ਰੱਖਿਅਤ ਨਹੀਂ ਕਰ ਸਕਦਾ। paperpaw.org ਦੇ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ ਨਾਲ PaperPaw ਇੱਕ ਵਾਰ ਮੁੜ-ਸਥਾਪਤ ਕਰੋ, ਫਿਰ ਇਹ ਕੰਮ ਕਰੇਗਾ।
core.card.missing = ਕੋਈ ਮੈਮਰੀ ਕਾਰਡ ਨਹੀਂ ਮਿਲਿਆ, ਇਸ ਲਈ ਕੁਝ ਵੀ ਰੱਖਿਅਤ ਨਹੀਂ ਹੁੰਦਾ। FAT32 ਕਾਰਡ ਲਗਾਓ ਅਤੇ ਮੁੜ-ਚਾਲੂ ਕਰੋ।
core.card.unreadable = ਮੈਮਰੀ ਕਾਰਡ ਪੜ੍ਹਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ, ਇਸ ਲਈ ਕੁਝ ਵੀ ਰੱਖਿਅਤ ਨਹੀਂ ਹੁੰਦਾ। ਕੋਈ ਹੋਰ ਕਾਰਡ ਵਰਤ ਕੇ ਦੇਖੋ।
core.card.exfat-experimental = ਇਹ ਮੈਮਰੀ ਕਾਰਡ exFAT ਹੈ। exFAT ਸਹਾਇਤਾ ਪ੍ਰਯੋਗਾਤਮਕ ਹੈ; FAT32 ਸਭ ਤੋਂ ਸੁਰੱਖਿਅਤ ਹੈ।
core.card.no-fat = ਮੈਮਰੀ ਕਾਰਡ FAT32 ਨਹੀਂ ਹੈ, ਇਸ ਲਈ ਕੁਝ ਵੀ ਰੱਖਿਅਤ ਨਹੀਂ ਹੁੰਦਾ। ਕੰਪਿਊਟਰ 'ਤੇ ਇਸ ਨੂੰ FAT32 ਵਿੱਚ ਫ਼ਾਰਮੈਟ ਕਰੋ।
