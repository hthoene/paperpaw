about.plugin.name = ਬਾਰੇ
about.plugin.description = PaperPaw ਦਾ ਵਰਜਨ ਅਤੇ ਲਾਇਸੈਂਸ।
about.plugin.how = "“ਬਾਰੇ” ਦੱਸਦਾ ਹੈ ਕਿ ਤੁਹਾਡੇ ਕੋਲ PaperPaw ਦਾ ਕਿਹੜਾ ਵਰਜਨ ਹੈ, ਇਸ ਦਾ ਸਰੋਤ ਕੋਡ ਕਿੱਥੇ ਹੈ, ਅਤੇ ਇਹ ਕਿਹੜੇ ਲਾਇਸੈਂਸਾਂ ਹੇਠ ਆਉਂਦਾ ਹੈ।\n\nਇਹ ਸੈਟਿੰਗਾਂ ਦੇ ਅੰਤ ਵਿੱਚ “PaperPaw ਬਾਰੇ” ਵਜੋਂ ਮਿਲਦਾ ਹੈ। ਤੀਰ ਬਟਨਾਂ ਅਤੇ “ਚੁਣੋ” ਨਾਲ ਕੋਈ ਕਤਾਰ ਚੁਣੋ, ਜਾਂ ਉਸ ਨੂੰ ਟੈਪ ਕਰੋ। ਫ਼ਰਮਵੇਅਰ ਵਿੱਚ ਬਣੇ ਪਲੱਗਇਨ ਵੀ ਦਿਖਾਏ ਜਾਂਦੇ ਹਨ ਅਤੇ, ਕੋਡ ਵਾਲੇ ਪਲੱਗਇਨ ਲੋਡ ਕਰਨ ਵਾਲੇ ਡੀਵਾਈਸਾਂ 'ਤੇ, ਉਹ ਫ਼ਿੰਗਰਪ੍ਰਿੰਟ ਵੀ ਜਿਸ ਲਈ ਅਜਿਹੇ ਪਲੱਗਇਨ ਬਣੇ ਹੋਣੇ ਚਾਹੀਦੇ ਹਨ।\n\n“ਲਾਇਸੈਂਸ” ਰੀਡਰ ਵਿੱਚ ਟੈਕਸਟ ਵਜੋਂ ਖੁੱਲ੍ਹਦਾ ਹੈ, ਇਸ ਲਈ ਤੁਸੀਂ ਕਿਤਾਬ ਵਾਂਗ ਇਸ ਦੇ ਪੰਨੇ ਪਲਟਦੇ ਹੋ। ਇਸ ਵਿੱਚ PaperPaw ਦਾ ਆਪਣਾ ਲਾਇਸੈਂਸ ਅਤੇ ਨਾਲ ਆਉਂਦੇ ਫ਼ੌਂਟਾਂ, ਆਈਕਨਾਂ ਅਤੇ ਹਾਈਫ਼ਨੇਸ਼ਨ ਪੈਟਰਨਾਂ ਦੇ ਲਾਇਸੈਂਸ ਹਨ। ਪਲੱਗਇਨ ਆਪਣੀ ਇੱਕ ਲਾਈਨ ਸ਼ਾਮਲ ਕਰ ਸਕਦੇ ਹਨ, ਜਿਵੇਂ ਕਿਸੇ ਥੀਮ ਦਾ ਲੇਖਕ।"
