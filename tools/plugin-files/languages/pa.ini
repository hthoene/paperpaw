picture-home.plugin.name = ਤਸਵੀਰ ਹੋਮ ਸਕ੍ਰੀਨ
picture-home.plugin.description = ਵਿਜੇਟਾਂ ਦੇ ਪਿੱਛੇ ਤੁਹਾਡੀ ਆਪਣੀ ਤਸਵੀਰ ਵਾਲੀ ਹੋਮ ਸਕ੍ਰੀਨ, ਅਤੇ ਤੁਹਾਡੀ ਮਰਜ਼ੀ ਦੀ ਸਥਿਤੀ ਪੱਟੀ।
picture-home.plugin.how = "ਚਾਲੂ ਹੋਣ 'ਤੇ “ਤਸਵੀਰ ਹੋਮ ਸਕ੍ਰੀਨ” ਹੋਮ ਸਕ੍ਰੀਨ ਦੀ ਥਾਂ ਲੈਂਦੀ ਹੈ: ਵਿਜੇਟਾਂ ਦੇ ਪਿੱਛੇ ਤੁਹਾਡੀ ਤਸਵੀਰ, ਅਤੇ ਤੁਹਾਡੇ ਸਜਾਏ ਵਿਜੇਟਾਂ ਤੇ ਟੂਲਾਂ ਦੇ ਪੰਨੇ। ਪਲੱਗਇਨ ਮੈਨੇਜਰ ਵਿੱਚ ਇਸ ਨੂੰ ਬੰਦ ਕਰੋ ਤਾਂ ਮੂਲ ਹੋਮ ਸਕ੍ਰੀਨ ਆਪਣੇ ਪੰਨਿਆਂ ਸਮੇਤ ਵਾਪਸ ਆ ਜਾਂਦੀ ਹੈ।\n\nਤਸਵੀਰਾਂ (JPEG, PNG ਜਾਂ GIF) ਕਾਰਡ ਦੇ ਇੱਕ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ (ਮਿਆਰੀ: wallpapers), ਫਿਰ “ਸੈਟਿੰਗਾਂ”, “ਵਿਉਂਤਬੱਧ ਕਰੋ”, “ਤਸਵੀਰ ਹੋਮ ਸਕ੍ਰੀਨ” ਵਿੱਚ ਇੱਕ ਚੁਣੋ। “ਫਿੱਟ” ਦੱਸਦਾ ਹੈ ਕਿ ਤਸਵੀਰ ਸਕ੍ਰੀਨ ਕਿਵੇਂ ਭਰੇ, “ਸਥਿਤੀ” ਕਿਹੜਾ ਹਿੱਸਾ ਰਹੇ, “ਜ਼ੂਮ” ਕਿੰਨੀ ਵੱਡੀ, ਅਤੇ “ਤਸਵੀਰ ਹਲਕੀ ਕਰੋ” ਕਿੰਨੀ ਫਿੱਕੀ: ਫਿੱਕੀ ਤਸਵੀਰ 'ਤੇ ਵਿਜੇਟ ਪੜ੍ਹਨੇ ਸੌਖੇ ਹਨ। ਹਰ ਸਕ੍ਰੀਨ ਆਕਾਰ ਲਈ ਤਸਵੀਰ ਇੱਕ ਵਾਰ ਤਿਆਰ ਹੁੰਦੀ ਹੈ, ਥੋੜ੍ਹਾ ਸਮਾਂ ਲੱਗਦਾ ਹੈ।\n\nਵਿਜੇਟ ਤਸਵੀਰ ਉੱਤੇ ਪਲੇਟਾਂ 'ਤੇ ਹੁੰਦੇ ਹਨ। ਪੰਨਾ ਮੂਲ ਹੋਮ ਸਕ੍ਰੀਨ ਵਾਂਗ ਸਜਾਓ: ਪੰਨੇ ਹੇਠਾਂ ਪੈਨਸਿਲ ਨਾਲ, ਜਾਂ ਮੀਨੂ ਵਿੱਚ “ਹੋਮ ਸਕ੍ਰੀਨ ਸੋਧੋ” ਨਾਲ।\n\nਸਥਿਤੀ ਪੱਟੀ (ਸਮਾਂ, Wi-Fi, ਬੈਟਰੀ ਜਾਂ ਜੋ ਤੁਸੀਂ ਚੁਣੋ) ਚਾਲੂ, ਬੰਦ ਜਾਂ ਸਵੈਚਲਿਤ ਹੋ ਸਕਦੀ ਹੈ; ਉੱਪਰ ਜਾਂ ਹੇਠਾਂ; ਪੂਰੀ ਚੌੜਾਈ ਜਾਂ ਖੱਬੇ, ਵਿਚਕਾਰ ਜਾਂ ਸੱਜੇ ਛੋਟੀ ਗੋਲੀ; ਹਲਕੀ, ਗੂੜ੍ਹੀ ਜਾਂ ਸਲੇਟੀ ਪਲੇਟ 'ਤੇ ਜਾਂ ਸਿੱਧੀ ਤਸਵੀਰ 'ਤੇ। ਬਟਨਾਂ ਦੇ ਨਾਂ ਵਾਲੀ ਕਤਾਰ (X4 'ਤੇ) ਵੀ ਚਾਲੂ, ਬੰਦ ਜਾਂ ਸਵੈਚਲਿਤ ਹੋ ਸਕਦੀ ਹੈ। ਸਵੈਚਲਿਤ: ਬਟਨ ਦਬਾਉਣ 'ਤੇ ਇਹ ਕੁਝ ਸਕਿੰਟ ਦਿਸਦੀਆਂ ਹਨ; ਉਹ ਦਬਾਅ ਹੋਰ ਕੁਝ ਨਹੀਂ ਕਰਦਾ।\n\n“ਤਸਵੀਰ ਰੈਂਡਰਿੰਗ”: “ਸਲੇਟੀ ਪੱਧਰ” ਸਕ੍ਰੀਨ ਦੇ ਸਾਰੇ ਸਲੇਟੀ ਰੰਗਾਂ ਵਿੱਚ (X4 'ਤੇ ਹੌਲੀ), “ਡਿਦਰ” ਕਾਲੇ-ਚਿੱਟੇ ਬਿੰਦੂਆਂ ਵਿੱਚ (ਤੇਜ਼), ਜਾਂ “ਸਵੈਚਲਿਤ” ਮੂਲ ਹੋਮ ਸਕ੍ਰੀਨ ਵਾਂਗ: ਸਕ੍ਰੀਨ ਬਣਨ 'ਤੇ ਸਲੇਟੀ ਪੱਧਰ, ਪਹਿਲੀ ਤਬਦੀਲੀ ਤੋਂ ਬਾਅਦ ਬਿੰਦੂ। ਜਿਸ ਸਕ੍ਰੀਨ ਵਿੱਚ ਸਲੇਟੀ ਪੱਧਰ ਨਹੀਂ, ਉੱਥੇ ਬਿੰਦੂ ਵਰਤੇ ਜਾਂਦੇ ਹਨ।"
