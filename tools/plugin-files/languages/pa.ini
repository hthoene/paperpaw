read-later-cloud.setup-needed = ਪਹਿਲਾਂ ਆਪਣਾ Readwise Reader ਪਹੁੰਚ ਟੋਕਨ ਦਾਖਲ ਕਰੋ।
read-later-cloud.bad-token = Readwise ਨੇ ਪਹੁੰਚ ਟੋਕਨ ਸਵੀਕਾਰ ਨਹੀਂ ਕੀਤਾ। readwise.io/access_token 'ਤੇ ਇਸ ਦੀ ਜਾਂਚ ਕਰੋ।
read-later-cloud.wait = Readwise ਥੋੜ੍ਹੀ ਉਡੀਕ ਕਰਨ ਲਈ ਕਹਿੰਦਾ ਹੈ। ਇੱਕ ਮਿੰਟ ਬਾਅਦ ਦੁਬਾਰਾ ਪ੍ਰਾਪਤ ਕਰੋ।
read-later-cloud.no-network = ਲੇਖ ਪ੍ਰਾਪਤ ਕਰਨ ਲਈ ਨੈੱਟਵਰਕ ਚਾਹੀਦਾ ਹੈ।
read-later-cloud.unreachable = Readwise ਤੱਕ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ। Wi-Fi ਕਨੈਕਸ਼ਨ ਦੀ ਜਾਂਚ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
read-later-cloud.unreadable = ਇਹ ਪਲੱਗਇਨ ਇਸ ਡੀਵਾਈਸ 'ਤੇ ਪ੍ਰਾਪਤ ਲੇਖਾਂ ਦੀ ਆਪਣੀ ਸੂਚੀ ਨਹੀਂ ਪੜ੍ਹ ਸਕਦਾ, ਇਸ ਲਈ ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ ਗਿਆ।
read-later-cloud.secret.account = Readwise Reader ਖਾਤਾ
read-later-cloud.too-big = Readwise ਨੇ ਇਸ ਡੀਵਾਈਸ ਦੀ ਸਮਰੱਥਾ ਤੋਂ ਵੱਧ ਭੇਜਿਆ, ਇਸ ਲਈ ਪ੍ਰਾਪਤੀ ਰੁਕ ਗਈ।
read-later-cloud.no-memory = Readwise Reader ਤੋਂ ਪ੍ਰਾਪਤ ਕਰਨ ਲਈ ਲੋੜੀਂਦੀ ਮੈਮਰੀ ਨਹੀਂ ਸੀ। ਪ੍ਰਾਪਤੀ ਰੁਕ ਗਈ; ਅਗਲੀ ਵਾਰ ਇਹ ਜਾਰੀ ਰਹੇਗੀ।
read-later-cloud.not-kept = ਪਹੁੰਚ ਟੋਕਨ ਰੱਖਿਅਤ ਨਹੀਂ ਹੋ ਸਕਿਆ। ਜਾਂਚ ਕਰੋ ਕਿ ਇਹ ਬਹੁਤ ਲੰਬਾ ਨਾ ਹੋਵੇ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
reader.plugin.name = ਰੀਡਰ
reader.plugin.description = ਕਿਤਾਬਾਂ ਪੰਨਾ-ਦਰ-ਪੰਨਾ ਦਿਖਾਉਂਦਾ ਹੈ, ਤਤਕਰੇ ਅਤੇ ਪੜ੍ਹਨ ਸੈਟਿੰਗਾਂ ਸਮੇਤ।
reader.plugin.how = "ਰੀਡਰ ਕਿਤਾਬਾਂ ਪੰਨਾ-ਦਰ-ਪੰਨਾ ਦਿਖਾਉਂਦਾ ਹੈ। ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਤਾਬ ਖੋਲ੍ਹੋ; ਆਖਰੀ ਕਿਤਾਬ ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਖੁੱਲ੍ਹ ਸਕਦੀ ਹੈ (ਸੈਟਿੰਗ “ਸ਼ੁਰੂ 'ਤੇ ਆਖਰੀ ਕਿਤਾਬ ਖੋਲ੍ਹੋ”)।\n\nਪੰਨਾ ਪਲਟਣ ਲਈ ਸਕ੍ਰੀਨ ਦੇ ਖੱਬੇ ਜਾਂ ਸੱਜੇ ਟੈਪ ਕਰੋ, ਜਾਂ ਪੰਨਾ ਬਟਨ ਵਰਤੋ। ਪੜ੍ਹਨ ਮੀਨੂ ਲਈ ਵਿਚਕਾਰ ਟੈਪ ਕਰੋ ਜਾਂ “ਚੁਣੋ” ਦਬਾਓ: ਤਤਕਰਾ, ਖੋਜ, ਪੰਨੇ 'ਤੇ ਜਾਓ, ਫ਼ੌਂਟ ਅਤੇ ਲੇਆਉਟ, ਬੁੱਕਮਾਰਕ ਅਤੇ ਹਾਈਲਾਈਟਾਂ ਆਦਿ। ਉੱਪਰਲੇ ਕਿਨਾਰੇ ਤੋਂ ਹੇਠਾਂ ਸਵਾਈਪ ਤਤਕਾਲ ਪੈਨਲ ਖੋਲ੍ਹਦਾ ਹੈ, ਹੇਠਲੇ ਕਿਨਾਰੇ ਤੋਂ ਉੱਪਰ ਸਵਾਈਪ ਹੋਮ 'ਤੇ ਜਾਂਦਾ ਹੈ; “ਵਾਪਸ” ਦਬਾਈ ਰੱਖਣਾ ਵੀ।\n\nਤਸਵੀਰ ਪੂਰੀ ਸਕ੍ਰੀਨ 'ਤੇ ਦੇਖਣ ਲਈ “ਚੁਣੋ” (ਜਾਂ ਤਸਵੀਰ) ਦਬਾਈ ਰੱਖੋ: ਖੱਬੇ/ਸੱਜੇ ਪੰਨੇ ਦੀਆਂ ਤਸਵੀਰਾਂ ਬਦਲਦੇ ਹਨ। “ਚੁਣੋ” 2x, 3x ਅਤੇ ਵਾਪਸ ਜ਼ੂਮ ਕਰਦਾ ਹੈ (ਟੱਚ 'ਤੇ ਡਬਲ ਟੈਪ); ਜ਼ੂਮ ਵਿੱਚ ਖੱਬੇ/ਸੱਜੇ ਪਾਸੇ ਵੱਲ ਸਰਕਾਉਂਦੇ ਹਨ, ਪੰਨਾ ਬਟਨ (ਜਾਂ ਸਵਾਈਪ) ਪਾਰ ਅਤੇ ਹੇਠਾਂ ਵੱਲ ਲੈ ਜਾਂਦੇ ਹਨ। “ਵਾਪਸ” ਪਹਿਲਾਂ ਫਿੱਟ 'ਤੇ, ਫਿਰ ਪੰਨੇ 'ਤੇ ਲਿਆਉਂਦਾ ਹੈ (ਟੱਚ 'ਤੇ ਬਾਹਰ ਆਉਣ ਲਈ ਦਬਾਈ ਰੱਖੋ)। ਬੁੱਕਮਾਰਕ ਲਈ ਉੱਪਰ ਸੱਜੇ ਕੋਨੇ 'ਤੇ ਟੈਪ ਕਰੋ। ਸ਼ਬਦ ਨੂੰ ਹਾਈਲਾਈਟ ਕਰਨ ਲਈ ਦਬਾਈ ਰੱਖੋ। ਬਟਨਾਂ ਨਾਲ “ਖੱਬੇ” ਦਬਾਈ ਰੱਖੋ: ਖੱਬੇ/ਸੱਜੇ ਸ਼ਬਦ-ਦਰ-ਸ਼ਬਦ, ਪੰਨਾ ਬਟਨ ਲਾਈਨ-ਦਰ-ਲਾਈਨ ਚੱਲਦੇ ਹਨ, ਦਬਾਈ ਰੱਖਣ 'ਤੇ ਪੰਨੇ ਦੇ ਸਿਰਿਆਂ ਅਤੇ ਪੈਰੇ-ਦਰ-ਪੈਰੇ; “ਚੁਣੋ” ਸ਼ਬਦ ਲਈ ਹਾਈਲਾਈਟ ਪੱਟੀ ਖੋਲ੍ਹਦਾ ਹੈ, “ਚੁਣੋ” ਦਬਾਈ ਰੱਖਣਾ ਇਸ ਨੂੰ ਵਾਕ ਅਤੇ ਪੈਰੇ ਤੱਕ ਵਧਾਉਂਦਾ ਹੈ (ਫਿਰ ਖੱਬੇ/ਸੱਜੇ ਅੰਤ, ਦਬਾਈ ਰੱਖਣ 'ਤੇ ਸ਼ੁਰੂਆਤ ਹਿਲਾਉਂਦੇ ਹਨ)। ਚੋਣ ਪੰਨਾ ਪਲਟਣ 'ਤੇ ਵੀ ਜਾਰੀ ਰਹਿੰਦੀ ਹੈ। “Markdown ਵਜੋਂ ਐਕਸਪੋਰਟ ਕਰੋ” ਤੁਹਾਡੇ ਨੋਟ ਰੱਖਿਅਤ ਕਰਦਾ ਹੈ।"
