format-docx.plugin.name = DOCX ਦਸਤਾਵੇਜ਼
format-docx.plugin.description = .docx ਫ਼ਾਈਲਾਂ ਖੋਲ੍ਹਦਾ ਹੈ, ਜਿਵੇਂ Word ਅਤੇ ਹੋਰ ਪ੍ਰੋਗਰਾਮ ਉਹਨਾਂ ਨੂੰ ਰੱਖਿਅਤ ਕਰਦੇ ਹਨ।
format-docx.plugin.how = ".docx ਦਸਤਾਵੇਜ਼ਾਂ ਨੂੰ ਕਿਤਾਬਾਂ ਵਾਂਗ ਖੋਲ੍ਹਦਾ ਹੈ: ਹੈਡਿੰਗਾਂ ਅਤੇ ਸਮੱਗਰੀ ਸੂਚੀ, ਸੂਚੀਆਂ, ਟੇਬਲ, ਬੋਲਡ ਅਤੇ ਇਟੈਲਿਕ, ਲਿੰਕ ਅਤੇ ਤਸਵੀਰਾਂ (JPEG, PNG, GIF)।\n\nਫ਼ਾਈਲਾਂ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਖੋਲ੍ਹੋ। ਸਿਰਲੇਖ ਅਤੇ ਲੇਖਕ ਦਸਤਾਵੇਜ਼ ਦੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਤੋਂ ਆਉਂਦੇ ਹਨ। ਫੁਟਨੋਟ, ਹੈਡਰ ਅਤੇ ਫੁਟਰ, ਅਤੇ ਟਿੱਪਣੀਆਂ ਨਹੀਂ ਦਿਖਾਈਆਂ ਜਾਂਦੀਆਂ।"
format-docx.title = DOCX ਦਸਤਾਵੇਜ਼
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB ਕਿਤਾਬਾਂ ਉਹਨਾਂ ਦੀ ਫ਼ਾਰਮੈਟਿੰਗ, ਸਮੱਗਰੀ ਸੂਚੀ ਅਤੇ ਤਸਵੀਰਾਂ ਸਮੇਤ ਖੋਲ੍ਹਦਾ ਹੈ।
format-epub.plugin.how = "EPUB ਕਿਤਾਬਾਂ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਸੇ ਵੀ ਹੋਰ ਕਿਤਾਬ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ, ਆਪਣੀ ਸਮੱਗਰੀ ਸੂਚੀ, ਤਸਵੀਰਾਂ ਅਤੇ ਪ੍ਰਕਾਸ਼ਕ ਦੀ ਫ਼ਾਰਮੈਟਿੰਗ ਸਮੇਤ। ਵੈੱਬ ਪੰਨੇ (HTML), Markdown, FictionBook (.fb2) ਅਤੇ ਕਾਮਿਕ ਕਿਤਾਬ ਆਰਕਾਈਵ (.cbz) ਵੀ ਇਸੇ ਤਰ੍ਹਾਂ ਖੁੱਲ੍ਹਦੇ ਹਨ, ਹਰ ਇੱਕ ਆਪਣੇ ਪਲੱਗਇਨ ਨਾਲ।\n\nਅਧਿਆਇ ਪਹਿਲੀ ਵਾਰ ਖੋਲ੍ਹਣ 'ਤੇ ਬਦਲਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪਲੱਗਇਨ ਦੀ ਕੈਸ਼ ਵਿੱਚ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ, ਇਸ ਲਈ ਬਾਅਦ ਵਿੱਚ ਇਹ ਤੇਜ਼ ਖੁੱਲ੍ਹਦਾ ਹੈ ਅਤੇ ਵੱਡੀਆਂ ਕਿਤਾਬਾਂ ਛੋਟੇ ਡੀਵਾਈਸਾਂ 'ਤੇ ਵੀ ਚੱਲਦੀਆਂ ਹਨ। ਸਮੱਗਰੀ ਸੂਚੀ ਪੜ੍ਹਨ ਮੀਨੂ ਵਿੱਚ “ਸਮੱਗਰੀ” ਹੇਠ ਹੈ। ਕਿਤਾਬ ਦੀ ਆਪਣੀ ਫ਼ਾਰਮੈਟਿੰਗ ਲਾਗੂ ਹੋਵੇ ਜਾਂ ਨਹੀਂ, ਇਹ “ਪੜ੍ਹਨਾ” ਹੇਠ “ਪ੍ਰਕਾਸ਼ਕ ਦੀ ਫ਼ਾਰਮੈਟਿੰਗ” ਸੈਟਿੰਗ ਤੈਅ ਕਰਦੀ ਹੈ।"
format-epub.title = EPUB ਈ-ਕਿਤਾਬ
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook ਕਿਤਾਬਾਂ ਖੋਲ੍ਹਦਾ ਹੈ (.fb2, zip ਕੀਤੀਆਂ ਵੀ)।
format-fb2.plugin.how = "FictionBook ਕਿਤਾਬਾਂ (.fb2) ਖੋਲ੍ਹਦਾ ਹੈ, ਜੋ ਰੂਸੀ ਅਤੇ ਹੋਰ ਕਿਤਾਬਾਂ ਲਈ ਆਮ ਹਨ, zip ਕੀਤੀਆਂ (.fb2.zip) ਵੀ, ਉਹਨਾਂ ਦੇ ਸਿਰਲੇਖ, ਲੇਖਕਾਂ, ਕਵਰ ਅਤੇ ਅਧਿਆਵਾਂ ਸਮੇਤ।\n\nਉਹਨਾਂ ਨੂੰ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ; ਉਹ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਦਿਸਦੀਆਂ ਹਨ ਅਤੇ ਕਿਸੇ ਵੀ ਹੋਰ ਕਿਤਾਬ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ।"
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ਫ਼ਾਈਲਾਂ ਵਜੋਂ ਰੱਖਿਅਤ ਵੈੱਬ ਪੰਨੇ ਖੋਲ੍ਹਦਾ ਹੈ ਅਤੇ ਸਿਰਫ਼ ਪੜ੍ਹਨ ਵਾਲੀ ਸਮੱਗਰੀ ਦਿਖਾਉਂਦਾ ਹੈ।
format-html.plugin.how = "ਫ਼ਾਈਲਾਂ ਵਜੋਂ ਰੱਖਿਅਤ ਵੈੱਬ ਪੰਨਿਆਂ (.html, .htm, .xhtml) ਨੂੰ ਕਿਤਾਬਾਂ ਵਾਂਗ ਖੋਲ੍ਹਦਾ ਹੈ: ਸਿਰਫ਼ ਪੜ੍ਹਨ ਵਾਲੀ ਸਮੱਗਰੀ, ਆਲੇ-ਦੁਆਲੇ ਦੇ ਮੀਨੂ, ਇਸ਼ਤਿਹਾਰਾਂ ਆਦਿ ਤੋਂ ਬਿਨਾਂ।\n\nਫ਼ਾਈਲ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ ਕਿਸੇ ਵੀ ਕਿਤਾਬ ਵਾਂਗ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਖੋਲ੍ਹੋ। ਪੰਨੇ ਦੇ ਅੰਦਰਲੇ ਲਿੰਕ ਕੰਮ ਕਰਦੇ ਹਨ; ਤਸਵੀਰਾਂ ਉੱਥੇ ਦਿਸਦੀਆਂ ਹਨ ਜਿੱਥੇ ਉਹ ਫ਼ਾਈਲ ਵਿੱਚ ਹਨ।"
format-html.title = ਵੈੱਬ ਪੰਨਾ (HTML)
format-images.plugin.name = ਤਸਵੀਰਾਂ
format-images.plugin.description = ਤਸਵੀਰਾਂ (.jpg, .png, .gif) ਨੂੰ ਕਿਤਾਬਾਂ ਵਾਂਗ ਖੋਲ੍ਹਦਾ ਹੈ, ਹਰ ਤਸਵੀਰ ਇੱਕ ਪੰਨਾ।
format-images.plugin.how = "ਤਸਵੀਰਾਂ (.jpg, .png, .gif) ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਤਾਬਾਂ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ, ਹਰ ਪੰਨੇ 'ਤੇ ਇੱਕ ਤਸਵੀਰ, ਸਕ੍ਰੀਨ ਮੁਤਾਬਕ।\n\nਤਸਵੀਰਾਂ ਦਾ ਪੂਰਾ ਫ਼ੋਲਡਰ ਪੜ੍ਹਨ ਲਈ ਉਸ ਦੀ ਪਹਿਲੀ ਤਸਵੀਰ ਖੋਲ੍ਹੋ: ਫ਼ੋਲਡਰ ਵਿੱਚ ਉਸ ਤੋਂ ਬਾਅਦ ਦੀਆਂ ਤਸਵੀਰਾਂ ਨਾਂਵਾਂ ਦੇ ਕ੍ਰਮ ਵਿੱਚ (2 ਪਹਿਲਾਂ, 10 ਬਾਅਦ ਵਿੱਚ) ਆਉਂਦੀਆਂ ਹਨ। ਫ਼ੋਲਡਰ ਵਿੱਚ ਬਾਅਦ ਵਾਲੀ ਤਸਵੀਰ ਖੋਲ੍ਹਣ 'ਤੇ ਉੱਥੋਂ ਸ਼ੁਰੂ ਹੁੰਦਾ ਹੈ; ਹਰ ਇੱਕ ਦੀ ਪੜ੍ਹਨ ਦੀ ਥਾਂ ਵੱਖਰੀ ਯਾਦ ਰੱਖੀ ਜਾਂਦੀ ਹੈ। ਖੋਲ੍ਹੀ ਗਈ ਤਸਵੀਰ ਤੋਂ ਫ਼ੋਲਡਰ ਦੀਆਂ 300 ਤੱਕ ਤਸਵੀਰਾਂ ਪੜ੍ਹੀਆਂ ਜਾਂਦੀਆਂ ਹਨ।\n\nਜੋ ਫ਼ਾਈਲ ਤਸਵੀਰ ਨਹੀਂ ਜਾਂ ਬਹੁਤ ਵੱਡੀ ਹੈ, ਉਸ ਦੀ ਥਾਂ ਉਸ ਦਾ ਨਾਂ ਦਿਸਦਾ ਹੈ। ਆਪਣੇ ਸਿਰਲੇਖ ਵਾਲੀ ਕਈ ਤਸਵੀਰਾਂ ਦੀ ਕਿਤਾਬ ਲਈ ਕਾਮਿਕ ਕਿਤਾਬ ਆਰਕਾਈਵ (.cbz) ਬਿਹਤਰ ਹੈ।"
format-images.title = ਤਸਵੀਰ
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ਫ਼ਾਈਲਾਂ (.md) ਖੋਲ੍ਹਦਾ ਹੈ, ਜਿਵੇਂ ਨੋਟ।
format-markdown.plugin.how = "Markdown ਫ਼ਾਈਲਾਂ (.md), ਜਿਵੇਂ ਨੋਟ, ਕਿਤਾਬਾਂ ਵਾਂਗ ਖੋਲ੍ਹਦਾ ਹੈ: ਹੈਡਿੰਗਾਂ, ਸੂਚੀਆਂ, ਹਵਾਲੇ ਅਤੇ ਜ਼ੋਰ ਉਸੇ ਤਰ੍ਹਾਂ ਜਿਵੇਂ ਉਹਨਾਂ ਦਾ ਮਤਲਬ ਹੈ, ਚਿੰਨ੍ਹਾਂ ਵਜੋਂ ਨਹੀਂ।\n\nਫ਼ਾਈਲਾਂ ਲਾਇਬ੍ਰੇਰੀ ਫ਼ੋਲਡਰ ਵਿੱਚ ਰੱਖੋ ਅਤੇ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਖੋਲ੍ਹੋ। ਪਹਿਲੀ ਹੈਡਿੰਗ ਸਿਰਲੇਖ ਬਣਦੀ ਹੈ; ਫ਼ਾਈਲ ਦੇ ਨਾਲ ਪਈਆਂ ਤਸਵੀਰਾਂ ਉੱਥੇ ਦਿਸਦੀਆਂ ਹਨ ਜਿੱਥੇ ਟੈਕਸਟ ਉਹਨਾਂ ਦਾ ਨਾਂ ਲੈਂਦਾ ਹੈ।"
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI ਕਿਤਾਬਾਂ
format-mobi.plugin.description = DRM ਤੋਂ ਬਿਨਾਂ .mobi ਅਤੇ .azw ਫ਼ਾਈਲਾਂ ਖੋਲ੍ਹਦਾ ਹੈ।
format-mobi.plugin.how = "MOBI ਕਿਤਾਬਾਂ (.mobi, .azw) ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਸੇ ਵੀ ਕਿਤਾਬ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ, ਕੁਝ ਵੀ ਸੈੱਟ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ। ਸਿਰਲੇਖ, ਲੇਖਕ, ਭਾਸ਼ਾ ਅਤੇ ਕਵਰ ਕਿਤਾਬ ਤੋਂ ਆਉਂਦੇ ਹਨ, ਅਤੇ ਸਮੱਗਰੀ ਸੂਚੀ ਉਸ ਦੇ ਸਿਰਲੇਖਾਂ ਤੋਂ ਬਣਦੀ ਹੈ।\n\nਪਹਿਲੀ ਵਾਰ ਖੋਲ੍ਹਣ 'ਤੇ ਕਿਤਾਬ ਬਦਲੀ ਜਾਂਦੀ ਹੈ, ਲੰਬੀ ਕਿਤਾਬ ਲਈ ਇਸ ਵਿੱਚ ਕੁਝ ਸਕਿੰਟ ਲੱਗਦੇ ਹਨ; ਉਸ ਤੋਂ ਬਾਅਦ ਇਹ ਤੁਰੰਤ ਖੁੱਲ੍ਹਦੀ ਹੈ। ਟੈਕਸਟ, ਸਿਰਲੇਖ, ਮੋਟੇ ਅਤੇ ਤਿਰਛੇ ਅੱਖਰ, ਲਿੰਕ ਅਤੇ ਤਸਵੀਰਾਂ ਦਿਖਾਈਆਂ ਜਾਂਦੀਆਂ ਹਨ।\n\nDRM ਵਾਲੀਆਂ ਕਿਤਾਬਾਂ (ਦੁਕਾਨ ਤੋਂ ਖਰੀਦੀਆਂ ਜ਼ਿਆਦਾਤਰ ਕਿਤਾਬਾਂ) ਨਹੀਂ ਖੁੱਲ੍ਹਦੀਆਂ, ਨਾ ਹੀ Huffman ਕੰਪ੍ਰੈਸ਼ਨ ਵਾਲੀਆਂ ਜਾਂ ਨਵੇਂ KF8 ਰੂਪ (.azw3) ਵਾਲੀਆਂ: ਖੋਲ੍ਹਣ 'ਤੇ PaperPaw ਇਹ ਦੱਸਦਾ ਹੈ। Calibre ਵਰਗੇ ਟੂਲ ਨਾਲ ਬਣਾਈ EPUB ਕਾਪੀ ਹਮੇਸ਼ਾ ਖੁੱਲ੍ਹਦੀ ਹੈ।"
format-mobi.title = MOBI ਕਿਤਾਬਾਂ
