calibre.plugin.name = ਵਾਇਰਲੈੱਸ ਲਾਇਬ੍ਰੇਰੀ
calibre.plugin.description = ਨੈੱਟਵਰਕ ਰਾਹੀਂ ਕਿਤਾਬਾਂ ਪ੍ਰਾਪਤ ਕਰਦੀ ਹੈ। Calibre ਲਈ ਵਾਇਰਲੈੱਸ ਡੀਵਾਈਸ ਵਜੋਂ ਕੰਮ ਕਰਦੀ ਹੈ।
calibre.plugin.how = "ਵਾਇਰਲੈੱਸ ਲਾਇਬ੍ਰੇਰੀ ਨਾਲ ਡੀਵਾਈਸ ਤੁਹਾਡੇ ਕੰਪਿਊਟਰ ਦੇ Calibre ਵਿੱਚ ਵਾਇਰਲੈੱਸ ਡੀਵਾਈਸ ਵਜੋਂ ਦਿਸਦਾ ਹੈ। ਫਿਰ Calibre ਇਸ ਨੂੰ ਕਿਤਾਬਾਂ ਭੇਜ ਸਕਦਾ ਹੈ, ਉਹਨਾਂ ਦੀ ਸੂਚੀ ਦੇਖ ਸਕਦਾ ਹੈ ਅਤੇ ਉਹਨਾਂ ਨੂੰ ਮਿਟਾ ਸਕਦਾ ਹੈ। ਕਿਤਾਬਾਂ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਜਾਂਦੀਆਂ ਹਨ।\n\nਡੀਵਾਈਸ ਅਤੇ ਕੰਪਿਊਟਰ ਇੱਕੋ Wi-Fi ਨੈੱਟਵਰਕ ਵਿੱਚ ਹੋਣ, ਫਿਰ “ਟੂਲ” ਮੀਨੂ ਤੋਂ ਵਾਇਰਲੈੱਸ ਲਾਇਬ੍ਰੇਰੀ ਖੋਲ੍ਹੋ। Calibre ਵਿੱਚ Connect/share ਚੁਣੋ, ਫਿਰ Start wireless device connection। ਡੀਵਾਈਸ ਨੂੰ ਤੁਹਾਡਾ ਕੰਪਿਊਟਰ ਮਿਲਣ 'ਤੇ ਉਸ ਦਾ ਨਾਂ ਦਿਸਦਾ ਹੈ; “ਕਨੈਕਟ ਕਰੋ” 'ਤੇ ਟੈਪ ਕਰੋ (ਬਟਨਾਂ ਨਾਲ “ਚੁਣੋ” ਦਬਾਓ)। Calibre ਇੱਥੇ ਕਿਤਾਬਾਂ ਸ਼ਾਮਲ ਕਰ ਅਤੇ ਮਿਟਾ ਸਕਦਾ ਹੈ, ਇਸ ਲਈ ਸਿਰਫ਼ ਆਪਣੇ ਕੰਪਿਊਟਰ ਨਾਲ ਕਨੈਕਟ ਕਰੋ। ਸਕ੍ਰੀਨ ਬੰਦ ਕਰਨ 'ਤੇ ਕਨੈਕਸ਼ਨ ਖਤਮ ਹੋ ਜਾਂਦਾ ਹੈ।\n\nਜੇ Calibre ਆਪਣੇ-ਆਪ ਨਾ ਮਿਲੇ, ਤਾਂ ਸੈਟਿੰਗਾਂ › ਲਾਇਬ੍ਰੇਰੀ ਦੇ Calibre ਹਿੱਸੇ ਵਿੱਚ “ਪਤਾ” 'ਤੇ ਉਸ ਦੇ ਕੰਪਿਊਟਰ ਦਾ ਪਤਾ ਦਾਖਲ ਕਰੋ। ਜੇ Calibre 9090 ਤੋਂ ਬਿਨਾਂ ਕੋਈ ਹੋਰ ਪੋਰਟ ਵਰਤਦਾ ਹੈ, ਤਾਂ ਉਸ ਨੂੰ :ਪੋਰਟ ਵਜੋਂ ਜੋੜੋ, ਜਿਵੇਂ 192.168.1.20:9091।"
