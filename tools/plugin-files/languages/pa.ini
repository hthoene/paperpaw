mail.plugin.name = ਮੇਲ
mail.plugin.description = ਪਾਸਵਰਡ ਜਾਂ ਐਪ ਪਾਸਵਰਡ (IMAP ਅਤੇ SMTP) ਨਾਲ ਈਮੇਲ ਪੜ੍ਹਦਾ ਅਤੇ ਭੇਜਦਾ ਹੈ, ਬ੍ਰਾਊਜ਼ਰ ਲੌਗਇਨ ਤੋਂ ਬਿਨਾਂ।
mail.plugin.how = "“ਮੇਲ” IMAP ਅਤੇ SMTP ਰਾਹੀਂ ਈਮੇਲ ਪੜ੍ਹਦਾ ਅਤੇ ਭੇਜਦਾ ਹੈ। ਇਹ ਤੁਹਾਡੇ ਪਤੇ ਅਤੇ ਪਾਸਵਰਡ ਨਾਲ ਸਾਈਨ ਇਨ ਕਰਦਾ ਹੈ, ਬ੍ਰਾਊਜ਼ਰ ਲੌਗਇਨ ਤੋਂ ਬਿਨਾਂ, ਇਸ ਲਈ ਇਹ ਹਰ ਉਸ ਪ੍ਰਦਾਤਾ ਨਾਲ ਚੱਲਦਾ ਹੈ ਜੋ ਇਸ ਦੀ ਇਜਾਜ਼ਤ ਦਿੰਦਾ ਹੈ।\n\nਖਾਤਾ “ਸੈਟਿੰਗਾਂ” › “ਮੇਲ” ਵਿੱਚ ਸੈੱਟ ਕਰੋ: ਪ੍ਰਦਾਤਾ ਚੁਣੋ, ਪਤਾ ਅਤੇ ਪਾਸਵਰਡ ਲਿਖੋ। ਜ਼ਿਆਦਾਤਰ ਪ੍ਰਦਾਤਾ ਐਪ ਪਾਸਵਰਡ ਮੰਗਦੇ ਹਨ: ਇਸ ਨੂੰ ਆਪਣੇ ਖਾਤੇ ਦੀਆਂ ਸੁਰੱਖਿਆ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਬਣਾਓ। ਆਮ ਪਾਸਵਰਡ ਅਕਸਰ ਨਹੀਂ ਚੱਲਦਾ। ਪਾਸਵਰਡ ਸਿਰਫ਼ ਪ੍ਰਦਾਤਾ ਦੇ ਸਰਵਰ ਨੂੰ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪਾਸਵਰਡਾਂ ਅਤੇ ਕੁੰਜੀਆਂ ਨਾਲ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ।\n\n“ਮੇਲ” ਟੂਲਾਂ ਵਿੱਚ ਖੋਲ੍ਹੋ। “ਮੇਲ ਦੇਖੋ” ਨਵੀਆਂ ਮੇਲਾਂ ਅਤੇ ਫ਼ੋਲਡਰ ਲਿਆਉਂਦਾ ਹੈ। ਮੇਲਾਂ ਕਾਰਡ 'ਤੇ ਰੱਖੀਆਂ ਜਾਂਦੀਆਂ ਹਨ, ਇਸ ਲਈ ਨੈੱਟਵਰਕ ਤੋਂ ਬਿਨਾਂ ਵੀ ਪੜ੍ਹੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ; Wi-Fi ਸਿਰਫ਼ ਪਲ ਭਰ ਚਾਲੂ ਰਹਿੰਦਾ ਹੈ।\n\nਜੇ ਪ੍ਰਦਾਤਾ ਸੂਚੀ ਵਿੱਚ ਨਹੀਂ, ਤਾਂ “ਆਪਣੇ ਸਰਵਰ” ਚੁਣੋ ਅਤੇ ਉੱਨਤ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਸਰਵਰ, ਪੋਰਟ ਅਤੇ ਸੁਰੱਖਿਆ ਸੈੱਟ ਕਰੋ। ਜਿਸ ਸਰਵਰ ਦੇ ਸਰਟੀਫ਼ਿਕੇਟ ਦੀ ਕੋਈ ਅਥਾਰਟੀ ਪੁਸ਼ਟੀ ਨਹੀਂ ਕਰਦੀ, ਉਸ ਲਈ ਇੱਕ ਵਾਰ ਪੁੱਛਿਆ ਜਾਂਦਾ ਹੈ; ਫ਼ਿੰਗਰਪ੍ਰਿੰਟ ਪ੍ਰਦਾਤਾ ਦੇ ਦਿਖਾਏ ਨਾਲ ਮਿਲਾਓ।\n\nਜਿਸ ਮੇਲ ਨਾਲ ਕਿਤਾਬ ਨੱਥੀ ਹੋਵੇ (EPUB, PDF ਆਦਿ, 2 MB ਤੱਕ), ਉਸ ਹੇਠਾਂ “ਕਿਤਾਬ ਖੋਲ੍ਹੋ” ਹੁੰਦਾ ਹੈ: ਇਹ ਫ਼ਾਈਲ ਲਿਆ ਕੇ ਲਾਇਬ੍ਰੇਰੀ ਵਿੱਚ ਪਾਉਂਦਾ ਅਤੇ ਖੋਲ੍ਹਦਾ ਹੈ।\n\n“ਸੈਟਿੰਗਾਂ” › “ਮੇਲ” ਵਿੱਚ “ਪਿਛੋਕੜ ਵਿੱਚ ਨਵੀਂ ਮੇਲ ਦੇਖੋ” (ਮਿਆਰੀ: ਬੰਦ) ਹਰ 15, 30 ਜਾਂ 60 ਮਿੰਟ ਬਾਅਦ, ਜਦੋਂ ਰੀਡਰ ਜਾਗਦਾ ਅਤੇ ਆਨਲਾਈਨ ਹੋਵੇ, ਸੁਰੱਖਿਅਤ ਕਨੈਕਸ਼ਨ ਨਾਲ ਹਰ ਖਾਤਾ ਦੇਖਦਾ ਹੈ ਅਤੇ ਹੋਮ 'ਤੇ ਨਾ ਪੜ੍ਹੀਆਂ ਦੀ ਗਿਣਤੀ ਅੱਪਡੇਟ ਕਰਦਾ ਹੈ। ਇਹ ਕੁਝ ਬੈਟਰੀ ਵਰਤਦਾ ਹੈ। “ਮੇਲ” ਖੋਲ੍ਹਣ ਨਾਲ ਚੱਲ ਰਹੀ ਜਾਂਚ ਰੁਕ ਜਾਂਦੀ ਹੈ।\n\nਹੋਮ ਸਕ੍ਰੀਨ ਵਿਜੇਟ: ਨਾ ਪੜ੍ਹੀਆਂ ਦੀ ਗਿਣਤੀ, ਨਵੀਆਂ ਅਤੇ ਤਾਰਾ ਲੱਗੀਆਂ ਮੇਲਾਂ, ਇੱਕ ਮੇਲਬਾਕਸ, ਅਤੇ ਮੇਲ ਲਿਖਣ ਲਈ ਸ਼ਾਰਟਕੱਟ।"
