calendar.plugin.description = ਰੀਡਰ 'ਤੇ ਤੁਹਾਡੇ ਕੈਲੰਡਰ: CalDAV, iCal ਅਤੇ ਫ਼ਾਈਲਾਂ ਤੋਂ ਏਜੰਡਾ, ਦਿਨ, ਹਫ਼ਤਾ ਅਤੇ ਮਹੀਨਾ, ਸੰਪਰਕਾਂ ਤੋਂ ਜਨਮਦਿਨ, ਹੋਮ ਵਿਜੇਟ ਅਤੇ ਸਲੀਪ ਸਕ੍ਰੀਨ।
calendar.plugin.how = "ਰੀਡਰ 'ਤੇ ਤੁਹਾਡੇ ਕੈਲੰਡਰ: ਅਗਲੇ ਦਿਨਾਂ ਦਾ ਏਜੰਡਾ, ਦਿਨ, ਹਫ਼ਤਾ ਅਤੇ ਮਹੀਨਾ, CalDAV ਕੈਲੰਡਰਾਂ (Nextcloud, Fastmail ਆਦਿ), iCal ਪਤਿਆਂ (.ics, webcal://) ਅਤੇ ਕਾਰਡ 'ਤੇ ਕੈਲੰਡਰ ਫ਼ਾਈਲਾਂ ਦੇ ਇਵੈਂਟਾਂ ਨਾਲ, ਅਤੇ ਸੰਪਰਕਾਂ (CardDAV) ਦੇ ਜਨਮਦਿਨ ਤੇ ਵਰ੍ਹੇਗੰਢਾਂ। ਰੀਡਰ ਕੈਲੰਡਰ ਸਿਰਫ਼ ਪੜ੍ਹਦਾ ਹੈ, ਕਦੇ ਬਦਲਦਾ ਨਹੀਂ।\n\n“ਟੂਲ” ਮੀਨੂ ਤੋਂ ਕੈਲੰਡਰ ਖੋਲ੍ਹੋ। ਦ੍ਰਿਸ਼ ਬਦਲਣ, ਕੈਲੰਡਰ ਸ਼ਾਮਲ ਕਰਨ ਜਾਂ ਸਿੰਕ ਲਈ ਪਹਿਲੀ ਕਤਾਰ ਚੁਣੋ, ਕੋਈ ਕਤਾਰ ਦਬਾਈ ਰੱਖੋ ਜਾਂ “ਮੀਨੂ” ਦਬਾਓ। ਦਿਨ ਅਤੇ ਹਫ਼ਤੇ ਵਿੱਚ ਪਹਿਲੀਆਂ ਦੋ ਕਤਾਰਾਂ ਅਤੇ ਪੰਨਾ ਬਟਨ ਪਿੱਛੇ ਜਾਂ ਅੱਗੇ ਜਾਂਦੇ ਹਨ; ਮਹੀਨੇ ਵਿੱਚ ਤੀਰ ਬਟਨ ਦਿਨ ਬਦਲਦੇ ਹਨ, ਪੰਨਾ ਬਟਨ ਮਹੀਨਾ, ਅਤੇ “ਚੁਣੋ” ਦਿਨ ਖੋਲ੍ਹਦਾ ਹੈ। ਇਵੈਂਟ 'ਤੇ “ਚੁਣੋ” ਉਸ ਨੂੰ ਪੂਰਾ ਦਿਖਾਉਂਦਾ ਹੈ। “ਵਾਪਸ” ਇੱਕ ਕਦਮ ਪਿੱਛੇ ਜਾਂਦਾ ਹੈ।\n\nਕੈਲੰਡਰ “ਕੈਲੰਡਰ” ਹੇਠ ਸ਼ਾਮਲ ਕਰੋ (ਮੀਨੂ ਵਿੱਚ, ਜਾਂ ਸੈਟਿੰਗਾਂ › ਕੈਲੰਡਰ)। ਕਿਸਮ ਚੁਣੋ: CalDAV ਖਾਤਾ (ਸਰਵਰ ਦਾ ਪਤਾ ਕਾਫ਼ੀ ਹੈ), iCal ਪਤਾ (.ics), ਕਾਰਡ 'ਤੇ ਫ਼ਾਈਲ, ਜਾਂ ਸੰਪਰਕ (CardDAV, ਜਨਮਦਿਨਾਂ ਲਈ)। ਪਤਾ, ਖਾਤੇ ਲਈ ਵਰਤੋਂਕਾਰ ਨਾਂ ਅਤੇ ਪਾਸਵਰਡ (ਬਿਹਤਰ ਐਪ ਪਾਸਵਰਡ), ਅਤੇ ਨਾਂ ਦਾਖਲ ਕਰੋ। ਹਰ ਕੈਲੰਡਰ ਦਾ ਇੱਕ ਨਿਸ਼ਾਨ ਹੁੰਦਾ ਹੈ ਜੋ ਤੁਸੀਂ ਬਦਲ ਸਕਦੇ ਹੋ; ਵੱਧ ਤੋਂ ਵੱਧ ਛੇ ਕੈਲੰਡਰ।\n\nਦੁਹਰਾਉਣ ਵਾਲੇ, ਸਾਰੇ ਦਿਨ ਦੇ ਅਤੇ ਹੋਰ ਸਮਾਂ ਖੇਤਰਾਂ ਦੇ ਇਵੈਂਟ ਰੀਡਰ ਦੀ ਘੜੀ ਮੁਤਾਬਕ ਦਿਸਦੇ ਹਨ। ਰੀਡਰ ਅੱਜ ਤੋਂ 60 ਦਿਨ ਪਹਿਲਾਂ ਤੋਂ 60 ਦਿਨ ਬਾਅਦ ਤੱਕ ਦੇ ਵੱਧ ਤੋਂ ਵੱਧ 240 ਇਵੈਂਟ ਰੱਖਦਾ ਹੈ ਅਤੇ ਬਿਨਾਂ ਨੈੱਟਵਰਕ ਦਿਖਾਉਂਦਾ ਹੈ।\n\nਕੈਲੰਡਰ ਪੜ੍ਹੇ ਜਾਂਦੇ ਹਨ: ਖੋਲ੍ਹਣ 'ਤੇ (ਵੱਧ ਤੋਂ ਵੱਧ ਹਰ 5 ਮਿੰਟ), “ਹੁਣੇ ਸਿੰਕ ਕਰੋ” 'ਤੇ, ਅਤੇ ਸੈਟਿੰਗਾਂ › ਕੈਲੰਡਰ ਮੁਤਾਬਕ ਨੈੱਟਵਰਕ ਚਾਲੂ ਹੋਣ ਜਾਂ ਚਾਰਜਿੰਗ ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ। ਰੇਡੀਓ ਸਿਰਫ਼ “ਹੁਣੇ ਸਿੰਕ ਕਰੋ” ਲਈ ਚਾਲੂ ਹੁੰਦਾ ਹੈ।\n\nਹੋਮ ਸਕ੍ਰੀਨ ਵਿਜੇਟ (ਹੋਮ ਸਕ੍ਰੀਨ ਦਬਾਈ ਰੱਖੋ): ਅੱਜ, ਅਗਲਾ ਇਵੈਂਟ, ਏਜੰਡਾ, ਮਹੀਨਾ ਅਤੇ ਜਨਮਦਿਨ; ਟੈਪ ਇਵੈਂਟ ਜਾਂ ਦਿਨ ਖੋਲ੍ਹਦਾ ਹੈ। ਸਲੀਪ ਸਕ੍ਰੀਨ 'ਤੇ ਅੱਜ ਦੇ ਏਜੰਡੇ ਲਈ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਸਲੀਪ ਸਕ੍ਰੀਨ” ਹੇਠ ਕੈਲੰਡਰ ਚੁਣੋ।"
