format-rtf.plugin.description = .rtf ਫ਼ਾਈਲਾਂ ਨੂੰ ਕਿਤਾਬਾਂ ਵਜੋਂ ਖੋਲ੍ਹਦਾ ਹੈ।
format-rtf.title = RTF ਦਸਤਾਵੇਜ਼
format-txt.plugin.name = ਸਾਦਾ ਟੈਕਸਟ
format-txt.plugin.description = ਸਾਦੇ ਟੈਕਸਟ ਵਾਲੀਆਂ ਫ਼ਾਈਲਾਂ (.txt) ਖੋਲ੍ਹਦਾ ਹੈ।
format-txt.plugin.how = "ਸਾਦੇ ਟੈਕਸਟ ਵਾਲੀਆਂ ਫ਼ਾਈਲਾਂ (.txt) ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਸੇ ਵੀ ਕਿਤਾਬ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ, ਕੁਝ ਵੀ ਸੈੱਟ ਕਰਨ ਦੀ ਲੋੜ ਨਹੀਂ। ਪਲੱਗਇਨ UTF-8, UTF-16 ਅਤੇ Windows-1252 ਟੈਕਸਟ ਪੜ੍ਹਦਾ ਹੈ ਅਤੇ ਐਨਕੋਡਿੰਗ ਆਪ ਪਛਾਣਦਾ ਹੈ।\n\nਪੈਰੇ ਫ਼ਾਈਲ ਦੀਆਂ ਖਾਲੀ ਲਾਈਨਾਂ ਮੁਤਾਬਕ ਬਣਦੇ ਹਨ; ਜੇ ਫ਼ਾਈਲ ਵਿੱਚ ਕੋਈ ਖਾਲੀ ਲਾਈਨ ਨਹੀਂ, ਤਾਂ ਹਰ ਲਾਈਨ ਇੱਕ ਪੈਰਾ ਹੁੰਦੀ ਹੈ। Project Gutenberg ਫ਼ਾਈਲਾਂ ਵਿੱਚ ਸ਼ੁਰੂ ਅਤੇ ਅੰਤ ਦਾ ਲਾਇਸੈਂਸ ਟੈਕਸਟ ਛੱਡ ਦਿੱਤਾ ਜਾਂਦਾ ਹੈ, ਅਤੇ ਸਿਰਲੇਖ ਅਤੇ ਲੇਖਕ ਹੈਡਰ ਤੋਂ ਲਏ ਜਾਂਦੇ ਹਨ।\n\nਫ਼ਾਈਲ ਕਦੇ ਵੀ ਪੂਰੀ ਲੋਡ ਨਹੀਂ ਕੀਤੀ ਜਾਂਦੀ, ਇਸ ਲਈ ਬਹੁਤ ਵੱਡੇ ਟੈਕਸਟ ਛੋਟੇ ਡੀਵਾਈਸਾਂ 'ਤੇ ਵੀ ਖੁੱਲ੍ਹਦੇ ਹਨ।"
format-txt.title = ਸਾਦਾ ਟੈਕਸਟ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC ਅਤੇ XTCH ਕਿਤਾਬਾਂ ਖੋਲ੍ਹਦਾ ਹੈ, Xteink ਰੀਡਰਾਂ ਦੇ ਪਹਿਲਾਂ ਤੋਂ ਬਣੇ ਪੰਨੇ।
format-xtc.plugin.how = "XTC ਅਤੇ XTCH ਫ਼ਾਈਲਾਂ ਅਜਿਹੀਆਂ ਕਿਤਾਬਾਂ ਹਨ ਜਿਹਨਾਂ ਦੇ ਪੰਨੇ ਪਹਿਲਾਂ ਹੀ ਤਸਵੀਰਾਂ ਵਜੋਂ ਬਣੇ ਹੁੰਦੇ ਹਨ, ਜਿਵੇਂ Xteink ਰੀਡਰਾਂ ਲਈ ਕਨਵਰਟਰ ਬਣਾਉਂਦੇ ਹਨ। ਇਹ ਲਾਇਬ੍ਰੇਰੀ ਤੋਂ ਕਿਸੇ ਵੀ ਕਿਤਾਬ ਵਾਂਗ ਖੁੱਲ੍ਹਦੀਆਂ ਹਨ।\n\nਕਿਉਂਕਿ ਹਰ ਪੰਨਾ ਇੱਕ ਪੱਕੀ ਤਸਵੀਰ ਹੈ, ਟੈਕਸਟ ਦਾ ਆਕਾਰ ਜਾਂ ਫ਼ੌਂਟ ਬਦਲਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਪੰਨੇ ਕਾਲੇ-ਚਿੱਟੇ ਹੁੰਦੇ ਹਨ ਜਾਂ ਉਹਨਾਂ ਵਿੱਚ ਚਾਰ ਸਲੇਟੀ ਰੰਗ ਹੁੰਦੇ ਹਨ। ਹਰ ਪੰਨਾ ਦਿਖਾਏ ਜਾਣ ਵੇਲੇ ਡੀਕੋਡ ਹੁੰਦਾ ਹੈ, ਇਸ ਲਈ ਥੋੜ੍ਹੀ ਮੈਮਰੀ ਹੀ ਚਾਹੀਦੀ ਹੈ, X4 'ਤੇ ਵੀ।\n\nਸਿਰਲੇਖ, ਲੇਖਕ ਅਤੇ ਅਧਿਆਇ ਫ਼ਾਈਲ ਤੋਂ ਲਏ ਜਾਂਦੇ ਹਨ, ਜੇ ਉਸ ਵਿੱਚ ਹੋਣ।"
format-xtc.title = XTC ਪੰਨੇ
help.plugin.name = ਸੰਕੇਤ
help.plugin.description = ਕੋਈ ਸਕ੍ਰੀਨ ਪਹਿਲੀ ਵਾਰ ਖੁੱਲ੍ਹਣ 'ਤੇ ਦਿਖਾਉਂਦਾ ਹੈ ਕਿ ਉਸ ਦੇ ਕੰਟਰੋਲ ਕੀ ਕਰਦੇ ਹਨ।
help.plugin.how = "ਜਦੋਂ ਕੋਈ ਸਕ੍ਰੀਨ ਪਹਿਲੀ ਵਾਰ ਖੁੱਲ੍ਹਦੀ ਹੈ, ਤਾਂ ਉਸ ਉੱਤੇ ਇੱਕ ਛੋਟਾ ਨੋਟ ਦੱਸਦਾ ਹੈ ਕਿ ਉਸ ਦੇ ਕੰਟਰੋਲ ਕੀ ਕਰਦੇ ਹਨ: ਸਕ੍ਰੀਨ ਦੇ ਕਿਹੜੇ ਹਿੱਸੇ 'ਤੇ ਟੈਪ ਕਿੱਥੇ ਲੈ ਜਾਂਦਾ ਹੈ, ਫ਼ਰੇਮ ਨਾਲ, ਅਤੇ ਬਟਨ ਕੀ ਕਰਦੇ ਹਨ।\n\nਇੱਕ ਟੈਪ ਜਾਂ ਕੋਈ ਵੀ ਬਟਨ ਨੋਟ ਬੰਦ ਕਰ ਦਿੰਦਾ ਹੈ, ਅਤੇ ਉਸ ਸਕ੍ਰੀਨ ਲਈ ਇਹ ਮੁੜ ਨਹੀਂ ਆਉਂਦਾ। “ਹੋਰ ਸੰਕੇਤ ਨਹੀਂ” ਸਾਰੇ ਸੰਕੇਤ ਬੰਦ ਕਰ ਦਿੰਦਾ ਹੈ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ, “ਸਿਸਟਮ” ਹੇਠਾਂ, “ਸੰਕੇਤ” ਇਹਨਾਂ ਨੂੰ ਚਾਲੂ ਜਾਂ ਬੰਦ ਕਰਦਾ ਹੈ, ਅਤੇ “ਸੰਕੇਤ ਮੁੜ ਦਿਖਾਓ” ਹਰ ਸਕ੍ਰੀਨ ਦਾ ਨੋਟ ਇੱਕ ਵਾਰ ਹੋਰ ਦਿਖਾਉਂਦਾ ਹੈ।"
