anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = AnkiConnect ਐਡ-ਆਨ ਰਾਹੀਂ ਤੁਹਾਡੇ ਕੰਪਿਊਟਰ ਦੇ Anki ਦੇ ਬਕਾਇਆ ਕਾਰਡਾਂ ਦਾ ਅਭਿਆਸ ਕਰਾਉਂਦਾ ਹੈ ਅਤੇ ਤੁਹਾਡੇ ਜਵਾਬ ਵਾਪਸ ਭੇਜਦਾ ਹੈ।
anki.plugin.how = "Anki ਨਾਲ ਤੁਸੀਂ ਕੰਪਿਊਟਰ ਵਾਲੇ Anki ਦੇ ਬਕਾਇਆ ਕਾਰਡਾਂ ਦਾ ਰੀਡਰ 'ਤੇ ਅਭਿਆਸ ਕਰਦੇ ਹੋ, ਅਤੇ ਜਵਾਬ ਵਾਪਸ ਜਾਂਦੇ ਹਨ। ਇਹ ਮੁਫ਼ਤ ਐਡ-ਆਨ AnkiConnect (ਕੋਡ 2055492159) ਵਰਤਦਾ ਹੈ, AnkiWeb ਕਦੇ ਨਹੀਂ। ਸ਼ੁਰੂ ਵਿੱਚ ਇਹ ਬੰਦ ਹੈ: ਇਸ ਨੂੰ “ਪਲੱਗਇਨ ਸਟੋਰ” ਤੋਂ ਸ਼ਾਮਲ ਕਰੋ।\n\nਕੰਪਿਊਟਰ 'ਤੇ: Anki ਵਿੱਚ AnkiConnect ਸਥਾਪਤ ਕਰੋ (Tools, Add-ons, Get Add-ons) ਅਤੇ Anki ਮੁੜ-ਚਾਲੂ ਕਰੋ। ਸਿੰਕ ਦੌਰਾਨ Anki ਖੁੱਲ੍ਹਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ। ਆਮ ਤੌਰ 'ਤੇ AnkiConnect ਸਿਰਫ਼ ਆਪਣੇ ਕੰਪਿਊਟਰ (127.0.0.1) ਨੂੰ ਜਵਾਬ ਦਿੰਦਾ ਹੈ: Tools, Add-ons, AnkiConnect, Config ਵਿੱਚ \"webBindAddress\" ਨੂੰ \"0.0.0.0\" ਕਰੋ। ਪੋਰਟ (\"webBindPort\") 8765 ਹੈ। ਜੇ ਉੱਥੇ \"apiKey\" ਸੈੱਟ ਕਰੋ, ਤਾਂ ਉਹੀ ਕੁੰਜੀ ਇੱਥੇ ਦਾਖਲ ਕਰੋ। ਫਿਰ Anki ਮੁੜ-ਚਾਲੂ ਕਰੋ, ਅਤੇ ਪੁੱਛੇ ਜਾਣ 'ਤੇ ਫ਼ਾਇਰਵਾਲ ਵਿੱਚ ਇਜਾਜ਼ਤ ਦਿਓ। ਇਹ ਸਿਰਫ਼ ਭਰੋਸੇਯੋਗ ਨੈੱਟਵਰਕ 'ਤੇ ਵਰਤੋ; ਕੁੰਜੀ ਰੱਖਣਾ ਚੰਗਾ ਹੈ।\n\nਰੀਡਰ 'ਤੇ: “ਟੂਲ” ਤੋਂ Anki ਖੋਲ੍ਹੋ, “ਕੰਪਿਊਟਰ” ਵਿੱਚ ਉਸ ਦਾ ਪਤਾ (ਜਿਵੇਂ 192.168.1.20) ਅਤੇ ਲੋੜ ਹੋਵੇ ਤਾਂ ਪੋਰਟ ਅਤੇ API ਕੁੰਜੀ ਦਾਖਲ ਕਰੋ। ਕੋਈ “ਡੈੱਕ” ਚੁਣੋ, ਜਾਂ ਸਾਰੇ ਡੈੱਕਾਂ ਲਈ ਖਾਲੀ ਛੱਡੋ। Wi-Fi ਚਾਲੂ ਕਰ ਕੇ “Anki ਨਾਲ ਸਿੰਕ ਕਰੋ” ਚੁਣੋ: ਪਹਿਲਾਂ ਉਡੀਕਦੇ ਜਵਾਬ ਜਾਂਦੇ ਹਨ, ਫਿਰ ਬਕਾਇਆ ਕਾਰਡ (ਅਤੇ ਤੁਹਾਡੇ ਤੈਅ ਕੀਤੇ ਨਵੇਂ ਕਾਰਡ) ਆਉਂਦੇ ਹਨ, ਵੱਧ ਤੋਂ ਵੱਧ 50। “ਅਭਿਆਸ” ਨਾਲ ਬਿਨਾਂ ਨੈੱਟਵਰਕ ਉਹਨਾਂ ਨੂੰ ਦੁਹਰਾਓ: ਜਵਾਬ ਦਿਖਾਓ ਅਤੇ “ਦੁਬਾਰਾ”, “ਔਖਾ”, “ਵਧੀਆ” ਜਾਂ “ਸੌਖਾ” ਚੁਣੋ। ਜਵਾਬ ਰੀਡਰ 'ਤੇ ਰਹਿੰਦੇ ਹਨ ਅਤੇ ਅਗਲੇ ਸਿੰਕ ਨਾਲ Anki ਨੂੰ ਜਾਂਦੇ ਹਨ। ਕਾਰਡ ਕਦੋਂ ਵਾਪਸ ਆਵੇ, ਇਹ Anki ਤੈਅ ਕਰਦਾ ਹੈ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “Anki ਖੁੱਲ੍ਹਣ 'ਤੇ ਸਿੰਕ” ਹਰ ਵਾਰ ਸਕ੍ਰੀਨ ਖੋਲ੍ਹਣ 'ਤੇ ਸਿੰਕ ਕਰਦਾ ਹੈ। ਬਟਨ ਦਬਾਉਣ 'ਤੇ ਕੁਝ ਵੀ ਨੈੱਟਵਰਕ ਨਹੀਂ ਵਰਤਦਾ।"
