plugin-manager.code.other-build = PaperPaw ਦੇ ਕਿਸੇ ਹੋਰ ਪਲੱਗਇਨ ਇੰਟਰਫ਼ੇਸ ਲਈ ਬਣਿਆ: ਇਹ ਇਸ ਇੰਟਰਫ਼ੇਸ ਲਈ ਬਿਲਡ ਦੀ ਉਡੀਕ ਕਰਦਾ ਹੈ।
