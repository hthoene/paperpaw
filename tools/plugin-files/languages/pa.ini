profiles.plugin.name = ਪੜ੍ਹਨ ਪ੍ਰੋਫ਼ਾਈਲਾਂ
profiles.plugin.description = ਪੜ੍ਹਨ ਅਤੇ ਡਿਸਪਲੇ ਸੈਟਿੰਗਾਂ ਦੇ ਨਾਂ ਵਾਲੇ ਸੈੱਟ, ਇੱਕ ਟੈਪ ਨਾਲ ਬਦਲੇ ਜਾਂਦੇ ਹਨ।
profiles.plugin.how = "ਪ੍ਰੋਫ਼ਾਈਲ ਤੁਹਾਡੀਆਂ ਪੜ੍ਹਨ ਸੈਟਿੰਗਾਂ, ਡਿਸਪਲੇ ਸੈਟਿੰਗਾਂ ਅਤੇ ਸਥਿਤੀ ਪੱਟੀਆਂ ਨੂੰ ਇੱਕ ਨਾਂ ਹੇਠ ਰੱਖਦੀ ਹੈ, ਜਿਵੇਂ “ਰਾਤ” ਜਾਂ “ਵੱਡੇ ਅੱਖਰ”, ਅਤੇ ਇੱਕ ਟੈਪ ਨਾਲ ਵਾਪਸ ਲਿਆਉਂਦੀ ਹੈ।\n\n“ਪ੍ਰੋਫ਼ਾਈਲਾਂ” ਪੜ੍ਹਨ ਮੀਨੂ ਵਿੱਚ “ਹੋਰ” ਹੇਠਾਂ, ਜਾਂ “ਸੈਟਿੰਗਾਂ” ਵਿੱਚ “ਵਿਉਂਤਬੱਧ ਕਰੋ” ਹੇਠਾਂ ਖੋਲ੍ਹੋ। ਪ੍ਰੋਫ਼ਾਈਲ ਵਰਤਣ ਲਈ ਇਸ 'ਤੇ ਟੈਪ ਕਰੋ; ਵਰਤੋਂ ਵਾਲੀ ਚਿੰਨ੍ਹਿਤ ਹੁੰਦੀ ਹੈ। ਮੌਜੂਦਾ ਸੈਟਿੰਗਾਂ ਇਸ ਵਿੱਚ ਰੱਖਿਅਤ ਕਰਨ, ਨਾਂ ਬਦਲਣ ਜਾਂ ਹਟਾਉਣ ਲਈ ਇਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ: “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)। “ਨਵੀਂ ਪ੍ਰੋਫ਼ਾਈਲ ਵਜੋਂ ਰੱਖਿਅਤ ਕਰੋ” ਹੁਣ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਰੱਖਦਾ ਹੈ।\n\n“ਅਗਲੀ ਪ੍ਰੋਫ਼ਾਈਲ” ਸੂਚੀ ਦੀ ਅਗਲੀ ਪ੍ਰੋਫ਼ਾਈਲ 'ਤੇ ਜਾਂਦਾ ਹੈ; ਇਸ ਨੂੰ ਕਿਸੇ ਬਟਨ ਜਾਂ ਨਿਯਮ ਵਿੱਚ ਲਗਾਓ।"
