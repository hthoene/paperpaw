rules.plugin.name = ਨਿਯਮ
rules.plugin.description = ਕੁਝ ਹੋਣ 'ਤੇ ਕੁਝ ਕਰਦਾ ਹੈ: ਜਿਵੇਂ 22:00 ਵਜੇ ਨਾਈਟ ਮੋਡ।
rules.plugin.how = "ਨਿਯਮ ਕੁਝ ਹੋਣ 'ਤੇ ਆਪਣੇ-ਆਪ ਕੁਝ ਕਰਦਾ ਹੈ: ਹਰ ਰੋਜ਼ 22:00 ਵਜੇ ਨਾਈਟ ਮੋਡ ਚਾਲੂ, ਜਾਂ PaperPaw ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਕੈਟਾਲਾਗ ਸਿੰਕ।\n\nਨਿਯਮ ਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਵਿਉਂਤਬੱਧ ਕਰੋ” ਹੇਠਾਂ “ਨਿਯਮ” ਵਜੋਂ ਹਨ। “ਨਿਯਮ ਸ਼ਾਮਲ ਕਰੋ” ਪੁੱਛਦਾ ਹੈ “ਕਦੋਂ?” (PaperPaw ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ, ਦਿਨ ਦਾ ਕੋਈ ਸਮਾਂ, ਕਿਤਾਬ ਖੁੱਲ੍ਹਣ ਜਾਂ ਬੰਦ ਹੋਣ 'ਤੇ, ਬੈਟਰੀ, ਚਾਰਜਿੰਗ, ਕੋਈ ਸਵਿੱਚ ਅਤੇ ਹੋਰ) ਅਤੇ “ਫਿਰ ਕੀ?” (ਕਾਰਵਾਈ ਚਲਾਓ, ਸਵਿੱਚ ਚਾਲੂ ਜਾਂ ਬੰਦ ਕਰੋ, ਸੰਖਿਆ ਸੈੱਟ ਕਰੋ, ਸੁਨੇਹਾ ਦਿਖਾਓ)। ਨਿਯਮ ਰੋਕਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ; “ਦੋ ਸਮਿਆਂ ਵਿਚਕਾਰ” ਵਰਗੀ ਸ਼ਰਤ ਲਈ ਜਾਂ ਹਟਾਉਣ ਲਈ ਉਸ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ)।\n\nਚੁਣਨ ਲਈ ਕਾਰਵਾਈਆਂ, ਸਵਿੱਚ ਅਤੇ ਸੰਖਿਆਵਾਂ ਪਲੱਗਇਨ ਮੁਤਾਬਕ ਹਨ: ਪਹਿਲਾਂ ਪਲੱਗਇਨ ਚੁਣੋ, ਫਿਰ ਜੋ ਉਹ ਦਿੰਦਾ ਹੈ; “ਵਾਪਸ” ਫਿਰ ਬਾਹਰ ਲੈ ਜਾਂਦਾ ਹੈ। ਦਿਖ ਰਹੀ ਸਕ੍ਰੀਨ 'ਤੇ ਕੰਮ ਕਰਨ ਵਾਲੀ ਕਾਰਵਾਈ, ਜਿਵੇਂ “ਵਾਪਸ” ਜਾਂ “ਅਗਲਾ ਪੰਨਾ”, ਉਹੀ ਕਰਦੀ ਹੈ ਜੋ ਉੱਥੇ ਦਬਾਉਣ 'ਤੇ ਹੁੰਦਾ।\n\nਸਮੇਂ ਹਰ ਸਕ੍ਰੀਨ 'ਤੇ ਲਾਗੂ ਹੁੰਦੇ ਹਨ। ਇੱਕ-ਦੂਜੇ ਨੂੰ ਉਲਟਾਉਣ ਵਾਲੇ ਦੋ ਨਿਯਮ ਕੁਝ ਕਦਮਾਂ ਬਾਅਦ ਰੁਕ ਜਾਂਦੇ ਹਨ।"
