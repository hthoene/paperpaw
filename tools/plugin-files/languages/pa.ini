translate.plugin.description = ਚੁਣੇ ਟੈਕਸਟ ਦਾ DeepL ਨਾਲ ਆਨਲਾਈਨ ਅਨੁਵਾਦ ਕਰਦਾ ਹੈ।
translate.plugin.how = "“ਅਨੁਵਾਦ” ਚੁਣੇ ਟੈਕਸਟ ਦਾ DeepL ਨਾਲ ਆਨਲਾਈਨ ਅਨੁਵਾਦ ਕਰਦਾ ਹੈ। ਕਿਤਾਬ ਵਿੱਚ ਟੈਕਸਟ ਚੁਣੋ ਅਤੇ ਚੁਣੇ ਟੈਕਸਟ ਦੇ ਮੀਨੂ ਵਿੱਚ “ਅਨੁਵਾਦ ਕਰੋ” ਚੁਣੋ: ਅਨੁਵਾਦ ਸ਼ਬਦਕੋਸ਼ ਦੀ ਐਂਟਰੀ ਵਾਂਗ ਪੰਨੇ ਉੱਤੇ ਦਿਖਦਾ ਹੈ। ਪੰਨਾ ਬਟਨ ਜਾਂ ਟੈਪ ਇਸ ਨੂੰ ਸਕ੍ਰੋਲ ਕਰਦੇ ਹਨ, ਅਤੇ “ਚੁਣੋ” ਜਾਂ ਇਸ ਦੇ ਅੰਤ 'ਤੇ ਟੈਪ ਇਸ ਨੂੰ ਬੰਦ ਕਰਦਾ ਹੈ।\n\nਇਸ ਲਈ ਨੈੱਟਵਰਕ ਅਤੇ ਤੁਹਾਡੀ ਆਪਣੀ DeepL API ਕੁੰਜੀ ਚਾਹੀਦੀ ਹੈ, ਜੋ deepl.com 'ਤੇ ਮੁਫ਼ਤ ਹੈ (DeepL API Free, ਲਗਭਗ 500,000 ਅੱਖਰ ਪ੍ਰਤੀ ਮਹੀਨਾ)। ਜਦੋਂ ਤੱਕ ਤੁਸੀਂ ਇਹ ਨਹੀਂ ਦਿੰਦੇ, ਪੈਨਲ ਇਹ ਦੱਸਦਾ ਹੈ, ਅਤੇ ਟੈਪ ਕਰਨ 'ਤੇ ਇਹ ਮੰਗਦਾ ਹੈ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਪੜ੍ਹਨਾ” ਹੇਠ, “ਅਨੁਵਾਦ” ਭਾਗ ਵਿੱਚ, “ਇਸ ਵਿੱਚ ਅਨੁਵਾਦ ਕਰੋ” ਭਾਸ਼ਾ ਤੈਅ ਕਰਦਾ ਹੈ; ਸ਼ੁਰੂ ਵਿੱਚ ਇਹ PaperPaw ਦੀ ਆਪਣੀ ਭਾਸ਼ਾ ਹੁੰਦੀ ਹੈ।"
