read-later-cloud.from.help = Readwise Reader ਵਿੱਚ ਲੇਖ ਕਿੱਥੋਂ ਲਏ ਜਾਣ: ਜੋ ਤੁਸੀਂ “Later” ਲਈ ਰੱਖੇ, ਜਾਂ ਜੋ ਤੁਹਾਡੇ “Inbox” ਵਿੱਚ ਹਨ।
read-later-cloud.help = ਆਪਣਾ ਪਹੁੰਚ ਟੋਕਨ ਦਾਖਲ ਕਰੋ (readwise.io/access_token)। ਲੇਖ “Reader” ਫ਼ੋਲਡਰ ਵਿੱਚ ਕਿਤਾਬਾਂ ਵਜੋਂ ਆਉਂਦੇ ਹਨ, ਤਸਵੀਰਾਂ ਤੋਂ ਬਿਨਾਂ; ਅੰਤ ਤੱਕ ਪੜ੍ਹੇ ਲੇਖ ਅਗਲੀ ਵਾਰ ਪ੍ਰਾਪਤ ਕਰਨ 'ਤੇ ਆਰਕਾਈਵ ਹੋ ਜਾਂਦੇ ਹਨ।
