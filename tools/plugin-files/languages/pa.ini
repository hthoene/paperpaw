joplin.plugin.name = ਕਿਤਾਬ ਨੋਟ ਸਿੰਕ
joplin.plugin.description = ਹਰ ਕਿਤਾਬ ਦੀਆਂ ਹਾਈਲਾਈਟਾਂ ਅਤੇ ਨੋਟ ਇੱਕ ਨੋਟ ਵਿੱਚ ਰੱਖਦਾ ਹੈ। Joplin (Joplin Cloud, Joplin Server ਜਾਂ WebDAV) ਨਾਲ ਕੰਮ ਕਰਦਾ ਹੈ।
joplin.title = ਕਿਤਾਬ ਨੋਟ ਸਿੰਕ
joplin.send = Joplin ਨੂੰ ਭੇਜੋ
joplin.send.help = ਐਕਸਪੋਰਟ ਕੀਤੇ ਨੋਟ ਤੁਰੰਤ ਭੇਜੇ ਜਾਂਦੇ ਹਨ। ਜੋ ਨੋਟ ਭੇਜੇ ਨਹੀਂ ਜਾ ਸਕੇ, ਉਹ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਅਗਲੇ ਐਕਸਪੋਰਟ ਨਾਲ, ਇਸ ਨਾਲ, ਜਾਂ ਕਿਸੇ ਨਿਯਮ ਨਾਲ ਜਾਂਦੇ ਹਨ।
joplin.service = ਇਸ ਨਾਲ ਸਿੰਕ
joplin.service.help = Joplin ਕਿਸ ਨਾਲ ਸਿੰਕ ਕਰਦਾ ਹੈ, ਜਿਵੇਂ Joplin ਵਿੱਚ ਸੈੱਟ ਹੈ: Joplin Cloud, ਤੁਹਾਡਾ ਆਪਣਾ Joplin Server, ਜਾਂ Nextcloud ਵਰਗਾ WebDAV ਫ਼ੋਲਡਰ। ਕਿਸੇ ਕੰਪਿਊਟਰ ਦਾ ਚਾਲੂ ਹੋਣਾ ਜ਼ਰੂਰੀ ਨਹੀਂ।
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = ਪਤਾ
joplin.address.help = Joplin Server: ਉਸ ਦਾ ਪਤਾ, ਜਿਵੇਂ joplin.example.org। WebDAV: ਉਹ ਫ਼ੋਲਡਰ ਜਿਸ ਨਾਲ Joplin ਸਿੰਕ ਕਰਦਾ ਹੈ, ਜਿਵੇਂ ਉਸ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਵਿੱਚ ਹੈ, ਜਿਵੇਂ dav.example.org/Joplin।
joplin.email = ਈਮੇਲ
joplin.user = ਵਰਤੋਂਕਾਰ ਨਾਂ
joplin.user.help = Joplin Cloud ਅਤੇ Joplin Server: ਉਹ ਈਮੇਲ ਜਿਸ ਨਾਲ ਤੁਸੀਂ ਸਾਈਨ ਇਨ ਕਰਦੇ ਹੋ (ਦੋ-ਪੜਾਵੀ ਸਾਈਨ-ਇਨ ਹਾਲੇ ਵਰਤਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ)। WebDAV: ਫ਼ੋਲਡਰ ਦਾ ਵਰਤੋਂਕਾਰ ਨਾਂ।
joplin.password = ਪਾਸਵਰਡ
joplin.password.help = ਇਸ ਡੀਵਾਈਸ 'ਤੇ ਹੋਰ ਪਾਸਵਰਡਾਂ ਅਤੇ ਕੁੰਜੀਆਂ ਨਾਲ ਰੱਖਿਆ ਜਾਂਦਾ ਹੈ। Nextcloud ਲਈ ਐਪ ਪਾਸਵਰਡ ਵੀ ਚੱਲਦਾ ਹੈ।
joplin.secret = Joplin ਪਾਸਵਰਡ
joplin.not-kept = ਪਾਸਵਰਡ ਇਸ ਡੀਵਾਈਸ 'ਤੇ ਰੱਖਿਆ ਨਹੀਂ ਜਾ ਸਕਿਆ।
joplin.notebook = ਨੋਟਬੁੱਕ
joplin.notebook.help = ਉਹ ਨੋਟਬੁੱਕ ਜੋ PaperPaw Joplin ਵਿੱਚ ਬਣਾਉਂਦਾ ਹੈ, ਹਰ ਕਿਤਾਬ ਲਈ ਇੱਕ ਨੋਟ ਨਾਲ। ਦੁਬਾਰਾ ਐਕਸਪੋਰਟ ਕਰਨ ਨਾਲ ਨੋਟ ਅੱਪਡੇਟ ਹੁੰਦਾ ਹੈ, ਕਿਸੇ ਹੋਰ ਨੋਟਬੁੱਕ ਵਿੱਚ ਭੇਜਿਆ ਨੋਟ ਵੀ।
joplin.idle = ਐਕਸਪੋਰਟ ਕੀਤੇ ਨੋਟ ਤੁਰੰਤ Joplin ਨੂੰ ਭੇਜੇ ਜਾਂਦੇ ਹਨ।
joplin.waiting.one = {count} ਕਿਤਾਬ ਦੇ ਨੋਟ ਭੇਜੇ ਜਾਣ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹਨ।
joplin.waiting.other = {count} ਕਿਤਾਬਾਂ ਦੇ ਨੋਟ ਭੇਜੇ ਜਾਣ ਦੀ ਉਡੀਕ ਵਿੱਚ ਹਨ।
joplin.sent.one = {count} ਕਿਤਾਬ ਦੇ ਨੋਟ Joplin ਵਿੱਚ ਹਨ।
joplin.sent.other = {count} ਕਿਤਾਬਾਂ ਦੇ ਨੋਟ Joplin ਵਿੱਚ ਹਨ।
joplin.some-failed = Joplin ਨੂੰ ਭੇਜੇ: {sent}। ਨਹੀਂ ਭੇਜੇ: {failed}; ਇਹ ਬਾਅਦ ਵਿੱਚ ਮੁੜ ਭੇਜੇ ਜਾਣਗੇ।
joplin.apart.one = Joplin ਵਿੱਚ {count} ਨੋਟ ਬਦਲਿਆ ਗਿਆ ਸੀ, ਇਸ ਲਈ ਉਸ ਦੇ ਨਾਲ ਇੱਕ ਨਵਾਂ ਬਣਾਇਆ ਗਿਆ।
joplin.apart.other = Joplin ਵਿੱਚ {count} ਨੋਟ ਬਦਲੇ ਗਏ ਸਨ, ਇਸ ਲਈ ਉਹਨਾਂ ਦੇ ਨਾਲ ਨਵੇਂ ਬਣਾਏ ਗਏ।
joplin.nothing = ਕੋਈ ਨੋਟ Joplin ਨੂੰ ਭੇਜੇ ਜਾਣ ਦੀ ਉਡੀਕ ਵਿੱਚ ਨਹੀਂ।
joplin.no-network = Joplin ਨੂੰ ਭੇਜਣ ਲਈ ਨੈੱਟਵਰਕ ਚਾਹੀਦਾ ਹੈ। ਨੋਟ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਭੇਜੇ ਜਾਣਗੇ।
joplin.setup-needed = ਪਹਿਲਾਂ Joplin ਸੈੱਟ ਕਰੋ: ਇਹ ਕਿਸ ਨਾਲ ਸਿੰਕ ਕਰਦਾ ਹੈ, ਤੁਹਾਡਾ ਖਾਤਾ ਅਤੇ ਪਾਸਵਰਡ।
joplin.no-time = ਸਮਾਂ ਹਾਲੇ ਪਤਾ ਨਹੀਂ। ਨੋਟ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਭੇਜੇ ਜਾਣਗੇ।
joplin.unreachable = Joplin ਤੱਕ ਪਹੁੰਚ ਨਹੀਂ ਹੋ ਸਕਦੀ। ਨੋਟ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਭੇਜੇ ਜਾਣਗੇ।
joplin.failed = Joplin ਨੇ ਗੜਬੜ ਨਾਲ ਜਵਾਬ ਦਿੱਤਾ ({status})। ਨੋਟ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਭੇਜੇ ਜਾਣਗੇ।
joplin.bad-login = Joplin ਨੇ ਈਮੇਲ, ਵਰਤੋਂਕਾਰ ਨਾਂ ਜਾਂ ਪਾਸਵਰਡ ਸਵੀਕਾਰ ਨਹੀਂ ਕੀਤਾ। Joplin ਦੇ ਸੈੱਟਅੱਪ ਵਿੱਚ ਇਹਨਾਂ ਦੀ ਜਾਂਚ ਕਰੋ।
joplin.no-server = ਇਸ ਪਤੇ 'ਤੇ ਕੋਈ Joplin Server ਨਹੀਂ ਹੈ। Joplin ਦੇ ਸੈੱਟਅੱਪ ਵਿੱਚ ਇਸ ਦੀ ਜਾਂਚ ਕਰੋ।
joplin.bad-address = ਇਹ ਪਤਾ PaperPaw ਵਰਤ ਨਹੀਂ ਸਕਦਾ। Joplin ਦੇ ਸੈੱਟਅੱਪ ਵਿੱਚ ਇਸ ਦੀ ਜਾਂਚ ਕਰੋ।
joplin.no-data = ਇਸ ਪਤੇ 'ਤੇ ਕੋਈ Joplin ਨੋਟ ਨਹੀਂ ਹਨ। ਇਸ ਦੀ ਜਾਂਚ ਕਰੋ, ਜਾਂ ਪਹਿਲਾਂ Joplin ਨੂੰ ਇਸ ਨਾਲ ਸਿੰਕ ਕਰੋ।
joplin.encrypted = Joplin ਦੀ ਐਂਡ-ਟੂ-ਐਂਡ ਇਨਕ੍ਰਿਪਸ਼ਨ ਚਾਲੂ ਹੈ। PaperPaw ਨੋਟ ਇਨਕ੍ਰਿਪਟ ਨਹੀਂ ਕਰ ਸਕਦਾ, ਇਸ ਲਈ ਕੋਈ ਨਹੀਂ ਭੇਜਦਾ।
joplin.newer-target = Joplin ਉੱਥੇ ਨੋਟ ਅਜਿਹੇ ਨਵੇਂ ਫ਼ਾਰਮੈਟ ਵਿੱਚ ਰੱਖਦਾ ਹੈ ਜੋ ਇਹ PaperPaw ਨਹੀਂ ਜਾਣਦਾ। ਇਹਨਾਂ ਨੂੰ ਭੇਜਣ ਲਈ PaperPaw ਅੱਪਡੇਟ ਕਰੋ।
joplin.older-target = Joplin ਉੱਥੇ ਨੋਟ ਪੁਰਾਣੇ ਫ਼ਾਰਮੈਟ ਵਿੱਚ ਰੱਖਦਾ ਹੈ। ਇਸ ਨੂੰ ਅੱਪਗ੍ਰੇਡ ਕਰਨ ਲਈ Joplin ਖੋਲ੍ਹੋ, ਫਿਰ ਦੁਬਾਰਾ ਭੇਜੋ।
joplin.upgrading = Joplin ਇਸ ਵੇਲੇ ਉੱਥੇ ਨੋਟ ਅੱਪਗ੍ਰੇਡ ਕਰ ਰਿਹਾ ਹੈ। ਨੋਟ ਉਡੀਕਦੇ ਹਨ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਭੇਜੇ ਜਾਣਗੇ।
joplin.no-memory = ਨੋਟ ਭੇਜਣ ਲਈ ਲੋੜੀਂਦੀ ਮੈਮਰੀ ਨਹੀਂ। ਮੁੜ-ਚਾਲੂ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।
keyboard.plugin.name = ਕੀਬੋਰਡ
keyboard.plugin.description = ਸਕ੍ਰੀਨ 'ਤੇ ਟੈਕਸਟ ਲਿਖਦਾ ਹੈ, ਟੱਚ ਨਾਲ ਜਾਂ ਬਟਨਾਂ ਨਾਲ।
keyboard.plugin.how = "ਜਦੋਂ ਵੀ ਟੈਕਸਟ ਚਾਹੀਦਾ ਹੈ, ਕੀਬੋਰਡ ਖੁੱਲ੍ਹਦਾ ਹੈ: ਖੋਜ, ਪਾਸਵਰਡ, ਨੋਟ ਜਾਂ ਸੈਟਿੰਗ ਲਈ। ਇਹ ਟੱਚ ਨਾਲ ਅਤੇ ਸਿਰਫ਼ ਬਟਨਾਂ ਨਾਲ ਵੀ ਚੱਲਦਾ ਹੈ।\n\nਬਟਨਾਂ ਨਾਲ: ਖੱਬੇ/ਸੱਜੇ ਕਤਾਰ ਵਿੱਚ ਘੁੰਮਦੇ ਹਨ, ਪੰਨਾ ਬਟਨ ਕਤਾਰਾਂ ਬਦਲਦੇ ਹਨ, ਉੱਪਰ/ਹੇਠਾਂ ਤੁਹਾਡਾ ਕਾਲਮ ਰੱਖਦੇ ਹਨ, “ਚੁਣੋ” ਕੁੰਜੀ ਦਬਾਉਂਦਾ ਹੈ ਅਤੇ “ਵਾਪਸ” ਰੱਦ ਕਰਦਾ ਹੈ। Shift ਅਗਲਾ ਅੱਖਰ ਵੱਡਾ ਕਰਦਾ ਹੈ; ਸਾਰੇ ਵੱਡੇ ਅੱਖਰਾਂ ਲਈ ਦੋ ਵਾਰ ਦਬਾਓ, ਬੰਦ ਕਰਨ ਲਈ ਇੱਕ ਵਾਰ ਹੋਰ। ਕਿਸੇ ਅੱਖਰ ਨੂੰ ਦਬਾਈ ਰੱਖੋ (ਬਟਨਾਂ ਨਾਲ: ਉਸ 'ਤੇ “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ) ਤਾਂ ਉਸ ਦਾ ਵੱਡਾ ਰੂਪ ਤੁਰੰਤ ਚੁਣਿਆ ਜਾਂਦਾ ਹੈ, ਅਤੇ é, è ਵਰਗੇ ਚਿੰਨ੍ਹ ਮਿਲਦੇ ਹਨ; ਜਰਮਨ ਵਿੱਚ ä, ö, ü, ß ਇਸੇ ਤਰ੍ਹਾਂ a, o, u, s ਤੋਂ ਆਉਂਦੇ ਹਨ (ਬਟਨਾਂ ਨਾਲ ਕੀਬੋਰਡ ਉਹਨਾਂ ਅੱਖਰਾਂ 'ਤੇ ਇਹ ਦੱਸਦਾ ਹੈ)। “ਠੀਕ ਹੈ” ਲਿਖਣਾ ਪੂਰਾ ਕਰਦਾ ਹੈ; ਬਟਨਾਂ ਨਾਲ ਕਿਤੋਂ ਵੀ ਪੂਰਾ ਕਰਨ ਲਈ “ਵਾਪਸ” ਦਬਾਈ ਰੱਖੋ (ਸਿਰਫ਼ “ਵਾਪਸ” ਰੱਦ ਕਰਦਾ ਹੈ), ਜਾਂ ਅੱਖਰ ਤੋਂ ਬਿਨਾਂ ਕਿਸੇ ਕੁੰਜੀ 'ਤੇ “ਚੁਣੋ” ਦਬਾਈ ਰੱਖੋ। “ਪੇਸਟ ਕਰੋ” ਕਲਿੱਪਬੋਰਡ ਦਾ ਟੈਕਸਟ ਪਾਉਂਦਾ ਹੈ, ਅਤੇ “ਫ਼ੋਨ” (ਜਿੱਥੇ ਹੋਵੇ) ਨਾਲ ਤੁਸੀਂ ਫ਼ੋਨ 'ਤੇ ਲਿਖ ਸਕਦੇ ਹੋ।\n\nਸੈਟਿੰਗਾਂ ਵਿੱਚ “ਡੀਵਾਈਸ” › “ਕੀਬੋਰਡ”: “ਕੀਬੋਰਡ ਲੇਆਉਟ” ਲੇਆਉਟ ਚੁਣਦਾ ਹੈ (ਮਿਆਰੀ: ਮੀਨੂ ਦੀ ਭਾਸ਼ਾ; ਕਈ ਹੋਣ ਤਾਂ ਇੱਕ ਕੁੰਜੀ ਬਦਲਦੀ ਹੈ)। “ਉਮਲਾਉਟ ਕੁੰਜੀਆਂ” ä, ö, ü, ß ਦੀਆਂ ਆਪਣੀਆਂ ਕੁੰਜੀਆਂ ਦਿੰਦਾ ਹੈ। “ਆਕਾਰ” ਕੁੰਜੀਆਂ ਅਤੇ ਅੱਖਰ ਵੱਡੇ ਕਰਦਾ ਹੈ; ਸਿਰਫ਼ ਬਟਨਾਂ ਨਾਲ ਕਤਾਰਾਂ ਕੰਪਿਊਟਰ ਕੀਬੋਰਡ ਵਾਲੀਆਂ ਹੀ ਰਹਿੰਦੀਆਂ ਹਨ। ਟੱਚ ਸਕ੍ਰੀਨਾਂ 'ਤੇ “ਕੁੰਜੀ ਦੀ ਸ਼ਕਲ” ਦਿੱਖ ਬਦਲਦਾ ਹੈ। “ਸਵੈਚਲਿਤ ਵੱਡੇ ਅੱਖਰ” ਹਰ ਵਾਕ ਵੱਡੇ ਅੱਖਰ ਨਾਲ ਸ਼ੁਰੂ ਕਰਦਾ ਹੈ।"
