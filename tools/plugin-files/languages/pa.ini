end-of-book.plugin.how = ਕਿਤਾਬ ਦੇ ਆਖਰੀ ਪੰਨੇ 'ਤੇ ਪਹੁੰਚਣ 'ਤੇ ਇੱਕ ਸਕ੍ਰੀਨ ਉਸ ਦੀ ਲੜੀ ਦੀ ਅਗਲੀ ਕਿਤਾਬ (ਜਾਂ ਲਾਇਬ੍ਰੇਰੀ) ਪੇਸ਼ ਕਰਦੀ ਹੈ, ਤੁਹਾਨੂੰ ਕਿਤਾਬ ਨੂੰ ਇੱਕ ਤੋਂ ਪੰਜ ਤਾਰੇ ਦੇਣ ਦਿੰਦੀ ਹੈ, ਅਤੇ ਦਿਖਾਉਂਦੀ ਹੈ ਕਿ ਕੀ ਇਹ ਪੂਰੀ ਪੜ੍ਹੀ ਵਜੋਂ ਨਿਸ਼ਾਨਬੱਧ ਹੈ। ਆਖਰੀ ਪੰਨੇ 'ਤੇ ਵਾਪਸ ਜਾਣ ਲਈ “ਵਾਪਸ” ਦਬਾਓ।
