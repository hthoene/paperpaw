notes-overview.plugin.description = ਸਾਰੀਆਂ ਕਿਤਾਬਾਂ ਦੇ ਬੁੱਕਮਾਰਕ ਅਤੇ ਹਾਈਲਾਈਟਾਂ ਇੱਕ ਸੂਚੀ ਵਿੱਚ, ਅਤੇ My Clippings.txt ਵਜੋਂ ਐਕਸਪੋਰਟ।
notes-overview.plugin.how = "“ਸਾਰੇ ਨੋਟ” ਹਰ ਉਸ ਕਿਤਾਬ ਦੀ ਸੂਚੀ ਦਿਖਾਉਂਦਾ ਹੈ ਜਿਸ ਵਿੱਚ ਤੁਸੀਂ ਬੁੱਕਮਾਰਕ ਜਾਂ ਹਾਈਲਾਈਟ ਬਣਾਈ ਹੈ, ਗਿਣਤੀ ਸਮੇਤ। ਇਸ ਨੂੰ ਟੂਲ ਵਿੱਚ ਖੋਲ੍ਹੋ। ਕਿਸੇ ਕਿਤਾਬ ਦੇ ਨੋਟ ਦੇਖਣ ਲਈ ਕਿਤਾਬ ਚੁਣੋ, ਅਤੇ ਕਿਤਾਬ ਨੂੰ ਉਸ ਥਾਂ 'ਤੇ ਖੋਲ੍ਹਣ ਲਈ ਨੋਟ ਚੁਣੋ।\n\nਸੂਚੀ ਦੇ ਅੰਤ ਵਿੱਚ “My Clippings.txt ਵਜੋਂ ਐਕਸਪੋਰਟ ਕਰੋ” ਸਾਰੇ ਨੋਟ ਇੱਕ ਫ਼ਾਈਲ ਵਿੱਚ ਲਿਖਦਾ ਹੈ, ਲਾਇਬ੍ਰੇਰੀ ਦੇ ਨਾਲ ਵਾਲੇ Exports ਫ਼ੋਲਡਰ ਵਿੱਚ, Kindle ਵਾਲੇ ਰੂਪ ਵਿੱਚ (UTF-8)। ਜੋ ਐਪਾਂ Kindle ਦੀ My Clippings.txt ਪੜ੍ਹਦੀਆਂ ਹਨ, ਉਹ ਇਸ ਨੂੰ ਪੜ੍ਹ ਸਕਦੀਆਂ ਹਨ। ਹਾਈਲਾਈਟ 'ਤੇ ਲਿਖਿਆ ਨੋਟ Kindle ਵਾਂਗ ਆਪਣੀ ਵੱਖਰੀ ਐਂਟਰੀ ਹੁੰਦਾ ਹੈ। ਕਿਉਂਕਿ ਇੱਥੇ ਕਿਤਾਬ ਵਿੱਚ Kindle ਲੋਕੇਸ਼ਨਾਂ ਨਹੀਂ ਹੁੰਦੀਆਂ, “location” ਦੱਸਦਾ ਹੈ ਕਿ ਨੋਟ ਕਿਤਾਬ ਵਿੱਚ ਕਿੰਨੇ ਪ੍ਰਤੀਸ਼ਤ 'ਤੇ ਹੈ। ਫ਼ਾਈਲ ਹਰ ਵਾਰ ਨਵੀਂ ਲਿਖੀ ਜਾਂਦੀ ਹੈ ਅਤੇ ਪਿਛਲੀ ਦੀ ਥਾਂ ਲੈਂਦੀ ਹੈ।"
