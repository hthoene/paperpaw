settings.plugin.description = ਸੈਟਿੰਗਾਂ ਦੇ ਪੰਨੇ, ਹਰ ਪਲੱਗਇਨ ਦੀਆਂ ਸੈਟਿੰਗਾਂ ਤੋਂ ਬਣੇ।
settings.plugin.how = "“ਸੈਟਿੰਗਾਂ” PaperPaw ਅਤੇ ਉਸ ਦੇ ਪਲੱਗਇਨਾਂ ਵਿੱਚ ਸੈੱਟ ਕੀਤੀ ਜਾ ਸਕਣ ਵਾਲੀ ਹਰ ਚੀਜ਼ ਪੰਨਿਆਂ ਵਿੱਚ ਦਿਖਾਉਂਦਾ ਹੈ। ਪਲੱਗਇਨਾਂ ਨੂੰ ਆਪਣੀ ਸਕ੍ਰੀਨ ਦੀ ਲੋੜ ਨਹੀਂ: ਜੋ ਉਹ ਦੱਸਦੇ ਹਨ ਉਹ ਇੱਥੇ ਸਮੂਹਾਂ ਵਿੱਚ ਦਿਸਦਾ ਹੈ, ਹਰ ਸੈਟਿੰਗ ਦੇ ਹੇਠਾਂ ਉਸ ਦੇ ਵੇਰਵੇ ਨਾਲ।\n\nਇਸ ਨੂੰ ਮੀਨੂ ਵਿੱਚ “ਸੈਟਿੰਗਾਂ” ਨਾਲ ਖੋਲ੍ਹੋ। ਸਮੂਹ ਖੋਲ੍ਹਣ ਲਈ ਉਸ 'ਤੇ ਟੈਪ ਕਰੋ, ਫਿਰ ਕਿਸੇ ਸੈਟਿੰਗ 'ਤੇ ਉਸ ਨੂੰ ਬਦਲਣ ਜਾਂ ਚੁਣਨ ਲਈ; ਸੰਖਿਆਵਾਂ ਦੇ − ਅਤੇ + ਬਟਨ ਹਨ। ਬਟਨਾਂ ਨਾਲ ਕਿਸੇ ਸੈਟਿੰਗ 'ਤੇ ਜਾਓ ਅਤੇ “ਚੁਣੋ” ਦਬਾਓ: ਖੱਬੇ ਅਤੇ ਸੱਜੇ ਸੰਖਿਆ ਬਦਲਦੇ ਹਨ, “ਚੁਣੋ” ਉਸ ਨੂੰ ਰੱਖਦਾ ਹੈ, “ਵਾਪਸ” ਪਹਿਲਾ ਮੁੱਲ ਵਾਪਸ ਲਿਆਉਂਦਾ ਹੈ।\n\nਤਬਦੀਲੀਆਂ ਤੁਰੰਤ ਲਾਗੂ ਹੁੰਦੀਆਂ ਹਨ। “ਖੋਜੋ” ਸ਼ਬਦਾਂ ਨਾਲ ਸੈਟਿੰਗ ਲੱਭਦਾ ਹੈ ਅਤੇ “ਉੱਨਤ ਸੈਟਿੰਗਾਂ” ਘੱਟ ਲੋੜੀਂਦੀਆਂ ਸੈਟਿੰਗਾਂ ਵੀ ਦਿਖਾਉਂਦਾ ਹੈ। “ਮਿਆਰੀ 'ਤੇ ਰੀਸੈੱਟ ਕਰੋ” ਅਤੇ “ਸਭ ਰੀਸੈੱਟ ਕਰੋ” ਪਹਿਲਾਂ ਪੁੱਛਦੇ ਹਨ।"
