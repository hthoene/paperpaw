wifi.plugin.name = Wi-Fi
wifi.plugin.description = ਲੋੜ ਪੈਣ 'ਤੇ Wi-Fi ਨੈੱਟਵਰਕਾਂ ਨਾਲ ਜੁੜਦਾ ਹੈ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਰੇਡੀਓ ਬੰਦ ਕਰ ਦਿੰਦਾ ਹੈ।
wifi.plugin.how = "ਜਦੋਂ ਕਿਸੇ ਪਲੱਗਇਨ ਨੂੰ ਇੰਟਰਨੈੱਟ ਚਾਹੀਦਾ ਹੈ (ਕੈਟਾਲਾਗ, ਸਿੰਕ, ਸਟੋਰ, ਟ੍ਰਾਂਸਫ਼ਰ), Wi-Fi ਨੈੱਟਵਰਕ ਨਾਲ ਜੁੜਦਾ ਹੈ ਅਤੇ ਵਰਤੋਂ ਖਤਮ ਹੋਣ ਤੋਂ ਇੱਕ ਮਿੰਟ ਬਾਅਦ, ਜਾਂ ਹੋਮ ਜਾਂ ਕਿਤਾਬ ਦਿਸਦੇ ਹੀ, ਰੇਡੀਓ ਬੰਦ ਕਰ ਦਿੰਦਾ ਹੈ, ਤਾਂ ਜੋ ਬੈਟਰੀ ਅਤੇ ਮੈਮਰੀ ਬਚੇ।\n\nWi-Fi ਨੂੰ ਸੈਟਿੰਗਾਂ ਤੋਂ, ਜਾਂ ਸਥਿਤੀ ਪੱਟੀ ਦੀ Wi-Fi ਆਈਟਮ ਤੋਂ ਖੋਲ੍ਹੋ। “ਨੈੱਟਵਰਕ” ਪਹੁੰਚ ਵਿਚਲੇ ਨੈੱਟਵਰਕ ਦਿਖਾਉਂਦਾ ਹੈ; ਇੱਕ ਚੁਣੋ ਅਤੇ ਉਸ ਦਾ ਪਾਸਵਰਡ ਲਿਖੋ, ਜਾਂ “ਫ਼ੋਨ ਨਾਲ ਸੈੱਟ ਅੱਪ ਕਰੋ” ਚੁਣੋ ਅਤੇ ਨਾਂ ਅਤੇ ਪਾਸਵਰਡ ਡੀਵਾਈਸ ਦੀ ਥਾਂ ਆਪਣੇ ਫ਼ੋਨ ਦੇ ਬ੍ਰਾਊਜ਼ਰ ਵਿੱਚ ਲਿਖੋ। “ਭੁੱਲ ਜਾਓ” ਰੱਖਿਅਤ ਨੈੱਟਵਰਕ ਹਟਾਉਂਦਾ ਹੈ।\n\nਪਾਸਵਰਡ ਕਾਰਡ 'ਤੇ ਸੁਰੱਖਿਅਤ ਰੱਖੇ ਜਾਂਦੇ ਹਨ ਅਤੇ ਦੁਬਾਰਾ ਕਦੇ ਨਹੀਂ ਦਿਖਾਏ ਜਾਂਦੇ। “ਲੋੜ ਪੈਣ 'ਤੇ ਜੁੜੋ” ਵਿੱਚ ਤੁਸੀਂ ਤੈਅ ਕਰਦੇ ਹੋ ਕਿ ਆਖਰੀ ਵਰਤੋਂ ਤੋਂ ਬਾਅਦ Wi-Fi ਕਿੰਨੀ ਦੇਰ ਚਾਲੂ ਰਹੇ, ਕੀ ਚਾਰਜ ਹੋਣ ਦੌਰਾਨ ਚਾਲੂ ਰਹੇ, ਅਤੇ ਕਈ ਪਹੁੰਚ ਵਿੱਚ ਹੋਣ 'ਤੇ ਕਿਹੜਾ ਰੱਖਿਅਤ ਨੈੱਟਵਰਕ ਪਹਿਲਾਂ ਆਵੇ।"
