plugin-manager.code.no-room-flash = ਇਸ ਦੇ ਕੋਡ ਲਈ ਥਾਂ ਨਹੀਂ ਬਚੀ। ਕੋਡ ਵਾਲਾ ਕੋਈ ਹੋਰ ਪਲੱਗਇਨ ਬੰਦ ਕਰੋ, ਜਾਂ ਵੈੱਬ ਫ਼ਲੈਸ਼ਰ (paperpaw.org) ਨਾਲ ਪੂਰਾ ਲੇਆਉਟ ਫ਼ਲੈਸ਼ ਕਰੋ: ਕਈ ਗੁਣਾ ਥਾਂ।
