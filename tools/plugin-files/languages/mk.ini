keyboard.plugin.name = Тастатура
keyboard.plugin.description = Внесува текст на екранот, со допир или со копчињата.
keyboard.plugin.how = "Тастатурата се отвора секогаш кога нешто бара текст: пребарување, лозинка, белешка или поставка. Работи со допир и само со копчиња.\n\nСо копчиња, лево и десно се движат по ред, копчињата за листање се движат меѓу редови, Избери притиска копче, а Назад откажува; лево и десно се вртат околу редот, а горе и долу ја држат твојата колона. „Shift“ ја прави следната буква голема; притисни го двапати за сите големи, и уште еднаш за да престане. Задржи буква (со копчиња: задржи Избери на неа) за нејзината голема буква, избрана веднаш, и акценти како é и è; на германски, ä, ö, ü и ß доаѓаат така од a, o, u и s (со копчиња, тастатурата го кажува тоа на тие букви). „OK“ завршува; со копчиња, задржи Назад за да завршиш од каде било (Назад сам откажува), или задржи Избери на копче што не е буква. „Залепи“ го вметнува текстот од клипбордот, а „Телефон“, каде што е понуден, ти дозволува да пишуваш на телефонот наместо тоа.\n\nВо поставките под Уред, Тастатура: „Распореди на тастатурата“ ги избира распоредите. Стандардно го следи јазикот на менито; со повеќе, едно копче менува меѓу нив. „Копчиња за умлаути“ наместо тоа дава свои копчиња за ä, ö, ü и ß. „Големина“ ги прави копчињата и буквите поголеми; само со копчиња, редовите остануваат како на компјутерска тастатура. На екрани на допир, „Облик на копчињата“ менува како изгледаат копчињата. „Автоматски големи букви“ го почнува секој збор на реченицата со голема буква."
