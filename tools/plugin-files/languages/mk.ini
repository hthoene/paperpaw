battery.plugin.name = Потрошувачка на батерија
battery.plugin.description = Ја снима батеријата и покажува колку трае.
battery.plugin.how = "„Потрошувачка на батерија“ го бележи нивото на полнење околу еднаш во минута додека уредот е буден, заедно со тоа што правел: освежувања на екранот и превртени страници. Од тоа пресметува колку одземаат еден час будност и 100 страници, и колку трае батеријата со тоа темпо.\n\nОтвори „Батерија“ од менито Алатки. Покажува моментално ниво, ова будење, потрошувачката на батерија досега и твоите неодамнешни будења. Се листа со копчињата за листање или со допирање на стрелките горе.\n\nТреба му некое време читање на батерија за бројките да значат нешто. Снимањето е вклучено стандардно и може да се исклучи во Поставки, под Уред, Енергија, како „Снимај потрошувачка на батерија“."
