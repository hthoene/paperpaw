setup.plugin.name = Поставување
setup.plugin.description = Кратко водство низ поставките што се важни, при првото стартување.
setup.plugin.how = "„Поставување“ е кратко водство низ поставките што се важни, прикажано еднаш, при првото стартување на PaperPaw. Секоја страница прашува по едно нешто, како јазикот, копчињата, големината на текстот, временската зона, Wi-Fi или неколку додатоци за додавање, со разумен одговор веќе избран, па „Напред“ е секогаш во ред. Чекорите што не му се потребни на овој уред се изоставени.\n\nДопри ги копчињата, или користи ги копчињата горе и долу и Избери. „Прескокни“ на првата страница веднаш го напушта поставувањето. Последната страница кажува од каде доаѓаат твоите книги.\n\nЗа да го извршиш повторно, отвори ги поставките и избери „Постави го PaperPaw“. Сè што е избрано тука може да се промени подоцна во поставките."
