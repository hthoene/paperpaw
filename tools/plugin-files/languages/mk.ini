notes-overview.plugin.name = Сите белешки
notes-overview.plugin.description = Обележувачите и истакнувањата од сите книги во еден список, и извоз како My Clippings.txt.
notes-overview.plugin.how = "„Сите белешки“ ја наведува секоја книга во која си направил обележувач или истакнување, со колку. Отвори го во Алатки. Избери книга за да ги видиш нејзините белешки, и белешка за да ја отвориш книгата на тоа место.\n\nНа крајот од списокот, „Извези како My Clippings.txt“ ги запишува сите белешки во една датотека, во папката Exports покрај библиотеката, во облик што го користи Kindle (UTF-8). Апликациите што го читаат My Clippings.txt од Kindle можат да ја читаат. Белешка на истакнување е посебен запис, како на Kindle. Бидејќи книгата тука нема Kindle локации, „локација“ е колку навлезено во книгата е белешката, во проценти. Датотеката се запишува одново секој пат; ја заменува претходната."
