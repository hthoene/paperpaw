news.plugin.name = Вести
news.plugin.description = Презема извори на вести (RSS, Atom) како книги за читање.
news.plugin.how = "„Вести“ ги претвора RSS или Atom изворите во книги. Секој извор станува една книга во папката News од библиотеката, со најновите статии како чист текст, за читање како секоја друга книга.\n\nОтвори „Вести“ од менито Алатки и избери „Додај извор“; неговата адреса е на веб-страницата на весникот или блогот. „Преземи вести“ ги презема сите извори и ги заменува претходните книги. Задржи извор (со копчиња, задржи Избери) за да го преземеш или отстраниш сам. Отстранет извор ја остава својата книга во библиотеката.\n\nПреземањето бара мрежа. „Статии по извор“ (Поставки, Библиотека) поставува колку статии држи секоја книга. Виџетот „Наслови на вести“ ги покажува на почетниот екран."
