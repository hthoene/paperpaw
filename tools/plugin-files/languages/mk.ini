format-cbz.plugin.description = Отвора архиви со стрипови (.cbz), слика на страница.
format-cbz.plugin.how = "Отвора архиви со стрипови (.cbz): слика на страница, прилагодена на екранот, по редот на нивните имиња (2 пред 10).\n\nСтави ги во папката на библиотеката и отвори ги од библиотеката; листај ги страниците како во секоја книга. Големите слики одземаат момент првиот пат, на X4 повеќе отколку на други места.\n\nПоставки за читање (Поставки, Читање): „Поле по поле“ покажува по едно поле од страница, колку што е можно поголемо за екранот, а листањето ги поминува едно по едно; страница без полиња се прикажува цела. „Страниците на стрипот одат“ ги огледува листањата за манга (оддесно налево); сопствениот ComicInfo.xml на книгата тоа го вели сам. Библиотеката го покажува насловот на книгата и нејзината серија и број од ComicInfo.xml."
