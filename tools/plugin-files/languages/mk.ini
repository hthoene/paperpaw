puzzles.plugin.name = Загатки
puzzles.plugin.description = Судоку, вкрстени зборови и шаховски задачи, без мрежа, со загатка на денот.
puzzles.plugin.how = "Загатки за возот и чекалната, сите без мрежа: судоку, вкрстени зборови и шаховски задачи. Отвори „Загатки“ од менито со алатки, или додај го виџетот „Загатка на денот“ на почетниот екран (задржи го почетниот екран, потоа додај виџет): покажува колку е напредно денешното судоку, а допир го отвора. Судокуто на денот е исто цел ден.\n\nСудоку: лево и десно го движат курсорот поле по поле, горе и долу (копчињата за листање) по ред. „Избери“ ги отвора цифрите: избери една и избери повторно за да ја внесеш, или „Избриши“ за да го испразниш полето. Задржи Избери (или Мени) за да стигнеш до копчињата под таблата: „Белешки“ ги претвора цифрите во белешки со молив, „Провери“ ги означува погрешните полиња, „Врати“ го враќа последниот потег, „Нова“ почнува загатка од нивото што го избираш (Лесно, Средно, Тешко). Секоја загатка има точно едно решение. Играта се чува кога ќе излезеш. На екран на допир допри поле.\n\nВкрстени зборови: стави .puz (Across Lite) или .ipuz датотеки во папката „puzzles“ на мемориската картичка; ниту една не е вклучена. Движи се по мрежата, потоа избери за да го внесеш зборот под курсорот на тастатурата (долна црта го остава полето празно). Копчињата менуваат хоризонтално и вертикално, го покажуваат списокот со дефиниции, ги проверуваат буквите и го откриваат зборот. Буквите се чуваат за секоја датотека. Измешани .puz датотеки не можат да се отворат.\n\nШаховски задачи: мал сет од базата на задачи на Lichess (CC0). Лево и десно скокаат од фигура на фигура, избери ја фигурата што сакаш да ја поместиш, потоа лево и десно низ местата каде може да оди, и избери повторно. Погрешен потег се враќа. „Совет“ ја означува фигурата за поместување, „Следна“ оди на следната задача.\n\nТаблата ги исцртува одново само полињата што се менуваат. „Статистика“ ги брои задачите што си ги решил."
