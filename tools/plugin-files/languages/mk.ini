anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Ги учи картичките за повторување од Anki на твојот компјутер и ги праќа одговорите назад, преку додатокот AnkiConnect.
anki.plugin.how = "„Anki“ ти овозможува на читачот да ги учиш картичките што се за повторување во Anki на твојот компјутер, и ги праќа одговорите назад. Го користи бесплатниот додаток AnkiConnect (код на додатокот 2055492159) и никогаш AnkiWeb. На почеток е исклучен: додај го од продавницата за додатоци.\n\nНа компјутерот: инсталирај го AnkiConnect во Anki (Tools, Add-ons, Get Add-ons) и рестартирај го Anki. Anki мора да е отворен додека синхронизираш.\n\nСтандардно AnkiConnect одговара само на компјутерот на кој работи (127.0.0.1), па читачот не може да допре до него. Отвори Tools, Add-ons, AnkiConnect, Config и постави „webBindAddress“ на „0.0.0.0“ (слуша на домашната мрежа). Портот, „webBindPort“, е 8765 освен ако не го смениш. Ако таму поставиш „apiKey“, внеси го истиот клуч овде. Рестартирај го Anki по менувањето на конфигурацијата и дозволи му го на Anki во заштитниот ѕид на компјутерот ако праша. Користи го ова само на мрежа на која и веруваш: секој на неа може да допре до AnkiConnect, па клучот е добра идеја.\n\nНа читачот: отвори го Anki од Алатки, потоа внеси ја адресата на компјутерот (на пример 192.168.1.20) под Компјутер, портот ако не е 8765 и API-клучот ако си поставил. Избери Шпил или остави го празно за сите шпилови. Потоа избери Синхронизирај со Anki, со вклучен Wi-Fi: најпрво се испраќаат твоите одговори што чекаат, потоа се носат картичките за повторување (и бројот нови картички што си го поставил), најмногу 50. Избери Учи за да ги поминеш без мрежа: покажи го одговорот и оцени го со Повторно, Тешко, Добро или Лесно. Твоите одговори се чуваат на читачот, и без Wi-Fi, и одат во Anki со следното синхронизирање. Anki одлучува кога картичката се враќа: картичка на која си одговорил со Повторно повторно се носи со подоцнежно синхронизирање штом Anki ќе каже дека е за повторување.\n\n„Синхронизирај при отворање на Anki“, во поставките, синхронизира секогаш кога ќе го отвориш екранот. Ништо не користи мрежа кога ќе притиснеш копче."
