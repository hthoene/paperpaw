menu-editor.plugin.name = Уредувач на мени
menu-editor.plugin.description = Ги преуредува, отстранува и додава ставките на секое мени.
menu-editor.plugin.how = "Уредувачот на мени менува што содржат менијата: премести ставки нагоре или надолу, отстрани ги или додај нови.\n\nЌе го најдеш во Поставки под Прилагодување, како „Прилагоди ги менијата“. Избери мени, потоа ставка за да ја преместиш или отстраниш; „Додај ставка“ става нова. Промените важат веднаш. „Ресетирај го ова мени“ го враќа менито како што го дефинираат неговите додатоци, „Ресетирај ги сите менија“ го прави тоа за секое.\n\nНе можеш да се заклучиш однадвор: ставка што е патот до поставките останува додека не додадеш друг пат до нив."
