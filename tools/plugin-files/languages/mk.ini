format-docx.plugin.name = DOCX документи
format-docx.plugin.description = Отвора .docx датотеки, како што ги зачувува Word и други програми.
format-docx.plugin.how = "Отвора .docx документи како книги: наслови со содржина, списоци, табели, задебелен и закосен текст, врски и слики (JPEG, PNG, GIF).\n\nСтави ги датотеките во папката на библиотеката и отвори ги од библиотеката. Насловот и авторот се од својствата на документот. Фуснотите, горните и долните колонтитули и коментарите не се прикажуваат."
format-docx.title = DOCX документ
format-epub.plugin.name = EPUB
format-epub.plugin.description = Отвора EPUB книги со нивните стилови, содржина и слики.
format-epub.plugin.how = "EPUB книгите се отвораат од библиотеката како секоја друга книга, со нивната содржина, слики и форматирање од издавачот. Веб-страниците (HTML), Markdown, FictionBook (.fb2) и архивите со стрипови (.cbz) се отвораат на ист начин, секој како посебен додаток.\n\nПоглавје се претвора првиот пат кога ќе го отвориш и се чува во кешот на додатокот, па потоа е побрзо, а големите книги работат на мали уреди. Содржината ќе ја најдеш под „Содржина“ во менито за читање. Дали важи сопственото форматирање на книгата е поставката „Форматирање од издавачот“, под Читање."
format-epub.title = EPUB е-книга
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Отвора FictionBook книги (.fb2, и во zip).
format-fb2.plugin.how = "Отвора FictionBook книги (.fb2), вообичаени за руски и други книги, и во zip (.fb2.zip), со нивниот наслов, автори, корица и поглавја.\n\nСтави ги во папката на библиотеката; се прикажуваат во библиотеката и се отвораат како секоја друга книга."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Отвора веб-страници зачувани како датотеки, покажувајќи само што треба да се чита.
format-html.plugin.how = "Отвора веб-страници зачувани како датотеки (.html, .htm, .xhtml) како книги: само она што е за читање, без менија, реклами и слично околу него.\n\nСтави ја датотеката во папката на библиотеката и отвори ја од библиотеката како секоја книга. Врските во страницата работат; сликите се прикажуваат таму каде што се во датотеката."
format-html.title = Веб-страница (HTML)
format-images.plugin.name = Слики
format-images.plugin.description = Отвора слики (.jpg, .png, .gif) како книги, по една на страница.
format-images.plugin.how = "Сликите (.jpg, .png, .gif) се отвораат од библиотеката како книги, по една слика на страница, прилагодена на екранот.\n\nЗа да прочиташ цела папка со слики, отвори ја нејзината прва слика: сликите по неа во папката следат, по редот на нивните имиња (2 пред 10). Слика подоцна во папката почнува оттаму; местото во секоја се помни посебно. Папка до 300 слики се чита од онаа што ја отвораш.\n\nДатотека што не е слика, или е преголема, го покажува своето име наместо тоа. За книга со многу слики со свој наслов, архива со стрипови (.cbz) е подобра форма."
format-images.title = Слика
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Отвора Markdown датотеки (.md), на пр. белешки.
format-markdown.plugin.how = "Отвора Markdown датотеки (.md), како белешки, како книги: наслови, списоци, цитати и нагласување како што се замислени, а не како знаци.\n\nСтави ги датотеките во папката на библиотеката и отвори ги од библиотеката. Првиот наслов е неговиот наслов; сликите покрај датотеката се покажуваат таму каде што текстот ги именува."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI книги
format-mobi.plugin.description = Отвора .mobi и .azw датотеки без DRM.
format-mobi.plugin.how = "MOBI книгите (.mobi, .azw) се отвораат од библиотеката како секоја книга, без ништо за поставување. Насловот, авторите, јазикот и корицата се од книгата, а содржината се прави од нејзините наслови.\n\nКнигата се претвора првиот пат кога ќе ја отвориш, што за долга книга одзема неколку секунди; потоа се отвора веднаш. Се прикажуваат текст, наслови, задебелен и закосен текст, врски и слики.\n\nКниги со DRM (повеќето книги купени од продавница) не можат да се отворат, ниту книги со Huffman компресија или во поновата форма KF8 (.azw3): PaperPaw го вели тоа кога ќе ги отвориш. Копија како EPUB, направена со алатка како Calibre, секогаш се отвора."
format-mobi.title = MOBI книги
format-rtf.plugin.name = RTF документи
format-rtf.plugin.description = Отвора .rtf датотеки како книги.
format-rtf.title = RTF документи
format-txt.plugin.name = Чист текст
format-txt.plugin.description = Отвора датотеки со чист текст (.txt).
format-txt.plugin.how = "Датотеките со чист текст (.txt) се отвораат од библиотеката како секоја книга, без ништо за поставување. Додатокот чита текст во UTF-8, UTF-16 и Windows-1252 и сам го наоѓа кодирањето.\n\nПасусите ги следат празните редови во датотеката; ако датотеката нема такви, секој ред е пасус. Во датотеките од Project Gutenberg текстот на лиценцата на почетокот и на крајот се изоставува, а насловот и авторот се земаат од заглавието.\n\nДатотеката никогаш не се вчитува цела, па и многу големи текстови се отвораат на мали уреди."
format-txt.title = Чист текст
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Отвора XTC и XTCH книги, однапред исцртани страници на читачите Xteink.
format-xtc.plugin.how = "XTC и XTCH датотеките се книги чии страници се веќе исцртани како слики, како што ги прават конверторите за читачите Xteink. Се отвораат од библиотеката како секоја книга.\n\nБидејќи секоја страница е фиксна слика, текстот не може да се зголемува или да се постави во друг фонт. Страниците се црно-бели или со четири сиви тона. Секоја страница се декодира кога се прикажува, па е потребна малку меморија, и на X4.\n\nНасловот, авторот и поглавјата се земаат од датотеката кога ги има."
format-xtc.title = XTC страници
help.plugin.name = Совети
help.plugin.description = Покажува што прават контролите на екранот, првиот пат кога се отвора.
help.plugin.how = "Првиот пат кога ќе се отвори екран, кратка белешка над него кажува што прават неговите контроли: деловите на екранот до кои оди допирот, во рамка, и што прават копчињата.\n\nДопир или кое било копче ја затвора белешката и таа повеќе не доаѓа за тој екран. „Повеќе без совети“ ги исклучува сите.\n\nВо поставките, под Систем, „Совети“ ги вклучува или исклучува, а „Покажи ги советите повторно“ ја прикажува белешката на секој екран уште еднаш."
help.title = Како работи тука
help.got-it = Разбрав
help.no-more = Повеќе без совети
help.section = Совети
