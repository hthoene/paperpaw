bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Спарува далечински управувачи, тастатури и сензори и ги поврзува.
bluetooth.plugin.how = "„Bluetooth“ спарува далечински управувачи, тастатури и сензори со читачот, таму каде што го има Bluetooth (X4 Pro).\n\n„Додај уред“ бара што е во опсег; прво стави го уредот во режим на спарување. Избери го и потврди на читачот (спореди го бројот каде што се појавува). Копчињата на далечинскиот управувач или тастатурата потоа листаат страници и се движат низ менијата; што прави секое копче менуваш под Управување.\n\n„Далечински управувачи“ вели кога работат нивните копчиња: кога се вклучени тука, додека читаш (поврзани додека е отворена книга, штеди батерија) или секогаш. Копчето за мени или долг притисок на уред го заборава.\n\nСензорот е за додатоци: вклучи кој додаток смее да го користи. Bluetooth е исклучен секогаш кога ништо не го користи."
