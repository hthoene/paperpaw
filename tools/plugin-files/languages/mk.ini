notes-vault.plugin.name = Трезор на белешки
notes-vault.plugin.description = Чита папка со Markdown белешки по папки, ознаки и последни промени, со виџети за почетниот екран. Работи со Obsidian трезори.
notes-vault.plugin.how = "„Трезор на белешки“ чита папка со Markdown белешки (обични .md датотеки, како што ги чуваат апликациите за белешки). Работи со Obsidian трезори.\n\nИзбери ја папката на трезорот во поставките, или на страницата на трезорот во алатките. Страницата потоа ги нуди папките како што се на картичката, последно променетите белешки, ознаките и пребарување во насловите на белешките.\n\nПрвиот пат, трезорот се индексира во позадина додека е отворена неговата страница; трезор со илјадници белешки одзема неколку минути, потоа се отвора веднаш. Индексот се чува на картичката и се прави одново кога страницата на трезорот ќе се отвори по неколку часа, или кога ќе избереш „Ажурирај“.\n\nБелешка се отвора во читачот. Врските до други белешки ([[Note]], [[Note|words]], [[Note#Heading]]) се наоѓаат по името на белешката каде било во трезорот; следењето на една ја отвора таа белешка, а Назад се враќа на претходната.\n\nНишто во трезорот никогаш не се менува. Виџетите за почетниот екран (неодамнешни белешки, закачена белешка, белешка на денот, случајна белешка, ознаки, пребарување) се додаваат во уредувачот на почетниот екран. Виџет може да ги зема белешките само од една папка: напиши ја патеката на папката од коренот на картичката (на пример Notes/Work) во поставките на виџетот; ако е празно, ги зема сите белешки од трезорот."
