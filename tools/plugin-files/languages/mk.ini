files.plugin.name = Прелистувач на датотеки
files.plugin.description = Ги наведува книгите и папките на уредот и ги отвора.
files.plugin.how = "„Библиотека“ ги наведува книгите во папката на твојата библиотека, секоја со корица, наслов, автор и колку си ја прочитал. Книгата што последна си ја читал стои горе како картичка, па продолжувањето на читањето бара еден допир, или еден притисок на Избери. Додека библиотеката бара книги, кажува колку досега нашла.\n\nИзбери што се прикажува над книгите: сите, оние што ги читаш, непрочитани или прочитани, или полиците (по автор, серија, ознака, омилени, следната книга од секоја серија што си ја почнал). Допри книга за да ја читаш; задржи ја (со копчиња, задржи Избери) за да ја отвориш, да ја означиш како прочитана или непрочитана, да ги видиш информациите за неа, да ја преместиш во архивата или да ја избришеш. Допри го насловот за менито на библиотеката: како се подредуваат и прикажуваат книгите, пребарување, папката на библиотеката и поставки.\n\nПапката на библиотеката се поставува во Поставки, под Библиотека, како „Папка на библиотеката“; таму може и да ги прикажеш книгите како мрежа од корици. За секоја друга датотека користи „Датотеки“ во менито Алатки."
