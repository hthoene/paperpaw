settings.plugin.name = Поставки
settings.plugin.description = Страниците со поставки, составени од поставките на секој додаток.
settings.plugin.how = "„Поставки“ го покажува сè што може да се постави во PaperPaw и неговите додатоци, во страници. Додатоците не бараат свој екран: она што го декларираат се појавува тука, во групи, со описот на секоја поставка под неа.\n\nОтвори го со „Поставки“ во менито. Допри група за да ја отвориш, потоа поставка за да ја префрлиш или избереш; броевите имаат копчиња − и +. Со копчиња, оди до поставка и притисни Избери: лево и десно менуваат број, Избери го задржува, а Назад се враќа на претходната вредност.\n\nПромените важат веднаш. „Пребарај“ наоѓа поставка по зборови, а „Напредни поставки“ додава ретко потребните. „Ресетирај по стандард“ и „Ресетирај сè“ прво прашуваат."
