reader.plugin.name = Читач
reader.plugin.description = Ги покажува книгите страница по страница, со содржина и поставки за читање.
reader.plugin.how = "Читачот ги покажува книгите страница по страница. Отвори книга од библиотеката; последната книга може да се отвори повторно при стартување (поставка „Отвори ја последната книга при стартување“).\n\nДопри лево или десно на екранот, или користи ги копчињата за листање, за да ги листаш страниците. Допри ја средината или притисни Избери за менито за читање: Содржина, Пребарај, Оди на страница, Фонт и распоред, Обележувачи и истакнувања и повеќе. Надолу од горниот раб го отвора брзиот пристап, нагоре од долниот раб оди на Почетна; така прави и задржувањето на Назад.\n\nЗадржи Избери (или задржи слика) за да видиш слика на цел екран: Лево и Десно ги поминуваат сликите на страницата. Избери зумира на 2x, 3x и назад (двоен допир на допир); зумирано, Лево и Десно се движат настрана, копчињата за листање (или повлекувањата) се движат понатаму хоризонтално и вертикално. Назад се враќа на прилагодено, потоа на страницата (задржи за да излезеш на допир). Допри го горниот десен агол за обележувач. Задржи збор за да го истакнеш. Со копчиња, задржи Лево: Лево и Десно се движат по збор, копчињата за листање по ред, задржувањето ги носи до краевите на страницата и по пасус; Избери ја отвора лентата за истакнување за зборот, задржувањето на Избери ја проширува до реченицата и пасусот (потоа Лево и Десно го движат крајот, задржувањето ги движи почетокот). Изборот продолжува низ листањето на страниците. „Извези како Markdown“ ги зачувува твоите белешки."
