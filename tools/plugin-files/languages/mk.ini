power.plugin.name = Напојување
power.plugin.description = Го избира режимот на напојување, рачно или според батеријата: Нормален, Штедење, Без мрежа.
power.plugin.how = "„Напојување“ избира како PaperPaw ја троши батеријата: Нормален, Штедење или Без мрежа. Штедењето го прави тоа што може да почека во подобри моменти; „Без мрежа“ го држи радиото исклучено. „Автоматски“ избира според батеријата.\n\nПромени го режимот во брзиот пристап, каде што „Напојување“ ги покажува режимите еден до друг, или во Поставки под Напојување. Таму ги поставуваш и нивоата на кои „Автоматски“ преминува на Штедење и на Без мрежа, и дали останува Нормален додека се полни.\n\nВо статусните линии, „Режим на напојување“ покажува лист додека штеди и пречкртан Wi-Fi додека е без мрежа, и ништо во Нормален.\n\nЗадржи го копчето за вклучување за да отвориш мало мени: Спиење, Исклучи (каде што PaperPaw може), Рестартирај, и на уреди со допир „Заклучи допир“ или „Отклучи допир“. Краток притисок сè уште го става уредот на спиење. Назад го напушта менито."
