about.plugin.name = За
about.plugin.description = Верзијата и лиценците на PaperPaw.
about.plugin.how = "„За“ покажува која верзија на PaperPaw ја имаш, каде е неговиот изворен код и под кои лиценци доаѓа.\n\nЌе го најдеш на крајот од Поставките, како „За PaperPaw“. Избери ред со стрелките и Избери, или допри го. Таму се наведени и додатоците вградени во фирмверот и, на уреди што вчитуваат додатоци со код, отпечатокот за кој мора да бидат изградени таквите додатоци.\n\n„Лиценци“ се отвора како текст во читачот, па листаш како низ книга. Ја содржи лиценцата на PaperPaw и лиценците на фонтовите, иконите и шаблоните за пренос на зборови што се испорачуваат со него. Додатоците може да додадат свој ред, на пример авторот на една тема."
