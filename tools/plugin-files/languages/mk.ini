transfer.plugin.name = Пренос
transfer.plugin.description = Стави книги и други датотеки на уредот од прелистувач на истата мрежа.
transfer.plugin.how = "„Пренос преку Wi-Fi“ става книги и други датотеки на уредот од прелистувач на истата мрежа, без кабел или апликација. Може и да преземаш датотеки, да правиш папки и да бришеш.\n\nОтвори го од Алатки. Екранот покажува адреса како текст и како QR-код: отвори ја во прелистувач на телефон или компјутер, или скенирај го кодот. Адресата содржи клуч направен одново секој пат, па другите на мрежата не можат да пристапат до твоите датотеки. Преносот работи додека екранот е отворен.\n\nТаму каде што PaperPaw сам управува со Wi-Fi, како на X4, „Без рутер“ на дното отвора сопствена мрежа на уредот, на која телефонот се приклучува со скенирање на код."
