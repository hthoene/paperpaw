fonts-browser.plugin.name = Повеќе фонтови
fonts-browser.plugin.description = Покажува фонтови од интернет, секој со пример, и ги презема за читање.
fonts-browser.plugin.how = "„Повеќе фонтови“ наведува фонтови од библиотека со фонтови на интернет, секое име напишано со својот фонт, и ги презема оние со кои сакаш да читаш.\n\nЌе го најдеш на крајот од списокот со фонтови каде што се бира фонтот за читање, во Поставки, под Читање, како Фонт; статусните линии ја имаат истата ставка за својот фонт. Допри фонт (со копчиња, притисни Избери) за да го видиш поголем со реченица за пример, потоа избери „Преземи“. Можеш да ја напуштиш страницата додека се презема. Кога ќе заврши, избери „Читај со (името на фонтот)“, или „Користи за статусните линии“. „Ажурирај“ носи понова верзија, „Отстрани“ го брише фонтот од уредот.\n\nТреба му Wi-Fi.\n\nСОПСТВЕНИ ФОНТОВИ\n\nЗаедно со „Повеќе фонтови“, истиот список има „Сопствени фонтови“, што го покажува овој дел од помошта. Сопствен фонт е датотека .ttf или .otf, на пример од Google Fonts.\n\nНа Android и други уреди што цртаат датотеки со фонтови: копирај ја датотеката во папката fonts (на Android: PaperPaw/fonts во заедничкиот склад), рестартирај го PaperPaw и избери го фонтот во Поставки, под Читање, како Фонт.\n\nНа Xteink X4 и X4 Pro: овие читачи читаат пакети со фонтови, а не датотеки со фонтови, бидејќи датотеките со фонтови не би собрале во нивната меморија. Направи пакет на компјутер со paperpaw-fontgen, за секој стил што го имаш (потребен е обичниот):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nОва ја прави папката plugins/font-my-font. Копирај ја во папката plugins на мемориската картичка, рестартирај и избери My Font како Фонт. Пакет од еден стил е околу половина мегабајт за латински букви; стиловите што ќе ги изоставиш се цртаат во обичниот. Алатката кажува колку од буквите што ги бараш ги има фонтот (--chars latin,cyrillic,greek додава писма): фонт без буквите од твојата книга не може да ги покаже, па побарај таков што го покрива нејзиното писмо.\n\nФонтовите од „Повеќе фонтови“ работат на ист начин и не бараат компјутер.\n\nЗа поостар ситен текст на е-мастило панелот, додај --hinting light на командата: ги прилагодува буквите на мрежата од пиксели, како што се направени стандардните фонтови. Без тоа буквите се цртаат како што ги дизајнирал фонтот; --hinting normal и --hinting mono ги прилагодуваат посилно. Фонтовите со ознаки, како арапскиот или деванагари, најдобро се оставаат без тоа."
