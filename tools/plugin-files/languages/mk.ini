keys.plugin.name = Копчиња и гестови
keys.plugin.description = Што прави секое копче, зона на допир и повлекување, менувано на уредот.
keys.plugin.how = "„Копчиња и гестови“ покажува што прави секое копче, зона на допир и повлекување, и ти дозволува да го смениш тоа на уредот.\n\nОтвори го во поставките, под Уред. Најпрво избери каде важи промената: „Насекаде“, „При читање“, „На почетниот екран“, „Во библиотеката“ или во една алатка. Потоа избери влез, како задржано копче или повлекување навнатре од раб, и избери дејство од списокот, во кој можеш да пребаруваш. „Стандардно“ го враќа она што го поставуваат додатоците и распоредот на копчињата.\n\nНа X4, промена по која не би останало копче за избирање, враќање назад или движење напред се одбива. „Ресетирај копчиња и гестови“ на крајот ги враќа сите промени."
