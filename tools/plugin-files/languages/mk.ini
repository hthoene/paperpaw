diagnostics.plugin.name = Дијагностика
diagnostics.plugin.description = Тест-екран и водена проверка на секој дел од уредот.
diagnostics.plugin.how = "„Дијагностика“ е тест-екран за проверка на уред: ги покажува сите нивоа на сиво што може да ги прикаже панелот, четири полиња за пробање на копчињата и допирот, и бројач на страници со лента на напредок за споредба на режимите на освежување.\n\nТест-екранот нема ставка во менито. Тој е почетен екран само додека ниеден друг додаток не нуди таков, или кога ќе го избереш под Екрани во управувачот со додатоци за местото Почетен екран.\n\nИзбери го означува фокусираното поле, а стрелките се движат меѓу полињата; со допир, допри поле. Копчињата за листање ги менуваат тест-страниците. Задржи Избери, или задржи прст на екранот, за да почнеш одново.\n\nПроверката на уредот, под Алатки таму каде што PaperPaw е фирмвер на уредот, поминува низ секој дел од уредот по една страница: екранот, копчињата, допирот, предното светло, батеријата, картичката, часовникот, Wi-Fi, спиењето и меморијата. Секоја страница завршува со Неисправно, Прескокни и Исправно, со избран одговорот што го сугерираат нејзините мерења; деловите што ги нема уредот се прескокнуваат. По секој одговор запишува извештај во .paperpaw/plugins/diagnostics/device-check.txt, за да се залепи во pull request. Назад излегува, а кога повторно ќе се отвори продолжува каде што застанало. На уред само со копчиња, најпрво избери Почни на страницата за копчињата; дотогаш стрелките, Избери и Назад работат како на секоја страница."
