profiles.plugin.name = Профили за читање
profiles.plugin.description = Именувани сетови на поставки за читање и приказ, префрлувани со допир.
profiles.plugin.how = "Профилот ги чува твоите поставки за читање, поставки за приказ и статусни линии под име, како Ноќен или Голем печат, и ги враќа со допир.\n\nОтвори „Профили“ во менито за читање под „Повеќе“, или во Поставки под Прилагодување. Допри профил за да го користиш; оној што се користи е означен. Задржи го (со копчиња, задржи Избери) за да ги зачуваш сегашните поставки во него, да го преименуваш или да го отстраниш. „Зачувај како нов профил“ го чува она што е поставено сега.\n\n„Следен профил“ преминува на следниот во списокот; стави го на копче или во правило."
