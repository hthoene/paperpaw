stats.plugin.how = "„Статистика за читање“ бележи колку долго читаш секоја страница. Ја гледаш како преглед со денес, неделата и твојата низа, како календар, и со бројките на секоја книга.\n\nОтвори ја од Алатки, или од „Повеќе“ во читачот. Во поставките, под Статистика за читање, може да го исклучиш „Бележи читање“, да поставиш „Дневна цел“ и да ги поставиш „Најкратка страница“ и „Најдолга страница“ што се бројат, за листањето или оставена отворена книга да не ги искривуваат бројките.\n\n„Синхронизирај со KOReader“ ја споделува статистиката со KOReader преку WebDAV папка. Ја презема и статистиката на KOReader на истиот уред. Бележењето бара часовникот да е поставен: каде што не е, поврзи се еднаш на Wi-Fi."
