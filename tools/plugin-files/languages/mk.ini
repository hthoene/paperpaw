mail.plugin.name = Пошта
mail.plugin.description = Чита и испраќа е-пошта со лозинка или лозинка за апликација (IMAP и SMTP), без најава преку прелистувач.
mail.plugin.how = "„Пошта“ чита и испраќа е-пошта преку IMAP и SMTP. Се најавува со твојата адреса и лозинка, без најава преку прелистувач, па работи со секој провајдер што тоа го дозволува.\n\nПостави сметка под Поставки, Пошта. Избери го провајдерот, внеси ја адресата и лозинката. Повеќето провајдери сакаат лозинка за апликација: направи ја во безбедносните поставки на сметката и користи ја таа овде. Обичната лозинка често не работи, а таа никогаш не оди никаде освен на серверот на провајдерот. Се чува со лозинките и клучевите.\n\nОтвори „Пошта“ во алатките. „Провери пошта“ ги носи најновите пораки и папките. Пораките се чуваат на картичката, па можеш да ги читаш без мрежа. Уредот се поврзува, носи и се исклучува, па Wi-Fi е вклучен само за момент.\n\nАко твојот провајдер не е на списокот, избери „Свои сервери“ и постави ги имињата на серверите, портите и безбедноста под напредните поставки. Сервер чиј сертификат никој орган не го гарантира прашува еднаш дали да му верува; спореди го отпечатокот со тоа што го покажува твојот провајдер.\n\nПорака со прикачена книга (EPUB, PDF и слично, до 2 MB) има „Отвори книга“ под неа: ја носи датотеката, ја става во твојата библиотека и ја отвора.\n\nЗа да гледаш нова пошта без да отвораш „Пошта“, вклучи „Проверувај нова пошта во позадина“ под Поставки, Пошта, и избери колку често (на 15, 30 или 60 минути). Исклучено е додека не го вклучиш. Читачот потоа се поврзува одвреме-навреме преку безбедна врска додека е буден и на мрежа, една сметка по друга, и го ажурира бројот на непрочитани на Почетна. Користи малку батерија. Отворањето на „Пошта“ запира проверка што е во тек.\n\nВиџетите на почетниот екран ги покажуваат бројот на непрочитани, најновите и пораките со ѕвезда, едно сандаче и кратенка за пишување порака."
