reading-goal.plugin.name = Цел за читање
reading-goal.plugin.description = Минути за читање на ден, и мачка на почетниот екран чие расположение го следи денешното читање.
reading-goal.plugin.how = "Мачка на твојот почетен екран покажува како оди денешното читање: тажна додека уште не си читал, така-така по малку, задоволна од половина од дневната цел, среќна штом ќе ја постигнеш.\n\nДодај го виџетот „Мачка за читање“ на почетниот екран (задржи го почетниот екран, потоа додај виџет), или избери „Денешна мачка за читање“ како екран за спиење. Допир на мачката ја отвора дневната цел; тоа е целта од статистиката за читање, која ги брои минутите што ги читаш.\n\nВо поставките, под Читање, „Задоволна од“ и „Среќна од“ поставуваат од кој дел од целта мачката е задоволна или среќна, а „Свои слики“ папка со слики (тажна, така-така, задоволна и среќна) што се прикажуваат наместо мачките. Сликите се PNG или JPEG датотеки; без папка, се прикажуваат мачките."
