file-manager.plugin.name = Управувач со датотеки
file-manager.plugin.description = Секоја папка и датотека на уредот: отвори, преименувај, премести, копирај и избриши.
file-manager.plugin.how = "„Управувач со датотеки“ ја покажува секоја папка и датотека на складот на уредот, не само твоите книги, и ти дозволува да ги отвораш, преименуваш, преместуваш, копираш и бришеш и да правиш нови папки.\n\nОтвори „Датотеки“ од менито Алатки. Допри папка за да влезеш во неа; Назад оди во папката погоре. Допри датотека, или задржи која било ставка (со копчиња, задржи Избери), за да видиш што може да се прави со неа. „Премести“ и „Копирај“ ја избираат ставката: оди во папката каде што припаѓа и избери „Залепи овде“ во лентата на дното. Со копчиња, притисни Долу од последната ставка за да стигнеш до лентата.\n\nДатотеките и папките што почнуваат со точка, како сопствените податоци на PaperPaw, се скриени. За да ги видиш, вклучи „Скриени датотеки“ во Поставки, под Библиотека."
