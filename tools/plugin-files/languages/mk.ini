store.plugin.name = Продавница за додатоци
store.plugin.description = Наоѓа, инсталира, ажурира и отстранува додатоци за овој уред.
store.plugin.how = "„Продавница за додатоци“ наоѓа додатоци за овој уред на интернет и ги инсталира, ажурира и отстранува. Отвори ја од Алатки; бара Wi-Fi.\n\nНа почетокот се прикажува она што библиотеката го препорачува, што е ново или популарно сега, потоа групите. Група ги наведува своите додатоци во правичен микс што се менува дневно, за да се види секој додаток; подреди ги од А до Ш, по најнови или по последно ажурирање, и оди до буква во долги списоци. Отвори еден за да ја видиш неговата страница, со големината и меморијата што ја зафаќа, потоа избери „Инсталирај“, „Ажурирај“ или „Отстрани“. „Ажурирај ги сите“ ги доведува сите инсталирани додатоци во ажурна состојба.\n\nДодатоците со код работат со целосен пристап до уредот: продавницата го кажува тоа и прашува прво, а тие почнуваат по рестартирање. Ако некој тргне наопаку, PaperPaw стартува без додатоци со код и кажува кои. „Библиотека на додатоци“ поставува од каде доаѓа списокот.\n\n„Додатоци од заедницата“, во Поставки, Систем, наведува и додатоци што другите ги објавиле на GitHub. Никој не ги прегледал: означени се „Непрегледано“, страницата на додаток со код го покажува клучот со кој е потпишан, а ажурирање потпишано со друг клуч не се инсталира.\n\n„Извори“, последниот ред на почетокот, додава списоци со додатоци од други по нивна адреса (https://…/plugins.json), наведува еден од нив наместо оној на PaperPaw, или го отстранува. Наместо да пишуваш, стави датотека sources.txt со една адреса на секој ред во .paperpaw/plugins/store на картичката: адресите се појавуваат под „Извори“ како нови. PaperPaw не проверува извор или неговите додатоци, а уредот контактира со серверот на изворот. Изворот го потпишува својот список; уредот го чува клучот од првиот список што го чита и оттогаш зема само списоци и додатоци со код потпишани со тој клуч. Додатокот добива ажурирања само од изворот од кој е инсталиран. Сопствената библиотека на PaperPaw е секогаш тука и не може да се отстрани; излегувањето од продавницата се враќа на неа."
