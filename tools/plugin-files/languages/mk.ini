calibre.plugin.name = Безжична библиотека
calibre.plugin.description = Прима книги преку мрежа. Работи како безжичен уред за Calibre.
calibre.plugin.how = "„Безжична библиотека“ овозможува уредот да се појави во Calibre на твојот компјутер како безжичен уред. Calibre потоа може да му праќа книги, да ги наведува и да ги брише. Книгите одат во библиотеката.\n\nОтвори „Безжична библиотека“ од менито Алатки, со уредот и компјутерот во иста Wi-Fi мрежа. Во Calibre избери Connect/share, потоа Start wireless device connection. Кога уредот ќе го најде твојот компјутер, го покажува неговото име; допри Поврзи се (со копчиња, притисни Избери). Calibre може да додава и да брише книги тука, па поврзувај се само со свој компјутер. Затворањето на екранот ја прекинува врската.\n\nАко Calibre не се најде сам, внеси ја адресата на неговиот компјутер во Поставки, под Библиотека, како Адреса во делот за Calibre. Ако Calibre користи порт различен од 9090, додај го како :порт, на пр. 192.168.1.20:9091."
