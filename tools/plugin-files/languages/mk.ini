koreader.plugin.name = Споделување на истакнувања
koreader.plugin.description = Ги споделува обележувачите и истакнувањата со KOReader за книги читани во двата.
koreader.plugin.how = "Овој додаток ги споделува обележувачите и истакнувањата со KOReader за книги што ги читаш во двата, на еден уред или во папка на библиотеката синхронизирана меѓу уредите. Нема ништо за поставување.\n\nКога PaperPaw ќе отвори книга што ја отворил и KOReader, и кога ќе ги смениш нејзините обележувачи или истакнувања, го презема новото од податоците на KOReader покрај книгата и го остава новото од тука за KOReader да го земе следниот пат кога ќе ја отвори книгата. Отстранетите ознаки и променетите белешки исто така се пренесуваат.\n\nОва работи само за EPUB книги. Ако датотеката на едната страна не може да се прочита, ништо не се менува на ниедната страна додека не може."
