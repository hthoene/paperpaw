calendar.plugin.name = Календар
calendar.plugin.description = Твоите календари на читачот: преглед на агенда, ден, недела и месец од CalDAV, iCal и датотеки, роденденски од контакти, виџети за почетниот екран и екран за спиење.
calendar.plugin.how = "Календари на читачот: агенда на следните денови, ден, недела и месец, со настани од CalDAV календари (Nextcloud, Radicale, Baïkal, Fastmail и др.), iCal адреси (.ics, webcal://), датотеки на картичката и родендени и годишнини на контактите (CardDAV). Календарите само се читаат, не се менуваат.\n\nОтвори „Календар“ од алатките. Првиот ред го именува прегледот; избери го, задржи ред или притисни Мени за Агенда, Ден, Недела, Месец и Родендени, додавање календари или синхронизација. Во Ден и Недела првите два реда (и копчињата за листање) водат ден или недела назад и напред; во Месец стрелките го движат денот, листањето месецот, а Избери го отвора денот. Избери на настан го покажува цел: кога, каде, кој календар, како се повторува. Назад враќа чекор.\n\nДодавање: Календари (во менито или Календар во поставките). Вид: CalDAV сметка (доволна е адресата на серверот, на пр. cloud.example.com/remote.php/dav; се прикажува секој календар со настани), iCal адреса (објавен .ics), датотека на картичката или контакти (CardDAV именик: нивните зачувани родендени и годишнини). Внеси адреса, за сметка корисничко име и лозинка (најдобро за апликација; се чува со лозинките на читачот) и име. Секој има ознака за разликување (точка, прстен, сива точка или квадрат) што може да се смени; до шест календари.\n\nПовторливи настани (дневно, неделно, месечно, годишно, со денови од неделата, број, краен датум, изоставени денови), целодневните и тие во други временски зони се прикажуваат по часовникот на читачот. Се чуваат настаните од 60 дена пред до 60 дена по денес, најмногу 240, видливи без мрежа. Правило што не се чита го покажува настанот еднаш.\n\nКалендарите се читаат при отворање (најмногу на пет минути), со Синхронизирај сега и, по поставките под Календар, кога мрежата е и онака вклучена или почнува полнењето. Радиото се вклучува за тоа само со Синхронизирај сега.\n\nВиџети за почетниот екран (задржи го, па додај виџет): Денес – датумот и што носи денот, Следен настан – следниот, Агенда – следните денови, Месец – точка под деновите со настани, Родендени – следните родендени. Допир на настан го отвора, на ден од месецот – тој ден. Екранот за спиење може да ја покаже денешната агенда: Календар под Екран за спиење во поставките."
