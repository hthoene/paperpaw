help.setting.again.help = Советите на секој екран се прикажуваат уште еднаш, следниот пат кога ќе се отвори.
help.again-done = Советите се прикажуваат повторно, следниот пат кога ќе се отвори секој екран.
home.plugin.name = Почетен екран
home.plugin.description = Почетната страница: страници со виџети, како книгата што се чита и алатките.
home.plugin.how = "Почетниот екран е составен од страници, секоја мрежа од виџети и алатки како на телефон. На почеток часовникот, книгата што ја читаш и неодамна читаните книги се на една страница, а сите алатки на следната.\n\nДопри ставка за да ја отвориш, и повлечи или користи ги копчињата за листање за да менуваш страници. Само со копчиња, стрелките се движат од една ставка до следната, а Избери ја отвора.\n\nЗа да го преуредиш, задржи го почетниот екран, допри го моливот под страницата или избери „Уреди почетен екран“ во менито. Влечи ставки за да ги преместиш или допри една за нејзините опции, и со копчиња. Таму е и „Додај виџет“. „Колони“ и „Редови“ се во поставките, под Изглед, во делот Почетен екран.\n\nНа екран свртен настрана, почетниот екран ги покажува истите ставки со повеќе колони, секоја страница исполнета пред следната, и картички не пошироки од околу 110 мм; ништо што си го средил исправено не се менува. Средувај го настрана и тој распоред се чува за таа ориентација посебно: новите виџети се додаваат во обата. „Ресетирај го водорамниот распоред“ во „Додај“ (при уредување) се враќа на изведениот. Отстранувањето на виџет или алатка во една ориентација не го отстранува од другата."
