picture-home.plugin.name = Почетен екран со слика
picture-home.plugin.description = Почетен екран со твоја слика зад виџетите и статусна лента што ја конфигурираш.
picture-home.plugin.how = "„Почетен екран со слика“ го заменува почетниот екран додека е вклучен: твоја слика зад виџетите, и страниците со виџети и алатки што ги средуваш. Исклучи го во управувачот со додатоци и вградениот почетен екран се враќа, со свои страници.\n\nСтави слики (JPEG, PNG или GIF) во папка на картичката (стандардно wallpapers), потоа избери една во Поставки, Прилагодување, Почетен екран со слика. „Прилагоди“ вели како ја исполнува екранот (исполни, цела слика, истегни, оригинална големина, плочки), „Положба“ кој дел останува, „Зум“ колку е голема, а „Осветли ја сликата“ колку е бледа: побледа слика ги прави виџетите полесни за читање. Сликата се подготвува еднаш за секоја големина на екран, што одзема момент.\n\nВиџетите стојат на подлоги над сликата. Средувај ја страницата како на вградениот почетен екран: моливот под страницата или „Уреди почетен екран“ во менито.\n\nСтатусната лента (време, Wi-Fi, батерија или што ќе избереш) може да е вклучена, исклучена или автоматска, горе или долу, со цела ширина или мала капсула лево, средина или десно, на светла, темна или сива подлога или врз самата слика. Редот што ги именува копчињата (на X4) исто така може да е вклучен, исклучен или автоматски. Автоматски значи дека притисок на копче ги покажува неколку секунди; тој притисок не прави ништо друго.\n\n„Исцртување на слика“ вели како се црта сликата: „Нивоа на сиво“ во секое сиво што го има екранот (побавно на X4), „Растеризирано“ во црно-бели точки (брзо), или „Автоматски“, како вградениот почетен екран: нивоа на сиво кога екранот се црта, точки по првата промена. Каде што екранот нема нивоа на сиво, нивоата на сиво паѓаат на точки."
