sleep.plugin.name = Екран за спиење
sleep.plugin.description = Покажува мачка што спие, корицата на книгата, твои слики или порака додека уредот спие.
sleep.plugin.how = "Екранот за спиење одлучува што се прикажува на екранот додека уредот спие. Е-мастилото ја држи сликата без напојување.\n\nИзбери го во поставките, под Уред, Екран за спиење, со „Прикажи“: мачка што спие (стандардно), корицата на книгата, мои слики, логото и „Спие“, виџети, страницата каква што е, или страницата со слика. „Мои слики“ ги покажува датотеките од папката Pictures една по друга.\n\nБез корица или слика се прикажува мачката. Таму каде што системот сам го црта екранот за спиење, овие поставки се скриени.\n\nЕкранот за исклучување, „Прикажи при исклучување“, се црта еднаш додека уредот се исклучува, од менито за напојување или по времето на „Исклучи по спиење“ (не кога слаба батерија го прекинува напојувањето). Е како екранот за спиење освен ако избереш логото и „Исклучено“, мачката, корицата или мои слики. Друг додаток може да понуди екран за тоа.\n\nЕкранот за стартување и рестартирање, „Прикажи при стартување“ и „Прикажи при рестартирање“, се сопствени на уредот освен ако друг додаток не понуди екран за нив. Додатоците сè уште не работат додека уредот стартува: екранот избран за стартување се црта однапред, додека уредот се исклучува или рестартира, и се прикажува при следното стартување. Екран што не е подготвен на време, или оштетена слика, отстапува пред сопствениот на уредот; уредот во секој случај се исклучува или рестартира."
