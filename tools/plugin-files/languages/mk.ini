vocabulary.sd.readme = "Картички за учење од датотеки\n\nСтави датотека тука за секој шпил: Spanish.tsv го прави шпилот Spanish.\nДатотеки: .tsv, .csv или .txt, зачувани како UTF-8, или .apkg: Anki шпил, извезен со штиклирано „Support older Anki versions“. Првите три полиња на неговите белешки стануваат предна страна, задна страна и пример; неговото распоредување и медиуми не се читаат, а PaperPaw никогаш не запишува Anki датотека.\n\nЕдна картичка на секој ред: предна страна, задна страна и пример (по желба), одвоени со табулатор, запирка или точка и запирка. Првиот ред може да ги именува колоните: front, back, example. Пример:\n\nKatze\tcat\tDie Katze schläft.\n\nПотоа отвори „Картички за учење“ на читачот, избери „Картички на SD картичката“ и потоа „Ажурирај ги шпиловите од картичката“.\n\nДобро е да се знае:\n- Шпиловите остануваат на читачот, со тоа што си го научил. Датотеката се чита кога е нова или променета, а нејзините картички се додаваат во шпилот или се менуваат таму.\n- Промени ја задната страна или примерот на картичка во датотеката: картичката се менува и го задржува твојот напредок.\n- Промени го текстот на предната страна на картичка: се брои како нова картичка, а старата почнува одново. Картичките се совпаѓаат по текстот на предната страна, празнините и големите букви не се бројат. Зачувај шпил во датотека („Картички на SD картичката“, „Зачувај го шпилот на картичката“) и секоја картичка добива број во колоната id: промени предна страна таму, задржи ги првите два реда од датотеката каква што се, и картичката го задржува тоа што си го научил.\n- Зачувувањето ги запишува картичките на шпилот. Тоа што било во датотеката а не е картичка (ред без предна страна) не се чува; датотеката што била таму се копира во _name.bak.tsv.\n- Зачувај ја датотеката како CSV UTF-8 (не UTF-16, не сопствен формат на табеларна пресметка). Датотека над 4 MiB или 20 000 реда не се чита: раздели ја.\n- Ред што ќе го избришеш во датотеката не ја брише картичката во шпилот, освен ако за тој шпил го вклучиш „Отстрани картички што недостасуваат“. Тогаш картичката заминува со тоа што си го научил.\n- Датотеките чии имиња почнуваат со _ не се читаат.\n"
