wifi.plugin.name = Wi-Fi
wifi.plugin.description = Се поврзува на Wi-Fi мрежи кога е потребно и потоа го исклучува радиото.
wifi.plugin.how = "„Wi-Fi“ се поврзува на мрежа кога на некој додаток му треба интернет (каталог, синхронизирање, продавницата, пренос) и повторно го исклучува радиото минута откако ништо не го користи, или веднаш кога се прикажува Почетна или книга, за да штеди батерија и меморија.\n\nОтвори „Wi-Fi“ од Поставки, или од ставката Wi-Fi во статусната линија. „Мрежи“ ги наведува оние во опсег; избери една и внеси ја нејзината лозинка, или избери „Постави со телефон“ и внеси го името и лозинката во прелистувачот на твојот телефон наместо на уредот. „Заборави“ отстранува зачувана мрежа.\n\nЛозинките остануваат на картичката, безбедно чувани, и никогаш повторно не се покажуваат. Под „Поврзи се кога е потребно“ поставуваш колку долго Wi-Fi останува вклучен по последната употреба, дали останува вклучен додека се полни, и која зачувана мрежа е прва кога повеќе се во опсег."
