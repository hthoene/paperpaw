lock.plugin.name = Заклучување на екранот
lock.plugin.description = PIN, шема или лозинка кога уредот ќе се разбуди; допирот заклучен додека читаш.
lock.plugin.how = "Заклучувањето на екранот бара PIN, шема или лозинка кога PaperPaw стартува и кога уредот ќе се разбуди. На почеток е исклучено. Спречува само случајна употреба: кодот и бројот на погрешни обиди се чуваат на SD картичката, па кој ќе ја извади, ќе ја уреди или ќе ја замени картичката, го заобиколува заклучувањето.\n\nПостави го во поставките, под Уред, Заклучување на екранот: внеси го кодот што се користи ако има, избери го видот, потоа новиот код двапати. Шема се нуди само на екрани на допир.\n\nПосле пет погрешни обиди следниот чека половина минута. „Заклучи сега“ заклучува веднаш и може да се стави на копче, гест или правило. „Заклучи по будењето“ може да се исклучи, за да заклучува само вистинско стартување (вклучување или рестартирање), освен таму каде што секое будење е стартување, како на X4 на батерија.\n\nЗаклучување на допирот, покрај него: „Заклучи допир“ во брзиот пристап и менито за читање прави допирите, повлекувањата и пенкалото да не прават ништо додека копчињата сè уште работат, на пр. за да читаш со рака на екранот. За да отклучиш, допри двапати со еден прст и задржи го момент; задржувањето на копчето за вклучување го отвора менито Напојување, каде што „Отклучи допир“ го прави тоа со копчињата; на X4 Pro, задржувањето на копчето Почетна отклучува веднаш."
