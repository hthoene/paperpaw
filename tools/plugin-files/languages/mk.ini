translate.plugin.description = Преведува означен текст преку интернет, со DeepL.
translate.plugin.how = "„Превод“ преведува означен текст преку интернет со DeepL. Означи текст во книга и избери „Преведи“ во менито на означениот текст: преводот се појавува над страницата како запис во речник. Копчињата за листање или допирите го лизгаат, а Избери или допир на неговиот крај го затвора.\n\nБара мрежа и сопствен DeepL API-клуч, бесплатен на deepl.com (DeepL API Free, околу 500 000 знаци месечно). Додека не го внесеш, панелот го кажува тоа, а допир го бара.\n\nВо поставките, под Читање, во делот Превод, „Преведи на“ го поставува јазикот; на почеток е јазикот на PaperPaw."
