opds.plugin.name = OPDS каталози
opds.plugin.description = Прелистува OPDS каталози, ги презема нивните книги и ги држи папките синхронизирани со нив.
opds.plugin.how = "OPDS каталозите се библиотеки на интернет како Project Gutenberg, Calibre-Web, Kavita или Komga. Овој додаток ги прелистува и пребарува како папки и ги презема нивните книги во библиотеката.\n\nОтвори „Каталози“ од менито Алатки и избери „Додај каталог“: адреса и, ако каталогот бара сметка, корисничко име и лозинка. Допри каталог за да го прелистуваш; задржи го (со копчиња, задржи Избери) за да го синхронизираш, уредиш или отстраниш.\n\nСо вклучено „Синхронизирај го овој каталог“, „Синхронизирај каталози“ ги презема неговите нови книги во неговата папка. „Книги по синхронизирање“ го ограничува колку книги носи едно синхронизирање, за голем каталог да не го наполни уредот. „Облак папка“ (WebDAV) работи наместо каталог."
