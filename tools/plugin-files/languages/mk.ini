about.title = За PaperPaw
about.intro = Бесплатен читач за уреди со е-мастило, составен од додатоци. Лиценциран според Apache License 2.0; она што го вклучува е лиценцирано како што следува.
about.plugins.title = Вградени додатоци
about.plugins.help = Додатоците со код во овој фирмвер, со нивните верзии. Ажурирањето ги носи истите повторно; ако некое не може, тоа го вели однапред.
