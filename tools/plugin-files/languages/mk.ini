vocabulary.plugin.name = Вокабулар
vocabulary.plugin.description = Ги чува зборовите што ги бараш, со нивните реченици, и повторува картички за учење со распоредено повторување, направени на твојот телефон.
vocabulary.plugin.how = "„Вокабулар“ ги чува зборовите што ги бараш при читање, со реченицата, за повторување. Списокот е во Алатки, најновите први; избран збор пак се бара. Последниот ред, „Извези“, ги зачувува за апликации со картички како Anki. Се чуваат најновите 2000 зборови, постарите се бришат: извезувај за да ги задржиш.\n\n„Картички за учење“, исто во Алатки, испитуваат со распоредено повторување: по „Покажи одговор“ оценуваш Повторно, Тешко, Добро или Лесно, што одлучува кога ќе се врати. Шпилови: „Уредувај со телефон“, скенирај го кодот со телефон на истиот Wi-Fi, па пишувај картички или додај многу одеднаш: во шпил избери „Многу картички одеднаш“ и CSV, TSV или TXT датотека (картичка по ред: предна, задна страна, пример; UTF-8), залепи список или донеси Anki шпил (.apkg, извезен со „Support older Anki versions“).\n\nИли SD картичката: секој шпил како CSV, TSV, TXT или Anki (.apkg, како погоре) датотека во папката Flashcards (Spanish.tsv дава шпил Spanish; формат како погоре; првиот ред може да ги именува колоните front, back, example). Избери „Картички на SD картичката“ во „Картички за учење“ или само отвори ги. Шпиловите и наученото остануваат на читачот; нова или сменета датотека се спојува во шпилот: сменета задна страна или пример ја менува картичката, напредокот останува; сменета предна страна е нова картичка, старата почнува одново (се разликуваат по предната страна, без оглед на празнини и големи букви); избришан ред не брише картичка (освен ако за шпилот „картичките што недостасуваат од датотеката“ е „Отстрани“: тогаш таа со напредокот засекогаш заминува при следното ажурирање, но ништо додека некој ред не се чита). „Зачувај на картичката“ го пишува шпилот во датотеката со броеви на картичките (колона id), па предни страни менуваш на компјутер без губење напредок; таа чува само id, предна, задна страна и пример (без други колони, коментари, редослед), а зачувување се одбива додека некој ред не се чита; првиот пат старата се копира во _name.bak.tsv (подоцна не се заменува). Датотека над 4 MiB или 20 000 реда не се чита; мора да е CSV UTF-8, не UTF-16. Првиот пат се прави папката со упатство.\n\nПод Читање во поставките, „Побараните зборови стануваат картички“ ги става побараните зборови во шпилот „Побарани“."
