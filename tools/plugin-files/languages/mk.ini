dictionary.plugin.name = Речник
dictionary.plugin.description = Бара зборови во StarDict речници.
dictionary.plugin.how = "„Речник“ бара збор од книга во StarDict речници и ги покажува дефинициите во панел над долниот дел од екранот.\n\nВо читачот задржи збор и избери Побарај; со копчиња користи Избери текст под Повеќе. Копирај ги папките на речниците (со датотеки .ifo, .idx и .dict) во папката „dictionaries“ на уредот, подпапките вклучени, или избери друга папка во Поставки, под Читање, како Папка со речници (напредна поставка). Првото барање подготвува мал индекс за секој речник, што одзема момент.\n\nВо панелот, копчињата за листање или Горе и Долу ги листаат долгите дефиниции, а Назад го затвора. Со допир, допри надвор од него за да го затвориш."
