weather.plugin.name = Времето
weather.plugin.description = Времето сега и следните денови како виџети, од Open-Meteo.
weather.plugin.how = "„Времето“ го покажува времето сега и следните денови како виџети за почетниот екран, од Open-Meteo, што не бара сметка или клуч. „Времето сега“ ги покажува температурата, условите и повеќе по избор; „Прогноза“ ги покажува следните денови во ред или список.\n\nНајпрво избери место: во поставките, под Времето, „Место“ (внеси име, потоа избери го од пронајдените места). Се испраќаат само неговите координати, и само додека се прикажува виџет за времето. Додај ги виџетите со уредување на почетниот екран.\n\nВремето се презема најмногу колку што вели „Ажурирај најмногу на секои“, и само додека има мрежа: никогаш сам не го вклучува Wi-Fi.\n\nПодатоците за времето се од Open-Meteo.com (https://open-meteo.com), под лиценцата Creative Commons Attribution 4.0 (CC BY 4.0)."
