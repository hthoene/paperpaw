smart-home.plugin.name = Паметен дом
smart-home.plugin.description = Вредности и прекинувачи од твојот Home Assistant на контролна табла и како виџети на почетниот екран. Работи со Home Assistant на твојата домашна мрежа.
smart-home.plugin.how = "„Паметен дом“ покажува вредности и прекинувачи од твојот Home Assistant: температури, влажност, енергија, врати и прозорци, светла, прекинувачи и сцени. Разговара со твојот сервер преку неговиот REST API на твојата домашна мрежа; ништо не оди низ друга услуга.\n\nОтвори „Паметен дом“ од менито со алатки, потоа „Врска“: внеси ја адресата на твојот Home Assistant (на пример http://homeassistant.local:8123) и долготраен токен за пристап (направи го на дното од страницата на профилот во Home Assistant). Токенот се чува меѓу лозинките и клучевите, никогаш во датотека со поставки. Обичен http се користи само за адреси на твојата домашна мрежа; за сервер на друго место вклучи „Сервери надвор од домашната мрежа“ во поставките и користи https со важечки сертификат.\n\n„Избери ентитети“ отвора список со она што го има твојот сервер: пребарај по име или id и избери ентитет за да го прикажеш (избери го повторно за да го тргнеш). Можеш да му дадеш соба, која го групира на контролната табла и во виџетите за соби. Се чуваат до 24 ентитети. На контролната табла избери светло, прекинувач или сцена за да го префрлиш: редот го покажува одговорот на серверот. Сензор што ќе го избереш се чита повторно.\n\nВиџети (задржи го почетниот екран, потоа додај виџет): „Паметен дом вредност“ покажува едно мерење големо, „група“ ги наведува ентитетите на една соба, „прекинувач“ е копче за едно светло или прекинувач, а „соба“ е картичка со мерењата и прекинувачите на една соба. Поставките на секој виџет кажуваат кој ентитет или соба го покажува.\n\nДомот се чита кога ќе ја отвориш контролната табла, кога ќе побараш (редот „Освежи“ или допир на виџет за вредност или група), кога читачот ќе се разбуди таму каде што Wi-Fi е веќе вклучен, и по распоредот што го поставуваш додека е приклучен полначот. Никогаш сам не го вклучува радиото и никогаш не го држи вклучено."
