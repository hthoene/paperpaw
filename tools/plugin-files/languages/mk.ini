widgets.plugin.name = Пакет виџети
widgets.plugin.description = Многу повеќе виџети за почетниот екран: часовници, календар, цитати, книги, белешки и друго.
widgets.plugin.how = "Пакетот виџети додава многу виџети за почетниот екран: часовници (аналоген, со зборови, со плочки, светски), календар, годината досега, одбројување, месечева фаза, и ден и датум; цитат на денот, белешки, задачи, слики, поздрав и логото на PaperPaw; а за книги, што читам сега, напредок, следна, серии, омилени, истакнување и библиотеката во броеви. Во него има и виџет за батеријата.\n\nДодај ги со „Уреди почетен екран“ во менито (или долг допир на почетниот екран), потоа „Додај виџет“. Секој има свои поставки, како рамка, големина и порамнување. Изборот на виџет што се менува, како цитатот на денот, го покажува следниот. Твоите цитати одат во quotes.txt во .paperpaw/plugins/widgets на картичката, секој ред како текст | автор. Виџетите за време бараат поставен часовник; Wi-Fi го поставува."
