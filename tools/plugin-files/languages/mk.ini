tasks.plugin.name = Задачи
tasks.plugin.description = Списоци со задачи со рокови и приоритети, на читачот или синхронизирани со твојот CalDAV сервер, со виџети за почетниот екран.
tasks.plugin.how = "Списоци со задачи на твојот читач: задачи со рок и приоритет, штиклирани кога се готови. Работат без поставување и без мрежа, и може да се одржуваат во чекор со CalDAV сервер (Nextcloud, Radicale, Baïkal, Fastmail и други), па истите списоци се на твојот телефон и компјутер.\n\nОтвори „Задачи“ од менито со алатки. Првиот ред го именува прикажаниот список; избери го за друг список, за „Денес и задоцнети“ низ сите списоци, за нов список, за синхронизирање или за поставување на сметката. „Додај задача“ ја отвора тастатурата. Избери на задача ја штиклира (повторно: не е готова). Задржи задача или притисни Мени за да го промениш нејзиниот наслов, рок (денес, утре, за недела дена, или датум што го пишуваш како 2026-12-24) или приоритет, или за да ја отстраниш. Отворените задачи се први, по денот и потоа по приоритет; готовите остануваат на крајот една недела (се поставува под Задачи во поставките), потоа го напуштаат читачот.\n\nВиџети за почетниот екран (задржи го почетниот екран, потоа додај виџет): „Задачи денес“ покажува што е за денес или задоцнето, „Список со задачи“ покажува еден список, „Отворени задачи“ ги брои, а „Следна задача“ ја покажува оваа што е следна. Допир на задача во виџет ја штиклира; допир на наслов ги отвора списоците.\n\nЗа синхронизирање, избери „CalDAV сметка“ од редот на списокот и внеси ја адресата на серверот, твоето корисничко име и лозинка (најдобро лозинка за апликација). Доволна е адресата на серверот, на пр. cloud.example.com/remote.php/dav; читачот оттаму ги наоѓа твоите списоци со задачи. Секој список со задачи на серверот станува список на читачот. Читачот синхронизира кога ќе ги отвориш „Задачи“, кога ќе избереш „Синхронизирај сега“ и кога мрежата е вклучена и онака; она што го менуваш без мрежа чека и се испраќа подоцна. Ако задача е променета на читачот и некаде на друго место во меѓувреме, се зема верзијата од серверот, а твојата се чува како нова задача покрај неа, па ништо не се губи. Белешките, алармите и сè друго што задачата го има на серверот остануваат какви што се. Задачите што се повторуваат се прикажуваат, но се менуваат таму каде што си ги направил. Читачот држи до 200 задачи во 12 списоци."
