menu.plugin.name = Мени
menu.plugin.description = Менито на дното од екранот, со дејства и поставки.
menu.plugin.how = "Менито наведува што можеш да правиш и поставуваш. Се отвора на дното од екранот, над она што е отворено: додека читаш, допри ја средината на екранот или притисни Избери. Допри или избери ставка за да ја извршиш.\n\nПоставките во менито ја покажуваат својата вредност и се менуваат на место, па менито останува отворено. Ставка со повеќе ставки отвора подмени.\n\nПовлечи надолу од горниот раб за брзиот пристап: она што често го менуваш, како копчиња. Допри копче за да го префрлиш, задржи го за неговите поставки. Само со копчиња, стрелките избираат, Избери префрлува, а Назад затвора. Под Изглед, „Менија“ ги прикажува менијата како список или како плочки."
