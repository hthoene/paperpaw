aids.plugin.name = Помагала за читање
aids.plugin.description = Задебелени почетоци на зборови, заменети зборови, слики: текст каков што го сакаш.
aids.plugin.how = "Помагалата за читање менуваат како изгледа текстот на книгата додека читаш. Важат за секоја книга. „Задебелени почетоци на зборови“ и „Замена на зборови“ се исклучени на почеток.\n\nЌе ги најдеш во Поставки, под Читање, во делот Помагала за читање. „Задебелени почетоци на зборови“ ја поставува првата половина од секој збор задебелено, што некои го сметаат за полесно за следење. „Замена на зборови“ зема парови запишани како „бр. = број; стр. = страница“, одвоени со точка и запирка.\n\nСе заменуваат само цели зборови, точно како што си ги запишал, па „бр.“ никогаш не менува дел од подолг збор. Самата датотека на книгата не се менува.\n\nСликите во книгите може да се прикажуваат (како на почеток), да се заменат со кратка линија како „[Слика: брод на море]“ што го користи описот на сликата, или да се изостават. Страницата тогаш има повеќе место за текст, а за слика што не се прикажува ништо не се декодира, па страниците се листаат побрзо. Стриповите и другите книги составени од слики не се менуваат."
