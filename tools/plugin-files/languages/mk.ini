plugin-manager.plugin.name = Управувач со додатоци
plugin-manager.plugin.description = Ги наведува додатоците и ги вклучува и исклучува.
plugin-manager.plugin.how = "Управувачот со додатоци го наведува секој додаток со неговата верзија и опис, и ги вклучува и исклучува додатоците.\n\nЌе го најдеш во Поставки, како „Управувај со додатоци“. „Поставки на додатоци“ е посебна страница за преференции како употребата на мрежа на секој додаток. Допри додаток за да го вклучиш или исклучиш (со копчиња, избери го). Промената важи по рестартирање: лентата на дното потоа нуди „Рестартирај сега“. Задржи додаток (со копчиња, задржи Избери) за да прочиташ како работи.\n\nДодаток означен „Секогаш вклучен“ не може да се исклучи, а оној означен „Потребен“ дури откако друг додаток ја презема неговата работа, инаку PaperPaw не би имал пат назад. Под „Екрани“ избираш кој додаток го прикажува местото што го нудат повеќе."
