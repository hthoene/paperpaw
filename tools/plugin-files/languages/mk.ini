update.plugin.name = Ажурирање
update.plugin.description = Инсталира ажурирања на фирмверот, од картичката или преземени од интернет.
update.plugin.how = "„Ажурирање“ инсталира нов фирмвер, на уреди каде што PaperPaw е фирмверот, како X4. Ќе го најдеш во поставките, како „Ажурирање“.\n\n„Пребарај онлајн“ го прашува серверот за ажурирања за понов PaperPaw и го презема, што одзема неколку минути преку Wi-Fi. Или копирај датотека за ажурирање (што завршува на .bin, од paperpaw.org) во папката updates на картичката, на пример со „Пренос преку Wi-Fi“. „Инсталирај“ потоа трае околу минута и уредот се рестартира; книгите, поставките и местата на читање остануваат.\n\nСо „Барај ажурирања“ вклучено (во поставките, исклучено на почеток), уредот сам прашува околу еднаш неделно, само додека Wi-Fi е вклучен и онака или се полни. Понов PaperPaw што ќе го најде чека тука; ништо не го прекинува твоето читање. Пребарувањето испраќа што работи уредот, без име или број на него; за броење уреди, и дали си побарал и дали е тоа првото пребарување за денот, неделата или месецот.\n\nАко додатоците што ги користиш сè уште немаат верзија за новото издание, ажурирањето ги чека. Постара верзија се инсталира само ако ја избереш.\n\nДруг фирмвер, како CrossPoint, исто така се инсталира од тука: стави ја неговата датотека (што завршува на .bin) во папката updates и отвори „Ажурирање“. PaperPaw проверува дали е цел фирмвер за овој уред, неоштетен, но не може да каже кој го направил, бидејќи не е потпишан. „Сепак инсталирај“ го запишува во другата половина од флеш-меморијата, а уредот го стартува; PaperPaw останува во својата половина додека тој фирмвер не инсталира нешто врз неа. За да се вратиш на PaperPaw подоцна, инсталирај ја неговата инсталациона датотека (paperpaw-<device>-<version>-install.bin) од менито на другиот фирмвер, како CrossPoint-овото ажурирање на фирмверот од SD."
