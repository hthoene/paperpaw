pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Тајмер за фокус со кругови на работа и пауза, виџети и дневен збир.
pomodoro.plugin.how = "Pomodoro тајмер: работи во фокусирани кругови, потоа одмори се. Не бара поставување: 25 минути фокус, 5 одмор, а по четири круга долга пауза од 15.\n\nОтвори „Pomodoro“ од менито со алатки и притисни „Почни“, или додај ги неговите виџети на почетниот екран (задржи го почетниот екран, потоа додај виџет): „Pomodoro тајмер“ ја покажува фазата и преостанатите минути, „Pomodoro почни/паузирај“ е копче, а „Pomodoro денес“ ги брои завршените кругови, со твојата дневна цел. Допир на тајмерот го почнува или паузира; задржи го за да го отвориш целиот екран.\n\nТајмерот продолжува да работи кога ќе го напуштиш екранот, и продолжува според часовникот по рестартирање. Додека читачот спие ништо не работи: фаза што завршила во меѓувреме се јавува кога ќе се разбуди. Известување ти кажува кога фазата е завршена. За да штеди батерија, часовникот се ажурира еднаш во минута (на секои десет секунди во последната минута на целиот екран) и никогаш не го држи читачот буден.\n\nПод „Pomodoro“ во поставките ги поставуваш должините и круговите на еден сет, и дали следната фаза почнува сама. Под „Повеќе“: блесок на екранот или трепкање на предното светло кога фазата завршува, и дневна цел."
