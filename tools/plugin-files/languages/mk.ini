rules.plugin.name = Правила
rules.plugin.description = Кога ќе се случи нешто, прави нешто: на пр. ноќен режим во 22:00.
rules.plugin.how = "Правилото прави нешто само кога ќе се случи нешто: ноќен режим секој ден во 22:00, или каталозите синхронизирани кога PaperPaw стартува.\n\nПравилата се во Поставки под Прилагодување, како „Правила“. „Додај правило“ прашува Кога? (PaperPaw стартува, време од денот, отворена или затворена книга, батеријата, полнењето, прекинувач и друго) и Што тогаш? (изврши дејство, вклучи или исклучи прекинувач, постави број, покажи порака). Допри правило за да го паузираш; задржи го (со копчиња, задржи Избери) за услов како „Меѓу две времиња од денот“, или за да го отстраниш.\n\nДејствата, прекинувачите и броевите за избор доаѓаат по додаток: избери го додатокот, потоа што носи; назад излегува од него. Дејство што работи на прикажаниот екран, како „Назад“ или „Следна страница“, го прави она што би го направило ако се притисне таму.\n\nВремињата важат кој и да е екран отворен. Две правила што постојано се поништуваат запираат по неколку чекори."
