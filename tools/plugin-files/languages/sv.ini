files.plugin.name = Filbläddrare
files.plugin.description = Visar och öppnar böcker och mappar på enheten.
files.plugin.how = "Biblioteket visar böckerna i din biblioteksmapp, var och en med omslag, titel, författare och hur långt du har läst. Boken du läste senast ligger överst som ett kort, så du kan fortsätta läsa med ett tryck på skärmen eller på Välj. Medan biblioteket söker efter böcker visar det hur många som hittats hittills.\n\nVälj vad som visas ovanför böckerna: alla, de du läser, olästa eller färdiglästa, eller hyllorna (efter författare, serie, tagg, favoriter, nästa bok i varje serie du har börjat på). Tryck på en bok för att läsa den; håll på den (med knappar, håll Välj) för att öppna den, markera den som färdigläst eller oläst, se information om den, flytta den till arkivet eller radera den. Tryck på titeln för biblioteksmenyn: sortering och visning av böcker, sökning, biblioteksmapp och inställningar.\n\nBiblioteksmappen anges under Bibliotek i Inställningar, som Biblioteksmapp; där kan du också visa böcker som ett rutnät av omslag. För alla andra filer, använd Filer i menyn Verktyg."
