update.plugin.name = Uppdatering
update.plugin.description = Installerar systemuppdateringar från kortet eller hämtade från internet.
update.plugin.how = "Uppdatering installerar ny fast programvara på enheter där PaperPaw är den fasta programvaran, som X4. Du hittar det som Uppdatering i inställningarna.\n\nSök på nätet frågar uppdateringsservern efter en nyare PaperPaw och hämtar den, vilket tar några minuter via Wi-Fi. Du kan också kopiera en uppdateringsfil (slutar på .bin, från paperpaw.org) till mappen updates på kortet, till exempel med Wi-Fi-överföring. Installationen tar sedan ungefär en minut och enheten startas om; böcker, inställningar och läspositioner behålls.\n\nMed Sök efter uppdateringar på (i inställningarna, av från början) söker enheten själv ungefär en gång i veckan, bara när Wi-Fi ändå är på eller enheten laddas. En nyare PaperPaw som hittas väntar här; inget stör din läsning. En sökning skickar information om vad enheten kör, men inget namn eller nummer för den; för att räkna enheter skickas också om du bad om sökningen och om det är dess första sökning för dagen, veckan eller månaden.\n\nOm tillägg du använder ännu saknar en version för den nya utgåvan väntar uppdateringen på dem. En äldre version installeras bara om du väljer den.\n\nAnnan fast programvara, som CrossPoint, kan också installeras här: lägg dess fil (slutar på .bin) i mappen updates och öppna Uppdatering. PaperPaw kontrollerar att det är en komplett och oskadad fast programvara för enheten, men kan inte avgöra vem som gjort den eftersom den inte är signerad. Installera ändå skriver den till den andra halvan av flashminnet och enheten startar den; PaperPaw finns kvar i sin halva tills den fasta programvaran installerar något över den. För att återgå till PaperPaw senare, installera dess installationsfil (paperpaw-<device>-<version>-install.bin) från den andra fasta programvarans meny, till exempel CrossPoints SD firmware update."
