vocabulary.sd.readme = "Ordkort från filer\n\nLägg en fil här för varje kortlek: Spanish.tsv skapar kortleken Spanish.\nFiler: .tsv, .csv eller .txt, sparade som UTF-8, eller .apkg: en Anki-kortlek exporterad med Support older Anki versions markerat. Anteckningarnas tre första fält blir framsida, baksida och exempel; schemaläggning och media läses inte, och PaperPaw skriver aldrig en Anki-fil.\n\nEtt kort per rad: framsida, baksida och ett exempel (valfritt), skilda med tabb, komma eller semikolon. Första raden kan ange kolumnnamnen: front, back, example. Exempel:\n\nKatze\tkatt\tDie Katze schläft.\n\nÖppna sedan Ordkort på läsaren, välj Kort på SD-kortet och sedan Uppdatera kortlekarna från kortet.\n\nBra att veta:\n- Kortlekarna finns kvar på läsaren med det du lärt dig. En fil läses när den är ny eller ändrad, och dess kort läggs till i kortleken eller ändras där.\n- Ändra baksidan eller exemplet för ett kort i filen: kortet ändras och behåller din inlärningshistorik.\n- Ändra ett korts framsida: det räknas som ett nytt kort och det gamla börjar om. Kort matchas med framsidans text; blanksteg och stora bokstäver räknas inte. Spara en kortlek till en fil (Kort på SD-kortet, Spara kortleken på kortet) så får varje kort ett nummer i kolumnen id: ändra en framsida där, behåll filens två första rader som de är, så behåller kortet det du lärt dig.\n- Sparning skriver kortlekens kort. Sådant i filen som inte är kort (en rad utan framsida) sparas inte; den tidigare filen kopieras till _name.bak.tsv.\n- Spara filen som CSV UTF-8 (inte UTF-16 eller ett kalkylprograms eget format). En fil över 4 MiB eller 20 000 rader läses inte: dela upp den.\n- En rad du raderar i filen raderar inte kortet i kortleken om du inte slår på Ta bort saknade kort för kortleken. Då försvinner kortet med det du lärt dig.\n- Filer vars namn börjar med _ läses inte.\n"
