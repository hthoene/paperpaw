update.plugin.name = Обновление
update.plugin.description = Устанавливает обновления прошивки с карты или загруженные из интернета.
update.plugin.how = "Обновление устанавливает новую прошивку на устройствах, где PaperPaw является прошивкой, например на X4. Оно находится в настройках под названием «Обновление».\n\nПоиск онлайн запрашивает у сервера обновлений более новый PaperPaw и загружает его; по Wi-Fi это занимает несколько минут. Или скопируйте файл обновления (с расширением .bin, с paperpaw.org) в папку updates на карте, например через передачу по Wi-Fi. Установка занимает около минуты, затем устройство перезапускается; книги, настройки и позиции чтения сохраняются.\n\nЕсли включено «Искать обновления» (в настройках, сначала выключено), устройство само спрашивает примерно раз в неделю, только когда Wi-Fi и так включён или идёт зарядка. Найденный более новый PaperPaw ждёт здесь; чтение ничто не прерывает. Поиск отправляет сведения о том, что работает на устройстве, без имени и номера самого устройства; для подсчёта устройств также отправляется, спрашивали ли вы и первый ли это поиск за день, неделю или месяц.\n\nЕсли у используемых вами плагинов ещё нет версии для нового выпуска, обновление ждёт их. Более старая версия устанавливается, только если вы её выберете.\n\nДругую прошивку, например CrossPoint, тоже можно установить отсюда: положите её файл (с расширением .bin) в папку updates и откройте «Обновление». PaperPaw проверяет, что это целая прошивка для этого устройства и она не повреждена, но не может определить, кто её создал, так как она не подписана. «Всё равно установить» записывает её во вторую половину флеш-памяти, и устройство запускает её; PaperPaw остаётся в своей половине, пока эта прошивка не установит что-то поверх. Чтобы позже вернуться к PaperPaw, установите его установочный файл (paperpaw-<device>-<version>-install.bin) из меню другой прошивки, например из обновления прошивки с SD-карты в CrossPoint."
