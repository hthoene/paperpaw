joplin.plugin.name = Синхронизация заметок
joplin.plugin.description = Хранит выделения и заметки каждой книги в одной заметке. Работает с Joplin (Joplin Cloud, Joplin Server или WebDAV).
joplin.title = Синхронизация заметок
joplin.send = Отправлять в Joplin
joplin.send.help = Экспортированные заметки отправляются сразу. Не отправленные заметки ждут и уходят при следующем экспорте, при этом действии или по правилу.
joplin.service = Синхронизация с
joplin.service.help = С чем Joplin синхронизируется, как задано в Joplin: Joplin Cloud, ваш Joplin Server или папка WebDAV, например Nextcloud. Компьютер включать не нужно.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = Адрес
joplin.address.help = Joplin Server: его адрес, например joplin.example.org. WebDAV: папка, с которой синхронизируется Joplin, как в его настройках, например dav.example.org/Joplin.
joplin.email = Эл. почта
joplin.user = Имя пользователя
joplin.user.help = Joplin Cloud и Joplin Server: адрес эл. почты для входа (двухфакторный вход пока не поддерживается). WebDAV: имя пользователя папки.
joplin.password = Пароль
joplin.password.help = Хранится вместе с другими паролями и ключами на этом устройстве. Для Nextcloud подойдёт и пароль приложения.
joplin.secret = Пароль Joplin
joplin.not-kept = Не удалось сохранить пароль на этом устройстве.
joplin.notebook = Блокнот
joplin.notebook.help = Блокнот, который PaperPaw создаёт в Joplin, с отдельной заметкой для каждой книги. Повторный экспорт обновляет заметку, в том числе перенесённую в другой блокнот.
joplin.idle = Экспортированные заметки сразу отправляются в Joplin.
joplin.waiting.one = Заметки к {count} книге ждут отправки.
joplin.waiting.other = Заметки к {count} книгам ждут отправки.
joplin.waiting.few = Заметки к {count} книгам ждут отправки.
joplin.waiting.many = Заметки к {count} книгам ждут отправки.
joplin.sent.one = Заметки к {count} книге уже в Joplin.
joplin.sent.other = Заметки к {count} книгам уже в Joplin.
joplin.sent.few = Заметки к {count} книгам уже в Joplin.
joplin.sent.many = Заметки к {count} книгам уже в Joplin.
joplin.some-failed = Отправлено в Joplin: {sent}. Не отправлено: {failed}; они будут отправлены позже.
joplin.apart.one = {count} заметка изменена в Joplin, поэтому рядом создана новая.
joplin.apart.other = {count} заметки изменены в Joplin, поэтому рядом созданы новые.
joplin.apart.few = {count} заметки изменены в Joplin, поэтому рядом созданы новые.
joplin.apart.many = {count} заметок изменено в Joplin, поэтому рядом создано столько же новых.
joplin.nothing = Нет заметок, ожидающих отправки в Joplin.
joplin.no-network = Для отправки в Joplin нужна сеть. Заметки подождут и будут отправлены позже.
joplin.setup-needed = Сначала настройте Joplin: куда синхронизировать, учётную запись и пароль.
joplin.no-time = Время пока неизвестно. Заметки подождут и будут отправлены позже.
joplin.unreachable = Не удаётся связаться с Joplin. Заметки подождут и будут отправлены позже.
joplin.failed = Joplin ответил ошибкой ({status}). Заметки подождут и будут отправлены позже.
joplin.bad-login = Joplin не принял эл. почту, имя пользователя или пароль. Проверьте их в настройках Joplin.
joplin.no-server = По этому адресу нет Joplin Server. Проверьте адрес в настройках Joplin.
joplin.bad-address = PaperPaw не может использовать этот адрес. Проверьте его в настройках Joplin.
joplin.no-data = По этому адресу нет заметок Joplin. Проверьте адрес или сначала синхронизируйте с ним Joplin.
joplin.encrypted = В Joplin включено сквозное шифрование. PaperPaw не умеет шифровать заметки, поэтому ничего не отправляет.
joplin.newer-target = Joplin хранит там заметки в более новом формате, чем знает этот PaperPaw. Обновите PaperPaw, чтобы их отправлять.
joplin.older-target = Joplin хранит там заметки в более старом формате. Откройте Joplin, чтобы обновить его, и отправьте снова.
joplin.upgrading = Joplin как раз обновляет там заметки. Они подождут и будут отправлены позже.
joplin.no-memory = Недостаточно памяти для отправки заметок. Перезапустите и повторите.
