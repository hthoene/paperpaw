vocabulary.sd.save.unreadable = Не удалось прочитать список связанных файлов, поэтому ничего не записано. Проверьте карту и повторите попытку.
vocabulary.sd.save.full = Карта заполнена, поэтому ничего не записано. Освободите место и повторите попытку.
vocabulary.sd.save.too-large = Эта колода слишком велика для одного файла (4 MiB — максимум, который читает обновление). Файл на карте не изменён.
