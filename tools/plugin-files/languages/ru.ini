core.setting.hyphen-min-left.help = Наименьшее число букв, остающихся до переноса. 0: по правилам языка.
core.setting.hyphen-min-right.help = Наименьшее число букв, переносимых после переноса. 0: по правилам языка.
core.setting.indent.help = Делать отступ в первой строке каждого абзаца.
core.setting.paragraph-spacing.help = Оставлять место между абзацами, с отступом первой строки или без него.
core.setting.margin-ends.help = Место над текстом и под ним. Пока не изменено, как боковые поля.
core.setting.footnotes.help = Нажатая отметка сноски (1, [2], *) показывает сноску поверх страницы или переходит к ней.
core.setting.publisher-styles = Оформление издателя
core.setting.publisher-styles.help = Использовать собственную вёрстку книги; выкл.: простой текст.
core.setting.font-weight = Насыщенность шрифта
core.setting.font-weight.help = Более тёмный, жирный текст с любым шрифтом; помогает на светлых экранах.
core.setting.smooth-text = Сглаживание текста
core.setting.smooth-text.help = Мягкие серые края. На чёрно-белых экранах каждая страница мигает, медленнее.
core.setting.text-contrast = Контраст текста
core.setting.text-contrast.help = Насколько тёмными рисуются буквы. Кривая тона из темы заменяет эту настройку.
core.setting.text-sharpness = Резкость
core.setting.text-sharpness.help = Насколько чёткими выглядят буквы. Резкие плотнее и чище, мягкие легче.
core.setting.word-spacing = Расстояние между словами
core.setting.word-spacing.help = Базовый пробел между словами; 100 % — как в шрифте. Строки по ширине могут его увеличить.
core.setting.book-align = Выравнивание книги
core.setting.book-align.help = Текст по центру и по правому краю, как задано в книге.
core.setting.book-indent = Отступы книги
core.setting.book-indent.help = Отступы первой строки и висячие отступы, как задано в книге.
core.setting.book-sizes = Размеры текста книги
core.setting.book-sizes.help = Более крупный и мелкий текст, как задано в книге.
core.setting.book-spacing = Интервалы книги
core.setting.book-spacing.help = Расстояния вокруг абзацев, как задано в книге.
core.setting.book-fonts = Шрифты книги
core.setting.book-fonts.help = Шрифты, которые приносит книга, если устройство их показывает.
core.setting.book-margins = Поля книги
core.setting.book-margins.help = Цитаты, стихи и списки с отступами, как задано в книге.
core.setting.book-line-height = Межстрочный интервал книги
core.setting.book-line-height.help = Межстрочный интервал книги вместо вашего.
core.setting.line-breaking = Разбиение на строки
core.setting.line-breaking.help = Сбалансированное делает строки ровнее; быстрое разбивает их по одной.
core.setting.korean-breaks = Переносы в корейском
core.setting.korean-breaks.help = По слогам — переносы где угодно, как в печати; по словам — слова остаются целыми. Только для корейского.
core.setting.hanging-punctuation = Висячая пунктуация
core.setting.hanging-punctuation.help = Кавычки, точки, запятые и дефисы выносятся за границу текста, чтобы его края выглядели ровными.
core.setting.letter-spacing = Расстояние между буквами
core.setting.letter-spacing.help = Расстояние между буквами; при 0 % как в шрифте.
core.setting.kerning = Кернинг
core.setting.kerning.help = Пары букв вроде AV ставятся ближе, как указано в шрифте.
core.setting.ligatures = Лигатуры
core.setting.ligatures.help = fi, fl и ff соединяются в одну букву, если это есть в шрифте.
core.setting.indent-size = Размер отступа
core.setting.indent-size.help = Насколько отступают первые строки относительно размера шрифта.
core.setting.paragraph-space = Расстояние между абзацами
core.setting.paragraph-space.help = Сколько места между абзацами относительно строки.
core.setting.scope-only = Только эта книга
core.setting.scope-only.help = Изменения шрифта и вёрстки действуют только для этой книги (отмечено •).
core.setting.edge-ends = Края для свайпа: сверху и снизу
core.setting.edge-sides = Края для свайпа: слева и справа
core.setting.edge.help = Насколько близко к краю свайп считается краевым; 0: выкл.
core.setting.developer = Параметры разработчика
core.setting.library-folder = Папка библиотеки
