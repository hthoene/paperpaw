files.plugin.name = Обзор файлов
files.plugin.description = Показывает книги и папки на устройстве и открывает их.
files.plugin.how = "В библиотеке перечислены книги из вашей папки с книгами: у каждой есть обложка, название, автор и сколько вы уже прочитали. Книга, которую вы читали последней, лежит сверху карточкой, поэтому продолжить чтение можно одним касанием или одним нажатием «Выбор». Пока библиотека ищет книги, она показывает, сколько уже нашла.\n\nНад книгами выберите, что показывать: все книги, читаемые, непрочитанные или прочитанные либо полки (по автору, серии, тегу, избранное, следующая книга каждой начатой серии). Коснитесь книги, чтобы читать; удерживайте её (на кнопках — удерживайте «Выбор»), чтобы открыть, отметить прочитанной или непрочитанной, посмотреть сведения, перенести в архив или удалить. Коснитесь названия, чтобы открыть меню библиотеки: сортировка и вид книг, поиск, папка библиотеки и настройки.\n\nПапка библиотеки задаётся в разделе «Настройки» › «Библиотека» › «Папка библиотеки»; там же можно показывать книги сеткой обложек. Для всех остальных файлов используйте «Файлы» в меню «Инструменты»."
