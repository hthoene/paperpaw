vocabulary.setting.sd-folder.help = На SD-карте: файл CSV, TSV или Anki в ней — это колода.
vocabulary.sd.readme = "Карточки из файлов\n\nПоложите сюда по файлу на каждую колоду: Spanish.tsv создаёт колоду Spanish.\nФайлы: .tsv, .csv или .txt, сохранённые в UTF-8, или .apkg: колода Anki, экспортированная с отмеченным параметром «Поддержка старых версий Anki». Первые три поля её заметок становятся лицевой стороной, обратной стороной и примером; расписание и медиа не читаются, а PaperPaw никогда не записывает файл Anki.\n\nОдна карточка в каждой строке: лицевая сторона, обратная и пример (необязательно), разделённые табуляцией, запятой или точкой с запятой. Первая строка может содержать названия столбцов: front, back, example. Пример:\n\nKatze\tcat\tDie Katze schläft.\n\nЗатем откройте «Карточки» на устройстве, выберите «Карточки на SD-карте», а потом «Обновить колоды с карты».\n\nПолезно знать:\n- Колоды остаются на устройстве вместе с вашим прогрессом. Файл читается, когда он новый или изменён, а его карточки добавляются в колоду или изменяются там.\n- Измените обратную сторону или пример карточки в файле: карточка изменится и сохранит ваш прогресс.\n- Измените текст лицевой стороны карточки: она будет считаться новой, а старая начнёт заново. Карточки сопоставляются по тексту лицевой стороны, пробелы и регистр не учитываются. Сохраните колоду в файл («Карточки на SD-карте», «Сохранить колоду на карту»), и у каждой карточки появится номер в столбце id: измените там лицевую сторону, оставив первые две строки файла как есть, и карточка сохранит ваш прогресс.\n- Сохранение записывает карточки колоды. То, что было в файле и не является карточкой (строка без лицевой стороны), не сохраняется; прежний файл копируется в _имя.bak.tsv.\n- Сохраняйте файл как CSV UTF-8 (не UTF-16 и не собственный формат электронной таблицы). Файл больше 4 MiB или длиннее 20 000 строк не читается: разделите его.\n- Строка, удалённая в файле, не удаляет карточку в колоде, если для этой колоды не включено «Удалять отсутствующие карточки». Тогда карточка исчезает вместе с прогрессом.\n- Файлы, имена которых начинаются с _, не читаются.\n"
