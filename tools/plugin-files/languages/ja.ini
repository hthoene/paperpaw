vocabulary.sd.readme = "ファイルから単語カード\n\nデッキごとに、ここにファイルを置いてください。Spanish.tsv なら、デッキ「Spanish」ができます。\n使えるファイル：.tsv、.csv、.txt(UTF-8で保存したもの)、または .apkg(「古いAnkiバージョンをサポート」をオンにして書き出したAnkiデッキ)。ノートの最初の3つの項目が、表面、裏面、例文になります。スケジュールとメディアは読み込まれず、PaperPawがAnkiファイルに書き込むことはありません。\n\n1行に1枚のカードを、表面、裏面、例文(省略可)の順に、タブ、カンマ、セミコロンで区切って書きます。1行目に列の名前(front, back, example)を書いてもかまいません。例：\n\nKatze\tcat\tDie Katze schläft.\n\nそのあとリーダーで単語カードを開き、「SDカードのカード」、続いて「カードからデッキを更新」を選びます。\n\n知っておくと便利なこと：\n- デッキは学習の記録とともにリーダーに残ります。ファイルは新しいか変更されたときに読み込まれ、そのカードがデッキに追加されるか、デッキ内で変更されます。\n- ファイルでカードの裏面や例文を変更すると、カードが変わり、学習の進み具合は残ります。\n- カードの表面を変更すると、新しいカードとして扱われ、古いカードは最初からやり直しになります。カードは表面の文字で照合され、スペースと大文字小文字は区別されません。デッキをファイルに保存すると(SDカードのカード、デッキをSDカードに保存)、すべてのカードに id 列の番号がつきます。そこで表面を変更し、ファイルの最初の2行はそのままにしておけば、学習の記録は残ります。\n- 保存すると、デッキのカードが書き込まれます。ファイルにあってもカードでないもの(表面のない行)は保存されません。もとのファイルは _name.bak.tsv にコピーされます。\n- ファイルはCSV UTF-8で保存してください(UTF-16や表計算ソフト独自の形式は不可)。4 MiBまたは20,000行を超えるファイルは読み込まれないので、分割してください。\n- ファイルで行を削除しても、そのデッキのカードは削除されません。ただし、そのデッキで「ファイルにないカードを削除」をオンにした場合は別です。その場合、カードは学習の記録とともに削除されます。\n- 名前が _ で始まるファイルは読み込まれません。\n"
