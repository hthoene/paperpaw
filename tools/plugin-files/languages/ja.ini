files.plugin.name = ファイルブラウザ
files.plugin.description = 端末内の本とフォルダを一覧にして開きます。
files.plugin.how = "ライブラリには、ライブラリフォルダ内の本が、表紙・タイトル・著者・読み進めた割合とともに並びます。最後に読んだ本は一番上にカードで表示されるので、1回タップするか、決定ボタンを1回押すだけで続きを読めます。本を探している間は、これまでに見つかった冊数が表示されます。\n\n本の上で、表示する内容を選べます。すべて、読んでいる本、未読の本、読み終えた本、または本棚（著者別、シリーズ別、タグ別、お気に入り、読み始めたシリーズの次の本）です。本をタップすると読めます。長押し（ボタン操作では決定ボタンを長押し）すると、開く、読了または未読にする、情報を見る、アーカイブへ移す、削除する、ができます。タイトルをタップするとライブラリメニューが開き、本の並べ方と表示、検索、ライブラリフォルダ、設定を選べます。\n\nライブラリフォルダは、設定のライブラリで「ライブラリフォルダ」から選びます。ここで本を表紙のグリッドで表示することもできます。そのほかのファイルは、ツールメニューのファイルを使ってください。"
