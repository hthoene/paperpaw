update.plugin.description = SDカードまたはインターネットから、ファームウェアのアップデートをインストールします。
update.plugin.how = "アップデートは、X4のようにPaperPawがファームウェアになっている端末で、新しいファームウェアをインストールします。設定の「アップデート」にあります。\n\n「オンラインで検索」は、更新サーバーに新しいPaperPawがあるか問い合わせてダウンロードします。Wi-Fiで数分かかります。または、アップデートファイル(paperpaw.org の .bin ファイル)を、Wi-Fi転送などでSDカードの updates フォルダにコピーしてください。インストールは約1分で、その後端末が再起動します。本、設定、読書位置はそのまま残ります。\n\n「アップデートを確認」(設定内、初期状態はオフ)をオンにすると、Wi-Fiがすでにオンのとき、または充電中に限り、端末が約1週間に1回自動で問い合わせます。新しいPaperPawが見つかるとここで待機し、読書の邪魔はしません。検索で送られるのは端末で動作している内容のみで、端末の名前や番号は送りません。端末数の集計のため、あなたが操作したかどうかと、その日・週・月で最初の検索かどうかも送られます。\n\n使用中のプラグインに新しいバージョン用の版がまだない場合は、それができるまでアップデートを待ちます。古いバージョンは、選んだ場合のみインストールされます。\n\nCrossPointなど別のファームウェアも、ここからインストールできます。ファイル(.bin)を updates フォルダに入れて、アップデートを開いてください。PaperPawは、この端末用の完全で壊れていないファームウェアかどうかを確認しますが、署名がないため作成者までは分かりません。「そのままインストール」を選ぶと、フラッシュのもう一方の領域に書き込まれ、端末がそれを起動します。そのファームウェアが上書きするまで、PaperPawは元の領域に残ります。後でPaperPawに戻すには、他のファームウェアのメニュー(CrossPointのSDファームウェアアップデートなど)から、PaperPawのインストールファイル(paperpaw-<device>-<version>-install.bin)をインストールしてください。"
