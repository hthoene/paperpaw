update.plugin.name = עדכון
update.plugin.description = מתקין עדכוני קושחה, מהכרטיס או שהורדו מהאינטרנט.
update.plugin.how = "“עדכון” מתקין קושחה חדשה, במכשירים ש-PaperPaw היא הקושחה שלהם, כמו X4. תמצאו אותו בהגדרות, בשם “עדכון”.\n\n“חיפוש באינטרנט” שואל את שרת העדכונים אם יש PaperPaw חדש יותר ומוריד אותו, מה שנמשך כמה דקות ב-Wi-Fi. אפשר גם להעתיק קובץ עדכון (שמסתיים ב-.bin, מ-paperpaw.org) לתיקייה updates בכרטיס, למשל באמצעות העברה ב-Wi-Fi. “התקנה” נמשכת אז כדקה והמכשיר מופעל מחדש; הספרים, ההגדרות ומיקומי הקריאה נשארים.\n\nעם “חיפוש עדכונים” (בהגדרות, כבוי בהתחלה) המכשיר שואל מעצמו בערך פעם בשבוע, רק כשה-Wi-Fi דלוק בכל מקרה או כשהוא נטען. PaperPaw חדש יותר שנמצא ממתין כאן; דבר לא מפריע לקריאה. חיפוש שולח את מה שרץ במכשיר, בלי שם או מספר שלו; לצורך ספירת מכשירים גם אם שאלתם ואם זה החיפוש הראשון שלו ביום, בשבוע או בחודש.\n\nאם לתוספים שבהם אתם משתמשים עדיין אין גרסה למהדורה החדשה, העדכון ממתין להם. גרסה ישנה יותר מותקנת רק אם תבחרו בה.\n\nאפשר להתקין מכאן גם קושחה אחרת, כמו CrossPoint: הניחו את הקובץ שלה (שמסתיים ב-.bin) בתיקייה updates ופתחו “עדכון”. PaperPaw בודקת שזו קושחה שלמה ותקינה למכשיר הזה, אך אינה יכולה לדעת מי יצר אותה, כי היא אינה חתומה. “התקנה בכל זאת” כותבת אותה לחצי השני של הזיכרון, והמכשיר מפעיל אותה; PaperPaw נשארת בחצי שלה עד שהקושחה ההיא מתקינה משהו מעליה. כדי לחזור ל-PaperPaw מאוחר יותר, התקינו את קובץ ההתקנה שלה (paperpaw-<device>-<version>-install.bin) מתפריט הקושחה האחרת, כמו עדכון קושחה מכרטיס SD ב-CrossPoint."
