files.plugin.name = דפדפן קבצים
files.plugin.description = מציג רשימה של הספרים והתיקיות במכשיר ופותח אותם.
files.plugin.how = "הספרייה מציגה את הספרים שבתיקיית הספרייה שלך, כל אחד עם הכריכה, הכותרת, המחבר וכמה קראת ממנו. הספר שקראת אחרון עומד בראש כרטיס, כך שהמשך הקריאה דורש הקשה אחת, או לחיצה אחת על בחירה. בזמן שהספרייה מחפשת ספרים, היא מציגה כמה כבר נמצאו.\n\nמעל הספרים אפשר לבחור מה יוצג: כולם, אלה שבקריאה, שלא נקראו או שנקראו עד הסוף, או המדפים (לפי מחבר, סדרה, תג, מועדפים, הספר הבא בכל סדרה שהתחלת). יש להקיש על ספר כדי לקרוא בו; להחזיק אותו לחוץ (בכפתורים, להחזיק את בחירה) כדי לפתוח אותו, לסמן אותו כנקרא או כלא נקרא, לראות את פרטיו, להעביר אותו לארכיון או למחוק אותו. יש להקיש על הכותרת לתפריט הספרייה: איך ספרים ממוינים ומוצגים, חיפוש, תיקיית הספרייה והגדרות.\n\nתיקיית הספרייה נקבעת בהגדרות, תחת ספרייה, בשם תיקיית הספרייה; שם אפשר גם להציג את הספרים כרשת של כריכות. לכל שאר הקבצים יש את קבצים בתפריט הכלים."
files.title = ספרייה
files.empty = יש להעתיק ספרים (EPUB, FB2, TXT ועוד) לתיקייה “{dir}” ממחשב, או להשיג אותם דרך Wi-Fi: העברה דרך Wi-Fi וקטלוגים נמצאים בכלים, וגם Calibre לאחר שיתווסף.
