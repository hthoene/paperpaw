update.not-dual.warning = "PaperPaw תתקין כאן עדכונים. אם בכל זאת מותקנת במכשיר קושחה אחרת, העדכון עלול לדרוס אותה. PaperPaw מופעלת מחדש כדי להחיל זאת.\nכדי לבטל מאוחר יותר: “עדכונים”, “זיהוי dual-boot מחדש”, או dual-boot = auto ב-paperpaw.ini."
