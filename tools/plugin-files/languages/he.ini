update.dual-boot.help = PaperPaw חולקת את המכשיר עם קושחה אחרת, ולכן לא מתקינה כאן עדכונים. עדכנו את PaperPaw עם הכלי ששימש להגדרה. אין קושחה שנייה במכשיר? ציינו זאת בלחצן למטה, או התקינו את PaperPaw שוב דרך USB ב-paperpaw.org/flash.
