vocabulary.web.import-help = הוסיפו קובץ CSV, TSV או TXT עם כרטיסייה בכל שורה, או חפיסה שיוצאה מ-Anki (‎.apkg, עם “Support older Anki versions”), או הדביקו רשימה. הכרטיסיות נכנסות לחפיסה הזו. כל שורה: צד קדמי, גב ודוגמה (אופציונלי), מופרדים בטאב, בפסיק או בנקודה ופסיק. דוגמה: Katze;cat;Die Katze schläft. הקבצים חייבים להיות טקסט UTF-8; לכל היותר 20,000 כרטיסיות בחפיסה.
