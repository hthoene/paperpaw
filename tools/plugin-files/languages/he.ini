vocabulary.sd.readme = "כרטיסיות מקבצים\n\nהניחו כאן קובץ לכל חפיסה: Spanish.tsv יוצר את החפיסה Spanish.\nקבצים: ‎.tsv, ‎.csv או ‎.txt, שמורים כ-UTF-8, או ‎.apkg: חפיסת Anki, שיוצאה כשהאפשרות Support older Anki versions מסומנת. שלושת השדות הראשונים של ההערות שלה הופכים לצד קדמי, גב ודוגמה; התזמון והמדיה שלה לא נקראים, ו-PaperPaw לעולם לא כותבת קובץ Anki.\n\nכרטיסייה אחת בכל שורה: צד קדמי, גב ודוגמה (אופציונלי), מופרדים בטאב, בפסיק או בנקודה ופסיק. השורה הראשונה יכולה לתת שמות לעמודות: front, back, example. דוגמה:\n\nKatze\tcat\tDie Katze schläft.\n\nאחר כך פתחו “כרטיסיות” בקורא, בחרו “כרטיסיות בכרטיס SD” ואז “עדכון החפיסות מהכרטיס”.\n\nטוב לדעת:\n- החפיסות נשארות בקורא, עם מה שלמדתם. קובץ נקרא כשהוא חדש או שהשתנה, והכרטיסיות שלו נוספות לחפיסה או משתנות שם.\n- שנו את הגב או את הדוגמה של כרטיסייה בקובץ: הכרטיסייה משתנה ושומרת על ההתקדמות שלכם.\n- שנו את הטקסט בצד הקדמי של כרטיסייה: היא נחשבת לכרטיסייה חדשה, והישנה מתחילה מחדש. כרטיסיות מזוהות לפי הטקסט בצדן הקדמי; רווחים ואותיות רישיות לא נחשבים. שמרו חפיסה בקובץ (“כרטיסיות בכרטיס SD”, “שמירת החפיסה בכרטיס”) ולכל כרטיסייה יהיה מספר בעמודה id: שנו שם צד קדמי, השאירו את שתי השורות הראשונות של הקובץ כמות שהן, והכרטיסייה שומרת על מה שלמדתם.\n- השמירה כותבת את הכרטיסיות של החפיסה. מה שהיה בקובץ ואינו כרטיסייה (שורה בלי צד קדמי) לא נשמר; הקובץ שהיה שם מועתק אל _name.bak.tsv.\n- שמרו את הקובץ כ-CSV UTF-8 (לא UTF-16, ולא בפורמט של גיליון אלקטרוני). קובץ מעל 4 MiB או 20,000 שורות לא נקרא: פצלו אותו.\n- שורה שמחקתם בקובץ לא מוחקת את הכרטיסייה בחפיסה, אלא אם הפעלתם “הסרת כרטיסיות חסרות” לחפיסה הזו. אז הכרטיסייה נעלמת עם מה שלמדתם.\n- קבצים ששמם מתחיל ב-_ לא נקראים.\n"
