files.plugin.name = Przeglądarka plików
files.plugin.description = Wyświetla i otwiera książki i foldery na urządzeniu.
files.plugin.how = "Biblioteka wyświetla książki z folderu biblioteki: okładkę, tytuł, autora i postęp czytania. Ostatnio czytana książka jest kartą na górze: wystarczy dotknąć jej lub nacisnąć Wybierz, aby czytać dalej. Podczas wyszukiwania książek biblioteka podaje, ile już znalazła.\n\nNad książkami wybierz widok: wszystkie, czytane, nieprzeczytane lub przeczytane albo półki (według autora, serii, etykiety, ulubionych, następnego tomu rozpoczętych serii). Dotknij książki, aby ją czytać; przytrzymaj ją (przyciskami: przytrzymaj Wybierz), aby otworzyć, oznaczyć jako przeczytaną lub nieprzeczytaną, zobaczyć informacje, przenieść do archiwum lub usunąć. Dotknij tytułu, aby otworzyć menu biblioteki: sortowanie, widok, wyszukiwanie, folder biblioteki i ustawienia.\n\nFolder wybierzesz w Ustawieniach, Biblioteka, Folder biblioteki; tam możesz też wyświetlić książki jako siatkę okładek. Do pozostałych plików służą Pliki w menu Narzędzia."
