update.plugin.name = Aktualizacja
update.plugin.description = Instaluje aktualizacje oprogramowania z karty lub pobrane z internetu.
update.plugin.how = "Aktualizacja instaluje nowe oprogramowanie na urządzeniach, których oprogramowaniem jest PaperPaw, takich jak X4. Znajdziesz ją w ustawieniach pod nazwą Aktualizacja.\n\nSzukaj online pyta serwer o nowszy PaperPaw i pobiera go, co zajmuje kilka minut przez Wi-Fi. Możesz też skopiować plik aktualizacji (.bin, z paperpaw.org) do folderu updates na karcie, np. przez Transfer Wi-Fi. Instalacja trwa około minuty, potem urządzenie uruchamia się ponownie; książki, ustawienia i pozycje czytania pozostają.\n\nPo włączeniu Szukaj aktualizacji w ustawieniach (domyślnie wyłączone) urządzenie samo sprawdza mniej więcej raz w tygodniu, tylko gdy Wi-Fi już działa lub trwa ładowanie. Znaleziony nowy PaperPaw czeka tutaj i nie przerywa czytania. Wyszukiwanie wysyła używaną wersję, bez nazwy ani numeru urządzenia; do liczenia urządzeń również informację, czy wyszukiwanie uruchomiono ręcznie i czy jest pierwsze tego dnia, tygodnia lub miesiąca.\n\nJeśli używana wtyczka nie ma jeszcze zgodnej wersji, aktualizacja czeka. Starsza wersja instaluje się tylko po wybraniu.\n\nMożna stąd zainstalować też inne oprogramowanie, np. CrossPoint: umieść jego plik .bin w folderze updates i otwórz Aktualizację. PaperPaw sprawdza, czy jest to kompletne, nieuszkodzone oprogramowanie dla tego urządzenia, ale nie może ustalić autora, bo nie jest podpisane. Zainstaluj mimo to zapisuje je w drugiej połowie pamięci flash i urządzenie je uruchamia; PaperPaw pozostaje w swojej połowie, dopóki inne oprogramowanie go nie nadpisze. Aby wrócić do PaperPaw, zainstaluj jego plik instalacyjny (paperpaw-<device>-<version>-install.bin) z menu drugiego oprogramowania, np. SD firmware update w CrossPoint."
