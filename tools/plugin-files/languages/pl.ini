vocabulary.setting.sd-auto.help = Fiszki odczytują nowe lub zmienione pliki w folderze.
vocabulary.setting.sd-folder = Folder plików talii
vocabulary.setting.sd-folder.help = Na karcie SD: plik CSV, TSV lub Anki w tym folderze jest talią.
vocabulary.sd.readme = "Fiszki z plików\n\nUmieść tu plik dla każdej talii: Hiszpański.tsv tworzy talię Hiszpański.\nPliki: .tsv, .csv lub .txt, zapisane w UTF-8, albo .apkg: talia Anki wyeksportowana z zaznaczonym Support older Anki versions. Pierwsze trzy pola notatek stają się przodem, tyłem i przykładem; harmonogram i multimedia nie są odczytywane, a PaperPaw nigdy nie zapisuje pliku Anki.\n\nJedna fiszka w wierszu: przód, tył i opcjonalny przykład, oddzielone tabulatorem, przecinkiem lub średnikiem. Pierwszy wiersz może podawać nazwy kolumn: front, back, example. Przykład:\n\nKatze\tkot\tDie Katze schläft.\n\nNastępnie otwórz Fiszki na czytniku, wybierz Fiszki na karcie SD i Zaktualizuj talie z karty.\n\nWarto wiedzieć:\n- Talie pozostają na czytniku z postępem nauki. Plik jest odczytywany, gdy jest nowy lub zmieniony; fiszki są dodawane do talii lub w niej zmieniane.\n- Zmień tył lub przykład fiszki w pliku: fiszka się zmieni i zachowa postęp.\n- Zmień tekst przodu: to nowa fiszka, a stara zaczyna od nowa. Fiszki są dopasowywane według tekstu przodu, bez uwzględniania spacji i wielkości liter. Zapisz talię w pliku (Fiszki na karcie SD, Zapisz talię na karcie), a każda fiszka otrzyma numer w kolumnie id: zmień tam przód, zachowując dwa pierwsze wiersze bez zmian, a fiszka zachowa postęp nauki.\n- Zapis obejmuje fiszki z talii. To, co nie jest fiszką (wiersz bez przodu), nie zostaje zachowane; poprzedni plik jest kopiowany do _name.bak.tsv.\n- Zapisz jako CSV UTF-8 (nie UTF-16 ani format własny arkusza). Plik ponad 4 MiB lub 20 000 wierszy nie jest odczytywany: podziel go.\n- Usunięcie wiersza w pliku nie usuwa fiszki z talii, chyba że włączysz Usuń brakujące fiszki dla tej talii. Wtedy fiszka zniknie wraz z postępem nauki.\n- Pliki o nazwach zaczynających się od _ nie są odczytywane.\n"
