bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Péireálann cianrialtáin, méarchláir agus braiteoirí, agus ceanglaíonn leo.
bluetooth.plugin.how = "Péireálann Bluetooth cianrialtáin, méarchláir agus braiteoirí leis an léitheoir, nuair atá Bluetooth aige (an X4 Pro).\n\nCuardaíonn Cuir gléas leis an méid atá i ngar; cuir an gléas sa mhód péireála ar dtús. Roghnaigh é, agus deimhnigh ar an léitheoir (déan comparáid idir na huimhreacha nuair a thaispeántar ceann). Ansin casann eochracha cianrialtáin nó méarchláir leathanaigh agus bogann siad trí roghchláir; athraigh cad a dhéanann gach eochair faoi Rialtáin.\n\nDeir Cianrialtáin cathain a oibríonn a n-eochracha: nuair atá siad air anseo, agus tú ag léamh (ceangailte fad atá leabhar ar oscailt, ceallra á shábháil), nó i gcónaí. Déanann an cnaipe roghchláir nó brú fada ar ghléas dearmad air.\n\nIs do bhreiseáin braiteoir: cuir air cé acu breiseán a fhéadfaidh é a úsáid. Tá Bluetooth as aon uair nach n-úsáideann aon rud é."
