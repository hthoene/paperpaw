calibre.plugin.name = Leabharlann gan sreang
calibre.plugin.description = Faigheann leabhair thar an líonra. Oibríonn mar ghléas gan sreang do calibre.
calibre.plugin.how = "Cuireann Leabharlann gan sreang an gléas le feiceáil i Calibre ar do ríomhaire mar ghléas gan sreang. Ansin is féidir le Calibre leabhair a sheoladh chuige, iad a liostú agus iad a scriosadh. Téann na leabhair isteach sa leabharlann.\n\nOscail Leabharlann gan sreang ón roghchlár Uirlisí, agus an gléas agus an ríomhaire ar an líonra Wi-Fi céanna. I Calibre roghnaigh Ceangail/roinn, ansin Tosaigh ceangal gléis gan sreang. Nuair a bhíonn do ríomhaire aimsithe ag an ngléas, taispeánann sé a ainm; tapáil Ceangail (le cnaipí, brúigh Roghnaigh). Is féidir le Calibre leabhair a chur leis agus a scriosadh anseo, mar sin ná ceangail ach le do ríomhaire féin. Cuireann dúnadh an scáileáin deireadh leis an gceangal.\n\nMura n-aimsítear Calibre ina aonar, cuir isteach seoladh a ríomhaire sna Socruithe, faoi Leabharlann, mar Seoladh sa chuid Calibre. Má úsáideann Calibre port seachas 9090, cuir leis é mar :port, m.sh. 192.168.1.20:9091."
