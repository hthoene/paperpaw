menu-editor.plugin.name = Eagarthóir roghchlár
menu-editor.plugin.description = Athordaíonn, baineann agus cuireann iontrálacha gach roghchláir leis.
menu-editor.plugin.how = "Athraíonn an t-eagarthóir roghchlár cad atá sna roghchláir: bog iontrálacha suas nó síos, bain iad, nó cuir cinn nua leis.\n\nFaigheann tú é sna Socruithe faoi Saincheapú, mar Saincheap roghchláir. Roghnaigh roghchlár, ansin iontráil chun í a bhogadh nó a bhaint; cuireann Cuir iontráil leis ceann nua isteach. Baineann athruithe i bhfeidhm láithreach. Tugann Athshocraigh an roghchlár seo roghchlár ar ais mar a shainmhíníonn a bhreiseáin é, déanann Athshocraigh gach roghchlár amhlaidh do gach ceann.\n\nNí féidir leat tú féin a ghlasáil amach: fanann iontráil is bealach chuig na socruithe go dtí go gcuireann tú bealach eile chucu leis."
