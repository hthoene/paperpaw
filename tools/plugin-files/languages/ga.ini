home.plugin.name = Scáileán baile
home.plugin.description = An leathanach tosaigh: leathanaigh giuirléidí, ar nós an leabhair atá á léamh agus na huirlisí.
home.plugin.how = "Tá an scáileán baile déanta de leathanaigh, gach ceann ina eangach giuirléidí agus uirlisí mar atá ar fhón. Ar dtús tá an clog, an leabhar atá á léamh agat agus na leabhair a léadh le déanaí ar leathanach amháin, agus gach uirlis ar an gceann eile.\n\nTapáil mír chun í a oscailt, agus scuab nó úsáid na cnaipí leathanaigh chun leathanaigh a athrú. Le cnaipí amháin, bogann na cnaipí saighde ó mhír amháin go dtí an chéad cheann eile agus osclaíonn Roghnaigh í.\n\nChun é a athchóiriú, coinnigh an scáileán baile síos, tapáil an peann luaidhe faoin leathanach nó roghnaigh Cuir scáileán baile in eagar sa roghchlár. Tarraing míreanna chun iad a bhogadh nó tapáil ceann le haghaidh a roghanna, le cnaipí freisin. Tá Cuir giuirléid leis ann freisin. Tá Colúin agus Sraitheanna sna socruithe, faoi Cuma, sa roinn Scáileán baile.\n\nAr scáileán a casadh ar a thaobh, taispeánann an scáileán baile na míreanna céanna le níos mó colún, gach leathanach líonta sula dtosaíonn an chéad cheann eile, agus cártaí nach bhfuil níos leithne ná thart ar 110 mm; ní athraítear aon rud a d'eagraigh tú ingearach. Má eagraíonn tú ar a thaobh é, coinnítear an leagan amach sin don treoshuíomh sin ar leith: cuirtear giuirléidí nua leis an dá cheann. Téann Athshocraigh leagan amach cothrománach i Cuir leis (agus tú ag cur in eagar) ar ais go dtí an ceann díorthaithe. Ní bhainfidh giuirléid nó uirlis a bhaint ar threoshuíomh amháin den cheann eile í."
