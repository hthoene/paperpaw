stats.plugin.name = Staitisticí léitheoireachta
stats.plugin.description = Taifeadann cá fhad agus cé mhéad a léann tú, le féilire agus uimhreacha gach leabhair.
stats.plugin.how = "Taifeadann Staitisticí léitheoireachta cá fhad a léann tú gach leathanach. Feiceann tú é mar fhorbhreathnú le inniu, an tseachtain agus do shraith, mar fhéilire, agus le huimhreacha gach leabhair.\n\nOscail é ó Uirlisí, nó ó Tuilleadh sa léitheoir. Sna socruithe, faoi Staitisticí léitheoireachta, is féidir leat Taifead léamh a chur as, Sprioc laethúil a shocrú, agus an Leathanach is giorra agus an Leathanach is faide a áirítear a shocrú, ionas nach ndéanann leathanaigh a iompú go tapa nó leabhar a fhágtar ar oscailt na huimhreacha a shaobhadh.\n\nComhroinneann Sioncrónaigh le KOReader na staitisticí le KOReader trí fhillteán WebDAV. Glacann sé isteach freisin staitisticí KOReader ar an ngléas céanna. Teastaíonn an clog a bheith socraithe le taifeadadh: mura bhfuil, ceangail le Wi-Fi uair amháin."
