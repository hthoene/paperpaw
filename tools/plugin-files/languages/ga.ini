files.plugin.name = Brabhsálaí comhad
files.plugin.description = Liostaíonn leabhair agus fillteáin ar an ngléas agus osclaíonn iad.
files.plugin.how = "Liostaíonn an leabharlann na leabhair i d'fhillteán leabharlainne, gach ceann lena chlúdach, teideal, údar agus cé chomh fada is a léigh tú é. Seasann an leabhar a léigh tú go deireanach ar bharr mar chárta, mar sin ní thógann sé ach tapáil amháin, nó brú amháin ar Roghnaigh, leanúint ar aghaidh ag léamh. Fad atá an leabharlann ag cuardach leabhar, insíonn sí cé mhéad a d'aimsigh sí go dtí seo.\n\nRoghnaigh cad a thaispeántar os cionn na leabhar: iad uile, na cinn a bhfuil tú á léamh, na cinn gan léamh nó críochnaithe, nó na seilfeanna (de réir údair, sraithe, clibe, ceanán, an chéad leabhar eile de gach sraith a thosaigh tú). Tapáil leabhar chun é a léamh; coinnigh síos é (le cnaipí, coinnigh Roghnaigh síos) chun é a oscailt, é a mharcáil mar chríochnaithe nó gan léamh, a fhaisnéis a fheiceáil, é a bhogadh go dtí an chartlann nó é a scriosadh. Tapáil an teideal le haghaidh roghchlár na leabharlainne: conas a shórtáiltear agus a thaispeántar leabhair, cuardach, fillteán na leabharlainne agus socruithe.\n\nSocraítear fillteán na leabharlainne sna Socruithe, faoi Leabharlann, mar Fillteán leabharlainne; is ann freisin is féidir leabhair a thaispeáint mar eangach clúdach. Le haghaidh gach comhad eile, úsáid Comhaid sa roghchlár Uirlisí."
