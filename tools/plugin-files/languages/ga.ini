wifi.plugin.name = Wi-Fi
wifi.plugin.description = Ceanglaíonn le líonraí Wi-Fi nuair is gá agus cuireann an raidió as ina dhiaidh.
wifi.plugin.how = "Ceanglaíonn Wi-Fi le líonra nuair a bhíonn an t-idirlíon de dhíth ar bhreiseán (catalóg, sioncrónú, an siopa, aistriú) agus cuireann an raidió as arís nóiméad tar éis nach n-úsáideann aon rud é, nó láithreach nuair a thaispeántar Baile nó leabhar, chun ceallra agus cuimhne a shábháil.\n\nOscail Wi-Fi ó Shocruithe, nó ón mír Wi-Fi sa líne stádais. Liostaíonn Líonraí na cinn i ngar; roghnaigh ceann agus clóscríobh a fhocal faire, nó roghnaigh Socraigh le guthán agus clóscríobh an t-ainm agus an focal faire i mbrabhsálaí do ghutháin in ionad ar an ngléas. Baineann Déan dearmad líonra sábháilte.\n\nFanann na focail faire ar an gcárta, coinnithe go sábháilte, agus ní thaispeántar arís iad. Faoi Ceangail nuair is gá socraíonn tú cá fhad a fhanann Wi-Fi air tar éis an úsáide deireanaí, an bhfanann sé air fad atá sé ag luchtú, agus cén líonra sábháilte a thagann ar dtús nuair atá roinnt i ngar."
