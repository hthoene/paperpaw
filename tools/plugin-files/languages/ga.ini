translate.plugin.name = Aistriúchán
translate.plugin.description = Aistríonn téacs roghnaithe ar líne, le DeepL.
translate.plugin.how = "Aistríonn Aistriúchán téacs roghnaithe ar líne le DeepL. Roghnaigh téacs i leabhar agus roghnaigh Aistrigh i roghchlár an téacs roghnaithe: taispeántar an t-aistriúchán os cionn an leathanaigh cosúil le hiontráil foclóra. Scrollaíonn na cnaipí leathanaigh nó tapáil é, agus dúnann Roghnaigh nó tapáil ag a dheireadh é.\n\nTá líonra agus eochair API DeepL de do chuid féin de dhíth air, saor in aisce ag deepl.com (DeepL API Free, thart ar 500,000 carachtar in aghaidh na míosa). Go dtí go gcuireann tú isteach í, deir an painéal é, agus iarrann tapáil uirthi.\n\nSna socruithe, faoi Léamh, sa roinn Aistriúchán, socraíonn Aistrigh go an teanga; ar dtús is teanga PaperPaw féin í."
