aids.plugin.name = Áiseanna léitheoireachta
aids.plugin.description = Tús focal i gcló trom, focail in ionad a chéile, pictiúir: téacs mar is mian leat é.
aids.plugin.how = "Athraíonn áiseanna léitheoireachta cén chuma atá ar théacs leabhair agus tú ag léamh. Baineann siad le gach leabhar. Tá Tús focal i gcló trom agus Cuir focail in ionad as ar dtús.\n\nFaigheann tú iad sna Socruithe, faoi Léamh, sa roinn Áiseanna léitheoireachta. Cuireann Tús focal i gcló trom an chéad leath de gach focal i gcló trom, rud a fhaigheann roinnt daoine níos éasca le leanúint. Glacann Cuir focail in ionad péirí scríofa mar “anso = anseo; ionnsaigh = ionsaigh”, scartha le leathstad.\n\nNí chuirtear in ionad ach focail iomlána, díreach mar a scríobh tú iad, mar sin ní athraíonn “anso” cuid de fhocal níos faide choíche. Ní athraítear comhad an leabhair féin.\n\nIs féidir pictiúir i leabhair a thaispeáint (mar a bhíonn ar dtús), iad a iompú ina líne ghearr ar nós “[Pictiúr: long ar muir]” a úsáideann cur síos an phictiúir, nó iad a fhágáil ar lár. Ansin bíonn níos mó spáis ar leathanach don téacs, agus ní dhéantar aon rud a dhíchódú do phictiúr nach dtaispeántar, rud a fhágann go n-iompaítear leathanaigh níos tapúla. Ní athraítear greannáin ná leabhair eile atá déanta de phictiúir."
