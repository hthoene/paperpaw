setup.end.help = Cuir leabhair isteach san fhillteán “/books” ar an ngléas le ríomhaire, nó seol thar Wi-Fi iad ó ghuthán nó ó ríomhaire (Uirlisí, Aistriú Wi-Fi). Tugann catalóga leo iad freisin, agus Calibre nuair a chuirtear leis é. Is féidir gach rud a roghnaítear anseo a athrú sna socruithe.
