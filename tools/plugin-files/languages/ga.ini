format-cbz.plugin.description = Osclaíonn cartlanna greannán (.cbz), pictiúr an leathanach.
format-cbz.plugin.how = "Osclaíonn cartlanna greannán (.cbz): pictiúr an leathanach, oiriúnaithe don scáileán, in ord a n-ainmneacha (2 roimh 10).\n\nCuir isteach san fhillteán leabharlainne iad agus oscail ón leabharlann iad; iompaigh na leathanaigh mar in aon leabhar. Tógann pictiúir mhóra nóiméad an chéad uair, ar an X4 níos mó ná in áiteanna eile.\n\nSocruithe léitheoireachta (Socruithe, Léamh): taispeánann “Painéal ar phainéal” painéal amháin de leathanach ag an am, chomh mór agus a cheadaíonn an scáileán, agus téann iompú leathanach trí na painéil; taispeántar leathanach gan painéil ina iomláine. Tugann “Treo leathanach greannáin” iompú leathanach scáthánaithe do manga (ón taobh deas go clé); deir ComicInfo.xml an leabhair féin é ina aonar. Taispeánann an leabharlann teideal leabhair agus a shraith agus a uimhir ó ComicInfo.xml."
