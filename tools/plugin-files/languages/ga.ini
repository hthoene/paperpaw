koreader.plugin.name = Comhroinnt aibhsithe
koreader.plugin.description = Comhroinneann leabharmharcanna agus aibhsithe le KOReader do leabhair a léitear sa dá cheann.
koreader.plugin.how = "Comhroinneann an breiseán seo leabharmharcanna agus aibhsithe le KOReader do leabhair a léann tú sa dá cheann, ar ghléas amháin nó i bhfillteán leabharlainne atá sioncrónaithe idir gléasanna. Níl aon rud le socrú.\n\nNuair a osclaíonn PaperPaw leabhar a d'oscail KOReader freisin, agus nuair a athraíonn tú a leabharmharcanna nó a aibhsithe, glacann sé leis an méid atá nua ó shonraí KOReader le hais an leabhair agus fágann sé an méid atá nua anseo do KOReader le tógáil an chéad uair eile a osclaíonn sé an leabhar. Téann marcanna bainte agus nótaí athraithe trasna freisin.\n\nOibríonn sé seo do leabhair EPUB amháin. Mura féidir comhad taobh amháin a léamh, ní athraíonn aon rud ar thaobh ar bith go dtí go mbíonn sé indéanta."
koreader.removed-there = Níl aon aibhsithe i gcomhad KOReader a thuilleadh. An mbainfear anseo iad freisin?
