reader.plugin.name = Léitheoir
reader.plugin.description = Taispeánann leabhair leathanach ar leathanach, le clár ábhair agus socruithe léitheoireachta.
reader.plugin.how = "Taispeánann an léitheoir leabhair leathanach ar leathanach. Oscail leabhar ón leabharlann; is féidir an leabhar deireanach a athoscailt ag an tús (an socrú Oscail an leabhar deireanach ag an tús).\n\nTapáil clé nó deas an scáileáin, nó úsáid na cnaipí leathanaigh, chun leathanaigh a iompú. Tapáil an lár nó brúigh Roghnaigh don roghchlár léitheoireachta: Ábhar, Cuardach, Téigh go leathanach, Clófhoireann agus leagan amach, Leabharmharcanna agus aibhsithe agus tuilleadh. Osclaíonn síos ón imeall uachtair an painéal tapa, téann suas ón imeall íochtair go dtí an baile; déanann Ar ais a choinneáil síos amhlaidh freisin.\n\nCoinnigh Roghnaigh síos (nó coinnigh pictiúr síos) chun pictiúr a fheiceáil lánscáileáin: téann Clé agus Deas trí phictiúir an leathanaigh. Súmálann Roghnaigh go 2x, 3x agus ar ais (tapáil faoi dhó ar thadhall); súmáilte, bogann Clé agus Deas ar leataobh, bogann na cnaipí leathanaigh (nó scuabthaí) ar aghaidh trasna agus síos. Filleann Ar ais ar oiriúnú, ansin ar an leathanach (coinnigh síos ar thadhall chun imeacht). Tapáil an cúinne uachtarach deas le haghaidh leabharmharc. Coinnigh focal síos chun é a aibhsiú. Le cnaipí, coinnigh Clé síos: bogann Clé agus Deas de réir focail, na cnaipí leathanaigh de réir líne, téann siad go himill an leathanaigh agus de réir míre nuair a choinnítear síos iad; osclaíonn Roghnaigh an barra aibhsithe don fhocal, leathnaíonn Roghnaigh a choinneáil síos é go dtí an abairt agus an mhír (ansin bogann Clé agus Deas an deireadh, an tús nuair a choinnítear síos iad). Leanann roghnú ar aghaidh thar iompuithe leathanaigh. Sábhálann Easpórtáil mar Markdown do nótaí."
