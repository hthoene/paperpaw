opds.plugin.name = Catalóga OPDS
opds.plugin.description = Brabhsálann catalóga OPDS, íoslódálann a leabhair agus coinníonn fillteáin sioncrónaithe leo.
opds.plugin.how = "Is leabharlanna ar líne iad catalóga OPDS ar nós Project Gutenberg, Calibre-Web, Kavita nó Komga. Brabhsálann an breiseán seo iad agus cuardaíonn sé iad cosúil le fillteáin agus íoslódálann a leabhair isteach sa leabharlann.\n\nOscail Catalóga ón roghchlár Uirlisí agus roghnaigh Cuir catalóg leis: seoladh agus, má tá cuntas ag teastáil ón gcatalóg, ainm úsáideora agus focal faire. Tapáil catalóg chun é a bhrabhsáil; coinnigh síos é (le cnaipí, coinnigh Roghnaigh síos) chun é a shioncrónú, a chur in eagar nó a bhaint.\n\nLe Sioncrónaigh an chatalóg seo air, íoslódálann Sioncrónaigh catalóga a leabhair nua isteach ina fhillteán. Cuireann Leabhair in aghaidh an tsioncrónaithe teorainn le cé mhéad a fhaigheann sioncrónú amháin, ionas nach líonann catalóg mhór an gléas. Oibríonn Fillteán scamaill (WebDAV) in ionad catalóige."
