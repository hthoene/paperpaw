setup.plugin.description = Treoir ghearr trí na socruithe a bhfuil tábhacht leo, ag an gcéad tús.
setup.plugin.how = "Is treoir ghearr é Socrú trí na socruithe a bhfuil tábhacht leo, a thaispeántar uair amháin, an chéad uair a thosaíonn PaperPaw. Fiafraíonn gach leathanach rud amháin, ar nós na teanga, na gcnaipí, méid an téacs, an chrios ama, Wi-Fi nó cúpla breiseán le cur leis, agus freagra ciallmhar roghnaithe cheana, mar sin bíonn Ar aghaidh ceart i gcónaí. Fágtar ar lár na céimeanna nach bhfuil de dhíth ar an ngléas seo.\n\nTapáil na cnaipí, nó úsáid na cnaipí suas agus síos agus Roghnaigh. Fágann Scipeáil ar an gcéad leathanach an socrú láithreach. Insíonn an leathanach deireanach cá dtagann do leabhair.\n\nChun é a rith arís, oscail na socruithe agus roghnaigh Socraigh PaperPaw. Is féidir gach rud a roghnaítear anseo a athrú sna socruithe níos déanaí."
