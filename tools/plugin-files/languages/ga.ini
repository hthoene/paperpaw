profiles.plugin.name = Próifílí léitheoireachta
profiles.plugin.description = Tacair ainmnithe de shocruithe léitheoireachta agus taispeána, athraithe le tapáil.
profiles.plugin.how = "Coinníonn próifíl do shocruithe léitheoireachta, do shocruithe taispeána agus do línte stádais faoi ainm, ar nós Oíche nó Cló mór, agus tugann ar ais iad le tapáil.\n\nOscail Próifílí sa roghchlár léitheoireachta faoi Tuilleadh, nó sna Socruithe faoi Saincheapú. Tapáil próifíl chun í a úsáid; tá an ceann atá in úsáid marcáilte. Coinnigh síos í (le cnaipí, coinnigh Roghnaigh síos) chun na socruithe reatha a shábháil inti, í a athainmniú nó í a bhaint. Coinníonn Sábháil mar phróifíl nua an méid atá socraithe anois.\n\nAthraíonn An chéad phróifíl eile go dtí an chéad cheann eile sa liosta; cuir ar chnaipe nó i riail é."
