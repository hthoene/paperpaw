weather.plugin.name = Aimsir
weather.plugin.description = An aimsir anois agus sna laethanta seo chugainn mar ghiuirléidí, ó Open-Meteo.
weather.plugin.how = "Taispeánann Aimsir an aimsir anois agus sna laethanta seo chugainn mar ghiuirléidí don scáileán baile, ó Open-Meteo, nach dteastaíonn cuntas ná eochair uaidh. Taispeánann Aimsir anois an teocht, an riocht agus tuilleadh le roghnú; taispeánann Réamhaisnéis na laethanta seo chugainn i sraith nó i liosta.\n\nRoghnaigh áit ar dtús: sna socruithe, faoi Aimsir, Áit (clóscríobh ainm, ansin roghnaigh ó na háiteanna a aimsítear). Ní sheoltar ach a chomhordanáidí, agus fad a thaispeántar giuirléid aimsire amháin. Cuir na giuirléidí leis trí scáileán an bhaile a chur in eagar.\n\nFaightear an aimsir chomh minic ar a mhéad agus a deir Nuashonraigh gach ... ar a mhéad, agus nuair atá líonra ann amháin: ní chuireann sé Wi-Fi air ina aonar riamh.\n\nSonraí aimsire ó Open-Meteo.com (https://open-meteo.com), faoin gceadúnas Creative Commons Attribution 4.0 (CC BY 4.0)."
