reading-goal.plugin.name = Sprioc léitheoireachta
reading-goal.plugin.description = Nóiméid le léamh in aghaidh an lae, agus cat ar an scáileán baile a leanann a chroí léamh an lae inniu.
reading-goal.plugin.how = "Taispeánann cat ar do scáileán baile conas atá ag éirí le léamh an lae inniu: brónach fad nach bhfuil aon rud léite agat go fóill, measartha tar éis beagáin, sásta ó leath de do sprioc laethúil, sona nuair a shroich tú í.\n\nCuir an ghiuirléid Cat léitheoireachta leis an scáileán baile (coinnigh an scáileán baile síos, ansin cuir giuirléid leis), nó roghnaigh Cat léitheoireachta an lae inniu mar scáileán codlata. Osclaíonn tapáil ar an gcat an sprioc laethúil; is í sprioc staitisticí na léitheoireachta í, a áiríonn na nóiméid a léann tú.\n\nSna socruithe, faoi Léamh, socraíonn Sásta ó agus Sona ó ó cén chuid den sprioc a bhíonn an cat sásta nó sona, agus socraíonn Pictiúir féin fillteán pictiúr (sad, meh, content agus happy) le taispeáint in ionad na gcat. Is comhaid PNG nó JPEG iad na pictiúir; gan fillteán, taispeántar na cait."
