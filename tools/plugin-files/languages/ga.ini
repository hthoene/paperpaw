diagnostics.plugin.name = Diagnóisic
diagnostics.plugin.description = Scáileán tástála agus seiceáil threoraithe de gach cuid de ghléas.
diagnostics.plugin.how = "Is scáileán tástála é Diagnóisic chun gléas a sheiceáil: taispeánann sé gach leibhéal liath is féidir leis an bpainéal a thaispeáint, ceithre bhosca chun na cnaipí agus an tadhall a thriail, agus áireamhán leathanach le barra dul chun cinn chun na módanna athnuachana a chur i gcomparáid.\n\nNíl iontráil roghchláir ag an scáileán tástála. Ní hé an scáileán baile é ach amháin nuair nach dtairgeann aon bhreiseán eile ceann, nó nuair a roghnaíonn tú é faoi Scáileáin sa bhainisteoir breiseán don áit Scáileán baile.\n\nMarcálann Roghnaigh an bosca fócasaithe, agus bogann na cnaipí saighde idir na boscaí; le tadhall, tapáil bosca. Iompaíonn na cnaipí leathanaigh na leathanaigh tástála. Coinnigh Roghnaigh síos, nó coinnigh méar ar an scáileán, chun tosú as an nua.\n\nBaineann seiceáil an ghléis, faoi Uirlisí nuair is é PaperPaw dochtearraí an ghléis, gach cuid de ghléas ceann ar cheann, leathanach i ndiaidh leathanaigh: an scáileán, cnaipí, tadhall, solas tosaigh, ceallra, cárta, clog, Wi-Fi, codladh agus cuimhne. Críochnaíonn gach leathanach le Teip, Scipeáil agus Pas, agus roghnaítear an freagra a mholann a thomhais; scipeáiltear codanna nach bhfuil ag gléas. Tar éis gach freagra scríobhann sé tuarascáil chuig .paperpaw/plugins/diagnostics/device-check.txt, le greamú i bpull request. Fágann Ar ais é, agus leanann sé ar aghaidh san áit a raibh sé nuair a osclaítear arís é. Ar ghléas a bhfuil cnaipí amháin air, roghnaigh Tosaigh ar leathanach na gcnaipí ar dtús; go dtí sin oibríonn na saigheada, Roghnaigh agus Ar ais mar a dhéanann siad ar gach leathanach."
