transfer.plugin.name = Aistriú
transfer.plugin.description = Cuir leabhair agus comhaid eile ar an ngléas ó bhrabhsálaí ar an líonra céanna.
transfer.plugin.how = "Cuireann Aistriú Wi-Fi leabhair agus comhaid eile ar an ngléas ó bhrabhsálaí ar an líonra céanna, gan cábla ná aip. Is féidir leat comhaid a fháil freisin, fillteáin a dhéanamh agus scriosadh.\n\nOscail é ó Uirlisí. Taispeánann an scáileán seoladh mar théacs agus mar chód QR: oscail i mbrabhsálaí ar ghuthán nó ar ríomhaire é, nó scanáil an cód. Tá eochair sa seoladh a dhéantar as an nua gach uair, mar sin ní féidir le daoine eile ar an líonra teacht ar do chomhaid. Ritheann an t-aistriú fad atá an scáileán ar oscailt.\n\nNuair a ritheann PaperPaw Wi-Fi é féin, mar ar an X4, osclaíonn Gan ródaire ag an mbun líonra de chuid an ghléis féin, a gcuireann an guthán ceangal leis trí chód a scanadh."
