pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Amadóir fócais le babhtaí oibre agus sosa, giuirléidí agus comhaireamh laethúil.
pomodoro.plugin.how = "Amadóir Pomodoro: oibrigh i mbabhtaí fócasaithe, ansin déan scíth. Níl aon socrú de dhíth air: 25 nóiméad fócais, 5 scíthe, agus tar éis ceithre bhabhta sos fada 15.\n\nOscail Pomodoro ón roghchlár uirlisí agus brúigh Tosaigh, nó cuir a ghiuirléidí leis an scáileán baile (coinnigh an scáileán baile síos, ansin cuir giuirléid leis): taispeánann Amadóir Pomodoro an chéim agus na nóiméid atá fágtha, is cnaipe é Tosaigh/sos Pomodoro, agus áiríonn Pomodoro inniu na babhtaí a chríochnaigh tú, le do sprioc laethúil. Tosaíonn nó cuireann tapáil ar an amadóir ar sos é; coinnigh síos é chun an scáileán iomlán a oscailt.\n\nLeanann an t-amadóir ar aghaidh nuair a fhágann tú an scáileán, agus leanann sé ar aghaidh de réir an chloig tar éis atosaithe. Fad atá an léitheoir ina chodladh ní ritheann aon rud: cuirtear in iúl nuair a dhúisíonn sé céim a chríochnaigh idir an dá linn. Insíonn fógra duit nuair atá céim thart. Chun ceallra a shábháil, nuashonraíonn an clog uair sa nóiméad (gach deich soicind sa nóiméad deireanach ar an scáileán iomlán) agus ní choinníonn sé an léitheoir ina dhúiseacht riamh.\n\nFaoi Pomodoro sna socruithe socraíonn tú fad na gcéimeanna agus babhtaí tacar, agus an dtosaíonn an chéad chéim eile ina haonar. Faoi Tuilleadh: splanc den scáileán nó caochadh den solas tosaigh nuair a chríochnaíonn céim agus sprioc laethúil."
