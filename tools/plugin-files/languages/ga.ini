menu-editor.locked = Is í an iontráil seo an bealach chuig na socruithe anseo agus fanann sí. Cuir bealach eile leis ar dtús (m.sh. Socruithe féin), ansin is féidir í a bhaint.
news.plugin.name = Nuacht
news.plugin.description = Faigheann fothaí nuachta (RSS, Atom) mar leabhair le léamh.
news.plugin.how = "Déanann Nuacht leabhair d'fhothaí RSS nó Atom. Éiríonn gach fotha ina leabhar amháin san fhillteán News den leabharlann, lena alt is déanaí mar ghnáththéacs, le léamh cosúil le haon leabhar eile.\n\nOscail Nuacht ón roghchlár Uirlisí agus roghnaigh Cuir fotha leis; tá a sheoladh ar shuíomh gréasáin an nuachtáin nó an bhlag. Faigheann Faigh an nuacht gach fotha agus cuireann sé in ionad na leabhar níos luaithe. Coinnigh fotha síos (le cnaipí, coinnigh Roghnaigh síos) chun é a fháil nó a bhaint leis féin. Fágann fotha a baineadh a leabhar sa leabharlann.\n\nTá líonra de dhíth ar fháil. Socraíonn Ailt in aghaidh an fhotha (Socruithe, Leabharlann) cé mhéad alt atá i ngach leabhar. Taispeánann an ghiuirléid Ceannlínte nuachta iad ar an scáileán baile."
