file-manager.plugin.name = Bainisteoir comhad
file-manager.plugin.description = Gach fillteán agus comhad ar an ngléas: oscail, athainmnigh, bog, cóipeáil agus scrios iad.
file-manager.plugin.how = "Taispeánann an bainisteoir comhad gach fillteán agus comhad i stóras an ghléis, ní hamháin do leabhair, agus ligeann sé duit iad a oscailt, a athainmniú, a bhogadh, a chóipeáil agus a scriosadh agus fillteáin nua a dhéanamh.\n\nOscail Comhaid ón roghchlár Uirlisí. Tapáil fillteán chun dul isteach ann; téann Ar ais go dtí an fillteán os a chionn. Tapáil comhad, nó coinnigh iontráil ar bith síos (le cnaipí, coinnigh Roghnaigh síos), chun a fheiceáil cad is féidir a dhéanamh leis. Roghnaíonn Bog agus Cóipeáil an iontráil: téigh go dtí an fillteán inar léi é agus roghnaigh Greamaigh anseo sa bharra ag an mbun. Le cnaipí, brúigh Síos ón iontráil dheireanach chun an barra a shroicheadh.\n\nTá comhaid agus fillteáin a thosaíonn leponc, ar nós sonraí PaperPaw féin, folaithe. Chun iad a fheiceáil, cuir Comhaid fholaithe air sna Socruithe, faoi Leabharlann."
