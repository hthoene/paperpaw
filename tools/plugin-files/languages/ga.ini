battery.plugin.name = Úsáid ceallra
battery.plugin.description = Taifeadann an ceallra agus taispeánann sé cá fhad a mhaireann sé.
battery.plugin.how = "Tugann Úsáid ceallra faoi deara an luchtú thart ar uair sa nóiméad fad atá an gléas ina dhúiseacht, in éineacht leis an méid a rinne sé: athnuachan scáileáin agus leathanaigh iompaithe. As sin oibríonn sé amach cé mhéad a thógann uair an chloig ina dhúiseacht agus 100 leathanach, agus cá fhad a mhaireann an ceallra ar an luas sin.\n\nOscail Ceallra ón roghchlár Uirlisí. Taispeánann sé an luchtú anois, an tréimhse dhúiseachta seo, an úsáid ar cheallra go dtí seo agus do thréimhsí dúiseachta le déanaí. Déanann tú leathanaigh a iompú leis na cnaipí leathanaigh, nó trí na saigheada ag an mbarr a thapáil.\n\nTeastaíonn tamall léitheoireachta ar cheallra uaidh sular chiallaíonn na figiúirí aon rud. Tá an taifeadadh air de réir réamhshocraithe agus is féidir é a chur as sna Socruithe, faoi Gléas, Cumhacht, mar Taifead úsáid ceallra."
