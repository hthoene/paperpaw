notes-overview.plugin.description = Leabharmharcanna agus aibhsithe gach leabhair in aon liosta amháin, agus easpórtáil mar My Clippings.txt.
notes-overview.plugin.how = "Liostaíonn Gach nóta gach leabhar inar chuir tú leabharmharc nó aibhsiú, agus an líon. Oscail é in Uirlisí. Roghnaigh leabhar chun a nótaí a fheiceáil, agus nóta chun an leabhar a oscailt san áit sin.\n\nAg deireadh an liosta, scríobhann Easpórtáil mar My Clippings.txt gach nóta isteach i gcomhad amháin, san fhillteán Exports le hais na leabharlainne, sa fhoirm a úsáideann Kindle (UTF-8). Is féidir le haipeanna a léann My Clippings.txt Kindle é a léamh. Is iontráil ar leith nóta ar aibhsiú, mar a bhíonn ar Kindle. Mar nach bhfuil suíomhanna Kindle ag leabhar anseo, is é “location” cé chomh fada isteach sa leabhar is atá an nóta, i gcéatadán. Scríobhtar an comhad arís gach uair; cuireann sé an ceann roimhe in ionad."
