keys.plugin.name = Cnaipí agus gothaí
keys.plugin.description = An rud a dhéanann gach cnaipe, limistéar tapála agus scuabadh, athraithe ar an ngléas.
keys.plugin.how = "Taispeánann Cnaipí agus gothaí cad a dhéanann gach cnaipe, limistéar tapála agus scuabadh, agus ligeann sé duit é a athrú ar an ngléas.\n\nOscail é sna socruithe, faoi Gléas. Roghnaigh ar dtús an áit a mbaineann athrú: I ngach áit, Agus tú ag léamh, Ar an scáileán baile, Sa leabharlann nó in uirlis amháin. Ansin roghnaigh ionchur, ar nós cnaipe coinnithe síos nó scuabadh isteach ó imeall, agus roghnaigh gníomh ón liosta, ar féidir leat cuardach a dhéanamh air. Tugann Mar a bhíonn ar ais an méid a shocraíonn na breiseáin agus leagan amach na gcnaipí.\n\nAr an X4, diúltaítear d'athrú a d'fhágfadh aon chnaipe gan fágáil le roghnú, dul ar ais nó bogadh ar aghaidh leis. Tugann Athshocraigh cnaipí agus gothaí ag an deireadh gach athrú ar ais."
