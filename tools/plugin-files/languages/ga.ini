rules.plugin.name = Rialacha
rules.plugin.description = Nuair a tharlaíonn rud éigin, déanann rud éigin: m.sh. mód oíche ar 22:00.
rules.plugin.how = "Déanann riail rud éigin ina haonar nuair a tharlaíonn rud éigin: mód oíche air gach lá ar 22:00, nó na catalóga sioncrónaithe nuair a thosaíonn PaperPaw.\n\nTá na rialacha sna Socruithe faoi Saincheapú, mar Rialacha. Fiafraíonn Cuir riail leis Cathain? (tosaíonn PaperPaw, am den lá, osclaítear nó dúntar leabhar, an ceallra, luchtú, lasc agus tuilleadh) agus Cad ansin? (gníomh a rith, lasc a chur air nó as, uimhir a shocrú, teachtaireacht a thaispeáint). Tapáil riail chun í a chur ar sos; coinnigh síos í (le cnaipí, coinnigh Roghnaigh síos) le haghaidh coinníll ar nós Idir dhá am den lá, nó chun í a bhaint.\n\nTagann na gníomhartha, na lasca agus na huimhreacha le roghnú de réir breiseáin: roghnaigh an breiseán, ansin an méid a thugann sé leis; téann ar ais amach as arís. Déanann gníomh a oibríonn ar an scáileán a thaispeántar, ar nós Ar ais nó An chéad leathanach eile, an rud a dhéanfadh sé dá mbrúfaí ansin é.\n\nBaineann amanna le haon scáileán atá ar oscailt. Stopann dhá riail a chealaíonn a chéile tar éis cúpla céim."
