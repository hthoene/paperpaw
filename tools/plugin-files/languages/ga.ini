mail.plugin.name = Ríomhphost
mail.plugin.description = Léann agus seolann ríomhphost le focal faire nó aip-fhocal faire (IMAP agus SMTP), gan síniú isteach sa bhrabhsálaí.
mail.plugin.how = "Léann agus seolann Ríomhphost ríomhphost thar IMAP agus SMTP. Síníonn sé isteach le do sheoladh agus focal faire, gan síniú isteach sa bhrabhsálaí, mar sin oibríonn sé le haon soláthraí a cheadaíonn sin.\n\nSocraigh cuntas faoi Socruithe, Ríomhphost. Roghnaigh do sholáthraí, clóscríobh do sheoladh agus an focal faire. Iarrann an chuid is mó de na soláthraithe aip-fhocal faire: déan ceann i socruithe slándála do chuntais agus úsáid anseo é. Is minic nach n-oibríonn do ghnáthfhocal faire, agus ní théann sé áit ar bith ach chuig freastalaí do sholáthraí. Coinnítear é le focail faire agus eochracha.\n\nOscail Ríomhphost sna huirlisí. Faigheann Seiceáil an ríomhphost na ríomhphoist is déanaí agus na fillteáin. Coinnítear na ríomhphoist ar an gcárta, mar sin is féidir leat iad a léamh gan líonra. Ceanglaíonn an gléas, faigheann sé, agus scarann sé, mar sin níl Wi-Fi air ach ar feadh nóiméid.\n\nMura bhfuil do sholáthraí ar an liosta, roghnaigh Freastalaithe féin agus socraigh ainmneacha na bhfreastalaithe, na bpoirt agus an tslándáil faoi na socruithe casta. Fiafraíonn freastalaí nach dtugann aon údarás ráthaíocht dá theastas uair amháin an gcuirfidh tú muinín ann; cuir méarlorg i gcomparáid leis an gceann a thaispeánann do sholáthraí.\n\nTá Oscail leabhar faoi ríomhphost le leabhar ceangailte (EPUB, PDF agus a leithéidí, suas le 2 MB): faigheann sé an comhad, cuireann i do leabharlann é agus osclaíonn é.\n\nChun ríomhphost nua a fheiceáil gan Ríomhphost a oscailt, cuir air Seiceáil ar ríomhphost nua sa chúlra faoi Socruithe, Ríomhphost, agus roghnaigh cé chomh minic (gach 15, 30 nó 60 nóiméad). Tá sé as go dtí go gcuireann tú air é. Ansin ceanglaíonn an léitheoir anois is arís thar nasc slán fad atá sé ina dhúiseacht agus ar líne, cuntas i ndiaidh a chéile, agus nuashonraíonn sé líon na ríomhphost gan léamh ar an scáileán Baile. Úsáideann sé roinnt ceallra. Stopann Ríomhphost a oscailt seiceáil atá ar siúl.\n\nTaispeánann giuirléidí an scáileáin bhaile líon na ríomhphost gan léamh, na cinn is déanaí agus na cinn le réalta, bosca poist amháin, agus aicearra chun ríomhphost a scríobh."
