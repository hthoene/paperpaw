notes-vault.plugin.name = Taisclann nótaí
notes-vault.plugin.description = Léann fillteán nótaí Markdown de réir fillteán, clibeanna agus athruithe is déanaí, le giuirléidí don scáileán baile. Oibríonn le taisclanna Obsidian.
notes-vault.plugin.how = "Léann Taisclann nótaí fillteán nótaí Markdown (comhaid .md simplí, mar a choinníonn aipeanna nótaí iad). Oibríonn sé le taisclanna Obsidian.\n\nRoghnaigh fillteán na taisclainne sna socruithe, nó ar leathanach na taisclainne sna huirlisí. Ansin tairgeann an leathanach na fillteáin mar atá siad ar an gcárta, na nótaí a athraíodh go deireanach, na clibeanna, agus cuardach i dteidil na nótaí.\n\nAn chéad uair, déantar innéacsú ar an taisclann sa chúlra fad atá a leathanach ar oscailt; tógann taisclann le mílte nótaí cúpla nóiméad, ansin osclaíonn sí láithreach. Coinnítear an t-innéacs ar an gcárta agus déantar arís é nuair a osclaítear leathanach na taisclainne tar éis roinnt uaireanta, nó nuair a roghnaíonn tú Nuashonraigh.\n\nOsclaíonn nóta sa léitheoir. Aimsítear naisc le nótaí eile ([[Nóta]], [[Nóta|focail]], [[Nóta#Ceannteideal]]) de réir ainm an nóta in áit ar bith sa taisclann; osclaíonn nasc a leanúint an nóta sin, agus filleann Ar ais ar an nóta roimhe.\n\nNí athraítear aon rud sa taisclann riamh. Cuirtear giuirléidí an scáileáin bhaile (nótaí le déanaí, nóta greamaithe, nóta an lae, nóta randamach, clibeanna, cuardach) leis in eagarthóir an scáileáin bhaile. Is féidir le giuirléid a nótaí a thógáil ó fhillteán amháin: scríobh cosán an fhillteáin ó fhréamh an chárta (mar shampla Notes/Work) i socruithe na giuirléide; fágtha folamh, tógann sí gach nóta den taisclann."
