dictionary.plugin.name = Foclóir
dictionary.plugin.description = Cuardaíonn focail i bhfoclóirí StarDict.
dictionary.plugin.how = "Cuardaíonn an foclóir focal ó leabhar i bhfoclóirí StarDict agus taispeánann sé na sainmhínithe i bpainéal os cionn an chuid íochtair den scáileán.\n\nSa léitheoir, coinnigh focal síos agus roghnaigh Cuardaigh; le cnaipí, úsáid Roghnaigh téacs faoi Tuilleadh. Cóipeáil fillteáin na bhfoclóirí (le comhaid .ifo, .idx agus .dict) isteach san fhillteán “dictionaries” ar an ngléas, fofhillteáin san áireamh, nó roghnaigh fillteán eile sna Socruithe, faoi Léamh, mar Fillteán foclóirí (socrú casta). Ullmhaíonn an chéad chuardach innéacs beag do gach foclóir, rud a thógann nóiméad.\n\nSa phainéal, scrollaíonn na cnaipí leathanaigh nó Suas agus Síos sainmhínithe fada, agus dúnann Ar ais é. Le tadhall, tapáil lasmuigh de chun é a dhúnadh."
