plugin-manager.plugin.name = Bainisteoir breiseán
plugin-manager.plugin.description = Liostaíonn na breiseáin agus cuireann air agus as iad.
plugin-manager.plugin.how = "Liostaíonn an bainisteoir breiseán gach breiseán lena leagan agus cur síos, agus cuireann breiseáin air agus as.\n\nFaigheann tú é sna Socruithe, mar Bainistigh breiseáin. Is leathanach ar leith é Socruithe breiseán do roghanna ar nós úsáid líonra gach breiseáin. Tapáil breiseán chun é a chur air nó as (le cnaipí, roghnaigh é). Tagann an t-athrú i bhfeidhm tar éis atosaithe: ansin tairgeann an barra ag an mbun Atosaigh anois. Coinnigh breiseán síos (le cnaipí, coinnigh Roghnaigh síos) chun léamh conas a oibríonn sé.\n\nNí féidir breiseán a bhfuil I gcónaí air air a chur as, ná ceann a bhfuil Riachtanach air ach amháin nuair a dhéanann breiseán eile a chuid oibre, nó ní bheadh aon bhealach ar ais ag PaperPaw. Faoi Scáileáin roghnaíonn tú cén breiseán a thaispeánann áit a dtairgeann roinnt acu."
