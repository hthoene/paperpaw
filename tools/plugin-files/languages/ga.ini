power.plugin.name = Cumhacht
power.plugin.description = Roghnaíonn an mód cumhachta, de láimh nó de réir an cheallra: Gnáth, Coigilt, As líne.
power.plugin.how = "Roghnaíonn Cumhacht conas a chaitheann PaperPaw an ceallra: Gnáth, Coigilt nó As líne. Déanann Coigilt an méid is féidir a chur ar athló ag amanna níos fearr; coinníonn As líne an raidió as. Roghnaíonn Uath de réir an cheallra.\n\nAthraigh an mód sa phainéal tapa, áit a dtaispeánann Cumhacht na módanna taobh le taobh, nó sna Socruithe faoi Cumhacht. Is ann freisin a shocraíonn tú na leibhéil ag a n-athraíonn Uath go Coigilt agus go As líne, agus an bhfanann sé Gnáth fad atá sé á luchtú.\n\nSna línte stádais, taispeánann Mód cumhachta duilleog agus coigilt ar siúl agus Wi-Fi le líne tríd nuair atá sé as líne, agus aon rud i nGnáth.\n\nOsclaíonn coinneáil an chnaipe cumhachta síos roghchlár beag: Codladh, Múch (nuair is féidir le PaperPaw), Atosaigh, agus ar ghléasanna tadhaill Glasáil tadhall nó Díghlasáil tadhall. Cuireann brú gearr an gléas a chodladh fós. Fágann Ar ais an roghchlár."
