keyboard.plugin.name = Méarchlár
keyboard.plugin.description = Cuireann téacs isteach ar an scáileán, le tadhall nó leis na cnaipí.
keyboard.plugin.how = "Osclaíonn an méarchlár aon uair a bhfuil téacs de dhíth ar rud éigin: cuardach, focal faire, nóta nó socrú. Oibríonn sé le tadhall agus le cnaipí amháin.\n\nLe cnaipí, bogann Clé agus Deas feadh sraithe, bogann na cnaipí leathanaigh idir sraitheanna, brúnn Roghnaigh eochair agus cealaíonn Ar ais; téann Clé agus Deas thart ar shraith, agus fanann Suas agus Síos i do cholún. Déanann Shift an chéad litir eile ina litir mhór; brúigh faoi dhó é do gach litir mhór, agus uair amháin eile chun stopadh. Coinnigh litir síos (le cnaipí: coinnigh Roghnaigh síos uirthi) dá litir mhór, roghnaithe láithreach, agus do fhadaí ar nós á, é, í, ó agus ú; mar sin tagann á, é, í, ó agus ú ó a, e, i, o agus u (le cnaipí, deir an méarchlár é ar na litreacha sin). Críochnaíonn OK; le cnaipí, coinnigh Ar ais síos chun críochnú ó áit ar bith (cealaíonn Ar ais amháin), nó coinnigh Roghnaigh síos ar eochair nach litir í. Cuireann Greamaigh téacs an ghearrthaisce isteach, agus ligeann Guthán, nuair a thairgtear é, duit clóscríobh ar do ghuthán ina ionad.\n\nSna socruithe faoi Gléas, Méarchlár: roghnaíonn Leaganacha amach méarchláir na leaganacha amach. De réir réamhshocraithe leanann sé teanga an roghchláir; le roinnt, aistríonn eochair eatarthu. Tugann Eochracha fada eochracha dá gcuid féin do á, é, í, ó agus ú ina ionad. Déanann Méid eochracha agus litreacha níos mó; le cnaipí amháin, fanann na sraitheanna mar atá siad ar mhéarchlár ríomhaire. Ar scáileáin tadhaill, athraíonn Cruth na n-eochracha cén chuma atá ar na heochracha. Cuireann Ceannlitreacha uathoibríocha tús le gach abairt le ceannlitir."
