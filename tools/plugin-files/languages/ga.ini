about.intro = Léitheoir leictreonach saor do ghléasanna e-ink, déanta de bhreiseáin. Ceadúnaithe faoi Cheadúnas Apache 2.0; tá an méid a thagann leis ceadúnaithe mar seo a leanas.
about.plugins.title = Breiseáin tógtha isteach
about.plugins.help = Na breiseáin le cód sa dochtearraí seo, lena leaganacha. Tugann nuashonrú na cinn chéanna leis arís; deir ceann nach féidir leis sin a dhéanamh é roimh ré.
