menu.plugin.name = Roghchlár
menu.plugin.description = An roghchlár ag bun an scáileáin, le gníomhartha agus socruithe.
menu.plugin.how = "Liostaíonn an roghchlár an méid is féidir leat a dhéanamh agus a shocrú. Osclaíonn sé ag bun an scáileáin, os cionn cibé rud atá ar oscailt: agus tú ag léamh, tapáil lár an scáileáin nó brúigh Roghnaigh. Tapáil nó roghnaigh iontráil chun í a rith.\n\nTaispeánann socruithe sa roghchlár a luach agus athraíonn siad san áit, mar sin fanann an roghchlár ar oscailt. Osclaíonn iontráil le tuilleadh iontrálacha fo-roghchlár.\n\nScuab síos ón imeall uachtair don phainéal tapa: an méid a athraíonn tú go minic, mar chnaipí. Tapáil cnaipe chun é a athrú, coinnigh síos é le haghaidh a shocruithe. Le cnaipí amháin, roghnaíonn na cnaipí saighde, athraíonn Roghnaigh agus dúnann Ar ais. Faoi Cuma, taispeánann Roghchláir roghchláir mar liosta nó mar leacáin."
