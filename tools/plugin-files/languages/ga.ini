calendar.plugin.name = Féilire
calendar.plugin.description = Do chuid féilirí ar an léitheoir: radhairc chláir oibre, lae, seachtaine agus míosa ó CalDAV, iCal agus comhaid, laethanta breithe ó theagmhálaithe, giuirléidí baile agus scáileán codlata.
calendar.plugin.how = "Do chuid féilirí ar an léitheoir: clár oibre na laethanta seo chugainn, lá, seachtain agus mí, le himeachtaí féilirí CalDAV (Nextcloud, Radicale, Baïkal, Fastmail agus eile), seoltaí iCal (.ics, webcal://), comhaid féilire ar an gcárta agus laethanta breithe agus comóradh do theagmhálaithe (CardDAV). Ní léann an léitheoir féilirí ach; ní athraíonn sé choíche iad.\n\nOscail Féilire ón roghchlár uirlisí. Ainmníonn an chéad tsraith an radharc; roghnaigh í, nó coinnigh sraith ar bith síos nó brúigh Roghchlár, chun aistriú idir Clár oibre, Lá, Seachtain, Mí agus Laethanta breithe, chun féilirí a chur leis nó chun sioncrónú. In Lá agus Seachtain téann an chéad dá shraith go dtí an lá nó an tseachtain roimhe agus ina dhiaidh (déanann na heochracha leathanaigh amhlaidh freisin); i Mí bogann na heochracha saighde an lá, na heochracha leathanaigh an mhí, agus osclaíonn Roghnaigh an lá. Taispeánann Roghnaigh ar imeacht é go hiomlán: cathain, cén áit, cén féilire agus conas a athrá sé. Téann Ar ais céim amháin ar gcúl.\n\nCuir féilire leis faoi Féilirí (sa roghchlár, nó Féilire sna socruithe). Roghnaigh a chineál: cuntas CalDAV (is leor seoladh an fhreastalaí, m.sh. cloud.example.com/remote.php/dav; éiríonn gach féilire le himeachtaí mar chuid den radharc), seoladh iCal (féilire foilsithe mar .ics), comhad féilire ar an gcárta, nó teagmhálaithe (leabhar seoltaí CardDAV: taispeánann an léitheoir na laethanta breithe agus na comóradh atá stóráilte leo). Cuir isteach an seoladh, do chuntas ainm úsáideora agus focal faire (aip-fhocal faire is fearr; coinnítear é le focail faire an léitheora), agus ainm. Tá marc ag gach féilire (poncán, fáinne, poncán liath nó cearnóg) is féidir leat a athrú, ionas gur féidir iad a idirdhealú; suas le sé féilire.\n\nTaispeántar imeachtaí athfhillteacha (laethúil, seachtainiúil, míosúil, bliantúil, le laethanta seachtaine, comhaireamh, dátaí deiridh agus laethanta fágtha ar lár), imeachtaí lae iomláin agus imeachtaí i gcriosanna ama eile ar chlog an léitheora féin. Coinníonn an léitheoir na himeachtaí ó thrí scór lá roimh an lá inniu go trí scór lá ina dhiaidh, 240 ar a mhéad, agus taispeánann sé iad gan líonra. Taispeánann rialacha nach féidir leis a léamh a n-imeacht uair amháin.\n\nLéitear féilirí nuair a osclaíonn tú an féilire (gach cúig nóiméad ar a mhéad), nuair a roghnaíonn tú Sioncrónaigh anois, agus, mar a shocraíonn tú faoi Féilire sna socruithe, nuair atá an líonra air ar aon nós nó nuair a thosaíonn luchtú. Ní chuireann an léitheoir a raidió air riamh dó, ach amháin nuair a iarrann tú Sioncrónaigh anois.\n\nGiuirléidí don scáileán baile (coinnigh an scáileán baile síos, ansin cuir giuirléid leis): Taispeánann Inniu an dáta agus an méid atá sa lá, An chéad imeacht eile an t-imeacht atá ann ina dhiaidh sin, Clár oibre na laethanta seo chugainn, Mí mí le poncán faoi na laethanta a bhfuil imeachtaí acu, agus Laethanta breithe na laethanta breithe seo chugainn. Osclaíonn tapáil ar imeacht é, osclaíonn tapáil ar lá den mhí an lá sin. Is féidir leis an scáileán codlata clár oibre an lae inniu a thaispeáint: roghnaigh Féilire faoi Scáileán codlata sna socruithe."
