picture-home.plugin.name = Scáileán baile pictiúir
picture-home.plugin.description = Scáileán baile le do phictiúr féin taobh thiar de na giuirléidí, agus barra stádais a chumraíonn tú.
picture-home.plugin.how = "Cuireann Scáileán baile pictiúir an scáileán baile in ionad fad atá sé air: do phictiúr féin taobh thiar de na giuirléidí, agus leathanaigh na ngiuirléidí agus na n-uirlisí a shocraíonn tú. Cuir as é sa bhainisteoir breiseán agus tá an scáileán baile tógtha isteach ar ais, lena leathanaigh féin.\n\nCuir pictiúir (JPEG, PNG nó GIF) i bhfillteán ar an gcárta (wallpapers de réir réamhshocraithe), ansin roghnaigh ceann i Socruithe, Saincheapú, Scáileán baile pictiúir. Insíonn Oiriúnú conas a líonann sé an scáileán (líon, pictiúr iomlán, sín, méid bunaidh, tíl), Suíomh cén chuid a fhanann, Súmáil cé chomh mór, agus Éadromaigh an pictiúr cé chomh pale: déanann pictiúr níos pale na giuirléidí níos éasca le léamh. Ullmhaítear an pictiúr uair amháin do gach méid scáileáin, rud a thógann nóiméad.\n\nSuíonn giuirléidí ar phláta os cionn an phictiúir. Socraigh an leathanach mar ar an scáileán baile tógtha isteach: an peann luaidhe faoin leathanach, nó Cuir scáileán baile in eagar sa roghchlár.\n\nIs féidir leis an mbarra stádais (am, Wi-Fi, ceallra, nó cibé rud a roghnaíonn tú) a bheith air, as nó uathoibríoch, ag an mbarr nó ag an mbun, leithead iomlán nó pille bheag ar chlé, sa lár nó ar dheis, ar phláta éadrom, dorcha nó liath nó ar an bpictiúr féin. Is féidir leis an tsraith a ainmníonn na cnaipí (ar an X4) a bheith air, as nó uathoibríoch freisin. Ciallaíonn uathoibríoch go dtaispeánann brú cnaipe iad ar feadh cúpla soicind; ní dhéanann an brú sin aon rud eile.\n\nInsíonn Rindreáil pictiúir conas a tharraingítear an pictiúr: Leibhéil liath i ngach liath atá ag an scáileán (níos moille ar an X4), Poncaithe i bponcanna dubha agus bána (tapa), nó Uathoibríoch, mar a dhéanann an scáileán baile tógtha isteach: leibhéil liath nuair a tharraingítear an scáileán, ponc tar éis an chéad athraithe. Nuair nach bhfuil aon leibhéil liath ag scáileán, filleann leibhéil liath ar phonc."
