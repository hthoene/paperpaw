vocabulary.plugin.name = Stór focal
vocabulary.plugin.description = Coinníonn na focail a chuardaíonn tú, lena n-abairtí, agus athbhreithníonn cártaí cuimhne le hathdhéanamh spásáilte, déanta ar do ghuthán.
vocabulary.plugin.how = "Coinníonn Stór focal na focail a chuardaíonn tú agus tú ag léamh, gach ceann lena abairt, le dul tríothu níos déanaí. Faigheann tú an liosta in Uirlisí, an ceann is nuaí ar dtús; roghnaigh focal chun é a chuardach arís. Sábhálann an tsraith dheireanach, Easpórtáil, iad d'aipeanna cártaí cuimhne ar nós Anki. Coinníonn an liosta na 2,000 focal is nuaí: thar sin, imíonn na cinn is sine, mar sin easpórtáil iad ar dtús chun iad uile a choinneáil.\n\nCuireann Cártaí cuimhne, in Uirlisí freisin, ceisteanna ort le hathdhéanamh spásáilte: tar éis Taispeáin an freagra rátálann tú gach cárta Arís, Deacair, Maith nó Éasca, agus socraíonn sin cathain a thagann sé ar ais. Déan pacaí le Cuir in eagar le do ghuthán: scanáil an cód le guthán ar an Wi-Fi céanna, ansin clóscríobh cártaí nó cuir go leor leis ag an am céanna: oscail paca ansin, roghnaigh Go leor cártaí ag an am céanna agus roghnaigh comhad CSV, TSV nó TXT (cárta ar gach líne: tosaigh, cúl, sampla; UTF-8), greamaigh liosta, nó tabhair paca Anki leat (.apkg, easpórtáilte le Tacaigh le leaganacha Anki níos sine). \n\nNó úsáid comhaid ar an gcárta SD: cuir comhad CSV, TSV nó TXT, nó paca Anki (.apkg, easpórtáilte le Tacaigh le leaganacha Anki níos sine), do gach paca san fhillteán Flashcards (déanann Spáinnis.tsv an paca Spáinnis; cárta ar gach líne: tosaigh, cúl, sampla; sábháilte mar UTF-8; féadfaidh an chéad líne na colúin front, back, example a ainmniú). Roghnaigh Cártaí ón gcárta SD i gCártaí cuimhne, nó lig dó tarlú nuair a osclaíonn tú Cártaí cuimhne. Fanann na pacaí ar an léitheoir leis an méid a d'fhoghlaim tú, agus cumasctar comhad lena phaca aon uair a bhíonn sé nua nó athraithe: athraigh cúl nó sampla cárta sa chomhad agus athraíonn an cárta agus coinníonn a dhul chun cinn; athraigh téacs an tosaigh agus áirítear mar chárta nua é, tosaíonn an seanchárta as an nua (idirdhealaítear cártaí le téacs an tosaigh; ní áirítear spásanna ná ceannlitreacha); ní scriosann líne a scriosann tú an cárta (mura socraíonn tú “cártaí atá ar iarraidh ón gcomhad” go Bain don phaca sin: ansin baintear an cárta ag an gcéad nuashonrú eile lena dhul chun cinn, go buan, agus ní bhaintear aon rud fad nach féidir líne éigin den chomhad a léamh). Sábháil paca ina chomhad le Sábháil ar an gcárta: faigheann an comhad uimhreacha na gcártaí (an colún id), ionas gur féidir leat tosaigh a athrú ar ríomhaire agus go gcoinníonn na cártaí an méid a d'fhoghlaim tú; ní choinníonn an comhad ach id, tosaigh, cúl agus sampla (ní choinnítear colúin eile, tuairimí ná ord na línte), agus diúltaítear do shábháil fad nach bhféadfaí líne éigin den chomhad a léamh; cóipeáiltear an comhad a bhí ann go _ainm.bak.tsv an chéad uair (ní chuireann sábháil níos déanaí an chóip sin in ionad). Ní léitear comhad os cionn 4 MiB nó 20,000 líne, agus caithfear é a shábháil mar CSV UTF-8, ní mar UTF-16. An chéad uair, déanann an léitheoir an fillteán le nóta faoi conas a oibríonn sé.\n\nSna socruithe, faoi Léamh, cuireann Focail chuardaithe ina gcártaí gach focal cuardaithe isteach sa phaca Cuardaithe."
