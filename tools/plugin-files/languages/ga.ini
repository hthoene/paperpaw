vocabulary.sd.readme = "Cártaí cuimhne ó chomhaid\n\nCuir comhad anseo do gach paca: déanann Spáinnis.tsv an paca Spáinnis.\nComhaid: .tsv, .csv nó .txt, sábháilte mar UTF-8, nó .apkg: paca Anki, easpórtáilte le Tacaigh le leaganacha Anki níos sine ticeáilte. Éiríonn chéad trí réimse a nótaí ina dtosaigh, cúl agus sampla; ní léitear a sceidealú ná a mheáin, agus ní scríobhann PaperPaw comhad Anki riamh.\n\nCárta amháin ar gach líne: tosaigh, cúl agus sampla (roghnach), scartha le táb, camóg nó leathstad. Féadfaidh an chéad líne na colúin a ainmniú: front, back, example. Sampla:\n\nKatze\tcat\tDie Katze schläft.\n\nOscail ansin Cártaí cuimhne ar an léitheoir, roghnaigh Cártaí ón gcárta SD agus ansin Nuashonraigh na pacaí ón gcárta.\n\nOiriúnach le fios:\n- Fanann na pacaí ar an léitheoir, leis an méid a d'fhoghlaim tú. Léitear comhad nuair atá sé nua nó athraithe, agus cuirtear a chártaí leis an bpaca nó athraítear ann iad.\n- Athraigh cúl nó sampla cárta sa chomhad: athraíonn an cárta agus coinníonn do dhul chun cinn.\n- Athraigh téacs tosaigh cárta: áirítear mar chárta nua é, agus tosaíonn an seanchárta as an nua. Meaitseáiltear cártaí de réir a dtéacs tosaigh, ní áirítear spásanna ná ceannlitreacha. Sábháil paca i gcomhad (Cártaí ón gcárta SD, Sábháil an paca ar an gcárta) agus tá uimhir ag gach cárta sa cholún id: athraigh tosaigh ansin, coinnigh chéad dhá líne an chomhaid mar atá siad, agus coinníonn an cárta an méid a d'fhoghlaim tú.\n- Scríobhann sábháil cártaí an phaca. Ní choinnítear an méid a bhí sa chomhad nach cárta é (líne gan tosaigh); cóipeáiltear an comhad a bhí ann go _ainm.bak.tsv.\n- Sábháil an comhad mar CSV UTF-8 (ní UTF-16, ní formáid féin scarbhileoige). Ní léitear comhad os cionn 4 MiB nó 20,000 líne: roinn é.\n- Ní scriosann líne a scriosann tú sa chomhad an cárta sa phaca, mura gcuireann tú air Bain cártaí atá ar iarraidh don phaca sin. Ansin imíonn an cárta leis an méid a d'fhoghlaim tú.\n- Ní léitear comhaid a dtosaíonn a n-ainm le _.\n"
