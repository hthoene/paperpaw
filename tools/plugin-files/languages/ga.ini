smart-home.plugin.name = Teach cliste
smart-home.plugin.description = Luachanna agus lasca do Home Assistant féin ar dheais agus mar ghiuirléidí an scáileáin bhaile. Oibríonn le Home Assistant ar do líonra baile.
smart-home.plugin.how = "Taispeánann Teach cliste luachanna agus lasca do Home Assistant féin: teochtaí, taise, fuinneamh, doirse agus fuinneoga, soilse, lasca agus radhairc. Labhraíonn sé le do fhreastalaí thar a API REST ar do líonra baile; ní théann aon rud trí aon seirbhís eile.\n\nOscail Teach cliste ón roghchlár uirlisí, ansin Ceangal: clóscríobh seoladh do Home Assistant (mar shampla http://homeassistant.local:8123) agus comhartha rochtana fadsaolach (déan ceann ag bun leathanach próifíle do Home Assistant). Coinnítear an comhartha i measc na bhfocal faire agus na n-eochracha, ní i gcomhad socruithe riamh. Ní úsáidtear http simplí ach do sheoltaí ar do líonra baile; do fhreastalaí in áit eile cuir air “Freastalaithe lasmuigh den líonra baile” sna socruithe agus úsáid https le teastas bailí.\n\nOsclaíonn Roghnaigh eintitis liosta den mhéid atá ag do fhreastalaí: cuardaigh de réir ainm nó id agus roghnaigh eintiteas chun é a thaispeáint (roghnaigh arís é chun é a bhaint). Is féidir leat seomra a thabhairt dó, a ghrúpálann ar an deais agus i ngiuirléidí an tseomra é. Coinnítear suas le 24 eintiteas. Ar an deais, athraíonn Roghnaigh solas, lasc nó radharc é: taispeánann an tsraith freagra an fhreastalaí. Léitear arís braiteoir a roghnaíonn tú.\n\nGiuirléidí (coinnigh an scáileán baile síos, ansin cuir giuirléid leis): taispeánann Luach tí chliste léamh amháin mór, liostaíonn grúpa eintitis seomra, is cnaipe le haghaidh solais nó lasc amháin é lasc, agus is cárta é seomra le léamha agus lasca seomra. Insíonn socruithe gach giuirléide cén eintiteas nó seomra a thaispeánann sí.\n\nLéitear an teach nuair a osclaíonn tú an deais, nuair a iarrann tú é (an tsraith Athnuaigh nó tapáil ar ghiuirléid luacha nó grúpa), nuair a dhúisíonn an léitheoir nuair atá Wi-Fi suas cheana, agus ar an sceideal a shocraíonn tú fad atá an luchtaire plugáilte isteach. Ní chuireann sé an raidió air ina aonar riamh agus ní choinníonn sé air é riamh."
