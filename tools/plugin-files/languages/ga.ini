puzzles.plugin.name = Tomhaiseanna
puzzles.plugin.description = Sudoku, crosfhocail agus fadhbanna fichille, as líne, le tomhas an lae.
puzzles.plugin.how = "Tomhaiseanna don traein agus don seomra feithimh, gach rud as líne: sudoku, crosfhocail agus fadhbanna fichille. Oscail Tomhaiseanna ón roghchlár uirlisí, nó cuir an ghiuirléid Tomhas an lae leis an scáileán baile (coinnigh an scáileán baile síos, ansin cuir giuirléid leis): taispeánann sí cé chomh fada is atá sudoku an lae inniu, agus osclaíonn tapáil é. Is é an sudoku céanna é sudoku an lae an lá ar fad.\n\nSudoku: bogann Clé agus Deas an cúrsóir cearnóg ar chearnóg, Suas agus Síos (na cnaipí leathanaigh) sraith. Osclaíonn Roghnaigh na digití: roghnaigh ceann agus roghnaigh arís chun é a chur isteach, nó Glan chun an chearnóg a fholmhú. Coinnigh Roghnaigh síos (nó Roghchlár) chun na cnaipí faoin mbord a shroicheadh: Déanann Nótaí marcanna luaidhe de na digití, marcálann Seiceáil cearnóga mícheart, tugann Cealaigh an bogadh deireanach ar ais, tosaíonn Nua tomhas den leibhéal a roghnaíonn tú (Éasca, Meánach, Deacair). Tá réiteach amháin go díreach ag gach tomhas. Coinnítear an cluiche nuair a fhágann tú. Ar scáileán tadhaill tapáil cearnóg.\n\nCrosfhocail: cuir comhaid .puz (Across Lite) nó .ipuz isteach san fhillteán “puzzles” ar an gcárta cuimhne; ní thagann aon cheann leis. Bog ar an eangach, ansin roghnaigh chun an focal faoin gcúrsóir a chlóscríobh ar an méarchlár (fágann íoslíne cearnóg folamh). Aistríonn na cnaipí idir trasna agus síos, taispeánann siad liosta na leideanna, seiceálann siad na litreacha agus nochtann an focal. Coinnítear na litreacha do gach comhad. Ní féidir comhaid .puz scrofa a oscailt.\n\nFadhbanna fichille: tacar beag ó bhunachar fadhbanna Lichess (CC0). Léimeann Clé agus Deas ó phíosa go píosa, roghnaigh an píosa ba mhaith leat a bhogadh, ansin Clé agus Deas trí na háiteanna ina bhféadfaidh sé dul, agus roghnaigh arís. Tógtar bogadh mícheart ar ais. Marcálann Leid an píosa le bogadh, téann An chéad cheann eile go dtí an chéad fhadhb eile.\n\nNí aththarraingíonn an bord ach na cearnóga a athraíonn. Áiríonn Staitisticí na tomhaiseanna a réitigh tú."
