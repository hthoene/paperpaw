sleep.plugin.name = Scáileán codlata
sleep.plugin.description = Taispeánann cat ina chodladh, clúdach an leabhair, do phictiúir nó teachtaireacht fad atá an gléas ina chodladh.
sleep.plugin.how = "Cinneann an scáileán codlata cad a thaispeánann an scáileán fad atá an gléas ina chodladh. Coinníonn e-ink an pictiúr gan cumhacht.\n\nRoghnaigh é sna socruithe, faoi Gléas, Scáileán codlata, le Taispeáin: cat ina chodladh (an réamhshocrú), clúdach an leabhair, mo phictiúir, an lógó agus “Ina chodladh”, giuirléidí, an leathanach mar atá sé, nó an leathanach le pictiúr. Taispeánann Mo phictiúir comhaid an fhillteáin Pictiúir ceann i ndiaidh a chéile.\n\nGan clúdach nó pictiúr taispeántar an cat. Nuair a tharraingíonn an córas an scáileán codlata é féin, tá na socruithe seo folaithe.\n\nTarraingítear an scáileán múchta, Taispeáin nuair atá sé múchta, uair amháin nuair a mhúchtar an gléas, ón roghchlár cumhachta nó tar éis am Múch tar éis codlata (ní nuair a ghearrann ceallra íseal an chumhacht). Tá sé mar an scáileán codlata mura roghnaíonn tú an lógó agus “Múchta”, an cat, an clúdach nó mo phictiúir. Is féidir le breiseán eile scáileán a thairiscint dó.\n\nIs iad an scáileán tosaithe agus an scáileán atosaithe, Taispeáin ag tosú agus Taispeáin ag atosú, ceann an ghléis féin mura dtairgeann breiseán eile scáileán dóibh. Ní ritheann breiseáin go fóill agus an gléas ag tosú: tarraingítear an scáileán a roghnaíodh don tús roimh ré, agus an gléas á mhúchadh nó á atosú, agus taispeántar ag an gcéad tús eile é. Géilleann scáileán nach bhfuil réidh in am, nó pictiúr atá damáistithe, do cheann an ghléis; múchann nó atosaíonn an gléas ar aon nós."
