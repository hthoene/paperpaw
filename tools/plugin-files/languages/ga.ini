settings.plugin.name = Socruithe
settings.plugin.description = Leathanaigh na socruithe, tógtha ó shocruithe gach breiseáin.
settings.plugin.how = "Taispeánann Socruithe gach rud is féidir a shocrú i PaperPaw agus ina bhreiseáin, i leathanaigh. Ní gá scáileán dá gcuid féin do bhreiseáin: taispeántar an méid a dhearbhaíonn siad anseo, i ngrúpaí, le cur síos gach socraithe faoina bhun.\n\nOscail é le Socruithe sa roghchlár. Tapáil grúpa chun é a oscailt, ansin socrú chun é a athrú nó a roghnú; tá cnaipí − agus + ag uimhreacha. Le cnaipí, téigh go dtí socrú agus brúigh Roghnaigh: athraíonn clé agus deas uimhir, coinníonn Roghnaigh í, filleann Ar ais ar an luach níos luaithe.\n\nTagann athruithe i bhfeidhm láithreach. Aimsíonn Cuardaigh socrú de réir focal agus cuireann Socruithe casta cinn is annamh a theastaíonn leis. Fiafraíonn Athshocraigh go réamhshocruithe agus Athshocraigh gach rud ar dtús."
