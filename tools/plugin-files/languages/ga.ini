about.plugin.name = Faoi
about.plugin.description = Leagan agus ceadúnais PaperPaw.
about.plugin.how = "Taispeánann Faoi an leagan de PaperPaw atá agat, cá bhfuil a chód foinseach, agus faoi cé na ceadúnais a thagann sé.\n\nFaigheann tú é ag deireadh na Socruithe, mar Faoi PaperPaw. Roghnaigh sraith leis na cnaipí saigheada agus Roghnaigh, nó tapáil í. Liostaítear freisin na breiseáin atá tógtha isteach sa dochtearraí agus, ar ghléasanna a luchtaíonn breiseáin le cód, an méarlorg a gcaithfear a leithéid de bhreiseáin a thógáil dó.\n\nOsclaíonn Ceadúnais mar théacs sa léitheoir, mar sin déanann tú leathanaigh a iompú mar a dhéanfá le leabhar. Tá ceadúnas PaperPaw féin ann agus ceadúnais na gclófhoirne, na dtáscán agus na bpatrún fleiscínithe a thagann leis. Féadfaidh breiseáin líne dá gcuid féin a chur leis, ar nós údar téama."
