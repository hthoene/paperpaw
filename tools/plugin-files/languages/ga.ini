format-epub.plugin.name = EPUB
format-epub.plugin.description = Osclaíonn leabhair EPUB lena stíleanna, clár ábhair agus íomhánna.
format-epub.plugin.how = "Osclaíonn leabhair EPUB ón leabharlann cosúil le haon leabhar eile, lena gclár ábhair, íomhánna agus stíl an fhoilsitheora. Osclaítear leathanaigh ghréasáin (HTML), Markdown, FictionBook (.fb2) agus cartlanna greannán (.cbz) ar an mbealach céanna, gach ceann ina bhreiseán dá chuid féin.\n\nIompaítear caibidil an chéad uair a osclaíonn tú í agus coinnítear i dtaisce an bhreiseáin í, mar sin bíonn sé níos tapúla ina dhiaidh sin agus oibríonn leabhair mhóra ar ghléasanna beaga. Faigh an clár ábhair faoi Ábhar sa roghchlár léitheoireachta. Is é an socrú Formáidiú an fhoilsitheora, faoi Léamh, a chinneann an bhfuil stíl an leabhair féin i bhfeidhm."
format-epub.title = Leabhar leictreonach EPUB
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Osclaíonn leabhair FictionBook (.fb2, zipeáilte freisin).
format-fb2.plugin.how = "Osclaíonn leabhair FictionBook (.fb2), coitianta do leabhair Rúisise agus eile, zipeáilte freisin (.fb2.zip), lena dteideal, údair, clúdach agus caibidlí.\n\nCuir isteach san fhillteán leabharlainne iad; taispeántar sa leabharlann iad agus osclaítear iad mar aon leabhar eile."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Osclaíonn leathanaigh ghréasáin a shábháiltear mar chomhaid, ag taispeáint an méid atá le léamh amháin.
format-html.plugin.how = "Osclaíonn leathanaigh ghréasáin a shábháiltear mar chomhaid (.html, .htm, .xhtml) mar leabhair: an méid atá ann le léamh amháin, gan roghchláir, fógraí agus a leithéidí timpeall air.\n\nCuir an comhad isteach san fhillteán leabharlainne agus oscail ón leabharlann é cosúil le haon leabhar. Oibríonn naisc laistigh den leathanach; taispeántar pictiúir san áit a bhfuil siad sa chomhad."
format-html.title = Leathanach gréasáin (HTML)
format-images.plugin.name = Pictiúir
format-images.plugin.description = Osclaíonn pictiúir (.jpg, .png, .gif) mar leabhair, leathanach an ceann.
format-images.plugin.how = "Osclaítear pictiúir (.jpg, .png, .gif) ón leabharlann mar leabhair, pictiúr amháin an leathanach, oiriúnaithe don scáileán.\n\nChun fillteán iomlán pictiúr a léamh, oscail a chéad phictiúr: leanann na pictiúir ina dhiaidh san fhillteán, in ord a n-ainmneacha (2 roimh 10). Tosaíonn pictiúr níos déanaí san fhillteán ansin; cuimhnítear ar an áit i ngach ceann ar leith. Léitear fillteán suas le 300 pictiúr ón gceann a osclaíonn tú.\n\nTaispeánann comhad nach pictiúr é, nó atá rómhór, a ainm ina ionad. I gcás leabhair le go leor pictiúr agus a theideal féin, is fearr cartlann greannán (.cbz)."
format-images.title = Pictiúr
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Osclaíonn comhaid Markdown (.md), m.sh. nótaí.
format-markdown.plugin.how = "Osclaíonn comhaid Markdown (.md), ar nós nótaí, mar leabhair: ceannteidil, liostaí, athfhriotail agus béim mar atá i gceist leo, ní mar chomharthaí.\n\nCuir na comhaid isteach san fhillteán leabharlainne agus oscail ón leabharlann iad. Is é an chéad cheannteideal a theideal; taispeántar pictiúir le hais an chomhaid san áit a ainmníonn an téacs iad."
format-markdown.title = Markdown
format-mobi.plugin.name = Leabhair MOBI
format-mobi.plugin.description = Osclaíonn comhaid .mobi agus .azw gan DRM.
format-mobi.plugin.how = "Osclaítear leabhair MOBI (.mobi, .azw) ón leabharlann cosúil le haon leabhar, gan aon rud le socrú. Tagann an teideal, na húdair, an teanga agus an clúdach ón leabhar, agus déantar an liosta ábhair óna cheannteidil.\n\nIompaítear an leabhar an chéad uair a osclaíonn tú é, rud a thógann cúpla soicind do cheann fada; ina dhiaidh sin osclaítear láithreach é. Taispeántar téacs, ceannteidil, cló trom agus iodálach, naisc agus pictiúir.\n\nNí féidir leabhair le DRM (an chuid is mó de na leabhair a cheannaítear ó siopa) a oscailt, ná leabhair le comhbhrú Huffman ná i bhfoirm níos nuaí KF8 (.azw3): deir PaperPaw é sin nuair a osclaíonn tú iad. Osclaíonn cóip mar EPUB, a dhéantar le huirlis ar nós Calibre, i gcónaí."
format-mobi.title = Leabhair MOBI
format-rtf.plugin.name = Doiciméid RTF
format-rtf.plugin.description = Osclaíonn comhaid .rtf mar leabhair.
format-rtf.title = Doiciméid RTF
format-txt.plugin.name = Gnáththéacs
format-txt.plugin.description = Osclaíonn comhaid ghnáththéacs (.txt).
format-txt.plugin.how = "Osclaítear comhaid ghnáththéacs (.txt) ón leabharlann cosúil le haon leabhar, gan aon rud le socrú. Léann an breiseán téacs UTF-8, UTF-16 agus Windows-1252 agus aimsíonn sé an códú ina aonar.\n\nLeanann míreanna na línte folamha sa chomhad; mura bhfuil aon cheann ann, is mír í gach líne. I gcomhaid Project Gutenberg fágtar téacs an cheadúnais ar lár ag an tús agus ag an deireadh, agus tógtar an teideal agus an t-údar ón gceanntásc.\n\nNí luchtaítear an comhad riamh ina iomláine, mar sin osclaítear téacsanna an-mhóra ar ghléasanna beaga freisin."
format-txt.title = Gnáththéacs
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Osclaíonn leabhair XTC agus XTCH, leathanaigh réamhrindreáilte léitheoirí Xteink.
format-xtc.plugin.how = "Is leabhair iad comhaid XTC agus XTCH a bhfuil a leathanaigh rindreáilte cheana mar phictiúir, mar a dhéanann tiontairí do léitheoirí Xteink. Osclaítear iad ón leabharlann cosúil le haon leabhar.\n\nMar gheall gur pictiúr seasta é gach leathanach, ní féidir méid an téacs a athrú ná é a shocrú i gclófhoireann eile. Tá na leathanaigh dubh agus bán nó tá ceithre liath acu. Díchódaítear gach leathanach nuair a thaispeántar é, mar sin is beag cuimhne atá de dhíth, ar an X4 freisin.\n\nTógtar an teideal, an t-údar agus na caibidlí ón gcomhad nuair atá siad aige."
format-xtc.title = Leathanaigh XTC
help.plugin.name = Leideanna
help.plugin.description = Taispeánann cad a dhéanann rialtáin scáileáin, an chéad uair a osclaítear é.
help.plugin.how = "An chéad uair a osclaítear scáileán, deir nóta gearr os a chionn cad a dhéanann a rialtáin: na codanna den scáileán a bhfuil tapáil ag dul chucu, i bhfráma, agus cad a dhéanann na cnaipí.\n\nDúnann tapáil nó cnaipe ar bith an nóta, agus ní thagann sé arís don scáileán sin. Cuireann Gan tuilleadh leideanna iad uile as.\n\nSna socruithe, faoi Córas, cuireann Leideanna air nó as iad, agus taispeánann Taispeáin leideanna arís nóta gach scáileáin uair amháin eile."
