format-docx.plugin.description = Osclaíonn comhaid .docx, mar a shábhálann Word agus cláir eile iad.
format-docx.plugin.how = "Osclaíonn doiciméid .docx mar leabhair: ceannteidil le clár ábhair, liostaí, táblaí, cló trom agus iodálach, naisc agus pictiúir (JPEG, PNG, GIF).\n\nCuir na comhaid isteach san fhillteán leabharlainne agus oscail ón leabharlann iad. Tagann an teideal agus an t-údar ó airíonna an doiciméid. Ní thaispeántar fonótaí, ceanntásca agus buntásca, ná tuairimí."
