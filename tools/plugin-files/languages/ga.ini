tasks.plugin.name = Tascanna
tasks.plugin.description = Liostaí le déanamh le dátaí dlite agus tosaíochtaí, ar an léitheoir nó sioncrónaithe le do fhreastalaí CalDAV, le giuirléidí don scáileán baile.
tasks.plugin.how = "Liostaí le déanamh ar do léitheoir: tascanna le dáta dlite agus tosaíocht, a thic tú nuair atá siad déanta. Oibríonn siad gan aon socrú agus gan líonra, agus is féidir iad a choinneáil ar aon dul le freastalaí CalDAV (Nextcloud, Radicale, Baïkal, Fastmail agus eile), ionas go mbíonn na liostaí céanna ar do ghuthán agus ar do ríomhaire.\n\nOscail Tascanna ón roghchlár uirlisí. Ainmníonn an chéad tsraith an liosta a thaispeántar; roghnaigh í le haghaidh liosta eile, le haghaidh Inniu agus thar téarma thar gach liosta, le haghaidh liosta nua, chun sioncrónú, nó chun an cuntas a shocrú. Osclaíonn Cuir tasc leis an méarchlár. Ticeálann Roghnaigh ar thasc é (arís: gan déanamh). Coinnigh tasc síos nó brúigh Roghchlár chun a theideal, a dháta dlite (inniu, amárach, i gceann seachtaine, nó dáta a chlóscríobhann tú ar nós 2026-12-24) nó a thosaíocht a athrú, nó chun é a bhaint. Tagann tascanna oscailte ar dtús, de réir a lae agus ansin de réir tosaíochta; fanann tascanna déanta ag an deireadh ar feadh seachtaine (socraithe faoi Tascanna sna socruithe), ansin fágann siad an léitheoir.\n\nGiuirléidí don scáileán baile (coinnigh an scáileán baile síos, ansin cuir giuirléid leis): Taispeánann Tascanna inniu an méid atá dlite inniu nó thar téarma, taispeánann Liosta tascanna liosta amháin, áiríonn Tascanna oscailte iad, agus taispeánann An chéad tasc eile an ceann le déanamh ina dhiaidh sin. Ticeálann tapáil ar thasc i ngiuirléid é; osclaíonn tapáil ar cheannteideal na liostaí.\n\nChun sioncrónú, roghnaigh Cuntas CalDAV ón tsraith liosta agus cuir isteach seoladh an fhreastalaí, d'ainm úsáideora agus focal faire (aip-fhocal faire is fearr). Is leor seoladh an fhreastalaí, m.sh. cloud.example.com/remote.php/dav; aimsíonn an léitheoir do liostaí tascanna as sin. Éiríonn gach liosta tascanna den fhreastalaí ina liosta ar an léitheoir. Sioncrónaíonn an léitheoir nuair a osclaíonn tú Tascanna, nuair a roghnaíonn tú Sioncrónaigh anois, agus nuair atá an líonra air ar aon nós; fanann an méid a athraíonn tú gan líonra agus seoltar níos déanaí é. Má athraíodh tasc ar an léitheoir agus in áit eile idir an dá linn, glactar le leagan an fhreastalaí agus coinnítear do leagan féin mar thasc nua lena thaobh, ionas nach gcailltear aon rud. Fanann nótaí, aláraim agus gach rud eile atá ag tasc ar an bhfreastalaí mar atá siad. Taispeántar tascanna athfhillteacha ach athraítear iad san áit ar rinne tú iad. Coinníonn an léitheoir suas le 200 tasc i 12 liosta."
