lock.plugin.name = Glas an scáileáin
lock.plugin.description = PIN, patrún nó focal faire nuair a dhúisíonn an gléas; tadhall faoi ghlas agus tú ag léamh.
lock.plugin.how = "Iarrann glas an scáileáin PIN, patrún nó focal faire nuair a thosaíonn PaperPaw agus nuair a dhúisíonn an gléas. Tá sé as ar dtús. Coinníonn sé amach úsáid fhánach amháin: coinnítear an cód agus líon na dtriail mícheart ar an gcárta SD, mar sin gheobhaidh aon duine a bhaineann an cárta amach, a chuireann in eagar é nó a mhalartaíonn é thar an nglas.\n\nSocraigh é sna socruithe, faoi Gléas, Glas an scáileáin: cuir isteach an cód atá in úsáid má tá ceann ann, roghnaigh an cineál, ansin an cód nua faoi dhó. Ní thairgtear patrún ach ar scáileáin tadhaill.\n\nTar éis cúig thriail mhícheart fanann an chéad cheann eile leathnóiméad. Glasálann Glasáil anois láithreach agus is féidir é a chur ar chnaipe, ar chaoi, nó ar riail. Is féidir Glasáil tar éis dúiseachta a chur as, ionas nach nglasálann ach fíor-thosú (cumhacht air nó atosú), ach amháin nuair is tosú é gach dúiseacht, mar atá ar an X4 ar cheallra.\n\nLe hais, glas tadhaill: déanann Glasáil tadhall sa phainéal tapa agus sa roghchlár léitheoireachta nach ndéanann tapáil, scuabadh ná an peann aon rud, agus go n-oibríonn na cnaipí fós, m.sh. chun léamh agus lámh ar an scáileán. Chun díghlasáil, tapáil faoi dhó le méar amháin agus coinnigh síos í nóiméad; osclaíonn coinneáil an chnaipe cumhachta síos an roghchlár Cumhachta, áit a ndéanann Díghlasáil tadhall é leis na cnaipí; ar an X4 Pro, díghlasálann coinneáil an eochair baile síos láithreach."
