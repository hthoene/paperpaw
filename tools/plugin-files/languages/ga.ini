update.plugin.name = Nuashonrú
update.plugin.description = Suiteálann nuashonruithe dochtearraí, ón gcárta nó íoslódáilte ón idirlíon.
update.plugin.how = "Suiteálann Nuashonrú dochtearraí nua, ar ghléasanna a bhfuil PaperPaw ina dhochtearraí, ar nós an X4. Faigheann tú é sna socruithe, mar Nuashonrú.\n\nFiafraíonn Cuardaigh ar líne den fhreastalaí nuashonraithe an bhfuil PaperPaw níos nuaí ann agus íoslódálann é, rud a thógann cúpla nóiméad thar Wi-Fi. Nó cóipeáil comhad nuashonraithe (a chríochnaíonn i .bin, ó paperpaw.org) isteach san fhillteán updates ar an gcárta, mar shampla le Aistriú Wi-Fi. Ansin tógann Suiteáil thart ar nóiméad agus atosaíonn an gléas; fanann leabhair, socruithe agus suíomhanna léitheoireachta.\n\nLe Cuardaigh nuashonruithe air (sna socruithe, as ar dtús), fiafraíonn an gléas thart ar uair sa tseachtain ina aonar, nuair atá Wi-Fi air ar aon nós nó nuair a bhíonn sé ag luchtú amháin. Fanann PaperPaw níos nuaí a aimsíonn sé anseo; ní chuireann aon rud isteach ar do léamh. Seolann cuardach an méid atá ar siúl ar an ngléas, gan ainm ná uimhir an ghléis; chun gléasanna a chomhaireamh, seolann sé freisin ar fhiafraigh tú agus ar é seo an chéad chuardach den lá, den tseachtain nó den mhí.\n\nMura bhfuil leagan don eisiúint nua ag breiseán a úsáideann tú go fóill, fanann an nuashonrú leo. Ní shuiteáiltear leagan níos sine ach má roghnaíonn tú é.\n\nIs féidir dochtearraí eile, ar nós CrossPoint, a shuiteáil as seo freisin: cuir a chomhad (a chríochnaíonn i .bin) san fhillteán updates, agus oscail Nuashonrú. Seiceálann PaperPaw gur dochtearraí iomlán é don ghléas seo, gan damáiste, ach ní féidir leis a rá cé a rinne é, mar níl sé sínithe. Scríobhann Suiteáil ar aon nós é isteach i leath eile an flash, agus tosaíonn an gléas é; fanann PaperPaw ina leath féin go suiteálann an dochtearraí sin rud éigin os a chionn. Chun filleadh ar PaperPaw níos déanaí, suiteáil a chomhad suiteála (paperpaw-<gléas>-<leagan>-install.bin) ó roghchlár an dochtearraí eile, ar nós nuashonrú dochtearraí SD CrossPoint."
