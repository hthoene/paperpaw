store.plugin.name = Siopa breiseán
store.plugin.description = Aimsíonn, suiteálann, nuashonraíonn agus baineann breiseáin don ghléas seo.
store.plugin.how = "Aimsíonn an Siopa breiseán breiseáin don ghléas seo ar an idirlíon agus suiteálann, nuashonraíonn agus baineann sé iad. Oscail é ó Uirlisí; tá Wi-Fi de dhíth air.\n\nTaispeánann an tús an méid a mholann an leabharlann, an méid atá nua nó coitianta anois, ansin na grúpaí. Liostaíonn grúpa a bhreiseáin i meascán cothrom a athraíonn gach lá, ionas go bhfeictear gach breiseán; sórtáil iad ó A go Z, de réir nuachta nó de réir an nuashonraithe deireanaigh, agus téigh go litir i liostaí fada. Oscail ceann chun a leathanach a fheiceáil, lena mhéid agus an chuimhne a thógann sé, ansin roghnaigh Suiteáil, Nuashonraigh nó Bain. Tugann Nuashonraigh gach ceann gach breiseán suiteáilte cothrom le dáta.\n\nRitheann breiseáin cóid le rochtain iomlán ar an ngléas: deir an siopa é sin agus fiafraíonn sé ar dtús, agus tosaíonn siad tar éis atosaithe. Má théann ceann in olcas, tosaíonn PaperPaw gan breiseáin cóid agus deir sé cé acu. Socraíonn Leabharlann breiseán cá dtagann an liosta.\n\nLiostaíonn Breiseáin phobail, i Socruithe, Córas, breiseáin a d'fhoilsigh daoine eile ar GitHub freisin. Níor athbhreithnigh aon duine iad: tá siad marcáilte Gan athbhreithniú, taispeánann leathanach breiseáin cóid an eochair lena bhfuil sé sínithe, agus ní shuiteáiltear nuashonrú sínithe le heochair eile.\n\nCuireann Foinsí, an tsraith dheireanach den tús, liostaí breiseán daoine eile leis le haghaidh a seolta (https://…/plugins.json), liostaíonn ceann acu in ionad cheann PaperPaw, nó baineann é. In ionad clóscríobh, cuir comhad sources.txt le seoladh amháin ar gach líne isteach i .paperpaw/plugins/store ar an gcárta: taispeántar na seolta faoi Foinsí mar nua. Ní sheiceálann PaperPaw foinse ná a breiseáin, agus déanann an gléas teagmháil le freastalaí na foinse. Síníonn foinse a liosta; coinníonn an gléas eochair an chéad liosta a léann sé agus ón am sin ar aghaidh ní ghlacann sé ach le liostaí agus breiseáin cóid atá sínithe leis an eochair sin. Ní fhaigheann breiseán nuashonruithe ach ón bhfoinse as ar suiteáladh é. Tá leabharlann PaperPaw féin ann i gcónaí agus ní féidir í a bhaint; filleann fágáil an tsiopa uirthi."
