widgets.plugin.name = Pacáiste giuirléidí
widgets.plugin.description = Go leor giuirléidí eile don scáileán baile: cloig, féilire, athfhriotail, leabhair, nótaí agus tuilleadh.
widgets.plugin.how = "Cuireann an pacáiste giuirléidí go leor giuirléidí leis an scáileán baile: cloig (analógach, focal, leacáin, domhanda), féilire, an bhliain go dtí seo, comhaireamh síos, céim na gealaí, agus lá agus dáta; athfhriotal an lae, nótaí, rudaí le déanamh, pictiúir, beannacht agus lógó PaperPaw; agus do leabhair, á léamh anois, dul chun cinn, an chéad cheann eile, sraith, ceanáin, aibhsiú agus an leabharlann in uimhreacha. Tá giuirléid ceallra ann freisin.\n\nCuir leis iad le Cuir scáileán baile in eagar sa roghchlár (nó brú fada ar an scáileán baile), ansin Cuir giuirléid leis. Tá socruithe dá cuid féin ag gach ceann, ar nós fráma, méid agus ailíniú. Má roghnaíonn tú giuirléid a athraíonn, ar nós athfhriotal an lae, taispeánann sí an chéad cheann eile. Téann d'athfhriotail féin isteach i quotes.txt i .paperpaw/plugins/widgets ar an gcárta, gach líne mar théacs | údar. Teastaíonn an clog a bheith socraithe ó na giuirléidí ama; socraíonn Wi-Fi é."
