anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Déanann staidéar ar chártaí dlite Anki ar do ríomhaire agus seolann do fhreagraí ar ais, tríd an bhreisiú AnkiConnect.
anki.plugin.how = "Ligeann Anki duit staidéar a dhéanamh ar an léitheoir ar na cártaí atá dlite in Anki ar do ríomhaire, agus seolann sé do fhreagraí ar ais. Úsáideann sé an breisiú saor AnkiConnect (cód breisithe 2055492159) agus AnkiWeb ar chor ar bith. Tá sé as ar dtús: cuir leis ón Siopa breiseán é.\n\nAr an ríomhaire: suiteáil AnkiConnect in Anki (Uirlisí, Breiseáin, Faigh breiseáin) agus atosaigh Anki. Caithfidh Anki a bheith ar oscailt agus tú ag sioncrónú.\n\nDe réir réamhshocraithe ní fhreagraíonn AnkiConnect ach don ríomhaire a bhfuil sé ag rith air (127.0.0.1), mar sin ní féidir leis an léitheoir teacht air. Oscail Uirlisí, Breiseáin, AnkiConnect, Cumraíocht agus socraigh “webBindAddress” go “0.0.0.0” (éist ar an líonra baile). Is é 8765 an port, “webBindPort”, mura n-athraíonn tú é. Má shocraíonn tú “apiKey” ansin, cuir isteach an eochair chéanna anseo. Atosaigh Anki tar éis an chumraíocht a athrú, agus lig d'Anki dul tríd balla dóiteáin an ríomhaire má fhiafraíonn sé. Ná húsáid é seo ach ar líonra ina bhfuil muinín agat: is féidir le duine ar bith air teacht ar AnkiConnect, mar sin is smaoineamh maith eochair.\n\nAr an léitheoir: oscail Anki ó Uirlisí, ansin cuir isteach seoladh an ríomhaire (mar shampla 192.168.1.20) faoi Ríomhaire, an port mura 8765 é, agus an eochair API má shocraigh tú ceann. Roghnaigh Paca, nó fág folamh é do gach paca. Ansin roghnaigh Sioncrónaigh le Anki, agus Wi-Fi air: seoltar do fhreagraí atá ag fanacht ar dtús, ansin faightear na cártaí atá dlite (agus an líon cártaí nua a shocraigh tú), 50 ar a mhéad. Roghnaigh Staidéar chun dul tríothu, gan líonra: taispeáin an freagra agus rátáil é Arís, Deacair, Maith nó Éasca. Coinnítear do fhreagraí ar an léitheoir, fiú gan Wi-Fi, agus téann siad chuig Anki leis an gcéad sioncrónú eile. Socraíonn Anki cathain a thagann cárta ar ais: faightear cárta a d'fhreagair tú Arís arís le sioncrónú níos déanaí nuair a deir Anki go bhfuil sé dlite.\n\nSioncrónaigh nuair a osclaítear Anki, sna socruithe, sioncrónaíonn gach uair a osclaíonn tú an scáileán. Ní úsáideann aon rud an líonra nuair a bhrúnn tú eochair."
