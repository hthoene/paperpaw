fonts-browser.plugin.name = Tuilleadh clófhoirne
fonts-browser.plugin.description = Taispeánann clófhoirne ón idirlíon, gach ceann le sampla, agus íoslódálann iad le léamh leo.
fonts-browser.plugin.how = "Liostaíonn Tuilleadh clófhoirne clófhoirne ó leabharlann clófhoirne ar an idirlíon, gach ainm sa chlófhoireann féin, agus íoslódálann sé na cinn a theastaíonn uait a léamh leo.\n\nFaigheann tú é ag deireadh liosta na gclófhoirne san áit a roghnaítear an chlófhoireann léitheoireachta, sna Socruithe, faoi Léamh, mar Clófhoireann; tá an iontráil chéanna ag na línte stádais dá gclófhoireann. Tapáil clófhoireann (le cnaipí, brúigh Roghnaigh) chun í a fheiceáil níos mó le habairt shampla, ansin roghnaigh Íoslódáil. Is féidir leat an leathanach a fhágáil fad atá sé á íoslódáil. Nuair atá sé déanta, roghnaigh Léigh le (ainm na clófhoirne), nó Úsáid do na línte stádais. Faigheann Nuashonraigh leagan níos nuaí, scriosann Bain an chlófhoireann den ghléas.\n\nTá Wi-Fi de dhíth air.\n\nDO CHLÓFHOIRNE FÉIN\n\nin aice le Tuilleadh clófhoirne, tá Do chlófhoirne féin sa liosta céanna, a thaispeánann an chuid seo den chabhair. Is comhad .ttf nó .otf é clófhoireann de do chuid féin, mar shampla ó Google Fonts.\n\nAr Android agus ar ghléasanna eile a tharraingíonn comhaid chlófhoirne: cóipeáil an comhad isteach san fhillteán fonts (ar Android: PaperPaw/fonts sa stóras comhroinnte), atosaigh PaperPaw agus roghnaigh an chlófhoireann sna Socruithe, faoi Léamh, mar Clófhoireann.\n\nAr an Xteink X4 agus X4 Pro: léann na léitheoirí seo pacáistí clófhoirne, ní comhaid chlófhoirne, mar ní oirfeadh comhaid chlófhoirne dá gcuimhne. Déan pacáiste ar ríomhaire le paperpaw-fontgen, do gach stíl atá agat (tá an ghnáthstíl de dhíth):\n\npaperpaw-fontgen --family \"Mo Chlófhoireann\" --regular MoChlofhoireann-Regular.ttf --bold MoChlofhoireann-Bold.ttf --italic MoChlofhoireann-Italic.ttf plugins\n\nDéanann sé seo an fillteán plugins/font-mo-chlofhoireann. Cóipeáil isteach san fhillteán plugins ar an gcárta cuimhne é, atosaigh, agus roghnaigh Mo Chlófhoireann mar Clófhoireann. Is thart ar leathmheigeabheart pacáiste d'aon stíl amháin do litreacha Laidine; tarraingítear stíleanna a fhágann tú ar lár sa ghnáthstíl. Insíonn an uirlis cé mhéad de na litreacha a iarrann tú atá ag an gclófhoireann (cuireann --chars latin,cyrillic,greek scripteanna leis): ní féidir le clófhoireann gan litreacha do leabhair iad a thaispeáint, mar sin lorg ceann a chlúdaíonn a script.\n\nOibríonn clófhoirne ó Tuilleadh clófhoirne ar an mbealach céanna agus níl aon ríomhaire de dhíth.\n\nChun téacs beag níos géire ar phainéal an e-ink, cuir --hinting light leis an ordú: oireann sé na litreacha do ghreille na bpicteilíní, mar a dhéantar na clófhoirne réamhshocraithe. Gan é tarraingítear na litreacha mar a dhearadh an chlófhoireann iad; oireann --hinting normal agus --hinting mono níos láidre iad. Is fearr clófhoirne le marcanna, ar nós Araibis nó Devanagari, a fhágáil gan é."
