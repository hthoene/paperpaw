update.plugin.name = Aktualizace
update.plugin.description = Instaluje aktualizace firmwaru z karty nebo stažené z internetu.
update.plugin.how = "Aktualizace instaluje nový firmware na zařízeních, kde je PaperPaw firmwarem, například X4. Najdete ji v nastavení jako Aktualizace.\n\nHledat online se zeptá aktualizačního serveru na novější PaperPaw a stáhne ho, což přes Wi-Fi trvá několik minut. Můžete také zkopírovat aktualizační soubor (s příponou .bin, z paperpaw.org) do složky updates na kartě, například přenosem přes Wi-Fi. Instalace pak trvá asi minutu a zařízení se restartuje; knihy, nastavení i pozice čtení zůstanou.\n\nSe zapnutou volbou Hledat aktualizace (v nastavení, zpočátku vypnutá) se zařízení zeptá samo asi jednou týdně, pouze když je Wi-Fi již zapnutá nebo se zařízení nabíjí. Nalezený novější PaperPaw zde počká; čtení nic nepřerušuje. Hledání odesílá údaj o běžící verzi, žádný název ani číslo zařízení; pro počítání zařízení také údaj, zda jste hledání vyžádali a zda jde o první hledání dne, týdne nebo měsíce.\n\nPokud používané doplňky ještě nemají verzi pro nové vydání, aktualizace na ně počká. Starší verze se nainstaluje pouze na vaši žádost.\n\nOdtud lze nainstalovat i jiný firmware, například CrossPoint: vložte jeho soubor (s příponou .bin) do složky updates a otevřete Aktualizace. PaperPaw ověří, že jde o úplný, nepoškozený firmware pro toto zařízení, ale nemůže určit jeho původ, protože není podepsaný. Přesto nainstalovat ho zapíše do druhé poloviny flash paměti a zařízení ho spustí; PaperPaw zůstane ve své polovině, dokud ho tento firmware něčím nepřepíše. Pro pozdější návrat k PaperPaw nainstalujte jeho instalační soubor (paperpaw-<device>-<version>-install.bin) z nabídky druhého firmwaru, například pomocí aktualizace firmwaru z SD v CrossPointu."
