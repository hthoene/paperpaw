vocabulary.sd.readme = "Kartičky ze souborů\n\nVložte sem soubor pro každý balíček: Španělština.tsv vytvoří balíček Španělština.\nSoubory: .tsv, .csv nebo .txt uložené jako UTF-8, nebo .apkg: balíček Anki exportovaný se zaškrtnutou volbou Support older Anki versions. První tři pole jeho poznámek tvoří líc, rub a příklad; plán opakování a média se nenačítají a PaperPaw nikdy nezapisuje soubor Anki.\n\nKaždá kartička na samostatném řádku: líc, rub a příklad (nepovinný), oddělené tabulátorem, čárkou nebo středníkem. První řádek může obsahovat názvy sloupců: front, back, example. Příklad:\n\nKatze\tkočka\tDie Katze schläft.\n\nPoté ve čtečce otevřete Kartičky, vyberte Kartičky na SD kartě a pak Aktualizovat balíčky z karty.\n\nDobré vědět:\n- Balíčky zůstávají ve čtečce včetně postupu učení. Soubor se čte, když je nový nebo změněný, a jeho kartičky se do balíčku přidají nebo se v něm změní.\n- Změňte v souboru rub nebo příklad kartičky: kartička se změní a zachová postup učení.\n- Změňte text líce kartičky: počítá se jako nová kartička a stará začne znovu. Kartičky se párují podle textu líce, mezery a velikost písmen nehrají roli. Uložte balíček do souboru (Kartičky na SD kartě, Uložit balíček na kartu) a každá kartička získá číslo ve sloupci id: změňte tam líc, první dva řádky ponechte beze změny a kartička zachová postup učení.\n- Ukládání zapisuje kartičky balíčku. Obsah souboru, který není kartičkou (řádek bez líce), se nezachová; původní soubor se zkopíruje do _name.bak.tsv.\n- Uložte soubor jako CSV UTF-8 (ne UTF-16 ani ve vlastním formátu tabulkového procesoru). Soubor větší než 4 MiB nebo 20 000 řádků se nečte: rozdělte ho.\n- Smazáním řádku v souboru se kartička z balíčku nesmaže, pokud pro něj nezapnete Odebrat chybějící kartičky. Pak se kartička odebere i s postupem učení.\n- Soubory s názvem začínajícím _ se nečtou.\n"
