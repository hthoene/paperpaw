files.plugin.name = Prohlížeč souborů
files.plugin.description = Vypisuje knihy a složky v zařízení a otevírá je.
files.plugin.how = "Knihovna uvádí knihy z vaší složky knihovny s obálkou, názvem, autorem a pozicí ve čtení. Naposledy čtená kniha je nahoře jako karta, takže ke čtení se vrátíte jedním klepnutím nebo stiskem tlačítka Vybrat. Při hledání knih knihovna uvádí, kolik jich už našla.\n\nNad knihami zvolte, co se zobrazí: všechny, rozečtené, nepřečtené, dočtené nebo police (podle autora, série, štítku, oblíbených či dalšího dílu rozečtených sérií). Klepnutím knihu otevřete; podržením (s tlačítky podržte Vybrat) zobrazíte možnosti: otevřít, označit jako dočtenou či nepřečtenou, informace, přesun do archivu nebo smazání. Klepnutím na nadpis otevřete nabídku knihovny: řazení a zobrazení knih, hledání, složku knihovny a nastavení.\n\nSložku knihovny určíte v Nastavení, v části Knihovna pod Složka knihovny; tam lze také zapnout mřížku obálek. Pro všechny ostatní soubory použijte Soubory v nabídce Nástroje."
