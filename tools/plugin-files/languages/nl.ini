update.plugin.how = "Update installeert nieuwe firmware op apparaten waar PaperPaw de firmware is, zoals de X4. Je vindt dit in de instellingen, onder Update.\n\nOnline zoeken vraagt de updateserver om een nieuwere PaperPaw en downloadt die, wat enkele minuten duurt via Wi-Fi. Je kunt ook een updatebestand (.bin, van paperpaw.org) naar de map updates op de kaart kopiëren, bijvoorbeeld via Wi-Fi-overdracht. Installeren duurt daarna ongeveer een minuut en het apparaat herstart; boeken, instellingen en leesposities blijven behouden.\n\nMet Updates zoeken aan (in de instellingen, aanvankelijk uit) controleert het apparaat ongeveer wekelijks zelf, alleen als Wi-Fi toch al aan staat of tijdens het opladen. Een nieuwere PaperPaw wacht hier; je lezen wordt niet onderbroken. Een zoekactie verstuurt de gebruikte versie, geen apparaatnaam of -nummer; om apparaten te tellen ook of je zelf zocht en of het de eerste zoekactie van de dag, week of maand is.\n\nAls gebruikte plug-ins nog geen geschikte versie hebben, wacht de update op ze. Een oudere versie wordt alleen geïnstalleerd als je die kiest.\n\nEen andere firmware, zoals CrossPoint, kun je hier ook installeren: zet het .bin-bestand in de map updates en open Update. PaperPaw controleert of het volledige, onbeschadigde firmware voor dit apparaat is, maar kan de maker niet bepalen omdat deze niet is ondertekend. Toch installeren schrijft de firmware in de andere helft van het flashgeheugen en start deze; PaperPaw blijft in zijn helft totdat die firmware er iets overheen installeert. Om terug te gaan naar PaperPaw, installeer je het installatiebestand (paperpaw-<device>-<version>-install.bin) via het menu van de andere firmware, zoals SD firmware update in CrossPoint."
