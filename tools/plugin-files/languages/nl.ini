vocabulary.setting.sd-folder.help = Op de SD-kaart: elk CSV-, TSV- of Anki-bestand erin is een set.
vocabulary.sd.readme = "Leerkaarten uit bestanden\n\nZet hier een bestand per set: Spaans.tsv maakt de set Spaans.\nBestanden: .tsv, .csv of .txt, opgeslagen als UTF-8, of .apkg: een Anki-set, geëxporteerd met Support older Anki versions aangevinkt. De eerste drie velden van notities worden voorkant, achterkant en voorbeeld; planning en media worden niet gelezen en PaperPaw schrijft nooit naar een Anki-bestand.\n\nEén kaart per regel: voorkant, achterkant en een optioneel voorbeeld, gescheiden door tab, komma of puntkomma. De eerste regel mag kolommen benoemen: front, back, example. Voorbeeld:\n\nKatze\tkat\tDie Katze schläft.\n\nOpen daarna Leerkaarten op de e-reader, kies Leerkaarten op SD en dan Sets van de kaart bijwerken.\n\nGoed om te weten:\n- De sets blijven op de e-reader met je leervoortgang. Een bestand wordt gelezen als het nieuw of gewijzigd is; de kaarten worden aan de set toegevoegd of daarin gewijzigd.\n- Wijzig de achterkant of het voorbeeld van een kaart in het bestand: de kaart wijzigt en bewaart je voortgang.\n- Wijzig de voorkant: dit telt als een nieuwe kaart en de oude begint opnieuw. Kaarten worden gekoppeld op de tekst op de voorkant; spaties en hoofdletters tellen niet mee. Sla een set op als bestand (Leerkaarten op SD, Set op de kaart opslaan): elke kaart krijgt dan een nummer in de kolom id. Wijzig daar de voorkant, laat de eerste twee regels ongewijzigd, en de kaart bewaart wat je hebt geleerd.\n- Opslaan schrijft de kaarten uit de set. Wat in het bestand geen kaart is (een regel zonder voorkant) wordt niet bewaard; het vorige bestand wordt gekopieerd naar _name.bak.tsv.\n- Sla op als CSV UTF-8 (niet UTF-16 of het eigen formaat van een rekenblad). Een bestand boven 4 MiB of 20.000 regels wordt niet gelezen: splits het.\n- Een regel verwijderen uit het bestand verwijdert de kaart niet uit de set, tenzij je Ontbrekende kaarten verwijderen aanzet voor die set. Dan verdwijnt de kaart met de leervoortgang.\n- Bestanden waarvan de naam met _ begint worden niet gelezen.\n"
