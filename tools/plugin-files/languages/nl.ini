files.plugin.name = Bestandenbrowser
files.plugin.description = Toont en opent boeken en mappen op het apparaat.
files.plugin.how = "De bibliotheek toont de boeken in je bibliotheekmap, met omslag, titel, auteur en leesvoortgang. Het laatst gelezen boek staat bovenaan als kaart: één tik of druk op Kiezen is genoeg om verder te lezen. Tijdens het zoeken naar boeken toont de bibliotheek hoeveel er al gevonden zijn.\n\nKies boven de boeken wat je wilt zien: alle boeken, boeken die je leest, ongelezen of uitgelezen boeken, of de planken (op auteur, serie, label, favorieten, het volgende boek van elke begonnen serie). Tik op een boek om te lezen; houd het ingedrukt (met knoppen: houd Kiezen ingedrukt) om het te openen, als uitgelezen of ongelezen te markeren, informatie te bekijken, te archiveren of te verwijderen. Tik op de titel voor het bibliotheekmenu: sorteren, weergave, zoeken, de bibliotheekmap en instellingen.\n\nDe map stel je in onder Instellingen, Bibliotheek, Bibliotheekmap; daar kun je boeken ook als een raster van omslagen tonen. Gebruik voor andere bestanden Bestanden in het menu Hulpmiddelen."
