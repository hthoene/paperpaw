calibre.plugin.name = Simsiz kutubxona
calibre.plugin.description = Kitoblarni tarmoq orqali qabul qiladi. Calibre uchun simsiz qurilma sifatida ishlaydi.
calibre.plugin.how = "«Simsiz kutubxona» qurilmani kompyuteringizdagi Calibre’da simsiz qurilma sifatida ko‘rsatadi. Shunda Calibre unga kitob yuborishi, ularni ro‘yxatlashi va o‘chirishi mumkin. Kitoblar kutubxonaga tushadi.\n\n«Simsiz kutubxona»ni Asboblar menyusidan oching; qurilma va kompyuter bir Wi-Fi tarmog‘ida bo‘lsin. Calibre’da «Connect/share», so‘ng «Start wireless device connection»ni tanlang. Qurilma kompyuteringizni topgach, uning nomini ko‘rsatadi; «Ulanish»ga bosing (tugmalar bilan «Tanlash»ni bosing). Calibre bu yerda kitob qo‘shishi va o‘chirishi mumkin, shuning uchun faqat o‘z kompyuteringizga ulaning. Ekranni yopish ulanishni tugatadi.\n\nAgar Calibre o‘zi topilmasa, Sozlamalarda, «Kutubxona» ostida, Calibre qismidagi «Manzil»ga uning kompyuteri manzilini kiriting. Calibre 9090 dan boshqa portdan foydalansa, uni :port ko‘rinishida qo‘shing, masalan 192.168.1.20:9091."
