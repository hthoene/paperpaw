widgets.plugin.name = Vidjetlar to‘plami
widgets.plugin.description = Bosh ekran uchun yana ko‘plab vidjetlar: soatlar, taqvim, iqtiboslar, kitoblar, qaydlar va boshqalar.
widgets.plugin.how = "Vidjetlar to‘plami bosh ekran uchun ko‘plab vidjetlar qo‘shadi: soatlar (strelkali, so‘zli, plitkali, dunyo), taqvim, yilning o‘tgan qismi, teskari hisob, oy fazasi hamda kun va sana; kun iqtibosi, qaydlar, vazifalar, rasmlar, salomlashuv va PaperPaw logotipi; kitoblar uchun esa hozir o‘qilayotgan, jarayon, keyingi, turkum, sevimlilar, belgilangan joy va raqamlarda kutubxona. Unda batareya vidjeti ham bor.\n\nUlarni menyudagi «Bosh ekranni tahrirlash» (yoki bosh ekranni bosib turish) bilan, so‘ng «Vidjet qo‘shish» orqali qo‘shing. Har birining ramka, o‘lcham va tekislash kabi o‘z sozlamalari bor. Kun iqtibosi kabi o‘zgaruvchan vidjetni tanlash keyingisini ko‘rsatadi. O‘z iqtiboslaringizni kartadagi .paperpaw/plugins/widgets ichidagi quotes.txt ga, har bir qatorni matn | muallif ko‘rinishida qo‘ying. Vaqt vidjetlari uchun soat sozlangan bo‘lishi kerak; uni Wi-Fi sozlaydi."
