weather.plugin.name = Ob-havo
weather.plugin.description = Hozirgi ob-havo va keyingi kunlar vidjetlar sifatida, Open-Meteo’dan.
weather.plugin.how = "«Ob-havo» hozirgi ob-havo va keyingi kunlarni bosh ekran vidjetlari sifatida, hisob yoki kalit talab qilmaydigan Open-Meteo’dan ko‘rsatadi. «Hozirgi ob-havo» haroratni, holatni va tanlash mumkin bo‘lgan yana ko‘proq narsani, «Prognoz» keyingi kunlarni qatorda yoki ro‘yxatda ko‘rsatadi.\n\nAvval joyni tanlang: sozlamalarda «Ob-havo», «Joy» ostida (nom yozing, so‘ng topilgan joylardan tanlang). Faqat uning koordinatalari yuboriladi va faqat ob-havo vidjeti ko‘rsatilayotganda. Vidjetlarni bosh ekranni tahrirlash orqali qo‘shing.\n\nOb-havo «Eng ko‘pi bilan har qancha yangilash» aytganchalik tez-tez olinadi va faqat tarmoq bo‘lganda: u Wi-Fi’ni hech qachon o‘zi yoqmaydi.\n\nOb-havo ma’lumotlari Open-Meteo.com (https://open-meteo.com) tomonidan, Creative Commons Attribution 4.0 litsenziyasi (CC BY 4.0) ostida."
