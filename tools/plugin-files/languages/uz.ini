update.plugin.name = Yangilanish
update.plugin.description = Dasturiy ta’minot yangilanishlarini kartadan yoki internetdan yuklab o‘rnatadi.
update.plugin.how = "«Yangilanish» PaperPaw dasturiy ta’minot bo‘lgan qurilmalarda, masalan X4’da, yangi dasturiy ta’minotni o‘rnatadi. Uni sozlamalarda «Yangilanish» nomi bilan topasiz.\n\n«Onlayn qidirish» yangilanish serveridan yangiroq PaperPaw so‘raydi va uni yuklab oladi, bu Wi-Fi orqali bir necha daqiqa oladi. Yoki yangilanish faylini (.bin bilan tugaydigan, paperpaw.org dan) kartadagi updates papkasiga, masalan Wi-Fi orqali uzatish bilan, nusxalang. «O‘rnatish» keyin taxminan bir daqiqa oladi va qurilma qayta ishga tushadi; kitoblar, sozlamalar va o‘qish joylari qoladi.\n\n«Yangilanishlarni qidirish» yoqilganda (sozlamalarda, dastlab o‘chirilgan) qurilma taxminan haftada bir marta o‘zi so‘raydi, faqat Wi-Fi baribir yoqilgan yoki quvvatlanayotgan paytda. Topgan yangiroq PaperPaw shu yerda kutadi; hech narsa o‘qishingizni to‘xtatmaydi. Qidiruv qurilma nima ishlatayotganini yuboradi, uning nomi yoki raqamini emas; qurilmalarni sanash uchun yana siz so‘radingizmi va bu kun, hafta yoki oydagi birinchi qidiruvmi.\n\nAgar ishlatadigan plaginlaringizda yangi nashr uchun versiya hali bo‘lmasa, yangilanish ularni kutadi. Eskiroq versiya faqat siz tanlasangiz o‘rnatiladi.\n\nBoshqa dasturiy ta’minot, masalan CrossPoint, ham shu yerdan o‘rnatiladi: uning faylini (.bin bilan tugaydigan) updates papkasiga qo‘ying va «Yangilanish»ni oching. PaperPaw uning bu qurilma uchun butun, shikastlanmagan dasturiy ta’minot ekanini tekshiradi, lekin uni kim yaratganini ayta olmaydi, chunki u imzolanmagan. «Baribir o‘rnatish» uni flash’ning ikkinchi yarmiga yozadi va qurilma uni ishga tushiradi; PaperPaw o‘sha dasturiy ta’minot uning ustiga biror narsa o‘rnatguncha o‘z yarmida qoladi. Keyinroq PaperPaw’ga qaytish uchun uning o‘rnatish faylini (paperpaw-<qurilma>-<versiya>-install.bin) boshqa dasturiy ta’minot menyusidan, masalan CrossPoint’ning SD dasturiy ta’minot yangilanishidan o‘rnating."
