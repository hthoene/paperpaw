notes-overview.plugin.description = Barcha kitoblarning xatcho‘plari va belgilangan joylari bitta ro‘yxatda hamda My Clippings.txt sifatida eksport.
notes-overview.plugin.how = "«Barcha qaydlar» xatcho‘p yoki belgilangan joy qo‘ygan har bir kitobni, nechtaligi bilan ro‘yxatlaydi. Uni Asboblarda oching. Qaydlarini ko‘rish uchun kitobni, kitobni o‘sha joyda ochish uchun qaydni tanlang.\n\nRo‘yxat oxirida «My Clippings.txt sifatida eksport» barcha qaydlarni bitta faylga, kutubxona yonidagi «Exports» papkasiga, Kindle ishlatadigan shaklda (UTF-8) yozadi. Kindle’ning My Clippings.txt faylini o‘qiydigan ilovalar uni o‘qiy oladi. Belgilangan joydagi qayd Kindle’dagidek alohida yozuv bo‘ladi. Bu yerdagi kitobda Kindle o‘rinlari bo‘lmagani uchun «o‘rin» qaydning kitobning necha foizida ekanini bildiradi. Fayl har safar qaytadan yoziladi; u oldingisini almashtiradi."
