stats.plugin.name = O‘qish statistikasi
stats.plugin.description = Qancha va qancha vaqt o‘qiganingizni yozib boradi, taqvim va har bir kitob raqamlari bilan.
stats.plugin.how = "«O‘qish statistikasi» har bir sahifani qancha vaqt o‘qiganingizni yozib boradi. Uni bugun, hafta va ketma-ketligingiz bilan umumiy ko‘rinish, taqvim va har bir kitob raqamlari sifatida ko‘rasiz.\n\nUni Asboblardan yoki o‘qish ekranidagi «Yana»dan oching. Sozlamalarda, «O‘qish statistikasi» ostida «O‘qishni yozib borish»ni o‘chirishingiz, «Kunlik maqsad»ni belgilashingiz hamda hisoblanadigan «Eng qisqa sahifa» va «Eng uzun sahifa»ni belgilashingiz mumkin, shunda varaqlab chiqish yoki ochiq qoldirilgan kitob raqamlarni buzmaydi.\n\n«KOReader bilan sinxronlash» statistikani KOReader bilan WebDAV papkasi orqali almashadi. U shu qurilmadagi KOReader statistikasini ham qabul qiladi. Yozib borish uchun soat sozlangan bo‘lishi kerak: sozlanmagan bo‘lsa, bir marta Wi-Fi’ga ulaning."
