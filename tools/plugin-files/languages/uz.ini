mail.plugin.name = Pochta
mail.plugin.description = Elektron pochtani parol yoki ilova paroli bilan o‘qiydi va yuboradi (IMAP va SMTP), brauzerda kirishsiz.
mail.plugin.how = "«Pochta» elektron xatlarni IMAP va SMTP orqali o‘qiydi va yuboradi. U manzilingiz va parol bilan kiradi, brauzerda kirishsiz, shuning uchun bunga ruxsat beradigan har qanday provayder bilan ishlaydi.\n\nHisobni Sozlamalarda, «Pochta»da sozlang. Provayderingizni tanlang, manzilingiz va parolni kiriting. Ko‘p provayderlar ilova parolini talab qiladi: uni hisobingiz xavfsizlik sozlamalarida yarating va shu yerda ishlating. Oddiy parolingiz ko‘pincha ishlamaydi va u provayderingiz serveridan boshqa joyga hech qachon ketmaydi. U parollar va kalitlar bilan birga saqlanadi.\n\n«Pochta»ni asboblardan oching. «Pochtani tekshirish» eng so‘nggi xatlar va papkalarni oladi. Xatlar kartada saqlanadi, shuning uchun ularni tarmoqsiz o‘qish mumkin. Qurilma ulanadi, oladi va uziladi, shuning uchun Wi-Fi faqat bir lahza yoqilgan bo‘ladi.\n\nAgar provayderingiz ro‘yxatda bo‘lmasa, «O‘z serverlarim»ni tanlang va server nomlari, portlari va xavfsizligini murakkab sozlamalarda belgilang. Sertifikatiga hech bir vakolatli tashkilot kafolat bermaydigan server bir marta unga ishonish-ishonmaslikni so‘raydi; barmoq izini provayderingiz ko‘rsatgan bilan solishtiring.\n\nKitob biriktirilgan xatning (EPUB, PDF va shu kabilar, 2 MB gacha) ostida «Kitobni ochish» bor: u faylni oladi, kutubxonangizga qo‘yadi va ochadi.\n\nYangi xatni «Pochta»ni ochmasdan ko‘rish uchun Sozlamalarda, «Pochta»da «Fonda yangi xatni tekshirish»ni yoqing va qanchalik tez-tezligini tanlang (har 15, 30 yoki 60 daqiqada). U yoqilmaguncha o‘chiq. So‘ng o‘quvchi uyg‘oq va onlayn bo‘lganda vaqti-vaqti bilan xavfsiz ulanish orqali ulanadi, hisoblarni birin-ketin tekshiradi va bosh ekrandagi o‘qilmaganlar sonini yangilaydi. U biroz batareya sarflaydi. «Pochta»ni ochish davom etayotgan tekshiruvni to‘xtatadi.\n\nBosh ekran vidjetlari o‘qilmaganlar sonini, oxirgi va yulduzchali xatlarni, bitta pochta qutisini va xat yozish yorlig‘ini ko‘rsatadi."
