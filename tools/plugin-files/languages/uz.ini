opds.plugin.name = OPDS kataloglari
opds.plugin.description = OPDS kataloglarini ko‘radi, kitoblarini yuklab oladi va papkalarni ular bilan sinxron saqlaydi.
opds.plugin.how = "OPDS kataloglari Project Gutenberg, Calibre-Web, Kavita yoki Komga kabi onlayn kutubxonalardir. Bu plagin ularni papkalardek ko‘radi va qidiradi hamda kitoblarini kutubxonaga yuklab oladi.\n\n«Kataloglar»ni Asboblar menyusidan oching va «Katalog qo‘shish»ni tanlang: manzil va, katalog hisob talab qilsa, foydalanuvchi nomi va parol. Katalogni ko‘rish uchun unga bosing; uni sinxronlash, tahrirlash yoki olib tashlash uchun bosib turing (tugmalarda «Tanlash»ni bosib turing).\n\n«Shu katalogni sinxronlash» yoqilgan bo‘lsa, «Kataloglarni sinxronlash» uning yangi kitoblarini uning papkasiga yuklab oladi. «Sinxronlashdagi kitoblar» bir sinxronlash nechta kitob olishini cheklaydi, shunda katta katalog qurilmani to‘ldirib yubormaydi. Katalog o‘rniga bulutli papka (WebDAV) ishlaydi."
