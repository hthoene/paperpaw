format-cbz.plugin.name = Komikslar
format-cbz.plugin.description = Komiks arxivlarini (.cbz) ochadi, har sahifada bitta rasm.
format-cbz.plugin.how = "Komiks arxivlarini (.cbz) ochadi: har sahifada bitta rasm, ekranga moslab, nomlari tartibida (2 10 dan oldin).\n\nUlarni kutubxona papkasiga qo‘ying va kutubxonadan oching; sahifalarni har qanday kitobdagidek o‘giring. Katta rasmlar birinchi marta biroz vaqt oladi, X4’da boshqalarga qaraganda ko‘proq.\n\nO‘qish sozlamalari (Sozlamalar, O‘qish): «Kadrma-kadr» sahifaning bir vaqtda bitta kadrini ekran imkon qadar katta ko‘rsatadi va sahifa o‘girish ular bo‘ylab yuradi; kadrsiz sahifa to‘liq ko‘rsatiladi. «Komiks sahifalari yo‘nalishi» manga uchun sahifa o‘girishni aks ettiradi (o‘ngdan chapga); kitobning o‘z ComicInfo.xml fayli buni o‘zi aytadi. Kutubxona kitob nomini va uning turkumi va raqamini ComicInfo.xml’dan ko‘rsatadi."
format-cbz.title = Komiks (CBZ)
format-cbz.setting.direction = Komiks sahifalari yo‘nalishi
format-cbz.setting.direction.help = Manga: sahifa o‘girish aks ettiriladi.
format-cbz.direction.book = Kitob aytganidek
format-cbz.direction.ltr = Chapdan o‘ngga
format-cbz.direction.rtl = O‘ngdan chapga
format-cbz.setting.panels = Kadrma-kadr
format-cbz.setting.panels.help = Bir vaqtda bitta kadr, sahifa o‘girish ular bo‘ylab yuradi.
format-docx.plugin.name = DOCX hujjatlar
format-docx.plugin.description = Word va boshqa dasturlar saqlagan .docx fayllarni ochadi.
format-docx.plugin.how = "Hujjatlar .docx ni kitob sifatida ochadi: mundarijali sarlavhalar, ro‘yxatlar, jadvallar, qalin va kursiv matn, havolalar va rasmlar (JPEG, PNG, GIF).\n\nFayllarni kutubxona papkasiga qo‘ying va kutubxonadan oching. Nom va muallif hujjat xususiyatlaridan olinadi. Izohlar, yuqori va pastki kolontitullar hamda sharhlar ko‘rsatilmaydi."
format-docx.title = DOCX hujjat
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB kitoblarni uslublari, mundarijasi va rasmlari bilan ochadi.
format-epub.plugin.how = "EPUB kitoblar kutubxonadan boshqa kitoblardek, mundarijasi, rasmlari va nashriyot uslubi bilan ochiladi. Veb-sahifalar (HTML), Markdown, FictionBook (.fb2) va komiks arxivlari (.cbz) ham xuddi shunday ochiladi, har biri o‘z plagini bilan.\n\nBob siz uni birinchi marta ochganingizda aylantiriladi va plagin keshida saqlanadi, shuning uchun keyin tezroq bo‘ladi va katta kitoblar kichik qurilmalarda ishlaydi. Mundarijani o‘qish menyusida «Mundarija» ostidan toping. Kitobning o‘z uslubi qo‘llanishi «O‘qish» ostidagi «Nashriyot formati» sozlamasiga bog‘liq."
format-epub.title = EPUB elektron kitob
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook kitoblarni (.fb2, siqilgan ham) ochadi.
format-fb2.plugin.how = "Rus va boshqa kitoblar uchun keng tarqalgan FictionBook kitoblarni (.fb2), siqilgan (.fb2.zip) ham, nomi, mualliflari, muqovasi va boblari bilan ochadi.\n\nUlarni kutubxona papkasiga qo‘ying; ular kutubxonada ko‘rinadi va boshqa kitoblardek ochiladi."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Fayl sifatida saqlangan veb-sahifalarni ochadi, faqat o‘qiladigan narsani ko‘rsatadi.
format-html.plugin.how = "Fayl sifatida saqlangan veb-sahifalarni (.html, .htm, .xhtml) kitob sifatida ochadi: faqat o‘qiladigan narsani, atrofidagi menyu, reklama va shu kabilarsiz.\n\nFaylni kutubxona papkasiga qo‘ying va kutubxonadan har qanday kitobdek oching. Sahifa ichidagi havolalar ishlaydi; rasmlar fayldagi joyida ko‘rinadi."
format-html.title = Veb-sahifa (HTML)
format-images.plugin.name = Rasmlar
format-images.plugin.description = Rasmlarni (.jpg, .png, .gif) kitob sifatida ochadi, har biri bitta sahifa.
format-images.plugin.how = "Rasmlar (.jpg, .png, .gif) kutubxonadan kitoblardek ochiladi, har sahifada bitta rasm, ekranga moslab.\n\nRasmlarning butun papkasini o‘qish uchun uning birinchi rasmini oching: papkadagi undan keyingi rasmlar nomlari tartibida (2 10 dan oldin) ergashadi. Papkaning keyingi rasmi shu yerdan boshlanadi; har birida o‘qish joyi alohida eslab qolinadi. 300 tagacha rasmli papka siz ochgan rasmdan boshlab o‘qiladi.\n\nRasm bo‘lmagan yoki juda katta fayl o‘rnida o‘z nomini ko‘rsatadi. O‘z nomli ko‘p rasmli kitob uchun komiks arxivi (.cbz) yaxshiroq shakl."
format-images.title = Rasm
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown fayllarini (.md), masalan qaydlarni ochadi.
format-markdown.plugin.how = "Markdown fayllarini (.md), masalan qaydlarni, kitob sifatida ochadi: sarlavhalar, ro‘yxatlar, iqtiboslar va ta’kidlar belgi emas, mo‘ljallanganidek ko‘rinadi.\n\nFayllarni kutubxona papkasiga qo‘ying va kutubxonadan oching. Birinchi sarlavha uning nomi bo‘ladi; fayl yonidagi rasmlar matn ularni atagan joyda ko‘rinadi."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI kitoblar
format-mobi.plugin.description = DRM’siz .mobi va .azw fayllarini ochadi.
format-mobi.plugin.how = "MOBI kitoblar (.mobi, .azw) kutubxonadan har qanday kitobdek ochiladi, hech narsa sozlash kerak emas. Nom, mualliflar, til va muqova kitobning o‘zidan olinadi, mundarija esa sarlavhalaridan tuziladi.\n\nKitob birinchi marta ochilganda aylantiriladi, uzun kitob uchun bu bir necha soniya oladi; keyin u bir zumda ochiladi. Matn, sarlavhalar, qalin va kursiv, havolalar va rasmlar ko‘rsatiladi.\n\nDRM’li kitoblarni (do‘kondan sotib olingan ko‘pchilik kitoblar), shuningdek Huffman siqishli yoki yangiroq KF8 shakldagi (.azw3) kitoblarni ochib bo‘lmaydi: PaperPaw ularni ochganingizda shuni aytadi. Calibre kabi vosita bilan tayyorlangan EPUB nusxasi har doim ochiladi."
format-mobi.title = MOBI kitoblar
format-rtf.plugin.name = RTF hujjatlar
format-rtf.plugin.description = .rtf fayllarini kitob sifatida ochadi.
format-rtf.title = RTF hujjatlar
format-txt.plugin.name = Oddiy matn
format-txt.plugin.description = Oddiy matn fayllarini (.txt) ochadi.
format-txt.plugin.how = "Oddiy matn fayllari (.txt) kutubxonadan har qanday kitobdek ochiladi, hech narsa sozlash kerak emas. Plagin UTF-8, UTF-16 va Windows-1252 matnni o‘qiydi va kodlashni o‘zi topadi.\n\nAbzatslar fayldagi bo‘sh qatorlarga ergashadi; faylda ular bo‘lmasa, har qator abzats bo‘ladi. Project Gutenberg fayllarida boshi va oxiridagi litsenziya matni qoldiriladi, nom va muallif sarlavhadan olinadi.\n\nFayl hech qachon butunlay yuklanmaydi, shuning uchun juda katta matnlar kichik qurilmalarda ham ochiladi."
format-txt.title = Oddiy matn
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC va XTCH kitoblarini, Xteink o‘quvchilarining oldindan chizilgan sahifalarini ochadi.
format-xtc.plugin.how = "XTC va XTCH fayllari sahifalari allaqachon rasm sifatida chizilgan kitoblar bo‘lib, ularni Xteink o‘quvchilari uchun konvertorlar yaratadi. Ular kutubxonadan har qanday kitobdek ochiladi.\n\nHar bir sahifa qotirilgan rasm bo‘lgani uchun matn o‘lchamini o‘zgartirib yoki boshqa shriftda ko‘rsatib bo‘lmaydi. Sahifalar oq-qora yoki to‘rt kulrang tusli. Har bir sahifa ko‘rsatilganda dekodlanadi, shuning uchun X4’da ham xotira kam kerak.\n\nNom, muallif va boblar faylda bo‘lsa, undan olinadi."
format-xtc.title = XTC sahifalar
help.plugin.name = Maslahatlar
help.plugin.description = Ekran birinchi marta ochilganda uning boshqaruv elementlari nima qilishini ko‘rsatadi.
help.plugin.how = "Ekran birinchi marta ochilganda uning ustida qisqa izoh uning boshqaruv elementlari nima qilishini aytadi: bosish boradigan ekran qismlari ramka ichida va tugmalar nima qilishi.\n\nBosish yoki istalgan tugma izohni yopadi va u shu ekran uchun qaytib chiqmaydi. «Maslahat kerak emas» barchasini o‘chiradi.\n\nSozlamalarda, «Tizim» ostida «Maslahatlar» ularni yoqadi yoki o‘chiradi, «Maslahatlarni yana ko‘rsatish» esa har bir ekran izohini yana bir marta ko‘rsatadi."
