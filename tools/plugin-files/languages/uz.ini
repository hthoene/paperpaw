lock.plugin.name = Ekran qulfi
lock.plugin.description = Qurilma uyg‘onganda PIN-kod, grafik kalit yoki parol; o‘qish paytida sensor qulflanadi.
lock.plugin.how = "Ekran qulfi PaperPaw ishga tushganda va qurilma uyg‘ongan paytda PIN-kod, grafik kalit yoki parol so‘raydi. Dastlab u o‘chirilgan. U faqat tasodifiy foydalanishdan saqlaydi: kod va noto‘g‘ri urinishlar soni SD kartada saqlanadi, shuning uchun kartani chiqarib olgan, tahrirlagan yoki almashtirgan kishi qulfdan o‘tib ketadi.\n\nUni sozlamalarda, «Qurilma», «Ekran qulfi» ostida sozlang: agar bor bo‘lsa, joriy kodni kiriting, turini tanlang, so‘ng yangi kodni ikki marta kiriting. Grafik kalit faqat sensorli ekranlarda taklif qilinadi.\n\nBeshta noto‘g‘ri urinishdan keyin keyingisi yarim daqiqa kutadi. «Hozir qulflash» darhol qulflaydi va uni tugmaga, imo-ishoraga yoki qoidaga qo‘yish mumkin. «Uyg‘ongandan keyin qulflash»ni o‘chirish mumkin, shunda faqat haqiqiy ishga tushish (yoqish yoki qayta ishga tushirish) qulflaydi, har bir uyg‘onish ishga tushish bo‘lgan joylar, masalan batareyadagi X4 bundan mustasno.\n\nSensor qulfi, uning yonida: tezkor panel va o‘qish menyusidagi «Sensorni qulflash» tugmalar ishlayotganda bosish, surish va qalamni hech narsa qilmaydigan qiladi, masalan qo‘l ekranda turgan holda o‘qish uchun. Qulfni ochish uchun bitta barmoq bilan ikki marta bosing va ikkinchisini bir zum ushlab turing; yoqish tugmasini bosib turish «Quvvat» menyusini ochadi, unda «Sensorni ochish» buni tugmalar bilan qiladi; X4 Pro’da bosh sahifa tugmasini bosib turish darhol ochadi."
lock.setting.kind = Ekran qulfi
