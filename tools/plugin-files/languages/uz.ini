anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Kompyuteringizdagi Anki’ning muddati kelgan kartochkalarini o‘rganadi va javoblaringizni AnkiConnect qo‘shimchasi orqali qaytarib yuboradi.
anki.plugin.how = "Anki kompyuteringizdagi Anki’da muddati kelgan kartochkalarni o‘quvchida o‘rganish va javoblaringizni qaytarib yuborish imkonini beradi. U bepul AnkiConnect qo‘shimchasidan (qo‘shimcha kodi 2055492159) foydalanadi va hech qachon AnkiWeb’dan emas. Dastlab o‘chirilgan: uni Plaginlar do‘konidan qo‘shing.\n\nKompyuterda: Anki’da AnkiConnect’ni o‘rnating (Tools, Add-ons, Get Add-ons) va Anki’ni qayta ishga tushiring. Sinxronlash paytida Anki ochiq bo‘lishi kerak.\n\nAnkiConnect odatda faqat o‘zi ishlayotgan kompyuterga (127.0.0.1) javob beradi, shuning uchun o‘quvchi unga yeta olmaydi. Tools, Add-ons, AnkiConnect, Config’ni oching va «webBindAddress» qiymatini «0.0.0.0» qiling (uy tarmog‘ini tinglash). Port, «webBindPort», o‘zgartirmasangiz 8765. Agar u yerda «apiKey» belgilasangiz, bu yerga ham xuddi shu kalitni kiriting. Konfiguratsiyani o‘zgartirgach, Anki’ni qayta ishga tushiring va kompyuter xavfsizlik devori so‘rasa, Anki’ga ruxsat bering. Buni faqat ishongan tarmog‘ingizda ishlating: undagi har kim AnkiConnect’ga yeta oladi, shuning uchun kalit foydali.\n\nO‘quvchida: Asboblardan Anki’ni oching, so‘ng «Kompyuter» ostida kompyuter manzilini (masalan 192.168.1.20), port 8765 bo‘lmasa uni va agar belgilagan bo‘lsangiz API kalitini kiriting. «To‘plam»ni tanlang yoki barcha to‘plamlar uchun bo‘sh qoldiring. So‘ng Wi-Fi yoqilgan holda «Anki bilan sinxronlash»ni tanlang: avval kutayotgan javoblaringiz yuboriladi, so‘ng muddati kelgan kartochkalar (va siz belgilagan miqdordagi yangilari) olinadi, ko‘pi bilan 50 ta. Ularni tarmoqsiz ko‘rib chiqish uchun «O‘rganish»ni tanlang: javobni ko‘rsating va uni «Qayta», «Qiyin», «Yaxshi» yoki «Oson» deb baholang. Javoblaringiz Wi-Fi bo‘lmaganda ham o‘quvchida saqlanadi va keyingi sinxronlashda Anki’ga boradi. Kartochka qachon qaytishini Anki hal qiladi: «Qayta» deb javob bergan kartochkangiz Anki uning muddati kelganini aytgach, keyingi sinxronlashda yana olinadi.\n\nSozlamalardagi «Anki ochilganda sinxronlash» ekran har ochilganda sinxronlaydi. Tugma bosish hech qachon tarmoqdan foydalanmaydi."
