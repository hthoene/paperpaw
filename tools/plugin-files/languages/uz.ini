translate.plugin.name = Tarjima
translate.plugin.description = Tanlangan matnni onlayn, DeepL bilan tarjima qiladi.
translate.plugin.how = "«Tarjima» tanlangan matnni onlayn DeepL bilan tarjima qiladi. Kitobda matnni tanlang va tanlangan matn menyusida «Tarjima»ni tanlang: tarjima sahifa ustida lug‘at maqolasidek ko‘rinadi. Sahifa tugmalari yoki bosishlar uni varaqlaydi, «Tanlash» yoki uning oxirida bosish uni yopadi.\n\nUnga tarmoq va deepl.com’da bepul o‘z DeepL API kalitingiz kerak (DeepL API Free, oyiga taxminan 500 000 belgi). Uni kiritmaguningizcha panel buni aytadi va bosish uni so‘raydi.\n\nSozlamalarda, «O‘qish» ostida, «Tarjima» bo‘limida «Tarjima tili» tilni belgilaydi; dastlab u PaperPaw’ning o‘z tili."
