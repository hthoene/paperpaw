home.plugin.name = Bosh ekran
home.plugin.description = Boshlang‘ich sahifa: vidjetlar sahifalari, masalan o‘qilayotgan kitob va asboblar.
home.plugin.how = "Bosh ekran sahifalardan tuzilgan, har biri telefondagidek vidjetlar va asboblar to‘ri. Dastlab soat, o‘qiyotgan kitobingiz va yaqinda o‘qilgan kitoblar bir sahifada, barcha asboblar keyingisida.\n\nOchish uchun elementga bosing, sahifalarni almashtirish uchun suring yoki sahifa tugmalaridan foydalaning. Faqat tugmalar bilan strelka tugmalari bir elementdan keyingisiga o‘tadi, «Tanlash» esa uni ochadi.\n\nUni qayta tartiblash uchun bosh ekranni bosib turing, sahifa ostidagi qalamga bosing yoki menyuda «Bosh ekranni tahrirlash»ni tanlang. Elementlarni ko‘chirish uchun sudrang yoki parametrlari uchun biriga bosing, tugmalar bilan ham. «Vidjet qo‘shish» ham shu yerda. «Ustunlar» va «Qatorlar» Sozlamalarda, «Ko‘rinish» ostida, «Bosh ekran» bo‘limida.\n\nYotiq burilgan ekranda bosh ekran xuddi shu elementlarni ko‘proq ustunlar bilan ko‘rsatadi, har bir sahifa keyingisidan oldin to‘ldiriladi, kartochkalar esa taxminan 110 mm dan kengroq bo‘lmaydi; tik joylashtirganingizdan hech narsa o‘zgarmaydi. Uni yotiq holda tartiblang va bu tartib o‘sha yo‘nalish uchun alohida saqlanadi: yangi vidjetlar ikkalasiga ham qo‘shiladi. («Tahrirlash» paytida) «Qo‘shish»dagi «Yotiq tartibni tiklash» chiqarilganiga qaytadi. Bir yo‘nalishda vidjet yoki asbobni olib tashlash uni ikkinchisidan olib tashlamaydi."
