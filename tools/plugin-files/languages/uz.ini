fonts-browser.plugin.name = Yana shriftlar
fonts-browser.plugin.description = Internetdagi shriftlarni namunasi bilan ko‘rsatadi va o‘qish uchun yuklab oladi.
fonts-browser.plugin.how = "«Yana shriftlar» internetdagi shriftlar kutubxonasidan shriftlarni, har bir nomni o‘z shriftida yozib, ro‘yxatlaydi va o‘qish uchun kerak bo‘lganlarini yuklab oladi.\n\nUni o‘qish shrifti tanlanadigan shriftlar ro‘yxati oxirida, Sozlamalarda, «O‘qish» ostida «Shrift»da topasiz; holat qatorlarida ham o‘z shrifti uchun xuddi shunday element bor. Shriftni kattaroq va namuna gap bilan ko‘rish uchun unga bosing (tugmalarda «Tanlash»ni bosing), so‘ng «Yuklab olish»ni tanlang. Yuklanayotganda sahifadan chiqib ketishingiz mumkin. Tugagach, «(shrift nomi) bilan o‘qish»ni yoki holat qatorlari uchun «Foydalanish»ni tanlang. «Yangilash» yangiroq versiyani oladi, «Olib tashlash» shriftni qurilmadan o‘chiradi.\n\nBuning uchun Wi-Fi kerak.\n\nO‘Z SHRIFTLARINGIZ\n\n«Yana shriftlar» yonida shu ro‘yxatda «O‘z shriftlaringiz» bor, u yordamning shu qismini ko‘rsatadi. O‘z shriftingiz .ttf yoki .otf fayli, masalan Google Fonts’dan.\n\nAndroidda va shrift fayllarini chizadigan boshqa qurilmalarda: faylni shriftlar papkasiga nusxalang (Androidda: umumiy xotiradagi PaperPaw/fonts), PaperPaw’ni qayta ishga tushiring va shriftni Sozlamalarda, «O‘qish» ostida «Shrift»da tanlang.\n\nXteink X4 va X4 Pro’da: bu o‘quvchilar shrift fayllarini emas, shrift paketlarini o‘qiydi, chunki shrift fayllari ularning xotirasiga sig‘maydi. Paketni kompyuterda paperpaw-fontgen bilan, mavjud har bir uslub uchun yarating (oddiysi kerak):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nBu plugins/font-my-font papkasini yaratadi. Uni xotira kartasidagi plaginlar papkasiga nusxalang, qayta ishga tushiring va «Shrift»da My Font’ni tanlang. Bitta uslubdagi paket lotin harflari uchun taxminan yarim megabayt; qoldirilgan uslublar oddiy uslubda chiziladi. Vosita so‘ragan harflaringizdan shriftda nechtasi borligini aytadi (--chars latin,cyrillic,greek yozuvlar qo‘shadi): kitobingiz harflari bo‘lmagan shrift ularni ko‘rsata olmaydi, shuning uchun uning yozuvini qamrab oladiganini qidiring.\n\n«Yana shriftlar»dagi shriftlar xuddi shunday ishlaydi va kompyuter talab qilmaydi.\n\nE-ink panelda kichik matn aniqroq bo‘lishi uchun buyruqqa --hinting light qo‘shing: u harflarni piksel to‘riga moslaydi, standart shriftlar ham shunday yaratilgan. Usiz harflar shrift dizayneri chizganidek chiziladi; --hinting normal va --hinting mono ularni kuchliroq moslaydi. Arab yoki Devanagari kabi belgili shriftlarni usiz qoldirgan ma’qul."
