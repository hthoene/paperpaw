setup.plugin.name = Dastlabki sozlash
setup.plugin.description = Birinchi ishga tushishda muhim sozlamalar bo‘yicha qisqa qo‘llanma.
setup.plugin.how = "«Dastlabki sozlash» muhim sozlamalar bo‘yicha qisqa qo‘llanma bo‘lib, PaperPaw birinchi marta ishga tushganda bir marta ko‘rsatiladi. Har bir sahifa bitta narsani so‘raydi, masalan til, tugmalar, matn o‘lchami, vaqt mintaqasi, Wi-Fi yoki qo‘shiladigan bir necha plagin, oqilona javob allaqachon tanlangan, shuning uchun «Keyingi» har doim to‘g‘ri. Bu qurilmaga kerak bo‘lmagan qadamlar tushirib qoldiriladi.\n\nTugmalarga bosing yoki yuqoriga va pastga tugmalari hamda «Tanlash»dan foydalaning. Birinchi sahifadagi «O‘tkazib yuborish» sozlashdan darhol chiqaradi. Oxirgi sahifa kitoblaringiz qayerdan kelishini aytadi.\n\nUni qayta ishga tushirish uchun sozlamalarni oching va «PaperPaw’ni sozlash»ni tanlang. Bu yerda tanlangan hamma narsani keyin sozlamalarda o‘zgartirish mumkin."
