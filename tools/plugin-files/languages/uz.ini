store.plugin.name = Plaginlar do‘koni
store.plugin.description = Bu qurilma uchun plaginlarni topadi, o‘rnatadi, yangilaydi va olib tashlaydi.
store.plugin.how = "Plaginlar do‘koni bu qurilma uchun plaginlarni internetdan topadi hamda ularni o‘rnatadi, yangilaydi va olib tashlaydi. Uni Asboblardan oching; Wi-Fi kerak.\n\nBosh sahifa kutubxona nimani tavsiya qilishini, hozir nima yangi yoki mashhurligini, so‘ng guruhlarni ko‘rsatadi. Guruh o‘z plaginlarini har kuni o‘zgaradigan adolatli aralashmada ro‘yxatlaydi, shunda har bir plagin ko‘zga tushadi; ularni A dan Z gacha, eng yangisi yoki oxirgi yangilanishi bo‘yicha saralang va uzun ro‘yxatlarda harfga o‘ting. Uning sahifasini hajmi va oladigan xotirasi bilan ko‘rish uchun birini oching, so‘ng «O‘rnatish», «Yangilash» yoki «Olib tashlash»ni tanlang. «Hammasini yangilash» barcha o‘rnatilgan plaginlarni yangilaydi.\n\nKodli plaginlar qurilmaga to‘liq kirish bilan ishlaydi: do‘kon buni aytadi va avval so‘raydi, ular qayta ishga tushgandan keyin ishga tushadi. Biri xato qilsa, PaperPaw kodli plaginlarsiz ishga tushadi va qaysi ekanini aytadi. «Plaginlar kutubxonasi» ro‘yxat qayerdan kelishini belgilaydi.\n\nSozlamalarda, «Tizim»dagi «Hamjamiyat plaginlari» boshqalar GitHub’da e’lon qilgan plaginlarni ham ro‘yxatlaydi. Ularni hech kim tekshirmagan: ular «Tekshirilmagan» deb belgilangan, kodli plagin sahifasi u imzolangan kalitni ko‘rsatadi va boshqa kalit bilan imzolangan yangilanish o‘rnatilmaydi.\n\n«Manbalar», bosh sahifaning oxirgi qatori, boshqalarning plagin ro‘yxatlarini manzili bo‘yicha (https://…/plugins.json) qo‘shadi, ulardan birini PaperPaw ro‘yxati o‘rnida ko‘rsatadi yoki olib tashlaydi. Yozish o‘rniga har qatorda bitta manzil bor sources.txt faylini kartadagi .paperpaw/plugins/store ga qo‘ying: manzillar «Manbalar»da yangi sifatida ko‘rinadi. PaperPaw manbani yoki uning plaginlarini tekshirmaydi va qurilma manba serveriga ulanadi. Manba o‘z ro‘yxatini imzolaydi; qurilma o‘qigan birinchi ro‘yxat kalitini saqlaydi va undan keyin faqat shu kalit bilan imzolangan ro‘yxat va kodli plaginlarni qabul qiladi. Plagin yangilanishlarni faqat o‘rnatilgan manbadan oladi. PaperPaw’ning o‘z kutubxonasi doim bor va uni olib tashlab bo‘lmaydi; do‘kondan chiqish unga qaytaradi."
