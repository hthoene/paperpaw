menu.plugin.name = Menyu
menu.plugin.description = Ekran pastidagi menyu, amallar va sozlamalar bilan.
menu.plugin.how = "Menyu nima qilish va nimani sozlash mumkinligini ro‘yxatlaydi. U ekran pastida, ochiq narsaning ustida ochiladi: o‘qish paytida ekran o‘rtasiga bosing yoki «Tanlash»ni bosing. Bajarish uchun elementga bosing yoki uni tanlang.\n\nMenyudagi sozlamalar o‘z qiymatini ko‘rsatadi va joyida o‘zgaradi, shuning uchun menyu ochiq qoladi. Ichida yana elementlari bor element pastki menyuni ochadi.\n\nTezkor panel uchun yuqori chekkadan pastga suring: tez-tez o‘zgartiradigan narsalar tugmalar sifatida. Tugmani almashtirish uchun unga bosing, sozlamalari uchun bosib turing. Faqat tugmalar bilan strelka tugmalari tanlaydi, «Tanlash» almashtiradi, «Orqaga» yopadi. «Ko‘rinish» ostidagi «Menyular» menyularni ro‘yxat yoki plitkalar sifatida ko‘rsatadi."
