vocabulary.plugin.name = So‘zlar daftari
vocabulary.plugin.description = Qidirgan so‘zlaringizni gaplari bilan saqlaydi va telefoningizda yaratilgan kartochkalarni oraliqli takrorlash bilan takrorlaydi.
vocabulary.plugin.how = "«So‘zlar daftari» o‘qiyotganda qidirgan so‘zlaringizni, har birini gapi bilan, keyin ko‘rib chiqish uchun saqlaydi. Ro‘yxatni Asboblarda, eng yangisi birinchi, topasiz; so‘zni yana qidirish uchun uni tanlang. Oxirgi qator, «Eksport», ularni Anki kabi kartochka ilovalari uchun saqlaydi. Ro‘yxat eng yangi 2 000 so‘zni saqlaydi: bundan oshganda eng eskilari ketadi, shuning uchun hammasini saqlash uchun avval eksport qiling.\n\nKartochkalar, ular ham Asboblarda, sizni oraliqli takrorlash bilan sinaydi: «Javobni ko‘rsatish»dan keyin har bir kartochkani «Qayta», «Qiyin», «Yaxshi» yoki «Oson» deb baholaysiz va bu u qachon qaytishini hal qiladi. To‘plamlarni «Telefon bilan tahrirlash» orqali yarating: kodni bir Wi-Fi’dagi telefon bilan skanerlang, so‘ng kartochkalarni yozing yoki ko‘pini birdan qo‘shing: u yerda to‘plamni oching, «Ko‘p kartochkani birdan» ni tanlang va CSV, TSV yoki TXT faylini (har qatorda bitta kartochka: old tomon, orqa tomon, misol; UTF-8) tanlang, ro‘yxatni qo‘ying yoki Anki to‘plamini (.apkg, «Support older Anki versions» bilan eksport qilingan) olib keling.\n\nYoki SD kartadagi fayllardan foydalaning: har bir to‘plam uchun CSV, TSV yoki TXT faylini yoki Anki to‘plamini (.apkg, «Support older Anki versions» bilan eksport qilingan) «Flashcards» papkasiga qo‘ying (Nemis.tsv «Nemis» to‘plamini yaratadi; har qatorda bitta kartochka: old tomon, orqa tomon, misol; UTF-8 sifatida saqlangan; birinchi qator ustunlarni front, back, example deb nomlashi mumkin). «Kartochkalar»dagi «SD kartadagi kartochkalar»ni tanlang yoki «Kartochkalar»ni ochganingizda bu o‘zi bo‘lsin. To‘plamlar o‘rgangan narsangiz bilan o‘quvchida qoladi va fayl yangi yoki o‘zgargan bo‘lsa, u o‘z to‘plamiga birlashtiriladi: fayldagi kartochkaning orqa tomoni yoki misolini o‘zgartiring va kartochka o‘zgaradi va jarayonini saqlaydi; old matnni o‘zgartiring va u yangi kartochka hisoblanadi, eskisi qaytadan boshlanadi (kartochkalar old matn bilan ajratiladi; probel va bosh harflar hisoblanmaydi); o‘chirgan qatoringiz kartochkani o‘chirmaydi (agar shu to‘plam uchun «fayldan yo‘q kartochkalar»ni «Olib tashlash»ga o‘zgartirmasangiz: shunda kartochka keyingi yangilashda jarayoni bilan butunlay olib tashlanadi va faylning biror qatorini o‘qib bo‘lmayotgan paytda hech narsa olib tashlanmaydi). To‘plamni «Kartaga saqlash» bilan fayliga saqlang: fayl kartochkalar raqamlarini (id ustuni) oladi, shuning uchun old tomonlarni kompyuterda tahrirlashingiz mumkin va kartochkalar o‘rgangan narsangizni saqlaydi; fayl faqat id, old tomon, orqa tomon va misolni saqlaydi (boshqa ustunlar, izohlar va qatorlar tartibi saqlanmaydi) va faylning biror qatorini o‘qib bo‘lmagan paytda saqlash rad etiladi; u yerda bo‘lgan fayl birinchi marta _name.bak.tsv ga nusxalanadi (keyingi saqlash bu nusxani almashtirmaydi). 4 MiB yoki 20 000 qatordan katta fayl o‘qilmaydi va u UTF-16 emas, CSV UTF-8 sifatida saqlangan bo‘lishi kerak. Birinchi marta o‘quvchi papkani qanday ishlashi haqidagi izoh bilan yaratadi.\n\nSozlamalarda, «O‘qish» ostida, «Qidirilgan so‘zlar kartochka bo‘ladi» har bir qidirilgan so‘zni «Qidirilgan» to‘plamiga qo‘yadi."
