transfer.plugin.name = Uzatish
transfer.plugin.description = Kitob va boshqa fayllarni bir tarmoqdagi brauzerdan qurilmaga qo‘yish.
transfer.plugin.how = "«Wi-Fi orqali uzatish» kitob va boshqa fayllarni bir tarmoqdagi brauzerdan qurilmaga kabel yoki ilovasiz qo‘yadi. Fayllarni olish, papka yaratish va o‘chirish ham mumkin.\n\nUni Asboblardan oching. Ekran manzilni matn va QR-kod sifatida ko‘rsatadi: uni telefon yoki kompyuterdagi brauzerda oching yoki kodni skanerlang. Manzilda har safar yangidan yaratiladigan kalit bor, shuning uchun tarmoqdagi boshqalar fayllaringizga yeta olmaydi. Uzatish ekran ochiq turganda ishlaydi.\n\nPaperPaw Wi-Fi’ni o‘zi ishlatadigan joyda, masalan X4’da, pastdagi «Routersiz» qurilmaning o‘z tarmog‘ini ochadi, telefon unga kodni skanerlab ulanadi."
