puzzles.plugin.name = Boshqotirmalar
puzzles.plugin.description = Sudoku, krossvord va shaxmat boshqotirmalari, oflayn, kun boshqotirmasi bilan.
puzzles.plugin.how = "Poyezd va kutish xonasi uchun boshqotirmalar, hammasi oflayn: sudoku, krossvord va shaxmat boshqotirmalari. «Boshqotirmalar»ni asboblar menyusidan oching yoki bosh ekranga «Kun boshqotirmasi» vidjetini qo‘shing (bosh ekranni bosib turing, so‘ng vidjet qo‘shing): u bugungi sudoku qanchalik yechilganini ko‘rsatadi va unga bosish uni ochadi. Kun sudokusi kun bo‘yi bir xil.\n\nSudoku: chap va o‘ng kursorni katakma-katak, yuqori va past (sahifa tugmalari) qatorma-qator siljitadi. «Tanlash» raqamlarni ochadi: birini tanlang va qo‘yish uchun yana «Tanlash»ni bosing yoki katakni bo‘shatish uchun «Tozalash»ni. Doska ostidagi tugmalarga yetish uchun «Tanlash»ni (yoki «Menyu»ni) bosib turing: «Qaydlar» raqamlarni qalam belgilariga aylantiradi, «Tekshirish» noto‘g‘ri kataklarni belgilaydi, «Bekor qilish» oxirgi yurishni qaytaradi, «Yangi» siz tanlagan darajadagi (Oson, O‘rtacha, Qiyin) boshqotirmani boshlaydi. Har bir boshqotirmaning aniq bitta yechimi bor. O‘yin chiqib ketganingizda saqlanadi. Sensorli ekranda katakka bosing.\n\nKrossvord: .puz (Across Lite) yoki .ipuz fayllarini xotira kartasidagi «puzzles» papkasiga qo‘ying; birortasi ilova qilinmagan. To‘r bo‘ylab yuring, so‘ng kursor ostidagi so‘zni klaviaturada kiritish uchun «Tanlash»ni bosing (pastki chiziq katakni bo‘sh qoldiradi). Tugmalar gorizontal va vertikalni almashtiradi, ta’riflar ro‘yxatini ko‘rsatadi, harflarni tekshiradi va so‘zni ochadi. Harflar har bir fayl uchun saqlanadi. Aralashtirilgan .puz fayllarini ochib bo‘lmaydi.\n\nShaxmat boshqotirmalari: Lichess boshqotirmalar bazasidan (CC0) kichik to‘plam. Chap va o‘ng donadan donaga sakraydi, yurmoqchi bo‘lgan donani tanlang, so‘ng chap va o‘ng bilan u borishi mumkin bo‘lgan joylarni ko‘rib chiqing va yana «Tanlash»ni bosing. Noto‘g‘ri yurish qaytariladi. «Maslahat» yuriladigan donani belgilaydi, «Keyingi» keyingi boshqotirmaga o‘tadi.\n\nDoska faqat o‘zgargan kataklarni qayta chizadi. «Statistika» yechgan boshqotirmalaringizni sanaydi."
