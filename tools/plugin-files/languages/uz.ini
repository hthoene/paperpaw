calendar.plugin.name = Taqvim
calendar.plugin.description = Taqvimlaringiz o‘quvchida: CalDAV, iCal va fayllardan reja, kun, hafta va oy ko‘rinishlari, kontaktlardan tug‘ilgan kunlar, bosh ekran vidjetlari va uyqu ekrani.
calendar.plugin.how = "Taqvimlaringiz o‘quvchida: keyingi kunlar rejasi, kun, hafta va oy, CalDAV taqvimlari (Nextcloud, Radicale, Baïkal, Fastmail va boshqalar), iCal manzillari (.ics, webcal://), kartadagi taqvim fayllari hamda kontaktlaringizning tug‘ilgan kunlari va yubileylari (CardDAV) voqealari bilan. O‘quvchi taqvimlarni faqat o‘qiydi; hech qachon o‘zgartirmaydi.\n\n«Taqvim»ni asboblar menyusidan oching. Birinchi qator ko‘rinish nomini bildiradi; uni tanlang yoki istalgan qatorni bosib turing yoki «Menyu»ni bosing: «Reja», «Kun», «Hafta», «Oy» va «Tug‘ilgan kunlar» orasida almashish, taqvim qo‘shish yoki sinxronlash uchun. «Kun» va «Hafta»da birinchi ikki qator oldingi va keyingi kun yoki haftaga o‘tadi (sahifa tugmalari ham); «Oy»da strelka tugmalari kunni, sahifa tugmalari oyni siljitadi, «Tanlash» esa kunni ochadi. Voqeada «Tanlash» uni to‘liq ko‘rsatadi: qachon, qayerda, qaysi taqvimda va qanday takrorlanishi. «Orqaga» bir qadam orqaga qaytaradi.\n\nTaqvimni «Taqvimlar»da (menyuda yoki Sozlamalardagi «Taqvim»da) qo‘shing. Turini tanlang: CalDAV hisobi (server manzilining o‘zi yetarli, masalan cloud.example.com/remote.php/dav; voqealari bor har bir taqvim ko‘rinishning bir qismi bo‘ladi), iCal manzili (.ics sifatida e’lon qilingan taqvim), kartadagi taqvim fayli yoki kontaktlar (CardDAV manzillar kitobi: o‘quvchi ularda saqlangan tug‘ilgan kunlar va yubileylarni ko‘rsatadi). Manzilni, hisob uchun foydalanuvchi nomi va parolni (eng yaxshisi ilova paroli; u o‘quvchining parollari bilan birga saqlanadi) hamda nomni kiriting. Har bir taqvimning ularni farqlash uchun o‘zgartirsa bo‘ladigan belgisi bor (nuqta, halqa, kulrang nuqta yoki kvadrat); oltitagacha taqvim.\n\nTakrorlanuvchi voqealar (har kuni, har hafta, har oy, har yil, hafta kunlari, soni, tugash sanalari va chiqarib tashlangan kunlar bilan), kun bo‘yi davom etadigan voqealar va boshqa vaqt mintaqalaridagi voqealar o‘quvchining o‘z soatida ko‘rsatiladi. O‘quvchi bugundan oldingi oltmish kundan keyingi oltmish kungacha bo‘lgan voqealarni, ko‘pi bilan 240 tasini saqlaydi va ularni tarmoqsiz ko‘rsatadi. O‘qiy olmaydigan qoidalari bo‘lgan voqealar bir marta ko‘rsatiladi.\n\nTaqvimlar taqvim ochilganda (ko‘pi bilan har besh daqiqada), «Hozir sinxronlash»ni tanlaganingizda va Sozlamalardagi «Taqvim»da belgilaganingizdek, tarmoq baribir yoqilganda yoki quvvatlash boshlanganda o‘qiladi. O‘quvchi buning uchun hech qachon radiosini yoqmaydi, «Hozir sinxronlash»ni so‘ragan holatdan tashqari.\n\nBosh ekran vidjetlari (bosh ekranni bosib turing, so‘ng vidjet qo‘shing): «Bugun» sana va kun nimaga boyligini, «Keyingi voqea» keyingi voqeani, «Reja» keyingi kunlarni, «Oy» voqealari bor kunlar ostida nuqtali oyni va «Tug‘ilgan kunlar» keyingi tug‘ilgan kunlarni ko‘rsatadi. Voqeaga bosish uni ochadi, oy kuniga bosish o‘sha kunni ochadi. Uyqu ekrani bugungi rejani ko‘rsatishi mumkin: Sozlamalardagi «Uyqu ekrani»da «Taqvim»ni tanlang."
