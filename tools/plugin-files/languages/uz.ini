aids.plugin.name = O‘qish yordamchilari
aids.plugin.description = So‘z boshlari qalin, almashtirilgan so‘zlar, rasmlar: matn o‘zingiz xohlagandek.
aids.plugin.how = "O‘qish yordamchilari o‘qiyotganingizda kitob matni qanday ko‘rinishini o‘zgartiradi. Ular barcha kitoblarga qo‘llanadi. «So‘z boshlari qalin» va «So‘zlarni almashtirish» dastlab o‘chirilgan.\n\nUlarni Sozlamalarda, «O‘qish» ostidagi «O‘qish yordamchilari» bo‘limida topasiz. «So‘z boshlari qalin» har bir so‘zning birinchi yarmini qalin qiladi, ba’zilarga bu o‘qishni osonlashtiradi. «So‘zlarni almashtirish» «rang = ranglar; Mr. = Mister» kabi nuqtali vergul bilan ajratilgan juftliklarni qabul qiladi.\n\nFaqat butun so‘zlar, siz yozgandek aynan o‘zi almashtiriladi, shuning uchun uzunroq so‘zning bir qismi o‘zgarmaydi. Kitob fayli o‘zi o‘zgarmaydi.\n\nKitobdagi rasmlarni ko‘rsatish (dastlabki holat), rasm tavsifidan foydalanadigan «[Rasm: dengizdagi kema]» kabi qisqa qatorga almashtirish yoki tushirib qoldirish mumkin. Shunda sahifada matn uchun joy ko‘proq bo‘ladi va ko‘rsatilmaydigan rasm uchun hech narsa dekodlanmaydi, bu sahifalarning tezroq o‘girilishini ta’minlaydi. Komikslar va rasmlardan iborat boshqa kitoblar o‘zgarmaydi."
