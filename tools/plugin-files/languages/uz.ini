smart-home.plugin.name = Aqlli uy
smart-home.plugin.description = O‘z Home Assistant’ingizdagi qiymatlar va tugmalar boshqaruv panelida va bosh ekran vidjetlari sifatida. Uy tarmog‘ingizdagi Home Assistant bilan ishlaydi.
smart-home.plugin.how = "«Aqlli uy» o‘z Home Assistant’ingizdagi qiymatlar va tugmalarni ko‘rsatadi: harorat, namlik, energiya, eshik va derazalar, chiroqlar, tugmalar va stsenariylar. U serveringiz bilan uy tarmog‘ingizda uning REST API orqali gaplashadi; hech narsa boshqa xizmat orqali o‘tmaydi.\n\n«Aqlli uy»ni asboblar menyusidan oching, so‘ng «Ulanish»: Home Assistant manzilini (masalan http://homeassistant.local:8123) va uzoq muddatli kirish tokenini kiriting (uni Home Assistant profil sahifangiz pastida yarating). Token parollar va kalitlar orasida saqlanadi, hech qachon sozlamalar faylida emas. Oddiy http faqat uy tarmog‘ingizdagi manzillar uchun ishlatiladi; boshqa joydagi server uchun sozlamalarda «Uy tarmog‘idan tashqaridagi serverlar»ni yoqing va yaroqli sertifikatli https’dan foydalaning.\n\n«Obyektlarni tanlash» serveringizda bor narsalar ro‘yxatini ochadi: nom yoki id bo‘yicha qidiring va ko‘rsatish uchun obyektni tanlang (olib tashlash uchun uni yana tanlang). Unga xona berishingiz mumkin, u uni boshqaruv panelida va xona vidjetlarida guruhlaydi. 24 tagacha obyekt saqlanadi. Boshqaruv panelida chiroq, tugma yoki stsenariyni almashtirish uchun uni tanlang: qator server javobini ko‘rsatadi. Tanlagan datchigingiz qayta o‘qiladi.\n\nVidjetlar (bosh ekranni bosib turing, so‘ng vidjet qo‘shing): «Aqlli uy qiymati» bitta ko‘rsatkichni katta ko‘rsatadi, «guruh» xona obyektlarini ro‘yxatlaydi, «tugma» bitta chiroq yoki tugma uchun tugma, «xona» esa xona ko‘rsatkichlari va tugmalari bilan kartochka. Har bir vidjet sozlamalari u qaysi obyekt yoki xonani ko‘rsatishini aytadi.\n\nUy qiymatlari boshqaruv panelini ochganingizda, so‘raganingizda («Yangilash» qatori yoki qiymat yoki guruh vidjetiga bosish), o‘quvchi Wi-Fi allaqachon yoqilgan joyda uyg‘onganida va zaryadlovchi ulangan paytda siz belgilagan jadval bo‘yicha o‘qiladi. U radioni hech qachon o‘zi yoqmaydi va hech qachon yoqiq qoldirmaydi."
