bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Pult, klaviatura va datchiklarni juftlaydi va ulaydi.
bluetooth.plugin.how = "Bluetooth pult, klaviatura va datchiklarni o‘quvchi bilan juftlaydi, agar unda Bluetooth bo‘lsa (X4 Pro).\n\n«Qurilma qo‘shish» yaqin atrofdagilarni qidiradi; avval qurilmani juftlash rejimiga o‘tkazing. Uni tanlang va o‘quvchida tasdiqlang (son ko‘rinsa, solishtiring). Pult yoki klaviatura tugmalari so‘ng sahifa o‘giradi va menyular bo‘ylab yuradi; har bir tugma nima qilishini «Boshqaruv»da o‘zgartiring.\n\n«Pultlar» ularning tugmalari qachon ishlashini aytadi: bu yerda yoqilganda, o‘qish paytida (kitob ochiq turganda ulanadi, batareyani tejaydi) yoki har doim. Menyu tugmasi yoki qurilmani uzoq bosish uni unutadi.\n\nDatchik plaginlar uchun: qaysi plagin undan foydalanishi mumkinligini yoqing. Hech narsa foydalanmayotgan paytda Bluetooth o‘chiq bo‘ladi."
