keys.plugin.name = Tugmalar va imo-ishoralar
keys.plugin.description = Har bir tugma, bosish hududi va surish nima qilishi, qurilmada o‘zgartiriladi.
keys.plugin.how = "«Tugmalar va imo-ishoralar» har bir tugma, bosish hududi va surish nima qilishini ko‘rsatadi va uni qurilmada o‘zgartirish imkonini beradi.\n\nUni sozlamalarda, «Qurilma» ostida oching. Avval o‘zgarish qayerda qo‘llanishini tanlang: «Hamma joyda», «O‘qish paytida», «Bosh ekranda», «Kutubxonada» yoki bitta asbobda. So‘ng bosib turilgan tugma yoki chekkadan ichkariga surish kabi kirishni tanlang va qidirsa bo‘ladigan ro‘yxatdan amalni tanlang. «Standart» plaginlar va tugmalar tartibi belgilaganini qaytaradi.\n\nX4’da tanlash, orqaga qaytish yoki davom etish uchun birorta tugma qolmaydigan o‘zgarish rad etiladi. Oxiridagi «Tugmalar va imo-ishoralarni tiklash» barcha o‘zgarishlarni qaytaradi."
