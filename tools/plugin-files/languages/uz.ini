settings.plugin.name = Sozlamalar
settings.plugin.description = Har bir plagin sozlamalaridan tuzilgan sozlamalar sahifalari.
settings.plugin.how = "«Sozlamalar» PaperPaw va uning plaginlarida sozlash mumkin bo‘lgan hamma narsani sahifalarda ko‘rsatadi. Plaginlarga o‘z ekrani kerak emas: ular e’lon qilgan narsa shu yerda, guruhlarda, har bir sozlamaning tavsifi ostida paydo bo‘ladi.\n\nUni menyudagi «Sozlamalar» bilan oching. Guruhni ochish uchun unga, so‘ng sozlamani almashtirish yoki tanlash uchun uni bosing; sonlarda − va + tugmalari bor. Tugmalar bilan sozlamaga o‘ting va «Tanlash»ni bosing: chap va o‘ng sonni o‘zgartiradi, «Tanlash» uni saqlaydi, «Orqaga» oldingi qiymatga qaytaradi.\n\nO‘zgarishlar darhol qo‘llanadi. «Qidirish» sozlamani so‘zlar bo‘yicha topadi, «Murakkab sozlamalar» kamdan-kam kerak bo‘ladiganlarini qo‘shadi. «Standartga qaytarish» va «Hammasini tiklash» avval so‘raydi."
