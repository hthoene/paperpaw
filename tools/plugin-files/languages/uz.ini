news.plugin.name = Yangiliklar
news.plugin.description = Yangiliklar tasmalarini (RSS, Atom) o‘qish uchun kitob sifatida oladi.
news.plugin.how = "«Yangiliklar» RSS yoki Atom tasmalarini kitobga aylantiradi. Har bir tasma kutubxonaning «Yangiliklar» papkasida bitta kitob bo‘ladi, eng yangi maqolalari oddiy matn sifatida, boshqa kitobdek o‘qish uchun.\n\n«Yangiliklar»ni Asboblar menyusidan oching va «Tasma qo‘shish»ni tanlang; uning manzili gazeta yoki blog saytida. «Yangiliklarni olish» barcha tasmalarni oladi va oldingi kitoblarni almashtiradi. Tasmani yolg‘iz olish yoki olib tashlash uchun uni bosib turing (tugmalarda «Tanlash»ni bosib turing). Olib tashlangan tasma o‘z kitobini kutubxonada qoldiradi.\n\nOlish uchun tarmoq kerak. «Tasmadagi maqolalar» (Sozlamalar, Kutubxona) har bir kitobda nechta maqola bo‘lishini belgilaydi. «Yangiliklar sarlavhalari» vidjeti ularni bosh ekranda ko‘rsatadi."
