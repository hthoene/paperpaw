profiles.plugin.name = O‘qish profillari
profiles.plugin.description = O‘qish va ekran sozlamalarining nomlangan to‘plamlari, bosish bilan almashtiriladi.
profiles.plugin.how = "Profil o‘qish sozlamalaringiz, ekran sozlamalaringiz va holat qatorlarini «Tungi» yoki «Katta shrift» kabi nom ostida saqlaydi va ularni bosish bilan qaytaradi.\n\n«Profillar»ni o‘qish menyusida «Yana» ostida yoki Sozlamalarda «Moslash» ostida oching. Foydalanish uchun profilga bosing; ishlatilayotgani belgilanadi. Joriy sozlamalarni unga saqlash, nomini o‘zgartirish yoki olib tashlash uchun uni bosib turing (tugmalarda «Tanlash»ni bosib turing). «Yangi profil sifatida saqlash» hozirgi sozlanganini saqlaydi.\n\n«Keyingi profil» ro‘yxatdagi keyingisiga o‘tadi; uni tugmaga yoki qoidaga qo‘ying."
