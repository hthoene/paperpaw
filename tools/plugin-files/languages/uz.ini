wifi.plugin.name = Wi-Fi
wifi.plugin.description = Kerak bo‘lganda Wi-Fi tarmoqlariga ulanadi va keyin radiomodulni o‘chiradi.
wifi.plugin.how = "Plaginga internet kerak bo‘lganda (katalog, sinxronlash, do‘kon, uzatish) Wi-Fi tarmoqqa ulanadi va batareya hamda xotirani tejash uchun radiomodulni undan hech narsa foydalanmay qolganidan bir daqiqa o‘tib yoki bosh ekran yoxud kitob ko‘ringan zahoti yana o‘chiradi.\n\nWi-Fi’ni Sozlamalardan yoki holat qatoridagi Wi-Fi bandidan oching. «Tarmoqlar» yaqin atrofdagilarni ko‘rsatadi; birini tanlang va parolini kiriting yoki «Telefon orqali sozlash»ni tanlab, nom va parolni qurilmada emas, telefoningiz brauzerida kiriting. «Unutish» saqlangan tarmoqni olib tashlaydi.\n\nParollar kartada xavfsiz saqlanadi va boshqa hech qachon ko‘rsatilmaydi. «Kerak bo‘lganda ulanish» ostida Wi-Fi oxirgi foydalanishdan keyin qancha vaqt yoqilgan turishini, quvvatlanayotganda yoqilgan qolishini va bir nechtasi yaqin bo‘lganda qaysi saqlangan tarmoq birinchi bo‘lishini belgilaysiz."
