battery.plugin.name = Batareya sarfi
battery.plugin.description = Batareyani qayd etadi va u qancha vaqt yetishini ko‘rsatadi.
battery.plugin.how = "«Batareya sarfi» qurilma uyg‘oq paytida taxminan har daqiqada zaryad darajasini yozib boradi, shuningdek, u nima qilganini: ekran yangilanishlari va o‘girilgan sahifalarni. Shundan bir soat uyg‘oqlik va 100 sahifa qancha sarflashini hamda batareya shu sur’atda qancha yetishini hisoblaydi.\n\n«Batareya»ni Asboblar menyusidan oching. U hozirgi zaryadni, shu uyg‘oqlik vaqtini, hozirgacha batareyadagi sarfni va oxirgi uyg‘oqlik vaqtlaringizni ko‘rsatadi. U sahifa tugmalari bilan yoki tepadagi strelkalarga bosib varaqlanadi.\n\nRaqamlar ma’no kasb etishi uchun batareyada biroz o‘qish kerak. Yozib borish dastlab yoqilgan va Sozlamalarda, «Qurilma», «Quvvat» ostida «Batareya sarfini yozib borish» orqali o‘chirilishi mumkin."
