dictionary.plugin.description = So‘zlarni StarDict lug‘atlaridan qidiradi.
dictionary.plugin.how = "Lug‘at kitobdagi so‘zni StarDict lug‘atlaridan qidiradi va ta’riflarni ekranning pastki qismi ustidagi panelda ko‘rsatadi.\n\nO‘qish ekranida so‘zni bosib turing va «Qidirish»ni tanlang; tugmalarda «Yana» ostidagi «Matnni tanlash»dan foydalaning. Lug‘at papkalarini (.ifo, .idx va .dict fayllari bilan) qurilmadagi «dictionaries» papkasiga, ichki papkalari bilan nusxalang yoki Sozlamalarda, «O‘qish» ostida «Lug‘at papkasi»da boshqa papka tanlang (murakkab sozlama). Birinchi qidiruv har bir lug‘at uchun kichik indeks tayyorlaydi, bu biroz vaqt oladi.\n\nPanelda sahifa tugmalari yoki «Yuqoriga» va «Pastga» uzun ta’riflarni varaqlaydi, «Orqaga» esa uni yopadi. Sensorda yopish uchun uning tashqarisiga bosing."
