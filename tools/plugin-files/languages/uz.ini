about.plugin.name = Dastur haqida
about.plugin.description = PaperPaw versiyasi va litsenziyalari.
about.plugin.how = "«Dastur haqida» PaperPaw’ning qaysi versiyasi borligini, uning manba kodi qayerdaligini va qanday litsenziyalar ostida tarqatilishini ko‘rsatadi.\n\nUni Sozlamalar oxirida, «PaperPaw haqida» nomi bilan topasiz. Qatorni strelka tugmalari va «Tanlash» bilan tanlang yoki unga bosing. Dasturiy ta’minotga o‘rnatilgan plaginlar, kod bilan plaginlarni yuklaydigan qurilmalarda esa bunday plaginlar mo‘ljallangan bo‘lishi kerak bo‘lgan barmoq izi ham shu yerda ko‘rsatiladi.\n\n«Litsenziyalar» o‘qish ekranida matn sifatida ochiladi, shuning uchun uni kitobdek varaqlaysiz. Unda PaperPaw’ning o‘z litsenziyasi hamda u bilan keladigan shriftlar, belgilar va so‘z ko‘chirish andozalari litsenziyalari bor. Plaginlar o‘z qatorini qo‘shishi mumkin, masalan mavzu muallifini."
