plugin-manager.plugin.name = Plaginlar menejeri
plugin-manager.plugin.description = Plaginlarni ro‘yxatlaydi va yoqadi yoki o‘chiradi.
plugin-manager.plugin.how = "Plaginlar menejeri har bir plaginni versiyasi va tavsifi bilan ro‘yxatlaydi hamda plaginlarni yoqadi va o‘chiradi.\n\nUni Sozlamalarda «Plaginlarni boshqarish» nomi bilan topasiz. «Plagin sozlamalari» har bir plaginning tarmoqdan foydalanishi kabi parametrlar uchun alohida sahifa. Plaginni yoqish yoki o‘chirish uchun unga bosing (tugmalarda uni tanlang). O‘zgarish qayta ishga tushgandan keyin qo‘llanadi: pastdagi panel shunda «Hozir qayta ishga tushirish»ni taklif qiladi. Plagin qanday ishlashini o‘qish uchun uni bosib turing (tugmalarda «Tanlash»ni bosib turing).\n\n«Doim yoqilgan» deb belgilangan plaginni o‘chirib bo‘lmaydi, «Majburiy» deb belgilanganini esa boshqa plagin uning ishini bajargandan keyingina, aks holda PaperPaw’da qaytish yo‘li bo‘lmay qoladi. «Ekranlar»da bir necha plagin taklif qiladigan joyni qaysi plagin ko‘rsatishini tanlaysiz."
