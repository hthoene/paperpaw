power.plugin.name = Quvvat
power.plugin.description = Quvvat rejimini qo‘lda yoki batareya bo‘yicha tanlaydi: Oddiy, Tejash, Oflayn.
power.plugin.how = "«Quvvat» PaperPaw batareyani qanday sarflashini tanlaydi: Oddiy, Tejash yoki Oflayn. «Tejash» kechiktirsa bo‘ladigan ishni qulayroq paytlarda bajaradi; «Oflayn» radioni o‘chiq saqlaydi. «Avto» batareya bo‘yicha tanlaydi.\n\nRejimni tezkor panelda, «Quvvat» rejimlarni yonma-yon ko‘rsatadigan joyda yoki Sozlamalarda «Quvvat» ostida o‘zgartiring. U yerda «Avto» «Tejash»ga va «Oflayn»ga o‘tadigan darajalarni hamda quvvatlash paytida «Oddiy» qolishini ham belgilaysiz.\n\nHolat qatorlarida «Quvvat rejimi» tejash paytida bargni, oflayn paytida chizilgan Wi-Fi’ni ko‘rsatadi, «Oddiy»da esa hech narsa.\n\nKichik menyu ochish uchun yoqish tugmasini bosib turing: «Uyqu rejimi», «O‘chirish» (PaperPaw qila oladigan joyda), «Qayta ishga tushirish» va sensorli qurilmalarda «Sensorni qulflash» yoki «Sensorni ochish». Qisqa bosish qurilmani hamon uxlatadi. «Orqaga» menyudan chiqaradi."
