koreader.plugin.name = Belgilashlarni almashish
koreader.plugin.description = Ikkalasida ham o‘qilgan kitoblar uchun xatcho‘plar va belgilangan joylarni KOReader bilan almashadi.
koreader.plugin.how = "Bu plagin ikkalasida ham o‘qiydigan kitoblaringiz uchun, bitta qurilmada yoki qurilmalar orasida sinxronlanadigan kutubxona papkasida, xatcho‘plar va belgilangan joylarni KOReader bilan almashadi. Sozlash kerak emas.\n\nPaperPaw KOReader ham ochgan kitobni ochganda va uning xatcho‘plari yoki belgilangan joylarini o‘zgartirganingizda, u kitob yonidagi KOReader ma’lumotlaridan yangilarini oladi, bu yerdagi yangilarini esa KOReader kitobni keyingi safar ochganda olishi uchun qoldiradi. O‘chirilgan belgilar va o‘zgartirilgan qaydlar ham o‘tadi.\n\nBu faqat EPUB kitoblar uchun ishlaydi. Bir tomonning faylini o‘qib bo‘lmasa, o‘qish mumkin bo‘lguncha hech qaysi tomonda hech narsa o‘zgarmaydi."
