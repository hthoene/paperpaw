files.plugin.name = Fayllar brauzeri
files.plugin.description = Qurilmadagi kitoblar va papkalarni ro‘yxatlaydi va ochadi.
files.plugin.how = "Kutubxona kutubxona papkangizdagi kitoblarni muqovasi, nomi, muallifi va qanchasi o‘qilgani bilan ro‘yxatlaydi. Oxirgi o‘qigan kitobingiz tepada kartochka bo‘lib turadi, shuning uchun o‘qishni davom ettirish bitta bosish yoki «Tanlash»ni bir marta bosish bilan bo‘ladi. Kutubxona kitob qidirayotganda hozirgacha nechta topganini aytib turadi.\n\nKitoblar tepasida nima ko‘rsatilishini tanlang: hammasi, o‘qiyotganlaringiz, o‘qilmagan yoki tugatilganlari yoki javonlar (muallif, turkum, teg, sevimlilar bo‘yicha, boshlagan har bir turkumingizning keyingi kitobi). Kitobni o‘qish uchun unga bosing; uni ochish, tugatilgan yoki o‘qilmagan deb belgilash, ma’lumotini ko‘rish, arxivga ko‘chirish yoki o‘chirish uchun uni bosib turing (tugmalarda «Tanlash»ni bosib turing). Kutubxona menyusi uchun sarlavhaga bosing: kitoblar qanday saralanishi va ko‘rsatilishi, qidiruv, kutubxona papkasi va sozlamalar.\n\nKutubxona papkasi Sozlamalarda, «Kutubxona» ostida «Kutubxona papkasi»da belgilanadi; u yerda kitoblarni muqovalar to‘ri sifatida ko‘rsatish ham mumkin. Boshqa har qanday fayl uchun Asboblar menyusidagi «Fayllar»dan foydalaning."
