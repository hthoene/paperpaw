notes-vault.plugin.name = Qaydlar ombori
notes-vault.plugin.description = Markdown qaydlar papkasini papkalar, teglar va oxirgi o‘zgarishlar bo‘yicha o‘qiydi, bosh ekran uchun vidjetlar bilan. Obsidian omborlari bilan ishlaydi.
notes-vault.plugin.how = "«Qaydlar ombori» Markdown qaydlar papkasini (qaydlar ilovalari saqlaydigan oddiy .md fayllar) o‘qiydi. U Obsidian omborlari bilan ishlaydi.\n\nOmbor papkasini sozlamalarda yoki asboblardagi ombor sahifasida tanlang. Shunda sahifa papkalarni kartadagidek, oxirgi o‘zgargan qaydlarni, teglarni va qaydlar nomlaridan qidiruvni taklif qiladi.\n\nBirinchi marta ombor sahifasi ochiq turganda fonda indekslanadi; minglab qaydli ombor bir necha daqiqa oladi, keyin bir zumda ochiladi. Indeks kartada saqlanadi va ombor sahifasi bir necha soatdan keyin ochilganda yoki «Yangilash»ni tanlaganingizda qayta tuziladi.\n\nQayd o‘qish ekranida ochiladi. Boshqa qaydlarga havolalar ([[Qayd]], [[Qayd|so‘zlar]], [[Qayd#Sarlavha]]) ombor bo‘ylab qaydning nomi bo‘yicha topiladi; birini ochish o‘sha qaydni ochadi, «Orqaga» oldingi qaydga qaytaradi.\n\nOmbordagi hech narsa o‘zgartirilmaydi. Bosh ekran vidjetlari (so‘nggi qaydlar, mahkamlangan qayd, kun qaydi, tasodifiy qayd, teglar, qidiruv) bosh ekran tahrirlagichida qo‘shiladi. Vidjet qaydlarini faqat bitta papkadan olishi mumkin: vidjet sozlamalarida papka yo‘lini karta ildizidan yozing (masalan Notes/Work); bo‘sh qoldirilsa, ombordagi barcha qaydlar olinadi."
