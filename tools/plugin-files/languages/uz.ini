reading-goal.plugin.name = O‘qish maqsadi
reading-goal.plugin.description = Kuniga o‘qiladigan daqiqalar va bosh ekrandagi mushuk, uning kayfiyati bugungi o‘qishga bog‘liq.
reading-goal.plugin.how = "Bosh ekrandagi mushuk bugungi o‘qish qanday ketayotganini ko‘rsatadi: hali o‘qimaguningizcha xafa, ozgina o‘qigandan keyin o‘rtacha, kunlik maqsadingizning yarmidan mamnun, unga yetganingizda xursand.\n\nBosh ekranga «O‘qish mushugi» vidjetini qo‘shing (bosh ekranni bosib turing, so‘ng vidjet qo‘shing) yoki uyqu ekrani sifatida «Bugungi o‘qish mushugi»ni tanlang. Mushukka bosish kunlik maqsadni ochadi; bu siz o‘qigan daqiqalarni sanaydigan o‘qish statistikasining maqsadi.\n\nSozlamalarda, «O‘qish» ostida «Mamnun bo‘lish» va «Xursand bo‘lish» mushuk maqsadning qaysi ulushidan mamnun yoki xursand bo‘lishini, «O‘z rasmlari» esa mushuklar o‘rniga ko‘rsatiladigan rasmlar papkasini (xafa, o‘rtacha, mamnun va xursand) belgilaydi. Rasmlar PNG yoki JPEG fayllar; papka bo‘lmasa, mushuklar ko‘rsatiladi."
