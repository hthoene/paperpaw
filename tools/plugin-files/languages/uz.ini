reader.plugin.name = O‘qish ekrani
reader.plugin.description = Kitoblarni sahifama-sahifa ko‘rsatadi, mundarija va o‘qish sozlamalari bilan.
reader.plugin.how = "O‘qish ekrani kitoblarni sahifama-sahifa ko‘rsatadi. Kitobni kutubxonadan oching; oxirgi kitob ishga tushganda qayta ochilishi mumkin («Ishga tushganda oxirgi kitobni ochish» sozlamasi).\n\nSahifa o‘girish uchun ekranning chap yoki o‘ng tomoniga bosing yoki sahifa tugmalaridan foydalaning. O‘qish menyusi uchun o‘rtasiga bosing yoki «Tanlash»ni bosing: «Mundarija», «Qidirish», «Sahifaga o‘tish», «Shrift va tartib», «Xatcho‘plar va belgilangan joylar» va boshqalar. Yuqori chekkadan pastga surish tezkor panelni ochadi, pastki chekkadan yuqoriga surish bosh sahifaga olib boradi; «Orqaga»ni bosib turish ham shunday.\n\nRasmni butun ekranda ko‘rish uchun «Tanlash»ni (yoki rasmni) bosib turing: «Chapga» va «O‘ngga» sahifadagi rasmlar bo‘ylab yuradi. «Tanlash» 2x, 3x ga kattalashtiradi va orqaga qaytaradi (sensorda ikki marta bosish); kattalashtirilganda «Chapga» va «O‘ngga» yon tomonga siljitadi, sahifa tugmalari (yoki suringlar) kengligi va balandligi bo‘ylab siljitadi. «Orqaga» moslashga, so‘ng sahifaga qaytaradi (sensorda chiqish uchun bosib turing). Xatcho‘p uchun yuqori o‘ng burchakka bosing. So‘zni belgilash uchun uni bosib turing. Tugmalar bilan «Chapga»ni bosib turing: «Chapga» va «O‘ngga» so‘zma-so‘z, sahifa tugmalari qatorma-qator siljitadi, ularni bosib turish sahifa chekkalariga va abzatsma-abzats o‘tkazadi; «Tanlash» so‘z uchun belgilash panelini ochadi, «Tanlash»ni bosib turish uni gap va abzatsgacha kengaytiradi (so‘ng «Chapga» va «O‘ngga» oxirini, ularni bosib turish boshini siljitadi). Tanlov sahifa o‘girilganda ham davom etadi. «Markdown sifatida eksport» qaydlaringizni saqlaydi."
