picture-home.plugin.name = Rasmli bosh ekran
picture-home.plugin.description = Vidjetlar orqasida o‘z rasmingiz bor bosh ekran va siz sozlaydigan holat paneli.
picture-home.plugin.how = "«Rasmli bosh ekran» yoqilgan paytda bosh ekranning o‘rnini oladi: vidjetlar orqasida o‘z rasmingiz va siz tartiblaydigan vidjet va asboblar sahifalari. Uni plaginlar menejerida o‘chiring va o‘rnatilgan bosh ekran o‘z sahifalari bilan qaytadi.\n\nRasmlarni (JPEG, PNG yoki GIF) kartadagi papkaga (odatda wallpapers) qo‘ying, so‘ng Sozlamalar, Moslash, «Rasmli bosh ekran»da birini tanlang. «Moslash» u ekranni qanday to‘ldirishini (to‘ldirish, butun rasm, cho‘zish, asl o‘lcham, plitka), «Joylashuv» qaysi qismi qolishini, «Masshtab» qanchalik kattaligini, «Rasmni ochroq qilish» qanchalik xiraligini aytadi: xiraroq rasm vidjetlarni o‘qishni osonlashtiradi. Rasm har bir ekran o‘lchami uchun bir marta tayyorlanadi, bu biroz vaqt oladi.\n\nVidjetlar rasm ustida taglikda turadi. Sahifani o‘rnatilgan bosh ekrandagidek tartiblang: sahifa ostidagi qalam yoki menyudagi «Bosh ekranni tahrirlash».\n\nHolat paneli (vaqt, Wi-Fi, batareya yoki tanlaganingiz) yoqilgan, o‘chirilgan yoki avtomatik bo‘lishi, tepada yoki pastda, to‘liq kenglikda yoki chap, o‘rta yoki o‘ngdagi kichik kapsula shaklida, och, to‘q yoki kulrang taglikda yoki rasmning o‘zida bo‘lishi mumkin. Tugmalar nomi yozilgan qator (X4’da) ham yoqilgan, o‘chirilgan yoki avtomatik bo‘lishi mumkin. Avtomatik tugma bosilganda ularni bir necha soniya ko‘rsatishni bildiradi; bu bosish boshqa hech narsa qilmaydi.\n\n«Rasm chizilishi» rasm qanday chizilishini aytadi: «Kulrang darajalar» ekranda bor har bir kulrang tusda (X4’da sekinroq), «Nuqtali» oq-qora nuqtalarda (tez) yoki «Avtomatik», o‘rnatilgan bosh ekrandagidek: ekran chizilganda kulrang darajalar, birinchi o‘zgarishdan keyin nuqtalar. Ekranda kulrang darajalar bo‘lmagan joyda ular nuqtalarga o‘tadi."
