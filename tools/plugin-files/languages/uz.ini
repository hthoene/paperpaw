rules.plugin.name = Qoidalar
rules.plugin.description = Biror narsa yuz berganda nimadir qiladi: masalan soat 22:00 da tungi rejim.
rules.plugin.how = "Qoida biror narsa yuz berganda o‘zi nimadir qiladi: har kuni soat 22:00 da tungi rejim yoki PaperPaw ishga tushganda kataloglar sinxronlanishi.\n\nQoidalar Sozlamalarda «Moslash» ostida «Qoidalar» sifatida. «Qoida qo‘shish» «Qachon?» (PaperPaw ishga tushganda, kun vaqti, kitob ochilganda yoki yopilganda, batareya, quvvatlash, tugma va boshqalar) va «Keyin nima?» (amalni bajarish, tugmani yoqish yoki o‘chirish, son belgilash, xabar ko‘rsatish) deb so‘raydi. Qoidani to‘xtatib turish uchun unga bosing; «Ikki kun vaqti orasida» kabi shart uchun yoki uni olib tashlash uchun uni bosib turing (tugmalarda «Tanlash»ni bosib turing).\n\nTanlash mumkin bo‘lgan amallar, tugmalar va sonlar plaginlar bo‘yicha keladi: plaginni, so‘ng u nimani keltirganini tanlang; «orqaga» undan yana chiqaradi. «Orqaga» yoki «Keyingi sahifa» kabi ko‘rsatilgan ekranda ishlaydigan amal u yerda bosilganda nima qilsa, shuni qiladi.\n\nVaqtlar qaysi ekran ochiq bo‘lishidan qat’i nazar qo‘llanadi. Bir-birini bekor qilib turadigan ikki qoida bir necha qadamdan keyin to‘xtaydi."
