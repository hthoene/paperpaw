keyboard.plugin.name = Klaviatura
keyboard.plugin.description = Ekranda matn kiritadi, sensor yoki tugmalar bilan.
keyboard.plugin.how = "Biror narsa matn talab qilganda klaviatura ochiladi: qidiruv, parol, qayd yoki sozlama. U sensor va faqat tugmalar bilan ishlaydi.\n\nTugmalar bilan chap va o‘ng qator bo‘ylab yuradi, sahifa tugmalari qatorlar orasida yuradi, «Tanlash» tugmani bosadi, «Orqaga» bekor qiladi; chap va o‘ng qator bo‘ylab aylanadi, yuqori va past ustuningizda qoladi. «Shift» keyingi harfni bosh harf qiladi; hammasi bosh harf bo‘lishi uchun ikki marta, to‘xtatish uchun yana bir marta bosing. Harfni bosib turing (tugmalarda: unda «Tanlash»ni bosib turing): uning bosh harfi darhol tanlanadi va é, è kabi urg‘uli harflar chiqadi; nemis tilida ä, ö, ü va ß shu tarzda a, o, u va s dan keladi (tugmalarda klaviatura bu harflarda shuni aytadi). «OK» tugatadi; tugmalarda istalgan joydan tugatish uchun «Orqaga»ni bosib turing (faqat «Orqaga» bekor qiladi) yoki harf bo‘lmagan tugmada «Tanlash»ni bosib turing. «Qo‘yish» bufer matnini kiritadi, «Telefon» esa, taklif qilinganda, telefoningizda yozish imkonini beradi.\n\nSozlamalarda «Qurilma», «Klaviatura» ostida: «Klaviatura tartiblari» tartiblarni tanlaydi. Odatda u menyu tiliga ergashadi; bir nechtasi bo‘lsa, tugma ular orasida almashtiradi. «Umlaut tugmalari» ä, ö, ü va ß uchun alohida tugmalar beradi. «O‘lcham» tugma va harflarni kattalashtiradi; faqat tugmali qurilmada qatorlar kompyuter klaviaturasidagidek qoladi. Sensorli ekranlarda «Tugma shakli» tugmalar ko‘rinishini o‘zgartiradi. «Avtomatik bosh harflar» har bir gapni bosh harf bilan boshlaydi."
