vocabulary.sd.readme = "Fayllardan kartochkalar\n\nHar bir to‘plam uchun bu yerga bitta fayl qo‘ying: Nemis.tsv «Nemis» to‘plamini yaratadi.\nFayllar: UTF-8 sifatida saqlangan .tsv, .csv yoki .txt yoxud .apkg: «Support older Anki versions» belgilangan holda eksport qilingan Anki to‘plami. Uning qaydlarining dastlabki uchta maydoni old tomon, orqa tomon va misol bo‘ladi; uning jadvali va mediasi o‘qilmaydi va PaperPaw hech qachon Anki faylini yozmaydi.\n\nHar qatorda bitta kartochka: old tomon, orqa tomon va misol (ixtiyoriy), tab, vergul yoki nuqtali vergul bilan ajratilgan. Birinchi qator ustunlarni nomlashi mumkin: front, back, example. Misol:\n\nKatze\tmushuk\tDie Katze schläft.\n\nKeyin o‘quvchida «Kartochkalar»ni oching, «SD kartadagi kartochkalar»ni, so‘ng «To‘plamlarni yangilash»ni tanlang.\n\nBilib qo‘ying:\n- To‘plamlar o‘rgangan narsangiz bilan o‘quvchida qoladi. Fayl yangi yoki o‘zgargan bo‘lsa o‘qiladi va uning kartochkalari to‘plamga qo‘shiladi yoki u yerda o‘zgartiriladi.\n- Fayldagi kartochkaning orqa tomoni yoki misolini o‘zgartiring: kartochka o‘zgaradi va jarayoningizni saqlaydi.\n- Kartochkaning old matnini o‘zgartiring: u yangi kartochka hisoblanadi, eskisi qaytadan boshlanadi. Kartochkalar old matn bilan solishtiriladi, probel va bosh harflar hisoblanmaydi. To‘plamni faylga saqlang («SD kartadagi kartochkalar», «To‘plamni kartaga saqlash») va har bir kartochkada id ustunida raqam bo‘ladi: u yerda old tomonni o‘zgartiring, faylning dastlabki ikki qatorini o‘z holicha qoldiring va kartochka o‘rgangan narsangizni saqlaydi.\n- Saqlash to‘plam kartochkalarini yozadi. Faylda bo‘lgan va kartochka bo‘lmagan narsa (old tomonsiz qator) saqlanmaydi; u yerda bo‘lgan fayl _name.bak.tsv ga nusxalanadi.\n- Faylni CSV UTF-8 sifatida saqlang (UTF-16 emas, elektron jadvalning o‘z formati emas). 4 MiB yoki 20 000 qatordan katta fayl o‘qilmaydi: uni bo‘ling.\n- Fayldan o‘chirgan qatoringiz to‘plamdagi kartochkani o‘chirmaydi, agar shu to‘plam uchun «Yo‘q kartochkalarni olib tashlash»ni yoqmasangiz. Shunda kartochka o‘rgangan narsangiz bilan ketadi.\n- Nomi _ bilan boshlanadigan fayllar o‘qilmaydi.\n"
