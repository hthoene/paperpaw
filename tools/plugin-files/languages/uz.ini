file-manager.plugin.name = Fayl menejeri
file-manager.plugin.description = Qurilmadagi har bir papka va fayl: ularni ochish, nomini o‘zgartirish, ko‘chirish, nusxalash va o‘chirish.
file-manager.plugin.how = "Fayl menejeri nafaqat kitoblaringizni, balki qurilma xotirasidagi har bir papka va faylni ko‘rsatadi, ularni ochish, nomini o‘zgartirish, ko‘chirish, nusxalash va o‘chirish hamda yangi papkalar yaratish imkonini beradi.\n\n«Fayllar»ni Asboblar menyusidan oching. Papkaga kirish uchun unga bosing; «Orqaga» yuqoridagi papkaga qaytaradi. Fayl bilan nima qilish mumkinligini ko‘rish uchun unga bosing yoki istalgan elementni bosib turing (tugmalarda «Tanlash»ni bosib turing). «Ko‘chirish» va «Nusxalash» elementni tanlab oladi: u tegishli papkaga o‘ting va pastdagi panelda «Shu yerga qo‘yish»ni tanlang. Tugmalarda panelga yetish uchun oxirgi elementdan «Pastga»ni bosing.\n\nNuqta bilan boshlanadigan fayl va papkalar, masalan PaperPaw’ning o‘z ma’lumotlari, yashirilgan. Ularni ko‘rish uchun Sozlamalarda, «Kutubxona» ostida «Yashirin fayllar»ni yoqing."
