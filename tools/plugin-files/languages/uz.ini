diagnostics.plugin.name = Diagnostika
diagnostics.plugin.description = Sinov ekrani va qurilmaning har bir qismini bosqichma-bosqich tekshirish.
diagnostics.plugin.how = "Diagnostika qurilmani tekshirish uchun sinov ekrani: u panel ko‘rsata oladigan har bir kulrang darajani, tugma va sensorni sinash uchun to‘rtta quti hamda yangilash rejimlarini solishtirish uchun yuklanish chizig‘i bilan sahifa hisoblagichini ko‘rsatadi.\n\nSinov ekranining menyuda o‘rni yo‘q. U faqat boshqa hech bir plagin bosh ekran taklif qilmaganda yoki Plaginlar menejerida «Bosh ekran» joyi uchun «Ekranlar»da uni tanlaganingizda bosh ekran bo‘ladi.\n\n«Tanlash» fokusdagi qutini belgilaydi, strelka tugmalari qutilar orasida yuradi; sensorda qutiga bosing. Sahifa tugmalari sinov sahifalarini o‘giradi. Boshidan boshlash uchun «Tanlash»ni yoki barmoqni ekranda bosib turing.\n\nPaperPaw qurilma dasturiy ta’minoti bo‘lgan joyda «Asboblar» ostidagi qurilma tekshiruvi qurilmaning har bir qismini bir sahifada ko‘rib chiqadi: ekran, tugmalar, sensor, yoritgich, batareya, karta, soat, Wi-Fi, uyqu va xotira. Har bir sahifa «O‘tmadi», «O‘tkazish» va «O‘tdi» bilan tugaydi, o‘lchovlar taklif qilgan javob tanlangan bo‘ladi; qurilmada yo‘q qismlar o‘tkazib yuboriladi. Har bir javobdan keyin u pull request’ga qo‘yish uchun .paperpaw/plugins/diagnostics/device-check.txt ga hisobot yozadi. «Orqaga» undan chiqaradi va qayta ochilganda u qolgan joyidan davom etadi. Faqat tugmali qurilmada avval tugmalar sahifasida «Boshlash»ni tanlang; shu paytgacha strelkalar, «Tanlash» va «Orqaga» har bir sahifadagidek ishlaydi."
