tasks.plugin.name = Vazifalar
tasks.plugin.description = Muddat va ustuvorlikli vazifalar ro‘yxatlari, o‘quvchida yoki CalDAV serveringiz bilan sinxronlangan, bosh ekran vidjetlari bilan.
tasks.plugin.how = "O‘quvchingizdagi vazifalar ro‘yxatlari: muddat va ustuvorlikli vazifalar, bajarilganda belgilanadi. Ular sozlashsiz va tarmoqsiz ishlaydi hamda CalDAV serveri (Nextcloud, Radicale, Baïkal, Fastmail va boshqalar) bilan hamohang saqlanishi mumkin, shunda bir xil ro‘yxatlar telefoningiz va kompyuteringizda bo‘ladi.\n\n«Vazifalar»ni asboblar menyusidan oching. Birinchi qator ko‘rsatilgan ro‘yxat nomini bildiradi; boshqa ro‘yxat, barcha ro‘yxatlar bo‘yicha «Bugun va muddati o‘tgan», yangi ro‘yxat, sinxronlash yoki hisobni sozlash uchun uni tanlang. «Vazifa qo‘shish» klaviaturani ochadi. Vazifada «Tanlash» uni belgilaydi (yana: bajarilmagan). Uning nomi, muddati (bugun, ertaga, bir haftadan so‘ng yoki 2026-12-24 kabi yozadigan sana) yoki ustuvorligini o‘zgartirish yoxud uni olib tashlash uchun vazifani bosib turing yoki «Menyu»ni bosing. Ochiq vazifalar birinchi turadi, kuni, so‘ng ustuvorligi bo‘yicha; bajarilganlari bir hafta oxirida qoladi (Sozlamalarda «Vazifalar» ostida belgilanadi), so‘ng o‘quvchidan ketadi.\n\nBosh ekran vidjetlari (bosh ekranni bosib turing, so‘ng vidjet qo‘shing): «Bugungi vazifalar» bugun yoki muddati o‘tgan vazifalarni ko‘rsatadi, «Vazifalar ro‘yxati» bitta ro‘yxatni, «Ochiq vazifalar» ularni sanaydi va «Keyingi vazifa» navbatdagisini ko‘rsatadi. Vidjetdagi vazifaga bosish uni belgilaydi; sarlavhaga bosish ro‘yxatlarni ochadi.\n\nSinxronlash uchun ro‘yxat qatoridan «CalDAV hisobi»ni tanlang va server manzilini, foydalanuvchi nomingiz va parolni (eng yaxshisi ilova paroli) kiriting. Server manzilining o‘zi yetarli, masalan cloud.example.com/remote.php/dav; o‘quvchi vazifa ro‘yxatlaringizni u yerdan topadi. Serverning har bir vazifa ro‘yxati o‘quvchida ro‘yxat bo‘ladi. O‘quvchi «Vazifalar»ni ochganingizda, «Hozir sinxronlash»ni tanlaganingizda va tarmoq baribir yoqilganda sinxronlaydi; tarmoqsiz o‘zgartirganingiz kutadi va keyinroq yuboriladi. Vazifa o‘quvchida ham, boshqa joyda ham o‘zgartirilgan bo‘lsa, serverning versiyasi olinadi va sizniki uning yonida yangi vazifa sifatida saqlanadi, shuning uchun hech narsa yo‘qolmaydi. Serverda vazifada bo‘lgan qaydlar, signallar va boshqa hamma narsa o‘z holicha qoladi. Takrorlanuvchi vazifalar ko‘rsatiladi, lekin siz yaratgan joyda o‘zgartiriladi. O‘quvchi 12 ta ro‘yxatda 200 tagacha vazifa saqlaydi."
