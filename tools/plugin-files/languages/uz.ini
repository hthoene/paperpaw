sleep.plugin.name = Uyqu ekrani
sleep.plugin.description = Qurilma uxlayotganda uxlayotgan mushuk, kitob muqovasi, rasmlaringiz yoki xabarni ko‘rsatadi.
sleep.plugin.how = "Uyqu ekrani qurilma uxlayotganda ekran nimani ko‘rsatishini belgilaydi. E-ink tasvirni quvvatsiz saqlaydi.\n\nUni sozlamalarda, «Qurilma», «Uyqu ekrani»da «Ko‘rsatish» bilan tanlang: uxlayotgan mushuk (standart), kitob muqovasi, mening rasmlarim, logotip va «Uyquda», vidjetlar, sahifa o‘z holicha yoki rasmli sahifa. «Mening rasmlarim» «Pictures» papkasidagi fayllarni birin-ketin ko‘rsatadi.\n\nMuqova yoki rasm bo‘lmasa, mushuk ko‘rinadi. Tizim uyqu ekranini o‘zi chizadigan joyda bu sozlamalar yashirilgan.\n\nO‘chirilgan ekran, «O‘chirilganda ko‘rsatish», qurilma o‘chirilayotganda, quvvat menyusidan yoki «Uyqudan keyin o‘chirish» vaqtidan so‘ng bir marta chiziladi (batareya pastligidan quvvat uzilganda emas). Logotip va «O‘chirilgan», mushuk, muqova yoki mening rasmlarimni tanlamasangiz, u uyqu ekranidek bo‘ladi. Boshqa plagin buning uchun ekran taklif qilishi mumkin.\n\nIshga tushirish va qayta ishga tushirish ekrani, «Ishga tushganda ko‘rsatish» va «Qayta ishga tushganda ko‘rsatish», boshqa plagin ular uchun ekran taklif qilmasa, qurilmaning o‘zinikidir. Qurilma ishga tushayotganda plaginlar hali ishlamaydi: ishga tushish uchun tanlangan ekran qurilma o‘chayotganda yoki qayta ishga tushayotganda oldindan chiziladi va keyingi ishga tushishda ko‘rsatiladi. O‘z vaqtida tayyor bo‘lmagan ekran yoki shikastlangan rasm qurilmaning o‘ziniki uchun yo‘l beradi; qurilma baribir o‘chadi yoki qayta ishga tushadi."
