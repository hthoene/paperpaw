pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Ish va tanaffus davrlari, vidjetlar va kunlik hisob bilan diqqat taymeri.
pomodoro.plugin.how = "Pomodoro taymeri: diqqat bilan davrlarda ishlang, so‘ng dam oling. Sozlash kerak emas: 25 daqiqa diqqat, 5 daqiqa dam va to‘rt davrdan keyin 15 daqiqalik uzoq tanaffus.\n\n«Pomodoro»ni asboblar menyusidan oching va «Boshlash»ni bosing yoki uning vidjetlarini bosh ekranga qo‘shing (bosh ekranni bosib turing, so‘ng vidjet qo‘shing): «Pomodoro taymeri» bosqich va qolgan daqiqalarni ko‘rsatadi, «Pomodoro boshlash/pauza» tugma, «Pomodoro bugun» esa tugatgan davrlaringizni kunlik maqsadingiz bilan sanaydi. Taymerga bosish uni boshlaydi yoki to‘xtatadi; to‘liq ekranni ochish uchun uni bosib turing.\n\nEkrandan chiqsangiz ham taymer ishlashda davom etadi va qayta ishga tushgandan keyin soat bo‘yicha davom etadi. O‘quvchi uxlaganda hech narsa ishlamaydi: shu orada tugagan bosqich uyg‘onganda xabar qilinadi. Bosqich tugaganda xabar bildiradi. Batareyani tejash uchun soat daqiqada bir marta yangilanadi (to‘liq ekranda oxirgi daqiqada har o‘n soniyada) va o‘quvchini hech qachon uyg‘oq ushlamaydi.\n\nSozlamalarda «Pomodoro» ostida uzunliklarni va to‘plam davrlarini hamda keyingi bosqich o‘zi boshlanishini belgilaysiz. «Yana» ostida: bosqich tugaganda ekranning miltillashi yoki yoritgichning yonib-o‘chishi va kunlik maqsad."
