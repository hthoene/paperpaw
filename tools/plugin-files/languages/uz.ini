menu-editor.plugin.description = Har bir menyu elementlarini qayta tartiblaydi, olib tashlaydi va qo‘shadi.
menu-editor.plugin.how = "Menyu tahrirlagichi menyularda nima borligini o‘zgartiradi: elementlarni yuqoriga yoki pastga ko‘chirish, olib tashlash yoki yangilarini qo‘shish.\n\nUni Sozlamalarda, «Moslash» ostida «Menyularni moslash» nomi bilan topasiz. Menyuni, so‘ng uni ko‘chirish yoki olib tashlash uchun elementni tanlang; «Element qo‘shish» yangisini qo‘yadi. O‘zgarishlar darhol qo‘llanadi. «Bu menyuni tiklash» menyuni plaginlari belgilagan holatga qaytaradi, «Barcha menyularni tiklash» har bir menyu uchun shunday qiladi.\n\nO‘zingizni o‘zingiz qulflab qo‘ya olmaysiz: sozlamalarga yo‘l bo‘lgan element siz ularga boshqa yo‘l qo‘shmaguningizcha qoladi."
