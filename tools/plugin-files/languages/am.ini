about.plugin.name = ስለ
about.plugin.description = የ PaperPaw ስሪት እና ፈቃዶች።
about.plugin.how = "«ስለ» የትኛው የ PaperPaw ስሪት እንዳለዎት፣ የምንጭ ኮዱ የት እንዳለ እና በየትኞቹ ፈቃዶች እንደሚመጣ ያሳያል።\n\nበቅንብሮች መጨረሻ ላይ እንደ «ስለ PaperPaw» ያገኙታል። በቀስት አዝራሮች እና ምረጥ ረድፍ ይምረጡ፣ ወይም ይንኩት። በፈርምዌሩ ውስጥ የተገነቡ ተሰኪዎች፣ እና ኮድ ያላቸው ተሰኪዎችን በሚጭኑ መሣሪያዎች ላይ እንዲህ ያሉ ተሰኪዎች የሚገነቡለት አሻራም ተዘርዝረዋል።\n\n«ፈቃዶች» በአንባቢው ውስጥ እንደ ጽሑፍ ይከፈታል፤ ስለዚህ እንደ መጽሐፍ ገጾቹን ይገለብጣሉ። የ PaperPaw የራሱን ፈቃድ እና አብረው የሚመጡ የቅርጸ-ቁምፊዎች፣ አዶዎች እና የቃላት መክፈያ ንድፎች ፈቃዶችን ይዟል። ተሰኪዎች የራሳቸውን መስመር ሊጨምሩ ይችላሉ፣ ለምሳሌ የገጽታ ደራሲን።"
