smart-home.plugin.name = ብልጥ ቤት
smart-home.plugin.description = ከራስዎ Home Assistant እሴቶች እና ማብሪያዎች በዳሽቦርድ እና እንደ የመነሻ ማያ ገጽ ዊጀቶች። በቤትዎ አውታረ መረብ ላይ ካለ Home Assistant ጋር ይሠራል።
smart-home.plugin.how = "ብልጥ ቤት ከራስዎ Home Assistant እሴቶችን እና ማብሪያዎችን ያሳያል፦ የሙቀት መጠኖች፣ እርጥበት፣ ኃይል፣ በሮች እና መስኮቶች፣ መብራቶች፣ ማብሪያዎች እና ትዕይንቶች። በቤትዎ አውታረ መረብ ላይ በ REST API አማካኝነት ከአገልጋይዎ ጋር ይነጋገራል፤ ምንም በሌላ አገልግሎት በኩል አያልፍም።\n\nብልጥ ቤትን ከመሣሪያዎች ምናሌ ይክፈቱ፤ ከዚያ «ግንኙነት»፦ የ Home Assistant አድራሻዎን (ለምሳሌ http://homeassistant.local:8123) እና የረጅም ጊዜ የመዳረሻ ቶክን ይጻፉ (በ Home Assistant የመገለጫ ገጽዎ ግርጌ አንድ ይሥሩ)። ቶክኑ ከይለፍ ቃሎች እና ቁልፎች ጋር ይቀመጣል፣ በቅንብሮች ፋይል ውስጥ ፈጽሞ አይደለም። ተራ http ለቤትዎ አውታረ መረብ አድራሻዎች ብቻ ይጠቅማል፤ ለሌላ ቦታ ላለ አገልጋይ በቅንብሮች ውስጥ «ከቤት አውታረ መረብ ውጭ ያሉ አገልጋዮች» ን ያብሩ እና ትክክለኛ ምስክር ወረቀት ያለው https ይጠቀሙ።\n\n«ንጥሎችን ምረጥ» አገልጋይዎ ያለውን ዝርዝር ይከፍታል፦ በስም ወይም በመታወቂያ ይፈልጉ እና ለማሳየት ንጥል ይምረጡ (ለማስወገድ እንደገና ይምረጡት)። ክፍል ሊሰጡት ይችላሉ፤ ይህም በዳሽቦርዱ እና በክፍል ዊጀቶች ውስጥ ያሰባስበዋል። እስከ 24 ንጥሎች ይቀመጣሉ። በዳሽቦርዱ ላይ ለመቀየር መብራት፣ ማብሪያ ወይም ትዕይንት ይምረጡ፦ ረድፉ የአገልጋዩን መልስ ያሳያል። የመረጡት ዳሳሽ እንደገና ይነበባል።\n\nዊጀቶች (መነሻ ማያ ገጹን ይያዙ፤ ከዚያ ዊጀት ይጨምሩ)፦ «የብልጥ ቤት እሴት» አንድ ንባብ በትልቁ ያሳያል፣ «ቡድን» የአንድ ክፍል ንጥሎችን ይዘረዝራል፣ «ማብሪያ» ለአንድ መብራት ወይም ማብሪያ አዝራር ነው፣ «ክፍል» ደግሞ የአንድ ክፍል ንባቦች እና ማብሪያዎች ያሉት ካርድ ነው። የእያንዳንዱ ዊጀት ቅንብሮች የትኛውን ንጥል ወይም ክፍል እንደሚያሳይ ይናገራሉ።\n\nቤቱ የሚነበበው ዳሽቦርዱን ሲከፍቱ፣ ሲጠይቁ («አድስ» ረድፍ ወይም በእሴት ወይም በቡድን ዊጀት ላይ መንካት)፣ Wi-Fi አስቀድሞ ባለበት አንባቢው ሲነቃ፣ እና ኃይል መሙያው ሲሰካ ባቀናበሩት መርሐ ግብር ነው። ሬዲዮውን በራሱ ፈጽሞ አያበራም፣ ፈጽሞም አያቆየውም።"
