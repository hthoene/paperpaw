mail.plugin.name = ኢሜይል
mail.plugin.description = ኢሜይልን በይለፍ ቃል ወይም በመተግበሪያ የይለፍ ቃል (IMAP እና SMTP) ያነባል እና ይልካል፤ የአሳሽ መግቢያ የለም።
mail.plugin.how = "ኢሜይል ኢሜይልን በ IMAP እና SMTP ያነባል እና ይልካል። በአድራሻዎ እና በይለፍ ቃል ይገባል፣ የአሳሽ መግቢያ ሳይኖር፤ ስለዚህ ያንን ከሚፈቅድ ከማንኛውም አቅራቢ ጋር ይሠራል።\n\nመለያ በቅንብሮች፣ ኢሜይል ስር ያዘጋጁ። አቅራቢዎን ይምረጡ፣ አድራሻዎን እና የይለፍ ቃሉን ይጻፉ። አብዛኞቹ አቅራቢዎች የመተግበሪያ የይለፍ ቃል ይፈልጋሉ፦ በመለያዎ የደህንነት ቅንብሮች ውስጥ አንድ ይሥሩ እና እዚህ ይጠቀሙበት። የተለመደው የይለፍ ቃልዎ ብዙ ጊዜ አይሠራም፤ ከአቅራቢዎ አገልጋይ በቀር ወደ ሌላ ቦታም ፈጽሞ አይሄድም። ከይለፍ ቃሎች እና ቁልፎች ጋር ይቀመጣል።\n\nኢሜይልን በመሣሪያዎች ውስጥ ይክፈቱ። «ኢሜይል ፈትሽ» የቅርብ ጊዜ ኢሜይሎችን እና አቃፊዎቹን ያመጣል። ኢሜይሎች በካርዱ ላይ ይቀመጣሉ፤ ስለዚህ ያለ አውታረ መረብ ማንበብ ይችላሉ። መሣሪያው ይገናኛል፣ ያመጣል እና ይለያያል፤ ስለዚህ Wi-Fi ለአፍታ ብቻ ነው የሚበራው።\n\nአቅራቢዎ በዝርዝሩ ውስጥ ከሌለ «የራስ አገልጋዮች» ን ይምረጡ እና የአገልጋዩን ስሞች፣ ወደቦች እና ደህንነት በላቁ ቅንብሮች ስር ያቀናብሩ። ምስክር ወረቀቱን ማንም ባለስልጣን የማያረጋግጥለት አገልጋይ ለማመን አንድ ጊዜ ይጠይቃል፤ የጣት አሻራውን አቅራቢዎ ከሚያሳየው ጋር ያወዳድሩ።\n\nመጽሐፍ የተያያዘበት ኢሜይል (EPUB፣ PDF እና የመሳሰሉት፣ እስከ 2 MB) ከስሩ «መጽሐፍ ክፈት» አለው፦ ፋይሉን ያመጣል፣ በቤተ-መጻሕፍትዎ ውስጥ ያስቀምጠዋል እና ይከፍተዋል።\n\nኢሜይልን ሳይከፍቱ አዲስ ኢሜይል ለማየት በቅንብሮች፣ ኢሜይል ስር «አዲስ ኢሜይልን በጀርባ ፈትሽ» ን ያብሩ፣ እና ምን ያህል ጊዜ እንደሆነ ይምረጡ (በየ15፣ 30 ወይም 60 ደቂቃ)። እስኪያበሩት ድረስ ጠፍቷል። ከዚያ አንባቢው ነቅቶ እና በመስመር ላይ ሳለ በተወሰነ ጊዜ በደህንነቱ የተጠበቀ ግንኙነት ይገናኛል፣ አንድ መለያ ከሌላው በኋላ፣ እና በመነሻ ላይ ያልተነበቡ ቆጠራን ያዘምናል። የተወሰነ ባትሪ ይጠቀማል። ኢሜይልን መክፈት እየሄደ ያለን ፍተሻ ያቆማል።\n\nየመነሻ ማያ ገጽ ዊጀቶች ያልተነበቡ ቆጠራን፣ የቅርብ ጊዜ እና ኮከብ የተደረገባቸው ኢሜይሎችን፣ አንድ የመልዕክት ሳጥን፣ እና ኢሜይል ለመጻፍ አቋራጭ ያሳያሉ።"
