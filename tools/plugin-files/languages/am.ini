menu.plugin.how = "ምናሌው ማድረግ እና ማቀናበር የሚችሉትን ይዘረዝራል። ከማያ ገጹ በታች፣ ከተከፈተው ማንኛውም ነገር በላይ ይከፈታል፦ በሚያነቡበት ጊዜ የማያ ገጹን መሃል ይንኩ ወይም ምረጥን ይጫኑ። ለማስኬድ ግቤትን ይንኩ ወይም ይምረጡ።\n\nበምናሌው ውስጥ ያሉ ቅንብሮች እሴታቸውን ያሳያሉ እና በቦታቸው ይቀየራሉ፤ ስለዚህ ምናሌው ክፍት ሆኖ ይቆያል። ተጨማሪ ግቤቶች ያሉት ግቤት ንዑስ ምናሌ ይከፍታል።\n\nለፈጣን ፓነል ከላይኛው ጠርዝ ወደ ታች ይጥረጉ፦ በተደጋጋሚ የሚቀይሯቸው፣ እንደ አዝራሮች። ለመቀየር አዝራርን ይንኩ፣ ለቅንብሮቹ ይያዙት። በአዝራሮች ብቻ የቀስት አዝራሮች ይመርጣሉ፣ ምረጥ ይቀያይራል፣ ተመለስ ይዘጋል። በ«ገጽታ» ስር «ምናሌዎች» ምናሌዎችን እንደ ዝርዝር ወይም እንደ ሰቆች ያሳያል።"
