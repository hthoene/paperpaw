joplin.plugin.name = የመጽሐፍ ማስታወሻዎች ማመሳሰል
joplin.plugin.description = የእያንዳንዱን መጽሐፍ ማድመቂያዎች እና ማስታወሻዎች በአንድ ማስታወሻ ውስጥ ያቆያል። ከ Joplin ጋር ይሠራል (Joplin Cloud፣ Joplin Server ወይም WebDAV)።
joplin.title = የመጽሐፍ ማስታወሻዎች ማመሳሰል
joplin.send = ወደ Joplin ላክ
joplin.send.help = የተላኩ ማስታወሻዎች ወዲያው ይላካሉ። ሊላኩ ያልቻሉ ማስታወሻዎች ይጠብቃሉ እና በሚቀጥለው ላኪ፣ በዚህ ወይም በደንብ ይሄዳሉ።
joplin.service = የሚመሳሰለው ከ
joplin.service.help = Joplin በ Joplin ውስጥ እንደተቀናበረው የሚመሳሰልበት፦ Joplin Cloud፣ የራስዎ Joplin Server፣ ወይም እንደ Nextcloud ያለ የ WebDAV አቃፊ። ምንም ኮምፒውተር መሥራት አያስፈልገውም።
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = አድራሻ
joplin.address.help = Joplin Server፦ አድራሻው፣ ለምሳሌ joplin.example.org። WebDAV፦ Joplin የሚመሳሰልበት አቃፊ፣ በቅንብሮቹ እንደሚታየው፣ ለምሳሌ dav.example.org/Joplin።
joplin.email = ኢሜይል
