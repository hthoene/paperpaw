notes-overview.plugin.description = የሁሉም መጻሕፍት ዕልባቶች እና ማድመቂያዎች በአንድ ዝርዝር፣ እና እንደ My Clippings.txt መላክ።
notes-overview.plugin.how = "«ሁሉም ማስታወሻዎች» ዕልባት ወይም ማድመቂያ ያደረጉባቸውን እያንዳንዱን መጽሐፍ በብዛታቸው ይዘረዝራል። በመሣሪያዎች ውስጥ ይክፈቱት። ማስታወሻዎቹን ለማየት መጽሐፍ ይምረጡ፣ መጽሐፉን በዚያ ቦታ ለመክፈት ደግሞ ማስታወሻ።\n\nበዝርዝሩ መጨረሻ ላይ «እንደ My Clippings.txt ላክ» ሁሉንም ማስታወሻዎች ከቤተ-መጻሕፍቱ አጠገብ ባለው Exports አቃፊ ውስጥ Kindle በሚጠቀምበት ቅርጸት (UTF-8) በአንድ ፋይል ይጽፋል። የ Kindle My Clippings.txt የሚያነቡ መተግበሪያዎች ሊያነቡት ይችላሉ። በማድመቂያ ላይ ያለ ማስታወሻ እንደ Kindle የራሱ ግቤት ነው። እዚህ ያለ መጽሐፍ የ Kindle ቦታዎች ስለሌለው «ቦታ» ማስታወሻው ወደ መጽሐፉ ምን ያህል እንደገባ በመቶኛ ነው። ፋይሉ በእያንዳንዱ ጊዜ እንደገና ይጻፋል፤ የቀደመውን ይተካል።"
