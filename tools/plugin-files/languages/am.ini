bluetooth.plugin.name = ብሉቱዝ
bluetooth.plugin.description = ሪሞቶችን፣ ኪቦርዶችን እና ዳሳሾችን ያጣምራል እና ያገናኛል።
bluetooth.plugin.how = "ብሉቱዝ ብሉቱዝ ባለበት (X4 Pro) ሪሞቶችን፣ ኪቦርዶችን እና ዳሳሾችን ከአንባቢው ጋር ያጣምራል።\n\n«መሣሪያ ጨምር» በሚደረስበት ያለውን ይፈልጋል፤ መጀመሪያ መሣሪያውን በማጣመር ሁነታ ያድርጉት። ይምረጡት እና በአንባቢው ላይ ያረጋግጡ (ቁጥር በሚታይበት ቦታ ቁጥሩን ያወዳድሩ)። ከዚያ የሪሞት ወይም የኪቦርድ ቁልፎች ገጾችን ይገለብጣሉ እና በምናሌዎች ውስጥ ይንቀሳቀሳሉ፤ እያንዳንዱ ቁልፍ የሚያደርገውን በ«ቁጥጥሮች» ስር ይለውጡ።\n\n«ሪሞቶች» ቁልፎቻቸው መቼ እንደሚሠሩ ይናገራል፦ እዚህ ሲበራ፣ በሚያነቡበት ጊዜ (መጽሐፍ ክፍት ሲሆን የተገናኘ፣ ባትሪ ይቆጥባል)፣ ወይም ሁልጊዜ። በመሣሪያ ላይ ያለው የምናሌ አዝራር ወይም ረጅም መጫን ይረሳዋል።\n\nዳሳሽ ለተሰኪዎች ነው፦ የትኛው ተሰኪ ሊጠቀምበት እንደሚችል ያብሩ። ምንም ነገር በማይጠቀምበት ጊዜ ሁሉ ብሉቱዝ ጠፍቷል።"
