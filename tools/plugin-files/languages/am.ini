sleep.plugin.name = የእንቅልፍ ማያ ገጽ
sleep.plugin.description = መሣሪያው ሲተኛ የሚተኛ ድመት፣ የመጽሐፉን ሽፋን፣ ሥዕሎችዎን ወይም መልዕክት ያሳያል።
sleep.plugin.how = "የእንቅልፍ ማያ ገጽ መሣሪያው ሲተኛ ማያ ገጹ የሚያሳየውን ይወስናል። ኢ-ኢንክ ሥዕሉን ያለ ኃይል ያቆያል።\n\nበቅንብሮች ውስጥ በመሣሪያ፣ የእንቅልፍ ማያ ገጽ ስር በ«አሳይ» ይምረጡት፦ የሚተኛ ድመት (ነባሪ)፣ የመጽሐፉ ሽፋን፣ ሥዕሎቼ፣ አርማው እና «በመተኛት ላይ»፣ ዊጀቶች፣ ገጹ እንዳለ፣ ወይም ገጹ ከሥዕል ጋር። «ሥዕሎቼ» የሥዕሎች አቃፊ ፋይሎችን አንድ በአንድ ያሳያል።\n\nሽፋን ወይም ሥዕል ሳይኖር ድመቷ ይታያል። ሲስተሙ የእንቅልፍ ማያ ገጹን ራሱ በሚስልበት እነዚህ ቅንብሮች ይደበቃሉ።\n\nየመጥፋት ማያ ገጽ፣ «ሲጠፋ አሳይ»፣ መሣሪያው ሲጠፋ፣ ከኃይል ምናሌ ወይም ከ«ከእንቅልፍ በኋላ አጥፋ» ጊዜ በኋላ (ዝቅተኛ ባትሪ ኃይሉን ሲቆርጥ አይደለም) አንድ ጊዜ ይሳላል። አርማው እና «ጠፍቷል»፣ ድመቷ፣ ሽፋኑ ወይም ሥዕሎቼን ካልመረጡ በቀር እንደ እንቅልፍ ማያ ገጹ ነው። ሌላ ተሰኪ ለእሱ ማያ ገጽ ሊያቀርብ ይችላል።\n\nየጅምር እና የዳግም ማስጀመር ማያ ገጽ፣ «ሲጀምር አሳይ» እና «እንደገና ሲጀምር አሳይ»፣ ሌላ ተሰኪ ለእነሱ ማያ ገጽ ካላቀረበ በቀር የመሣሪያው የራሱ ነው። ተሰኪዎች መሣሪያው ሲጀምር ገና አይሠሩም፦ ለጅምር የተመረጠው ማያ ገጽ መሣሪያው ሲጠፋ ወይም እንደገና ሲጀምር ቀድሞ ይሳላል፣ በሚቀጥለው ጅምር ይታያል። በጊዜው ዝግጁ ያልሆነ ማያ ገጽ ወይም የተጎዳ ሥዕል ለመሣሪያው የራስ ቦታውን ይለቃል፤ መሣሪያው ለማንኛውም ይጠፋል ወይም እንደገና ይጀምራል።"
