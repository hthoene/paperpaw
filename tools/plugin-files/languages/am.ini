update.dual-boot.help = PaperPaw ይህን መሣሪያ ከሌላ ፈርምዌር ጋር ይጋራል፤ ስለዚህ እዚህ ዝማኔዎችን አይጭንም። PaperPaw ን ይህን ለማዘጋጀት በተጠቀሙበት መሣሪያ ያዘምኑት። በዚህ መሣሪያ ላይ ሁለተኛ ፈርምዌር የለም? ከታች ባለው አዝራር ይንገሩ፣ ወይም በ paperpaw.org/flash PaperPaw ን በ USB እንደገና ፍላሽ ያድርጉ።
