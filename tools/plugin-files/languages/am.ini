rules.plugin.name = ደንቦች
rules.plugin.description = አንድ ነገር ሲፈጠር አንድ ነገር ያደርጋል፦ ለምሳሌ በ22:00 የሌሊት ሁነታ።
rules.plugin.how = "ደንብ አንድ ነገር ሲፈጠር በራሱ አንድ ነገር ያደርጋል፦ በየቀኑ በ22:00 የሌሊት ሁነታ በርቶ፣ ወይም PaperPaw ሲጀምር ካታሎጎች ተመስለው።\n\nደንቦች በቅንብሮች ውስጥ በ«ማበጀት» ስር እንደ «ደንቦች» ናቸው። «ደንብ ጨምር» «መቼ?» (PaperPaw ሲጀምር፣ የቀን ሰዓት፣ መጽሐፍ ሲከፈት ወይም ሲዘጋ፣ ባትሪው፣ ኃይል ሲሞላ፣ ማብሪያ እና ሌሎችም) እና «ከዚያ ምን?» (ድርጊት አስኪድ፣ ማብሪያ አብራ ወይም አጥፋ፣ ቁጥር አቀናብር፣ መልዕክት አሳይ) ብሎ ይጠይቃል። ለመጠበቅ ደንብን ይንኩ፤ እንደ «በሁለት የቀን ሰዓታት መካከል» ላለ ሁኔታ ወይም ለማስወገድ ይያዙት (በአዝራሮች ምረጥን ይያዙ)።\n\nየሚመረጡት ድርጊቶች፣ ማብሪያዎች እና ቁጥሮች በተሰኪ ይመጣሉ፦ ተሰኪውን ይምረጡ፤ ከዚያ የሚያመጣውን፤ ተመለስ እንደገና ከእሱ ይወጣል። እንደ «ተመለስ» ወይም «ቀጣይ ገጽ» ያለ በሚታየው ማያ ገጽ ላይ የሚሠራ ድርጊት እዚያ ቢጫን የሚያደርገውን ያደርጋል።\n\nሰዓቶች የትኛውም ማያ ገጽ ክፍት ቢሆንም ይሠራሉ። እርስ በርስ መቀልበስን የሚቀጥሉ ሁለት ደንቦች ከጥቂት እርምጃዎች በኋላ ይቆማሉ።"
