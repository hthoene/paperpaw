file-manager.plugin.name = የፋይል አስተዳዳሪ
file-manager.plugin.description = በመሣሪያው ላይ ያለ እያንዳንዱ አቃፊ እና ፋይል፦ ክፈት፣ ስም ቀይር፣ አንቀሳቅስ፣ ቅዳ እና ሰርዝ።
file-manager.plugin.how = "የፋይል አስተዳዳሪው መጻሕፍትዎን ብቻ ሳይሆን በመሣሪያው ማከማቻ ላይ ያለውን እያንዳንዱን አቃፊ እና ፋይል ያሳያል፤ እንዲሁም እንዲከፍቱ፣ ስም እንዲቀይሩ፣ እንዲያንቀሳቅሱ፣ እንዲገለብጡ እና እንዲሰርዙ እና አዳዲስ አቃፊዎችን እንዲሠሩ ያስችልዎታል።\n\nፋይሎችን ከመሣሪያዎች ምናሌ ይክፈቱ። ወደ አቃፊ ለመግባት ይንኩት፤ ተመለስ ወደ ላይኛው አቃፊ ይሄዳል። ምን ሊደረግበት እንደሚችል ለማየት ፋይልን ይንኩ፣ ወይም ማንኛውንም ግቤት ይያዙ (በአዝራሮች ምረጥን ይያዙ)። «አንቀሳቅስ» እና «ቅዳ» ግቤቱን ይመርጣሉ፦ ወደሚገባበት አቃፊ ይሂዱ እና ከታች ባለው አሞሌ ውስጥ «እዚህ ለጥፍ» ን ይምረጡ። በአዝራሮች ወደ አሞሌው ለመድረስ ከመጨረሻው ግቤት ወደ ታች ይጫኑ።\n\nበነጥብ የሚጀምሩ ፋይሎች እና አቃፊዎች፣ ለምሳሌ የ PaperPaw የራሱ ውሂብ፣ ተደብቀዋል። እነሱን ለማየት በቅንብሮች ውስጥ በቤተ-መጻሕፍት ስር «የተደበቁ ፋይሎች» ን ያብሩ።"
