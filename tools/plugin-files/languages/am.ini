vocabulary.sd.save.no-deck = ይህ ዴክ ከዚህ በኋላ እዚያ የለም።
vocabulary.sd.save.unreadable = የተገናኙ ፋይሎች ዝርዝር ሊነበብ አልቻለም፤ ስለዚህ ምንም አልተጻፈም። ካርዱን ያረጋግጡና እንደገና ይሞክሩ።
vocabulary.sd.save.full = ካርዱ ሞልቷል፤ ስለዚህ ምንም አልተጻፈም። ጥቂት ቦታ ያስለቅቁና እንደገና ይሞክሩ።
vocabulary.sd.save.too-large = ይህ ዴክ ለአንድ ፋይል በጣም ትልቅ ነው (4 MiB፣ ዝማኔ የሚያነበው ከፍተኛ)። በካርዱ ላይ ያለው ፋይል አልተለወጠም።
vocabulary.sd.save.failed = ፋይሉ ሊጻፍ አልቻለም። በካርዱ ላይ ያለው ፋይል አልተለወጠም። ካርዱን ያረጋግጡና እንደገና ይሞክሩ።
vocabulary.sd.save.not-updated = አልተቀመጠም፦ በካርዱ ላይ ያለው ፋይል መጀመሪያ ሊነበብ አልቻለም፣ እና ዴኩ ገና የሌለውን ለውጦች ሊኖሩት ይችላል። ፋይሉን ያስተካክሉ እና እንደገና ይሞክሩ።
vocabulary.sd.save.left-out = አልተቀመጠም፦ የፋይሉ አንዳንድ መስመሮች ሊነበቡ አልቻሉም፣ ማስቀመጥም ይጥላቸዋል። ፋይሉን ያስተካክሉ፣ ያዘምኑ እና እንደገና ይሞክሩ።
vocabulary.sd.save.anki = {file} የ Anki ፋይል ነው፦ የሚነበበው ብቻ ነው፣ ፈጽሞ አይጻፍም።
vocabulary.sd.save.anki-refused = አልተቀመጠም፦ {file} PaperPaw የሚያነበው ብቻ የሆነ የ Anki ዴክ ነው። ለማዘመን ዴኩን ከ Anki እንደገና ይላኩ።
vocabulary.sd.removal-held = ምንም ካርድ አልተወገደም፦ አንዳንድ መስመሮች ሊነበቡ አልቻሉም።
