format-txt.plugin.name = ተራ ጽሑፍ
format-txt.plugin.description = ተራ የጽሑፍ ፋይሎችን (.txt) ይከፍታል።
format-txt.plugin.how = "ተራ የጽሑፍ ፋይሎች (.txt) ምንም ማዘጋጀት ሳያስፈልግ ከቤተ-መጻሕፍቱ እንደ ማንኛውም መጽሐፍ ይከፈታሉ። ተሰኪው UTF-8፣ UTF-16 እና Windows-1252 ጽሑፍን ያነባል እና ኢንኮዲንጉን ራሱ ያገኛል።\n\nአንቀጾች በፋይሉ ውስጥ ያሉትን ባዶ መስመሮች ይከተላሉ፤ ፋይሉ ባዶ መስመር ከሌለው እያንዳንዱ መስመር አንቀጽ ነው። በ Project Gutenberg ፋይሎች ውስጥ በመጀመሪያ እና በመጨረሻ ያለው የፈቃድ ጽሑፍ ይተዋል፤ ርዕሱ እና ደራሲው ከራስጌው ይወሰዳሉ።\n\nፋይሉ ፈጽሞ በሙሉ አይጫንም፤ ስለዚህ በጣም ትልልቅ ጽሑፎችም በትናንሽ መሣሪያዎች ላይ ይከፈታሉ።"
format-txt.title = ተራ ጽሑፍ
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC እና XTCH መጻሕፍትን፣ የ Xteink አንባቢዎች አስቀድመው የተሳሉ ገጾችን ይከፍታል።
format-xtc.plugin.how = "XTC እና XTCH ፋይሎች ገጾቻቸው አስቀድመው እንደ ሥዕል የተሳሉ መጻሕፍት ናቸው፤ ለ Xteink አንባቢዎች በሚሠሩ ቀያሪዎች የተሠሩ። ከቤተ-መጻሕፍቱ እንደ ማንኛውም መጽሐፍ ይከፈታሉ።\n\nእያንዳንዱ ገጽ ቋሚ ሥዕል ስለሆነ ጽሑፉ መጠኑ ሊቀየር ወይም በሌላ ቅርጸ-ቁምፊ ሊቀመጥ አይችልም። ገጾቹ ጥቁር እና ነጭ ናቸው ወይም አራት ግራጫ ቃናዎች አሏቸው። እያንዳንዱ ገጽ ሲታይ ይፈታል፤ ስለዚህ በ X4 ላይም ጥቂት ማህደረ ትውስታ ያስፈልጋል።\n\nፋይሉ ካለው ርዕስ፣ ደራሲ እና ምዕራፎች ከፋይሉ ይወሰዳሉ።"
format-xtc.title = የ XTC ገጾች
help.plugin.name = ፍንጮች
help.plugin.description = አንድ ማያ ገጽ ለመጀመሪያ ጊዜ ሲከፈት የቁጥጥሮቹን ሥራ ያሳያል።
help.plugin.how = "አንድ ማያ ገጽ ለመጀመሪያ ጊዜ ሲከፈት በላዩ ላይ አጭር ማስታወሻ ቁጥጥሮቹ የሚያደርጉትን ይናገራል፦ መንካት የሚሄድባቸው የማያ ገጹ ክፍሎች በክፈፍ፣ እና አዝራሮቹ የሚያደርጉት።\n\nመንካት ወይም ማንኛውም አዝራር ማስታወሻውን ይዘጋል፤ ለዚያ ማያ ገጽ እንደገና አይመጣም። «ከዚህ በኋላ ፍንጭ አታሳይ» ሁሉንም ያጠፋል።\n\nበቅንብሮች ውስጥ በሲስተም ስር «ፍንጮች» ያበራቸዋል ወይም ያጠፋቸዋል፣ «ፍንጮችን እንደገና አሳይ» ደግሞ የእያንዳንዱ ማያ ገጽ ማስታወሻ አንድ ጊዜ እንደገና እንዲታይ ያደርጋል።"
