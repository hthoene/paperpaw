update.not-dual.warning = "ከዚያ PaperPaw እዚህ ዝማኔዎችን ይጭናል። በዚህ መሣሪያ ላይ ሌላ ፈርምዌር ከተጫነ ዝማኔ ሊተካው ይችላል። ይህን ለመተግበር PaperPaw እንደገና ይጀምራል።\nበኋላ ለመቀልበስ፦ ዝማኔዎች፣ «ባለ ሁለት ቡትን እንደገና ፈልግ»፣ ወይም በ paperpaw.ini ውስጥ dual-boot = auto።"
