transfer.plugin.description = ከተመሳሳይ አውታረ መረብ ካለ አሳሽ መጻሕፍትን እና ሌሎች ፋይሎችን ወደ መሣሪያው ያስቀምጣል።
transfer.plugin.how = "የ Wi-Fi ማስተላለፍ ያለ ገመድ ወይም መተግበሪያ ከተመሳሳይ አውታረ መረብ ካለ አሳሽ መጻሕፍትን እና ሌሎች ፋይሎችን ወደ መሣሪያው ያስቀምጣል። ፋይሎችን ማምጣት፣ አቃፊዎችን መሥራት እና መሰረዝም ይችላሉ።\n\nከመሣሪያዎች ይክፈቱት። ማያ ገጹ አድራሻን እንደ ጽሑፍ እና እንደ QR ኮድ ያሳያል፦ በስልክ ወይም በኮምፒውተር ላይ በአሳሽ ይክፈቱት፣ ወይም ኮዱን ይቃኙ። አድራሻው በእያንዳንዱ ጊዜ አዲስ የሚሠራ ቁልፍ ይዟል፤ ስለዚህ በአውታረ መረቡ ላይ ያሉ ሌሎች ፋይሎችዎን ማግኘት አይችሉም። ማስተላለፉ ማያ ገጹ ክፍት ሳለ ይሠራል።\n\nPaperPaw Wi-Fi ን ራሱ በሚያስኬድበት፣ እንደ X4፣ ከታች «ያለ ራውተር» የመሣሪያውን የራሱ አውታረ መረብ ይከፍታል፤ ስልኩ ኮድ በመቃኘት ይቀላቀለዋል።"
