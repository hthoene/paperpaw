format-images.plugin.name = ሥዕሎች
format-images.plugin.description = ሥዕሎችን (.jpg፣ .png፣ .gif) እንደ መጻሕፍት ይከፍታል፤ እያንዳንዳቸው አንድ ገጽ።
format-images.plugin.how = "ሥዕሎች (.jpg፣ .png፣ .gif) ከቤተ-መጻሕፍቱ እንደ መጻሕፍት ይከፈታሉ፣ በአንድ ገጽ አንድ ሥዕል፣ ከማያ ገጹ ጋር የተስማማ።\n\nሙሉ የሥዕሎች አቃፊ ለማንበብ የመጀመሪያውን ሥዕሉን ይክፈቱ፦ በአቃፊው ውስጥ ከእሱ በኋላ ያሉት ሥዕሎች በስሞቻቸው ቅደም ተከተል (2 ከ10 በፊት) ይከተላሉ። በአቃፊው ውስጥ ዘግይቶ ያለ ሥዕል ከዚያ ይጀምራል፤ በእያንዳንዱ ውስጥ ያለው ቦታ ለየብቻ ይታወሳል። እስከ 300 ሥዕሎች ያለው አቃፊ ከከፈቱት ጀምሮ ይነበባል።\n\nሥዕል ያልሆነ ወይም በጣም ትልቅ የሆነ ፋይል በምትኩ ስሙን ያሳያል። የራሱ ርዕስ ላለው ብዙ ሥዕሎች መጽሐፍ የኮሚክ መጽሐፍ ማህደር (.cbz) የተሻለ መልክ ነው።"
format-images.title = ሥዕል
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = የ Markdown ፋይሎችን (.md)፣ ለምሳሌ ማስታወሻዎችን ይከፍታል።
format-markdown.plugin.how = "እንደ ማስታወሻዎች ያሉ የ Markdown ፋይሎችን (.md) እንደ መጻሕፍት ይከፍታል፦ ርዕሶች፣ ዝርዝሮች፣ ጥቅሶች እና ማጉላት እንደታሰቡት እንጂ እንደ ምልክቶች አይደለም።\n\nፋይሎቹን ወደ ቤተ-መጻሕፍት አቃፊ ያስቀምጡ እና ከቤተ-መጻሕፍቱ ይክፈቷቸው። የመጀመሪያው ርዕስ የፋይሉ ርዕስ ነው፤ ከፋይሉ አጠገብ ያሉ ሥዕሎች ጽሑፉ በሚጠቅሳቸው ቦታ ይታያሉ።"
format-markdown.title = Markdown
format-mobi.plugin.name = የ MOBI መጻሕፍት
format-mobi.plugin.description = ያለ DRM .mobi እና .azw ፋይሎችን ይከፍታል።
format-mobi.plugin.how = "የ MOBI መጻሕፍት (.mobi፣ .azw) ምንም ማዘጋጀት ሳያስፈልግ ከቤተ-መጻሕፍቱ እንደ ማንኛውም መጽሐፍ ይከፈታሉ። ርዕሱ፣ ደራሲዎቹ፣ ቋንቋው እና ሽፋኑ ከመጽሐፉ ይመጣሉ፤ የይዘት ዝርዝሩ ከርዕሶቹ ይሠራል።\n\nመጽሐፉ ለመጀመሪያ ጊዜ ሲከፍቱት ይለወጣል፤ ለረጅም መጽሐፍ ጥቂት ሰከንዶች ይወስዳል፤ ከዚያ በኋላ ወዲያው ይከፈታል። ጽሑፍ፣ ርዕሶች፣ ደማቅ እና ተጋድሞ የተጻፈ ጽሑፍ፣ አገናኞች እና ሥዕሎች ይታያሉ።\n\nDRM ያላቸው መጻሕፍት (ከሱቅ የተገዙ አብዛኞቹ መጻሕፍት) ሊከፈቱ አይችሉም፤ የ Huffman መጭመቂያ ያላቸው ወይም አዲሱ KF8 ቅርጸት (.azw3) ያላቸውም እንዲሁ፦ ሲከፍቷቸው PaperPaw ይነግርዎታል። እንደ Calibre ባለ መሣሪያ የተሠራ የ EPUB ቅጂ ሁልጊዜ ይከፈታል።"
format-mobi.title = የ MOBI መጻሕፍት
format-rtf.plugin.name = የ RTF ሰነዶች
format-rtf.plugin.description = .rtf ፋይሎችን እንደ መጻሕፍት ይከፍታል።
