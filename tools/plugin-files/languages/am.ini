tasks.plugin.description = የመጨረሻ ቀን እና ቅድሚያ ያላቸው የሚደረጉ ዝርዝሮች፣ በአንባቢው ላይ ወይም ከ CalDAV አገልጋይዎ ጋር የተመሳሰሉ፣ ከመነሻ ማያ ገጽ ዊጀቶች ጋር።
tasks.plugin.how = "በአንባቢዎ ላይ የሚደረጉ ዝርዝሮች፦ የመጨረሻ ቀን እና ቅድሚያ ያላቸው ተግባሮች፣ ሲጠናቀቁ የሚመረጡ። ያለ ዝግጅት እና ያለ አውታረ መረብ ይሠራሉ፤ ከ CalDAV አገልጋይ (Nextcloud፣ Radicale፣ Baïkal፣ Fastmail እና ሌሎች) ጋር ተመሳስለው ሊቆዩ ይችላሉ፤ ስለዚህ ተመሳሳይ ዝርዝሮች በስልክዎ እና በኮምፒውተርዎ ላይ ይኖራሉ።\n\nተግባሮችን ከመሣሪያዎች ምናሌ ይክፈቱ። የመጀመሪያው ረድፍ የሚታየውን ዝርዝር ይሰይማል፤ ለሌላ ዝርዝር፣ በሁሉም ዝርዝሮች ውስጥ ላሉ «ዛሬ እና ያለፉ»፣ ለአዲስ ዝርዝር፣ ለማመሳሰል ወይም መለያውን ለማቀናበር ይምረጡት። «ተግባር ጨምር» ኪቦርዱን ይከፍታል። በተግባር ላይ ምረጥ ያጠናቅቀዋል (እንደገና፦ አልተጠናቀቀም)። ርዕሱን፣ የመጨረሻ ቀኑን (ዛሬ፣ ነገ፣ በአንድ ሳምንት ውስጥ፣ ወይም እንደ 2026-12-24 ያለ የሚጽፉት ቀን) ወይም ቅድሚያውን ለመቀየር፣ ወይም ለማስወገድ ተግባርን ይያዙ ወይም ምናሌን ይጫኑ። ክፍት ተግባሮች መጀመሪያ ይመጣሉ፣ በቀናቸው እና ከዚያ በቅድሚያ፤ የተጠናቀቁት ለአንድ ሳምንት በመጨረሻ ይቆያሉ (በቅንብሮች ውስጥ በ«ተግባሮች» ስር ይቀናበራል)፤ ከዚያ አንባቢውን ይለቃሉ።\n\nለመነሻ ማያ ገጽ ዊጀቶች (መነሻ ማያ ገጹን ይያዙ፤ ከዚያ ዊጀት ይጨምሩ)፦ «ዛሬ ተግባሮች» ዛሬ የሚደርሱትን ወይም ያለፉትን ያሳያል፣ «የተግባር ዝርዝር» አንድ ዝርዝር ያሳያል፣ «ክፍት ተግባሮች» ይቆጥራቸዋል፣ «ቀጣይ ተግባር» ቀጥሎ የሚደረገውን ያሳያል። በዊጀት ውስጥ በተግባር ላይ መንካት ያጠናቅቀዋል፤ በርዕስ ላይ መንካት ዝርዝሮቹን ይከፍታል።\n\nለማመሳሰል ከዝርዝር ረድፍ «የ CalDAV መለያ» ን ይምረጡ እና የአገልጋዩን አድራሻ፣ የተጠቃሚ ስምዎን እና የይለፍ ቃል (ቢቻል የመተግበሪያ የይለፍ ቃል) ያስገቡ። የአገልጋዩ አድራሻ በቂ ነው፣ ለምሳሌ cloud.example.com/remote.php/dav፤ አንባቢው የተግባር ዝርዝሮችዎን ከዚያ ያገኛል። እያንዳንዱ የአገልጋዩ የተግባር ዝርዝር በአንባቢው ላይ ዝርዝር ይሆናል። አንባቢው ተግባሮችን ሲከፍቱ፣ «አሁን አመሳስል» ሲመርጡ እና አውታረ መረቡ ለማንኛውም ሲበራ ያመሳስላል፤ ያለ አውታረ መረብ የቀየሩት ይጠብቃል እና በኋላ ይላካል። ተግባር በአንባቢው ላይ እና በሌላ ቦታ በዚህ መሃል ከተቀየረ የአገልጋዩ ስሪት ይወሰዳል እና የእርስዎ ከጎኑ እንደ አዲስ ተግባር ይቀመጣል፤ ስለዚህ ምንም አይጠፋም። ማስታወሻዎች፣ ማንቂያዎች እና ተግባር በአገልጋዩ ላይ ያለው ሌላ ሁሉ እንዳለ ይቆያሉ። የሚደጋገሙ ተግባሮች ይታያሉ ግን በፈጠሯቸው ቦታ ይለወጣሉ። አንባቢው በ12 ዝርዝሮች ውስጥ እስከ 200 ተግባሮችን ይይዛል።"
