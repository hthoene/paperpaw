plugin-manager.plugin.description = ተሰኪዎችን ይዘረዝራል እና ያበራል እና ያጠፋል።
plugin-manager.plugin.how = "የተሰኪ አስተዳዳሪ እያንዳንዱን ተሰኪ ከስሪቱ እና መግለጫው ጋር ይዘረዝራል፣ ተሰኪዎችንም ያበራል እና ያጠፋል።\n\nበቅንብሮች ውስጥ እንደ «ተሰኪዎችን አስተዳድር» ያገኙታል። «የተሰኪ ቅንብሮች» እንደ የእያንዳንዱ ተሰኪ የአውታረ መረብ አጠቃቀም ላሉ ምርጫዎች የተለየ ገጽ ነው። ለማብራት ወይም ለማጥፋት ተሰኪን ይንኩ (በአዝራሮች ይምረጡት)። ለውጡ ከዳግም ማስጀመር በኋላ ይሠራል፦ ከዚያ ከታች ያለው አሞሌ «አሁን እንደገና ጀምር» ያቀርባል። እንዴት እንደሚሠራ ለማንበብ ተሰኪን ይያዙ (በአዝራሮች ምረጥን ይያዙ)።\n\n«ሁልጊዜ በርቷል» ተብሎ ምልክት የተደረገበት ተሰኪ ሊጠፋ አይችልም፤ «የሚያስፈልግ» ተብሎ ምልክት የተደረገበት ደግሞ ሌላ ተሰኪ ሥራውን ከሠራ በኋላ ብቻ ሊጠፋ ይችላል፤ አለበለዚያ PaperPaw የመመለሻ መንገድ አይኖረውም። በ«ማያ ገጾች» ስር ብዙዎች የሚያቀርቡትን ቦታ የትኛው ተሰኪ እንደሚያሳይ ይመርጣሉ።"
