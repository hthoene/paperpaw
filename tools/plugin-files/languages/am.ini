news.plugin.how = "ዜና የ RSS ወይም Atom ፊዶችን ወደ መጻሕፍት ይቀይራል። እያንዳንዱ ፊድ በቤተ-መጻሕፍቱ የዜና አቃፊ ውስጥ አንድ መጽሐፍ ይሆናል፣ የቅርብ ጊዜ ጽሑፎቹ እንደ ተራ ጽሑፍ፣ እንደ ማንኛውም ሌላ መጽሐፍ ለማንበብ።\n\nዜናን ከመሣሪያዎች ምናሌ ይክፈቱ እና «ፊድ ጨምር» ን ይምረጡ፤ አድራሻው በጋዜጣው ወይም በብሎጉ ድር ጣቢያ ላይ ነው። «ዜናውን አምጣ» ሁሉንም ፊዶች ያመጣል እና ቀደምት መጻሕፍትን ይተካል። ፊድን ለብቻው ለማምጣት ወይም ለማስወገድ ይያዙት (በአዝራሮች ምረጥን ይያዙ)። የተወገደ ፊድ መጽሐፉን በቤተ-መጻሕፍቱ ውስጥ ይተዋል።\n\nማምጣት አውታረ መረብ ይፈልጋል። «ጽሑፎች በፊድ» (ቅንብሮች፣ ቤተ-መጻሕፍት) እያንዳንዱ መጽሐፍ ስንት ጽሑፎች እንደሚይዝ ያቀናብራል። «የዜና ርዕሶች» ዊጀት በመነሻ ማያ ገጹ ላይ ያሳያቸዋል።"
