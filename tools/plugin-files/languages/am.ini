calibre.plugin.name = ገመድ አልባ ቤተ-መጻሕፍት
calibre.plugin.description = መጻሕፍትን በአውታረ መረብ ይቀበላል። ለ Calibre እንደ ገመድ አልባ መሣሪያ ይሠራል።
calibre.plugin.how = "ገመድ አልባ ቤተ-መጻሕፍት መሣሪያው በኮምፒውተርዎ ላይ በ Calibre ውስጥ እንደ ገመድ አልባ መሣሪያ እንዲታይ ያደርጋል። ከዚያ Calibre መጻሕፍትን ወደ እሱ መላክ፣ መዘርዘር እና መሰረዝ ይችላል። መጻሕፍቱ ወደ ቤተ-መጻሕፍቱ ይገባሉ።\n\nመሣሪያው እና ኮምፒውተሩ በአንድ የ Wi-Fi አውታረ መረብ ውስጥ ሆነው ገመድ አልባ ቤተ-መጻሕፍትን ከመሣሪያዎች ምናሌ ይክፈቱ። በ Calibre ውስጥ Connect/share ን፣ ከዚያ Start wireless device connection ን ይምረጡ። መሣሪያው ኮምፒውተርዎን ሲያገኝ ስሙን ያሳያል፤ «ተገናኝ» ን ይንኩ (በአዝራሮች ምረጥን ይጫኑ)። Calibre እዚህ መጻሕፍትን መጨመር እና መሰረዝ ይችላል፤ ስለዚህ ከራስዎ ኮምፒውተር ጋር ብቻ ይገናኙ። ማያ ገጹን መዝጋት ግንኙነቱን ያበቃል።\n\nCalibre በራሱ ካልተገኘ የኮምፒውተሩን አድራሻ በቅንብሮች ውስጥ በቤተ-መጻሕፍት ስር በ Calibre ክፍል ውስጥ «አድራሻ» ብለው ያስገቡ። Calibre ከ9090 ሌላ ወደብ የሚጠቀም ከሆነ እንደ :port ይጨምሩት፣ ለምሳሌ 192.168.1.20:9091።"
