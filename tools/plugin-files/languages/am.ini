calendar.plugin.description = የቀን መቁጠሪያዎችዎ በአንባቢው ላይ፦ ከ CalDAV፣ iCal እና ፋይሎች የአጀንዳ፣ የቀን፣ የሳምንት እና የወር እይታዎች፣ ከእውቂያዎች የልደት ቀኖች፣ የመነሻ ዊጀቶች እና የእንቅልፍ ማያ ገጽ።
calendar.plugin.how = "የቀን መቁጠሪያዎችዎ በአንባቢው ላይ፦ የቀጣይ ቀናት አጀንዳ፣ ቀን፣ ሳምንትና ወር፤ ከ CalDAV (Nextcloud፣ Radicale፣ Baïkal፣ Fastmail ወዘተ)፣ ከ iCal አድራሻዎች (.ics፣ webcal://) እና ከካርዱ ፋይሎች ክስተቶች፣ ከእውቂያዎች (CardDAV) ልደቶችና ዓመታዊ በዓላት ጋር። አንባቢው ያነባል እንጂ አይለውጥም።\n\nከመሣሪያዎች ምናሌ ይክፈቱት። የመጀመሪያው ረድፍ እይታውን ይሰይማል፤ ይምረጡት፣ ረድፍ ይያዙ ወይም ምናሌን ይጫኑ፦ ወደ አጀንዳ፣ ቀን፣ ሳምንት፣ ወር ወይም የልደት ቀኖች ለመቀየር፣ የቀን መቁጠሪያ ለመጨመር ወይም ለማመሳሰል። በቀንና በሳምንት ሁለቱ የመጀመሪያ ረድፎችና የገጽ ቁልፎች ወደኋላና ወደፊት ይሄዳሉ፤ በወር የቀስት ቁልፎች ቀኑን፣ የገጽ ቁልፎች ወሩን ይቀይራሉ፣ ምረጥ ቀኑን ይከፍታል። ክስተት ላይ ምረጥ ሙሉውን ያሳያል፦ መቼ፣ የት፣ የትኛው የቀን መቁጠሪያ፣ እንዴት እንደሚደገም። ተመለስ አንድ እርምጃ ይመልሳል።\n\nአዲስ በ«የቀን መቁጠሪያዎች» ይጨምሩ (በምናሌው ወይም በቅንብሮች «የቀን መቁጠሪያ»)። ዓይነት ይምረጡ፦ የ CalDAV መለያ (የአገልጋይ አድራሻ ይበቃል፣ ለምሳሌ cloud.example.com/remote.php/dav፤ ክስተት ያለው ሁሉ ይታያል)፣ የ iCal አድራሻ (የታተመ .ics)፣ የካርዱ ፋይል፣ ወይም እውቂያዎች (የ CardDAV አድራሻ መጽሐፍ፤ ልደቶቻቸውና ዓመታዊ በዓላት ይታያሉ)። አድራሻ፣ ለመለያ የተጠቃሚ ስምና የይለፍ ቃል (ቢቻል የመተግበሪያ የይለፍ ቃል፤ ከሌሎቹ የይለፍ ቃሎች ጋር ይቀመጣል) እና ስም ያስገቡ። ለመለየት እያንዳንዱ የሚቀየር ምልክት (ነጥብ፣ ቀለበት፣ ግራጫ ነጥብ ወይም ካሬ) አለው፤ እስከ ስድስት ይቻላል።\n\nተደጋጋሚ ክስተቶች (በየቀኑ፣ በየሳምንቱ፣ በየወሩ፣ በየዓመቱ፣ ከሳምንቱ ቀናት፣ ቆጠራ፣ የማብቂያ ቀንና የተዘለሉ ቀናት ጋር)፣ ሙሉ ቀንና የሌላ የሰዓት ሰቅ ክስተቶች በአንባቢው ሰዓት ይታያሉ። ከዛሬ በፊትና በኋላ 60 ቀናት፣ ቢበዛ 240 ክስተቶች ተቀምጠው ያለ አውታረ መረብ ይታያሉ። የማይነበብ ደንብ ያለው ክስተት አንድ ጊዜ ይታያል።\n\nማመሳሰል፦ የቀን መቁጠሪያውን ሲከፍቱ (ቢበዛ በየ5 ደቂቃው)፣ «አሁን አመሳስል» ሲመርጡ፣ እና በቅንብሮች «የቀን መቁጠሪያ» እንዳቀናበሩት አውታረ መረቡ አስቀድሞ ሲበራ ወይም ኃይል መሙላት ሲጀምር። ከ«አሁን አመሳስል» በቀር ሬዲዮው ለዚህ አይበራም።\n\nየመነሻ ማያ ገጽ ዊጀቶች (መነሻ ማያ ገጹን ይዘው ዊጀት ይጨምሩ)፦ «ዛሬ» ቀኑንና የያዘውን፣ «ቀጣይ ክስተት» ቀጣዩን፣ «አጀንዳ» ቀጣዮቹን ቀናት፣ «ወር» ክስተት ባላቸው ቀናት ስር ነጥብ ያለው ወር፣ «የልደት ቀኖች» ቀጣዮቹን ልደቶች ያሳያሉ። ክስተትን ወይም የወሩን ቀን መንካት ይከፍተዋል። የእንቅልፍ ማያ ገጽ የዛሬን አጀንዳ ማሳየት ይችላል፦ በቅንብሮች በእንቅልፍ ማያ ገጽ የቀን መቁጠሪያን ይምረጡ።"
