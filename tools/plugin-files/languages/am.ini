core.secrets-unreadable = {file} ሊነበብ ስላልቻለ የይለፍ ቃሎች እና ቁልፎች አይቀመጡም። ፋይሉን በኮምፒውተር ላይ ያስተካክሉ ወይም ያስወግዱ።
core.secrets-unopened = በዚህ ካርድ ላይ የተቀመጡ አንዳንድ የይለፍ ቃሎች እና ቁልፎች እዚህ ሊከፈቱ አይችሉም፦ በሌላ መሣሪያ ላይ ተቀምጠዋል ወይም የዚህ መሣሪያ ቁልፍ ጠፍቷል። ተሰኪ በሚጠይቅበት ቦታ እንደገና ያስገቧቸው።
