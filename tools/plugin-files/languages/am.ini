vocabulary.sd.skipped.other = {count} መስመሮች ተትተዋል
vocabulary.sd.skipped-notes.one = {count} ማስታወሻ ተትቷል፦ በጣም ረጅም ነው (ለምሳሌ ሥዕል አለው)
vocabulary.sd.skipped-notes.other = {count} ማስታወሻዎች ተትተዋል፦ በጣም ረጅም ናቸው (ለምሳሌ ሥዕል አላቸው)
vocabulary.sd.no-room = {count} መስመሮች አልገቡም፦ አንድ ዴክ 20,000 ካርዶችን ይይዛል።
vocabulary.sd.outcome.same = ከመጨረሻው ዝማኔ ወዲህ አልተለወጠም።
vocabulary.sd.outcome.unreadable = ይህ ፋይል ሊነበብ አልቻለም። ካርዱን ያረጋግጡና እንደገና ይሞክሩ።
vocabulary.sd.outcome.too-many = ቀድሞውኑ 50 ዴኮች አሉ፤ ስለዚህ ይህ ፋይል አልተነበበም። መጀመሪያ ዴክ ይሰርዙ።
vocabulary.sd.outcome.crowded = በጣም ብዙ ካርዶች ተመሳሳይ ፊት አላቸው፤ ስለዚህ ይህ ፋይል አልተነበበም። ፊቶቹ እንዲለያዩ ያድርጉ።
vocabulary.sd.outcome.no-cards = ምንም ካርድ አልተገኘም። ካርድ የፊት ጽሑፍ ያለው መስመር ነው፤ ፊቱ የመጀመሪያው አምድ ነው።
vocabulary.sd.outcome.too-large = ይህ ፋይል በጣም ትልቅ ነው፦ ቢበዛ 4 MiB እና 20,000 መስመሮች። ወደ ብዙ ፋይሎች ይከፋፍሉት።
vocabulary.sd.outcome.utf16 = ይህ ፋይል እንደ UTF-16 ተቀምጧል። እንደ CSV UTF-8 እንደገና ያስቀምጡት (በተመን ሉህ ውስጥ፦ CSV UTF-8)።
vocabulary.sd.outcome.no-notes = ምንም ማስታወሻ አልተገኘም፦ ይህ የ Anki ዴክ አይደለም፣ ወይም ማስታወሻ የለውም። ከ Anki እንደ የ Anki ዴክ ጥቅል (.apkg) ይላኩት።
vocabulary.sd.outcome.newer-anki = ይህ ዴክ በአዲሱ የ Anki ቅርጸት ነው። «የቆዩ የ Anki ስሪቶችን ደግፍ» ምልክት አድርገው እንደገና ይላኩት።
vocabulary.sd.outcome.deck-too-large = ይህ የ Anki ዴክ እዚህ ለማንበብ በጣም ትልቅ ነው፦ ቢበዛ 4,000 ፋይሎች፣ 4 MiB ማስታወሻዎች እና 20,000 ማስታወሻዎች። ያለ ሚዲያ እና ያለ መርሐ ግብር ይላኩት፣ ወይም ይከፋፍሉት።
vocabulary.sd.line = መስመር {line}
vocabulary.sd.fault.no-front = በፊት አምድ ውስጥ ምንም ጽሑፍ የለም። ቃሉን እዚያ ያስቀምጡ።
vocabulary.sd.fault.not-utf8 = የ UTF-8 ጽሑፍ አይደለም። ፋይሉን እንደ UTF-8 ያስቀምጡ (በተመን ሉህ ውስጥ፦ CSV UTF-8)።
vocabulary.sd.fault.too-long = ከ8 KiB ይረዝማል። ካርዱን አጠር ያድርጉት።
vocabulary.sd.fault.open-quote = ጥቅስ ተከፍቷል እና አልተዘጋም። ይዝጉት ወይም ያስወግዱት።
vocabulary.setting.sd-auto = ሲከፈት ዴኮችን ከካርዱ አዘምን
vocabulary.setting.sd-auto.help = ፍላሽ ካርዶች በአቃፊው ውስጥ አዲስ ወይም የተለወጡ ፋይሎችን ያነባሉ።
vocabulary.setting.sd-folder = ለዴክ ፋይሎች አቃፊ
vocabulary.setting.sd-folder.help = በ SD ካርዱ ላይ፦ በውስጡ ያለ የ CSV፣ TSV ወይም Anki ፋይል ዴክ ነው።
vocabulary.sd.readme = "ፍላሽ ካርዶች ከፋይሎች\n\nለእያንዳንዱ ዴክ እዚህ ፋይል ያስቀምጡ፦ Spanish.tsv ዴክ Spanish ይሠራል።\nፋይሎች፦ .tsv፣ .csv ወይም .txt፣ እንደ UTF-8 የተቀመጡ፣ ወይም .apkg፦ በ«የቆዩ የ Anki ስሪቶችን ደግፍ» ምልክት የተላከ የ Anki ዴክ። የማስታወሻዎቹ የመጀመሪያዎቹ ሦስት መስኮች ፊት፣ ጀርባ እና ምሳሌ ይሆናሉ፤ መርሐ ግብሩ እና ሚዲያው አይነበቡም፤ PaperPaw የ Anki ፋይል ፈጽሞ አይጽፍም።\n\nበእያንዳንዱ መስመር አንድ ካርድ፦ ፊት፣ ጀርባ እና ምሳሌ (አማራጭ)፣ በታብ፣ ኮማ ወይም ሴሚኮሎን ተለይተው። የመጀመሪያው መስመር አምዶቹን ሊሰይም ይችላል፦ front፣ back፣ example። ምሳሌ፦\n\nKatze\tcat\tDie Katze schläft.\n\nከዚያ በአንባቢው ላይ «ፍላሽ ካርዶች» ን ይክፈቱ፣ «በ SD ካርዱ ላይ ያሉ ካርዶች» ን፣ ከዚያ «ዴኮቹን ከካርዱ አዘምን» ን ይምረጡ።\n\nማወቅ ጥሩ ነው፦\n- ዴኮቹ ከተማሩት ጋር በአንባቢው ላይ ይቆያሉ። ፋይል አዲስ ወይም የተለወጠ ሲሆን ይነበባል፣ ካርዶቹም ወደ ዴኩ ይጨመራሉ ወይም እዚያ ይለወጣሉ።\n- የካርድን ጀርባ ወይም ምሳሌ በፋይሉ ውስጥ ይቀይሩ፦ ካርዱ ይለወጣል እና እድገትዎን ይጠብቃል።\n- የካርድን የፊት ጽሑፍ ይቀይሩ፦ እንደ አዲስ ካርድ ይቆጠራል፣ የድሮውም እንደገና ይጀምራል። ካርዶች በፊት ጽሑፋቸው ይዛመዳሉ፣ ክፍተቶች እና አቢይ ፊደላት አይቆጠሩም። ዴክን ወደ ፋይል ያስቀምጡ (በ SD ካርዱ ላይ ያሉ ካርዶች፣ ዴኩን ወደ ካርዱ አስቀምጥ) እና እያንዳንዱ ካርድ በ id አምድ ውስጥ ቁጥር ይኖረዋል፦ እዚያ የፊት ጽሑፍ ይቀይሩ፣ የፋይሉን የመጀመሪያ ሁለት መስመሮች እንዳሉ ያቆዩ፣ እና ካርዱ የተማሩትን ይጠብቃል።\n- ማስቀመጥ የዴኩን ካርዶች ይጽፋል። በፋይሉ ውስጥ የነበረ እና ካርድ ያልሆነ (ፊት የሌለው መስመር) አይቆይም፤ እዚያ የነበረው ፋይል ወደ _name.bak.tsv ይገለበጣል።\n- ፋይሉን እንደ CSV UTF-8 ያስቀምጡ (UTF-16 አይደለም፣ የተመን ሉህ የራሱ ቅርጸት አይደለም)። ከ4 MiB ወይም ከ20,000 መስመሮች በላይ የሆነ ፋይል አይነበብም፦ ይከፋፍሉት።\n- በፋይሉ ውስጥ የሰረዙት መስመር ለዚያ ዴክ «የጎደሉ ካርዶችን አስወግድ» ን ካላበሩ በቀር በዴኩ ውስጥ ያለውን ካርድ አይሰርዝም። ከዚያ ካርዱ ከተማሩት ጋር ይሄዳል።\n- ስማቸው በ _ የሚጀምር ፋይሎች አይነበቡም።\n"
