diagnostics.plugin.how = "ምርመራ መሣሪያን ለመፈተሽ የሙከራ ማያ ገጽ ነው፦ ፓነሉ ሊያሳይ የሚችለውን እያንዳንዱን የግራጫ ደረጃ፣ አዝራሮችን እና ንክኪን ለመሞከር አራት ሳጥኖች፣ እና የማደስ ሁነታዎችን ለማወዳደር የገጽ ቆጣሪ ከሂደት አሞሌ ጋር ያሳያል።\n\nየሙከራ ማያ ገጹ የምናሌ ግቤት የለውም። ሌላ ተሰኪ እስካላቀረበ ድረስ ብቻ የመነሻ ማያ ገጽ ነው፤ ወይም በተሰኪ አስተዳዳሪ ውስጥ ለ«መነሻ ማያ ገጽ» ቦታ በ«ማያ ገጾች» ስር ሲመርጡት።\n\nምረጥ የተመረጠውን ሳጥን ያመለክታል፣ የቀስት አዝራሮች በሳጥኖቹ መካከል ይንቀሳቀሳሉ፤ በንክኪ ሳጥን ይንኩ። የገጽ አዝራሮች የሙከራ ገጾቹን ይገለብጣሉ። እንደገና ለመጀመር ምረጥን ይያዙ፣ ወይም ጣት በማያ ገጹ ላይ ይያዙ።\n\nPaperPaw የመሣሪያው ፈርምዌር በሆነበት ቦታ በመሣሪያዎች ስር ያለው የመሣሪያ ፍተሻ የመሣሪያውን እያንዳንዱን ክፍል አንድ ገጽ በአንድ ጊዜ ያልፋል፦ ማያ ገጽ፣ አዝራሮች፣ ንክኪ፣ የፊት መብራት፣ ባትሪ፣ ካርድ፣ ሰዓት፣ Wi-Fi፣ እንቅልፍ እና ማህደረ ትውስታ። እያንዳንዱ ገጽ በ«አልተሳካም»፣ «ዝለል» እና «ተሳክቷል» ያበቃል፤ መለኪያዎቹ የሚጠቁሙት መልስ ቀድሞ ተመርጦ ይቀርባል፤ መሣሪያው የሌለው ክፍል ይዘለላል። ከእያንዳንዱ መልስ በኋላ ወደ pull request ለመለጠፍ ሪፖርት ወደ .paperpaw/plugins/diagnostics/device-check.txt ይጽፋል። ተመለስ ይወጣል፤ እንደገና ሲከፈት ከነበረበት ይቀጥላል። በአዝራሮች ብቻ ባለ መሣሪያ ላይ መጀመሪያ በአዝራሮች ገጽ ላይ «ጀምር» ን ይምረጡ፤ እስከዚያ ድረስ ቀስቶች፣ ምረጥ እና ተመለስ በእያንዳንዱ ገጽ እንደሚሠሩ ይሠራሉ።"
