joplin.password = የይለፍ ቃል
joplin.password.help = በዚህ መሣሪያ ላይ ከሌሎቹ የይለፍ ቃሎች እና ቁልፎች ጋር ይቀመጣል። ለ Nextcloud የመተግበሪያ የይለፍ ቃልም ይሠራል።
joplin.secret = የ Joplin የይለፍ ቃል
joplin.not-kept = የይለፍ ቃሉ በዚህ መሣሪያ ላይ ሊቀመጥ አልቻለም።
joplin.notebook = ደብተር
joplin.notebook.help = PaperPaw በ Joplin ውስጥ የሚሠራው ደብተር፣ ለእያንዳንዱ መጽሐፍ ማስታወሻ ያለው። እንደገና መላክ ማስታወሻውን ያዘምናል፣ ወደ ሌላ ደብተር የተዛወረውንም።
joplin.idle = የተላኩ ማስታወሻዎች ወዲያው ወደ Joplin ይላካሉ።
joplin.waiting.one = የ{count} መጽሐፍ ማስታወሻዎች ለመላክ እየጠበቁ ናቸው።
joplin.waiting.other = የ{count} መጻሕፍት ማስታወሻዎች ለመላክ እየጠበቁ ናቸው።
joplin.sent.one = የ{count} መጽሐፍ ማስታወሻዎች በ Joplin ውስጥ ናቸው።
joplin.sent.other = የ{count} መጻሕፍት ማስታወሻዎች በ Joplin ውስጥ ናቸው።
joplin.some-failed = ወደ Joplin ተልኳል፦ {sent}። አልተላከም፦ {failed}፤ በኋላ እንደገና ይላካሉ።
joplin.apart.one = {count} ማስታወሻ በ Joplin ውስጥ ተለውጧል፤ ስለዚህ አዲስ ከጎኑ ተሠርቷል።
joplin.apart.other = {count} ማስታወሻዎች በ Joplin ውስጥ ተለውጠዋል፤ ስለዚህ አዳዲሶች ከጎናቸው ተሠርተዋል።
joplin.nothing = ወደ Joplin ለመላክ የሚጠብቁ ማስታወሻዎች የሉም።
joplin.no-network = ወደ Joplin መላክ አውታረ መረብ ይፈልጋል። ማስታወሻዎቹ ይጠብቃሉ እና በኋላ ይላካሉ።
joplin.setup-needed = መጀመሪያ Joplin ን ያዘጋጁ፦ የሚመሳሰልበትን ቦታ፣ መለያዎን እና የይለፍ ቃልዎን።
joplin.no-time = ሰዓቱ ገና አይታወቅም። ማስታወሻዎቹ ይጠብቃሉ እና በኋላ ይላካሉ።
joplin.unreachable = Joplin ሊደረስበት አይችልም። ማስታወሻዎቹ ይጠብቃሉ እና በኋላ ይላካሉ።
joplin.failed = Joplin በስህተት መልሷል ({status})። ማስታወሻዎቹ ይጠብቃሉ እና በኋላ ይላካሉ።
joplin.bad-login = Joplin ኢሜይሉን፣ የተጠቃሚ ስሙን ወይም የይለፍ ቃሉን አልተቀበለም። በ Joplin ዝግጅት ውስጥ ያረጋግጧቸው።
joplin.no-server = በዚህ አድራሻ Joplin Server የለም። በ Joplin ዝግጅት ውስጥ ያረጋግጡት።
joplin.bad-address = አድራሻው PaperPaw ሊጠቀምበት የሚችል አይደለም። በ Joplin ዝግጅት ውስጥ ያረጋግጡት።
joplin.no-data = በዚህ አድራሻ ምንም የ Joplin ማስታወሻዎች የሉም። ያረጋግጡት፣ ወይም መጀመሪያ Joplin ን ከእሱ ጋር ያመሳስሉት።
joplin.encrypted = የ Joplin ከጫፍ እስከ ጫፍ ምስጠራ በርቷል። PaperPaw ማስታወሻዎችን መመስጠር አይችልም፤ ስለዚህ ምንም አይልክም።
joplin.newer-target = Joplin እዚያ ያሉትን ማስታወሻዎች ይህ PaperPaw ከሚያውቀው አዲስ ቅርጸት ይይዛቸዋል። ለመላክ PaperPaw ን ያዘምኑ።
joplin.older-target = Joplin እዚያ ያሉትን ማስታወሻዎች በአሮጌ ቅርጸት ይይዛቸዋል። ለማሻሻል Joplin ን ይክፈቱ፤ ከዚያ እንደገና ይላኩ።
joplin.upgrading = Joplin እዚያ ያሉትን ማስታወሻዎች አሁን እያሻሻለ ነው። ይጠብቃሉ እና በኋላ ይላካሉ።
joplin.no-memory = ማስታወሻዎቹን ለመላክ በቂ ማህደረ ትውስታ የለም። እንደገና ያስጀምሩና ይሞክሩ።
keyboard.plugin.name = ኪቦርድ
keyboard.plugin.description = ጽሑፍን በማያ ገጹ ላይ፣ በንክኪ ወይም በአዝራሮች ያስገባል።
keyboard.plugin.how = "ኪቦርዱ አንድ ነገር ጽሑፍ በሚፈልግ ጊዜ ሁሉ ይከፈታል፦ ፍለጋ፣ የይለፍ ቃል፣ ማስታወሻ ወይም ቅንብር። በንክኪ እና በአዝራሮች ብቻ ይሠራል።\n\nበአዝራሮች ግራ እና ቀኝ በረድፍ ላይ ይንቀሳቀሳሉ፣ የገጽ አዝራሮች በረድፎች መካከል ይንቀሳቀሳሉ፣ ምረጥ ቁልፍ ይጫናል፣ ተመለስ ይሰርዛል፤ ግራ እና ቀኝ በረድፍ ዙሪያ ይሄዳሉ፣ ወደ ላይ እና ወደ ታች ደግሞ በአምድዎ ላይ ይቆያሉ። Shift ቀጣዩን ፊደል አቢይ ያደርጋል፤ ለሁሉም አቢይ ሁለት ጊዜ ይጫኑት፣ ለማቆም አንድ ጊዜ እንደገና። ለአቢይ ፊደሉ፣ ወዲያው ለሚመረጥ፣ እና እንደ é እና è ላሉ ዘዬዎች ፊደልን ይያዙ (በአዝራሮች በእሱ ላይ ምረጥን ይያዙ)፤ በጀርመንኛ ä፣ ö፣ ü እና ß ከ a፣ o፣ u እና s እንዲህ ይመጣሉ (በአዝራሮች ኪቦርዱ በእነዚያ ፊደላት ላይ ይነግራል)። «እሺ» ያጠናቅቃል፤ በአዝራሮች ከየትም ለማጠናቀቅ ተመለስን ይያዙ (ተመለስ ብቻውን ይሰርዛል)፣ ወይም ፊደል ባልሆነ ቁልፍ ላይ ምረጥን ይያዙ። «ለጥፍ» የቅንጥብ ሰሌዳውን ጽሑፍ ያስገባል፣ «ስልክ» ደግሞ በሚቀርብበት ቦታ በምትኩ በስልክዎ እንዲጽፉ ያስችልዎታል።\n\nበቅንብሮች ውስጥ በመሣሪያ፣ ኪቦርድ ስር፦ «የኪቦርድ አቀማመጦች» አቀማመጦቹን ይመርጣል። በነባሪ የምናሌውን ቋንቋ ይከተላል፤ ከብዙ ጋር ቁልፍ በመካከላቸው ይቀያይራል። «የኡምላውት ቁልፎች» በምትኩ ለ ä፣ ö፣ ü እና ß የራሳቸው ቁልፎች ይሰጣል። «መጠን» ቁልፎችን እና ፊደላትን ትልቅ ያደርጋል፤ በአዝራሮች ብቻ ረድፎቹ የኮምፒውተር ኪቦርድ ረድፎች ሆነው ይቆያሉ። በንክኪ ማያ ገጾች ላይ «የቁልፍ ቅርጽ» ቁልፎቹ የሚመስሉበትን መንገድ ይለውጣል። «ራስ-ሰር አቢይ ፊደላት» እያንዳንዱን ዓረፍተ ነገር በአቢይ ፊደል ይጀምራል።"
