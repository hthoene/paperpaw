translate.plugin.description = የተመረጠ ጽሑፍን በመስመር ላይ በ DeepL ይተረጉማል።
translate.plugin.how = "ትርጉም የተመረጠ ጽሑፍን በመስመር ላይ በ DeepL ይተረጉማል። በመጽሐፍ ውስጥ ጽሑፍ ይምረጡ እና በተመረጠው ጽሑፍ ምናሌ ውስጥ «ተርጉም» ን ይምረጡ፦ ትርጉሙ እንደ መዝገበ ቃላት ግቤት ከገጹ በላይ ይታያል። የገጽ አዝራሮች ወይም መንካቶች ያሸብልሉታል፣ ምረጥ ወይም በመጨረሻው መንካት ይዘጋዋል።\n\nአውታረ መረብ እና በ deepl.com በነጻ የሚገኝ የራስዎ የ DeepL API ቁልፍ ያስፈልገዋል (DeepL API Free፣ በወር ወደ 500,000 ቁምፊዎች)። እስኪያስገቡት ድረስ ፓነሉ ይናገራል፣ መንካትም ይጠይቃል።\n\nበቅንብሮች ውስጥ በንባብ ስር በ«ትርጉም» ክፍል ውስጥ «ወደ ተርጉም» ቋንቋውን ያቀናብራል፤ መጀመሪያ ላይ የ PaperPaw የራሱ ነው።"
