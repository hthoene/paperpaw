format-cbz.plugin.name = ኮሚክ መጻሕፍት
format-cbz.plugin.description = የኮሚክ መጽሐፍ ማህደሮችን (.cbz) ይከፍታል፤ በአንድ ገጽ አንድ ሥዕል።
format-cbz.plugin.how = "የኮሚክ መጽሐፍ ማህደሮችን (.cbz) ይከፍታል፦ በአንድ ገጽ አንድ ሥዕል፣ ከማያ ገጹ ጋር የተስማማ፣ በስሞቻቸው ቅደም ተከተል (2 ከ10 በፊት)።\n\nወደ ቤተ-መጻሕፍት አቃፊ ያስቀምጧቸው እና ከቤተ-መጻሕፍቱ ይክፈቷቸው፤ ገጾቹን እንደ ማንኛውም መጽሐፍ ይገለብጡ። ትልልቅ ሥዕሎች በመጀመሪያ ጊዜ ትንሽ ይወስዳሉ፣ በ X4 ላይ ከሌሎች በላይ።\n\nየንባብ ቅንብሮች (ቅንብሮች፣ ንባብ)፦ «ፓነል በፓነል» ከገጽ አንድ ፓነል በአንድ ጊዜ ማያ ገጹ በሚፈቅደው መጠን ትልቅ አድርጎ ያሳያል፣ የገጽ መገልበጦችም በእነሱ ውስጥ ያልፋሉ፤ ፓነሎች የሌሉት ገጽ ሙሉ ሆኖ ይታያል። «የኮሚክ ገጾች አቅጣጫ» ለማንጋ የገጽ መገልበጦችን ያንጸባርቃል (ከቀኝ ወደ ግራ)፤ የመጽሐፉ የራሱ ComicInfo.xml በራሱ ይናገራል። ቤተ-መጻሕፍቱ የመጽሐፉን ርዕስ እና ተከታታዩን እና ቁጥሩን ከ ComicInfo.xml ያሳያል።"
