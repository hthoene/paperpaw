format-docx.plugin.name = DOCX ሰነዶች
format-docx.plugin.description = በ Word እና በሌሎች ፕሮግራሞች የተቀመጡ .docx ፋይሎችን ይከፍታል።
format-docx.plugin.how = "የ .docx ሰነዶችን እንደ መጻሕፍት ይከፍታል፦ ርዕሶች ከይዘት ማውጫ ጋር፣ ዝርዝሮች፣ ሰንጠረዦች፣ ደማቅ እና ተጋድሞ የተጻፈ ጽሑፍ፣ አገናኞች እና ሥዕሎች (JPEG፣ PNG፣ GIF)።\n\nፋይሎቹን ወደ ቤተ-መጻሕፍት አቃፊ ያስቀምጡ እና ከቤተ-መጻሕፍቱ ይክፈቷቸው። ርዕሱ እና ደራሲው ከሰነዱ ባህሪያት ይመጣሉ። የግርጌ ማስታወሻዎች፣ ራስጌዎች እና ግርጌዎች፣ እና አስተያየቶች አይታዩም።"
format-docx.title = DOCX ሰነድ
format-epub.plugin.name = EPUB
format-epub.plugin.description = የ EPUB መጻሕፍትን ከቅጥዎቻቸው፣ ከይዘት ማውጫቸው እና ከሥዕሎቻቸው ጋር ይከፍታል።
format-epub.plugin.how = "የ EPUB መጻሕፍት ከቤተ-መጻሕፍቱ እንደ ማንኛውም ሌላ መጽሐፍ ይከፈታሉ፣ ከይዘት ማውጫቸው፣ ሥዕሎቻቸው እና ከአሳታሚው ቅጥ ጋር። ድረ ገጾች (HTML)፣ Markdown፣ FictionBook (.fb2) እና የኮሚክ መጽሐፍ ማህደሮች (.cbz) በተመሳሳይ መንገድ ይከፈታሉ፤ እያንዳንዳቸው የራሱ ተሰኪ ሆኖ።\n\nምዕራፍ ለመጀመሪያ ጊዜ ሲከፍቱት ይለወጣል እና በተሰኪው መሸጎጫ ውስጥ ይቀመጣል፤ ስለዚህ ከዚያ በኋላ ፈጣን ነው፣ ትልልቅ መጻሕፍትም በትናንሽ መሣሪያዎች ላይ ይሠራሉ። የይዘት ማውጫውን በንባብ ምናሌ ውስጥ በ«ይዘት» ስር ያገኙታል። የመጽሐፉ የራሱ ቅጥ ይተገበር እንደሆነ በንባብ ስር ያለው «የአሳታሚ ቅርጸት» ቅንብር ነው።"
format-epub.title = EPUB ኢ-መጽሐፍ
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = የ FictionBook መጻሕፍትን (.fb2፣ የተጨመቁትንም) ይከፍታል።
format-fb2.plugin.how = "ለሩሲያኛ እና ለሌሎች መጻሕፍት የተለመዱ የ FictionBook መጻሕፍትን (.fb2)፣ የተጨመቁትንም (.fb2.zip)፣ ከርዕሳቸው፣ ደራሲዎቻቸው፣ ሽፋናቸው እና ምዕራፎቻቸው ጋር ይከፍታል።\n\nወደ ቤተ-መጻሕፍት አቃፊ ያስቀምጧቸው፤ በቤተ-መጻሕፍቱ ውስጥ ይታያሉ እና እንደ ማንኛውም ሌላ መጽሐፍ ይከፈታሉ።"
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = እንደ ፋይል የተቀመጡ ድረ ገጾችን ይከፍታል፤ የሚነበበውን ብቻ ያሳያል።
format-html.plugin.how = "እንደ ፋይል የተቀመጡ ድረ ገጾችን (.html፣ .htm፣ .xhtml) እንደ መጻሕፍት ይከፍታል፦ የሚነበበው ብቻ፣ በዙሪያው ያሉ ምናሌዎች፣ ማስታወቂያዎች እና የመሳሰሉት ሳይኖሩ።\n\nፋይሉን ወደ ቤተ-መጻሕፍት አቃፊ ያስቀምጡ እና ከቤተ-መጻሕፍቱ እንደ ማንኛውም መጽሐፍ ይክፈቱት። በገጹ ውስጥ ያሉ አገናኞች ይሠራሉ፤ ሥዕሎች በፋይሉ ውስጥ ባሉበት ቦታ ይታያሉ።"
