update.plugin.name = ዝማኔ
update.plugin.description = የፈርምዌር ዝማኔዎችን ከካርዱ ወይም ከበይነመረብ ወርዶ ይጭናል።
update.plugin.how = "«ዝማኔ» PaperPaw ፈርምዌሩ በሆነባቸው መሣሪያዎች፣ እንደ X4፣ አዲስ ፈርምዌር ይጭናል። በቅንብሮች ውስጥ እንደ «ዝማኔ» ያገኙታል።\n\n«በመስመር ላይ ፈልግ» አዲስ PaperPaw ከዝማኔ አገልጋዩ ይጠይቃል እና ያወርደዋል፤ ይህ በ Wi-Fi ጥቂት ደቂቃዎችን ይወስዳል። ወይም የዝማኔ ፋይል (በ .bin የሚያልቅ፣ ከ paperpaw.org) በካርዱ ላይ ወዳለው updates አቃፊ ይቅዱ፣ ለምሳሌ በ Wi-Fi ማስተላለፍ። ከዚያ «ጫን» ወደ አንድ ደቂቃ ይወስዳል እና መሣሪያው እንደገና ይጀምራል፤ መጻሕፍት፣ ቅንብሮች እና የንባብ ቦታዎች ይቆያሉ።\n\nበ«ዝማኔዎችን ፈልግ» (በቅንብሮች ውስጥ፣ መጀመሪያ ላይ ጠፍቷል) መሣሪያው በሳምንት አንድ ጊዜ ያህል በራሱ ይጠይቃል፣ Wi-Fi ለማንኛውም ሲበራ ወይም ሲሞላ ብቻ። ያገኘው አዲስ PaperPaw እዚህ ይጠብቃል፤ ምንም ንባብዎን አያቋርጥም። ፍለጋ መሣሪያው የሚያስኬደውን ይልካል፤ የመሣሪያው ስም ወይም ቁጥር አይደለም፤ መሣሪያዎችን ለመቁጠር ደግሞ እርስዎ እንደጠየቁ እና የቀኑ፣ የሳምንቱ ወይም የወሩ የመጀመሪያ ፍለጋው መሆኑንም።\n\nየሚጠቀሟቸው ተሰኪዎች ለአዲሱ ልቀት ገና ስሪት ከሌላቸው ዝማኔው ይጠብቃቸዋል። የቆየ ስሪት የሚጫነው ከመረጡት ብቻ ነው።\n\nእንደ CrossPoint ያለ ሌላ ፈርምዌርም ከዚህ ይጫናል፦ ፋይሉን (በ .bin የሚያልቅ) ወደ updates አቃፊ ያስቀምጡ፣ እና «ዝማኔ» ን ይክፈቱ። PaperPaw ለዚህ መሣሪያ ሙሉ፣ ያልተጎዳ ፈርምዌር መሆኑን ይፈትሻል፤ ነገር ግን ስላልተፈረመ ማን እንደሠራው መናገር አይችልም። «ለማንኛውም ጫን» ወደ ሌላኛው የፍላሽ ግማሽ ይጽፈዋል፣ መሣሪያውም ይጀምረዋል፤ PaperPaw ያ ፈርምዌር በላዩ ላይ አንድ ነገር እስኪጭን ድረስ በግማሹ ይቆያል። በኋላ ወደ PaperPaw ለመመለስ የመጫኛ ፋይሉን (paperpaw-<device>-<version>-install.bin) ከሌላው ፈርምዌር ምናሌ፣ እንደ CrossPoint የ SD ፈርምዌር ዝማኔ ይጫኑ።"
