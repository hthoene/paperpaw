weather.plugin.name = የአየር ሁኔታ
weather.plugin.description = የአሁኑ የአየር ሁኔታ እና የሚቀጥሉት ቀናት እንደ ዊጀቶች፣ ከ Open-Meteo።
weather.plugin.how = "የአየር ሁኔታ የአሁኑን የአየር ሁኔታ እና የሚቀጥሉትን ቀናት ከ Open-Meteo እንደ መነሻ ማያ ገጽ ዊጀቶች ያሳያል፤ ይህም መለያ ወይም ቁልፍ አያስፈልገውም። «የአሁኑ የአየር ሁኔታ» የሙቀት መጠኑን፣ ሁኔታውን እና ለመምረጥ ተጨማሪ ያሳያል፤ «ትንበያ» የሚቀጥሉትን ቀናት በረድፍ ወይም በዝርዝር ያሳያል።\n\nመጀመሪያ ቦታ ይምረጡ፦ በቅንብሮች ውስጥ በ«የአየር ሁኔታ» ስር «ቦታ» (ስም ይጻፉ፤ ከዚያ ከተገኙት ቦታዎች ይምረጡ)። መጋጠሚያዎቹ ብቻ ይላካሉ፣ እና የአየር ሁኔታ ዊጀት በሚታይበት ጊዜ ብቻ። ዊጀቶቹን መነሻ ማያ ገጹን በማርትዕ ይጨምሩ።\n\nየአየር ሁኔታው የሚመጣው «ቢበዛ በየ… አዘምን» ከሚለው በላይ ባልበዛ ተደጋጋሚነት ነው፣ እና አውታረ መረብ ባለበት ብቻ፦ Wi-Fi ን በራሱ ፈጽሞ አያበራም።\n\nየአየር ሁኔታ መረጃ በ Open-Meteo.com (https://open-meteo.com)፣ በ Creative Commons Attribution 4.0 ፈቃድ (CC BY 4.0)።"
