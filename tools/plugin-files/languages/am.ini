aids.plugin.name = የንባብ ረዳቶች
aids.plugin.description = ደማቅ የቃል መጀመሪያዎች፣ የተተኩ ቃላት፣ ሥዕሎች፦ ጽሑፍ እንደፈለጉት።
aids.plugin.how = "የንባብ ረዳቶች በሚያነቡበት ጊዜ የመጽሐፍ ጽሑፍ የሚመስልበትን መንገድ ይቀይራሉ። ለእያንዳንዱ መጽሐፍ ይሠራሉ። ደማቅ የቃል መጀመሪያዎች እና ቃላትን ተካ መጀመሪያ ላይ ጠፍተዋል።\n\nበቅንብሮች ውስጥ በንባብ ስር፣ በ«የንባብ ረዳቶች» ክፍል ያገኟቸዋል። ደማቅ የቃል መጀመሪያዎች የእያንዳንዱን ቃል የመጀመሪያ አጋማሽ ደማቅ ያደርጋል፤ ይህም ለአንዳንዶች ለመከተል ቀላል ነው። ቃላትን ተካ በሴሚኮሎን የተለዩ እንደ «ቀለም = ሕብር; ዶ/ር = ዶክተር» ያሉ ጥንዶችን ይቀበላል።\n\nየሚተኩት ሙሉ ቃላት ብቻ ናቸው፣ ልክ እንደጻፉት፤ ስለዚህ «ቀለም» የረጅም ቃልን ክፍል ፈጽሞ አይቀይርም። የመጽሐፉ ፋይል ራሱ አይለወጥም።\n\nበመጻሕፍት ውስጥ ያሉ ሥዕሎች ሊታዩ (እንደ መጀመሪያው)፣ የሥዕሉን መግለጫ በሚጠቀም እንደ «[ሥዕል፦ በባሕር ላይ ያለ መርከብ]» ባለ አጭር መስመር ሊተኩ፣ ወይም ሊቀሩ ይችላሉ። ያኔ አንድ ገጽ ለጽሑፍ ተጨማሪ ቦታ ይኖረዋል፤ ለማይታይ ሥዕልም ምንም አይፈታም፤ ይህም ገጾች በፍጥነት እንዲገለበጡ ያደርጋል። ኮሚክሶች እና ከሥዕሎች የተሠሩ ሌሎች መጻሕፍት አይለወጡም።"
