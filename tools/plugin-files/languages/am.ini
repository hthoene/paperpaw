lock.plugin.name = የማያ ገጽ መቆለፊያ
lock.plugin.description = መሣሪያው ሲነቃ ፒን፣ ጥለት ወይም የይለፍ ቃል፤ በሚያነቡበት ጊዜ ንክኪ ተቆልፏል።
lock.plugin.how = "የማያ ገጽ መቆለፊያ PaperPaw ሲጀምር እና መሣሪያው ሲነቃ ፒን፣ ጥለት ወይም የይለፍ ቃል ይጠይቃል። መጀመሪያ ላይ ጠፍቷል። ተራ አጠቃቀምን ብቻ ይከላከላል፦ ኮዱ እና የተሳሳቱ ሙከራዎች ቆጠራ በ SD ካርዱ ላይ ይቀመጣሉ፤ ስለዚህ ካርዱን የሚያወጣ፣ የሚያርም ወይም የሚለውጥ ሰው መቆለፊያውን ያልፋል።\n\nበቅንብሮች ውስጥ በመሣሪያ፣ የማያ ገጽ መቆለፊያ ስር ያቀናብሩት፦ ካለ አሁን ያለውን ኮድ ያስገቡ፣ ዓይነቱን ይምረጡ፤ ከዚያ አዲሱን ኮድ ሁለት ጊዜ። ጥለት በንክኪ ማያ ገጾች ላይ ብቻ ይቀርባል።\n\nከአምስት የተሳሳቱ ሙከራዎች በኋላ ቀጣዩ ግማሽ ደቂቃ ይጠብቃል። «አሁን ቆልፍ» ወዲያው ይቆልፋል እና በአዝራር፣ በእጅ ምልክት ወይም በደንብ ላይ ሊቀመጥ ይችላል። «ከመንቃት በኋላ ቆልፍ» ሊጠፋ ይችላል፤ ስለዚህ እውነተኛ ጅምር (ማብራት ወይም እንደገና ማስጀመር) ብቻ ይቆልፋል፣ እያንዳንዱ መንቃት ጅምር ከሆነበት በቀር፣ ለምሳሌ በባትሪ ላይ እንዳለ X4።\n\nየንክኪ መቆለፊያ፣ ከእሱ አጠገብ፦ በፈጣን ፓነል እና በንባብ ምናሌ ውስጥ «ንክኪ ቆልፍ» አዝራሮቹ አሁንም እየሠሩ መንካቶችን፣ መጥረጎችን እና እስክሪብቶውን ምንም እንዳያደርጉ ያደርጋል፣ ለምሳሌ እጅ በማያ ገጹ ላይ ሆኖ ለማንበብ። ለመክፈት በአንድ ጣት ሁለት ጊዜ ይንኩ እና ለአፍታ ይያዙ፤ የኃይል አዝራሩን መያዝ የኃይል ምናሌውን ይከፍታል፣ በዚያ «ንክኪ ክፈት» በአዝራሮች ይከፍታል፤ በ X4 Pro ላይ የመነሻ ቁልፉን መያዝ ወዲያው ይከፍታል።"
