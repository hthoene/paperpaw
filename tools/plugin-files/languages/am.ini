keys.plugin.name = አዝራሮች እና የእጅ ምልክቶች
keys.plugin.description = እያንዳንዱ አዝራር፣ የመንካት ክልል እና መጥረግ የሚያደርገው፣ በመሣሪያው ላይ የሚቀየር።
keys.plugin.how = "«አዝራሮች እና የእጅ ምልክቶች» እያንዳንዱ አዝራር፣ የመንካት ክልል እና መጥረግ የሚያደርገውን ያሳያል፤ በመሣሪያው ላይ እንዲቀይሩትም ያስችልዎታል።\n\nበቅንብሮች ውስጥ በመሣሪያ ስር ይክፈቱት። መጀመሪያ ለውጡ የት እንደሚሠራ ይምረጡ፦ በሁሉም ቦታ፣ በሚያነቡበት ጊዜ፣ በመነሻ ማያ ገጽ፣ በቤተ-መጻሕፍት ውስጥ ወይም በአንድ መሣሪያ ውስጥ። ከዚያ እንደ የተያዘ አዝራር ወይም ከጠርዝ ወደ ውስጥ መጥረግ ያለ ግቤት ይምረጡ፣ እና ከዝርዝሩ ድርጊት ይምረጡ፤ ዝርዝሩን መፈለግ ይችላሉ። «እንደ መደበኛ» ተሰኪዎቹ እና የአዝራር አቀማመጡ ያቀናበሩትን ይመልሳል።\n\nበ X4 ላይ ለመምረጥ፣ ወደ ኋላ ለመመለስ ወይም ለመቀጠል ምንም አዝራር የማይተው ለውጥ ውድቅ ይደረጋል። መጨረሻ ላይ «አዝራሮችን እና የእጅ ምልክቶችን ዳግም አስጀምር» እያንዳንዱን ለውጥ ይመልሳል።"
