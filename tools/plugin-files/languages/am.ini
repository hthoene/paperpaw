files.plugin.name = የፋይል አሳሽ
files.plugin.description = በመሣሪያው ላይ ያሉ መጻሕፍትን እና አቃፊዎችን ይዘረዝራል እና ይከፍታቸዋል።
files.plugin.how = "ቤተ-መጻሕፍቱ በቤተ-መጻሕፍት አቃፊዎ ውስጥ ያሉ መጻሕፍትን ይዘረዝራል፤ እያንዳንዳቸው ከሽፋናቸው፣ ርዕሳቸው፣ ደራሲያቸው እና ምን ያህል እንዳነበቡ ጋር። ለመጨረሻ ጊዜ ያነበቡት መጽሐፍ እንደ ካርድ ከላይ ይቆማል፤ ስለዚህ ማንበብን መቀጠል አንድ መንካት ወይም አንድ ምረጥ መጫን ይወስዳል። ቤተ-መጻሕፍቱ መጻሕፍትን እየፈለገ ሳለ እስካሁን ምን ያህል እንዳገኘ ይናገራል።\n\nከመጻሕፍቱ በላይ የሚታየውን ይምረጡ፦ ሁሉንም፣ የሚያነቡትን፣ ያልተነበቡ ወይም የተጠናቀቁትን፣ ወይም መደርደሪያዎቹን (በደራሲ፣ ተከታታይ፣ መሰየሚያ፣ ተወዳጆች፣ ከጀመሩት ተከታታይ ሁሉ ቀጣዩ መጽሐፍ)። ለማንበብ መጽሐፍን ይንኩ፤ ለመክፈት፣ እንደ ተጠናቀቀ ወይም ያልተነበበ ምልክት ለማድረግ፣ መረጃውን ለማየት፣ ወደ ማህደር ለማንቀሳቀስ ወይም ለመሰረዝ ይያዙት (በአዝራሮች ምረጥን ይያዙ)። ለቤተ-መጻሕፍት ምናሌ ርዕሱን ይንኩ፦ መጻሕፍት እንዴት እንደሚደረደሩ እና እንደሚታዩ፣ ፍለጋ፣ የቤተ-መጻሕፍት አቃፊ እና ቅንብሮች።\n\nየቤተ-መጻሕፍት አቃፊ በቅንብሮች ውስጥ በቤተ-መጻሕፍት ስር እንደ «የቤተ-መጻሕፍት አቃፊ» ይቀናበራል፤ እዚያም መጻሕፍትን እንደ የሽፋኖች ፍርግርግ ማሳየት ይችላሉ። ለማንኛውም ሌላ ፋይል በመሣሪያዎች ምናሌ ውስጥ «ፋይሎች» ን ይጠቀሙ።"
