widgets.plugin.description = ለመነሻ ማያ ገጽ ብዙ ተጨማሪ ዊጀቶች፦ ሰዓቶች፣ የቀን መቁጠሪያ፣ ጥቅሶች፣ መጻሕፍት፣ ማስታወሻዎች እና ሌሎችም።
widgets.plugin.how = "የዊጀት ጥቅል ለመነሻ ማያ ገጽ ብዙ ዊጀቶችን ይጨምራል፦ ሰዓቶች (የእጅ፣ የቃላት፣ የሰቆች፣ የዓለም)፣ የቀን መቁጠሪያ፣ እስካሁን ያለው ዓመት፣ ቆጠራ፣ የጨረቃ ምዕራፍ፣ እና ቀን እና ዕለት፤ የቀኑ ጥቅስ፣ ማስታወሻዎች፣ የሚደረጉ፣ ሥዕሎች፣ ሰላምታ እና የ PaperPaw አርማ፤ እና ለመጻሕፍት፣ አሁን በማንበብ ላይ፣ ሂደት፣ ቀጣይ፣ ተከታታይ፣ ተወዳጆች፣ ማድመቂያ እና ቤተ-መጻሕፍቱ በቁጥሮች። የባትሪ ዊጀትም በውስጡ አለ።\n\nበምናሌው ውስጥ በ«መነሻ ማያ ገጽ አርትዕ» (ወይም በመነሻ ማያ ገጹ ላይ ረጅም መጫን) ይጨምሯቸው፤ ከዚያ «ዊጀት ጨምር»። እያንዳንዱ የራሱ ቅንብሮች አሉት፣ እንደ ክፈፍ፣ መጠን እና አሰላለፍ። እንደ የቀኑ ጥቅስ ያለ የሚቀየር ዊጀት መምረጥ ቀጣዩን ያሳያል። የራስዎ ጥቅሶች በካርዱ ላይ በ.paperpaw/plugins/widgets ውስጥ ወደ quotes.txt ይገባሉ፣ እያንዳንዱ መስመር እንደ ጽሑፍ | ደራሲ። የሰዓት ዊጀቶች ሰዓቱ እንዲቀናበር ይፈልጋሉ፤ Wi-Fi ያቀናብረዋል።"
