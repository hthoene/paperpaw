opds.plugin.description = የ OPDS ካታሎጎችን ያስሳል፣ መጻሕፍታቸውን ያወርዳል እና አቃፊዎችን ከእነሱ ጋር ያመሳስላል።
opds.plugin.how = "የ OPDS ካታሎጎች እንደ Project Gutenberg፣ Calibre-Web፣ Kavita ወይም Komga ያሉ የመስመር ላይ ቤተ-መጻሕፍት ናቸው። ይህ ተሰኪ እንደ አቃፊዎች ያስሳቸዋል እና ይፈልጋቸዋል፤ መጻሕፍታቸውንም ወደ ቤተ-መጻሕፍቱ ያወርዳል።\n\nካታሎጎችን ከመሣሪያዎች ምናሌ ይክፈቱ እና «ካታሎግ ጨምር» ን ይምረጡ፦ አድራሻ፣ እና ካታሎጉ መለያ ከፈለገ የተጠቃሚ ስም እና የይለፍ ቃል። ለማሰስ ካታሎግን ይንኩ፤ ለማመሳሰል፣ ለማርትዕ ወይም ለማስወገድ ይያዙት (በአዝራሮች ምረጥን ይያዙ)።\n\n«ይህን ካታሎግ አመሳስል» ሲበራ «ካታሎጎችን አመሳስል» አዳዲስ መጻሕፍቱን ወደ አቃፊው ያወርዳል። «መጻሕፍት በማመሳሰል» አንድ ማመሳሰል ስንት እንደሚያመጣ ይገድባል፤ ስለዚህ ትልቅ ካታሎግ መሣሪያውን አይሞላም። «የደመና አቃፊ (WebDAV)» ከካታሎግ ይልቅ ይሠራል።"
