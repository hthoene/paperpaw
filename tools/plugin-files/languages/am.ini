profiles.plugin.name = የንባብ መገለጫዎች
profiles.plugin.description = በአንድ መንካት የሚቀያየሩ የንባብ እና የማሳያ ቅንብሮች ስሞች ያሏቸው ስብስቦች።
profiles.plugin.how = "መገለጫ የንባብ ቅንብሮችዎን፣ የማሳያ ቅንብሮችዎን እና የሁኔታ መስመሮችዎን፣ እንደ «ሌሊት» ወይም «ትልቅ ህትመት» ባለ ስም ያቆያል፣ እና በአንድ መንካት ይመልሳቸዋል።\n\nመገለጫዎችን በንባብ ምናሌ ውስጥ በ«ተጨማሪ» ስር፣ ወይም በቅንብሮች ውስጥ በ«ማበጀት» ስር ይክፈቱ። ለመጠቀም መገለጫን ይንኩ፤ ጥቅም ላይ ያለው ምልክት ተደርጎበታል። የአሁኑን ቅንብሮች ወደ እሱ ለማስቀመጥ፣ ስሙን ለመቀየር ወይም ለማስወገድ ይያዙት (በአዝራሮች ምረጥን ይያዙ)። «እንደ አዲስ መገለጫ አስቀምጥ» አሁን የተቀናበረውን ያቆያል።\n\n«ቀጣይ መገለጫ» በዝርዝሩ ውስጥ ወዳለው ቀጣዩ ይቀይራል፤ በአዝራር ወይም በደንብ ላይ ያስቀምጡት።"
