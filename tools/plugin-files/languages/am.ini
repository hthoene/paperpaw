reading-goal.plugin.name = የንባብ ግብ
reading-goal.plugin.description = በቀን የሚነበቡ ደቂቃዎች፣ እና በመነሻ ማያ ገጽ ላይ ስሜቱ የዛሬውን ንባብ የሚከተል ድመት።
reading-goal.plugin.how = "በመነሻ ማያ ገጽዎ ላይ ያለ ድመት የዛሬው ንባብ እንዴት እየሄደ እንደሆነ ያሳያል፦ ገና ሳያነቡ ሲቀሩ ያዘነ፣ ትንሽ ካነበቡ በኋላ ደህና ደህና፣ ከዕለታዊ ግብዎ ግማሽ ጀምሮ የረካ፣ ግቡን ሲደርሱ ደስተኛ።\n\n«የንባብ ድመት» ዊጀትን ወደ መነሻ ማያ ገጽ ይጨምሩ (መነሻ ማያ ገጹን ይያዙ፤ ከዚያ ዊጀት ይጨምሩ)፣ ወይም «የዛሬ የንባብ ድመት» ን እንደ እንቅልፍ ማያ ገጽ ይምረጡ። ድመቷን መንካት ዕለታዊ ግቡን ይከፍታል፤ የሚያነቧቸውን ደቂቃዎች የሚቆጥረው የንባብ ስታቲስቲክስ ግብ ነው።\n\nበቅንብሮች ውስጥ በንባብ ስር «ከዚህ የረካ» እና «ከዚህ ደስተኛ» ድመቷ ከየትኛው የግብ ድርሻ የረካች ወይም ደስተኛ እንደምትሆን ያቀናብራሉ፣ «የራስ ሥዕሎች» ደግሞ ከድመቶቹ ይልቅ የሚታዩ የሥዕሎች አቃፊ (ያዘነ፣ ደህና ደህና፣ የረካ እና ደስተኛ)። ሥዕሎቹ PNG ወይም JPEG ፋይሎች ናቸው፤ አቃፊ ከሌለ ድመቶቹ ይታያሉ።"
