reader.plugin.name = አንባቢ
reader.plugin.description = መጻሕፍትን ገጽ በገጽ ያሳያል፣ ከይዘት ማውጫ እና የንባብ ቅንብሮች ጋር።
reader.plugin.how = "አንባቢው መጻሕፍትን ገጽ በገጽ ያሳያል። መጽሐፍን ከቤተ-መጻሕፍቱ ይክፈቱ፤ የመጨረሻው መጽሐፍ በጅምር ላይ ሊከፈት ይችላል (ቅንብር «በጅምር መጨረሻውን መጽሐፍ ክፈት»)።\n\nገጾችን ለመገልበጥ የማያ ገጹን ግራ ወይም ቀኝ ይንኩ፣ ወይም የገጽ አዝራሮችን ይጠቀሙ። ለንባብ ምናሌ መሃሉን ይንኩ ወይም ምረጥን ይጫኑ፦ ይዘት፣ ፍለጋ፣ ወደ ገጽ ሂድ፣ ቅርጸ-ቁምፊ እና አቀማመጥ፣ ዕልባቶች እና ማድመቂያዎች እና ተጨማሪ። ከላይኛው ጠርዝ ወደ ታች መጥረግ ፈጣን ፓነሉን ይከፍታል፣ ከታችኛው ጠርዝ ወደ ላይ ወደ መነሻ ይሄዳል፤ ተመለስን መያዝም እንዲሁ ነው።\n\nሥዕልን ሙሉ ማያ ገጽ ለማየት ምረጥን (ወይም ሥዕልን) ይያዙ፦ ግራ እና ቀኝ በገጹ ሥዕሎች ውስጥ ያልፋሉ። ምረጥ ወደ 2x፣ 3x እና ወደ ኋላ ያጎላል (በንክኪ ሁለት ጊዜ መንካት)፤ ሲጎላ ግራ እና ቀኝ ወደ ጎን ይጎትታሉ፣ የገጽ አዝራሮች (ወይም መጥረጎች) በስፋት እና ወደ ታች ያንቀሳቅሳሉ። ተመለስ ወደ ማስማማት፣ ከዚያ ወደ ገጹ ይመልሳል (በንክኪ ለመውጣት ይያዙ)። ለዕልባት የላይኛውን ቀኝ ጥግ ይንኩ። ለማድመቅ ቃልን ይያዙ። በአዝራሮች ግራን ይያዙ፦ ግራ እና ቀኝ በቃል ይንቀሳቀሳሉ፣ የገጽ አዝራሮች በመስመር፣ መያዛቸው ወደ ገጹ ጫፎች እና በአንቀጽ ይሄዳል፤ ምረጥ ለቃሉ የማድመቂያ አሞሌውን ይከፍታል፣ ምረጥን መያዝ ወደ ዓረፍተ ነገሩ እና አንቀጹ ያሰፋዋል (ከዚያ ግራ እና ቀኝ መጨረሻውን ያንቀሳቅሳሉ፣ መያዛቸው መጀመሪያውን)። ምርጫ በገጽ መገልበጦች ላይ ይቀጥላል። «እንደ Markdown ላክ» ማስታወሻዎችዎን ያስቀምጣል።"
