picture-home.plugin.name = የሥዕል መነሻ ማያ ገጽ
picture-home.plugin.description = ከዊጀቶቹ ጀርባ የራስዎ ሥዕል ያለው መነሻ ማያ ገጽ፣ እና የሚያዋቅሩት የሁኔታ አሞሌ።
picture-home.plugin.how = "የሥዕል መነሻ ማያ ገጽ ሲበራ መነሻ ማያ ገጹን ይተካል፦ ከዊጀቶቹ ጀርባ የራስዎ ሥዕል፣ እና የሚያደራጁት የዊጀቶች እና የመሣሪያዎች ገጾች። በተሰኪ አስተዳዳሪ ውስጥ ያጥፉት እና አብሮ የተሠራው መነሻ ማያ ገጽ ከራሱ ገጾች ጋር ይመለሳል።\n\nሥዕሎችን (JPEG፣ PNG ወይም GIF) በካርዱ ላይ ባለ አቃፊ ውስጥ ያስቀምጡ (በነባሪ wallpapers)፤ ከዚያ በቅንብሮች፣ ማበጀት፣ የሥዕል መነሻ ማያ ገጽ ውስጥ አንዱን ይምረጡ። «አስማማ» ማያ ገጹን እንዴት እንደሚሞላ ይናገራል (ሙላ፣ ሙሉ ሥዕል፣ ዘርጋ፣ ዋናው መጠን፣ ሰድር)፣ «ቦታ» የትኛው ክፍል እንደሚቆይ፣ «አጉላ» ምን ያህል ትልቅ እንደሆነ፣ «ሥዕሉን አፍዝዝ» ምን ያህል ገርጣ እንደሆነ፦ ገርጣ ያለ ሥዕል ዊጀቶቹን ለማንበብ ቀላል ያደርጋል። ሥዕሉ ለእያንዳንዱ የማያ ገጽ መጠን አንድ ጊዜ ይዘጋጃል፤ ይህም ትንሽ ጊዜ ይወስዳል።\n\nዊጀቶች ከሥዕሉ በላይ በሳህኖች ላይ ይቀመጣሉ። ገጹን አብሮ በተሠራው መነሻ ማያ ገጽ እንደሚደረገው ያደራጁ፦ ከገጹ በታች ያለው እርሳስ፣ ወይም በምናሌው ውስጥ «መነሻ ማያ ገጽ አርትዕ»።\n\nየሁኔታ አሞሌው (ሰዓት፣ Wi-Fi፣ ባትሪ፣ ወይም የመረጡት) በርቶ፣ ጠፍቶ ወይም ራስ-ሰር፣ በላይ ወይም በታች፣ ሙሉ ስፋት ወይም በግራ፣ መሃል ወይም ቀኝ ትንሽ ክኒን፣ በብሩህ፣ ጥቁር ወይም ግራጫ ሳህን ላይ ወይም በራሱ ሥዕሉ ላይ ሊሆን ይችላል። አዝራሮቹን የሚሰይመው ረድፍ (በ X4 ላይ) በርቶ፣ ጠፍቶ ወይም ራስ-ሰርም ሊሆን ይችላል። ራስ-ሰር ማለት አዝራር መጫን ለጥቂት ሰከንዶች ያሳያቸዋል ማለት ነው፤ ያ መጫን ሌላ ምንም አያደርግም።\n\n«የሥዕል አሳሳል» ሥዕሉ እንዴት እንደሚሳል ይናገራል፦ «የግራጫ ደረጃዎች» ማያ ገጹ ባለው እያንዳንዱ ግራጫ (በ X4 ላይ ቀርፋፋ)፣ «በነጥብ» በጥቁር እና ነጭ ነጥቦች (ፈጣን)፣ ወይም «ራስ-ሰር»፣ አብሮ የተሠራው መነሻ ማያ ገጽ እንደሚያደርገው፦ ማያ ገጹ ሲሳል የግራጫ ደረጃዎች፣ ከመጀመሪያው ለውጥ በኋላ ነጥቦች። የግራጫ ደረጃዎች በሌለው ማያ ገጽ ላይ የግራጫ ደረጃዎች ወደ ነጥቦች ይመለሳሉ።"
