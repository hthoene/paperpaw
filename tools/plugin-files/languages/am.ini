store.plugin.how = "የተሰኪ ስቶር ለዚህ መሣሪያ ተሰኪዎችን በበይነመረብ ላይ ያገኛል እና ይጭናል፣ ያዘምናል እና ያስወግዳል። ከመሣሪያዎች ይክፈቱት፤ Wi-Fi ያስፈልገዋል።\n\nመጀመሪያው ገጽ ቤተ-መጻሕፍቱ የሚመክረውን፣ አሁን አዲስ ወይም ተወዳጅ የሆነውን፤ ከዚያ ቡድኖቹን ያሳያል። ቡድን ተሰኪዎቹን በየቀኑ በሚቀየር ፍትሃዊ ድብልቅ ይዘረዝራል፤ ስለዚህ እያንዳንዱ ተሰኪ ይታያል፤ ከ A እስከ Z፣ በአዲስነት ወይም በመጨረሻ ዝማኔ ይደርድሯቸው፣ እና በረጅም ዝርዝሮች ወደ ፊደል ይሂዱ። ገጹን ለማየት አንዱን ይክፈቱ፣ ከመጠኑ እና ከሚወስደው ማህደረ ትውስታ ጋር፤ ከዚያ «ጫን»፣ «አዘምን» ወይም «አስወግድ» ይምረጡ። «ሁሉንም አዘምን» እያንዳንዱን የተጫነ ተሰኪ ወቅታዊ ያደርጋል።\n\nየኮድ ተሰኪዎች ከመሣሪያው ሙሉ መዳረሻ ጋር ይሠራሉ፦ ስቶሩ ይናገራል እና መጀመሪያ ይጠይቃል፣ ከዳግም ማስጀመር በኋላም ይጀምራሉ። አንዱ ከተበላሸ PaperPaw ያለ የኮድ ተሰኪዎች ይጀምራል እና የትኛው እንደሆነ ይናገራል። «የተሰኪ ቤተ-መጻሕፍት» ዝርዝሩ የሚመጣበትን ያቀናብራል።\n\n«የማኅበረሰብ ተሰኪዎች» በቅንብሮች፣ ሲስተም ውስጥ ሌሎች በ GitHub ላይ ያሳተሟቸውን ተሰኪዎችም ይዘረዝራል። ማንም አልገመገማቸውም፦ «ያልተገመገመ» ተብለው ምልክት ተደርጎባቸዋል፣ የኮድ ተሰኪ ገጽ የተፈረመበትን ቁልፍ ያሳያል፣ እና በሌላ ቁልፍ የተፈረመ ዝማኔ አይጫንም።\n\n«ምንጮች»፣ የመጀመሪያው ገጽ የመጨረሻ ረድፍ፣ የሌሎችን የተሰኪ ዝርዝሮች በአድራሻቸው (https://…/plugins.json) ይጨምራል፣ ከ PaperPaw ዝርዝር ይልቅ አንዱን ይዘረዝራል፣ ወይም ያስወግዳል። ከመጻፍ ይልቅ በእያንዳንዱ መስመር አንድ አድራሻ ያለው ፋይል sources.txt ን በካርዱ ላይ ወደ .paperpaw/plugins/store ያስቀምጡ፦ አድራሻዎቹ በ«ምንጮች» ስር እንደ አዲስ ይታያሉ። PaperPaw ምንጭን ወይም ተሰኪዎቹን አይፈትሽም፣ መሣሪያውም የምንጩን አገልጋይ ያነጋግራል። ምንጭ ዝርዝሩን ይፈርማል፤ መሣሪያው የሚያነበውን የመጀመሪያ ዝርዝር ቁልፍ ያቆያል እና ከዚያ ወዲህ በዚያ ቁልፍ የተፈረሙ ዝርዝሮችን እና የኮድ ተሰኪዎችን ብቻ ይወስዳል። ተሰኪ ዝማኔዎቹን የሚያገኘው ከተጫነበት ምንጭ ብቻ ነው። የ PaperPaw የራሱ ቤተ-መጻሕፍት ሁልጊዜ አለ እና ሊወገድ አይችልም፤ ስቶሩን መተው ወደ እሱ ይመልሳል።"
