home.plugin.name = መነሻ ማያ ገጽ
home.plugin.description = መነሻ ገጹ፦ እንደ እየተነበበ ያለው መጽሐፍ እና መሣሪያዎች ያሉ የዊጀቶች ገጾች።
home.plugin.how = "መነሻ ማያ ገጹ ከገጾች የተሠራ ነው፤ እያንዳንዱ እንደ ስልክ የዊጀቶች እና የመሣሪያዎች ፍርግርግ ነው። መጀመሪያ ላይ ሰዓቱ፣ የሚያነቡት መጽሐፍ እና በቅርቡ የተነበቡ መጻሕፍት በአንድ ገጽ ላይ ናቸው፣ ሁሉም መሣሪያዎች በሚቀጥለው ላይ።\n\nለመክፈት ንጥልን ይንኩ፤ ገጾችን ለመቀየር ይጥረጉ ወይም የገጽ አዝራሮችን ይጠቀሙ። በአዝራሮች ብቻ የቀስት አዝራሮች ከአንድ ንጥል ወደ ቀጣዩ ይሄዳሉ፣ ምረጥ ይከፍተዋል።\n\nእንደገና ለማደራጀት መነሻ ማያ ገጹን ይያዙ፣ ከገጹ በታች ያለውን እርሳስ ይንኩ ወይም በምናሌው ውስጥ «መነሻ ማያ ገጽ አርትዕ» ን ይምረጡ። ንጥሎችን ለማንቀሳቀስ ይጎትቷቸው ወይም ለአማራጮቹ አንዱን ይንኩ፣ በአዝራሮችም ይቻላል። «ዊጀት ጨምር» እዚያም አለ። «አምዶች» እና «ረድፎች» በቅንብሮች ውስጥ በ«ገጽታ» ስር በ«መነሻ ማያ ገጽ» ክፍል ውስጥ ናቸው።\n\nበጎኑ በተዞረ ማያ ገጽ ላይ መነሻ ማያ ገጹ ተመሳሳዮቹን ንጥሎች ከብዙ አምዶች ጋር ያሳያል፤ እያንዳንዱ ገጽ ከቀጣዩ በፊት ይሞላል፣ ካርዶችም ከ110 ሚሜ አይበልጡም፤ ቀጥ አድርገው ያደራጁት ምንም አይለወጥም። በጎኑ ካደራጁት ያ አቀማመጥ ለዚያ አቅጣጫ ለብቻው ይቀመጣል፦ አዳዲስ ዊጀቶች ወደ ሁለቱም ይጨመራሉ። በ«ጨምር» (በሚያርትዑበት ጊዜ) ውስጥ «የጎን አቀማመጥን ዳግም አስጀምር» ወደ ተገኘው ይመለሳል። በአንድ አቅጣጫ ዊጀትን ወይም መሣሪያን ማስወገድ ከሌላው አያስወግደውም።"
