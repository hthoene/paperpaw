battery.plugin.description = ባትሪውን ይመዘግባል እና ምን ያህል እንደሚቆይ ያሳያል።
battery.plugin.how = "የባትሪ አጠቃቀም መሣሪያው ነቅቶ ሳለ በደቂቃ አንድ ጊዜ ያህል የኃይል መጠኑን ከሠራው ጋር ይመዘግባል፦ የማያ ገጽ ማደስ እና የተገለበጡ ገጾች። ከዚያ አንድ ሰዓት ነቅቶ እና 100 ገጾች ምን ያህል እንደሚወስዱ፣ እና ባትሪው በዚያ ፍጥነት ምን ያህል እንደሚቆይ ያሰላል።\n\nባትሪን ከመሣሪያዎች ምናሌ ይክፈቱ። አሁን ያለውን የኃይል መጠን፣ ይህን ነቅቶ የቆየበት ጊዜ፣ እስካሁን በባትሪ ላይ ያለውን አጠቃቀም እና የቅርብ ጊዜ የንቃት ጊዜያትዎን ያሳያል። በገጽ አዝራሮች፣ ወይም በላይ ያሉትን ቀስቶች በመንካት ይገለበጣል።\n\nአሃዞቹ ትርጉም እንዲኖራቸው በባትሪ ላይ ለጥቂት ጊዜ ማንበብ ያስፈልጋል። መመዝገብ በነባሪ በርቷል፤ በቅንብሮች ውስጥ በመሣሪያ፣ ኃይል ስር «የባትሪ አጠቃቀም ይመዝገብ» ብለው ማጥፋት ይቻላል።"
