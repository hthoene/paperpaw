stats.plugin.how = "የንባብ ስታቲስቲክስ እያንዳንዱን ገጽ ምን ያህል ጊዜ እንዳነበቡ ይመዘግባል። ዛሬን፣ ሳምንቱን እና ተከታታይ ቀናትዎን የያዘ አጠቃላይ እይታ፣ እንደ የቀን መቁጠሪያ፣ እና ከእያንዳንዱ መጽሐፍ ቁጥሮች ጋር ያዩታል።\n\nከመሣሪያዎች፣ ወይም ከአንባቢው «ተጨማሪ» ይክፈቱት። በቅንብሮች ውስጥ በ«የንባብ ስታቲስቲክስ» ስር «ንባብን ይመዝግቡ» ን ማጥፋት፣ «ዕለታዊ ግብ» ማቀናበር፣ እና የሚቆጠሩትን «አጭሩ ገጽ» እና «ረጅሙ ገጽ» ማቀናበር ይችላሉ፤ ስለዚህ ገጾችን በፍጥነት መግለጥ ወይም ክፍት የተተወ መጽሐፍ ቁጥሮቹን አያዛባም።\n\n«ከ KOReader ጋር አመሳስል» ስታቲስቲክሱን በ WebDAV አቃፊ በኩል ከ KOReader ጋር ይጋራል። በተመሳሳይ መሣሪያ ላይ የ KOReader ስታቲስቲክስንም ይወስዳል። መመዝገብ ሰዓቱ እንዲቀናበር ይፈልጋል፤ ባልሆነበት ከ Wi-Fi ጋር አንድ ጊዜ ይገናኙ።"
