anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = በኮምፒውተርዎ ላይ ያሉትን የ Anki የደረሱ ካርዶች ያጠናል እና መልሶችዎን በ AnkiConnect ተጨማሪ በኩል ይመልሳል።
anki.plugin.how = "Anki በኮምፒውተርዎ ላይ በ Anki ውስጥ የደረሱ ካርዶችን በአንባቢው ላይ እንዲያጠኑ እና መልሶችዎን እንዲልኩ ያስችልዎታል። ነፃውን የ AnkiConnect ተጨማሪ (የተጨማሪ ኮድ 2055492159) ይጠቀማል፤ AnkiWeb ን ፈጽሞ አይጠቀምም። መጀመሪያ ላይ ጠፍቷል፦ ከተሰኪ ስቶር ያክሉት።\n\nበኮምፒውተሩ ላይ፦ AnkiConnect ን በ Anki ውስጥ ይጫኑ (Tools, Add-ons, Get Add-ons) እና Anki ን እንደገና ያስጀምሩ። ሲያመሳስሉ Anki ክፍት መሆን አለበት።\n\nበነባሪ AnkiConnect የሚሠራበትን ኮምፒውተር (127.0.0.1) ብቻ ይመልሳል፤ ስለዚህ አንባቢው ሊደርስበት አይችልም። Tools, Add-ons, AnkiConnect, Config ይክፈቱ እና «webBindAddress» ን ወደ «0.0.0.0» ያቀናብሩ (በቤት አውታረ መረብ ላይ ያዳምጣል)። ወደቡ፣ «webBindPort»፣ ካልቀየሩት 8765 ነው። እዚያ «apiKey» ካቀናበሩ ተመሳሳዩን ቁልፍ እዚህ ያስገቡ። ውቅሩን ከቀየሩ በኋላ Anki ን እንደገና ያስጀምሩ፤ ከጠየቀ Anki ን በኮምፒውተሩ ፋየርዎል በኩል ይፍቀዱ። ይህን የሚያምኑት አውታረ መረብ ላይ ብቻ ይጠቀሙ፦ በእሱ ላይ ያለ ማንኛውም ሰው AnkiConnect ላይ መድረስ ይችላል፤ ስለዚህ ቁልፍ መጠቀም ጥሩ ነው።\n\nበአንባቢው ላይ፦ Anki ን ከመሣሪያዎች ይክፈቱ፤ ከዚያ በ«ኮምፒውተር» ስር የኮምፒውተሩን አድራሻ (ለምሳሌ 192.168.1.20)፣ ወደቡ 8765 ካልሆነ ወደቡን፣ እና ካቀናበሩ የኤፒአይ ቁልፉን ያስገቡ። «ዴክ» ይምረጡ፣ ወይም ለሁሉም ዴኮች ባዶ ይተዉት። ከዚያ Wi-Fi ሲበራ «ከ Anki ጋር አመሳስል» ይምረጡ፦ የሚጠብቁ መልሶችዎ መጀመሪያ ይላካሉ፤ ከዚያ የደረሱ ካርዶች (እና ያቀናበሩት የአዳዲስ ካርዶች ብዛት) ይመጣሉ፣ ቢበዛ 50። ያለ አውታረ መረብ ለማለፍ «አጥና» ይምረጡ፦ መልሱን ያሳዩ እና «እንደገና»፣ «ከባድ»፣ «ጥሩ» ወይም «ቀላል» ብለው ደረጃ ይስጡ። መልሶችዎ በአንባቢው ላይ ይቀመጣሉ፣ Wi-Fi ባይኖርም፣ እና በሚቀጥለው ማመሳሰል ወደ Anki ይሄዳሉ። ካርድ መቼ እንደሚመለስ Anki ይወስናል፦ «እንደገና» ብለው የመለሱት ካርድ Anki ሲደርስ ከተባለ በኋላ በሚመጣ ማመሳሰል እንደገና ይመጣል።\n\nበቅንብሮች ውስጥ «Anki ሲከፈት አመሳስል» ማያ ገጹን በከፈቱ ቁጥር ያመሳስላል። ቁልፍ ሲጫኑ ምንም አውታረ መረብ አይጠቀምም።"
