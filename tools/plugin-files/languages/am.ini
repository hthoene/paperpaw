fonts-browser.plugin.name = ተጨማሪ ቅርጸ-ቁምፊዎች
fonts-browser.plugin.description = ቅርጸ-ቁምፊዎችን ከበይነመረብ በናሙና ያሳያል እና ለማንበብ ያወርዳቸዋል።
fonts-browser.plugin.how = "«ተጨማሪ ቅርጸ-ቁምፊዎች» በበይነመረብ ላይ ካለ የቅርጸ-ቁምፊ ቤተ-መጻሕፍት ቅርጸ-ቁምፊዎችን ይዘረዝራል፤ እያንዳንዱ ስም በራሱ ቅርጸ-ቁምፊ ተጽፎ፤ እና ለማንበብ የሚፈልጓቸውን ያወርዳል።\n\nየንባብ ቅርጸ-ቁምፊ በሚመረጥበት የቅርጸ-ቁምፊዎች ዝርዝር መጨረሻ ላይ፣ በቅንብሮች ውስጥ በንባብ ስር እንደ «ቅርጸ-ቁምፊ» ያገኙታል፤ የሁኔታ መስመሮች ለቅርጸ-ቁምፊያቸው ተመሳሳይ ግቤት አላቸው። ቅርጸ-ቁምፊን ይንኩ (በአዝራሮች ምረጥን ይጫኑ) በናሙና ዓረፍተ ነገር ትልቅ ሆኖ ለማየት፤ ከዚያ «አውርድ» ን ይምረጡ። በሚወርድበት ጊዜ ገጹን መተው ይችላሉ። ሲጠናቀቅ «በ(የቅርጸ-ቁምፊው ስም) አንብብ»፣ ወይም «ለሁኔታ መስመሮች ተጠቀም» ን ይምረጡ። «አዘምን» አዲስ ስሪት ያመጣል፣ «አስወግድ» ቅርጸ-ቁምፊውን ከመሣሪያው ይሰርዛል።\n\nWi-Fi ያስፈልገዋል።\n\nየራስዎ ቅርጸ-ቁምፊዎች\n\nከ«ተጨማሪ ቅርጸ-ቁምፊዎች» ቀጥሎ ተመሳሳዩ ዝርዝር «የራስዎ ቅርጸ-ቁምፊዎች» አለው፤ ይህም የዚህን የእገዛ ክፍል ያሳያል። የራስዎ ቅርጸ-ቁምፊ .ttf ወይም .otf ፋይል ነው፣ ለምሳሌ ከ Google Fonts።\n\nበአንድሮይድ እና የቅርጸ-ቁምፊ ፋይሎችን በሚስሉ ሌሎች መሣሪያዎች ላይ፦ ፋይሉን ወደ fonts አቃፊ ይቅዱ (በአንድሮይድ፦ በጋራ ማከማቻ ውስጥ PaperPaw/fonts)፣ PaperPaw ን እንደገና ያስጀምሩ እና ቅርጸ-ቁምፊውን በቅንብሮች ውስጥ በንባብ ስር እንደ «ቅርጸ-ቁምፊ» ይምረጡ።\n\nበ Xteink X4 እና X4 Pro ላይ፦ እነዚህ አንባቢዎች የቅርጸ-ቁምፊ ፋይሎች በማህደረ ትውስታቸው ውስጥ ስለማይገቡ የቅርጸ-ቁምፊ ፋይሎችን ሳይሆን የቅርጸ-ቁምፊ ጥቅሎችን ያነባሉ። በኮምፒውተር ላይ በ paperpaw-fontgen ለእያንዳንዱ ላለዎት ዘይቤ ጥቅል ይሥሩ (regular ያስፈልጋል)፦\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nይህ plugins/font-my-font አቃፊን ይሠራል። በሜሞሪ ካርዱ ላይ ወዳለው plugins አቃፊ ይቅዱት፣ እንደገና ያስጀምሩ እና My Font ን እንደ «ቅርጸ-ቁምፊ» ይምረጡ። የአንድ ዘይቤ ጥቅል ለላቲን ፊደላት ወደ ግማሽ ሜጋባይት ነው፤ ያልተካተቱ ዘይቤዎች በ regular ይሳላሉ። መሣሪያው ከሚጠይቋቸው ፊደላት ቅርጸ-ቁምፊው ስንቱን እንደያዘ ይናገራል (--chars latin,cyrillic,greek ጽሕፈቶችን ይጨምራል)፦ የመጽሐፍዎ ፊደላት የሌሉት ቅርጸ-ቁምፊ ሊያሳያቸው አይችልም፤ ስለዚህ ጽሕፈቱን የሚሸፍን ይፈልጉ።\n\nከ«ተጨማሪ ቅርጸ-ቁምፊዎች» የሚመጡ ቅርጸ-ቁምፊዎች በተመሳሳይ መንገድ ይሠራሉ እና ኮምፒውተር አያስፈልጋቸውም።\n\nበኢ-ኢንክ ፓነል ላይ ለጠራ አነስተኛ ጽሑፍ ወደ ትዕዛዙ --hinting light ይጨምሩ፦ ፊደላቱን ከፒክሰል ፍርግርግ ጋር ያስማማል፣ ነባሪዎቹ ቅርጸ-ቁምፊዎች እንደሚሠሩት። ያለ እሱ ፊደላቱ ቅርጸ-ቁምፊው እንደተነደፈው ይሳላሉ፤ --hinting normal እና --hinting mono በይበልጥ በጥብቅ ያስማማሉ። እንደ ዐረብኛ ወይም ዴቫናጋሪ ያሉ ምልክቶች ያሏቸው ቅርጸ-ቁምፊዎች ያለ እሱ ቢተዉ ይሻላል።"
