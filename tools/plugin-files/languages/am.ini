vocabulary.plugin.how = "የቃላት ዝርዝር ሲያነቡ የፈለጓቸውን ቃላት ከዓረፍተ ነገራቸው ጋር ለኋላ ክለሳ ያቆያል። ዝርዝሩ በመሣሪያዎች ነው፣ አዲሱ መጀመሪያ፤ ቃሉን እንደገና ለመፈለግ ይምረጡት። የመጨረሻው ረድፍ «ላክ» እንደ Anki ላሉ የፍላሽ ካርድ መተግበሪያዎች ያስቀምጣቸዋል። ዝርዝሩ አዲሶቹን 2,000 ቃላት ይይዛል፤ የቆዩት ይጠፋሉ፣ ሁሉንም ለማቆየት ቀድመው ይላኩ።\n\n«ፍላሽ ካርዶች» (በመሣሪያዎች) በተራራቀ ድግግሞሽ ይፈትኑዎታል፦ ከ«መልሱን አሳይ» በኋላ ካርዱን «እንደገና»፣ «ከባድ»፣ «ጥሩ» ወይም «ቀላል» ብለው ይመዝኑታል፤ ያም መቼ እንደሚመለስ ይወስናል። ዴኮችን በ«በስልክዎ አርትዕ» ይሥሩ፦ ኮዱን በዚያው Wi-Fi ባለ ስልክ ይቃኙ፣ ካርዶችን ይጻፉ ወይም ብዙ በአንድ ጊዜ ይጨምሩ፦ ዴክ ከፍተው በ«ብዙ ካርዶች በአንድ ጊዜ» የ CSV፣ TSV ወይም TXT ፋይል ይምረጡ (በየመስመሩ ፊት፣ ጀርባ፣ ምሳሌ፤ UTF-8)፣ ዝርዝር ይለጥፉ፣ ወይም የ Anki ዴክ (.apkg፣ በ«የቆዩ የ Anki ስሪቶችን ደግፍ» የተላከ) ያምጡ።\n\nወይም የ SD ካርድ ፋይሎች፦ ለእያንዳንዱ ዴክ የ CSV፣ TSV ወይም TXT ፋይል ወይም የ Anki ዴክ (.apkg፣ እንደላይ የተላከ) በ Flashcards አቃፊ ያስቀምጡ (Spanish.tsv ዴክ Spanish ይሠራል፤ በየመስመሩ ፊት፣ ጀርባ፣ ምሳሌ፤ UTF-8፤ የመጀመሪያው መስመር የአምድ ስሞችን front፣ back፣ example ሊይዝ ይችላል)። በ«ፍላሽ ካርዶች» «በ SD ካርዱ ላይ ያሉ ካርዶች» ን ይምረጡ፣ ወይም ሲከፍቱት በራሱ ይሆናል። ዴኮችና ትምህርቱ በአንባቢው ይቆያሉ፤ ፋይል ሲታከል ወይም ሲለወጥ ከዴኩ ጋር ይዋሃዳል፦ በፋይሉ ጀርባን ወይም ምሳሌን መቀየር ካርዱን ከእድገቱ ጋር ያዘምናል፤ ፊትን መቀየር አዲስ ካርድ ያደርገዋል፣ የድሮውም እንደገና ይጀምራል (ካርዶች በፊታቸው ይለያሉ፤ ክፍተትና አቢይ ፊደል አይቆጠሩም)፤ መስመር መሰረዝ ካርዱን አይሰርዝም (ለዴኩ «ከፋይሉ የጎደሉ ካርዶች» «አስወግድ» ካልሆነ በቀር፦ ያኔ ካርዱ በቀጣዩ ዝማኔ ከእድገቱ ጋር ለዘላለም ይወገዳል፤ የማይነበብ መስመር እያለ ምንም አይወገድም)። «ወደ ካርዱ አስቀምጥ» ዴኩን ወደ ፋይሉ ያስቀምጣል፦ ፋይሉ የካርድ ቁጥሮችን (id አምድ) ያገኛል፣ ስለዚህ ፊቶችን በኮምፒውተር ቢያርትዑም ትምህርቱ ይቆያል፤ ፋይሉ id፣ front፣ back፣ example ብቻ ይይዛል (ሌላ አምድ፣ አስተያየትና የመስመር ቅደም ተከተል አይቆዩም)፤ የማይነበብ መስመር እያለ ማስቀመጥ አይፈቀድም፤ የነበረው ፋይል መጀመሪያ ወደ _name.bak.tsv ይገለበጣል (ቀጣይ ማስቀመጥ ቅጂውን አይተካም)። ከ4 MiB ወይም 20,000 መስመር በላይ ያለ ፋይል አይነበብም፤ በ UTF-16 ሳይሆን በ CSV UTF-8 ይቀመጥ። መጀመሪያ አንባቢው አቃፊውን ከመመሪያ ማስታወሻ ጋር ይፈጥራል።\n\nበቅንብሮች በንባብ ስር «የተፈለጉ ቃላት ካርዶች ይሁኑ» እያንዳንዱን የተፈለገ ቃል ወደ «Looked up» ዴክ ያስገባል።"
