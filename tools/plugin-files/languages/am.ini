settings.plugin.how = "«ቅንብሮች» በ PaperPaw እና በተሰኪዎቹ ውስጥ ሊቀናበር የሚችለውን ሁሉ በገጾች ያሳያል። ተሰኪዎች የራሳቸው ማያ ገጽ አያስፈልጋቸውም፦ የሚያውጁት እዚህ በቡድኖች ይታያል፣ የእያንዳንዱ ቅንብር መግለጫ ከሥሩ።\n\nበምናሌው ውስጥ በ«ቅንብሮች» ይክፈቱት። ለመክፈት ቡድንን ይንኩ፤ ከዚያ ለመቀያየር ወይም ለመምረጥ ቅንብርን፤ ቁጥሮች − እና + አዝራሮች አሏቸው። በአዝራሮች ወደ ቅንብር ይሂዱ እና ምረጥን ይጫኑ፦ ግራ እና ቀኝ ቁጥርን ይለውጣሉ፣ ምረጥ ያቆየዋል፣ ተመለስ ወደ ቀደመው እሴት ይመልሳል።\n\nለውጦች ወዲያው ይሠራሉ። «ፈልግ» ቅንብርን በቃላት ያገኛል፣ «የላቁ ቅንብሮች» ደግሞ አልፎ አልፎ የሚያስፈልጉትን ይጨምራል። «ወደ ነባሪ መልስ» እና «ሁሉንም ዳግም አስጀምር» መጀመሪያ ይጠይቃሉ።"
