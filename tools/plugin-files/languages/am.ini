power.plugin.name = ኃይል
power.plugin.description = የኃይል ሁነታን በእጅ ወይም በባትሪ ይመርጣል፦ መደበኛ፣ ቁጠባ፣ ከመስመር ውጭ።
power.plugin.how = "«ኃይል» PaperPaw ባትሪውን እንዴት እንደሚያወጣ ይመርጣል፦ መደበኛ፣ ቁጠባ ወይም ከመስመር ውጭ። ቁጠባ መጠበቅ የሚችለውን በተሻሉ ጊዜያት ያደርጋል፤ ከመስመር ውጭ ሬዲዮውን ያጠፋል። ራስ-ሰር በባትሪው ይመርጣል።\n\nሁነታውን በፈጣን ፓነል ይቀይሩ፣ በዚያ «ኃይል» ሁነታዎቹን ጎን ለጎን ያሳያል፣ ወይም በቅንብሮች ውስጥ በ«ኃይል» ስር። እዚያም ራስ-ሰር ወደ ቁጠባ እና ወደ ከመስመር ውጭ የሚቀይርባቸውን ደረጃዎች፣ እና በሚሞላበት ጊዜ መደበኛ ሆኖ ይቆይ እንደሆነ ያቀናብራሉ።\n\nበሁኔታ መስመሮች ውስጥ «የኃይል ሁነታ» በሚቆጥብበት ጊዜ ቅጠል፣ ከመስመር ውጭ ሲሆን የተሻገረ Wi-Fi ያሳያል፤ በመደበኛ ደግሞ ምንም።\n\nትንሽ ምናሌ ለመክፈት የኃይል አዝራሩን ይያዙ፦ እንቅልፍ፣ አጥፋ (PaperPaw በሚችልበት)፣ እንደገና ጀምር፣ እና በንክኪ መሣሪያዎች ላይ «ንክኪ ቆልፍ» ወይም «ንክኪ ክፈት»። አጭር መጫን አሁንም መሣሪያውን ያስተኛል። ተመለስ ምናሌውን ይተዋል።"
