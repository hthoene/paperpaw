pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = የሥራ እና የእረፍት ዙሮች፣ ዊጀቶች እና የዕለት ቆጠራ ያለው የትኩረት ሰዓት ቆጣሪ።
pomodoro.plugin.how = "የ Pomodoro ሰዓት ቆጣሪ፦ በትኩረት ዙሮች ይሥሩ፤ ከዚያ ያርፉ። ምንም ዝግጅት አያስፈልገውም፦ 25 ደቂቃ ትኩረት፣ 5 እረፍት፣ እና ከአራት ዙሮች በኋላ የ15 ረጅም እረፍት።\n\nPomodoro ን ከመሣሪያዎች ምናሌ ይክፈቱ እና «ጀምር» ን ይጫኑ፣ ወይም ዊጀቶቹን ወደ መነሻ ማያ ገጽ ይጨምሩ (መነሻ ማያ ገጹን ይያዙ፤ ከዚያ ዊጀት ይጨምሩ)፦ «Pomodoro ሰዓት ቆጣሪ» ምዕራፉን እና የቀሩትን ደቂቃዎች ያሳያል፣ «Pomodoro ጀምር/ለአፍታ አቁም» አዝራር ነው፣ «Pomodoro ዛሬ» ያጠናቀቋቸውን ዙሮች ከዕለታዊ ግብዎ ጋር ይቆጥራል። ሰዓት ቆጣሪውን መንካት ይጀምረዋል ወይም ለአፍታ ያቆመዋል፤ ሙሉ ማያ ገጹን ለመክፈት ይያዙት።\n\nማያ ገጹን ሲለቁ ሰዓት ቆጣሪው መሥራቱን ይቀጥላል፣ ከዳግም ማስጀመር በኋላም በሰዓቱ ይቀጥላል። አንባቢው ሲተኛ ምንም አይሠራም፦ በዚህ መካከል ያበቃ ምዕራፍ ሲነቃ ይነገራል። ምዕራፍ ሲያበቃ ማሳሰቢያ ይነግርዎታል። ባትሪ ለመቆጠብ ሰዓቱ በደቂቃ አንድ ጊዜ ይዘምናል (በሙሉ ማያ ገጹ በመጨረሻው ደቂቃ በየአሥር ሰከንዱ) እና አንባቢውን ፈጽሞ ነቅቶ አያቆይም።\n\nበቅንብሮች ውስጥ በ«Pomodoro» ስር የርዝመቶቹን እና የአንድ ስብስብ ዙሮችን፣ እንዲሁም ቀጣዩ ምዕራፍ በራሱ እንደሚጀምር ያቀናብራሉ። በ«ተጨማሪ» ስር፦ ምዕራፍ ሲያበቃ የማያ ገጽ ብልጭታ ወይም የፊት መብራት ብልጭ ድርግም፣ እና ዕለታዊ ግብ።"
