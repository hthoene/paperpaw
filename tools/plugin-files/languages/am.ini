dictionary.plugin.name = መዝገበ ቃላት
dictionary.plugin.description = ቃላትን በ StarDict መዝገበ ቃላት ውስጥ ይፈልጋል።
dictionary.plugin.how = "መዝገበ ቃላቱ ከመጽሐፍ ቃልን በ StarDict መዝገበ ቃላት ውስጥ ይፈልጋል እና ትርጓሜዎቹን ከማያ ገጹ የታችኛው ክፍል በላይ በሚወጣ ፓነል ውስጥ ያሳያል።\n\nበአንባቢው ውስጥ ቃልን ይያዙ እና «ቃሉን ፈልግ» ን ይምረጡ፤ በአዝራሮች በ«ተጨማሪ» ስር «ጽሑፍ ምረጥ» ን ይጠቀሙ። የመዝገበ ቃላት አቃፊዎችን (ከ .ifo፣ .idx እና .dict ፋይሎች ጋር) ንዑስ አቃፊዎችን ጨምሮ በመሣሪያው ላይ ወዳለው «dictionaries» አቃፊ ይቅዱ፣ ወይም በቅንብሮች ውስጥ በንባብ ስር «የመዝገበ ቃላት አቃፊ» (የላቀ ቅንብር) ሌላ አቃፊ ይምረጡ። የመጀመሪያው ፍለጋ ለእያንዳንዱ መዝገበ ቃላት ትንሽ ማውጫ ያዘጋጃል፤ ይህም ጥቂት ጊዜ ይወስዳል።\n\nበፓነሉ ውስጥ የገጽ አዝራሮች ወይም ወደ ላይ እና ወደ ታች ረጅም ትርጓሜዎችን ያሸብልላሉ፣ ተመለስ ደግሞ ይዘጋዋል። በንክኪ ለመዝጋት ከውጭው ይንኩ።"
