setup.plugin.description = በመጀመሪያ ጅምር ላይ አስፈላጊ በሆኑ ቅንብሮች የሚመራ አጭር መመሪያ።
setup.plugin.how = "ማዋቀር PaperPaw ለመጀመሪያ ጊዜ ሲጀምር አንድ ጊዜ የሚታይ አስፈላጊ በሆኑ ቅንብሮች የሚመራ አጭር መመሪያ ነው። እያንዳንዱ ገጽ አንድ ነገር ይጠይቃል፣ ለምሳሌ ቋንቋውን፣ አዝራሮቹን፣ የጽሑፍ መጠኑን፣ የሰዓት ሰቁን፣ Wi-Fi ን ወይም ለመጨመር ጥቂት ተሰኪዎችን፤ ምክንያታዊ መልስ አስቀድሞ ተመርጦ፤ ስለዚህ «ቀጣይ» ሁልጊዜ ትክክል ነው። ይህ መሣሪያ የማይፈልጋቸው እርምጃዎች ይተዋሉ።\n\nአዝራሮቹን ይንኩ፣ ወይም የላይ እና የታች አዝራሮችን እና ምረጥን ይጠቀሙ። በመጀመሪያው ገጽ ላይ «ዝለል» ማዋቀሩን ወዲያው ይተዋል። የመጨረሻው ገጽ መጻሕፍትዎ ከየት እንደሚመጡ ይነግራል።\n\nእንደገና ለማስኬድ ቅንብሮቹን ይክፈቱ እና «PaperPaw ን አዋቅር» ን ይምረጡ። እዚህ የተመረጠው ሁሉ በኋላ በቅንብሮች ውስጥ ሊቀየር ይችላል።"
