wifi.plugin.name = Wi-Fi
wifi.plugin.description = ሲያስፈልግ ከ Wi-Fi አውታረ መረቦች ጋር ይገናኛል እና በኋላ ሬዲዮውን ያጠፋል።
wifi.plugin.how = "Wi-Fi ተሰኪ በይነመረብ ሲፈልግ (ካታሎግ፣ ማመሳሰል፣ ስቶሩ፣ ማስተላለፍ) ከአውታረ መረብ ጋር ይገናኛል፤ ምንም ነገር ካልተጠቀመበት ከአንድ ደቂቃ በኋላ፣ ወይም መነሻ ወይም መጽሐፍ ሲታይ ወዲያው፣ ባትሪ እና ማህደረ ትውስታ ለመቆጠብ ሬዲዮውን እንደገና ያጠፋል።\n\nWi-Fi ን ከቅንብሮች፣ ወይም ከሁኔታ መስመሩ የ Wi-Fi ንጥል ይክፈቱ። «አውታረ መረቦች» በሚደረስበት ያሉትን ይዘረዝራል፤ አንዱን ይምረጡ እና የይለፍ ቃሉን ይጻፉ፣ ወይም «በስልክ አዋቅር» ን ይምረጡ እና ስሙን እና የይለፍ ቃሉን በመሣሪያው ላይ ከመጻፍ ይልቅ በስልክዎ አሳሽ ይጻፉ። «እርሳ» የተቀመጠ አውታረ መረብን ያስወግዳል።\n\nየይለፍ ቃሎቹ በካርዱ ላይ በደህና ይቀመጣሉ እና ከዚያ በኋላ ፈጽሞ አይታዩም። በ«ሲያስፈልግ ተገናኝ» ስር Wi-Fi ከመጨረሻው አጠቃቀሙ በኋላ ምን ያህል እንደሚቆይ፣ በሚሞላበት ጊዜ እንደሚቆይ፣ እና ብዙ በሚደረስበት ከተቀመጡት አውታረ መረቦች የትኛው መጀመሪያ እንደሚሆን ያቀናብራሉ።"
