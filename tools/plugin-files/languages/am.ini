notes-vault.plugin.description = የ Markdown ማስታወሻዎች አቃፊን በአቃፊዎች፣ መሰየሚያዎች እና የመጨረሻ ለውጦች ያነባል፤ ከመነሻ ማያ ገጽ ዊጀቶች ጋር። ከ Obsidian ካዝናዎች ጋር ይሠራል።
notes-vault.plugin.how = "የማስታወሻ ካዝና የ Markdown ማስታወሻዎች አቃፊን (ተራ .md ፋይሎች፣ የማስታወሻ መተግበሪያዎች እንደሚይዟቸው) ያነባል። ከ Obsidian ካዝናዎች ጋር ይሠራል።\n\nየካዝናውን አቃፊ በቅንብሮች ውስጥ ወይም በመሣሪያዎች ውስጥ በካዝናው ገጽ ላይ ይምረጡ። ከዚያ ገጹ አቃፊዎቹን በካርዱ ላይ እንዳሉ፣ በመጨረሻ የተለወጡ ማስታወሻዎችን፣ መሰየሚያዎቹን እና በማስታወሻዎቹ ርዕሶች ውስጥ ፍለጋ ያቀርባል።\n\nለመጀመሪያ ጊዜ ካዝናው ገጹ ክፍት ሳለ በጀርባ ይጠቆማል፤ የሺዎች ማስታወሻዎች ካዝና ጥቂት ደቂቃዎችን ይወስዳል፤ ከዚያ ወዲያው ይከፈታል። ማውጫው በካርዱ ላይ ይቀመጣል እና የካዝናው ገጽ ከጥቂት ሰዓታት በኋላ ሲከፈት፣ ወይም «አዘምን» ሲመርጡ እንደገና ይሠራል።\n\nማስታወሻ በአንባቢው ውስጥ ይከፈታል። ወደ ሌሎች ማስታወሻዎች አገናኞች ([[Note]]፣ [[Note|words]]፣ [[Note#Heading]]) በማስታወሻው ስም በካዝናው ውስጥ በየትኛውም ቦታ ይገኛሉ፤ አንዱን መከተል ያንን ማስታወሻ ይከፍታል፣ ተመለስ ደግሞ ወደ ቀዳሚው ማስታወሻ ይመልሳል።\n\nበካዝናው ውስጥ ምንም ፈጽሞ አይለወጥም። ለመነሻ ማያ ገጽ ዊጀቶቹ (የቅርብ ጊዜ ማስታወሻዎች፣ የተሰካ ማስታወሻ፣ የቀኑ ማስታወሻ፣ በዘፈቀደ ማስታወሻ፣ መሰየሚያዎች፣ ፍለጋ) በመነሻ ማያ ገጹ አርታዒ ውስጥ ይጨመራሉ። ዊጀት ማስታወሻዎቹን ከአንድ አቃፊ ብቻ ሊወስድ ይችላል፦ የአቃፊውን መንገድ ከካርዱ ስር (ለምሳሌ Notes/Work) በዊጀቱ ቅንብሮች ውስጥ ይጻፉ፤ ባዶ ከተተወ የካዝናውን ሁሉንም ማስታወሻዎች ይወስዳል።"
