menu-editor.plugin.how = "የምናሌ አርታዒ ምናሌዎቹ የያዙትን ይቀይራል፦ ግቤቶችን ወደ ላይ ወይም ወደ ታች ያንቀሳቅሱ፣ ያስወግዷቸው፣ ወይም አዳዲሶችን ይጨምሩ።\n\nበቅንብሮች ውስጥ በ«ማበጀት» ስር እንደ «ምናሌዎችን አብጅ» ያገኙታል። ምናሌ ይምረጡ፤ ከዚያ ለማንቀሳቀስ ወይም ለማስወገድ ግቤት ይምረጡ፤ «ግቤት ጨምር» አዲስ ያስገባል። ለውጦች ወዲያው ይሠራሉ። «ይህን ምናሌ ዳግም አስጀምር» ምናሌን ተሰኪዎቹ ወደሚወስኑት ይመልሳል፣ «ሁሉንም ምናሌዎች ዳግም አስጀምር» ለሁሉም እንዲሁ ያደርጋል።\n\nራስዎን መቆለፍ አይችሉም፦ ወደ ቅንብሮች የሚወስደው መንገድ የሆነ ግቤት ሌላ መንገድ እስኪጨምሩ ድረስ ይቆያል።"
