koreader.plugin.name = ማድመቂያዎች መጋራት
koreader.plugin.description = በሁለቱም ለሚነበቡ መጻሕፍት ዕልባቶችን እና ማድመቂያዎችን ከ KOReader ጋር ይጋራል።
koreader.plugin.how = "ይህ ተሰኪ በሁለቱም ለሚያነቧቸው መጻሕፍት፣ በአንድ መሣሪያ ላይ ወይም በመሣሪያዎች መካከል በሚመሳሰል የቤተ-መጻሕፍት አቃፊ ውስጥ፣ ዕልባቶችን እና ማድመቂያዎችን ከ KOReader ጋር ይጋራል። ምንም የሚያዘጋጁት ነገር የለም።\n\nPaperPaw KOReader ደግሞ የከፈተውን መጽሐፍ ሲከፍት፣ እና ዕልባቶቹን ወይም ማድመቂያዎቹን ሲቀይሩ፣ ከመጽሐፉ አጠገብ ካለው የ KOReader ውሂብ አዲሱን ይወስዳል፤ እዚህ አዲስ የሆነውን ደግሞ KOReader መጽሐፉን በሚቀጥለው ጊዜ ሲከፍት እንዲወስደው ይተዋል። የተወገዱ ምልክቶች እና የተለወጡ ማስታወሻዎችም ያልፋሉ።\n\nይህ ለ EPUB መጻሕፍት ብቻ ይሠራል። የአንድ ወገን ፋይል ሊነበብ ካልቻለ እስኪችል ድረስ በሁለቱም ወገን ምንም አይለወጥም።"
koreader.removed-there = የ KOReader ፋይል ከዚህ በኋላ ምንም ማድመቂያ የለውም። እዚህም ይወገዱ?
koreader.removed-there.text = በ KOReader ውስጥ ተወግደው ሊሆን ይችላል፣ ወይም ፋይሉ ከሌላ መሣሪያ መጥቶ ሊሆን ይችላል። «አቆይ» እዚህ ይተዋቸዋል እና እንደገና ለ KOReader ይሰጣቸዋል።
