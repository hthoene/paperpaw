puzzles.plugin.how = "ለባቡር እና ለመጠበቂያ ክፍል እንቆቅልሾች፣ ሁሉም ከመስመር ውጭ፦ ሱዱኩ፣ የቃላት እንቆቅልሾች እና የቼዝ እንቆቅልሾች። እንቆቅልሾችን ከመሣሪያዎች ምናሌ ይክፈቱ፣ ወይም የ«የቀኑ እንቆቅልሽ» ዊጀትን ወደ መነሻ ማያ ገጽ ይጨምሩ (መነሻ ማያ ገጹን ይያዙ፤ ከዚያ ዊጀት ይጨምሩ)፦ የዛሬው ሱዱኩ ምን ያህል እንደተሠራ ያሳያል፣ መንካትም ይከፍተዋል። የቀኑ ሱዱኩ ቀኑን ሙሉ ያው ነው።\n\nሱዱኩ፦ ግራ እና ቀኝ ጠቋሚውን ካሬ በካሬ ያንቀሳቅሳሉ፣ ወደ ላይ እና ወደ ታች (የገጽ አዝራሮች) በረድፍ። ምረጥ አኃዞቹን ይከፍታል፦ አንዱን ይምረጡና ለማስገባት እንደገና ምረጥ፣ ወይም ካሬውን ባዶ ለማድረግ «አጽዳ»። ከሰሌዳው በታች ወዳሉት አዝራሮች ለመድረስ ምረጥን (ወይም ምናሌን) ይያዙ፦ «ማስታወሻዎች» አኃዞቹን የእርሳስ ምልክቶች ያደርጋል፣ «ፈትሽ» የተሳሳቱ ካሬዎችን ምልክት ያደርጋል፣ «ቀልብስ» የመጨረሻውን እንቅስቃሴ ይመልሳል፣ «አዲስ» የመረጡት ደረጃ (ቀላል፣ መካከለኛ፣ ከባድ) እንቆቅልሽ ይጀምራል። እያንዳንዱ እንቆቅልሽ በትክክል አንድ መፍትሔ አለው። ጨዋታው ሲወጡ ይቀመጣል። በንክኪ ማያ ገጽ ላይ ካሬ ይንኩ።\n\nየቃላት እንቆቅልሾች፦ .puz (Across Lite) ወይም .ipuz ፋይሎችን በሜሞሪ ካርዱ ላይ ወዳለው «puzzles» አቃፊ ያስቀምጡ፤ ምንም አልተካተተም። በፍርግርጉ ላይ ይንቀሳቀሱ፤ ከዚያ ከጠቋሚው ስር ያለውን ቃል በኪቦርዱ ለመጻፍ ምረጥ (የታች ሰረዝ ካሬን ባዶ ይተዋል)። አዝራሮቹ አግድም እና ቁልቁልን ይቀያይራሉ፣ የፍንጮች ዝርዝርን ያሳያሉ፣ ፊደላቱን ይፈትሻሉ እና ቃሉን ይገልጣሉ። ፊደላቱ ለእያንዳንዱ ፋይል ይቀመጣሉ። የተበጠበጡ .puz ፋይሎች ሊከፈቱ አይችሉም።\n\nየቼዝ እንቆቅልሾች፦ ከ Lichess እንቆቅልሽ ዳታቤዝ (CC0) ትንሽ ስብስብ። ግራ እና ቀኝ ከቁራጭ ወደ ቁራጭ ይዘላሉ፤ ለማንቀሳቀስ የሚፈልጉትን ቁራጭ ይምረጡ፣ ከዚያ ግራ እና ቀኝ ወደሚችልባቸው ቦታዎች፣ እና እንደገና ምረጥ። የተሳሳተ እንቅስቃሴ ይመለሳል። «ፍንጭ» የሚንቀሳቀሰውን ቁራጭ ምልክት ያደርጋል፣ «ቀጣይ» ወደ ቀጣዩ እንቆቅልሽ ይሄዳል።\n\nሰሌዳው የሚለወጡትን ካሬዎች ብቻ እንደገና ይስላል። «ስታቲስቲክስ» የፈቷቸውን እንቆቅልሾች ይቆጥራል።"
