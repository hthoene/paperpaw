dictionary.plugin.name = Сөздік
dictionary.plugin.description = StarDict сөздіктерінен сөздерді іздейді.
dictionary.plugin.how = "Сөздік кітаптағы сөзді StarDict сөздіктерінен іздейді және анықтамаларды экранның төменгі бөлігіндегі панельде көрсетеді.\n\nОқу құралында сөзді басып тұрып, «Сөздіктен қарау» таңдаңыз; түймелермен «Тағы» ішіндегі «Мәтінді таңдау» пайдаланыңыз. Сөздік қалталарын (.ifo, .idx және .dict файлдарымен) құрылғыдағы «dictionaries» қалтасына, ішкі қалталарымен қоса көшіріңіз немесе Параметрлерде, «Оқу» бөлімінде, «Сөздік қалтасы» ретінде басқа қалтаны таңдаңыз (қосымша параметр). Бірінші іздеу әр сөздік үшін шағын индекс дайындайды, бұл бір сәт алады.\n\nПанельде бет түймелері немесе «Жоғары» және «Төмен» ұзын анықтамаларды айналдырады, ал «Артқа» оны жабады. Сенсормен оны жабу үшін одан тыс жерге түртіңіз."
