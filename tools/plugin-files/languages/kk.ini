transfer.plugin.name = Тасымалдау
transfer.plugin.description = Кітаптар мен басқа файлдарды құрылғыға сол желідегі браузерден салады.
transfer.plugin.how = "Wi-Fi арқылы тасымалдау кітаптар мен басқа файлдарды кабельсіз және қолданбасыз сол желідегі браузерден құрылғыға салады. Сондай-ақ файлдарды алуға, қалталар жасауға және жоюға болады.\n\nОны «Құралдардан» ашыңыз. Экран мекенжайды мәтін және QR коды ретінде көрсетеді: оны телефондағы немесе компьютердегі браузерде ашыңыз немесе кодты сканерлеңіз. Мекенжайда әр жолы жаңадан жасалатын кілт бар, сондықтан желідегі басқалар файлдарыңызға қол жеткізе алмайды. Тасымалдау экран ашық тұрғанда жұмыс істейді.\n\nPaperPaw Wi-Fi-ды өзі іске қосатын жерде, мысалы, X4-те, төменгі жақтағы «Роутерсіз» құрылғының өз желісін ашады, оған телефон кодты сканерлеу арқылы қосылады."
