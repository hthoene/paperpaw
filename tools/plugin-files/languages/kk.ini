profiles.plugin.name = Оқу профильдері
profiles.plugin.description = Оқу және көрсету параметрлерінің аталған жиынтықтары, бір түртумен ауысады.
profiles.plugin.how = "Профиль оқу параметрлеріңізді, көрсету параметрлеріңізді және күй жолдарыңызды «Түн» немесе «Үлкен қаріп» сияқты атпен сақтайды және оларды бір түртумен қайтарады.\n\n«Профильдерді» оқу мәзірінде «Тағы» бөлімінен немесе Параметрлерде «Теңшеу» бөлімінен ашыңыз. Қолдану үшін профильге түртіңіз; қолданыстағысы белгіленген. Қазіргі параметрлерді оған сақтау, атын өзгерту немесе жою үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз). «Жаңа профиль ретінде сақтау» қазір орнатылғанды сақтайды.\n\n«Келесі профиль» тізімдегі келесісіне ауысады; оны түймеге немесе ережеге қойыңыз."
