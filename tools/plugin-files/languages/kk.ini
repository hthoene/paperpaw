translate.plugin.description = Таңдалған мәтінді DeepL арқылы онлайн аударады.
translate.plugin.how = "«Аударма» таңдалған мәтінді DeepL арқылы онлайн аударады. Кітаптағы мәтінді таңдап, таңдалған мәтін мәзірінде «Аудару» таңдаңыз: аударма беттің үстінде сөздік жазбасы сияқты пайда болады. Бет түймелері немесе түртулер оны айналдырады, ал «Таңдау» немесе оның соңындағы түрту оны жабады.\n\nОған желі және өз DeepL API кілтіңіз қажет, ол deepl.com сайтында тегін (DeepL API Free, айына шамамен 500 000 таңба). Оны енгізбейінше, панель бұл туралы айтады, ал түрту оны сұрайды.\n\nПараметрлерде, «Оқу» бөлімінде, «Аударма» тарауында «Аудару тілі» тілді орнатады; алғашында ол PaperPaw-дың өз тілі."
