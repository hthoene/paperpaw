reading-goal.plugin.name = Оқу мақсаты
reading-goal.plugin.description = Күніне оқитын минуттар және басты экранда бүгінгі оқуға қарай көңіл-күйі өзгеретін мысық.
reading-goal.plugin.how = "Басты экраныңыздағы мысық бүгінгі оқудың қалай жүріп жатқанын көрсетеді: әлі оқымағанша мұңды, аздан кейін орташа, күндік мақсаттың жартысынан бастап көңілді, оған жеткенде қуанышты.\n\n«Оқу мысығы» виджетін басты экранға қосыңыз (басты экранды басып тұрыңыз, сосын виджет қосыңыз) немесе ұйқы экраны ретінде «Бүгінгі оқу мысығын» таңдаңыз. Мысыққа түрту күндік мақсатты ашады; бұл оқыған минуттарыңызды санайтын оқу статистикасының мақсаты.\n\nПараметрлерде, «Оқу» бөлімінде «Көңілді болатын деңгей» және «Қуанышты болатын деңгей» мысықтың мақсаттың қай үлесінен бастап көңілді немесе қуанышты болатынын, ал «Өз суреттерім» мысықтардың орнына көрсетілетін суреттер қалтасын (мұңды, орташа, көңілді және қуанышты) орнатады. Суреттер PNG немесе JPEG файлдары; қалта болмаса, мысықтар көрсетіледі."
