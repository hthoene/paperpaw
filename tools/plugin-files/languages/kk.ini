aids.plugin.name = Оқу көмекшілері
aids.plugin.description = Қою сөз басы, ауыстырылған сөздер, суреттер: мәтін өзіңіз қалағандай.
aids.plugin.how = "Оқу көмекшілері оқу кезінде кітап мәтінінің көрінісін өзгертеді. Олар әр кітапқа қолданылады. «Сөз басын қою ету» мен «Сөздерді ауыстыру» алғашында өшірулі.\n\nОларды Параметрлерден, «Оқу» бөліміндегі «Оқу көмекшілері» тарауынан табасыз. «Сөз басын қою ету» әр сөздің бірінші жартысын қою етіп салады, бұл кейбіреулерге оқуды жеңілдетеді. «Сөздерді ауыстыру» үтірлі нүктемен бөлінген «жүйе = система; сағат = час» сияқты жұптарды қабылдайды.\n\nТек бүтін сөздер дәл өзіңіз жазғандай ауыстырылады, сондықтан ұзынырақ сөздің бір бөлігі өзгермейді. Кітап файлының өзі өзгертілмейді.\n\nКітаптағы суреттерді көрсетуге (алғашқыдай), сурет сипаттамасын пайдаланатын «[Сурет: теңіздегі кеме]» сияқты қысқа жолға айналдыруға немесе мүлде жасыруға болады. Сонда беттегі мәтінге көбірек орын қалады, ал көрсетілмейтін сурет үшін ештеңе декодталмайды, бұл беттің тезірек аударылуына септігін тигізеді. Комикстер мен суреттерден тұратын басқа кітаптар өзгертілмейді."
