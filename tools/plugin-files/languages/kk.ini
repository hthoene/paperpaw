smart-home.plugin.name = Ақылды үй
smart-home.plugin.description = Өз Home Assistant-ыңыздағы мәндер мен ауыстырғыштар панельде және басты экран виджеттері ретінде. Үй желісіндегі Home Assistant-пен жұмыс істейді.
smart-home.plugin.how = "«Ақылды үй» өз Home Assistant-ыңыздағы мәндер мен ауыстырғыштарды көрсетеді: температура, ылғалдылық, энергия, есіктер мен терезелер, шамдар, ауыстырғыштар және сахналар. Ол сервермен үй желісіндегі REST API арқылы сөйлеседі; ештеңе басқа қызмет арқылы өтпейді.\n\n«Ақылды үйді» құралдар мәзірінен, сосын «Байланыс» бөлімін ашыңыз: Home Assistant мекенжайын (мысалы, http://homeassistant.local:8123) және ұзақ мерзімді қолжетімділік токенін енгізіңіз (оны Home Assistant профиль бетінің төменгі жағында жасаңыз). Токен құпиясөздер мен кілттердің арасында сақталады, ешқашан параметрлер файлында емес. Қарапайым http тек үй желісіндегі мекенжайлар үшін қолданылады; басқа жердегі сервер үшін параметрлерде «Үй желісінен тыс серверлерді» қосып, жарамды сертификаты бар https пайдаланыңыз.\n\n«Нысандарды таңдау» серверіңізде бар нәрселер тізімін ашады: аты немесе идентификаторы бойынша іздеп, нысанды көрсету үшін таңдаңыз (оны алып тастау үшін қайта таңдаңыз). Оған бөлме беруге болады, ол оны панельде және бөлме виджеттерінде топтайды. 24 нысанға дейін сақталады. Панельде шамды, ауыстырғышты немесе сахнаны ауыстыру үшін оны таңдаңыз: жол сервер жауабын көрсетеді. Таңдаған датчигіңіз қайта оқылады.\n\nВиджеттер (басты экранды басып тұрыңыз, сосын виджет қосыңыз): «Ақылды үй мәні» бір көрсеткішті үлкен көрсетеді, топ бөлме нысандарын тізімдейді, ауыстырғыш бір шам не ауыстырғышқа арналған түйме, ал бөлме — бөлменің көрсеткіштері мен ауыстырғыштары бар карточка. Әр виджеттің параметрлері ол қай нысанды немесе бөлмені көрсететінін айтады.\n\nҮй панельді ашқанда, сұраған кезде («Жаңарту» жолы немесе мән не топ виджетіне түрту), оқу құралы Wi-Fi қосулы жерде оянғанда және зарядтағыш қосулы кезде орнатқан кестеңіз бойынша оқылады. Ол радионы өздігінен ешқашан қоспайды және ешқашан қосулы ұстамайды."
