format-cbz.setting.panels.help = Бір уақытта бір панель, бет аудару олар арқылы жүреді.
format-docx.plugin.name = DOCX құжаттары
format-docx.plugin.description = Word және басқа бағдарламалар сақтаған .docx файлдарын ашады.
format-docx.plugin.how = "DOCX құжаттарын кітап ретінде ашады: мазмұны бар тақырыптар, тізімдер, кестелер, қою және көлбеу мәтін, сілтемелер және суреттер (JPEG, PNG, GIF).\n\nФайлдарды кітапхана қалтасына қойып, кітапханадан ашыңыз. Атауы мен авторы құжат сипаттарынан алынады. Түсіндірмелер, жоғарғы және төменгі колонтитулдар және пікірлер көрсетілмейді."
format-docx.title = DOCX құжаты
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB кітаптарын стильдерімен, мазмұнымен және суреттерімен ашады.
format-epub.plugin.how = "EPUB кітаптары кітапханадан кез келген басқа кітап сияқты, мазмұнымен, суреттерімен және баспа стильімен ашылады. Веб-беттер (HTML), Markdown, FictionBook (.fb2) және комикс мұрағаттары (.cbz) дәл солай ашылады, әрқайсысы өз плагині ретінде.\n\nТарау бірінші рет ашқанда түрлендіріледі және плагин кэшінде сақталады, сондықтан кейін ол тезірек ашылады және үлкен кітаптар шағын құрылғыларда да жұмыс істейді. Мазмұнды оқу мәзіріндегі «Мазмұн» бөлімінен табасыз. Кітаптың өз стилінің қолданылатыны-қолданылмайтыны — «Оқу» бөліміндегі «Баспа пішімдеуі» параметрі."
format-epub.title = EPUB электрондық кітабы
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook кітаптарын (.fb2, ZIP-пен де) ашады.
format-fb2.plugin.how = "Орыс және басқа тілдердегі кітаптарға тән FictionBook кітаптарын (.fb2), ZIP-пен де (.fb2.zip), атауымен, авторларымен, мұқабасымен және тарауларымен ашады.\n\nОларды кітапхана қалтасына қойыңыз; олар кітапханада көрсетіледі және кез келген басқа кітап сияқты ашылады."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Файл ретінде сақталған веб-беттерді ашады, тек оқылатын нәрсені көрсетеді.
format-html.plugin.how = "Файл ретінде сақталған веб-беттерді (.html, .htm, .xhtml) кітап ретінде ашады: тек оқуға арналған нәрсені, айналасындағы мәзірлерсіз, жарнамасыз және соған ұқсастарсыз.\n\nФайлды кітапхана қалтасына қойып, кез келген кітап сияқты кітапханадан ашыңыз. Беттегі сілтемелер жұмыс істейді; суреттер файлда тұрған жерінде көрсетіледі."
format-html.title = Веб-бет (HTML)
format-images.plugin.name = Суреттер
format-images.plugin.description = Суреттерді (.jpg, .png, .gif) кітап ретінде ашады, әр суретке бір бет.
format-images.plugin.how = "Суреттер (.jpg, .png, .gif) кітапханадан кітап сияқты ашылады, бір бетке бір сурет, экранға сыйдырылған.\n\nСуреттері бар бүкіл қалтаны оқу үшін оның бірінші суретін ашыңыз: қалтадағы одан кейінгі суреттер атауларының реті бойынша (2 саны 10-нан бұрын) жалғасады. Қалтаның кейінірек тұрған суреті сол жерден басталады; әр суреттегі орын бөлек есте сақталады. Ашқан суреттен бастап 300-ге дейінгі суреті бар қалта оқылады.\n\nСурет емес немесе тым үлкен файл оның орнына өз атын көрсетеді. Өз атауы бар көп суретті кітап үшін комикс мұрағаты (.cbz) жақсырақ пішім."
format-images.title = Сурет
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown файлдарын (.md), мысалы, жазбаларды ашады.
format-markdown.plugin.how = "Markdown файлдарын (.md), мысалы, жазбаларды кітап ретінде ашады: тақырыптар, тізімдер, дәйексөздер және екпін таңбалар емес, көзделгендей көрсетіледі.\n\nФайлдарды кітапхана қалтасына қойып, кітапханадан ашыңыз. Бірінші тақырып оның атауы болады; файлдың қасындағы суреттер мәтін атаған жерде көрсетіледі."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI кітаптары
format-mobi.plugin.description = DRM-сыз .mobi және .azw файлдарын ашады.
format-mobi.plugin.how = "MOBI кітаптары (.mobi, .azw) кітапханадан кез келген кітап сияқты, ешқандай баптаусыз ашылады. Атауы, авторлары, тілі және мұқабасы кітаптан алынады, ал мазмұн тізімі оның тақырыптарынан жасалады.\n\nКітап бірінші рет ашқанда түрлендіріледі, бұл ұзын кітап үшін бірнеше секунд алады; содан кейін ол бірден ашылады. Мәтін, тақырыптар, қою және көлбеу мәтін, сілтемелер және суреттер көрсетіледі.\n\nDRM-ы бар кітаптар (дүкеннен сатып алынған кітаптардың көпшілігі), сондай-ақ Huffman қысуы бар немесе жаңа KF8 пішіміндегі (.azw3) кітаптар ашылмайды: оларды ашқанда PaperPaw бұл туралы айтады. Calibre сияқты құралмен жасалған EPUB көшірмесі әрдайым ашылады."
format-mobi.title = MOBI кітаптары
format-rtf.plugin.name = RTF құжаттары
format-rtf.plugin.description = .rtf файлдарын кітап ретінде ашады.
format-rtf.title = RTF құжаттары
format-txt.plugin.name = Қарапайым мәтін
format-txt.plugin.description = Қарапайым мәтін файлдарын (.txt) ашады.
format-txt.plugin.how = "Қарапайым мәтін файлдары (.txt) кітапханадан кез келген кітап сияқты, ешқандай баптаусыз ашылады. Плагин UTF-8, UTF-16 және Windows-1252 мәтінін оқиды және кодтауды өзі анықтайды.\n\nАбзацтар файлдағы бос жолдарға сүйенеді; егер файлда олар болмаса, әр жол абзац болады. Project Gutenberg файлдарында басы мен соңындағы лицензия мәтіні өткізіліп, атауы мен авторы тақырыптан алынады.\n\nФайл ешқашан бүтін жүктелмейді, сондықтан өте үлкен мәтіндер шағын құрылғыларда да ашылады."
format-txt.title = Қарапайым мәтін
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Xteink оқу құралдарының алдын ала салынған беттері — XTC және XTCH кітаптарын ашады.
format-xtc.plugin.how = "XTC және XTCH файлдары — беттері сурет ретінде алдын ала салынған кітаптар, оларды Xteink оқу құралдарына арналған түрлендіргіштер жасайды. Олар кітапханадан кез келген кітап сияқты ашылады.\n\nӘр бет бекітілген сурет болғандықтан, мәтіннің өлшемін өзгертуге немесе басқа қаріппен көрсетуге болмайды. Беттер қара-ақ немесе төрт сұр реңкті. Әр бет көрсетілгенде декодталады, сондықтан жад аз қажет, X4-те де.\n\nАтауы, авторы және тарауларына қатысты файлда болса, олар файлдан алынады."
format-xtc.title = XTC беттері
help.plugin.name = Кеңестер
help.plugin.description = Экран бірінші рет ашылғанда оның басқару элементтерінің не істейтінін көрсетеді.
help.plugin.how = "Экран бірінші рет ашылғанда, оның үстіндегі қысқа ескертпе басқару элементтерінің не істейтінін айтады: түрту әсер ететін экран бөліктері жиекпен белгіленеді, сондай-ақ түймелердің не істейтіні көрсетіледі.\n\nТүрту немесе кез келген түйме ескертпені жабады, ол сол экран үшін қайта шықпайды. «Кеңестер көрсетілмесін» барлығын өшіреді.\n\nПараметрлерде, «Жүйе» бөлімінде «Кеңестер» оларды қосады немесе өшіреді, ал «Кеңестерді қайта көрсету» әр экранның ескертпесін тағы бір рет көрсетеді."
help.title = Мұнда бұл қалай жұмыс істейді
help.got-it = Түсінікті
help.no-more = Кеңестер көрсетілмесін
