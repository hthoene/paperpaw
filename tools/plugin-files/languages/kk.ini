files.plugin.name = Файл шолғышы
files.plugin.description = Құрылғыдағы кітаптар мен қалталарды тізімдеп, оларды ашады.
files.plugin.how = "Кітапхана кітапхана қалтасындағы кітаптарды тізімдейді, әрқайсысын мұқабасымен, атауымен, авторымен және қаншалықты оқылғанымен көрсетеді. Соңғы оқылған кітап жоғарыда карточка болып тұрады, сондықтан оқуды жалғастыру үшін бір түрту немесе «Таңдау» түймесін бір басу жеткілікті. Кітапхана кітаптарды іздеп жатқанда, әзірге қанша кітап тапқанын айтады.\n\nКітаптардың үстінде нені көрсету керектігін таңдаңыз: барлығын, оқып жатқандарды, оқылмағандарды немесе оқылғандарды не сөрелерді (автор, топтама, тег, таңдаулылар, бастаған әр топтаманың келесі кітабы бойынша). Кітапты оқу үшін оған түртіңіз; оны ашу, оқылды немесе оқылмады деп белгілеу, ақпаратын көру, мұрағатқа жылжыту немесе жою үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз). Кітапхана мәзірі үшін атауға түртіңіз: кітаптардың сұрыпталуы мен көрсетілуі, іздеу, кітапхана қалтасы және параметрлер.\n\nКітапхана қалтасы Параметрлерде, «Кітапхана» бөлімінде, «Кітапхана қалтасы» ретінде орнатылады; сонда кітаптарды мұқабалар торы ретінде де көрсетуге болады. Басқа файлдар үшін «Құралдар» мәзіріндегі «Файлдарды» пайдаланыңыз."
