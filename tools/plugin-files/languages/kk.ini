wifi.plugin.name = Wi-Fi
wifi.plugin.description = Қажет болғанда Wi-Fi желілеріне қосылады және одан кейін радионы өшіреді.
wifi.plugin.how = "Wi-Fi плагинге интернет қажет болғанда (каталог, синхрондау, дүкен, тасымалдау) желіге қосылады және ештеңе пайдаланбағаннан кейін бір минуттан соң немесе «Басты бет» не кітап көрсетілгенде бірден радионы батарея мен жадты үнемдеу үшін қайта өшіреді.\n\nWi-Fi-ды Параметрлерден немесе күй жолындағы Wi-Fi элементінен ашыңыз. «Желілер» қол жетімдегілерді тізімдейді; біреуін таңдап, құпиясөзін енгізіңіз немесе «Телефонмен баптау» таңдап, атауы мен құпиясөзді құрылғыда емес, телефоныңыздың браузерінде теріңіз. «Ұмыту» сақталған желіні жояды.\n\nҚұпиясөздер картада қауіпсіз сақталады және ешқашан қайта көрсетілмейді. «Қажет болғанда қосылу» бөлімінде Wi-Fi соңғы пайдаланудан кейін қанша уақыт қосулы тұратынын, зарядтау кезінде қосулы қалатынын және бірнеше желі қол жетімді болғанда қай сақталған желінің бірінші болатынын орнатасыз."
