format-cbz.plugin.name = Комикстер
format-cbz.plugin.description = Комикс мұрағаттарын (.cbz) ашады, бір бетке бір сурет.
format-cbz.plugin.how = "Комикс мұрағаттарын (.cbz) ашады: бір бетке бір сурет, экранға сыйдырылған, атауларының реті бойынша (2 саны 10-нан бұрын).\n\nОларды кітапхана қалтасына қойып, кітапханадан ашыңыз; беттерді кез келген кітаптағыдай аударыңыз. Үлкен суреттер бірінші рет бір сәт алады, X4-те басқа жерлерге қарағанда көбірек.\n\nОқу параметрлері (Параметрлер, Оқу): «Панельдеп» беттің бір панелін экран мүмкіндік бергенше үлкен етіп көрсетеді, ал бет аудару олар арқылы жүреді; панельсіз бет бүтін көрсетіледі. «Комикс беттерінің бағыты» манга үшін бет аударуды айналады (оңнан солға); кітаптың өз ComicInfo.xml файлы мұны өзі айтады. Кітапхана кітаптың атауын және ComicInfo.xml-дегі топтамасы мен нөмірін көрсетеді."
