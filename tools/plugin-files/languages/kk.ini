file-manager.plugin.name = Файл менеджері
file-manager.plugin.description = Құрылғыдағы әр қалта мен файл: оларды ашу, атын өзгерту, жылжыту, көшіру және жою.
file-manager.plugin.how = "Файл менеджері тек кітаптарыңызды ғана емес, құрылғы жадындағы әр қалта мен файлды көрсетеді және оларды ашуға, атын өзгертуге, жылжытуға, көшіруге, жоюға және жаңа қалталар жасауға мүмкіндік береді.\n\n«Файлдарды» «Құралдар» мәзірінен ашыңыз. Қалтаға кіру үшін оған түртіңіз; «Артқа» жоғарғы қалтаға өтеді. Файлмен не істеуге болатынын көру үшін файлға түртіңіз немесе кез келген жазбаны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз). «Жылжыту» мен «Көшіру» жазбаны таңдайды: ол тиісті қалтаға өтіп, төменгі жолақтағы «Осында қою» таңдаңыз. Түймелермен жолаққа жету үшін соңғы жазбадан «Төмен» басыңыз.\n\nНүктемен басталатын файлдар мен қалталар, мысалы PaperPaw-дың өз деректері, жасырылған. Оларды көру үшін Параметрлерде, «Кітапхана» бөлімінде «Жасырын файлдарды» қосыңыз."
