picture-home.plugin.name = Суретті басты экран
picture-home.plugin.description = Виджеттердің артында өз суретіңіз бар басты экран және өзіңіз баптайтын күй жолағы.
picture-home.plugin.how = "«Суретті басты экран» қосулы болғанда басты экранды ауыстырады: виджеттердің артында өз суретіңіз және өзіңіз реттейтін виджеттер мен құралдар беттері. Оны плагин менеджерінде өшірсеңіз, кірістірілген басты экран өз беттерімен қайтады.\n\nСуреттерді (JPEG, PNG немесе GIF) картадағы қалтаға салыңыз (әдепкіде wallpapers), сосын біреуін Параметрлерде, «Теңшеу», «Суретті басты экран» бөлімінде таңдаңыз. «Сыйдыру» оның экранды қалай толтыратынын айтады (толтыру, бүтін сурет, созу, түпнұсқа өлшем, плиткалау), «Орны» қай бөлігі қалатынын, «Масштаб» қаншалықты үлкен екенін, ал «Суретті ашықтау» қаншалықты бозғылт екенін: бозғылтырақ сурет виджеттерді оқуды жеңілдетеді. Сурет әр экран өлшемі үшін бір рет дайындалады, бұл бір сәт алады.\n\nВиджеттер суреттің үстіндегі тақтайшаларда тұрады. Бетті кірістірілген басты экрандағыдай реттеңіз: беттің астындағы қарындаш немесе мәзірдегі «Басты экранды өңдеу».\n\nКүй жолағы (уақыт, Wi-Fi, батарея немесе өзіңіз таңдағаныңыз) қосулы, өшірулі немесе автоматты болуы, жоғарыда немесе төменде, толық енде немесе сол жақта, ортада не оң жақта шағын таблетка ретінде, ашық, қою не сұр тақтайшада немесе суреттің өзінде болуы мүмкін. Түймелерді атайтын жол (X4-те) да қосулы, өшірулі немесе автоматты болуы мүмкін. Автоматты дегеніміз — түйме басу оларды бірнеше секундқа көрсетеді; ол басу басқа ештеңе істемейді.\n\n«Сурет салу» суреттің қалай салынатынын айтады: «Сұр деңгейлер» экранда бар барлық сұр реңкпен (X4-те баяуырақ), «Дитерлі» қара және ақ нүктелермен (жылдам) немесе «Автоматты», кірістірілген басты экран жасағандай: экран салынғанда сұр деңгейлер, бірінші өзгерістен кейін нүктелер. Экранда сұр деңгейлер болмаса, сұр деңгейлер нүктелерге ауысады."
