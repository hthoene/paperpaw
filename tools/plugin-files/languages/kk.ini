setup.plugin.name = Баптау
setup.plugin.description = Алғаш іске қосқанда маңызды параметрлер бойынша қысқа нұсқаулық.
setup.plugin.how = "«Баптау» — PaperPaw алғаш іске қосылғанда бір рет көрсетілетін, маңызды параметрлер бойынша қысқа нұсқаулық. Әр бет тіл, түймелер, мәтін өлшемі, уақыт белдеуі, Wi-Fi немесе қосатын бірнеше плагин сияқты бір нәрсені сұрайды, ақылға қонымды жауап алдын ала таңдалған, сондықтан «Келесі» әрдайым дұрыс. Бұл құрылғыға қажет емес қадамдар өткізіледі.\n\nТүймелерге түртіңіз немесе «Жоғары», «Төмен» түймелері мен «Таңдауды» пайдаланыңыз. Бірінші беттегі «Өткізу» баптаудан бірден шығарады. Соңғы бет кітаптарыңыздың қайдан келетінін айтады.\n\nОны қайта іске қосу үшін параметрлерді ашып, «PaperPaw баптау» таңдаңыз. Мұнда таңдалғанның бәрін кейін параметрлерде өзгертуге болады."
