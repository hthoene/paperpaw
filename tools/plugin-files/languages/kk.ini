keys.plugin.name = Түймелер мен ым-қимылдар
keys.plugin.description = Әр түйменің, түрту аймағының және сырғытудың не істейтіні, құрылғыда өзгертіледі.
keys.plugin.how = "«Түймелер мен ым-қимылдар» әр түйменің, түрту аймағының және сырғытудың не істейтінін көрсетеді және оны құрылғыда өзгертуге мүмкіндік береді.\n\nОны параметрлерде, «Құрылғы» бөлімінде ашыңыз. Алдымен өзгеріс қайда қолданылатынын таңдаңыз: «Барлық жерде», «Оқу кезінде», «Басты экранда», «Кітапханада» немесе бір құралда. Содан кейін басып тұрылған түйме немесе жиектен сырғыту сияқты енгізуді таңдап, ізделетін тізімнен әрекетті таңдаңыз. «Стандартты» плагиндер мен түйме орналасуы орнатқанды қайтарады.\n\nX4-те таңдауға, артқа қайтуға немесе жалғастыруға түйме қалдырмайтын өзгеріс қабылданбайды. Соңындағы «Түймелер мен ым-қимылдарды бастапқы қалпына келтіру» барлық өзгерісті қайтарады."
