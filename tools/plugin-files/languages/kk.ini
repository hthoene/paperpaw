bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Қашықтан басқару құралдарын, пернетақталарды және сенсорларды жұптастырып, қосады.
bluetooth.plugin.how = "Bluetooth қашықтан басқару құралдарын, пернетақталарды және сенсорларды оқу құралымен жұптастырады, егер онда Bluetooth болса (X4 Pro).\n\n«Құрылғы қосу» қол жетімдегі құрылғыларды іздейді; алдымен құрылғыны жұптасу режиміне қойыңыз. Оны таңдап, оқу құралында растаңыз (сан көрсетілсе, салыстырыңыз). Қашықтан басқару құралы мен пернетақтаның пернелері содан кейін беттерді аударады және мәзірлерде жылжиды; әр перненің не істейтінін «Басқару» бөлімінен өзгертіңіз.\n\n«Қашықтан басқару» олардың пернелерінің қашан жұмыс істейтінін айтады: осында қосылғанда, оқу кезінде (кітап ашық кезде қосылады, батареяны үнемдейді) немесе әрдайым. Мәзір түймесі немесе құрылғыны ұзақ басу оны ұмыттырады.\n\nСенсор плагиндерге арналған: қай плагин оны пайдалана алатынын қосыңыз. Ештеңе пайдаланбағанда Bluetooth өшірулі болады."
