weather.plugin.description = Қазіргі және алдағы күндердің ауа райы виджеттер ретінде, Open-Meteo-дан.
weather.plugin.how = "«Ауа райы» қазіргі және алдағы күндердің ауа райын басты экранға арналған виджеттер ретінде көрсетеді, Open-Meteo-дан, ол аккаунтты немесе кілтті қажет етпейді. «Қазіргі ауа райы» температураны, күйді және таңдауға болатын тағы басқаны көрсетеді; «Болжам» алдағы күндерді қатармен немесе тізіммен көрсетеді.\n\nАлдымен орынды таңдаңыз: параметрлерде, «Ауа райы», «Орын» бөлімінде (атауын теріп, табылған орындардан таңдаңыз). Тек оның координаталары жіберіледі, және тек ауа райы виджеті көрсетіліп тұрғанда. Виджеттерді басты экранды өңдеу арқылы қосыңыз.\n\nАуа райы «Ең көбі әр ... сайын жаңарту» айтқаннан жиі алынбайды және тек желі болғанда: ол Wi-Fi-ды өздігінен ешқашан қоспайды.\n\nАуа райы деректері Open-Meteo.com (https://open-meteo.com), Creative Commons Attribution 4.0 лицензиясымен (CC BY 4.0)."
