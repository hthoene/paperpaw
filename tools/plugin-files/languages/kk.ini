calendar.plugin.name = Күнтізбе
calendar.plugin.description = Күнтізбелеріңіз оқу құралында: CalDAV, iCal және файлдардан жоспар, күн, апта және ай көріністері, байланыстардан туған күндер, басты экран виджеттері және ұйқы экраны.
calendar.plugin.how = "Күнтізбе: алдағы күндер жоспары, күн, апта, ай; CalDAV (Nextcloud, Radicale, Baïkal, Fastmail т.б.), iCal мекенжайлары (.ics, webcal://) мен картадағы файлдар оқиғалары, байланыстардың туған күндері мен мерейтойлары (CardDAV). Күнтізбелер тек оқылады, өзгертілмейді.\n\n«Күнтізбе» «Құралдар» мәзірінде. Бірінші жол — көрініс атауы; оны таңдап, жолды басып тұрып не «Мәзір» арқылы «Жоспар», «Күн», «Апта», «Ай», «Туған күндерге» ауысыңыз, күнтізбе қосыңыз не синхрондаңыз. «Күн», «Апта» ішінде алғашқы екі жол мен бет пернелері бір күн не апта алға-артқа жылжытады; «Ай» ішінде көрсеткілер күнді, бет пернелері айды ауыстырады, «Таңдау» күнді ашады. «Таңдау» оқиғаны толық ашады: қашан, қайда, қай күнтізбе, қалай қайталанады. «Артқа» — бір қадам кейін.\n\nКүнтізбе қосу — «Күнтізбелер» (мәзірде не параметрлердегі «Күнтізбе» ішінде). Түрлері: CalDAV аккаунты (сервер мекенжайы жеткілікті, мысалы, cloud.example.com/remote.php/dav; оқиғалы әр күнтізбе көрініске кіреді), iCal мекенжайы (жарияланған .ics), картадағы файл, байланыстар (CardDAV мекенжай кітабындағы туған күндер мен мерейтойлар). Мекенжай, аккаунтқа пайдаланушы аты мен құпиясөз (жақсысы — қолданба құпиясөзі; құпиясөздермен сақталады) және атау енгізіңіз. Күнтізбелер өзгертілетін белгімен (нүкте, шеңбер, сұр нүкте, шаршы) ажыратылады; ең көбі алтау.\n\nҚайталанатын (күн, апта, ай, жыл сайын; апта күндері, саны, соңғы күні, алынған күндерімен), күні бойғы және басқа уақыт белдеуіндегі оқиғалар құрылғы сағатымен көрсетіледі. Бүгіннің алды-артындағы 60 күндегі ең көбі 240 оқиға сақталып, желісіз көрсетіледі. Ережесі оқылмаған оқиға бір рет шығады.\n\n«Күнтізбе» ашылғанда (ең жиі 5 минутта бір рет), «Қазір синхрондау» кезінде, ал «Күнтізбе» параметріне сай желі бәрібір қосулыда не зарядтау басталғанда да синхрондалады. Радио бұл үшін тек «Қазір синхрондау» кезінде қосылады.\n\nБасты экран виджеттері (басты экранды басып тұрып, виджет қосыңыз): «Бүгін» — күн мен оқиғалары, «Келесі оқиға» — кезектегісі, «Жоспар» — алдағы күндер, «Ай» — оқиғалы күндері нүктелі ай, «Туған күндер» — жақындағылары. Түртілген оқиға не ай күні ашылады. Ұйқы экранына бүгінгі жоспар үшін параметрлердегі «Ұйқы экраны» ішінен «Күнтізбені» таңдаңыз."
