menu.plugin.name = Мәзір
menu.plugin.description = Экранның төменгі жағындағы әрекеттер мен параметрлері бар мәзір.
menu.plugin.how = "Мәзір не істеуге және нені орнатуға болатынын тізімдейді. Ол экранның төменгі жағында, ашық нәрсенің үстінде ашылады: оқу кезінде экранның ортасына түртіңіз немесе «Таңдау» түймесін басыңыз. Орындау үшін жазбаға түртіңіз немесе оны таңдаңыз.\n\nМәзірдегі параметрлер өз мәнін көрсетеді және орнында өзгереді, сондықтан мәзір ашық қалады. Көбірек жазбасы бар жазба ішкі мәзірді ашады.\n\nЖылдам панель үшін жоғарғы жиектен төмен сырғытыңыз: жиі өзгертетін нәрселер түймелер ретінде. Түймені ауыстыру үшін оған түртіңіз, оның параметрлері үшін оны басып тұрыңыз. Тек түймелермен көрсеткі түймелері таңдайды, «Таңдау» ауыстырады, ал «Артқа» жабады. «Көрініс» бөліміндегі «Мәзірлер» мәзірлерді тізім немесе плиткалар ретінде көрсетеді."
