stats.plugin.name = Оқу статистикасы
stats.plugin.description = Қанша уақыт және қаншалықты көп оқығаныңызды жазады, күнтізбесімен және әр кітаптың сандарымен.
stats.plugin.how = "«Оқу статистикасы» әр бетті қанша уақыт оқығаныңызды жазады. Оны бүгінгі күнмен, аптамен және үздіксіз оқу сериясымен шолу ретінде, күнтізбе ретінде және әр кітаптың сандарымен көресіз.\n\nОны «Құралдардан» немесе оқу құралындағы «Тағыдан» ашыңыз. Параметрлерде, «Оқу статистикасы» бөлімінде «Оқуды жазуды» өшіруге, «Күндік мақсатты» және саналатын «Ең қысқа бетті» мен «Ең ұзақ бетті» орнатуға болады, сонда парақтап шығу немесе ашық қалған кітап сандарды бұрмаламайды.\n\n«KOReader-мен синхрондау» статистиканы KOReader-мен WebDAV қалтасы арқылы бөліседі. Ол сондай-ақ сол құрылғыдағы KOReader статистикасын қабылдайды. Жазу үшін сағат орнатылған болуы керек: орнатылмаған жерде бір рет Wi-Fi-ға қосылыңыз."
