calibre.plugin.name = Сымсыз кітапхана
calibre.plugin.description = Кітаптарды желі арқылы қабылдайды. Calibre үшін сымсыз құрылғы ретінде жұмыс істейді.
calibre.plugin.how = "«Сымсыз кітапхана» құрылғыны компьютердегі Calibre бағдарламасында сымсыз құрылғы ретінде көрсетеді. Сонда Calibre оған кітаптар жібере алады, оларды тізімдей алады және жоя алады. Кітаптар кітапханаға түседі.\n\n«Сымсыз кітапхананы» «Құралдар» мәзірінен құрылғы мен компьютер бір Wi-Fi желісінде тұрғанда ашыңыз. Calibre-де «Қосылу/бөлісу», сосын «Сымсыз құрылғы қосылымын бастау» таңдаңыз. Құрылғы компьютеріңізді тапқанда, оның атын көрсетеді; «Қосылу» түймесіне түртіңіз (түймелермен «Таңдау» басыңыз). Calibre мұнда кітаптарды қоса және жоя алады, сондықтан тек өз компьютеріңізге қосылыңыз. Экранды жапсаңыз, қосылым тоқтайды.\n\nCalibre өздігінен табылмаса, оның компьютерінің мекенжайын Параметрлерде, «Кітапхана» бөлімінде, Calibre бөліміндегі «Мекенжай» ретінде енгізіңіз. Calibre 9090-нан басқа портты пайдаланса, оны :порт ретінде қосыңыз, мысалы, 192.168.1.20:9091."
