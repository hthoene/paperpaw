reader.plugin.name = Оқу құралы
reader.plugin.description = Кітаптарды бетімен көрсетеді, мазмұны мен оқу параметрлері бар.
reader.plugin.how = "Оқу құралы кітаптарды бетімен көрсетеді. Кітапты кітапханадан ашыңыз; соңғы кітап іске қосылғанда қайта ашылуы мүмкін («Іске қосылғанда соңғы кітапты ашу» параметрі).\n\nБеттерді аудару үшін экранның сол немесе оң жағына түртіңіз не бет түймелерін пайдаланыңыз. Оқу мәзірі үшін ортасына түртіңіз немесе «Таңдау» түймесін басыңыз: «Мазмұн», «Іздеу», «Бетке өту», «Қаріп және макет», «Бетбелгілер мен бөлектеулер» және тағы басқа. Жоғарғы жиектен төмен жылдам панельді ашады, төменгі жиектен жоғары басты экранға өтеді; «Артқа» түймесін басып тұру да солай.\n\nСуретті толық экранда көру үшін «Таңдау» түймесін басып тұрыңыз (немесе суретті басып тұрыңыз): «Солға» және «Оңға» беттегі суреттер арқылы өтеді. «Таңдау» 2x, 3x ашады және кері қайтарады (сенсорда екі рет түрту); үлкейтілгенде «Солға» және «Оңға» бүйірге жылжытады, бет түймелері (немесе сырғытулар) көлденеңінен және төмен жылжиды. «Артқа» сыйдыруға, сосын бетке қайтарады (сенсорда шығу үшін басып тұрыңыз). Бетбелгі үшін жоғарғы оң жақ бұрышқа түртіңіз. Сөзді бөлектеу үшін оны басып тұрыңыз. Түймелермен «Солға» түймесін басып тұрыңыз: «Солға» және «Оңға» сөзбен, бет түймелері жолмен жылжытады, оларды басып тұру беттің шеттеріне және абзацпен өтеді; «Таңдау» сөз үшін бөлектеу жолағын ашады, «Таңдау» түймесін басып тұру оны сөйлемге және абзацқа дейін кеңейтеді (сонда «Солға» және «Оңға» соңын, оларды басып тұру басын жылжытады). Таңдау бет аударғанда да жалғасады. «Markdown ретінде экспорттау» жазбаларыңызды сақтайды."
