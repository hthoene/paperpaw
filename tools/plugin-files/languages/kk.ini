update.dual-boot.help = PaperPaw бұл құрылғыны басқа микробағдарламамен бөліседі, сондықтан мұнда жаңартуларды орнатпайды. PaperPaw-ды мұны орнатқан құралмен жаңартыңыз. Бұл құрылғыда екінші микробағдарлама жоқ па? Мұны төмендегі түймемен айтыңыз немесе PaperPaw-ды USB арқылы paperpaw.org/flash сайтында қайта флэштеңіз.
