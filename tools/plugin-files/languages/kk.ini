about.plugin.name = Туралы
about.plugin.description = PaperPaw нұсқасы мен лицензиялары.
about.plugin.how = "«Туралы» бөлімі PaperPaw-дың қай нұсқасы орнатылғанын, бастапқы коды қайда екенін және қандай лицензиялармен таратылатынын көрсетеді.\n\nОны Параметрлер соңынан «PaperPaw туралы» ретінде табасыз. Жолды көрсеткі түймелерімен және «Таңдау» түймесімен таңдаңыз немесе оған түртіңіз. Микробағдарламаға кірістірілген плагиндер және кодты плагиндерді жүктейтін құрылғыларда мұндай плагиндер құрастырылуы тиіс саусақ ізі де тізімделеді.\n\n«Лицензиялар» оқу құралында мәтін ретінде ашылады, сондықтан оны кітап сияқты парақтайсыз. Онда PaperPaw-дың өз лицензиясы және онымен бірге келетін қаріптердің, белгішелердің және сөз тасымалдау үлгілерінің лицензиялары бар. Плагиндер өз жолын қоса алады, мысалы тақырып авторын."
