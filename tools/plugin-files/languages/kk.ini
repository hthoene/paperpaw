anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Компьютеріңіздегі Anki-дің мерзімі жеткен карталарын оқытады және жауаптарыңызды AnkiConnect қосымшасы арқылы кері жібереді.
anki.plugin.how = "Anki компьютеріңіздегі Anki-де мерзімі жеткен карталарды оқу құралында оқуға және жауаптарыңызды кері жіберуге мүмкіндік береді. Ол тегін AnkiConnect қосымшасын (қосымша коды 2055492159) пайдаланады және AnkiWeb-ті ешқашан пайдаланбайды. Ол алғашында өшірулі: оны плагин дүкенінен қосыңыз.\n\nКомпьютерде: Anki-ге AnkiConnect орнатыңыз (Құралдар, Қосымшалар, Қосымшаларды алу) және Anki-ді қайта іске қосыңыз. Синхрондау кезінде Anki ашық болуы керек.\n\nБастапқыда AnkiConnect тек өзі жұмыс істейтін компьютерге ғана жауап береді (127.0.0.1), сондықтан оқу құралы оған жете алмайды. Құралдар, Қосымшалар, AnkiConnect, Конфигурация бөлімін ашып, «webBindAddress» мәнін «0.0.0.0» етіп орнатыңыз (үй желісін тыңдау). Порт, «webBindPort», өзгертпесеңіз, 8765 болады. Онда «apiKey» орнатсаңыз, дәл сол кілтті осында енгізіңіз. Конфигурацияны өзгерткеннен кейін Anki-ді қайта іске қосыңыз және компьютердің брандмауэрі сұраса, Anki-ге рұқсат беріңіз. Мұны тек сенімді желіде пайдаланыңыз: ондағы кез келген адам AnkiConnect-ке жете алады, сондықтан кілт қойған дұрыс.\n\nОқу құралында: Құралдар ішінен Anki-ді ашып, «Компьютер» өрісіне компьютердің мекенжайын (мысалы, 192.168.1.20), порт 8765 болмаса, портты және орнатқан болсаңыз, API кілтін енгізіңіз. «Жинақты» таңдаңыз немесе барлық жинақ үшін бос қалдырыңыз. Содан кейін Wi-Fi қосулы кезде «Anki-мен синхрондау» таңдаңыз: алдымен күтіп тұрған жауаптарыңыз жіберіледі, содан кейін мерзімі жеткен карталар (және өзіңіз орнатқан жаңа карталар саны) алынады, ең көбі 50. Оларды желісіз өту үшін «Оқу» таңдаңыз: жауапты көрсетіп, оны «Қайта», «Қиын», «Жақсы» немесе «Оңай» деп бағалаңыз. Жауаптарыңыз оқу құралында, Wi-Fi болмаса да, сақталады және келесі синхрондауда Anki-ге барады. Картаның қашан қайта келетінін Anki шешеді: «Қайта» деп жауап берілген карта Anki оның мерзімі жетті дегеннен кейін келесі синхрондауда қайта алынады.\n\nПараметрлердегі «Anki ашылғанда синхрондау» экранды ашқан сайын синхрондайды. Түйме басқанда желі ешқашан пайдаланылмайды."
