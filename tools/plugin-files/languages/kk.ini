vocabulary.sd.readme = "Файлдардан флэш-карталар\n\nӘр жинақ үшін осында файл салыңыз: Spanish.tsv «Spanish» жинағын жасайды.\nФайлдар: .tsv, .csv немесе .txt, UTF-8 ретінде сақталған, немесе .apkg: «Support older Anki versions» белгіленіп экспортталған Anki жинағы. Оның жазбаларының алғашқы үш өрісі бет, арты және мысал болады; оның жоспары мен медиасы оқылмайды, ал PaperPaw Anki файлын ешқашан жазбайды.\n\nӘр жолда бір карта: беті, арты және мысал (міндетті емес), табуляциямен, үтірмен немесе нүктелі үтірмен бөлінген. Бірінші жол бағандарды атауы мүмкін: front, back, example. Мысалы:\n\nKatze\tcat\tDie Katze schläft.\n\nСодан кейін оқу құралында «Флэш-карталарды» ашып, «SD картасындағы карталарды», сосын «Жинақтарды картадан жаңартуды» таңдаңыз.\n\nБілуге пайдалы:\n- Жинақтар үйренгеніңізбен бірге оқу құралында қалады. Файл жаңа немесе өзгерген кезде оқылады, ал оның карталары жинаққа қосылады немесе онда өзгертіледі.\n- Файлдағы картаның артын немесе мысалын өзгертіңіз: карта өзгереді және барысыңызды сақтайды.\n- Картаның бет мәтінін өзгертіңіз: ол жаңа карта болып саналады, ал ескісі басынан басталады. Карталар бет мәтіні бойынша сәйкестендіріледі, бос орындар мен бас әріптер есепке алынбайды. Жинақты файлға сақтаңыз («SD картасындағы карталар», «Жинақты картаға сақтау») және әр картаның id бағанында нөмірі болады: сонда бетті өзгертіңіз, файлдың алғашқы екі жолын бар күйінде қалдырыңыз, сонда карта үйренгеніңізді сақтайды.\n- Сақтау жинақтың карталарын жазады. Файлда болған және карта емес нәрсе (беті жоқ жол) сақталмайды; бұрын болған файл _name.bak.tsv ішіне көшіріледі.\n- Файлды CSV UTF-8 ретінде сақтаңыз (UTF-16 емес, электрондық кестенің өз пішімі емес). 4 МиБ-тан немесе 20 000 жолдан асатын файл оқылмайды: оны бөліңіз.\n- Файлда жойылған жол жинақтағы картаны жоймайды, егер сіз сол жинақ үшін «Жоқ карталарды жоюды» қоспасаңыз. Сонда карта үйренгеніңізбен бірге кетеді.\n- Аттары _ белгісімен басталатын файлдар оқылмайды.\n"
