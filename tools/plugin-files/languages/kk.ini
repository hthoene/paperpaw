fonts-browser.plugin.name = Көбірек қаріптер
fonts-browser.plugin.description = Интернеттегі қаріптерді үлгісімен көрсетеді және оларды оқу үшін жүктеп алады.
fonts-browser.plugin.how = "«Көбірек қаріптер» интернеттегі қаріптер кітапханасының қаріптерін тізімдейді (әр атау өз қарпімен жазылған) және оқуға қажеттілерін жүктеп алады.\n\nОл Параметрлерде, «Оқу» бөлімінде, «Қаріп» ішіндегі қаріптер тізімінің соңында; күй жолдарының қарпінде де осындай жазба бар. Қаріпті үлкенірек, үлгі сөйлеммен көру үшін түртіңіз (түймелермен «Таңдау»), сосын «Жүктеп алу» таңдаңыз. Жүктелгенде беттен кетуге болады. Біткенде «(қаріп атауымен) оқу» не күй жолдары үшін «Пайдалану» таңдаңыз. «Жаңарту» жаңарақ нұсқаны алады, «Жою» қаріпті құрылғыдан жояды.\n\nОған Wi-Fi қажет.\n\nӨЗ ҚАРІПТЕРІҢІЗ\n\n«Көбірек қаріптердің» жанында, сол тізімде, анықтаманың осы бөлігін көрсететін «Өз қаріптеріңіз» бар. Өз қарпіңіз — .ttf немесе .otf файлы, мысалы Google Fonts-тан алынған.\n\nAndroid-те және қаріп файлдарын салатын басқа құрылғыларда: файлды fonts қалтасына көшіріңіз (Android-те: ортақ жадтағы PaperPaw/fonts), PaperPaw-ды қайта қосыңыз және қаріпті Параметрлерде, «Оқу» бөлімінде, «Қаріп» ішінен таңдаңыз.\n\nXteink X4 және X4 Pro-да: бұл оқу құралдары қаріп файлдарын емес, қаріп пакеттерін оқиды, өйткені файлдар жадына сыймайды. Пакетті компьютерде paperpaw-fontgen арқылы әр стиль үшін жасаңыз (қарапайым стиль қажет):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nБұл plugins/font-my-font қалтасын жасайды. Оны жад картасындағы plugins қалтасына көшіріп, құрылғыны қайта қосып, «Қаріп» ретінде My Font таңдаңыз. Бір стильді пакет латын әріптері үшін шамамен жарты мегабайт; жоқ стильдер қарапайым стильмен салынады. Құрал сіз сұраған әріптердің қаншасы қаріпте бар екенін айтады (--chars latin,cyrillic,greek әріп жүйелерін қосады): кітабыңыздағы әріптері жоқ қаріп оларды көрсете алмайды, сол жазуды қамтитын қаріп іздеңіз.\n\n«Көбірек қаріптерден» алынған қаріптер дәл солай жұмыс істейді және компьютерді қажет етпейді.\n\nE-ink панеліндегі ұсақ мәтін айқынырақ болуы үшін команданың соңына --hinting light қосыңыз: ол әріптерді пиксель торына сәйкестендіреді, әдепкі қаріптер де солай жасалған. Онсыз әріптер қаріп дизайнері жасағандай салынады; --hinting normal және --hinting mono оларды күштірек сәйкестендіреді. Араб немесе деванагари сияқты белгілері бар қаріптерді онсыз қалдырған дұрыс."
