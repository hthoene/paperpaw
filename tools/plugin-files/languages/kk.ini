mail.plugin.name = Пошта
mail.plugin.description = Электрондық поштаны құпиясөзбен немесе қолданба құпиясөзімен (IMAP және SMTP) оқиды және жібереді, браузер арқылы кірусіз.
mail.plugin.how = "«Пошта» электрондық поштаны IMAP және SMTP арқылы оқиды және жібереді. Ол мекенжайыңызбен және құпиясөзбен кіреді, браузер арқылы кірусіз, сондықтан мұны рұқсат ететін кез келген провайдермен жұмыс істейді.\n\nАккаунтты «Параметрлер», «Пошта» бөлімінде орнатыңыз. Провайдеріңізді таңдап, мекенжайыңыз бен құпиясөзді енгізіңіз. Көптеген провайдерлер қолданба құпиясөзін қалайды: оны аккаунтыңыздың қауіпсіздік параметрлерінде жасап, осында пайдаланыңыз. Әдеттегі құпиясөзіңіз жиі жұмыс істемейді және ол провайдеріңіздің серверінен басқа жерге ешқашан бармайды. Ол құпиясөздер мен кілттермен бірге сақталады.\n\n«Поштаны» құралдардан ашыңыз. «Поштаны тексеру» соңғы хаттарды және қалталарды алады. Хаттар картада сақталады, сондықтан оларды желісіз оқуға болады. Құрылғы қосылады, алады және ажыратылады, сондықтан Wi-Fi бір сәтке ғана қосылады.\n\nПровайдеріңіз тізімде болмаса, «Өз серверлерім» таңдап, сервер атауларын, порттарды және қауіпсіздікті қосымша параметрлерде орнатыңыз. Сертификатына ешбір орталық кепілдік бермейтін сервер оған сенетін-сенбейтініңізді бір рет сұрайды; саусақ ізін провайдеріңіз көрсететінмен салыстырыңыз.\n\nКітабы бар хаттың (EPUB, PDF және соған ұқсас, 2 МБ-қа дейін) астында «Кітапты ашу» бар: ол файлды алады, кітапханаға қояды және ашады.\n\nПоштаны ашпай жаңа хаттарды көру үшін «Параметрлер», «Пошта» бөлімінде «Жаңа поштаны фонда тексеруді» қосып, қаншалықты жиі тексеру керектігін таңдаңыз (әр 15, 30 немесе 60 минут сайын). Ол сіз қосқанша өшірулі. Сонда оқу құралы ояу және онлайн болғанда уақыт сайын қауіпсіз байланыс арқылы қосылады, бір аккаунттан кейін екіншісіне, және «Басты экрандағы» оқылмағандар санын жаңартады. Ол біраз батарея пайдаланады. «Поштаны» ашу жүріп жатқан тексеруді тоқтатады.\n\nБасты экран виджеттері оқылмағандар санын, соңғы және жұлдызшалы хаттарды, бір пошта жәшігін және хат жазуға төте жолды көрсетеді."
