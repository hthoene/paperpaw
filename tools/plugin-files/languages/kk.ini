widgets.plugin.name = Виджеттер жинағы
widgets.plugin.description = Басты экранға арналған көптеген виджет: сағаттар, күнтізбе, дәйексөздер, кітаптар, жазбалар және тағы басқа.
widgets.plugin.how = "Виджеттер жинағы басты экранға көптеген виджет қосады: сағаттар (аналогты, сөзбен, плиткалармен, әлемдік), күнтізбе, жылдың өткен бөлігі, кері санақ, ай фазасы, күн және күні; күн дәйексөзі, жазбалар, істер тізімдері, суреттер, сәлем және PaperPaw логотипі; ал кітаптар үшін — қазір оқитыны, барысы, келесі кітап, топтама, таңдаулылар, бөлектеу және сандармен кітапхана. Оған батарея виджеті де кіреді.\n\nОларды мәзірдегі «Басты экранды өңдеу» арқылы (немесе басты экранды ұзақ басып), сосын «Виджет қосу» арқылы қосыңыз. Әрқайсысының жиек, өлшем және туралау сияқты өз параметрлері бар. Күн дәйексөзі сияқты өзгеретін виджетті таңдау келесісін көрсетеді. Өз дәйексөздеріңіз картадағы .paperpaw/plugins/widgets ішіндегі quotes.txt файлына, әр жол мәтін | автор түрінде жазылады. Уақыт виджеттеріне сағат орнатылған болуы керек; оны Wi-Fi орнатады."
