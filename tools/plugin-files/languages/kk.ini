diagnostics.plugin.name = Диагностика
diagnostics.plugin.description = Құрылғының әр бөлігін тексеруге арналған сынақ экраны және нұсқаулы тексеру.
diagnostics.plugin.how = "Диагностика — құрылғыны тексеруге арналған сынақ экраны: ол панель көрсете алатын әр сұр деңгейді, түймелер мен сенсорды сынауға арналған төрт қорапты және жаңарту режимдерін салыстыруға арналған прогресс жолағы бар бет есептегішін көрсетеді.\n\nСынақ экранының мәзір жолы жоқ. Ол басқа плагин ұсынбағанда ғана немесе плагин менеджерінде «Басты экран» орны үшін «Экрандар» бөлімінен таңдағанда ғана басты экран болады.\n\n«Таңдау» фокустағы қорапты белгілейді, ал көрсеткі түймелері қораптар арасында жылжиды; сенсормен қорапқа түртіңіз. Бет түймелері сынақ беттерін аударады. Басынан бастау үшін «Таңдау» түймесін немесе саусақты экранда басып тұрыңыз.\n\nPaperPaw құрылғының микробағдарламасы болған жерде «Құралдар» ішіндегі құрылғыны тексеру құрылғының әр бөлігі арқылы бір бетпен өтеді: экран, түймелер, сенсор, алдыңғы жарық, батарея, карта, сағат, Wi-Fi, ұйқы режимі және жад. Әр бет «Сәтсіз», «Өткізу» және «Сәтті» түймелерімен аяқталады, өлшемдер ұсынған жауап таңдалған болады; құрылғыда жоқ бөліктер өткізіледі. Әр жауаптан кейін ол .paperpaw/plugins/diagnostics/device-check.txt файлына есеп жазады, оны pull request-ке қоюға болады. «Артқа» одан шығады, ал қайта ашқанда ол тоқтаған жерінен жалғасады. Тек түймелері бар құрылғыда алдымен түймелер бетінде «Бастау» таңдаңыз; оған дейін көрсеткілер, «Таңдау» және «Артқа» әр беттегідей жұмыс істейді."
