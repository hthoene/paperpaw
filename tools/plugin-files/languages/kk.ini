battery.plugin.name = Батарея шығыны
battery.plugin.description = Батарея зарядын жазып, ол қанша уақытқа жететінін көрсетеді.
battery.plugin.how = "«Батарея шығыны» құрылғы ояу тұрғанда зарядты шамамен минутына бір рет, құрылғының не істегенімен бірге жазып алады: экранды жаңартулар және аударылған беттер. Содан бір сағат ояу тұру мен 100 бет қанша шығындайтынын және батарея осы қарқынмен қанша уақытқа жететінін есептейді.\n\n«Батарея» бөлімін «Құралдар» мәзірінен ашыңыз. Ол қазіргі зарядты, осы ояу уақытты, батареядан осы уақытқа дейінгі шығынды және соңғы ояу уақыттарыңызды көрсетеді. Ол бет түймелерімен немесе жоғарыдағы көрсеткілерге түртіп парақталады.\n\nКөрсеткіштердің мәні болуы үшін батареямен біраз оқу керек. Жазу әдепкіде қосулы және Параметрлерде, «Құрылғы», «Қуат» бөлімінде «Батарея шығынын жазу» ретінде өшіріледі."
