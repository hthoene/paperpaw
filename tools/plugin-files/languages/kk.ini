plugin-manager.plugin.name = Плагин менеджері
plugin-manager.plugin.description = Плагиндерді тізімдейді және оларды қосады не өшіреді.
plugin-manager.plugin.how = "Плагин менеджері әр плагинді нұсқасымен және сипаттамасымен тізімдейді және плагиндерді қосады не өшіреді.\n\nОны Параметрлерде «Плагиндерді басқару» ретінде табасыз. «Плагин параметрлері» — әр плагиннің желіні пайдалануы сияқты теңшеулерге арналған бөлек бет. Плагинді қосу немесе өшіру үшін оған түртіңіз (түймелермен оны таңдаңыз). Өзгеріс қайта қосқаннан кейін қолданылады: төменгі жолақ сонда «Қазір қайта қосуды» ұсынады. Плагин қалай жұмыс істейтінін оқу үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз).\n\n«Әрдайым қосулы» деп белгіленген плагинді өшіру мүмкін емес, ал «Міндетті» деп белгіленгенді басқа плагин өз жұмысын істегенде ғана өшіруге болады, әйтпесе PaperPaw-дың артқа жолы болмас еді. «Экрандар» бөлімінде бірнешеуі ұсынатын орынды қай плагин көрсететінін таңдайсыз."
