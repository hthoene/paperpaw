opds.plugin.name = OPDS каталогтары
opds.plugin.description = OPDS каталогтарын шолады, олардың кітаптарын жүктейді және қалталарды олармен синхрондап отырады.
opds.plugin.how = "OPDS каталогтары — Project Gutenberg, Calibre-Web, Kavita немесе Komga сияқты онлайн кітапханалар. Бұл плагин оларды қалталар сияқты шолады және іздейді, сондай-ақ олардың кітаптарын кітапханаға жүктейді.\n\n«Каталогтарды» «Құралдар» мәзірінен ашып, «Каталог қосу» таңдаңыз: мекенжай және каталогқа аккаунт қажет болса, пайдаланушы аты мен құпиясөз. Каталогты шолу үшін оған түртіңіз; оны синхрондау, өңдеу немесе жою үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз).\n\n«Осы каталогты синхрондау» қосулы болса, «Каталогтарды синхрондау» оның жаңа кітаптарын оның қалтасына жүктейді. «Синхрондау сайынғы кітаптар» бір синхрондау қанша кітап алатынын шектейді, сондықтан үлкен каталог құрылғыны толтырмайды. Каталогтың орнына бұлт қалтасы (WebDAV) жұмыс істейді."
