home.plugin.name = Басты экран
home.plugin.description = Бастапқы бет: оқып жатқан кітап пен құралдар сияқты виджеттер беттері.
home.plugin.how = "Басты экран беттерден тұрады, әрқайсысы телефондағыдай виджеттер мен құралдар торы. Алғашында сағат, оқып жатқан кітабыңыз және жақында оқыған кітаптар бір бетте, ал барлық құралдар келесі бетте тұрады.\n\nЭлементті ашу үшін оған түртіңіз, ал беттерді ауыстыру үшін сырғытыңыз немесе бет түймелерін пайдаланыңыз. Тек түймелермен көрсеткі түймелері бір элементтен келесісіне жылжиды, ал «Таңдау» оны ашады.\n\nОны қайта реттеу үшін басты экранды басып тұрыңыз, беттің астындағы қарындашқа түртіңіз немесе мәзірден «Басты экранды өңдеу» таңдаңыз. Элементтерді жылжыту үшін сүйреңіз немесе параметрлері үшін біріне түртіңіз, түймелермен де солай. «Виджет қосу» да сонда. «Бағандар» мен «Жолдар» параметрлерде, «Көрініс» бөлімінде, «Басты экран» тарауында.\n\nКөлденең бұрылған экранда басты экран сол элементтерді көбірек бағанмен көрсетеді, әр бет келесісіне дейін толтырылады, ал карточкалар шамамен 110 мм-ден енді болмайды; тік күйде реттегеніңіздің ешқайсысы өзгермейді. Оны көлденең күйде реттесеңіз, бұл орналасу сол бағдар үшін өз бетінше сақталады: жаңа виджеттер екеуіне де қосылады. «Қосу» ішіндегі «Көлденең орналасуды бастапқы қалпына келтіру» (өңдеу кезінде) туынды орналасуға оралады. Виджетті немесе құралды бір бағдарда жою оны екіншісінен жоймайды."
