rules.plugin.name = Ережелер
rules.plugin.description = Бірдеңе болғанда бірдеңе істейді: мысалы, 22:00-де түнгі режим.
rules.plugin.how = "Ереже бірдеңе болғанда өздігінен бірдеңе істейді: күн сайын 22:00-де түнгі режимді қосу немесе PaperPaw іске қосылғанда каталогтарды синхрондау.\n\nЕрежелер Параметрлерде, «Теңшеу» бөлімінде, «Ережелер» ретінде. «Ереже қосу» «Қашан?» (PaperPaw іске қосылғанда, тәулік уақыты, кітап ашылғанда немесе жабылғанда, батарея, зарядтау, ауыстырғыш және тағы басқа) және «Сонда не?» (әрекетті орындау, ауыстырғышты қосу немесе өшіру, санды орнату, хабар көрсету) деп сұрайды. Ережені кідірту үшін оған түртіңіз; «Тәулік уақытының екі мәні арасында» сияқты шарт үшін немесе жою үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз).\n\nТаңдайтын әрекеттер, ауыстырғыштар мен сандар плагин бойынша келеді: плагинді таңдап, сосын ол әкелгенді таңдаңыз; артқа қайту одан қайта шығарады. «Артқа» немесе «Келесі бет» сияқты көрсетілген экранда жұмыс істейтін әрекет сол жерде басылса, не істейтінін істейді.\n\nУақыттар қандай экран ашық болса да қолданылады. Бір-бірін үнемі болдырмайтын екі ереже бірнеше қадамнан кейін тоқтайды."
