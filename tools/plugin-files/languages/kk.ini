puzzles.plugin.name = Жұмбақтар
puzzles.plugin.description = Судоку, сөзжұмбақтар және шахмат есептері, офлайн, күн жұмбағымен.
puzzles.plugin.how = "Пойызға және күту бөлмесіне арналған жұмбақтар, бәрі офлайн: судоку, сөзжұмбақтар және шахмат есептері. «Жұмбақтарды» құралдар мәзірінен ашыңыз немесе «Күн жұмбағы» виджетін басты экранға қосыңыз (басты экранды басып тұрыңыз, сосын виджет қосыңыз): ол бүгінгі судокудың қаншалықты шешілгенін көрсетеді, ал түрту оны ашады. Күн судокуы күні бойы бірдей.\n\nСудоку: «Солға» және «Оңға» курсорды шаршылап, «Жоғары» және «Төмен» (бет түймелері) жолмен жылжытады. «Таңдау» цифрларды ашады: біреуін таңдап, қою үшін тағы «Таңдау» басыңыз немесе шаршыны босату үшін «Тазалау» басыңыз. Тақтаның астындағы түймелерге жету үшін «Таңдау» (немесе «Мәзір») түймесін басып тұрыңыз: «Жазбалар» цифрларды қарындаш белгілеріне айналдырады, «Тексеру» қате шаршыларды белгілейді, «Болдырмау» соңғы жүрісті қайтарады, «Жаңа» таңдаған деңгейдегі (Оңай, Орташа, Қиын) жұмбақты бастайды. Әр жұмбақтың дәл бір шешімі бар. Шыққанда ойын сақталады. Сенсорлы экранда шаршыға түртіңіз.\n\nСөзжұмбақтар: .puz (Across Lite) немесе .ipuz файлдарын жад картасындағы «puzzles» қалтасына салыңыз; ештеңе қосылмаған. Торда жылжып, сосын курсор астындағы сөзді пернетақтамен теру үшін «Таңдау» басыңыз (асты сызық шаршыны бос қалдырады). Түймелер көлденеңді және тігінен ауыстырады, анықтамалар тізімін көрсетеді, әріптерді тексереді және сөзді ашады. Әріптер әр файл үшін сақталады. Араластырылған .puz файлдарын ашу мүмкін емес.\n\nШахмат есептері: Lichess жұмбақтар дерекқорынан шағын жинақ (CC0). «Солға» және «Оңға» фигурадан фигураға секіреді, жүргіңіз келетін фигураны таңдаңыз, сосын «Солға» және «Оңға» оның бара алатын жерлері арқылы жүріп, тағы «Таңдау» басыңыз. Қате жүріс қайтарылады. «Кеңес» жүретін фигураны белгілейді, «Келесі» келесі есепке өтеді.\n\nТақта тек өзгеретін шаршыларды қайта салады. «Статистика» шешкен жұмбақтарыңызды санайды."
