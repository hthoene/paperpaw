vocabulary.plugin.how = "«Сөздік қор» оқығанда іздеген сөздерді сөйлемімен кейін қайталауға сақтайды. Тізім «Құралдарда», ең жаңасы бірінші; сөзді таңдасаңыз, қайта ізделеді. Соңғы жол «Экспорт» оларды Anki сияқты флэш-карта қолданбаларына сақтайды. Ең жаңа 2 000 сөз сақталады: артығында ескілері өшеді, бәрін сақтау үшін алдымен экспорттаңыз.\n\n«Флэш-карталар» (ол да «Құралдарда») аралық қайталаумен сынайды: «Жауапты көрсетуден» кейін картаны «Қайта», «Қиын», «Жақсы» не «Оңай» деп бағалайсыз, бұл қайту уақытын шешеді. Жинақ жасау — «Телефонмен өңдеу»: кодты сол Wi-Fi-дағы телефонмен сканерлеп, карталарды теріңіз не көптеп қосыңыз: жинақты ашып, «Бірден көп карта» таңдап, CSV, TSV не TXT файлын (жолда бір карта: бет, арты, мысал; UTF-8) таңдаңыз, тізім қойыңыз не Anki жинағын (.apkg, «Support older Anki versions» арқылы экспортталған) әкеліңіз. \n\nНемесе SD картасындағы файлдар: әр жинаққа CSV, TSV, TXT файлын не Anki жинағын (.apkg, жоғарыдағыдай экспортталған) Flashcards қалтасына салыңыз (Spanish.tsv — «Spanish» жинағы; жолда бір карта: бет, арты, мысал; UTF-8; бірінші жол front, back, example бағандарын атай алады). «Флэш-карталарда» «SD картасындағы карталарды» таңдаңыз не бұл ашылғанда өзі болсын. Жинақтар үйренгеніңізбен құрылғыда қалады; жаңа не өзгерген файл жинағына қосылады: артын не мысалын өзгертсеңіз, карта өзгеріп, барысы сақталады; бетін өзгертсеңіз, жаңа карта болады, ескісі басынан басталады (карталар бетімен ажыратылады, бос орын мен бас әріп есептелмейді); өшірілген жол картаны жоймайды (жинақта «файлда жоқ карталар» «Жою» болса, карта келесі жаңартуда барысымен біржола жойылады; бір жолы оқылмаған файлдан ештеңе жойылмайды). «Картаға сақтау» жинақты файлына карта нөмірлерімен (id бағаны) жазады, сонда беттерді компьютерде өңдесеңіз де, үйренгеніңіз қалады; файлда тек id, бет, арты, мысал сақталады (басқа бағандар, түсініктемелер, жол реті жоғалады), бір жолы оқылмаған файлға сақтау болмайды; бұрынғы файл алғаш _name.bak.tsv-ге көшіріледі (кейін ауыстырылмайды). 4 МиБ не 20 000 жолдан асқан файл оқылмайды; UTF-16 емес, CSV UTF-8 болсын. Алғаш рет қалта түсіндірме жазбамен жасалады.\n\nПараметрлердегі «Оқу» ішінде «Іздеген сөздер карталарға айналады» іздеген сөзді «Іздегендер» жинағына қояды."
