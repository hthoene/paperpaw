koreader.plugin.description = Екеуінде де оқылатын кітаптар үшін бетбелгілер мен бөлектеулерді KOReader-мен бөліседі.
koreader.plugin.how = "Бұл плагин екеуінде де оқитын кітаптарыңыз үшін, бір құрылғыда немесе құрылғылар арасында синхрондалатын кітапхана қалтасында, бетбелгілер мен бөлектеулерді KOReader-мен бөліседі. Баптайтын ештеңе жоқ.\n\nPaperPaw KOReader де ашқан кітапты ашқанда және оның бетбелгілерін немесе бөлектеулерін өзгерткенде, ол кітаптың қасындағы KOReader деректерінен жаңасын алады, ал мұндағы жаңаны KOReader кітапты келесі рет ашқанда алуы үшін қалдырады. Жойылған белгілер мен өзгертілген жазбалар да ауысады.\n\nБұл тек EPUB кітаптары үшін жұмыс істейді. Бір жақтың файлын оқу мүмкін болмаса, оны оқуға болғанша екі жақта да ештеңе өзгермейді."
