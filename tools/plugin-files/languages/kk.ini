update.plugin.description = Микробағдарлама жаңартуларын картадан немесе интернеттен жүктеп орнатады.
update.plugin.how = "«Жаңарту» PaperPaw микробағдарлама болып табылатын құрылғыларда, мысалы X4-те, жаңа микробағдарламаны орнатады. Оны параметрлерде «Жаңарту» ретінде табасыз.\n\n«Онлайн іздеу» жаңарту серверінен жаңарақ PaperPaw сұрайды және оны жүктейді, бұл Wi-Fi арқылы бірнеше минут алады. Немесе жаңарту файлын (.bin аяқталатын, paperpaw.org сайтынан) картадағы updates қалтасына, мысалы, Wi-Fi арқылы тасымалдаумен көшіріңіз. Содан кейін «Орнату» шамамен бір минут алады және құрылғы қайта қосылады; кітаптар, параметрлер және оқу орындары қалады.\n\n«Жаңартуларды іздеу» (параметрлерде, алғашында өшірулі) қосулы болса, құрылғы шамамен аптасына бір рет өзі сұрайды, тек Wi-Fi бәрібір қосулы болғанда немесе ол зарядталғанда. Ол тапқан жаңарақ PaperPaw осында күтеді; ештеңе оқуыңызды бөлмейді. Іздеу құрылғы нені іске қосатынын жібереді, оның аты не нөмірі емес; құрылғыларды санау үшін, сондай-ақ сіз сұрадыңыз ба және бұл күннің, аптаның немесе айдың алғашқы іздеуі ме екенін жібереді.\n\nЕгер қолданып жүрген плагиндеріңіздің жаңа шығарылымға нұсқасы әлі болмаса, жаңарту оларды күтеді. Ескірек нұсқа тек сіз таңдағанда ғана орнатылады.\n\nCrossPoint сияқты басқа микробағдарлама да осында орнатылады: оның файлын (.bin аяқталатын) updates қалтасына салып, «Жаңартуды» ашыңыз. PaperPaw оның осы құрылғыға арналған бүтін, зақымдалмаған микробағдарлама екенін тексереді, бірақ оны кім жасағанын айта алмайды, өйткені оған қол қойылмаған. «Бәрібір орнату» оны флэштің екінші жартысына жазады және құрылғы оны іске қосады; PaperPaw сол микробағдарлама оның үстіне бірдеңе орнатқанша өз жартысында қалады. Кейін PaperPaw-ға оралу үшін оның орнату файлын (paperpaw-<device>-<version>-install.bin) басқа микробағдарлама мәзірінен, мысалы, CrossPoint-тің SD микробағдарлама жаңартуынан орнатыңыз."
