notes-vault.plugin.name = Жазбалар қоймасы
notes-vault.plugin.description = Markdown жазбалары бар қалтаны қалталар, тегтер және соңғы өзгерістер бойынша оқиды, басты экран виджеттерімен. Obsidian қоймаларымен жұмыс істейді.
notes-vault.plugin.how = "«Жазбалар қоймасы» Markdown жазбалары бар қалтаны (жазба қолданбалары сақтайтындай қарапайым .md файлдары) оқиды. Ол Obsidian қоймаларымен жұмыс істейді.\n\nҚойма қалтасын параметрлерде немесе құралдардағы қойма бетінде таңдаңыз. Сонда бет қалталарды картадағыдай, соңғы өзгерген жазбаларды, тегтерді және жазбалар атауларынан іздеуді ұсынады.\n\nБірінші рет қойма беті ашық тұрғанда қойма фонда индекстеледі; мыңдаған жазбасы бар қойма бірнеше минут алады, содан кейін бірден ашылады. Индекс картада сақталады және қойма беті бірнеше сағаттан кейін ашылғанда немесе «Жаңарту» таңдағанда қайта жасалады.\n\nЖазба оқу құралында ашылады. Басқа жазбаларға сілтемелер ([[Жазба]], [[Жазба|сөздер]], [[Жазба#Тақырып]]) қойманың кез келген жеріндегі жазба атауы бойынша табылады; біріне өту сол жазбаны ашады, ал «Артқа» алдыңғы жазбаға қайтарады.\n\nҚоймада ештеңе ешқашан өзгертілмейді. Басты экран виджеттері (соңғы жазбалар, бекітілген жазба, күн жазбасы, кездейсоқ жазба, тегтер, іздеу) басты экран өңдегішінде қосылады. Виджет жазбаларын тек бір қалтадан ала алады: виджет параметрлерінде қалта жолын картаның түбірінен бастап жазыңыз (мысалы, Notes/Work); бос қалдырса, ол қойманың барлық жазбасын алады."
