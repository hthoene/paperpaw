menu-editor.plugin.name = Мәзір өңдегіші
menu-editor.plugin.description = Әр мәзірдің жазбаларын қайта реттейді, жояды және қосады.
menu-editor.plugin.how = "Мәзір өңдегіші мәзірлердің мазмұнын өзгертеді: жазбаларды жоғары немесе төмен жылжытыңыз, жойыңыз немесе жаңаларын қосыңыз.\n\nОны Параметрлерде «Теңшеу» бөлімінде «Мәзірлерді теңшеу» ретінде табасыз. Мәзірді таңдап, сосын оны жылжыту немесе жою үшін жазбаны таңдаңыз; «Жазба қосу» жаңасын қояды. Өзгерістер бірден қолданылады. «Бұл мәзірді бастапқы қалпына келтіру» мәзірді плагиндер анықтаған күйге қайтарады, «Барлық мәзірді бастапқы қалпына келтіру» мұны барлығы үшін жасайды.\n\nӨзіңізді құлыптап тастай алмайсыз: параметрлерге апаратын жол болатын жазба сіз оларға басқа жол қоспайынша қалады."
