power.plugin.name = Қуат
power.plugin.description = Қуат режимін қолмен немесе батарея бойынша таңдайды: Қалыпты, Үнемдеу, Офлайн.
power.plugin.how = "«Қуат» PaperPaw батареяны қалай жұмсайтынын таңдайды: Қалыпты, Үнемдеу немесе Офлайн. «Үнемдеу» күте алатын нәрсені қолайлырақ сәттерде орындайды; «Офлайн» радионы өшіріп ұстайды. «Авто» батарея бойынша таңдайды.\n\nРежимді жылдам панельде, мұнда «Қуат» режимдерді қатар көрсетеді, немесе Параметрлерде «Қуат» бөлімінде өзгертіңіз. Сонда «Авто» «Үнемдеуге» және «Офлайнға» ауысатын деңгейлерді және зарядтау кезінде «Қалыпты» қалатынын да орнатасыз.\n\nКүй жолдарында «Қуат режимі» үнемдеу кезінде жапырақты, офлайн кезінде сызылған Wi-Fi-ды көрсетеді, ал «Қалыпты» режимде ештеңе көрсетпейді.\n\nШағын мәзірді ашу үшін қуат түймесін басып тұрыңыз: «Ұйқы режимі», «Өшіру» (PaperPaw істей алатын жерде), «Қайта қосу», ал сенсорлы құрылғыларда «Сенсорды құлыптау» немесе «Сенсор құлпын ашу». Қысқа басу құрылғыны әлі де ұйқы режиміне қояды. «Артқа» мәзірден шығарады."
