store.plugin.name = Плагин дүкені
store.plugin.description = Осы құрылғыға арналған плагиндерді табады, орнатады, жаңартады және жояды.
store.plugin.how = "Плагин дүкені осы құрылғыға арналған плагиндерді интернеттен табады және оларды орнатады, жаңартады және жояды. Оны «Құралдардан» ашыңыз; оған Wi-Fi қажет.\n\nБасты бет кітапхана ұсынатынды, қазір жаңа немесе танымал нәрсені, сосын топтарды көрсетеді. Топ өз плагиндерін күн сайын өзгеретін әділ араласпен тізімдейді, сонда әр плагин көріне алады; оларды А-дан Я-ға, ең жаңасы немесе соңғы жаңартылуы бойынша сұрыптаңыз және ұзақ тізімдерде әріпке өтіңіз. Бірін оның бетін, көлемін және алатын жадын көру үшін ашып, «Орнату», «Жаңарту» немесе «Жою» таңдаңыз. «Барлығын жаңарту» орнатылған әр плагинді өзекті етеді.\n\nКодты плагиндер құрылғыға толық қолжетімділікпен жұмыс істейді: дүкен бұл туралы айтады және алдымен сұрайды, және олар қайта қосқаннан кейін іске қосылады. Біреуі бұзылса, PaperPaw кодты плагиндерсіз іске қосылады және қайсысы екенін айтады. «Плагиндер кітапханасы» тізім қайдан келетінін орнатады.\n\nПараметрлердегі «Жүйе» бөліміндегі «Қауымдастық плагиндері» басқалар GitHub-та жариялаған плагиндерді де тізімдейді. Оларды ешкім тексерген жоқ: олар «Тексерілмеген» деп белгіленеді, кодты плагиннің беті ол қол қойылған кілтті көрсетеді, ал басқа кілтпен қол қойылған жаңарту орнатылмайды.\n\n«Көздер», басты беттің соңғы жолы, басқалардың плагин тізімдерін мекенжайы бойынша (https://…/plugins.json) қосады, олардың бірін PaperPaw тізімінің орнына тізімдейді немесе жояды. Теру орнына картадағы .paperpaw/plugins/store қалтасына әр жолда бір мекенжайы бар sources.txt файлын салыңыз: мекенжайлар «Көздер» бөлімінде жаңа ретінде көрінеді. PaperPaw көзді немесе оның плагиндерін тексермейді, ал құрылғы көздің серверіне қосылады. Көз өз тізіміне қол қояды; құрылғы оқыған бірінші тізімнің кілтін сақтайды және одан кейін тек сол кілтпен қол қойылған тізімдер мен кодты плагиндерді қабылдайды. Плагин жаңартуларын тек өзі орнатылған көзден алады. PaperPaw-дың өз кітапханасы әрдайым бар және оны жою мүмкін емес; дүкеннен шығу оған қайтарады."
