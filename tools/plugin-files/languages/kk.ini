keyboard.plugin.name = Пернетақта
keyboard.plugin.description = Мәтінді экранда сенсормен немесе түймелермен енгізеді.
keyboard.plugin.how = "Пернетақта бірдеңеге мәтін қажет болған сайын ашылады: іздеу, құпиясөз, жазба немесе параметр. Ол сенсормен де, тек түймелермен де жұмыс істейді.\n\nТүймелермен «Солға» және «Оңға» қатар бойымен жылжиды, бет түймелері қатарлар арасында жылжиды, «Таңдау» пернені басады, ал «Артқа» бас тартады; «Солға» және «Оңға» қатарды айнала өтеді, ал «Жоғары» және «Төмен» бағаныңызда қалады. Shift келесі әріпті бас әріп етеді; барлығы бас әріп болу үшін оны екі рет басыңыз, тоқтату үшін тағы бір рет. Әріпті басып тұрсаңыз (түймелермен: онда «Таңдау» түймесін басып тұрыңыз), оның бас әріпі бірден таңдалады, сондай-ақ é және è сияқты екпінді әріптер шығады; неміс тілінде ä, ö, ü және ß осылай a, o, u және s әріптерінен шығады (түймелермен пернетақта сол әріптерде бұл туралы айтады). «Жарайды» аяқтайды; түймелермен кез келген жерден аяқтау үшін «Артқа» түймесін басып тұрыңыз («Артқа» жалғыз бас тартады) немесе әріп емес пернеде «Таңдау» түймесін басып тұрыңыз. «Қою» буфердегі мәтінді енгізеді, ал «Телефон», ұсынылған жерде, оның орнына телефоныңызда теруге мүмкіндік береді.\n\nПараметрлерде «Құрылғы», «Пернетақта» бөлімінде: «Пернетақта орналасулары» орналасуларды таңдайды. Әдепкіде ол мәзір тілін ұстанады; бірнеше болса, перне олардың арасында ауыстырады. «Умлаут пернелері» оның орнына ä, ö, ü және ß үшін жеке пернелерді береді. «Өлшемі» пернелер мен әріптерді үлкейтеді; тек түймелермен қатарлар компьютер пернетақтасындағыдай қалады. Сенсорлы экрандарда «Перне пішіні» пернелердің көрінісін өзгертеді. «Автоматты бас әріптер» әр сөйлемді бас әріптен бастайды."
