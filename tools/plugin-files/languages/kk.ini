tasks.plugin.name = Тапсырмалар
tasks.plugin.description = Мерзімдері мен басымдықтары бар істер тізімдері, оқу құралында немесе CalDAV серверіңізбен синхрондалған, басты экран виджеттерімен.
tasks.plugin.how = "Оқу құралындағы істер тізімдері: мерзімі мен басымдығы бар тапсырмалар, орындалғанда белгіленеді. Олар баптаусыз және желісіз жұмыс істейді және CalDAV серверімен (Nextcloud, Radicale, Baïkal, Fastmail және басқалар) үйлестіріле алады, сонда сол тізімдер телефоныңызда да, компьютеріңізде де болады.\n\n«Тапсырмаларды» құралдар мәзірінен ашыңыз. Бірінші жол көрсетілген тізімді атайды; оны басқа тізім, барлық тізімдердегі «Бүгін және мерзімі өткендер», жаңа тізім, синхрондау не аккаунтты орнату үшін таңдаңыз. «Тапсырма қосу» пернетақтаны ашады. Тапсырмадағы «Таңдау» оны орындалды деп белгілейді (қайта: орындалмады). Тақырыбын, мерзімін (бүгін, ертең, бір аптадан кейін не 2026-12-24 сияқты терілген күн) не басымдығын өзгерту немесе жою үшін тапсырманы басып тұрыңыз не «Мәзір» басыңыз. Ашық тапсырмалар алдымен, күні, сосын басымдығы бойынша тұрады; орындалғандары соңында бір апта тұрады (параметрлердегі «Тапсырмалар» бөлімінде орнатылады), сосын оқу құралынан кетеді.\n\nБасты экран виджеттері (басты экранды басып тұрып, виджет қосыңыз): «Бүгінгі тапсырмалар» бүгінгі не мерзімі өткендерді, «Тапсырмалар тізімі» бір тізімді, «Келесі тапсырма» келесі орындалатынды көрсетеді, «Ашық тапсырмалар» оларды санайды. Виджеттегі тапсырмаға түрту оны орындалды деп белгілейді; тақырыпқа түрту тізімдерді ашады.\n\nСинхрондау үшін тізім жолынан «CalDAV аккаунтын» таңдап, сервер мекенжайын, пайдаланушы атын және құпиясөзді (ең дұрысы қолданба құпиясөзі) енгізіңіз. Сервер мекенжайы жеткілікті, мысалы, cloud.example.com/remote.php/dav; оқу құралы тапсырма тізімдеріңізді сол жерден табады. Сервердің әр тапсырма тізімі оқу құралында тізім болады. Синхрондау «Тапсырмаларды» ашқанда, «Қазір синхрондау» таңдағанда және желі бәрібір қосулы кезде болады; желісіз өзгерткеніңіз күтіп, кейін жіберіледі. Тапсырма оқу құралында да, басқа жерде де өзгертілсе, сервердің нұсқасы алынады, ал сіздікі қасында жаңа тапсырма ретінде сақталады, ештеңе жоғалмайды. Тапсырманың серверде бар жазбалары, дабылдары және басқасы өзгеріссіз қалады. Қайталанатын тапсырмалар көрсетіледі, бірақ жасалған жерінде өзгертіледі. Оқу құралы 12 тізімде 200 тапсырмаға дейін сақтайды."
