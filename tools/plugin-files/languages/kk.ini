notes-overview.export.help.more = Барлық жазбалар электрондық оқу құралдары қолданатын My Clippings.txt пішімінде, кітапхананың қасындағы «Exports» қалтасында бір файлда. Тізім 200 кітапты көрсетеді, файлда барлығы бар.
