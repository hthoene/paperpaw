pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Жұмыс және үзіліс айналымдары, виджеттері және күндік санағышы бар зейін таймері.
pomodoro.plugin.how = "Pomodoro таймері: зейінмен жұмыс айналымдарымен жұмыс істеп, сосын демалыңыз. Оны баптау қажет емес: 25 минут зейін, 5 минут демалыс және төрт айналымнан кейін 15 минуттық ұзақ үзіліс.\n\nPomodoro-ны құралдар мәзірінен ашып, «Бастау» басыңыз немесе оның виджеттерін басты экранға қосыңыз (басты экранды басып тұрыңыз, сосын виджет қосыңыз): «Pomodoro таймері» кезеңді және қалған минуттарды көрсетеді, «Pomodoro бастау/кідірту» — түйме, ал «Pomodoro бүгін» аяқтаған айналымдарыңызды күндік мақсатыңызбен санайды. Таймерге түрту оны бастайды немесе кідіртеді; толық экранды ашу үшін оны басып тұрыңыз.\n\nТаймер экраннан шыққанда жұмысын жалғастырады және қайта қосқаннан кейін сағат бойынша жүре береді. Оқу құралы ұйықтап тұрғанда ештеңе жұмыс істемейді: бұл кезде аяқталған кезең ол оянғанда хабарланады. Кезең біткенде ескерту хабарлайды. Батареяны үнемдеу үшін сағат минутына бір рет жаңарады (толық экранда соңғы минутта он секунд сайын) және оқу құралын ешқашан ояу ұстамайды.\n\nПараметрлердегі «Pomodoro» бөлімінде ұзақтықтарды және жиынтықтағы айналымдарды, сондай-ақ келесі кезеңнің өздігінен басталатынын орнатасыз. «Тағы» бөлімінде: кезең біткенде экранның жарқылы немесе алдыңғы жарықтың жыпылықтауы және күндік мақсат."
