lock.plugin.name = Экран құлпы
lock.plugin.description = Құрылғы оянғанда PIN, графикалық кілт немесе құпиясөз; оқу кезінде сенсор құлыптаулы.
lock.plugin.how = "Экран құлпы PaperPaw іске қосылғанда және құрылғы оянғанда PIN, графикалық кілт немесе құпиясөз сұрайды. Ол алғашында өшірулі. Ол тек кездейсоқ пайдаланудан қорғайды: код пен қате әрекеттер саны SD картасында сақталады, сондықтан картаны шығарған, өңдеген немесе ауыстырған кез келген адам құлыптан өтіп кетеді.\n\nОны параметрлерде, «Құрылғы», «Экран құлпы» бөлімінде орнатыңыз: бар болса, қолданыстағы кодты енгізіңіз, түрін таңдаңыз, сосын жаңа кодты екі рет енгізіңіз. Графикалық кілт тек сенсорлы экрандарда ұсынылады.\n\nБес қате әрекеттен кейін келесісі жарты минут күтеді. «Қазір құлыптау» бірден құлыптайды және оны түймеге, ым-қимылға немесе ережеге қоюға болады. «Оянғаннан кейін құлыптау» өшірілуі мүмкін, сонда тек нақты іске қосу (қосу немесе қайта қосу) құлыптайды, әр ояну іске қосу болатын жерден басқа, мысалы, X4-те батареямен.\n\nСенсор құлпы, соның қасында: жылдам панельдегі және оқу мәзіріндегі «Сенсорды құлыптау» түртулер, сырғытулар және қаламның ештеңе істемейтін, ал түймелердің жұмыс істейтін күйін қосады, мысалы, қолды экранға қойып оқу үшін. Құлыпты ашу үшін бір саусақпен екі рет түртіп, оны бір сәт ұстап тұрыңыз; қуат түймесін басып тұру «Қуат» мәзірін ашады, онда «Сенсор құлпын ашу» мұны түймелермен жасайды; X4 Pro-да басты бет түймесін басып тұру бірден ашады."
