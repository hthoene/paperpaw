core.secrets-unopened = Осы картадағы кейбір сақталған құпиясөздер мен кілттерді мұнда ашу мүмкін емес: олар басқа құрылғыда сақталған немесе осы құрылғының кілті жоғалған. Оларды плагин сұраған жерге қайта енгізіңіз.
core.secrets-unsupported = Бұл құрылғы әзірге құпиясөздерді сақтай алмайды. PaperPaw-ды paperpaw.org сайтындағы веб-флэшермен бір рет қайта орнатыңыз, сонда ол жұмыс істейді.
core.card.missing = Жад картасы табылмады, сондықтан ештеңе сақталмайды. FAT32 картасын салып, құрылғыны қайта қосыңыз.
core.card.unreadable = Жад картасын оқу мүмкін емес, сондықтан ештеңе сақталмайды. Басқа картаны байқап көріңіз.
core.card.exfat = Жад картасы exFAT пішімінде, сондықтан ештеңе сақталмайды. Оны компьютерде FAT32 пішіміне форматтаңыз.
core.card.no-fat = Жад картасы FAT32 пішімінде емес, сондықтан ештеңе сақталмайды. Оны компьютерде FAT32 пішіміне форматтаңыз.
