notes-overview.plugin.description = Барлық кітаптың бетбелгілері мен бөлектеулері бір тізімде және My Clippings.txt ретінде экспорт.
notes-overview.plugin.how = "«Барлық жазбалар» бетбелгі немесе бөлектеу жасаған әр кітапты олардың санымен тізімдейді. Оны «Құралдардан» ашыңыз. Жазбаларын көру үшін кітапты, ал кітапты сол жерде ашу үшін жазбаны таңдаңыз.\n\nТізімнің соңында «My Clippings.txt ретінде экспорттау» барлық жазбаларды кітапхананың қасындағы «Exports» қалтасына Kindle қолданатын пішімде (UTF-8) бір файлға жазады. Kindle-дің My Clippings.txt файлын оқитын қолданбалар оны оқи алады. Бөлектеудегі жазба Kindle-дегідей жеке жазба болады. Мұндағы кітапта Kindle орындары болмағандықтан, «орын» — жазбаның кітаптың қаншалықты ішінде екені, пайызбен. Файл әр жолы қайта жазылады; ол алдыңғысын ауыстырады."
