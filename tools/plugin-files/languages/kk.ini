sleep.plugin.name = Ұйқы экраны
sleep.plugin.description = Құрылғы ұйықтап тұрғанда ұйықтап жатқан мысықты, кітап мұқабасын, суреттеріңізді немесе хабарды көрсетеді.
sleep.plugin.how = "Ұйқы экраны құрылғы ұйықтап тұрғанда экранның нені көрсететінін шешеді. E-ink суретті қуатсыз сақтайды.\n\nОны параметрлерде, «Құрылғы», «Ұйқы экраны» бөлімінде «Көрсету» арқылы таңдаңыз: ұйықтап жатқан мысық (әдепкі), кітап мұқабасы, менің суреттерім, логотип және «Ұйықтап жатыр», виджеттер, бет бар күйінде немесе суретпен бет. «Менің суреттерім» «Суреттер» қалтасындағы файлдарды бірінен кейін бірін көрсетеді.\n\nМұқабасыз немесе суретсіз мысық көрсетіледі. Ұйқы экранын жүйенің өзі салатын жерде бұл параметрлер жасырылады.\n\nӨшірулі экран, «Өшірілгенде көрсету», құрылғы қуат мәзірінен немесе «Ұйқыдан кейін өшіру» уақытынан кейін өшірілгенде бір рет салынады (төмен батарея қуатты үзгенде емес). Логотип және «Өшірулі», мысық, мұқаба немесе менің суреттерім таңдалмаса, ол ұйқы экранындай болады. Басқа плагин оған арналған экранды ұсына алады.\n\nІске қосу және қайта қосу экраны, «Іске қосқанда көрсету» және «Қайта қосқанда көрсету», басқа плагин оларға арналған экранды ұсынбаса, құрылғының өзінікі. Құрылғы іске қосылып жатқанда плагиндер әлі жұмыс істемейді: іске қосу үшін таңдалған экран құрылғы өшірілгенде немесе қайта қосылғанда алдын ала салынып, келесі іске қосуда көрсетіледі. Уақытында дайын болмаған экран немесе зақымдалған сурет құрылғының өз экранына орын береді; құрылғы кез келген жағдайда өшеді немесе қайта қосылады."
