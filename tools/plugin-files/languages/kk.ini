settings.plugin.name = Параметрлер
settings.plugin.description = Параметрлер беттері, әр плагиннің параметрлерінен құралған.
settings.plugin.how = "«Параметрлер» PaperPaw мен оның плагиндерінде орнатуға болатын барлық нәрсені беттермен көрсетеді. Плагиндерге өз экраны қажет емес: олар жариялағаны осында, топтармен, әр параметрдің сипаттамасымен бірге төменде көрінеді.\n\nОны мәзірдегі «Параметрлер» арқылы ашыңыз. Топты ашу үшін оған, сосын параметрді ауыстыру немесе таңдау үшін оған түртіңіз; сандарда − және + түймелері бар. Түймелермен параметрге өтіп, «Таңдау» басыңыз: «Солға» және «Оңға» санды өзгертеді, «Таңдау» оны сақтайды, «Артқа» бұрынғы мәнге қайтарады.\n\nӨзгерістер бірден қолданылады. «Іздеу» параметрді сөздер бойынша табады, ал «Қосымша параметрлер» сирек қажет болатындарын қосады. «Әдепкіге қайтару» және «Барлығын қайтару» алдымен сұрайды."
