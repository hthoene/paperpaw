menu-editor.locked = Бұл жазба мұндағы параметрлерге апаратын жол және қалады. Алдымен басқа жол қосыңыз (мысалы, «Параметрлердің» өзін), сонда оны алып тастауға болады.
news.plugin.name = Жаңалықтар
news.plugin.description = Жаңалық арналарын (RSS, Atom) оқуға арналған кітаптар ретінде алады.
news.plugin.how = "«Жаңалықтар» RSS немесе Atom арналарын кітапқа айналдырады. Әр арна кітапханадағы «Жаңалықтар» қалтасында бір кітап болады, оның ең жаңа мақалалары қарапайым мәтін ретінде, кез келген басқа кітап сияқты оқуға арналған.\n\n«Жаңалықтарды» «Құралдар» мәзірінен ашып, «Арна қосу» таңдаңыз; оның мекенжайы газеттің немесе блогтың сайтында. «Жаңалықтарды алу» барлық арнаны алады және бұрынғы кітаптарды ауыстырады. Арнаны жалғыз алу немесе жою үшін оны басып тұрыңыз (түймелермен «Таңдау» түймесін басып тұрыңыз). Жойылған арнаның кітабы кітапханада қалады.\n\nАлу үшін желі қажет. «Арнадағы мақалалар» (Параметрлер, Кітапхана) әр кітапта қанша мақала болатынын орнатады. «Жаңалық тақырыптары» виджеті оларды басты экранда көрсетеді."
