picture-home.plugin.name = ചിത്ര ഹോം സ്ക്രീൻ
picture-home.plugin.description = വിജറ്റുകൾക്ക് പിന്നിൽ നിങ്ങളുടെ സ്വന്തം ചിത്രവും നിങ്ങൾ ക്രമീകരിക്കുന്ന സ്റ്റാറ്റസ് ബാറുമുള്ള ഒരു ഹോം സ്ക്രീൻ.
picture-home.plugin.how = "ഓണായിരിക്കുമ്പോൾ “ചിത്ര ഹോം സ്ക്രീൻ” ഹോം സ്ക്രീനിനു പകരം വരുന്നു: വിജറ്റുകൾക്ക് പിന്നിൽ നിങ്ങളുടെ ചിത്രം, നിങ്ങൾ ക്രമീകരിക്കുന്ന വിജറ്റ്, ടൂൾ പേജുകൾ. പ്ലഗിൻ മാനേജറിൽ ഓഫാക്കിയാൽ സാധാരണ ഹോം സ്ക്രീൻ അതിന്റെ പേജുകളോടെ തിരികെ വരും.\n\nകാർഡിലെ ഒരു ഫോൾഡറിൽ (സ്ഥിരമായി wallpapers) ചിത്രങ്ങൾ (JPEG, PNG, GIF) ഇട്ട്, ക്രമീകരണം › ഇഷ്ടാനുസൃതമാക്കുക › ചിത്ര ഹോം സ്ക്രീൻ എന്നതിൽ ഒന്ന് തിരഞ്ഞെടുക്കുക. “ഒതുക്കൽ” (നിറയ്ക്കുക, മുഴുവൻ ചിത്രം, വലിച്ചുനീട്ടുക, യഥാർത്ഥ വലുപ്പം, ടൈൽ), “സ്ഥാനം” (ഏത് ഭാഗം നിലനിൽക്കും), “സൂം” (എത്ര വലുത്), “ചിത്രം മങ്ങിക്കുക” (എത്ര മങ്ങിയത്); ഇളം ചിത്രത്തിൽ വിജറ്റുകൾ വായിക്കാൻ എളുപ്പമാണ്. ഓരോ സ്ക്രീൻ വലുപ്പത്തിനും ചിത്രം ഒരിക്കൽ തയ്യാറാക്കും.\n\nവിജറ്റുകൾ ചിത്രത്തിനു മുകളിലെ പ്ലേറ്റുകളിലാണ്. സാധാരണ ഹോം സ്ക്രീനിലെ പോലെ പേജ് ക്രമീകരിക്കുക: പേജിനു താഴെയുള്ള പെൻസിൽ, അല്ലെങ്കിൽ മെനുവിലെ “ഹോം സ്ക്രീൻ എഡിറ്റ് ചെയ്യുക”.\n\nസ്റ്റാറ്റസ് ബാർ (സമയം, Wi-Fi, ബാറ്ററി മുതലായവ) ഓൺ, ഓഫ്, സ്വയമേവ; മുകളിലോ താഴെയോ; പൂർണ്ണ വീതിയോ ചെറിയ ഗുളികയോ; ഇളം, ഇരുണ്ട, ചാര പ്ലേറ്റിലോ ചിത്രത്തിൽ നേരിട്ടോ ആകാം. ബട്ടണുകളുടെ വരിയും (X4) അങ്ങനെ തന്നെ. “സ്വയമേവ”: ഒരു ബട്ടൺ അമർത്തുമ്പോൾ കുറച്ച് സെക്കൻഡ് കാണിക്കും; ആ അമർത്തൽ മറ്റൊന്നും ചെയ്യില്ല.\n\n“ചിത്രം വരയ്ക്കൽ”: ചാരനിറങ്ങൾ (X4-ൽ പതുക്കെ), ഡിതർ (കറുപ്പും വെളുപ്പും പുള്ളികൾ, വേഗം), അല്ലെങ്കിൽ സ്വയമേവ (ആദ്യം ചാരനിറങ്ങൾ, ആദ്യ മാറ്റത്തിനു ശേഷം പുള്ളികൾ). ചാരനിറങ്ങളില്ലാത്ത സ്ക്രീനിൽ പുള്ളികൾ ഉപയോഗിക്കും."
