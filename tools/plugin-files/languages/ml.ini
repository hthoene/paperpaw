help.setting.show.help = ഒരു സ്ക്രീൻ ആദ്യമായി തുറക്കുമ്പോൾ, അതിലെ നിയന്ത്രണങ്ങൾ എന്തു ചെയ്യുന്നുവെന്ന് ഒരു ചെറിയ കുറിപ്പ് പറയുന്നു.
