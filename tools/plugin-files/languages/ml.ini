core.setting.frame-line = ഫ്രെയിം വര
core.setting.frame-line.help = വിജറ്റിന്റെ ഫ്രെയിമിന്റെ വരയ്ക്ക് എത്ര കനം; സ്വയമേവ എന്നാൽ ഇന്റർഫേസിന്റെ വരകൾ പോലെ.
core.setting.shadow = നിഴൽ
core.setting.shadow.help = വിജറ്റിന്റെ കാർഡിനോ നിറത്തിനോ താഴെയും വലതുവശത്തുമായി ഒരു കടുത്ത നിഴൽ.
core.setting.widget-corners = വിജറ്റുകളുടെ മൂലകൾ
core.setting.widget-corners.help = സ്വന്തം ക്രമീകരണത്തിൽ മൂലകൾ തിരഞ്ഞെടുക്കാത്ത എല്ലാ വിജറ്റുകളുടെയും മൂലകൾ.
core.setting.widget-frame-line = വിജറ്റുകളുടെ ഫ്രെയിം വരകൾ
