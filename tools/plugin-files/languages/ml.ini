core.host-firmware.foreign = ഇത് PaperPaw-യെ മറ്റൊരു ഉപകരണ സോഫ്റ്റ്വെയർ ഉപയോഗിച്ച് മാറ്റിസ്ഥാപിക്കും. PaperPaw സ്വയം വീണ്ടും ആരംഭിക്കില്ല.
core.host-firmware.no-undo = PaperPaw-യ്ക്ക് ഈ മാറ്റം പഴയപടിയാക്കാനാവില്ല. തിരികെ വരാൻ മറ്റേ സോഫ്റ്റ്വെയറിന്റെ വീണ്ടെടുക്കൽ ഓപ്ഷൻ ഉപയോഗിക്കുക, അല്ലെങ്കിൽ വെബ് ഫ്ലാഷർ ഉപയോഗിച്ച് PaperPaw വീണ്ടും ഇൻസ്റ്റാൾ ചെയ്യുക.
core.host-firmware.kept = PaperPaw ഉപകരണത്തിന്റെ മെമ്മറിയിൽ തുടരും. മെമ്മറി കാർഡിലെ ഫയലുകൾക്ക് മാറ്റമുണ്ടാകില്ല.
core.host-firmware.unsigned = ഈ സോഫ്റ്റ്വെയർ ഒപ്പിട്ടതല്ല. അതിന്റെ ഫയൽ ഘടനയും ഉപകരണവുമായുള്ള അനുയോജ്യതയും മാത്രമേ പരിശോധിക്കൂ; ഉറവിടം സ്ഥിരീകരിക്കുന്നില്ല.
core.host-firmware.unknown-key = ഈ സോഫ്റ്റ്വെയർ അജ്ഞാതമായ ഒരു കീ ഉപയോഗിച്ചാണ് ഒപ്പിട്ടത്. ഇവിടെ കാണിക്കുന്ന കീ വിശ്വസിക്കുന്നുവെങ്കിൽ മാത്രം ഇൻസ്റ്റാൾ ചെയ്യുക.
core.host-firmware.downgrade = ഈ പഴയ പതിപ്പിന് മുമ്പത്തെ പതിപ്പ് സ്വയമേവ പുനഃസ്ഥാപിക്കാനാവില്ല. തിരികെ വരാൻ വെബ് ഫ്ലാഷർ ഉപയോഗിച്ച് PaperPaw വീണ്ടും ഇൻസ്റ്റാൾ ചെയ്യുക.
core.host-firmware.early-crash = ആരംഭത്തിലെ സുരക്ഷാ പരിശോധനയ്ക്ക് മുമ്പ് പുതിയ സോഫ്റ്റ്വെയർ ക്രാഷ് ആയാൽ ഉപകരണം ആരംഭിക്കാതായേക്കാം. PaperPaw പുനഃസ്ഥാപിക്കാൻ വെബ് ഫ്ലാഷർ വേണ്ടിവരും.
core.host-remove.question = {name} നീക്കം ചെയ്യണോ? അതിന്റെ സംരക്ഷിച്ച ഡാറ്റ എന്തുചെയ്യണം?
core.host-remove.keep = നീക്കം ചെയ്യുക, ഡാറ്റ നിലനിർത്തുക
core.host-remove.delete = നീക്കം ചെയ്യുക, ഡാറ്റ ഇല്ലാതാക്കുക
core.host-remove.warning = ഡാറ്റ ഇല്ലാതാക്കിയാൽ അതിന്റെ സംരക്ഷിച്ച ക്രമീകരണങ്ങളും ഫയലുകളും നീക്കം ചെയ്യപ്പെടും. ഇത് പഴയപടിയാക്കാനാവില്ല.
core.host-wifi.join = {plugin} Wi-Fi “{network}”-ലേക്ക് കണക്റ്റ് ചെയ്യാൻ ആഗ്രഹിക്കുന്നു. അനുവദിക്കണോ?
core.host-wifi.hotspot = {plugin} Wi-Fi ഹോട്ട്സ്പോട്ട് “{network}” ആരംഭിക്കാൻ ആഗ്രഹിക്കുന്നു. അനുവദിക്കണോ?
core.host-ui.phone-locked = ഉപകരണം ലോക്ക് ചെയ്തിരിക്കുമ്പോൾ ഫോണിൽ ടൈപ്പ് ചെയ്യാനാവില്ല.
core.host-ui.typing-stopped = ടെക്സ്റ്റ് വളരെ നീളമുള്ളതിനാൽ തത്സമയ അപ്ഡേറ്റുകൾ നിർത്തി. നിങ്ങൾക്ക് ടൈപ്പ് ചെയ്യുന്നത് തുടരാം; സ്ഥിരീകരിക്കുമ്പോൾ മുഴുവൻ ടെക്സ്റ്റും അയയ്ക്കും.
core.host-ui.text-full = ടെക്സ്റ്റ് വളരെ നീളമുള്ളതാണ്. ചുരുക്കി വീണ്ടും ശ്രമിക്കുക. ഒന്നും മുറിച്ചുകളഞ്ഞിട്ടില്ല.
core.host-ui.clipboard-full = ക്ലിപ്പ്ബോർഡിന് ടെക്സ്റ്റ് വളരെ നീളമുള്ളതാണ്. ചെറിയൊരു ഭാഗം പകർത്തുക. ക്ലിപ്പ്ബോർഡിലെ മുമ്പത്തെ ടെക്സ്റ്റിന് മാറ്റമില്ല.
core.host-ui.clipboard-card = ക്ലിപ്പ്ബോർഡ് വായിക്കാനോ എഴുതാനോ ആവില്ല. മെമ്മറി കാർഡ് ചേർത്തിട്ടുണ്ടെന്നും വായിക്കാനാവുമെന്നും പരിശോധിക്കുക.
core.host-ui.card-full = മെമ്മറി കാർഡ് നിറഞ്ഞു. കുറച്ച് ഇടം ഒഴിവാക്കി വീണ്ടും ശ്രമിക്കുക.
core.host-ui.card-error = മെമ്മറി കാർഡിൽ ടെക്സ്റ്റ് വായിക്കാനോ സംരക്ഷിക്കാനോ ആയില്ല. കാർഡ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.
core.host-permission.library = നിങ്ങളുടെ മുഴുവൻ ലൈബ്രറിയും വായനാസ്ഥാനങ്ങളും എല്ലാ പ്ലഗിനുകളിൽ നിന്നുമുള്ള ഹൈലൈറ്റുകളും കുറിപ്പുകളും വായിക്കാനും മാറ്റാനും കഴിയും.
core.host-library.import-failed = പുസ്തകം ലൈബ്രറിയിലേക്ക് ചേർക്കാനായില്ല. മെമ്മറി കാർഡ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.
core.host-library.name-taken = ഈ പേരിൽ ഒരു പുസ്തകം ഇതിനകം ഉണ്ട്. മറ്റൊരു പേര് തിരഞ്ഞെടുക്കുക.
core.host-library.replace-denied = ഈ പ്ലഗിന് ആ പുസ്തകം മാറ്റിസ്ഥാപിക്കാനാവില്ല. അത് സ്വയം ചേർത്തതും പിന്നീട് നീക്കാത്തതുമായ പുസ്തകങ്ങൾ മാത്രമേ മാറ്റിസ്ഥാപിക്കാനാവൂ.
core.host-safe-mode.power-escape = ഉപകരണം റീസ്റ്റാർട്ട് ചെയ്യാൻ നിങ്ങൾ പവർ ബട്ടൺ അമർത്തിപ്പിടിച്ചപ്പോൾ പ്ലഗിൻ {plugin} പ്രതികരിക്കാത്തതിനാൽ അത് ഓഫാക്കി.
core.notice-box = അറിയിപ്പ്
core.firmware.title = ഈ ഫേംവെയർ ഇൻസ്റ്റാൾ ചെയ്യണോ?
core.firmware.title.restart = പുതിയ ഫേംവെയറിലേക്ക് റീസ്റ്റാർട്ട് ചെയ്യണോ?
core.firmware.asked-by = {name} ആവശ്യപ്പെട്ടത്.
core.firmware.image = {project} {version}
core.firmware.signed = {key} ഒപ്പിട്ടത്.
core.firmware.other-key = PaperPaw-യുടേതല്ലാത്ത ഒരു കീ ഉപയോഗിച്ച് ഒപ്പിട്ടത്: {fingerprint}. അത് വിശ്വസിക്കുന്നുവെങ്കിൽ മാത്രം ഇൻസ്റ്റാൾ ചെയ്യുക.
core.firmware.unsigned = ഒപ്പിട്ടിട്ടില്ല.
core.firmware.older = ഇത് പഴയ പതിപ്പാണ്, അല്ലെങ്കിൽ ഇതേ പതിപ്പ്.
core.firmware.foreign.1 = ഇത് PaperPaw അല്ല, മറ്റൊരു ഫേംവെയറാണ്. PaperPaw സ്വയം വീണ്ടും ആരംഭിക്കില്ല.
core.firmware.foreign.2 = PaperPaw ഇത് പഴയപടിയാക്കില്ല. തിരികെ വരാൻ മറ്റേ ഫേംവെയറോ ഒരു ഫ്ലാഷ് ടൂളോ വേണം (വെബ് ഫ്ലാഷർ പ്രവർത്തിക്കും).
core.firmware.foreign.3 = PaperPaw ഫ്ലാഷിൽ തുടരും, കാർഡിലെ നിങ്ങളുടെ ഫയലുകൾ തൊടില്ല.
core.firmware.foreign.4 = ഇത് ഒപ്പിട്ടതല്ല, ബൂട്ട് ലോഡർ ആരംഭിക്കുന്നതുപോലെ മാത്രം പരിശോധിച്ചു.
core.firmware.yes = ഇൻസ്റ്റാൾ ചെയ്യുക
core.firmware.yes.restart = റീസ്റ്റാർട്ട് ചെയ്യുക
core.firmware.no = റദ്ദാക്കുക
core.firmware.dual.title = ഈ ഉപകരണം PaperPaw-യുടെ സ്വന്തമായി കണക്കാക്കണോ?
core.firmware.dual.what = അപ്പോൾ PaperPaw ഈ ഉപകരണം സ്വന്തമായി കണക്കാക്കും. അടുത്ത അപ്ഡേറ്റ് മറ്റേ ഫേംവെയർ മായ്ക്കും, നിങ്ങൾക്ക് അത് തിരികെ കൊണ്ടുവരാനാവില്ല: രണ്ടും സജ്ജീകരിച്ച ടൂളിന് മാത്രമേ കഴിയൂ.
core.firmware.dual.yes = സ്വന്തമായി കണക്കാക്കുക
core.plugin.title = ഈ പ്ലഗിൻ ഇൻസ്റ്റാൾ ചെയ്യണോ?
