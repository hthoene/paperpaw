translate.plugin.how = "“വിവർത്തനം” തിരഞ്ഞെടുത്ത ടെക്സ്റ്റ് DeepL ഉപയോഗിച്ച് ഓൺലൈനായി വിവർത്തനം ചെയ്യുന്നു. പുസ്തകത്തിൽ ടെക്സ്റ്റ് തിരഞ്ഞെടുത്ത് അതിന്റെ മെനുവിൽ “വിവർത്തനം ചെയ്യുക” തിരഞ്ഞെടുക്കുക: ഒരു നിഘണ്ടു എൻട്രി പോലെ പേജിന് മുകളിൽ വിവർത്തനം കാണാം. പേജ് ബട്ടണുകളോ ടാപ്പുകളോ അത് സ്ക്രോൾ ചെയ്യുന്നു; “തിരഞ്ഞെടുക്കുക” അല്ലെങ്കിൽ അവസാനം ഒരു ടാപ്പ് അത് അടയ്ക്കുന്നു.\n\nഇതിന് നെറ്റ്വർക്കും നിങ്ങളുടെ സ്വന്തം DeepL API കീയും വേണം, deepl.com-ൽ സൗജന്യം (DeepL API Free, മാസം ഏകദേശം 500,000 അക്ഷരങ്ങൾ). കീ നൽകുന്നത് വരെ പാനൽ അത് പറയും, ഒരു ടാപ്പ് കീ ചോദിക്കും.\n\nക്രമീകരണം › വായന › വിവർത്തനം എന്നതിൽ “ഇതിലേക്ക് വിവർത്തനം ചെയ്യുക” ഭാഷ നിശ്ചയിക്കുന്നു; തുടക്കത്തിൽ അത് PaperPaw-ന്റെ ഭാഷയാണ്."
