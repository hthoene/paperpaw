format-cbz.setting.direction.help = മാംഗ: പേജ് മറിക്കൽ തിരിച്ചാകും.
format-cbz.direction.book = പുസ്തകം പറയുന്നതുപോലെ
format-cbz.direction.ltr = ഇടത്തുനിന്ന് വലത്തേക്ക്
format-cbz.direction.rtl = വലത്തുനിന്ന് ഇടത്തേക്ക്
