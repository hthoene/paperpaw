core.config-unreadable = {file} വായിക്കാനായില്ല, അതിനാൽ ക്രമീകരണങ്ങളിലെ മാറ്റങ്ങൾ സംരക്ഷിക്കില്ല. കമ്പ്യൂട്ടറിൽ ഫയൽ ശരിയാക്കുകയോ നീക്കം ചെയ്യുകയോ ചെയ്യുക.
core.secrets-unreadable = {file} വായിക്കാനായില്ല, അതിനാൽ പാസ്വേഡുകളും കീകളും സംരക്ഷിക്കില്ല. കമ്പ്യൂട്ടറിൽ ഫയൽ ശരിയാക്കുകയോ നീക്കം ചെയ്യുകയോ ചെയ്യുക.
core.secrets-unopened = ഈ കാർഡിൽ സംരക്ഷിച്ച ചില പാസ്വേഡുകളും കീകളും ഇവിടെ തുറക്കാനാവില്ല: അവ മറ്റൊരു ഉപകരണത്തിൽ സംരക്ഷിച്ചതാണ്, അല്ലെങ്കിൽ ഈ ഉപകരണത്തിന്റെ കീ നഷ്ടപ്പെട്ടു. ഒരു പ്ലഗിൻ ആവശ്യപ്പെടുമ്പോൾ അവ വീണ്ടും നൽകുക.
core.secrets-unsupported = ഈ ഉപകരണത്തിന് ഇതുവരെ പാസ്വേഡുകൾ സംരക്ഷിക്കാനാവില്ല. paperpaw.org-ലെ വെബ് ഫ്ലാഷർ ഉപയോഗിച്ച് PaperPaw ഒരിക്കൽ വീണ്ടും ഇൻസ്റ്റാൾ ചെയ്യുക, അപ്പോൾ ഇത് പ്രവർത്തിക്കും.
core.card.missing = മെമ്മറി കാർഡ് കണ്ടെത്തിയില്ല, അതിനാൽ ഒന്നും സംരക്ഷിക്കില്ല. ഒരു FAT32 കാർഡ് ചേർത്ത് റീസ്റ്റാർട്ട് ചെയ്യുക.
core.card.unreadable = മെമ്മറി കാർഡ് വായിക്കാനാവുന്നില്ല, അതിനാൽ ഒന്നും സംരക്ഷിക്കില്ല. മറ്റൊരു കാർഡ് ഉപയോഗിച്ചുനോക്കുക.
core.card.exfat-experimental = ഈ മെമ്മറി കാർഡ് exFAT ആണ്. exFAT പിന്തുണ പരീക്ഷണാത്മകമാണ്; FAT32 ആണ് ഏറ്റവും സുരക്ഷിതം.
core.card.no-fat = മെമ്മറി കാർഡ് FAT32 അല്ല, അതിനാൽ ഒന്നും സംരക്ഷിക്കില്ല. കമ്പ്യൂട്ടറിൽ അത് FAT32 ആയി ഫോർമാറ്റ് ചെയ്യുക.
