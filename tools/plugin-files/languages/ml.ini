vocabulary.plugin.name = പദാവലി
vocabulary.plugin.description = നിങ്ങൾ തിരയുന്ന വാക്കുകൾ അവയുടെ വാക്യങ്ങളോടെ സൂക്ഷിക്കുന്നു, ഫോണിൽ ഉണ്ടാക്കിയ ഫ്ലാഷ് കാർഡുകൾ ഇടവിട്ടുള്ള ആവർത്തനത്തോടെ പഠിപ്പിക്കുന്നു.
vocabulary.plugin.how = "വായിക്കുമ്പോൾ തിരയുന്ന വാക്കുകൾ അവയുടെ വാക്യത്തോടെ പദാവലി സൂക്ഷിക്കുന്നു. ലിസ്റ്റ് ടൂളുകളിൽ, പുതിയത് ആദ്യം; ഒരു വാക്ക് തിരഞ്ഞെടുത്താൽ വീണ്ടും തിരയും. “എക്സ്പോർട്ട്” അവയെ Anki പോലുള്ള ആപ്പുകൾക്കായി സംരക്ഷിക്കുന്നു. പുതിയ 2,000 വാക്കുകൾ മാത്രം നിലനിൽക്കും; എല്ലാം സൂക്ഷിക്കാൻ മുമ്പേ എക്സ്പോർട്ട് ചെയ്യുക.\n\nഫ്ലാഷ് കാർഡുകൾ (ടൂളുകളിൽ): “ഉത്തരം കാണിക്കുക” കഴിഞ്ഞ് ഓരോ കാർഡിനും “വീണ്ടും”, “പ്രയാസം”, “നല്ലത്”, “എളുപ്പം” നൽകുക; അത് കാർഡ് തിരിച്ചുവരുന്ന സമയം നിശ്ചയിക്കും. “ഫോണിൽ എഡിറ്റ് ചെയ്യുക”: ഒരേ Wi-Fi-യിലുള്ള ഫോണിൽ കോഡ് സ്കാൻ ചെയ്ത് ഡെക്കുകളും കാർഡുകളും ഉണ്ടാക്കുക; “ഒരുമിച്ച് നിരവധി കാർഡുകൾ” വഴി CSV, TSV, TXT ഫയൽ (ഓരോ വരിയിലും: മുൻവശം, പിൻവശം, ഉദാഹരണം; UTF-8), ലിസ്റ്റ്, അല്ലെങ്കിൽ Anki ഡെക്ക് (.apkg, “Support older Anki versions” ഓണാക്കി എക്സ്പോർട്ട് ചെയ്തത്) ചേർക്കാം.\n\nഅല്ലെങ്കിൽ SD കാർഡിലെ Flashcards ഫോൾഡറിൽ ഓരോ ഡെക്കിനും ഒരു ഫയൽ ഇടുക (Spanish.tsv = ഡെക്ക് Spanish), തുടർന്ന് “SD കാർഡിലെ കാർഡുകൾ” തിരഞ്ഞെടുക്കുക. പുതിയതോ മാറിയതോ ആയ ഫയൽ ഡെക്കിൽ ചേർക്കും: പിൻവശമോ ഉദാഹരണമോ മാറ്റിയാൽ പുരോഗതി നിലനിൽക്കും; മുൻവശം മാറ്റിയാൽ പുതിയ കാർഡാകും. ഫയലിൽ നിന്ന് നീക്കിയ വരി കാർഡ് ഇല്ലാതാക്കില്ല, ആ ഡെക്കിന് “ഫയലിൽ ഇല്ലാത്ത കാർഡുകൾ” “നീക്കം ചെയ്യുക” ആക്കിയില്ലെങ്കിൽ. “കാർഡിലേക്ക് സംരക്ഷിക്കുക” ഡെക്ക് ഫയലിലേക്ക് എഴുതും (id കോളത്തോടെ). പരമാവധി 4 MiB, 20,000 വരി; UTF-16 വായിക്കില്ല.\n\nക്രമീകരണം › വായന: “തിരഞ്ഞ വാക്കുകളെ കാർഡുകളാക്കുക” ഓരോ വാക്കും “തിരഞ്ഞവ” ഡെക്കിൽ ചേർക്കും."
