bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = റിമോട്ടുകൾ, കീബോർഡുകൾ, സെൻസറുകൾ എന്നിവ ജോടിയാക്കി കണക്റ്റ് ചെയ്യുന്നു.
bluetooth.plugin.how = "Bluetooth ഉള്ള റീഡറിൽ (X4 Pro) റിമോട്ടുകൾ, കീബോർഡുകൾ, സെൻസറുകൾ എന്നിവ ജോടിയാക്കുന്നു.\n\n“ഉപകരണം ചേർക്കുക” പരിധിയിലുള്ളവ തിരയുന്നു; ആദ്യം ഉപകരണം ജോടിയാക്കൽ മോഡിലാക്കുക. അത് തിരഞ്ഞെടുത്ത് റീഡറിൽ സ്ഥിരീകരിക്കുക (ഒരു നമ്പർ കാണിച്ചാൽ ഒത്തുനോക്കുക). തുടർന്ന് റിമോട്ടിന്റെയോ കീബോർഡിന്റെയോ ബട്ടണുകൾ പേജ് മറിക്കുകയും മെനുകളിലൂടെ നീങ്ങുകയും ചെയ്യും; ഓരോ ബട്ടണും എന്തുചെയ്യുമെന്ന് “നിയന്ത്രണങ്ങൾ” എന്നതിൽ മാറ്റാം.\n\nബട്ടണുകൾ എപ്പോൾ പ്രവർത്തിക്കുമെന്ന് “റിമോട്ടുകൾ” നിശ്ചയിക്കുന്നു: ഇവിടെ ഓണാക്കുമ്പോൾ, വായിക്കുമ്പോൾ (പുസ്തകം തുറന്നിരിക്കുമ്പോൾ കണക്റ്റ് ചെയ്യും, ബാറ്ററി ലാഭിക്കും), അല്ലെങ്കിൽ എപ്പോഴും. മെനു ബട്ടണോ ഒരു ഉപകരണത്തിൽ അമർത്തിപ്പിടിക്കലോ അതിനെ മറക്കും.\n\nസെൻസർ പ്ലഗിനുകൾക്കുള്ളതാണ്: ഏത് പ്ലഗിന് അത് ഉപയോഗിക്കാമെന്ന് ഓണാക്കുക. ഒന്നും ഉപയോഗിക്കാത്തപ്പോൾ Bluetooth ഓഫാണ്."
