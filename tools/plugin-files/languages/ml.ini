aids.plugin.name = വായനാ സഹായികൾ
aids.plugin.description = ബോൾഡ് ആയ വാക്കുതുടക്കങ്ങൾ, മാറ്റിയ വാക്കുകൾ, ചിത്രങ്ങൾ: നിങ്ങൾ ആഗ്രഹിക്കുന്നതുപോലെ ടെക്സ്റ്റ്.
aids.plugin.how = "വായിക്കുമ്പോൾ പുസ്തകത്തിന്റെ ടെക്സ്റ്റ് എങ്ങനെ കാണപ്പെടുന്നു എന്ന് വായനാ സഹായികൾ മാറ്റുന്നു. ഇവ എല്ലാ പുസ്തകങ്ങൾക്കും ബാധകമാണ്. “ബോൾഡ് വാക്കുതുടക്കം”, “വാക്കുകൾ മാറ്റുക” എന്നിവ ആദ്യം ഓഫാണ്.\n\nക്രമീകരണത്തിൽ “വായന” എന്നതിന് കീഴിൽ “വായനാ സഹായികൾ” എന്ന വിഭാഗത്തിൽ ഇവ കാണാം. “ബോൾഡ് വാക്കുതുടക്കം” ഓരോ വാക്കിന്റെയും ആദ്യ പകുതി ബോൾഡ് ആക്കുന്നു, ചിലർക്ക് ഇത് വായന എളുപ്പമാക്കും. “വാക്കുകൾ മാറ്റുക” അർധവിരാമം കൊണ്ട് വേർതിരിച്ച “colour = color; Mr. = Mister” പോലുള്ള ജോഡികൾ സ്വീകരിക്കുന്നു.\n\nനിങ്ങൾ എഴുതിയതുപോലെ കൃത്യമായി മുഴുവൻ വാക്കുകൾ മാത്രമേ മാറ്റൂ, അതിനാൽ “color” ഒരു നീണ്ട വാക്കിന്റെ ഭാഗം ഒരിക്കലും മാറ്റില്ല. പുസ്തക ഫയലിന് മാറ്റമില്ല.\n\nപുസ്തകങ്ങളിലെ ചിത്രങ്ങൾ കാണിക്കാം (ആദ്യം ഇങ്ങനെ), ചിത്രത്തിന്റെ വിവരണം ഉപയോഗിക്കുന്ന “[ചിത്രം: കടലിൽ ഒരു കപ്പൽ]” പോലുള്ള ചെറിയ വരിയാക്കാം, അല്ലെങ്കിൽ ഒഴിവാക്കാം. അപ്പോൾ പേജിൽ ടെക്സ്റ്റിന് കൂടുതൽ ഇടമുണ്ടാകും, കാണിക്കാത്ത ചിത്രം ഡീകോഡ് ചെയ്യാത്തതിനാൽ പേജുകൾ വേഗത്തിൽ മറിയും. കോമിക്കുകൾക്കും ചിത്രങ്ങൾ കൊണ്ടുള്ള മറ്റ് പുസ്തകങ്ങൾക്കും മാറ്റമില്ല."
