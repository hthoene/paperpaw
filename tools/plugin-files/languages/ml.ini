core.plugin.sideload = ഇത് സ്റ്റോറിൽ നിന്നുള്ളതല്ല: ഇതിന് ആരും ഉറപ്പുനൽകുന്നില്ല.
core.plugin.uses = ഇത് ഉപയോഗിക്കുന്നത്: {keys}.
core.plugin.yes = ഇൻസ്റ്റാൾ ചെയ്യുക
core.plugin.remove-data = പ്ലഗിനോടൊപ്പം നീക്കം ചെയ്യാത്തപക്ഷം അതിന്റെ ഡാറ്റ ഫോൾഡർ നിലനിർത്തും.
core.plugin.yes.remove = നീക്കം ചെയ്യുക, ഡാറ്റ നിലനിർത്തുക
core.plugin.yes.remove-data = ഡാറ്റയോടൊപ്പം നീക്കം ചെയ്യുക
core.plugin.old-secrets = ഈ പ്ലഗിന്റെ മുമ്പത്തെ ഇൻസ്റ്റാളേഷൻ സംരക്ഷിച്ച പാസ്വേഡുകൾ ഇപ്പോഴും കാർഡിലുണ്ട്. ആദ്യം അവ മായ്ക്കും; അല്ലാതെ ഇത് ഇൻസ്റ്റാൾ ചെയ്യില്ല.
core.plugin.yes.erase = പഴയ ഡാറ്റ മായ്ച്ച് ഇൻസ്റ്റാൾ ചെയ്യുക
core.screen.open-failed = ഈ സ്ക്രീൻ തുറക്കാനായില്ല.
core.screen.no-memory = ഇതിന് മതിയായ മെമ്മറിയില്ല. എന്തെങ്കിലും അടച്ച് വീണ്ടും ശ്രമിക്കുക.
core.plugin.unforgotten = നീക്കം ചെയ്ത പ്ലഗിൻ {id}-ന്റെ സംരക്ഷിച്ച രഹസ്യങ്ങൾ മായ്ക്കാനായില്ല. അവ കാർഡിൽ തുടരും.
core.low-memory.title = മെമ്മറി കുറവാണ്
core.low-memory.text = ഈ പ്ലഗിനുകൾക്കൊപ്പം മെമ്മറി കുറവാണ്. ചിത്രങ്ങളും കവറുകളും കാണാതായേക്കാം, പുസ്തകങ്ങൾ പതുക്കെ തുറക്കും. “പ്ലഗിനുകൾ” എന്നതിൽ ഒന്ന് ഓഫാക്കുക.
