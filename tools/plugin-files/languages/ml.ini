core.setting.space-size = വലുപ്പം
core.setting.space-size.help = ഓരോ ഇടത്തിന്റെയും ഉയരം.
core.setting.align = വിന്യാസം
core.setting.align.help = വിജറ്റിന്റെ ടെക്സ്റ്റ് അതിന്റെ സ്ഥാനത്ത് എവിടെ: ഇടത്, മധ്യത്തിൽ അല്ലെങ്കിൽ വലത്.
