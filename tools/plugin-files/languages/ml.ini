power.plugin.name = പവർ
power.plugin.description = പവർ മോഡ് തിരഞ്ഞെടുക്കുന്നു, കൈകൊണ്ടോ ബാറ്ററി അനുസരിച്ചോ: സാധാരണ, ലാഭം, ഓഫ്ലൈൻ.
power.plugin.how = "PaperPaw ബാറ്ററി എങ്ങനെ ചെലവഴിക്കണമെന്ന് പവർ തിരഞ്ഞെടുക്കുന്നു: സാധാരണ, ലാഭം അല്ലെങ്കിൽ ഓഫ്ലൈൻ. കാത്തിരിക്കാവുന്നവ “ലാഭം” നല്ല സമയത്തേക്ക് മാറ്റുന്നു; “ഓഫ്ലൈൻ” റേഡിയോ ഓഫാക്കി വയ്ക്കുന്നു. “സ്വയമേവ” ബാറ്ററി അനുസരിച്ച് തിരഞ്ഞെടുക്കുന്നു.\n\nദ്രുത പാനലിൽ (പവർ മോഡുകൾ അടുത്തടുത്ത് കാണിക്കുന്നു) അല്ലെങ്കിൽ ക്രമീകരണത്തിലെ “പവർ” എന്നതിൽ മോഡ് മാറ്റുക. “സ്വയമേവ” ലാഭത്തിലേക്കും ഓഫ്ലൈനിലേക്കും മാറുന്ന നിലകളും, ചാർജ് ചെയ്യുമ്പോൾ സാധാരണയായി തുടരണോ എന്നും അവിടെ സജ്ജമാക്കാം.\n\nസ്റ്റാറ്റസ് ലൈനുകളിൽ “പവർ മോഡ്” ലാഭത്തിൽ ഒരു ഇലയും ഓഫ്ലൈനിൽ വെട്ടിയ Wi-Fi-യും കാണിക്കുന്നു, സാധാരണയിൽ ഒന്നുമില്ല.\n\nഒരു ചെറിയ മെനു തുറക്കാൻ പവർ ബട്ടൺ അമർത്തിപ്പിടിക്കുക: സ്ലീപ്പ്, ഓഫാക്കുക (PaperPaw-ന് കഴിയുന്നിടത്ത്), റീസ്റ്റാർട്ട്, ടച്ച് ഉപകരണങ്ങളിൽ “ടച്ച് ലോക്ക് ചെയ്യുക” അല്ലെങ്കിൽ “ടച്ച് അൺലോക്ക് ചെയ്യുക”. ചെറിയ അമർത്തൽ ഇപ്പോഴും ഉപകരണത്തെ സ്ലീപ്പിലാക്കും. “മടങ്ങുക” മെനു അടയ്ക്കും."
