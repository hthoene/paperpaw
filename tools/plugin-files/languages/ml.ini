core.clean-up.text = വായനാസ്ഥാനം, ബുക്ക്മാർക്കുകൾ, ഹൈലൈറ്റുകൾ, കുറിപ്പുകൾ എന്നിവ എന്നെന്നേക്കുമായി നഷ്ടമാകും. കമ്പ്യൂട്ടറിൽ പേരുമാറ്റുകയോ നീക്കുകയോ ചെയ്ത പുസ്തകവും ചേർക്കാത്ത മെമ്മറി കാർഡിലെ പുസ്തകവും കണ്ടെത്താനാവില്ല.
core.clean-up.yes = നീക്കം ചെയ്യുക
core.clean-up.no = നിലനിർത്തുക
core.clean-up-failed = ഒന്നും വൃത്തിയാക്കിയില്ല: മെമ്മറി കാർഡിലെ ഒരു ഫോൾഡർ വായിക്കാനായില്ല.
core.cleaned-up = വൃത്തിയാക്കി: ഇപ്പോൾ ഇല്ലാത്ത പുസ്തകങ്ങളുടെ {count} ശേഷിപ്പുകൾ
