mail.password.help = മിക്ക ദാതാക്കളും അക്കൗണ്ട് ക്രമീകരണത്തിൽ നിർമ്മിച്ച ആപ്പ് പാസ്വേഡ് ആവശ്യപ്പെടുന്നു, സാധാരണ പാസ്വേഡ് അല്ല. ഇത് ക്രമീകരണത്തിലല്ല, പാസ്വേഡുകൾക്കും കീകൾക്കുമൊപ്പം സൂക്ഷിക്കുന്നു.
