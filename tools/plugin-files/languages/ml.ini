dictionary.plugin.name = നിഘണ്ടു
dictionary.plugin.description = StarDict നിഘണ്ടുക്കളിൽ വാക്കുകൾ തിരയുന്നു.
dictionary.plugin.how = "പുസ്തകത്തിലെ ഒരു വാക്ക് StarDict നിഘണ്ടുക്കളിൽ തിരഞ്ഞ്, സ്ക്രീനിന്റെ താഴ്ഭാഗത്തുള്ള പാനലിൽ അർത്ഥങ്ങൾ കാണിക്കുന്നു.\n\nവായിക്കുമ്പോൾ ഒരു വാക്ക് അമർത്തിപ്പിടിച്ച് “തിരയുക” തിരഞ്ഞെടുക്കുക; ബട്ടണുകളിൽ “കൂടുതൽ” എന്നതിലെ “ടെക്സ്റ്റ് തിരഞ്ഞെടുക്കുക” ഉപയോഗിക്കുക. നിഘണ്ടു ഫോൾഡറുകൾ (.ifo, .idx, .dict ഫയലുകളോടെ) ഉപകരണത്തിലെ “dictionaries” ഫോൾഡറിലേക്ക് പകർത്തുക (ഉപഫോൾഡറുകളും ആകാം), അല്ലെങ്കിൽ ക്രമീകരണം › വായന › നിഘണ്ടു ഫോൾഡർ (വിപുലമായ ക്രമീകരണം) എന്നതിൽ മറ്റൊരു ഫോൾഡർ തിരഞ്ഞെടുക്കുക. ആദ്യ തിരയലിൽ ഓരോ നിഘണ്ടുവിനും ഒരു ചെറിയ സൂചിക തയ്യാറാക്കും, അതിന് അൽപ്പസമയമെടുക്കും.\n\nപാനലിൽ പേജ് ബട്ടണുകൾ അല്ലെങ്കിൽ മുകളിലേക്ക്/താഴേക്ക് നീണ്ട അർത്ഥങ്ങൾ സ്ക്രോൾ ചെയ്യും, “മടങ്ങുക” അത് അടയ്ക്കും. ടച്ചിൽ പുറത്ത് ടാപ്പ് ചെയ്ത് അടയ്ക്കുക."
