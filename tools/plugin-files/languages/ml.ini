news.plugin.name = വാർത്തകൾ
news.plugin.description = വാർത്താ ഫീഡുകൾ (RSS, Atom) വായിക്കാനുള്ള പുസ്തകങ്ങളായി എടുക്കുന്നു.
news.plugin.how = "വാർത്തകൾ RSS അല്ലെങ്കിൽ Atom ഫീഡുകളെ പുസ്തകങ്ങളാക്കുന്നു. ഓരോ ഫീഡും ലൈബ്രറിയിലെ വാർത്താ ഫോൾഡറിൽ ഒരു പുസ്തകമാകുന്നു, അതിലെ പുതിയ ലേഖനങ്ങൾ പ്ലെയിൻ ടെക്സ്റ്റായി, മറ്റേതൊരു പുസ്തകത്തെയും പോലെ വായിക്കാൻ.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് വാർത്തകൾ തുറന്ന് “ഫീഡ് ചേർക്കുക” തിരഞ്ഞെടുക്കുക; അതിന്റെ വിലാസം പത്രത്തിന്റെയോ ബ്ലോഗിന്റെയോ വെബ്സൈറ്റിലുണ്ട്. “വാർത്തകൾ എടുക്കുക” എല്ലാ ഫീഡുകളും എടുത്ത് പഴയ പുസ്തകങ്ങൾ മാറ്റിസ്ഥാപിക്കുന്നു. ഒരു ഫീഡ് മാത്രം എടുക്കാനോ നീക്കം ചെയ്യാനോ അത് അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക). നീക്കം ചെയ്ത ഫീഡിന്റെ പുസ്തകം ലൈബ്രറിയിൽ ശേഷിക്കും.\n\nഎടുക്കാൻ നെറ്റ്വർക്ക് വേണം. “ഒരു ഫീഡിലെ ലേഖനങ്ങൾ” (ക്രമീകരണം, ലൈബ്രറി) ഓരോ പുസ്തകത്തിലും എത്ര ലേഖനങ്ങൾ എന്ന് നിശ്ചയിക്കുന്നു. “വാർത്താ തലക്കെട്ടുകൾ” വിജറ്റ് അവ ഹോം സ്ക്രീനിൽ കാണിക്കുന്നു."
