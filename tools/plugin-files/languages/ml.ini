reading-goal.plugin.name = വായനാ ലക്ഷ്യം
reading-goal.plugin.description = ദിവസവും വായിക്കേണ്ട മിനിറ്റുകൾ, ഒപ്പം ഇന്നത്തെ വായനയനുസരിച്ച് മൂഡ് മാറുന്ന ഹോം സ്ക്രീനിലെ ഒരു പൂച്ച.
reading-goal.plugin.how = "ഇന്നത്തെ വായന എങ്ങനെ പോകുന്നുവെന്ന് ഹോം സ്ക്രീനിലെ ഒരു പൂച്ച കാണിക്കുന്നു: ഇതുവരെ വായിച്ചില്ലെങ്കിൽ സങ്കടം, അൽപ്പം വായിച്ചാൽ ഒരുവിധം, ദൈനംദിന ലക്ഷ്യത്തിന്റെ പകുതി മുതൽ തൃപ്തി, ലക്ഷ്യം എത്തിയാൽ സന്തോഷം.\n\n“വായനാ പൂച്ച” വിജറ്റ് ഹോം സ്ക്രീനിൽ ചേർക്കുക (ഹോം സ്ക്രീൻ അമർത്തിപ്പിടിച്ച് ഒരു വിജറ്റ് ചേർക്കുക), അല്ലെങ്കിൽ സ്ലീപ്പ് സ്ക്രീനായി “ഇന്നത്തെ വായനാ പൂച്ച” തിരഞ്ഞെടുക്കുക. പൂച്ചയിൽ ടാപ്പ് ചെയ്താൽ ദൈനംദിന ലക്ഷ്യം തുറക്കും; നിങ്ങൾ വായിച്ച മിനിറ്റുകൾ എണ്ണുന്ന വായനാ സ്ഥിതിവിവരക്കണക്കുകളുടെ ലക്ഷ്യമാണിത്.\n\nക്രമീകരണത്തിൽ “വായന” എന്നതിനു കീഴിൽ, ലക്ഷ്യത്തിന്റെ എത്ര ഭാഗം മുതൽ പൂച്ച തൃപ്തനോ സന്തുഷ്ടനോ ആകുമെന്ന് “തൃപ്തി മുതൽ”, “സന്തോഷം മുതൽ” എന്നിവ നിശ്ചയിക്കുന്നു; പൂച്ചകൾക്കു പകരം കാണിക്കാനുള്ള ചിത്രങ്ങളുടെ (sad, meh, content, happy) ഫോൾഡർ “സ്വന്തം ചിത്രങ്ങൾ” നിശ്ചയിക്കുന്നു. ചിത്രങ്ങൾ PNG അല്ലെങ്കിൽ JPEG ഫയലുകളാണ്; ഫോൾഡർ ഇല്ലെങ്കിൽ പൂച്ചകളെ കാണിക്കും."
