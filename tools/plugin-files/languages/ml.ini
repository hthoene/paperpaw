mail.plugin.name = മെയിൽ
mail.plugin.description = പാസ്വേഡോ ആപ്പ് പാസ്വേഡോ ഉപയോഗിച്ച് ഇമെയിൽ വായിക്കുകയും അയയ്ക്കുകയും ചെയ്യുന്നു (IMAP, SMTP), ബ്രൗസർ ലോഗിൻ ഇല്ലാതെ.
mail.plugin.how = "മെയിൽ IMAP, SMTP വഴി ഇമെയിൽ വായിക്കുകയും അയയ്ക്കുകയും ചെയ്യുന്നു. വിലാസവും പാസ്വേഡും കൊണ്ട് സൈൻ ഇൻ ചെയ്യുന്നു, ബ്രൗസർ ലോഗിൻ ഇല്ല.\n\nക്രമീകരണത്തിൽ “മെയിൽ” എന്നതിൽ അക്കൗണ്ട് സജ്ജീകരിക്കുക: ദാതാവ്, വിലാസം, പാസ്വേഡ്. മിക്ക ദാതാക്കളും ആപ്പ് പാസ്വേഡ് ആവശ്യപ്പെടുന്നു: അക്കൗണ്ടിന്റെ സുരക്ഷാ ക്രമീകരണത്തിൽ ഒന്ന് നിർമ്മിച്ച് ഇവിടെ നൽകുക. അത് ദാതാവിന്റെ സെർവറിലേക്ക് മാത്രം പോകുന്നു, പാസ്വേഡുകൾക്കും കീകൾക്കുമൊപ്പം സൂക്ഷിക്കുന്നു.\n\nടൂളുകളിൽ മെയിൽ തുറക്കുക. “മെയിൽ പരിശോധിക്കുക” പുതിയ മെയിലുകളും ഫോൾഡറുകളും എടുക്കുന്നു. മെയിലുകൾ കാർഡിൽ സൂക്ഷിക്കുന്നതിനാൽ നെറ്റ്വർക്ക് ഇല്ലാതെയും വായിക്കാം; Wi-Fi ഒരു നിമിഷം മാത്രം ഓണാകും.\n\nദാതാവ് ലിസ്റ്റിൽ ഇല്ലെങ്കിൽ “സ്വന്തം സെർവറുകൾ” തിരഞ്ഞെടുത്ത് വിപുലമായ ക്രമീകരണത്തിൽ സെർവറുകൾ, പോർട്ടുകൾ, സുരക്ഷ എന്നിവ നൽകുക. അംഗീകൃതമല്ലാത്ത സർട്ടിഫിക്കറ്റുള്ള സെർവർ വിശ്വസിക്കണോ എന്ന് ഒരിക്കൽ ചോദിക്കും; ഫിംഗർപ്രിന്റ് ദാതാവ് കാണിക്കുന്നതുമായി ഒത്തുനോക്കുക.\n\nപുസ്തകം (EPUB, PDF മുതലായവ, 2 MB വരെ) അറ്റാച്ച് ചെയ്ത മെയിലിനു താഴെ “പുസ്തകം തുറക്കുക” ഉണ്ട്: അത് ലൈബ്രറിയിൽ ചേർത്ത് തുറക്കുന്നു.\n\n“പശ്ചാത്തലത്തിൽ പുതിയ മെയിൽ പരിശോധിക്കുക” (സ്വതേ ഓഫ്) ഓണാക്കി ഇടവേള (15, 30, 60 മിനിറ്റ്) തിരഞ്ഞെടുത്താൽ, റീഡർ ഉണർന്ന് ഓൺലൈനായിരിക്കുമ്പോൾ ഇടയ്ക്കിടെ പരിശോധിച്ച് ഹോമിലെ വായിക്കാത്തവയുടെ എണ്ണം പുതുക്കും; കുറച്ച് ബാറ്ററി ചെലവാകും.\n\nഹോം സ്ക്രീൻ വിജറ്റുകൾ: വായിക്കാത്തവയുടെ എണ്ണം, പുതിയതും നക്ഷത്രമിട്ടതുമായ മെയിലുകൾ, ഒരു മെയിൽബോക്സ്, മെയിൽ എഴുതാനുള്ള കുറുക്കുവഴി."
