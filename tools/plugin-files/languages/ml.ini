format-cbz.plugin.name = കോമിക് പുസ്തകങ്ങൾ
format-cbz.plugin.description = കോമിക് ബുക്ക് ആർക്കൈവുകൾ (.cbz) തുറക്കുന്നു, ഒരു പേജിൽ ഒരു ചിത്രം.
format-cbz.plugin.how = "കോമിക് ബുക്ക് ആർക്കൈവുകൾ (.cbz) തുറക്കുന്നു: ഒരു പേജിൽ ഒരു ചിത്രം, സ്ക്രീനിന് അനുയോജ്യമായി, പേരുകളുടെ ക്രമത്തിൽ (10-ന് മുമ്പ് 2).\n\nഅവ ലൈബ്രറി ഫോൾഡറിൽ വച്ച് ലൈബ്രറിയിൽ നിന്ന് തുറക്കുക; ഏത് പുസ്തകത്തിലുമെന്ന പോലെ പേജുകൾ മറിക്കുക. വലിയ ചിത്രങ്ങൾക്ക് ആദ്യ തവണ അൽപ്പസമയമെടുക്കും, X4-ൽ കൂടുതൽ.\n\nവായനാ ക്രമീകരണം (ക്രമീകരണം, വായന): “പാനൽ തോറും” ഒരു പേജിലെ ഓരോ പാനലും സ്ക്രീൻ അനുവദിക്കുന്നത്ര വലുതായി കാണിക്കും, പേജ് മറിക്കൽ അവയിലൂടെ നീങ്ങും; പാനലുകളില്ലാത്ത പേജ് മുഴുവനായി കാണിക്കും. “കോമിക് പേജുകളുടെ ദിശ” മാംഗയ്ക്കായി (വലത്തുനിന്ന് ഇടത്തേക്ക്) പേജ് മറിക്കൽ തിരിക്കും; പുസ്തകത്തിന്റെ ComicInfo.xml ഇത് സ്വയം പറയും. ലൈബ്രറി ComicInfo.xml-ൽ നിന്ന് ശീർഷകവും പരമ്പരയും നമ്പറും കാണിക്കും."
format-cbz.title = കോമിക് പുസ്തകം (CBZ)
