rules.plugin.name = നിയമങ്ങൾ
rules.plugin.description = എന്തെങ്കിലും സംഭവിക്കുമ്പോൾ എന്തെങ്കിലും ചെയ്യുന്നു: ഉദാ. 22:00-ന് രാത്രി മോഡ്.
rules.plugin.how = "എന്തെങ്കിലും സംഭവിക്കുമ്പോൾ ഒരു നിയമം സ്വയം എന്തെങ്കിലും ചെയ്യുന്നു: എല്ലാ ദിവസവും 22:00-ന് രാത്രി മോഡ് ഓൺ, അല്ലെങ്കിൽ PaperPaw തുടങ്ങുമ്പോൾ കാറ്റലോഗുകൾ സമന്വയിപ്പിക്കുക.\n\nക്രമീകരണത്തിൽ “ഇഷ്ടാനുസൃതമാക്കുക” എന്നതിനു കീഴിൽ “നിയമങ്ങൾ” കാണാം. “നിയമം ചേർക്കുക” ചോദിക്കും: “എപ്പോൾ?” (PaperPaw തുടങ്ങുമ്പോൾ, ഒരു സമയം, പുസ്തകം തുറക്കുകയോ അടയ്ക്കുകയോ ചെയ്യുമ്പോൾ, ബാറ്ററി, ചാർജിംഗ്, ഒരു സ്വിച്ച് തുടങ്ങിയവ), “പിന്നെ എന്ത്?” (ഒരു പ്രവർത്തനം നടത്തുക, സ്വിച്ച് ഓണാക്കുകയോ ഓഫാക്കുകയോ ചെയ്യുക, ഒരു സംഖ്യ സജ്ജമാക്കുക, ഒരു സന്ദേശം കാണിക്കുക). നിയമം താൽക്കാലികമായി നിർത്താൻ അതിൽ ടാപ്പ് ചെയ്യുക; “രണ്ട് സമയങ്ങൾക്കിടയിൽ” പോലുള്ള വ്യവസ്ഥ ചേർക്കാനോ നീക്കം ചെയ്യാനോ അത് അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക).\n\nപ്രവർത്തനങ്ങളും സ്വിച്ചുകളും സംഖ്യകളും പ്ലഗിൻ തിരിച്ചാണ്: ആദ്യം പ്ലഗിൻ, പിന്നെ അത് നൽകുന്നത് തിരഞ്ഞെടുക്കുക; “മടങ്ങുക” വീണ്ടും പുറത്തുകടക്കും. “മടങ്ങുക”, “അടുത്ത പേജ്” പോലെ കാണിക്കുന്ന സ്ക്രീനിൽ പ്രവർത്തിക്കുന്ന ഒന്ന്, അവിടെ അമർത്തിയാൽ ചെയ്യുന്നത് തന്നെ ചെയ്യും.\n\nഏത് സ്ക്രീൻ തുറന്നിരുന്നാലും സമയങ്ങൾ ബാധകമാണ്. പരസ്പരം റദ്ദാക്കുന്ന രണ്ട് നിയമങ്ങൾ ഏതാനും ഘട്ടങ്ങൾക്ക് ശേഷം നിൽക്കും."
