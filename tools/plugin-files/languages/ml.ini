puzzles.plugin.name = പസിലുകൾ
puzzles.plugin.description = സുഡോകു, ക്രോസ്വേഡുകൾ, ചെസ് പസിലുകൾ, ഓഫ്ലൈനായി, ഇന്നത്തെ പസിലോടെ.
puzzles.plugin.how = "ഓഫ്ലൈനായി സുഡോകു, ക്രോസ്വേഡുകൾ, ചെസ് പസിലുകൾ. ടൂളുകൾ മെനുവിൽ നിന്ന് “പസിലുകൾ” തുറക്കുക, അല്ലെങ്കിൽ ഹോം സ്ക്രീനിൽ “ഇന്നത്തെ പസിൽ” വിജറ്റ് ചേർക്കുക: ഇന്നത്തെ സുഡോകുവിന്റെ പുരോഗതി കാണിക്കുന്നു, ടാപ്പ് ചെയ്താൽ തുറക്കും.\n\nസുഡോകു: ഇടത്/വലത് കഴ്സർ ഓരോ കളമായും, മുകളിലേക്ക്/താഴേക്ക് (പേജ് ബട്ടണുകൾ) ഓരോ വരിയായും നീക്കുന്നു. “തിരഞ്ഞെടുക്കുക” അക്കങ്ങൾ തുറക്കുന്നു; “മായ്ക്കുക” കളം ഒഴിക്കുന്നു. ബോർഡിനു താഴെയുള്ള ബട്ടണുകൾക്ക് “തിരഞ്ഞെടുക്കുക” (അല്ലെങ്കിൽ മെനു) അമർത്തിപ്പിടിക്കുക: “കുറിപ്പുകൾ” അക്കങ്ങളെ പെൻസിൽ അടയാളങ്ങളാക്കുന്നു, “പരിശോധിക്കുക” തെറ്റായ കളങ്ങൾ കാണിക്കുന്നു, “പഴയപടിയാക്കുക” അവസാന നീക്കം തിരിച്ചെടുക്കുന്നു, “പുതിയത്” നിങ്ങൾ തിരഞ്ഞെടുക്കുന്ന നിലയിൽ (എളുപ്പം, ഇടത്തരം, കഠിനം) പുതിയ പസിൽ തുടങ്ങുന്നു. കളി സംരക്ഷിക്കും.\n\nക്രോസ്വേഡുകൾ: .puz (Across Lite) അല്ലെങ്കിൽ .ipuz ഫയലുകൾ മെമ്മറി കാർഡിലെ “puzzles” ഫോൾഡറിൽ ഇടുക. ഗ്രിഡിൽ നീങ്ങി, വാക്ക് ടൈപ്പ് ചെയ്യാൻ തിരഞ്ഞെടുക്കുക (_ കളം ഒഴിച്ചിടുന്നു). ബട്ടണുകൾ കുറുകെ/താഴേക്ക് മാറ്റുന്നു, സൂചനകൾ കാണിക്കുന്നു, അക്ഷരങ്ങൾ പരിശോധിക്കുന്നു, വാക്ക് വെളിപ്പെടുത്തുന്നു. സ്ക്രാംബിൾ ചെയ്ത .puz ഫയലുകൾ തുറക്കാനാവില്ല.\n\nചെസ് പസിലുകൾ: Lichess പസിൽ ഡാറ്റാബേസിൽ (CC0) നിന്നുള്ള ഒരു ചെറിയ ശേഖരം. ഇടത്/വലത് കരുക്കൾക്കിടയിൽ ചാടുന്നു; കരു തിരഞ്ഞെടുത്ത്, ഇടത്/വലത് കൊണ്ട് ലക്ഷ്യകളം തിരഞ്ഞെടുക്കുക. തെറ്റായ നീക്കം തിരിച്ചെടുക്കും. “സൂചന” നീക്കേണ്ട കരു കാണിക്കുന്നു, “അടുത്തത്” അടുത്ത പസിലിലേക്ക്. “സ്ഥിതിവിവരക്കണക്ക്” പരിഹരിച്ച പസിലുകൾ എണ്ണുന്നു."
