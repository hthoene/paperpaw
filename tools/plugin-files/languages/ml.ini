format-cbz.setting.panels.help = ഒരു സമയം ഒരു പാനൽ, പേജ് മറിക്കൽ അവയിലൂടെ നീങ്ങും.
format-docx.plugin.name = DOCX ഡോക്യുമെന്റുകൾ
format-docx.plugin.description = Word-ഉം മറ്റ് പ്രോഗ്രാമുകളും സംരക്ഷിക്കുന്ന .docx ഫയലുകൾ തുറക്കുന്നു.
format-docx.plugin.how = ".docx ഡോക്യുമെന്റുകൾ പുസ്തകങ്ങളായി തുറക്കുന്നു: ഉള്ളടക്കത്തോടെ തലക്കെട്ടുകൾ, ലിസ്റ്റുകൾ, പട്ടികകൾ, ബോൾഡ്, ഇറ്റാലിക്, ലിങ്കുകൾ, ചിത്രങ്ങൾ (JPEG, PNG, GIF).\n\nഫയലുകൾ ലൈബ്രറി ഫോൾഡറിൽ വച്ച് ലൈബ്രറിയിൽ നിന്ന് തുറക്കുക. ശീർഷകവും രചയിതാവും ഡോക്യുമെന്റിന്റെ പ്രോപ്പർട്ടികളിൽ നിന്നാണ്. അടിക്കുറിപ്പുകൾ, ഹെഡറുകളും ഫൂട്ടറുകളും, കമന്റുകൾ എന്നിവ കാണിക്കില്ല."
format-docx.title = DOCX ഡോക്യുമെന്റ്
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB പുസ്തകങ്ങൾ അവയുടെ ശൈലികൾ, ഉള്ളടക്കം, ചിത്രങ്ങൾ എന്നിവയോടെ തുറക്കുന്നു.
format-epub.plugin.how = "EPUB പുസ്തകങ്ങൾ മറ്റേതൊരു പുസ്തകത്തെയും പോലെ ലൈബ്രറിയിൽ നിന്ന് തുറക്കും, ഉള്ളടക്കം, ചിത്രങ്ങൾ, പ്രസാധകന്റെ ഫോർമാറ്റിംഗ് എന്നിവയോടെ. വെബ് പേജുകൾ (HTML), Markdown, FictionBook (.fb2), കോമിക് ബുക്ക് ആർക്കൈവുകൾ (.cbz) എന്നിവയും ഇതേ രീതിയിൽ തുറക്കും, ഓരോന്നും സ്വന്തം പ്ലഗിനായി.\n\nഒരു അധ്യായം ആദ്യം തുറക്കുമ്പോൾ പരിവർത്തനം ചെയ്ത് പ്ലഗിന്റെ കാഷെയിൽ സൂക്ഷിക്കും, അതിനാൽ പിന്നീട് വേഗത്തിലാകും, വലിയ പുസ്തകങ്ങൾ ചെറിയ ഉപകരണങ്ങളിലും പ്രവർത്തിക്കും. വായനാ മെനുവിലെ “ഉള്ളടക്കം” എന്നതിൽ ഉള്ളടക്കപ്പട്ടിക കാണാം. പുസ്തകത്തിന്റെ സ്വന്തം ഫോർമാറ്റിംഗ് ബാധകമാണോ എന്നത് വായന എന്നതിലെ “പ്രസാധകന്റെ ഫോർമാറ്റിംഗ്” ക്രമീകരണമാണ്."
format-epub.title = EPUB ഇ-ബുക്ക്
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook പുസ്തകങ്ങൾ (.fb2, zip ചെയ്തവയും) തുറക്കുന്നു.
format-fb2.plugin.how = "റഷ്യൻ ഉൾപ്പെടെയുള്ള പുസ്തകങ്ങൾക്ക് സാധാരണമായ FictionBook പുസ്തകങ്ങൾ (.fb2), zip ചെയ്തവയും (.fb2.zip), ശീർഷകം, രചയിതാക്കൾ, കവർ, അധ്യായങ്ങൾ എന്നിവയോടെ തുറക്കുന്നു.\n\nഅവ ലൈബ്രറി ഫോൾഡറിൽ വയ്ക്കുക; അവ ലൈബ്രറിയിൽ കാണിക്കുകയും മറ്റേതൊരു പുസ്തകത്തെയും പോലെ തുറക്കുകയും ചെയ്യും."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ഫയലുകളായി സംരക്ഷിച്ച വെബ് പേജുകൾ തുറന്ന് വായിക്കാനുള്ളത് മാത്രം കാണിക്കുന്നു.
format-html.plugin.how = "ഫയലുകളായി സംരക്ഷിച്ച വെബ് പേജുകൾ (.html, .htm, .xhtml) പുസ്തകങ്ങളായി തുറക്കുന്നു: വായിക്കാനുള്ളത് മാത്രം, ചുറ്റുമുള്ള മെനുകളും പരസ്യങ്ങളും മറ്റും ഇല്ലാതെ.\n\nഫയൽ ലൈബ്രറി ഫോൾഡറിൽ വച്ച് മറ്റേതൊരു പുസ്തകത്തെയും പോലെ ലൈബ്രറിയിൽ നിന്ന് തുറക്കുക. പേജിനുള്ളിലെ ലിങ്കുകൾ പ്രവർത്തിക്കും; ചിത്രങ്ങൾ ഫയലിലെ അവയുടെ സ്ഥാനത്ത് കാണിക്കും."
format-html.title = വെബ് പേജ് (HTML)
format-images.plugin.name = ചിത്രങ്ങൾ
format-images.plugin.description = ചിത്രങ്ങൾ (.jpg, .png, .gif) പുസ്തകങ്ങളായി തുറക്കുന്നു, ഓരോന്നും ഒരു പേജ്.
format-images.plugin.how = "ചിത്രങ്ങൾ (.jpg, .png, .gif) പുസ്തകങ്ങൾ പോലെ ലൈബ്രറിയിൽ നിന്ന് തുറക്കും, ഒരു പേജിൽ ഒരു ചിത്രം, സ്ക്രീനിന് അനുയോജ്യമായി.\n\nഒരു ഫോൾഡറിലെ എല്ലാ ചിത്രങ്ങളും കാണാൻ അതിലെ ആദ്യ ചിത്രം തുറക്കുക: ഫോൾഡറിലെ തുടർന്നുള്ള ചിത്രങ്ങൾ പേരുകളുടെ ക്രമത്തിൽ (10-ന് മുമ്പ് 2) വരും. ഫോൾഡറിലെ പിന്നീടുള്ള ഒരു ചിത്രം തുറന്നാൽ അവിടെ നിന്ന് തുടങ്ങും; ഓരോന്നിലെയും സ്ഥാനം വെവ്വേറെ ഓർമ്മിക്കും. തുറക്കുന്ന ചിത്രം മുതൽ 300 ചിത്രങ്ങൾ വരെയുള്ള ഫോൾഡർ വായിക്കും.\n\nചിത്രമല്ലാത്തതോ വളരെ വലുതോ ആയ ഫയൽ പകരം അതിന്റെ പേര് കാണിക്കും. സ്വന്തം ശീർഷകമുള്ള, നിരവധി ചിത്രങ്ങളുള്ള പുസ്തകത്തിന് കോമിക് ബുക്ക് ആർക്കൈവ് (.cbz) ആണ് നല്ലത്."
format-images.title = ചിത്രം
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ഫയലുകൾ (.md), ഉദാ. കുറിപ്പുകൾ, തുറക്കുന്നു.
format-markdown.plugin.how = "കുറിപ്പുകൾ പോലുള്ള Markdown ഫയലുകൾ (.md) പുസ്തകങ്ങളായി തുറക്കുന്നു: തലക്കെട്ടുകൾ, ലിസ്റ്റുകൾ, ഉദ്ധരണികൾ, ഊന്നൽ എന്നിവ ചിഹ്നങ്ങളായല്ല, ഉദ്ദേശിച്ചതുപോലെ.\n\nഫയലുകൾ ലൈബ്രറി ഫോൾഡറിൽ വച്ച് ലൈബ്രറിയിൽ നിന്ന് തുറക്കുക. ആദ്യ തലക്കെട്ടാണ് ശീർഷകം; ഫയലിനടുത്തുള്ള ചിത്രങ്ങൾ ടെക്സ്റ്റ് അവയെ പരാമർശിക്കുന്നിടത്ത് കാണിക്കും."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI പുസ്തകങ്ങൾ
format-mobi.plugin.description = DRM ഇല്ലാത്ത .mobi, .azw ഫയലുകൾ തുറക്കുന്നു.
format-mobi.plugin.how = "MOBI പുസ്തകങ്ങൾ (.mobi, .azw) മറ്റേതൊരു പുസ്തകത്തെയും പോലെ ലൈബ്രറിയിൽ നിന്ന് തുറക്കുന്നു, ഒന്നും സജ്ജീകരിക്കേണ്ടതില്ല. ശീർഷകം, രചയിതാക്കൾ, ഭാഷ, കവർ എന്നിവ പുസ്തകത്തിൽ നിന്നെടുക്കുന്നു; ഉള്ളടക്കം അതിന്റെ തലക്കെട്ടുകളിൽ നിന്ന് തയ്യാറാക്കുന്നു.\n\nആദ്യം തുറക്കുമ്പോൾ പുസ്തകം പരിവർത്തനം ചെയ്യുന്നു, നീണ്ട പുസ്തകത്തിന് ഏതാനും സെക്കൻഡ് എടുക്കും; പിന്നീട് ഉടൻ തുറക്കും. ടെക്സ്റ്റ്, തലക്കെട്ടുകൾ, ബോൾഡ്, ഇറ്റാലിക്, ലിങ്കുകൾ, ചിത്രങ്ങൾ എന്നിവ കാണിക്കും.\n\nDRM ഉള്ള പുസ്തകങ്ങൾ (കടകളിൽ നിന്ന് വാങ്ങിയവ മിക്കതും), Huffman കംപ്രഷൻ ഉള്ളവ, പുതിയ KF8 രൂപത്തിലുള്ളവ (.azw3) എന്നിവ തുറക്കാനാവില്ല: തുറക്കുമ്പോൾ PaperPaw അത് അറിയിക്കും. Calibre പോലുള്ള ടൂൾ ഉപയോഗിച്ച് നിർമ്മിച്ച EPUB പകർപ്പ് എപ്പോഴും തുറക്കും."
format-mobi.title = MOBI പുസ്തകങ്ങൾ
format-rtf.plugin.name = RTF ഡോക്യുമെന്റുകൾ
format-rtf.plugin.description = .rtf ഫയലുകൾ പുസ്തകങ്ങളായി തുറക്കുന്നു.
format-rtf.title = RTF ഡോക്യുമെന്റുകൾ
format-txt.plugin.name = പ്ലെയിൻ ടെക്സ്റ്റ്
format-txt.plugin.description = പ്ലെയിൻ ടെക്സ്റ്റ് ഫയലുകൾ (.txt) തുറക്കുന്നു.
format-txt.plugin.how = "പ്ലെയിൻ ടെക്സ്റ്റ് ഫയലുകൾ (.txt) മറ്റേതൊരു പുസ്തകത്തെയും പോലെ ലൈബ്രറിയിൽ നിന്ന് തുറക്കുന്നു, ഒന്നും സജ്ജീകരിക്കേണ്ടതില്ല. പ്ലഗിൻ UTF-8, UTF-16, Windows-1252 ടെക്സ്റ്റ് വായിക്കുകയും എൻകോഡിംഗ് സ്വയം കണ്ടെത്തുകയും ചെയ്യുന്നു.\n\nഫയലിലെ ശൂന്യമായ വരികൾക്കനുസരിച്ചാണ് ഖണ്ഡികകൾ; ശൂന്യ വരികൾ ഇല്ലെങ്കിൽ ഓരോ വരിയും ഒരു ഖണ്ഡികയാണ്. Project Gutenberg ഫയലുകളിൽ തുടക്കത്തിലും അവസാനത്തിലുമുള്ള ലൈസൻസ് ടെക്സ്റ്റ് ഒഴിവാക്കുന്നു, ശീർഷകവും രചയിതാവും ഹെഡറിൽ നിന്നെടുക്കുന്നു.\n\nഫയൽ ഒരിക്കലും മുഴുവനായി ലോഡ് ചെയ്യുന്നില്ല, അതിനാൽ വളരെ വലിയ ടെക്സ്റ്റുകളും ചെറിയ ഉപകരണങ്ങളിൽ തുറക്കും."
format-txt.title = പ്ലെയിൻ ടെക്സ്റ്റ്
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Xteink റീഡറുകൾക്കായി മുൻകൂട്ടി റെൻഡർ ചെയ്ത പേജുകളുള്ള XTC, XTCH പുസ്തകങ്ങൾ തുറക്കുന്നു.
format-xtc.plugin.how = "XTC, XTCH ഫയലുകൾ പേജുകൾ ഇതിനകം ചിത്രങ്ങളായി റെൻഡർ ചെയ്ത പുസ്തകങ്ങളാണ്; Xteink റീഡറുകൾക്കുള്ള കൺവെർട്ടറുകൾ ഇവ നിർമ്മിക്കുന്നു. മറ്റേതൊരു പുസ്തകത്തെയും പോലെ ഇവ ലൈബ്രറിയിൽ നിന്ന് തുറക്കുന്നു.\n\nഓരോ പേജും സ്ഥിരമായ ഒരു ചിത്രമായതിനാൽ ടെക്സ്റ്റിന്റെ വലുപ്പമോ ഫോണ്ടോ മാറ്റാനാവില്ല. പേജുകൾ കറുപ്പും വെളുപ്പും, അല്ലെങ്കിൽ നാല് ചാരനിറ ഷേഡുകൾ ഉള്ളവയാണ്. കാണിക്കുമ്പോൾ മാത്രം ഓരോ പേജും ഡീകോഡ് ചെയ്യുന്നതിനാൽ X4-ലും കുറച്ച് മെമ്മറി മതി.\n\nഫയലിൽ ഉണ്ടെങ്കിൽ ശീർഷകം, രചയിതാവ്, അധ്യായങ്ങൾ എന്നിവ അതിൽ നിന്നെടുക്കുന്നു."
format-xtc.title = XTC പേജുകൾ
help.plugin.name = സൂചനകൾ
help.plugin.description = ഒരു സ്ക്രീൻ ആദ്യമായി തുറക്കുമ്പോൾ അതിലെ നിയന്ത്രണങ്ങൾ എന്തു ചെയ്യുന്നുവെന്ന് കാണിക്കുന്നു.
help.plugin.how = "ഒരു സ്ക്രീൻ ആദ്യമായി തുറക്കുമ്പോൾ, അതിനു മുകളിൽ ഒരു ചെറിയ കുറിപ്പ് അതിലെ നിയന്ത്രണങ്ങൾ എന്തു ചെയ്യുന്നുവെന്ന് പറയുന്നു: ടാപ്പ് ചെയ്യാവുന്ന സ്ക്രീൻ ഭാഗങ്ങൾ ഫ്രെയിമിട്ട് കാണിക്കുന്നു, ബട്ടണുകൾ എന്തു ചെയ്യുന്നുവെന്നും പറയുന്നു.\n\nഒരു ടാപ്പോ ഏതെങ്കിലും ബട്ടണോ കുറിപ്പ് അടയ്ക്കുന്നു, ആ സ്ക്രീനിൽ അത് വീണ്ടും വരില്ല. “ഇനി സൂചനകൾ വേണ്ട” എല്ലാം ഓഫാക്കുന്നു.\n\nക്രമീകരണത്തിൽ “സിസ്റ്റം” എന്നതിന് കീഴിൽ, “സൂചനകൾ” അവ ഓണാക്കുകയോ ഓഫാക്കുകയോ ചെയ്യുന്നു; “സൂചനകൾ വീണ്ടും കാണിക്കുക” ഓരോ സ്ക്രീനിന്റെയും കുറിപ്പ് ഒരിക്കൽ കൂടി കാണിക്കുന്നു."
