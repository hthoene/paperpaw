menu.plugin.name = മെനു
menu.plugin.description = പ്രവർത്തനങ്ങളും ക്രമീകരണവുമുള്ള, സ്ക്രീനിന്റെ താഴെയുള്ള മെനു.
menu.plugin.how = "നിങ്ങൾക്ക് ചെയ്യാനും സജ്ജീകരിക്കാനും കഴിയുന്നവ മെനു കാണിക്കുന്നു. തുറന്നിരിക്കുന്നതിനു മുകളിൽ, സ്ക്രീനിന്റെ താഴെ ഇത് തുറക്കും: വായിക്കുമ്പോൾ സ്ക്രീനിന്റെ മധ്യത്തിൽ ടാപ്പ് ചെയ്യുക അല്ലെങ്കിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തുക. ഒരു ഇനം പ്രവർത്തിപ്പിക്കാൻ അത് ടാപ്പ് ചെയ്യുകയോ തിരഞ്ഞെടുക്കുകയോ ചെയ്യുക.\n\nമെനുവിലെ ക്രമീകരണങ്ങൾ അവയുടെ മൂല്യം കാണിക്കുകയും അവിടെത്തന്നെ മാറുകയും ചെയ്യുന്നു, അതിനാൽ മെനു തുറന്നുതന്നെ നിൽക്കും. കൂടുതൽ ഇനങ്ങളുള്ള ഒരു ഇനം ഉപമെനു തുറക്കുന്നു.\n\nദ്രുത പാനലിനായി മുകളിലെ അരികിൽ നിന്ന് താഴേക്ക് സ്വൈപ്പ് ചെയ്യുക: പതിവായി മാറ്റുന്നവ, ബട്ടണുകളായി. മാറ്റാൻ ഒരു ബട്ടൺ ടാപ്പ് ചെയ്യുക, ക്രമീകരണത്തിന് അമർത്തിപ്പിടിക്കുക. ബട്ടണുകൾ മാത്രമെങ്കിൽ, അമ്പടയാള ബട്ടണുകൾ തിരഞ്ഞെടുക്കുന്നു, “തിരഞ്ഞെടുക്കുക” മാറ്റുന്നു, “മടങ്ങുക” അടയ്ക്കുന്നു. “രൂപം” എന്നതിന് കീഴിൽ “മെനുകൾ” മെനുകൾ ലിസ്റ്റായോ ടൈലുകളായോ കാണിക്കുന്നു."
