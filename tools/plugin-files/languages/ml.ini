core.setting.font = ഫോണ്ട്
core.setting.font.help = ഈ വിജറ്റിന്റെ ഫോണ്ട്. കാർഡിലെ ഫോണ്ടിന് വളരെ വലിയ ടെക്സ്റ്റ് മെനുകളുടെ ഫോണ്ടിൽ തുടരും.
core.setting.size = വലുപ്പം
core.setting.size.help = വിജറ്റിന്റെ ടെക്സ്റ്റ് എത്ര വലുതാണ്. കൊള്ളാത്തിടത്ത് ചെറുതാക്കും.
core.setting.part.help = വിജറ്റ് ഇത് കാണിക്കണോ എന്ന്. ഇടം വളരെ കുറവാണെങ്കിൽ എന്തായാലും ഒഴിവാക്കിയേക്കാം.
