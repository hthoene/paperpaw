store.source.address = ഉറവിടത്തിന്റെ വിലാസം (https://…)
store.source.note = PaperPaw {name}-നെയോ അതിന്റെ പ്ലഗിനുകളെയോ പരിശോധിക്കുന്നില്ല. അതിന്റെ കോഡ് പ്ലഗിനുകൾക്ക് ഈ ഉപകരണത്തിലും പുസ്തകങ്ങളിലും ക്രമീകരണങ്ങളിലും പൂർണ്ണ ആക്സസ് ലഭിക്കും. ഉപകരണം ഉറവിടത്തിന്റെ സെർവറുമായി ബന്ധപ്പെടും. അത് നടത്തുന്നവരെ വിശ്വസിക്കുന്നുവെങ്കിൽ മാത്രം ചേർക്കുക.
store.source.added = {name} ഇപ്പോൾ ഒരു ഉറവിടമാണ്. PaperPaw അത് പരിശോധിക്കുന്നില്ല. അതിന്റെ കീ {key} എന്ന് തുടങ്ങുന്നു: ഇനി ഈ കീ ഉപയോഗിച്ച് ഒപ്പിട്ട ലിസ്റ്റുകളും പ്ലഗിനുകളും മാത്രമേ അതിൽ നിന്ന് സ്വീകരിക്കൂ.
store.source.removed = {name} ഇനി ഒരു ഉറവിടമല്ല. അതിൽ നിന്ന് ഇൻസ്റ്റാൾ ചെയ്ത പ്ലഗിനുകൾ നിലനിൽക്കും.
store.source.invalid = അത് ഒരു ഉറവിടത്തിന്റെ വിലാസമല്ല. അത് https:// എന്ന് തുടങ്ങുകയും ഒരു plugins.json-ലേക്ക് ചൂണ്ടുകയും വേണം.
store.source.is-official = PaperPaw-ന്റെ സ്വന്തം ലൈബ്രറി എപ്പോഴും ഉണ്ട്.
store.source.full = ഇതിനകം 8 ഉറവിടങ്ങളുണ്ട്. ആദ്യം ഒന്ന് നീക്കം ചെയ്യുക.
store.source.busy = ഡൗൺലോഡ് പൂർത്തിയാകുന്നത് വരെ കാത്തിരിക്കുക.
store.source.from = {name}-ൽ നിന്ന്: PaperPaw പരിശോധിച്ചിട്ടില്ല
store.source.foreign.fact = മറ്റൊരു ഉറവിടത്തിൽ നിന്ന് ഇൻസ്റ്റാൾ ചെയ്തത്. അതിന്റെ അപ്ഡേറ്റുകൾ അവിടെ നിന്ന് വരും.
store.source.foreign = {name} ഇൻസ്റ്റാൾ ചെയ്തില്ല: ഈ ഉപകരണത്തിൽ ഇത് മറ്റൊരു ഉറവിടത്തിൽ നിന്നുള്ളതാണ്, അതിന്റെ അപ്ഡേറ്റുകൾ അവിടെ നിന്ന് മാത്രമേ വരൂ.
store.source.other-key = {name} ഇൻസ്റ്റാൾ ചെയ്തില്ല: ഇത് ഈ ഉറവിടത്തിന്റെ കീ ഉപയോഗിച്ച് ഒപ്പിട്ടതല്ല.
store.source.unsigned = ഈ ഉറവിടം ഒപ്പിട്ടതല്ല
store.source.unsigned.help = അതിന്റെ ലിസ്റ്റിൽ സാധുവായ ഒപ്പില്ല, അതിനാൽ അതിൽ നിന്ന് ഒന്നും വായിച്ചില്ല. PaperPaw-ന്റെ പ്ലഗിനുകളിലേക്ക് മടങ്ങാൻ “മടങ്ങുക” അമർത്തുക.
store.source.key-changed = ഈ ഉറവിടത്തിന് മറ്റൊരു കീ ആണ്
store.source.key-changed.help = നിങ്ങൾ ചേർത്തപ്പോഴുള്ളതിൽ നിന്ന് വ്യത്യസ്തമായ കീ ഉപയോഗിച്ചാണ് അതിന്റെ ലിസ്റ്റ് ഒപ്പിട്ടത്, അതിനാൽ അതിൽ നിന്ന് ഒന്നും വായിച്ചില്ല. PaperPaw-ന്റെ പ്ലഗിനുകളിലേക്ക് മടങ്ങാൻ “മടങ്ങുക” അമർത്തുക. ഈ മാറ്റം വിശ്വസിക്കുന്നുവെങ്കിൽ മാത്രം ഉറവിടം നീക്കം ചെയ്ത് വീണ്ടും ചേർക്കുക.
store.source.too-large = ഈ ഉറവിടത്തിന്റെ ലിസ്റ്റ് വളരെ നീണ്ടതാണ്
store.source.refused.help = അതിൽ നിന്ന് ഒന്നും വായിച്ചില്ല. PaperPaw-ന്റെ പ്ലഗിനുകളിലേക്ക് മടങ്ങാൻ “മടങ്ങുക” അമർത്തുക.
tasks.plugin.name = ടാസ്ക്കുകൾ
tasks.plugin.description = അവസാന തീയതിയും മുൻഗണനയുമുള്ള ചെയ്യേണ്ടവയുടെ ലിസ്റ്റുകൾ, റീഡറിൽ മാത്രം അല്ലെങ്കിൽ നിങ്ങളുടെ CalDAV സെർവറുമായി സമന്വയിപ്പിച്ച്, ഹോം സ്ക്രീൻ വിജറ്റുകളോടെ.
tasks.plugin.how = "റീഡറിലെ ചെയ്യേണ്ടവയുടെ ലിസ്റ്റുകൾ: അവസാന തീയതിയും മുൻഗണനയുമുള്ള ടാസ്ക്കുകൾ, പൂർത്തിയാകുമ്പോൾ ടിക്ക് ചെയ്യാം. സജ്ജീകരണമോ നെറ്റ്വർക്കോ ഇല്ലാതെ പ്രവർത്തിക്കും; ഒരു CalDAV സെർവറുമായി (Nextcloud, Radicale, Baïkal, Fastmail...) സമന്വയിപ്പിച്ചാൽ ഫോണിലും കമ്പ്യൂട്ടറിലും അതേ ലിസ്റ്റുകൾ.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് “ടാസ്ക്കുകൾ” തുറക്കുക. ആദ്യ വരിയിൽ നിന്ന് മറ്റ് ലിസ്റ്റുകൾ, “ഇന്നത്തേതും കാലാവധി കഴിഞ്ഞതും”, സമന്വയം, അക്കൗണ്ട് എന്നിവ. ടാസ്ക്കിൽ “തിരഞ്ഞെടുക്കുക” അത് ടിക്ക് ചെയ്യുന്നു (വീണ്ടും: പൂർത്തിയായില്ല). ശീർഷകം, അവസാന തീയതി (ഉദാ. നാളെ, 2026-12-24), മുൻഗണന എന്നിവ മാറ്റാനോ നീക്കം ചെയ്യാനോ ടാസ്ക് അമർത്തിപ്പിടിക്കുക അല്ലെങ്കിൽ “മെനു” അമർത്തുക. തുറന്ന ടാസ്ക്കുകൾ ആദ്യം, ദിവസവും മുൻഗണനയും അനുസരിച്ച്; പൂർത്തിയായവ ഒരാഴ്ച അവസാനം നിൽക്കും.\n\nഹോം വിജറ്റുകൾ: “ഇന്നത്തെ ടാസ്ക്കുകൾ”, “ടാസ്ക് ലിസ്റ്റ്”, “തുറന്ന ടാസ്ക്കുകൾ” (എണ്ണം), “അടുത്ത ടാസ്ക്”. വിജറ്റിലെ ടാസ്ക്കിൽ ടാപ്പ് ചെയ്താൽ ടിക്ക് ആകും; തലക്കെട്ടിൽ ടാപ്പ് ചെയ്താൽ ലിസ്റ്റുകൾ തുറക്കും.\n\nസമന്വയിപ്പിക്കാൻ ലിസ്റ്റ് വരിയിൽ “CalDAV അക്കൗണ്ട്” തിരഞ്ഞെടുത്ത് സെർവർ വിലാസം (ഉദാ. cloud.example.com/remote.php/dav), ഉപയോക്തൃനാമം, പാസ്വേഡ് (ആപ്പ് പാസ്വേഡ് നല്ലത്) നൽകുക. ടാസ്ക്കുകൾ തുറക്കുമ്പോഴും “ഇപ്പോൾ സമന്വയിപ്പിക്കുക” തിരഞ്ഞെടുക്കുമ്പോഴും നെറ്റ്വർക്ക് ഓണായിരിക്കുമ്പോഴും സമന്വയിക്കും; ഓഫ്ലൈൻ മാറ്റങ്ങൾ പിന്നീട് അയയ്ക്കും. ഒരു ടാസ്ക് രണ്ടിടത്തും മാറിയാൽ സെർവറിന്റേത് എടുക്കും, നിങ്ങളുടേത് പുതിയ ടാസ്ക്കായി സൂക്ഷിക്കും. ആവർത്തിക്കുന്ന ടാസ്ക്കുകൾ കാണിക്കും, പക്ഷേ അവ ഉണ്ടാക്കിയിടത്ത് മാറ്റുക. പരമാവധി 12 ലിസ്റ്റുകളിൽ 200 ടാസ്ക്കുകൾ."
