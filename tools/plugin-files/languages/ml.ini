picture-home.setting.plate.help = ഓരോ വിജറ്റിനും കീഴിൽ ഒരു പ്ലേറ്റ്: സാധാരണ (വെള്ള), ഇളം ചാരനിറം, അല്ലെങ്കിൽ ചിത്രം കാണാവുന്ന സുതാര്യം. ഇരുണ്ട ചിത്രത്തിന് വിജറ്റിന്റെ “നിറങ്ങൾ” എന്നതിൽ ഇളം ടെക്സ്റ്റ് നിറം തിരഞ്ഞെടുക്കുക.
