store.plugin.description = ഈ ഉപകരണത്തിനുള്ള പ്ലഗിനുകൾ കണ്ടെത്തുന്നു, ഇൻസ്റ്റാൾ ചെയ്യുന്നു, അപ്ഡേറ്റ് ചെയ്യുന്നു, നീക്കം ചെയ്യുന്നു.
store.plugin.how = "പ്ലഗിൻ സ്റ്റോർ ഈ ഉപകരണത്തിനുള്ള പ്ലഗിനുകൾ ഇന്റർനെറ്റിൽ നിന്ന് ഇൻസ്റ്റാൾ ചെയ്യുന്നു, അപ്ഡേറ്റ് ചെയ്യുന്നു, നീക്കം ചെയ്യുന്നു. “ടൂളുകൾ”-ൽ നിന്ന് തുറക്കുക; Wi-Fi വേണം.\n\nതുടക്കത്തിൽ ശുപാർശകൾ, പുതിയവ, ജനപ്രിയമായവ, പിന്നെ ഗ്രൂപ്പുകൾ. ഗ്രൂപ്പിലെ ക്രമം ദിവസവും മാറുന്നു, അതിനാൽ എല്ലാ പ്ലഗിനും കാണപ്പെടും; A-Z, പുതിയത്, അവസാന അപ്ഡേറ്റ് എന്നിങ്ങനെ അടുക്കാം. ഒരു പ്ലഗിൻ തുറന്നാൽ വലുപ്പവും മെമ്മറിയും കാണാം, തുടർന്ന് “ഇൻസ്റ്റാൾ ചെയ്യുക”, “അപ്ഡേറ്റ് ചെയ്യുക” അല്ലെങ്കിൽ “നീക്കം ചെയ്യുക”. “എല്ലാം അപ്ഡേറ്റ് ചെയ്യുക” എല്ലാ പ്ലഗിനുകളും പുതുക്കുന്നു.\n\nകോഡ് പ്ലഗിനുകൾക്ക് ഉപകരണത്തിൽ പൂർണ്ണ ആക്സസ് ഉണ്ട്: സ്റ്റോർ ആദ്യം ചോദിക്കും, റീസ്റ്റാർട്ടിന് ശേഷം അവ തുടങ്ങും. ഒന്ന് പരാജയപ്പെട്ടാൽ PaperPaw കോഡ് പ്ലഗിനുകളില്ലാതെ തുടങ്ങി ഏതെന്ന് പറയും. ലിസ്റ്റ് എവിടെ നിന്നെന്ന് “പ്ലഗിൻ ലൈബ്രറി” നിശ്ചയിക്കുന്നു.\n\n“കമ്മ്യൂണിറ്റി പ്ലഗിനുകൾ” (ക്രമീകരണം › സിസ്റ്റം) GitHub-ലെ മറ്റുള്ളവരുടെ പ്ലഗിനുകളും കാണിക്കുന്നു. അവ “അവലോകനം ചെയ്യാത്തത്” ആണ്; കോഡ് പ്ലഗിന്റെ പേജിൽ ഒപ്പിട്ട കീ കാണാം, മറ്റൊരു കീയിലുള്ള അപ്ഡേറ്റ് ഇൻസ്റ്റാൾ ചെയ്യില്ല.\n\n“ഉറവിടങ്ങൾ” (തുടക്കത്തിലെ അവസാന വരി) മറ്റുള്ളവരുടെ പ്ലഗിൻ ലിസ്റ്റുകൾ വിലാസം (https://…/plugins.json) വഴി ചേർക്കുന്നു, കാണിക്കുന്നു, നീക്കം ചെയ്യുന്നു. അല്ലെങ്കിൽ ഓരോ വരിയിലും ഒരു വിലാസമുള്ള sources.txt കാർഡിലെ .paperpaw/plugins/store-ൽ ഇടാം. PaperPaw ഉറവിടങ്ങൾ പരിശോധിക്കുന്നില്ല. ആദ്യ ലിസ്റ്റിന്റെ കീ ഉപകരണം ഓർക്കും, പിന്നെ ആ കീയിൽ ഒപ്പിട്ടവ മാത്രം സ്വീകരിക്കും. പ്ലഗിന് അപ്ഡേറ്റുകൾ അത് വന്ന ഉറവിടത്തിൽ നിന്ന് മാത്രം. PaperPaw-ന്റെ ലൈബ്രറി എപ്പോഴും ഉണ്ട്; സ്റ്റോർ വിട്ടാൽ അതിലേക്ക് മടങ്ങും."
