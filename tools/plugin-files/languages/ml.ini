calibre.plugin.name = വയർലെസ് ലൈബ്രറി
calibre.plugin.description = നെറ്റ്വർക്കിലൂടെ പുസ്തകങ്ങൾ സ്വീകരിക്കുന്നു. Calibre-നുള്ള വയർലെസ് ഉപകരണമായി പ്രവർത്തിക്കുന്നു.
calibre.plugin.how = "വയർലെസ് ലൈബ്രറി ഉപയോഗിച്ച് ഈ ഉപകരണം കമ്പ്യൂട്ടറിലെ Calibre-ൽ ഒരു വയർലെസ് ഉപകരണമായി കാണിക്കും. അപ്പോൾ Calibre-ന് പുസ്തകങ്ങൾ ഇതിലേക്ക് അയയ്ക്കാനും ലിസ്റ്റ് ചെയ്യാനും ഇല്ലാതാക്കാനും കഴിയും. പുസ്തകങ്ങൾ ലൈബ്രറിയിലേക്ക് പോകും.\n\nഉപകരണവും കമ്പ്യൂട്ടറും ഒരേ Wi-Fi നെറ്റ്വർക്കിലായിരിക്കെ, ടൂളുകൾ മെനുവിൽ നിന്ന് വയർലെസ് ലൈബ്രറി തുറക്കുക. Calibre-ൽ Connect/share, തുടർന്ന് Start wireless device connection തിരഞ്ഞെടുക്കുക. ഉപകരണം കമ്പ്യൂട്ടർ കണ്ടെത്തുമ്പോൾ അതിന്റെ പേര് കാണിക്കും; “കണക്റ്റ് ചെയ്യുക” ടാപ്പ് ചെയ്യുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തുക). Calibre-ന് ഇവിടെ പുസ്തകങ്ങൾ ചേർക്കാനും ഇല്ലാതാക്കാനും കഴിയും, അതിനാൽ നിങ്ങളുടെ സ്വന്തം കമ്പ്യൂട്ടറിലേക്ക് മാത്രം കണക്റ്റ് ചെയ്യുക. സ്ക്രീൻ അടച്ചാൽ കണക്ഷൻ അവസാനിക്കും.\n\nCalibre സ്വയം കണ്ടെത്തിയില്ലെങ്കിൽ, ക്രമീകരണം › ലൈബ്രറി › Calibre ഭാഗത്തെ “വിലാസം” എന്നതിൽ അതിന്റെ കമ്പ്യൂട്ടറിന്റെ വിലാസം നൽകുക. Calibre 9090 അല്ലാത്ത പോർട്ട് ഉപയോഗിക്കുന്നെങ്കിൽ അത് :port ആയി ചേർക്കുക, ഉദാ. 192.168.1.20:9091."
