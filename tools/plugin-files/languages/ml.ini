fonts-browser.plugin.name = കൂടുതൽ ഫോണ്ടുകൾ
fonts-browser.plugin.description = ഇന്റർനെറ്റിൽ നിന്നുള്ള ഫോണ്ടുകൾ ഓരോന്നും ഒരു സാമ്പിളോടെ കാണിക്കുന്നു, വായിക്കാനായി അവ ഡൗൺലോഡ് ചെയ്യുന്നു.
fonts-browser.plugin.how = "കൂടുതൽ ഫോണ്ടുകൾ ഇന്റർനെറ്റിലെ ഒരു ഫോണ്ട് ലൈബ്രറിയിൽ നിന്നുള്ള ഫോണ്ടുകൾ, ഓരോ പേരും അതിന്റെ ഫോണ്ടിൽ, കാണിക്കുകയും നിങ്ങൾക്ക് വേണ്ടവ ഡൗൺലോഡ് ചെയ്യുകയും ചെയ്യുന്നു.\n\nക്രമീകരണം › വായന › ഫോണ്ട് എന്നതിലെ ഫോണ്ട് ലിസ്റ്റിന്റെ അവസാനം ഇതുണ്ട്; സ്റ്റാറ്റസ് ലൈനുകളുടെ ഫോണ്ടിനും ഇതേ എൻട്രിയുണ്ട്. ഫോണ്ടിൽ ടാപ്പ് ചെയ്ത് (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക”) വലുതായി കാണുക, തുടർന്ന് “ഡൗൺലോഡ് ചെയ്യുക” (പേജ് വിടാം). പൂർത്തിയായാൽ “(പേര്) ഉപയോഗിച്ച് വായിക്കുക” അല്ലെങ്കിൽ “സ്റ്റാറ്റസ് ലൈനുകൾക്ക് ഉപയോഗിക്കുക” തിരഞ്ഞെടുക്കുക. “അപ്ഡേറ്റ് ചെയ്യുക” പുതിയ പതിപ്പ് എടുക്കും, “നീക്കം ചെയ്യുക” ഫോണ്ട് ഇല്ലാതാക്കും. Wi-Fi വേണം.\n\nനിങ്ങളുടെ സ്വന്തം ഫോണ്ടുകൾ\n\nസ്വന്തം ഫോണ്ട് ഒരു .ttf അല്ലെങ്കിൽ .otf ഫയലാണ്.\n\nAndroid-ലും ഫോണ്ട് ഫയലുകൾ വരയ്ക്കുന്ന മറ്റ് ഉപകരണങ്ങളിലും: ഫയൽ fonts ഫോൾഡറിലേക്ക് (Android: PaperPaw/fonts) പകർത്തി PaperPaw റീസ്റ്റാർട്ട് ചെയ്ത് ഫോണ്ട് തിരഞ്ഞെടുക്കുക.\n\nXteink X4, X4 Pro: ഇവ ഫോണ്ട് പായ്ക്കുകൾ മാത്രം വായിക്കും. കമ്പ്യൂട്ടറിൽ paperpaw-fontgen ഉപയോഗിച്ച് പായ്ക്ക് ഉണ്ടാക്കുക (regular നിർബന്ധം):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nലഭിക്കുന്ന plugins/font-my-font ഫോൾഡർ മെമ്മറി കാർഡിലെ plugins ഫോൾഡറിലേക്ക് പകർത്തി റീസ്റ്റാർട്ട് ചെയ്ത് ഫോണ്ടായി My Font തിരഞ്ഞെടുക്കുക. ഒഴിവാക്കിയ ശൈലികൾ regular-ൽ വരയ്ക്കും. --chars latin,cyrillic,greek ലിപികൾ ചേർക്കും; പുസ്തകത്തിന്റെ ലിപി ഉൾക്കൊള്ളുന്ന ഫോണ്ട് തിരഞ്ഞെടുക്കുക. കൂടുതൽ ഫോണ്ടുകളിൽ നിന്നുള്ളവയ്ക്ക് കമ്പ്യൂട്ടർ വേണ്ട.\n\ne-ink-ൽ ചെറിയ ടെക്സ്റ്റ് തെളിയാൻ --hinting light ചേർക്കുക (--hinting normal, mono കൂടുതൽ ശക്തം). അറബിക്, ദേവനാഗരി പോലുള്ള ചിഹ്നങ്ങളുള്ള ലിപികൾക്ക് ഇത് ഒഴിവാക്കുക."
