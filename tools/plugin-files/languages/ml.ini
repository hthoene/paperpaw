edge-light.plugin.description = ഫ്രണ്ട് ലൈറ്റ് ക്രമീകരിക്കാൻ സ്ക്രീനിന്റെ അരികിലൂടെ സ്വൈപ്പ് ചെയ്യുക: ഒരു വശത്ത് തെളിച്ചം, മറുവശത്ത് ഊഷ്മളത.
