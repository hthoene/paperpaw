pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = ജോലി, ഇടവേള റൗണ്ടുകളും വിജറ്റുകളും ദിവസേനയുള്ള എണ്ണവുമുള്ള ഒരു ഫോക്കസ് ടൈമർ.
pomodoro.plugin.how = "ഒരു Pomodoro ടൈമർ: ശ്രദ്ധയോടെ റൗണ്ടുകളായി ജോലി ചെയ്യുക, പിന്നെ വിശ്രമിക്കുക. സജ്ജീകരണം വേണ്ട: 25 മിനിറ്റ് ഫോക്കസ്, 5 മിനിറ്റ് വിശ്രമം, നാല് റൗണ്ടിനു ശേഷം 15 മിനിറ്റ് നീണ്ട ഇടവേള.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് Pomodoro തുറന്ന് “ആരംഭിക്കുക” അമർത്തുക, അല്ലെങ്കിൽ ഹോം സ്ക്രീനിൽ അതിന്റെ വിജറ്റുകൾ ചേർക്കുക (ഹോം സ്ക്രീൻ അമർത്തിപ്പിടിച്ച് വിജറ്റ് ചേർക്കുക): “Pomodoro ടൈമർ” ഘട്ടവും ശേഷിക്കുന്ന മിനിറ്റുകളും കാണിക്കുന്നു, “Pomodoro ആരംഭിക്കുക/നിർത്തുക” ഒരു ബട്ടണാണ്, “Pomodoro ഇന്ന്” പൂർത്തിയാക്കിയ റൗണ്ടുകൾ ദിവസ ലക്ഷ്യത്തോടൊപ്പം എണ്ണുന്നു. ടൈമറിൽ ടാപ്പ് ചെയ്താൽ ആരംഭിക്കുകയോ നിർത്തുകയോ ചെയ്യും; പൂർണ്ണ സ്ക്രീൻ തുറക്കാൻ അമർത്തിപ്പിടിക്കുക.\n\nസ്ക്രീൻ വിട്ടാലും ടൈമർ തുടരും, റീസ്റ്റാർട്ടിനു ശേഷം ക്ലോക്ക് അനുസരിച്ച് തുടരും. റീഡർ സ്ലീപ്പിലായിരിക്കുമ്പോൾ ഒന്നും പ്രവർത്തിക്കില്ല: അതിനിടെ അവസാനിച്ച ഘട്ടം ഉണരുമ്പോൾ അറിയിക്കും. ഒരു ഘട്ടം കഴിയുമ്പോൾ അറിയിപ്പ് വരും. ബാറ്ററി ലാഭിക്കാൻ ക്ലോക്ക് മിനിറ്റിലൊരിക്കൽ പുതുക്കുന്നു (പൂർണ്ണ സ്ക്രീനിൽ അവസാന മിനിറ്റിൽ പത്ത് സെക്കൻഡിലൊരിക്കൽ), റീഡറിനെ ഒരിക്കലും ഉണർത്തി നിർത്തില്ല.\n\nക്രമീകരണത്തിലെ Pomodoro എന്നതിൽ ദൈർഘ്യങ്ങളും ഒരു സെറ്റിലെ റൗണ്ടുകളും അടുത്ത ഘട്ടം സ്വയം തുടങ്ങണോ എന്നും സജ്ജമാക്കാം. “കൂടുതൽ” എന്നതിൽ: ഘട്ടം കഴിയുമ്പോൾ സ്ക്രീൻ ഫ്ലാഷ് അല്ലെങ്കിൽ ഫ്രണ്ട് ലൈറ്റ് മിന്നൽ, ദിവസ ലക്ഷ്യം."
