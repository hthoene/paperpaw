core.setting.ink = ടെക്സ്റ്റ്
core.setting.ink.help = വിജറ്റിന്റെ ടെക്സ്റ്റിന്റെ നിറം; സ്വയമേവ എന്നാൽ വായിക്കാൻ എളുപ്പമുള്ളത്: കറുപ്പ് അല്ലെങ്കിൽ വെള്ള.
core.setting.widget-paper = വിജറ്റുകളുടെ നിറങ്ങൾ
core.setting.widget-paper.help = സ്വന്തം ക്രമീകരണത്തിൽ നിറം തിരഞ്ഞെടുക്കാത്ത എല്ലാ വിജറ്റുകളുടെയും പശ്ചാത്തലം.
core.setting.widget-ink = വിജറ്റുകളുടെ ടെക്സ്റ്റ്
core.setting.widget-ink.help = സ്വന്തം ക്രമീകരണത്തിൽ നിറം തിരഞ്ഞെടുക്കാത്ത എല്ലാ വിജറ്റുകളുടെയും ടെക്സ്റ്റ് നിറം.
core.setting.corners = മൂലകൾ
