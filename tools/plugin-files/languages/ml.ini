smart-home.plugin.name = സ്മാർട്ട് ഹോം
smart-home.plugin.description = നിങ്ങളുടെ Home Assistant-ലെ മൂല്യങ്ങളും സ്വിച്ചുകളും ഒരു ഡാഷ്ബോർഡിലും ഹോം സ്ക്രീൻ വിജറ്റുകളിലും. ഹോം നെറ്റ്വർക്കിലെ Home Assistant-നൊപ്പം പ്രവർത്തിക്കുന്നു.
smart-home.plugin.how = "സ്മാർട്ട് ഹോം നിങ്ങളുടെ സ്വന്തം Home Assistant-ലെ മൂല്യങ്ങളും സ്വിച്ചുകളും കാണിക്കുന്നു: താപനില, ഈർപ്പം, ഊർജ്ജം, വാതിലുകൾ, ജനലുകൾ, ലൈറ്റുകൾ, സ്വിച്ചുകൾ, സീനുകൾ. ഹോം നെറ്റ്വർക്കിൽ REST API വഴി സെർവറുമായി നേരിട്ട് സംസാരിക്കുന്നു; മറ്റൊരു സേവനവും ഇടയിലില്ല.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് സ്മാർട്ട് ഹോം, പിന്നെ “കണക്ഷൻ” തുറക്കുക: Home Assistant-ന്റെ വിലാസവും (ഉദാ. http://homeassistant.local:8123) ദീർഘകാല ആക്സസ് ടോക്കണും (Home Assistant പ്രൊഫൈൽ പേജിന്റെ താഴെ ഉണ്ടാക്കാം) നൽകുക. ടോക്കൺ പാസ്വേഡുകൾക്കും കീകൾക്കുമൊപ്പം സൂക്ഷിക്കും. http ഹോം നെറ്റ്വർക്കിൽ മാത്രം; പുറത്തുള്ള സെർവറിന് “ഹോം നെറ്റ്വർക്കിന് പുറത്തുള്ള സെർവറുകൾ” ഓണാക്കി സാധുവായ സർട്ടിഫിക്കറ്റുള്ള https ഉപയോഗിക്കുക.\n\n“എന്റിറ്റികൾ തിരഞ്ഞെടുക്കുക” സെർവറിലുള്ളവയുടെ ലിസ്റ്റ് തുറക്കും: പേരോ id-യോ വഴി തിരഞ്ഞ് കാണിക്കേണ്ടത് തിരഞ്ഞെടുക്കുക (വീണ്ടും തിരഞ്ഞെടുത്താൽ നീക്കും). ഒരു മുറി നൽകിയാൽ ഡാഷ്ബോർഡിലും മുറി വിജറ്റുകളിലും അതനുസരിച്ച് ഗ്രൂപ്പ് ചെയ്യും. പരമാവധി 24 എന്റിറ്റികൾ. ഡാഷ്ബോർഡിൽ ലൈറ്റോ സ്വിച്ചോ സീനോ തിരഞ്ഞെടുത്താൽ അത് മാറും; സെൻസർ വീണ്ടും വായിക്കും.\n\nവിജറ്റുകൾ (ഹോം സ്ക്രീൻ അമർത്തിപ്പിടിച്ച് വിജറ്റ് ചേർക്കുക): മൂല്യം, ഗ്രൂപ്പ് (ഒരു മുറിയിലെ എന്റിറ്റികൾ), സ്വിച്ച്, മുറി (ഒരു മുറിയുടെ കാർഡ്).\n\nഡാഷ്ബോർഡ് തുറക്കുമ്പോൾ, നിങ്ങൾ ആവശ്യപ്പെടുമ്പോൾ, Wi-Fi ഓണായിരിക്കെ റീഡർ ഉണരുമ്പോൾ, ചാർജറിലായിരിക്കെ നിശ്ചയിച്ച ഇടവേളയിൽ വിവരങ്ങൾ വായിക്കും. റേഡിയോ ഒരിക്കലും സ്വയം ഓണാക്കില്ല."
