launcher-simple.plugin.name = ലളിതമായ ഹോം
launcher-simple.plugin.description = ശാന്തമായ ആരംഭ സ്ക്രീൻ: വലിയ ക്ലോക്ക്, കാർഡുകൾ, ഒരു ഡോക്ക്, ഉരുണ്ട സ്വിച്ചുകളുള്ള ദ്രുത പാനൽ.
launcher-simple.plugin.how = "അടിസ്ഥാനം മാത്രം വേണ്ടവർക്കുള്ള ശാന്തമായ ആരംഭ സ്ക്രീനാണ് “ലളിതമായ ഹോം”: വലിയ ക്ലോക്ക്, വായിക്കുന്ന പുസ്തകം, ലൈബ്രറി, സ്റ്റോർ എന്നിവ വലിയ കാർഡുകളായി, താഴെ മൂന്ന് ഐക്കണുകളുള്ള ഡോക്ക്. സജ്ജീകരണം വേണ്ട.\n\nക്രമീകരണത്തിൽ ഹോം സ്ക്രീനിന് കീഴിൽ ഇത് തിരഞ്ഞെടുക്കുക. ഇതിന്റെ ദ്രുത പാനലിൽ (ക്രമീകരണത്തിൽ പാനലായും തിരഞ്ഞെടുക്കുക) വലിയ ഉരുണ്ട സ്വിച്ചുകൾ, ഉപകരണത്തിലുണ്ടെങ്കിൽ ഫ്രണ്ട് ലൈറ്റിനുള്ള ബാർ, ടെക്സ്റ്റ് വലുപ്പത്തിനുള്ള ബാർ എന്നിവയുണ്ട്. ബട്ടണുകളിൽ, അമ്പടയാള കീകൾ ഫോക്കസ് നീക്കുന്നു, “തിരഞ്ഞെടുക്കുക” ആ ഭാഗം പറയുന്നത് ചെയ്യുന്നു; ബാറിൽ പത്തിലൊന്ന് കൂട്ടുന്നു, അവസാനത്തിൽ നിന്ന് തുടക്കത്തിലേക്ക് മടങ്ങുന്നു. ടച്ചിൽ, ഒരു ഭാഗം ടാപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ ബാറിൽ വേണ്ടിടത്ത് ടാപ്പ് ചെയ്യുക.\n\nലൈബ്രറി നിങ്ങളുടെ പുസ്തകങ്ങൾ കാർഡുകളായി, അവസാനം തുറന്നത് ആദ്യം, ഒരു സമയം ഒരു പേജായി കാണിക്കുകയും സാധാരണ റീഡറിൽ തുറക്കുകയും ചെയ്യുന്നു.\n\nക്രമീകരണത്തിൽ “ലളിതമായ ഹോം” എന്നതിന് കീഴിൽ ഇഷ്ടാനുസൃതമാക്കുക: പ്രധാന മെനു പോലെ എഡിറ്റ് ചെയ്യുന്ന മൂന്ന് ലിസ്റ്റുകൾ. “കാർഡുകൾ”: ഹോം ഏത് കാർഡുകൾ ഏത് ക്രമത്തിൽ കാണിക്കുന്നു. “ഡോക്ക്”: ഡോക്കിലെ ഐക്കണുകൾ, ഏത് പ്ലഗിന്റെയും ഏത് പ്രവർത്തനവും. “ദ്രുത പാനൽ”: ഏത് സ്വിച്ചുകളും ബാറുകളും. സ്ക്രീനിൽ ഇടമില്ലാത്ത കാർഡുകൾ അവസാനത്തിൽ നിന്ന് ഒഴിവാക്കും. തീയതിയും ബാറ്ററിയും കാണിക്കണോ എന്നും അവിടെ തിരഞ്ഞെടുക്കാം."
