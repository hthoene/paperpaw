plugin-manager.plugin.description = പ്ലഗിനുകൾ ലിസ്റ്റ് ചെയ്യുകയും അവ ഓണാക്കുകയും ഓഫാക്കുകയും ചെയ്യുന്നു.
plugin-manager.plugin.how = "പ്ലഗിൻ മാനേജർ ഓരോ പ്ലഗിനും അതിന്റെ പതിപ്പും വിവരണവും സഹിതം ലിസ്റ്റ് ചെയ്യുന്നു, പ്ലഗിനുകൾ ഓണാക്കുകയും ഓഫാക്കുകയും ചെയ്യുന്നു.\n\nക്രമീകരണത്തിൽ “പ്ലഗിനുകൾ നിയന്ത്രിക്കുക” ആയി ഇത് കാണാം. ഓരോ പ്ലഗിനിന്റെയും നെറ്റ്വർക്ക് ഉപയോഗം പോലുള്ള മുൻഗണനകൾക്ക് “പ്ലഗിൻ ക്രമീകരണം” എന്ന പ്രത്യേക പേജുണ്ട്. ഓണാക്കാനോ ഓഫാക്കാനോ ഒരു പ്ലഗിൻ ടാപ്പ് ചെയ്യുക (ബട്ടണുകളിൽ അത് തിരഞ്ഞെടുക്കുക). റീസ്റ്റാർട്ടിനു ശേഷമാണ് മാറ്റം ബാധകമാകുന്നത്: അപ്പോൾ താഴെയുള്ള ബാർ “ഇപ്പോൾ റീസ്റ്റാർട്ട് ചെയ്യുക” നൽകും. അത് എങ്ങനെ പ്രവർത്തിക്കുന്നുവെന്ന് വായിക്കാൻ പ്ലഗിൻ അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക).\n\n“എപ്പോഴും ഓൺ” എന്ന് അടയാളപ്പെടുത്തിയ പ്ലഗിൻ ഓഫാക്കാനാവില്ല; “ആവശ്യമാണ്” എന്നത് മറ്റൊരു പ്ലഗിൻ അതിന്റെ ജോലി ചെയ്യുമ്പോൾ മാത്രം, അല്ലെങ്കിൽ PaperPaw-ന് തിരികെ വരാൻ വഴിയുണ്ടാകില്ല. പല പ്ലഗിനുകൾ നൽകുന്ന ഒരു സ്ഥാനം ഏത് പ്ലഗിൻ കാണിക്കണമെന്ന് “സ്ക്രീനുകൾ” എന്നതിൽ തിരഞ്ഞെടുക്കാം."
