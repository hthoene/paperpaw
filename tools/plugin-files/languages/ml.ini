smart-home.problem.address = റീഡറിന് ഉപയോഗിക്കാനാവുന്ന വിലാസമല്ല ഇത്. http://homeassistant.local:8123 എന്ന രീതിയിൽ എഴുതുക.
smart-home.problem.outside = ആ സെർവർ നിങ്ങളുടെ ഹോം നെറ്റ്വർക്കിലില്ല. ക്രമീകരണത്തിൽ അത് അനുവദിച്ച് https ഉപയോഗിക്കുക.
smart-home.problem.insecure = http ഹോം നെറ്റ്വർക്കിൽ മാത്രമേ ഉപയോഗിക്കൂ. ആ സെർവറിന് ഒരു https വിലാസം ഉപയോഗിക്കുക.
smart-home.problem.no-network = Wi-Fi നെറ്റ്വർക്ക് ഇല്ല. ഹോം നെറ്റ്വർക്കിലേക്ക് കണക്റ്റ് ചെയ്ത് വീണ്ടും ശ്രമിക്കുക.
smart-home.problem.offline = റീഡർ ഓഫ്ലൈൻ മോഡിലാണ്, അതിനാൽ ഓൺലൈനാകില്ല.
smart-home.problem.off = സ്മാർട്ട് ഹോമിന്റെ അനുമതികളിൽ നെറ്റ്വർക്ക് ഓഫാക്കിയിരിക്കുന്നു.
