core.setting.button-hints.help = സ്ക്രീനിന്റെ താഴെയുള്ള ഒരു വരി അതിനു താഴെയുള്ള ഓരോ ബട്ടണും എന്തുചെയ്യുമെന്ന് കാണിക്കുന്നു. വായിക്കുമ്പോൾ ഇല്ല.
core.setting.swap-page-buttons = പേജ് ബട്ടണുകൾ പരസ്പരം മാറ്റുക
