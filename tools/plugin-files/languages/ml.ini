calendar.plugin.name = കലണ്ടർ
calendar.plugin.description = നിങ്ങളുടെ കലണ്ടറുകൾ റീഡറിൽ: CalDAV, iCal, ഫയലുകൾ എന്നിവയിൽ നിന്ന് അജണ്ട, ദിവസം, ആഴ്ച, മാസം കാഴ്ചകൾ, കോൺടാക്റ്റുകളിലെ ജന്മദിനങ്ങൾ, ഹോം വിജറ്റുകൾ, സ്ലീപ്പ് സ്ക്രീൻ.
calendar.plugin.how = "റീഡറിൽ നിങ്ങളുടെ കലണ്ടറുകൾ: അജണ്ട, ദിവസം, ആഴ്ച, മാസം. ഉറവിടങ്ങൾ: CalDAV (Nextcloud, Radicale, Fastmail...), iCal വിലാസങ്ങൾ (.ics, webcal://), കാർഡിലെ ഫയലുകൾ, കോൺടാക്റ്റുകളിലെ (CardDAV) ജന്മദിനങ്ങൾ. റീഡർ കലണ്ടറുകൾ മാറ്റില്ല.\n\nടൂളുകളിൽ നിന്ന് കലണ്ടർ തുറക്കുക. കാഴ്ച മാറ്റാനോ കലണ്ടർ ചേർക്കാനോ സമന്വയിപ്പിക്കാനോ ആദ്യ വരി തിരഞ്ഞെടുക്കുക, ഒരു വരി അമർത്തിപ്പിടിക്കുക, അല്ലെങ്കിൽ “മെനു” അമർത്തുക. ദിവസം/ആഴ്ച: ആദ്യ രണ്ട് വരികളും പേജ് ബട്ടണുകളും മുന്നോട്ടും പിന്നോട്ടും. മാസം: ആരോ ബട്ടണുകൾ ദിവസം, പേജ് ബട്ടണുകൾ മാസം. ഇവന്റിൽ “തിരഞ്ഞെടുക്കുക”: വിശദാംശങ്ങൾ. “മടങ്ങുക”: ഒരു പടി പിന്നോട്ട്.\n\nകലണ്ടറുകൾ എന്നതിൽ (മെനു, അല്ലെങ്കിൽ ക്രമീകരണം › കലണ്ടർ) ചേർക്കുക: CalDAV അക്കൗണ്ട് (സെർവർ വിലാസം മതി), iCal വിലാസം, കാർഡിലെ ഫയൽ, അല്ലെങ്കിൽ കോൺടാക്റ്റുകൾ. വിലാസം, ഉപയോക്തൃനാമം, പാസ്വേഡ് (ആപ്പ് പാസ്വേഡ് നല്ലത്), പേര് നൽകുക. ഓരോന്നിനും മാറ്റാവുന്ന അടയാളം; പരമാവധി 6 കലണ്ടറുകൾ.\n\nആവർത്തിക്കുന്നതും ദിവസം മുഴുവനുള്ളതും മറ്റ് സമയ മേഖലകളിലുള്ളതുമായ ഇവന്റുകൾ റീഡറിന്റെ സമയത്തിൽ കാണിക്കും. ഇന്നിന് 60 ദിവസം മുമ്പും ശേഷവുമുള്ള പരമാവധി 240 ഇവന്റുകൾ ഓഫ്ലൈനിലും കാണാം. വായിക്കാനാവാത്ത ആവർത്തന നിയമമുള്ള ഇവന്റ് ഒരിക്കൽ കാണിക്കും.\n\nതുറക്കുമ്പോഴും (5 മിനിറ്റിലൊരിക്കൽ വരെ) “ഇപ്പോൾ സമന്വയിപ്പിക്കുക” വഴിയും, ക്രമീകരണമനുസരിച്ച് നെറ്റ്വർക്ക് ഓണായിരിക്കുമ്പോഴോ ചാർജിംഗ് തുടങ്ങുമ്പോഴോ വായിക്കും. ഇതിനായി Wi-Fi സ്വയം ഓണാക്കില്ല.\n\nഹോം സ്ക്രീൻ വിജറ്റുകൾ: ഇന്ന്, അടുത്ത ഇവന്റ്, അജണ്ട, മാസം, ജന്മദിനങ്ങൾ. സ്ലീപ്പ് സ്ക്രീനിൽ ഇന്നത്തെ അജണ്ട: ക്രമീകരണം › സ്ലീപ്പ് സ്ക്രീൻ › കലണ്ടർ."
