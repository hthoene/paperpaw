opds.plugin.name = OPDS കാറ്റലോഗുകൾ
opds.plugin.description = OPDS കാറ്റലോഗുകൾ ബ്രൗസ് ചെയ്യുന്നു, അവയിലെ പുസ്തകങ്ങൾ ഡൗൺലോഡ് ചെയ്യുന്നു, ഫോൾഡറുകൾ അവയുമായി സമന്വയിപ്പിക്കുന്നു.
opds.plugin.how = "Project Gutenberg, Calibre-Web, Kavita, Komga പോലുള്ള ഓൺലൈൻ ലൈബ്രറികളാണ് OPDS കാറ്റലോഗുകൾ. ഈ പ്ലഗിൻ അവയെ ഫോൾഡറുകൾ പോലെ ബ്രൗസ് ചെയ്യുകയും തിരയുകയും അവയിലെ പുസ്തകങ്ങൾ ലൈബ്രറിയിലേക്ക് ഡൗൺലോഡ് ചെയ്യുകയും ചെയ്യുന്നു.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് “കാറ്റലോഗുകൾ” തുറന്ന് “കാറ്റലോഗ് ചേർക്കുക” തിരഞ്ഞെടുക്കുക: ഒരു വിലാസം, കാറ്റലോഗിന് അക്കൗണ്ട് വേണമെങ്കിൽ ഉപയോക്തൃനാമവും പാസ്വേഡും. ബ്രൗസ് ചെയ്യാൻ കാറ്റലോഗ് ടാപ്പ് ചെയ്യുക; സമന്വയിപ്പിക്കാനോ എഡിറ്റ് ചെയ്യാനോ നീക്കം ചെയ്യാനോ അത് അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക).\n\n“ഈ കാറ്റലോഗ് സമന്വയിപ്പിക്കുക” ഓണാണെങ്കിൽ, “കാറ്റലോഗുകൾ സമന്വയിപ്പിക്കുക” അതിലെ പുതിയ പുസ്തകങ്ങൾ അതിന്റെ ഫോൾഡറിലേക്ക് ഡൗൺലോഡ് ചെയ്യുന്നു. ഒരു സമന്വയം എത്ര പുസ്തകങ്ങൾ എടുക്കുമെന്ന് “ഓരോ സമന്വയത്തിലും പുസ്തകങ്ങൾ” പരിമിതപ്പെടുത്തുന്നു, അതിനാൽ വലിയ കാറ്റലോഗ് ഉപകരണം നിറയ്ക്കില്ല. കാറ്റലോഗിനു പകരം ഒരു ക്ലൗഡ് ഫോൾഡറും (WebDAV) ഉപയോഗിക്കാം."
