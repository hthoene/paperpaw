home.plugin.name = ഹോം സ്ക്രീൻ
home.plugin.description = ആരംഭ പേജ്: വായിക്കുന്ന പുസ്തകം, ടൂളുകൾ തുടങ്ങിയ വിജറ്റുകളുടെ പേജുകൾ.
home.plugin.how = "ഫോണിലെന്ന പോലെ, ഹോം സ്ക്രീൻ പേജുകളാൽ നിർമ്മിതമാണ്; ഓരോന്നും വിജറ്റുകളുടെയും ടൂളുകളുടെയും ഗ്രിഡ് ആണ്. തുടക്കത്തിൽ ക്ലോക്ക്, വായിക്കുന്ന പുസ്തകം, അടുത്തിടെ വായിച്ചവ എന്നിവ ഒരു പേജിലും എല്ലാ ടൂളുകളും അടുത്ത പേജിലുമാണ്.\n\nതുറക്കാൻ ഒരു ഇനം ടാപ്പ് ചെയ്യുക; പേജ് മാറാൻ സ്വൈപ്പ് ചെയ്യുകയോ പേജ് ബട്ടണുകൾ ഉപയോഗിക്കുകയോ ചെയ്യുക. ബട്ടണുകൾ മാത്രമെങ്കിൽ, അമ്പടയാള ബട്ടണുകൾ ഇനങ്ങൾക്കിടയിൽ നീങ്ങുന്നു, “തിരഞ്ഞെടുക്കുക” അത് തുറക്കുന്നു.\n\nപുനഃക്രമീകരിക്കാൻ ഹോം സ്ക്രീൻ അമർത്തിപ്പിടിക്കുക, പേജിനു താഴെയുള്ള പെൻസിൽ ടാപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ മെനുവിൽ “ഹോം സ്ക്രീൻ എഡിറ്റ് ചെയ്യുക” തിരഞ്ഞെടുക്കുക. ഇനങ്ങൾ നീക്കാൻ വലിച്ചുനീക്കുക, ഓപ്ഷനുകൾക്ക് ടാപ്പ് ചെയ്യുക (ബട്ടണുകൾ കൊണ്ടും). “വിജറ്റ് ചേർക്കുക” അവിടെയുണ്ട്. “കോളങ്ങൾ”, “വരികൾ” എന്നിവ ക്രമീകരണത്തിൽ “രൂപം” › “ഹോം സ്ക്രീൻ” എന്നതിലാണ്.\n\nസ്ക്രീൻ ചരിക്കുമ്പോൾ, ഇതേ ഇനങ്ങൾ കൂടുതൽ കോളങ്ങളിൽ കാണിക്കുന്നു, കാർഡുകൾക്ക് ഏകദേശം 110 മി.മീ. വരെ വീതി; നേരെ വച്ച ക്രമീകരണം മാറില്ല. ചരിച്ച നിലയിൽ ക്രമീകരിച്ചാൽ ആ ലേഔട്ട് ആ ദിശയ്ക്ക് മാത്രമായി സൂക്ഷിക്കും; പുതിയ വിജറ്റുകൾ രണ്ടിലും ചേർക്കും. “ലാൻഡ്സ്കേപ്പ് ലേഔട്ട് റീസെറ്റ് ചെയ്യുക” (എഡിറ്റ് ചെയ്യുമ്പോൾ “ചേർക്കുക”-ൽ) സ്വയം രൂപപ്പെടുത്തിയതിലേക്ക് മടങ്ങുന്നു. ഒരു ദിശയിൽ നീക്കം ചെയ്യുന്ന ഇനം മറ്റേതിൽ നിന്ന് നീക്കില്ല."
