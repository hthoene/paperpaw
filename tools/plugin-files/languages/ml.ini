menu-editor.plugin.name = മെനു എഡിറ്റർ
menu-editor.plugin.description = ഓരോ മെനുവിലെയും ഇനങ്ങൾ പുനഃക്രമീകരിക്കുകയും നീക്കം ചെയ്യുകയും ചേർക്കുകയും ചെയ്യുന്നു.
menu-editor.plugin.how = "മെനുകളിൽ എന്തൊക്കെയുണ്ടെന്ന് മെനു എഡിറ്റർ മാറ്റുന്നു: ഇനങ്ങൾ മുകളിലേക്കോ താഴേക്കോ നീക്കുക, നീക്കം ചെയ്യുക, അല്ലെങ്കിൽ പുതിയവ ചേർക്കുക.\n\nക്രമീകരണത്തിൽ “ഇഷ്ടാനുസൃതമാക്കുക” എന്നതിന് കീഴിൽ “മെനുകൾ ഇഷ്ടാനുസൃതമാക്കുക” ആയി ഇത് കാണാം. ഒരു മെനു തിരഞ്ഞെടുക്കുക, എന്നിട്ട് നീക്കാനോ നീക്കം ചെയ്യാനോ ഒരു ഇനം; “ഇനം ചേർക്കുക” പുതിയൊന്ന് ചേർക്കുന്നു. മാറ്റങ്ങൾ ഉടൻ ബാധകമാകും. “ഈ മെനു റീസെറ്റ് ചെയ്യുക” ഒരു മെനുവിനെ പ്ലഗിനുകൾ നിർവചിച്ചതുപോലെയാക്കുന്നു, “എല്ലാ മെനുകളും റീസെറ്റ് ചെയ്യുക” എല്ലാറ്റിനും അങ്ങനെ ചെയ്യുന്നു.\n\nനിങ്ങൾക്ക് സ്വയം പുറത്താകാനാവില്ല: ക്രമീകരണത്തിലേക്കുള്ള വഴിയായ ഇനം, മറ്റൊരു വഴി ചേർക്കുന്നതുവരെ നിലനിൽക്കും."
