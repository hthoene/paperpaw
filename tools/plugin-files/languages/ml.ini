notes-vault.plugin.name = കുറിപ്പ് ശേഖരം
notes-vault.plugin.description = Markdown കുറിപ്പുകളുടെ ഒരു ഫോൾഡർ ഫോൾഡറുകൾ, ടാഗുകൾ, പുതിയ മാറ്റങ്ങൾ എന്നിവ അനുസരിച്ച് വായിക്കുന്നു, ഹോം സ്ക്രീനിനുള്ള വിജറ്റുകളോടെ. Obsidian വോൾട്ടുകളുമായി പ്രവർത്തിക്കും.
notes-vault.plugin.how = "“കുറിപ്പ് ശേഖരം” Markdown കുറിപ്പുകളുടെ ഒരു ഫോൾഡർ (.md ഫയലുകൾ) വായിക്കുന്നു; Obsidian വോൾട്ടുകളും.\n\nക്രമീകരണത്തിലോ ടൂളുകളിലെ ശേഖരത്തിന്റെ പേജിലോ ഫോൾഡർ തിരഞ്ഞെടുക്കുക. പേജിൽ കാർഡിലെ ഫോൾഡറുകൾ, അവസാനം മാറ്റിയ കുറിപ്പുകൾ, ടാഗുകൾ, ശീർഷകങ്ങളിൽ തിരയൽ എന്നിവയുണ്ട്.\n\nആദ്യ തവണ, പേജ് തുറന്നിരിക്കുമ്പോൾ പശ്ചാത്തലത്തിൽ ഇൻഡെക്സ് ചെയ്യുന്നു; ആയിരക്കണക്കിന് കുറിപ്പുകൾക്ക് കുറച്ച് മിനിറ്റ്, പിന്നെ ഉടൻ തുറക്കും. ഇൻഡെക്സ് കാർഡിൽ സൂക്ഷിക്കും; ഏതാനും മണിക്കൂറിനു ശേഷം പേജ് തുറക്കുമ്പോഴോ “അപ്ഡേറ്റ്” തിരഞ്ഞെടുക്കുമ്പോഴോ പുതുക്കും.\n\nകുറിപ്പ് റീഡറിൽ തുറക്കും. മറ്റു കുറിപ്പുകളിലേക്കുള്ള ലിങ്കുകൾ ([[Note]], [[Note|words]], [[Note#Heading]]) ശേഖരത്തിൽ എവിടെയുമുള്ള പേരിനാൽ കണ്ടെത്തും; ലിങ്ക് ആ കുറിപ്പ് തുറക്കും, “മടങ്ങുക” മുമ്പത്തേതിലേക്ക്.\n\nശേഖരത്തിൽ ഒന്നും മാറ്റില്ല. ഹോം സ്ക്രീൻ വിജറ്റുകൾ (പുതിയ കുറിപ്പുകൾ, പിൻ ചെയ്തത്, ഇന്നത്തെ കുറിപ്പ്, ക്രമരഹിതം, ടാഗുകൾ, തിരയൽ) ഹോം സ്ക്രീൻ എഡിറ്ററിൽ ചേർക്കുക. ഒരു ഫോൾഡറിൽ നിന്ന് മാത്രം എടുക്കാൻ, വിജറ്റിന്റെ ക്രമീകരണത്തിൽ കാർഡിന്റെ റൂട്ടിൽ നിന്നുള്ള പാത്ത് (ഉദാ. Notes/Work) എഴുതുക; ശൂന്യമെങ്കിൽ എല്ലാ കുറിപ്പുകളും."
