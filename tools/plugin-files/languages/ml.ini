vocabulary.sd.save.failed = ഫയൽ എഴുതാനായില്ല. കാർഡിലെ ഫയൽ മാറ്റിയിട്ടില്ല. കാർഡ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.
vocabulary.sd.save.not-updated = സംരക്ഷിച്ചില്ല: കാർഡിലെ ഫയൽ ആദ്യം വായിക്കാനായില്ല, ഡെക്കിൽ ഇല്ലാത്ത മാറ്റങ്ങൾ അതിൽ ഉണ്ടാകാം. ഫയൽ ശരിയാക്കി വീണ്ടും ശ്രമിക്കുക.
vocabulary.sd.save.left-out = സംരക്ഷിച്ചില്ല: ഫയലിലെ ചില വരികൾ വായിക്കാനായില്ല, സംരക്ഷിച്ചാൽ അവ നഷ്ടമാകും. ഫയൽ ശരിയാക്കി, അപ്ഡേറ്റ് ചെയ്ത്, വീണ്ടും ശ്രമിക്കുക.
vocabulary.sd.save.anki = {file} ഒരു Anki ഫയലാണ്: അത് വായിക്കുക മാത്രം ചെയ്യും, ഒരിക്കലും എഴുതില്ല.
vocabulary.sd.save.anki-refused = സംരക്ഷിച്ചില്ല: {file} ഒരു Anki ഡെക്കാണ്, PaperPaw അത് വായിക്കുക മാത്രം ചെയ്യും. അപ്ഡേറ്റ് ചെയ്യാൻ Anki-ൽ നിന്ന് ഡെക്ക് വീണ്ടും എക്സ്പോർട്ട് ചെയ്യുക.
vocabulary.sd.removal-held = ഒരു കാർഡും നീക്കം ചെയ്തില്ല: ചില വരികൾ വായിക്കാനായില്ല.
vocabulary.sd.skipped.one = {count} വരി ഒഴിവാക്കി
vocabulary.sd.skipped.other = {count} വരികൾ ഒഴിവാക്കി
vocabulary.sd.skipped-notes.one = {count} നോട്ട് ഒഴിവാക്കി: അത് വളരെ നീണ്ടതാണ് (ഉദാഹരണത്തിന് അതിൽ ഒരു ചിത്രം)
vocabulary.sd.skipped-notes.other = {count} നോട്ടുകൾ ഒഴിവാക്കി: അവ വളരെ നീണ്ടതാണ് (ഉദാഹരണത്തിന് അവയിൽ ഒരു ചിത്രം)
vocabulary.sd.no-room = {count} വരികൾക്ക് ഇടമില്ലായിരുന്നു: ഒരു ഡെക്കിൽ 20,000 കാർഡുകൾ വരെ.
vocabulary.sd.outcome.same = കഴിഞ്ഞ അപ്ഡേറ്റിനുശേഷം മാറിയിട്ടില്ല.
vocabulary.sd.outcome.unreadable = ഈ ഫയൽ വായിക്കാനായില്ല. കാർഡ് പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.
vocabulary.sd.outcome.too-many = ഇതിനകം 50 ഡെക്കുകൾ ഉണ്ട്, അതിനാൽ ഈ ഫയൽ വായിച്ചില്ല. ആദ്യം ഒരു ഡെക്ക് ഇല്ലാതാക്കുക.
vocabulary.sd.outcome.crowded = വളരെയധികം കാർഡുകൾക്ക് ഒരേ മുൻവശമാണ്, അതിനാൽ ഈ ഫയൽ വായിച്ചില്ല. മുൻവശങ്ങൾ വ്യത്യസ്തമാക്കുക.
vocabulary.sd.outcome.no-cards = കാർഡുകളൊന്നും കണ്ടെത്തിയില്ല. മുൻവശ ടെക്സ്റ്റുള്ള ഒരു വരിയാണ് കാർഡ്; ആദ്യ കോളമാണ് മുൻവശം.
vocabulary.sd.outcome.too-large = ഈ ഫയൽ വളരെ വലുതാണ്: പരമാവധി 4 MiB, 20,000 വരികൾ. അത് പല ഫയലുകളായി വിഭജിക്കുക.
vocabulary.sd.outcome.utf16 = ഈ ഫയൽ UTF-16 ആയി സംരക്ഷിച്ചതാണ്. CSV UTF-8 ആയി വീണ്ടും സംരക്ഷിക്കുക (സ്പ്രെഡ്ഷീറ്റിൽ: CSV UTF-8).
vocabulary.sd.outcome.no-notes = നോട്ടുകളൊന്നും കണ്ടെത്തിയില്ല: ഇതൊരു Anki ഡെക്കല്ല, അല്ലെങ്കിൽ ഇതിൽ നോട്ടുകളില്ല. Anki-ൽ നിന്ന് Anki ഡെക്ക് പാക്കേജ് (.apkg) ആയി എക്സ്പോർട്ട് ചെയ്യുക.
vocabulary.sd.outcome.newer-anki = ഈ ഡെക്ക് ഏറ്റവും പുതിയ Anki ഫോർമാറ്റിലാണ്. Support older Anki versions ടിക്ക് ചെയ്ത് വീണ്ടും എക്സ്പോർട്ട് ചെയ്യുക.
vocabulary.sd.outcome.deck-too-large = ഈ Anki ഡെക്ക് ഇവിടെ വായിക്കാൻ വളരെ വലുതാണ്: പരമാവധി 4,000 ഫയലുകൾ, 4 MiB നോട്ടുകൾ, 20,000 നോട്ടുകൾ. മീഡിയയും ഷെഡ്യൂളിംഗും ഇല്ലാതെ എക്സ്പോർട്ട് ചെയ്യുക, അല്ലെങ്കിൽ വിഭജിക്കുക.
vocabulary.sd.line = വരി {line}
vocabulary.sd.fault.no-front = മുൻവശ കോളത്തിൽ ടെക്സ്റ്റില്ല. വാക്ക് അവിടെ ചേർക്കുക.
vocabulary.sd.fault.not-utf8 = UTF-8 ടെക്സ്റ്റ് അല്ല. ഫയൽ UTF-8 ആയി സംരക്ഷിക്കുക (സ്പ്രെഡ്ഷീറ്റിൽ: CSV UTF-8).
vocabulary.sd.fault.too-long = 8 KiB-നേക്കാൾ നീളം. കാർഡ് ചെറുതാക്കുക.
vocabulary.sd.fault.open-quote = ഒരു ഉദ്ധരണിചിഹ്നം തുറന്നിട്ടുണ്ട്, അടച്ചിട്ടില്ല. അത് അടയ്ക്കുകയോ നീക്കം ചെയ്യുകയോ ചെയ്യുക.
vocabulary.setting.sd-auto = തുറക്കുമ്പോൾ കാർഡിൽ നിന്ന് ഡെക്കുകൾ അപ്ഡേറ്റ് ചെയ്യുക
vocabulary.setting.sd-auto.help = ഫോൾഡറിലെ പുതിയതോ മാറിയതോ ആയ ഫയലുകൾ ഫ്ലാഷ് കാർഡുകൾ വായിക്കും.
vocabulary.setting.sd-folder = ഡെക്ക് ഫയലുകൾക്കുള്ള ഫോൾഡർ
vocabulary.setting.sd-folder.help = SD കാർഡിൽ: അതിലെ ഓരോ CSV, TSV, Anki ഫയലും ഒരു ഡെക്കാണ്.
vocabulary.sd.readme = "ഫയലുകളിൽ നിന്നുള്ള ഫ്ലാഷ് കാർഡുകൾ\n\nഓരോ ഡെക്കിനും ഇവിടെ ഒരു ഫയൽ ഇടുക: Spanish.tsv എന്നത് Spanish ഡെക്ക് ഉണ്ടാക്കും.\nഫയലുകൾ: .tsv, .csv, .txt (UTF-8), അല്ലെങ്കിൽ .apkg: Support older Anki versions ടിക്ക് ചെയ്ത് എക്സ്പോർട്ട് ചെയ്ത Anki ഡെക്ക്. അതിലെ ആദ്യ മൂന്ന് ഫീൽഡുകൾ മുൻവശം, പിൻവശം, ഉദാഹരണം ആകും; ഷെഡ്യൂളിംഗും മീഡിയയും വായിക്കില്ല, PaperPaw ഒരിക്കലും Anki ഫയൽ എഴുതില്ല.\n\nഓരോ വരിയിലും ഒരു കാർഡ്: മുൻവശം, പിൻവശം, ഉദാഹരണം (ഐച്ഛികം), ടാബ്, കോമ അല്ലെങ്കിൽ സെമികോളൺ കൊണ്ട് വേർതിരിച്ച്. ആദ്യ വരിയിൽ കോളം പേരുകൾ ആകാം: front, back, example. ഉദാഹരണം:\n\nKatze\tcat\tDie Katze schläft.\n\nതുടർന്ന് റീഡറിൽ ഫ്ലാഷ് കാർഡുകൾ › SD കാർഡിലെ കാർഡുകൾ › ഡെക്കുകൾ അപ്ഡേറ്റ് ചെയ്യുക.\n\nഅറിയേണ്ടവ:\n- പുതിയതോ മാറിയതോ ആയ ഫയൽ വായിക്കും; പുരോഗതി റീഡറിൽ നിലനിൽക്കും.\n- പിൻവശമോ ഉദാഹരണമോ മാറ്റിയാൽ പുരോഗതി നിലനിൽക്കും. മുൻവശം മാറ്റിയാൽ പുതിയ കാർഡാകും (സ്പേസും വലിയക്ഷരവും കണക്കാക്കില്ല). കാർഡിലേക്ക് സംരക്ഷിച്ച ഫയലിൽ id കോളം ഉണ്ട്: ഫയലിലെ ആദ്യ രണ്ട് വരികൾ മാറ്റാതെ അവിടെ മുൻവശം മാറ്റിയാലും പുരോഗതി നിലനിൽക്കും.\n- സംരക്ഷിക്കുമ്പോൾ ഡെക്കിലെ കാർഡുകൾ എഴുതും; കാർഡല്ലാത്ത വരികൾ (മുൻവശമില്ലാത്തവ) സൂക്ഷിക്കില്ല; പഴയ ഫയൽ _name.bak.tsv ആയി പകർത്തും.\n- CSV UTF-8 ആയി സംരക്ഷിക്കുക; 4 MiB അല്ലെങ്കിൽ 20,000 വരിയിൽ കൂടിയാൽ വായിക്കില്ല.\n- ഫയലിൽ നിന്ന് നീക്കിയ വരി, “ഫയലിൽ ഇല്ലാത്ത കാർഡുകൾ” “നീക്കം ചെയ്യുക” ആക്കിയില്ലെങ്കിൽ, കാർഡ് ഇല്ലാതാക്കില്ല.\n- _ കൊണ്ട് തുടങ്ങുന്ന ഫയലുകൾ വായിക്കില്ല.\n"
wallabag.plugin.name = പിന്നീട് വായിക്കാനുള്ള ലേഖനങ്ങൾ (സ്വന്തം സെർവർ)
wallabag.plugin.description = wallabag-ൽ സംരക്ഷിച്ച ലേഖനങ്ങൾ പുസ്തകങ്ങളായി കൊണ്ടുവരുന്നു.
wallabag.title = പിന്നീട് വായിക്കാനുള്ള ലേഖനങ്ങൾ (സ്വന്തം സെർവർ)
wallabag.fetch = ലേഖനങ്ങൾ കൊണ്ടുവരിക
wallabag.server = സെർവർ
wallabag.server.help = പിന്നീട് വായിക്കാൻ Wallabag-ൽ സംരക്ഷിച്ച ലേഖനങ്ങൾ, “Wallabag” ഫോൾഡറിലേക്ക് പുസ്തകങ്ങളായി കൊണ്ടുവരും.
wallabag.user = ഉപയോക്തൃനാമം
wallabag.user.help = ലേഖനങ്ങൾ വരുന്ന Wallabag അക്കൗണ്ടിന്റെ ഉപയോക്തൃനാമം.
wallabag.password = പാസ്വേഡ്
wallabag.client-id = ക്ലയന്റ് ID
wallabag.client-id.help = Wallabag-ൽ "API clients management" എന്നതിൽ ഉണ്ടാക്കിയ API ക്ലയന്റിന്റെ ID.
wallabag.client-secret = ക്ലയന്റ് സീക്രട്ട്
wallabag.secret.password = Wallabag പാസ്വേഡ്
wallabag.secret.client = Wallabag ക്ലയന്റ് സീക്രട്ട്
wallabag.help = Wallabag-ൽ "API clients management" എന്നതിൽ ഒരു API ക്ലയന്റ് ഉണ്ടാക്കി അതിന്റെ ID-യും സീക്രട്ടും ഇവിടെ നൽകുക. വായിക്കാത്ത ലേഖനങ്ങൾ “Wallabag” ഫോൾഡറിലേക്ക് വരും; അവസാനം വരെ വായിച്ചവ അടുത്ത തവണ കൊണ്ടുവരുമ്പോൾ ആർക്കൈവ് ചെയ്യും.
wallabag.fetching = Wallabag-ൽ നിന്ന് ലേഖനങ്ങൾ കൊണ്ടുവരുന്നു …
wallabag.done = Wallabag: {fetched} പുതിയത്, {archived} ആർക്കൈവ് ചെയ്തു.
wallabag.done-failed = Wallabag: {fetched} പുതിയത്, {archived} ആർക്കൈവ് ചെയ്തു, {failed} പരാജയപ്പെട്ടു.
wallabag.setup-needed = Wallabag-ന് ആദ്യം സെർവർ, ഉപയോക്തൃനാമം, പാസ്വേഡ്, ഒരു API ക്ലയന്റ് എന്നിവ വേണം.
wallabag.bad-login = Wallabag ലോഗിൻ സ്വീകരിച്ചില്ല. ഉപയോക്തൃനാമം, പാസ്വേഡ്, API ക്ലയന്റ് എന്നിവ പരിശോധിക്കുക.
wallabag.no-network = Wallabag-ന് ഒരു നെറ്റ്വർക്ക് വേണം.
wallabag.unreachable = Wallabag-ൽ എത്താനാവുന്നില്ല. Wi-Fi കണക്ഷൻ പരിശോധിച്ച് വീണ്ടും ശ്രമിക്കുക.
wallabag.unreadable = ഈ ഉപകരണത്തിൽ കൊണ്ടുവന്ന ലേഖനങ്ങളുടെ ലിസ്റ്റ് Wallabag-ന് വായിക്കാനാവുന്നില്ല, അതിനാൽ ഒന്നും മാറ്റിയില്ല.
wallabag.not-kept = Wallabag-ന് പാസ്വേഡോ സീക്രട്ടോ സൂക്ഷിക്കാനായില്ല. അത് വളരെ നീണ്ടതല്ലെന്ന് ഉറപ്പാക്കി വീണ്ടും ശ്രമിക്കുക.
weather.plugin.name = കാലാവസ്ഥ
weather.plugin.description = ഇപ്പോഴത്തെയും അടുത്ത ദിവസങ്ങളിലെയും കാലാവസ്ഥ വിജറ്റുകളായി, Open-Meteo-യിൽ നിന്ന്.
weather.plugin.how = "ഇപ്പോഴത്തെയും അടുത്ത ദിവസങ്ങളിലെയും കാലാവസ്ഥ ഹോം സ്ക്രീനിനുള്ള വിജറ്റുകളായി കാണിക്കുന്നു, Open-Meteo-യിൽ നിന്ന് (അക്കൗണ്ടോ കീയോ വേണ്ട). “ഇപ്പോഴത്തെ കാലാവസ്ഥ” താപനിലയും അവസ്ഥയും തിരഞ്ഞെടുക്കാവുന്ന മറ്റ് വിവരങ്ങളും കാണിക്കുന്നു; “പ്രവചനം” അടുത്ത ദിവസങ്ങൾ ഒരു നിരയിലോ ലിസ്റ്റിലോ കാണിക്കുന്നു.\n\nആദ്യം ഒരു സ്ഥലം തിരഞ്ഞെടുക്കുക: ക്രമീകരണത്തിൽ, കാലാവസ്ഥ › സ്ഥലം (പേര് ടൈപ്പ് ചെയ്ത്, കണ്ടെത്തിയ സ്ഥലങ്ങളിൽ നിന്ന് തിരഞ്ഞെടുക്കുക). അതിന്റെ കോർഡിനേറ്റുകൾ മാത്രം അയയ്ക്കും, ഒരു കാലാവസ്ഥ വിജറ്റ് കാണിക്കുമ്പോൾ മാത്രം. ഹോം സ്ക്രീൻ എഡിറ്റ് ചെയ്ത് വിജറ്റുകൾ ചേർക്കുക.\n\n“പരമാവധി ഇടവേളയിൽ അപ്ഡേറ്റ് ചെയ്യുക” പറയുന്നതിലധികം തവണ കാലാവസ്ഥ കൊണ്ടുവരില്ല, നെറ്റ്വർക്ക് ഉള്ളപ്പോൾ മാത്രം: അത് ഒരിക്കലും സ്വയം Wi-Fi ഓണാക്കില്ല.\n\nകാലാവസ്ഥാ ഡാറ്റ Open-Meteo.com (https://open-meteo.com), Creative Commons Attribution 4.0 ലൈസൻസ് (CC BY 4.0) പ്രകാരം."
