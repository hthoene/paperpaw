keys.plugin.name = ബട്ടണുകളും ജെസ്റ്ററുകളും
keys.plugin.description = ഓരോ ബട്ടണും ടാപ്പ് മേഖലയും സ്വൈപ്പും എന്തു ചെയ്യുന്നു, ഉപകരണത്തിൽ തന്നെ മാറ്റാം.
keys.plugin.how = "“ബട്ടണുകളും ജെസ്റ്ററുകളും” ഓരോ ബട്ടണും ടാപ്പ് മേഖലയും സ്വൈപ്പും എന്തു ചെയ്യുന്നുവെന്ന് കാണിക്കുകയും ഉപകരണത്തിൽ തന്നെ അത് മാറ്റാൻ അനുവദിക്കുകയും ചെയ്യുന്നു.\n\nക്രമീകരണത്തിൽ “ഉപകരണം” എന്നതിന് കീഴിൽ ഇത് തുറക്കുക. ആദ്യം മാറ്റം എവിടെ ബാധകമാകണമെന്ന് തിരഞ്ഞെടുക്കുക: എല്ലായിടത്തും, വായിക്കുമ്പോൾ, ഹോം സ്ക്രീനിൽ, ലൈബ്രറിയിൽ, അല്ലെങ്കിൽ ഒരു ടൂളിൽ. തുടർന്ന് ഒരു ഇൻപുട്ട് (ഉദാ. അമർത്തിപ്പിടിച്ച ബട്ടൺ, അരികിൽ നിന്നുള്ള സ്വൈപ്പ്) തിരഞ്ഞെടുത്ത്, തിരയാവുന്ന ലിസ്റ്റിൽ നിന്ന് ഒരു പ്രവർത്തനം തിരഞ്ഞെടുക്കുക. “സ്റ്റാൻഡേർഡ്” പ്ലഗിനുകളും ബട്ടൺ ലേഔട്ടും നിശ്ചയിച്ചത് തിരികെ കൊണ്ടുവരുന്നു.\n\nX4-ൽ, തിരഞ്ഞെടുക്കാനോ മടങ്ങാനോ മുന്നോട്ട് പോകാനോ ബട്ടൺ ഇല്ലാതാക്കുന്ന മാറ്റം നിരസിക്കും. അവസാനത്തെ “ബട്ടണുകളും ജെസ്റ്ററുകളും റീസെറ്റ് ചെയ്യുക” എല്ലാ മാറ്റങ്ങളും പിൻവലിക്കുന്നു."
