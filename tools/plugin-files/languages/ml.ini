anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = കമ്പ്യൂട്ടറിലെ Anki-യിൽ ബാക്കിയുള്ള കാർഡുകൾ പഠിക്കാനും നിങ്ങളുടെ ഉത്തരങ്ങൾ AnkiConnect ആഡ്-ഓൺ വഴി തിരികെ അയയ്ക്കാനും.
anki.plugin.how = "കമ്പ്യൂട്ടറിലെ Anki-യിൽ പഠിക്കാനുള്ള കാർഡുകൾ റീഡറിൽ പഠിച്ച് ഉത്തരങ്ങൾ തിരികെ അയയ്ക്കാം. സൗജന്യ ആഡ്-ഓൺ AnkiConnect (കോഡ് 2055492159) ഉപയോഗിക്കുന്നു, AnkiWeb അല്ല. ആദ്യം ഓഫാണ്: പ്ലഗിൻ സ്റ്റോറിൽ നിന്ന് ചേർക്കുക.\n\nകമ്പ്യൂട്ടറിൽ: Anki-യിൽ AnkiConnect ഇൻസ്റ്റാൾ ചെയ്ത് (Tools, Add-ons, Get Add-ons) Anki റീസ്റ്റാർട്ട് ചെയ്യുക. സമന്വയിപ്പിക്കുമ്പോൾ Anki തുറന്നിരിക്കണം.\n\nസാധാരണ AnkiConnect സ്വന്തം കമ്പ്യൂട്ടറിന് (127.0.0.1) മാത്രം മറുപടി നൽകും. Tools, Add-ons, AnkiConnect, Config തുറന്ന് “webBindAddress” “0.0.0.0” ആക്കുക. പോർട്ട് (“webBindPort”) 8765 ആണ്. അവിടെ “apiKey” സജ്ജമാക്കിയാൽ അതേ കീ ഇവിടെ നൽകുക. തുടർന്ന് Anki റീസ്റ്റാർട്ട് ചെയ്യുക, ഫയർവാൾ ചോദിച്ചാൽ അനുവദിക്കുക. വിശ്വസിക്കുന്ന നെറ്റ്വർക്കിൽ മാത്രം ഉപയോഗിക്കുക; ഒരു കീ നല്ലതാണ്.\n\nറീഡറിൽ: “ടൂളുകൾ”-ൽ നിന്ന് Anki തുറന്ന് “കമ്പ്യൂട്ടർ”-ൽ വിലാസം (ഉദാ. 192.168.1.20), ആവശ്യമെങ്കിൽ പോർട്ടും API കീയും നൽകുക. ഒരു ഡെക്ക് തിരഞ്ഞെടുക്കുക, ശൂന്യമെങ്കിൽ എല്ലാ ഡെക്കുകളും. Wi-Fi ഓണാക്കി “Anki-യുമായി സമന്വയിപ്പിക്കുക” തിരഞ്ഞെടുക്കുക: ഉത്തരങ്ങൾ അയയ്ക്കും, തുടർന്ന് ബാക്കിയുള്ളതും പുതിയതുമായ കാർഡുകൾ (പരമാവധി 50) എടുക്കും. നെറ്റ്വർക്കില്ലാതെ “പഠിക്കുക”: ഉത്തരം കാണിച്ച് “വീണ്ടും”, “പ്രയാസം”, “നല്ലത്”, “എളുപ്പം” എന്ന് വിലയിരുത്തുക. ഉത്തരങ്ങൾ റീഡറിൽ സൂക്ഷിക്കും, അടുത്ത സമന്വയത്തിൽ Anki-യിലേക്ക് പോകും. ഒരു കാർഡ് എപ്പോൾ തിരികെ വരുമെന്ന് Anki തീരുമാനിക്കും.\n\nക്രമീകരണത്തിലെ “Anki തുറക്കുമ്പോൾ സമന്വയിപ്പിക്കുക” ഓരോ തവണ സ്ക്രീൻ തുറക്കുമ്പോഴും സമന്വയിപ്പിക്കും. ബട്ടൺ അമർത്തൽ നെറ്റ്വർക്ക് ഉപയോഗിക്കില്ല."
