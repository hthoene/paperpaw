notes-overview.plugin.name = എല്ലാ കുറിപ്പുകളും
notes-overview.plugin.description = എല്ലാ പുസ്തകങ്ങളിലെയും ബുക്ക്മാർക്കുകളും ഹൈലൈറ്റുകളും ഒരു ലിസ്റ്റിൽ, ഒപ്പം My Clippings.txt ആയി എക്സ്പോർട്ടും.
notes-overview.plugin.how = "നിങ്ങൾ ബുക്ക്മാർക്കോ ഹൈലൈറ്റോ ഇട്ട എല്ലാ പുസ്തകങ്ങളും എണ്ണത്തോടൊപ്പം “എല്ലാ കുറിപ്പുകളും” ലിസ്റ്റ് ചെയ്യുന്നു. ടൂളുകളിൽ ഇത് തുറക്കുക. ഒരു പുസ്തകം തിരഞ്ഞെടുത്താൽ അതിന്റെ കുറിപ്പുകൾ കാണാം; ഒരു കുറിപ്പ് തിരഞ്ഞെടുത്താൽ പുസ്തകം ആ സ്ഥാനത്ത് തുറക്കും.\n\nലിസ്റ്റിന്റെ അവസാനത്തെ “My Clippings.txt ആയി എക്സ്പോർട്ട് ചെയ്യുക” എല്ലാ കുറിപ്പുകളും ലൈബ്രറിക്ക് അരികിലെ Exports ഫോൾഡറിൽ ഒരു ഫയലിലേക്ക്, Kindle ഉപയോഗിക്കുന്ന രൂപത്തിൽ (UTF-8) എഴുതുന്നു. Kindle-ന്റെ My Clippings.txt വായിക്കുന്ന ആപ്പുകൾക്ക് ഇത് വായിക്കാം. Kindle-ലെന്ന പോലെ, ഒരു ഹൈലൈറ്റിലെ കുറിപ്പ് പ്രത്യേക എൻട്രിയാണ്. ഇവിടെ പുസ്തകങ്ങൾക്ക് Kindle ലൊക്കേഷനുകൾ ഇല്ലാത്തതിനാൽ, “location” എന്നത് പുസ്തകത്തിൽ കുറിപ്പ് എത്ര ശതമാനം ഉള്ളിലാണ് എന്നതാണ്. ഓരോ തവണയും ഫയൽ വീണ്ടും എഴുതുന്നു; അത് മുമ്പത്തേതിനെ മാറ്റിസ്ഥാപിക്കുന്നു."
