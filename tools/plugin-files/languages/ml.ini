widgets.plugin.how = "വിജറ്റ് പായ്ക്ക് ഹോം സ്ക്രീനിനായി നിരവധി വിജറ്റുകൾ ചേർക്കുന്നു: ക്ലോക്കുകൾ (അനലോഗ്, വാക്കുകളിൽ, ടൈലുകളിൽ, ലോക ക്ലോക്ക്), കലണ്ടർ, ഈ വർഷം ഇതുവരെ, കൗണ്ട്ഡൗൺ, ചന്ദ്രന്റെ ഘട്ടം, ദിവസവും തീയതിയും; ഇന്നത്തെ ഉദ്ധരണി, കുറിപ്പുകൾ, ചെയ്യേണ്ടവ, ചിത്രങ്ങൾ, ആശംസ, PaperPaw ലോഗോ; പുസ്തകങ്ങൾക്കായി ഇപ്പോൾ വായിക്കുന്നത്, പുരോഗതി, അടുത്തത്, പരമ്പര, പ്രിയപ്പെട്ടവ, ഒരു ഹൈലൈറ്റ്, അക്കങ്ങളിൽ ലൈബ്രറി. ബാറ്ററി വിജറ്റും ഇതിലുണ്ട്.\n\nമെനുവിലെ “ഹോം സ്ക്രീൻ എഡിറ്റ് ചെയ്യുക” (അല്ലെങ്കിൽ ഹോം സ്ക്രീനിൽ അമർത്തിപ്പിടിക്കുക), തുടർന്ന് “വിജറ്റ് ചേർക്കുക” വഴി അവ ചേർക്കുക. ഓരോന്നിനും ഫ്രെയിം, വലുപ്പം, വിന്യാസം പോലുള്ള സ്വന്തം ക്രമീകരണങ്ങളുണ്ട്. ഇന്നത്തെ ഉദ്ധരണി പോലെ മാറുന്ന ഒരു വിജറ്റ് തിരഞ്ഞെടുത്താൽ അടുത്തത് കാണിക്കും. നിങ്ങളുടെ സ്വന്തം ഉദ്ധരണികൾ കാർഡിലെ .paperpaw/plugins/widgets-ലുള്ള quotes.txt-ൽ ചേർക്കുക, ഓരോ വരിയും ടെക്സ്റ്റ് | രചയിതാവ് എന്ന രീതിയിൽ. സമയ വിജറ്റുകൾക്ക് ക്ലോക്ക് സജ്ജീകരിച്ചിരിക്കണം; Wi-Fi അത് സജ്ജീകരിക്കും."
