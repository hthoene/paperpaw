file-manager.plugin.name = ഫയൽ മാനേജർ
file-manager.plugin.description = ഉപകരണത്തിലെ എല്ലാ ഫോൾഡറുകളും ഫയലുകളും: തുറക്കുക, പേരുമാറ്റുക, നീക്കുക, പകർത്തുക, ഇല്ലാതാക്കുക.
file-manager.plugin.how = "ഫയൽ മാനേജർ ഉപകരണത്തിന്റെ സ്റ്റോറേജിലെ എല്ലാ ഫോൾഡറുകളും ഫയലുകളും കാണിക്കുന്നു, പുസ്തകങ്ങൾ മാത്രമല്ല. അവ തുറക്കാനും പേരുമാറ്റാനും നീക്കാനും പകർത്താനും ഇല്ലാതാക്കാനും പുതിയ ഫോൾഡറുകൾ ഉണ്ടാക്കാനും കഴിയും.\n\nടൂളുകൾ മെനുവിൽ നിന്ന് ഫയലുകൾ തുറക്കുക. ഫോൾഡറിൽ കയറാൻ അതിൽ ടാപ്പ് ചെയ്യുക; “മടങ്ങുക” മുകളിലെ ഫോൾഡറിലേക്ക് പോകും. എന്ത് ചെയ്യാമെന്ന് കാണാൻ ഫയലിൽ ടാപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ ഏതെങ്കിലും എൻട്രി അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക). “നീക്കുക”, “പകർത്തുക” എൻട്രി എടുക്കും: അത് പോകേണ്ട ഫോൾഡറിലേക്ക് പോയി താഴത്തെ ബാറിലെ “ഇവിടെ ഒട്ടിക്കുക” തിരഞ്ഞെടുക്കുക. ബട്ടണുകളിൽ ബാറിലെത്താൻ അവസാന എൻട്രിയിൽ നിന്ന് “താഴേക്ക്” അമർത്തുക.\n\nPaperPaw-ന്റെ സ്വന്തം ഡാറ്റ പോലെ, കുത്തിൽ തുടങ്ങുന്ന ഫയലുകളും ഫോൾഡറുകളും മറച്ചിരിക്കും. അവ കാണാൻ ക്രമീകരണം › ലൈബ്രറി › മറഞ്ഞ ഫയലുകൾ ഓണാക്കുക."
