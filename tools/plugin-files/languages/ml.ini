wifi.plugin.name = Wi-Fi
wifi.plugin.description = ആവശ്യമുള്ളപ്പോൾ Wi-Fi നെറ്റ്വർക്കുകളിൽ ചേരുകയും പിന്നീട് റേഡിയോ ഓഫാക്കുകയും ചെയ്യുന്നു.
wifi.plugin.how = "ഒരു പ്ലഗിന് ഇന്റർനെറ്റ് ആവശ്യമുള്ളപ്പോൾ (കാറ്റലോഗ്, സമന്വയം, സ്റ്റോർ, കൈമാറ്റം) Wi-Fi ഒരു നെറ്റ്വർക്കിൽ ചേരുന്നു. ബാറ്ററിയും മെമ്മറിയും ലാഭിക്കാൻ, ഒന്നും ഉപയോഗിക്കാതായി ഒരു മിനിറ്റിനു ശേഷം, അല്ലെങ്കിൽ ഹോമോ ഒരു പുസ്തകമോ കാണിക്കുമ്പോൾ ഉടനെ, റേഡിയോ വീണ്ടും ഓഫാക്കുന്നു.\n\nക്രമീകരണത്തിൽ നിന്നോ സ്റ്റാറ്റസ് ലൈനിലെ Wi-Fi ഇനത്തിൽ നിന്നോ Wi-Fi തുറക്കുക. “നെറ്റ്വർക്കുകൾ” പരിധിയിലുള്ളവ കാണിക്കുന്നു; ഒന്ന് തിരഞ്ഞെടുത്ത് പാസ്വേഡ് ടൈപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ “ഫോൺ ഉപയോഗിച്ച് സജ്ജീകരിക്കുക” തിരഞ്ഞെടുത്ത് ഉപകരണത്തിനു പകരം ഫോണിന്റെ ബ്രൗസറിൽ പേരും പാസ്വേഡും ടൈപ്പ് ചെയ്യുക. “മറക്കുക” സംരക്ഷിച്ച നെറ്റ്വർക്ക് നീക്കം ചെയ്യുന്നു.\n\nപാസ്വേഡുകൾ കാർഡിൽ സുരക്ഷിതമായി സൂക്ഷിക്കുന്നു, പിന്നീട് ഒരിക്കലും കാണിക്കില്ല. “ആവശ്യമുള്ളപ്പോൾ കണക്റ്റ് ചെയ്യുക” എന്നതിൽ, അവസാന ഉപയോഗത്തിനു ശേഷം Wi-Fi എത്ര നേരം ഓണായിരിക്കണം, ചാർജ് ചെയ്യുമ്പോൾ ഓണായിരിക്കണോ, പല നെറ്റ്വർക്കുകൾ പരിധിയിലുള്ളപ്പോൾ ഏത് സംരക്ഷിച്ച നെറ്റ്വർക്ക് ആദ്യം എന്നിവ സജ്ജമാക്കാം."
