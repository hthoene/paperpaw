stats.plugin.name = വായനാ സ്ഥിതിവിവരക്കണക്കുകൾ
stats.plugin.description = നിങ്ങൾ എത്ര നേരം, എത്രത്തോളം വായിക്കുന്നുവെന്ന് രേഖപ്പെടുത്തുന്നു; കലണ്ടറും ഓരോ പുസ്തകത്തിന്റെയും കണക്കുകളും സഹിതം.
stats.plugin.how = "വായനാ സ്ഥിതിവിവരക്കണക്കുകൾ ഓരോ പേജും നിങ്ങൾ എത്ര നേരം വായിക്കുന്നുവെന്ന് രേഖപ്പെടുത്തുന്നു. ഇന്ന്, ഈ ആഴ്ച, തുടർച്ച എന്നിവയുള്ള ഒരു അവലോകനമായും കലണ്ടറായും ഓരോ പുസ്തകത്തിന്റെയും കണക്കുകളായും ഇത് കാണാം.\n\nടൂളുകളിൽ നിന്നോ റീഡറിലെ “കൂടുതൽ” എന്നതിൽ നിന്നോ ഇത് തുറക്കുക. ക്രമീകരണത്തിൽ “വായനാ സ്ഥിതിവിവരക്കണക്കുകൾ” എന്നതിനു കീഴിൽ “വായന രേഖപ്പെടുത്തുക” ഓഫാക്കാം, “ദൈനംദിന ലക്ഷ്യം” നിശ്ചയിക്കാം, എണ്ണാനുള്ള “കുറഞ്ഞ പേജ് സമയം”, “കൂടിയ പേജ് സമയം” എന്നിവ നിശ്ചയിക്കാം; അങ്ങനെ പേജുകൾ മറിച്ചുനോക്കുന്നതോ തുറന്നുവെച്ച പുസ്തകമോ കണക്കുകൾ തെറ്റിക്കില്ല.\n\n“KOReader-മായി സമന്വയിപ്പിക്കുക” ഒരു WebDAV ഫോൾഡർ വഴി KOReader-മായി സ്ഥിതിവിവരക്കണക്കുകൾ പങ്കിടുന്നു. ഇതേ ഉപകരണത്തിലെ KOReader-ന്റെ സ്ഥിതിവിവരക്കണക്കുകളും ഇത് ഏറ്റെടുക്കും. രേഖപ്പെടുത്താൻ ക്ലോക്ക് സജ്ജമാക്കിയിരിക്കണം: ഇല്ലെങ്കിൽ ഒരിക്കൽ Wi-Fi-യിലേക്ക് കണക്റ്റ് ചെയ്യുക."
