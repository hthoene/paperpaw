koreader.plugin.name = ഹൈലൈറ്റ് പങ്കിടൽ
koreader.plugin.description = രണ്ടിലും വായിക്കുന്ന പുസ്തകങ്ങളുടെ ബുക്ക്മാർക്കുകളും ഹൈലൈറ്റുകളും KOReader-മായി പങ്കിടുന്നു.
koreader.plugin.how = "ഈ പ്ലഗിൻ, PaperPaw-ലും KOReader-ലും വായിക്കുന്ന പുസ്തകങ്ങളുടെ ബുക്ക്മാർക്കുകളും ഹൈലൈറ്റുകളും KOReader-മായി പങ്കിടുന്നു: ഒരേ ഉപകരണത്തിലോ, ഉപകരണങ്ങൾക്കിടയിൽ സമന്വയിപ്പിക്കുന്ന ലൈബ്രറി ഫോൾഡറിലോ. ഒന്നും സജ്ജീകരിക്കേണ്ടതില്ല.\n\nKOReader തുറന്നിട്ടുള്ള ഒരു പുസ്തകം PaperPaw തുറക്കുമ്പോഴും അതിന്റെ ബുക്ക്മാർക്കുകളോ ഹൈലൈറ്റുകളോ മാറ്റുമ്പോഴും, പുസ്തകത്തിനരികിലുള്ള KOReader ഡാറ്റയിൽ നിന്ന് പുതിയവ എടുക്കുന്നു; ഇവിടത്തെ പുതിയവ, KOReader അടുത്ത തവണ പുസ്തകം തുറക്കുമ്പോൾ എടുക്കാനായി വയ്ക്കുന്നു. നീക്കം ചെയ്ത അടയാളങ്ങളും മാറ്റിയ കുറിപ്പുകളും കൈമാറും.\n\nഇത് EPUB പുസ്തകങ്ങൾക്ക് മാത്രം. ഒരു വശത്തെ ഫയൽ വായിക്കാനാവുന്നില്ലെങ്കിൽ, അത് വായിക്കാനാകുന്നതുവരെ ഇരുവശത്തും ഒന്നും മാറില്ല."
koreader.removed-there = KOReader-ന്റെ ഫയലിൽ ഇനി ഹൈലൈറ്റുകളില്ല. ഇവിടെയും നീക്കം ചെയ്യണോ?
koreader.removed-there.text = അവ KOReader-ൽ നീക്കം ചെയ്തിരിക്കാം, അല്ലെങ്കിൽ അതിന്റെ ഫയൽ മറ്റൊരു ഉപകരണത്തിൽ നിന്ന് വന്നതാകാം. “നിലനിർത്തുക” അവ ഇവിടെ നിലനിർത്തി KOReader-ന് വീണ്ടും നൽകും.
