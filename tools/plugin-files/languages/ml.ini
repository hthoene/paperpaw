battery.plugin.name = ബാറ്ററി ഉപയോഗം
battery.plugin.description = ബാറ്ററി രേഖപ്പെടുത്തുകയും അത് എത്ര നേരം നിൽക്കുമെന്ന് കാണിക്കുകയും ചെയ്യുന്നു.
battery.plugin.how = "ഉപകരണം ഉണർന്നിരിക്കുമ്പോൾ ഏകദേശം മിനിറ്റിൽ ഒരിക്കൽ “ബാറ്ററി ഉപയോഗം” ചാർജ് രേഖപ്പെടുത്തുന്നു, ഒപ്പം ഉപകരണം ചെയ്തതും: സ്ക്രീൻ പുതുക്കലുകളും മറിച്ച പേജുകളും. അതിൽ നിന്ന് ഒരു മണിക്കൂർ ഉണർന്നിരിക്കാനും 100 പേജുകൾക്കും എത്ര ചാർജ് വേണം, ആ നിരക്കിൽ ബാറ്ററി എത്ര നേരം നിൽക്കും എന്ന് കണക്കാക്കുന്നു.\n\n“ടൂളുകൾ” മെനുവിൽ നിന്ന് “ബാറ്ററി” തുറക്കുക. ഇപ്പോഴത്തെ ചാർജ്, ഈ ഉണർന്നിരിക്കൽ, ഇതുവരെയുള്ള ബാറ്ററി ഉപയോഗം, സമീപകാല ഉണർന്നിരിക്കലുകൾ എന്നിവ കാണിക്കും. പേജ് ബട്ടണുകൾ ഉപയോഗിച്ചോ മുകളിലെ അമ്പടയാളങ്ങളിൽ ടാപ്പ് ചെയ്തോ പേജ് മറിക്കാം.\n\nകണക്കുകൾക്ക് അർത്ഥമുണ്ടാകാൻ ബാറ്ററിയിൽ കുറച്ചുനേരം വായിക്കണം. രേഖപ്പെടുത്തൽ സ്ഥിരമായി ഓണാണ്; ക്രമീകരണത്തിൽ “ഉപകരണം”, “പവർ” എന്നതിന് കീഴിൽ “ബാറ്ററി ഉപയോഗം രേഖപ്പെടുത്തുക” ഓഫാക്കാം."
