core.usb-drive.title = USB ഡ്രൈവ്
core.usb-drive.text = USB ഡ്രൈവായി കണക്റ്റ് ചെയ്തു: കാർഡ് ഇപ്പോൾ കമ്പ്യൂട്ടറിലാണ്. അത് തിരികെ ലഭിക്കാൻ അവിടെ ഡ്രൈവ് ഇജക്റ്റ് ചെയ്യുക, അല്ലെങ്കിൽ “മടങ്ങുക” അമർത്തുക; തുടർന്ന് “ശരി” അമർത്തുക. നിങ്ങൾ പകർത്തിയ ഫയലുകൾ പിന്നീട് ലൈബ്രറിയിൽ കാണാം.
core.usb-link.title = USB ഡെവലപ്പർ ടൂളുകൾ അനുവദിക്കണോ?
core.usb-link.text = USB കേബിളിലൂടെ കണക്റ്റ് ചെയ്ത കമ്പ്യൂട്ടറിന് ബട്ടണുകൾ അമർത്താനും സ്ക്രീൻഷോട്ടുകൾ എടുക്കാനും പുസ്തകങ്ങളും പ്ലഗിൻ ഫയലുകളും വായിക്കാനും എഴുതാനും കഴിയും. അതിന് രഹസ്യങ്ങൾ വായിക്കാനോ കോഡ് ഇൻസ്റ്റാൾ ചെയ്യാനോ കഴിയില്ല. ഉപകരണം റീസ്റ്റാർട്ട് ചെയ്യുകയോ സ്ലീപ്പിലാകുകയോ ചെയ്യുമ്പോഴും കേബിൾ ഊരുമ്പോഴും നിങ്ങൾ ഇവിടെ ഓഫാക്കുമ്പോഴും ഇത് ഓഫാകും.
