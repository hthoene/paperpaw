reader.plugin.name = റീഡർ
reader.plugin.description = ഉള്ളടക്ക പട്ടികയും വായനാ ക്രമീകരണങ്ങളുമായി പുസ്തകങ്ങൾ പേജുപേജായി കാണിക്കുന്നു.
reader.plugin.how = "റീഡർ പുസ്തകങ്ങൾ പേജുപേജായി കാണിക്കുന്നു. ലൈബ്രറിയിൽ നിന്ന് പുസ്തകം തുറക്കുക; അവസാന പുസ്തകം ആരംഭത്തിൽ വീണ്ടും തുറക്കാം (“ആരംഭത്തിൽ അവസാന പുസ്തകം തുറക്കുക”).\n\nപേജ് മറിക്കാൻ സ്ക്രീനിന്റെ ഇടതോ വലതോ ടാപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ പേജ് ബട്ടണുകൾ. വായനാ മെനുവിന് (ഉള്ളടക്കം, തിരയുക, പേജിലേക്ക് പോകുക, ഫോണ്ടും ലേഔട്ടും, ബുക്ക്മാർക്കുകളും ഹൈലൈറ്റുകളും...) മധ്യത്തിൽ ടാപ്പ് ചെയ്യുക അല്ലെങ്കിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തുക. മുകളറ്റത്തു നിന്ന് താഴേക്ക് ദ്രുത പാനൽ; താഴത്തെ അറ്റത്തു നിന്ന് മുകളിലേക്ക് അല്ലെങ്കിൽ “മടങ്ങുക” അമർത്തിപ്പിടിച്ചാൽ ഹോം.\n\nചിത്രം പൂർണ്ണ സ്ക്രീനിൽ കാണാൻ “തിരഞ്ഞെടുക്കുക” (അല്ലെങ്കിൽ ചിത്രം) അമർത്തിപ്പിടിക്കുക: ഇടത്/വലത് പേജിലെ ചിത്രങ്ങളിലൂടെ. “തിരഞ്ഞെടുക്കുക” 2x, 3x സൂം ചെയ്ത് തിരികെ (ടച്ചിൽ ഡബിൾ ടാപ്പ്); സൂമിൽ ഇടത്/വലത് വശങ്ങളിലേക്കും പേജ് ബട്ടണുകൾ (അല്ലെങ്കിൽ സ്വൈപ്പ്) കുറുകെയും താഴേക്കും നീക്കുന്നു. “മടങ്ങുക” ആദ്യം ഒതുക്കത്തിലേക്ക്, പിന്നെ പേജിലേക്ക് (ടച്ചിൽ പുറത്തുകടക്കാൻ അമർത്തിപ്പിടിക്കുക). ബുക്ക്മാർക്കിന് മുകളിൽ വലത് മൂല ടാപ്പ് ചെയ്യുക. ഹൈലൈറ്റ് ചെയ്യാൻ വാക്ക് അമർത്തിപ്പിടിക്കുക. ബട്ടണുകളിൽ ഇടത് അമർത്തിപ്പിടിക്കുക: ഇടത്/വലത് വാക്കുതോറും, പേജ് ബട്ടണുകൾ വരിതോറും, അമർത്തിപ്പിടിച്ചാൽ പേജിന്റെ അറ്റങ്ങളിലേക്കും ഖണ്ഡികതോറും; “തിരഞ്ഞെടുക്കുക” ഹൈലൈറ്റ് ബാർ തുറക്കുന്നു, അമർത്തിപ്പിടിച്ചാൽ വാക്യത്തിലേക്കും ഖണ്ഡികയിലേക്കും വികസിക്കും (അപ്പോൾ ഇടത്/വലത് അവസാനം നീക്കുന്നു, അമർത്തിപ്പിടിച്ചാൽ തുടക്കം). തിരഞ്ഞെടുപ്പ് പേജ് മറിക്കലിലും തുടരും. “Markdown ആയി എക്സ്പോർട്ട് ചെയ്യുക” നിങ്ങളുടെ കുറിപ്പുകൾ സംരക്ഷിക്കുന്നു."
