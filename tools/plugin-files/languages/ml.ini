lock.plugin.name = സ്ക്രീൻ ലോക്ക്
lock.plugin.description = ഉപകരണം ഉണരുമ്പോൾ PIN, പാറ്റേൺ അല്ലെങ്കിൽ പാസ്വേഡ്; വായിക്കുമ്പോൾ ടച്ച് ലോക്ക്.
lock.plugin.how = "PaperPaw ആരംഭിക്കുമ്പോഴും ഉപകരണം ഉണരുമ്പോഴും സ്ക്രീൻ ലോക്ക് PIN, പാറ്റേൺ അല്ലെങ്കിൽ പാസ്വേഡ് ചോദിക്കുന്നു. തുടക്കത്തിൽ ഇത് ഓഫാണ്. ഇത് സാധാരണ ഉപയോഗം മാത്രം തടയുന്നു: കോഡും തെറ്റായ ശ്രമങ്ങളുടെ എണ്ണവും SD കാർഡിലാണ്, അതിനാൽ കാർഡ് എടുക്കുകയോ എഡിറ്റ് ചെയ്യുകയോ മാറ്റുകയോ ചെയ്യുന്നയാൾക്ക് ലോക്ക് മറികടക്കാം.\n\nക്രമീകരണത്തിൽ “ഉപകരണം” › “സ്ക്രീൻ ലോക്ക്”: നിലവിലുള്ള കോഡ് (ഉണ്ടെങ്കിൽ) നൽകുക, തരം തിരഞ്ഞെടുക്കുക, പുതിയ കോഡ് രണ്ടുതവണ നൽകുക. പാറ്റേൺ ടച്ച് സ്ക്രീനുകളിൽ മാത്രം.\n\nഅഞ്ച് തെറ്റായ ശ്രമങ്ങൾക്ക് ശേഷം അടുത്തതിന് അര മിനിറ്റ് കാത്തിരിക്കണം. “ഇപ്പോൾ ലോക്ക് ചെയ്യുക” ഉടൻ ലോക്ക് ചെയ്യുന്നു; ഒരു ബട്ടണിലോ ജെസ്റ്ററിലോ നിയമത്തിലോ വയ്ക്കാം. “ഉണർന്ന ശേഷം ലോക്ക് ചെയ്യുക” ഓഫാക്കിയാൽ യഥാർത്ഥ ആരംഭം (ഓണാക്കൽ, റീസ്റ്റാർട്ട്) മാത്രം ലോക്ക് ചെയ്യും; ബാറ്ററിയിലുള്ള X4-ലെ പോലെ ഓരോ ഉണരലും ആരംഭമാണെങ്കിൽ ഒഴികെ.\n\nടച്ച് ലോക്ക്: ദ്രുത പാനലിലും വായനാ മെനുവിലുമുള്ള “ടച്ച് ലോക്ക് ചെയ്യുക” ടാപ്പ്, സ്വൈപ്പ്, പേന എന്നിവ നിഷ്ക്രിയമാക്കുന്നു, ബട്ടണുകൾ പ്രവർത്തിക്കും (ഉദാ. സ്ക്രീനിൽ കൈ വച്ച് വായിക്കാൻ). അൺലോക്ക് ചെയ്യാൻ ഒരു വിരൽ കൊണ്ട് രണ്ടുതവണ ടാപ്പ് ചെയ്ത് അൽപ്പനേരം അമർത്തിപ്പിടിക്കുക; പവർ ബട്ടൺ അമർത്തിപ്പിടിച്ചാൽ പവർ മെനു തുറക്കും, അവിടെ “ടച്ച് അൺലോക്ക് ചെയ്യുക” ബട്ടണുകൾ കൊണ്ട് ചെയ്യാം; X4 Pro-യിൽ ഹോം കീ അമർത്തിപ്പിടിച്ചാൽ ഉടൻ അൺലോക്ക് ആകും."
