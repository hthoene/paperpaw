about.plugin.name = വിവരം
about.plugin.description = PaperPaw-യുടെ പതിപ്പും ലൈസൻസുകളും.
about.plugin.how = "“വിവരം” നിങ്ങളുടെ PaperPaw-യുടെ പതിപ്പ്, അതിന്റെ സോഴ്സ് കോഡ് എവിടെയാണ്, ഏതെല്ലാം ലൈസൻസുകൾക്ക് കീഴിലാണ് എന്നിവ കാണിക്കുന്നു.\n\nക്രമീകരണത്തിന്റെ അവസാനം “PaperPaw-യെക്കുറിച്ച്” എന്ന പേരിൽ ഇത് കാണാം. അമ്പടയാള ബട്ടണുകളും “തിരഞ്ഞെടുക്കുക”-യും ഉപയോഗിച്ച് ഒരു വരി തിരഞ്ഞെടുക്കുക, അല്ലെങ്കിൽ അതിൽ ടാപ്പ് ചെയ്യുക. ഫേംവെയറിൽ ഉൾച്ചേർത്ത പ്ലഗിനുകളും, കോഡുള്ള പ്ലഗിനുകൾ ലോഡ് ചെയ്യുന്ന ഉപകരണങ്ങളിൽ അത്തരം പ്ലഗിനുകൾ ബിൽഡ് ചെയ്യേണ്ട ഫിംഗർപ്രിന്റും ഇവിടെയുണ്ട്.\n\n“ലൈസൻസുകൾ” റീഡറിൽ ഒരു ടെക്സ്റ്റായി തുറക്കും, ഒരു പുസ്തകം പോലെ പേജ് മറിക്കാം. അതിൽ PaperPaw-യുടെ സ്വന്തം ലൈസൻസും ഒപ്പമുള്ള ഫോണ്ടുകൾ, ഐക്കണുകൾ, ഹൈഫനേഷൻ പാറ്റേണുകൾ എന്നിവയുടെ ലൈസൻസുകളുമുണ്ട്. പ്ലഗിനുകൾക്ക് സ്വന്തമായി ഒരു വരി ചേർക്കാം, ഉദാഹരണത്തിന് ഒരു തീമിന്റെ രചയിതാവ്."
about.version.beta = {version} ബീറ്റ {number}
about.title = PaperPaw-യെക്കുറിച്ച്
about.intro = ഇ-ഇങ്ക് ഉപകരണങ്ങൾക്കായി പ്ലഗിനുകൾ കൊണ്ട് നിർമ്മിച്ച ഒരു സൗജന്യ ഇ-റീഡർ. Apache License 2.0 പ്രകാരം ലൈസൻസ് ചെയ്തത്; ഒപ്പമുള്ളവയുടെ ലൈസൻസുകൾ താഴെ.
about.plugins.title = ഉൾച്ചേർത്ത പ്ലഗിനുകൾ
about.plugins.help = ഈ ഫേംവെയറിലെ കോഡുള്ള പ്ലഗിനുകൾ, അവയുടെ പതിപ്പുകളോടൊപ്പം. ഒരു അപ്ഡേറ്റ് ഇവ തന്നെ വീണ്ടും കൊണ്ടുവരും; കഴിയാത്തതുണ്ടെങ്കിൽ അത് ആദ്യം അറിയിക്കും.
about.summary = ഇ-ഇങ്ക് ഉപകരണങ്ങൾക്കായി പ്ലഗിനുകൾ കൊണ്ട് നിർമ്മിച്ച ഒരു സൗജന്യ ഇ-റീഡർ.
