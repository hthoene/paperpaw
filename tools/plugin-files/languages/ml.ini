joplin.some-failed = Joplin-ലേക്ക് അയച്ചത്: {sent}. അയയ്ക്കാത്തത്: {failed}; അവ പിന്നീട് വീണ്ടും അയയ്ക്കും.
joplin.apart.one = ഒരു നോട്ട് Joplin-ൽ മാറ്റിയതിനാൽ അതിനരികിൽ പുതിയൊരെണ്ണം നിർമ്മിച്ചു.
joplin.apart.other = {count} നോട്ടുകൾ Joplin-ൽ മാറ്റിയതിനാൽ അവയ്ക്കരികിൽ പുതിയവ നിർമ്മിച്ചു.
joplin.nothing = Joplin-ലേക്ക് അയയ്ക്കാൻ കുറിപ്പുകളൊന്നും കാത്തിരിക്കുന്നില്ല.
joplin.no-network = Joplin-ലേക്ക് അയയ്ക്കാൻ നെറ്റ്വർക്ക് വേണം. കുറിപ്പുകൾ കാത്തിരുന്ന് പിന്നീട് അയയ്ക്കും.
joplin.setup-needed = ആദ്യം Joplin സജ്ജീകരിക്കുക: എവിടേക്ക് സമന്വയിപ്പിക്കുന്നു, നിങ്ങളുടെ അക്കൗണ്ട്, പാസ്വേഡ്.
joplin.no-time = സമയം ഇതുവരെ അറിയില്ല. കുറിപ്പുകൾ കാത്തിരുന്ന് പിന്നീട് അയയ്ക്കും.
joplin.unreachable = Joplin-ൽ എത്താനാവുന്നില്ല. കുറിപ്പുകൾ കാത്തിരുന്ന് പിന്നീട് അയയ്ക്കും.
joplin.failed = Joplin ഒരു പിശക് നൽകി ({status}). കുറിപ്പുകൾ കാത്തിരുന്ന് പിന്നീട് അയയ്ക്കും.
joplin.bad-login = Joplin ഇമെയിലോ ഉപയോക്തൃനാമമോ പാസ്വേഡോ സ്വീകരിച്ചില്ല. Joplin സജ്ജീകരണത്തിൽ അവ പരിശോധിക്കുക.
joplin.no-server = ഈ വിലാസത്തിൽ Joplin Server ഇല്ല. Joplin സജ്ജീകരണത്തിൽ അത് പരിശോധിക്കുക.
joplin.bad-address = ഈ വിലാസം PaperPaw-ന് ഉപയോഗിക്കാനാവില്ല. Joplin സജ്ജീകരണത്തിൽ അത് പരിശോധിക്കുക.
joplin.no-data = ഈ വിലാസത്തിൽ Joplin കുറിപ്പുകളൊന്നുമില്ല. അത് പരിശോധിക്കുക, അല്ലെങ്കിൽ ആദ്യം Joplin അതുമായി സമന്വയിപ്പിക്കുക.
joplin.encrypted = Joplin-ന്റെ എൻഡ്-ടു-എൻഡ് എൻക്രിപ്ഷൻ ഓണാണ്. PaperPaw-ന് കുറിപ്പുകൾ എൻക്രിപ്റ്റ് ചെയ്യാനാവാത്തതിനാൽ ഒന്നും അയയ്ക്കുന്നില്ല.
joplin.newer-target = ഈ PaperPaw-ന് അറിയുന്നതിനേക്കാൾ പുതിയ ഫോർമാറ്റിലാണ് Joplin അവിടെ കുറിപ്പുകൾ സൂക്ഷിക്കുന്നത്. അവ അയയ്ക്കാൻ PaperPaw അപ്ഡേറ്റ് ചെയ്യുക.
joplin.older-target = Joplin അവിടെ കുറിപ്പുകൾ പഴയ ഫോർമാറ്റിലാണ് സൂക്ഷിക്കുന്നത്. അത് അപ്ഗ്രേഡ് ചെയ്യാൻ Joplin തുറക്കുക, എന്നിട്ട് വീണ്ടും അയയ്ക്കുക.
joplin.upgrading = Joplin ഇപ്പോൾ അവിടത്തെ കുറിപ്പുകൾ അപ്ഗ്രേഡ് ചെയ്യുകയാണ്. അവ കാത്തിരുന്ന് പിന്നീട് അയയ്ക്കും.
joplin.no-memory = കുറിപ്പുകൾ അയയ്ക്കാൻ മതിയായ മെമ്മറിയില്ല. റീസ്റ്റാർട്ട് ചെയ്ത് വീണ്ടും ശ്രമിക്കുക.
keyboard.plugin.name = കീബോർഡ്
keyboard.plugin.description = സ്ക്രീനിൽ ടെക്സ്റ്റ് നൽകുന്നു, ടച്ച് വഴിയോ ബട്ടണുകൾ വഴിയോ.
keyboard.plugin.how = "തിരയൽ, പാസ്വേഡ്, കുറിപ്പ്, ക്രമീകരണം എന്നിങ്ങനെ ടെക്സ്റ്റ് വേണ്ടപ്പോഴെല്ലാം കീബോർഡ് തുറക്കും. ടച്ചിലും ബട്ടണുകൾ മാത്രമായും ഇത് പ്രവർത്തിക്കുന്നു.\n\nബട്ടണുകളിൽ: ഇടതും വലതും ഒരു വരിയിലൂടെ (വട്ടം ചുറ്റി) നീങ്ങുന്നു, പേജ് ബട്ടണുകൾ വരികൾക്കിടയിൽ, മുകളിലേക്കും താഴേക്കും അതേ കോളത്തിൽ; “തിരഞ്ഞെടുക്കുക” കീ അമർത്തുന്നു, “മടങ്ങുക” റദ്ദാക്കുന്നു. Shift അടുത്ത അക്ഷരം വലിയക്ഷരമാക്കുന്നു; രണ്ടുതവണ: എല്ലാം വലിയക്ഷരം, ഒരിക്കൽ കൂടി: നിർത്തുക. ഒരു അക്ഷരം അമർത്തിപ്പിടിച്ചാൽ (ബട്ടണുകളിൽ: അതിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക) വലിയക്ഷരവും é, è പോലുള്ള ചിഹ്നമുള്ള അക്ഷരങ്ങളും വരും; ജർമ്മനിൽ ä, ö, ü, ß എന്നിവ a, o, u, s-ൽ നിന്ന്. “ശരി” ടൈപ്പിംഗ് പൂർത്തിയാക്കുന്നു; ബട്ടണുകളിൽ “മടങ്ങുക” അമർത്തിപ്പിടിച്ചോ അക്ഷരമല്ലാത്ത കീയിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിച്ചോ എവിടെ നിന്നും പൂർത്തിയാക്കാം. “ഒട്ടിക്കുക” ക്ലിപ്പ്ബോർഡ് ടെക്സ്റ്റ് ചേർക്കുന്നു; “ഫോൺ” (ഉള്ളിടത്ത്) ഫോണിൽ ടൈപ്പ് ചെയ്യാൻ അനുവദിക്കുന്നു.\n\nക്രമീകരണത്തിൽ “ഉപകരണം” › “കീബോർഡ്”: “കീബോർഡ് ലേഔട്ടുകൾ” ലേഔട്ടുകൾ തിരഞ്ഞെടുക്കുന്നു (സ്വതേ മെനു ഭാഷ; പലതുണ്ടെങ്കിൽ ഒരു കീ അവയ്ക്കിടയിൽ മാറ്റുന്നു). “ഉംലൗട്ട് കീകൾ” ä, ö, ü, ß എന്നിവയ്ക്ക് സ്വന്തം കീകൾ നൽകുന്നു. “വലുപ്പം” കീകളും അക്ഷരങ്ങളും വലുതാക്കുന്നു. ടച്ച് സ്ക്രീനിൽ “കീയുടെ ആകൃതി” കീകളുടെ രൂപം മാറ്റുന്നു. “സ്വയമേവ വലിയക്ഷരം” ഓരോ വാക്യവും വലിയക്ഷരത്തിൽ തുടങ്ങുന്നു."
