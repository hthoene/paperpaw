anki.setup-needed = ആദ്യം Anki പ്രവർത്തിക്കുന്ന കമ്പ്യൂട്ടർ നൽകുക.
anki.no-network = സമന്വയത്തിന് നെറ്റ്വർക്ക് വേണം. നിങ്ങളുടെ ഉത്തരങ്ങൾ സൂക്ഷിച്ചിട്ടുണ്ട്, അടുത്ത സമന്വയത്തിൽ അവ പോകും.
anki.unreachable = കമ്പ്യൂട്ടറിൽ എത്താനാവുന്നില്ല. അവിടെ Anki തുറന്നിട്ടുണ്ടോ, വിലാസവും പോർട്ടും ശരിയാണോ, AnkiConnect എല്ലാ വിലാസങ്ങളിലും കേൾക്കുന്നുണ്ടോ എന്ന് പരിശോധിക്കുക (“ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു” കാണുക).
anki.bad-key = AnkiConnect API കീ സ്വീകരിച്ചില്ല. ഇവിടെയും ആഡ്-ഓണിന്റെ കോൺഫിഗറേഷനിലും അത് പരിശോധിക്കുക.
anki.bad-reply = മറുപടി AnkiConnect-ൽ (പതിപ്പ് 6) നിന്നുള്ളതല്ല. വിലാസവും പോർട്ടും പരിശോധിക്കുക.
