files.plugin.name = ഫയൽ ബ്രൗസർ
files.plugin.description = ഉപകരണത്തിലെ പുസ്തകങ്ങളും ഫോൾഡറുകളും ലിസ്റ്റ് ചെയ്ത് തുറക്കുന്നു.
files.plugin.how = "ലൈബ്രറി നിങ്ങളുടെ ലൈബ്രറി ഫോൾഡറിലെ പുസ്തകങ്ങൾ കവർ, ശീർഷകം, രചയിതാവ്, വായനാ പുരോഗതി എന്നിവയോടെ കാണിക്കുന്നു. അവസാനം വായിച്ച പുസ്തകം മുകളിൽ ഒരു കാർഡായി നിൽക്കും, അതിനാൽ ഒരു ടാപ്പ് കൊണ്ടോ “തിരഞ്ഞെടുക്കുക” ഒരിക്കൽ അമർത്തിയോ വായന തുടരാം. പുസ്തകങ്ങൾ തിരയുമ്പോൾ ഇതുവരെ എത്രയെണ്ണം കണ്ടെത്തിയെന്ന് കാണിക്കും.\n\nപുസ്തകങ്ങൾക്ക് മുകളിൽ എന്ത് കാണിക്കണമെന്ന് തിരഞ്ഞെടുക്കുക: എല്ലാം, വായിക്കുന്നവ, വായിക്കാത്തവ, വായിച്ചുതീർന്നവ, അല്ലെങ്കിൽ ഷെൽഫുകൾ (രചയിതാവ്, പരമ്പര, ടാഗ്, പ്രിയപ്പെട്ടവ, തുടങ്ങിയ പരമ്പരകളിലെ അടുത്ത പുസ്തകം). വായിക്കാൻ പുസ്തകത്തിൽ ടാപ്പ് ചെയ്യുക; തുറക്കാനോ വായിച്ചുതീർന്നതായോ വായിക്കാത്തതായോ അടയാളപ്പെടുത്താനോ വിവരങ്ങൾ കാണാനോ ആർക്കൈവിലേക്ക് നീക്കാനോ ഇല്ലാതാക്കാനോ അത് അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക). ലൈബ്രറി മെനുവിനായി ശീർഷകത്തിൽ ടാപ്പ് ചെയ്യുക: അടുക്കലും കാഴ്ചയും, തിരയൽ, ലൈബ്രറി ഫോൾഡർ, ക്രമീകരണം.\n\nലൈബ്രറി ഫോൾഡർ ക്രമീകരണം › ലൈബ്രറി › ലൈബ്രറി ഫോൾഡർ എന്നതിൽ സജ്ജമാക്കാം; അവിടെ പുസ്തകങ്ങൾ കവറുകളുടെ ഗ്രിഡായും കാണിക്കാം. മറ്റ് ഫയലുകൾക്ക് ടൂളുകൾ മെനുവിലെ ഫയലുകൾ ഉപയോഗിക്കുക."
