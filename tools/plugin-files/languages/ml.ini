joplin.plugin.name = പുസ്തക കുറിപ്പുകളുടെ സമന്വയം
joplin.plugin.description = ഓരോ പുസ്തകത്തിന്റെയും ഹൈലൈറ്റുകളും കുറിപ്പുകളും ഒരു നോട്ടിൽ സൂക്ഷിക്കുന്നു. Joplin-നൊപ്പം പ്രവർത്തിക്കുന്നു (Joplin Cloud, Joplin Server അല്ലെങ്കിൽ WebDAV).
joplin.title = പുസ്തക കുറിപ്പുകളുടെ സമന്വയം
joplin.send = Joplin-ലേക്ക് അയയ്ക്കുക
joplin.send.help = എക്സ്പോർട്ട് ചെയ്ത കുറിപ്പുകൾ ഉടൻ അയയ്ക്കും. അയയ്ക്കാനാകാത്തവ കാത്തിരുന്ന് അടുത്ത എക്സ്പോർട്ടിനൊപ്പമോ ഇതുവഴിയോ ഒരു നിയമം വഴിയോ പോകും.
joplin.service = സമന്വയിപ്പിക്കുന്നത്
joplin.service.help = Joplin-ൽ സജ്ജീകരിച്ചതുപോലെ, Joplin എന്തുമായി സമന്വയിപ്പിക്കുന്നു: Joplin Cloud, നിങ്ങളുടെ സ്വന്തം Joplin Server, അല്ലെങ്കിൽ Nextcloud പോലുള്ള WebDAV ഫോൾഡർ. കമ്പ്യൂട്ടർ പ്രവർത്തിക്കേണ്ടതില്ല.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = വിലാസം
joplin.address.help = Joplin Server: അതിന്റെ വിലാസം, ഉദാ. joplin.example.org. WebDAV: Joplin സമന്വയിപ്പിക്കുന്ന ഫോൾഡർ, അതിന്റെ ക്രമീകരണത്തിലുള്ളതുപോലെ, ഉദാ. dav.example.org/Joplin.
joplin.email = ഇമെയിൽ
joplin.user = ഉപയോക്തൃനാമം
joplin.user.help = Joplin Cloud, Joplin Server: നിങ്ങൾ സൈൻ ഇൻ ചെയ്യുന്ന ഇമെയിൽ (ടു-ഫാക്ടർ സൈൻ ഇൻ ഇപ്പോൾ ഉപയോഗിക്കാനാവില്ല). WebDAV: ഫോൾഡറിന്റെ ഉപയോക്തൃനാമം.
joplin.password = പാസ്വേഡ്
joplin.password.help = ഈ ഉപകരണത്തിലെ മറ്റ് പാസ്വേഡുകൾക്കും കീകൾക്കുമൊപ്പം സൂക്ഷിക്കുന്നു. Nextcloud-ന് ഒരു ആപ്പ് പാസ്വേഡും പ്രവർത്തിക്കും.
joplin.secret = Joplin പാസ്വേഡ്
joplin.not-kept = പാസ്വേഡ് ഈ ഉപകരണത്തിൽ സൂക്ഷിക്കാനായില്ല.
joplin.notebook = നോട്ട്ബുക്ക്
joplin.notebook.help = PaperPaw Joplin-ൽ നിർമ്മിക്കുന്ന നോട്ട്ബുക്ക്, ഓരോ പുസ്തകത്തിനും ഒരു നോട്ടോടെ. വീണ്ടും എക്സ്പോർട്ട് ചെയ്യുന്നത് നോട്ട് അപ്ഡേറ്റ് ചെയ്യും, മറ്റൊരു നോട്ട്ബുക്കിലേക്ക് നീക്കിയതും.
