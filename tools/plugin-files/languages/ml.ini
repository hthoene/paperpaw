picture-frame.setting.sync = സെർവറിൽ നിന്ന് എടുക്കുക
picture-frame.setting.sync.help = ആവശ്യപ്പെടുമ്പോൾ മാത്രം, ചാർജർ കുത്തുമ്പോഴും (പരമാവധി ആറ് മണിക്കൂറിലൊരിക്കൽ), അല്ലെങ്കിൽ Wi-Fi ഓണായിരിക്കുമ്പോഴും (പരമാവധി ദിവസത്തിലൊരിക്കൽ). ഒരു ഫോട്ടോയ്ക്കായി റീഡർ ഉണരുമ്പോൾ Wi-Fi ഒരിക്കലും ഓണാകില്ല.
