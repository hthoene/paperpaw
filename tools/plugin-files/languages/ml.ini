sleep.plugin.name = സ്ലീപ്പ് സ്ക്രീൻ
sleep.plugin.description = ഉപകരണം സ്ലീപ്പിലായിരിക്കുമ്പോൾ ഉറങ്ങുന്ന പൂച്ച, പുസ്തകത്തിന്റെ കവർ, നിങ്ങളുടെ ചിത്രങ്ങൾ അല്ലെങ്കിൽ ഒരു സന്ദേശം കാണിക്കുന്നു.
sleep.plugin.how = "ഉപകരണം സ്ലീപ്പിലായിരിക്കുമ്പോൾ സ്ക്രീനിൽ എന്ത് കാണിക്കണമെന്ന് സ്ലീപ്പ് സ്ക്രീൻ തീരുമാനിക്കുന്നു. വൈദ്യുതിയില്ലാതെയും ഇ-ഇങ്ക് ചിത്രം നിലനിർത്തും.\n\nക്രമീകരണം › ഉപകരണം › സ്ലീപ്പ് സ്ക്രീൻ › “കാണിക്കുക” എന്നതിൽ തിരഞ്ഞെടുക്കുക: ഉറങ്ങുന്ന പൂച്ച (ഡിഫോൾട്ട്), പുസ്തകത്തിന്റെ കവർ, എന്റെ ചിത്രങ്ങൾ, ലോഗോയും “സ്ലീപ്പിലാണ്” എന്നതും, വിജറ്റുകൾ, പേജ് അതേപടി, അല്ലെങ്കിൽ ചിത്രമുള്ള പേജ്. “എന്റെ ചിത്രങ്ങൾ” ചിത്ര ഫോൾഡറിലെ ഫയലുകൾ ഓരോന്നായി കാണിക്കും. കവറോ ചിത്രമോ ഇല്ലെങ്കിൽ പൂച്ചയെ കാണിക്കും. സിസ്റ്റം തന്നെ സ്ലീപ്പ് സ്ക്രീൻ വരയ്ക്കുന്നിടത്ത് ഈ ക്രമീകരണങ്ങൾ മറച്ചിരിക്കും.\n\n“ഓഫാക്കുമ്പോൾ കാണിക്കുക”: പവർ മെനുവിൽ നിന്നോ “സ്ലീപ്പിന് ശേഷം ഓഫാക്കുക” സമയം കഴിഞ്ഞോ ഉപകരണം ഓഫാകുമ്പോൾ ഒരിക്കൽ വരയ്ക്കും (ബാറ്ററി തീർന്ന് ഓഫാകുമ്പോഴല്ല). ലോഗോയും “ഓഫാക്കി” എന്നതും, പൂച്ച, കവർ അല്ലെങ്കിൽ എന്റെ ചിത്രങ്ങൾ തിരഞ്ഞെടുത്തില്ലെങ്കിൽ ഇത് സ്ലീപ്പ് സ്ക്രീൻ പോലെയാണ്. മറ്റൊരു പ്ലഗിനും ഇതിന് സ്ക്രീൻ നൽകാം.\n\n“തുടങ്ങുമ്പോൾ കാണിക്കുക”, “റീസ്റ്റാർട്ട് ചെയ്യുമ്പോൾ കാണിക്കുക”: മറ്റൊരു പ്ലഗിൻ സ്ക്രീൻ നൽകുന്നില്ലെങ്കിൽ ഉപകരണത്തിന്റെ സ്വന്തം സ്ക്രീൻ. തുടങ്ങുമ്പോൾ പ്ലഗിനുകൾ പ്രവർത്തിക്കില്ല: തുടക്കത്തിനുള്ള സ്ക്രീൻ ഓഫാക്കുമ്പോഴോ റീസ്റ്റാർട്ട് ചെയ്യുമ്പോഴോ മുൻകൂട്ടി വരച്ച് അടുത്ത തുടക്കത്തിൽ കാണിക്കും. സമയത്തിന് തയ്യാറാകാത്ത സ്ക്രീനിനോ കേടായ ചിത്രത്തിനോ പകരം ഉപകരണത്തിന്റെ സ്വന്തം സ്ക്രീൻ വരും; എന്തായാലും ഉപകരണം ഓഫാകുകയോ റീസ്റ്റാർട്ട് ആകുകയോ ചെയ്യും."
