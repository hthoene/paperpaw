plugin-manager.code.revoked = പ്രവർത്തിപ്പിച്ചില്ല: രചയിതാവ് ഒപ്പിട്ട കീ മോഷ്ടിക്കപ്പെട്ടതിനാൽ റദ്ദാക്കി. ഇത് നീക്കം ചെയ്യുക; സ്റ്റോറിന് രചയിതാവിൽ നിന്ന് ഇത് വീണ്ടും ലഭിച്ചേക്കാം.
