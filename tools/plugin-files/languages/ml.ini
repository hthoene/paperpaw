notes-overview.export.help.more = ഇ-റീഡറുകൾ ഉപയോഗിക്കുന്ന My Clippings.txt ഫോർമാറ്റിൽ എല്ലാ കുറിപ്പുകളും ഒരു ഫയലിൽ, ലൈബ്രറിക്ക് അരികിലെ “Exports” ഫോൾഡറിൽ. ലിസ്റ്റ് 200 പുസ്തകങ്ങൾ കാണിക്കുന്നു, ഫയലിൽ എല്ലാമുണ്ട്.
