picture-frame.setting.folder.help = നിങ്ങളുടെ ഫോട്ടോകളുള്ള (JPEG അല്ലെങ്കിൽ PNG) കാർഡിലെ ഫോൾഡർ. പേര് ക്രമത്തിൽ ആദ്യത്തെ 512 എണ്ണം ഉപയോഗിക്കും.
picture-frame.setting.change = ഫോട്ടോ മാറ്റുക
picture-frame.setting.change.help = സ്ലീപ്പ് സ്ക്രീൻ ഓരോ സ്ലീപ്പിലും അടുത്ത ഫോട്ടോ കാണിക്കണോ ഓരോ ദിവസവും പുതിയത് കാണിക്കണോ. “സ്ലീപ്പ് സ്ക്രീൻ” › “കാണിക്കുക” എന്നതിൽ “ചിത്ര ഫ്രെയിമിൽ നിന്നുള്ള ഫോട്ടോ” തിരഞ്ഞെടുക്കുക.
picture-frame.change.sleep = ഓരോ സ്ലീപ്പിലും
picture-frame.change.daily = ദിവസവും
picture-frame.setting.fit = സ്ക്രീനിൽ ഒതുക്കുക
picture-frame.setting.fit.help = “മുഴുവൻ ഫോട്ടോ” വെളുത്ത അരികോടെ ഫോട്ടോ മുഴുവനായി കാണിക്കുന്നു. “സ്ക്രീൻ നിറയ്ക്കുക” അത് സ്ക്രീനിനൊത്ത് മുറിക്കുന്നു. “സ്വയമേവ” ആകൃതി സ്ക്രീനിന്റേതിനോട് അടുത്താണെങ്കിൽ നിറയ്ക്കുന്നു, അല്ലെങ്കിൽ ഫോട്ടോ മുഴുവനായി കാണിക്കുന്നു.
