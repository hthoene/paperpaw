diagnostics.plugin.description = ഒരു ടെസ്റ്റ് സ്ക്രീനും ഉപകരണത്തിന്റെ ഓരോ ഭാഗവും പരിശോധിക്കുന്ന ഗൈഡഡ് പരിശോധനയും.
diagnostics.plugin.how = "ഡയഗ്നോസ്റ്റിക്സ് ഉപകരണം പരിശോധിക്കാനുള്ള ഒരു ടെസ്റ്റ് സ്ക്രീനാണ്: പാനലിന് കാണിക്കാവുന്ന എല്ലാ ചാരനിറ നിലകളും, ബട്ടണുകളും ടച്ചും പരീക്ഷിക്കാൻ നാല് ബോക്സുകളും, റിഫ്രഷ് മോഡുകൾ താരതമ്യം ചെയ്യാൻ പ്രോഗ്രസ് ബാറുള്ള പേജ് കൗണ്ടറും.\n\nടെസ്റ്റ് സ്ക്രീനിന് മെനു എൻട്രിയില്ല. മറ്റൊരു പ്ലഗിനും ഹോം സ്ക്രീൻ നൽകാത്തപ്പോഴോ, പ്ലഗിൻ മാനേജറിലെ സ്ക്രീനുകളിൽ ഹോം സ്ക്രീൻ സ്ഥാനത്തിനായി ഇത് തിരഞ്ഞെടുക്കുമ്പോഴോ മാത്രമാണ് ഇത് ഹോം സ്ക്രീൻ.\n\n“തിരഞ്ഞെടുക്കുക” ഫോക്കസ് ചെയ്ത ബോക്സ് അടയാളപ്പെടുത്തും, ആരോ ബട്ടണുകൾ ബോക്സുകൾക്കിടയിൽ നീങ്ങും; ടച്ചിൽ ബോക്സിൽ ടാപ്പ് ചെയ്യുക. പേജ് ബട്ടണുകൾ ടെസ്റ്റ് പേജുകൾ മാറ്റും. വീണ്ടും തുടങ്ങാൻ “തിരഞ്ഞെടുക്കുക” അല്ലെങ്കിൽ സ്ക്രീനിൽ വിരൽ അമർത്തിപ്പിടിക്കുക.\n\nഉപകരണ പരിശോധന (PaperPaw ഫേംവെയറായ ഉപകരണങ്ങളിൽ ടൂളുകളിൽ) ഓരോ ഭാഗവും ഓരോ പേജായി പരിശോധിക്കും: സ്ക്രീൻ, ബട്ടണുകൾ, ടച്ച്, ഫ്രണ്ട് ലൈറ്റ്, ബാറ്ററി, കാർഡ്, ക്ലോക്ക്, Wi-Fi, സ്ലീപ്പ്, മെമ്മറി. ഓരോ പേജിലും പരാജയം, ഒഴിവാക്കുക, വിജയം എന്നിവയുണ്ട്; അളവുകൾ സൂചിപ്പിക്കുന്നത് മുൻകൂട്ടി തിരഞ്ഞെടുത്തിരിക്കും; ഇല്ലാത്ത ഭാഗങ്ങൾ ഒഴിവാക്കും. ഓരോ ഉത്തരത്തിനും ശേഷം pull request-ൽ ഒട്ടിക്കാനായി .paperpaw/plugins/diagnostics/device-check.txt-ൽ റിപ്പോർട്ട് എഴുതും. “മടങ്ങുക” പുറത്തുകടക്കും; വീണ്ടും തുറന്നാൽ നിർത്തിയിടത്ത് തുടരും. ബട്ടണുകൾ മാത്രമുള്ള ഉപകരണത്തിൽ ആദ്യം ബട്ടൺ പേജിൽ “ആരംഭിക്കുക” തിരഞ്ഞെടുക്കുക; അതുവരെ ആരോകളും “തിരഞ്ഞെടുക്കുക”, “മടങ്ങുക” എന്നിവയും എല്ലാ പേജിലെയും പോലെ പ്രവർത്തിക്കും."
