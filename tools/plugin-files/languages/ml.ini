update.plugin.name = അപ്ഡേറ്റ്
update.plugin.description = കാർഡിൽ നിന്നോ ഇന്റർനെറ്റിൽ നിന്ന് ഡൗൺലോഡ് ചെയ്തോ ഫേംവെയർ അപ്ഡേറ്റുകൾ ഇൻസ്റ്റാൾ ചെയ്യുന്നു.
update.plugin.how = "PaperPaw തന്നെ ഫേംവെയറായ ഉപകരണങ്ങളിൽ (ഉദാ. X4) ക്രമീകരണത്തിലെ “അപ്ഡേറ്റ്” പുതിയ ഫേംവെയർ ഇൻസ്റ്റാൾ ചെയ്യുന്നു.\n\n“ഓൺലൈനിൽ തിരയുക” പുതിയ PaperPaw അപ്ഡേറ്റ് സെർവറിൽ നിന്ന് ഡൗൺലോഡ് ചെയ്യുന്നു (Wi-Fi വഴി കുറച്ച് മിനിറ്റ്). അല്ലെങ്കിൽ paperpaw.org-ൽ നിന്നുള്ള .bin അപ്ഡേറ്റ് ഫയൽ കാർഡിലെ updates ഫോൾഡറിലേക്ക് പകർത്തുക. “ഇൻസ്റ്റാൾ ചെയ്യുക” ഏകദേശം ഒരു മിനിറ്റ് എടുക്കും, തുടർന്ന് ഉപകരണം റീസ്റ്റാർട്ട് ചെയ്യും; പുസ്തകങ്ങളും ക്രമീകരണങ്ങളും വായനാസ്ഥാനങ്ങളും നിലനിൽക്കും.\n\n“അപ്ഡേറ്റുകൾക്കായി നോക്കുക” ഓണാണെങ്കിൽ (തുടക്കത്തിൽ ഓഫ്), Wi-Fi ഓണായിരിക്കുമ്പോഴോ ചാർജ് ചെയ്യുമ്പോഴോ ഉപകരണം ആഴ്ചയിൽ ഏകദേശം ഒരിക്കൽ സ്വയം ചോദിക്കും; കണ്ടെത്തിയ അപ്ഡേറ്റ് ഇവിടെ കാത്തിരിക്കും, വായന തടസ്സപ്പെടില്ല. തിരയൽ ഉപകരണത്തിലെ പതിപ്പ് അയയ്ക്കുന്നു, പേരോ നമ്പറോ ഇല്ല; എണ്ണാനായി, നിങ്ങൾ ചോദിച്ചതാണോ, ദിവസത്തിലെ/ആഴ്ചയിലെ/മാസത്തിലെ ആദ്യ തിരയലാണോ എന്നും.\n\nനിങ്ങളുടെ പ്ലഗിനുകൾക്ക് പുതിയ റിലീസിനുള്ള പതിപ്പ് ഇല്ലെങ്കിൽ അപ്ഡേറ്റ് കാത്തിരിക്കും. പഴയ പതിപ്പ് നിങ്ങൾ തിരഞ്ഞെടുത്താൽ മാത്രം.\n\nCrossPoint പോലുള്ള മറ്റൊരു ഫേംവെയറും ഇവിടെ നിന്ന് ഇൻസ്റ്റാൾ ചെയ്യാം: അതിന്റെ .bin ഫയൽ updates ഫോൾഡറിൽ ഇട്ട് “അപ്ഡേറ്റ്” തുറക്കുക. ഇത് ഈ ഉപകരണത്തിനുള്ള കേടില്ലാത്ത പൂർണ്ണ ഫേംവെയറാണോ എന്ന് PaperPaw പരിശോധിക്കും, പക്ഷേ ഒപ്പില്ലാത്തതിനാൽ ആര് നിർമ്മിച്ചു എന്ന് അറിയില്ല. “എന്തായാലും ഇൻസ്റ്റാൾ ചെയ്യുക” അത് ഫ്ലാഷിന്റെ മറുപകുതിയിൽ എഴുതി തുടങ്ങുന്നു; ആ ഫേംവെയർ അതിന് മുകളിൽ എന്തെങ്കിലും ഇൻസ്റ്റാൾ ചെയ്യുന്നത് വരെ PaperPaw തന്റെ പകുതിയിൽ തുടരും. തിരികെ വരാൻ, മറ്റേ ഫേംവെയറിന്റെ മെനുവിൽ നിന്ന് (ഉദാ. CrossPoint-ന്റെ SD firmware update) paperpaw-<device>-<version>-install.bin ഇൻസ്റ്റാൾ ചെയ്യുക."
