profiles.plugin.description = വായനയുടെയും ഡിസ്പ്ലേയുടെയും ക്രമീകരണങ്ങളുടെ പേരുള്ള സെറ്റുകൾ, ഒരു ടാപ്പിൽ മാറ്റാം.
profiles.plugin.how = "ഒരു പ്രൊഫൈൽ നിങ്ങളുടെ വായനാ ക്രമീകരണങ്ങളും ഡിസ്പ്ലേ ക്രമീകരണങ്ങളും സ്റ്റാറ്റസ് ലൈനുകളും “രാത്രി”, “വലിയ അക്ഷരം” പോലുള്ള ഒരു പേരിൽ സൂക്ഷിക്കുകയും ഒരു ടാപ്പിൽ തിരികെ കൊണ്ടുവരികയും ചെയ്യുന്നു.\n\nവായനാ മെനുവിലെ “കൂടുതൽ” എന്നതിലോ ക്രമീകരണത്തിലെ “ഇഷ്ടാനുസൃതമാക്കുക” എന്നതിലോ “പ്രൊഫൈലുകൾ” തുറക്കുക. ഉപയോഗിക്കാൻ ഒരു പ്രൊഫൈൽ ടാപ്പ് ചെയ്യുക; ഉപയോഗത്തിലുള്ളത് അടയാളപ്പെടുത്തിയിരിക്കും. നിലവിലെ ക്രമീകരണങ്ങൾ അതിൽ സംരക്ഷിക്കാനോ പേരുമാറ്റാനോ നീക്കം ചെയ്യാനോ അത് അമർത്തിപ്പിടിക്കുക (ബട്ടണുകളിൽ “തിരഞ്ഞെടുക്കുക” അമർത്തിപ്പിടിക്കുക). “പുതിയ പ്രൊഫൈലായി സംരക്ഷിക്കുക” ഇപ്പോഴത്തെ ക്രമീകരണം സൂക്ഷിക്കുന്നു.\n\n“അടുത്ത പ്രൊഫൈൽ” ലിസ്റ്റിലെ അടുത്തതിലേക്ക് മാറുന്നു; അത് ഒരു ബട്ടണിലോ നിയമത്തിലോ വയ്ക്കുക."
