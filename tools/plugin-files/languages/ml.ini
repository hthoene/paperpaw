transfer.plugin.name = ട്രാൻസ്ഫർ
transfer.plugin.description = ഒരേ നെറ്റ്വർക്കിലെ ബ്രൗസറിൽ നിന്ന് പുസ്തകങ്ങളും മറ്റ് ഫയലുകളും ഉപകരണത്തിലേക്ക് ഇടുക.
transfer.plugin.how = "Wi-Fi ട്രാൻസ്ഫർ ഒരേ നെറ്റ്വർക്കിലെ ബ്രൗസറിൽ നിന്ന്, കേബിളോ ആപ്പോ ഇല്ലാതെ, പുസ്തകങ്ങളും മറ്റ് ഫയലുകളും ഉപകരണത്തിലേക്ക് ഇടുന്നു. ഫയലുകൾ എടുക്കാനും ഫോൾഡറുകൾ ഉണ്ടാക്കാനും ഇല്ലാതാക്കാനും കഴിയും.\n\nടൂളുകളിൽ നിന്ന് തുറക്കുക. സ്ക്രീനിൽ ഒരു വിലാസം ടെക്സ്റ്റായും QR കോഡായും കാണാം: ഫോണിലോ കമ്പ്യൂട്ടറിലോ ബ്രൗസറിൽ അത് തുറക്കുക, അല്ലെങ്കിൽ കോഡ് സ്കാൻ ചെയ്യുക. വിലാസത്തിൽ ഓരോ തവണയും പുതുതായി ഉണ്ടാക്കുന്ന ഒരു കീ ഉണ്ട്, അതിനാൽ നെറ്റ്വർക്കിലെ മറ്റുള്ളവർക്ക് നിങ്ങളുടെ ഫയലുകളിൽ എത്താനാവില്ല. സ്ക്രീൻ തുറന്നിരിക്കുന്നിടത്തോളം ട്രാൻസ്ഫർ പ്രവർത്തിക്കും.\n\nX4-ലെ പോലെ PaperPaw തന്നെ Wi-Fi നിയന്ത്രിക്കുന്നിടത്ത്, താഴെയുള്ള “റൂട്ടർ ഇല്ലാതെ” ഉപകരണത്തിന്റെ സ്വന്തം നെറ്റ്വർക്ക് തുറക്കുന്നു; ഒരു കോഡ് സ്കാൻ ചെയ്ത് ഫോൺ അതിൽ ചേരും."
