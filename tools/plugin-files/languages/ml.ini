setup.plugin.name = സജ്ജീകരണം
setup.plugin.description = ആദ്യ തുടക്കത്തിൽ, പ്രധാന ക്രമീകരണങ്ങളിലൂടെ ഒരു ചെറിയ ഗൈഡ്.
setup.plugin.how = "PaperPaw ആദ്യമായി തുടങ്ങുമ്പോൾ ഒരിക്കൽ മാത്രം കാണിക്കുന്ന, പ്രധാന ക്രമീകരണങ്ങളിലൂടെയുള്ള ഒരു ചെറിയ ഗൈഡാണ് സജ്ജീകരണം. ഓരോ പേജും ഒരു കാര്യം ചോദിക്കുന്നു: ഭാഷ, ബട്ടണുകൾ, ടെക്സ്റ്റ് വലുപ്പം, സമയ മേഖല, Wi-Fi, അല്ലെങ്കിൽ ചേർക്കാനുള്ള ഏതാനും പ്ലഗിനുകൾ. ഉചിതമായ ഉത്തരം മുൻകൂട്ടി തിരഞ്ഞെടുത്തിട്ടുണ്ട്, അതിനാൽ “അടുത്തത്” എപ്പോഴും ശരിയാണ്. ഈ ഉപകരണത്തിന് ആവശ്യമില്ലാത്ത ഘട്ടങ്ങൾ ഒഴിവാക്കും.\n\nബട്ടണുകളിൽ ടാപ്പ് ചെയ്യുക, അല്ലെങ്കിൽ മുകളിലേക്ക്/താഴേക്ക് ബട്ടണുകളും “തിരഞ്ഞെടുക്കുക”-യും ഉപയോഗിക്കുക. ആദ്യ പേജിലെ “ഒഴിവാക്കുക” സജ്ജീകരണം ഉടൻ അവസാനിപ്പിക്കും. നിങ്ങളുടെ പുസ്തകങ്ങൾ എവിടെ നിന്ന് വരുന്നുവെന്ന് അവസാന പേജ് പറയും.\n\nവീണ്ടും പ്രവർത്തിപ്പിക്കാൻ ക്രമീകരണം തുറന്ന് “PaperPaw സജ്ജീകരിക്കുക” തിരഞ്ഞെടുക്കുക. ഇവിടെ തിരഞ്ഞെടുത്തതെല്ലാം പിന്നീട് ക്രമീകരണത്തിൽ മാറ്റാം."
