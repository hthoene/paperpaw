anki.help = കമ്പ്യൂട്ടറിലെ Anki-യുടെ കാർഡുകൾ പഠിക്കുക: സമന്വയം ബാക്കിയുള്ള കാർഡുകൾ എടുക്കുകയും നിങ്ങളുടെ ഉത്തരങ്ങൾ തിരികെ അയയ്ക്കുകയും ചെയ്യും. അവിടെ AnkiConnect ആഡ്-ഓണോടെ Anki തുറന്നിരിക്കണം; “ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു” കാണുക.
