settings.plugin.name = ക്രമീകരണം
settings.plugin.description = എല്ലാ പ്ലഗിനുകളുടെയും ക്രമീകരണങ്ങളിൽ നിന്ന് തയ്യാറാക്കിയ ക്രമീകരണ പേജുകൾ.
settings.plugin.how = "PaperPaw-ലും അതിന്റെ പ്ലഗിനുകളിലും ക്രമീകരിക്കാവുന്നതെല്ലാം “ക്രമീകരണം” പേജുകളായി കാണിക്കുന്നു. പ്ലഗിനുകൾക്ക് സ്വന്തം സ്ക്രീൻ വേണ്ട: അവ നൽകുന്ന ക്രമീകരണങ്ങൾ ഇവിടെ ഗ്രൂപ്പുകളായി, ഓരോന്നിനും താഴെ അതിന്റെ വിവരണത്തോടെ കാണാം.\n\nമെനുവിലെ “ക്രമീകരണം” വഴി ഇത് തുറക്കുക. ഒരു ഗ്രൂപ്പ് തുറക്കാൻ അതിൽ ടാപ്പ് ചെയ്യുക, പിന്നെ ഒരു ക്രമീകരണം മാറ്റാനോ തിരഞ്ഞെടുക്കാനോ അതിൽ ടാപ്പ് ചെയ്യുക; സംഖ്യകൾക്ക് −, + ബട്ടണുകളുണ്ട്. ബട്ടണുകളിൽ, ഒരു ക്രമീകരണത്തിലേക്ക് നീങ്ങി “തിരഞ്ഞെടുക്കുക” അമർത്തുക: ഇടതും വലതും സംഖ്യ മാറ്റും, “തിരഞ്ഞെടുക്കുക” അത് നിലനിർത്തും, “മടങ്ങുക” പഴയ മൂല്യം തിരികെ കൊണ്ടുവരും.\n\nമാറ്റങ്ങൾ ഉടൻ ബാധകമാകും. “തിരയുക” വാക്കുകൾ വഴി ഒരു ക്രമീകരണം കണ്ടെത്തും, “വിപുലമായ ക്രമീകരണം” അപൂർവമായി വേണ്ടവയും കാണിക്കും. “ഡിഫോൾട്ടിലേക്ക് റീസെറ്റ് ചെയ്യുക”, “എല്ലാം റീസെറ്റ് ചെയ്യുക” എന്നിവ ആദ്യം ചോദിക്കും."
