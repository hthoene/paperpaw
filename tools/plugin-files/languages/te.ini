reader.plugin.name = రీడర్
reader.plugin.description = పుస్తకాలను పేజీ పేజీగా చూపుతుంది, విషయ సూచిక, చదివే సెట్టింగులతో.
reader.plugin.how = "రీడర్ పుస్తకాలను పేజీ పేజీగా చూపుతుంది. లైబ్రరీ నుండి పుస్తకాన్ని తెరవండి; ప్రారంభంలో చివరి పుస్తకం మళ్లీ తెరుచుకోవచ్చు (సెట్టింగ్: ప్రారంభంలో చివరి పుస్తకాన్ని తెరువు).\n\nపేజీలు తిప్పడానికి స్క్రీన్ ఎడమ లేదా కుడి భాగాన్ని నొక్కండి, లేదా పేజీ బటన్లను వాడండి. చదివే మెనూ కోసం మధ్యలో నొక్కండి లేదా ఎంచుకో నొక్కండి: విషయ సూచిక, వెతుకు, పేజీకి వెళ్లు, ఫాంట్, లేఅవుట్, బుక్ మార్కులు, హైలైట్లు మొదలైనవి. పై అంచు నుండి కిందికి లాగితే త్వరిత ప్యానెల్, కింది అంచు నుండి పైకి లాగితే హోమ్; వెనుకకు నొక్కి పట్టుకున్నా హోమ్.\n\nచిత్రాన్ని పూర్తి స్క్రీన్లో చూడటానికి ఎంచుకో (లేదా చిత్రాన్ని) నొక్కి పట్టుకోండి: ఎడమ, కుడి పేజీలోని చిత్రాల మధ్య కదులుతాయి. ఎంచుకో 2x, 3x జూమ్ చేసి తిరిగి వస్తుంది (టచ్లో రెండుసార్లు నొక్కండి); జూమ్లో ఎడమ, కుడి పక్కకు, పేజీ బటన్లు (లేదా స్వైప్లు) ముందుకు కదిలిస్తాయి. వెనుకకు సరిపెట్టిన చిత్రానికి, తర్వాత పేజీకి తీసుకెళ్తుంది (టచ్లో బయటకు రావడానికి నొక్కి పట్టుకోండి). బుక్ మార్క్ కోసం పై కుడి మూలను నొక్కండి. హైలైట్ చేయడానికి పదాన్ని నొక్కి పట్టుకోండి. బటన్లతో ఎడమను నొక్కి పట్టుకోండి: ఎడమ, కుడి పదం పదంగా, పేజీ బటన్లు పంక్తి పంక్తిగా కదులుతాయి, వాటిని నొక్కి పట్టుకుంటే పేజీ చివరలకు, పేరా పేరాగా; ఎంచుకో పదానికి హైలైట్ పట్టీని తెరుస్తుంది, ఎంచుకోను నొక్కి పట్టుకుంటే వాక్యానికి, పేరాకు విస్తరిస్తుంది (అప్పుడు ఎడమ, కుడి చివరను, నొక్కి పట్టుకుంటే మొదలును కదిలిస్తాయి). ఎంపిక పేజీ తిప్పినా కొనసాగుతుంది. Markdownగా ఎగుమతి మీ గమనికలను సేవ్ చేస్తుంది."
