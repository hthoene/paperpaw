aids.plugin.name = చదివే సహాయకాలు
aids.plugin.description = బోల్డ్ పద ప్రారంభాలు, మార్చిన పదాలు, చిత్రాలు: మీకు నచ్చినట్లుగా టెక్స్ట్.
aids.plugin.how = "చదివే సహాయకాలు మీరు చదువుతున్నప్పుడు పుస్తకం టెక్స్ట్ ఎలా కనిపిస్తుందో మారుస్తాయి. అవి ప్రతి పుస్తకానికీ వర్తిస్తాయి. బోల్డ్ పద ప్రారంభాలు, పదాలను మార్చు మొదట ఆఫ్లో ఉంటాయి.\n\nఇవి సెట్టింగులు › చదవడం › చదివే సహాయకాలు విభాగంలో ఉంటాయి. బోల్డ్ పద ప్రారంభాలు ప్రతి పదం మొదటి సగాన్ని బోల్డ్లో చూపిస్తుంది, ఇది కొందరికి అనుసరించడానికి సులభం. పదాలను మార్చు “colour = color; Mr. = Mister” లాగా సెమీకోలన్లతో వేరు చేసిన జంటలను తీసుకుంటుంది.\n\nమీరు రాసినట్లుగానే పూర్తి పదాలు మాత్రమే మారతాయి, కాబట్టి “color” పొడవైన పదంలో భాగాన్ని ఎప్పుడూ మార్చదు. పుస్తకం ఫైల్ మారదు.\n\nపుస్తకాలలోని చిత్రాలను చూపించవచ్చు (మొదట ఇలాగే), చిత్ర వివరణను ఉపయోగించే “[చిత్రం: సముద్రంలో ఓడ]” వంటి చిన్న పంక్తిగా మార్చవచ్చు, లేదా వదిలివేయవచ్చు. అప్పుడు పేజీలో టెక్స్ట్కు ఎక్కువ స్థలం ఉంటుంది, చూపని చిత్రం డీకోడ్ కాదు, కాబట్టి పేజీలు వేగంగా తిరుగుతాయి. కామిక్స్, చిత్రాలతో తయారైన ఇతర పుస్తకాలు మారవు."
