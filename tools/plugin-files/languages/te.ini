store.plugin.name = ప్లగిన్ స్టోర్
store.plugin.description = ఈ పరికరం కోసం ప్లగిన్లను కనుగొంటుంది, ఇన్స్టాల్, అప్డేట్ చేస్తుంది, తీసివేస్తుంది.
store.plugin.how = "ప్లగిన్ స్టోర్ ఈ పరికరం కోసం ప్లగిన్లను ఇంటర్నెట్లో కనుగొని ఇన్స్టాల్, అప్డేట్ చేస్తుంది, తీసివేస్తుంది. సాధనాల నుండి తెరవండి; Wi-Fi అవసరం.\n\nప్రారంభంలో సిఫార్సులు, కొత్తవి, ఇప్పుడు ప్రజాదరణ పొందినవి, తర్వాత సమూహాలు ఉంటాయి. సమూహంలో ప్లగిన్లు రోజూ మారే న్యాయమైన కలగలుపులో ఉంటాయి; A నుండి Z, కొత్తవి లేదా ఇటీవలి అప్డేట్ ప్రకారం క్రమపరచండి. ప్లగిన్ను తెరిస్తే దాని పరిమాణం, మెమరీ కనిపిస్తాయి; ఇన్స్టాల్, అప్డేట్ లేదా తీసివేయి ఎంచుకోండి. అన్నీ అప్డేట్ చేయి అన్నింటినీ తాజాగా చేస్తుంది.\n\nకోడ్ ప్లగిన్లకు పరికరంపై పూర్తి యాక్సెస్ ఉంటుంది: స్టోర్ ముందుగా అడుగుతుంది, అవి రీస్టార్ట్ తర్వాత మొదలవుతాయి. ఏదైనా విఫలమైతే PaperPaw కోడ్ ప్లగిన్లు లేకుండా మొదలై అది ఏదో చెబుతుంది. జాబితా ఎక్కడి నుండి వస్తుందో ప్లగిన్ లైబ్రరీ నిర్ణయిస్తుంది.\n\nసెట్టింగులు, సిస్టమ్లోని కమ్యూనిటీ ప్లగిన్లు GitHubలో ఇతరులు ప్రచురించినవి కూడా చూపుతుంది. వాటిని ఎవరూ సమీక్షించలేదు; కోడ్ ప్లగిన్ పేజీ దాని సంతకం కీని చూపుతుంది, వేరే కీతో సంతకం చేసిన అప్డేట్ ఇన్స్టాల్ కాదు.\n\nమూలాలు (ప్రారంభంలో చివరి వరుస) ఇతరుల ప్లగిన్ జాబితాలను చిరునామాతో (https://…/plugins.json) జోడిస్తుంది, PaperPaw జాబితాకు బదులు ఒకదాన్ని చూపుతుంది లేదా తీసివేస్తుంది. లేదా ఒక్కో పంక్తిలో ఒక చిరునామాతో sources.txt ఫైల్ను కార్డులోని .paperpaw/plugins/storeలో పెట్టండి. PaperPaw మూలాలను తనిఖీ చేయదు. పరికరం మొదటి జాబితా కీని గుర్తుంచుకుని, తర్వాత ఆ కీతో సంతకం చేసినవే తీసుకుంటుంది. ప్లగిన్కు అప్డేట్లు అది వచ్చిన మూలం నుండే వస్తాయి. PaperPaw సొంత లైబ్రరీని తీసివేయలేరు; స్టోర్ వదిలితే అదే మళ్లీ వస్తుంది."
