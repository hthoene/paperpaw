widgets.plugin.how = "విడ్జెట్ ప్యాక్ హోమ్ స్క్రీన్కు చాలా విడ్జెట్లను జోడిస్తుంది: గడియారాలు (అనలాగ్, పదాలు, టైల్స్, ప్రపంచ), క్యాలెండర్, ఈ ఏడాది ఇప్పటివరకు, కౌంట్డౌన్, చంద్రుని దశ, రోజు మరియు తేదీ; ఈ రోజు సూక్తి, గమనికలు, చేయవలసినవి, చిత్రాలు, శుభాకాంక్ష, PaperPaw లోగో; పుస్తకాల కోసం ఇప్పుడు చదువుతున్నది, పురోగతి, తర్వాత చదవాల్సినది, సిరీస్, ఇష్టమైనవి, ఒక హైలైట్, సంఖ్యలలో లైబ్రరీ. బ్యాటరీ విడ్జెట్ కూడా ఉంది.\n\nమెనూలో హోమ్ స్క్రీన్ను సవరించు (లేదా హోమ్ స్క్రీన్పై ఎక్కువసేపు నొక్కండి), తర్వాత విడ్జెట్ జోడించుతో వాటిని జోడించండి. ఒక్కోదానికి ఫ్రేమ్, పరిమాణం, అమరిక వంటి సొంత సెట్టింగులు ఉంటాయి. ఈ రోజు సూక్తి వంటి మారే విడ్జెట్ను ఎంచుకుంటే తర్వాతిది చూపుతుంది. మీ సొంత సూక్తులు కార్డులోని .paperpaw/plugins/widgets లో quotes.txtలోకి వెళ్తాయి, ప్రతి పంక్తి టెక్స్ట్ | రచయిత రూపంలో. సమయ విడ్జెట్లకు గడియారం సెట్ అయి ఉండాలి; Wi-Fi దాన్ని సెట్ చేస్తుంది."
widgets.time.unknown = సమయం ఇంకా తెలియదు. Wi-Fi గడియారాన్ని సెట్ చేస్తుంది.
