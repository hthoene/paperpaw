mail.plugin.name = మెయిల్
mail.plugin.description = పాస్వర్డ్ లేదా యాప్ పాస్వర్డ్తో ఈమెయిల్ చదువుతుంది, పంపుతుంది (IMAP, SMTP), బ్రౌజర్ లాగిన్ లేకుండా.
mail.plugin.how = "మెయిల్ IMAP, SMTP ద్వారా ఈమెయిల్ చదువుతుంది, పంపుతుంది. బ్రౌజర్ లాగిన్ లేకుండా మీ చిరునామా, పాస్వర్డ్తో సైన్ ఇన్ చేస్తుంది, కాబట్టి దాన్ని అనుమతించే ఏ ప్రొవైడర్తోనైనా పని చేస్తుంది.\n\n“సెట్టింగులు” › “మెయిల్”లో ఖాతాను సెటప్ చేయండి: ప్రొవైడర్ను ఎంచుకుని, చిరునామా, పాస్వర్డ్ టైప్ చేయండి. చాలా ప్రొవైడర్లకు యాప్ పాస్వర్డ్ కావాలి: మీ ఖాతా భద్రతా సెట్టింగులలో దాన్ని తయారు చేసి ఇక్కడ వాడండి. పాస్వర్డ్ మీ ప్రొవైడర్ సర్వర్కు తప్ప ఎక్కడికీ వెళ్లదు, పాస్వర్డ్లు, కీలతో పాటు ఉంచబడుతుంది.\n\nసాధనాలలో మెయిల్ను తెరవండి. “మెయిల్ కోసం తనిఖీ చేయి” తాజా మెయిల్లను, ఫోల్డర్లను తెస్తుంది. మెయిల్లు కార్డులో ఉంటాయి, నెట్వర్క్ లేకుండా చదవవచ్చు. Wi-Fi కొద్దిసేపు మాత్రమే ఆన్లో ఉంటుంది.\n\nమీ ప్రొవైడర్ జాబితాలో లేకపోతే “సొంత సర్వర్లు” ఎంచుకుని, అధునాతన సెట్టింగులలో సర్వర్ పేర్లు, పోర్టులు, భద్రతను సెట్ చేయండి. ఏ అధికారిక సంస్థా హామీ ఇవ్వని సర్టిఫికెట్ ఉన్న సర్వర్ను నమ్మాలా అని ఒకసారి అడుగుతుంది; ఫింగర్ప్రింట్ను మీ ప్రొవైడర్ చూపేదానితో పోల్చండి.\n\nపుస్తకం జతచేసిన మెయిల్ (EPUB, PDF వంటివి, 2 MB వరకు) కింద “పుస్తకం తెరువు” ఉంటుంది: అది ఫైల్ను తెచ్చి, లైబ్రరీలో ఉంచి, తెరుస్తుంది.\n\nనేపథ్య తనిఖీ: “సెట్టింగులు” › “మెయిల్”లో “నేపథ్యంలో కొత్త మెయిల్ కోసం తనిఖీ చేయి” ఆన్ చేసి, ఎంత తరచుగానో (15, 30 లేదా 60 నిమిషాలు) ఎంచుకోండి. రీడర్ మేల్కొని ఆన్లైన్లో ఉన్నప్పుడు సురక్షిత కనెక్షన్తో అప్పుడప్పుడు కనెక్ట్ అయి, హోమ్లో చదవని సంఖ్యను అప్డేట్ చేస్తుంది; కొంత బ్యాటరీ వాడుతుంది.\n\nహోమ్ స్క్రీన్ విడ్జెట్లు చదవనివి, తాజావి, నక్షత్రం ఉన్న మెయిల్లు, ఒక మెయిల్బాక్స్, మెయిల్ రాయడానికి షార్ట్కట్ చూపుతాయి."
