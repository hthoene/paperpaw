power.plugin.name = పవర్
power.plugin.description = పవర్ మోడ్ను మీరే లేదా బ్యాటరీ ప్రకారం ఎంచుకుంటుంది: సాధారణం, ఆదా, ఆఫ్లైన్.
power.plugin.how = "PaperPaw బ్యాటరీని ఎలా వాడాలో పవర్ ఎంచుకుంటుంది: సాధారణం, ఆదా లేదా ఆఫ్లైన్. ఆదా వేచి ఉండగలిగే పనులను మెరుగైన సమయాల్లో చేస్తుంది; ఆఫ్లైన్ రేడియోను ఆఫ్లో ఉంచుతుంది. ఆటో బ్యాటరీ ప్రకారం ఎంచుకుంటుంది.\n\nమోడ్ను త్వరిత ప్యానెల్లో (అక్కడ పవర్ మోడ్లను పక్కపక్కనే చూపుతుంది) లేదా సెట్టింగులలో పవర్ కింద మార్చండి. అక్కడే ఆటో ఏ స్థాయిలలో ఆదాకు, ఆఫ్లైన్కు మారుతుందో, ఛార్జింగ్లో సాధారణంగానే ఉండాలా అనేది కూడా సెట్ చేస్తారు.\n\nస్థితి పట్టీలలో, పవర్ మోడ్ ఆదాలో ఒక ఆకును, ఆఫ్లైన్లో కొట్టివేసిన Wi-Fiని చూపుతుంది, సాధారణంలో ఏమీ చూపదు.\n\nచిన్న మెనూ కోసం పవర్ బటన్ను నొక్కి పట్టుకోండి: నిద్ర, ఆఫ్ చేయి (PaperPaw చేయగలిగిన చోట), రీస్టార్ట్, టచ్ పరికరాలలో టచ్ లాక్ చేయి లేదా టచ్ అన్లాక్ చేయి. చిన్నగా నొక్కితే పరికరం ఇప్పటికీ నిద్రలోకి వెళ్తుంది. వెనుకకు మెనూ నుండి బయటకు వస్తుంది."
