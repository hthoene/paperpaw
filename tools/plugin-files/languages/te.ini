reading-goal.plugin.name = చదువు లక్ష్యం
reading-goal.plugin.description = రోజుకు చదవాల్సిన నిమిషాలు, హోమ్ స్క్రీన్పై ఈరోజు చదువును బట్టి మూడ్ మారే పిల్లి.
reading-goal.plugin.how = "మీ హోమ్ స్క్రీన్పై ఒక పిల్లి ఈరోజు చదువు ఎలా సాగుతోందో చూపుతుంది: ఇంకా చదవకపోతే విచారంగా, కొంచెం చదివాక పర్వాలేదు అన్నట్లు, రోజువారీ లక్ష్యంలో సగం నుండి తృప్తిగా, లక్ష్యం చేరగానే సంతోషంగా.\n\nహోమ్ స్క్రీన్కు చదువు పిల్లి విడ్జెట్ను జోడించండి (హోమ్ స్క్రీన్ను నొక్కి పట్టుకుని, విడ్జెట్ను జోడించండి), లేదా నిద్ర స్క్రీన్గా ఈరోజు చదువు పిల్లిని ఎంచుకోండి. పిల్లిని నొక్కితే రోజువారీ లక్ష్యం తెరుచుకుంటుంది; అది మీరు చదివిన నిమిషాలను లెక్కించే చదువు గణాంకాల లక్ష్యమే.\n\nసెట్టింగులలో, చదవడం కింద, తృప్తి ఇక్కడ నుండి, సంతోషం ఇక్కడ నుండి అనేవి లక్ష్యంలో ఎంత భాగం నుండి పిల్లి తృప్తిగా లేదా సంతోషంగా ఉంటుందో నిర్ణయిస్తాయి; సొంత చిత్రాలు పిల్లుల బదులు చూపే చిత్రాల ఫోల్డర్ను (sad, meh, content, happy) నిర్ణయిస్తుంది. చిత్రాలు PNG లేదా JPEG ఫైళ్లు; ఫోల్డర్ లేకపోతే పిల్లులు కనిపిస్తాయి."
