picture-home.plugin.name = చిత్ర హోమ్ స్క్రీన్
picture-home.plugin.description = విడ్జెట్ల వెనుక మీ సొంత చిత్రంతో హోమ్ స్క్రీన్, మీరు కాన్ఫిగర్ చేసే స్థితి పట్టీతో.
picture-home.plugin.how = "చిత్ర హోమ్ స్క్రీన్ ఆన్లో ఉన్నంతసేపు హోమ్ స్క్రీన్ను భర్తీ చేస్తుంది: విడ్జెట్ల వెనుక మీ చిత్రం, మీరు అమర్చే విడ్జెట్లు, సాధనాల పేజీలు. ప్లగిన్ మేనేజర్లో దీన్ని ఆఫ్ చేస్తే అంతర్నిర్మిత హోమ్ స్క్రీన్ దాని పేజీలతో తిరిగి వస్తుంది.\n\nకార్డులో ఒక ఫోల్డర్లో (డిఫాల్ట్గా wallpapers) చిత్రాలు (JPEG, PNG, GIF) పెట్టి, సెట్టింగులు, అనుకూలీకరించు, చిత్ర హోమ్ స్క్రీన్లో ఒకదాన్ని ఎంచుకోండి. అమరిక స్క్రీన్ను ఎలా నింపాలో, స్థానం ఏ భాగం ఉండాలో, జూమ్ ఎంత పెద్దగా, చిత్రాన్ని లేత చేయి ఎంత పాలిపోవాలో చెబుతాయి: లేత చిత్రంపై విడ్జెట్లు బాగా చదవబడతాయి. ప్రతి స్క్రీన్ పరిమాణానికి చిత్రం ఒకసారి సిద్ధం చేయబడుతుంది.\n\nవిడ్జెట్లు చిత్రంపై పలకలపై ఉంటాయి. పేజీని అంతర్నిర్మిత హోమ్ స్క్రీన్లో లాగే అమర్చండి: పేజీ కింది పెన్సిల్, లేదా మెనూలో హోమ్ స్క్రీన్ సవరించు.\n\nస్థితి పట్టీ (సమయం, Wi-Fi, బ్యాటరీ లేదా మీరు ఎంచుకున్నవి) ఆన్, ఆఫ్ లేదా ఆటోమేటిక్; పైన లేదా కింద; పూర్తి వెడల్పు లేదా ఎడమ, మధ్య, కుడివైపు చిన్న గుళిక; లేత, ముదురు, బూడిద పలకపై లేదా చిత్రంపైనే ఉండవచ్చు. బటన్ల పేర్ల వరుస (X4లో) కూడా ఆన్, ఆఫ్ లేదా ఆటోమేటిక్. ఆటోమేటిక్ అంటే బటన్ నొక్కితే అవి కొన్ని సెకన్లు కనిపిస్తాయి; ఆ నొక్కుడు ఇంకేమీ చేయదు.\n\nచిత్ర రెండరింగ్: బూడిద స్థాయిలు (X4లో నెమ్మది), డిథర్ (నలుపు-తెలుపు చుక్కలు, వేగం), లేదా ఆటోమేటిక్: స్క్రీన్ గీసినప్పుడు బూడిద స్థాయిలు, మొదటి మార్పు తర్వాత చుక్కలు. బూడిద స్థాయిలు లేని స్క్రీన్పై చుక్కలు వాడబడతాయి."
