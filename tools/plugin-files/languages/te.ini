anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = మీ కంప్యూటర్లోని Anki గడువు కార్డులను AnkiConnect యాడ్-ఆన్ ద్వారా అధ్యయనం చేసి, మీ సమాధానాలను తిరిగి పంపుతుంది.
anki.plugin.how = "Anki మీ కంప్యూటర్లోని Ankiలో గడువు వచ్చిన కార్డులను రీడర్పై అధ్యయనం చేయనిచ్చి, సమాధానాలను తిరిగి పంపుతుంది. ఉచిత యాడ్-ఆన్ AnkiConnect (కోడ్ 2055492159) ఉపయోగిస్తుంది, AnkiWeb కాదు. మొదట ఆఫ్: ప్లగిన్ స్టోర్ నుండి జోడించండి.\n\nకంప్యూటర్లో: Ankiలో AnkiConnect ఇన్స్టాల్ చేసి (Tools, Add-ons, Get Add-ons) Ankiని రీస్టార్ట్ చేయండి. సింక్ సమయంలో Anki తెరిచి ఉండాలి.\n\nడిఫాల్ట్గా AnkiConnect తన కంప్యూటర్కే (127.0.0.1) జవాబిస్తుంది. Tools, Add-ons, AnkiConnect, Configలో \"webBindAddress\"ను \"0.0.0.0\"గా సెట్ చేయండి (హోమ్ నెట్వర్క్లో వింటుంది). మీరు మార్చకపోతే పోర్ట్ \"webBindPort\" 8765. అక్కడ \"apiKey\" సెట్ చేస్తే, అదే కీని ఇక్కడ నమోదు చేయండి. ఆ తర్వాత Ankiని రీస్టార్ట్ చేసి, ఫైర్వాల్ అడిగితే అనుమతించండి. నమ్మకమైన నెట్వర్క్లోనే వాడండి: అందులోని ఎవరైనా AnkiConnectను చేరుకోగలరు, కాబట్టి కీ పెట్టడం మంచిది.\n\nరీడర్లో: సాధనాల నుండి Anki తెరిచి, “కంప్యూటర్”లో కంప్యూటర్ చిరునామా (ఉదా. 192.168.1.20), పోర్ట్ 8765 కాకపోతే అది, API కీ సెట్ చేసి ఉంటే అది నమోదు చేయండి. “డెక్” ఎంచుకోండి, లేదా అన్ని డెక్ల కోసం ఖాళీగా వదలండి. Wi-Fi ఆన్తో “Ankiతో సింక్ చేయి” ఎంచుకోండి: ముందుగా సమాధానాలు పంపబడతాయి, తర్వాత గడువు కార్డులు (మీరు సెట్ చేసిన కొత్త కార్డులతో) గరిష్ఠంగా 50 తేబడతాయి. నెట్వర్క్ లేకుండా “అధ్యయనం చేయి” ఎంచుకోండి: సమాధానం చూపించి మళ్లీ, కష్టం, బాగుంది లేదా సులభం అని రేట్ చేయండి. Wi-Fi లేకపోయినా సమాధానాలు రీడర్లో ఉంచబడి తదుపరి సింక్తో Ankiకి వెళ్తాయి. కార్డు ఎప్పుడు తిరిగి రావాలో Anki నిర్ణయిస్తుంది: మళ్లీ అని జవాబిచ్చిన కార్డు గడువు వచ్చినప్పుడు తర్వాతి సింక్ మళ్లీ తెస్తుంది.\n\nసెట్టింగులలో “Anki తెరిచినప్పుడు సింక్” ఆన్ చేస్తే స్క్రీన్ తెరిచిన ప్రతిసారీ సింక్ అవుతుంది. కీ నొక్కితే నెట్వర్క్ వాడబడదు."
