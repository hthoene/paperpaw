joplin.no-network = Joplinకు పంపడానికి నెట్వర్క్ అవసరం. గమనికలు వేచి ఉండి తర్వాత పంపబడతాయి.
joplin.setup-needed = ముందుగా Joplinను సెటప్ చేయండి: అది ఎక్కడికి సింక్ అవుతుంది, మీ ఖాతా, పాస్వర్డ్.
joplin.no-time = సమయం ఇంకా తెలియదు. గమనికలు వేచి ఉండి తర్వాత పంపబడతాయి.
joplin.unreachable = Joplinను చేరుకోలేకపోయాము. గమనికలు వేచి ఉండి తర్వాత పంపబడతాయి.
joplin.failed = Joplin లోపంతో స్పందించింది ({status}). గమనికలు వేచి ఉండి తర్వాత పంపబడతాయి.
joplin.bad-login = Joplin ఈమెయిల్, వినియోగదారు పేరు లేదా పాస్వర్డ్ను అంగీకరించలేదు. Joplin సెటప్లో వాటిని తనిఖీ చేయండి.
joplin.no-server = ఈ చిరునామాలో Joplin Server లేదు. Joplin సెటప్లో దాన్ని తనిఖీ చేయండి.
joplin.bad-address = ఈ చిరునామాను PaperPaw వాడలేదు. Joplin సెటప్లో దాన్ని తనిఖీ చేయండి.
joplin.no-data = ఈ చిరునామాలో Joplin నోట్లు లేవు. దాన్ని తనిఖీ చేయండి, లేదా ముందుగా Joplinను దానితో సింక్ చేయండి.
joplin.encrypted = Joplin ఎండ్-టు-ఎండ్ ఎన్క్రిప్షన్ ఆన్లో ఉంది. PaperPaw గమనికలను ఎన్క్రిప్ట్ చేయలేదు, కాబట్టి ఏదీ పంపదు.
joplin.newer-target = అక్కడ Joplin గమనికలను ఈ PaperPawకు తెలిసిన దానికంటే కొత్త ఫార్మాట్లో ఉంచుతుంది. వాటిని పంపడానికి PaperPawను అప్డేట్ చేయండి.
joplin.older-target = అక్కడ Joplin గమనికలను పాత ఫార్మాట్లో ఉంచుతుంది. దాన్ని అప్గ్రేడ్ చేయడానికి Joplinను తెరిచి, మళ్లీ పంపండి.
joplin.upgrading = Joplin ప్రస్తుతం అక్కడి గమనికలను అప్గ్రేడ్ చేస్తోంది. అవి వేచి ఉండి తర్వాత పంపబడతాయి.
joplin.no-memory = గమనికలను పంపడానికి తగినంత మెమరీ లేదు. రీస్టార్ట్ చేసి మళ్లీ ప్రయత్నించండి.
keyboard.plugin.name = కీబోర్డ్
keyboard.plugin.description = స్క్రీన్పై టెక్స్ట్ను టచ్తో లేదా బటన్లతో నమోదు చేస్తుంది.
keyboard.plugin.how = "టెక్స్ట్ అవసరమైనప్పుడల్లా కీబోర్డ్ తెరుచుకుంటుంది: వెతకడం, పాస్వర్డ్, గమనిక లేదా సెట్టింగ్. ఇది టచ్తో, బటన్లతో మాత్రమే కూడా పని చేస్తుంది.\n\nబటన్లతో: ఎడమ, కుడి వరుసలో కదులుతాయి (వరుస చుట్టూ తిరుగుతాయి), పేజీ బటన్లు వరుసల మధ్య, పైకి, కిందికి మీ నిలువు వరుసలోనే కదులుతాయి; “ఎంచుకో” కీని నొక్కుతుంది, “వెనుకకు” రద్దు చేస్తుంది. Shift తర్వాతి అక్షరాన్ని క్యాపిటల్ చేస్తుంది; రెండుసార్లు నొక్కితే అన్నీ క్యాపిటల్స్, మరోసారి నొక్కితే ఆగుతుంది. అక్షరాన్ని నొక్కి పట్టుకుంటే (బటన్లతో: దానిపై “ఎంచుకో” పట్టుకోండి) దాని క్యాపిటల్ వెంటనే ఎంచుకోబడుతుంది, é, è వంటి యాక్సెంట్లు కూడా వస్తాయి; జర్మన్లో ä, ö, ü, ß అలాగే a, o, u, s నుండి వస్తాయి. OK ముగిస్తుంది; బటన్లతో ఎక్కడినుండైనా ముగించడానికి “వెనుకకు” నొక్కి పట్టుకోండి (“వెనుకకు” ఒక్కటే రద్దు చేస్తుంది), లేదా అక్షరం కాని కీపై “ఎంచుకో” పట్టుకోండి. Paste క్లిప్బోర్డ్ టెక్స్ట్ను చేరుస్తుంది; “ఫోన్” ఉన్నచోట మీ ఫోన్లో టైప్ చేయవచ్చు.\n\nసెట్టింగులలో “పరికరం” › “కీబోర్డ్”: “కీబోర్డ్ లేఅవుట్లు” లేఅవుట్లను ఎంచుకుంటుంది (ప్రామాణికంగా మెనూ భాష; చాలా ఉంటే ఒక కీ వాటి మధ్య మారుస్తుంది). “ఉమ్లాట్ కీలు” ä, ö, ü, ß కోసం సొంత కీలు ఇస్తుంది. “పరిమాణం” కీలను, అక్షరాలను పెద్దవి చేస్తుంది; బటన్లతో మాత్రమే అయితే వరుసలు కంప్యూటర్ కీబోర్డ్ వరుసలుగానే ఉంటాయి. టచ్ స్క్రీన్లపై “కీ ఆకారం” కీల రూపాన్ని మారుస్తుంది. “ఆటోమేటిక్ క్యాపిటల్స్” ప్రతి వాక్యాన్ని క్యాపిటల్తో మొదలుపెడుతుంది."
