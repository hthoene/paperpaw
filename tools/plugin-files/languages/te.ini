plugin-manager.code.other-build = PaperPaw యొక్క వేరే ప్లగిన్ ఇంటర్ఫేస్ కోసం తయారైంది: దీని కోసం బిల్డ్ వచ్చే వరకు వేచి ఉంటుంది.
plugin-manager.code.damaged = దీని కోడ్ దెబ్బతింది: దీన్ని మళ్లీ ఇన్స్టాల్ చేయండి.
plugin-manager.code.mismatch = దీని కోడ్ వేరే ప్లగిన్ది: దీన్ని మళ్లీ ఇన్స్టాల్ చేయండి.
plugin-manager.code.no-room = దీని కోడ్కు స్థలం లేదు. కోడ్ ఉన్న మరో ప్లగిన్ను ఆఫ్ చేయండి.
plugin-manager.code.no-room-flash = దీని కోడ్కు స్థలం లేదు. కోడ్ ఉన్న మరో ప్లగిన్ను ఆఫ్ చేయండి, లేదా వెబ్ ఫ్లాషర్తో (paperpaw.org) పూర్తి లేఅవుట్ను ఫ్లాష్ చేయండి: చాలా రెట్లు ఎక్కువ స్థలం.
plugin-manager.code.unsupported = ఈ పరికరం కోడ్ ఉన్న ప్లగిన్లను అమలు చేయదు.
plugin-manager.code.safe-mode = ఈ ప్రారంభంలో లోడ్ కాలేదు (సురక్షిత మోడ్): రీస్టార్ట్ తర్వాత లోడ్ అవుతుంది.
plugin-manager.code.safe-mode-off = సురక్షిత మోడ్ ఆఫ్ చేసింది: కోడ్ ఉన్న ప్లగిన్లను ఒక్కొక్కటిగా మళ్లీ ఆన్ చేయండి.
plugin-manager.code.not-installed = స్టోర్ నుండి లేదా వెబ్ ఫ్లాషర్ నుండి ఇన్స్టాల్ చేయలేదు: దీని కోడ్ అమలు కాదు. అక్కడి నుండి ఇన్స్టాల్ చేయండి.
plugin-manager.code.unsigned = సంతకం లేదు: తనిఖీ లేకుండా నడుస్తుంది.
plugin-manager.code.changed = ఇన్స్టాల్ చేసిన తర్వాత దీని కోడ్ మార్చబడింది: ఇది అమలు కాదు. మళ్లీ ఇన్స్టాల్ చేయండి.
plugin-manager.code.older = పాత PaperPaw కోసం తయారైంది: స్టోర్లో దీన్ని అప్డేట్ చేయండి.
plugin-manager.code.needs-newer = దీనికి కొత్త PaperPaw అవసరం: PaperPawను అప్డేట్ చేయండి, అప్పుడు ఇది అమలవుతుంది.
plugin-manager.code.revoked = అమలు చేయలేదు: దాని రచయిత సంతకం చేసిన కీ దొంగిలించబడి రద్దు చేయబడింది. దీన్ని తీసివేయండి; స్టోర్లో రచయిత నుండి ఇది మళ్లీ రావచ్చు.
