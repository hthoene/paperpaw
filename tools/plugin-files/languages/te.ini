wifi.plugin.name = Wi-Fi
wifi.plugin.description = అవసరమైనప్పుడు Wi-Fi నెట్వర్క్లకు కనెక్ట్ అవుతుంది, తర్వాత రేడియోను ఆఫ్ చేస్తుంది.
wifi.plugin.how = "ఏదైనా ప్లగిన్కు ఇంటర్నెట్ అవసరమైనప్పుడు (కేటలాగ్, సింక్, స్టోర్, బదిలీ) Wi-Fi నెట్వర్క్కు కనెక్ట్ అవుతుంది. బ్యాటరీ, మెమరీ ఆదా చేయడానికి, ఏదీ ఉపయోగించని ఒక నిమిషం తర్వాత, లేదా హోమ్ లేదా పుస్తకం కనిపించగానే, రేడియోను మళ్లీ ఆఫ్ చేస్తుంది.\n\nసెట్టింగుల నుండి, లేదా స్థితి పట్టీలోని Wi-Fi అంశం నుండి Wi-Fiని తెరవండి. నెట్వర్క్లు అందుబాటులో ఉన్నవాటిని చూపుతుంది; ఒకదాన్ని ఎంచుకుని దాని పాస్వర్డ్ టైప్ చేయండి, లేదా ఫోన్తో సెటప్ చేయి ఎంచుకుని పేరు, పాస్వర్డ్ను పరికరంలో కాకుండా మీ ఫోన్ బ్రౌజర్లో టైప్ చేయండి. మర్చిపో సేవ్ చేసిన నెట్వర్క్ను తీసివేస్తుంది.\n\nపాస్వర్డ్లు కార్డులో సురక్షితంగా ఉంటాయి, మళ్లీ ఎప్పుడూ చూపబడవు. అవసరమైనప్పుడు కనెక్ట్ చేయి కింద, చివరి ఉపయోగం తర్వాత Wi-Fi ఎంతసేపు ఆన్లో ఉండాలి, ఛార్జింగ్ సమయంలో ఆన్లో ఉండాలా, అనేకం అందుబాటులో ఉన్నప్పుడు ఏ సేవ్ చేసిన నెట్వర్క్ ముందు రావాలి అనేవి సెట్ చేస్తారు."
