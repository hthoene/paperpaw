pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = పని, విరామ రౌండ్లతో ఫోకస్ టైమర్, విడ్జెట్లు, రోజువారీ లెక్కతో.
pomodoro.plugin.how = "Pomodoro టైమర్: ఏకాగ్రతతో రౌండ్లలో పని చేసి, తర్వాత విశ్రాంతి తీసుకోండి. సెటప్ అవసరం లేదు: 25 నిమిషాలు ఫోకస్, 5 విశ్రాంతి, నాలుగు రౌండ్ల తర్వాత 15 నిమిషాల పెద్ద విరామం.\n\nసాధనాల మెనూ నుండి Pomodoro తెరిచి ప్రారంభించు నొక్కండి, లేదా దాని విడ్జెట్లను హోమ్ స్క్రీన్కు జోడించండి (హోమ్ స్క్రీన్ను నొక్కి పట్టుకుని, విడ్జెట్ జోడించండి): Pomodoro టైమర్ దశను, మిగిలిన నిమిషాలను చూపుతుంది, Pomodoro ప్రారంభం/పాజ్ ఒక బటన్, Pomodoro ఈ రోజు మీరు పూర్తి చేసిన రౌండ్లను మీ రోజువారీ లక్ష్యంతో లెక్కిస్తుంది. టైమర్ను నొక్కితే ప్రారంభం లేదా పాజ్; పూర్తి స్క్రీన్ కోసం నొక్కి పట్టుకోండి.\n\nమీరు స్క్రీన్ నుండి వెళ్లినా టైమర్ నడుస్తుంది, రీస్టార్ట్ తర్వాత గడియారం ప్రకారం కొనసాగుతుంది. రీడర్ నిద్రలో ఉన్నప్పుడు ఏదీ నడవదు: ఈలోగా ముగిసిన దశ మేల్కొన్నప్పుడు చెప్పబడుతుంది. దశ ముగిసినప్పుడు ఒక సందేశం చెబుతుంది. బ్యాటరీ ఆదా కోసం గడియారం నిమిషానికి ఒకసారి అప్డేట్ అవుతుంది (పూర్తి స్క్రీన్పై చివరి నిమిషంలో ప్రతి పది సెకన్లకు), రీడర్ను ఎప్పుడూ మేల్కొని ఉంచదు.\n\nసెట్టింగులలో Pomodoro కింద వ్యవధులను, ఒక సెట్లోని రౌండ్లను, తర్వాతి దశ దానంతట అదే మొదలవ్వాలా అనేదాన్ని సెట్ చేస్తారు. మరిన్ని కింద: దశ ముగిసినప్పుడు స్క్రీన్ ఫ్లాష్ లేదా ఫ్రంట్ లైట్ మెరుపు, రోజువారీ లక్ష్యం."
