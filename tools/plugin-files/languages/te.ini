about.plugin.name = గురించి
about.plugin.description = PaperPaw వెర్షన్, లైసెన్సులు.
about.plugin.how = "“గురించి” మీ వద్ద ఉన్న PaperPaw వెర్షన్, దాని సోర్స్ కోడ్ ఎక్కడ ఉందో, అది ఏ లైసెన్సుల కింద వస్తుందో చూపిస్తుంది.\n\nఇది సెట్టింగుల చివర “PaperPaw గురించి”గా ఉంటుంది. బాణం బటన్లు, ఎంచుకోతో ఒక వరుసను ఎంచుకోండి, లేదా దాన్ని నొక్కండి. ఫర్మ్వేర్లో అంతర్నిర్మిత ప్లగిన్లు, కోడ్ ఉన్న ప్లగిన్లను లోడ్ చేసే పరికరాలలో అలాంటి ప్లగిన్లు దేని కోసం బిల్డ్ చేయబడాలో ఆ ఫింగర్ ప్రింట్ కూడా జాబితాలో ఉంటాయి.\n\nలైసెన్సులు రీడర్లో టెక్స్ట్గా తెరుచుకుంటాయి, కాబట్టి పుస్తకంలా పేజీలు తిప్పండి. అందులో PaperPaw సొంత లైసెన్స్, దానితో వచ్చే ఫాంట్లు, ఐకాన్లు, పద విభజన నమూనాల లైసెన్సులు ఉంటాయి. ప్లగిన్లు థీమ్ రచయిత వంటి తమ సొంత పంక్తిని జోడించగలవు."
