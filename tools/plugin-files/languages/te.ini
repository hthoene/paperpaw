launcher-simple.plugin.name = సరళ హోమ్
launcher-simple.plugin.description = ప్రశాంతమైన ప్రారంభ స్క్రీన్: పెద్ద గడియారం, కార్డులు, ఒక డాక్, గుండ్రని స్విచ్ల త్వరిత ప్యానెల్.
launcher-simple.plugin.how = "“సరళ హోమ్” ముఖ్యమైనవి మాత్రమే కావాల్సిన వారికి ప్రశాంతమైన ప్రారంభ స్క్రీన్: పెద్ద గడియారం, మీరు చదువుతున్న పుస్తకం, లైబ్రరీ, స్టోర్ పెద్ద కార్డులుగా, కింద మూడు చిహ్నాల డాక్. సెటప్ అవసరం లేదు.\n\nదీన్ని సెట్టింగులలో హోమ్ స్క్రీన్ కింద ఎంచుకోండి. దీని త్వరిత ప్యానెల్లో (దాన్ని కూడా సెట్టింగులలో ప్యానెల్గా ఎంచుకోండి) పెద్ద గుండ్రని స్విచ్లు, పరికరంలో ఫ్రంట్ లైట్ ఉంటే దాని పట్టీ, టెక్స్ట్ పరిమాణం పట్టీ ఉంటాయి. బటన్లతో: బాణం బటన్లు ఫోకస్ను కదిలిస్తాయి, “ఎంచుకో” ఆ భాగం చెప్పేది చేస్తుంది; పట్టీపై పదో వంతు పెంచుతుంది, చివరి నుండి మళ్లీ మొదటికి వెళ్తుంది. టచ్తో: ఒక భాగాన్ని నొక్కండి, లేదా పట్టీపై కావలసిన చోట నొక్కండి.\n\nలైబ్రరీ మీ పుస్తకాలను కార్డులుగా చూపుతుంది, చివరగా తెరిచినది ముందు, ఒకసారి ఒక పేజీ; పుస్తకం సాధారణ రీడర్లో తెరుచుకుంటుంది.\n\nసెట్టింగులలో “సరళ హోమ్” కింద దీన్ని మీకు నచ్చినట్లు మార్చుకోండి: ప్రధాన మెనూ లాగే సవరించే మూడు జాబితాలు. “కార్డులు”: హోమ్ ఏ కార్డులను ఏ క్రమంలో చూపుతుంది. “డాక్”: డాక్లో ఏ చిహ్నాలు, ఏ ప్లగిన్ ఏ చర్య అయినా. “త్వరిత ప్యానెల్”: ఏ స్విచ్లు, పట్టీలు. స్క్రీన్లో చోటు లేని కార్డు చివరి నుండి వదిలివేయబడుతుంది. తేదీ, బ్యాటరీ కనిపించాలో కూడా “సరళ హోమ్” కిందే ఎంచుకుంటారు."
