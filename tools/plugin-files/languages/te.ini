smart-home.problem.outside = ఆ సర్వర్ మీ ఇంటి నెట్వర్క్లో లేదు. సెట్టింగులలో దాన్ని అనుమతించి, https ఉపయోగించండి.
smart-home.problem.insecure = http ఇంటి నెట్వర్క్లో మాత్రమే ఉపయోగించబడుతుంది. ఆ సర్వర్ కోసం https చిరునామా ఉపయోగించండి.
smart-home.problem.no-network = Wi-Fi నెట్వర్క్ లేదు. మీ ఇంటి నెట్వర్క్కు కనెక్ట్ అయి మళ్లీ ప్రయత్నించండి.
smart-home.problem.offline = పరికరం ఆఫ్లైన్ మోడ్లో ఉంది, కాబట్టి ఆన్లైన్కు వెళ్లదు.
smart-home.problem.off = స్మార్ట్ హోమ్ అనుమతులలో దానికి నెట్వర్క్ ఆఫ్ చేయబడింది.
smart-home.problem.unreachable = సర్వర్ స్పందించలేదు. చిరునామాను, మీ ఇంటి నెట్వర్క్ అందుబాటులో ఉందో లేదో తనిఖీ చేయండి.
smart-home.problem.not-found = సర్వర్కు అది తెలియదు. చిరునామాను తనిఖీ చేయండి.
smart-home.problem.tls = సురక్షిత కనెక్షన్ విఫలమైంది. httpsకు పరికరం విశ్వసించే సర్టిఫికెట్ అవసరం; ఇంటి నెట్వర్క్లో http ఉపయోగించండి.
smart-home.problem.denied = సర్వర్ టోకెన్ను అంగీకరించలేదు. కొత్త దీర్ఘకాలిక యాక్సెస్ టోకెన్ తయారు చేసి కనెక్షన్ కింద జోడించండి.
