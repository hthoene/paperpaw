smart-home.plugin.name = స్మార్ట్ హోమ్
smart-home.plugin.description = మీ సొంత Home Assistant నుండి విలువలు, స్విచ్లు డాష్బోర్డ్పై, హోమ్ స్క్రీన్ విడ్జెట్లుగా. మీ ఇంటి నెట్వర్క్లోని Home Assistantతో పనిచేస్తుంది.
smart-home.plugin.how = "స్మార్ట్ హోమ్ మీ సొంత Home Assistant నుండి విలువలు, స్విచ్లను చూపుతుంది: ఉష్ణోగ్రత, తేమ, విద్యుత్, తలుపులు, కిటికీలు, లైట్లు, స్విచ్లు, సీన్లు. ఇది మీ ఇంటి నెట్వర్క్లో REST API ద్వారా సర్వర్తో మాట్లాడుతుంది; వేరే సేవ ద్వారా ఏదీ వెళ్లదు.\n\nసాధనాల మెనూ నుండి స్మార్ట్ హోమ్, తర్వాత కనెక్షన్ తెరవండి: Home Assistant చిరునామా (ఉదా. http://homeassistant.local:8123), దీర్ఘకాలిక యాక్సెస్ టోకెన్ (Home Assistant ప్రొఫైల్ పేజీ కింద తయారు చేయండి) నమోదు చేయండి. టోకెన్ పాస్వర్డ్లు, కీలలో ఉంటుంది, సెట్టింగుల ఫైల్లో కాదు. http ఇంటి నెట్వర్క్ చిరునామాలకు మాత్రమే; బయటి సర్వర్ కోసం సెట్టింగులలో “ఇంటి నెట్వర్క్ బయటి సర్వర్లు” ఆన్ చేసి, సరైన సర్టిఫికెట్తో https ఉపయోగించండి.\n\nఎంటిటీలను ఎంచుకో మీ సర్వర్లో ఉన్నవాటి జాబితాను తెరుస్తుంది: పేరు లేదా id ద్వారా వెతికి, చూపడానికి ఎంటిటీని ఎంచుకోండి (మళ్లీ ఎంచుకుంటే తీసివేస్తుంది). దానికి ఒక గది ఇవ్వవచ్చు (డాష్బోర్డ్లో, గది విడ్జెట్లలో సమూహంగా). గరిష్ఠంగా 24 ఎంటిటీలు. డాష్బోర్డ్లో లైట్, స్విచ్ లేదా సీన్ను ఎంచుకుంటే అది మారుతుంది; ఎంచుకున్న సెన్సార్ మళ్లీ చదవబడుతుంది.\n\nవిడ్జెట్లు (హోమ్ స్క్రీన్ను నొక్కి పట్టుకుని, విడ్జెట్ను జోడించండి): విలువ ఒక రీడింగ్ను పెద్దగా, సమూహం ఒక గది ఎంటిటీలను, స్విచ్ ఒక లైట్ లేదా స్విచ్కు బటన్, గది ఒక గది రీడింగులు, స్విచ్లతో కార్డు.\n\nడాష్బోర్డ్ తెరిచినప్పుడు, మీరు అడిగినప్పుడు (ఇప్పుడే రిఫ్రెష్ చేయి లేదా విడ్జెట్ను నొక్కడం), Wi-Fi ఇప్పటికే ఉన్నప్పుడు పరికరం మేల్కొంటే, ఛార్జర్ పెట్టినప్పుడు మీరు సెట్ చేసిన సమయానుసారం ఇల్లు చదవబడుతుంది. ఇది రేడియోను దానంతట అదే ఎప్పుడూ ఆన్ చేయదు, ఆన్లో ఉంచదు."
