vocabulary.sd.mirror = {deck}: ఫైల్లో లేని కార్డులు
vocabulary.sd.mirror.on = తీసివేయి
vocabulary.sd.mirror.off = ఉంచు
vocabulary.sd.mirror.help = తీసివేయి: {file} నుండి తొలగించిన కార్డు తర్వాతి అప్డేట్లో దాని పురోగతితో శాశ్వతంగా తీసివేయబడుతుంది. ఉంచు: అది ఉంటుంది.
vocabulary.sd.saving = {file} సేవ్ అవుతోంది
vocabulary.sd.saved.one = {count} కార్డు {file}లో సేవ్ చేయబడింది.
vocabulary.sd.saved.other = {count} కార్డులు {file}లో సేవ్ చేయబడ్డాయి.
vocabulary.sd.saved.unlinked = {file}లో సేవ్ చేయబడింది, కానీ డెక్కు లింక్ను రాయడం సాధ్యం కాలేదు: తర్వాతి అప్డేట్ ఫైల్ను మళ్లీ చదువుతుంది.
vocabulary.sd.save.backup = అక్కడ ఉన్న పాత ఫైల్ {file}గా ఉంచబడింది.
vocabulary.sd.save.no-deck = ఈ డెక్ ఇప్పుడు లేదు.
vocabulary.sd.save.unreadable = లింక్ చేసిన ఫైళ్ల జాబితాను చదవడం సాధ్యం కాలేదు, కాబట్టి ఏదీ రాయబడలేదు. కార్డును తనిఖీ చేసి మళ్లీ ప్రయత్నించండి.
vocabulary.sd.save.full = కార్డు నిండిపోయింది, కాబట్టి ఏదీ రాయబడలేదు. కొంత స్థలం ఖాళీ చేసి మళ్లీ ప్రయత్నించండి.
vocabulary.sd.save.too-large = ఈ డెక్ ఒక ఫైల్కు చాలా పెద్దది (4 MiB, అప్డేట్ చదివే గరిష్ఠం). కార్డులోని ఫైల్ మారలేదు.
vocabulary.sd.save.failed = ఫైల్ను రాయడం సాధ్యం కాలేదు. కార్డులోని ఫైల్ మారలేదు. కార్డును తనిఖీ చేసి మళ్లీ ప్రయత్నించండి.
vocabulary.sd.save.not-updated = సేవ్ కాలేదు: కార్డులోని ఫైల్ను ముందుగా చదవడం సాధ్యం కాలేదు, దానిలో డెక్లో ఇంకా లేని మార్పులు ఉండవచ్చు. ఫైల్ను సరిచేసి మళ్లీ ప్రయత్నించండి.
vocabulary.sd.save.left-out = సేవ్ కాలేదు: ఫైల్లోని కొన్ని పంక్తులను చదవడం సాధ్యం కాలేదు, సేవ్ చేస్తే అవి పోతాయి. ఫైల్ను సరిచేసి, అప్డేట్ చేసి, మళ్లీ ప్రయత్నించండి.
vocabulary.sd.save.anki = {file} Anki ఫైల్: అది చదవబడుతుంది మాత్రమే, ఎప్పుడూ రాయబడదు.
vocabulary.sd.save.anki-refused = సేవ్ కాలేదు: {file} Anki డెక్, PaperPaw దాన్ని చదువుతుంది మాత్రమే. దాన్ని అప్డేట్ చేయడానికి Anki నుండి డెక్ను మళ్లీ ఎగుమతి చేయండి.
vocabulary.sd.removal-held = ఏ కార్డూ తీసివేయబడలేదు: కొన్ని పంక్తులను చదవడం సాధ్యం కాలేదు.
vocabulary.sd.skipped.one = {count} పంక్తి వదిలేయబడింది
vocabulary.sd.skipped.other = {count} పంక్తులు వదిలేయబడ్డాయి
vocabulary.sd.skipped-notes.one = {count} నోట్ వదిలేయబడింది: అది చాలా పొడవైనది (ఉదాహరణకు, దానిలో చిత్రం ఉంది)
vocabulary.sd.skipped-notes.other = {count} నోట్లు వదిలేయబడ్డాయి: అవి చాలా పొడవైనవి (ఉదాహరణకు, వాటిలో చిత్రం ఉంది)
vocabulary.sd.no-room = {count} పంక్తులు సరిపోలేదు: ఒక డెక్లో 20,000 కార్డులు ఉంటాయి.
vocabulary.sd.outcome.same = గత అప్డేట్ నుండి మారలేదు.
vocabulary.sd.outcome.unreadable = ఈ ఫైల్ను చదవడం సాధ్యం కాలేదు. కార్డును తనిఖీ చేసి మళ్లీ ప్రయత్నించండి.
vocabulary.sd.outcome.too-many = ఇప్పటికే 50 డెక్లు ఉన్నాయి, కాబట్టి ఈ ఫైల్ చదవబడలేదు. ముందుగా ఒక డెక్ను తొలగించండి.
vocabulary.sd.outcome.crowded = చాలా కార్డులకు ఒకే ముందు వైపు ఉంది, కాబట్టి ఈ ఫైల్ చదవబడలేదు. ముందు వైపులు వేర్వేరుగా ఉండేలా చేయండి.
vocabulary.sd.outcome.no-cards = కార్డులు ఏవీ దొరకలేదు. కార్డు అంటే ముందు టెక్స్ట్ ఉన్న పంక్తి; ముందు వైపు మొదటి నిలువు వరుస.
vocabulary.sd.outcome.too-large = ఈ ఫైల్ చాలా పెద్దది: గరిష్ఠంగా 4 MiB, 20,000 పంక్తులు. దాన్ని అనేక ఫైళ్లుగా విభజించండి.
vocabulary.sd.outcome.utf16 = ఈ ఫైల్ UTF-16గా సేవ్ చేయబడింది. దాన్ని మళ్లీ CSV UTF-8గా సేవ్ చేయండి (స్ప్రెడ్షీట్లో: CSV UTF-8).
vocabulary.sd.outcome.no-notes = నోట్లు ఏవీ దొరకలేదు: ఇది Anki డెక్ కాదు, లేదా దానిలో నోట్లు లేవు. Anki నుండి దాన్ని Anki డెక్ ప్యాకేజీ (.apkg)గా ఎగుమతి చేయండి.
vocabulary.sd.outcome.newer-anki = ఈ డెక్ కొత్త Anki ఫార్మాట్లో ఉంది. “Support older Anki versions” ఎంచుకుని మళ్లీ ఎగుమతి చేయండి.
vocabulary.sd.outcome.deck-too-large = ఈ Anki డెక్ ఇక్కడ చదవడానికి చాలా పెద్దది: గరిష్ఠంగా 4,000 ఫైళ్లు, 4 MiB నోట్లు, 20,000 నోట్లు. మీడియా, షెడ్యూలింగ్ లేకుండా ఎగుమతి చేయండి, లేదా విభజించండి.
vocabulary.sd.line = పంక్తి {line}
vocabulary.sd.fault.no-front = ముందు నిలువు వరుసలో టెక్స్ట్ లేదు. పదాన్ని అక్కడ పెట్టండి.
vocabulary.sd.fault.not-utf8 = UTF-8 టెక్స్ట్ కాదు. ఫైల్ను UTF-8గా సేవ్ చేయండి (స్ప్రెడ్షీట్లో: CSV UTF-8).
vocabulary.sd.fault.too-long = 8 KiB కంటే పొడవు. కార్డును చిన్నదిగా చేయండి.
vocabulary.sd.fault.open-quote = కొటేషన్ గుర్తు తెరిచి మూయలేదు. దాన్ని మూయండి లేదా తీసివేయండి.
vocabulary.setting.sd-auto = తెరిచినప్పుడు కార్డు నుండి డెక్లను అప్డేట్ చేయి
vocabulary.setting.sd-auto.help = ఫోల్డర్లో కొత్తవి లేదా మారిన ఫైళ్లను ఫ్లాష్ కార్డులు చదువుతాయి.
vocabulary.setting.sd-folder = డెక్ ఫైళ్ల ఫోల్డర్
vocabulary.setting.sd-folder.help = SD కార్డులో: దానిలోని CSV, TSV లేదా Anki ఫైల్ ఒక డెక్.
vocabulary.sd.readme = "ఫైళ్ల నుండి ఫ్లాష్ కార్డులు\n\nప్రతి డెక్కు ఇక్కడ ఒక ఫైల్ పెట్టండి: Spanish.tsv నుండి Spanish డెక్ వస్తుంది.\nఫైళ్లు: UTF-8గా సేవ్ చేసిన .tsv, .csv లేదా .txt, లేదా .apkg: “Support older Anki versions”తో ఎగుమతి చేసిన Anki డెక్. దాని నోట్ల మొదటి మూడు ఫీల్డ్లు ముందు, వెనుక, ఉదాహరణ అవుతాయి; షెడ్యూలింగ్, మీడియా చదవబడవు, PaperPaw Anki ఫైల్ను ఎప్పుడూ రాయదు.\n\nప్రతి పంక్తిలో ఒక కార్డు: ముందు, వెనుక, ఉదాహరణ (ఐచ్ఛికం), ట్యాబ్, కామా లేదా సెమికోలన్తో వేరు చేసి. మొదటి పంక్తిలో నిలువు వరుసల పేర్లు ఉండవచ్చు: front, back, example. ఉదాహరణ:\n\nKatze\tcat\tDie Katze schläft.\n\nతర్వాత రీడర్లో ఫ్లాష్ కార్డులు › SD కార్డులోని కార్డులు › డెక్లను అప్డేట్ చేయి ఎంచుకోండి.\n\nతెలుసుకోవలసినవి:\n- డెక్లు మీ పురోగతితో రీడర్లోనే ఉంటాయి; కొత్త లేదా మారిన ఫైల్ కార్డులు డెక్కు జోడించబడతాయి లేదా అక్కడ మారతాయి.\n- వెనుక వైపు లేదా ఉదాహరణ మారిస్తే కార్డు మారుతుంది, పురోగతి ఉంటుంది.\n- ముందు టెక్స్ట్ మారిస్తే అది కొత్త కార్డు, పాతది మళ్లీ మొదలవుతుంది (ఖాళీలు, పెద్ద అక్షరాలు లెక్కలోకి రావు). డెక్ను ఫైల్లో సేవ్ చేస్తే (SD కార్డులోని కార్డులు, కార్డులో సేవ్ చేయి) ప్రతి కార్డుకు id నిలువు వరుసలో సంఖ్య వస్తుంది: మొదటి రెండు పంక్తులను అలాగే ఉంచి ముందు వైపు మార్చినా పురోగతి ఉంటుంది.\n- సేవ్ చేయడం డెక్ కార్డులను రాస్తుంది. ఫైల్లో కార్డు కానిది (ముందు లేని పంక్తి) ఉండదు; పాత ఫైల్ _name.bak.tsvకు కాపీ అవుతుంది.\n- ఫైల్ను CSV UTF-8గా సేవ్ చేయండి (UTF-16 కాదు, స్ప్రెడ్షీట్ సొంత ఫార్మాట్ కాదు). 4 MiB లేదా 20,000 పంక్తులకు మించిన ఫైల్ను విభజించండి: అది చదవబడదు.\n- ఫైల్లో తొలగించిన పంక్తి డెక్లోని కార్డును తొలగించదు, ఆ డెక్కు “ఫైల్లో లేని కార్డులు”ను తీసివేయికి మారిస్తే తప్ప. అప్పుడు కార్డు పురోగతితో పోతుంది.\n- _తో మొదలయ్యే పేర్ల ఫైళ్లు చదవబడవు.\n"
wallabag.plugin.name = తర్వాత చదివే వ్యాసాలు (సొంత సర్వర్)
wallabag.plugin.description = wallabagలో సేవ్ చేసిన వ్యాసాలను పుస్తకాలుగా తెస్తుంది.
wallabag.title = తర్వాత చదివే వ్యాసాలు (సొంత సర్వర్)
wallabag.fetch = వ్యాసాలను తీసుకురా
wallabag.server = సర్వర్
wallabag.server.help = తర్వాత చదవడానికి Wallabagలో సేవ్ చేసిన వ్యాసాలు, “Wallabag” ఫోల్డర్లోకి పుస్తకాలుగా తెచ్చినవి.
wallabag.user = వినియోగదారు పేరు
wallabag.user.help = వ్యాసాలు వచ్చే Wallabag ఖాతా వినియోగదారు పేరు.
wallabag.password = పాస్వర్డ్
wallabag.client-id = క్లయింట్ ID
wallabag.client-id.help = Wallabagలో “API clients management” కింద చేసిన API క్లయింట్ ID.
wallabag.client-secret = క్లయింట్ రహస్యం
wallabag.secret.password = Wallabag పాస్వర్డ్
wallabag.secret.client = Wallabag క్లయింట్ రహస్యం
wallabag.help = Wallabagలో “API clients management” కింద API క్లయింట్ను చేసి, దాని ID, రహస్యాన్ని ఇక్కడ నమోదు చేయండి. చదవని వ్యాసాలు “Wallabag” ఫోల్డర్లోకి వస్తాయి; చివరి వరకు చదివినవి తర్వాతి సారి తెచ్చినప్పుడు ఆర్కైవ్ అవుతాయి.
wallabag.fetching = Wallabag నుండి వ్యాసాలను తెస్తోంది…
