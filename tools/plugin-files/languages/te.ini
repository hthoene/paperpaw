store.source.note = PaperPaw {name}ను గానీ దాని ప్లగిన్లను గానీ తనిఖీ చేయదు. దాని కోడ్ ప్లగిన్లకు ఈ పరికరం, దాని పుస్తకాలు, సెట్టింగులపై పూర్తి యాక్సెస్ ఉంటుంది. పరికరం ఆ మూలం సర్వర్ను సంప్రదిస్తుంది. దాన్ని నడిపేవారిని మీరు నమ్మితేనే జోడించండి.
store.source.added = {name} ఇప్పుడు ఒక మూలం. PaperPaw దాన్ని తనిఖీ చేయదు. దాని కీ {key}తో మొదలవుతుంది: ఇకపై ఈ కీతో సంతకం చేసిన జాబితాలు, ప్లగిన్లు మాత్రమే దాని నుండి అంగీకరించబడతాయి.
