diagnostics.plugin.description = టెస్ట్ స్క్రీన్, పరికరంలోని ప్రతి భాగానికి దశలవారీ తనిఖీ.
diagnostics.plugin.how = "డయాగ్నస్టిక్స్ అనేది పరికరాన్ని తనిఖీ చేసే టెస్ట్ స్క్రీన్: ప్యానెల్ చూపగల ప్రతి గ్రే స్థాయి, బటన్లు, టచ్ను ప్రయత్నించడానికి నాలుగు పెట్టెలు, రిఫ్రెష్ మోడ్లను పోల్చడానికి పురోగతి పట్టీతో పేజీ కౌంటర్ చూపుతుంది.\n\nటెస్ట్ స్క్రీన్కు మెనూలో ఎంట్రీ లేదు. వేరే ప్లగిన్ ఏదీ హోమ్ స్క్రీన్ ఇవ్వనప్పుడు, లేదా ప్లగిన్ మేనేజర్లో స్క్రీన్లు కింద హోమ్ స్క్రీన్ స్థానానికి దీన్ని ఎంచుకున్నప్పుడు మాత్రమే ఇది హోమ్ స్క్రీన్ అవుతుంది.\n\nఎంచుకో ఫోకస్లో ఉన్న పెట్టెను గుర్తిస్తుంది, బాణం బటన్లు పెట్టెల మధ్య కదులుతాయి; టచ్తో పెట్టెను నొక్కండి. పేజీ బటన్లు టెస్ట్ పేజీలను తిప్పుతాయి. మళ్లీ మొదలుపెట్టడానికి ఎంచుకోను నొక్కి పట్టుకోండి, లేదా స్క్రీన్పై వేలు ఉంచండి.\n\nపరికర తనిఖీ (PaperPaw పరికర ఫర్మ్వేర్ అయిన చోట సాధనాలు కింద) పరికరంలోని ప్రతి భాగాన్ని ఒక్కో పేజీలో చూస్తుంది: స్క్రీన్, బటన్లు, టచ్, ఫ్రంట్ లైట్, బ్యాటరీ, కార్డు, గడియారం, Wi-Fi, నిద్ర, మెమరీ. ప్రతి పేజీ చివర ఫెయిల్, దాటవేయి, పాస్ ఉంటాయి; కొలతలు సూచించే జవాబు ముందే ఎంచుకోబడి ఉంటుంది; పరికరంలో లేని భాగాలు దాటవేయబడతాయి. ప్రతి జవాబు తర్వాత పుల్ రిక్వెస్ట్లో అతికించడానికి .paperpaw/plugins/diagnostics/device-check.txtకు నివేదిక రాస్తుంది. వెనుకకు దీని నుండి బయటకు వెళ్తుంది, మళ్లీ తెరిస్తే ఆగిన చోట కొనసాగుతుంది. బటన్లు మాత్రమే ఉన్న పరికరంలో ముందుగా బటన్ల పేజీలో ప్రారంభించు ఎంచుకోండి; అప్పటివరకు బాణాలు, ఎంచుకో, వెనుకకు ప్రతి పేజీలో లాగే పని చేస్తాయి."
