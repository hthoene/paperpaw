core.usb-link.text = USB కేబుల్కు కనెక్ట్ అయిన కంప్యూటర్ బటన్లను నొక్కగలదు, స్క్రీన్ షాట్లు తీయగలదు, పుస్తకాలను, ప్లగిన్ ఫైళ్లను చదవగలదు, రాయగలదు. అది రహస్యాలను చదవలేదు, కోడ్ను ఇన్స్టాల్ చేయలేదు. పరికరం రీస్టార్ట్ అయినప్పుడు లేదా నిద్రలోకి వెళ్లినప్పుడు, కేబుల్ తీసినప్పుడు, లేదా మీరు ఇక్కడ ఆఫ్ చేసినప్పుడు ఇది ఆగిపోతుంది.
