setup.plugin.name = సెటప్
setup.plugin.description = మొదటిసారి ప్రారంభంలో ముఖ్యమైన సెట్టింగుల ద్వారా చిన్న మార్గదర్శి.
setup.plugin.how = "సెటప్ అనేది ముఖ్యమైన సెట్టింగుల ద్వారా ఒక చిన్న మార్గదర్శి, PaperPaw మొదటిసారి ప్రారంభమైనప్పుడు ఒకసారి చూపబడుతుంది. ప్రతి పేజీ భాష, బటన్లు, టెక్స్ట్ పరిమాణం, సమయ మండలం, Wi-Fi లేదా జోడించాల్సిన కొన్ని ప్లగిన్లు వంటి ఒక విషయం అడుగుతుంది; తగిన సమాధానం ముందే ఎంచుకోబడి ఉంటుంది, కాబట్టి తర్వాత ఎప్పుడూ సరైనదే. ఈ పరికరానికి అవసరం లేని దశలు వదిలివేయబడతాయి.\n\nబటన్లను నొక్కండి, లేదా పైకి, కిందికి బటన్లు, ఎంచుకో ఉపయోగించండి. మొదటి పేజీలోని దాటవేయి సెటప్ నుండి వెంటనే బయటకు వెళ్తుంది. చివరి పేజీ మీ పుస్తకాలు ఎక్కడి నుండి వస్తాయో చెబుతుంది.\n\nమళ్లీ అమలు చేయడానికి, సెట్టింగులను తెరిచి PaperPawను సెటప్ చేయి ఎంచుకోండి. ఇక్కడ ఎంచుకున్నదంతా తర్వాత సెట్టింగులలో మార్చవచ్చు."
