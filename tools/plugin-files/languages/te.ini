stats.plugin.description = మీరు ఎంతసేపు, ఎంత చదువుతారో క్యాలెండర్తో, ప్రతి పుస్తకం సంఖ్యలతో నమోదు చేస్తుంది.
stats.plugin.how = "చదువు గణాంకాలు మీరు ప్రతి పేజీని ఎంతసేపు చదువుతారో నమోదు చేస్తాయి. ఈరోజు, ఈ వారం, మీ వరుస రోజులతో అవలోకనంగా, క్యాలెండర్గా, ప్రతి పుస్తకం సంఖ్యలతో మీరు వాటిని చూస్తారు.\n\nసాధనాల నుండి, లేదా చదవడంలో మరిన్ని నుండి దీన్ని తెరవండి. సెట్టింగులలో, చదువు గణాంకాలు కింద, చదువును నమోదు చేయి ఆఫ్ చేయవచ్చు, రోజువారీ లక్ష్యం సెట్ చేయవచ్చు, లెక్కించే అతి చిన్న పేజీ, అతి పెద్ద పేజీ సెట్ చేయవచ్చు; అలా పేజీలు తిరగేయడం లేదా తెరిచి వదిలేసిన పుస్తకం సంఖ్యలను తప్పుదారి పట్టించవు.\n\nKOReaderతో సింక్ WebDAV ఫోల్డర్ ద్వారా గణాంకాలను KOReaderతో పంచుకుంటుంది. అదే పరికరంలోని KOReader గణాంకాలను కూడా తీసుకుంటుంది. నమోదుకు గడియారం సెట్ అయి ఉండాలి: లేకపోతే ఒకసారి Wi-Fiకి కనెక్ట్ అవ్వండి."
