joplin.notebook.help = PaperPaw Joplinలో చేసే నోట్బుక్, ప్రతి పుస్తకానికి ఒక నోట్తో. మళ్లీ ఎగుమతి చేస్తే నోట్ అప్డేట్ అవుతుంది, వేరే నోట్బుక్కు తరలించినదైనా.
