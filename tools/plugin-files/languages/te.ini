store.source.refused.help = దానిలో ఏదీ చదవలేదు. PaperPaw ప్లగిన్లకు తిరిగి వెళ్లడానికి వెనుకకు వెళ్లండి.
tasks.plugin.name = పనులు
tasks.plugin.description = గడువు తేదీలు, ప్రాధాన్యతలతో చేయవలసిన పనుల జాబితాలు, రీడర్లోనే లేదా మీ CalDAV సర్వర్తో సింక్, హోమ్ స్క్రీన్ విడ్జెట్లతో.
tasks.plugin.how = "మీ రీడర్లో చేయవలసిన పనుల జాబితాలు: గడువు తేదీ, ప్రాధాన్యత ఉన్న పనులు, పూర్తయ్యాక టిక్ చేయబడతాయి. సెటప్, నెట్వర్క్ లేకుండా పని చేస్తాయి; CalDAV సర్వర్తో (Nextcloud, Radicale, Baïkal, Fastmail మొదలైనవి) సింక్ చేస్తే మీ ఫోన్, కంప్యూటర్లో అవే జాబితాలు ఉంటాయి.\n\nసాధనాల మెనూ నుండి పనులు తెరవండి. మొదటి వరుస చూపే జాబితా పేరు; దాన్ని ఎంచుకుంటే వేరే జాబితా, ఈ రోజు, గడువు దాటినవి, కొత్త జాబితా, సింక్ లేదా ఖాతా. పనిని జోడించు కీబోర్డును తెరుస్తుంది. పనిపై ఎంచుకో దాన్ని టిక్ చేస్తుంది (మళ్లీ: పూర్తి కాలేదు). శీర్షిక, గడువు (ఈ రోజు, రేపు, వారంలో, లేదా 2026-12-24 లాంటి తేదీ), ప్రాధాన్యత మార్చడానికి లేదా తీసివేయడానికి పనిని నొక్కి పట్టుకోండి లేదా మెనూ నొక్కండి. తెరిచిన పనులు రోజు, ప్రాధాన్యత ప్రకారం ముందు; పూర్తయినవి ఒక వారం (సెట్టింగులలో మార్చవచ్చు) చివర ఉండి తర్వాత పోతాయి.\n\nహోమ్ స్క్రీన్ విడ్జెట్లు: ఈ రోజు పనులు, పనుల జాబితా, తెరిచిన పనులు, తర్వాతి పని. విడ్జెట్లో పనిని నొక్కితే టిక్ అవుతుంది; శీర్షికను నొక్కితే జాబితాలు తెరుచుకుంటాయి.\n\nసింక్ కోసం జాబితా వరుస నుండి CalDAV ఖాతా ఎంచుకుని సర్వర్ చిరునామా (ఉదా. cloud.example.com/remote.php/dav), వినియోగదారు పేరు, పాస్వర్డ్ (యాప్ పాస్వర్డ్ మేలు) నమోదు చేయండి. సర్వర్లోని ప్రతి పనుల జాబితా రీడర్లో ఒక జాబితా అవుతుంది. పనులు తెరిచినప్పుడు, ఇప్పుడే సింక్ చేయి ఎంచుకున్నప్పుడు, నెట్వర్క్ ఆన్లో ఉన్నప్పుడు సింక్ అవుతుంది; నెట్వర్క్ లేకుండా చేసిన మార్పులు తర్వాత పంపబడతాయి. ఒక పని రెండు చోట్లా మారితే సర్వర్ వెర్షన్ తీసుకుని, మీది కొత్త పనిగా ఉంచబడుతుంది. పునరావృతమయ్యే పనులను సృష్టించిన చోటే మార్చండి. రీడర్ 12 జాబితాల్లో 200 పనుల వరకు ఉంచుతుంది."
