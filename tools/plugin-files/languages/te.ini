notes-vault.plugin.name = గమనికల వాల్ట్
notes-vault.plugin.description = Markdown గమనికల ఫోల్డర్ను ఫోల్డర్లు, ట్యాగ్లు, ఇటీవలి మార్పుల వారీగా చదువుతుంది, హోమ్ స్క్రీన్ కోసం విడ్జెట్లతో. Obsidian వాల్ట్లతో పని చేస్తుంది.
notes-vault.plugin.how = "గమనికల వాల్ట్ Markdown గమనికల ఫోల్డర్ను (గమనికల యాప్లు ఉంచే సాధారణ .md ఫైళ్లు) చదువుతుంది. ఇది Obsidian వాల్ట్లతో పని చేస్తుంది.\n\nవాల్ట్ ఫోల్డర్ను సెట్టింగులలో లేదా సాధనాలలోని వాల్ట్ పేజీలో ఎంచుకోండి. ఆ పేజీ కార్డులో ఉన్నట్లే ఫోల్డర్లను, చివరగా మారిన గమనికలను, ట్యాగ్లను, గమనికల శీర్షికలలో శోధనను చూపుతుంది.\n\nమొదటిసారి, పేజీ తెరిచి ఉన్నప్పుడు వాల్ట్ నేపథ్యంలో సూచిక చేయబడుతుంది; వేలాది గమనికలకు కొన్ని నిమిషాలు పడుతుంది, తర్వాత వెంటనే తెరుచుకుంటుంది. సూచిక కార్డులో ఉంటుంది; కొన్ని గంటల తర్వాత పేజీ తెరిచినప్పుడు లేదా మీరు అప్డేట్ ఎంచుకున్నప్పుడు మళ్లీ తయారవుతుంది.\n\nగమనిక రీడర్లో తెరుచుకుంటుంది. ఇతర గమనికలకు లింక్లు ([[Note]], [[Note|words]], [[Note#Heading]]) వాల్ట్లో ఎక్కడైనా గమనిక పేరుతో దొరుకుతాయి; లింక్ను అనుసరిస్తే ఆ గమనిక తెరుచుకుంటుంది, వెనుకకు మునుపటి గమనికకు తీసుకెళ్తుంది.\n\nవాల్ట్లో ఏదీ ఎప్పుడూ మార్చబడదు. హోమ్ స్క్రీన్ విడ్జెట్లను (ఇటీవలి గమనికలు, పిన్ చేసిన గమనిక, ఈ రోజు గమనిక, యాదృచ్ఛిక గమనిక, ట్యాగ్లు, శోధన) హోమ్ స్క్రీన్ ఎడిటర్లో జోడించండి. విడ్జెట్ ఒకే ఫోల్డర్ నుండి గమనికలు తీసుకోగలదు: విడ్జెట్ సెట్టింగులలో కార్డు మూలం నుండి ఫోల్డర్ మార్గం రాయండి (ఉదా. Notes/Work); ఖాళీగా ఉంటే వాల్ట్లోని అన్ని గమనికలు."
