notes-overview.plugin.name = అన్ని గమనికలు
notes-overview.plugin.description = అన్ని పుస్తకాల బుక్ మార్కులు, హైలైట్లు ఒకే జాబితాలో, My Clippings.txtగా ఎగుమతితో.
notes-overview.plugin.how = "అన్ని గమనికలు మీరు బుక్ మార్క్ లేదా హైలైట్ చేసిన ప్రతి పుస్తకాన్ని, వాటి సంఖ్యతో సహా చూపుతుంది. దీన్ని సాధనాలలో తెరవండి. ఒక పుస్తకాన్ని ఎంచుకుంటే దాని గమనికలు కనిపిస్తాయి; ఒక గమనికను ఎంచుకుంటే పుస్తకం ఆ చోట తెరుచుకుంటుంది.\n\nజాబితా చివరలో, My Clippings.txtగా ఎగుమతి చేయి అన్ని గమనికలను లైబ్రరీ పక్కన ఉన్న Exports ఫోల్డర్లో ఒకే ఫైల్గా, Kindle వాడే రూపంలో (UTF-8) రాస్తుంది. Kindle యొక్క My Clippings.txtను చదివే యాప్లు దీన్ని చదవగలవు. హైలైట్పై గమనిక Kindleలో లాగే ప్రత్యేక ఎంట్రీ. ఇక్కడి పుస్తకాలకు Kindle స్థానాలు లేనందున, “location” అంటే గమనిక పుస్తకంలో ఎంత దూరంలో ఉందో శాతంలో. ఫైల్ ప్రతిసారీ కొత్తగా రాయబడి, పాతదాన్ని భర్తీ చేస్తుంది."
