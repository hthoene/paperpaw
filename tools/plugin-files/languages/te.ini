setup.end.help = కంప్యూటర్తో పరికరంలోని “/books” ఫోల్డర్లో పుస్తకాలను పెట్టండి, లేదా ఫోన్ లేదా కంప్యూటర్ నుండి Wi-Fi ద్వారా పంపండి (సాధనాలు, Wi-Fi బదిలీ). కేటలాగ్లు కూడా వాటిని తెస్తాయి, జోడించి ఉంటే Calibre కూడా. ఇక్కడ ఎంచుకున్నదంతా సెట్టింగులలో మార్చవచ్చు.
