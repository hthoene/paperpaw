core.usb-drive.text = USB డ్రైవ్గా కనెక్ట్ అయింది: కార్డు కంప్యూటర్లో ఉంది. దాన్ని తిరిగి పొందడానికి అక్కడ డ్రైవ్ను ఎజెక్ట్ చేయండి, లేదా వెనుకకు నొక్కండి; తర్వాత సరే నొక్కండి. మీరు కాపీ చేసిన ఫైళ్లు ఆ తర్వాత లైబ్రరీలో కనిపిస్తాయి.
