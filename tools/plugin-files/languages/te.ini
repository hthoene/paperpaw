menu.plugin.name = మెనూ
menu.plugin.description = స్క్రీన్ కింద చర్యలు, సెట్టింగులతో ఉండే మెనూ.
menu.plugin.how = "మీరు చేయగలిగినవి, సెట్ చేయగలిగినవి మెనూ జాబితా చేస్తుంది. ఇది తెరిచి ఉన్నదాని పైన, స్క్రీన్ కింది భాగంలో తెరుచుకుంటుంది: చదివేటప్పుడు స్క్రీన్ మధ్యలో నొక్కండి లేదా “ఎంచుకో” నొక్కండి. అంశాన్ని నడపడానికి దాన్ని నొక్కండి లేదా ఎంచుకోండి.\n\nమెనూలోని సెట్టింగులు వాటి విలువను చూపుతాయి, అక్కడికక్కడే మారతాయి, కాబట్టి మెనూ తెరిచే ఉంటుంది. మరిన్ని అంశాలు ఉన్న అంశం ఉపమెనూను తెరుస్తుంది.\n\nత్వరిత ప్యానెల్ కోసం పై అంచు నుండి కిందికి స్వైప్ చేయండి: మీరు తరచుగా మార్చేవి, బటన్లుగా. బటన్ను మార్చడానికి నొక్కండి, దాని సెట్టింగుల కోసం నొక్కి పట్టుకోండి. బటన్లతో మాత్రమే: బాణం బటన్లు ఎంచుకుంటాయి, “ఎంచుకో” మారుస్తుంది, “వెనుకకు” మూసివేస్తుంది. “రూపం” కింద “మెనూలు” మెనూలను జాబితాగా లేదా టైల్స్గా చూపుతుంది."
