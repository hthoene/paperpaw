notes-overview.export.help.more = ఇ-రీడర్లు వాడే My Clippings.txt ఫార్మాట్లో అన్ని గమనికలు ఒకే ఫైల్లో, లైబ్రరీ పక్కన “Exports” ఫోల్డర్లో. జాబితా 200 పుస్తకాలను చూపుతుంది, ఫైల్లో అన్నీ ఉంటాయి.
