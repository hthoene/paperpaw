translate.plugin.name = అనువాదం
translate.plugin.description = ఎంచుకున్న టెక్స్ట్ను DeepLతో ఆన్లైన్లో అనువదిస్తుంది.
translate.plugin.how = "అనువాదం ఎంచుకున్న టెక్స్ట్ను DeepLతో ఆన్లైన్లో అనువదిస్తుంది. పుస్తకంలో టెక్స్ట్ను ఎంచుకుని, ఎంచుకున్న టెక్స్ట్ మెనూలో అనువదించు ఎంచుకోండి: నిఘంటువు ఎంట్రీ లాగా అనువాదం పేజీపై కనిపిస్తుంది. పేజీ బటన్లు లేదా నొక్కడం దాన్ని స్క్రోల్ చేస్తాయి; ఎంచుకో లేదా చివరలో నొక్కడం దాన్ని మూసివేస్తుంది.\n\nదీనికి నెట్వర్క్, మీ సొంత DeepL API కీ అవసరం; అది deepl.comలో ఉచితం (DeepL API Free, నెలకు సుమారు 500,000 అక్షరాలు). మీరు దాన్ని నమోదు చేసే వరకు ప్యానెల్ ఆ విషయం చెబుతుంది, నొక్కితే కీ అడుగుతుంది.\n\nసెట్టింగులలో, చదవడం కింద, అనువాదం విభాగంలో, దీనిలోకి అనువదించు భాషను నిర్ణయిస్తుంది; మొదట అది PaperPaw భాషే."
