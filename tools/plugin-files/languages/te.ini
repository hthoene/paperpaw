sleep.plugin.name = నిద్ర స్క్రీన్
sleep.plugin.description = పరికరం నిద్రలో ఉన్నప్పుడు నిద్రపోతున్న పిల్లి, పుస్తకం కవర్, మీ చిత్రాలు లేదా ఒక సందేశాన్ని చూపుతుంది.
sleep.plugin.how = "పరికరం నిద్రలో ఉన్నప్పుడు స్క్రీన్ ఏమి చూపాలో నిద్ర స్క్రీన్ నిర్ణయిస్తుంది. E-ink విద్యుత్ లేకుండానే చిత్రాన్ని ఉంచుతుంది.\n\nసెట్టింగులు › పరికరం › నిద్ర స్క్రీన్ › చూపు: నిద్రపోతున్న పిల్లి (ప్రామాణికం), పుస్తకం కవర్, నా చిత్రాలు (Pictures ఫోల్డర్ ఫైళ్లు ఒకదాని తర్వాత ఒకటి), లోగో, “నిద్రలో ఉంది”, విడ్జెట్లు, పేజీ అలాగే, లేదా చిత్రంతో పేజీ. కవర్ లేదా చిత్రం లేకపోతే పిల్లి కనిపిస్తుంది. సిస్టమ్ స్వయంగా నిద్ర స్క్రీన్ గీసే చోట ఈ సెట్టింగులు దాచబడతాయి.\n\nఆఫ్ చేసినప్పుడు చూపు: పవర్ మెనూ నుండి లేదా నిద్ర తర్వాత ఆఫ్ చేయి సమయం తర్వాత పరికరం ఆఫ్ అయినప్పుడు ఒకసారి గీయబడుతుంది (బ్యాటరీ అయిపోయినప్పుడు కాదు). లోగో, “ఆఫ్ చేయబడింది”, పిల్లి, కవర్ లేదా నా చిత్రాలు ఎంచుకోకపోతే ఇది నిద్ర స్క్రీన్ లాగే ఉంటుంది. వేరే ప్లగిన్ దీనికి ఒక స్క్రీన్ అందించవచ్చు.\n\nప్రారంభంలో చూపు, రీస్టార్ట్లో చూపు: వేరే ప్లగిన్ స్క్రీన్ అందించకపోతే పరికరం సొంత స్క్రీన్. ప్రారంభంలో ప్లగిన్లు ఇంకా పనిచేయవు, కాబట్టి ఆ స్క్రీన్ ఆఫ్ లేదా రీస్టార్ట్ సమయంలో ముందే గీయబడి, తర్వాతి ప్రారంభంలో చూపబడుతుంది. సమయానికి సిద్ధం కాని స్క్రీన్ లేదా పాడైన చిత్రం బదులు పరికరం సొంత స్క్రీన్ వస్తుంది; ఎలాగైనా పరికరం ఆఫ్ లేదా రీస్టార్ట్ అవుతుంది."
