core.config-unreadable = {file} చదవడం సాధ్యం కాలేదు, కాబట్టి సెట్టింగుల మార్పులు సేవ్ కావు. కంప్యూటర్లో ఆ ఫైల్ను సరిచేయండి లేదా తీసివేయండి.
core.secrets-unreadable = {file} చదవడం సాధ్యం కాలేదు, కాబట్టి పాస్వర్డ్లు, కీలు సేవ్ కావు. కంప్యూటర్లో ఆ ఫైల్ను సరిచేయండి లేదా తీసివేయండి.
core.secrets-unopened = ఈ కార్డులో సేవ్ చేసిన కొన్ని పాస్వర్డ్లు, కీలను ఇక్కడ తెరవలేము: అవి వేరే పరికరంలో సేవ్ చేయబడ్డాయి, లేదా ఈ పరికరం కీ పోయింది. ప్లగిన్ అడిగిన చోట వాటిని మళ్లీ నమోదు చేయండి.
core.secrets-unsupported = ఈ పరికరం ఇంకా పాస్వర్డ్లను సేవ్ చేయలేదు. paperpaw.orgలోని వెబ్ ఫ్లాషర్తో PaperPawను ఒకసారి మళ్లీ ఇన్స్టాల్ చేయండి, అప్పుడు ఇది పని చేస్తుంది.
core.card.missing = మెమరీ కార్డు కనిపించలేదు, కాబట్టి ఏదీ సేవ్ కాదు. FAT32 కార్డు పెట్టి రీస్టార్ట్ చేయండి.
