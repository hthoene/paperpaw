menu-editor.plugin.name = మెనూ ఎడిటర్
menu-editor.plugin.description = ప్రతి మెనూ అంశాల క్రమం మారుస్తుంది, వాటిని తీసివేస్తుంది, జోడిస్తుంది.
menu-editor.plugin.how = "మెనూ ఎడిటర్ మెనూలలో ఏమి ఉండాలో మారుస్తుంది: అంశాలను పైకి లేదా కిందికి జరపండి, తీసివేయండి, లేదా కొత్తవి జోడించండి.\n\nదీన్ని సెట్టింగులలో “అనుకూలీకరించు” కింద “మెనూలను అనుకూలీకరించు”గా కనుగొనండి. ఒక మెనూను, తర్వాత జరపడానికి లేదా తీసివేయడానికి ఒక అంశాన్ని ఎంచుకోండి; “అంశాన్ని జోడించు” కొత్తది చేరుస్తుంది. మార్పులు వెంటనే వర్తిస్తాయి. “ఈ మెనూను రీసెట్ చేయి” మెనూను దాని ప్లగిన్లు నిర్వచించిన విధంగా తిరిగి తెస్తుంది, “అన్ని మెనూలను రీసెట్ చేయి” ప్రతిదానికీ అలాగే చేస్తుంది.\n\nమీరు బయటే ఇరుక్కుపోలేరు: సెట్టింగులకు దారి అయిన అంశం, వాటికి మరో దారి జోడించే వరకు ఉంటుంది."
