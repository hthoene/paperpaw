store.source.other-key = {name} ఇన్స్టాల్ కాలేదు: దీనిపై ఈ మూలం కీతో సంతకం లేదు.
store.source.unsigned = ఈ మూలంపై సంతకం లేదు
store.source.unsigned.help = దాని జాబితాకు చెల్లుబాటయ్యే సంతకం లేదు, కాబట్టి దానిలో ఏదీ చదవలేదు. PaperPaw ప్లగిన్లకు తిరిగి వెళ్లడానికి వెనుకకు వెళ్లండి.
store.source.key-changed = ఈ మూలానికి వేరే కీ ఉంది
store.source.key-changed.help = మీరు జోడించినప్పటి కంటే వేరే కీతో దాని జాబితా సంతకం చేయబడింది, కాబట్టి దానిలో ఏదీ చదవలేదు. PaperPaw ప్లగిన్లకు తిరిగి వెళ్లడానికి వెనుకకు వెళ్లండి. ఈ మార్పును నమ్మితేనే మూలాన్ని తీసివేసి మళ్లీ జోడించండి.
