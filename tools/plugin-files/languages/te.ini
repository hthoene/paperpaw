plugin-manager.badges.too-many = లోడ్ కాలేదు: ఇది {cap} పుస్తక బ్యాడ్జ్ల పరిమితిని దాటుతుంది. పుస్తక బ్యాడ్జ్లు ఉన్న మరో ప్లగిన్ను ఆఫ్ చేయండి.
