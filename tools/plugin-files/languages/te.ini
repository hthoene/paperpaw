news.plugin.name = వార్తలు
news.plugin.description = వార్తా ఫీడ్లను (RSS, Atom) చదవడానికి పుస్తకాలుగా తెస్తుంది.
news.plugin.how = "వార్తలు RSS లేదా Atom ఫీడ్లను పుస్తకాలుగా మారుస్తుంది. ప్రతి ఫీడ్ లైబ్రరీలోని News ఫోల్డర్లో ఒక పుస్తకం అవుతుంది, దాని తాజా వ్యాసాలు సాదా టెక్స్ట్గా, ఇతర పుస్తకంలాగే చదవడానికి.\n\n“సాధనాలు” మెనూ నుండి వార్తలను తెరిచి “ఫీడ్ జోడించు” ఎంచుకోండి; దాని చిరునామా వార్తాపత్రిక లేదా బ్లాగ్ వెబ్సైట్లో ఉంటుంది. “వార్తలు తెచ్చు” అన్ని ఫీడ్లను తెచ్చి, పాత పుస్తకాలను భర్తీ చేస్తుంది. ఒక ఫీడ్ను మాత్రమే తేవడానికి లేదా తీసివేయడానికి దాన్ని నొక్కి పట్టుకోండి (బటన్లతో: “ఎంచుకో” పట్టుకోండి). తీసివేసిన ఫీడ్ పుస్తకం లైబ్రరీలో ఉంటుంది.\n\nతేవడానికి నెట్వర్క్ అవసరం. “ఒక ఫీడ్కు వ్యాసాలు” (సెట్టింగులు, లైబ్రరీ) ప్రతి పుస్తకంలో ఎన్ని వ్యాసాలు ఉండాలో సెట్ చేస్తుంది. “వార్తా శీర్షికలు” విడ్జెట్ వాటిని హోమ్ స్క్రీన్పై చూపుతుంది."
