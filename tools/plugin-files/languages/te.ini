end-of-book.plugin.how = మీరు పుస్తకం చివరి పేజీకి చేరినప్పుడు, ఒక స్క్రీన్ దాని సిరీస్లోని తర్వాతి పుస్తకాన్ని (లేదా లైబ్రరీని) అందిస్తుంది, పుస్తకానికి ఒకటి నుండి ఐదు నక్షత్రాలు ఇవ్వనిస్తుంది, అది పూర్తయినట్లు గుర్తించబడిందో లేదో చూపుతుంది. చివరి పేజీకి తిరిగి వెళ్లడానికి వెనుకకు నొక్కండి.
