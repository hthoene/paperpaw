puzzles.plugin.name = పజిల్స్
puzzles.plugin.description = సుడోకు, క్రాస్ వర్డ్లు, చెస్ పజిల్స్, ఆఫ్లైన్లో, ఈ రోజు పజిల్తో.
puzzles.plugin.how = "రైలు, వెయిటింగ్ రూమ్ కోసం పజిల్స్, అన్నీ ఆఫ్లైన్: సుడోకు, క్రాస్ వర్డ్లు, చెస్ పజిల్స్. సాధనాల మెనూ నుండి పజిల్స్ తెరవండి, లేదా ఈ రోజు పజిల్ విడ్జెట్ను హోమ్ స్క్రీన్కు జోడించండి: ఈ రోజు సుడోకు ఎంతవరకు వచ్చిందో చూపుతుంది, నొక్కితే తెరుచుకుంటుంది.\n\nసుడోకు: ఎడమ, కుడి కర్సర్ను గడి గడికి, పేజీ బటన్లు వరుసకు కదిలిస్తాయి. ఎంచుకో అంకెలను తెరుస్తుంది: ఒకటి ఎంచుకుని పెట్టండి, లేదా క్లియర్తో గడిని ఖాళీ చేయండి. బోర్డు కింది బటన్ల కోసం ఎంచుకో (లేదా మెనూ) నొక్కి పట్టుకోండి: గమనికలు (పెన్సిల్ గుర్తులు), తనిఖీ (తప్పు గడులు), రద్దు (చివరి కదలిక), కొత్తది (సులభం, మధ్యస్థం, కష్టం). ప్రతి పజిల్కు ఒకే పరిష్కారం. ఆట సేవ్ అవుతుంది. టచ్ స్క్రీన్పై గడిని నొక్కండి.\n\nక్రాస్ వర్డ్లు: .puz (Across Lite) లేదా .ipuz ఫైళ్లను మెమరీ కార్డులోని “puzzles” ఫోల్డర్లో పెట్టండి; ఏవీ చేర్చబడలేదు. గ్రిడ్పై కదిలి, ఎంచుకోతో కర్సర్ కింది పదాన్ని కీబోర్డ్పై టైప్ చేయండి (అండర్ స్కోర్ గడిని ఖాళీగా ఉంచుతుంది). బటన్లు అడ్డం/నిలువు మారుస్తాయి, ఆధారాలు చూపుతాయి, అక్షరాలను తనిఖీ చేస్తాయి, పదాన్ని చూపుతాయి. ప్రతి ఫైల్కు అక్షరాలు సేవ్ అవుతాయి. స్క్రాంబుల్ చేసిన .puz ఫైళ్లు తెరుచుకోవు.\n\nచెస్ పజిల్స్: Lichess పజిల్ డేటాబేస్ (CC0) నుండి చిన్న సెట్. ఎడమ, కుడి పావు నుండి పావుకు దూకుతాయి; పావును ఎంచుకుని, ఎడమ, కుడితో గమ్యం చూసి, మళ్లీ ఎంచుకోండి. తప్పు కదలిక వెనక్కి తీసుకోబడుతుంది. సూచన కదపాల్సిన పావును గుర్తిస్తుంది, తర్వాత బటన్ తర్వాతి పజిల్కు వెళ్తుంది. బోర్డు మారిన గడులను మాత్రమే మళ్లీ గీస్తుంది. గణాంకాలు మీరు పరిష్కరించిన పజిల్స్ను లెక్కిస్తాయి."
