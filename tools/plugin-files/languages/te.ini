vocabulary.plugin.name = పదజాలం
vocabulary.plugin.description = మీరు అర్థం చూసిన పదాలను వాటి వాక్యాలతో ఉంచుతుంది, మీ ఫోన్లో చేసిన ఫ్లాష్ కార్డులను విరామ పునరావృతంతో సమీక్షిస్తుంది.
vocabulary.plugin.how = "పదజాలం చదివేటప్పుడు మీరు అర్థం చూసిన పదాలను వాటి వాక్యాలతో ఉంచుతుంది. జాబితా సాధనాలలో ఉంటుంది (కొత్తవి ముందు); పదాన్ని ఎంచుకుంటే మళ్లీ అర్థం చూపుతుంది. ఎగుమతి వాటిని Anki వంటి యాప్ల కోసం సేవ్ చేస్తుంది. కొత్త 2,000 పదాలే ఉంటాయి, పాతవి పోతాయి: ముందే ఎగుమతి చేయండి.\n\nఫ్లాష్ కార్డులు (సాధనాలలో) విరామ పునరావృతంతో పరీక్షిస్తాయి: సమాధానం చూపు తర్వాత మళ్లీ, కష్టం, బాగుంది లేదా సులభం ఎంచుకోండి; కార్డు ఎప్పుడు తిరిగి రావాలో అది నిర్ణయిస్తుంది. డెక్లను ఫోన్తో సవరించుతో చేయండి: అదే Wi-Fiలోని ఫోన్తో కోడ్ను స్కాన్ చేసి కార్డులు టైప్ చేయండి, లేదా డెక్లో ఒకేసారి చాలా కార్డులు ఎంచుకుని CSV, TSV, TXT ఫైల్ (పంక్తికి ఒక కార్డు: ముందు, వెనుక, ఉదాహరణ; UTF-8), జాబితా లేదా Anki డెక్ (.apkg, “Support older Anki versions”తో) ఇవ్వండి.\n\nలేదా SD కార్డులోని Flashcards ఫోల్డర్లో డెక్కు ఒక ఫైల్ పెట్టండి (Spanish.tsv అంటే Spanish డెక్), ఫ్లాష్ కార్డులలో SD కార్డులోని కార్డులు ఎంచుకోండి (లేదా తెరిచినప్పుడు ఆటోమేటిక్గా). కొత్త లేదా మారిన ఫైల్ దాని డెక్లో కలుస్తుంది, పురోగతి ఉంటుంది; ముందు టెక్స్ట్ మారిస్తే అది కొత్త కార్డు. తొలగించిన పంక్తి కార్డును తొలగించదు, “ఫైల్లో లేని కార్డులు” తీసివేయి అయితే తప్ప (అప్పుడు పురోగతితో శాశ్వతంగా). కార్డులో సేవ్ చేయి డెక్ను id నిలువు వరుసతో ఫైల్లో రాస్తుంది (id, ముందు, వెనుక, ఉదాహరణ మాత్రమే; పాత ఫైల్ _name.bak.tsvగా ఉంటుంది), కాబట్టి కంప్యూటర్లో మార్చినా పురోగతి ఉంటుంది. గరిష్ఠం 4 MiB, 20,000 పంక్తులు; CSV UTF-8 (UTF-16 కాదు). చదవలేని పంక్తి ఉంటే ఏదీ తీసివేయబడదు, సేవ్ కాదు. ఫోల్డర్లో వివరణ గమనిక ఉంటుంది.\n\nసెట్టింగులు › చదవడం: వెతికిన పదాలతో కార్డులు ప్రతి పదాన్ని “వెతికినవి” డెక్లో పెడుతుంది."
