plugin-manager.plugin.description = ప్లగిన్లను జాబితా చేసి, వాటిని ఆన్, ఆఫ్ చేస్తుంది.
plugin-manager.plugin.how = "ప్లగిన్ మేనేజర్ ప్రతి ప్లగిన్ను దాని వెర్షన్, వివరణతో చూపి, ప్లగిన్లను ఆన్, ఆఫ్ చేస్తుంది.\n\nదీన్ని సెట్టింగులలో ప్లగిన్లను నిర్వహించు పేరుతో కనుగొనండి. ప్లగిన్ సెట్టింగులు అనేది ప్రతి ప్లగిన్ నెట్వర్క్ వాడకం వంటి ప్రాధాన్యతల కోసం వేరే పేజీ. ప్లగిన్ను ఆన్ లేదా ఆఫ్ చేయడానికి దాన్ని నొక్కండి (బటన్లతో: దాన్ని ఎంచుకోండి). మార్పు రీస్టార్ట్ తర్వాత అమలవుతుంది: అప్పుడు కింది పట్టీ ఇప్పుడే రీస్టార్ట్ చేయి అని చూపుతుంది. అది ఎలా పని చేస్తుందో చదవడానికి ప్లగిన్ను నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకో బటన్ను నొక్కి పట్టుకోండి).\n\nఎల్లప్పుడూ ఆన్ అని గుర్తించిన ప్లగిన్ను ఆఫ్ చేయలేరు, అవసరం అని గుర్తించినదాన్ని మరో ప్లగిన్ దాని పని చేసినప్పుడు మాత్రమే ఆఫ్ చేయగలరు, లేకపోతే PaperPawకు వెనుకకు దారి ఉండదు. అనేక ప్లగిన్లు అందించే చోటును ఏ ప్లగిన్ చూపాలో స్క్రీన్లు కింద ఎంచుకుంటారు."
