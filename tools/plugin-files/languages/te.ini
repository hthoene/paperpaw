profiles.plugin.name = చదివే ప్రొఫైల్లు
profiles.plugin.description = చదవడం, డిస్ప్లే సెట్టింగుల పేరున్న సెట్లు, ఒక్క నొక్కుతో మారతాయి.
profiles.plugin.how = "ప్రొఫైల్ మీ చదవడం సెట్టింగులు, డిస్ప్లే సెట్టింగులు, స్థితి పట్టీలను రాత్రి లేదా పెద్ద అక్షరాలు వంటి ఒక పేరుతో ఉంచి, ఒక్క నొక్కుతో వాటిని తిరిగి తెస్తుంది.\n\nచదివే మెనూలో మరిన్ని కింద, లేదా సెట్టింగులలో అనుకూలీకరించు కింద ప్రొఫైల్లు తెరవండి. ప్రొఫైల్ను వాడటానికి దాన్ని నొక్కండి; వాడుకలో ఉన్నది గుర్తించబడుతుంది. ప్రస్తుత సెట్టింగులను దానిలో సేవ్ చేయడానికి, పేరు మార్చడానికి లేదా తీసివేయడానికి దాన్ని నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకో బటన్ను నొక్కి పట్టుకోండి). కొత్త ప్రొఫైల్గా సేవ్ చేయి ఇప్పుడు సెట్ చేసినదాన్ని ఉంచుతుంది.\n\nతర్వాతి ప్రొఫైల్ జాబితాలోని తర్వాతి దానికి మారుస్తుంది; దాన్ని ఒక బటన్కు లేదా ఒక నియమానికి పెట్టండి."
