calibre.plugin.name = వైర్లెస్ లైబ్రరీ
calibre.plugin.description = నెట్వర్క్ ద్వారా పుస్తకాలను స్వీకరిస్తుంది. calibre కోసం వైర్లెస్ పరికరంగా పని చేస్తుంది.
calibre.plugin.how = "వైర్లెస్ లైబ్రరీతో ఈ పరికరం మీ కంప్యూటర్లోని Calibreలో వైర్లెస్ పరికరంగా కనిపిస్తుంది. అప్పుడు Calibre దీనికి పుస్తకాలు పంపగలదు, వాటి జాబితా చూడగలదు, తొలగించగలదు. పుస్తకాలు లైబ్రరీలోకి వెళ్తాయి.\n\nపరికరం, కంప్యూటర్ ఒకే Wi-Fi నెట్వర్క్లో ఉండగా సాధనాల మెనూ నుండి వైర్లెస్ లైబ్రరీ తెరవండి. Calibreలో Connect/share, తర్వాత Start wireless device connection ఎంచుకోండి. పరికరం మీ కంప్యూటర్ను కనుగొన్నాక దాని పేరు చూపుతుంది; కనెక్ట్ చేయి నొక్కండి (బటన్లతో: ఎంచుకో నొక్కండి). Calibre ఇక్కడ పుస్తకాలను జోడించగలదు, తొలగించగలదు, కాబట్టి మీ సొంత కంప్యూటర్కు మాత్రమే కనెక్ట్ చేయండి. స్క్రీన్ను మూసివేస్తే కనెక్షన్ ముగుస్తుంది.\n\nCalibre దానంతట అదే కనిపించకపోతే, దాని కంప్యూటర్ చిరునామాను సెట్టింగులలో లైబ్రరీ కింద, Calibre భాగంలో చిరునామాగా నమోదు చేయండి. Calibre 9090 కాకుండా వేరే పోర్ట్ వాడితే, దాన్ని :పోర్ట్గా జోడించండి, ఉదా. 192.168.1.20:9091."
