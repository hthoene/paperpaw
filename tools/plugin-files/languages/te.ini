format-cbz.plugin.name = కామిక్ పుస్తకాలు
format-cbz.plugin.description = కామిక్ పుస్తక ఆర్కైవ్లను (.cbz) పేజీకి ఒక చిత్రంగా తెరుస్తుంది.
format-cbz.plugin.how = "కామిక్ పుస్తక ఆర్కైవ్లను (.cbz) తెరుస్తుంది: పేజీకి ఒక చిత్రం, స్క్రీన్కు సరిపడేలా, వాటి పేర్ల క్రమంలో (10కి ముందు 2).\n\nవాటిని లైబ్రరీ ఫోల్డర్లో పెట్టి లైబ్రరీ నుండి తెరవండి; ఏ పుస్తకంలోలాగే పేజీలు తిప్పండి. పెద్ద చిత్రాలకు మొదటిసారి కొంత సమయం పడుతుంది, X4లో ఇంకా ఎక్కువ.\n\nచదివే సెట్టింగులు (సెట్టింగులు, చదవడం): \"ప్యానెల్ వారీగా\" పేజీలోని ఒక్కో ప్యానెల్ను స్క్రీన్ అనుమతించినంత పెద్దగా చూపుతుంది, పేజీ తిప్పడం వాటి గుండా వెళ్తుంది; ప్యానెళ్లు లేని పేజీ పూర్తిగా కనిపిస్తుంది. \"కామిక్ పేజీల దిశ\" మాంగా కోసం (కుడి నుండి ఎడమకు) పేజీ తిప్పడాన్ని తారుమారు చేస్తుంది; పుస్తకంలోని ComicInfo.xml దీన్ని దానంతట అదే చెబుతుంది. లైబ్రరీ ComicInfo.xml నుండి పుస్తకం శీర్షిక, సిరీస్, సంఖ్యను చూపుతుంది."
