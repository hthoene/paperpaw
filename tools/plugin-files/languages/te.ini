battery.plugin.name = బ్యాటరీ వినియోగం
battery.plugin.description = బ్యాటరీని నమోదు చేసి, అది ఎంతసేపు ఉంటుందో చూపిస్తుంది.
battery.plugin.how = "పరికరం మేల్కొని ఉన్నప్పుడు బ్యాటరీ వినియోగం దాదాపు నిమిషానికి ఒకసారి ఛార్జ్ను, పరికరం ఏమి చేసిందో (స్క్రీన్ రిఫ్రెష్లు, తిప్పిన పేజీలు) నమోదు చేస్తుంది. దాని నుండి ఒక గంట మేల్కొని ఉండటానికి, 100 పేజీలకు ఎంత ఖర్చవుతుందో, ఆ వేగంతో బ్యాటరీ ఎంతసేపు ఉంటుందో లెక్కిస్తుంది.\n\nసాధనాల మెనూ నుండి బ్యాటరీని తెరవండి. ఇది ప్రస్తుత ఛార్జ్, ఈసారి మేల్కొని ఉన్న సమయం, ఇప్పటివరకు బ్యాటరీపై వినియోగం, ఇటీవలి మేల్కొని ఉన్న సమయాలను చూపిస్తుంది. పేజీ బటన్లతో, లేదా పైన బాణాలను నొక్కి పేజీలు మార్చండి.\n\nసంఖ్యలకు అర్థం రావడానికి కొంతసేపు బ్యాటరీపై చదవాలి. నమోదు డిఫాల్ట్గా ఆన్లో ఉంటుంది, సెట్టింగులు › పరికరం › పవర్లో “బ్యాటరీ వినియోగాన్ని నమోదు చేయి”తో ఆఫ్ చేయవచ్చు."
