koreader.plugin.name = హైలైట్ల షేరింగ్
koreader.plugin.description = రెండింటిలోనూ చదివే పుస్తకాల బుక్ మార్కులు, హైలైట్లను KOReaderతో పంచుకుంటుంది.
koreader.plugin.how = "మీరు PaperPawలోనూ KOReaderలోనూ చదివే పుస్తకాల బుక్ మార్కులు, హైలైట్లను ఈ ప్లగిన్ KOReaderతో పంచుకుంటుంది: ఒకే పరికరంలో గానీ, పరికరాల మధ్య సింక్ అయ్యే లైబ్రరీ ఫోల్డర్లో గానీ. సెటప్ ఏమీ అవసరం లేదు.\n\nKOReader కూడా తెరిచిన పుస్తకాన్ని PaperPaw తెరిచినప్పుడు, దాని బుక్ మార్కులు లేదా హైలైట్లను మీరు మార్చినప్పుడు, పుస్తకం పక్కన ఉన్న KOReader డేటా నుండి కొత్తవాటిని తీసుకుంటుంది; ఇక్కడి కొత్తవాటిని KOReader తర్వాత ఆ పుస్తకాన్ని తెరిచినప్పుడు తీసుకునేలా ఉంచుతుంది. తీసివేసిన గుర్తులు, మార్చిన గమనికలు కూడా వెళ్తాయి.\n\nఇది EPUB పుస్తకాలకు మాత్రమే పని చేస్తుంది. ఒక వైపు ఫైల్ను చదవలేకపోతే, అది చదవగలిగే వరకు ఏ వైపూ ఏమీ మారదు."
koreader.removed-there = KOReader ఫైల్లో ఇప్పుడు హైలైట్లు లేవు. వాటిని ఇక్కడ కూడా తీసివేయాలా?
koreader.removed-there.text = అవి KOReaderలో తీసివేయబడి ఉండవచ్చు, లేదా దాని ఫైల్ వేరే పరికరం నుండి వచ్చి ఉండవచ్చు. “ఉంచు” వాటిని ఇక్కడ ఉంచి, మళ్లీ KOReaderకు ఇస్తుంది.
koreader.removed-there.remove = తీసివేయి
koreader.removed-there.keep = ఉంచు
