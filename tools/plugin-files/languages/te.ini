lock.plugin.name = స్క్రీన్ లాక్
lock.plugin.description = పరికరం మేల్కొన్నప్పుడు PIN, ప్యాటర్న్ లేదా పాస్వర్డ్; చదివేటప్పుడు టచ్ లాక్.
lock.plugin.how = "PaperPaw ప్రారంభమైనప్పుడు, పరికరం మేల్కొన్నప్పుడు స్క్రీన్ లాక్ PIN, ప్యాటర్న్ లేదా పాస్వర్డ్ అడుగుతుంది. మొదట ఇది ఆఫ్లో ఉంటుంది. ఇది సాధారణ వాడకాన్ని మాత్రమే ఆపుతుంది: కోడ్, తప్పు ప్రయత్నాల సంఖ్య SD కార్డులో ఉంటాయి, కాబట్టి కార్డును తీసి, మార్చి లేదా వేరేది పెట్టినవారు లాక్ను దాటగలరు.\n\nసెట్టింగులలో “పరికరం” › “స్క్రీన్ లాక్”లో సెట్ చేయండి: ప్రస్తుత కోడ్ ఉంటే నమోదు చేసి, రకాన్ని ఎంచుకుని, కొత్త కోడ్ను రెండుసార్లు ఇవ్వండి. ప్యాటర్న్ టచ్ స్క్రీన్లపై మాత్రమే.\n\nఐదు తప్పు ప్రయత్నాల తర్వాత, తర్వాతిది అర నిమిషం వేచి ఉంటుంది. “ఇప్పుడే లాక్ చేయి” వెంటనే లాక్ చేస్తుంది, దాన్ని బటన్, సంజ్ఞ లేదా నియమానికి కేటాయించవచ్చు. “మేల్కొన్న తర్వాత లాక్”ను ఆఫ్ చేస్తే నిజమైన ప్రారంభం (పవర్ ఆన్ లేదా రీస్టార్ట్) మాత్రమే లాక్ చేస్తుంది; బ్యాటరీపై X4లో లాగా ప్రతి మేల్కొలుపూ ప్రారంభమే అయిన చోట తప్ప.\n\nటచ్ లాక్: త్వరిత ప్యానెల్లో, చదివే మెనూలో “టచ్ లాక్ చేయి” నొక్కడాలు, స్వైప్లు, పెన్ను పని చేయకుండా చేస్తుంది, బటన్లు పని చేస్తాయి (ఉదా. స్క్రీన్పై చేయి ఉంచి చదవడానికి). అన్లాక్ చేయడానికి ఒక వేలితో రెండుసార్లు నొక్కి, రెండోసారి కొద్దిసేపు పట్టుకోండి; పవర్ బటన్ నొక్కి పట్టుకుంటే పవర్ మెనూ తెరుచుకుంటుంది, అందులో “టచ్ అన్లాక్ చేయి” బటన్లతో పని చేస్తుంది; X4 Proలో హోమ్ కీ నొక్కి పట్టుకుంటే వెంటనే అన్లాక్ అవుతుంది."
