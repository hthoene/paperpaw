transfer.plugin.description = అదే నెట్వర్క్లోని బ్రౌజర్ నుండి పుస్తకాలు, ఇతర ఫైళ్లను పరికరంలో పెట్టండి.
transfer.plugin.how = "Wi-Fi బదిలీ అదే నెట్వర్క్లోని బ్రౌజర్ నుండి కేబుల్ లేదా యాప్ లేకుండా పుస్తకాలు, ఇతర ఫైళ్లను పరికరంలో పెడుతుంది. ఫైళ్లను తీసుకోవడం, ఫోల్డర్లు చేయడం, తొలగించడం కూడా చేయవచ్చు.\n\nసాధనాల నుండి తెరవండి. స్క్రీన్ ఒక చిరునామాను టెక్స్ట్గా, QR కోడ్గా చూపుతుంది: ఫోన్ లేదా కంప్యూటర్ బ్రౌజర్లో దాన్ని తెరవండి, లేదా కోడ్ను స్కాన్ చేయండి. చిరునామాలో ప్రతిసారీ కొత్తగా చేసే కీ ఉంటుంది, కాబట్టి నెట్వర్క్లోని ఇతరులు మీ ఫైళ్లను చేరలేరు. స్క్రీన్ తెరిచి ఉన్నంత వరకు బదిలీ నడుస్తుంది.\n\nX4 లాగా PaperPaw స్వయంగా Wi-Fiని నడిపే చోట, కింద ఉన్న రౌటర్ లేకుండా పరికరం సొంత నెట్వర్క్ను తెరుస్తుంది; ఫోన్ కోడ్ను స్కాన్ చేసి దానిలో చేరుతుంది."
