weather.plugin.name = వాతావరణం
weather.plugin.description = ఇప్పటి వాతావరణం, రాబోయే రోజుల వాతావరణం విడ్జెట్లుగా, Open-Meteo నుండి.
weather.plugin.how = "వాతావరణం ఇప్పటి వాతావరణాన్ని, రాబోయే రోజులను హోమ్ స్క్రీన్ విడ్జెట్లుగా చూపుతుంది, Open-Meteo నుండి, దీనికి ఖాతా లేదా కీ అవసరం లేదు. ఇప్పటి వాతావరణం ఉష్ణోగ్రత, పరిస్థితి, మీరు ఎంచుకునే మరిన్ని వివరాలు చూపుతుంది; అంచనా రాబోయే రోజులను వరుసలో లేదా జాబితాలో చూపుతుంది.\n\nముందుగా స్థలాన్ని ఎంచుకోండి: సెట్టింగులలో, వాతావరణం కింద, స్థలం (పేరు టైప్ చేసి, దొరికిన స్థలాల నుండి ఎంచుకోండి). దాని కోఆర్డినేట్లు మాత్రమే పంపబడతాయి, అదీ వాతావరణ విడ్జెట్ కనిపిస్తున్నప్పుడు మాత్రమే. హోమ్ స్క్రీన్ను సవరించి విడ్జెట్లను జోడించండి.\n\nవాతావరణం గరిష్ఠంగా ఇలా అప్డేట్ చేయి చెప్పినంత తరచుగా, నెట్వర్క్ ఉన్నప్పుడు మాత్రమే తీసుకురాబడుతుంది: అది ఎప్పుడూ తనంతట తానుగా Wi-Fi ఆన్ చేయదు.\n\nవాతావరణ డేటా Open-Meteo.com (https://open-meteo.com) నుండి, Creative Commons Attribution 4.0 లైసెన్స్ (CC BY 4.0) కింద."
