dictionary.plugin.name = నిఘంటువు
dictionary.plugin.description = StarDict నిఘంటువులలో పదాల అర్థాలు వెతుకుతుంది.
dictionary.plugin.how = "నిఘంటువు పుస్తకంలోని పదాన్ని StarDict నిఘంటువులలో వెతికి, స్క్రీన్ కింది భాగంపై ఒక ప్యానెల్లో అర్థాలను చూపుతుంది.\n\nరీడర్లో పదాన్ని నొక్కి పట్టుకుని అర్థం చూడు ఎంచుకోండి; బటన్లతో మరిన్ని కింద టెక్స్ట్ ఎంచుకో ఉపయోగించండి. నిఘంటువు ఫోల్డర్లను (.ifo, .idx, .dict ఫైళ్లతో) పరికరంలోని \"dictionaries\" ఫోల్డర్లోకి (సబ్ ఫోల్డర్లతో సహా) కాపీ చేయండి, లేదా సెట్టింగులలో చదవడం కింద నిఘంటువు ఫోల్డర్గా (అధునాతన సెట్టింగ్) వేరే ఫోల్డర్ను ఎంచుకోండి. మొదటిసారి వెతికినప్పుడు ప్రతి నిఘంటువుకు ఒక చిన్న సూచిక తయారవుతుంది, దానికి కొంత సమయం పడుతుంది.\n\nప్యానెల్లో పేజీ బటన్లు లేదా పైకి, కిందికి పొడవైన అర్థాలను స్క్రోల్ చేస్తాయి, వెనుకకు దాన్ని మూసివేస్తుంది. టచ్తో, మూసివేయడానికి దాని బయట నొక్కండి."
