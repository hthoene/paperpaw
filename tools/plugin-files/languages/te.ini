bluetooth.plugin.description = రిమోట్లు, కీబోర్డులు, సెన్సార్లను జత చేసి, కనెక్ట్ చేస్తుంది.
bluetooth.plugin.how = "రీడర్కు Bluetooth ఉన్నచోట (X4 Pro), Bluetooth రిమోట్లు, కీబోర్డులు, సెన్సార్లను దానితో జత చేస్తుంది.\n\nపరికరాన్ని జోడించు అందుబాటులో ఉన్నవాటి కోసం వెతుకుతుంది; ముందుగా పరికరాన్ని జత చేసే మోడ్లో పెట్టండి. దాన్ని ఎంచుకుని, రీడర్లో నిర్ధారించండి (సంఖ్య కనిపిస్తే పోల్చండి). అప్పుడు రిమోట్ లేదా కీబోర్డ్ కీలు పేజీలు తిప్పుతాయి, మెనూలలో కదులుతాయి; ప్రతి కీ ఏమి చేస్తుందో “నియంత్రణలు”లో మార్చండి.\n\nరిమోట్లు వాటి కీలు ఎప్పుడు పని చేస్తాయో చెబుతుంది: ఇక్కడ ఆన్ చేసినప్పుడు, చదువుతున్నప్పుడు (పుస్తకం తెరిచి ఉన్నప్పుడు కనెక్ట్ అవుతుంది, బ్యాటరీ ఆదా), లేదా ఎల్లప్పుడూ. మెనూ బటన్ లేదా పరికరంపై ఎక్కువసేపు నొక్కడం దాన్ని మర్చిపోతుంది.\n\nసెన్సార్ ప్లగిన్ల కోసం: దాన్ని ఏ ప్లగిన్ ఉపయోగించవచ్చో ఆన్ చేయండి. ఏదీ ఉపయోగించనప్పుడు Bluetooth ఆఫ్లో ఉంటుంది."
