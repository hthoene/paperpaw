file-manager.plugin.name = ఫైల్ మేనేజర్
file-manager.plugin.description = పరికరంలోని ప్రతి ఫోల్డర్, ఫైల్: వాటిని తెరవండి, పేరు మార్చండి, తరలించండి, కాపీ చేయండి, తొలగించండి.
file-manager.plugin.how = "ఫైల్ మేనేజర్ మీ పుస్తకాలే కాకుండా పరికర నిల్వలోని ప్రతి ఫోల్డర్, ఫైల్ను చూపుతుంది; వాటిని తెరవడానికి, పేరు మార్చడానికి, తరలించడానికి, కాపీ చేయడానికి, తొలగించడానికి, కొత్త ఫోల్డర్లు సృష్టించడానికి వీలు కల్పిస్తుంది.\n\nసాధనాల మెనూ నుండి ఫైళ్లు తెరవండి. ఫోల్డర్లోకి వెళ్లడానికి దాన్ని నొక్కండి; వెనుకకు పై ఫోల్డర్కు వెళ్తుంది. ఫైల్తో ఏమి చేయవచ్చో చూడటానికి దాన్ని నొక్కండి, లేదా ఏదైనా అంశాన్ని నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకోను నొక్కి పట్టుకోండి). తరలించు, కాపీ చేయి అంశాన్ని ఎంచుకుంటాయి: అది ఉండాల్సిన ఫోల్డర్కు వెళ్లి, కింది పట్టీలో ఇక్కడ అతికించు ఎంచుకోండి. బటన్లతో, పట్టీని చేరడానికి చివరి అంశం నుండి కిందికి నొక్కండి.\n\nPaperPaw సొంత డేటా వంటి చుక్కతో మొదలయ్యే ఫైళ్లు, ఫోల్డర్లు దాచబడి ఉంటాయి. వాటిని చూడటానికి సెట్టింగులలో లైబ్రరీ కింద దాచిన ఫైళ్లు ఆన్ చేయండి."
