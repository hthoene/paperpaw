home.plugin.name = హోమ్ స్క్రీన్
home.plugin.description = ప్రారంభ పేజీ: చదువుతున్న పుస్తకం, సాధనాలు వంటి విడ్జెట్ల పేజీలు.
home.plugin.how = "హోమ్ స్క్రీన్ పేజీలతో ఉంటుంది, ఫోన్లో లాగా ప్రతి పేజీ విడ్జెట్లు, సాధనాల గ్రిడ్. మొదట గడియారం, చదువుతున్న పుస్తకం, ఇటీవల చదివినవి ఒక పేజీలో, అన్ని సాధనాలు తర్వాతి పేజీలో ఉంటాయి.\n\nఅంశాన్ని తెరవడానికి నొక్కండి; పేజీ మార్చడానికి స్వైప్ చేయండి లేదా పేజీ బటన్లు వాడండి. బటన్లతో మాత్రమే అయితే బాణం బటన్లు ఒక అంశం నుండి మరోదానికి వెళ్తాయి, “ఎంచుకో” దాన్ని తెరుస్తుంది.\n\nమార్చడానికి హోమ్ స్క్రీన్ను నొక్కి పట్టుకోండి, పేజీ కింద పెన్సిల్ను నొక్కండి లేదా మెనూలో “హోమ్ స్క్రీన్ను సవరించు” ఎంచుకోండి. అంశాలను లాగి తరలించండి, లేదా ఎంపికల కోసం ఒకదాన్ని నొక్కండి (బటన్లతో కూడా); “విడ్జెట్ జోడించు” కూడా అక్కడే. “నిలువు వరుసలు”, “అడ్డు వరుసలు” సెట్టింగులలో “రూపం” › “హోమ్ స్క్రీన్”లో ఉన్నాయి.\n\nఅడ్డంగా తిప్పిన స్క్రీన్పై అవే అంశాలు ఎక్కువ నిలువు వరుసలతో, సుమారు 110 mm కంటే వెడల్పు కాని కార్డులతో కనిపిస్తాయి; నిలువుగా చేసిన అమరిక మారదు. అడ్డంగా అమరిస్తే ఆ లేఅవుట్ ఆ దిశకు విడిగా ఉంచబడుతుంది; కొత్త విడ్జెట్లు రెండింటికీ చేరతాయి. సవరించేటప్పుడు “జోడించు”లోని “అడ్డం లేఅవుట్ రీసెట్ చేయి” మళ్లీ ఆటోమేటిక్ లేఅవుట్కు వెళ్తుంది. ఒక దిశలో తీసివేసినది మరో దిశలో ఉంటుంది."
