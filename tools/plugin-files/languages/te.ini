opds.plugin.name = OPDS కేటలాగ్లు
opds.plugin.description = OPDS కేటలాగ్లను బ్రౌజ్ చేస్తుంది, వాటి పుస్తకాలను డౌన్లోడ్ చేస్తుంది, ఫోల్డర్లను వాటితో సింక్లో ఉంచుతుంది.
opds.plugin.how = "OPDS కేటలాగ్లు Project Gutenberg, Calibre-Web, Kavita లేదా Komga వంటి ఆన్లైన్ లైబ్రరీలు. ఈ ప్లగిన్ వాటిని ఫోల్డర్లలా బ్రౌజ్ చేసి, వెతికి, వాటి పుస్తకాలను లైబ్రరీలోకి డౌన్లోడ్ చేస్తుంది.\n\nసాధనాల మెనూ నుండి కేటలాగ్లు తెరిచి కేటలాగ్ జోడించు ఎంచుకోండి: ఒక చిరునామా, కేటలాగ్కు ఖాతా అవసరమైతే వినియోగదారు పేరు, పాస్వర్డ్. కేటలాగ్ను బ్రౌజ్ చేయడానికి దాన్ని నొక్కండి; సింక్ చేయడానికి, సవరించడానికి లేదా తీసివేయడానికి దాన్ని నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకో బటన్ను నొక్కి పట్టుకోండి).\n\nఈ కేటలాగ్ను సింక్ చేయి ఆన్లో ఉంటే, కేటలాగ్లను సింక్ చేయి దాని కొత్త పుస్తకాలను దాని ఫోల్డర్లోకి డౌన్లోడ్ చేస్తుంది. ఒక్కో సింక్కు పుస్తకాలు ఒక సింక్ ఎన్ని తెస్తుందో పరిమితం చేస్తుంది, దాంతో పెద్ద కేటలాగ్ పరికరాన్ని నింపదు. కేటలాగ్ బదులు క్లౌడ్ ఫోల్డర్ (WebDAV) కూడా పని చేస్తుంది."
