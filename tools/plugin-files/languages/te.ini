core.host-firmware.foreign = ఇది PaperPawను వేరే పరికర సాఫ్ట్వేర్తో భర్తీ చేస్తుంది. PaperPaw దానంతట అదే మళ్లీ ప్రారంభం కాదు.
core.host-firmware.no-undo = PaperPaw ఈ మార్పును రద్దు చేయలేదు. తిరిగి రావడానికి, ఆ ఇతర సాఫ్ట్వేర్ రికవరీ ఎంపికను ఉపయోగించండి లేదా వెబ్ ఫ్లాషర్తో PaperPawను మళ్లీ ఇన్స్టాల్ చేయండి.
core.host-firmware.kept = PaperPaw పరికరం మెమరీలో ఉంటుంది. మెమరీ కార్డులోని ఫైళ్లు మారవు.
core.host-firmware.unsigned = ఈ సాఫ్ట్వేర్కు సంతకం లేదు. దాని ఫైల్ నిర్మాణం, పరికర అనుకూలత మాత్రమే తనిఖీ చేయబడతాయి; దాని మూలం ధృవీకరించబడదు.
core.host-firmware.unknown-key = ఈ సాఫ్ట్వేర్ తెలియని కీతో సంతకం చేయబడింది. ఇక్కడ చూపిన కీని మీరు నమ్మితేనే ఇన్స్టాల్ చేయండి.
core.host-firmware.downgrade = ఈ పాత వెర్షన్ మునుపటి వెర్షన్ను ఆటోమేటిక్గా పునరుద్ధరించలేదు. తిరిగి రావడానికి, వెబ్ ఫ్లాషర్తో PaperPawను మళ్లీ ఇన్స్టాల్ చేయండి.
core.host-firmware.early-crash = కొత్త సాఫ్ట్వేర్ తన ప్రారంభ భద్రతా తనిఖీకి ముందే క్రాష్ అయితే, పరికరం ప్రారంభం కాకపోవచ్చు. PaperPawను పునరుద్ధరించడానికి మీకు వెబ్ ఫ్లాషర్ అవసరం.
core.host-remove.question = {name}ను తీసివేయాలా? దాని సేవ్ చేసిన డేటాను ఏమి చేయాలి?
