calendar.plugin.name = క్యాలెండర్
calendar.plugin.description = పరికరంలో మీ క్యాలెండర్లు: CalDAV, iCal, ఫైళ్ల నుండి ఎజెండా, రోజు, వారం, నెల వీక్షణలు, కాంటాక్ట్ల పుట్టినరోజులు, హోమ్ విడ్జెట్లు, నిద్ర స్క్రీన్.
calendar.plugin.how = "పరికరంలో మీ క్యాలెండర్లు: రాబోయే రోజుల ఎజెండా, రోజు, వారం, నెల. CalDAV క్యాలెండర్లు (Nextcloud మొదలైనవి), iCal చిరునామాలు (.ics, webcal://), కార్డులోని క్యాలెండర్ ఫైళ్లు, కాంటాక్ట్ల (CardDAV) పుట్టినరోజులు. పరికరం క్యాలెండర్లను చదువుతుంది మాత్రమే, ఎప్పుడూ మార్చదు.\n\nసాధనాల మెనూ నుండి క్యాలెండర్ తెరవండి. వీక్షణ మార్చడానికి, క్యాలెండర్ జోడించడానికి, సింక్ చేయడానికి మొదటి వరుసను ఎంచుకోండి, ఏదైనా వరుసను నొక్కి పట్టుకోండి లేదా మెనూ నొక్కండి. రోజు, వారంలో మొదటి రెండు వరుసలు, పేజీ బటన్లు ముందు, తర్వాతి రోజు లేదా వారానికి వెళ్తాయి; నెలలో బాణం బటన్లు రోజును, పేజీ బటన్లు నెలను మారుస్తాయి. ఈవెంట్పై ఎంచుకో దాన్ని పూర్తిగా చూపుతుంది.\n\nక్యాలెండర్లు కింద (మెనూలో, లేదా సెట్టింగులలో క్యాలెండర్) క్యాలెండర్ జోడించండి: CalDAV ఖాతా (సర్వర్ చిరునామా చాలు), iCal చిరునామా, కార్డులోని ఫైల్ లేదా కాంటాక్ట్లు. చిరునామా, ఖాతాకు వినియోగదారు పేరు, పాస్వర్డ్ (యాప్ పాస్వర్డ్ మంచిది), పేరు నమోదు చేయండి. గరిష్ఠంగా ఆరు క్యాలెండర్లు, ఒక్కోదానికి మార్చగల గుర్తు.\n\nపునరావృత, రోజంతా, ఇతర సమయ మండలాల ఈవెంట్లు పరికరం గడియారం ప్రకారం కనిపిస్తాయి. ఈ రోజుకు ముందు, తర్వాత అరవై రోజుల ఈవెంట్లు (గరిష్ఠంగా 240) నెట్వర్క్ లేకుండా కనిపిస్తాయి.\n\nక్యాలెండర్ తెరిచినప్పుడు, ఇప్పుడే సింక్ చేయి ఎంచుకున్నప్పుడు, సెట్టింగుల ప్రకారం నెట్వర్క్ ఆన్లో ఉన్నప్పుడు లేదా ఛార్జింగ్ మొదలైనప్పుడు క్యాలెండర్లు చదవబడతాయి.\n\nహోమ్ స్క్రీన్ విడ్జెట్లు (హోమ్ స్క్రీన్ను నొక్కి పట్టుకోండి): ఈ రోజు, తర్వాతి ఈవెంట్, ఎజెండా, నెల, పుట్టినరోజులు. నిద్ర స్క్రీన్ ఈ రోజు ఎజెండాను చూపగలదు: సెట్టింగులలో నిద్ర స్క్రీన్ కింద క్యాలెండర్ ఎంచుకోండి."
