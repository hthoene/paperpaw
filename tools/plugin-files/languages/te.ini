rules.plugin.name = నియమాలు
rules.plugin.description = ఏదైనా జరిగినప్పుడు, ఏదో ఒకటి చేస్తుంది: ఉదా. 22:00కు రాత్రి మోడ్.
rules.plugin.how = "ఏదైనా జరిగినప్పుడు ఒక నియమం దానంతట అదే ఏదో చేస్తుంది: ప్రతిరోజు 22:00కు రాత్రి మోడ్ ఆన్, లేదా PaperPaw మొదలైనప్పుడు కేటలాగ్లను సింక్ చేయడం.\n\nనియమాలు సెట్టింగులలో అనుకూలీకరించు కింద, నియమాలుగా ఉంటాయి. నియమాన్ని జోడించు ఎప్పుడు? (PaperPaw మొదలైనప్పుడు, రోజులో ఒక సమయం, పుస్తకం తెరిచినప్పుడు లేదా మూసినప్పుడు, బ్యాటరీ, ఛార్జింగ్, ఒక స్విచ్, ఇంకా మరిన్ని) మరియు అప్పుడు ఏమి? (ఒక చర్యను అమలు చేయడం, స్విచ్ను ఆన్ లేదా ఆఫ్ చేయడం, సంఖ్యను సెట్ చేయడం, సందేశం చూపడం) అని అడుగుతుంది. నియమాన్ని పాజ్ చేయడానికి దాన్ని నొక్కండి; రెండు సమయాల మధ్య వంటి షరతు కోసం, లేదా తీసివేయడానికి దాన్ని నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకో నొక్కి పట్టుకోండి).\n\nఎంచుకోవాల్సిన చర్యలు, స్విచ్లు, సంఖ్యలు ప్లగిన్ వారీగా ఉంటాయి: ప్లగిన్ను ఎంచుకుని, అది అందించేదాన్ని ఎంచుకోండి; వెనుకకు మళ్లీ బయటకు తీసుకువెళ్తుంది. వెనుకకు లేదా తర్వాతి పేజీ వంటి, చూపుతున్న స్క్రీన్పై పనిచేసే చర్య, అక్కడ నొక్కితే ఏమి చేస్తుందో అదే చేస్తుంది.\n\nఏ స్క్రీన్ తెరిచి ఉన్నా సమయాలు వర్తిస్తాయి. ఒకదాన్ని మరొకటి రద్దు చేస్తూ ఉండే రెండు నియమాలు కొన్ని దశల తర్వాత ఆగిపోతాయి."
