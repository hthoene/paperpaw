format-cbz.setting.panels.help = ఒకసారి ఒక ప్యానెల్, పేజీ తిప్పడం వాటి గుండా వెళ్తుంది.
format-docx.plugin.name = DOCX పత్రాలు
format-docx.plugin.description = Word, ఇతర ప్రోగ్రామ్లు సేవ్ చేసే .docx ఫైళ్లను తెరుస్తుంది.
format-docx.plugin.how = ".docx పత్రాలను పుస్తకాలుగా తెరుస్తుంది: విషయ సూచికతో శీర్షికలు, జాబితాలు, పట్టికలు, బోల్డ్, ఇటాలిక్, లింక్లు, చిత్రాలు (JPEG, PNG, GIF).\n\nఫైళ్లను లైబ్రరీ ఫోల్డర్లో పెట్టి లైబ్రరీ నుండి తెరవండి. శీర్షిక, రచయిత పత్రం లక్షణాల నుండి వస్తాయి. ఫుట్ నోట్లు, హెడర్లు, ఫుటర్లు, వ్యాఖ్యలు కనిపించవు."
format-docx.title = DOCX పత్రం
format-epub.plugin.name = EPUB
format-epub.plugin.description = EPUB పుస్తకాలను వాటి స్టైళ్లు, విషయ సూచిక, చిత్రాలతో తెరుస్తుంది.
format-epub.plugin.how = "EPUB పుస్తకాలు ఇతర పుస్తకాల్లాగే లైబ్రరీ నుండి తెరుచుకుంటాయి, వాటి విషయ సూచిక, చిత్రాలు, ప్రచురణకర్త స్టైలింగ్తో. వెబ్ పేజీలు (HTML), Markdown, FictionBook (.fb2), కామిక్ పుస్తక ఆర్కైవ్లు (.cbz) కూడా అలాగే తెరుచుకుంటాయి, ఒక్కొక్కటి దాని సొంత ప్లగిన్గా.\n\nఅధ్యాయాన్ని మొదటిసారి తెరిచినప్పుడు అది మార్చబడి ప్లగిన్ క్యాష్లో ఉంచబడుతుంది, కాబట్టి తర్వాత వేగంగా తెరుచుకుంటుంది, చిన్న పరికరాల్లో పెద్ద పుస్తకాలు కూడా పని చేస్తాయి. విషయ సూచిక చదివే మెనూలో విషయాలు కింద ఉంటుంది. పుస్తకం సొంత స్టైలింగ్ వర్తించాలా అనేది చదవడం కింద ప్రచురణకర్త ఫార్మాటింగ్ సెట్టింగ్."
format-epub.title = EPUB ఇ-పుస్తకం
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = FictionBook పుస్తకాలను (.fb2, zip చేసినవి కూడా) తెరుస్తుంది.
format-fb2.plugin.how = "రష్యన్, ఇతర పుస్తకాలకు సాధారణమైన FictionBook పుస్తకాలను (.fb2), zip చేసినవి (.fb2.zip) కూడా, వాటి శీర్షిక, రచయితలు, కవర్, అధ్యాయాలతో తెరుస్తుంది.\n\nవాటిని లైబ్రరీ ఫోల్డర్లో పెట్టండి; అవి లైబ్రరీలో కనిపించి ఇతర పుస్తకాల్లాగే తెరుచుకుంటాయి."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = ఫైళ్లుగా సేవ్ చేసిన వెబ్ పేజీలను తెరిచి, చదవాల్సినది మాత్రమే చూపుతుంది.
format-html.plugin.how = "ఫైళ్లుగా సేవ్ చేసిన వెబ్ పేజీలను (.html, .htm, .xhtml) పుస్తకాలుగా తెరుస్తుంది: చదవాల్సినది మాత్రమే, చుట్టూ ఉండే మెనూలు, ప్రకటనలు వంటివి లేకుండా.\n\nఫైల్ను లైబ్రరీ ఫోల్డర్లో పెట్టి ఏ పుస్తకంలాగే లైబ్రరీ నుండి తెరవండి. పేజీలోని లింక్లు పని చేస్తాయి; చిత్రాలు ఫైల్లో ఉన్న చోటే కనిపిస్తాయి."
format-html.title = వెబ్ పేజీ (HTML)
format-images.plugin.name = చిత్రాలు
format-images.plugin.description = చిత్రాలను (.jpg, .png, .gif) పుస్తకాలుగా, ఒక్కో పేజీగా తెరుస్తుంది.
format-images.plugin.how = "చిత్రాలు (.jpg, .png, .gif) పుస్తకాల్లాగే లైబ్రరీ నుండి తెరుచుకుంటాయి, పేజీకి ఒక చిత్రం, స్క్రీన్కు సరిపడేలా.\n\nచిత్రాల ఫోల్డర్ మొత్తం చదవడానికి దాని మొదటి చిత్రాన్ని తెరవండి: ఫోల్డర్లో దాని తర్వాతి చిత్రాలు వాటి పేర్ల క్రమంలో (10కి ముందు 2) వస్తాయి. ఫోల్డర్లో తర్వాతి చిత్రం తెరిస్తే అక్కడి నుండి మొదలవుతుంది; ప్రతిదానిలో స్థానం వేరుగా గుర్తుంచుకోబడుతుంది. 300 వరకు చిత్రాలున్న ఫోల్డర్ మీరు తెరిచిన చిత్రం నుండి చదవబడుతుంది.\n\nచిత్రం కాని, లేదా చాలా పెద్దదైన ఫైల్ బదులుగా దాని పేరును చూపుతుంది. సొంత శీర్షికతో చాలా చిత్రాలున్న పుస్తకానికి కామిక్ పుస్తక ఆర్కైవ్ (.cbz) మెరుగైన రూపం."
format-images.title = చిత్రం
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Markdown ఫైళ్లను (.md), ఉదా. గమనికలను, తెరుస్తుంది.
format-markdown.plugin.how = "Markdown ఫైళ్లను (.md), గమనికల వంటివాటిని, పుస్తకాలుగా తెరుస్తుంది: శీర్షికలు, జాబితాలు, కోట్లు, ఉద్ఘాటన గుర్తులుగా కాకుండా ఉద్దేశించినట్లుగా.\n\nఫైళ్లను లైబ్రరీ ఫోల్డర్లో పెట్టి లైబ్రరీ నుండి తెరవండి. మొదటి శీర్షిక దాని పేరు; ఫైల్ పక్కన ఉన్న చిత్రాలు టెక్స్ట్ వాటిని పేర్కొన్న చోట కనిపిస్తాయి."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI పుస్తకాలు
format-mobi.plugin.description = DRM లేని .mobi, .azw ఫైళ్లను తెరుస్తుంది.
format-mobi.plugin.how = "MOBI పుస్తకాలు (.mobi, .azw) లైబ్రరీ నుండి ఏ పుస్తకంలాగైనా తెరుచుకుంటాయి, సెటప్ ఏమీ అవసరం లేదు. శీర్షిక, రచయితలు, భాష, కవర్ పుస్తకం నుండే వస్తాయి; విషయ సూచిక దాని శీర్షికల నుండి తయారవుతుంది.\n\nమొదటిసారి తెరిచినప్పుడు పుస్తకం మార్చబడుతుంది, పొడవైన పుస్తకానికి కొన్ని సెకన్లు పడుతుంది; ఆ తర్వాత వెంటనే తెరుచుకుంటుంది. టెక్స్ట్, శీర్షికలు, బోల్డ్, ఇటాలిక్, లింకులు, చిత్రాలు కనిపిస్తాయి.\n\nDRM ఉన్న పుస్తకాలు (షాపులో కొన్నవి చాలావరకు), Huffman కంప్రెషన్ ఉన్నవి, కొత్త KF8 రూపంలోనివి (.azw3) తెరుచుకోవు: తెరిచినప్పుడు PaperPaw ఆ విషయం చెబుతుంది. Calibre వంటి సాధనంతో చేసిన EPUB కాపీ ఎప్పుడూ తెరుచుకుంటుంది."
format-mobi.title = MOBI పుస్తకాలు
format-rtf.plugin.name = RTF పత్రాలు
format-rtf.plugin.description = .rtf ఫైళ్లను పుస్తకాలుగా తెరుస్తుంది.
format-rtf.title = RTF పత్రాలు
format-txt.plugin.name = సాదా టెక్స్ట్
format-txt.plugin.description = సాదా టెక్స్ట్ ఫైళ్లను (.txt) తెరుస్తుంది.
format-txt.plugin.how = "సాదా టెక్స్ట్ ఫైళ్లు (.txt) లైబ్రరీ నుండి ఏ పుస్తకంలాగైనా తెరుచుకుంటాయి, సెటప్ ఏమీ అవసరం లేదు. ప్లగిన్ UTF-8, UTF-16, Windows-1252 టెక్స్ట్ను చదువుతుంది, ఎన్కోడింగ్ను తనంతట తానే గుర్తిస్తుంది.\n\nఫైల్లోని ఖాళీ పంక్తుల ప్రకారం పేరాలు ఏర్పడతాయి; ఖాళీ పంక్తులు లేకపోతే, ప్రతి పంక్తీ ఒక పేరా. Project Gutenberg ఫైళ్లలో మొదట్లో, చివర్లో ఉండే లైసెన్స్ టెక్స్ట్ వదిలివేయబడుతుంది, శీర్షిక, రచయిత హెడర్ నుండి తీసుకోబడతాయి.\n\nఫైల్ ఎప్పుడూ పూర్తిగా లోడ్ కాదు, కాబట్టి చాలా పెద్ద టెక్స్ట్లు కూడా చిన్న పరికరాలపై తెరుచుకుంటాయి."
format-txt.title = సాదా టెక్స్ట్
format-xtc.plugin.name = XTC
format-xtc.plugin.description = XTC, XTCH పుస్తకాలను తెరుస్తుంది: Xteink రీడర్ల కోసం ముందే తయారైన పేజీలు.
format-xtc.plugin.how = "XTC, XTCH ఫైళ్లు అంటే Xteink రీడర్ల కోసం కన్వర్టర్లు తయారు చేసిన, పేజీలు ముందే చిత్రాలుగా ఉన్న పుస్తకాలు. అవి లైబ్రరీ నుండి ఏ పుస్తకంలాగైనా తెరుచుకుంటాయి.\n\nప్రతి పేజీ స్థిరమైన చిత్రం కాబట్టి, టెక్స్ట్ పరిమాణం మార్చడం లేదా వేరే ఫాంట్ వాడడం సాధ్యం కాదు. పేజీలు నలుపు-తెలుపులో లేదా నాలుగు బూడిద రంగుల్లో ఉంటాయి. ప్రతి పేజీ చూపించేటప్పుడే డీకోడ్ అవుతుంది, కాబట్టి X4లో కూడా తక్కువ మెమరీ సరిపోతుంది.\n\nఫైల్లో ఉంటే శీర్షిక, రచయిత, అధ్యాయాలు దాని నుండి తీసుకోబడతాయి."
format-xtc.title = XTC పేజీలు
help.plugin.name = సూచనలు
help.plugin.description = స్క్రీన్ మొదటిసారి తెరిచినప్పుడు దాని నియంత్రణలు ఏమి చేస్తాయో చూపుతుంది.
help.plugin.how = "స్క్రీన్ మొదటిసారి తెరిచినప్పుడు, దానిపై ఒక చిన్న గమనిక దాని నియంత్రణలు ఏమి చేస్తాయో చెబుతుంది: నొక్కితే స్పందించే స్క్రీన్ భాగాలు ఫ్రేమ్తో, బటన్లు ఏమి చేస్తాయో.\n\nఒకసారి నొక్కితే లేదా ఏ బటన్ అయినా గమనిక మూసుకుంటుంది, ఆ స్క్రీన్కు అది మళ్లీ రాదు. “ఇక సూచనలు వద్దు” అన్నింటినీ ఆఫ్ చేస్తుంది.\n\nసెట్టింగులలో “సిస్టమ్” కింద “సూచనలు” వాటిని ఆన్ లేదా ఆఫ్ చేస్తుంది, “సూచనలను మళ్లీ చూపు” ప్రతి స్క్రీన్ గమనికను ఇంకోసారి చూపిస్తుంది."
