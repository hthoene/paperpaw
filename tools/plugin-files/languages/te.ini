update.plugin.description = కార్డు నుండి లేదా ఇంటర్నెట్ నుండి డౌన్లోడ్ చేసిన ఫర్మ్వేర్ అప్డేట్లను ఇన్స్టాల్ చేస్తుంది.
update.plugin.how = "X4 లాగా PaperPaw ఫర్మ్వేర్ అయిన పరికరాల్లో అప్డేట్ కొత్త ఫర్మ్వేర్ను ఇన్స్టాల్ చేస్తుంది. ఇది సెట్టింగులలో అప్డేట్గా ఉంటుంది.\n\nఆన్లైన్లో వెతుకు కొత్త PaperPawను అప్డేట్ సర్వర్ నుండి డౌన్లోడ్ చేస్తుంది (Wi-Fiలో కొన్ని నిమిషాలు). లేదా paperpaw.org నుండి .bin అప్డేట్ ఫైల్ను కార్డులోని updates ఫోల్డర్లోకి కాపీ చేయండి (ఉదా. Wi-Fi బదిలీతో). తర్వాత ఇన్స్టాల్ సుమారు ఒక నిమిషం పడుతుంది, పరికరం రీస్టార్ట్ అవుతుంది; పుస్తకాలు, సెట్టింగులు, చదివిన స్థానాలు అలాగే ఉంటాయి.\n\nఅప్డేట్ల కోసం చూడు ఆన్లో ఉంటే (మొదట ఆఫ్), Wi-Fi ఆన్లో ఉన్నప్పుడు లేదా ఛార్జ్ అవుతున్నప్పుడు పరికరం వారానికి ఒకసారి స్వయంగా అడుగుతుంది. కొత్త వెర్షన్ ఇక్కడ వేచి ఉంటుంది; చదవడానికి అంతరాయం ఉండదు. వెతుకులాట పరికరం నడుపుతున్నది మాత్రమే పంపుతుంది, పేరు లేదా సంఖ్య కాదు; లెక్కింపు కోసం, మీరు అడిగారా, ఇది రోజు, వారం లేదా నెలలో మొదటి వెతుకులాటా అనేది కూడా.\n\nమీరు వాడే ప్లగిన్లకు కొత్త విడుదల వెర్షన్ ఇంకా లేకపోతే అప్డేట్ వాటి కోసం వేచి ఉంటుంది. పాత వెర్షన్ మీరు ఎంచుకుంటేనే ఇన్స్టాల్ అవుతుంది.\n\nCrossPoint లాంటి వేరే ఫర్మ్వేర్ను కూడా దాని .bin ఫైల్ను updates ఫోల్డర్లో పెట్టి అప్డేట్ నుండి ఇన్స్టాల్ చేయవచ్చు. అది ఈ పరికరం కోసం పాడవని పూర్తి ఫర్మ్వేర్ అని PaperPaw తనిఖీ చేస్తుంది, కానీ సంతకం లేనందున ఎవరు చేశారో చెప్పలేదు. అయినా ఇన్స్టాల్ చేయి దాన్ని ఫ్లాష్ మరో సగంలో రాస్తుంది; PaperPaw తన సగంలో ఉంటుంది. PaperPawకు తిరిగి రావడానికి, దాని ఇన్స్టాల్ ఫైల్ను (paperpaw-<device>-<version>-install.bin) ఆ ఫర్మ్వేర్ మెనూ నుండి (ఉదా. CrossPoint SD ఫర్మ్వేర్ అప్డేట్) ఇన్స్టాల్ చేయండి."
