files.plugin.name = ఫైల్ బ్రౌజర్
files.plugin.description = పరికరంలోని పుస్తకాలు, ఫోల్డర్ల జాబితా చూపి వాటిని తెరుస్తుంది.
files.plugin.how = "లైబ్రరీ మీ లైబ్రరీ ఫోల్డర్లోని పుస్తకాలను వాటి కవర్, శీర్షిక, రచయిత, ఎంతవరకు చదివారో చూపుతుంది. చివరిగా చదివిన పుస్తకం పైన కార్డుగా ఉంటుంది, కాబట్టి చదవడం కొనసాగించడానికి ఒక్క నొక్కు, లేదా ఎంచుకో ఒక్కసారి నొక్కడం చాలు. లైబ్రరీ పుస్తకాల కోసం వెతుకుతున్నప్పుడు ఇప్పటివరకు ఎన్ని కనిపించాయో చెబుతుంది.\n\nపుస్తకాల పైన ఏమి చూపాలో ఎంచుకోండి: అన్నీ, చదువుతున్నవి, చదవనివి, పూర్తయినవి, లేదా అరలు (రచయిత, సిరీస్, ట్యాగ్, ఇష్టమైనవి, మీరు మొదలుపెట్టిన ప్రతి సిరీస్లోని తర్వాతి పుస్తకం). చదవడానికి పుస్తకాన్ని నొక్కండి; దాన్ని తెరవడానికి, పూర్తయినట్లు లేదా చదవనట్లు గుర్తించడానికి, సమాచారం చూడటానికి, ఆర్కైవ్కు తరలించడానికి లేదా తొలగించడానికి నొక్కి పట్టుకోండి (బటన్లతో: ఎంచుకోను నొక్కి పట్టుకోండి). లైబ్రరీ మెనూ కోసం శీర్షికను నొక్కండి: క్రమం, చూపే విధానం, వెతుకు, లైబ్రరీ ఫోల్డర్, సెట్టింగులు.\n\nలైబ్రరీ ఫోల్డర్ సెట్టింగులలో లైబ్రరీ కింద లైబ్రరీ ఫోల్డర్గా సెట్ అవుతుంది; అక్కడ పుస్తకాలను కవర్ల గ్రిడ్గా కూడా చూపవచ్చు. మిగతా ఫైళ్ల కోసం సాధనాల మెనూలో ఫైళ్లు ఉపయోగించండి."
