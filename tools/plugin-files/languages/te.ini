store.source.invalid = అది మూలం చిరునామా కాదు. అది https://తో మొదలై, ఒక plugins.jsonను సూచిస్తుంది.
store.source.is-official = PaperPaw సొంత లైబ్రరీ ఎప్పుడూ ఉంటుంది.
store.source.full = ఇప్పటికే 8 మూలాలు ఉన్నాయి. ముందుగా ఒకదాన్ని తీసివేయండి.
