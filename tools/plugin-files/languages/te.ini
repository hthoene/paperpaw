keys.plugin.name = బటన్లు, సంజ్ఞలు
keys.plugin.description = ప్రతి బటన్, నొక్కే ప్రాంతం, స్వైప్ ఏమి చేస్తుందో; పరికరంపైనే మార్చవచ్చు.
keys.plugin.how = "“బటన్లు, సంజ్ఞలు” ప్రతి బటన్, నొక్కే ప్రాంతం, స్వైప్ ఏమి చేస్తుందో చూపుతుంది, దాన్ని పరికరంపైనే మార్చనిస్తుంది.\n\nదీన్ని సెట్టింగులలో “పరికరం” కింద తెరవండి. ముందుగా మార్పు ఎక్కడ వర్తిస్తుందో ఎంచుకోండి: “అన్నిచోట్లా”, “చదివేటప్పుడు”, “హోమ్ స్క్రీన్పై”, “లైబ్రరీలో” లేదా ఒక సాధనంలో. తర్వాత నొక్కి పట్టుకున్న బటన్ లేదా అంచు నుండి స్వైప్ వంటి ఒక ఇన్పుట్ను ఎంచుకుని, జాబితా నుండి ఒక చర్యను ఎంచుకోండి (జాబితాలో వెతకవచ్చు). “ప్రామాణికంగా” ప్లగిన్లు, బటన్ లేఅవుట్ సెట్ చేసినదాన్ని తిరిగి ఇస్తుంది.\n\nX4లో, ఎంచుకోవడానికి, వెనక్కి వెళ్లడానికి లేదా ముందుకు వెళ్లడానికి ఏ బటన్నూ మిగల్చని మార్పు తిరస్కరించబడుతుంది. చివర ఉన్న “బటన్లు, సంజ్ఞలను రీసెట్ చేయి” ప్రతి మార్పునూ వెనక్కి తీసుకుంటుంది."
