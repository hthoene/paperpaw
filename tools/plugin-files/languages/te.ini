fonts-browser.plugin.name = మరిన్ని ఫాంట్లు
fonts-browser.plugin.description = ఇంటర్నెట్ నుండి ఫాంట్లను, ఒక్కొక్కటి నమూనాతో చూపి, చదవడానికి వాటిని డౌన్లోడ్ చేస్తుంది.
fonts-browser.plugin.how = "మరిన్ని ఫాంట్లు ఇంటర్నెట్లోని ఫాంట్ లైబ్రరీ నుండి ఫాంట్లను, ప్రతి పేరు దాని సొంత ఫాంట్లో, చూపుతుంది; మీరు చదవాలనుకునేవాటిని డౌన్లోడ్ చేస్తుంది.\n\nఇది సెట్టింగులలో చదవడం కింద ఫాంట్ జాబితా చివర ఉంటుంది; స్థితి పట్టీల ఫాంట్ జాబితాలో కూడా. ఫాంట్ను నొక్కండి (బటన్లతో: ఎంచుకో), నమూనా వాక్యంతో పెద్దగా చూసి, డౌన్లోడ్ ఎంచుకోండి. డౌన్లోడ్ అవుతుండగా పేజీ వదిలి వెళ్లవచ్చు. పూర్తయ్యాక (ఫాంట్ పేరు)తో చదువు, లేదా స్థితి పట్టీలకు ఉపయోగించు ఎంచుకోండి. అప్డేట్ కొత్త వెర్షన్ తెస్తుంది, తీసివేయి ఫాంట్ను పరికరం నుండి తొలగిస్తుంది. దీనికి Wi-Fi అవసరం.\n\nమీ సొంత ఫాంట్లు\n\nఅదే జాబితాలో మీ సొంత ఫాంట్లు ఉంది. సొంత ఫాంట్ అంటే .ttf లేదా .otf ఫైల్, ఉదా. Google Fonts నుండి.\n\nAndroid, ఫాంట్ ఫైళ్లను గీయగల ఇతర పరికరాల్లో: ఫైల్ను fonts ఫోల్డర్లోకి కాపీ చేయండి (Androidలో: షేర్డ్ నిల్వలో PaperPaw/fonts), PaperPawను రీస్టార్ట్ చేసి సెట్టింగులలో ఫాంట్ ఎంచుకోండి.\n\nXteink X4, X4 Proలో: మెమరీ సరిపోనందున ఇవి ఫాంట్ ప్యాక్లను చదువుతాయి. కంప్యూటర్లో paperpaw-fontgenతో ప్యాక్ తయారు చేయండి (regular తప్పనిసరి):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nఇది plugins/font-my-font ఫోల్డర్ను తయారు చేస్తుంది. దాన్ని మెమరీ కార్డులోని plugins ఫోల్డర్లోకి కాపీ చేసి, రీస్టార్ట్ చేసి, ఫాంట్గా My Font ఎంచుకోండి. వదిలేసిన స్టైళ్లు regularలో గీయబడతాయి. ఫాంట్లో మీ పుస్తకం లిపి అక్షరాలు ఉండాలి: --chars latin,cyrillic,greek లిపులను జోడిస్తుంది. మరిన్ని ఫాంట్లలోని ఫాంట్లకు కంప్యూటర్ అవసరం లేదు.\n\ne-ink ప్యానెల్పై చిన్న టెక్స్ట్ మరింత స్పష్టంగా ఉండాలంటే --hinting light జోడించండి; --hinting normal, --hinting mono మరింత బలంగా సరిపెడతాయి. అరబిక్, దేవనాగరి, తెలుగు వంటి గుర్తులున్న లిపులకు hinting లేకుండా ఉంచడం మంచిది."
