settings.plugin.name = సెట్టింగులు
settings.plugin.description = ప్రతి ప్లగిన్ సెట్టింగుల నుండి నిర్మించిన సెట్టింగుల పేజీలు.
settings.plugin.how = "సెట్టింగులు PaperPawలో, దాని ప్లగిన్లలో సెట్ చేయగలిగే ప్రతిదాన్నీ పేజీలలో చూపుతుంది. ప్లగిన్లకు సొంత స్క్రీన్ అవసరం లేదు: అవి ప్రకటించేవి ఇక్కడ సమూహాలలో కనిపిస్తాయి, ప్రతి సెట్టింగ్ కింద దాని వివరణ ఉంటుంది.\n\nమెనూలోని సెట్టింగులతో దీన్ని తెరవండి. సమూహాన్ని తెరవడానికి దాన్ని నొక్కండి, తర్వాత సెట్టింగ్ను మార్చడానికి లేదా ఎంచుకోవడానికి దాన్ని నొక్కండి; సంఖ్యలకు − మరియు + బటన్లు ఉంటాయి. బటన్లతో: సెట్టింగ్కు వెళ్లి ఎంచుకో నొక్కండి: ఎడమ, కుడి సంఖ్యను మారుస్తాయి, ఎంచుకో దాన్ని ఉంచుతుంది, వెనుకకు మునుపటి విలువకు తిరిగి వెళ్తుంది.\n\nమార్పులు వెంటనే వర్తిస్తాయి. వెతుకు పదాలతో సెట్టింగ్ను కనుగొంటుంది, అధునాతన సెట్టింగులు అరుదుగా అవసరమయ్యే వాటిని జోడిస్తుంది. ప్రామాణికాలకు రీసెట్ చేయి, అన్నీ రీసెట్ చేయి ముందుగా అడుగుతాయి."
