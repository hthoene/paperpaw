files.plugin.name = Filbrowser
files.plugin.description = Viser bøkene og mappene på enheten og åpner dem.
files.plugin.how = "Biblioteket viser bøkene i biblioteksmappen din med omslag, tittel, forfatter og hvor langt du har lest. Den boken du sist leste, står øverst som et kort, så du kan lese videre med ett trykk eller ett trykk på OK. Mens biblioteket leter etter bøker, viser det hvor mange det har funnet så langt.\n\nVelg over bøkene hva som vises: alle, dem du er i gang med, uleste eller ferdigleste, eller hyllene (etter forfatter, serie, emneord, favoritter, neste bok i hver serie du er begynt på). Trykk på en bok for å lese den; hold den nede (med knapper: hold OK) for å åpne den, markere den som lest eller ulest, se dens opplysninger, flytte den til arkivet eller slette den. Trykk på tittelen for biblioteksmenyen: sortering og visning, søk, biblioteksmappe og innstillinger.\n\nBiblioteksmappen velges i Innstillinger under Bibliotek som Biblioteksmappe; her kan du også vise bøkene som et gitter av omslag. Bruk Filer i menyen Verktøy til alle andre filer."
