vocabulary.sd.readme = "Øvelseskort fra filer\n\nLegg en fil her for hvert sett: Spansk.tsv oppretter settet Spansk.\nFiler: .tsv, .csv eller .txt, lagret som UTF-8, eller .apkg: et Anki-sett eksportert med Support older Anki versions markert. Notatenes første tre felter blir forside, bakside og eksempel; øvelsesplan og medier leses ikke, og PaperPaw skriver aldri til en Anki-fil.\n\nEtt kort pr. linje: forside, bakside og et valgfritt eksempel, atskilt av tabulator, komma eller semikolon. Første linje kan navngi kolonnene: front, back, example. Eksempel:\n\nKatze\tkatt\tDie Katze schläft.\n\nÅpne så Øvelseskort på leseren, velg Kort på SD-kortet og deretter Oppdater settene.\n\nGodt å vite:\n- Settene blir på leseren med det du har lært. En fil leses når den er ny eller endret, og dens kort legges til eller endres i settet.\n- Endre et korts bakside eller eksempel i filen: kortet endres og bevarer din fremgang.\n- Endre et korts forside: det teller som et nytt kort, og det gamle starter på nytt. Kort matches etter forsiden uten hensyn til mellomrom og store bokstaver. Lagre et sett i en fil (Kort på SD-kortet, Lagre settet på kortet), så får hvert kort et nummer i id-kolonnen: endre en forside der, behold filens første to linjer, og kortet bevarer din fremgang.\n- Lagring skriver settets kort. Innhold som ikke er kort (linjer utenforside), beholdes ikke; den tidligere filen kopieres til _name.bak.tsv.\n- Lagre filen som CSV UTF-8 (ikke UTF-16 eller regnearkets eget format). En fil over 4 MiB eller 20.000 linjer leses ikke: del den opp.\n- En linje slettet i filen sletter ikke kortet i settet, med mindre du slår på Fjern manglende kort for settet. Så fjernes kortet sammen med din fremgang.\n- Filer hvis navn starter med _, leses ikke.\n"
