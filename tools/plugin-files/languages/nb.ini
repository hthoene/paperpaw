update.plugin.name = Oppdatering
update.plugin.description = Installerer fastvareoppdateringer fra kortet eller hentet fra internett.
update.plugin.how = "Oppdatering installerer ny firmware på enheter hvor PaperPaw er firmwaren, f.eks. X4. Du finner den under Oppdatering i innstillingene.\n\nSøk på nett spør oppdateringsserveren etter en nyere PaperPaw og henter den. Det tar noen minutter over Wi-Fi. Eller kopier en oppdateringsfil (med endelsen .bin, fra paperpaw.org) til mappen updates på kortet, f.eks. med Wi-Fi-overføring. Installasjonen tar deretter omkring et minutt, og enheten starter på nytt; bøker, innstillinger og leseposisjoner beholdes.\n\nNår Søk etter oppdateringer er slått på (i innstillingene, av som standard), søker enheten selv omtrent én gang om uken, men kun når Wi-Fi allerede er slått på, eller enheten lades. En nyere PaperPaw som finnes, venter her; ingenting avbryter din lesing. Et søk sender hva enheten kjører, uten navn eller enhetsnummer; for å telle enheter sendes også om du bad om søket, og om det er dagens, ukens eller månedens første søk.\n\nHvis utvidelser du bruker, ennå ikke har en versjon for den nye utgaven, venter oppdateringen på dem. En eldre versjon installeres kun hvis du velger den.\n\nAnnen firmware, f.eks. CrossPoint, kan også installeres herfra: legg dens fil (med endelsen .bin) i mappen updates, og åpne Oppdatering. PaperPaw kontrollerer at det er en hel, ubeskadiget firmware til denne enheten, men kan ikke se, hvem som har laget den, da den ikke er signert. Installer likevel skriver den til den andre halvdelen av flashlageret, og enheten starter den; PaperPaw blir i sin halvdel, til den andre fastvaren installerer noe over den. For senere å vende tilbake til PaperPaw skal du installere dens installasjonsfil (paperpaw-<device>-<version>-install.bin) fra den andre fastvarens meny, f.eks. CrossPoints SD firmware update."
