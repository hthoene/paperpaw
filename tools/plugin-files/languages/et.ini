update.plugin.name = Värskendus
update.plugin.description = Paigaldab püsivara värskendusi, kaardilt või internetist allalaaditult.
update.plugin.how = "Värskendus paigaldab uue püsivara seadmetes, kus PaperPaw on püsivara, näiteks X4. Selle leiad seadetest nimega Värskendus.\n\nOtsi võrgust küsib värskendusserverilt uuemat PaperPaw ja laadib selle alla, mis võtab Wi-Fi kaudu paar minutit. Või kopeeri värskendusfail (lõpeb .bin, aadressilt paperpaw.org) kaardil olevasse kausta updates, näiteks Wi-Fi-ülekandega. Paigaldamine võtab siis umbes minuti ja seade taaskäivitub; raamatud, seaded ja lugemiskohad jäävad.\n\nValikuga Otsi värskendusi (seadetes, alguses väljas) küsib seade umbes kord nädalas ise, ainult siis, kui Wi-Fi on niikuinii sees või see laeb. Leitud uuem PaperPaw ootab siin; miski ei katkesta sinu lugemist. Otsing saadab selle, mida seade käitab, ilma selle nime või numbrita; seadmete loendamiseks ka seda, kas sa palusid ja kas see on päeva, nädala või kuu esimene otsing.\n\nKui sinu kasutatavatel pluginatel pole veel uuele väljalaskele versiooni, ootab värskendus neid. Vanem versioon paigaldatakse ainult siis, kui selle valid.\n\nTeine püsivara, näiteks CrossPoint, paigaldatakse siit samuti: pane selle fail (lõpeb .bin) kausta updates ja ava Värskendus. PaperPaw kontrollib, et see on terve püsivara selle seadme jaoks, kahjustamata, kuid ei saa öelda, kes selle tegi, kuna see pole allkirjastatud. Paigalda ikkagi kirjutab selle välkmälu teise poolde ja seade käivitab selle; PaperPaw jääb oma poolde, kuni see püsivara paigaldab midagi selle peale. Hilisemaks PaperPaw juurde naasmiseks paigalda selle paigaldusfail (paperpaw-<device>-<version>-install.bin) teise püsivara menüüst, näiteks CrossPointi SD-püsivara värskendusest."
