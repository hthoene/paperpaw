koreader.plugin.name = Esiletõstete jagamine
koreader.plugin.description = Jagab järjehoidjaid ja esiletõsteid KOReaderiga raamatute puhul, mida loed mõlemas.
koreader.plugin.how = "See plugin jagab järjehoidjaid ja esiletõsteid KOReaderiga raamatute puhul, mida loed mõlemas, ühes seadmes või seadmete vahel sünkroonitud raamatukogu kaustas. Midagi pole vaja seadistada.\n\nKui PaperPaw avab raamatu, mille on avanud ka KOReader, ning kui muudad selle järjehoidjaid või esiletõsteid, võtab see üle uue KOReaderi andmetest raamatu kõrval ja jätab siinse uue KOReaderile, et see selle võtaks järgmisel raamatu avamisel. Eemaldatud märgid ja muudetud märkmed lähevad samuti üle.\n\nSee töötab ainult EPUB-raamatute puhul. Kui ühe poole faili ei saa lugeda, ei muutu kummalgi poolel midagi, kuni seda saab."
