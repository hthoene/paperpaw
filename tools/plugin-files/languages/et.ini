news.plugin.name = Uudised
news.plugin.description = Toob uudisvooge (RSS, Atom) raamatutena lugemiseks.
news.plugin.how = "Uudised muudab RSS- või Atom-voogud raamatuteks. Iga voog muutub üheks raamatuks raamatukogu kaustas News, uusimate artiklitega lihtteksti kujul, mida lugeda nagu iga teist raamatut.\n\nAva Uudised menüüst Tööriistad ja vali Lisa voog; selle aadress on ajalehe või ajaveebi veebisaidil. Too uudised toob kõik vood ja asendab varasemad raamatud. Hoia voogu all (nuppudega hoia Vali), et seda üksi tuua või eemaldada. Eemaldatud voo raamat jääb raamatukokku.\n\nToomine vajab võrku. Artikleid voo kohta (Seaded, Raamatukogu) määrab, mitu artiklit iga raamat sisaldab. Vidin Uudiste pealkirjad näitab neid avaekraanil."
