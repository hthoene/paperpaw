setup.plugin.name = Seadistus
setup.plugin.description = Lühike juhend oluliste seadete kaudu esimesel käivitamisel.
setup.plugin.how = "Seadistus on lühike juhend oluliste seadete kaudu, mida näidatakse üks kord, PaperPaw esimesel käivitamisel. Iga leht küsib üht asja, näiteks keelt, nuppe, teksti suurust, ajavööndit, Wi-Fi-t või mõnda lisatavat pluginat, mõistlik vastus on juba valitud, nii et Edasi on alati õige. Sammud, mida see seade ei vaja, jäetakse välja.\n\nPuuduta nuppe või kasuta üles- ja allanuppe ning Vali. Jäta vahele esimesel lehel lõpetab seadistuse kohe. Viimane leht ütleb, kust sinu raamatud tulevad.\n\nUuesti käivitamiseks ava seaded ja vali Seadista PaperPaw. Kõike, mida siin valid, saab hiljem seadetes muuta."
