files.plugin.name = Failibrauser
files.plugin.description = Loetleb seadmes olevad raamatud ja kaustad ning avab need.
files.plugin.how = "Raamatukogu loetleb sinu raamatukogu kaustas olevad raamatud, igaühe kaane, pealkirja, autori ja selle, kui kaugele oled jõudnud. Viimati loetud raamat seisab ülal kaardina, nii et lugemise jätkamiseks piisab ühest puudutusest või ühest Vali vajutusest. Kui raamatukogu raamatuid otsib, ütleb see, mitu on seni leitud.\n\nVali, mida raamatute kohal näidatakse: kõiki, pooleli olevaid, lugemata või läbi loetud raamatuid või riiuleid (autori, sarja, sildi, lemmikute järgi, iga alustatud sarja järgmine raamat). Puuduta raamatut, et seda lugeda; hoia seda all (nuppudega hoia Vali), et seda avada, märkida läbi loetuks või lugemata, vaadata selle teavet, teisaldada arhiivi või kustutada. Puuduta pealkirja raamatukogu menüü jaoks: kuidas raamatuid sorteeritakse ja näidatakse, otsing, raamatukogu kaust ja seaded.\n\nRaamatukogu kaust määratakse jaotises Seaded, Raamatukogu, valikuga Raamatukogu kaust; seal saab raamatuid näidata ka kaanteruudustikuna. Kõigi muude failide jaoks kasuta Failid menüüs Tööriistad."
