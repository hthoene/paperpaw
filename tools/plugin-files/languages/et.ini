calibre.plugin.name = Traadita raamatukogu
calibre.plugin.description = Võtab raamatuid vastu võrgu kaudu. Töötab Calibre jaoks traadita seadmena.
calibre.plugin.how = "Traadita raamatukogu laseb seadmel ilmuda sinu arvuti Calibres traadita seadmena. Calibre saab siis sinna raamatuid saata, neid loetleda ja kustutada. Raamatud lähevad raamatukokku.\n\nAva Traadita raamatukogu menüüst Tööriistad, seade ja arvuti samas Wi-Fi-võrgus. Vali Calibres Ühenda/jaga, seejärel Käivita traadita seadme ühendus. Kui seade on sinu arvuti leidnud, näitab see selle nime; puuduta Ühenda (nuppudega vajuta Vali). Calibre saab siin raamatuid lisada ja kustutada, seega ühendu ainult oma arvutiga. Ekraani sulgemine lõpetab ühenduse.\n\nKui Calibret ei leita ise, sisesta selle arvuti aadress jaotises Seaded, Raamatukogu, väljale Aadress Calibre osas. Kui Calibre kasutab muud porti kui 9090, lisa see kujul :port, nt 192.168.1.20:9091."
