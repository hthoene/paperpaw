bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Seob puldid, klaviatuurid ja andurid ning ühendab need.
bluetooth.plugin.how = "Bluetooth seob puldid, klaviatuurid ja andurid lugejaga seal, kus on Bluetooth (X4 Pro).\n\nLisa seade otsib, mis on ulatuses; pane seade esmalt sidumisrežiimi. Vali see ja kinnita lugejal (kui kuvatakse number, võrdle seda). Puldi või klaviatuuri klahvid keeravad siis lehti ja liiguvad menüüdes; mida iga klahv teeb, saab muuta jaotises Juhtimine.\n\nPuldid ütleb, millal nende klahvid töötavad: kui siin sisse lülitatud, lugemise ajal (ühendatud, kuni raamat on avatud, säästab akut) või alati. Menüünupp või pikk vajutus seadmel unustab selle.\n\nAndur on pluginate jaoks: lülita sisse, milline plugin seda kasutada tohib. Bluetooth on väljas alati, kui seda keegi ei kasuta."
