file-manager.plugin.name = Failihaldur
file-manager.plugin.description = Iga kaust ja fail seadmes: ava, nimeta ümber, teisalda, kopeeri ja kustuta need.
file-manager.plugin.how = "Failihaldur näitab kõiki seadme salvestusruumi kaustu ja faile, mitte ainult raamatuid, ning laseb neid avada, ümber nimetada, teisaldada, kopeerida ja kustutada ning luua uusi kaustu.\n\nAva Failid menüüst Tööriistad. Puuduta kausta, et sinna siseneda; Tagasi viib ülemisse kausta. Puuduta faili või hoia suvalist kirjet all (nuppudega hoia Vali), et näha, mida sellega teha saab. Teisalda ja Kopeeri valivad kirje: mine kausta, kuhu see kuulub, ja vali all ribal Aseta siia. Nuppudega vajuta viimaselt kirjelt Alla, et ribale jõuda.\n\nPunktiga algavad failid ja kaustad, näiteks PaperPaw enda andmed, on peidetud. Nende nägemiseks lülita jaotises Seaded, Raamatukogu sisse Peidetud failid."
