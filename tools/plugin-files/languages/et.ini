keys.plugin.name = Nupud ja žestid
keys.plugin.description = Mida iga nupp, puutetsoon ja libistus teeb, muudetav seadmel.
keys.plugin.how = "Nupud ja žestid näitab, mida iga nupp, puutetsoon ja libistus teeb, ning laseb seda seadmel muuta.\n\nAva see seadetes jaotises Seade. Vali esmalt, kus muudatus kehtib: Kõikjal, Lugemise ajal, Avaekraanil, Raamatukogus või ühes tööriistas. Seejärel vali sisend, näiteks all hoitud nupp või libistus servast sisse, ja vali loendist tegevus, mida saab otsida. Tavaline annab tagasi selle, mille pluginad ja nuppude paigutus seavad.\n\nX4-l lükatakse tagasi muudatus, mille järel poleks ühtegi nuppu valimiseks, tagasiminekuks või edasiliikumiseks. Lähtesta nupud ja žestid lõpus võtab tagasi kõik muudatused."
