fonts-browser.plugin.name = Rohkem kirjatüüpe
fonts-browser.plugin.description = Näitab interneti kirjatüüpe, igaühel näidis, ja laadib need lugemiseks alla.
fonts-browser.plugin.how = "Rohkem kirjatüüpe loetleb interneti kirjatüüpide raamatukogu kirjatüüpe, iga nimi oma kirjatüübis, ja laadib alla need, millega tahad lugeda.\n\nSelle leiad kirjatüüpide loendi lõpust, kus valitakse lugemiskirjatüüp, jaotises Seaded, Lugemine, valikust Kirjatüüp; olekuridadel on sama kirje nende kirjatüübi jaoks. Puuduta kirjatüüpi (nuppudega vajuta Vali), et näha seda suuremana koos näitelausega, ja vali siis Laadi alla. Allalaadimise ajal võid lehelt lahkuda. Kui see on valmis, vali Loe kirjatüübiga (kirjatüübi nimi) või Kasuta olekuridadel. Värskenda toob uuema versiooni, Eemalda kustutab kirjatüübi seadmest.\n\nSee vajab Wi-Fi-t.\n\nSINU ENDA KIRJATÜÜBID\n\nValiku Rohkem kirjatüüpe kõrval on samas loendis Sinu enda kirjatüübid, mis näitab seda spikri osa. Sinu enda kirjatüüp on .ttf- või .otf-fail, näiteks Google Fontsist.\n\nAndroidis ja teistes seadmetes, mis joonistavad kirjatüübifaile: kopeeri fail kausta fonts (Androidis: PaperPaw/fonts jagatud salvestusruumis), taaskäivita PaperPaw ja vali kirjatüüp jaotises Seaded, Lugemine, valikust Kirjatüüp.\n\nXteink X4 ja X4 Pro puhul: need lugejad loevad kirjatüüpide pakette, mitte kirjatüübifaile, sest kirjatüübifailid ei mahuks nende mällu. Tee pakett arvutis tööriistaga paperpaw-fontgen, iga sinu käsutuses oleva stiili jaoks (tavaline on vajalik):\n\npaperpaw-fontgen --family \"My Font\" --regular MyFont-Regular.ttf --bold MyFont-Bold.ttf --italic MyFont-Italic.ttf plugins\n\nSee loob kausta plugins/font-my-font. Kopeeri see mälukaardil olevasse kausta plugins, taaskäivita ja vali kirjatüübiks My Font. Ühe stiiliga pakett on ladina tähtede puhul umbes pool megabaiti; väljajäetud stiilid joonistatakse tavalises stiilis. Tööriist ütleb, mitu soovitud tähte kirjatüübil on (--chars latin,cyrillic,greek lisab kirjasüsteeme): kirjatüüp, millel pole sinu raamatu tähti, ei saa neid näidata, nii et otsi selline, mis katab selle kirjasüsteemi.\n\nRohkem kirjatüüpe kirjatüübid töötavad samamoodi ja ei vaja arvutit.\n\nTeravama väikese teksti saamiseks e-tindi paneelil lisa käsule --hinting light: see sobitab tähed pikslivõrku, nagu vaikekirjatüübid on tehtud. Ilma selleta joonistatakse tähed nii, nagu kirjatüüp need kavandas; --hinting normal ja --hinting mono sobitavad neid tugevamalt. Märkidega kirjatüübid, näiteks araabia või devanagari, on parem jätta ilma."
