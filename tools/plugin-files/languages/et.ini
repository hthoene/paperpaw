diagnostics.plugin.name = Diagnostika
diagnostics.plugin.description = Testekraan ja juhitud kontroll seadme iga osa jaoks.
diagnostics.plugin.how = "Diagnostika on testekraan seadme kontrollimiseks: see näitab iga halli taset, mida paneel suudab kuvada, nelja kasti nuppude ja puudutuse proovimiseks ning lehelugejat edenemisribaga värskendusrežiimide võrdlemiseks.\n\nTestekraanil pole menüükirjet. See on avaekraan ainult siis, kui ükski teine plugin seda ei paku, või kui valid selle pluginahalduris jaotises Ekraanid kohale Avaekraan.\n\nVali märgib fookuses oleva kasti ning nooleklahvid liiguvad kastide vahel; puudutusega puuduta kasti. Lehenupud keeravad testilehti. Hoia Vali või hoia sõrme ekraanil, et otsast alustada.\n\nSeadme kontroll, jaotises Tööriistad seal, kus PaperPaw on seadme püsivara, käib seadme iga osa läbi ühe lehekülje kaupa: ekraan, nupud, puudutus, esivalgus, aku, kaart, kell, Wi-Fi, unerežiim ja mälu. Iga leht lõpeb valikutega Ebaõnnestus, Jäta vahele ja Läbitud, kusjuures mõõtmiste põhjal soovitatav vastus on valitud; osad, mida seadmel pole, jäetakse vahele. Pärast iga vastust kirjutab see aruande faili .paperpaw/plugins/diagnostics/device-check.txt, mida saab pull requesti lisada. Tagasi väljub sellest ja see jätkub uuesti avamisel sealt, kus pooleli jäi. Ainult nuppudega seadmel vali esmalt nuppude lehel Alusta; seni töötavad nooled, Vali ja Tagasi nagu igal lehel."
