vocabulary.plugin.name = Sõnavara
vocabulary.plugin.description = Hoiab sõnu, mida otsid, koos nende lausetega, ja kordab telefonis tehtud kaarte intervallkordamisega.
vocabulary.plugin.how = "Sõnavara hoiab sõnu, mida lugemise ajal otsid, igaüks oma lausega, hilisemaks läbivaatamiseks. Loendi leiad Tööriistadest, uusimad ees; vali sõna, et seda uuesti otsida. Viimane rida Ekspordi salvestab need kaardirakenduste, näiteks Anki jaoks. Loend hoiab uusimat 2000 sõna: sellest kaugemal lähevad vanimad, nii et ekspordi need esmalt, et kõik alles jääksid.\n\nKaardid, samuti Tööriistades, küsitlevad sind intervallkordamisega: pärast Näita vastust hindad iga kaarti Uuesti, Raske, Hea või Lihtne ning see otsustab, millal see tagasi tuleb. Tee kaardipakke valikuga Muuda telefonis: skanni kood telefoniga samas Wi-Fi-võrgus, seejärel tipi kaarte või lisa palju korraga: ava seal pakk, vali Palju kaarte korraga ja vali CSV-, TSV- või TXT-fail (kaart igal real: esikülg, tagakülg, näide; UTF-8), kleebi loend või too Anki pakk (.apkg, eksporditud valikuga Toeta vanemaid Anki versioone).\n\nVõi kasuta SD-kaardil olevaid faile: pane iga paki jaoks CSV-, TSV- või TXT-fail või Anki pakk (.apkg, eksporditud valikuga Toeta vanemaid Anki versioone) kausta Flashcards (Spanish.tsv teeb paki Spanish; üks kaart igal real: esikülg, tagakülg, näide; salvestatud UTF-8 kujul; esimene rida võib nimetada veerud front, back, example). Vali Kaardid SD-kaardil jaotises Kaardid või lase sel juhtuda, kui avad Kaardid. Pakid jäävad lugejale koos sellega, mida õppisid, ja fail liidetakse oma pakiga alati, kui see on uus või muudetud: muuda faili kaardi tagakülge või näidet ja kaart muutub ning säilitab oma edenemise; muuda esikülje teksti ja see loeb uueks kaardiks, vana algab otsast (kaarte eristatakse esikülje teksti järgi; tühikud ja suurtähed ei loe); sinu kustutatud rida ei kustuta kaarti (kui sa ei sea selle paki valikut „failist puuduvad kaardid“ väärtusele Eemalda: siis eemaldatakse kaart järgmisel uuendamisel koos oma edenemisega jäädavalt ja midagi ei eemaldata, kuni faili mõnda rida ei saa lugeda). Salvesta pakk selle faili valikuga Salvesta kaardile: fail saab kaartide numbrid (veerg id), nii et saad esikülgi arvutis muuta ja kaardid säilitavad õpitu; fail säilitab ainult id, esikülje, tagakülje ja näite (muud veerud, kommentaarid ja ridade järjekord ei säili) ning salvestamisest keeldutakse, kuni faili mõnda rida ei õnnestunud lugeda; seal olnud fail kopeeritakse esimesel korral faili _name.bak.tsv (hilisem salvestus seda koopiat ei asenda). Faili, mis on üle 4 MiB või 20 000 rea, ei loeta ning see tuleb salvestada CSV UTF-8, mitte UTF-16 kujul. Esimesel korral teeb lugeja kausta koos märkusega selle töötamise kohta.\n\nSeadetes jaotises Lugemine paneb Otsitud sõnadest saavad kaardid iga otsitud sõna pakki Otsitud."
