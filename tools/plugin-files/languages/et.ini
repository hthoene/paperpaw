store.plugin.name = Pluginapood
store.plugin.description = Leiab, paigaldab, värskendab ja eemaldab selle seadme pluginaid.
store.plugin.how = "Pluginapood leiab sellele seadmele pluginaid internetist ning paigaldab, värskendab ja eemaldab neid. Ava see jaotisest Tööriistad; see vajab Wi-Fi-t.\n\nAlgus näitab, mida pluginaraamatukogu soovitab, mis on praegu uus või populaarne, seejärel rühmad. Rühm loetleb oma pluginad õiglases segus, mis muutub iga päev, nii et iga plugin saab nähtavaks; järjesta need A-st Z-ni, uusimate või viimase värskenduse järgi ning mine pikkades loendites tähe juurde. Ava üks, et näha selle lehte koos suuruse ja selle võetava mäluga, seejärel vali Paigalda, Värskenda või Eemalda. Värskenda kõik toob iga paigaldatud plugina ajakohaseks.\n\nKoodipluginad töötavad seadmele täieliku juurdepääsuga: pood ütleb seda ja küsib enne ning need käivituvad pärast taaskäivitust. Kui üks läheb valesti, käivitub PaperPaw ilma koodipluginateta ja ütleb, milline. Pluginaraamatukogu määrab, kust loend pärineb.\n\nKogukonna pluginad jaotises Seaded, Süsteem loetlevad ka pluginaid, mille teised on GitHubis avaldanud. Keegi pole neid üle vaadanud: need on märgitud Ülevaatamata, koodiplugina leht näitab võtit, millega see on allkirjastatud, ja teise võtmega allkirjastatud värskendust ei paigaldata.\n\nAllikad, alguse viimane rida, lisavad teiste pluginaloendeid nende aadressi järgi (https://…/plugins.json), loetlevad ühe neist PaperPaw oma asemel või eemaldavad selle. Tippimise asemel pane fail sources.txt, igal real üks aadress, kaardil olevasse kausta .paperpaw/plugins/store: aadressid ilmuvad jaotises Allikad uutena. PaperPaw ei kontrolli allikat ega selle pluginaid ning seade võtab ühendust allika serveriga. Allikas allkirjastab oma loendi; seade jätab meelde esimese loetud loendi võtme ja võtab sellest alates ainult selle võtmega allkirjastatud loendeid ja koodipluginaid. Plugin saab oma värskendused ainult allikast, millest see paigaldati. PaperPaw oma raamatukogu on alati olemas ja seda ei saa eemaldada; poest lahkumine viib selle juurde tagasi."
