notes-vault.plugin.name = Märkmehoidla
notes-vault.plugin.description = Loeb Markdown-märkmete kausta kaustade, siltide ja viimaste muudatuste kaupa, avaekraani vidinatega. Töötab Obsidiani hoidlatega.
notes-vault.plugin.how = "Märkmehoidla loeb Markdown-märkmete kausta (lihtsad .md-failid, nagu märkmerakendused neid hoiavad). See töötab Obsidiani hoidlatega.\n\nVali hoidla kaust seadetes või hoidla lehel tööriistades. Leht pakub siis kaustu nii, nagu need on kaardil, viimati muudetud märkmeid, silte ja märkmete pealkirjade otsingut.\n\nEsimesel korral indekseeritakse hoidla taustal, kui selle leht on avatud; tuhandete märkmetega hoidla võtab paar minutit, seejärel avaneb kohe. Indeksit hoitakse kaardil ja see tehakse uuesti, kui hoidla leht avatakse mõne tunni pärast või kui valid Uuenda.\n\nMärkus avaneb lugejas. Lingid teistele märkmetele ([[Note]], [[Note|words]], [[Note#Heading]]) leitakse märkuse nime järgi kõikjal hoidlas; lingi järgimine avab selle märkuse ja Tagasi viib eelmise märkuse juurde.\n\nHoidlas ei muudeta kunagi midagi. Avaekraani vidinad (hiljutised märkmed, kinnitatud märkus, päeva märkus, juhuslik märkus, sildid, otsing) lisatakse avaekraani redaktoris. Vidin saab oma märkmed võtta ainult ühest kaustast: kirjuta kausta tee kaardi juurest (näiteks Notes/Work) vidina seadetes; tühjaks jäetuna võtab see kõik hoidla märkmed."
