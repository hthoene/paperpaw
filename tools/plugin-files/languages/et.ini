keyboard.plugin.name = Klaviatuur
keyboard.plugin.description = Sisestab teksti ekraanil, puudutusega või nuppudega.
keyboard.plugin.how = "Klaviatuur avaneb alati, kui miski vajab teksti: otsing, parool, märkus või säte. See töötab puudutusega ja ainult nuppudega.\n\nNuppudega liiguvad vasak ja parem mööda rida, lehenupud ridade vahel, Vali vajutab klahvi ja Tagasi tühistab; vasak ja parem käivad rida ringi ning üles ja alla püsivad sinu veerus. Shift teeb järgmise tähe suurtäheks; vajuta seda kaks korda kõigi suurtähtede jaoks ja veel kord lõpetamiseks. Hoia tähte all (nuppudega: hoia sellel Vali), et saada selle suurtäht, mis valitakse kohe, ja rõhumärgiga tähed nagu é ja è; saksa keeles tulevad ä, ö, ü ja ß nii a, o, u ja s juurest (nuppudega ütleb klaviatuur seda nendel tähtedel). OK lõpetab; nuppudega hoia Tagasi, et lõpetada kõikjalt (Tagasi üksi tühistab), või hoia Vali klahvil, mis pole täht. Aseta lisab lõikelaua teksti ja Telefon, kus see on pakutud, laseb sul selle asemel telefonis tippida.\n\nSeadetes jaotises Seade, Klaviatuur: Klaviatuuripaigutused valib paigutused. Vaikimisi järgib see menüükeelt; mitme puhul vahetab klahv nende vahel. Täpitähtede klahvid annab selle asemel ä, ö, ü ja ß jaoks oma klahvid. Suurus teeb klahvid ja tähed suuremaks; ainult nuppudega jäävad read arvuti klaviatuuri omadeks. Puuteekraanidel muudab Klahvi kuju klahvide välimust. Automaatsed suurtähed alustab iga lause suurtähega."
