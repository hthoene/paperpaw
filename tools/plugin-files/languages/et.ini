profiles.plugin.name = Lugemisprofiilid
profiles.plugin.description = Nimega lugemis- ja ekraaniseadete komplektid, vahetatavad puudutusega.
profiles.plugin.how = "Profiil hoiab sinu lugemisseaded, ekraaniseaded ja olekuread nime all, näiteks Öö või Suur kiri, ning toob need tagasi puudutusega.\n\nAva Profiilid lugemismenüüs valikust Veel või seadetes jaotises Kohandamine. Puuduta profiili, et seda kasutada; kasutusel olev on märgitud. Hoia seda all (nuppudega hoia Vali), et salvestada praegused seaded sellesse, see ümber nimetada või eemaldada. Salvesta uue profiilina jätab alles selle, mis praegu on seatud.\n\nJärgmine profiil lülitub loendi järgmisele; pane see nupule või reeglisse."
