format-cbz.plugin.description = Avab koomiksiarhiive (.cbz), üks pilt ühel lehel.
format-cbz.plugin.how = "Avab koomiksiarhiive (.cbz): üks pilt lehe kohta, ekraanile sobitatud, nimede järjekorras (2 enne 10).\n\nPane need raamatukogu kausta ja ava raamatukogust; keera lehti nagu igas raamatus. Suured pildid võtavad esimesel korral hetke, X4-l rohkem kui mujal.\n\nLugemisseaded (Seaded, Lugemine): „Paneel paneeli kaupa“ näitab korraga ühte lehe paneeli, nii suurelt kui ekraan lubab, ja lehekeeramised astuvad neist läbi; paneelideta leht näidatakse tervena. „Koomiksilehed jooksevad“ peegeldab lehekeeramised mangale (paremalt vasakule); raamatu enda ComicInfo.xml ütleb seda ise. Raamatukogu näitab raamatu pealkirja ning selle sarja ja numbrit failist ComicInfo.xml."
