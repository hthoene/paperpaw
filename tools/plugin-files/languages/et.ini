aids.plugin.name = Lugemisabi
aids.plugin.description = Rasvased sõnaalgused, asendatud sõnad, pildid: tekst nii, nagu sa tahad.
aids.plugin.how = "Lugemisabi muudavad raamatu teksti välimust lugemise ajal. Need kehtivad kõigile raamatutele. Rasvased sõnaalgused ja Asenda sõnu on alguses väljas.\n\nNeed leiad jaotisest Seaded, Lugemine, osast Lugemisabi. Rasvased sõnaalgused kuvab iga sõna esimese poole rasvases kirjas, mida mõni peab jälgimiseks lihtsamaks. Asenda sõnu võtab paare kujul „kohv = kohvi; hr = härra“, mis on eraldatud semikoolonitega.\n\nAsendatakse ainult terveid sõnu, täpselt nii, nagu sa need kirjutasid, nii et „kohv“ ei muuda kunagi pikema sõna osa. Raamatufaili ennast ei muudeta.\n\nRaamatute pilte saab näidata (nagu alguses), muuta lühikeseks reaks, näiteks „[Pilt: laev merel]“, mis kasutab pildi kirjeldust, või ära jätta. Lehel on siis rohkem ruumi tekstile ja mittenäidatava pildi jaoks ei dekodeerita midagi, mis kiirendab lehtede keeramist. Koomikseid ja muid piltidest koosnevaid raamatuid ei muudeta."
