reader.plugin.name = Lugeja
reader.plugin.description = Näitab raamatuid lehekülg-lehekülje haaval, sisukorra ja lugemisseadetega.
reader.plugin.how = "Lugeja näitab raamatuid lehekülg-lehekülje haaval. Ava raamat raamatukogust; viimane raamat võib käivitumisel uuesti avaneda (säte Ava viimane raamat käivitumisel).\n\nPuuduta ekraani vasakut või paremat serva või kasuta lehenuppe, et lehti keerata. Puuduta keskosa või vajuta Vali lugemismenüü jaoks: Sisukord, Otsing, Mine leheküljele, Kirjatüüp ja küljendus, Järjehoidjad ja esiletõsted ja muu. Ülaservast alla avab kiirpaneeli, alumisest servast üles viib avaekraanile; nii teeb ka Tagasi hoidmine.\n\nHoia Vali (või hoia pilti), et näha pilti täisekraanil: Vasak ja Parem liiguvad läbi lehe piltide. Vali suurendab 2x, 3x ja tagasi (topeltpuudutus puutega); suurendatult nihutavad Vasak ja Parem külgsuunas, lehenupud (või libistused) liiguvad edasi risti ja pikuti. Tagasi viib tagasi sobitatud vaatesse, seejärel leheküljele (puutega hoia väljumiseks). Puuduta paremat ülanurka järjehoidja jaoks. Hoia sõna all, et seda esile tõsta. Nuppudega hoia Vasak: Vasak ja Parem liiguvad sõna kaupa, lehenupud rea kaupa, nende hoidmine viib lehe otstesse ja lõigu kaupa; Vali avab sõna esiletõsturiba, Vali hoidmine laiendab selle lauseks ja lõiguks (seejärel Vasak ja Parem liigutavad lõppu, nende hoidmine algust). Valik jätkub üle lehekeeramiste. Ekspordi Markdownina salvestab sinu märkmed."
