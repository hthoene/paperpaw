smart-home.plugin.name = Nutikodu
smart-home.plugin.description = Sinu enda Home Assistanti väärtused ja lülitid juhtpaneelil ja avaekraani vidinatena. Töötab sinu koduvõrgus oleva Home Assistantiga.
smart-home.plugin.how = "Nutikodu näitab sinu enda Home Assistanti väärtusi ja lüliteid: temperatuurid, õhuniiskus, energia, uksed ja aknad, tuled, lülitid ja stseenid. See räägib sinu serveriga selle REST API kaudu sinu koduvõrgus; midagi ei lähe läbi ühegi teise teenuse.\n\nAva Nutikodu tööriistade menüüst, seejärel Ühendus: tipi oma Home Assistanti aadress (näiteks http://homeassistant.local:8123) ja pikaealine juurdepääsuvõti (tee see oma Home Assistanti profiililehe allosas). Võtit hoitakse paroolide ja võtmete hulgas, mitte kunagi seadete failis. Lihtsat http-d kasutatakse ainult koduvõrgu aadresside jaoks; mujal asuva serveri jaoks lülita seadetes sisse „Serverid väljaspool koduvõrku“ ja kasuta https-i kehtiva sertifikaadiga.\n\nVali olemid avab sinu serveris olevate olemite loendi: otsi nime või id järgi ja vali olem, et seda näidata (vali uuesti, et see eemaldada). Võid anda sellele ruumi, mis rühmitab selle juhtpaneelil ja ruumividinates. Kuni 24 olemit hoitakse. Juhtpaneelil vali tuli, lüliti või stseen, et seda lülitada: rida näitab serveri vastust. Valitud andurit loetakse uuesti.\n\nVidinad (hoia avaekraani all, seejärel lisa vidin): Nutikodu väärtus näitab üht näitu suurelt, rühm loetleb ruumi olemid, lüliti on nupp ühe tule või lüliti jaoks ning ruum on kaart ruumi näitude ja lülititega. Iga vidina seaded ütlevad, millist olemit või ruumi see näitab.\n\nKodu loetakse, kui avad juhtpaneeli, kui palud (rida Värskenda või väärtuse- või rühmavidina puudutus), kui lugeja ärkab seal, kus Wi-Fi on juba üleval, ja sinu seatud ajakava järgi, kui laadija on ühendatud. See ei lülita raadiot kunagi ise sisse ega hoia seda kunagi sees."
