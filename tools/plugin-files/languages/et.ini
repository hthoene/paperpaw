opds.plugin.name = OPDS-kataloogid
opds.plugin.description = Sirvib OPDS-kataloogi, laadib alla nende raamatud ja hoiab kaustu nendega sünkroonis.
opds.plugin.how = "OPDS-kataloogid on võrguraamatukogud, näiteks Project Gutenberg, Calibre-Web, Kavita või Komga. See plugin sirvib ja otsib neid nagu kaustu ning laadib nende raamatud raamatukokku.\n\nAva Kataloogid menüüst Tööriistad ja vali Lisa kataloog: aadress ning, kui kataloog vajab kontot, kasutajanimi ja parool. Puuduta kataloogi, et seda sirvida; hoia seda all (nuppudega hoia Vali), et seda sünkroonida, muuta või eemaldada.\n\nKui Sünkrooni see kataloog on sisse lülitatud, laadib Sünkrooni kataloogid selle uued raamatud selle kausta. Raamatuid sünkroonimisel piirab, mitu raamatut üks sünkroonimine toob, et suur kataloog ei täidaks seadet. Pilvekaust (WebDAV) töötab kataloogi asemel."
