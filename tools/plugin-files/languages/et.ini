puzzles.plugin.name = Mõistatused
puzzles.plugin.description = Sudoku, ristsõnad ja male ülesanded, võrguta, koos päeva mõistatusega.
puzzles.plugin.how = "Mõistatused rongisõiduks ja ooteruumi, kõik võrguta: sudoku, ristsõnad ja male ülesanded. Ava Mõistatused tööriistade menüüst või lisa avaekraanile vidin Päeva mõistatus (hoia avaekraani all, seejärel lisa vidin): see näitab, kui kaugel on tänane sudoku, ja puudutus avab selle. Päeva sudoku on terve päeva sama.\n\nSudoku: vasak ja parem liigutavad kursorit ruut ruudu haaval, üles ja alla (lehenupud) ühe rea võrra. Vali avab numbrid: vali üks ja vali uuesti, et see sisestada, või Tühjenda, et ruut tühjendada. Hoia Vali (või Menüü), et jõuda laua all olevate nuppudeni: Märkmed muudab numbrid pliiatsimärkideks, Kontrolli märgib valed ruudud, Võta tagasi võtab viimase käigu tagasi, Uus alustab valitud raskusastme mõistatust (Lihtne, Keskmine, Raske). Igal mõistatusel on täpselt üks lahendus. Mäng jääb alles, kui lahkud. Puuteekraanil puuduta ruutu.\n\nRistsõnad: pane .puz (Across Lite) või .ipuz failid kaardil olevasse kausta „puzzles“; ühtegi pole kaasas. Liigu ruudustikul, seejärel vali, et sisestada kursori all olev sõna klaviatuuril (allkriips jätab ruudu tühjaks). Nupud vahetavad rõhtsat ja püstist, näitavad vihjete loendit, kontrollivad tähti ja paljastavad sõna. Tähed jäävad iga faili jaoks alles. Segatud .puz-faile ei saa avada.\n\nMale ülesanded: väike komplekt Lichessi ülesannete andmebaasist (CC0). Vasak ja parem hüppavad nupult nupule, vali nupp, mida tahad liigutada, seejärel vasak ja parem läbi selle võimalike sihtruutude ning vali uuesti. Vale käik võetakse tagasi. Vihje märgib liigutatava nupu, Järgmine läheb järgmise ülesande juurde.\n\nLaud joonistab uuesti ainult muutunud ruudud. Statistika loeb lahendatud mõistatused."
