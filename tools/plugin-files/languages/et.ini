wifi.plugin.name = Wi-Fi
wifi.plugin.description = Ühendub Wi-Fi-võrkudega vajadusel ja lülitab raadio pärast välja.
wifi.plugin.how = "Wi-Fi ühendub võrguga, kui plugin vajab internetti (kataloog, sünkroonimine, pood, ülekanne), ja lülitab raadio uuesti välja minut pärast seda, kui miski seda ei kasuta, või kohe, kui näidatakse avaekraani või raamatut, et säästa akut ja mälu.\n\nAva Wi-Fi seadetest või olekurea Wi-Fi üksusest. Võrgud loetleb ulatuses olevad; vali üks ja tipi selle parool või vali Seadista telefoniga ja tipi nimi ja parool oma telefoni brauseris seadme asemel. Unusta eemaldab salvestatud võrgu.\n\nParoolid jäävad kaardile, turvaliselt hoitud, ja neid ei näidata enam kunagi. Valikus Ühendu vajadusel sead, kui kaua Wi-Fi pärast viimast kasutamist sees püsib, kas see püsib laadimise ajal sees ja milline salvestatud võrk tuleb esimesena, kui ulatuses on mitu."
