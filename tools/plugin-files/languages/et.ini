anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Õpib sinu arvutis oleva Anki kordamisele tulevaid kaarte ja saadab vastused tagasi AnkiConnecti lisandmooduli kaudu.
anki.plugin.how = "Anki võimaldab sul lugejal õppida kaarte, mis on arvutis Ankis kordamisele tulemas, ja saadab sinu vastused tagasi. See kasutab tasuta lisandmoodulit AnkiConnect (lisandmooduli kood 2055492159) ja mitte kunagi AnkiWebi. See on alguses väljas: lisa see pluginapoest.\n\nArvutis: paigalda AnkiConnect Ankisse (Tööriistad, Lisandmoodulid, Hangi lisandmooduleid) ja taaskäivita Anki. Anki peab sünkroonimise ajal olema avatud.\n\nVaikimisi vastab AnkiConnect ainult arvutile, millel see töötab (127.0.0.1), nii et lugeja ei pääse sellele ligi. Ava Tööriistad, Lisandmoodulid, AnkiConnect, Seadistus ja sea „webBindAddress“ väärtuseks „0.0.0.0“ (kuula koduvõrku). Port „webBindPort“ on 8765, kui sa seda ei muuda. Kui sead seal „apiKey“, sisesta siia sama võti. Taaskäivita Anki pärast seadistuse muutmist ja luba Anki arvuti tulemüüris, kui see küsib. Kasuta seda ainult võrgus, mida usaldad: igaüks selles pääseb AnkiConnectile ligi, nii et võti on hea mõte.\n\nLugejal: ava Anki menüüst Tööriistad, seejärel sisesta arvuti aadress (näiteks 192.168.1.20) real Arvuti, port, kui see pole 8765, ja API võti, kui sead selle. Vali pakk või jäta tühjaks kõigi pakkide jaoks. Seejärel vali Sünkrooni Ankiga, Wi-Fi sisselülitatuna: esmalt saadetakse ootel vastused, seejärel tuuakse kordamisele tulevad kaardid (ja sinu seatud arv uusi kaarte), kuni 50. Vali Õpi, et need ilma võrguta läbi käia: näita vastust ja hinda see Uuesti, Raske, Hea või Lihtne. Sinu vastused jäävad lugejale alles, ka ilma Wi-Fi-ta, ja lähevad järgmise sünkroonimisega Ankisse. Anki otsustab, millal kaart tagasi tuleb: Uuesti vastatud kaart tuuakse hilisema sünkroonimisega uuesti, kui Anki ütleb, et see on kordamisel.\n\nSünkrooni Anki avamisel seadetes sünkroonib iga kord, kui ekraani avad. Klahvivajutus ei kasuta kunagi võrku."
