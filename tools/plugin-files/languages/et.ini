menu.plugin.how = "Menüü loetleb, mida saad teha ja seada. See avaneb ekraani allosas, avatu kohal: lugemise ajal puuduta ekraani keskosa või vajuta Vali. Puuduta kirjet või vali see, et seda käivitada.\n\nMenüü seaded näitavad oma väärtust ja muutuvad kohapeal, nii et menüü jääb avatuks. Kirje, millel on veel kirjeid, avab alammenüü.\n\nLibista ülaservast alla kiirpaneeli jaoks: see, mida sageli muudad, nuppudena. Puuduta nuppu, et seda lülitada, hoia seda all selle seadete jaoks. Ainult nuppudega valivad nooleklahvid, Vali lülitab ja Tagasi sulgeb. Jaotises Välimus näitab Menüüd menüüsid loendina või paanidena."
