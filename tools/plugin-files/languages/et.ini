reading-goal.plugin.description = Minutid lugemiseks päevas ja kass avaekraanil, kelle tuju järgib tänast lugemist.
reading-goal.plugin.how = "Avaekraanil olev kass näitab, kuidas tänane lugemine läheb: kurb, kuni sa pole veel lugenud, nii-nii pärast veidi, rahulolev poolest päevaeesmärgist, õnnelik, kui oled selle saavutanud.\n\nLisa avaekraanile vidin Lugemiskass (hoia avaekraani all, seejärel lisa vidin) või vali unerežiimi ekraaniks Tänane lugemiskass. Kassi puudutus avab päevaeesmärgi; see on lugemisstatistika eesmärk, mis loeb sinu loetud minuteid.\n\nSeadetes jaotises Lugemine seavad Rahulolev alates ja Õnnelik alates, mitmendast eesmärgi osast kass on rahulolev või õnnelik, ning Oma pildid kausta piltidega (sad, meh, content ja happy), mida näidata kasside asemel. Pildid on PNG- või JPEG-failid; kausta puudumisel näidatakse kasse."
