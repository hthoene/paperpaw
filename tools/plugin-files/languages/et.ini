settings.plugin.name = Seaded
settings.plugin.description = Seadete lehed, mis on ehitatud iga plugina seadetest.
settings.plugin.how = "Seaded näitavad lehtedena kõike, mida saab PaperPaw ja selle pluginate puhul seada. Pluginad ei vaja oma ekraani: see, mida nad deklareerivad, ilmub siia, rühmades, iga seade koos kirjeldusega selle all.\n\nAva see menüüst Seaded. Puuduta rühma, et see avada, seejärel seadet, et seda lülitada või valida; arvudel on nupud − ja +. Nuppudega liigu seadele ja vajuta Vali: vasak ja parem muudavad arvu, Vali jätab selle, Tagasi läheb tagasi eelmise väärtuse juurde.\n\nMuudatused kehtivad kohe. Otsing leiab seade sõnade järgi ja Täpsemad seaded lisab harva vajalikud. Lähtesta vaikeväärtused ja Lähtesta kõik küsivad enne."
