pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Keskendumistaimer töö- ja puhkeringidega, vidinatega ja päevase loendusega.
pomodoro.plugin.how = "Pomodoro taimer: tööta keskendunud ringides, seejärel puhka. See ei vaja seadistamist: 25 minutit keskendumist, 5 puhkust ja pärast nelja ringi pikk 15-minutiline paus.\n\nAva Pomodoro tööriistade menüüst ja vajuta Start või lisa selle vidinad avaekraanile (hoia avaekraani all, seejärel lisa vidin): Pomodoro taimer näitab faasi ja järelejäänud minuteid, Pomodoro start/paus on nupp ning Pomodoro täna loeb lõpetatud ringe koos sinu päevaeesmärgiga. Taimeri puudutus käivitab või peatab selle; hoia seda all, et avada täisekraan.\n\nTaimer jätkab tööd, kui ekraanilt lahkud, ja jätkab pärast taaskäivitust kella järgi. Kui lugeja magab, ei tööta midagi: vahepeal lõppenud faasist öeldakse ärkamisel. Teade ütleb, kui faas on läbi. Aku säästmiseks uuendatakse kella kord minutis (täisekraanil viimasel minutil iga kümne sekundi järel) ja see ei hoia lugejat kunagi ärkvel.\n\nSeadetes jaotises Pomodoro sead pikkused ja komplekti ringid ning selle, kas järgmine faas algab ise. Jaotises Veel: ekraani vilgatus või esivalguse pilge faasi lõppedes ning päevaeesmärk."
