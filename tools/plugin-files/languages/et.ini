transfer.plugin.name = Ülekanne
transfer.plugin.description = Pane raamatud ja muud failid seadmesse samas võrgus olevast brauserist.
transfer.plugin.how = "Wi-Fi-ülekanne paneb raamatud ja muud failid seadmesse samas võrgus olevast brauserist, ilma kaabli või rakenduseta. Saad ka faile tuua, kaustu luua ja kustutada.\n\nAva see jaotisest Tööriistad. Ekraan näitab aadressi tekstina ja QR-koodina: ava see brauseris telefonis või arvutis või skanni kood. Aadress sisaldab iga kord uuesti tehtud võtit, nii et teised võrgus ei pääse sinu failidele ligi. Ülekanne töötab, kuni ekraan on avatud.\n\nKus PaperPaw haldab Wi-Fi-t ise, nagu X4-l, avab all olev Ilma ruuterita seadme enda võrgu, millega telefon ühineb koodi skannides."
