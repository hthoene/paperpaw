about.plugin.name = Teave
about.plugin.description = PaperPaw versioon ja litsentsid.
about.plugin.how = "Teave näitab, millist PaperPaw versiooni sul on, kus asub selle lähtekood ja milliste litsentside all see on.\n\nSelle leiad seadete lõpust nimega PaperPaw teave. Vali rida nooleklahvide ja nupuga Vali või puuduta seda. Loetletud on ka püsivarasse sisseehitatud pluginad ning seadmetel, mis laadivad koodiga pluginaid, sõrmejälg, mille jaoks sellised pluginad peavad olema ehitatud.\n\nLitsentsid avanevad tekstina lugejas, nii et lehitsed seda nagu raamatut. See sisaldab PaperPaw enda litsentsi ning kaasas olevate kirjatüüpide, ikoonide ja poolitusmustrite litsentse. Pluginad võivad lisada oma rea, näiteks teema autori."
