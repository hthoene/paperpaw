weather.plugin.name = Ilm
weather.plugin.description = Ilm praegu ja lähipäevadel vidinatena, Open-Meteolt.
weather.plugin.how = "Ilm näitab ilma praegu ja lähipäevadel avaekraani vidinatena, Open-Meteolt, mis ei vaja kontot ega võtit. Ilm praegu näitab temperatuuri, ilmaolusid ja muud valitavat; Prognoos näitab lähipäevi reas või loendina.\n\nVali esmalt koht: seadetes jaotises Ilm, Koht (tipi nimi, seejärel vali see leitud kohtade seast). Saadetakse ainult selle koordinaadid ja ainult siis, kui ilmavidin on nähtaval. Lisa vidinad avaekraani muutes.\n\nIlma tuuakse kõige rohkem nii tihti, kui Uuenda kõige rohkem iga ütleb, ja ainult siis, kui võrk on olemas: see ei lülita Wi-Fi-t kunagi ise sisse.\n\nIlmaandmed: Open-Meteo.com (https://open-meteo.com), litsentsi Creative Commons Attribution 4.0 (CC BY 4.0) all."
