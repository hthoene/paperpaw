format-cbz.setting.panels.help = Üks paneel korraga, lehekeeramised astuvad neist läbi.
format-docx.plugin.name = DOCX-dokumendid
format-docx.plugin.description = Avab .docx-faile, nagu Word ja teised programmid need salvestavad.
format-docx.plugin.how = "Avab .docx-dokumendid raamatutena: pealkirjad koos sisukorraga, loendid, tabelid, rasvane ja kursiiv, lingid ja pildid (JPEG, PNG, GIF).\n\nPane failid raamatukogu kausta ja ava raamatukogust. Pealkiri ja autor pärinevad dokumendi atribuutidest. Joonealuseid märkusi, päiseid ja jaluseid ning kommentaare ei näidata."
format-docx.title = DOCX-dokument
format-epub.plugin.name = EPUB
format-epub.plugin.description = Avab EPUB-raamatud koos nende stiilide, sisukorra ja piltidega.
format-epub.plugin.how = "EPUB-raamatud avanevad raamatukogust nagu iga teine raamat, koos sisukorra, piltide ja kirjastaja vormistusega. Veebilehed (HTML), Markdown, FictionBook (.fb2) ja koomiksiarhiivid (.cbz) avanevad samamoodi, igaüks oma plugina kaudu.\n\nPeatükk teisendatakse esimesel avamisel ja hoitakse plugina vahemälus, nii et pärast on see kiirem ja suured raamatud töötavad väikestes seadmetes. Sisukorra leiad lugemismenüüst valikust Sisukord. Kas raamatu enda vormistus kehtib, määrab säte Kirjastaja vormistus jaotises Lugemine."
format-epub.title = EPUB e-raamat
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Avab FictionBook-raamatud (.fb2, ka pakitult).
format-fb2.plugin.how = "Avab FictionBook-raamatud (.fb2), mis on levinud vene ja muude raamatute puhul, ka pakitult (.fb2.zip), koos nende pealkirja, autorite, kaane ja peatükkidega.\n\nPane need raamatukogu kausta; need ilmuvad raamatukogus ja avanevad nagu iga teine raamat."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Avab failidena salvestatud veebilehti, näidates ainult seda, mida on vaja lugeda.
format-html.plugin.how = "Avab failidena salvestatud veebilehti (.html, .htm, .xhtml) raamatutena: ainult see, mida on lugeda, ilma menüüde, reklaamide ja muu sellise ümbruseta.\n\nPane fail raamatukogu kausta ja ava raamatukogust nagu iga raamat. Lehesisesed lingid töötavad; pildid kuvatakse seal, kus need failis on."
format-html.title = Veebileht (HTML)
format-images.plugin.name = Pildid
format-images.plugin.description = Avab pilte (.jpg, .png, .gif) raamatutena, igaüks ühel lehel.
format-images.plugin.how = "Pildid (.jpg, .png, .gif) avanevad raamatukogust nagu raamatud, üks pilt lehe kohta, ekraanile sobitatud.\n\nTerve piltide kausta lugemiseks ava selle esimene pilt: sellele järgnevad kaustas olevad pildid nende nimede järjekorras (2 enne 10). Kausta hilisem pilt algab sealt; koht igaühes jäetakse eraldi meelde. Kuni 300 pildiga kausta loetakse avatud pildist alates.\n\nFail, mis pole pilt või on liiga suur, näitab selle asemel oma nime. Paljudest piltidest koosneva raamatu jaoks, millel on oma pealkiri, on parem vorm koomiksiarhiiv (.cbz)."
format-images.title = Pilt
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Avab Markdown-faile (.md), nt märkmeid.
format-markdown.plugin.how = "Avab Markdown-faile (.md), näiteks märkmeid, raamatutena: pealkirjad, loendid, tsitaadid ja rõhutused nii, nagu need on mõeldud, mitte märkidena.\n\nPane failid raamatukogu kausta ja ava raamatukogust. Esimene pealkiri on selle pealkiri; faili kõrval olevad pildid kuvatakse seal, kus tekst neid nimetab."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI-raamatud
format-mobi.plugin.description = Avab .mobi- ja .azw-faile ilma DRM-ita.
format-mobi.plugin.how = "MOBI-raamatud (.mobi, .azw) avanevad raamatukogust nagu iga raamat, ilma midagi seadistamata. Pealkiri, autorid, keel ja kaas pärinevad raamatust ning sisukord tehakse selle pealkirjadest.\n\nRaamat teisendatakse esimesel avamisel, mis võtab pika raamatu puhul paar sekundit; pärast seda avaneb see kohe. Näidatakse teksti, pealkirju, rasvast ja kursiivi, linke ja pilte.\n\nDRM-iga raamatuid (enamik poest ostetud raamatuid) ei saa avada, samuti mitte Huffmani pakkimisega ega uuemas KF8 vormis (.azw3) raamatuid: PaperPaw ütleb seda avamisel. EPUB-koopia, mis on tehtud näiteks Calibre abil, avaneb alati."
format-mobi.title = MOBI-raamatud
format-rtf.plugin.name = RTF-dokumendid
format-rtf.plugin.description = Avab .rtf-faile raamatutena.
format-rtf.title = RTF-dokumendid
format-txt.plugin.name = Lihttekst
format-txt.plugin.description = Avab lihttekstifaile (.txt).
format-txt.plugin.how = "Lihttekstifailid (.txt) avanevad raamatukogust nagu iga raamat, ilma midagi seadistamata. Plugin loeb UTF-8, UTF-16 ja Windows-1252 teksti ning leiab kodeeringu ise.\n\nLõigud järgivad faili tühje ridu; kui failis neid pole, on iga rida lõik. Project Gutenbergi failides jäetakse alguse ja lõpu litsentsitekst välja ning pealkiri ja autor võetakse päisest.\n\nFaili ei laadita kunagi tervelt, nii et väga suuri tekste saab avada ka väikestes seadmetes."
format-txt.title = Lihttekst
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Avab XTC- ja XTCH-raamatuid, Xteinki lugejate eelrenderdatud lehti.
format-xtc.plugin.how = "XTC- ja XTCH-failid on raamatud, mille leheküljed on juba piltidena renderdatud, nagu Xteinki lugejate teisendajad need teevad. Need avanevad raamatukogust nagu iga raamat.\n\nKuna iga leht on kindel pilt, ei saa teksti suurust muuta ega seda teises kirjatüübis näidata. Lehed on mustvalged või neljas halli toonis. Iga leht dekodeeritakse selle näitamisel, nii et mälu on vaja vähe, ka X4-l.\n\nPealkiri, autor ja peatükid võetakse failist, kui neid seal on."
format-xtc.title = XTC leheküljed
help.plugin.name = Vihjed
help.plugin.description = Näitab ekraani juhtelementide tähendust esimesel avamisel.
help.plugin.how = "Ekraani esimesel avamisel ütleb selle kohal lühike märkus, mida juhtelemendid teevad: ekraani osad, kuhu puudutus läheb, raamis, ning mida nupud teevad.\n\nPuudutus või suvaline nupp sulgeb märkuse ja see ei tule selle ekraani jaoks tagasi. Rohkem vihjeid mitte lülitab need kõik välja.\n\nSeadetes jaotises Süsteem lülitab Vihjed need sisse või välja ja Näita vihjeid uuesti näitab iga ekraani märkust veel kord."
