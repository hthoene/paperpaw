mail.plugin.name = E-post
mail.plugin.description = Loeb ja saadab e-kirju parooli või rakenduseparooliga (IMAP ja SMTP), ilma brauseris sisselogimiseta.
mail.plugin.how = "E-post loeb ja saadab e-kirju IMAP-i ja SMTP kaudu. See logib sisse sinu aadressi ja parooliga, ilma brauseris sisselogimiseta, nii et töötab iga pakkujaga, kes seda lubab.\n\nSeadista konto jaotises Seaded, E-post. Vali oma pakkuja, sisesta oma aadress ja parool. Enamik pakkujaid tahab rakenduseparooli: tee see oma konto turvaseadetes ja kasuta seda siin. Sinu tavaline parool sageli ei tööta ning see ei lähe kunagi mujale kui sinu pakkuja serverisse. Seda hoitakse koos paroolide ja võtmetega.\n\nAva E-post tööriistades. Kontrolli posti toob viimased kirjad ja kaustad. Kirju hoitakse kaardil, nii et saad neid lugeda ilma võrguta. Seade ühendub, toob ja katkestab ühenduse, nii et Wi-Fi on sees vaid hetke.\n\nKui sinu pakkujat pole loendis, vali Oma serverid ja sea serverinimed, pordid ja turvalisus täpsemates seadetes. Server, mille sertifikaadi eest ükski asutus ei kosta, küsib üks kord, kas seda usaldada; võrdle sõrmejälge sellega, mida su pakkuja näitab.\n\nKirjal, millele on lisatud raamat (EPUB, PDF jms, kuni 2 MB), on all Ava raamat: see toob faili, paneb selle sinu raamatukokku ja avab selle.\n\nUue posti nägemiseks E-posti avamata lülita jaotises Seaded, E-post sisse Kontrolli uut posti taustal ja vali, kui tihti (iga 15, 30 või 60 minuti järel). See on väljas, kuni sa selle sisse lülitad. Lugeja ühendub siis aeg-ajalt turvalise ühenduse kaudu, kui see on ärkvel ja võrgus, ühe konto teise järel, ja uuendab avaekraanil lugemata kirjade arvu. See kasutab veidi akut. E-posti avamine peatab käimasoleva kontrolli.\n\nAvaekraani vidinad näitavad lugemata kirjade arvu, viimaseid ja tärniga kirju, ühte postkasti ning otseteed kirja kirjutamiseks."
