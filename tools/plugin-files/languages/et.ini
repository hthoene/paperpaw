plugin-manager.plugin.name = Pluginahaldur
plugin-manager.plugin.description = Loetleb pluginad ning lülitab neid sisse ja välja.
plugin-manager.plugin.how = "Pluginahaldur loetleb iga plugina koos versiooni ja kirjeldusega ning lülitab pluginaid sisse ja välja.\n\nSelle leiad seadetest nimega Halda pluginaid. Pluginate seaded on eraldi leht eelistuste jaoks, näiteks iga plugina võrgukasutus. Puuduta pluginat, et see sisse või välja lülitada (nuppudega vali see). Muudatus rakendub pärast taaskäivitust: all olev riba pakub siis valikut Taaskäivita kohe. Hoia pluginat all (nuppudega hoia Vali), et lugeda, kuidas see töötab.\n\nPluginat, mis on märgitud Alati sees, ei saa välja lülitada, ja märgitud Nõutav saab välja lülitada alles siis, kui teine plugin selle töö üle võtab, muidu poleks PaperPawl tagasiteed. Jaotises Ekraanid valid, milline plugin näitab kohta, mida pakuvad mitu."
