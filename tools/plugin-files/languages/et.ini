dictionary.plugin.name = Sõnastik
dictionary.plugin.description = Otsib sõnu StarDicti sõnastikest.
dictionary.plugin.how = "Sõnastik otsib raamatust sõna StarDicti sõnastikest ja näitab definitsioone paneelil ekraani alaosa kohal.\n\nLugejas hoia sõna all ja vali Otsi sõnastikust; nuppudega kasuta valikut Vali tekst jaotises Veel. Kopeeri sõnastikukaustad (koos .ifo, .idx ja .dict failidega) seadme kausta „dictionaries“, alamkaustad kaasa arvatud, või vali muu kaust jaotises Seaded, Lugemine, valikus Sõnastiku kaust (täpsem säte). Esimene otsing valmistab iga sõnastiku jaoks ette väikese indeksi, mis võtab hetke.\n\nPaneelil kerivad lehenupud või Üles ja Alla pikki definitsioone ning Tagasi sulgeb selle. Puudutusega sulge see, puudutades selle välisosa."
