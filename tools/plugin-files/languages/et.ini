calendar.plugin.name = Kalender
calendar.plugin.description = Sinu kalendrid lugejal: päevakava, päeva-, nädala- ja kuuvaated CalDAV-i, iCali ja failide põhjal, sünnipäevad kontaktidest, avaekraani vidinad ja unerežiimi ekraan.
calendar.plugin.how = "Sinu kalendrid lugejal: lähipäevade päevakava, päev, nädal ja kuu, koos CalDAV-kalendrite (Nextcloud, Radicale, Baïkal, Fastmail ja teised), iCal-aadresside (.ics, webcal://), kaardil olevate kalendrifailide ning sinu kontaktide sünnipäevade ja aastapäevadega (CardDAV). Lugeja ainult loeb kalendreid; ta ei muuda neid kunagi.\n\nAva Kalender menüüst Tööriistad. Esimene rida nimetab vaate; vali see või hoia suvalist rida all või vajuta Menüü, et vahetada Päevakava, Päeva, Nädala, Kuu ja Sünnipäevade vahel, lisada kalendreid või sünkroonida. Päeva ja Nädala vaates liiguvad kaks esimest rida eelmisele ja järgmisele päevale või nädalale (seda teevad ka lehenupud); Kuu vaates liigutavad nooleklahvid päeva, lehenupud kuud ja Vali avab päeva. Vali sündmusel näitab seda tervikuna: millal, kus, milline kalender ja kuidas see kordub. Tagasi läheb ühe sammu tagasi.\n\nLisa kalender jaotises Kalendrid (menüüs või Kalender seadetes). Vali selle liik: CalDAV-konto (serveri aadress piisab, nt cloud.example.com/remote.php/dav; iga sündmustega kalender muutub vaate osaks), iCal-aadress (.ics-failina avaldatud kalender), kaardil olev kalendrifail või kontaktid (CardDAV-aadressiraamat: lugeja näitab nendega salvestatud sünnipäevi ja aastapäevi). Sisesta aadress, konto puhul oma kasutajanimi ja parool (parim on rakenduseparool; see hoitakse koos lugeja paroolidega) ning nimi. Igal kalendril on märgis (punkt, rõngas, hall punkt või ruut), mida saad muuta, et neid eristada; kuni kuus kalendrit.\n\nKorduvad sündmused (iga päev, nädal, kuu, aasta, nädalapäevade, arvude, lõppkuupäevade ja väljajäetud päevadega), terve päeva sündmused ja teistes ajavööndites toimuvad sündmused näidatakse lugeja enda kellaajas. Lugeja hoiab sündmusi kuuskümmend päeva enne kuni kuuskümmend päeva pärast tänast päeva, kuni 240, ja näitab neid ilma võrguta. Reeglid, mida ta lugeda ei oska, näitavad oma sündmust ühe korra.\n\nKalendreid loetakse, kui avad kalendri (kuni iga viie minuti järel), kui valid Sünkrooni kohe ning, nagu seadistad jaotises Kalender seadetes, kui võrk on niikuinii sees või kui laadimine algab. Lugeja ei lülita selleks kunagi oma raadiot sisse, välja arvatud siis, kui palud Sünkrooni kohe.\n\nAvaekraani vidinad (hoia avaekraani all, seejärel lisa vidin): Täna näitab kuupäeva ja mida päev toob, Järgmine sündmus järgmist sündmust, Päevakava lähipäevi, Kuu kuud, kus sündmustega päevade all on punkt, ja Sünnipäevad järgmisi sünnipäevi. Sündmuse puudutus avab selle, kuupäeva puudutus kuul avab selle päeva. Unerežiimi ekraan võib näidata tänast päevakava: vali seadetes jaotises Unerežiimi ekraan Kalender."
