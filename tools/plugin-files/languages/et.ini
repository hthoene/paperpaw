widgets.plugin.name = Vidinate pakett
widgets.plugin.description = Palju rohkem avaekraani vidinaid: kellad, kalender, tsitaadid, raamatud, märkmed ja muu.
widgets.plugin.how = "Vidinate pakett lisab avaekraanile palju vidinaid: kellad (analoog-, sõna-, plaat- ja maailmakell), kalender, aasta seni, tagasiloendus, kuufaas ning päev ja kuupäev; päeva tsitaat, märkmed, ülesanded, pildid, tervitus ja PaperPaw logo; ning raamatute jaoks praegu loetav, edenemine, järgmine, sari, lemmikud, esiletõst ja raamatukogu numbrites. Ka akuvidin on selles.\n\nLisa need menüüst Muuda avaekraani (või avaekraani pika vajutusega), seejärel Lisa vidin. Igal on oma seaded, näiteks raam, suurus ja joondus. Muutuva vidina, näiteks päeva tsitaadi, valimine näitab järgmist. Sinu enda tsitaadid lähevad kaardil olevasse kausta .paperpaw/plugins/widgets faili quotes.txt, iga rida kujul tekst | autor. Ajavidinad vajavad seatud kella; Wi-Fi seab selle."
