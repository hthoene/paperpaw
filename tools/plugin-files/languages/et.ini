rules.plugin.name = Reeglid
rules.plugin.description = Kui midagi juhtub, teeb midagi: nt öörežiim kell 22:00.
rules.plugin.how = "Reegel teeb midagi ise, kui midagi juhtub: öörežiim iga päev kell 22:00 sisse või kataloogid sünkroonitakse PaperPaw käivitumisel.\n\nReeglid on jaotises Seaded, Kohandamine, nimega Reeglid. Lisa reegel küsib Millal? (PaperPaw käivitub, kellaaeg, raamat avatakse või suletakse, aku, laadimine, lüliti ja muu) ja Mis siis? (käivita tegevus, lülita lüliti sisse või välja, sea arv, näita teadet). Puuduta reeglit, et see peatada; hoia seda all (nuppudega hoia Vali) tingimuse jaoks, näiteks Kahe kellaaja vahel, või et see eemaldada.\n\nValitavad tegevused, lülitid ja arvud tulevad plugina kaupa: vali plugin, seejärel see, mida see toob; tagasi väljub sealt. Tegevus, mis töötab näidatud ekraanil, näiteks Tagasi või Järgmine lehekülg, teeb seda, mida see teeks seal vajutades.\n\nKellaajad kehtivad olenemata sellest, milline ekraan on avatud. Kaks reeglit, mis üksteist tühistavad, peatuvad mõne sammu järel."
