power.plugin.name = Energia
power.plugin.description = Valib energiarežiimi käsitsi või aku järgi: Tavaline, Säästmine, Võrguta.
power.plugin.how = "Energia valib, kuidas PaperPaw akut kulutab: Tavaline, Säästmine või Võrguta. Säästmine teeb seda, mis saab oodata, paremal hetkel; Võrguta hoiab raadio väljas. Auto valib aku järgi.\n\nMuuda režiimi kiirpaneelil, kus Energia näitab režiime kõrvuti, või jaotises Seaded, Energia. Seal sead ka tasemed, kus Auto lülitub Säästmisele ja Võrguta režiimile, ning kas see jääb laadimise ajal Tavaliseks.\n\nOlekuridadel näitab Energiarežiim säästmise ajal lehte ja võrguta olles läbikriipsutatud Wi-Fi-t ning tavarežiimis mitte midagi.\n\nHoia toitenuppu all, et avada väike menüü: Unerežiim, Lülita välja (kus PaperPaw saab), Taaskäivita ning puuteseadmetel Lukusta puudutus või Ava puudutus. Lühike vajutus paneb seadme endiselt unerežiimi. Tagasi väljub menüüst."
