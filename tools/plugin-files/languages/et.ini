home.plugin.name = Avaekraan
home.plugin.description = Algleht: vidinate lehed, näiteks loetav raamat ja tööriistad.
home.plugin.how = "Avaekraan koosneb lehtedest, millest igaüks on vidinate ja tööriistade ruudustik nagu telefonis. Alguses on kell, loetav raamat ja hiljuti loetud raamatud ühel lehel ning kõik tööriistad järgmisel.\n\nPuuduta üksust, et see avada, ning libista või kasuta lehenuppe lehtede vahetamiseks. Ainult nuppudega liiguvad nooleklahvid ühelt üksuselt järgmisele ja Vali avab selle.\n\nUmberkorraldamiseks hoia avaekraani all, puuduta lehe all olevat pliiatsit või vali menüüst Muuda avaekraani. Lohista üksusi, et neid liigutada, või puuduta üht selle valikute jaoks, ka nuppudega. Seal on ka Lisa vidin. Veerud ja Read on seadetes jaotises Välimus, osas Avaekraan.\n\nKüljele pööratud ekraanil näitab avaekraan samu üksusi rohkemate veergudega, iga leht täidetakse enne järgmist ja kaardid pole laiemad kui umbes 110 mm; midagi, mille püsti paigutasid, ei muudeta. Korralda see küljel ja see paigutus jääb selle suuna jaoks eraldi alles: uued vidinad lisatakse mõlemasse. Lähtesta külgpaigutus valikus Lisa (muutmise ajal) läheb tagasi tuletatud paigutuse juurde. Vidina või tööriista eemaldamine ühes suunas ei eemalda seda teisest."
