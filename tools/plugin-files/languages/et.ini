lock.plugin.name = Ekraanilukk
lock.plugin.description = PIN-kood, muster või parool seadme ärkamisel; puudutus lukustatud lugemise ajal.
lock.plugin.how = "Ekraanilukk küsib PIN-koodi, mustrit või parooli, kui PaperPaw käivitub ja kui seade ärkab. See on alguses väljas. See hoiab eemal ainult juhuslikku kasutamist: kood ja valesti proovimiste arv hoitakse SD-kaardil, nii et kes iganes kaardi välja võtab, seda muudab või vahetab, pääseb lukust mööda.\n\nSea see seadetes jaotises Seade, Ekraanilukk: sisesta kasutusel olev kood, kui see on olemas, vali liik, seejärel uus kood kaks korda. Mustrit pakutakse ainult puuteekraanidel.\n\nPärast viit valesti proovimist ootab järgmine pool minutit. Lukusta kohe lukustab kohe ja selle saab panna nupule, žestile või reeglile. Lukusta pärast ärkamist saab välja lülitada, nii et lukustab ainult tõeline käivitus (sisselülitamine või taaskäivitus), välja arvatud seal, kus iga ärkamine on käivitus, nagu X4 akutoitel.\n\nPuutelukk, selle kõrval: Lukusta puudutus kiirpaneelil ja lugemismenüüs paneb puudutused, libistused ja pliiatsi mitte midagi tegema, kuigi nupud töötavad endiselt, nt et lugeda käsi ekraanil. Avamiseks puuduta kaks korda ühe sõrmega ja hoia see hetkeks all; toitenupu hoidmine avab toitemenüü, kus Ava puudutus teeb seda nuppudega; X4 Pro puhul avab avaleheklahvi hoidmine selle kohe."
