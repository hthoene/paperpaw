sleep.plugin.name = Unerežiimi ekraan
sleep.plugin.description = Näitab seadme magamise ajal magavat kassi, raamatu kaant, sinu pilte või teadet.
sleep.plugin.how = "Unerežiimi ekraan otsustab, mida ekraan näitab, kui seade magab. E-tint hoiab pilti ilma vooluta.\n\nVali see seadetes jaotises Seade, Unerežiimi ekraan, valikuga Näita: magav kass (vaikimisi), raamatu kaas, minu pildid, logo ja „Magab“, vidinad, lehekülg nagu on või lehekülg pildiga. Minu pildid näitab kausta Pictures faile üksteise järel.\n\nIlma kaane või pildita näidatakse kassi. Kus süsteem joonistab unerežiimi ekraani ise, on need seaded peidetud.\n\nVäljalülitatud ekraan, Näita väljalülitamisel, joonistatakse üks kord seadme väljalülitamisel toitemenüüst või pärast valiku Lülita välja pärast unerežiimi aja möödumist (mitte siis, kui tühi aku katkestab voolu). See on nagu unerežiimi ekraan, kui sa ei vali logo ja „Välja lülitatud“, kassi, kaant või minu pilte. Teine plugin võib selle jaoks ekraani pakkuda.\n\nKäivitus- ja taaskäivitusekraan, Näita käivitamisel ja Näita taaskäivitamisel, on seadme enda, kui teine plugin ei paku nende jaoks ekraani. Pluginad ei tööta seadme käivitumisel veel: käivituseks valitud ekraan joonistatakse ette, kui seade välja lülitub või taaskäivitub, ja näidatakse järgmisel käivitamisel. Ekraan, mis pole õigel ajal valmis, või kahjustatud pilt annab teed seadme enda omale; seade lülitub niikuinii välja või taaskäivitub."
