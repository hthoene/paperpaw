stats.plugin.name = Lugemisstatistika
stats.plugin.description = Salvestab, kui kaua ja palju sa loed, koos kalendri ja iga raamatu numbritega.
stats.plugin.how = "Lugemisstatistika salvestab, kui kaua iga lehekülge loed. Näed seda ülevaatena koos tänase, nädala ja seeriaga, kalendrina ning iga raamatu numbritega.\n\nAva see Tööriistadest või lugejas valikust Veel. Seadetes jaotises Lugemisstatistika saad Salvesta lugemist välja lülitada, seada Päevaeesmärgi ning seada Lühima lehekülje ja Pikima lehekülje, mis loevad, et lehitsemine või lahtiseks jäetud raamat numbreid ei moonutaks.\n\nSünkrooni KOReaderiga jagab statistikat KOReaderiga WebDAV-kausta kaudu. See võtab üle ka sama seadme KOReaderi statistika. Salvestamine vajab seatud kella: kus seda pole, ühendu kord Wi-Fi-ga."
