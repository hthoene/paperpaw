translate.plugin.description = Tõlgib valitud teksti võrgus DeepL-iga.
translate.plugin.how = "Tõlge tõlgib valitud teksti võrgus DeepL-iga. Vali raamatus tekst ja vali valitud teksti menüüs Tõlgi: tõlge ilmub lehe kohale nagu sõnastikukirje. Lehenupud või puudutused kerivad seda ning Vali või puudutus selle lõpus sulgeb selle.\n\nSee vajab võrku ja sinu enda DeepL API võtit, tasuta aadressil deepl.com (DeepL API Free, umbes 500 000 märki kuus). Kuni selle sisestad, ütleb paneel seda ja puudutus küsib seda.\n\nSeadetes jaotises Lugemine, osas Tõlge seab Tõlgi keelde keele; alguses on see PaperPaw oma."
