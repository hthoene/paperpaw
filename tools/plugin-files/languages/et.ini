tasks.plugin.name = Ülesanded
tasks.plugin.description = Ülesannete loendid tähtaegade ja prioriteetidega, lugejal või sünkroonitud sinu CalDAV-serveriga, avaekraani vidinatega.
tasks.plugin.how = "Ülesannete loendid sinu lugejal: ülesanded tähtaja ja prioriteediga, tehtud märgitakse linnukesega. Need töötavad ilma seadistamata ja ilma võrguta ning neid saab hoida sünkroonis CalDAV-serveriga (Nextcloud, Radicale, Baïkal, Fastmail ja teised), nii et samad loendid on sinu telefonis ja arvutis.\n\nAva Ülesanded tööriistade menüüst. Esimene rida nimetab näidatud loendi; vali see teise loendi, Täna ja üle tähtaja kõigi loendite kohta, uue loendi, sünkroonimise või konto seadmise jaoks. Lisa ülesanne avab klaviatuuri. Vali ülesandel märgib selle tehtuks (uuesti: tegemata). Hoia ülesannet all või vajuta Menüü, et muuta selle pealkirja, tähtaega (täna, homme, nädala pärast või tipitud kuupäev, nt 2026-12-24) või prioriteeti või see eemaldada. Tegemata ülesanded tulevad esimesena, päeva ja seejärel prioriteedi järgi; tehtud jäävad nädalaks lõppu (seatakse seadetes jaotises Ülesanded), seejärel lahkuvad need lugejast.\n\nAvaekraani vidinad (hoia avaekraani all, seejärel lisa vidin): Ülesanded täna näitab, mis on täna tähtajaga või üle tähtaja, Ülesannete loend näitab üht loendit, Tegemata ülesanded loeb need kokku ja Järgmine ülesanne näitab järgmist tegemisele minevat. Vidinas ülesande puudutus märgib selle tehtuks; pealkirja puudutus avab loendid.\n\nSünkroonimiseks vali loendireast CalDAV-konto ja sisesta serveri aadress, oma kasutajanimi ja parool (parim on rakenduseparool). Serveri aadress piisab, nt cloud.example.com/remote.php/dav; lugeja leiab sealt sinu ülesannete loendid. Iga serveri ülesannete loend muutub lugejas loendiks. Lugeja sünkroonib, kui avad Ülesanded, kui valid Sünkrooni kohe ja kui võrk on niikuinii sees; mida muudad ilma võrguta, ootab ja saadetakse hiljem. Kui ülesannet muudeti lugejal ja vahepeal mujal, võetakse serveri versioon ja sinu oma jäetakse uue ülesandena selle kõrvale, nii et midagi ei lähe kaotsi. Märkused, äratused ja kõik muu, mis ülesandel serveris on, jäävad nii, nagu on. Korduvad ülesanded näidatakse, kuid neid muudetakse seal, kus sa need tegid. Lugeja hoiab kuni 200 ülesannet 12 loendis."
