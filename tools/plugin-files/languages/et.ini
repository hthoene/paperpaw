battery.plugin.name = Aku kasutus
battery.plugin.description = Salvestab aku laetuse ja näitab, kui kaua see vastu peab.
battery.plugin.how = "Aku kasutus märgib laetuse üles umbes kord minutis, kui seade on ärkvel, koos sellega, mida see tegi: ekraani värskendused ja keeratud lehed. Sellest arvutab see, kui palju kulub ühe ärkveloleku tunni ja 100 lehekülje peale ning kui kaua aku selle tempoga vastu peab.\n\nAva Aku menüüst Tööriistad. See näitab praegust laetust, seda ärkveloleku aega, seni akutoitel kulunut ja viimaseid ärkvelolekuaegu. Lehitseda saab lehenuppudega või üleval olevaid nooli puudutades.\n\nEnne kui numbrid midagi tähendavad, on vaja veidi akutoitel lugeda. Salvestamine on vaikimisi sees ja selle saab välja lülitada jaotises Seaded, Seade, Energia, valikuga Salvesta aku kasutust."
