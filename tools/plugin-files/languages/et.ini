menu-editor.plugin.name = Menüüredaktor
menu-editor.plugin.description = Järjestab, eemaldab ja lisab iga menüü kirjeid.
menu-editor.plugin.how = "Menüüredaktor muudab, mida menüüd sisaldavad: liiguta kirjeid üles või alla, eemalda need või lisa uusi.\n\nSelle leiad jaotisest Seaded, Kohandamine, nimega Kohanda menüüsid. Vali menüü, seejärel kirje, et seda liigutada või eemaldada; Lisa kirje paneb uue. Muudatused kehtivad kohe. Lähtesta see menüü toob menüü tagasi sellisena, nagu selle pluginad seda määravad, Lähtesta kõik menüüd teeb seda iga menüü kohta.\n\nEnda välja lukustada ei saa: kirje, mis on tee seadeteni, jääb, kuni lisad sinna teise tee."
