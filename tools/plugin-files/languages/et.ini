picture-home.plugin.name = Pildiga avaekraan
picture-home.plugin.description = Avaekraan sinu enda pildiga vidinate taga ja seadistatava olekuribaga.
picture-home.plugin.how = "Pildiga avaekraan asendab avaekraani, kui see on sees: sinu enda pilt vidinate taga ning sinu korraldatud vidinate ja tööriistade lehed. Lülita see pluginahalduris välja ja sisseehitatud avaekraan on tagasi koos oma lehtedega.\n\nPane pildid (JPEG, PNG või GIF) kaardil olevasse kausta (vaikimisi wallpapers), seejärel vali üks jaotises Seaded, Kohandamine, Pildiga avaekraan. Sobitus ütleb, kuidas see ekraani täidab (täida, terve pilt, venita, originaalsuurus, kõrvuti), Asukoht, milline osa jääb, Suum, kui suur, ja Kahvata pilt, kui kahvatu: kahvatum pilt teeb vidinad paremini loetavaks. Pilt valmistatakse ette üks kord iga ekraanisuuruse jaoks, mis võtab hetke.\n\nVidinad asuvad pildi kohal plaatidel. Korralda leht nagu sisseehitatud avaekraanil: pliiats lehe all või Muuda avaekraani menüüs.\n\nOlekuriba (kellaaeg, Wi-Fi, aku või see, mille valid) võib olla sees, väljas või automaatne, üleval või all, täislaiuses või väikese pillina vasakul, keskel või paremal, heledal, tumedal või hallil plaadil või pildil endal. Nuppe nimetav rida (X4-l) võib samuti olla sees, väljas või automaatne. Automaatne tähendab, et nupuvajutus näitab neid mõne sekundi; see vajutus ei tee midagi muud.\n\nPildi renderdus ütleb, kuidas pilt joonistatakse: Halli tasemed igas ekraanil olevas halli toonis (X4-l aeglasem), Rasterdatud mustvalgete punktidena (kiire) või Automaatne, nagu sisseehitatud avaekraan: halli tasemed ekraani joonistamisel, punktid pärast esimest muutust. Kus ekraanil pole halli tasemeid, taanduvad halli tasemed punktideks."
