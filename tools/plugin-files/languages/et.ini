vocabulary.sd.readme = "Kaardid failidest\n\nPane siia iga paki jaoks fail: Spanish.tsv teeb paki Spanish.\nFailid: .tsv, .csv või .txt, salvestatud UTF-8 kujul, või .apkg: Anki pakk, eksporditud valikuga Toeta vanemaid Anki versioone märgitud. Selle märkmete esimesed kolm välja saavad esikülje, tagakülje ja näite; selle ajastust ja meediat ei loeta ning PaperPaw ei kirjuta kunagi Anki faili.\n\nÜks kaart igal real: esikülg, tagakülg ja näide (valikuline), eraldatud tabulaatori, koma või semikooloniga. Esimene rida võib nimetada veerud: front, back, example. Näide:\n\nKass\tcat\tKass magab.\n\nSeejärel ava lugejal Kaardid, vali Kaardid SD-kaardil ja siis Uuenda pakke kaardilt.\n\nMõistlik teada:\n- Pakid jäävad lugejale, koos sellega, mida õppisid. Fail loetakse, kui see on uus või muudetud, ning selle kaardid lisatakse pakki või muudetakse seal.\n- Muuda faili kaardi tagakülge või näidet: kaart muutub ja säilitab sinu edenemise.\n- Muuda kaardi esikülje teksti: see loeb uueks kaardiks ja vana algab otsast. Kaarte sobitatakse esikülje teksti järgi, tühikud ja suurtähed ei loe. Salvesta pakk faili (Kaardid SD-kaardil, Salvesta pakk kaardile) ja igal kaardil on veerus id number: muuda seal esikülge, jäta faili kaks esimest rida nii, nagu on, ja kaart säilitab õpitu.\n- Salvestamine kirjutab paki kaardid. Mis oli failis ja pole kaart (esiküljeta rida), seda ei säilitata; seal olnud fail kopeeritakse faili _name.bak.tsv.\n- Salvesta fail CSV UTF-8 kujul (mitte UTF-16, mitte tabelarvutuse enda vormingus). Faili, mis on üle 4 MiB või 20 000 rea, ei loeta: jaga see.\n- Rida, mille failist kustutad, ei kustuta kaarti paki sees, kui sa ei lülita selle paki jaoks sisse Eemalda puuduvad kaardid. Siis kaob kaart koos sellega, mida õppisid.\n- Faile, mille nimi algab _, ei loeta.\n"
