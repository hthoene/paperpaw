notes-overview.plugin.name = Kõik märkmed
notes-overview.plugin.description = Kõigi raamatute järjehoidjad ja esiletõsted ühes loendis ning eksport failina My Clippings.txt.
notes-overview.plugin.how = "Kõik märkmed loetleb iga raamatu, milles tegid järjehoidja või esiletõsteid, koos nende arvuga. Ava see jaotises Tööriistad. Vali raamat, et näha selle märkmeid, ja märkus, et avada raamat selles kohas.\n\nLoendi lõpus kirjutab Ekspordi failina My Clippings.txt kõik märkmed ühte faili, raamatukogu kõrval olevasse kausta Exports, kujul, mida Kindle kasutab (UTF-8). Rakendused, mis loevad Kindle’i faili My Clippings.txt, saavad seda lugeda. Esiletõstu märkus on eraldi kirje, nagu Kindle’is. Kuna siinsel raamatul pole Kindle’i asukohti, on „asukoht“ märkuse kaugus raamatus protsentides. Fail kirjutatakse iga kord uuesti; see asendab eelmise."
