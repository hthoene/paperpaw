update.plugin.name = Обновяване
update.plugin.description = Инсталира обновявания на фърмуера от картата или изтеглени от интернет.
update.plugin.how = "„Обновяване“ инсталира нов фърмуер на устройства, където PaperPaw е фърмуерът, като X4. Ще го намерите в настройките като „Обновяване“.\n\n„Търсене онлайн“ пита сървъра за обновяване за по-нов PaperPaw и го изтегля, което отнема няколко минути по Wi-Fi. Или копирайте файл за обновяване (завършващ на .bin, от paperpaw.org) в папката updates на картата, например с пренос по Wi-Fi. След това „Инсталирай“ отнема около минута и устройството се рестартира; книгите, настройките и мястото в книгите остават.\n\nС „Търсене за обновявания“ (в настройките, първоначално изключено) устройството пита само около веднъж седмично, само докато Wi-Fi така или иначе е включен или то се зарежда. По-нов PaperPaw, който намери, чака тук; нищо не прекъсва четенето ви. Търсенето изпраща какво работи на устройството, без име или номер на устройството; за преброяване на устройствата още и дали сте питали, и дали това е първото му търсене за деня, седмицата или месеца.\n\nАко плъгини, които ползвате, още нямат версия за новото издание, обновяването ги чака. По-стара версия се инсталира само ако я изберете.\n\nОт тук може да се инсталира и друг фърмуер, като CrossPoint: сложете файла му (завършващ на .bin) в папката updates и отворете „Обновяване“. PaperPaw проверява дали е цял фърмуер за това устройство, неповреден, но не може да каже кой го е направил, тъй като не е подписан. „Инсталирай въпреки това“ го записва в другата половина на флаш паметта и устройството го стартира; PaperPaw остава в своята половина, докато този фърмуер не инсталира нещо върху нея. За да се върнете към PaperPaw по-късно, инсталирайте инсталационния му файл (paperpaw-<device>-<version>-install.bin) от менюто на другия фърмуер, като обновяването на SD фърмуера на CrossPoint."
