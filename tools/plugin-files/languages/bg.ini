files.plugin.name = Файлов браузър
files.plugin.description = Показва книгите и папките на устройството и ги отваря.
files.plugin.how = "Библиотеката показва книгите от папката на библиотеката ви, всяка с корицата, заглавието, автора и докъде сте я прочели. Последно четената книга стои най-отгоре като карта, така че продължаването на четенето става с едно докосване или едно натискане на „Избор“. Докато библиотеката търси книги, тя съобщава колко е намерила досега.\n\nНад книгите избирате какво да се показва: всички, тези, които четете, непрочетените или прочетените, или рафтовете (по автор, поредица, етикет, любими, следващата книга от всяка започната поредица). Докоснете книга, за да я четете; задръжте я (с бутони: задръжте „Избор“), за да я отворите, отбележите като прочетена или непрочетена, видите информацията ѝ, преместите в архива или изтриете. Докоснете заглавието за менюто на библиотеката: как се подреждат и показват книгите, търсене, папката на библиотеката и настройки.\n\nПапката на библиотеката се задава в Настройки, под Библиотека, като Папка на библиотеката; там можете да показвате книгите и като мрежа от корици. За всички други файлове ползвайте Файлове в менюто Инструменти."
