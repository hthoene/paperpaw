vocabulary.sd.readme = "Карти за учене от файлове\n\nСложете тук по един файл за всяко тесте: Spanish.tsv прави тестето Spanish.\nФайлове: .tsv, .csv или .txt, записани като UTF-8, или .apkg: тесте на Anki, експортирано с отметнато Support older Anki versions. Първите три полета на бележките му стават лице, гръб и пример; планирането и медията му не се четат, а PaperPaw никога не записва файл на Anki.\n\nПо една карта на ред: лице, гръб и пример (по избор), разделени с табулация, запетая или точка и запетая. Първият ред може да назовава колоните: front, back, example. Пример:\n\nKatze\tcat\tDie Katze schläft.\n\nСлед това отворете „Карти за учене“ на четеца, изберете „Карти на SD картата“ и после „Обновяване на тестетата от картата“.\n\nДобре е да знаете:\n- Тестетата остават на четеца, с това, което сте научили. Файлът се чете, когато е нов или променен, и картите му се добавят към тестето или се променят там.\n- Променете гърба или примера на карта във файла: картата се променя и запазва напредъка ви.\n- Променете текста на лицето на карта: това се брои за нова карта, а старата започва отначало. Картите се съпоставят по текста на лицето им, интервалите и главните букви не се броят. Запазете тесте във файл („Карти на SD картата“, „Запазване на тестето на картата“) и всяка карта има номер в колоната id: променете лице там, оставете първите два реда на файла както са и картата запазва наученото.\n- Записването записва картите на тестето. Това, което е било във файла и не е карта (ред без лице), не се запазва; файлът, който е бил там, се копира в _name.bak.tsv.\n- Запишете файла като CSV UTF-8 (не UTF-16, не във формата на електронна таблица). Файл над 4 MiB или 20 000 реда не се чете: разделете го.\n- Ред, който изтриете във файла, не изтрива картата в тестето, освен ако не включите „Премахване на липсващите карти“ за това тесте. Тогава картата си отива с наученото.\n- Файловете, чиито имена започват с _, не се четат.\n"
