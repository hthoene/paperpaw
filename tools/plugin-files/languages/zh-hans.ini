update.plugin.name = 更新
update.plugin.description = 安装固件更新，可来自存储卡，也可从互联网下载。
update.plugin.how = "“更新”用于安装新固件，适用于以 PaperPaw 作为固件的设备，例如 X4。你可以在设置中找到它，名为“更新”。\n\n“在线搜索”会向更新服务器询问是否有更新的 PaperPaw 并下载，通过 Wi-Fi 需要几分钟。也可以把更新文件（扩展名为 .bin，来自 paperpaw.org）复制到存储卡的 updates 文件夹中，例如通过 Wi-Fi 传输。之后安装约需一分钟，设备会重新启动；书籍、设置和阅读位置都会保留。\n\n开启“检查更新”（在设置中，默认关闭）后，设备大约每周自动询问一次，且仅在 Wi-Fi 本来就已开启或正在充电时进行。找到的新版 PaperPaw 会在这里等候，不会打断你的阅读。一次搜索会发送设备上运行的版本，不含设备的名称或编号；为了统计设备数量，还会发送你是否主动询问，以及这是否是当天、当周或当月的首次搜索。\n\n如果你使用的插件还没有适用于新版本的版本，更新会等待它们。旧版本只有在你主动选择时才会安装。\n\n也可以从这里安装其他固件，例如 CrossPoint：把它的文件（扩展名为 .bin）放入 updates 文件夹，然后打开“更新”。PaperPaw 会检查它是否是适用于本设备的完整且未损坏的固件，但由于没有签名，无法判断它由谁制作。“仍然安装”会把它写入闪存的另一半，设备随后启动它；PaperPaw 留在自己的那一半，直到那个固件在其上安装了别的东西。以后若要回到 PaperPaw，请在另一个固件的菜单中安装它的安装文件（paperpaw-<device>-<version>-install.bin），例如 CrossPoint 的 SD 固件更新。"
