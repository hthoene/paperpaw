vocabulary.setting.sd-auto.help = 闪卡会读取文件夹中新增或已更改的文件。
vocabulary.setting.sd-folder = 卡组文件所在的文件夹
vocabulary.setting.sd-folder.help = 在存储卡上：其中的 CSV、TSV 或 Anki 文件就是一个卡组。
vocabulary.sd.readme = "来自文件的闪卡\n\n每个卡组在这里放一个文件：Spanish.tsv 会生成名为 Spanish 的卡组。\n文件类型：.tsv、.csv 或 .txt，保存为 UTF-8；或 .apkg：从 Anki 导出的卡组，导出时需勾选“支持旧版 Anki”。其笔记的前三个字段会成为正面、背面和例句；学习进度和媒体不会被读取，PaperPaw 也从不写入 Anki 文件。\n\n每行一张卡片：正面、背面和例句（可选），用制表符、逗号或分号分隔。第一行可以写列名：front、back、example。示例：\n\nKatze\tcat\tDie Katze schläft.\n\n然后在阅读器上打开“闪卡”，选择“存储卡上的卡片”，再选择“更新卡组”。\n\n须知：\n- 卡组保留在阅读器上，连同你的学习进度。文件新增或更改时才会被读取，其中的卡片会加入卡组或在卡组中被更改。\n- 在文件中更改卡片的背面或例句：卡片会随之更改，并保留你的学习进度。\n- 更改卡片的正面文字：它会被视为新卡片，旧卡片则从头开始。卡片按正面文字匹配，空格和大小写不计。把卡组保存到文件（“存储卡上的卡片”，“将卡组保存到存储卡”）后，每张卡片在 id 列中都有一个编号：在那里更改正面，并保持文件的前两行不变，卡片就会保留你学过的内容。\n- 保存会写入卡组中的卡片。文件中原有但不是卡片的内容（没有正面的行）不会保留；原有的文件会被复制为 _name.bak.tsv。\n- 请将文件保存为 CSV UTF-8（不要用 UTF-16，也不要用电子表格自己的格式）。超过 4 MiB 或 20,000 行的文件不会被读取：请拆分它。\n- 你在文件中删除一行，不会删除卡组中的卡片，除非你为该卡组开启“移除缺少的卡片”。这样卡片会连同学习进度一起消失。\n- 名称以 _ 开头的文件不会被读取。\n"
