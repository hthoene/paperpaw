files.plugin.description = 列出设备上的书和文件夹，并可打开它们。
files.plugin.how = "书库会列出书库文件夹中的书，每本都显示封面、书名、作者和阅读进度。最近读的书会作为卡片显示在最上面，点一下或按一下选择键即可继续阅读。书库查找书时，会显示目前已找到的数量。\n\n在书的上方可以选择显示的内容：全部、在读、未读或已读的书，或者书架（按作者、系列、标签、收藏，以及每个已开始系列的下一本书）。点按一本书即可阅读；长按它（使用按键时，长按选择键）可以打开、标为已读或未读、查看信息、移入存档或删除。点按标题可打开书库菜单：书的排序和显示方式、搜索、书库文件夹和设置。\n\n书库文件夹在“设置”的“书库”下的“书库文件夹”中设置；在那里还可以把书显示为封面网格。其他文件请使用工具菜单中的“文件”。"
