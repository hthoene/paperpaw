plugin-manager.plugin.name = Viðbótastjóri
plugin-manager.plugin.description = Sýnir viðbæturnar og kveikir og slekkur á þeim.
plugin-manager.plugin.how = "Viðbótastjórinn sýnir hverja viðbót með útgáfu og lýsingu og kveikir og slekkur á viðbótum.\n\nÞú finnur hann í Stillingum, sem Stjórna viðbótum. Stillingar viðbóta er sérstök síða fyrir stillingar eins og netnotkun hverrar viðbótar. Snertu viðbót til að kveikja eða slökkva á henni (með hnöppum, veldu hana). Breytingin gildir eftir endurræsingu: stikan neðst býður þá upp á Endurræsa núna. Haltu viðbót inni (með hnöppum, haltu Velja inni) til að lesa hvernig hún virkar.\n\nViðbót merkt Alltaf kveikt er ekki hægt að slökkva á, og viðbót merkt Nauðsynleg aðeins þegar önnur viðbót sinnir hlutverki hennar, annars hefði PaperPaw enga leið til baka. Undir Skjáir velur þú hvaða viðbót sýnir stað sem fleiri en ein bjóða upp á."
