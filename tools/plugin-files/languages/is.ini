calibre.plugin.name = Þráðlaust bókasafn
calibre.plugin.description = Tekur við bókum yfir netið. Virkar sem þráðlaust tæki fyrir Calibre.
calibre.plugin.how = "Þráðlaust bókasafn lætur tækið birtast í Calibre í tölvunni þinni sem þráðlaust tæki. Calibre getur þá sent því bækur, talið þær upp og eytt þeim. Bækurnar fara í bókasafnið.\n\nOpnaðu Þráðlaust bókasafn úr valmyndinni Verkfæri, með tækið og tölvuna á sama Wi-Fi-neti. Veldu í Calibre Connect/share, svo Start wireless device connection. Þegar tækið hefur fundið tölvuna þína sýnir það nafn hennar; snertu Tengjast (með hnöppum, ýttu á Velja). Calibre getur bætt við bókum hér og eytt þeim, svo tengstu aðeins við þína eigin tölvu. Ef skjánum er lokað lýkur tengingunni.\n\nEf Calibre finnst ekki af sjálfu sér skaltu slá inn vistfang tölvunnar þess í Stillingum, undir Bókasafn, sem Vistfang í Calibre-hlutanum. Ef Calibre notar aðra gátt en 9090 skaltu bæta henni við sem :gátt, t.d. 192.168.1.20:9091."
