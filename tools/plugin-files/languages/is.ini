vocabulary.sd.readme = "Minnisspjöld úr skrám\n\nSettu skrá hér fyrir hvern stokk: Spænska.tsv býr til stokkinn Spænska.\nSkrár: .tsv, .csv eða .txt, vistaðar sem UTF-8, eða .apkg: Anki-stokkur, fluttur út með hakað við Styðja eldri Anki-útgáfur. Fyrstu þrír reitir glósa hans verða framhlið, bakhlið og dæmi; tímaáætlun hans og miðlar eru ekki lesin og PaperPaw skrifar aldrei Anki-skrá.\n\nEitt spjald í hverri línu: framhlið, bakhlið og dæmi (valfrjálst), aðgreint með tab, kommu eða semíkommu. Fyrsta línan má nefna dálkana: front, back, example. Dæmi:\n\nköttur\tcat\tKötturinn sefur.\n\nOpnaðu síðan Minnisspjöld á lesaranum, veldu Spjöld af SD-korti og síðan Uppfæra stokkana af kortinu.\n\nGott að vita:\n- Stokkarnir haldast á lesaranum, með því sem þú lærðir. Skrá er lesin þegar hún er ný eða breytt og spjöld hennar eru sett í stokkinn eða breytt þar.\n- Breyttu bakhlið eða dæmi spjalds í skránni: spjaldið breytist og heldur framvindu þinni.\n- Breyttu texta framhliðar spjalds: það telst nýtt spjald og það gamla byrjar upp á nýtt. Spjöld eru pöruð eftir texta framhliðarinnar, bil og há- og lágstafir skipta ekki máli. Vistaðu stokk í skrá (Spjöld af SD-korti, Vista stokkinn á kortið) og hvert spjald fær númer í dálkinum id: breyttu framhlið þar, haltu fyrstu tveimur línum skrárinnar eins og þær eru, og spjaldið heldur því sem þú lærðir.\n- Vistun skrifar spjöld stokksins. Það sem var í skránni og er ekki spjald (lína án framhliðar) er ekki geymt; skráin sem var þar er afrituð í _nafn.bak.tsv.\n- Vistaðu skrána sem CSV UTF-8 (ekki UTF-16, ekki eigið snið töflureiknis). Skrá yfir 4 MiB eða 20.000 línur er ekki lesin: skiptu henni.\n- Lína sem þú eyðir í skránni eyðir ekki spjaldinu í stokknum, nema þú kveikir á Fjarlægja spjöld sem vantar fyrir þann stokk. Þá fer spjaldið með því sem þú lærðir.\n- Skrár sem nöfn byrja á _ eru ekki lesnar.\n"
