transfer.plugin.name = Flutningur
transfer.plugin.description = Settu bækur og aðrar skrár á tækið úr vafra á sama neti.
transfer.plugin.how = "Wi-Fi-flutningur setur bækur og aðrar skrár á tækið úr vafra á sama neti, án snúru eða forrits. Þú getur líka sótt skrár, búið til möppur og eytt.\n\nOpnaðu hann úr Verkfærum. Skjárinn sýnir vistfang sem texta og sem QR-kóða: opnaðu það í vafra í síma eða tölvu, eða skannaðu kóðann. Vistfangið geymir lykil sem er búinn til upp á nýtt í hvert skipti, svo aðrir á netinu komast ekki í skrárnar þínar. Flutningurinn gengur meðan skjárinn er opinn.\n\nÞar sem PaperPaw rekur Wi-Fi sjálft, eins og á X4, opnar Án beinis neðst eigið net tækisins, sem síminn tengist með því að skanna kóða."
