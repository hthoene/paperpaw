store.plugin.name = Viðbótaverslun
store.plugin.description = Finnur, setur upp, uppfærir og fjarlægir viðbætur fyrir þetta tæki.
store.plugin.how = "Viðbótaverslunin finnur viðbætur fyrir þetta tæki á netinu og setur þær upp, uppfærir og fjarlægir. Opnaðu hana úr Verkfærum; hún þarf Wi-Fi.\n\nUpphafið sýnir það sem bókasafnið mælir með, það sem er nýtt eða vinsælt núna og síðan flokkana. Flokkur sýnir viðbætur sínar í sanngjarnri blöndu sem breytist daglega, svo að hver viðbót sjáist; raðaðu þeim frá A til Ö, eftir nýjustu eða síðustu uppfærslu og farðu á staf í löngum listum. Opnaðu eina til að sjá síðu hennar, með stærð og minninu sem hún tekur, og veldu svo Setja upp, Uppfæra eða Fjarlægja. Uppfæra allt færir allar uppsettar viðbætur á nýjustu útgáfu.\n\nKóðaviðbætur keyra með fullan aðgang að tækinu: verslunin segir frá því og spyr fyrst, og þær ræsast eftir endurræsingu. Ef ein misheppnast ræsist PaperPaw án kóðaviðbóta og segir hver það var. Viðbótasafn ákveður hvaðan listinn kemur.\n\nSamfélagsviðbætur, í Stillingum, Kerfi, telur líka upp viðbætur sem aðrir hafa gefið út á GitHub. Enginn hefur farið yfir þær: þær eru merktar Óyfirfarið, síða kóðaviðbótar sýnir lykilinn sem hún er undirrituð með, og uppfærsla undirrituð með öðrum lykli er ekki sett upp.\n\nUppsprettur, síðasta línan á upphafssíðunni, bætir við viðbótalistum annarra eftir vistfangi þeirra (https://…/plugins.json), telur einn þeirra upp í stað lista PaperPaw, eða fjarlægir hann. Í stað þess að skrifa skaltu setja skrána sources.txt með einu vistfangi í hverri línu í .paperpaw/plugins/store á kortinu: vistföngin birtast undir Uppsprettur sem ný. PaperPaw athugar hvorki uppsprettu né viðbætur hennar og tækið hefur samband við þjón uppsprettunnar. Uppspretta undirritar lista sinn; tækið geymir lykil fyrsta listans sem það les og tekur eftir það aðeins við listum og kóðaviðbótum undirrituðum með þeim lykli. Viðbót fær uppfærslur aðeins frá uppsprettunni sem hún var sett upp frá. Eigið safn PaperPaw er alltaf til staðar og ekki er hægt að fjarlægja það; þegar verslunin er yfirgefin kemur það aftur."
