file-manager.plugin.name = Skráastjóri
file-manager.plugin.description = Allar möppur og skrár tækisins: opna, endurnefna, færa, afrita og eyða.
file-manager.plugin.how = "Skráastjórinn sýnir allar möppur og skrár í geymslu tækisins, ekki aðeins bækurnar þínar, og lætur þig opna, endurnefna, færa, afrita og eyða þeim og búa til nýjar möppur.\n\nOpnaðu Skrár úr valmyndinni Verkfæri. Snertu möppu til að fara inn í hana; Til baka fer í möppuna fyrir ofan. Snertu skrá, eða haltu inni hvaða færslu sem er (með hnöppum, haltu Velja inni), til að sjá hvað hægt er að gera við hana. Færa og Afrita velja færsluna: farðu í möppuna sem hún á að fara í og veldu Líma hér á stikunni neðst. Með hnöppum skaltu ýta á Niður frá síðustu færslu til að komast á stikuna.\n\nSkrár og möppur sem byrja á punkti, eins og eigin gögn PaperPaw, eru faldar. Til að sjá þær skaltu kveikja á Faldar skrár í Stillingum, undir Bókasafn."
