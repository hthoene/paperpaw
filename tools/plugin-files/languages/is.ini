profiles.plugin.name = Lestrarsnið
profiles.plugin.description = Nefnd sett af lestrar- og skjástillingum, skipt á milli með einni snertingu.
profiles.plugin.how = "Snið geymir lestrarstillingar þínar, skjástillingar og stöðulínur undir nafni, eins og Nótt eða Stórt letur, og kallar þær fram með einni snertingu.\n\nOpnaðu Snið í lestrarvalmyndinni undir Meira, eða í Stillingum undir Sérsnið. Snertu snið til að nota það; það sem er í notkun er merkt. Haltu því inni (með hnöppum, haltu Velja inni) til að vista núverandi stillingar í það, endurnefna það eða fjarlægja. Vista sem nýtt snið geymir það sem er stillt núna.\n\nNæsta snið skiptir yfir í það næsta á listanum; settu það á hnapp eða í reglu."
