home.plugin.name = Upphafsskjár
home.plugin.description = Upphafssíðan: síður með græjum, eins og bókinni sem er í lestri og verkfærunum.
home.plugin.how = "Upphafsskjárinn er gerður úr síðum, hver hnitanet af græjum og verkfærum eins og í síma. Í upphafi eru klukkan, bókin sem þú ert að lesa og nýlega lesnar bækur á einni síðu og öll verkfæri á þeirri næstu.\n\nSnertu atriði til að opna það og strjúktu eða notaðu síðuhnappana til að skipta um síðu. Með hnöppum eingöngu færa örvahnapparnir þig frá einu atriði til þess næsta og Velja opnar það.\n\nTil að endurraða honum skaltu halda upphafsskjánum inni, snerta blýantinn fyrir neðan síðuna eða velja Breyta upphafsskjá í valmyndinni. Dragðu atriði til að færa þau eða snertu eitt fyrir valkosti þess, líka með hnöppum. Bæta við græju er þar líka. Dálkar og Raðir eru í stillingunum, undir Útlit, í hlutanum Upphafsskjár.\n\nÁ skjá sem er snúinn á hliðina sýnir upphafsskjárinn sömu atriði með fleiri dálkum, hver síða fyllt áður en sú næsta byrjar, og spjöld ekki breiðari en um 110 mm; ekkert sem þú raðaðir upprétt breytist. Raðaðu honum á hliðinni og sú uppröðun er geymd sér fyrir þá stefnu: nýjum græjum er bætt við í báðar. Núllstilla lárétta uppröðun undir Bæta við (við breytingar) fer aftur í þá afleiddu. Ef græja eða verkfæri er fjarlægt í einni stefnu er það ekki fjarlægt úr hinni."
