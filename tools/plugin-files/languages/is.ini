smart-home.plugin.name = Snjallheimili
smart-home.plugin.description = Gildi og rofar úr þínum eigin Home Assistant á yfirlitsskjá og sem græjur á upphafsskjá. Virkar með Home Assistant á heimanetinu þínu.
smart-home.plugin.how = "Snjallheimili sýnir gildi og rofa úr þínum eigin Home Assistant: hitastig, rakastig, orku, hurðir og glugga, ljós, rofa og senur. Það talar við þjóninn þinn yfir REST-viðmót hans á heimanetinu þínu; ekkert fer í gegnum neina aðra þjónustu.\n\nOpnaðu Snjallheimili úr verkfæravalmyndinni og síðan Tenging: sláðu inn vistfang Home Assistant (til dæmis http://homeassistant.local:8123) og langtíma aðgangsteikn (búðu það til neðst á prófílsíðu Home Assistant). Teiknið er geymt meðal lykilorða og lykla, aldrei í stillingaskrá. Einfalt http er aðeins notað fyrir vistföng á heimanetinu þínu; fyrir þjón annars staðar skaltu kveikja á „Þjónar utan heimanetsins“ í stillingunum og nota https með gildu skilríki.\n\nVelja einingar opnar lista yfir það sem þjónninn þinn hefur: leitaðu eftir nafni eða auðkenni og veldu einingu til að sýna hana (veldu hana aftur til að fjarlægja hana). Þú getur gefið henni herbergi, sem flokkar hana á yfirlitinu og í herbergisgræjunum. Allt að 24 einingar eru geymdar. Á yfirlitinu skaltu velja ljós, rofa eða senu til að skipta henni: línan sýnir svar þjónsins. Skynjari sem þú velur er lesinn aftur.\n\nGræjur (haltu upphafsskjánum inni og bættu svo við græju): Snjallheimilisgildi sýnir eina mælingu stóra, hópur telur upp einingar herbergis, rofi er hnappur fyrir eitt ljós eða einn rofa og herbergi er spjald með mælingum og rofum herbergis. Stillingar hverrar græju segja hvaða einingu eða herbergi hún sýnir.\n\nHeimilið er lesið þegar þú opnar yfirlitið, þegar þú biður um það (línan Endurnýja núna eða snerting á gildis- eða hópgræju), þegar lesarinn vaknar þar sem Wi-Fi er þegar tengt, og samkvæmt áætluninni sem þú stillir meðan hleðslutækið er tengt. Það kveikir aldrei á útvarpinu af sjálfu sér og heldur því aldrei kveiktu."
