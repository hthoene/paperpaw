anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Lærir spjöldin sem á að fara yfir í Anki í tölvunni þinni og sendir svörin þín til baka, með AnkiConnect-viðbótinni.
anki.plugin.how = "Anki lætur þig læra spjöldin sem á að fara yfir í Anki í tölvunni þinni á lesaranum og sendir svörin þín til baka. Það notar ókeypis viðbótina AnkiConnect (viðbótarkóði 2055492159) og aldrei AnkiWeb. Slökkt er á því í upphafi: bættu því við úr viðbótaversluninni.\n\nÍ tölvunni: settu AnkiConnect upp í Anki (Tools, Add-ons, Get Add-ons) og endurræstu Anki. Anki þarf að vera opið meðan þú samstillir.\n\nSjálfgefið svarar AnkiConnect aðeins tölvunni sem það keyrir á (127.0.0.1), svo lesarinn nær ekki til þess. Opnaðu Tools, Add-ons, AnkiConnect, Config og stilltu „webBindAddress“ á „0.0.0.0“ (hlusta á heimanetinu). Gáttin, „webBindPort“, er 8765 nema þú breytir henni. Ef þú stillir „apiKey“ þar skaltu slá inn sama lykil hér. Endurræstu Anki eftir að þú breytir stillingunum og leyfðu Anki í gegnum eldvegg tölvunnar ef hann spyr. Notaðu þetta aðeins á neti sem þú treystir: allir á því geta náð í AnkiConnect, svo lykill er góð hugmynd.\n\nÁ lesaranum: opnaðu Anki úr Verkfærum, sláðu svo inn heimilisfang tölvunnar (til dæmis 192.168.1.20) undir Tölva, gáttina ef hún er ekki 8765 og API-lykilinn ef þú stilltir einn. Veldu stokk, eða hafðu hann tóman fyrir alla stokka. Veldu svo Samstilla við Anki, með Wi-Fi á: biðsvörin þín eru send fyrst, síðan eru spjöldin sem á að fara yfir (og fjöldi nýrra spjalda sem þú stilltir) sótt, í mesta lagi 50. Veldu Læra til að fara í gegnum þau, án nets: sýndu svarið og metðu það Aftur, Erfitt, Gott eða Auðvelt. Svörin þín eru geymd á lesaranum, líka án Wi-Fi, og fara til Anki með næstu samstillingu. Anki ákveður hvenær spjald kemur aftur: spjald sem þú svaraðir með Aftur er sótt aftur í síðari samstillingu þegar Anki segir að það sé komið á tíma.\n\nSamstilla þegar Anki opnast, í stillingunum, samstillir í hvert skipti sem þú opnar skjáinn. Ekkert notar netið þegar þú ýtir á hnapp."
