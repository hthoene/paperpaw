puzzles.plugin.name = Þrautir
puzzles.plugin.description = Sudoku, krossgátur og skákþrautir, án nets, með þraut dagsins.
puzzles.plugin.how = "Þrautir fyrir lestina og biðstofuna, allt án nets: sudoku, krossgátur og skákþrautir. Opnaðu Þrautir úr verkfæravalmyndinni, eða bættu græjunni Þraut dagsins við upphafsskjáinn (haltu upphafsskjánum inni og bættu svo við græju): hún sýnir hversu langt sudoku dagsins er komið og snerting opnar það. Sudoku dagsins er það sama allan daginn.\n\nSudoku: Vinstri og Hægri færa bendilinn reit fyrir reit, Upp og Niður (síðuhnapparnir) um eina röð. Velja opnar tölustafina: veldu einn og veldu aftur til að setja hann inn, eða Hreinsa til að tæma reitinn. Haltu Velja inni (eða Valmynd) til að ná í hnappana undir borðinu: Glósur breytir tölustöfunum í blýantsmerki, Athuga merkir ranga reiti, Afturkalla tekur síðasta leik til baka, Nýtt byrjar þraut á stiginu sem þú velur (Létt, Miðlungs, Erfitt). Hver þraut hefur nákvæmlega eina lausn. Leikurinn er geymdur þegar þú ferð út. Á snertiskjá snertirðu reit.\n\nKrossgátur: settu .puz- (Across Lite) eða .ipuz-skrár í möppuna „puzzles“ á minniskortinu; engar fylgja með. Færðu þig á netinu og veldu svo til að slá orðið undir bendlinum inn á lyklaborðinu (undirstrik skilur reit eftir tóman). Hnapparnir skipta milli láréttrar og lóðréttrar stefnu, sýna lista yfir vísbendingar, athuga stafina og sýna orðið. Stafirnir eru geymdir fyrir hverja skrá. Ekki er hægt að opna .puz-skrár sem eru afbakaðar (scrambled).\n\nSkákþrautir: lítið safn úr þrautagagnagrunni Lichess (CC0). Vinstri og Hægri hoppa milli taflmanna, veldu taflmanninn sem þú vilt hreyfa, síðan Vinstri og Hægri í gegnum þá reiti sem hann má fara á, og veldu aftur. Rangur leikur er tekinn til baka. Vísbending merkir taflmanninn sem á að hreyfa, Næsta fer í næstu þraut.\n\nBorðið teiknar aðeins upp þá reiti sem breytast. Tölfræði telur þrautirnar sem þú leystir."
