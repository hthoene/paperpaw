settings.plugin.name = Stillingar
settings.plugin.description = Stillingasíðurnar, gerðar úr stillingum allra viðbóta.
settings.plugin.how = "Stillingar sýna allt sem hægt er að stilla í PaperPaw og viðbótum þess, á síðum. Viðbætur þurfa engan eigin skjá: það sem þær skrá birtist hér, í hópum, með lýsingu hverrar stillingar fyrir neðan hana.\n\nOpnaðu þær með Stillingar í valmyndinni. Snertu hóp til að opna hann og síðan stillingu til að kveikja á henni eða velja; tölur hafa − og + hnappa. Með hnöppum skaltu fara á stillingu og ýta á Velja: vinstri og hægri breyta tölu, Velja heldur henni og Til baka skilar fyrra gildi.\n\nBreytingar gilda strax. Leit finnur stillingu eftir orðum og Ítarlegar stillingar bætir við þeim sem sjaldan þarf. Núllstilla í sjálfgefið og Núllstilla allt spyrja fyrst."
