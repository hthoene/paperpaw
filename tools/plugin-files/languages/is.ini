reading-goal.plugin.name = Lestrarmarkmið
reading-goal.plugin.description = Mínútur til að lesa á dag og köttur á upphafsskjánum sem skap hans fylgir lestri dagsins.
reading-goal.plugin.how = "Köttur á upphafsskjánum þínum sýnir hvernig lestur dagsins gengur: dapur meðan þú hefur ekki lesið enn, svona og svona eftir dálítið, sáttur frá helmingi daglega markmiðsins, glaður þegar þú hefur náð því.\n\nBættu græjunni Lestrarköttur við upphafsskjáinn (haltu upphafsskjánum inni og bættu svo við græju), eða veldu Lestrarkött dagsins sem svefnskjá. Snerting á köttinn opnar daglega markmiðið; það er markmið lestrartölfræðinnar, sem telur mínúturnar sem þú lest.\n\nÍ stillingunum, undir Lestur, ákveða Sáttur frá og Glaður frá frá hvaða hluta markmiðsins kötturinn er sáttur eða glaður, og Eigin myndir möppu með myndum (sad, meh, content og happy) til að sýna í stað kattanna. Myndirnar eru PNG- eða JPEG-skrár; án möppu birtast kettirnir."
