keys.plugin.name = Hnappar og bendingar
keys.plugin.description = Hvað hver hnappur, snertisvæði og strok gerir, breytt á tækinu.
keys.plugin.how = "Hnappar og bendingar sýnir hvað hver hnappur, snertisvæði og strok gerir og lætur þig breyta því á tækinu.\n\nOpnaðu það í stillingunum, undir Tæki. Veldu fyrst hvar breyting gildir: Alls staðar, Við lestur, Á upphafsskjá, Í bókasafni eða í einu verkfæri. Veldu síðan inntak, eins og hnapp sem er haldið inni eða strok inn frá jaðri, og veldu aðgerð af listanum, sem þú getur leitað í. Sjálfgefið skilar því sem viðbæturnar og hnappaskipanin ákveða.\n\nÁ X4 er breyting sem skildi engan hnapp eftir til að velja, fara til baka eða halda áfram með hafnað. Núllstilla hnappa og bendingar í lokin tekur allar breytingar til baka."
