picture-home.plugin.name = Myndaupphafsskjár
picture-home.plugin.description = Upphafsskjár með þinni eigin mynd á bak við græjurnar og stöðustiku sem þú stillir.
picture-home.plugin.how = "Myndaupphafsskjárinn kemur í stað upphafsskjásins meðan kveikt er á honum: þín eigin mynd á bak við græjurnar og síðurnar með græjum og verkfærum sem þú raðar. Slökktu á honum í viðbótastjóranum og innbyggði upphafsskjárinn er kominn aftur, með sínum eigin síðum.\n\nSettu myndir (JPEG, PNG eða GIF) í möppu á kortinu (wallpapers sjálfgefið) og veldu síðan eina í Stillingar, Sérsnið, Myndaupphafsskjár. Aðlögun segir hvernig hún fyllir skjáinn (fylla, öll myndin, teygja, upprunaleg stærð, flísaleggja), Staða hvaða hluti helst, Aðdráttur hversu stór, og Lýsa mynd hversu föl: fölari mynd gerir græjurnar auðlesnari. Myndin er undirbúin einu sinni fyrir hverja skjástærð, sem tekur augnablik.\n\nGræjurnar sitja á undirlögum yfir myndinni. Raðaðu síðunni eins og á innbyggða upphafsskjánum: blýanturinn fyrir neðan síðuna, eða Breyta upphafsskjá í valmyndinni.\n\nStöðustikan (tími, Wi-Fi, rafhlaða, eða það sem þú velur) getur verið á, slökkt eða sjálfvirk, efst eða neðst, í fullri breidd eða lítið hylki til vinstri, í miðju eða til hægri, á ljósu, dökku eða gráu undirlagi eða beint á myndinni sjálfri. Línan sem nefnir hnappana (á X4) getur líka verið á, slökkt eða sjálfvirk. Sjálfvirkt þýðir að hnappaýting sýnir þær í nokkrar sekúndur; sú ýting gerir ekkert annað.\n\nMyndbirting segir hvernig myndin er teiknuð: Grátónar í öllum grátónum sem skjárinn hefur (hægara á X4), Rastað í svörtum og hvítum punktum (hratt), eða Sjálfvirkt, eins og innbyggði upphafsskjárinn gerir: grátónar þegar skjárinn er teiknaður, punktar eftir fyrstu breytingu. Þar sem skjár hefur enga grátóna falla grátónar niður í punkta."
