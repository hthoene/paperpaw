koreader.plugin.name = Deiling auðkenninga
koreader.plugin.description = Deilir bókamerkjum og auðkenningum með KOReader fyrir bækur sem eru lesnar í báðum.
koreader.plugin.how = "Þessi viðbót deilir bókamerkjum og auðkenningum með KOReader fyrir bækur sem þú lest í báðum, á einu tæki eða í bókasafnsmöppu sem er samstillt milli tækja. Ekkert þarf að setja upp.\n\nÞegar PaperPaw opnar bók sem KOReader hefur líka opnað, og þegar þú breytir bókamerkjum hennar eða auðkenningum, tekur það yfir það sem er nýtt úr gögnum KOReader við hlið bókarinnar og skilur það sem er nýtt hér eftir fyrir KOReader til að taka upp næst þegar það opnar bókina. Fjarlægð merki og breyttar glósur fara líka yfir.\n\nÞetta virkar aðeins fyrir EPUB-bækur. Ef ekki er hægt að lesa skrá annarrar hliðarinnar breytist ekkert hvorum megin sem er þar til það er hægt."
