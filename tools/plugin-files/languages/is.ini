setup.plugin.name = Uppsetning
setup.plugin.description = Stutt leiðsögn um mikilvægustu stillingarnar, við fyrstu ræsingu.
setup.plugin.how = "Uppsetning er stutt leiðsögn um mikilvægustu stillingarnar, sýnd einu sinni, í fyrsta sinn sem PaperPaw ræsist. Hver síða spyr um eitt atriði, eins og tungumálið, hnappana, textastærðina, tímabeltið, Wi-Fi eða nokkrar viðbætur til að bæta við, með skynsamlegt svar þegar valið, svo Áfram er alltaf rétt. Skrefum sem þetta tæki þarf ekki er sleppt.\n\nSnertu hnappana, eða notaðu upp- og niðurhnappana og Velja. Sleppa á fyrstu síðunni yfirgefur uppsetninguna strax. Síðasta síðan segir hvaðan bækurnar þínar koma.\n\nTil að keyra hana aftur skaltu opna stillingarnar og velja Setja upp PaperPaw. Allt sem valið er hér er hægt að breyta í stillingunum síðar."
