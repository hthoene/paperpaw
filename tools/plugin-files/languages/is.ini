dictionary.plugin.how = "Orðabókin flettir upp orði úr bók í StarDict-orðabókum og sýnir skilgreiningarnar í glugga yfir neðri hluta skjásins.\n\nÍ lesaranum skaltu halda orði inni og velja Fletta upp; með hnöppum skaltu nota Velja texta undir Meira. Afritaðu orðabókarmöppurnar (með .ifo-, .idx- og .dict-skrám) í möppuna „dictionaries“ á tækinu, undirmöppur meðtaldar, eða veldu aðra möppu í Stillingum, undir Lestur, sem Orðabókarmappa (ítarleg stilling). Fyrsta uppflettingin útbýr lítinn vísi fyrir hverja orðabók, sem tekur augnablik.\n\nÍ glugganum fletta síðuhnapparnir eða Upp og Niður löngum skilgreiningum og Til baka lokar honum. Með snertingu skaltu snerta utan hans til að loka."
