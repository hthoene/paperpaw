diagnostics.plugin.name = Greining
diagnostics.plugin.description = Prófunarskjár og leiðbeind athugun á öllum hlutum tækis.
diagnostics.plugin.how = "Greining er prófunarskjár til að athuga tæki: hann sýnir alla grátóna sem skjárinn getur birt, fjóra reiti til að prófa hnappa og snertingu, og síðuteljara með framvindustiku til að bera saman endurnýjunarhami.\n\nPrófunarskjárinn hefur enga valmyndarfærslu. Hann er aðeins upphafsskjárinn meðan engin önnur viðbót býður upp á slíkan, eða þegar þú velur hann undir Skjáir í viðbótastjóranum fyrir staðinn Upphafsskjár.\n\nVelja merkir reitinn sem er í fókus og örvahnapparnir færa á milli reita; með snertingu snertirðu reit. Síðuhnapparnir fletta prófunarsíðunum. Haltu Velja inni, eða fingri á skjánum, til að byrja upp á nýtt.\n\nTækjaathugunin, undir Verkfæri þar sem PaperPaw er fastbúnaður tækisins, fer yfir alla hluta tækis eina síðu í einu: skjáinn, hnappa, snertingu, framlýsingu, rafhlöðu, kort, klukku, Wi-Fi, svefn og minni. Hver síða endar á Mistókst, Sleppa og Stóðst, og svarið sem mælingarnar benda til er valið; hlutum sem tæki hefur ekki er sleppt. Eftir hvert svar skrifar hún skýrslu í .paperpaw/plugins/diagnostics/device-check.txt, til að líma í sameiningarbeiðni (pull request). Til baka yfirgefur hana og hún heldur áfram þar sem frá var horfið þegar hún er opnuð aftur. Á tæki með hnöppum eingöngu skaltu velja Byrja á hnappasíðunni fyrst; þangað til virka örvarnar, Velja og Til baka eins og á hverri síðu."
