news.plugin.name = Fréttir
news.plugin.description = Sækir fréttastrauma (RSS, Atom) sem bækur til að lesa.
news.plugin.how = "Fréttir breyta RSS- eða Atom-straumum í bækur. Hver straumur verður ein bók í möppunni News í bókasafninu, með nýjustu greinunum sem einföldum texta, til að lesa eins og hverja aðra bók.\n\nOpnaðu Fréttir úr valmyndinni Verkfæri og veldu Bæta við straumi; vistfang hans er á vefsvæði dagblaðsins eða bloggsins. Sækja fréttir sækir alla strauma og skiptir út fyrri bókum. Haltu straumi inni (með hnöppum, haltu Velja inni) til að sækja hann einan eða fjarlægja. Straumur sem er fjarlægður skilur bók sína eftir í bókasafninu.\n\nTil að sækja þarf net. Greinar á straum (Stillingar, Bókasafn) ákveður hversu margar greinar hver bók geymir. Græjan Fréttafyrirsagnir sýnir þær á upphafsskjánum."
