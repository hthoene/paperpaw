files.plugin.name = Skráavafri
files.plugin.description = Sýnir bækurnar og möppurnar á tækinu og opnar þær.
files.plugin.how = "Bókasafnið sýnir bækurnar í bókasafnsmöppunni þinni, hverja með kápu, titli, höfundi og hversu langt þú hefur lesið hana. Bókin sem þú last síðast stendur efst sem spjald, svo það tekur eina snertingu, eða eina ýtingu á Velja, að halda áfram að lesa. Meðan bókasafnið leitar að bókum segir það hversu margar það hefur fundið til þessa.\n\nVeldu hvað er sýnt fyrir ofan bækurnar: allar, þær sem þú ert að lesa, ólesnar eða lesnar, eða hillurnar (eftir höfundi, bókaröð, efnisorði, eftirlæti, næstu bók í hverri bókaröð sem þú hefur byrjað á). Snertu bók til að lesa hana; haltu henni inni (með hnöppum, haltu Velja inni) til að opna hana, merkja hana lesna eða ólesna, sjá upplýsingar um hana, færa hana í skjalasafnið eða eyða henni. Snertu titilinn fyrir bókasafnsvalmyndina: hvernig bækur eru flokkaðar og sýndar, leit, bókasafnsmappan og stillingar.\n\nBókasafnsmappan er stillt í Stillingum, undir Bókasafn, sem Bókasafnsmappa; þar getur þú líka sýnt bækur sem hnitanet af kápum. Fyrir allar aðrar skrár skaltu nota Skrár í valmyndinni Verkfæri."
