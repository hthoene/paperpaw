power.plugin.name = Orka
power.plugin.description = Velur orkuhaminn, handvirkt eða eftir rafhlöðunni: Venjulegt, Sparnaður, Ótengt.
power.plugin.how = "Orka velur hvernig PaperPaw eyðir rafhlöðunni: Venjulegt, Sparnaður eða Ótengt. Sparnaður gerir það sem getur beðið á betri augnablikum; Ótengt heldur útvarpinu slökktu. Sjálfvirkt velur eftir rafhlöðunni.\n\nBreyttu hamnum í flýtiborðinu, þar sem Orka sýnir hamina hlið við hlið, eða í Stillingum undir Orka. Þar stillir þú líka þrepin þar sem Sjálfvirkt skiptir yfir í Sparnað og í Ótengt, og hvort það haldist Venjulegt meðan hleðsla stendur yfir.\n\nÍ stöðulínunum sýnir Orkuhamur lauf við sparnað og yfirstrikað Wi-Fi þegar ótengt, og ekkert í Venjulegu.\n\nHaltu rofanum inni til að opna litla valmynd: Svefn, Slökkva (þar sem PaperPaw getur það), Endurræsa, og á snertitækjum Læsa snertingu eða Opna snertingu. Stutt ýting setur tækið enn í svefn. Til baka yfirgefur valmyndina."
