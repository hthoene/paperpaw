translate.plugin.name = Þýðing
translate.plugin.description = Þýðir valinn texta á netinu, með DeepL.
translate.plugin.how = "Þýðing þýðir valinn texta á netinu með DeepL. Veldu texta í bók og veldu Þýða í valmynd valda textans: þýðingin birtist yfir síðunni eins og orðabókarfærsla. Síðuhnappar eða snertingar fletta henni og Velja eða snerting við enda hennar lokar henni.\n\nHún þarf net og þinn eigin DeepL API-lykil, ókeypis á deepl.com (DeepL API Free, um 500.000 stafir á mánuði). Þar til þú slærð hann inn segir svæðið frá því og snerting biður um hann.\n\nÍ stillingunum, undir Lestur, í hlutanum Þýðing, ákveður Þýða á tungumálið; í upphafi er það tungumál PaperPaw sjálfs."
