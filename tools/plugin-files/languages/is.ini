opds.plugin.name = OPDS-vörulistar
opds.plugin.description = Vafrar um OPDS-vörulista, sækir bækur þeirra og heldur möppum samstilltum við þá.
opds.plugin.how = "OPDS-vörulistar eru bókasöfn á netinu eins og Project Gutenberg, Calibre-Web, Kavita eða Komga. Þessi viðbót vafrar um þá og leitar í þeim eins og möppum og sækir bækur þeirra í bókasafnið.\n\nOpnaðu Vörulista úr valmyndinni Verkfæri og veldu Bæta við vörulista: vistfang og, ef vörulistinn krefst aðgangs, notandanafn og lykilorð. Snertu vörulista til að vafra um hann; haltu honum inni (með hnöppum, haltu Velja inni) til að samstilla, breyta eða fjarlægja hann.\n\nÞegar kveikt er á Samstilla þennan vörulista sækir Samstilla vörulista nýjar bækur hans í möppu hans. Bækur á samstillingu takmarkar hversu margar ein samstilling sækir, svo stór vörulisti fylli ekki tækið. Skýjamappa (WebDAV) virkar í stað vörulista."
