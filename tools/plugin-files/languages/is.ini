sleep.plugin.name = Svefnskjár
sleep.plugin.description = Sýnir sofandi kött, kápu bókarinnar, myndirnar þínar eða skilaboð meðan tækið sefur.
sleep.plugin.how = "Svefnskjárinn ákveður hvað skjárinn sýnir meðan tækið sefur. Rafblek heldur myndinni án rafmagns.\n\nVeldu hann í stillingunum, undir Tæki, Svefnskjár, með Sýna: sofandi köttur (sjálfgefið), kápa bókarinnar, myndirnar mínar, merkið og „Sefur“, græjur, síðan eins og hún er, eða síðan með mynd. Myndirnar mínar sýnir skrárnar í Myndamöppunni hverja á eftir annarri.\n\nÁn kápu eða myndar birtist kötturinn. Þar sem kerfið teiknar svefnskjáinn sjálft eru þessar stillingar faldar.\n\nSlökkvaskjárinn, Sýna þegar slökkt er, er teiknaður einu sinni þegar slökkt er á tækinu, úr orkuvalmyndinni eða eftir tímann í Slökkva eftir svefn (ekki þegar tóm rafhlaða rýfur strauminn). Hann er eins og svefnskjárinn nema þú veljir merkið og „Slökkt“, köttinn, kápuna eða myndirnar mínar. Önnur viðbót getur boðið skjá fyrir hann.\n\nRæsingar- og endurræsingarskjárinn, Sýna við ræsingu og Sýna við endurræsingu, er skjár tækisins sjálfs nema önnur viðbót bjóði skjá fyrir þá. Viðbætur keyra ekki enn meðan tækið ræsist: skjárinn sem valinn er fyrir ræsinguna er teiknaður fyrirfram, þegar slökkt er á tækinu eða það endurræst, og sýndur við næstu ræsingu. Skjár sem er ekki tilbúinn í tæka tíð, eða skemmd mynd, víkur fyrir skjá tækisins sjálfs; tækið slekkur á sér eða endurræsist í öllum tilvikum."
