aids.plugin.name = Lestrarhjálp
aids.plugin.description = Feitletruð orðabyrjun, útskiptiorð, myndir: texti eins og þú vilt hafa hann.
aids.plugin.how = "Lestrarhjálp breytir útliti texta bókar meðan þú lest. Hún gildir fyrir allar bækur. Feitletruð orðabyrjun og Skipta út orðum eru fyrst slökkt.\n\nÞú finnur hana í Stillingum, undir Lestur, í hlutanum Lestrarhjálp. Feitletruð orðabyrjun setur fyrri helming hvers orðs feitletraðan, sem sumum finnst auðveldara að fylgja. Skipta út orðum tekur pör sem eru skrifuð sem „sjónvarp = skjávarp; hr. = herra“, aðskilin með semíkommum.\n\nAðeins heilum orðum er skipt út, nákvæmlega eins og þú skrifaðir þau, svo „sjónvarp“ breytir aldrei hluta af lengra orði. Bókarskráin sjálf er ekki breytt.\n\nMyndir í bókum má sýna (eins og í upphafi), breyta í stutta línu á borð við „[Mynd: skip á hafi]“ sem notar lýsingu myndarinnar, eða sleppa. Þá er meira pláss fyrir texta á síðunni og ekkert er afkóðað fyrir mynd sem ekki er sýnd, sem flýtir blaðsíðuflettingum. Myndasögum og öðrum bókum úr myndum er ekki breytt."
