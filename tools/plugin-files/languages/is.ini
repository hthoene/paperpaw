menu.plugin.name = Valmynd
menu.plugin.description = Valmyndin neðst á skjánum, með aðgerðum og stillingum.
menu.plugin.how = "Valmyndin sýnir hvað þú getur gert og stillt. Hún opnast neðst á skjánum, ofan á því sem er opið: við lestur skaltu snerta miðju skjásins eða ýta á Velja. Snertu eða veldu færslu til að keyra hana.\n\nStillingar í valmyndinni sýna gildi sitt og breytast á staðnum, svo valmyndin helst opin. Færsla með fleiri færslum opnar undirvalmynd.\n\nStrjúktu niður frá efri jaðri fyrir flýtiborðið: það sem þú breytir oft, sem hnappar. Snertu hnapp til að skipta honum, haltu honum inni fyrir stillingar hans. Með hnöppum eingöngu velja örvahnapparnir, Velja skiptir og Til baka lokar. Undir Útlit sýnir Valmyndir valmyndirnar sem lista eða flísar."
