reader.plugin.name = Lesari
reader.plugin.description = Sýnir bækur síðu fyrir síðu, með efnisyfirliti og lestrarstillingum.
reader.plugin.how = "Lesarinn sýnir bækur síðu fyrir síðu. Opnaðu bók úr bókasafninu; síðasta bókin getur opnast aftur við ræsingu (stillingin Opna síðustu bók við ræsingu).\n\nSnertu vinstri eða hægri hlið skjásins, eða notaðu síðuhnappana, til að fletta. Snertu miðjuna eða ýttu á Velja fyrir lestrarvalmyndina: Efnisyfirlit, Leit, Fara á síðu, Letur og útlit, Bókamerki og auðkenningar og fleira. Niður frá efri jaðri opnar flýtiborðið, upp frá neðri jaðri fer heim; það gerir líka að halda Til baka inni.\n\nHaltu Velja inni (eða haltu mynd inni) til að sjá mynd á öllum skjánum: Vinstri og Hægri fara í gegnum myndir síðunnar. Velja stækkar í 2x, 3x og aftur til baka (tvöföld snerting á snertiskjá); þegar stækkað er færa Vinstri og Hægri myndina til hliðar, síðuhnapparnir (eða strok) halda áfram þvert og niður. Til baka fer aftur í aðlagað, svo á síðuna (haltu inni til að fara út á snertiskjá). Snertu efra hægra hornið fyrir bókamerki. Haltu orði inni til að auðkenna það. Með hnöppum: haltu Vinstri inni: Vinstri og Hægri færa orð fyrir orð, síðuhnapparnir línu fyrir línu, að halda þeim inni fer að jöðrum síðunnar og málsgrein fyrir málsgrein; Velja opnar auðkenningarstikuna fyrir orðið, að halda Velja inni víkkar það í setninguna og málsgreinina (þá færa Vinstri og Hægri endann, að halda þeim inni upphafið). Val heldur áfram yfir síðuflettingar. Flytja út sem Markdown vistar glósurnar þínar."
