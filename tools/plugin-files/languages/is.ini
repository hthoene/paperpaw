stats.plugin.name = Lestrartölfræði
stats.plugin.description = Skráir hversu lengi og hversu mikið þú lest, með dagatali og tölum hverrar bókar.
stats.plugin.how = "Lestrartölfræði skráir hversu lengi þú lest hverja síðu. Þú sérð hana sem yfirlit með deginum í dag, vikunni og röðinni þinni, sem dagatal, og með tölum hverrar bókar.\n\nOpnaðu hana úr Verkfærum, eða úr Meira í lesaranum. Í stillingunum, undir Lestrartölfræði, getur þú slökkt á Skrá lestur, sett Daglegt markmið og stillt Stystu síðu og Lengstu síðu sem teljast, svo flett í gegn eða bók sem er látin liggja opin skekki ekki tölurnar.\n\nSamstilla við KOReader deilir tölfræðinni með KOReader í gegnum WebDAV-möppu. Það tekur líka inn tölfræði KOReader á sama tæki. Skráning krefst þess að klukkan sé stillt: þar sem hún er það ekki skaltu tengjast Wi-Fi einu sinni."
