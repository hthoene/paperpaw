notes-vault.plugin.name = Glósuhvelfing
notes-vault.plugin.description = Les möppu með Markdown-glósum eftir möppum, efnisorðum og nýjustu breytingum, með græjum fyrir upphafsskjáinn. Virkar með Obsidian-hvelfingum.
notes-vault.plugin.how = "Glósuhvelfing les möppu með Markdown-glósum (einfaldar .md-skrár, eins og glósuforrit geyma þær). Hún virkar með Obsidian-hvelfingum.\n\nVeldu möppu hvelfingarinnar í stillingunum, eða á síðu hvelfingarinnar í verkfærunum. Síðan sýnir þá möppurnar eins og þær eru á kortinu, nýjustu breyttu glósurnar, efnisorðin og leit í titlum glósnanna.\n\nÍ fyrsta sinn er hvelfingin skráð í bakgrunni meðan síða hennar er opin; hvelfing með þúsundum glósa tekur nokkrar mínútur, síðan opnast hún strax. Vísirinn er geymdur á kortinu og búinn til aftur þegar síða hvelfingarinnar er opnuð eftir nokkrar klukkustundir, eða þegar þú velur Uppfæra.\n\nGlósa opnast í lesaranum. Tenglar á aðrar glósur ([[Glósa]], [[Glósa|orð]], [[Glósa#Fyrirsögn]]) finnast eftir nafni glósunnar hvar sem er í hvelfingunni; að fylgja einum opnar þá glósu og Til baka fer aftur í glósuna á undan.\n\nEkkert í hvelfingunni er nokkurn tíma breytt. Græjurnar fyrir upphafsskjáinn (nýlegar glósur, fest glósa, glósa dagsins, tilviljanakennd glósa, efnisorð, leit) bætirðu við í ritli upphafsskjásins. Græja getur tekið glósur sínar úr einni möppu eingöngu: skrifaðu slóð möppunnar frá rót kortsins (til dæmis Glosur/Vinna) í stillingar græjunnar; sé það skilið eftir autt tekur hún allar glósur hvelfingarinnar."
