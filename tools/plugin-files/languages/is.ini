rules.plugin.name = Reglur
rules.plugin.description = Þegar eitthvað gerist, gerist eitthvað: t.d. næturstilling kl. 22:00.
rules.plugin.how = "Regla gerir eitthvað af sjálfu sér þegar eitthvað gerist: næturstilling á á hverjum degi kl. 22:00, eða vörulistar samstilltir þegar PaperPaw ræsist.\n\nReglur eru í Stillingum undir Sérsnið, sem Reglur. Bæta við reglu spyr Hvenær? (PaperPaw ræsist, tími dags, bók opnuð eða lokað, rafhlaðan, hleðsla, rofi og fleira) og Hvað þá? (keyra aðgerð, kveikja eða slökkva á rofa, stilla tölu, sýna skilaboð). Snertu reglu til að setja hana í hlé; haltu henni inni (með hnöppum, haltu Velja inni) fyrir skilyrði eins og Milli tveggja tíma dags, eða til að fjarlægja hana.\n\nAðgerðirnar, rofarnir og tölurnar sem hægt er að velja úr koma eftir viðbót: veldu viðbótina og síðan það sem hún hefur upp á að bjóða; til baka fer út úr henni aftur. Aðgerð sem verkar á skjáinn sem er sýndur, eins og Til baka eða Næsta síða, gerir það sem hún myndi gera ef ýtt væri þar.\n\nTímar gilda hvaða skjár sem er opinn. Tvær reglur sem afturkalla stöðugt hvor aðra stöðvast eftir nokkur skref."
