wifi.plugin.name = Wi-Fi
wifi.plugin.description = Tengist Wi-Fi-netum þegar þörf er á og slekkur svo á útvarpinu.
wifi.plugin.how = "Wi-Fi tengist neti þegar viðbót þarf internetið (vörulista, samstillingu, verslunina, flutning) og slekkur aftur á útvarpinu mínútu eftir að ekkert notar það, eða strax þegar Heim eða bók birtist, til að spara rafhlöðu og minni.\n\nOpnaðu Wi-Fi úr Stillingum, eða úr Wi-Fi-atriðinu í stöðulínunni. Net telur upp þau sem eru í seilingarfjarlægð; veldu eitt og sláðu inn lykilorð þess, eða veldu Setja upp með síma og sláðu inn nafn og lykilorð í vafra símans þíns í stað þess að gera það á tækinu. Gleyma fjarlægir vistað net.\n\nLykilorðin haldast á kortinu, geymd á öruggan hátt, og eru aldrei sýnd aftur. Undir Tengjast þegar þörf er á stillir þú hversu lengi Wi-Fi helst á eftir síðustu notkun, hvort það helst á meðan hleðsla stendur yfir og hvaða vistaða net kemur fyrst þegar mörg eru í seilingarfjarlægð."
