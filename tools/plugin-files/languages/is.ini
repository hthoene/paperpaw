bluetooth.plugin.name = Bluetooth
bluetooth.plugin.description = Parar fjarstýringar, lyklaborð og skynjara og tengir þau.
bluetooth.plugin.how = "Bluetooth parar fjarstýringar, lyklaborð og skynjara við lesarann, þar sem hann er með Bluetooth (X4 Pro).\n\nBæta við tæki leitar að því sem er í seilingarfjarlægð; settu tækið fyrst í pörunarham. Veldu það og staðfestu á lesaranum (berðu saman töluna þar sem ein birtist). Hnappar fjarstýringar eða lyklaborðs fletta þá síðum og færa þig um valmyndir; breyttu því sem hver hnappur gerir undir Stýring.\n\nFjarstýringar segir hvenær hnappar þeirra virka: þegar kveikt er á þeim hér, við lestur (tengdar meðan bók er opin, sparar rafhlöðu) eða alltaf. Valmyndarhnappurinn eða löng ýting á tæki gleymir því.\n\nSkynjari er fyrir viðbætur: kveiktu á því hvaða viðbót má nota hann. Slökkt er á Bluetooth þegar ekkert notar það."
