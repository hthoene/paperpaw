pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Einbeitingartímamælir með vinnu- og hléloturum, græjum og daglegum teljara.
pomodoro.plugin.how = "Pomodoro-tímamælir: vinna í einbeittum lotum og hvíla sig svo. Hann þarf enga uppsetningu: 25 mínútur af einbeitingu, 5 af hvíld og eftir fjórar lotur langt hlé upp á 15.\n\nOpnaðu Pomodoro úr verkfæravalmyndinni og ýttu á Byrja, eða bættu græjum þess við upphafsskjáinn (haltu upphafsskjánum inni og bættu svo við græju): Pomodoro-tímamælir sýnir fasann og mínúturnar sem eftir eru, Pomodoro byrja/hlé er hnappur og Pomodoro í dag telur loturnar sem þú lauk, með daglega markmiðinu þínu. Snerting á tímamælinn ræsir hann eða setur í hlé; haltu honum inni til að opna allan skjáinn.\n\nTímamælirinn heldur áfram að ganga þegar þú yfirgefur skjáinn og heldur áfram eftir klukkunni eftir endurræsingu. Meðan lesarinn sefur gengur ekkert: fasi sem lauk á meðan er tilkynntur þegar hann vaknar. Tilkynning segir þér þegar fasa lýkur. Til að spara rafhlöðu uppfærist klukkan einu sinni á mínútu (á tíu sekúndna fresti síðustu mínútuna á öllum skjánum) og heldur lesaranum aldrei vakandi.\n\nUndir Pomodoro í stillingunum stillir þú lengdirnar og loturnar í hverri lotuseríu og hvort næsti fasi byrjar af sjálfu sér. Undir Meira: blikk á skjánum eða blikk á framlýsingunni þegar fasa lýkur og daglegt markmið."
