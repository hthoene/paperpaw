keyboard.plugin.name = Lyklaborð
keyboard.plugin.description = Slær inn texta á skjánum, með snertingu eða hnöppum.
keyboard.plugin.how = "Lyklaborðið opnast hvenær sem eitthvað þarf texta: leit, lykilorð, glósa eða stilling. Það virkar með snertingu og með hnöppum einum saman.\n\nMeð hnöppum færa Vinstri og Hægri þig eftir röð, síðuhnapparnir færa þig milli raða, Velja ýtir á takka og Til baka hættir við; Vinstri og Hægri fara hring um röð og Upp og Niður halda sig í dálknum þínum. Shift gerir næsta staf að hástaf; ýttu tvisvar á hann fyrir alla hástafi og einu sinni enn til að hætta. Haltu staf inni (með hnöppum: haltu Velja inni á honum) fyrir hástaf hans, valinn strax, og áherslumerki eins og á, é, í, ó, ú og ý; þannig koma á, é, í, ó, ú og ý frá a, e, i, o, u og y (með hnöppum segir lyklaborðið frá því á þessum stöfum). Í lagi lýkur innslætti; með hnöppum lýkur því að halda Til baka inni innslætti hvaðan sem er (Til baka eitt og sér hættir við), eða að halda Velja inni á takka sem er ekki stafur. Líma setur inn texta af klippiborðinu og Sími, þar sem það býðst, lætur þig skrifa í símanum þínum í staðinn.\n\nÍ stillingunum undir Tæki, Lyklaborð: Lyklaborðsuppsetningar velur uppsetningarnar. Sjálfgefið fylgir það tungumáli valmyndanna; með fleiri en einni skiptir takki á milli þeirra. Umlaut-takkar gefur ä, ö, ü og ß sérstaka takka í staðinn. Stærð stækkar takka og stafi; með hnöppum einum saman haldast raðirnar eins og á tölvulyklaborði. Á snertiskjám breytir Lögun takka því hvernig takkarnir líta út. Sjálfvirkir hástafir byrja hverja setningu á hástaf."
