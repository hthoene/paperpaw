tasks.plugin.name = Verkefni
tasks.plugin.description = Verkefnalistar með skiladögum og forgangi, á lesaranum eða samstilltir við CalDAV-þjóninn þinn, með græjum fyrir upphafsskjáinn.
tasks.plugin.how = "Verkefnalistar á lesaranum þínum: verkefni með skiladegi og forgangi, hakað við þegar þeim er lokið. Þeir virka án uppsetningar og án nets, og hægt er að halda þeim í takt við CalDAV-þjón (Nextcloud, Radicale, Baïkal, Fastmail og fleiri), svo að sömu listar séu í símanum og tölvunni þinni.\n\nOpnaðu Verkefni úr verkefnavalmyndinni. Fyrsta línan nefnir listann sem er sýndur; veldu hana fyrir annan lista, fyrir Í dag og seinkað yfir alla lista, fyrir nýjan lista, til að samstilla, eða til að stilla aðganginn. Bæta við verkefni opnar lyklaborðið. Velja á verkefni hakar við það (aftur: ekki lokið). Haltu verkefni inni eða ýttu á Valmynd til að breyta titli þess, skiladegi (í dag, á morgun, eftir viku, eða dagsetningu sem þú slærð inn eins og 2026-12-24) eða forgangi, eða til að fjarlægja það. Opin verkefni koma fyrst, eftir degi og síðan forgangi; lokin verkefni haldast aftast í viku (stillt undir Verkefni í stillingunum) og fara þá af lesaranum.\n\nGræjur fyrir upphafsskjáinn (haltu upphafsskjánum inni og bættu svo við græju): Verkefni í dag sýnir hvað á að skila í dag eða er seinkað, Verkefnalisti sýnir einn lista, Opin verkefni telur þau og Næsta verkefni sýnir það sem á að gera næst. Snerting á verkefni í græju hakar við það; snerting á fyrirsögn opnar listana.\n\nTil að samstilla skaltu velja CalDAV-aðgang í listalínunni og slá inn vistfang þjónsins, notandanafnið þitt og lykilorð (best forritalykilorð). Vistfang þjónsins nægir, t.d. cloud.example.com/remote.php/dav; lesarinn finnur verkefnalistana þína þaðan. Hver verkefnalisti þjónsins verður listi á lesaranum. Lesarinn samstillir þegar þú opnar Verkefni, þegar þú velur Samstilla núna og þegar netið er hvort sem er á; það sem þú breytir án nets bíður og er sent síðar. Ef verkefni var breytt á lesaranum og annars staðar á meðan gildir útgáfa þjónsins og þín er geymd sem nýtt verkefni við hliðina, svo ekkert glatast. Glósur, áminningar og allt annað sem verkefni hefur á þjóninum helst óbreytt. Endurtekin verkefni eru sýnd en breytt þar sem þú bjóst þau til. Lesarinn tekur allt að 200 verkefni í 12 listum."
