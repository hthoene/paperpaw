calendar.plugin.name = Dagatal
calendar.plugin.description = Dagatölin þín á lesaranum: dagskrár-, dags-, viku- og mánaðaryfirlit úr CalDAV, iCal og skrám, afmæli úr tengiliðum, græjur á upphafsskjá og svefnskjár.
calendar.plugin.how = "Dagatölin þín á lesaranum: dagskrá næstu daga, dagur, vika og mánuður, með viðburðum úr CalDAV-dagatölum (Nextcloud, Radicale, Baïkal, Fastmail og fleirum), úr iCal-vistföngum (.ics, webcal://), úr dagatalsskrám á kortinu og afmælum og merkisdögum tengiliða þinna (CardDAV). Lesarinn les aðeins dagatöl; hann breytir þeim aldrei.\n\nOpnaðu Dagatal úr verkfæravalmyndinni. Fyrsta línan nefnir yfirlitið; veldu hana, eða haltu inni hvaða línu sem er eða ýttu á Valmynd, til að skipta milli Dagskrár, Dags, Viku, Mánaðar og Afmæla, til að bæta við dagatölum eða til að samstilla. Í Degi og Viku fara fyrstu tvær línurnar á daginn eða vikuna á undan og eftir (síðuhnapparnir gera það líka); í Mánuði færa örvahnapparnir daginn, síðuhnapparnir mánuðinn og Velja opnar daginn. Velja á viðburð sýnir hann í heild: hvenær, hvar, hvaða dagatal og hvernig hann endurtekur sig. Til baka fer eitt skref til baka.\n\nBættu dagatali við undir Dagatöl (í valmyndinni, eða Dagatal í stillingunum). Veldu gerð þess: CalDAV-aðgang (vistfang netþjónsins nægir, t.d. cloud.example.com/remote.php/dav; hvert dagatal með viðburðum verður hluti af yfirlitinu), iCal-vistfang (dagatal birt sem .ics), dagatalsskrá á kortinu, eða tengiliði (CardDAV-vistfangaskrá: lesarinn sýnir afmælin og merkisdagana sem eru vistuð með þeim). Sláðu inn vistfangið, fyrir aðgang notandanafnið þitt og lykilorð (best forritalykilorð; það er geymt með lykilorðum lesarans) og nafn. Hvert dagatal hefur merkingu (punkt, hring, gráan punkt eða ferning) sem þú getur breytt, svo þú getir greint þau að; allt að sex dagatöl.\n\nEndurteknir viðburðir (daglegir, vikulegir, mánaðarlegir, árlegir, með vikudögum, fjölda, lokadagsetningum og undanskildum dögum), heildagsviðburðir og viðburðir í öðrum tímabeltum eru sýndir á klukku lesarans sjálfs. Lesarinn geymir viðburði frá sextíu dögum fyrir til sextíu daga eftir daginn í dag, í mesta lagi 240, og sýnir þá án nets. Reglur sem hann getur ekki lesið sýna viðburð sinn einu sinni.\n\nDagatöl eru lesin þegar þú opnar dagatalið (í mesta lagi á fimm mínútna fresti), þegar þú velur Samstilla núna og, eftir því sem þú stillir undir Dagatal í stillingunum, þegar kveikt er á netinu hvort sem er eða þegar hleðsla hefst. Lesarinn kveikir aldrei á útvarpinu fyrir þetta, nema þegar þú biður um Samstilla núna.\n\nGræjur fyrir upphafsskjáinn (haltu upphafsskjánum inni og bættu svo við græju): Í dag sýnir dagsetninguna og hvað dagurinn hefur að geyma, Næsti viðburður viðburðinn sem er næstur, Dagskrá næstu daga, Mánuður mánuð með punkti undir dögum sem hafa viðburði og Afmæli næstu afmæli. Snerting á viðburð opnar hann, snerting á dag mánaðarins opnar þann dag. Svefnskjárinn getur sýnt dagskrá dagsins: veldu Dagatal undir Svefnskjár í stillingunum."
