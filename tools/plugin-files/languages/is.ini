widgets.plugin.name = Græjupakki
widgets.plugin.description = Fjöldi annarra græja fyrir upphafsskjáinn: klukkur, dagatal, tilvitnanir, bækur, glósur og fleira.
widgets.plugin.how = "Græjupakkinn bætir við fjölda græja fyrir upphafsskjáinn: klukkum (skífuklukka, orðaklukka, flísar, heimsklukka), dagatali, árinu til þessa, niðurtalningu, tunglfasa og degi og dagsetningu; tilvitnun dagsins, glósum, verkefnum, myndum, kveðju og PaperPaw-merkinu; og fyrir bækur nú í lestri, framvindu, næst á dagskrá, bókaröð, eftirlæti, auðkenningu og bókasafnið í tölum. Rafhlöðugræja er líka í honum.\n\nBættu þeim við með Breyta upphafsskjá í valmyndinni (eða með langri ýtingu á upphafsskjáinn) og síðan Bæta við græju. Hver hefur sínar eigin stillingar, eins og ramma, stærð og röðun. Ef þú velur græju sem breytist, eins og tilvitnun dagsins, sýnir hún þá næstu. Þínar eigin tilvitnanir fara í quotes.txt í .paperpaw/plugins/widgets á kortinu, hver lína sem texti | höfundur. Tímagræjurnar þurfa að klukkan sé stillt; Wi-Fi stillir hana."
