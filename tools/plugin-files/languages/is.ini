vocabulary.plugin.name = Orðaforði
vocabulary.plugin.description = Geymir orðin sem þú flettir upp, með setningum þeirra, og spyr úr minnisspjöldum með dreifðri endurtekningu, gerðum í símanum þínum.
vocabulary.plugin.how = "Orðaforði geymir orðin sem þú flettir upp við lestur, hvert með setningu sinni, til að fara yfir síðar. Þú finnur listann í Verkfærum, nýjustu fyrst; veldu orð til að fletta því upp aftur. Síðasta línan, Flytja út, vistar þau fyrir minnisspjaldaforrit eins og Anki. Listinn geymir nýjustu 2.000 orðin: umfram það fara þau elstu, svo fluttu þau út fyrst til að halda þeim öllum.\n\nMinnisspjöld, einnig í Verkfærum, spyrja þig með dreifðri endurtekningu: eftir Sýna svar metur þú hvert spjald Aftur, Erfitt, Gott eða Auðvelt, og það ákveður hvenær það kemur aftur. Búðu til stokka með Breyta í símanum: skannaðu kóðann með síma á sama Wi-Fi, skrifaðu síðan spjöld eða bættu mörgum við í einu: opnaðu stokk þar, veldu Mörg spjöld í einu og veldu CSV-, TSV- eða TXT-skrá (eitt spjald í hverri línu: framhlið, bakhlið, dæmi; UTF-8), límdu inn lista, eða komdu með Anki-stokk (.apkg, fluttan út með Styðja eldri Anki-útgáfur). \n\nEða notaðu skrár á SD-kortinu: settu CSV-, TSV- eða TXT-skrá, eða Anki-stokk (.apkg, fluttan út með Styðja eldri Anki-útgáfur), fyrir hvern stokk í möppuna Flashcards (Spænska.tsv býr til stokkinn Spænska; eitt spjald í hverri línu: framhlið, bakhlið, dæmi; vistað sem UTF-8; fyrsta línan má nefna dálkana front, back, example). Veldu Spjöld af SD-korti í Minnisspjöldum, eða láttu það gerast þegar þú opnar Minnisspjöld. Stokkarnir haldast á lesaranum, með því sem þú lærðir, og skrá er sameinuð stokki sínum þegar hún er ný eða breytt: breyttu bakhlið eða dæmi spjalds í skránni og spjaldið breytist og heldur framvindu sinni; breyttu texta framhliðarinnar og það telst nýtt spjald, hið gamla byrjar upp á nýtt (spjöld eru aðgreind eftir texta framhliðarinnar; bil og há- og lágstafir skipta ekki máli); lína sem þú eyðir eyðir ekki spjaldinu (nema þú stillir „spjöld sem vantar í skrána“ á Fjarlægja fyrir þann stokk: þá er spjaldið fjarlægt við næstu uppfærslu með framvindu sinni, fyrir fullt og allt, og ekkert er fjarlægt meðan ekki er hægt að lesa einhverja línu skrárinnar). Vistaðu stokk í skrá hans með Vista á kortið: skráin fær númer spjaldanna (dálkurinn id), svo þú getur breytt framhliðum í tölvu og spjöldin halda því sem þú lærðir; skráin geymir aðeins id, framhlið, bakhlið og dæmi (aðrir dálkar, athugasemdir og röð lína eru ekki geymd), og vistun er hafnað meðan ekki var hægt að lesa einhverja línu skrárinnar; skráin sem var þar er afrituð í _nafn.bak.tsv í fyrsta sinn (síðari vistun skiptir því afriti ekki út). Skrá yfir 4 MiB eða 20.000 línur er ekki lesin, og hún verður að vera vistuð sem CSV UTF-8, ekki UTF-16. Í fyrsta sinn býr lesarinn til möppuna með leiðbeiningum um hvernig þetta virkar.\n\nÍ stillingunum, undir Lestur, setur Uppflett orð verða spjöld hvert uppflett orð í stokkinn Uppflett."
