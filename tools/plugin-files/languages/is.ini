weather.plugin.name = Veður
weather.plugin.description = Veðrið núna og næstu daga sem græjur, frá Open-Meteo.
weather.plugin.how = "Veður sýnir veðrið núna og næstu daga sem græjur fyrir upphafsskjáinn, frá Open-Meteo, sem þarf engan aðgang eða lykil. Veðrið núna sýnir hitastig, veðurlag og fleira til að velja úr; Spá sýnir næstu daga í röð eða sem lista.\n\nVeldu fyrst stað: í stillingunum, undir Veður, Staður (sláðu inn nafn og veldu hann svo úr stöðunum sem finnast). Aðeins hnit hans eru send, og aðeins meðan veðurgræja er sýnd. Bættu græjunum við með því að breyta upphafsskjánum.\n\nVeðrið er sótt í mesta lagi eins oft og Uppfæra í mesta lagi á hverjum segir, og aðeins þegar net er til staðar: það kveikir aldrei á Wi-Fi af sjálfu sér.\n\nVeðurgögn frá Open-Meteo.com (https://open-meteo.com), með Creative Commons Attribution 4.0 leyfinu (CC BY 4.0)."
