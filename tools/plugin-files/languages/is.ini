fonts-browser.plugin.name = Fleiri letur
fonts-browser.plugin.description = Sýnir letur af netinu, hvert með sýnishorni, og sækir það til að lesa með.
fonts-browser.plugin.how = "Fleiri letur telur upp letur úr leturbókasafni á netinu, hvert nafn sett með sínu eigin letri, og sækir þau sem þú vilt lesa með.\n\nÞú finnur það aftast í leturlistanum þar sem lestrarletrið er valið, í Stillingum, undir Lestur, sem Letur; stöðulínurnar hafa sömu færslu fyrir sitt letur. Snertu letur (með hnöppum, ýttu á Velja) til að sjá það stærra með sýnishorni af setningu og veldu svo Sækja. Þú getur yfirgefið síðuna meðan það sækist. Þegar því er lokið skaltu velja Lesa með (nafn letursins), eða Nota fyrir stöðulínurnar. Uppfæra sækir nýrri útgáfu, Fjarlægja eyðir letrinu af tækinu.\n\nÞað þarf Wi-Fi.\n\nEIGIN LETUR\n\nVið hlið Fleiri letur hefur sami listi færsluna Eigin letur, sem sýnir þennan hluta hjálparinnar. Eigið letur er .ttf- eða .otf-skrá, til dæmis frá Google Fonts.\n\nÁ Android og öðrum tækjum sem teikna leturskrár: afritaðu skrána í leturmöppuna (á Android: PaperPaw/fonts í sameiginlegri geymslu), endurræstu PaperPaw og veldu letrið í Stillingum, undir Lestur, sem Letur.\n\nÁ Xteink X4 og X4 Pro: þessir lesarar lesa leturpakka, ekki leturskrár, því leturskrár myndu ekki passa í minni þeirra. Búðu til pakka í tölvu með paperpaw-fontgen, fyrir hvern stíl sem þú átt (venjulegur er nauðsynlegur):\n\npaperpaw-fontgen --family \"Mitt letur\" --regular MittLetur-Venjulegt.ttf --bold MittLetur-Feitt.ttf --italic MittLetur-Skratt.ttf plugins\n\nÞetta býr til möppuna plugins/font-mitt-letur. Afritaðu hana í möppuna plugins á minniskortinu, endurræstu og veldu Mitt letur sem Letur. Pakki með einum stíl er um hálft megabæti fyrir latneska stafi; stílar sem þú sleppir eru teiknaðir í venjulega stílnum. Tólið segir hversu marga af stöfunum sem þú biður um letrið hefur (--chars latin,cyrillic,greek bætir við letrum): letur án stafa bókarinnar þinnar getur ekki sýnt þá, svo leitaðu að einu sem nær yfir ritkerfi hennar.\n\nLetur úr Fleiri letur virka á sama hátt og þurfa enga tölvu.\n\nFyrir skarpari lítinn texta á rafblekskjánum skaltu bæta --hinting light við skipunina: það aðlagar stafina að punktaneti, eins og sjálfgefnu letrin eru gerð. Án þess eru stafirnir teiknaðir eins og letrið var hannað; --hinting normal og --hinting mono aðlaga þá meira. Letur með tákn, eins og arabísku eða devanagari, er best að hafa án þess."
