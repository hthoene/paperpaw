battery.plugin.name = Rafhlöðunotkun
battery.plugin.description = Skráir rafhlöðuna og sýnir hversu lengi hún endist.
battery.plugin.how = "Rafhlöðunotkun skráir hleðsluna um það bil einu sinni á mínútu meðan tækið er vakandi, ásamt því sem það gerði: skjáendurnýjanir og blaðsíður sem var flett. Út frá því reiknar hún hvað klukkustund vakandi og 100 síður taka og hversu lengi rafhlaðan endist á þeim hraða.\n\nOpnaðu Rafhlöðu úr valmyndinni Verkfæri. Hún sýnir hleðsluna núna, þennan vökutíma, notkun á rafhlöðu hingað til og nýlega vökutíma þína. Flettu með síðuhnöppunum eða með því að snerta örvarnar efst.\n\nÞað þarf nokkurn lestur á rafhlöðu áður en tölurnar segja eitthvað. Skráning er sjálfgefið á og hægt er að slökkva á henni í Stillingum, undir Tæki, Orka, sem Skrá rafhlöðunotkun."
