notes-overview.plugin.description = Bókamerki og auðkenningar allra bóka á einum lista, og útflutningur sem My Clippings.txt.
notes-overview.plugin.how = "Allar glósur telur upp hverja bók þar sem þú bjóst til bókamerki eða auðkenningu, með fjöldanum. Opnaðu það í Verkfærum. Veldu bók til að sjá glósur hennar og glósu til að opna bókina á þeim stað.\n\nAftast á listanum skrifar Flytja út sem My Clippings.txt allar glósur í eina skrá, í möppuna Exports við hlið bókasafnsins, á því sniði sem Kindle notar (UTF-8). Forrit sem lesa My Clippings.txt úr Kindle geta lesið hana. Glósa við auðkenningu er sérstök færsla, eins og á Kindle. Þar sem bók hér hefur engar Kindle-staðsetningar er „location“ hversu langt inni í bókinni glósan er, í prósentum. Skráin er skrifuð upp á nýtt í hvert skipti; hún kemur í stað þeirrar fyrri."
