lock.plugin.name = Skjálás
lock.plugin.description = PIN, mynstur eða lykilorð þegar tækið vaknar; snerting læst við lestur.
lock.plugin.how = "Skjálásinn biður um PIN, mynstur eða lykilorð þegar PaperPaw ræsist og þegar tækið vaknar. Slökkt er á honum í upphafi. Hann heldur aðeins frá tilfallandi notkun: kóðinn og fjöldi rangra tilrauna eru geymd á SD-kortinu, svo hver sem tekur kortið úr, breytir því eða skiptir um það kemst framhjá lásnum.\n\nStilltu hann í stillingunum, undir Tæki, Skjálás: sláðu inn kóðann sem er í notkun ef einn er til, veldu gerðina og síðan nýja kóðann tvisvar. Mynstur býðst aðeins á snertiskjám.\n\nEftir fimm rangar tilraunir bíður sú næsta í hálfa mínútu. Læsa núna læsir strax og er hægt að setja á hnapp, bendingu eða reglu. Hægt er að slökkva á Læsa eftir vöku, svo aðeins raunveruleg ræsing (kveikt á tækinu eða endurræsing) læsir, nema þar sem hver vaka er ræsing, eins og á X4 á rafhlöðu.\n\nSnertilás, við hliðina: Læsa snertingu í flýtiborðinu og lestrarvalmyndinni lætur snertingar, strok og pennann gera ekkert meðan hnapparnir virka áfram, t.d. til að lesa með hönd á skjánum. Til að opna skaltu snerta tvisvar með einum fingri og halda honum niðri augnablik; að halda rofanum inni opnar Orkuvalmyndina, þar sem Opna snertingu gerir það með hnöppunum; á X4 Pro opnar það strax að halda heimahnappnum inni."
