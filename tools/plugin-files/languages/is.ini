menu-editor.plugin.name = Valmyndaritill
menu-editor.plugin.description = Endurraðar, fjarlægir og bætir við færslum allra valmynda.
menu-editor.plugin.how = "Valmyndaritillinn breytir því sem valmyndirnar innihalda: færðu færslur upp eða niður, fjarlægðu þær eða bættu við nýjum.\n\nÞú finnur hann í Stillingum undir Sérsnið, sem Sérsníða valmyndir. Veldu valmynd og síðan færslu til að færa hana eða fjarlægja; Bæta við færslu setur inn nýja. Breytingar gilda strax. Núllstilla þessa valmynd skilar valmynd eins og viðbæturnar skilgreina hana, Núllstilla allar valmyndir gerir það fyrir allar.\n\nÞú getur ekki lokað þig úti: færsla sem er leiðin að stillingunum helst þar til þú bætir við annarri leið að þeim."
