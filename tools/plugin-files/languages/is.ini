format-cbz.plugin.name = Myndasögur
format-cbz.plugin.description = Opnar myndasafnaskrár (.cbz), ein mynd á síðu.
format-cbz.plugin.how = "Opnar myndasafnaskrár (.cbz): ein mynd á síðu, löguð að skjánum, í röð nafna þeirra (2 á undan 10).\n\nSettu þær í bókasafnsmöppuna og opnaðu þær úr bókasafninu; flettu síðum eins og í hverri bók. Stórar myndir taka augnablik í fyrsta sinn, á X4 lengur en annars staðar.\n\nLestrarstillingar (Stillingar, Lestur): „Ramma fyrir ramma“ sýnir einn ramma síðu í einu, eins stóran og skjárinn leyfir, og síðuflettingar fara í gegnum þá; síða án ramma er sýnd í heild. „Myndasögusíður ganga“ speglar síðuflettingarnar fyrir manga (frá hægri til vinstri); ComicInfo.xml bókarinnar sjálfrar segir það af sjálfu sér. Bókasafnið sýnir titil bókar og bókaröð og númer úr ComicInfo.xml."
format-cbz.title = Myndasaga (CBZ)
format-cbz.setting.direction = Myndasögusíður ganga
format-cbz.setting.direction.help = Manga: síðuflettingarnar eru speglaðar.
format-cbz.direction.book = Eins og bókin segir
format-cbz.direction.ltr = Frá vinstri til hægri
format-cbz.direction.rtl = Frá hægri til vinstri
format-cbz.setting.panels = Ramma fyrir ramma
format-cbz.setting.panels.help = Einn rammi í einu, síðuflettingar fara í gegnum þá.
format-docx.plugin.name = DOCX-skjöl
format-docx.plugin.description = Opnar .docx-skrár, eins og Word og önnur forrit vista þær.
format-docx.plugin.how = "Opnar .docx-skjöl sem bækur: fyrirsagnir með efnisyfirliti, lista, töflur, feitletrun og skáletrun, tengla og myndir (JPEG, PNG, GIF).\n\nSettu skrárnar í bókasafnsmöppuna og opnaðu þær úr bókasafninu. Titillinn og höfundurinn koma úr eiginleikum skjalsins. Neðanmálsgreinar, hausar og fætur og athugasemdir eru ekki sýnd."
format-docx.title = DOCX-skjal
format-epub.plugin.name = EPUB
format-epub.plugin.description = Opnar EPUB-bækur með sniði þeirra, efnisyfirliti og myndum.
format-epub.plugin.how = "EPUB-bækur opnast úr bókasafninu eins og aðrar bækur, með efnisyfirliti, myndum og sniði útgefandans. Vefsíður (HTML), Markdown, FictionBook (.fb2) og myndasafnaskrár (.cbz) opnast á sama hátt, hver sem sín viðbót.\n\nKafli er umbreyttur þegar þú opnar hann í fyrsta sinn og geymdur í skyndiminni viðbótarinnar, svo hann er fljótari eftir það og stórar bækur virka á litlum tækjum. Efnisyfirlitið finnur þú undir Efnisyfirlit í lestrarvalmyndinni. Hvort snið bókarinnar sjálfrar gildir ræðst af stillingunni Snið útgefanda, undir Lestur."
format-epub.title = EPUB-rafbók
format-fb2.plugin.name = FictionBook
format-fb2.plugin.description = Opnar FictionBook-bækur (.fb2, líka þjappaðar).
format-fb2.plugin.how = "Opnar FictionBook-bækur (.fb2), algengar fyrir rússneskar og aðrar bækur, líka þjappaðar (.fb2.zip), með titli, höfundum, kápu og köflum.\n\nSettu þær í bókasafnsmöppuna; þær birtast í bókasafninu og opnast eins og hver önnur bók."
format-fb2.title = FictionBook
format-html.plugin.name = HTML
format-html.plugin.description = Opnar vefsíður vistaðar sem skrár og sýnir aðeins það sem á að lesa.
format-html.plugin.how = "Opnar vefsíður vistaðar sem skrár (.html, .htm, .xhtml) sem bækur: aðeins það sem er til að lesa, án valmynda, auglýsinga og þess háttar í kringum það.\n\nSettu skrána í bókasafnsmöppuna og opnaðu hana úr bókasafninu eins og hverja bók. Tenglar innan síðunnar virka; myndir birtast þar sem þær eru í skránni."
format-html.title = Vefsíða (HTML)
format-images.plugin.name = Myndir
format-images.plugin.description = Opnar myndir (.jpg, .png, .gif) sem bækur, ein síða á mynd.
format-images.plugin.how = "Myndir (.jpg, .png, .gif) opnast úr bókasafninu eins og bækur, ein mynd á síðu, löguð að skjánum.\n\nTil að lesa heila möppu af myndum skaltu opna fyrstu myndina í henni: myndirnar á eftir henni í möppunni fylgja, í röð nafna þeirra (2 á undan 10). Mynd síðar í möppunni byrjar þar; staðan í hverri mynd er vistuð sérstaklega. Mappa með allt að 300 myndum er lesin frá þeirri sem þú opnar.\n\nSkrá sem er ekki mynd, eða er of stór, sýnir nafn sitt í staðinn. Fyrir bók með mörgum myndum og eigin titli er myndasafnaskrá (.cbz) betra form."
format-images.title = Mynd
format-markdown.plugin.name = Markdown
format-markdown.plugin.description = Opnar Markdown-skrár (.md), t.d. glósur.
format-markdown.plugin.how = "Opnar Markdown-skrár (.md), eins og glósur, sem bækur: fyrirsagnir, lista, tilvitnanir og áherslur eins og til er ætlast, ekki sem tákn.\n\nSettu skrárnar í bókasafnsmöppuna og opnaðu þær úr bókasafninu. Fyrsta fyrirsögnin verður titillinn; myndir við hlið skrárinnar birtast þar sem textinn nefnir þær."
format-markdown.title = Markdown
format-mobi.plugin.name = MOBI-bækur
format-mobi.plugin.description = Opnar .mobi- og .azw-skrár án DRM.
format-mobi.plugin.how = "MOBI-bækur (.mobi, .azw) opnast úr bókasafninu eins og hver önnur bók, án nokkurrar uppsetningar. Titill, höfundar, tungumál og kápa koma úr bókinni og efnisyfirlitið er gert úr fyrirsögnum hennar.\n\nBókin er umbreytt í fyrsta sinn sem þú opnar hana, sem tekur nokkrar sekúndur fyrir langa bók; eftir það opnast hún samstundis. Texti, fyrirsagnir, feitletrun og skáletrun, tenglar og myndir eru sýnd.\n\nBækur með DRM (flestar bækur keyptar í verslun) er ekki hægt að opna, ekki heldur bækur með Huffman-þjöppun eða í nýrri KF8-gerðinni (.azw3): PaperPaw segir frá því þegar þú opnar þær. Afrit sem EPUB, gert með tóli eins og Calibre, opnast alltaf."
format-mobi.title = MOBI-bækur
format-rtf.plugin.name = RTF-skjöl
format-rtf.plugin.description = Opnar .rtf-skrár sem bækur.
format-rtf.title = RTF-skjöl
format-txt.plugin.name = Hreinn texti
format-txt.plugin.description = Opnar einfaldar textaskrár (.txt).
format-txt.plugin.how = "Einfaldar textaskrár (.txt) opnast úr bókasafninu eins og hver önnur bók, án nokkurrar uppsetningar. Viðbótin les UTF-8, UTF-16 og Windows-1252 texta og finnur kóðunina sjálf.\n\nMálsgreinar fylgja auðu línunum í skránni; ef skrá hefur engar er hver lína málsgrein. Í skrám frá Project Gutenberg er leyfistextinn í upphafi og lok sleppt og titill og höfundur eru tekin úr haus skrárinnar.\n\nSkráin er aldrei hlaðin í heild, svo mjög stórir textar opnast líka á litlum tækjum."
format-txt.title = Hreinn texti
format-xtc.plugin.name = XTC
format-xtc.plugin.description = Opnar XTC- og XTCH-bækur, forteiknaðar síður Xteink-lesara.
format-xtc.plugin.how = "XTC- og XTCH-skrár eru bækur þar sem síðurnar eru þegar teiknaðar sem myndir, gerðar af umbreytum fyrir Xteink-lesara. Þær opnast úr bókasafninu eins og hver önnur bók.\n\nÞar sem hver síða er föst mynd er ekki hægt að breyta stærð textans eða setja hann í öðru letri. Síðurnar eru svarthvítar eða með fjórum grátónum. Hver síða er afkóðuð þegar hún er sýnd, svo lítið minni þarf, líka á X4.\n\nTitill, höfundur og kaflar eru teknir úr skránni ef hún hefur þá."
format-xtc.title = XTC-síður
help.plugin.name = Ábendingar
help.plugin.description = Sýnir hvað stýringar skjás gera, í fyrsta sinn sem hann opnast.
help.plugin.how = "Í fyrsta sinn sem skjár opnast segir stutt athugasemd yfir honum hvað stýringar hans gera: hlutar skjásins sem snerting nær til, innrammaðir, og hvað hnapparnir gera.\n\nSnerting eða hvaða hnappur sem er lokar athugasemdinni og hún kemur ekki aftur fyrir þann skjá. Engar fleiri ábendingar slekkur á þeim öllum.\n\nÍ stillingunum, undir Kerfi, kveikir eða slekkur Ábendingar á þeim og Sýna ábendingar aftur lætur athugasemd hvers skjás birtast einu sinni enn."
