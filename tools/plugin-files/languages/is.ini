about.plugin.name = Um
about.plugin.description = Útgáfa og leyfi PaperPaw.
about.plugin.how = "Um sýnir hvaða útgáfu af PaperPaw þú ert með, hvar frumkóðinn er og undir hvaða leyfum það er gefið út.\n\nÞú finnur það aftast í Stillingum, sem Um PaperPaw. Veldu línu með örvahnöppunum og Velja, eða snertu hana. Viðbætur sem eru innbyggðar í fastbúnaðinn og, á tækjum sem hlaða viðbótum með kóða, fingrafarið sem slíkar viðbætur þurfa að vera smíðaðar fyrir eru einnig taldar upp.\n\nLeyfi opnast sem texti í lesaranum, svo þú flettir í gegnum hann eins og bók. Hann inniheldur leyfi PaperPaw sjálfs og leyfi leturgerða, tákna og orðskiptingamynstra sem fylgja með. Viðbætur geta bætt við sinni eigin línu, til dæmis höfundi þema."
