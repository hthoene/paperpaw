update.plugin.name = Uppfærsla
update.plugin.description = Setur upp fastbúnaðaruppfærslur, af kortinu eða sóttar af netinu.
update.plugin.how = "Uppfærsla setur upp nýjan fastbúnað, á tækjum þar sem PaperPaw er fastbúnaðurinn, eins og X4. Þú finnur hana í stillingunum, sem Uppfærsla.\n\nLeita á netinu spyr uppfærsluþjóninn um nýrra PaperPaw og sækir það, sem tekur nokkrar mínútur yfir Wi-Fi. Eða afritaðu uppfærsluskrá (endar á .bin, frá paperpaw.org) í möppuna updates á kortinu, til dæmis með Wi-Fi-flutningi. Setja upp tekur þá um eina mínútu og tækið endurræsist; bækur, stillingar og lesstöður haldast.\n\nMeð Leita að uppfærslum (í stillingunum, slökkt í upphafi) spyr tækið um það bil einu sinni í viku af sjálfu sér, aðeins meðan Wi-Fi er hvort sem er á eða það hleðst. Nýrra PaperPaw sem það finnur bíður hér; ekkert truflar lesturinn. Leit sendir það sem tækið keyrir, ekkert nafn eða númer þess; til að telja tæki líka hvort þú baðst um það og hvort það er fyrsta leit þess á deginum, vikunni eða mánuðinum.\n\nEf viðbætur sem þú notar hafa enn enga útgáfu fyrir nýju útgáfuna bíður uppfærslan eftir þeim. Eldri útgáfa er aðeins sett upp ef þú velur hana.\n\nAnnar fastbúnaður, eins og CrossPoint, er líka settur upp héðan: settu skrá hans (endar á .bin) í möppuna updates og opnaðu Uppfærsla. PaperPaw athugar að þetta sé heill, óskemmdur fastbúnaður fyrir þetta tæki, en getur ekki sagt hver gerði hann, þar sem hann er óundirritaður. Setja upp samt skrifar hann í hinn helming flassminnisins og tækið ræsir hann; PaperPaw helst í sínum helmingi þar til sá fastbúnaður setur eitthvað upp yfir það. Til að snúa aftur til PaperPaw síðar skaltu setja upp uppsetningarskrá þess (paperpaw-<tæki>-<útgáfa>-install.bin) úr valmynd hins fastbúnaðarins, eins og SD-fastbúnaðaruppfærslu CrossPoint."
