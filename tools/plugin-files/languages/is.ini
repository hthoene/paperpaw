mail.plugin.name = Póstur
mail.plugin.description = Les og sendir tölvupóst með lykilorði eða forritalykilorði (IMAP og SMTP), án innskráningar í vafra.
mail.plugin.how = "Póstur les og sendir tölvupóst yfir IMAP og SMTP. Hann skráir sig inn með netfanginu þínu og lykilorði, án innskráningar í vafra, svo hann virkar með hverjum þjónustuaðila sem leyfir það.\n\nSettu upp aðgang undir Stillingar, Póstur. Veldu þjónustuaðilann þinn, sláðu inn netfangið þitt og lykilorðið. Flestir þjónustuaðilar vilja forritalykilorð: búðu það til í öryggisstillingum aðgangsins þíns og notaðu það hér. Venjulega lykilorðið þitt virkar oft ekki, og það fer aldrei neitt nema á netþjón þjónustuaðilans. Það er geymt með lykilorðunum og lyklunum.\n\nOpnaðu Póst í verkfærunum. Athuga póst sækir nýjasta póstinn og möppurnar. Pósturinn er geymdur á kortinu, svo þú getur lesið hann án nets. Tækið tengist, sækir og aftengist, svo Wi-Fi er aðeins á í stutta stund.\n\nEf þjónustuaðilinn þinn er ekki á listanum skaltu velja Eigin netþjónar og stilla heiti netþjóna, gáttir og öryggi undir ítarlegu stillingunum. Netþjónn sem ekkert yfirvald ábyrgist skilríki fyrir spyr einu sinni hvort þú treystir honum; berðu fingrafarið saman við það sem þjónustuaðilinn þinn sýnir.\n\nPóstur með bók í viðhengi (EPUB, PDF og þess háttar, allt að 2 MB) hefur Opna bók fyrir neðan sig: það sækir skrána, setur hana í bókasafnið þitt og opnar hana.\n\nTil að sjá nýjan póst án þess að opna Póst skaltu kveikja á Athuga með nýjan póst í bakgrunni undir Stillingar, Póstur, og velja hversu oft (á 15, 30 eða 60 mínútna fresti). Slökkt er á því þar til þú kveikir á því. Lesarinn tengist þá öðru hverju yfir örugga tengingu meðan hann er vakandi og nettengdur, einn aðgang í einu, og uppfærir fjölda ólesinna á upphafsskjánum. Það notar dálitla rafhlöðu. Ef þú opnar Póst stöðvast athugun sem er í gangi.\n\nGræjur á upphafsskjánum sýna fjölda ólesinna, nýjasta og stjörnumerkta póstinn, eitt pósthólf og flýtileið til að skrifa póst."
