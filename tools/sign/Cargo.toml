[package]
name = "paperpaw-sign"
description = "Signs PaperPaw firmware images as update files, makes signing keys, makes native plugin files and signs them, and shows what such files hold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
paperpaw-update = { workspace = true }
paperpaw-native = { workspace = true, features = ["kernel"] }
# The number of families in a firmware's table (`abi`).
paperpaw-table = { workspace = true }
paperpaw-digest = { workspace = true }
# Translation catalogs compiled for the card (`catalog`).
paperpaw-i18n = { workspace = true }
# A plugin's repository and release checked by the store's rules.
paperpaw-publish = { workspace = true }
# The firmware's reading of the partition table (check-image).
paperpaw-x4 = { workspace = true }
# Only for new keys.
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }

[lints]
workspace = true
