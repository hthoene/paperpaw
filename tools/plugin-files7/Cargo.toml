[dependencies]
paperpaw-plugin-about = { path = "../../plugins/about", features = ["native-entry"] }
paperpaw-plugin-battery = { path = "../../plugins/battery", features = ["native-entry"] }
paperpaw-plugin-calibre = { path = "../../plugins/calibre", features = ["native-entry"] }
paperpaw-plugin-diagnostics = { path = "../../plugins/diagnostics", features = ["native-entry"] }
paperpaw-plugin-end-of-book = { path = "../../plugins/end-of-book", features = ["native-entry"] }
paperpaw-plugin-files = { path = "../../plugins/files", features = ["native-entry"] }
paperpaw-plugin-help = { path = "../../plugins/help", features = ["native-entry"] }
paperpaw-plugin-keyboard = { path = "../../plugins/keyboard", features = ["native-entry"] }
paperpaw-plugin-keys = { path = "../../plugins/keys", features = ["native-entry"] }
paperpaw-plugin-kosync = { path = "../../plugins/kosync", features = ["native-entry"] }
paperpaw-plugin-menu = { path = "../../plugins/menu", features = ["native-entry"] }
paperpaw-plugin-menu-editor = { path = "../../plugins/menu-editor", features = ["native-entry"] }
paperpaw-plugin-notes-overview = { path = "../../plugins/notes-overview", features = ["native-entry"] }
paperpaw-plugin-opds = { path = "../../plugins/opds", features = ["native-entry"] }
paperpaw-plugin-plugin-manager = { path = "../../plugins/plugin-manager", features = ["native-entry"] }
paperpaw-plugin-power = { path = "../../plugins/power", features = ["native-entry"] }
paperpaw-plugin-profiles = { path = "../../plugins/profiles", features = ["native-entry"] }
paperpaw-plugin-reading-goal = { path = "../../plugins/reading-goal", default-features = false, features = ["native-entry"] }
paperpaw-plugin-rules = { path = "../../plugins/rules", features = ["native-entry"] }
paperpaw-plugin-settings = { path = "../../plugins/settings", features = ["native-entry"] }
paperpaw-plugin-stats = { path = "../../plugins/stats", features = ["native-entry"] }
paperpaw-plugin-vocabulary = { path = "../../plugins/vocabulary", default-features = false, features = ["native-entry"] }
paperpaw-plugin-widgets = { path = "../../plugins/widgets", default-features = false, features = ["native-entry"] }
paperpaw-plugin-bluetooth = { path = "../../plugins/bluetooth", features = ["native-entry"] }
paperpaw-plugin-dictionary = { path = "../../plugins/dictionary", features = ["native-entry"] }
paperpaw-plugin-file-manager = { path = "../../plugins/file-manager", features = ["native-entry"] }
paperpaw-plugin-koreader = { path = "../../plugins/koreader", features = ["native-entry"] }
paperpaw-plugin-lock = { path = "../../plugins/lock", features = ["native-entry"] }
paperpaw-plugin-picture-home = { path = "../../plugins/picture-home", features = ["native-entry"] }
paperpaw-plugin-setup = { path = "../../plugins/setup", features = ["native-entry"] }
paperpaw-plugin-wikipedia = { path = "../../plugins/wikipedia", features = ["native-entry"] }
paperpaw-plugin-fonts-browser = { path = "../../plugins/fonts-browser", features = ["native-entry"] }

# As the firmware is built: small code, one unit, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Lines in the ELF, for naming the functions of a crash's calls.
debug = "line-tables-only"