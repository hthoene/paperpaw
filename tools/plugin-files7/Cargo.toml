[package]
name = "paperpaw-plugin-files7"
description = "PaperPaw's own interface-7 plugins as native plugin files of format 5 (abi/ppn5.md): built, packed and checked here for every plugin that has a native entry"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as tools/plugin-files is: the files must fit the
# firmware built in shells/xteink, with the same compiler and SDK.
[workspace]

