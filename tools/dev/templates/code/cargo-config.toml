# How the plugin is built for each chip: linked with `paperpaw-plugin7.x` (the copy beside
# `Cargo.toml`, as the PaperPaw release has it), its relocations kept for the packer.
# `paperpaw-dev build` runs these builds and packs the result; `cargo x4` and
# `cargo +esp x4pro` are the builds alone.
# Never set RUSTFLAGS: it would replace the flags below, which link the plugin.
[alias]
x4 = "build --release --target riscv32imc-unknown-none-elf"
x4pro = "build --release --target xtensa-esp32s3-none-elf"

[target.riscv32imc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tpaperpaw-plugin7.x",
    "-C", "link-arg=--emit-relocs",
    # Calls stay `auipc` and `jalr`, which the packer can patch where they reach across the
    # edge of hot code.
    "-C", "link-arg=--no-relax",
    "-C", "code-model=medium",
    "-C", "relocation-model=static",
    # No jump tables in the plugin's own code: the packer's stack frame scan refuses a table
    # it cannot read; with none, there is nothing to read.
    "-C", "jump-tables=no",
]

# The Xteink X4 Pro and X4 Classic (espup's `esp` toolchain, whose linker is gcc).
[target.xtensa-esp32s3-none-elf]
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-Wl,-Tpaperpaw-plugin7.x",
    "-C", "link-arg=-Wl,--emit-relocs",
    "-C", "jump-tables=no",
    # The SDK's entry for this chip is written in assembly.
    "-Z", "crate-attr=feature(asm_experimental_arch)",
]
