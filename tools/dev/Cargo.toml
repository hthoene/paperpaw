[package]
name = "paperpaw-dev"
description = "Checks PaperPaw plugins before they are published: galleries of every screen and widget, visual and text checks, flows, budgets and packaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "paperpaw-dev"
path = "src/main.rs"

[dependencies]
paperpaw-emulator = { path = "../../shells/desktop", default-features = false, features = ["native-linked"] }
paperpaw-core = { workspace = true, features = ["color", "outline", "testing", "bluetooth"] }
paperpaw-config.workspace = true
paperpaw-digest.workspace = true
paperpaw-fs.workspace = true
paperpaw-graphics = { workspace = true, features = ["color"] }
paperpaw-i18n.workspace = true
# The list a plugin with code keeps of what it calls (`metadata`).
paperpaw-json.workspace = true
paperpaw-native = { workspace = true, features = ["kernel"] }
paperpaw-platform.workspace = true
# The plugin store's rules and the check before publishing (`check-publish`).
paperpaw-publish.workspace = true
paperpaw-sdk.workspace = true
png = "0.18"

[lints]
workspace = true
