[package]
name = "paperpaw-fuzz"
description = "Fuzz targets for PaperPaw's parsers (cargo fuzz, nightly Rust)"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
paperpaw-sdk = { path = "../crates/paperpaw-sdk" }
paperpaw-config = { path = "../crates/paperpaw-config" }
paperpaw-fat = { path = "../crates/paperpaw-fat" }
paperpaw-platform = { path = "../crates/paperpaw-platform" }
paperpaw-http = { path = "../crates/paperpaw-http" }
paperpaw-hyphen = { path = "../crates/paperpaw-hyphen" }
paperpaw-i18n = { path = "../crates/paperpaw-i18n" }
paperpaw-image = { path = "../crates/paperpaw-image" }
paperpaw-json = { path = "../crates/paperpaw-json" }
paperpaw-sqlite = { path = "../crates/paperpaw-sqlite" }
paperpaw-stardict = { path = "../crates/paperpaw-stardict" }
paperpaw-text = { path = "../crates/paperpaw-text", features = ["outline"] }
paperpaw-zip = { path = "../crates/paperpaw-zip" }
paperpaw-plugin-format-epub = { path = "../plugins/format-epub" }
paperpaw-plugin-format-txt = { path = "../plugins/format-txt" }
paperpaw-plugin-format-xtc = { path = "../plugins/format-xtc" }
paperpaw-plugin-koreader = { path = "../plugins/koreader" }

# Not part of the main workspace.
[workspace]

# As the workspace patches them (the exFAT driver and the FAT file system
# of the card; see the root Cargo.toml).
[patch.crates-io]
hadris-fs = { path = "../patches/hadris-fs" }
hadris-fat = { path = "../patches/hadris-fat" }

[patch."https://github.com/rafalh/rust-fatfs"]
fatfs = { path = "../patches/fatfs" }

[[bin]]
name = "cbz"
path = "fuzz_targets/cbz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

