[messages]
gloss.plugin.name = Gloss
gloss.plugin.description = Small text above words: pronunciation or a short translation, from a word list.
gloss.plugin.how = "Gloss sets a small text above words of a book: how a word is read (furigana, pinyin, a pronunciation) or what it means in a word or two. It is meant for learning a language. It does nothing until you give it a word list.\n\nPut the list on the card as a plain text file (UTF-8) in the folder .paperpaw/plugins/gloss/. A line each: the word, a tab, the small text. Lines that start with # are comments. For example:\n\nHaus<tab>house\nwell-known<tab>bekannt\nHund<tab>dog\n\nName the file after the book without its extension to use it for that book only (faust.epub: faust.txt), or after the book's language to use it for every book in that language (de.txt, ja.txt). A book's own file wins. A word is found in any case, whole words only; for Japanese and Chinese the longest phrase of the list is used. A word listed twice keeps its first line.\n\nAt most 2,048 words of a list, 96 bytes of small text each and 24 KB of small text in all are used; a longer line is left out. The list is read once when you open the book, so turning pages reads nothing. Change the list and open the book again.\n\nSettings, under Reading, in the section Reading aids: Size of the small text (small, medium, large). The lines get the room above them that the small text needs. A paragraph shows the small text of its first 60 or so words. The book file itself is not changed."
gloss.setting.size = Size of the small text
gloss.setting.size.help = How large the text above the words is, in percent of the book text.
gloss.size.small = Small
gloss.size.medium = Medium
gloss.size.large = Large
