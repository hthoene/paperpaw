puzzles.plugin.name = Rätsel
puzzles.plugin.description = Sudoku, Kreuzworträtsel und Schachaufgaben, offline, mit einem Rätsel des Tages.
puzzles.plugin.how = "Rätsel für Zug und Wartezimmer, alles offline: Sudoku, Kreuzworträtsel und Schachaufgaben. Öffne Rätsel im Werkzeugmenü, oder füge das Widget Rätsel des Tages dem Startbildschirm hinzu (Startbildschirm gedrückt halten, dann Widget hinzufügen): Es zeigt, wie weit das heutige Sudoku ist, und ein Tipp öffnet es. Das Sudoku des Tages ist den ganzen Tag dasselbe.\n\nSudoku: Links und Rechts bewegen den Cursor Feld für Feld, Hoch und Runter (die Seitentasten) um eine Zeile. Auswahl öffnet die Ziffern: eine wählen und noch einmal Auswahl trägt sie ein, Löschen leert das Feld. Auswahl gedrückt halten (oder Menü) führt zu den Knöpfen unter dem Brett: Notizen macht aus den Ziffern Bleistiftmarken, Prüfen markiert falsche Felder, Zurück nimmt den letzten Zug zurück, Neu startet ein Rätsel der gewählten Stufe (Leicht, Mittel, Schwer). Jedes Rätsel hat genau eine Lösung. Das Spiel bleibt beim Verlassen erhalten. Auf einem Touchscreen tippst du ein Feld an.\n\nKreuzworträtsel: Lege .puz- (Across Lite) oder .ipuz-Dateien in den Ordner „puzzles“ auf der Speicherkarte; mitgeliefert wird keines. Bewege dich auf dem Gitter und wähle dann, um das Wort unter dem Cursor auf der Tastatur einzutippen (ein Unterstrich lässt ein Feld leer). Die Knöpfe wechseln zwischen waagerecht und senkrecht, zeigen die Liste der Hinweise, prüfen die Buchstaben und zeigen das Wort. Die Buchstaben bleiben für jede Datei erhalten. Verschlüsselte .puz-Dateien lassen sich nicht öffnen.\n\nSchachaufgaben: ein kleiner Satz aus der Lichess-Aufgabensammlung (CC0). Links und Rechts springen von Figur zu Figur, wähle die Figur, die du ziehen willst, dann mit Links und Rechts durch ihre Zielfelder und noch einmal Auswahl. Ein falscher Zug wird zurückgenommen. Tipp markiert die Figur, die ziehen soll, Weiter geht zur nächsten Aufgabe.\n\nDas Brett zeichnet nur die Felder neu, die sich ändern. Die Statistik zählt die gelösten Rätsel."
