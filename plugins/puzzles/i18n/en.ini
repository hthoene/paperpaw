[messages]
puzzles.plugin.name = Puzzles
puzzles.plugin.description = Sudoku, crosswords and chess puzzles, offline, with a puzzle of the day.
puzzles.plugin.how = "Puzzles for the train and the waiting room, all offline: sudoku, crosswords and chess puzzles. Open Puzzles from the tools menu, or add the widget Puzzle of the day to the home screen (hold the home screen, then add a widget): it shows how far today's sudoku is, and a tap opens it. The sudoku of the day is the same all day long.\n\nSudoku: left and right move the cursor square by square, up and down (the page buttons) by a row. Select opens the digits: pick one and select again to put it in, or Clear to empty the square. Hold Select (or Menu) to reach the buttons under the board: Notes turns the digits into pencil marks, Check marks wrong squares, Undo takes the last move back, New starts a puzzle of the level you choose (Easy, Medium, Hard). Every puzzle has exactly one solution. The game is kept when you leave. On a touch screen tap a square.\n\nCrosswords: put .puz (Across Lite) or .ipuz files into the folder \"puzzles\" on the memory card; none are included. Move on the grid, then select to type the word under the cursor on the keyboard (an underscore leaves a square empty). The buttons switch across and down, show the list of clues, check the letters and reveal the word. The letters are kept for each file. Scrambled .puz files cannot be opened.\n\nChess puzzles: a small set from the Lichess puzzle database (CC0). Left and right jump from piece to piece, select the piece you want to move, then left and right through where it may go, and select again. A wrong move is taken back. Hint marks the piece to move, Next goes to the next puzzle.\n\nThe board redraws only the squares that change. Statistics counts the puzzles you solved."
