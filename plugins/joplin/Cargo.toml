[package]
name = "paperpaw-plugin-joplin"
description = "PaperPaw Joplin: a book's exported highlights and notes kept as a note in Joplin"
version = "1.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native", "testdata"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true
paperpaw-xml.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-core.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
proptest.workspace = true

[lints]
workspace = true
