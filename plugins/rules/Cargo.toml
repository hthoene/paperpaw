[package]
name = "paperpaw-plugin-rules"
description = "PaperPaw rules: when something happens, do something (e.g. night mode at 22:00, sync catalogs at start)"
version = "1.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-native.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-platform.workspace = true

[lints]
workspace = true
