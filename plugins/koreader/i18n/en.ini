[messages]
koreader.plugin.name = Highlights sharing
koreader.plugin.description = Shares bookmarks and highlights with KOReader for books read in both.
koreader.plugin.how = "This plugin shares bookmarks and highlights with KOReader for books you read in both, on one device or in a library folder synced between devices. There is nothing to set up.\n\nWhen PaperPaw opens a book that KOReader has also opened, and when you change its bookmarks or highlights, it takes over what is new from KOReader's data beside the book and leaves what is new here for KOReader to pick up the next time it opens the book. Removed marks and changed notes go over too.\n\nThis works for EPUB books only. If one side's file cannot be read, nothing changes on either side until it can be."
# Asked in the book where KOReader's file, seen with highlights and bookmarks before, has none any more.
koreader.removed-there = KOReader's file has no highlights any more. Remove them here too?
koreader.removed-there.text = They may have been removed in KOReader, or its file came from another device. Keep leaves them here and gives them to KOReader again.
koreader.removed-there.remove = Remove
koreader.removed-there.keep = Keep
koreader.not-moved = KOReader's highlights of a moved book could not be moved with it: they stay in its old folder.
