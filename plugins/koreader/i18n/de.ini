[messages]
koreader.plugin.name = Markierungen teilen
koreader.plugin.description = Teilt Lesezeichen und Markierungen mit KOReader für Bücher, die in beiden gelesen werden.
koreader.plugin.how = "Dieses Plugin teilt Lesezeichen und Markierungen mit KOReader für Bücher, die du in beiden liest, auf einem Gerät oder in einem Bibliotheksordner, der zwischen Geräten synchronisiert wird. Einzurichten gibt es nichts.\n\nÖffnet PaperPaw ein Buch, das auch KOReader geöffnet hat, und änderst du dessen Lesezeichen oder Markierungen, übernimmt es das Neue aus den Daten von KOReader neben dem Buch und lässt das Neue von hier für KOReader da, das es beim nächsten Öffnen des Buchs aufnimmt. Entfernte Markierungen und geänderte Notizen gehen ebenfalls hinüber.\n\nDas gilt nur für EPUB-Bücher. Lässt sich die Datei einer Seite nicht lesen, ändert sich auf keiner Seite etwas, bis es wieder geht."
koreader.removed-there = Die Datei von KOReader hat keine Markierungen mehr. Auch hier entfernen?
koreader.removed-there.text = Sie wurden vielleicht in KOReader entfernt, oder die Datei kam von einem anderen Gerät. Behalten lässt sie hier und gibt sie KOReader wieder.
koreader.removed-there.remove = Entfernen
koreader.removed-there.keep = Behalten
koreader.not-moved = KOReaders Markierungen eines verschobenen Buchs ließen sich nicht mitverschieben: Sie bleiben in seinem alten Ordner.
