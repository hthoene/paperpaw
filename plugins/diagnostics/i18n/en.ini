[messages]
diagnostics.plugin.name = Diagnostics
diagnostics.plugin.description = A test screen and a guided check of every part of a device.
diagnostics.plugin.how = "Diagnostics is a test screen for checking a device: it shows every gray level the panel can display, four boxes to try the buttons and touch, and a page counter with a progress bar to compare the refresh modes.\n\nThe test screen has no menu entry. It is only the home screen while no other plugin offers one, or when you choose it under Screens in the plugin manager for the place Home screen.\n\nSelect marks the focused box, and the arrow buttons move between the boxes; with touch, tap a box. The page buttons turn the test pages. Hold Select, or hold a finger on the screen, to start over.\n\nThe device check, under Tools where PaperPaw is the device's firmware, goes through every part of a device one page at a time: the screen, buttons, touch, front light, battery, card, clock, Wi-Fi, sleep and memory. Each page ends with Fail, Skip and Pass, the answer its measurements suggest chosen; parts a device lacks are skipped. After each answer it writes a report to .paperpaw/plugins/diagnostics/device-check.txt, to paste into a pull request. Back leaves it, and it goes on where it was when opened again. On a device of buttons alone, choose Start on the buttons page first; until then the arrows, Select and Back work as on every page."
