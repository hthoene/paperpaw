[messages]
browser.plugin.name = Browser
browser.plugin.description = Reads web pages like books and fetches books and fonts from the web.
browser.plugin.how = "The browser opens web pages in the reader, which shows their text like a book, and fetches books and fonts. It needs a network connection. It is off at first: add it from the Plugin store, or switch it on under Plugins if it is listed there.\n\nOpen Browser from the Tools menu. The start screen offers Search or enter address, your bookmarks and the pages you read lately. Hold an entry (with buttons, hold Select) to open it, delete it or add it to the bookmarks. Links in a page lead to further pages, and Back returns to the page before.\n\nAn address that is an EPUB or a text file goes to the library, a font to the fonts folder (choose it after a restart), anything else to Downloads. The X4 and X4 Pro take no fonts this way: they get theirs from More fonts."
