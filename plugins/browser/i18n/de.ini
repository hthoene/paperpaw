[messages]
browser.plugin.name = Browser
browser.plugin.description = Liest Webseiten wie Bücher und holt Bücher und Schriften aus dem Netz.
browser.plugin.how = "Der Browser öffnet Webseiten im Leser, der ihren Text wie ein Buch zeigt, und holt Bücher und Schriften. Er braucht eine Netzwerkverbindung. Er ist anfangs aus: Füge ihn aus dem Plugin-Store hinzu, oder schalte ihn unter Plugins ein, wenn er dort steht.\n\nÖffne Browser im Menü Werkzeuge. Der Startbildschirm bietet Suchen oder Adresse eingeben, deine Lesezeichen und die zuletzt gelesenen Seiten. Einen Eintrag lange drücken (mit Tasten: Wählen halten) lässt dich ihn öffnen, löschen oder zu den Lesezeichen legen. Links in einer Seite führen zu weiteren Seiten, und Zurück geht zur Seite davor.\n\nEine Adresse, die ein EPUB oder eine Textdatei ist, landet in der Bibliothek, eine Schrift im Schriftenordner (nach einem Neustart wählbar), alles andere in Downloads. X4 und X4 Pro nehmen so keine Schriften an: Sie bekommen ihre von Mehr Schriften."
browser.title = Browser
