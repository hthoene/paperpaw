[messages]
format-epub-plus.plugin.name = EPUB: Bilderbücher und Mathe
format-epub-plus.plugin.description = EPUB mit festem Layout (Bilderbücher, Comics) Seite für Seite und Mathe-Formeln (MathML) als lesbarer Text.
format-epub-plus.plugin.how = "Ist dieses Plugin installiert, öffnet es deine EPUB-Bücher anstelle des eingebauten EPUB-Lesers und kann zwei Dinge mehr.\n\nBilderbücher und Comics als EPUB mit festem Layout (Seiten fester Größe, je ein Bild) erscheinen Seite für Seite, jedes Bild ganz auf seiner Seite, in der Reihenfolge und Richtung, die das Buch angibt. Ein Buch mit festem Layout und Text auf den Seiten öffnet sich wie ein normales Buch.\n\nMathe-Formeln in EPUB-Lehrbüchern (MathML) erscheinen als lesbarer Text: Brüche als a/b, Potenzen als x², Wurzeln als √(x), Summen mit ihren Grenzen. Eine Formel in einer eigenen Zeile steht als eigene, zentrierte Zeile.\n\nAlles andere funktioniert wie im eingebauten EPUB-Leser. Um EPUB-Bücher wieder mit dem eingebauten Leser zu lesen, entferne dieses Plugin oder wähle das Format in den Einstellungen unter Lesen."
format-epub-plus.title = EPUB-E-Book mit Bildern und Formeln
