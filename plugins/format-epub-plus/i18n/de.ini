[messages]
format-epub-plus.plugin.name = EPUB: Bilderbücher und Mathe
format-epub-plus.plugin.description = EPUB mit festem Layout (Bilderbücher, Comics) Seite für Seite und die Mathe-Formeln (MathML) von EPUB-Büchern als lesbarer Text.
format-epub-plus.plugin.how = "Ist dieses Plugin installiert, kann es zwei Dinge mehr mit deinen EPUB-Büchern. Jedes andere EPUB öffnet wie bisher im eingebauten EPUB-Leser.\n\nBilderbücher und Comics als EPUB mit festem Layout (Seiten fester Größe, je ein Bild) erscheinen Seite für Seite, jedes Bild ganz auf seiner Seite, in der Reihenfolge und Richtung, die das Buch angibt. Ein Buch mit festem Layout und Text auf den Seiten öffnet sich wie ein normales Buch.\n\nMathe-Formeln in EPUB-Lehrbüchern (MathML) erscheinen als lesbarer Text: Brüche als a/b, Potenzen als x², Wurzeln als sqrt(x), Summen mit ihren Grenzen. Eine Formel in einer eigenen Zeile steht als eigene, zentrierte Zeile. Der EPUB-Leser gibt jede Formel an dieses Plugin; ohne es steht eine Formel als einfacher Text ihrer Zeichen da.\n\nUm zurückzugehen, entferne dieses Plugin."
format-epub-plus.title = EPUB-E-Book mit Bildern und Formeln
