[messages]
format-epub-plus.plugin.name = EPUB: picture books and math
format-epub-plus.plugin.description = Fixed-layout EPUBs (picture books, comics) page by page, and the math formulas (MathML) of EPUB books as readable text.
format-epub-plus.plugin.how = "Once installed, this plugin adds two things to your EPUB books. Every other EPUB opens in the built-in EPUB reader as before.\n\nPicture books and comics made as fixed-layout EPUBs (pages of fixed size, one picture each) show page by page, each picture whole on its page, in the order and direction the book says. A fixed-layout book with text on its pages opens as a normal book.\n\nMath formulas in EPUB textbooks (MathML) read as plain text: fractions as a/b, powers as x², roots as sqrt(x), sums with their limits. A formula set on its own line stands as its own centered line. The EPUB reader hands each formula to this plugin; without it, a formula shows as the plain text of its symbols.\n\nTo go back, remove this plugin."
format-epub-plus.title = EPUB e-book with pictures and math
