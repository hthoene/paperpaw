[messages]
profiles.plugin.name = Leseprofile
profiles.plugin.description = Benannte Sätze von Lese- und Anzeige-Einstellungen, mit einem Tipp gewechselt.
profiles.plugin.how = "Ein Profil merkt sich deine Leseeinstellungen, Anzeige-Einstellungen und Statusleisten unter einem Namen, etwa Nacht oder Große Schrift, und stellt sie mit einem Tipp wieder her.\n\nProfile findest du im Lesemenü unter Weitere und in den Einstellungen unter Anpassen. Ein Profil antippen nutzt es, das aktive ist markiert. Lange drücken (mit Tasten: Wählen halten) speichert die aktuellen Einstellungen darin, benennt es um oder entfernt es. Als neues Profil speichern merkt sich, was gerade eingestellt ist.\n\nNächstes Profil wechselt zum folgenden in der Liste; leg es auf eine Taste oder in eine Regel."
