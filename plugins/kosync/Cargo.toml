[package]
name = "paperpaw-plugin-kosync"
description = "PaperPaw progress sync: reading positions shared with KOReader's sync server (kosync)"
version = "1.0.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-core = { workspace = true, features = ["native-reading"] }
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-native.workspace = true
paperpaw-platform.workspace = true
paperpaw-i18n.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-reader = { workspace = true, features = ["linked"] }
paperpaw-plugin-format-txt = { workspace = true, features = ["linked"] }
paperpaw-plugin-keyboard = { workspace = true, features = ["linked"] }
paperpaw-plugin-menu = { workspace = true, features = ["linked"] }

[lints]
workspace = true

[package.metadata.paperpaw]
card-files = ["i18n/*.ini"]
