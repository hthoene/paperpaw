[package]
name = "paperpaw-plugin-kosync"
description = "PaperPaw progress sync: reading positions shared with KOReader's sync server (kosync)"
version = "1.0.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-plugin-power.workspace = true
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-format-txt.workspace = true
proptest.workspace = true

[lints]
workspace = true
