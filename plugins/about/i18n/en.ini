[messages]
about.plugin.name = About
about.plugin.description = PaperPaw's version and licences.
about.plugin.how = "About shows which version of PaperPaw you have, where its source code is, and under which licences it comes.\n\nYou find it at the end of the Settings, as About PaperPaw. Choose a row with the arrow buttons and Select, or tap it. Plugins built into the firmware and, on devices that load plugins with code, the fingerprint such plugins must be built for are listed too.\n\nLicences opens as a text in the reader, so you page through it like a book. It carries PaperPaw's own licence and those of the fonts, icons and hyphenation patterns that come with it. Plugins can add a line of their own, such as a theme's author."
about.version.beta = {version} Beta {number}
about.title = About PaperPaw
about.intro = A free e-reader for e-ink devices, made of plugins. Licensed under the Apache License 2.0; what it bundles is licensed as follows.
about.plugins.title = Plugins built in
about.plugins.help = The plugins with code in this firmware, with their versions. An update brings the same ones again; one that cannot says so first.
