[messages]
about.plugin.name = Über
about.plugin.description = Version und Lizenzen von PaperPaw.
about.plugin.how = "Über zeigt dir, welche Version von PaperPaw du hast, wo der Quellcode liegt und unter welchen Lizenzen es steht.\n\nDu findest es am Ende der Einstellungen, als Über PaperPaw. Wähle eine Zeile mit den Pfeiltasten und Wählen, oder tippe sie an. Eingebaute Plugins und, auf Geräten, die Plugins mit Code laden, der Fingerabdruck, für den solche Plugins gebaut sein müssen, stehen ebenfalls dort.\n\nLizenzen öffnet sich als Text im Leser, du blätterst also wie in einem Buch. Er enthält die Lizenz von PaperPaw und die der Schriften, Symbole und Silbentrennmuster, die mitgeliefert werden. Plugins können eine eigene Zeile hinzufügen, etwa den Urheber eines Themes."
about.version.beta = {version} Beta {number}
about.title = Über PaperPaw
about.intro = Ein freier E-Reader für E-Ink-Geräte, aus Plugins gebaut. Lizenziert unter der Apache-Lizenz 2.0; was er mitbringt, steht unter den folgenden Lizenzen.
about.plugins.title = Eingebaute Plugins
about.plugins.help = Die Plugins mit Code in dieser Firmware, mit ihren Versionen. Ein Update bringt dieselben wieder mit; eines, das das nicht kann, sagt es vorher.
about.summary = Ein freier E-Reader für E-Ink-Geräte, aus Plugins gebaut.
