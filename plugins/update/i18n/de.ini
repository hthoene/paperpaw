[messages]
update.plugin.name = Update
update.plugin.description = Installiert Firmware-Updates, von der Karte oder aus dem Internet geladen.
update.plugin.how = "Update installiert neue Firmware, auf Geräten, deren Firmware PaperPaw selbst ist, etwa dem X4. Du findest es in den Einstellungen als Update.\n\nOnline suchen fragt den Update-Server nach einem neueren PaperPaw und lädt es herunter, einige Minuten über WLAN. Oder kopiere eine Update-Datei (.bin, von paperpaw.org) in den Ordner updates auf der Karte, etwa per WLAN-Übertragung. Installieren dauert dann etwa eine Minute, danach startet das Gerät neu; Bücher, Einstellungen und Lesepositionen bleiben.\n\nMit Nach Updates suchen (in den Einstellungen, anfangs aus) fragt das Gerät etwa einmal pro Woche von selbst, nur wenn WLAN ohnehin an ist oder es lädt. Ein neueres PaperPaw wartet dann hier; beim Lesen stört nichts. Eine Suche sendet, was auf dem Gerät läuft, keinen Namen und keine Nummer des Geräts; zum Zählen der Geräte auch, ob du gefragt hast und ob es seine erste Suche des Tages, der Woche oder des Monats ist.\n\nHat ein Plugin, das du nutzt, noch keine Version dafür, wartet das Update darauf. Eine ältere Version wird nur installiert, wenn du sie wählst.\n\nAuch eine andere Firmware, etwa CrossPoint, lässt sich hier installieren: Lege ihre Datei (.bin) in den Ordner updates und öffne Update. PaperPaw prüft, dass es eine vollständige, unbeschädigte Firmware für dieses Gerät ist, kann aber nicht sagen, wer sie gemacht hat, denn sie ist nicht signiert. Trotzdem installieren schreibt sie in die andere Hälfte des Speichers, und das Gerät startet sie; PaperPaw bleibt in seiner Hälfte, bis jene Firmware etwas darüber installiert. Zurück zu PaperPaw geht es später mit seiner Installationsdatei (paperpaw-<Gerät>-<Version>-install.bin) über das Menü der anderen Firmware, etwa CrossPoints SD-Firmware-Update."
