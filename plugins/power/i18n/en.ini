[messages]
power.plugin.name = Power
power.plugin.description = Chooses the power mode, by hand or by the battery: Normal, Saving, Offline.
power.plugin.how = "Power chooses how PaperPaw spends the battery: Normal, Saving or Offline. Saving does what can wait at better moments; Offline keeps the radio off. Auto chooses by the battery.\n\nChange the mode in the quick panel, where Power shows the modes side by side, or in Settings under Power. There you also set the levels where Auto switches to Saving and to Offline, and whether it stays Normal while charging.\n\nIn the status lines, Power mode shows a leaf while saving and a crossed-out Wi-Fi while offline, and nothing in Normal.\n\nHold the power button to open a small menu: Sleep, Switch off (where PaperPaw can), Restart, and on touch devices Lock touch or Unlock touch. A short press still puts the device to sleep. Back leaves the menu."
power.title = Power
power.setting.mode = Power mode
power.setting.mode.help = Saving puts off what can wait; Offline keeps the radio off.
