[messages]
power.plugin.name = Energie
power.plugin.description = Wählt den Energiemodus, von Hand oder nach dem Akku: Normal, Sparen, Offline.
power.plugin.how = "Energie bestimmt, wie PaperPaw mit dem Akku umgeht: Normal, Sparen, Offline oder Leistung. Sparen erledigt, was warten kann, zu günstigeren Zeitpunkten; Offline lässt den Funk aus; Leistung hält den Prozessor auf voller Geschwindigkeit, auf Kosten des Akkus. Auto wählt nach dem Akku, nie Leistung.\n\nDen Modus wechselst du im Schnellzugriff oder in den Einstellungen unter Energie. Dort legst du auch fest, bei welchem Stand Auto zu Sparen und zu Offline wechselt und ob es beim Laden Normal bleibt.\n\nIn den Statusleisten zeigt Energiemodus ein Blatt beim Sparen und ein durchgestrichenes WLAN, wenn Offline; in Normal zeigt es nichts.\n\nDie Ein/Aus-Taste gehalten öffnet ein kleines Menü: Schlafen, Ausschalten (wo PaperPaw das kann), Neu starten und auf Touch-Geräten Touch sperren oder entsperren. Kurz gedrückt schläft das Gerät wie bisher ein. Zurück verlässt das Menü."
power.title = Energie
