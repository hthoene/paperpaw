[package]
name = "paperpaw-plugin-store"
description = "PaperPaw plugin store: finds data plugins for this device in a plugin library and installs, updates and removes them"
version = "1.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
# Installs plugins: their authors' keys and code (kernel).
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-digest.workspace = true
paperpaw-fs.workspace = true
paperpaw-i18n.workspace = true
paperpaw-native.workspace = true
proptest.workspace = true
# The store's groups, kept in step with the site's rules (a test).
paperpaw-publish.workspace = true
paperpaw-platform.workspace = true
paperpaw-text.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true
