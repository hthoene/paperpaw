[messages]
readwise.plugin.name = Highlights export (cloud)
readwise.plugin.description = Sends highlights to Readwise.
readwise.plugin.how = "Highlights export (cloud) sends your highlights to Readwise, with their notes and their place in the book. It sends when you choose Export as Markdown at the end of a book's Bookmarks and highlights.\n\nThe first export asks for your Readwise access token (readwise.io/access_token); it is kept with the other Passwords and keys. Readwise keeps each highlight once, so exporting again sends only what is new.\n\nThe plugin is off at first: add it from the Plugin store, or switch it on under Plugins if it is listed there. Without a network, or if Readwise cannot be reached, the highlights wait and are sent later."
readwise.token = Readwise access token
readwise.needs-token = For Readwise, enter your access token (readwise.io/access_token).
# {count} is the number of highlights.
readwise.sent.one = {count} highlight sent to Readwise.
readwise.sent.other = {count} highlights sent to Readwise.
readwise.nothing = There are no highlights to send to Readwise.
readwise.bad-token = Readwise did not accept the token. The highlights wait; export again to enter it anew.
readwise.no-network = Sending to Readwise needs a network. The highlights wait and are sent later.
readwise.unreachable = Readwise cannot be reached. The highlights wait and are sent later.
readwise.failed = Not all highlights could be sent to Readwise. Those not sent wait and are sent later.
readwise.no-memory = There was not enough memory to send to Readwise. The highlights wait.
