[messages]
readwise.plugin.name = Markierungen exportieren (Cloud)
readwise.plugin.description = Schickt Markierungen an Readwise.
readwise.plugin.how = "Markierungen exportieren (Cloud) schickt deine Markierungen an Readwise, mit ihren Notizen und ihrer Stelle im Buch. Es sendet, wenn du am Ende von Lesezeichen und Markierungen eines Buchs Als Markdown exportieren wählst.\n\nBeim ersten Export fragt es nach deinem Zugangstoken (readwise.io/access_token); er wird mit den anderen Passwörtern und Schlüsseln aufbewahrt. Readwise behält jede Markierung nur einmal, ein weiterer Export schickt also nur Neues.\n\nDas Plugin ist anfangs aus: Füge es aus dem Plugin-Store hinzu, oder schalte es unter Plugins ein, wenn es dort steht. Ohne Netzwerk oder wenn Readwise nicht erreichbar ist, warten die Markierungen und werden später geschickt."
readwise.token = Readwise-Zugangstoken
readwise.needs-token = Für Readwise gib deinen Zugangstoken ein (readwise.io/access_token).
# {count} ist die Zahl der Markierungen.
readwise.sent.one = {count} Markierung an Readwise geschickt.
readwise.sent.other = {count} Markierungen an Readwise geschickt.
readwise.nothing = Es gibt keine Markierungen für Readwise.
readwise.bad-token = Readwise hat den Token nicht angenommen. Die Markierungen warten; exportiere erneut, um ihn neu einzugeben.
readwise.no-network = Für Readwise braucht es ein Netzwerk. Die Markierungen warten und werden später geschickt.
readwise.unreachable = Readwise ist nicht erreichbar. Die Markierungen warten und werden später geschickt.
readwise.failed = Nicht alle Markierungen konnten an Readwise geschickt werden. Die übrigen warten und werden später geschickt.
readwise.no-memory = Für Readwise reichte der Speicher nicht. Die Markierungen warten.
