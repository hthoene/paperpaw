[messages]
sleep.plugin.name = Sleep screen
sleep.plugin.description = Shows a sleeping cat, the book's cover, your pictures or a message while the device sleeps.
sleep.plugin.how = "The sleep screen decides what the screen shows while the device sleeps. E-ink keeps the picture without power.\n\nChoose it in the settings, under Device, Sleep screen, with Show: a sleeping cat (the default), the book's cover, my pictures, the logo and \"Sleeping\", widgets, the page as it is, or the page with a picture. My pictures shows the files of the Pictures folder one after the other.\n\nWithout a cover or a picture the cat shows. Where the system draws the sleep screen itself, these settings are hidden.\n\nThe off screen, Show when switched off, is drawn once as the device is switched off, from the power menu or after the time of Switch off after sleeping (not when a low battery cuts the power). It is as the sleep screen unless you choose the logo and \"Switched off\", the cat, the cover or my pictures. Another plugin can offer a screen for it.\n\nThe start and the restart screen, Show when starting and Show when restarting, are the device's own unless another plugin offers a screen for them. Plugins do not run yet while the device starts: the screen chosen for the start is drawn ahead, as the device switches off or restarts, and shown at the next start. A screen that is not ready in time, or a picture that is damaged, gives way to the device's own; the device switches off or restarts in any case.\n\nLight or dark, for each of the sleep, off, start and restart screens on its own: Sleep screen is, Off screen is, Start screen is and Restart screen is can be Like the device (the default, as night mode says), Light or Dark. A screen of another plugin follows them too. In dark the cat shows white on black. A cover or a picture of yours stays as it is, or is inverted, as Invert pictures says."
