sleep.plugin.name = Ruhebildschirm
sleep.plugin.description = Zeigt eine schlafende Katze, das Cover des Buchs, eigene Bilder oder eine Meldung, während das Gerät schläft.
sleep.plugin.how = "Der Ruhebildschirm bestimmt, was der Bildschirm zeigt, während das Gerät schläft. E-Ink hält das Bild ohne Strom.\n\nDu wählst es in den Einstellungen unter Gerät, Ruhebildschirm bei Zeigen: eine schlafende Katze (Standard), das Cover des Buchs, meine Bilder, das Logo und „Ruhezustand“, Widgets, die Seite, wie sie ist, oder die Seite mit einem Bild. Meine Bilder zeigt die Dateien des Bilderordners nacheinander.\n\nGibt es kein Cover oder Bild, erscheint die Katze. Wo das System den Ruhebildschirm selbst zeichnet, sind diese Einstellungen verborgen."
