# The sleep screen (the cat) on the X4 (480x800) as its light or dark look says (#420), whatever night mode says:
#   paperpaw-dev snapshots --plugin sleep --snapshots plugins/sleep/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-like-the-device]
profile = xteink-x4
script = run:core.sleep

[x4-sleep-like-the-device-at-night]
profile = xteink-x4
core.night-mode = true
script = run:core.sleep

[x4-sleep-light-at-night]
profile = xteink-x4
core.night-mode = true
sleep.look = sleep.look.light
script = run:core.sleep

[x4-sleep-dark]
profile = xteink-x4
sleep.look = sleep.look.dark
script = run:core.sleep
