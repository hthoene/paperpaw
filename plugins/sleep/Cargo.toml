[package]
name = "paperpaw-plugin-sleep"
description = "PaperPaw sleep screen: the book's cover, own pictures or a message while the device sleeps"
version = "1.0.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native", "pictures", "testdata"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the table of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[package.metadata.paperpaw]
# Large files embedded on purpose (`paperpaw-dev package` says nothing of them).
embedded-assets = "built into the firmware: the sleeping cat is drawn on the way to sleep, before any installed file could be read, and the firmware has room for it"

[lints]
workspace = true
