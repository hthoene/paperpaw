[messages]
keys.plugin.name = Buttons and gestures
keys.plugin.description = What every button, tap zone and swipe does, changed on the device.
keys.plugin.how = "Buttons and gestures shows what every button, tap zone and swipe does, and lets you change it on the device.\n\nOpen it in the settings, under Device. First choose where a change applies: Everywhere, While reading, On the home screen, In the library or in one tool. Then pick an input, such as a held button or a swipe in from an edge, and choose an action from the list, which you can search. As standard gives back what the plugins and the button layout set.\n\nOn the X4, a change that would leave no button to select, go back or move on with is refused. Reset buttons and gestures at the end takes back every change."
