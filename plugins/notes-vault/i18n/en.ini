notes-vault.plugin.name = Notes vault
notes-vault.plugin.description = Reads a folder of Markdown notes by folders, tags and latest changes, with widgets for the home screen. Works with Obsidian vaults.
notes-vault.plugin.how = "Notes vault reads a folder of Markdown notes (plain .md files, as notes apps keep them). It works with Obsidian vaults.\n\nChoose the vault's folder in the settings, or on the vault's page in the tools. The page then offers the folders as they are on the card, the notes changed last, the tags, and a search in the notes' titles.\n\nThe first time, the vault is indexed in the background while its page is open; a vault of thousands of notes takes a few minutes, then opens at once. The index is kept on the card and made again when the vault's page opens after some hours, or when you choose Update.\n\nA note opens in the reader. Links to other notes ([[Note]], [[Note|words]], [[Note#Heading]]) are found by the note's name anywhere in the vault; following one opens that note, and Back returns to the note before.\n\nNothing in the vault is ever changed. The widgets for the home screen (recent notes, a pinned note, a note of the day, a random note, tags, search) are added in the home screen's editor. A widget can take its notes from one folder only: write the folder's path from the card's root (for example Notes/Work) in the widget's settings; left empty, it takes all notes of the vault."
