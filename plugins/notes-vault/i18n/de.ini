notes-vault.plugin.name = Notizen-Tresor
notes-vault.plugin.description = Liest einen Ordner mit Markdown-Notizen nach Ordnern, Tags und letzten Änderungen, mit Widgets für den Startbildschirm. Funktioniert mit Obsidian-Tresoren.
notes-vault.plugin.how = "Notizen-Tresor liest einen Ordner mit Markdown-Notizen (einfache .md-Dateien, wie Notiz-Apps sie ablegen). Er funktioniert mit Obsidian-Tresoren.\n\nWähle den Ordner des Tresors in den Einstellungen oder auf der Seite des Tresors bei den Werkzeugen. Die Seite zeigt dann die Ordner, wie sie auf der Karte liegen, die zuletzt geänderten Notizen, die Tags und eine Suche in den Titeln der Notizen.\n\nBeim ersten Mal wird der Tresor im Hintergrund erfasst, solange seine Seite offen ist; bei Tausenden Notizen dauert das einige Minuten, danach öffnet er sofort. Das Verzeichnis liegt auf der Karte und wird neu erstellt, wenn die Seite nach einigen Stunden geöffnet wird oder wenn du „Aktualisieren“ wählst.\n\nEine Notiz öffnet sich im Leser. Verweise auf andere Notizen ([[Notiz]], [[Notiz|Wörter]], [[Notiz#Überschrift]]) werden über den Namen der Notiz irgendwo im Tresor gefunden; ein Verweis öffnet diese Notiz, und „Zurück“ führt zur vorherigen Notiz.\n\nNichts im Tresor wird je verändert. Die Widgets für den Startbildschirm (letzte Notizen, eine angeheftete Notiz, Notiz des Tages, zufällige Notiz, Tags, Suche) fügst du im Editor des Startbildschirms hinzu. Ein Widget kann seine Notizen aus einem einzigen Ordner nehmen: Schreibe den Pfad des Ordners von der Wurzel der Karte (zum Beispiel Notizen/Arbeit) in die Einstellungen des Widgets; bleibt das Feld leer, nimmt es alle Notizen des Tresors."
