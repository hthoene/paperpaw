[package]
name = "paperpaw-plugin-notes-vault"
description = "PaperPaw notes vault: reads a folder of Markdown notes (works with Obsidian vaults) by folders, tags and recent changes, with home widgets"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-epub-family.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-ui-kit.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-files.workspace = true
paperpaw-plugin-home.workspace = true
paperpaw-plugin-reader.workspace = true

[lints]
workspace = true
