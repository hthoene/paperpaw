[package]
name = "paperpaw-plugin-reader"
description = "PaperPaw paged reader: page layout, progress, background pagination"
version = "1.0.11"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "stages", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk = { workspace = true, features = ["unstable"] }
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk = { workspace = true, features = ["unstable", "kernel"] }

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-platform.workspace = true
paperpaw-epub-family.workspace = true
paperpaw-plugin-format-txt.workspace = true
# Its Markdown (wikilinks) for the tests of links to other notes.
# By path alone, with no version: the vault needs the reader, and a
# dev-dependency with a version cannot be published before it.
paperpaw-plugin-notes-vault = { path = "../notes-vault" }
# aids' own encoder and filter: the reader's `native_filter` is pinned to them.
# By path alone, as the vault above.
paperpaw-plugin-aids = { path = "../aids" }
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs", "outline"] }
paperpaw-zip = { workspace = true, features = ["testing"] }
# Scalable fonts, as Android and the emulator have them: a book's own
# fonts draw at any size, and drop capitals are set.
paperpaw-sdk = { workspace = true, features = ["unstable", "outline"] }
paperpaw-text.workspace = true
proptest.workspace = true

[lints]
workspace = true
