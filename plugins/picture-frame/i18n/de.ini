[meta]
language = de
name = Deutsch
plural = one-other

[messages]
picture-frame.plugin.name = Bilderrahmen
picture-frame.plugin.description = Deine eigenen Fotos als Ruhebildschirm, als Diashow und als Foto des Tages, von der Karte oder von deinem Foto-Server.
picture-frame.title = Bilderrahmen
picture-frame.open = Bilderrahmen
picture-frame.slideshow = Diashow
picture-frame.sync = Fotos vom Server holen
picture-frame.sleep = Foto aus dem Bilderrahmen
picture-frame.widget = Foto des Tages
picture-frame.setting.folder = Fotoordner
picture-frame.setting.folder.help = Der Ordner auf der Karte mit deinen Fotos (JPEG oder PNG). Die ersten 512 nach Namen werden genutzt.
picture-frame.setting.change = Foto wechseln
picture-frame.setting.change.help = Ob der Ruhebildschirm bei jedem Ruhezustand das nächste Foto zeigt oder jeden Tag ein neues. Wähle unter Ruhezustand, Anzeige „Foto aus dem Bilderrahmen“.
picture-frame.change.sleep = Bei jedem Ruhezustand
picture-frame.change.daily = Täglich
picture-frame.setting.fit = An den Bildschirm anpassen
picture-frame.setting.fit.help = Ganz zeigt das ganze Foto mit weißem Rand. Füllen schneidet es auf den Bildschirm zu. Automatisch füllt, wenn die Form der des Bildschirms nahekommt, und zeigt sonst das ganze Foto.
picture-frame.fit.auto = Automatisch
picture-frame.fit.whole = Ganzes Foto
picture-frame.fit.fill = Bildschirm füllen
picture-frame.setting.contrast = Kontrast
picture-frame.setting.contrast.help = Mehr Kontrast macht Fotos auf E-Ink klarer, weniger hält sie weich.
picture-frame.setting.interval = Diashow-Intervall
picture-frame.setting.interval.help = Wie lange jedes Foto bleibt, solange der Reader am Strom hängt. Ohne Strom geht die Diashow mit den Tasten oder per Wischen weiter.
picture-frame.setting.slideshow-on-charge = Diashow am Ladegerät
picture-frame.setting.slideshow-on-charge.help = Öffnet die Diashow, wenn du das Ladegerät ansteckst.
picture-frame.setting.sync = Vom Server holen
picture-frame.setting.sync.help = Nur auf Wunsch, auch wenn das Ladegerät angesteckt wird (höchstens alle sechs Stunden) oder auch, wenn WLAN ohnehin an ist (höchstens täglich). Das Aufwecken schaltet für ein Foto nie das WLAN ein.
picture-frame.sync.manual = Auf Wunsch
picture-frame.sync.charging = Mit dem Ladegerät
picture-frame.sync.online = Mit dem Ladegerät und online
picture-frame.setting.cache = Server-Fotos auf der Karte
picture-frame.setting.cache.help = Das Meiste, was die vom Server geholten Fotos auf der Karte belegen. Hat der Server mehr, bringt jedes Holen die nächsten.
picture-frame.unit.mb.other = {count} MB
picture-frame.setting.server = Foto-Server
picture-frame.setting.server.help = Die Adresse eines WebDAV-Ordners mit Fotos, zum Beispiel https://cloud.example.org/remote.php/dav/files/ich/Fotos
picture-frame.setting.user = Benutzer
picture-frame.setting.user.help = Der Benutzername für den Foto-Server. Leer: kein Konto.
picture-frame.password = Passwort
picture-frame.secret.password = Passwort des Foto-Servers
# {count} is a number of photos.
picture-frame.count.one = {count} Foto
picture-frame.count.other = {count} Fotos
picture-frame.help = Deine Fotos aus dem Kartenordner und vom Server: Die Diashow zeigt sie nacheinander; den Ruhebildschirm wählst du unter Ruhezustand, Anzeige.
picture-frame.none = Noch keine Fotos. Lege JPEG- oder PNG-Fotos in {folder} auf der Karte ab oder hole sie von deinem Server.
picture-frame.loading = Foto wird geladen …
picture-frame.widget.none = Noch keine Fotos
picture-frame.syncing = Fotos werden geholt …
# {fetched} is a number of photos fetched now, {cached} how many are on the card, {photos} how many the server has.
picture-frame.synced = Fotos geholt: {fetched}. Auf der Karte: {cached} von {photos}.
picture-frame.empty-server = Der Server-Ordner enthält keine Fotos.
picture-frame.no-server = Gib zuerst die Adresse des Foto-Servers ein.
picture-frame.bad-url = Die Adresse muss mit http:// oder https:// beginnen.
picture-frame.no-network = Der Server ist nicht erreichbar. Prüfe die Adresse und das Netzwerk.
picture-frame.denied = Der Server hat Benutzername oder Passwort nicht angenommen.
picture-frame.not-found = Der Ordner wurde auf dem Server nicht gefunden.
picture-frame.full = Die Karte ist voll.
picture-frame.cancelled = Das Holen wurde abgebrochen.
picture-frame.failed = Der Server hat seine Fotos nicht herausgegeben. Prüfe die Adresse.
picture-frame.not-kept = Das Passwort konnte nicht gespeichert werden.
