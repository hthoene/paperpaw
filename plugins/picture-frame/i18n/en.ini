[messages]
picture-frame.plugin.name = Picture frame
picture-frame.plugin.description = Your own photos as the sleep screen, as a slideshow and as the photo of the day, from the card or your photo server.
picture-frame.plugin.how = "Picture frame shows your own photos: as the sleep screen, as a slideshow and as the widget \"Photo of the day\" for Home. It is off at first: add it from the Plugin store.\n\nPhotos from the card: put JPEG or PNG photos into the folder named under Photos folder (/photos at first). The first 512 by name are used. Under Sleep, Show choose \"Photo from the Picture frame\": the sleep screen then shows the next photo at each sleep, or a new one each day (Change the photo). Fit to the screen and Contrast say how a photo is made for the e-ink panel; the panel shows it in its grays at once. Photos are decoded by PaperPaw in strips, so a large photo does not need much memory; pictures above about 8 megapixels are skipped.\n\nSlideshow: open it from Tools. While the reader is plugged in it moves on after the Slideshow interval; without power use the buttons, or swipe, or tap the left or right of the screen. Slideshow when plugged in opens it as soon as the charger is connected. Photo of the day: add the widget to Home (Edit home screen, Add); it shows one photo a day.\n\nPhotos from your server: enter the address of a WebDAV folder (Nextcloud, ownCloud, a NAS, and others), the user and the password on the Picture frame screen. The password is kept among the passwords and keys. Fetch photos from the server copies the photos of that folder to the card, within the size set under Server photos on the card; if the server has more, each fetch brings the next ones. Fetching only happens when you ask, when the charger is plugged in (at most every six hours) or, if you choose so, when Wi-Fi is on anyway (at most daily). Waking the reader never turns Wi-Fi on for a photo."
