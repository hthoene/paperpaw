[meta]
language = en
name = English
plural = one-other

[messages]
picture-frame.plugin.name = Picture frame
picture-frame.plugin.description = Your own photos as the sleep screen, as a slideshow and as the photo of the day, from the card or your photo server.
picture-frame.title = Picture frame
picture-frame.open = Picture frame
picture-frame.slideshow = Slideshow
picture-frame.sync = Fetch photos from the server
picture-frame.sleep = Photo from the Picture frame
picture-frame.widget = Photo of the day
picture-frame.setting.folder = Photos folder
picture-frame.setting.folder.help = The folder on the card with your photos (JPEG or PNG). The first 512 by name are used.
picture-frame.setting.change = Change the photo
picture-frame.setting.change.help = Whether the sleep screen shows the next photo at each sleep or a new one each day. Choose "Photo from the Picture frame" under Sleep, Show.
picture-frame.change.sleep = At each sleep
picture-frame.change.daily = Daily
picture-frame.setting.fit = Fit to the screen
picture-frame.setting.fit.help = Whole shows the entire photo with a white edge. Fill crops it to the screen. Automatic fills where the shape is close to the screen's and shows the whole photo where it is not.
picture-frame.fit.auto = Automatic
picture-frame.fit.whole = Whole photo
picture-frame.fit.fill = Fill the screen
picture-frame.setting.contrast = Contrast
picture-frame.setting.contrast.help = More contrast makes photos clearer on e-ink; less keeps them soft.
picture-frame.setting.interval = Slideshow interval
picture-frame.setting.interval.help = How long each photo stays while the reader is plugged in. Without power the slideshow goes on with the buttons or a swipe.
picture-frame.setting.slideshow-on-charge = Slideshow when plugged in
picture-frame.setting.slideshow-on-charge.help = Opens the slideshow when you plug in the charger.
picture-frame.setting.sync = Fetch from the server
picture-frame.setting.sync.help = Only on request, also when the charger is plugged in (at most every six hours), or also when Wi-Fi is on anyway (at most daily). Waking the reader never turns Wi-Fi on for a photo.
picture-frame.sync.manual = On request
picture-frame.sync.charging = With the charger
picture-frame.sync.online = With the charger and when online
picture-frame.setting.cache = Server photos on the card
picture-frame.setting.cache.help = The most the photos fetched from the server take on the card. If the server has more, each fetch brings the next ones.
picture-frame.unit.mb.other = {count} MB
picture-frame.setting.server = Photo server
picture-frame.setting.server.help = The address of a WebDAV folder with photos, for example https://cloud.example.org/remote.php/dav/files/me/Photos
picture-frame.setting.user = User
picture-frame.setting.user.help = The user name for the photo server. Empty: no account.
picture-frame.password = Password
picture-frame.secret.password = Photo server password
# {count} is a number of photos.
picture-frame.count.one = {count} photo
picture-frame.count.other = {count} photos
picture-frame.help = Your photos from the card folder and the server: Slideshow shows them one after the other; choose the sleep screen under Sleep, Show.
picture-frame.none = No photos yet. Put JPEG or PNG photos into {folder} on the card, or fetch them from your server.
picture-frame.loading = Loading the photo …
picture-frame.widget.none = No photos yet
picture-frame.syncing = Fetching photos …
# {fetched} is a number of photos fetched now, {cached} how many are on the card, {photos} how many the server has.
picture-frame.synced = Photos fetched: {fetched}. On the card: {cached} of {photos}.
picture-frame.empty-server = The server folder has no photos.
picture-frame.no-server = Enter the address of the photo server first.
picture-frame.bad-url = The address must start with http:// or https://.
picture-frame.no-network = The server cannot be reached. Check the address and the network.
picture-frame.denied = The server did not accept the user name or password.
picture-frame.not-found = The folder was not found on the server.
picture-frame.full = The card is full.
picture-frame.cancelled = Fetching was stopped.
picture-frame.failed = The server did not give its photos. Check the address.
picture-frame.not-kept = The password could not be kept.
