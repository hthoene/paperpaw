tasks.plugin.name = Tasks
tasks.plugin.description = To-do lists with due dates and priorities, on the reader or synced with your CalDAV server, with home screen widgets.
tasks.plugin.how = "To-do lists on your reader: tasks with a due date and a priority, ticked off when they are done. They work with no setup and no network, and can be kept in step with a CalDAV server (Nextcloud, Radicale, Baïkal, Fastmail and others), so the same lists are on your phone and your computer.\n\nOpen Tasks from the tools menu. The first row names the list shown; choose it for another list, for Today and overdue across all lists, for a new list, to sync, or to set the account. Add a task opens the keyboard. Select on a task ticks it off (again: not done). Hold a task or press Menu to change its title, its due date (today, tomorrow, in a week, or a date you type such as 2026-12-24) or its priority, or to remove it. Open tasks come first, by their day and then by priority; done ones stay at the end for a week (set under Tasks in the settings), then they leave the reader.\n\nWidgets for the home screen (hold the home screen, then add a widget): Tasks today shows what is due today or overdue, Task list shows one list, Open tasks counts them, and Next task shows the one to do next. A tap on a task in a widget ticks it off; a tap on a heading opens the lists.\n\nTo sync, choose CalDAV account from the list row and enter the server's address, your user name and a password (best an app password). The address of the server is enough, e.g. cloud.example.com/remote.php/dav; the reader finds your task lists from there. Every task list of the server becomes a list on the reader. The reader syncs when you open Tasks, when you choose Sync now, and when the network is on anyway; what you change without a network waits and is sent later. If a task was changed on the reader and somewhere else meanwhile, the server's version is taken and yours is kept as a new task beside it, so nothing is lost. Notes, alarms and everything else a task has on the server stay as they are. Tasks that repeat are shown but changed where you made them. The reader holds up to 200 tasks in 12 lists.\n\nThe sleep screen can show what is due, in groups (overdue, today, this week): choose Tasks under Sleep screen in the settings."
