tasks.plugin.name = Aufgaben
tasks.plugin.description = Aufgabenlisten mit Fälligkeit und Priorität, auf dem Reader oder abgeglichen mit deinem CalDAV-Server, mit Widgets für den Startbildschirm.
tasks.plugin.how = "Aufgabenlisten auf deinem Reader: Aufgaben mit Fälligkeit und Priorität, die du abhakst, wenn sie erledigt sind. Sie brauchen keine Einrichtung und kein Netz und lassen sich mit einem CalDAV-Server abgleichen (Nextcloud, Radicale, Baïkal, Fastmail und andere), sodass dieselben Listen auf Handy und Rechner liegen.\n\nÖffne Aufgaben im Werkzeugmenü. Die erste Zeile nennt die gezeigte Liste; wähle sie für eine andere Liste, für „Heute und überfällig“ über alle Listen, für eine neue Liste, zum Abgleichen oder für das Konto. „Aufgabe hinzufügen“ öffnet die Tastatur. Auswählen hakt eine Aufgabe ab (noch einmal: nicht erledigt). Halte eine Aufgabe gedrückt oder drücke Menü, um Titel, Fälligkeit (heute, morgen, in einer Woche oder ein eingegebenes Datum wie 24.12.2026) oder Priorität zu ändern oder sie zu entfernen. Offene Aufgaben stehen zuerst, nach Tag und dann nach Priorität; erledigte bleiben eine Woche am Ende stehen (einstellbar unter Aufgaben in den Einstellungen) und verlassen dann den Reader.\n\nWidgets für den Startbildschirm (Startbildschirm gedrückt halten, dann Widget hinzufügen): „Aufgaben heute“ zeigt, was heute fällig oder überfällig ist, „Aufgabenliste“ zeigt eine Liste, „Offene Aufgaben“ zählt sie, und „Nächste Aufgabe“ zeigt die, die als Nächstes ansteht. Ein Tipp auf eine Aufgabe im Widget hakt sie ab; ein Tipp auf eine Überschrift öffnet die Listen.\n\nZum Abgleichen wähle in der Listenzeile „CalDAV-Konto“ und trage die Adresse des Servers, deinen Benutzernamen und ein Passwort ein (am besten ein App-Passwort). Die Adresse des Servers genügt, z. B. cloud.example.com/remote.php/dav; der Reader findet deine Aufgabenlisten von dort. Jede Aufgabenliste des Servers wird eine Liste auf dem Reader. Der Reader gleicht ab, wenn du Aufgaben öffnest, wenn du „Jetzt abgleichen“ wählst und wenn das Netz ohnehin an ist; was du ohne Netz änderst, wartet und wird später gesendet. Wurde eine Aufgabe inzwischen auf dem Reader und anderswo geändert, gilt die Fassung des Servers, und deine bleibt als neue Aufgabe daneben erhalten, damit nichts verloren geht. Notizen, Erinnerungen und alles andere, was eine Aufgabe auf dem Server hat, bleiben unverändert. Wiederkehrende Aufgaben werden gezeigt, aber dort geändert, wo du sie angelegt hast. Der Reader fasst bis zu 200 Aufgaben in 12 Listen.\n\nDer Ruhebildschirm kann zeigen, was fällig ist, nach Gruppen (überfällig, heute, diese Woche): wähle Aufgaben unter Ruhebildschirm in den Einstellungen."
