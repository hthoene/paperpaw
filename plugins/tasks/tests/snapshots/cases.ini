# The sleep screen of tasks on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin tasks --snapshots plugins/tasks/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = tasks.sleep
profile = xteink-x4
plugins.tasks = on
core.language = en
file = .paperpaw/plugins/tasks/tasks.txt <- tasks.txt

[x4-sleep-de]
screen = tasks.sleep
profile = xteink-x4
plugins.tasks = on
core.language = de
file = .paperpaw/plugins/tasks/tasks.txt <- tasks.txt
