[package]
name = "paperpaw-plugin-tasks"
description = "PaperPaw Tasks: to-do lists with due dates and priorities, kept on the reader or synced with a CalDAV server, with home screen widgets"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true
paperpaw-caldav.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true

[package.metadata.paperpaw]
card-files = ["i18n/*.ini"]
