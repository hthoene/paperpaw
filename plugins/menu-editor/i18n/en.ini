[messages]
menu-editor.plugin.name = Menu editor
menu-editor.plugin.description = Reorders, removes and adds the entries of every menu.
menu-editor.plugin.how = "The menu editor changes what the menus contain: move entries up or down, remove them, or add new ones.\n\nFind it in Settings under Customise, as Customise menus. Choose a menu, then an entry to move or remove it; Add an entry puts in a new one. Changes apply at once. Reset this menu returns a menu to how its plugins define it, Reset all menus does so for every one.\n\nYou cannot lock yourself out: an entry that is the way to the settings stays until you add another way to them."
menu-editor.title = Customise menus
menu-editor.changed = Changed
menu-editor.reset-all = Reset all menus
menu-editor.add = Add an entry
menu-editor.hidden-by = Taken out by {plugin}
menu-editor.reset = Reset this menu
menu-editor.up = Move up
menu-editor.down = Move down
menu-editor.remove = Remove
menu-editor.cancel = Cancel
menu-editor.locked = This entry is the way to the settings here and stays. Add another way first (e.g. Settings itself), then it can go.
menu-editor.not-saved = The change could not be saved. The menu stays as it was.
