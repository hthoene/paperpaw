[messages]
menu-editor.plugin.name = Menü-Editor
menu-editor.plugin.description = Ordnet, entfernt und ergänzt die Einträge aller Menüs.
menu-editor.plugin.how = "Der Menü-Editor ändert, was in den Menüs steht: Einträge nach oben oder unten schieben, entfernen oder neue hinzufügen.\n\nDu findest ihn in den Einstellungen unter Anpassen, als Menüs anpassen. Wähle ein Menü und dann einen Eintrag, um ihn zu verschieben oder zu entfernen; Eintrag hinzufügen ergänzt einen neuen. Änderungen gelten sofort. Dieses Menü zurücksetzen stellt ein Menü so her, wie seine Plugins es festlegen, Alle Menüs zurücksetzen tut das für alle.\n\nAussperren kannst du dich nicht: Ein Eintrag, der zu den Einstellungen führt, bleibt, bis du einen anderen Weg dorthin hinzugefügt hast."
menu-editor.title = Menüs anpassen
menu-editor.changed = Geändert
menu-editor.reset-all = Alle Menüs zurücksetzen
menu-editor.add = Eintrag hinzufügen
menu-editor.hidden-by = Entfernt von {plugin}
menu-editor.reset = Dieses Menü zurücksetzen
menu-editor.up = Nach oben
menu-editor.down = Nach unten
menu-editor.remove = Entfernen
menu-editor.cancel = Abbrechen
menu-editor.locked = Über diesen Eintrag erreichst du hier die Einstellungen, darum bleibt er. Füge zuerst einen anderen Weg hinzu (z. B. „Einstellungen“ selbst), dann lässt er sich entfernen.
menu-editor.not-saved = Die Änderung konnte nicht gespeichert werden. Das Menü bleibt, wie es war.
