[messages]
format-txt.plugin.name = Reiner Text
format-txt.plugin.description = Öffnet einfache Textdateien (.txt).
format-txt.plugin.how = "Einfache Textdateien (.txt) öffnen sich aus der Bibliothek wie jedes Buch, ganz ohne Einrichtung. Das Plugin liest UTF-8, UTF-16 und Windows-1252 und erkennt die Kodierung selbst.\n\nAbsätze folgen den Leerzeilen der Datei; hat eine Datei keine, ist jede Zeile ein Absatz. Bei Dateien von Project Gutenberg bleibt der Lizenztext am Anfang und am Ende weg, und Titel und Autor stammen aus dem Kopf der Datei.\n\nDie Datei wird nie ganz geladen, daher öffnen sich auch sehr große Texte auf kleinen Geräten."
format-txt.title = Text
