[messages]
translate.plugin.name = Translation
translate.plugin.description = Translates selected text online, with DeepL.
translate.plugin.how = "Translation translates selected text online with DeepL. Select text in a book and choose Translate in the menu of the selected text: the translation appears over the page like a dictionary entry. Page buttons or taps scroll it, and Select or a tap at its end closes it.\n\nIt needs a network and a DeepL API key of your own, free at deepl.com (DeepL API Free, about 500,000 characters a month). Until you enter it, the panel says so, and a tap asks for it.\n\nIn the settings, under Reading, in the section Translation, Translate into sets the language; at first it is PaperPaw's own."
