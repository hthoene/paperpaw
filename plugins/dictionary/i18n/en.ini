[messages]
dictionary.plugin.name = Dictionary
dictionary.plugin.description = Looks up words in StarDict dictionaries.
dictionary.plugin.how = "The dictionary looks up a word from a book in StarDict dictionaries and shows the definitions in a panel over the lower part of the screen.\n\nIn the reader, hold a word and choose Look up; with buttons, use Select text under More. Copy the dictionary folders (with .ifo, .idx and .dict files) into the folder \"dictionaries\" on the device, subfolders included, or choose another folder in Settings, under Reading, as Dictionary folder (an advanced setting). The first lookup prepares a small index for each dictionary, which takes a moment.\n\nIn the panel, the page buttons or Up and Down scroll long definitions, and Back closes it. With touch, tap outside it to close."
