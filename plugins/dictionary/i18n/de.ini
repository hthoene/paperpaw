[messages]
dictionary.plugin.name = Wörterbuch
dictionary.plugin.description = Schlägt Wörter in StarDict-Wörterbüchern nach.
dictionary.plugin.how = "Das Wörterbuch schlägt ein Wort aus einem Buch in StarDict-Wörterbüchern nach und zeigt die Erklärungen in einem Feld über dem unteren Teil des Bildschirms.\n\nIm Leser hältst du ein Wort gedrückt und wählst Nachschlagen; mit Tasten nimmst du Text auswählen unter Weitere. Kopiere die Wörterbuchordner (mit .ifo-, .idx- und .dict-Dateien) in den Ordner \"dictionaries\" auf dem Gerät, auch Unterordner gehen, oder wähle einen anderen Ordner in den Einstellungen unter Lesen bei Wörterbuchordner (eine erweiterte Einstellung). Beim ersten Nachschlagen wird für jedes Wörterbuch ein kleiner Index angelegt, das dauert einen Moment.\n\nIm Feld scrollen die Seitentasten oder Hoch und Runter lange Erklärungen, Zurück schließt es. Mit Touch tippst du außerhalb, um es zu schließen."
