[messages]
menu.plugin.name = Menü
menu.plugin.description = Das Menü am unteren Bildschirmrand, mit Aktionen und Einstellungen.
menu.plugin.how = "Das Menü zeigt, was du tun und einstellen kannst. Es öffnet sich am unteren Bildschirmrand über dem, was gerade offen ist: beim Lesen mit einem Tipp in die Mitte des Bildschirms oder mit Wählen. Einen Eintrag antippen oder wählen führt ihn aus.\n\nEinstellungen im Menü zeigen ihren Wert und ändern sich an Ort und Stelle, das Menü bleibt offen. Ein Eintrag mit weiteren Einträgen öffnet ein Untermenü.\n\nVom oberen Rand nach unten wischen öffnet den Schnellzugriff: was du oft änderst, als Tasten. Antippen zum Schalten, lange drücken für die Einstellungen. Nur mit Tasten wählen die Pfeiltasten, Wählen schaltet, Zurück schließt. Unter Darstellung zeigt Menüs die Menüs als Liste oder als Kacheln."
menu.title = Menü
menu.empty = Dieses Menü hat keine Einträge.
menu.setting.style = Menüs
menu.style.list = Liste
menu.style.tiles = Kacheln
menu.setting.style.help = Menüs als Liste oder als Kacheln mit ihren Icons oben am Bildschirm.
menu.help.panel = Der Schnellzugriff: was du oft änderst, etwa das Licht und den Nachtmodus.
menu.help.panel-tap = Eine Taste antippen zum Schalten.
menu.help.panel-close = Daneben tippen zum Schließen.
menu.help.panel-buttons = Die Pfeiltasten: wählen. Wählen: schalten. Zurück: schließen.
