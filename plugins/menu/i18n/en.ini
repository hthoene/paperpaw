[messages]
menu.plugin.name = Menu
menu.plugin.description = The menu at the bottom of the screen, with actions and settings.
menu.plugin.how = "The menu lists what you can do and set. It opens at the bottom of the screen, above whatever is open: while reading, tap the middle of the screen or press Select. Tap or select an entry to run it.\n\nSettings in the menu show their value and change in place, so the menu stays open. An entry with more entries opens a submenu.\n\nSwipe down from the top edge for the quick panel: what you change often, as buttons. Tap a button to switch it, hold it for its settings. With buttons only, the arrow buttons choose, Select switches and Back closes. Under Appearance, Menus shows menus as a list or as tiles."
menu.title = Menu
menu.empty = This menu has no entries.
menu.setting.style = Menus
menu.style.list = List
menu.style.tiles = Tiles
menu.setting.style.help = Menus as a list, or as tiles with their icons at the top of the screen.
menu.help.panel = The quick panel: what you change often, such as the light and night mode.
menu.help.panel-tap = Tap a button to switch it.
menu.help.panel-close = Tap outside it to close it.
menu.help.panel-buttons = The arrow buttons: choose. Select: switch. Back: close.
