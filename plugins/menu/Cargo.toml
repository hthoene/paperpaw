[package]
name = "paperpaw-plugin-menu"
description = "PaperPaw menu overlay: shows the entries any plugin contributes to a menu"
version = "1.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the table of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
# By path alone: the app has this plugin built in, so a version here
# would make the two wait for each other on crates.io; cargo publish
# leaves a dev-dependency without one out.
paperpaw-app = { path = "../../crates/paperpaw-app" }
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
proptest.workspace = true

[lints]
workspace = true
