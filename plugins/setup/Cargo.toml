[package]
name = "paperpaw-plugin-setup"
description = "PaperPaw first-run setup: a short guide through the settings that matter, with steps from every plugin"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-native.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-platform.workspace = true

[lints]
workspace = true
