setup.sample = Reading is a quiet joy.
setup.end.title = Where your books come from
setup.end.help = Put books into the folder “/books” on the device with a computer, or send them over Wi-Fi from a phone or computer (Tools, Wi-Fi transfer). Catalogs bring them too, and Calibre where it is added. Everything chosen here can be changed in the settings.
