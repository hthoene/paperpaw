[messages]
setup.plugin.name = Setup
setup.plugin.description = A short guide through the settings that matter, on the first start.
setup.plugin.how = "Setup is a short guide through the settings that matter, shown once, the first time PaperPaw starts. Each page asks one thing, such as the language, the buttons, the text size, the time zone, Wi-Fi or a few plugins to add, with a sensible answer already chosen, so Next is always right. Steps this device does not need are left out.\n\nTap the buttons, or use the up and down buttons and Select. Skip on the first page leaves the setup at once. The last page tells where your books come from.\n\nTo run it again, open the settings and choose Set up PaperPaw. Everything chosen here can be changed in the settings later."
