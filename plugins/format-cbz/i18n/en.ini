[messages]
format-cbz.plugin.name = Comic books
format-cbz.plugin.description = Opens comic book archives (.cbz), a picture a page.
format-cbz.plugin.how = "Opens comic book archives (.cbz): a picture a page, fitted to the screen, in the order of their names (2 before 10).\n\nPut them into the library folder and open them from the library; turn the pages as in any book. Large pictures take a moment the first time, on the X4 more than elsewhere.\n\nReading settings (Settings, Reading): \"Panel by panel\" shows one panel of a page at a time, as large as the screen allows, and the page turns step through them; a page without panels is shown whole. \"Comic pages run\" mirrors the page turns for manga (right to left); the book's own ComicInfo.xml says so by itself. The library shows a book's title and its series and number from ComicInfo.xml."
format-cbz.title = Comic book (CBZ)
format-cbz.setting.direction = Comic pages run
format-cbz.setting.direction.help = Manga: the page turns are mirrored.
format-cbz.direction.book = As the book says
format-cbz.direction.ltr = Left to right
format-cbz.direction.rtl = Right to left
format-cbz.setting.panels = Panel by panel
format-cbz.setting.panels.help = One panel at a time, page turns step through them.
