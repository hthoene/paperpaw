[messages]
mail.plugin.name = Mail
mail.plugin.description = Liest und sendet E-Mail mit Passwort oder App-Passwort (IMAP und SMTP), ohne Anmeldung im Browser.
mail.plugin.how = "Mail liest und sendet E-Mail über IMAP und SMTP. Es meldet sich mit deiner Adresse und einem Passwort an, ohne Anmeldung im Browser, und funktioniert so mit jedem Anbieter, der das erlaubt.\n\nRichte ein Konto unter Einstellungen, Mail ein. Wähle deinen Anbieter, tippe deine Adresse und das Passwort. Die meisten Anbieter verlangen ein App-Passwort: Erzeuge eines in den Sicherheitseinstellungen deines Kontos und nutze es hier. Dein normales Passwort funktioniert oft nicht, und es geht nirgends hin außer zum Server deines Anbieters. Es liegt bei den Passwörtern und Schlüsseln.\n\nÖffne Mail bei den Werkzeugen. Nach Mails sehen holt die neuesten Mails und die Ordner. Die Mails bleiben auf der Karte, du kannst sie ohne Netz lesen. Das Gerät verbindet sich, holt ab und trennt sich wieder, das WLAN ist also nur kurz an.\n\nSteht dein Anbieter nicht in der Liste, wähle Eigener Server und trage Servernamen, Ports und Sicherheit unter den erweiterten Einstellungen ein. Ein Server, für dessen Zertifikat keine Stelle bürgt, fragt einmal, ob du ihm vertraust; vergleiche den Fingerabdruck mit dem, den dein Anbieter nennt.\n\nEine Mail mit angehängtem Buch (EPUB, PDF und Ähnliches, bis 2 MB) hat darunter Buch öffnen: Es holt die Datei, legt sie in deine Bibliothek und öffnet sie.\n\nUm neue Mails zu sehen, ohne Mail zu öffnen, schalte unter Einstellungen, Mail, Im Hintergrund nach neuer Mail suchen ein und wähle, wie oft (alle 15, 30 oder 60 Minuten). Es ist aus, bis du es einschaltest. Das Lesegerät verbindet sich dann ab und zu verschlüsselt, solange es wach und online ist, ein Konto nach dem anderen, und aktualisiert die Zahl der ungelesenen Mails auf dem Startbildschirm. Das kostet etwas Akku. Öffnest du Mail, endet eine laufende Prüfung.\n\nWidgets auf dem Startbildschirm zeigen die Zahl ungelesener Mails, die neuesten und die markierten Mails, ein Postfach und eine Abkürzung zum Schreiben."
