[messages]
mail.plugin.name = Mail
mail.plugin.description = Reads and sends e-mail with a password or an app password (IMAP and SMTP), no browser login.
mail.plugin.how = "Mail reads and sends e-mail over IMAP and SMTP. It signs in with your address and a password, with no browser login, so it works with any provider that allows that.\n\nSet up an account under Settings, Mail. Pick your provider, type your address and the password. Most providers want an app password: make one in your account's security settings and use that here. Your normal password often does not work, and it never goes anywhere but your provider's server. It is kept with the passwords and keys.\n\nOpen Mail in the tools. Check for mail fetches the latest mails and the folders. Mails are kept on the card, so you can read them without a network. The device connects, fetches and disconnects, so Wi-Fi is on only for a moment.\n\nIf your provider is not on the list, choose Own servers and set the server names, ports and security under the advanced settings. A server whose certificate no authority vouches for asks once whether to trust it; compare the fingerprint with what your provider shows.\n\nA mail with a book attached (EPUB, PDF and the like, up to 2 MB) has Open book below it: it fetches the file, puts it in your library and opens it.\n\nTo see new mail without opening Mail, turn on Check for new mail in the background under Settings, Mail, and choose how often (every 15, 30 or 60 minutes). It is off until you turn it on. The reader then connects now and then over a secure connection while it is awake and online, one account after the other, and updates the unread count on Home. It uses some battery. Opening Mail stops a check that is running.\n\nHome screen widgets show the unread count, the latest and the starred mails, one mailbox, and a shortcut to write a mail."
