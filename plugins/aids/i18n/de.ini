[messages]
aids.plugin.name = Lesehilfen
aids.plugin.description = Fette Wortanfänge, ersetzte Wörter, Bilder: Text, wie du ihn willst.
aids.plugin.how = "Lesehilfen verändern, wie der Text eines Buchs beim Lesen aussieht. Sie gelten für jedes Buch. Wortanfänge fett und Wörter ersetzen sind zuerst aus.\n\nDu findest sie in den Einstellungen unter Lesen, im Abschnitt Lesehilfen. Wortanfänge fett setzt die erste Hälfte jedes Worts fett, was manchen das Lesen erleichtert. Wörter ersetzen nimmt Paare wie \"daß = dass; Thür = Tür\", durch Semikolon getrennt.\n\nErsetzt werden nur ganze Wörter, genau so geschrieben, wie du sie eingibst, ein Teil eines längeren Worts bleibt also unberührt. Die Buchdatei selbst wird nicht verändert.\n\nBilder in Büchern kannst du zeigen (zuerst so), durch eine kurze Zeile wie \"[Bild: ein Schiff auf See]\" ersetzen, die die Beschreibung des Bildes nutzt, oder weglassen. Eine Seite hat dann mehr Platz für Text, und für ein Bild, das nicht gezeigt wird, wird nichts decodiert, was das Umblättern beschleunigt. Comics und andere Bücher aus Bildern bleiben unverändert."
aids.setting.bold-beginnings = Wortanfänge fett
aids.setting.bold-beginnings.help = Die erste Hälfte jedes Worts fett, was manchen das Lesen erleichtert.
aids.setting.replace = Wörter ersetzen
aids.setting.replace.help = Paare wie „daß = dass; Thür = Tür“, für ganze Wörter in jedem Buch.
aids.setting.pictures = Bilder in Büchern
aids.setting.pictures.help = Bilder zeigen, durch eine kurze Zeile ersetzen oder weglassen.
aids.pictures.show = Zeigen
aids.pictures.caption = Kurze Zeile
