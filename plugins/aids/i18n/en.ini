[messages]
aids.plugin.name = Reading aids
aids.plugin.description = Bold word beginnings, replaced words, pictures: text as you want it.
aids.plugin.how = "Reading aids change how the text of a book looks while you read. They apply to every book. Bold word beginnings and Replace words are off at first.\n\nYou find them in Settings, under Reading, in the section Reading aids. Bold word beginnings sets the first half of each word in bold, which some people find easier to follow. Replace words takes pairs written as \"colour = color; Mr. = Mister\", separated by semicolons.\n\nOnly whole words are replaced, exactly as you wrote them, so \"color\" never changes part of a longer word. The book file itself is not changed.\n\nPictures in books can be shown (as at first), turned into a short line such as \"[Picture: a ship at sea]\" that uses the picture's description, or left out. A page then has more room for text, and nothing is decoded for a picture that is not shown, which makes pages turn faster. Comics and other books made of pictures are not changed."
aids.setting.bold-beginnings = Bold word beginnings
aids.setting.bold-beginnings.help = The first half of every word in bold, which some find easier to follow.
aids.setting.replace = Replace words
aids.setting.replace.help = Pairs like “colour = color; Mr. = Mister”, for whole words in every book.
aids.setting.pictures = Pictures in books
aids.setting.pictures.help = Show pictures, put a short line in their place, or leave them out.
aids.pictures.show = Show
aids.pictures.caption = Short line
aids.pictures.hide = Hide
aids.picture = Picture
