[messages]
settings.plugin.name = Einstellungen
settings.plugin.description = Die Einstellungsseiten, erzeugt aus den Einstellungen aller Plugins.
settings.plugin.how = "Die Einstellungen zeigen alles, was sich an PaperPaw und seinen Plugins einstellen lässt, in Seiten. Plugins brauchen keinen eigenen Bildschirm: Was sie anmelden, erscheint hier in Gruppen, mit der Beschreibung unter jeder Einstellung.\n\nÖffne sie mit Einstellungen im Menü. Eine Gruppe antippen öffnet sie, eine Einstellung antippen schaltet oder wählt; Zahlen haben − und +. Mit Tasten gehst du zur Einstellung und drückst Wählen: Links und rechts ändern eine Zahl, Wählen behält sie, Zurück stellt den früheren Wert wieder her.\n\nÄnderungen gelten sofort. Suchen findet nach Wörtern, Expertenoptionen blendet seltene ein. Auf Standard zurücksetzen und Alles zurücksetzen fragen vorher."
