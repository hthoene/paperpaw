[messages]
wallabag.plugin.name = Merkliste-Artikel (eigener Server)
wallabag.plugin.description = Holt in wallabag gespeicherte Artikel als Bücher.
wallabag.plugin.how = "Merkliste-Artikel (eigener Server) holt die Artikel, die du in wallabag gespeichert hast, als Bücher mit ihren Bildern in den Ordner Wallabag deiner Bibliothek. Es ist anfangs aus: Füge es aus dem Plugin-Store hinzu, oder schalte es unter Plugins ein, wenn es dort steht.\n\nÖffne Merkliste-Artikel (eigener Server) unter Werkzeuge. Gib Server, Benutzernamen und Passwort ein sowie ID und Secret eines API-Clients, den du in Wallabag unter API-Clients verwalten anlegst. Wähle dann Artikel holen, bei eingeschaltetem WLAN.\n\nArtikel, die du zu Ende gelesen hast, werden beim nächsten Holen in Wallabag archiviert und ihre Bücher entfernt. Ein Buch, in dem du Markierungen, Notizen oder Lesezeichen gesetzt hast, bleibt mit ihnen in deiner Bibliothek. Wechselst du zu einem anderen Server oder Konto, bleiben die zuvor geholten Bücher ebenfalls."
wallabag.title = Merkliste-Artikel (eigener Server)
wallabag.fetch = Artikel holen
wallabag.server = Server
wallabag.server.help = In Wallabag zum späteren Lesen gespeicherte Artikel, als Bücher in den Ordner „Wallabag“ geholt.
wallabag.user = Benutzername
wallabag.user.help = Der Benutzername des Wallabag-Kontos, aus dem die Artikel kommen.
wallabag.password = Passwort
wallabag.client-id = Client-ID
wallabag.client-id.help = Die ID eines API-Clients, angelegt in Wallabag unter „API-Clients verwalten“.
wallabag.client-secret = Client-Secret
wallabag.secret.password = Wallabag-Passwort
wallabag.secret.client = Wallabag-Client-Secret
wallabag.help = Lege in Wallabag unter „API-Clients verwalten“ einen Client an und gib hier seine ID und sein Secret ein. Ungelesene Artikel kommen in den Ordner „Wallabag“; zu Ende gelesene werden beim nächsten Holen archiviert.
wallabag.fetching = Artikel werden von Wallabag geholt …
# {fetched}, {archived} und {failed} sind Zahlen von Artikeln.
wallabag.done = Wallabag: {fetched} neu, {archived} archiviert.
wallabag.done-failed = Wallabag: {fetched} neu, {archived} archiviert, {failed} fehlgeschlagen.
wallabag.setup-needed = Wallabag braucht zuerst Server, Benutzernamen, Passwort und einen API-Client.
wallabag.bad-login = Wallabag hat die Anmeldung nicht angenommen. Prüfe Benutzernamen, Passwort und API-Client.
wallabag.no-network = Für Wallabag braucht es ein Netzwerk.
wallabag.unreachable = Wallabag ist nicht erreichbar. Prüfe die WLAN-Verbindung und versuche es noch einmal.
wallabag.unreadable = Wallabag kann seine Liste der geholten Artikel auf diesem Gerät nicht lesen, darum wurde nichts geändert.
wallabag.not-kept = Wallabag konnte das Passwort oder Geheimnis nicht speichern. Prüfe, ob es nicht zu lang ist, und versuche es erneut.
