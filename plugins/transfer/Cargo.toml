[package]
name = "paperpaw-plugin-transfer"
description = "PaperPaw transfer by browser: put files on the device from a phone or computer in the same network"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "data", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-qr.workspace = true
# Installs plugins sent from a computer (kernel).
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-digest.workspace = true
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
proptest.workspace = true
# A FAT card for the tests of hostile paths.
paperpaw-fat.workspace = true

[package.metadata.paperpaw]
# Large files embedded on purpose (`paperpaw-dev package` says nothing of them).
embedded-assets = "built into the firmware: USB and Wi-Fi transfer is how files reach the card, so its pages cannot wait for a file on it"

[lints]
workspace = true
