[messages]
transfer.plugin.name = Transfer
transfer.plugin.description = Put books and other files on the device from a browser in the same network.
transfer.plugin.how = "Wi-Fi transfer puts books and other files on the device from a browser in the same network, with no cable or app. You can also fetch files, make folders and delete.\n\nOpen it from Tools. The screen shows an address as text and as a QR code: open it in a browser on a phone or computer, or scan the code. The address holds a key made anew each time, so others in the network cannot get at your files. The transfer runs while the screen is open.\n\nWhere PaperPaw runs Wi-Fi itself, as on the X4, Without a router at the bottom opens a network of the device's own, which the phone joins by scanning a code."
