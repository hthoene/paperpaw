[messages]
format-mobi.plugin.name = MOBI-Bücher
format-mobi.plugin.description = Öffnet .mobi- und .azw-Dateien ohne DRM.
format-mobi.plugin.how = "MOBI-Bücher (.mobi, .azw) öffnen sich aus der Bibliothek wie jedes Buch, ohne Einrichtung. Titel, Autoren, Sprache und Cover stammen aus dem Buch, die Inhaltsliste entsteht aus seinen Überschriften.\n\nDas Buch wird beim ersten Öffnen umgewandelt, bei einem langen dauert das einige Sekunden; danach öffnet es sofort. Text, Überschriften, Fett und Kursiv, Links und Bilder werden angezeigt.\n\nBücher mit DRM (die meisten aus einem Shop gekauften) lassen sich nicht öffnen, ebenso wenig Bücher mit Huffman-Kompression oder in der neueren KF8-Form (.azw3): PaperPaw sagt das beim Öffnen. Eine Kopie als EPUB, etwa mit Calibre gemacht, öffnet sich immer."
format-mobi.title = MOBI-Bücher
