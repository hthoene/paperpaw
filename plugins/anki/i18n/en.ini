[messages]
anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Studies the due cards of Anki on your computer and sends your answers back, through the AnkiConnect add-on.
anki.title = Anki
anki.sync = Sync with Anki
anki.study = Study
anki.deck = Deck
anki.deck.help = The deck to study (with its subdecks). Empty: all decks.
anki.host = Computer
anki.host.help = The address of the computer Anki runs on, for example 192.168.1.20.
anki.port = Port
anki.port.help = AnkiConnect listens on port 8765 unless its configuration says otherwise.
anki.key = API key
anki.secret.key = AnkiConnect API key
anki.new-cards = New cards
anki.new-cards.help = How many cards you have not seen yet each sync brings, besides those due.
anki.unit.cards.one = card
anki.unit.cards.other = cards
anki.sync-on-open = Sync when Anki opens
anki.sync-on-open.help = Syncs each time the Anki screen is opened, where the computer can be reached.
anki.all-decks = All decks
# {count} is a number of cards.
anki.ready.one = {count} card
anki.ready.other = {count} cards
# {count} is a number of answers.
anki.waiting.one = {count} answer waiting
anki.waiting.other = {count} answers waiting
anki.left.one = {count} left
anki.left.other = {count} left
anki.help = Study cards of Anki on your computer: Sync fetches the cards due and sends your answers back. Anki must be open there, with the AnkiConnect add-on; see How it works.
anki.syncing = Syncing with Anki …
# {sent} and {fetched} are numbers of answers and cards.
anki.synced = Anki: answers sent: {sent}. Cards ready: {fetched}.
anki.nothing-due = Anki: answers sent: {sent}. No cards are due.
# {message} is what Anki answered.
anki.said = Anki said: {message}
anki.setup-needed = Enter the computer Anki runs on first.
anki.no-network = Syncing needs a network. Your answers are kept and go with the next sync.
anki.unreachable = The computer cannot be reached. Check that Anki is open there, the address and port, and that AnkiConnect listens on all addresses (see How it works).
anki.bad-key = AnkiConnect did not accept the API key. Check it here and in the add-on's configuration.
anki.bad-reply = The answer is not from AnkiConnect (version 6). Check the address and port.
anki.denied = The network is turned off for this plugin.
anki.cancelled = The sync was stopped.
anki.unreadable = The cards on this device cannot be read or written, so nothing was changed.
anki.not-kept = The key could not be kept.
anki.busy = A sync is under way. Try again in a moment.
anki.decks-listed = The decks are listed.
anki.show = Show answer
anki.again = Again
anki.hard = Hard
anki.good = Good
anki.easy = Easy
anki.study.none = No cards yet. Choose Sync with Anki first.
anki.study.done = Done for now. Choose Sync with Anki to send your answers and fetch more.
anki.queue-full = Too many answers are waiting. Sync with Anki first.
anki.not-saved = The answer could not be saved.
