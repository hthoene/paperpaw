[messages]
anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Lernt die fälligen Karten aus Anki auf deinem Computer und schickt deine Antworten zurück, über das AnkiConnect-Add-on.
anki.title = Anki
anki.sync = Mit Anki abgleichen
anki.study = Lernen
anki.deck = Stapel
anki.deck.help = Der Stapel, der gelernt wird (mit seinen Unterstapeln). Leer: alle Stapel.
anki.host = Computer
anki.host.help = Die Adresse des Computers, auf dem Anki läuft, zum Beispiel 192.168.1.20.
anki.port = Port
anki.port.help = AnkiConnect lauscht auf Port 8765, sofern seine Konfiguration nichts anderes sagt.
anki.key = API-Schlüssel
anki.secret.key = AnkiConnect-API-Schlüssel
anki.new-cards = Neue Karten
anki.new-cards.help = Wie viele noch nicht gesehene Karten jeder Abgleich zusätzlich zu den fälligen bringt.
anki.unit.cards.one = Karte
anki.unit.cards.other = Karten
anki.sync-on-open = Beim Öffnen abgleichen
anki.sync-on-open.help = Gleicht jedes Mal ab, wenn der Anki-Bildschirm geöffnet wird und der Computer erreichbar ist.
anki.all-decks = Alle Stapel
# {count} ist eine Anzahl Karten.
anki.ready.one = {count} Karte
anki.ready.other = {count} Karten
# {count} ist eine Anzahl Antworten.
anki.waiting.one = {count} Antwort wartet
anki.waiting.other = {count} Antworten warten
anki.left.one = noch {count}
anki.left.other = noch {count}
anki.help = Lerne Karten aus Anki auf deinem Computer: Der Abgleich holt die fälligen Karten und schickt deine Antworten zurück. Anki muss dort geöffnet sein, mit dem Add-on AnkiConnect; siehe So funktioniert es.
anki.syncing = Abgleich mit Anki …
# {sent} und {fetched} sind Anzahlen von Antworten und Karten.
anki.synced = Anki: Antworten gesendet: {sent}. Karten bereit: {fetched}.
anki.nothing-due = Anki: Antworten gesendet: {sent}. Keine Karten fällig.
# {message} ist, was Anki geantwortet hat.
anki.said = Anki sagt: {message}
anki.setup-needed = Gib zuerst den Computer an, auf dem Anki läuft.
anki.no-network = Der Abgleich braucht ein Netzwerk. Deine Antworten bleiben gespeichert und gehen beim nächsten Abgleich mit.
anki.unreachable = Der Computer ist nicht erreichbar. Prüfe, ob Anki dort geöffnet ist, Adresse und Port und ob AnkiConnect auf allen Adressen lauscht (siehe So funktioniert es).
anki.bad-key = AnkiConnect hat den API-Schlüssel nicht akzeptiert. Prüfe ihn hier und in der Konfiguration des Add-ons.
anki.bad-reply = Die Antwort stammt nicht von AnkiConnect (Version 6). Prüfe Adresse und Port.
anki.denied = Das Netzwerk ist für dieses Plugin ausgeschaltet.
anki.cancelled = Der Abgleich wurde abgebrochen.
anki.unreadable = Die Karten auf diesem Gerät lassen sich nicht lesen oder schreiben, daher wurde nichts geändert.
anki.not-kept = Der Schlüssel konnte nicht gespeichert werden.
anki.busy = Ein Abgleich läuft. Versuche es gleich noch einmal.
anki.decks-listed = Die Stapel sind aufgelistet.
anki.show = Antwort zeigen
anki.again = Nochmal
anki.hard = Schwer
anki.good = Gut
anki.easy = Leicht
anki.study.none = Noch keine Karten. Wähle zuerst Mit Anki abgleichen.
anki.study.done = Fürs Erste fertig. Wähle Mit Anki abgleichen, um die Antworten zu senden und mehr zu holen.
anki.queue-full = Zu viele Antworten warten. Gleiche zuerst mit Anki ab.
anki.not-saved = Die Antwort konnte nicht gespeichert werden.
