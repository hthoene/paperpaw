anki.plugin.name = Anki (AnkiConnect)
anki.plugin.description = Lernt die fälligen Karten aus Anki auf deinem Computer und schickt deine Antworten zurück, über das AnkiConnect-Add-on.
anki.plugin.how = "Anki lässt dich die in Anki auf deinem Computer fälligen Karten auf dem Reader lernen und schickt deine Antworten zurück. Es nutzt das freie Add-on AnkiConnect (Add-on-Code 2055492159) und niemals AnkiWeb. Es ist zunächst aus: Hole es aus dem Plugin-Store.\n\nAm Computer: Installiere AnkiConnect in Anki (Werkzeuge, Add-ons, Add-ons herunterladen) und starte Anki neu. Anki muss beim Abgleich geöffnet sein.\n\nStandardmäßig antwortet AnkiConnect nur dem Computer, auf dem es läuft (127.0.0.1); der Reader kommt so nicht heran. Öffne Werkzeuge, Add-ons, AnkiConnect, Konfiguration und setze \"webBindAddress\" auf \"0.0.0.0\" (im Heimnetz lauschen). Der Port, \"webBindPort\", ist 8765, solange du ihn nicht änderst. Wenn du dort einen \"apiKey\" setzt, gib hier denselben Schlüssel ein. Starte Anki nach der Änderung neu und erlaube Anki in der Firewall des Computers, falls sie fragt. Nutze das nur in einem Netz, dem du vertraust: Jeder darin erreicht AnkiConnect, ein Schlüssel ist daher sinnvoll.\n\nAm Reader: Öffne Anki unter Werkzeuge, gib unter Computer die Adresse des Computers ein (zum Beispiel 192.168.1.20), den Port, falls er nicht 8765 ist, und den API-Schlüssel, falls du einen gesetzt hast. Wähle einen Stapel oder lasse ihn leer für alle Stapel. Wähle dann Mit Anki abgleichen, bei eingeschaltetem WLAN: Zuerst werden die wartenden Antworten gesendet, dann die fälligen Karten (und so viele neue, wie du eingestellt hast) geholt, höchstens 50. Wähle Lernen, um sie ohne Netzwerk durchzugehen: Antwort zeigen und mit Nochmal, Schwer, Gut oder Leicht bewerten. Deine Antworten bleiben auf dem Reader gespeichert, auch ohne WLAN, und gehen mit dem nächsten Abgleich an Anki. Anki entscheidet, wann eine Karte wiederkommt: Eine mit Nochmal beantwortete Karte wird bei einem späteren Abgleich erneut geholt, sobald Anki sie als fällig meldet.\n\nBeim Öffnen abgleichen, in den Einstellungen, gleicht jedes Mal ab, wenn du den Bildschirm öffnest. Ein Tastendruck nutzt nie das Netzwerk."
