[package]
name = "paperpaw-plugin-anki"
description = "PaperPaw Anki: study the due cards of Anki on your computer and send the answers back (AnkiConnect)"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-platform.workspace = true

[lints]
workspace = true

[package.metadata.paperpaw]
card-files = ["i18n/*.ini"]
