[messages]
keyboard.plugin.name = Tastatur
keyboard.plugin.description = Gibt Text auf dem Bildschirm ein, per Touch oder mit den Tasten.
keyboard.plugin.how = "Die Tastatur öffnet sich, wann immer etwas Text braucht: eine Suche, ein Passwort, eine Notiz oder eine Einstellung. Sie funktioniert per Touch und allein mit den Tasten.\n\nMit Tasten gehst du mit Links und Rechts durch eine Reihe, mit den Blättertasten von Reihe zu Reihe; Wählen drückt die Taste, Zurück bricht ab; Links und Rechts gehen rund um eine Reihe, Hoch und Runter bleiben in deiner Spalte. Umschalten macht den nächsten Buchstaben groß; zweimal gedrückt alle, noch einmal gedrückt keinen mehr. Einen Buchstaben lange drücken (mit Tasten: Wählen auf ihm halten) zeigt ihn groß, gleich gewählt, und Akzente wie é und è; im Deutschen kommen so ä, ö, ü und ß von a, o, u und s (mit Tasten sagt die Tastatur das auf diesen Buchstaben). OK beendet die Eingabe; mit Tasten beendet Zurück halten sie von überall (Zurück allein bricht ab), ebenso Wählen halten auf einer Taste, die kein Buchstabe ist. Einfügen setzt den Text aus der Zwischenablage ein, und Handy lässt dich den Text, wo angeboten, stattdessen am Handy tippen.\n\nIn den Einstellungen unter Gerät, Tastatur: Tastatur-Layouts wählt die Layouts. Vorgabe ist die Sprache der Menüs; bei mehreren wechselt eine Taste zwischen ihnen. Umlaut-Tasten gibt ä, ö, ü und ß stattdessen eigene Tasten. Größe macht Tasten und Buchstaben größer; allein mit Tasten bleiben die Reihen die einer Computertastatur. Auf Touchscreens ändert Tastenform, wie die Tasten aussehen. Automatisch groß beginnt jeden Satz mit einem Großbuchstaben."
keyboard.title = Tastatur
