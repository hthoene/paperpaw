[messages]
keyboard.plugin.name = Keyboard
keyboard.plugin.description = Enters text on the screen, by touch or with the buttons.
keyboard.plugin.how = "The keyboard opens whenever something needs text: a search, a password, a note or a setting. It works by touch and with buttons alone.\n\nWith buttons, left and right move along a row, the page buttons move between rows, Select presses a key and Back cancels; left and right go round a row, and up and down keep to your column. Shift makes the next letter a capital; press it twice for all capitals, and once more to stop. Hold a letter (with buttons: hold Select on it) for its capital, chosen at once, and accents such as é and è; in German, ä, ö, ü and ß come so from a, o, u and s (with buttons, the keyboard says so on those letters). OK finishes; with buttons, hold Back to finish from anywhere (Back alone cancels), or hold Select on a key that is no letter. Paste inserts the clipboard text, and Phone, where offered, lets you type on your phone instead.\n\nIn the settings under Device, Keyboard: Keyboard layouts chooses the layouts. By default it follows the menu language; with several, a key switches between them. Umlaut keys gives ä, ö, ü and ß keys of their own instead. Size makes keys and letters larger; with buttons alone, the rows stay those of a computer keyboard. On touch screens, Key shape changes how the keys look. Automatic capitals starts each sentence with a capital."
