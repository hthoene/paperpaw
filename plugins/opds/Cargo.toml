[package]
name = "paperpaw-plugin-opds"
description = "PaperPaw OPDS catalogs: browse, search and download books, and keep folders in sync with catalogs"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native", "testdata"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-format-epub.workspace = true
proptest.workspace = true

[lints]
workspace = true
