# The sleep screen of news on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin news --snapshots plugins/news/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = news.sleep
profile = xteink-x4
plugins.news = on
core.language = en
file = .paperpaw/plugins/news/headlines.txt <- headlines.txt
file = .paperpaw/plugins/news/fetched.txt <- fetched.txt
file = News/Tagesschau (3fa9c2).html <- Tagesschau (3fa9c2).html
file = News/Heise (b1c2d3).html <- Heise (b1c2d3).html
file = News/Spektrum (a9b8c7).html <- Spektrum (a9b8c7).html

[x4-sleep-de]
screen = news.sleep
profile = xteink-x4
plugins.news = on
core.language = de
file = .paperpaw/plugins/news/headlines.txt <- headlines.txt
file = .paperpaw/plugins/news/fetched.txt <- fetched.txt
file = News/Tagesschau (3fa9c2).html <- Tagesschau (3fa9c2).html
