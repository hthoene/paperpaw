# The sleep screen of reading-goal on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin reading-goal --snapshots plugins/reading-goal/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = reading-goal.sleep
profile = xteink-x4
plugins.reading-goal = on
plugins.stats = on
reading-goal.pictures = cats
stats.goal = stats.goal.20
core.language = en
script = wait:1500,redraw
file = .paperpaw/plugins/stats/pages.bin <- pages.bin
file = .paperpaw/plugins/reading-goal/today.txt <- today.txt
file = cats/happy.png <- happy.png

[x4-sleep-de]
screen = reading-goal.sleep
profile = xteink-x4
plugins.reading-goal = on
plugins.stats = on
reading-goal.pictures = cats
stats.goal = stats.goal.20
core.language = de
script = wait:1500,redraw
file = .paperpaw/plugins/stats/pages.bin <- pages.bin
file = .paperpaw/plugins/reading-goal/today.txt <- today.txt
file = cats/happy.png <- happy.png
