[package]
name = "paperpaw-plugin-edge-light"
description = "PaperPaw Edge light: swipe along the screen edge to set the front light, and a home screen widget"
version = "1.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-i18n.workspace = true

[lints]
workspace = true

[package.metadata.paperpaw]
card-files = ["i18n/*.ini"]
