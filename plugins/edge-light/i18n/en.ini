[messages]
edge-light.plugin.name = Edge light
edge-light.plugin.description = Swipe along the screen edge to set the front light: brightness on one side, warmth on the other.
edge-light.plugin.how = "Swipe up or down along the edge of the screen to set the front light, like a slider: the light follows your finger in steps of 5 %, and a small notice shows the level. The left edge sets the brightness, the right edge the warmth. Raise your finger to stop.\n\nThe strip along each edge is a few millimetres wide. A tap there, and swipes anywhere else (pages, lists), work as always; so does a swipe sideways, also when it starts in the strip.\n\nUnder Edge light in the settings you choose what each edge sets (brightness, warmth or nothing) and how wide the strips are. Edge light is for devices with a touch screen and a front light; elsewhere it shows nothing.\n\nAdd the widget Front light to the home screen to see the level; tap it to switch the light off and on again at the level it had. The same is the action Front light: on or off, which you can put on a button or a menu."
edge-light.group = Edge light
edge-light.setting.left = Left edge
edge-light.setting.left.help = What a swipe up or down along the left edge of the screen sets.
edge-light.setting.right = Right edge
edge-light.setting.right.help = What a swipe up or down along the right edge of the screen sets.
edge-light.setting.width = Edge width
edge-light.setting.width.help = How wide the strip along each edge is, as a share of the screen's width. Swipes that start in it set the light; everywhere else they work as always.
