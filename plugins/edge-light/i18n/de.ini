edge-light.setting.right.help = Was ein Wisch nach oben oder unten am rechten Bildschirmrand einstellt.
edge-light.setting.width = Randbreite
edge-light.setting.width.help = Wie breit der Streifen an jedem Rand ist, als Anteil der Bildschirmbreite. Wische, die darin beginnen, stellen das Licht ein; überall sonst wirken sie wie gewohnt.
