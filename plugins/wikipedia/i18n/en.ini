[messages]
wikipedia.plugin.name = Encyclopedia lookup
wikipedia.plugin.description = Looks words up on Wikipedia. Not affiliated with the Wikimedia Foundation.
wikipedia.plugin.how = "Encyclopedia lookup looks words up on Wikipedia, beside the dictionaries. When you look up a word in a book, the dictionary panel lists what your dictionaries find. Choose Online to ask Wikipedia too: the short summary of its article appears as one more entry, in the language of the book, else of PaperPaw.\n\nOpen the entry to read it on a screen of its own. The page buttons or taps scroll it, and Select or a tap at its end closes it.\n\nIt needs a network. If there is no article, it says so.\n\nThe summaries come from Wikipedia under the Creative Commons Attribution-ShareAlike 4.0 licence (CC BY-SA 4.0); each names its article below it."
wikipedia.title = Encyclopedia
wikipedia.loading = Looking it up …
wikipedia.not-found = Wikipedia has no article on this.
# Below an article's summary: its source, as its licence asks.
wikipedia.source = From Wikipedia, CC BY-SA 4.0: {address}
wikipedia.unreachable = Wikipedia could not be reached. Check the Wi-Fi connection and try again.
wikipedia.failed = Wikipedia did not answer as expected.
wikipedia.no-network = This needs a network connection.
wikipedia.offer = Wikipedia needs the network, and the device is offline. Press Confirm or tap to go online; Back closes.
wikipedia.about = Article summaries from Wikipedia (https://www.wikipedia.org), under CC BY-SA 4.0.
