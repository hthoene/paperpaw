[messages]
wikipedia.plugin.name = Lexikon-Suche
wikipedia.plugin.description = Schlägt Wörter auf Wikipedia nach. Nicht mit der Wikimedia Foundation verbunden.
wikipedia.plugin.how = "Die Lexikon-Suche schlägt Wörter auf Wikipedia nach, neben den Wörterbüchern. Schlägst du ein Wort in einem Buch nach, listet die Wörterbuch-Anzeige, was deine Wörterbücher finden. Wähle Online, um auch Wikipedia zu fragen: Die kurze Zusammenfassung seines Artikels erscheint als weiterer Eintrag, in der Sprache des Buchs, sonst der von PaperPaw.\n\nÖffne den Eintrag, um ihn auf einem eigenen Bildschirm zu lesen. Die Seitentasten oder Tippen scrollen ihn, die Auswahltaste oder ein Tippen am Ende schließt ihn.\n\nDafür braucht es ein Netz. Gibt es keinen Artikel, sagt es das.\n\nDie Zusammenfassungen kommen aus Wikipedia unter der Lizenz Creative Commons Namensnennung, Weitergabe unter gleichen Bedingungen 4.0 (CC BY-SA 4.0); jede nennt ihren Artikel darunter."
wikipedia.title = Lexikon
wikipedia.loading = Wird nachgeschlagen …
wikipedia.source = Aus Wikipedia, CC BY-SA 4.0: {address}
wikipedia.not-found = Wikipedia hat dazu keinen Artikel.
wikipedia.unreachable = Wikipedia war nicht erreichbar. Prüfe die WLAN-Verbindung und versuche es noch einmal.
wikipedia.failed = Wikipedia hat nicht wie erwartet geantwortet.
wikipedia.no-network = Dafür braucht es eine Netzwerkverbindung.
wikipedia.offer = Wikipedia braucht das Netz, und das Gerät ist offline. Bestätigen oder Tippen geht online; Zurück schließt.
wikipedia.about = Artikelzusammenfassungen von Wikipedia (https://www.wikipedia.org), unter CC BY-SA 4.0.
