[messages]
pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = A focus timer with work and break rounds, widgets and a daily count.
pomodoro.plugin.how = "A Pomodoro timer: work in focused rounds, then rest. It needs no setup: 25 minutes of focus, 5 of rest, and after four rounds a long break of 15.\n\nOpen Pomodoro from the tools menu and press Start, or add its widgets to the home screen (hold the home screen, then add a widget): Pomodoro timer shows the phase and the minutes left, Pomodoro start/pause is a button, and Pomodoro today counts the rounds you finished, with your daily goal. A tap on the timer starts or pauses it; hold it to open the full screen.\n\nThe timer keeps running when you leave the screen, and carries on by the clock after a restart. While the reader sleeps nothing runs: a phase that ended meanwhile is told when it wakes. A notice tells you when a phase is over. To save battery the clock updates once a minute (every ten seconds in the last minute on the full screen) and never keeps the reader awake.\n\nUnder Pomodoro in the settings you set the lengths and the rounds of a set, and whether the next phase starts by itself. Under More: a flash of the screen or a blink of the front light when a phase ends and a daily goal."
