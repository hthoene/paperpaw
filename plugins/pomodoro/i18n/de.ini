[messages]
pomodoro.plugin.name = Pomodoro
pomodoro.plugin.description = Ein Fokus-Timer mit Arbeits- und Pausenrunden, Widgets und Tageszähler.
pomodoro.plugin.how = "Ein Pomodoro-Timer: in Fokusrunden arbeiten, dazwischen pausieren. Er braucht keine Einrichtung: 25 Minuten Fokus, 5 Minuten Pause und nach vier Runden eine lange Pause von 15 Minuten.\n\nÖffne Pomodoro im Werkzeugmenü und tippe auf Start, oder füge die Widgets dem Startbildschirm hinzu (Startbildschirm gedrückt halten, dann Widget hinzufügen): Pomodoro-Timer zeigt die Phase und die Restminuten, Pomodoro Start/Pause ist ein Knopf, und Pomodoro heute zählt die beendeten Runden mit deinem Tagesziel. Ein Tipp auf den Timer startet oder hält ihn an; gedrückt halten öffnet den ganzen Bildschirm.\n\nDer Timer läuft weiter, wenn du den Bildschirm verlässt, und macht nach einem Neustart nach der Uhr weiter. Solange das Lesegerät schläft, läuft nichts: eine Phase, die inzwischen zu Ende ging, wird beim Aufwachen gemeldet. Ein Hinweis sagt dir, wann eine Phase vorbei ist. Um den Akku zu schonen, aktualisiert sich die Uhr nur einmal pro Minute (auf dem ganzen Bildschirm in der letzten Minute alle zehn Sekunden) und hält das Lesegerät nie wach.\n\nIn den Einstellungen unter Pomodoro legst du die Längen und die Runden eines Satzes fest und ob die nächste Phase von selbst startet. Unter Mehr: ein Aufblitzen des Bildschirms oder ein Blinken des Frontlichts am Ende einer Phase und ein Tagesziel."
