[messages]
read-later-cloud.plugin.name = Read-later articles (cloud)
read-later-cloud.plugin.description = Fetches articles saved in Readwise Reader.
read-later-cloud.title = Read-later articles (cloud)
read-later-cloud.fetch = Fetch articles
read-later-cloud.token = Access token
read-later-cloud.secret = Readwise Reader access token
read-later-cloud.from = Fetch articles from
read-later-cloud.from.later = Later
read-later-cloud.from.inbox = Inbox
read-later-cloud.from.help = Where in Readwise Reader the articles are taken from: the ones you saved for Later, or those in your Inbox.
read-later-cloud.help = Enter your access token (readwise.io/access_token). Articles come into the folder “Reader” as books, without pictures; those read to the end are archived with the next fetch.
read-later-cloud.fetching = Fetching the articles from Readwise Reader …
# {fetched}, {archived} and {failed} are numbers of articles.
read-later-cloud.done = Reader: {fetched} new, {archived} archived.
read-later-cloud.done-failed = Reader: {fetched} new, {archived} archived, {failed} failed.
read-later-cloud.setup-needed = Enter your Readwise Reader access token first.
read-later-cloud.bad-token = Readwise did not accept the access token. Check it at readwise.io/access_token.
read-later-cloud.wait = Readwise asks to wait a little. Fetch again in a minute.
read-later-cloud.no-network = Fetching articles needs a network.
read-later-cloud.unreachable = Readwise cannot be reached. Check the Wi-Fi connection and try again.
read-later-cloud.unreadable = This plugin cannot read its list of fetched articles on this device, so nothing was changed.
read-later-cloud.secret.account = Readwise Reader account
read-later-cloud.too-big = Readwise sent more than this device keeps, so the fetch stopped.
read-later-cloud.no-memory = There was not enough memory to fetch from Readwise Reader. The fetch stopped; the next one goes on.
read-later-cloud.not-kept = The access token could not be kept. Check that it is not too long and try again.
