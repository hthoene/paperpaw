[messages]
read-later-cloud.plugin.name = Read-later articles (cloud)
read-later-cloud.plugin.description = Fetches articles saved in Readwise Reader.
read-later-cloud.plugin.how = "Read-later articles (cloud) fetches the articles you saved in Readwise Reader as books into the folder Reader of your library. They hold the text of the article, without pictures. It is off at first: add it from the Plugin store, or switch it on under Plugins if it is listed there.\n\nOpen Read-later articles (cloud) from Tools. Enter your access token (readwise.io/access_token; it is the same as for Readwise, but kept apart here). Then choose Fetch articles, with Wi-Fi on. In the settings you choose whether the articles come from Later or from your Inbox. A fetch brings at most ten new articles; fetch again for more.\n\nArticles you read to the end are archived in Readwise Reader with the next fetch, and their books are removed. A book in which you made highlights, notes or bookmarks stays in your library with them. If you switch to another token, the books fetched before stay too."
