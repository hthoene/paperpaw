[messages]
read-later-cloud.plugin.name = Merkliste-Artikel (Cloud)
read-later-cloud.plugin.description = Holt in Readwise Reader gespeicherte Artikel.
read-later-cloud.title = Merkliste-Artikel (Cloud)
read-later-cloud.fetch = Artikel holen
read-later-cloud.token = Zugangstoken
read-later-cloud.secret = Zugangstoken von Readwise Reader
read-later-cloud.from = Artikel holen aus
read-later-cloud.from.later = Später
read-later-cloud.from.inbox = Posteingang
read-later-cloud.from.help = Woher in Readwise Reader die Artikel genommen werden: die, die du für Später gespeichert hast, oder die in deinem Posteingang.
read-later-cloud.help = Gib deinen Zugangstoken ein (readwise.io/access_token). Die Artikel kommen als Bücher ohne Bilder in den Ordner „Reader“; was du zu Ende gelesen hast, wird beim nächsten Holen archiviert.
read-later-cloud.fetching = Artikel von Readwise Reader werden geholt …
# {fetched}, {archived} and {failed} are numbers of articles.
read-later-cloud.done = Reader: {fetched} neu, {archived} archiviert.
read-later-cloud.done-failed = Reader: {fetched} neu, {archived} archiviert, {failed} fehlgeschlagen.
read-later-cloud.setup-needed = Gib zuerst deinen Zugangstoken von Readwise Reader ein.
read-later-cloud.bad-token = Readwise hat den Zugangstoken nicht angenommen. Prüfe ihn unter readwise.io/access_token.
read-later-cloud.wait = Readwise bittet, kurz zu warten. Hole die Artikel in einer Minute noch einmal.
read-later-cloud.no-network = Artikel holen braucht ein Netzwerk.
read-later-cloud.unreachable = Readwise ist nicht erreichbar. Prüfe die WLAN-Verbindung und versuche es erneut.
read-later-cloud.unreadable = Dieses Plugin kann seine Liste der geholten Artikel auf diesem Gerät nicht lesen; es wurde nichts geändert.
read-later-cloud.secret.account = Readwise-Reader-Konto
read-later-cloud.too-big = Readwise hat mehr gesendet, als dieses Gerät aufnimmt; das Holen wurde beendet.
read-later-cloud.no-memory = Für Readwise Reader reichte der Speicher nicht. Das Holen wurde beendet; das nächste macht weiter.
read-later-cloud.not-kept = Das Zugangstoken konnte nicht gespeichert werden. Prüfe, ob es nicht zu lang ist, und versuche es erneut.
