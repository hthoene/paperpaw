[package]
name = "paperpaw-plugin-fonts-default"
description = "PaperPaw default fonts: Literata for reading, Source Sans 3 for the UI"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
# The code is Apache-2.0; the bundled fonts are under the SIL Open Font
# License 1.1 (see fonts/*-OFL.txt).
license = "Apache-2.0 AND OFL-1.1"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "fonts", "i18n", "build.rs"]

[features]
default = ["outline"]
# Ship the scalable fonts. Without it, bitmap font packs are generated at
# build time (for devices like the ESP32-C3); sizes can be chosen with the
# PAPERPAW_FONT_SIZES environment variable, e.g. "20,24,28,32".
outline = ["paperpaw-sdk/outline"]
# Also ship bitmap packs next to the scalable fonts (`DEFAULT_FONT_PACKS`).
packs = []

[dependencies]
# `kernel`: the table of fonts the kernel registers (`BuiltInFonts`).
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[build-dependencies]
paperpaw-text = { workspace = true, features = ["outline"] }

[dev-dependencies]
# The tests look at what the plugin adds, as the kernel does.
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-graphics.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-text.workspace = true

# The test builds packs from the scalable fonts, which only `outline` brings.
[[test]]
name = "compact_pack"
required-features = ["outline"]

[package.metadata.paperpaw]
# Large files embedded on purpose (`paperpaw-dev package` says nothing of them).
embedded-assets = "built into the firmware: the reading fonts must be there on first start, before any installer has run"

[lints]
workspace = true
