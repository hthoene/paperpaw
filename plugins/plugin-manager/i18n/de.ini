plugin-manager.code.revoked = Läuft nicht: Der Schlüssel, mit dem es signiert ist, wurde gestohlen und gesperrt. Entferne es; im Store gibt es es vielleicht wieder vom Autor.
plugin-manager.formats.too-many = Nicht geladen: Es überschreitet die Grenze von {cap} Buchformaten. Schalte ein anderes Plugin mit Formaten aus.
