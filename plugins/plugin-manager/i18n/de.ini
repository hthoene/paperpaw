plugin-manager.providers.too-many = Nicht geladen: Es überschreitet die Grenze von {cap} Nachschlage-Quellen. Schalte ein anderes Plugin mit einer Nachschlage-Quelle aus.
plugin-manager.code.crashed = Vom abgesicherten Modus ausgeschaltet: PaperPaw startete damit nicht. Zum erneuten Versuch anschalten.
