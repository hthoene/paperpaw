# The sleep screen of calendar on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin calendar --snapshots plugins/calendar/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = calendar.sleep
profile = xteink-x4
plugins.calendar = on
core.language = en
file = .paperpaw/plugins/calendar/calendar.txt <- calendar.txt

[x4-sleep-de]
screen = calendar.sleep
profile = xteink-x4
plugins.calendar = on
core.language = de
file = .paperpaw/plugins/calendar/calendar.txt <- calendar.txt
