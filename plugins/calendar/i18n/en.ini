calendar.plugin.name = Calendar
calendar.plugin.description = Your calendars on the reader: agenda, day, week and month views from CalDAV, iCal and files, birthdays from contacts, home widgets and a sleep screen.
calendar.plugin.how = "Your calendars on the reader: an agenda of the next days, a day, a week and a month, with the events of CalDAV calendars (Nextcloud, Radicale, Baïkal, Fastmail and others), of iCal addresses (.ics, webcal://), of calendar files on the card and the birthdays and anniversaries of your contacts (CardDAV). The reader only reads calendars; it never changes them.\n\nOpen Calendar from the tools menu. The first row names the view; choose it, or hold any row or press Menu, to switch between Agenda, Day, Week, Month and Birthdays, to add calendars or to sync. In Day and Week the first two rows step to the day or week before and after (the page keys do too); in Month the arrow keys move the day, the page keys the month, and Select opens the day. Select on an event shows it whole: when, where, which calendar and how it repeats. Back goes one step back.\n\nAdd a calendar under Calendars (in the menu, or Calendar in the settings). Choose its kind: a CalDAV account (the server's address is enough, e.g. cloud.example.com/remote.php/dav; every calendar with events becomes part of the view), an iCal address (a calendar published as .ics), a calendar file on the card, or contacts (a CardDAV address book: the reader shows the birthdays and anniversaries stored with them). Enter the address, for an account your user name and a password (best an app password; it is kept with the reader's passwords), and a name. Each calendar has a marking (a dot, a ring, a gray dot or a square) that you can change, so you can tell them apart; up to six calendars.\n\nRepeating events (daily, weekly, monthly, yearly, with days of the week, counts, end dates and left-out days), all-day events and events in other time zones are shown on the reader's own clock. The reader keeps the events from sixty days before to sixty days after today, at most 240, and shows them without the network. Rules it cannot read show their event once.\n\nCalendars are read when you open the calendar (at most every five minutes), when you choose Sync now, and, as you set under Calendar in the settings, when the network is on anyway or when charging begins. The reader never switches its radio on for it, except when you ask for Sync now.\n\nWidgets for the home screen (hold the home screen, then add a widget): Today shows the date and what the day holds, Next event the event that is next, Agenda the next days, Month a month with a dot under the days that have events, and Birthdays the next birthdays. A tap on an event opens it, a tap on a day of the month opens that day. The sleep screen can show today's agenda: choose Calendar under Sleep screen in the settings."
