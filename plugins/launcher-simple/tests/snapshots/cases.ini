# The simple launcher's screens on emulated devices (X4 480x800, X4 Pro), one picture each, by name:
#   paperpaw-dev snapshots --plugin launcher-simple --snapshots plugins/launcher-simple/tests/snapshots
# (`--bless` writes them anew; look at each before committing). The plugin ships off: each case switches it on.

[x4-home]
profile = xteink-x4
plugins.launcher-simple = on
slots.core.home = launcher-simple.home

[x4-home-largest-text]
profile = xteink-x4
plugins.launcher-simple = on
slots.core.home = launcher-simple.home
core.ui-size = 24

[x4-home-german]
profile = xteink-x4
plugins.launcher-simple = on
slots.core.home = launcher-simple.home
core.language = de

[x4-home-focus-moved]
profile = xteink-x4
plugins.launcher-simple = on
slots.core.home = launcher-simple.home
script = right,wait:300

[x4-panel]
screen = launcher-simple.panel
profile = xteink-x4
plugins.launcher-simple = on

[x4-panel-largest-text]
screen = launcher-simple.panel
profile = xteink-x4
plugins.launcher-simple = on
core.ui-size = 24

[x4-library]
screen = launcher-simple.library
profile = xteink-x4
plugins.launcher-simple = on

[x4-customise]
screen = launcher-simple.customise
profile = xteink-x4
plugins.launcher-simple = on

[pro-home]
profile = xteink-x4-pro
plugins.launcher-simple = on
slots.core.home = launcher-simple.home

[pro-panel]
screen = launcher-simple.panel
profile = xteink-x4-pro
plugins.launcher-simple = on
