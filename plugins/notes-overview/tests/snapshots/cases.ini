# The sleep screen of notes-overview on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin notes-overview --snapshots plugins/notes-overview/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = notes-overview.sleep
profile = xteink-x4
plugins.notes-overview = on
core.language = en
file = .paperpaw/plugins/notes-overview/pinned.txt <- pinned.txt

[x4-sleep-de]
screen = notes-overview.sleep
profile = xteink-x4
plugins.notes-overview = on
core.language = de
file = .paperpaw/plugins/notes-overview/pinned.txt <- pinned.txt
