[messages]
notes-overview.plugin.name = Alle Notizen
notes-overview.plugin.description = Die Lesezeichen und Markierungen aller Bücher in einer Liste und ein Export als My Clippings.txt.
notes-overview.plugin.how = "Alle Notizen listet jedes Buch auf, in dem du ein Lesezeichen oder eine Markierung gesetzt hast, mit der Anzahl. Du öffnest es unter Werkzeuge. Wähle ein Buch, um seine Notizen zu sehen, und eine Notiz, um das Buch an dieser Stelle zu öffnen.\n\nAm Ende der Liste schreibt Als My Clippings.txt exportieren alle Notizen in eine Datei im Ordner Exports neben der Bibliothek, in der Form, die ein Kindle nutzt (UTF-8). Apps, die die My Clippings.txt eines Kindle lesen, können sie lesen. Eine Notiz zu einer Markierung ist ein eigener Eintrag, wie beim Kindle. Weil ein Buch hier keine Kindle-Positionen hat, ist „location“ die Stelle im Buch in Prozent. Die Datei wird jedes Mal neu geschrieben und ersetzt die vorige.\n\nHalte eine Notiz gedrückt (oder drücke Menü darauf), um sie an den Ruhebildschirm zu heften; halte die angeheftete Notiz noch einmal gedrückt, um sie zu lösen. Der Ruhebildschirm kann die angeheftete Notiz groß zeigen: wähle Alle Notizen unter Ruhebildschirm in den Einstellungen."
