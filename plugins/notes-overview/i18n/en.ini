[messages]
notes-overview.plugin.name = All notes
notes-overview.plugin.description = The bookmarks and highlights of all books in one list, and an export as My Clippings.txt.
notes-overview.plugin.how = "All notes lists every book in which you made a bookmark or a highlight, with how many. Open it in Tools. Choose a book to see its notes, and a note to open the book at that place.\n\nAt the end of the list, Export as My Clippings.txt writes all the notes into one file, in the folder Exports beside the library, in the form a Kindle uses (UTF-8). Apps that read a Kindle's My Clippings.txt can read it. A note on a highlight is an entry of its own, as on a Kindle. Because a book here has no Kindle locations, \"location\" is how far into the book the note is, in percent. The file is written again each time; it replaces the one before.\n\nHold a note (or press Menu on it) to pin it to the sleep screen; hold the pinned note again to let it go. The sleep screen can show the pinned note large: choose All notes under Sleep screen in the settings."
