format-docx.plugin.description = Öffnet .docx-Dateien, wie Word und andere Programme sie speichern.
format-docx.plugin.how = "Öffnet DOCX-Dokumente (.docx) als Bücher: Überschriften mit Inhaltsverzeichnis, Listen, Tabellen, Fett und Kursiv, Links und Bilder (JPEG, PNG, GIF).\n\nLege die Dateien in den Bibliotheksordner und öffne sie aus der Bibliothek. Titel und Autor stammen aus den Eigenschaften des Dokuments. Fußnoten, Kopf- und Fußzeilen sowie Kommentare werden nicht angezeigt."
