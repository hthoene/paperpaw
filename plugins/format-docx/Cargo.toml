[package]
name = "paperpaw-plugin-format-docx"
description = "PaperPaw DOCX documents: .docx text, headings, lists, tables, links and pictures"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "text-processing"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk = { workspace = true, features = ["unstable"] }

[build-dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-zip = { workspace = true, features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true
