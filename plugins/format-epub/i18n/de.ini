[messages]
format-epub.plugin.name = EPUB
format-epub.plugin.description = Öffnet EPUB-Bücher mit Formatierung, Inhaltsverzeichnis und Bildern.
format-epub.plugin.how = "EPUB-Bücher öffnen sich aus der Bibliothek wie jedes andere Buch, mit Inhaltsverzeichnis, Bildern und der Gestaltung des Verlags. Webseiten (HTML), Markdown, FictionBook (.fb2) und Comic-Archive (.cbz) öffnen sich genauso, jedes als eigenes Plugin.\n\nEin Kapitel wird beim ersten Öffnen umgewandelt und im Zwischenspeicher des Plugins abgelegt. Danach geht es schneller, und auch große Bücher laufen auf kleinen Geräten. Das Inhaltsverzeichnis findest du im Lesemenü. Ob die Gestaltung des Buchs gilt, bestimmt die Einstellung Verlagsformatierung unter Lesen."
format-epub.title = EPUB-E-Book
