[messages]
format-images.plugin.name = Bilder
format-images.plugin.description = Öffnet Bilder (.jpg, .png, .gif) als Bücher, eine Seite je Bild.
format-images.plugin.how = "Bilder (.jpg, .png, .gif) lassen sich wie Bücher aus der Bibliothek öffnen, ein Bild je Seite, an den Bildschirm angepasst.\n\nUm einen ganzen Ordner mit Bildern zu lesen, öffne sein erstes Bild: Die Bilder danach im Ordner folgen in der Reihenfolge ihrer Namen (2 vor 10). Ein späteres Bild beginnt dort; die Leseposition wird für jedes getrennt gemerkt. Von dem geöffneten Bild an werden bis zu 300 Bilder des Ordners gelesen.\n\nEine Datei, die kein Bild oder zu groß ist, zeigt stattdessen ihren Namen. Für viele Bilder mit eigenem Titel ist ein Comic-Archiv (.cbz) die bessere Form."
format-images.title = Bild
