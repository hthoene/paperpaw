[messages]
format-images.plugin.name = Pictures
format-images.plugin.description = Opens pictures (.jpg, .png, .gif) as books, a page each.
format-images.plugin.how = "Pictures (.jpg, .png, .gif) open from the library like books, one picture to a page, fit to the screen.\n\nTo read a whole folder of pictures, open its first picture: the pictures after it in the folder follow, in the order of their names (2 before 10). A picture later in the folder starts there; the place in each is remembered separately. A folder of up to 300 pictures is read from the one you open.\n\nA file that is not a picture, or is too large, shows its name instead. For a book of many pictures with its own title, a comic book archive (.cbz) is the better form."
format-images.title = Picture
