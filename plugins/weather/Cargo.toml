[package]
name = "paperpaw-plugin-weather"
description = "PaperPaw weather: the weather now and the next days as widgets, from Open-Meteo"
version = "1.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native", "testdata"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true
