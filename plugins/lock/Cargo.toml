[package]
name = "paperpaw-plugin-lock"
description = "PaperPaw screen lock: a PIN, a pattern or a password when the device wakes up"
version = "1.0.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native", "testdata"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the table of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-native.workspace = true
paperpaw-platform.workspace = true
proptest.workspace = true

[lints]
workspace = true
