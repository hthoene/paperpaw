[package]
name = "paperpaw-plugin-stats"
description = "PaperPaw reading statistics: time, pages, calendar and books, recorded as KOReader records them"
version = "1.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sqlite.workspace = true
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-ui-kit.workspace = true

[dev-dependencies]
proptest.workspace = true
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }

[lints]
workspace = true
