# The sleep screen of stats on the X4 (480x800), English and German, drawn from the data in data/ (kept as the
# plugin keeps it; the emulator's clock is Wed 14 Oct 2026, 10:41 in Berlin):
#   paperpaw-dev snapshots --plugin stats --snapshots plugins/stats/tests/snapshots
# (`--bless` writes them anew; look at each before committing). `tools/dev/tests/sleep_screens.rs` runs them.

[x4-sleep-en]
screen = stats.sleep
profile = xteink-x4
plugins.stats = on
stats.goal = stats.goal.20
core.language = en
file = .paperpaw/plugins/stats/pages.bin <- pages.bin

[x4-sleep-de]
screen = stats.sleep
profile = xteink-x4
plugins.stats = on
stats.goal = stats.goal.20
core.language = de
file = .paperpaw/plugins/stats/pages.bin <- pages.bin
