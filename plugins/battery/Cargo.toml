[package]
name = "paperpaw-plugin-battery"
description = "PaperPaw battery use: records the battery while the device is awake, with what it did, and shows how long it lasts"
version = "1.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-graphics.workspace = true
paperpaw-native.workspace = true
paperpaw-core.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
proptest.workspace = true
# The pictures the screen goldens are kept as.
png = "0.18"
paperpaw-i18n.workspace = true

[lints]
workspace = true
