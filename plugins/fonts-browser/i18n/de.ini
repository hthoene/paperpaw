fonts-browser.plugin.name = Mehr Schriften
fonts-browser.plugin.description = Zeigt Schriften aus dem Internet, jede mit einer Schriftprobe, und lädt sie zum Lesen herunter.
fonts-browser.title = Mehr Schriften
fonts-browser.more = Mehr Schriften
fonts-browser.own = Eigene Schriften
# The heading in the help text (how/de.txt) where the part about fonts of your own begins.
fonts-browser.own.heading = EIGENE SCHRIFTEN
# The page *Your own fonts* shows: the part of the help (how/de.txt) after its heading, as that file has it.
fonts-browser.own.text = "Neben Mehr Schriften hat dieselbe Liste den Eintrag Eigene Schriften, der diesen Teil der Hilfe zeigt. Eine eigene Schrift ist eine .ttf- oder .otf-Datei, zum Beispiel von Google Fonts.\n\nAuf Android und anderen Geräten, die Schriftdateien zeichnen: Kopiere die Datei in den Ordner fonts (auf Android: PaperPaw/fonts im gemeinsamen Speicher), starte PaperPaw neu und wähle die Schrift in den Einstellungen unter Lesen bei Schriftart.\n\nAuf dem Xteink X4 und X4 Pro: Diese Lesegeräte lesen Schriftpakete, keine Schriftdateien, denn Schriftdateien passen nicht in ihren Speicher. Erstelle ein Paket am Computer mit paperpaw-fontgen, für jeden Schnitt, den du hast (Normal ist nötig):\n\npaperpaw-fontgen --family \"Meine Schrift\" --regular Meine-Normal.ttf --bold Meine-Fett.ttf --italic Meine-Kursiv.ttf plugins\n\nDas erzeugt den Ordner plugins/font-meine-schrift. Kopiere ihn in den Ordner plugins auf der Speicherkarte, starte neu und wähle Meine Schrift bei Schriftart. Ein Paket mit einem Schnitt hat für lateinische Buchstaben etwa ein halbes Megabyte; Schnitte, die du weglässt, werden in Normal gezeichnet. Das Werkzeug sagt, wie viele der verlangten Zeichen die Schrift hat (--chars latin,cyrillic,greek fügt Schriften hinzu): Eine Schrift ohne die Buchstaben deines Buches kann sie nicht zeigen, such also eine, die deren Schrift abdeckt.\n\nSchriften aus Mehr Schriften funktionieren genauso und brauchen keinen Computer.\n\nFür schärfere kleine Schrift auf dem E-Ink-Display füge --hinting light zum Befehl hinzu: Es passt die Buchstaben ans Pixelraster an, so wie die mitgelieferten Schriften gemacht sind. Ohne das werden die Buchstaben gezeichnet, wie die Schrift sie entworfen hat; --hinting normal und --hinting mono passen sie stärker an. Schriften mit Zeichen über oder unter den Buchstaben, wie Arabisch oder Devanagari, lässt man besser ohne."
