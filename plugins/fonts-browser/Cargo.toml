[package]
name = "paperpaw-plugin-fonts-browser"
description = "PaperPaw fonts from the internet: browse a catalog of fonts with a sample of each, download one and read with it"
version = "1.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the table of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-native.workspace = true
paperpaw-digest.workspace = true
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-platform.workspace = true
paperpaw-text.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }

[lints]
workspace = true
