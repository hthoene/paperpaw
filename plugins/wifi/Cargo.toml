[package]
name = "paperpaw-plugin-wifi"
description = "PaperPaw Wi-Fi: joins networks when needed, switches the radio off after, and the page to choose networks"
version = "1.0.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "i18n", "build.rs", "declarations.rs", "native"]

[features]
linked = []
native-entry = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-qr.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the tables a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-native.workspace = true
paperpaw-scripted-host = { path = "../../crates/paperpaw-scripted-host" }
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-i18n.workspace = true
proptest.workspace = true

[lints]
workspace = true
