[package]
name = "paperpaw-plugin-widgets"
description = "PaperPaw widget pack: clocks, calendars, quotes, books, notes and more for the home screen"
version = "1.0.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[package.metadata.paperpaw]
# What the plugin reads from its folder on the card: the store's package
# holds these files (tools/plugin-files/catalogue.py).
card-files = ["data/quotes.*.txt", "pictures/*.png"]

[features]
linked = []
native-entry = []
# PaperPaw's quotes carried in the code (the plugin as part of an app); a
# plugin file for a reader is built without them and reads them from its
# folder.
default = ["embedded-quotes"]
embedded-quotes = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-ui-kit.workspace = true

[build-dependencies]
# `kernel` only for the build script (not unified with the plugin's own use of
# the SDK): it makes the table of settings a linked build keeps in the program.
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-ui-kit.workspace = true

[dev-dependencies]
paperpaw-native.workspace = true
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-graphics.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs", "outline"] }
paperpaw-plugin-home.workspace = true
proptest.workspace = true

[lints]
workspace = true
