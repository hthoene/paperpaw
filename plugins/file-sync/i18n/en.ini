file-sync.setting.when = Sync automatically
file-sync.setting.when.help = Only when you ask, also when the charger is plugged in (at most every six hours), or also when Wi-Fi is on anyway (at most daily). Waking the reader never turns Wi-Fi on.
file-sync.when.manual = Only when asked
file-sync.when.charging = With the charger
file-sync.when.online = With the charger and when online
file-sync.setting.folder = Folder on the card
file-sync.setting.folder.help = The folder of the card that is kept in sync, for example Notes. Its folders inside are synced too; hidden files and folders (starting with a dot) are not.
file-sync.setting.mode = Sync mode
file-sync.setting.mode.help = Both ways: changes go in both directions. Download only: the card follows the server and nothing is changed on the server.
file-sync.mode.two-way = Both ways
file-sync.mode.download = Download only
file-sync.setting.server = Server folder
file-sync.setting.server.help = The address of a WebDAV folder, for example https://cloud.example.org/remote.php/dav/files/me/Notes
file-sync.setting.user = User
file-sync.setting.user.help = The user name for the server. Empty: no account.
