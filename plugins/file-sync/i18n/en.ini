file-sync.pending.count.other = {count} files
file-sync.help = Choose a pair, enter the folder and the server, then Sync now. A file changed on one side goes to the other; changed on both, both are kept.
# {name} is a file, {done} its place in the folder being synced, {all} the files of that folder.
file-sync.progress = Syncing {name}: {done} of {all} in this folder.
# The numbers of files received from the server, sent to it, deleted, kept twice and not synced.
file-sync.summary = Synced. Received {down}, sent {up}, deleted {deleted}, kept twice {conflicts}, not synced {errors}.
file-sync.held = Many deletions were held back: those files were kept.
file-sync.no-pair = Set up a pair first: the folder on the card and the server.
file-sync.bad-folder = Choose a folder of the card, not the card itself and not a hidden or system folder.
file-sync.bad-url = The address must start with http:// or https://.
file-sync.no-network = The server cannot be reached. What was done stays; the next sync goes on.
file-sync.denied = The server did not accept the user name or password.
file-sync.not-found = A folder was not found on the server.
file-sync.full = The card is full.
file-sync.cancelled = Syncing was stopped.
file-sync.broke-off = Syncing broke off: the reader ran short of memory or could not read the card or the password. What was done stays; the next sync goes on.
file-sync.failed = Some files could not be synced. They are tried again next time.
file-sync.too-many = A folder has more than 200 files: it was left as it is.
file-sync.too-many-folders = A folder holds more than 64 folders or lies more than six levels deep: those folders were left as they are.
file-sync.too-large = A file is larger than 64 MB and was left as it is.
file-sync.not-kept = The password could not be kept.
file-sync.password-dropped = This is another server: the password was taken away. Enter the password for this server.
