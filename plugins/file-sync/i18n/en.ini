[meta]
language = en
name = English
plural = one-other

[messages]
file-sync.plugin.name = File sync
file-sync.plugin.description = Keeps folders of the card in sync with your own server (WebDAV), in both directions, without losing a file.
file-sync.title = File sync
file-sync.open = File sync
file-sync.sync = Sync now
file-sync.syncing = Syncing …
file-sync.syncing.short = Syncing …
file-sync.pair = Folder pair
file-sync.pair-1.title = File sync: pair 1
file-sync.pair-2.title = File sync: pair 2
file-sync.pair-3.title = File sync: pair 3
# {n} is the number of the pair.
file-sync.pair.row = Pair {n}
file-sync.pair.empty = not set up
file-sync.pair.help = Enter the folder on the card and the address of the server folder (a WebDAV folder, for example https://cloud.example.org/remote.php/dav/files/me/Notes). The user and the password are kept for this pair only.
file-sync.setting.when = Sync automatically
file-sync.setting.when.help = Only when you ask, also when the charger is plugged in (at most every six hours), or also when Wi-Fi is on anyway (at most daily). Waking the reader never turns Wi-Fi on.
file-sync.when.manual = Only when asked
file-sync.when.charging = With the charger
file-sync.when.online = With the charger and when online
file-sync.setting.folder = Folder on the card
file-sync.setting.folder.help = The folder of the card that is kept in sync, for example Notes. Its folders inside are synced too; hidden files and folders (starting with a dot) are not.
file-sync.setting.mode = Sync mode
file-sync.setting.mode.help = Both ways: changes go in both directions. Download only: the card follows the server and nothing is changed on the server.
file-sync.mode.two-way = Both ways
file-sync.mode.download = Download only
file-sync.setting.server = Server folder
file-sync.setting.server.help = The address of a WebDAV folder, for example https://cloud.example.org/remote.php/dav/files/me/Notes
file-sync.setting.user = User
file-sync.setting.user.help = The user name for the server. Empty: no account.
file-sync.password = Password
# {n} is the number of the pair.
file-sync.secret.password = File sync password, pair {n}
file-sync.widget.last = Last sync
file-sync.widget.pending = Pending changes
file-sync.widget.button = Sync now
file-sync.never = never
# {count} is a number of files of the card that are not on the server yet.
file-sync.pending.count.one = {count} file
file-sync.pending.count.other = {count} files
file-sync.help = Choose a pair, enter the folder and the server, then Sync now. A file changed on one side goes to the other; changed on both, both are kept.
# {name} is a file, {done} its place in the folder being synced, {all} the files of that folder.
file-sync.progress = Syncing {name}: {done} of {all} in this folder.
# The numbers of files received from the server, sent to it, deleted, kept twice and not synced.
file-sync.summary = Synced. Received {down}, sent {up}, deleted {deleted}, kept twice {conflicts}, not synced {errors}.
file-sync.held = Many deletions were held back: those files were kept.
file-sync.no-pair = Set up a pair first: the folder on the card and the server.
file-sync.bad-folder = Choose a folder of the card, not the card itself and not a hidden or system folder.
file-sync.bad-url = The address must start with http:// or https://.
file-sync.no-network = The server cannot be reached. What was done stays; the next sync goes on.
file-sync.denied = The server did not accept the user name or password.
file-sync.not-found = A folder was not found on the server.
file-sync.full = The card is full.
file-sync.cancelled = Syncing was stopped.
file-sync.failed = Some files could not be synced. They are tried again next time.
file-sync.too-many = A folder has more than 256 files or lies too deep: it was left as it is.
file-sync.too-large = A file is larger than 64 MB and was left as it is.
file-sync.not-kept = The password could not be kept.
