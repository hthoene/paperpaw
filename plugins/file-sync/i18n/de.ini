[messages]
file-sync.plugin.name = Dateisync
file-sync.plugin.description = Hält Ordner der Karte mit deinem eigenen Server (WebDAV) in beide Richtungen auf dem gleichen Stand, ohne eine Datei zu verlieren.
file-sync.plugin.how = "Dateisync hält Ordner der Karte im Gleichschritt mit Ordnern auf deinem eigenen Server: ein Notizen-Vault, ein Bücherordner, Dokumente. Es arbeitet mit Servern, die WebDAV sprechen: selbst gehostete Clouds, ein NAS und andere. Es ist zunächst aus: Hole es aus dem Plugin-Store.\n\nEin Paar einrichten: Öffne Dateisync (Werkzeuge), wähle Paar 1 und gib den Ordner auf der Karte (zum Beispiel Notizen), die Adresse des WebDAV-Ordners, den Benutzer und das Passwort ein. Das Passwort liegt bei den Passwörtern und Schlüsseln, nur für dieses Paar. Es gibt drei Paare. Der Abgleichmodus bestimmt, ob Änderungen in beide Richtungen gehen (Standard) oder nur vom Server zur Karte.\n\nZusammen mit Syncthing: Der Reader hat kein eigenes Syncthing, aber Dateisync kann den Ordner nutzen, den Syncthing zwischen deinen Geräten abgleicht. 1. Starte auf dem PC (oder NAS) mit dem Syncthing-Ordner einen WebDAV-Server auf diesem Ordner, zum Beispiel rclone serve webdav --addr :8080 --user ich --pass geheim /pfad/zum/ordner (beim NAS: den WebDAV-Dienst einschalten). 2. Suche die Adresse des PCs im Heimnetz, zum Beispiel 192.168.1.20. 3. Lege in Dateisync ein Paar an: den Ordner auf der Karte (zum Beispiel Bücher), die Adresse http://192.168.1.20:8080/ sowie Benutzer und Passwort aus Schritt 1. 4. Verbinde den Reader mit demselben WLAN und wähle Jetzt abgleichen. Syncthing gibt die Änderungen dann an deine anderen Geräte weiter und bringt deren Änderungen in den Ordner zurück. Nutze das nur im Heimnetz: http:// ohne https:// ist nicht verschlüsselt. Der PC muss laufen, während der Reader abgleicht.\n\nJetzt abgleichen (in Dateisync, unter Werkzeuge oder im Widget) geht die Ordner nacheinander durch und zeigt, was es gerade tut, danach, was es getan hat: Dateien empfangen, gesendet, gelöscht, doppelt behalten und nicht abgeglichen. Abgeglichen wird auch, wenn das Ladegerät angesteckt wird oder das WLAN ohnehin an ist, wenn du es unter Automatisch abgleichen so wählst (höchstens alle sechs Stunden oder täglich); das Aufwachen schaltet das WLAN nie ein.\n\nNichts geht verloren. Eine nur auf einer Seite geänderte Datei geht auf die andere. Eine auf beiden Seiten geänderte Datei bleibt doppelt: Die Kopie der Karte wird umbenannt, zum Beispiel Notiz (conflict x4 2026-11-18).md, die des Servers kommt unter den alten Namen; die Kopie geht auch auf den Server. Eine auf einer Seite gelöschte und auf der anderen unveränderte Datei wird auch auf der anderen Seite gelöscht; die Kopie der Karte geht in einen Papierkorb (im Ordner des Plugins .paperpaw/plugins/file-sync/trash, die letzten 100), kann also zurückgeholt werden. Eine auf einer Seite gelöschte und auf der anderen geänderte Datei bleibt. Würde ein Ordner auf einmal mehr als die Hälfte seiner Dateien verlieren, werden die Löschungen zurückgehalten und die Dateien bleiben. Jede Datei wird ganz geschrieben oder gar nicht, und nach einem Netzabbruch oder Stromausfall macht der nächste Abgleich dort weiter, wo er stehen blieb.\n\nGrenzen: bis zu 256 Dateien in einem Ordner, Ordner bis sechs Ebenen tief, Dateien bis 64 MB; ein Ordner darüber bleibt, wie er ist. Versteckte Dateien und Ordner (mit einem Punkt am Anfang) werden nicht abgeglichen. Nur herunterladen ändert den Server nie. Zwei Dateien gelten als gleich, wenn beide Seiten die gleiche Größe haben und noch nie abgeglichen wurden; bei anderer Größe bleiben beide.\n\nWidgets für den Startbildschirm: Letzter Abgleich, Offene Änderungen (die Dateien der Karte, die noch nicht gesendet sind, nach dem letzten Blick) und Jetzt abgleichen."
