file-sync.setting.when = Automatisch abgleichen
file-sync.setting.when.help = Nur auf Wunsch, auch wenn das Ladegerät angesteckt wird (höchstens alle sechs Stunden) oder auch wenn das WLAN ohnehin an ist (höchstens täglich). Das Aufwachen schaltet das WLAN nie ein.
file-sync.when.manual = Nur auf Wunsch
file-sync.when.charging = Mit dem Ladegerät
file-sync.when.online = Mit dem Ladegerät und wenn online
file-sync.setting.folder = Ordner auf der Karte
file-sync.setting.folder.help = Der Ordner der Karte, der abgeglichen wird, zum Beispiel Notizen. Auch seine Unterordner werden abgeglichen; versteckte Dateien und Ordner (mit einem Punkt am Anfang) nicht.
file-sync.setting.mode = Abgleichmodus
file-sync.setting.mode.help = In beide Richtungen: Änderungen gehen in beide Richtungen. Nur herunterladen: Die Karte folgt dem Server, auf dem Server wird nichts geändert.
file-sync.mode.two-way = In beide Richtungen
file-sync.mode.download = Nur herunterladen
file-sync.setting.server = Serverordner
file-sync.setting.server.help = Die Adresse eines WebDAV-Ordners, zum Beispiel https://cloud.example.org/remote.php/dav/files/ich/Notizen
file-sync.setting.user = Benutzer
file-sync.setting.user.help = Der Benutzername für den Server. Leer: kein Konto.
file-sync.password = Passwort
# {n} is the number of the pair.
file-sync.secret.password = Dateisync-Passwort, Paar {n}
file-sync.widget.last = Letzter Abgleich
file-sync.widget.pending = Offene Änderungen
file-sync.widget.button = Jetzt abgleichen
file-sync.never = noch nie
# {count} is a number of files of the card that are not on the server yet.
file-sync.pending.count.one = {count} Datei
file-sync.pending.count.other = {count} Dateien
file-sync.help = Wähle ein Paar, gib Ordner und Server ein und wähle dann Jetzt abgleichen. Eine auf einer Seite geänderte Datei geht auf die andere; auf beiden geändert, bleiben beide.
# {name} is a file, {done} its place in the folder being synced, {all} the files of that folder.
file-sync.progress = Gleiche {name} ab: {done} von {all} in diesem Ordner.
# The numbers of files received from the server, sent to it, deleted, kept twice and not synced.
file-sync.summary = Abgeglichen. Empfangen {down}, gesendet {up}, gelöscht {deleted}, doppelt behalten {conflicts}, nicht abgeglichen {errors}.
file-sync.held = Viele Löschungen wurden zurückgehalten: Diese Dateien blieben erhalten.
file-sync.no-pair = Richte zuerst ein Paar ein: den Ordner auf der Karte und den Server.
file-sync.bad-folder = Wähle einen Ordner der Karte, nicht die Karte selbst und keinen versteckten oder Systemordner.
file-sync.bad-url = Die Adresse muss mit http:// oder https:// beginnen.
file-sync.no-network = Der Server ist nicht erreichbar. Was getan ist, bleibt; der nächste Abgleich macht weiter.
file-sync.denied = Der Server hat Benutzer oder Passwort nicht angenommen.
file-sync.not-found = Ein Ordner wurde auf dem Server nicht gefunden.
file-sync.full = Die Karte ist voll.
file-sync.cancelled = Der Abgleich wurde angehalten.
file-sync.failed = Einige Dateien konnten nicht abgeglichen werden. Sie werden beim nächsten Mal wieder versucht.
file-sync.too-many = Ein Ordner hat mehr als 256 Dateien oder liegt zu tief: Er blieb, wie er ist.
file-sync.too-large = Eine Datei ist größer als 64 MB und blieb, wie sie ist.
file-sync.not-kept = Das Passwort konnte nicht gespeichert werden.
