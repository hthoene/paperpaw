# Linked as tools/plugin-host-libs links PaperPaw's own plugins for the
# emulator (code-host.so). Never set RUSTFLAGS: it would replace this.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-arg=-Wl,-T../../tools/plugin-host-libs/paperpaw-host.ld",
    "-C", "jump-tables=no",
    "-C", "link-arg=-shared",
    "-C", "link-arg=-Wl,--version-script=../../tools/plugin-host-libs/paperpaw-host.map",
]
