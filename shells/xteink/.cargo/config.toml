# The X4's chip: an ESP32-C3 (RISC-V). `cargo run --release` flashes it
# with espflash (`cargo install espflash`) and shows its log. The OTA data
# is erased, so the firmware flashed starts rather than one installed as
# an update before.
#
# The X4 Pro's: an ESP32-S3 (Xtensa), with the `esp` toolchain (espup):
# `cargo +esp x4pro` builds it, `cargo +esp x4pro-run` flashes it (over
# the stock firmware, hold its power button meanwhile: its boot loader
# does not keep it on; PaperPaw does). The X4 Classic's alike:
# `cargo +esp x4classic`, `cargo +esp x4classic-run`.
[build]
target = "riscv32imc-unknown-none-elf"
# No compiler wrapper such as sccache, even if one is set for all builds:
# the firmware's link-time optimisation fails through it, without a message.
rustc-wrapper = ""

[alias]
x4pro = "build --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote,waveform-lab -Zbuild-std=core,alloc"
x4pro-run = "run --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote,waveform-lab -Zbuild-std=core,alloc"
x4pro-clippy = "clippy --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote,waveform-lab -Zbuild-std=core,alloc"
# Compatibility aliases: Bluetooth is included in x4-pro now.
x4pro-bt = "build --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote,bluetooth -Zbuild-std=core,alloc"
x4pro-bt-run = "run --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote,bluetooth -Zbuild-std=core,alloc"
x4classic = "build --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-classic,remote -Zbuild-std=core,alloc"
# With its own partitions, which keep the factory's NVS (see
# `partitions-classic.csv`).
x4classic-run = [
    "run", "--release", "--target", "xtensa-esp32s3-none-elf", "--no-default-features",
    "--features", "x4-classic,remote", "-Zbuild-std=core,alloc", "--config",
    'target.xtensa-esp32s3-none-elf.runner = "espflash flash --monitor --chip esp32s3 --erase-parts otadata --partition-table partitions-classic.csv"',
]
x4classic-clippy = "clippy --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-classic,remote -Zbuild-std=core,alloc"
# The X3 (experimental): the X4's chip, built as the X4 is.
x3 = "build --release --no-default-features --features x3,remote"
x3-run = "run --release --no-default-features --features x3,remote"
x3-clippy = "clippy --release --no-default-features --features x3,remote"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --erase-parts otadata"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3 --erase-parts otadata"
# Frame pointers for backtraces; the linker script is in build.rs.
# Jump tables stay on for the default builds (about 9 KB of flash less than
# without). The `ppn5` build is the exception: its frame scan
# (`paperpaw-sign frames`, `frame-budget-ppn5.txt`) cannot yet size a function
# that jumps through a table inside its frame (todo 68 of #228), so it is built
# with `-C jump-tables=no`, given on the command line beside these flags:
#   cargo build ... --features x4,ppn5 \
#     --config 'target.riscv32imc-unknown-none-elf.rustflags=["-C","jump-tables=no"]'
# (cargo joins the lists). build.rs fails a `ppn5` build without it.
rustflags = ["-C", "force-frame-pointers"]

[env]
ESP_LOG = "info"
# Calls a panic's backtrace captures (10 by default): the crash file
# keeps 16, and the plugin to blame is looked for in all (`crash.rs`).
# 256 bytes of the panicking stack.
ESP_BACKTRACE_CONFIG_BACKTRACE_FRAMES = "64"
# Font packs: code and data share the 8 MB of flash the chip maps and an
# app partition's 7.9 MB (and an update's download), so up to 36 px
# (about 12 pt on its 220 dpi screen), not the 40 and 48 px of larger
# screens.
PAPERPAW_FONT_SIZES = "20,24,28,32,36"
# Lean font packs: Literata's regular face alone (no bold, italic or bold
# italic: some 531 + 386 KB; the data plugin `literata-styles` brings bold
# and italic from the card, the store fetches it by itself, and regular
# text stands in until then) and only up to 32 px (36 px some 370 KB
# more); the font library has the rest, so updates keep room in the slots.
PAPERPAW_FONT_LEAN = "1"
