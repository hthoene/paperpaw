[package]
name = "paperpaw-emulator"
description = "PaperPaw desktop shell: an e-ink device emulator with device profiles and memory budgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "paperpaw-emu"
path = "src/main.rs"
required-features = ["window"]

[dependencies]
paperpaw-app = { workspace = true, features = ["outline", "packs"] }
paperpaw-core = { workspace = true, features = ["color", "outline"] }
paperpaw-table.workspace = true
paperpaw-fs.workspace = true
paperpaw-serve.workspace = true
paperpaw-http.workspace = true
paperpaw-graphics = { workspace = true, features = ["color"] }
paperpaw-platform.workspace = true
paperpaw-default-packs.workspace = true
png = "0.18"
softbuffer = { version = "0.4", optional = true }
# Without client-side decorations on Wayland: they pull in the unmaintained
# `ttf-parser` (RUSTSEC-2026-0192).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }
# The sample plugin of `docs/plugins.md`, with `--features hello`.
paperpaw-sample-hello = { path = "../../samples/hello-plugin", optional = true }
# The sample that runs in real time (ADR 0030), with `--features frame-test`.
paperpaw-sample-frame-test = { path = "../../samples/frame-test", optional = true }
# The interlinear sample (ADR 0032), with `--features interlinear`.
paperpaw-sample-interlinear = { path = "../../samples/interlinear", optional = true }

# What a browser does not give Rust: it hands time and random numbers in
# (see `host`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The computer's random numbers, for keys (`KernelBuilder::random`).
getrandom = "0.4"
# The computer's time zone for the emulated clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Code plugins built for this computer (`native`).
libloading = "0.9"
# What seals the secrets of linked native plugins (`sealing`, AES-256-GCM).
aes-gcm = { version = "0.10", optional = true, default-features = false, features = ["aes", "zeroize"] }
# The key is wiped from memory when it is dropped.
zeroize = { version = "1", optional = true }
# What is checked on a plugin's bytes before it is loaded (ADR 0034); the
# kernel's part is the freestanding rule shared with the packager (ADR 0020).
paperpaw-native = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-sdk.workspace = true
paperpaw-text.workspace = true
# The memory tests build a book with ZipBuilder.
paperpaw-zip = { workspace = true, features = ["testing"] }
# And a language of an Arabic interface's size, compiled (ADR 0033).
paperpaw-i18n.workspace = true
paperpaw-digest.workspace = true
# A server and a certificate of its own, for the TLS sockets' tests (the
# same crates and features as `paperpaw-serve`'s, already in the lock).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# The German pack of the snapshot with hyphenated German names, built from the
# same sources as the shipped one.
paperpaw-hyphenation-packs = { path = "../../tools/hyphenation-packs" }

[build-dependencies]
serde_json = "1"
# The compiler that builds the emulator, as plugin files name theirs.
paperpaw-native.workspace = true

[features]
default = ["window"]
# The `paperpaw-emu` window; without it the device model alone, for tools
# and for the browser (`shells/web`).
window = ["dep:winit", "dep:softbuffer"]
hello = ["dep:paperpaw-sample-hello"]
frame-test = ["dep:paperpaw-sample-frame-test"]
interlinear = ["dep:paperpaw-sample-interlinear"]
# The first-party plugins that are interface-7 plugins, linked in and
# registered by `linked` (Linux x86-64, the one profile they declare; elsewhere
# the app keeps their interface-6 form). Off until every host service and
# event the plugins need is wired (#2220): the app without their interface-6
# form lacks the screens of the ones that cannot register yet.
native-linked = ["paperpaw-app/native-linked", "dep:aes-gcm", "dep:zeroize"]

[lints]
workspace = true
