[package]
name = "paperpaw-core"
description = "The PaperPaw kernel: plugin host, registries, input routing and rendering (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["e-reader", "e-ink", "epaper"]

[features]
default = []
# The reader is the linked native plugin (the app's `native-linked-reading`):
# the book menu's *Open with…* is not registered, as its resolver is
# interface 6's, not carried by interface 7 (`docs/abi/document.md` 1).
native-reading = []
# Counts every named host-slot entry per thread (`native_host::host_slot::
# slot_counts`), for the page-turn cost guard. Needs std; never a default,
# never in firmware.
slot-counts = []
# The measurement build of the X4 (`test-image`): names the slot that began last.
slot-names = []
# Colour framebuffers for colour e-ink panels.
color = ["paperpaw-graphics/color"]
# Scalable OpenType/TrueType fonts; not available on the ESP32-C3.
outline = ["paperpaw-sdk/outline"]
# Closes the X4's nested-callback stack gate again (`ui_store::nested_closed`):
# `stage.run`, `ui.compose`, the widget ops 7 and 12-15 and op 14 then answer
# `ERR_UNSUPPORTED` on the small memory class. The gate is open by default since
# the device measurement passed (#250: lowest stack left 14,720 B on the X4); this
# feature is the way back if a route turns out too deep.
x4-gate-closed = []
# Wires host slot 30 (`text.ink`) on the X4 and the X4 Pro too, where it stays
# unwired until it is timed on the device (`docs/abi/screens-input.md`): text
# and icons are then centred by their ink, as in the emulator. For the owner's
# X4 test image that times it (#250); off by default.
x4-ink = []
# The kernel's Bluetooth radio model (`io/bluetooth`, `bluetooth.rs`, ADR 0027):
# for the shells of devices that have Bluetooth (the X4 Pro's `bluetooth`
# feature, the desktop, Android and web shells, the tests). Without it the
# kernel answers every Bluetooth command as `off` and is 17-22 KB smaller
# (#306). The SDK's Bluetooth types are there either way.
bluetooth = []
# What the app's and the shells' tests ask the kernel and a shell never does
# (`Kernel::native_is_parked`): never in a firmware build (#248, D1).
testing = []

[dependencies]
paperpaw-native = { workspace = true, features = ["kernel"] }
paperpaw-platform.workspace = true
paperpaw-config.workspace = true
paperpaw-graphics.workspace = true
paperpaw-i18n = { workspace = true, features = ["kernel"] }
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-hid.workspace = true
paperpaw-hyphen = { workspace = true, features = ["kernel"] }
paperpaw-sort.workspace = true
paperpaw-digest.workspace = true
paperpaw-document.workspace = true
paperpaw-lang.workspace = true
paperpaw-text.workspace = true

[dev-dependencies]
# Tests' screens (`testing`) for the tests in `tests/`.
paperpaw-core = { path = ".", features = ["testing", "bluetooth"] }
# The library's moves on a real FAT card (native_host/lib_moves_fat_tests.rs).
paperpaw-fat.workspace = true
# The stack depth of the files service on that card, held to the device's (#256).
paperpaw-stack-budget.workspace = true
# By path alone, without a version: these plugins depend on this crate, and
# cargo drops a dev-dependency that has no version when it publishes, so the
# two do not wait for each other (`publish-workspace.py --dry-run` found the cycle).
paperpaw-plugin-battery = { path = "../../plugins/battery", features = ["linked"] }
paperpaw-plugin-widgets = { path = "../../plugins/widgets", features = ["linked"] }
paperpaw-plugin-fonts-default = { path = "../../plugins/fonts-default", features = ["packs"] }
png = "0.18"
# The kit's picture tests write their pictures (tests/kit_thumbnail.rs).
paperpaw-image.workspace = true
paperpaw-platform = { workspace = true, features = ["fake"] }
# Scalable fonts for the stock screens' tests that draw text (tests/stock_screens.rs).
paperpaw-text = { workspace = true, features = ["outline"] }
proptest.workspace = true

[lints]
workspace = true
