[package]
name = "paperpaw-core"
description = "The PaperPaw kernel: plugin host, registries, input routing and rendering (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["e-reader", "e-ink", "epaper"]

[features]
default = []
# A list and its detail beside each other on wide screens (`src/panes.rs`).
# Asked for, never a default: the Xteink firmware, never wide, builds without
# it to save its code, and a default-off dependency keeps every crate that
# names this one (the plugins' dev-dependency) as it was published. The app's
# `panes` feature (on by default in its defaults) asks for it; the SDK is
# the same either way. In the kernel's own tests: `--features panes`.
panes = []
# The reader is the linked native plugin (the app's `native-linked-reading`):
# the book menu's *Open with…* is not registered, as its resolver is
# interface 6's, not carried by interface 7 (`docs/abi/document.md` 1).
native-reading = []
# Colour framebuffers for colour e-ink panels.
color = ["paperpaw-graphics/color"]
# Scalable OpenType/TrueType fonts; not available on the ESP32-C3.
outline = ["paperpaw-sdk/outline"]
# Opens the X4's nested-callback stack gate (`ui_store::nested_closed`):
# `stage.run`, `ui.compose`, the widget ops 7 and 12-15 and op 14 run another
# plugin's callback inside the caller's on the small memory class too. For the
# owner's X4 test image until the device measurement passes (#250), then the
# X4 release; off by default.
x4-nested = []
# What the app's and the shells' tests ask the kernel and a shell never does
# (`Kernel::native_is_parked`): never in a firmware build (#248, D1).
testing = []

[dependencies]
paperpaw-native = { workspace = true, features = ["kernel"] }
paperpaw-platform.workspace = true
paperpaw-config.workspace = true
paperpaw-graphics.workspace = true
paperpaw-i18n = { workspace = true, features = ["kernel"] }
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-hid.workspace = true
paperpaw-hyphen = { workspace = true, features = ["kernel"] }
paperpaw-sort.workspace = true

[dev-dependencies]
# The library's moves on a real FAT card (native_host/lib_moves_fat_tests.rs).
paperpaw-fat.workspace = true
paperpaw-plugin-battery = { workspace = true, features = ["linked"] }
paperpaw-plugin-widgets = { workspace = true, features = ["linked"] }
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
png = "0.18"
paperpaw-platform = { workspace = true, features = ["fake"] }
paperpaw-text.workspace = true
paperpaw-table.workspace = true
# Loads a native plugin built apart (tests/native_plugin.rs).
libloading = "0.9"
proptest.workspace = true

[lints]
workspace = true
