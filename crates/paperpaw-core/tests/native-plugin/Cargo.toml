[package]
name = "paperpaw-test-native-plugin"
description = "A native plugin built apart from the kernel, for ../native_plugin.rs"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as a plugin's own repository is.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
paperpaw-sdk = { path = "../../../paperpaw-sdk" }
paperpaw-sample-hello = { path = "../../../../samples/hello-plugin" }
paperpaw-text = { path = "../../../paperpaw-text" }
paperpaw-graphics = { path = "../../../paperpaw-graphics" }
paperpaw-platform = { path = "../../../paperpaw-platform" }

[features]
# The emulator's build has outline fonts, which are in the fingerprint of
# the plugins it loads (`tools/compat-e2e.sh` builds one with it).
outline = ["paperpaw-sdk/outline"]

# Built otherwise than the test that loads it: its types' TypeIds differ.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
panic = "abort"
