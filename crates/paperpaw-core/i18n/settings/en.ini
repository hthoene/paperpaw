core.setting.language.help = Language of menus and messages.
core.setting.device-name.help = The name Calibre, your router and others see; used from the next connection.
core.setting.night-mode.help = White text on black.
core.setting.night-pictures = Invert pictures
core.setting.night-pictures.help = Off: covers and photos as they are, not as negatives.
core.setting.mono-text = Text darkness
core.setting.mono-text.help = How bold letters are on black-and-white screens; full helps on pale screens.
core.setting.speak-focus.help = Says the row or button the buttons move to.
core.setting.voice = Voice
core.setting.voice.help = Automatic uses the system's voice, else a plugin's for the language.
core.setting.ui-size.help = Size of menus, lists and the status line.
core.setting.keymap-preset.help = What the device's buttons do.
core.setting.full-refresh-interval.help = A flashing refresh after this many page turns removes ghosting; 0 never flashes.
core.setting.flash-screens = Flash on screen change
core.setting.flash-screens.help = Redraw fully when a screen opens: no traces of the last one, but slower.
core.setting.pictures-in-grays = Pictures in grays
core.setting.pictures-in-grays.help = Draws pictures such as covers in four grays: finer, but a little slower.
core.setting.sleep-after.help = Idle minutes before sleep; 0: never.
core.setting.notice-seconds.help = How long short messages such as “Sync done” stay on the screen.
core.setting.ui-header.help = How the title at the top of menus and lists looks.
core.setting.ui-corners = Corners
core.setting.ui-corners.help = Of highlighted rows, buttons and boxes.
core.setting.ui-contrast = Contrast
core.setting.ui-contrast.help = Strong draws gray hints and notes in black.
core.setting.ui-focus = Selected row
core.setting.ui-focus.help = How the chosen row is shown.
core.setting.ui-separators = Lines between rows
core.setting.ui-separators.help = Light lines, fainter lines from where the text starts, or none.
core.setting.ui-groups = List sections
core.setting.ui-groups.help = The sections of lists as they are or on rounded cards.
core.setting.ui-title = Title size
core.setting.ui-title.help = Size of the titles at the top of menus and lists, in percent of the text's.
core.setting.ui-margin.help = Space at the left and right of menus and lists.
core.setting.ui-row.help = Height of the rows of menus and lists, relative to their text.
core.setting.ui-lines.help = How thick lines and frames are drawn.
core.setting.network-manager.help = Advanced. The plugin that connects to Wi-Fi when a network is wanted; empty: none.
core.setting.logo.help = Path of a JPEG or PNG shown instead of PaperPaw's logo; empty: the usual one.
core.setting.ui-palette.help = Colours by purpose, e.g. muted=60 line=170 link=#2a6f97 (0 black, 255 white).
core.setting.text-curve.help = Edge tone of book letters: smooth, sharp:128, or 16 numbers 0-255.
core.setting.ui-text-curve.help = Advanced. The same for menus and lists.
core.setting.long-press-ms.help = How long to hold a button or finger for a long press.
core.setting.double-tap-ms.help = How quickly the second tap or press must follow the first.
core.setting.tap-slop.help = How far a finger may move and still tap.
core.setting.swipe-distance.help = How far a finger must move to swipe.
core.setting.frontlight.help = How bright the front light is; 0 switches it off.
core.setting.frontlight-warmth.help = How warm the front light is: 0 cold, 100 warm.
core.setting.clock-format = Clock
core.setting.week-start = Week starts
core.setting.clock-format.help = How the time shows: 14:30 or 2:30 PM.
core.setting.week-start.help = Where weeks begin in calendars and the reading statistics.
core.setting.time-zone = Time zone
core.setting.time-zone.help = Automatic: the system's zone, where there is one.
core.setting.time-zone-rule = Time zone rule
core.setting.time-zone-rule.help = A POSIX TZ rule for zones not in the list; overrides the time zone.
core.setting.battery-low = Battery low at
core.setting.battery-low.help = The charge at which "Battery when low" shows in a status line.
core.setting.awake-holds = Plugins may keep awake
core.setting.awake-holds.help = A clock or game may keep it awake; indexing always does.
core.setting.reading-font = Font
core.setting.status-font = Font
core.setting.status-font.help = The font of the status lines while reading: as the menus', as the book's, or one of its own.
core.setting.reading-font.help = “Book's font” is Literata, or the book's own where the device draws them.
core.setting.font-size = Font size
core.setting.font-size.help = Size of the book text.
core.setting.font-size.largest = Size of the book text. Larger sizes: Discover fonts.
core.setting.line-spacing = Line spacing
core.setting.margin = Margins
core.setting.justify = Justify text
core.setting.hyphenate = Hyphenate words
core.setting.hyphen-min-left = Letters before hyphen
core.setting.hyphen-min-right = Letters after hyphen
core.setting.indent = Indent paragraphs
core.setting.paragraph-spacing = Paragraph spacing
core.setting.margin-ends = Top and bottom margins
core.setting.footnotes = Footnotes
core.setting.reading-app = Reading app
core.setting.reading-app.help = The app books open in; formats, books and folders can have their own.
core.setting.reading-app.format.help = The app books of this format open in. Standard: the reading app above.
core.setting.widows = Lines kept at the top
core.setting.widows.help = The fewest lines of a paragraph carried to the top of a page.
core.setting.orphans = Lines kept at the bottom
core.setting.orphans.help = The fewest lines of a paragraph left at the bottom of a page.
core.setting.page-frame = Page frame
core.setting.page-frame.help = How the text stands on the page; plugins can add other frames.
core.setting.line-spacing.help = Space between lines, relative to the font size.
core.setting.margin.help = Space between the text and the edges of the screen.
core.setting.justify.help = Align paragraphs on both sides.
core.setting.hyphenate.help = Break long words at the end of lines, in the book's language.
core.setting.hyphen-min-left.help = The fewest letters left before a hyphen. 0: the language's own.
core.setting.hyphen-min-right.help = The fewest letters carried after a hyphen. 0: the language's own.
core.setting.indent.help = Indent the first line of each paragraph.
core.setting.paragraph-spacing.help = Leave some space between paragraphs, with or without indented first lines.
core.setting.margin-ends.help = Space above and below the text. As the margins at the sides until it is changed.
core.setting.footnotes.help = A tapped note mark (1, [2], *) shows its note over the page, or goes to it.
core.setting.publisher-styles = Publisher's formatting
core.setting.publisher-styles.help = Use the book's own layout; off shows the text plainly.
core.setting.font-weight = Font weight
core.setting.font-weight.help = Darker, bolder text with any font; helps on light screens.
core.setting.smooth-text = Smooth text
core.setting.smooth-text.help = Soft gray edges. On black-and-white screens each page flashes, slower.
core.setting.text-contrast = Text contrast
core.setting.text-contrast.help = How dark letters are drawn. A tone curve set by a theme takes its place.
core.setting.text-sharpness = Sharpness
core.setting.text-sharpness.help = How crisp letters look. Sharp is sturdier and cleaner, soft is lighter.
core.setting.word-spacing = Word spacing
core.setting.word-spacing.help = Base space between words; 100 % is the font's own. Justified lines may widen it.
core.setting.book-align = Book's alignment
core.setting.book-align.help = Centred and right-aligned text as the book sets it.
core.setting.book-indent = Book's indents
core.setting.book-indent.help = First-line and hanging indents as the book sets them.
core.setting.book-sizes = Book's text sizes
core.setting.book-sizes.help = Larger and smaller text as the book sets it.
core.setting.book-spacing = Book's spacing
core.setting.book-spacing.help = Space around paragraphs as the book sets it.
core.setting.book-fonts = Book's fonts
core.setting.book-fonts.help = Fonts the book brings, where the device shows them.
core.setting.book-margins = Book's margins
core.setting.book-margins.help = Quotes, poems and lists set in as the book sets them.
core.setting.book-line-height = Book's line spacing
core.setting.book-line-height.help = The book's line spacing in place of yours.
core.setting.line-breaking = Line breaking
core.setting.line-breaking.help = Balanced ends lines more evenly; fast breaks them one by one.
core.setting.korean-breaks = Korean line breaks
core.setting.korean-breaks.help = By syllable breaks anywhere, as in print; by word keeps words whole. Korean only.
core.setting.hanging-punctuation = Hanging punctuation
core.setting.hanging-punctuation.help = Quotes, stops, commas and hyphens set just outside the text, so its edges look straight.
core.setting.letter-spacing = Letter spacing
core.setting.letter-spacing.help = Space between letters; at 0 % as the font has it.
core.setting.kerning = Kerning
core.setting.kerning.help = Letter pairs such as AV set closer, as the font says.
core.setting.ligatures = Ligatures
core.setting.ligatures.help = fi, fl and ff joined into one letter where the font has it.
core.setting.indent-size = Indent size
core.setting.indent-size.help = How far first lines are indented, relative to the font size.
core.setting.paragraph-space = Paragraph space
core.setting.paragraph-space.help = How much space between paragraphs, relative to a line.
core.setting.scope-only = Only this book
core.setting.scope-only.help = Changes to font and layout apply to this book only (marked •).
core.setting.edge-ends = Swipe edges: top and bottom
core.setting.edge-sides = Swipe edges: left and right
core.setting.edge.help = How far from the edge a swipe counts as an edge swipe; 0: off.
core.setting.developer = Developer options
core.setting.library-folder = Library folder
core.setting.library-folder.help = The folder with your books.
core.setting.developer.help = For developers: measure battery use, try things out, find faults.
