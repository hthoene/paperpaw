core.setting.rotation = Turn the screen
core.setting.rotation.help = Upright or on its side. With “Only this book” on, it applies to that book alone.
core.setting.button-hints = Button hints
core.setting.button-hints.help = A row at the bottom of the screen names what each button below it does. Not while reading.
core.setting.swap-page-buttons = Swap the page buttons
core.setting.swap-page-buttons.help = The page buttons turn the other way while reading, not in menus.
core.setting.arrows-stay-on-page = Arrow keys stay on the page
core.setting.arrows-stay-on-page.help = At a page's first or last entry the arrows go round on it; page buttons turn pages.
core.setting.space-size = Size
core.setting.space-size.help = The height of every space.
core.setting.align = Alignment
core.setting.align.help = Where the widget's text sits in its place: at the left, in the middle or at the right.
core.setting.frame = Frame
core.setting.frame.help = What the widget is drawn in; a dark card has light text.
core.setting.padding = Spacing
core.setting.padding.help = Space between the widget's content and its edges or frame.
core.setting.size = Size
core.setting.size.help = How large the widget's text is. Where it does not fit, it is made smaller.
core.setting.part.help = Whether the widget shows this. Where there is too little room, it may be left out anyway.
core.setting.widget-frame = Frames of widgets
core.setting.widget-frame.help = A frame for every widget that has none chosen in its own settings.
core.setting.paper = Colours
core.setting.paper.help = Normal, inverted, a gray or transparent. Over a dark picture, pick light text.
core.setting.ink = Text
core.setting.ink.help = The colour of the widget's text; automatic is black or white, whichever reads.
core.setting.widget-paper = Colours of widgets
core.setting.widget-paper.help = What every widget sits on that has none chosen in its own settings.
core.setting.widget-ink = Text of widgets
core.setting.widget-ink.help = The text colour of every widget that has none chosen in its own settings.
core.setting.corners = Corners
core.setting.corners.help = How round the widget's corners are; automatic follows the rest of the interface.
core.setting.frame-line = Frame line
core.setting.frame-line.help = How thick the line of the widget's frame is; automatic follows the interface's lines.
core.setting.shadow = Shadow
core.setting.shadow.help = A solid shadow below and to the right of the widget's card or colour.
core.setting.widget-corners = Corners of widgets
core.setting.widget-corners.help = The corners of every widget that has none chosen in its own settings.
core.setting.widget-frame-line = Frame lines of widgets
core.setting.widget-frame-line.help = The frame line of every widget that has none chosen in its own settings.
core.setting.widget-shadow = Shadows of widgets
core.setting.widget-shadow.help = A shadow for every widget that has none chosen in its own settings.
core.setting.widget-padding = Spacing in widgets
core.setting.widget-padding.help = The spacing inside every widget that has none chosen in its own settings.
core.setting.widget-gap = Space between widgets
core.setting.widget-gap.help = How far apart the widgets on the home screen are.
core.setting.text-color = Text colour
core.setting.paper-color = Paper colour
core.setting.colors.help = Softer than black on white, easier on the eyes; night mode swaps them.
core.setting.text-color-own = Own text colour
core.setting.paper-color-own = Own paper colour
core.setting.color-own.help = A colour code such as #5b4636 (red, green, blue), used when the colour above is "Own colour".
