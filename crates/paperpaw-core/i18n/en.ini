# {file}: the settings file on the memory card, paperpaw.ini.
core.config-unreadable = {file} could not be read, so changes to settings are not saved. Correct or remove the file on a computer.
# {file}: the file of passwords and keys on the memory card.
core.secrets-unreadable = {file} could not be read, so passwords and keys are not saved. Correct or remove the file on a computer.
# Once per start where a saved password or key on the card does not open here (saved on another device, or the device's key is lost).
core.secrets-unopened = Some saved passwords and keys on this card cannot be opened here: they were saved on another device, or this device's key was lost. Enter them again where a plugin asks for them.
# Shown by every plugin whose password save answers "unsupported" (X4 Classic on the old partition table).
core.secrets-unsupported = This device cannot save passwords yet. Reinstall PaperPaw once with the web flasher on paperpaw.org, then it works.
# Said at each start where the device found no card it can use.
core.card.missing = No memory card found, so nothing is kept. Insert a FAT32 card and restart.
core.card.unreadable = The memory card cannot be read, so nothing is kept. Try another card.
core.card.exfat = The memory card is exFAT, so nothing is kept. Format it as FAT32 on a computer.
core.card.no-fat = The memory card is not FAT32, so nothing is kept. Format it as FAT32 on a computer.
