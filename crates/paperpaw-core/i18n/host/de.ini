[meta]
language = de
name = Deutsch
plural = one-other

[messages]

# Interface-7 host prompts. Only the user may answer these host-owned confirmations.
# Focus starts on core.host-confirm.no; never use the affirmative label as default.
# Uninstall: No cancels; keep/delete are separate affirmative choices.
# {name}/{version}: package or firmware; {plugin}: requesting/disabled plugin.
# {size}: already localized size with unit; {signer}/{fingerprint}: verified identity.
# {network}: SSID. Downgrade warning only for versions without rollback.
core.host-confirm.no = Nein
core.host-confirm.yes = Ja
core.host-install.plugin = Plugin {name} ({version}) installieren?
core.host-install.font = Schrift {name} ({version}) installieren?
core.host-install.data = Datenpaket {name} ({version}) installieren?
core.host-install.requester = Angefordert von: {plugin}
core.host-install.size = Größe: {size}
core.host-install.signer = Signiert von: {signer}
core.host-install.key = Signaturschlüssel: {fingerprint}
core.host-install.sideload = Dieses Paket stammt nicht aus einem Katalog. Installiere es nur, wenn du seiner Quelle vertraust.
core.host-install.older = Diese Version ist älter als die installierte Version.
core.host-install.same = Diese Version ist bereits installiert.
core.host-firmware.question = Gerätesoftware {name} ({version}) installieren?
core.host-firmware.foreign = Dies ersetzt PaperPaw durch eine andere Gerätesoftware. PaperPaw startet danach nicht von selbst wieder.
core.host-firmware.no-undo = PaperPaw kann diese Änderung nicht rückgängig machen. Nutze zur Rückkehr die Wiederherstellung der anderen Software oder installiere PaperPaw mit dem Web-Flasher neu.
core.host-firmware.kept = PaperPaw bleibt im Gerätespeicher. Dateien auf der Speicherkarte werden nicht verändert.
core.host-firmware.unsigned = Diese Software ist nicht signiert. Geprüft werden nur der Dateiaufbau und die Eignung für das Gerät, nicht die Herkunft.
core.host-firmware.unknown-key = Diese Software wurde mit einem unbekannten Schlüssel signiert. Installiere sie nur, wenn du dem hier gezeigten Schlüssel vertraust.
core.host-firmware.downgrade = Diese ältere Version kann die vorherige Version nicht automatisch wiederherstellen. Installiere PaperPaw zur Rückkehr mit dem Web-Flasher neu.
core.host-firmware.early-crash = Stürzt die neue Software vor ihrer Sicherheitsprüfung beim Start ab, startet das Gerät möglicherweise nicht mehr. Dann brauchst du den Web-Flasher, um PaperPaw wiederherzustellen.
core.host-remove.question = {name} entfernen? Was soll mit den gespeicherten Daten geschehen?
core.host-remove.keep = Entfernen und Daten behalten
core.host-remove.delete = Entfernen und Daten löschen
core.host-remove.warning = Beim Löschen der Daten gehen auch die gespeicherten Einstellungen und Dateien verloren. Das lässt sich nicht rückgängig machen.
core.host-wifi.join = {plugin} möchte sich mit dem WLAN „{network}“ verbinden. Erlauben?
core.host-wifi.hotspot = {plugin} möchte den WLAN-Hotspot „{network}“ starten. Erlauben?
core.host-ui.phone-locked = Solange das Gerät gesperrt ist, kannst du nicht über das Telefon tippen.
core.host-ui.typing-stopped = Die Live-Anzeige wurde angehalten, weil der Text zu lang ist. Du kannst weiterschreiben. Beim Bestätigen wird der vollständige Text übertragen.
core.host-ui.text-full = Der Text ist zu lang. Kürze ihn und versuche es erneut. Es wurde nichts abgeschnitten.
core.host-ui.clipboard-full = Der Text ist zu lang für die Zwischenablage. Kopiere eine kürzere Auswahl. Der bisherige Inhalt bleibt unverändert.
core.host-ui.clipboard-card = Die Zwischenablage kann nicht gelesen oder geschrieben werden. Prüfe, ob die Speicherkarte eingelegt und lesbar ist.
core.host-ui.card-full = Die Speicherkarte ist voll. Gib Speicherplatz frei und versuche es erneut.
core.host-ui.card-error = Der Text konnte nicht von der Speicherkarte gelesen oder darauf gespeichert werden. Prüfe die Karte und versuche es erneut.
core.host-permission.library = Kann deine gesamte Bibliothek, Lesepositionen sowie Markierungen und Notizen aller Plugins lesen und verändern.
core.host-library.import-failed = Das Buch konnte nicht zur Bibliothek hinzugefügt werden. Prüfe die Speicherkarte und versuche es erneut.
core.host-library.name-taken = Ein Buch mit diesem Namen ist bereits vorhanden. Wähle einen anderen Namen.
core.host-library.replace-denied = Dieses Plugin darf das Buch nicht ersetzen. Es darf nur selbst hinzugefügte Bücher ersetzen, die seitdem nicht verschoben wurden.
core.host-safe-mode.power-escape = Plugin {plugin} wurde ausgeschaltet, weil es nicht mehr reagierte, während du die Ein/Aus-Taste zum Neustarten gedrückt hieltest.

# Notices (ui.md, Messages): the host screen of the notice slot (#257).
core.notice-box = Hinweis

# Firmware confirmation (device.md 5.3): the host screen of an install and its restart.
core.firmware.title = Diese Firmware installieren?
core.firmware.title.restart = Mit der neuen Firmware neu starten?
core.firmware.asked-by = Angefragt von {name}.
core.firmware.image = {project} {version}
core.firmware.signed = Signiert von {key}.
core.firmware.other-key = Mit einem Schlüssel signiert, der nicht von PaperPaw ist: {fingerprint}. Nur installieren, wenn du ihm vertraust.
core.firmware.unsigned = Nicht signiert.
core.firmware.older = Das ist eine ältere oder dieselbe Version.
core.firmware.foreign.1 = Das ist eine andere Firmware, nicht PaperPaw. PaperPaw startet danach nicht von selbst wieder.
core.firmware.foreign.2 = PaperPaw macht das nicht rückgängig. Zurück geht es nur über die andere Firmware oder ein Flash-Werkzeug (der Web-Flasher funktioniert).
core.firmware.foreign.3 = PaperPaw bleibt im Flash und deine Dateien auf der Karte werden nicht angerührt.
core.firmware.foreign.4 = Sie ist nicht signiert, nur geprüft, wie es der Bootloader beim Start täte.
core.firmware.yes = Installieren
core.firmware.yes.restart = Neu starten
core.firmware.no = Abbrechen
core.firmware.dual.title = Dieses Gerät als PaperPaws eigenes behandeln?
core.firmware.dual.what = PaperPaw behandelt dieses Gerät dann als sein eigenes. Das nächste Update löscht die andere Firmware, und du kannst sie nicht zurückholen: nur das Werkzeug, das beide eingerichtet hat, kann es.
core.firmware.dual.yes = Als eigenes behandeln
core.plugin.title = Dieses Plugin installieren?
core.plugin.title.remove = Dieses Plugin entfernen?
core.plugin.what = {name} {version} ({id})
core.plugin.sideload = Es kommt nicht aus dem Store: nichts bürgt dafür.
core.plugin.uses = Es nutzt: {keys}.
core.plugin.yes = Installieren
core.plugin.remove-data = Sein Datenordner bleibt erhalten, wenn du ihn nicht mit dem Plugin entfernst.
core.plugin.yes.remove = Entfernen, Daten behalten
core.plugin.yes.remove-data = Mit Daten entfernen
core.screen.open-failed = Dieser Bildschirm ließ sich nicht öffnen.
core.screen.no-memory = Nicht genug Speicher, um das zu öffnen. Schließe etwas und versuch es noch einmal.
core.plugin.unforgotten = Die gespeicherten Geheimnisse des entfernten Plugins {id} konnten nicht gelöscht werden. Sie bleiben auf der Karte.
