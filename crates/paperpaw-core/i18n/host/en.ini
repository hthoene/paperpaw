[meta]
language = en
name = English
plural = one-other

[messages]

# Interface-7 host prompts. Only the user may answer these host-owned confirmations.
# Focus starts on core.host-confirm.no; never use the affirmative label as default.
# Uninstall: No cancels; keep/delete are separate affirmative choices.
# {name}/{version}: package or firmware; {plugin}: requesting/disabled plugin.
# {size}: already localized size with unit; {signer}/{fingerprint}: verified identity.
# {network}: SSID. Downgrade warning only for versions without rollback.
core.host-confirm.no = No
core.host-confirm.yes = Yes
core.host-install.plugin = Install plugin {name} ({version})?
core.host-install.font = Install font {name} ({version})?
core.host-install.data = Install data package {name} ({version})?
core.host-install.requester = Requested by: {plugin}
core.host-install.size = Size: {size}
core.host-install.signer = Signed by: {signer}
core.host-install.key = Signing key: {fingerprint}
core.host-install.sideload = This package is not from a catalog. Only install it if you trust its source.
core.host-install.older = This is an older version than the one installed.
core.host-install.same = This version is already installed.
core.host-firmware.question = Install device software {name} ({version})?
core.host-firmware.foreign = This replaces PaperPaw with different device software. PaperPaw will not start again on its own.
core.host-firmware.no-undo = PaperPaw cannot undo this change. To return, use the other software’s recovery option or reinstall PaperPaw with the web flasher.
core.host-firmware.kept = PaperPaw stays in the device’s memory. Files on the memory card are not changed.
core.host-firmware.unsigned = This software is not signed. Only its file structure and device compatibility are checked; its source is not verified.
core.host-firmware.unknown-key = This software was signed with an unknown key. Install it only if you trust the key shown here.
core.host-firmware.downgrade = This older version cannot restore the previous version automatically. To return, reinstall PaperPaw with the web flasher.
core.host-firmware.early-crash = If the new software crashes before its startup safety check, the device may stop starting. You will need the web flasher to restore PaperPaw.
core.host-remove.question = Remove {name}? What should happen to its saved data?
core.host-remove.keep = Remove and keep data
core.host-remove.delete = Remove and delete data
core.host-remove.warning = Deleting its data also removes its saved settings and files. This cannot be undone.
core.host-wifi.join = {plugin} wants to connect to Wi-Fi “{network}”. Allow this?
core.host-wifi.hotspot = {plugin} wants to start the Wi-Fi hotspot “{network}”. Allow this?
core.host-ui.phone-locked = Typing on the phone is not available while the device is locked.
core.host-ui.typing-stopped = Live updates have stopped because the text is too long. You can keep typing; the complete text will be sent when you confirm.
core.host-ui.text-full = The text is too long. Shorten it and try again. Nothing was cut off.
core.host-ui.clipboard-full = The text is too long for the clipboard. Copy a shorter selection. The previous clipboard text is unchanged.
core.host-ui.clipboard-card = The clipboard cannot be read or written. Check that the memory card is inserted and readable.
core.host-ui.card-full = The memory card is full. Free some space and try again.
core.host-ui.card-error = The text could not be read or saved on the memory card. Check the card and try again.
core.host-permission.library = Can read your whole library, reading positions, and highlights and notes from every plugin, and can change them.
core.host-library.import-failed = The book could not be added to the library. Check the memory card and try again.
core.host-library.name-taken = A book with this name already exists. Choose another name.
core.host-library.replace-denied = This plugin cannot replace that book. It can only replace books it added itself that have not been moved since.
core.host-safe-mode.power-escape = Plugin {plugin} was turned off because it stopped responding while you held the Power key to restart the device.

# Notices (ui.md, Messages): the host screen of the notice slot (#257).
core.notice-box = Notice

# Firmware confirmation (device.md 5.3): the host screen of an install and its restart.
core.firmware.title = Install this firmware?
core.firmware.title.restart = Restart into the new firmware?
core.firmware.asked-by = Asked by {name}.
core.firmware.image = {project} {version}
core.firmware.signed = Signed by {key}.
core.firmware.other-key = Signed by a key that is not PaperPaw's: {fingerprint}. Install it only if you trust it.
core.firmware.unsigned = Not signed.
core.firmware.older = This is an older version, or the same one.
core.firmware.foreign.1 = This is another firmware, not PaperPaw. PaperPaw does not start again by itself.
core.firmware.foreign.2 = PaperPaw does not undo this. Getting back is up to the other firmware or a flash tool (the web flasher works).
core.firmware.foreign.3 = PaperPaw stays in flash and your files on the card are not touched.
core.firmware.foreign.4 = It is not signed, only checked as the boot loader would start it.
core.firmware.yes = Install
core.firmware.yes.restart = Restart
core.firmware.no = Cancel
core.firmware.dual.title = Treat this device as PaperPaw's own?
core.firmware.dual.what = PaperPaw then treats this device as its own. Its next update erases the other firmware, and you cannot bring it back: only the tool that set the two up can.
core.firmware.dual.yes = Treat as its own
core.plugin.title = Install this plugin?
core.plugin.title.remove = Remove this plugin?
core.plugin.what = {name} {version} ({id})
core.plugin.sideload = It does not come from the store: nothing vouches for it.
core.plugin.uses = It uses: {keys}.
core.plugin.yes = Install
core.plugin.remove-data = Its data folder is kept unless you remove it with the plugin.
core.plugin.yes.remove = Remove, keep data
core.plugin.yes.remove-data = Remove with data
core.screen.open-failed = This screen could not be opened.
core.screen.no-memory = Not enough memory to open this. Close something and try again.
core.plugin.unforgotten = The saved secrets of the removed plugin {id} could not be erased. They stay on the card.
