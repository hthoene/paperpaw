[package]
name = "paperpaw-app"
description = "The standard PaperPaw app: the first-party plugin set that shells install into the kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
# The plugin crates of this build, for the shells' build scripts.
links = "paperpaw-app"

[features]
default = ["store-plugins", "diagnostics", "panes"]
# A list and its detail beside each other on wide screens (the kernel's
# `panes`): every shell with the app's defaults has it; the Xteink
# firmware, never wide, leaves it out.
panes = ["paperpaw-core/panes"]
# Home and reader as linked native plugins too (their `NATIVE_PLUGINS` entries
# and their settings tables, `fixed_tables`, are under this feature, so that
# no table sits in the image of a build that does not link them); news and
# vocabulary join them where `native-linked-store` links the store's plugins.
native-linked-reading = [
    "native-linked",
    "paperpaw-core/native-reading",
    "paperpaw-plugin-dictionary/linked",
    "paperpaw-plugin-home/linked",
    "paperpaw-plugin-reader/linked",
    "paperpaw-plugin-format-txt/linked",
    "paperpaw-plugin-format-xtc/linked",
    "paperpaw-plugin-format-epub/linked",
    "paperpaw-plugin-format-html/linked",
    "paperpaw-plugin-format-fb2/linked",
    "paperpaw-plugin-format-markdown/linked",
    "paperpaw-plugin-format-cbz/linked",
    "paperpaw-plugin-format-docx?/linked",
    "paperpaw-plugin-format-images?/linked",
    "paperpaw-plugin-format-mobi?/linked",
    "paperpaw-plugin-news?/linked",
    "paperpaw-plugin-vocabulary?/linked",
]
# The plugins the store offers as files too (ADR 0024): built in where a
# shell takes them (Android, the emulator, tests), left out of the X4's
# and the X4 Pro's firmware (see `StorePlugins`).
store-plugins = [
    "dep:paperpaw-plugin-widgets",
    "dep:paperpaw-plugin-news",
    "dep:paperpaw-plugin-vocabulary",
    "dep:paperpaw-plugin-fonts-browser",
    "dep:paperpaw-plugin-aids",
    "dep:paperpaw-plugin-notes-vault",
    "dep:paperpaw-plugin-picture-home",
    "dep:paperpaw-plugin-format-docx",
    "dep:paperpaw-plugin-format-images",
    "dep:paperpaw-plugin-mail",
]
# The diagnostics screen, for bringing up devices: in developer builds.
# Kept so builds that name it still work: the diagnostics plugin is a native
# interface-7 plugin now and is not registered here until Core publishes
# native plugins (#228).
diagnostics = []
# Scalable default fonts (needs atomics: not on the ESP32-C3).
outline = ["paperpaw-plugin-fonts-default/outline"]
# Bitmap font packs next to the scalable fonts.
packs = ["paperpaw-plugin-fonts-default/packs"]
# The built-in plugins that are interface-7 native plugins already, linked
# statically (`NATIVE_PLUGINS`, ADR 0034 "One path") instead of their interface-6
# versions; the first-party list stays what Beta 3 built in.
native-linked = [
    "dep:paperpaw-native",
    "dep:paperpaw-plugin-about",
    "dep:paperpaw-plugin-bluetooth",
    "dep:paperpaw-plugin-file-manager",
    "dep:paperpaw-plugin-files",
    "dep:paperpaw-plugin-format-mobi",
    "dep:paperpaw-plugin-help",
    "dep:paperpaw-plugin-lock",
    "dep:paperpaw-plugin-opds",
    "dep:paperpaw-plugin-plugin-manager",
    "dep:paperpaw-plugin-power",
    "dep:paperpaw-plugin-setup",
    "dep:paperpaw-plugin-update",
    "paperpaw-plugin-about/linked",
    "paperpaw-plugin-bluetooth/linked",
    "paperpaw-plugin-help/linked",
    "paperpaw-plugin-plugin-manager/linked",
    "paperpaw-plugin-power/linked",
    "paperpaw-plugin-file-manager/linked",
    "paperpaw-plugin-files/linked",
    "paperpaw-plugin-format-mobi/linked",
    "paperpaw-plugin-keyboard/linked",
    "paperpaw-plugin-lock/linked",
    "paperpaw-plugin-menu/linked",
    "paperpaw-plugin-opds/linked",
    "paperpaw-plugin-settings/linked",
    "paperpaw-plugin-setup/linked",
    "paperpaw-plugin-sleep/linked",
    "paperpaw-plugin-transfer/linked",
    "paperpaw-plugin-update/linked",
    "paperpaw-plugin-wifi/linked",
]
# The plugins the store offers as files too (`STORE_PLUGINS`) whose interface-6
# form is gone under `native-linked`, linked as well. Not for the X4 and the X4
# Pro, which get them as plugin files (their size is the store's, not the
# image's); the shells that link every plugin (the emulator) name both.
native-linked-store = [
    "native-linked",
    "dep:paperpaw-plugin-aids",
    "dep:paperpaw-plugin-mail",
    "dep:paperpaw-plugin-notes-vault",
    "dep:paperpaw-plugin-widgets",
    "dep:paperpaw-plugin-news",
    "dep:paperpaw-plugin-vocabulary",
    "dep:paperpaw-plugin-format-docx",
    "dep:paperpaw-plugin-format-images",
    "dep:paperpaw-plugin-format-mobi",
    "dep:paperpaw-plugin-picture-home",
    "dep:paperpaw-plugin-fonts-browser",
    "paperpaw-plugin-aids/linked",
    "paperpaw-plugin-fonts-browser/linked",
    "paperpaw-plugin-mail/linked",
    "paperpaw-plugin-notes-vault/linked",
    "paperpaw-plugin-picture-home/linked",
    "paperpaw-plugin-widgets/linked",
]

[build-dependencies]
paperpaw-i18n.workspace = true

[dependencies]
paperpaw-core.workspace = true
# What a shell offers a linked native plugin at admission (`native-linked`).
paperpaw-native = { workspace = true, optional = true }
paperpaw-i18n.workspace = true
paperpaw-plugin-dictionary.workspace = true
paperpaw-plugin-files = { workspace = true, optional = true }
paperpaw-plugin-fonts-default = { workspace = true, default-features = false }
paperpaw-plugin-fonts-browser = { workspace = true, optional = true }
paperpaw-plugin-store.workspace = true
paperpaw-epub-family.workspace = true
# The five plugins' crates, listed here for the plugin list and the catalog
# indexes (build.rs); the interface-6 registrations come from the family
# crate until the removals.
paperpaw-plugin-format-epub.workspace = true
paperpaw-plugin-format-html.workspace = true
paperpaw-plugin-format-fb2.workspace = true
paperpaw-plugin-format-markdown.workspace = true
paperpaw-plugin-format-cbz.workspace = true
paperpaw-plugin-format-txt.workspace = true
paperpaw-plugin-format-xtc.workspace = true
paperpaw-plugin-home.workspace = true
paperpaw-plugin-keyboard.workspace = true
paperpaw-plugin-menu.workspace = true
paperpaw-plugin-notes-vault = { workspace = true, optional = true }
paperpaw-plugin-picture-home = { workspace = true, optional = true }
paperpaw-plugin-format-mobi = { workspace = true, optional = true }
paperpaw-plugin-format-docx = { workspace = true, optional = true }
paperpaw-plugin-format-images = { workspace = true, optional = true }
paperpaw-plugin-widgets = { workspace = true, optional = true }
paperpaw-plugin-wifi.workspace = true
paperpaw-plugin-file-manager = { workspace = true, optional = true }
paperpaw-plugin-transfer.workspace = true
paperpaw-plugin-opds = { workspace = true, optional = true }
paperpaw-plugin-lock = { workspace = true, optional = true }
paperpaw-plugin-aids = { workspace = true, optional = true }
paperpaw-plugin-vocabulary = { workspace = true, optional = true }
paperpaw-plugin-sleep.workspace = true
paperpaw-plugin-about = { workspace = true, optional = true }
paperpaw-plugin-bluetooth = { workspace = true, optional = true }
paperpaw-plugin-setup = { workspace = true, optional = true }
paperpaw-plugin-help = { workspace = true, optional = true }
paperpaw-plugin-plugin-manager = { workspace = true, optional = true }
paperpaw-plugin-power = { workspace = true, optional = true }
paperpaw-plugin-mail = { workspace = true, optional = true }
paperpaw-plugin-update = { workspace = true, optional = true }
paperpaw-plugin-news = { workspace = true, optional = true }
paperpaw-plugin-reader.workspace = true
paperpaw-plugin-settings.workspace = true

[dev-dependencies]
# `Kernel::native_is_parked` for the sleep tests (never in a firmware build).
paperpaw-core = { workspace = true, features = ["testing"] }
paperpaw-platform.workspace = true
paperpaw-sdk = { workspace = true, features = ["kernel"] }
# Comic books for the sleep tests (#248).
paperpaw-zip = { workspace = true, features = ["testing"] }

# One check in its own process, no test harness: its allocator counts every
# allocation, and libtest's captured output would grow the heap it measures.
[[test]]
name = "sleep_cycles"
harness = false
required-features = ["native-linked"]

[lints]
workspace = true
