[package]
name = "paperpaw-volume"
description = "PaperPaw's own FAT32 (and later exFAT) volume driver: rust-fatfs, cut down and tuned for the X4's small heap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded", "filesystem"]
publish = false

# The library keeps the name `fatfs`: the X4's S3 frame budgets list its
# functions by symbol name (`fatfs::dir::...`), and they cannot be made again
# without the Xtensa toolchain.
[lib]
name = "fatfs"

[features]
# `std::io` implementations of the driver's I/O traits (tests, host tools).
std = []
# Formatting a volume (tests and tools; the firmware never formats).
format = []

[dev-dependencies]
# The carried tests need the std I/O impls and formatting.
paperpaw-volume = { path = ".", features = ["std", "format"] }

[dependencies]
bitflags = { version = "2", default-features = false }
