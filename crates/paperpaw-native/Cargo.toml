[package]
name = "paperpaw-native"
description = "PaperPaw's native code plugin files (.ppn): their format, authors' signatures, how they are checked and moved to where they run, the table the firmware gives them, and what the X4 keeps behind its firmware (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["plugin", "loader", "relocation", "esp32", "e-reader"]
# The linker script for plugins goes with the format; a plugin's project
# keeps a copy of it (no build script, see paperpaw-plugin.x).
include = ["src", "paperpaw-plugin.x", "paperpaw-plugin7.x", "tests"]

[dependencies]
paperpaw-digest.workspace = true
# Authors' signatures (`signature`). Small code, as the firmware's.
# An exact version: its verifying state lies inside types that cross
# between a code plugin and PaperPaw (ADR 0026).
ed25519-compact = { version = "=2.6.0", default-features = false, features = ["opt_size"] }

[features]
# What only the kernel and the shells do (ADR 0020): the freestanding check a
# loader and the packager share (`preflight::check_freestanding`). Off for
# plugins. Adds only functions, constants and types of its own, never a field
# or variant of an existing type: a plugin's fingerprint does not change with it.
kernel = []

[dev-dependencies]
# The tests build with the kernel's part, as the SDK's do.
paperpaw-native = { path = ".", features = ["kernel"] }

[lints]
workspace = true
