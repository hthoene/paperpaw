[package]
name = "paperpaw-fat"
description = "PaperPaw's storage on FAT file systems with long file names, e.g. the X4's SD card"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded", "filesystem"]
publish = false

[dependencies]
paperpaw-platform.workspace = true
# FAT12 and FAT16 cards (up to 2 GB) mount on the device too.
paperpaw-volume = { workspace = true, features = ["fat16"] }

[dev-dependencies]
paperpaw-volume = { workspace = true, features = ["std", "format"] }
proptest.workspace = true

[lints]
workspace = true
