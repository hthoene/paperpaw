[package]
name = "paperpaw-default-packs"
description = "The data plugins every PaperPaw installs by default (English hyphenation), embedded and put on the card at the first start"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
publish = false

[dependencies]
paperpaw-core.workspace = true
paperpaw-platform.workspace = true

[build-dependencies]
# The one place a hyphenation package is made from its sources (`plugins/<id>/`).
paperpaw-hyphenation-packs = { path = "../../tools/hyphenation-packs" }

[dev-dependencies]
paperpaw-hyphen = { workspace = true, features = ["kernel"] }
paperpaw-sdk.workspace = true

[lints]
workspace = true
