name: Reproducible build

# Builds the Android app twice, in two folders, with the tools of
# shells/android/versions.env, and compares the two: F-Droid publishes the
# app signed with PaperPaw's key only if its own build is the same. And a
# code plugin for the X4 as an author's project (tools/reproducible-plugin.py),
# twice on Linux and twice on Windows: the four files are the same, so the
# plugin library's rebuild matches an author's on any computer.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "shells/android/**"
      - ".github/actions/android-tools/**"
      - ".github/workflows/reproducible.yml"
      - "crates/paperpaw-sdk/**"
      - "crates/paperpaw-native/**"
      - "samples/hello-native/**"
      - "samples/hello-plugin/**"
      - "tools/reproducible-plugin.py"
      - "tools/test_reproducible_plugin.py"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  twice:
    name: Twice the same
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: elsewhere/second
      - uses: ./first/.github/actions/android-tools
        with:
          root: first
      - name: Build both and compare
        env:
          PAPERPAW_REPRODUCIBLE: 1
          PAPERPAW_UNSIGNED: 1
        run: |
          (cd first && shells/android/build-apk.sh)
          (cd elsewhere/second && shells/android/build-apk.sh)
          sha256sum first/target/android/paperpaw-unsigned.apk elsewhere/second/target/android/paperpaw-unsigned.apk
          cmp first/target/android/paperpaw-unsigned.apk elsewhere/second/target/android/paperpaw-unsigned.apk

  plugin:
    name: A code plugin (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The X4's Rust, as the sample names it
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' samples/hello-native/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target riscv32imc-unknown-none-elf
      - name: Build twice and compare
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -m unittest discover -s tools -p "test_reproducible_plugin.py"
          "$py" tools/reproducible-plugin.py "$RUNNER_TEMP/plugin"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ matrix.os }}
          path: ${{ runner.temp }}/plugin/hello-x4.ppn

  same-everywhere:
    name: The code plugin is the same on Linux and Windows
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
      - run: |
          sha256sum built/*/hello-x4.ppn
          cmp built/plugin-ubuntu-latest/hello-x4.ppn built/plugin-windows-latest/hello-x4.ppn
