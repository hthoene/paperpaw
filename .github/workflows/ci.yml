name: CI

on:
  push:
    branches: [main, integration, abi7/integration]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "changelog.d/**"
      - "RELEASING.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - ".claude/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "changelog.d/**"
      - "RELEASING.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - ".claude/**"

# A newer push to the same pull request or branch cancels the run before it,
# so the queue does not fill with runs that the next merge makes obsolete
# (abi7/integration gets one push per merge). main keeps a full run for every
# commit (group per commit, nothing cancelled). CI has no tag trigger; the
# release and update jobs are in release.yml, which never cancels.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The dev and test profiles keep only the line tables (function names, files
  # and lines for backtraces and the heap report, as `profile.dev` says):
  # less to compile and link, and smaller caches. Release builds are not touched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # "Format, lint, test" is the required check and is the job `check` at the
  # end of this group: it passes only when all three parts below passed (not
  # skipped, not cancelled). The parts run side by side, which takes the
  # lint and the feature builds of the tests off the path of the workspace tests.
  lint:
    name: Format, lint, docs
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          components: rustfmt, clippy
      # One cache for the lint and the test job (the key the single job had):
      # the test job alone saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: false
      - run: cargo fmt --all --check
      # The firmware is a crate of its own, outside the workspace.
      - run: rustfmt --edition 2024 --check shells/xteink/src/main.rs
      - run: cargo clippy --workspace --all-targets
      - name: Bluetooth shell host regressions
        run: |
          cargo fmt --manifest-path tools/bluetooth-tests/Cargo.toml --check
          cargo clippy --manifest-path tools/bluetooth-tests/Cargo.toml --locked --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          cargo test --manifest-path tools/bluetooth-tests/Cargo.toml --locked --target x86_64-unknown-linux-gnu
      - name: API documentation without broken links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          components: rustfmt, clippy
      # One cache for the lint and the test job (the key the single job had):
      # the test job alone saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - run: cargo test --workspace
      # The line-break table (crates/paperpaw-text/src/linebreak) is made from
      # Unicode 17.0.0's files, pinned by SHA-256 in the generator (a changed
      # mirror fails here, never passes); the conformance test needs them too.
      # This step fails where the files cannot be had: it never skips.
      - name: Unicode data for the line-break table
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ucd
          key: ucd-17.0.0-${{ hashFiles('tools/linebreak-table.py') }}
      - name: The line-break table is current and passes Unicode's conformance test
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ucd"
          base=https://www.unicode.org/Public/17.0.0/ucd
          mkdir -p "$dir"
          for f in LineBreak.txt EastAsianWidth.txt UnicodeData.txt Scripts.txt Blocks.txt \
                   auxiliary/LineBreakTest.txt emoji/emoji-data.txt; do
            [ -s "$dir/$(basename "$f")" ] || curl -sSf --retry 3 -o "$dir/$(basename "$f")" "$base/$f"
          done
          python3 tools/linebreak-table.py "$dir" --check
          PAPERPAW_UCD_TESTS="$dir" PAPERPAW_REQUIRE_UCD=1 cargo test -p paperpaw-text --lib linebreak

  # The feature builds of the tests run beside the workspace run (they were
  # its tail, about 16 minutes after it): the same commands, a job of their own.
  test-features:
    name: Tests (feature builds)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Reads the cache the test job saves (shared-key check); never saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: check
          save-if: false
      # Builds without runtime font rendering use bitmap font packs; the plugins of the
      # store that carry a copy of their card files for the apps read the card without it;
      # the kernel without panes is that of the Xteink devices.
      - run: cargo test -p paperpaw-text -p paperpaw-plugin-fonts-default -p paperpaw-core -p paperpaw-plugin-reading-goal -p paperpaw-plugin-widgets -p paperpaw-plugin-vocabulary --no-default-features
      # The kernel of a build with the linked native reader (the app's
      # `native-linked-reading`): its book menu has no *Open with…* (todo 544).
      - run: cargo test -p paperpaw-core --lib --features native-reading open_with
      # The app's flows with the linked native plugins, and the plugins that
      # may sleep (#248): each behaves the same parked as awake, also parked
      # again on standby, and 50 standby cycles leave no heap and no handle
      # behind. With the reader and the formats linked (`native-linked-reading`,
      # #243): every format that may sleep is a native plugin there, so its
      # parity cases run and the cycles require it.
      - run: cargo test -p paperpaw-app --features native-linked,native-linked-reading --test flows --test sleep_parity --test sleep_cycles
      # The reading record is kept by Widgets, a native plugin only (#244).
      - run: cargo test -p paperpaw-app --features native-linked,native-linked-reading,native-linked-store --test sleep_parity a_book_ready_at_once_has_its_pages_counted
      # Every linked plugin's screens keep the entry of their titles table (#248):
      # the test is compiled out unless the app's `native-linked*` features are on.
      - run: cargo test -p paperpaw-app --features native-linked-reading --test linked_settings_tables
      - run: cargo test -p paperpaw-app --features native-linked,native-linked-store --test linked_settings_tables
      # The menu is native only (#244): its entries and the tools list are tested linked.
      - run: cargo test -p paperpaw-app --features native-linked-reading,native-linked-store --test menu_entries --test native_registers

  check:
    name: Format, lint, test
    # Runs whatever the parts did (a failed or cancelled part must not leave
    # this check missing or skipped), but not for a draft pull request.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [lint, test, test-features]
    runs-on: ubuntu-latest
    env:
      LINT: ${{ needs.lint.result }}
      TEST: ${{ needs.test.result }}
      TEST_FEATURES: ${{ needs.test-features.result }}
    steps:
      - name: All parts passed
        run: |
          echo "lint: $LINT, test: $TEST, test-features: $TEST_FEATURES"
          [ "$LINT" = success ] && [ "$TEST" = success ] && [ "$TEST_FEATURES" = success ]

  screens:
    name: Screens checked (paperpaw-dev)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - run: cargo build --release -p paperpaw-dev
      # Every screen and widget on the X4s and the Boox, offline from the
      # emulator's fixtures: a text under a row or a control, a part off
      # the screen and the other errors of `visual` fail the run.
      - name: Every screen drawn without faults
        run: target/release/paperpaw-dev visual --quick --network fixtures
      # The same at the largest text, where small screens are tightest.
      - name: Every screen drawn without faults at the largest text
        run: target/release/paperpaw-dev visual --quick --network fixtures --set core.ui-size=24
      # Every screen reached with the buttons alone; one that waits for
      # data the fixtures do not give fails the run.
      - name: Every screen reached with the buttons alone
        run: target/release/paperpaw-dev reach --quick --network fixtures
      # PaperPaw's own plugins keep docs/plugin-conventions.md: its
      # warnings fail the run here (a plugin of others keeps them as
      # warnings). A plugin built into the firmware says why it embeds
      # large files in its Cargo.toml (`embedded-assets`).
      - name: Every first-party plugin keeps the plugin conventions
        # `plugins/test-support/` holds shared test code, not a plugin. The
        # hyphenation folders are sources (patterns, texts) of data plugins that
        # `tools/hyphenation-packs` builds and checks (its tests run in Tests);
        # `paperpaw-dev package` does not know their `[hyphenation]` file kind yet.
        run: |
          dirs=$(ls -d plugins/*/ | grep -v -E '^plugins/(test-support|hyphenation[a-z-]*)/$')
          target/release/paperpaw-dev package --strict $dirs

  msrv:
    name: Oldest Rust
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The workspace's `rust-version`; `+1.88` wins over
      # rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88 (branch head)
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - run: cargo +1.88 check --workspace --all-targets
      - name: Bluetooth host regressions on oldest Rust
        run: cargo +1.88 test --manifest-path tools/bluetooth-tests/Cargo.toml --locked --target x86_64-unknown-linux-gnu

  sdk:
    name: SDK compatibility
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      # rustdoc's JSON output, for the API file; pinned so that it reads
      # the same on every machine.
      NIGHTLY: nightly-2026-10-17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      # Each tool from the cache, else the release, else crates.io.
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-semver-checks
          version: 0.51.0
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-public-api
          version: 0.52.0
      - name: No change that breaks plugins unless the version says so
        # Against each crate's last release on crates.io; a crate joins
        # once it has one.
        run: |
          packages=()
          for crate in paperpaw-sdk paperpaw-platform paperpaw-graphics paperpaw-i18n \
            paperpaw-config paperpaw-text paperpaw-document paperpaw-layout paperpaw-xml \
            paperpaw-zip paperpaw-hyphen paperpaw-image paperpaw-update paperpaw-digest \
            paperpaw-json paperpaw-qr paperpaw-sqlite; do
            if curl -sfo /dev/null "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate"; then
              packages+=(-p "$crate")
            else
              echo "$crate: not released yet"
            fi
          done
          cargo semver-checks "${packages[@]}"
      - name: The public API and the shape of the types of every crate that crosses are its api.txt and shape.txt
        # The crates of crates/paperpaw-sdk/interface/crates.txt: the SDK
        # and every crate of PaperPaw it depends on. tools/interface.py
        # names the nightly it builds with; it is this job's. Its own
        # tests first (what a shape pins).
        run: |
          python3 -I tools/test_interface.py
          python3 tools/interface.py --check
      - name: The shared function tables' index and signatures are shared.list's
        # crates/paperpaw-table: src/index.rs and table.sig from shared.list
        # and the `shared!` declarations; entries only appended.
        run: |
          python3 tools/shared-table.py --check
          python3 -I tools/test_shared_table.py
      - name: What code plugins see changes only with the plugin interface
        # Those files, the linker script and the release's compilers, as
        # interface.txt and interface/ keep them for native::INTERFACE
        # (ADR 0026): any change raises it, a new item alone does not.
        run: cargo test -p paperpaw-sdk --test interface

  abi7:
    name: Stable ABI against trusted base
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      # Event metadata selects the reviewed parent, never the candidate lock.
      ABI_BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - name: Extract the trusted lock without executing base code
        env:
          ABI_BASELINE: ${{ runner.temp }}/paperpaw-abi-baseline.lock
        shell: bash
        run: |
          if [[ ! "$ABI_BASE_REV" =~ ^[0-9a-f]{40}$ || "$ABI_BASE_REV" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::A trusted PR base or previous push commit is required"
            exit 1
          fi
          test "$(git rev-parse "${ABI_BASE_REV}^{commit}")" = "$ABI_BASE_REV"
          git show "${ABI_BASE_REV}:abi/abi.lock" > "$ABI_BASELINE"
          test -s "$ABI_BASELINE"
          sha256sum "$ABI_BASELINE"
      - name: The plugin interface is raised or frozen only by name, against the trusted base
        run: python3 tools/abi-reference-check.py --base "$ABI_BASE_REV"
      - name: Generated ABI matches the code (append-only once a minor is released)
        env:
          ABI_BASELINE: ${{ runner.temp }}/paperpaw-abi-baseline.lock
        run: bash tools/abi-check.sh --ci

  embedded:
    name: no_std targets
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [riscv32imc-unknown-none-elf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - name: Build kernel and first-party plugins
        # The standard app pulls in every first-party plugin, so a new
        # one is built here without being listed.
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p paperpaw-app --no-default-features --features packs,store-plugins,diagnostics
          -p paperpaw-image -p paperpaw-sqlite -p paperpaw-stardict
          -p paperpaw-sample-hello -p paperpaw-x4 -p paperpaw-fat
      - name: SDK interface-7 entry packs and rejects misalignment
        if: matrix.target == 'riscv32imc-unknown-none-elf'
        run: CARGO_TARGET_DIR="$PWD/target/abi7-sdk-entry" samples/abi7-sdk-entry/check.sh
      - name: The smallest interface-7 sample packs to its committed file
        # Built and packed by the real packer and compared with the file the
        # tests read (crates/paperpaw-native/tests/data); it had stopped
        # compiling unseen when only ci-local.sh built it.
        if: matrix.target == 'riscv32imc-unknown-none-elf'
        run: CARGO_TARGET_DIR="$PWD/target/abi7-x4-min" samples/abi7-x4-min/build.sh --check
      - name: Lint the web emulator
        # The emulator's device model and paperpaw-dev's checks, with std,
        # in a browser (shells/web); its exports exist on wasm32 only.
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo clippy --target wasm32-unknown-unknown -p paperpaw-web -- -D warnings
      - name: Build the web emulator
        # As it is served, its size told and kept in bounds (16 MB held
        # until the Mail plugin, now 16.8; see tools/ci-local.sh).
        if: matrix.target == 'wasm32-unknown-unknown'
        run: python3 shells/web/build.py --limit-mb 16.8

  firmware:
    name: Firmware (${{ matrix.device }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Normally 3-20 minutes. An apt mirror that stalls once held a run for 45
    # (build-prerequisites.sh): fail then and rerun.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The X4 and the X3 (ESP32-C3; the X3 experimental), the X4 Pro and
        # the X4 Classic (ESP32-S3).
        device: [x4, x3, x4-pro, x4-classic]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/xteink-tools
        with:
          device: ${{ matrix.device }}
          # A slow Ubuntu mirror must not fail a source check (#876); a release does not do this.
          clang-fallback: "true"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          # The firmware, the sample code plugin and paperpaw-sign.
          workspaces: |
            shells/xteink
            samples/hello-native
            .
          # The two S3 devices build the same dependencies (the core library for
          # Xtensa, esp-hal, mbedTLS) and the X4 and the X3 the same for RISC-V:
          # one cache for each pair, not four (the four held 6.8 of the 10 GB the
          # repository may keep, and evicted the small caches that matter more).
          shared-key: ${{ (matrix.device == 'x4-pro' || matrix.device == 'x4-classic') && 'firmware-s3' || 'firmware-riscv' }}
      # Code plugins for the ESP32-S3 link with core libraries built once,
      # as the release publishes them; installed first, as the release
      # does, so that everything after builds beside them.
      - uses: ./.github/actions/xtensa-std
        if: matrix.device != 'x4' && matrix.device != 'x3'
      # espflash makes the install image; installed after the cache is
      # back, which keeps it.
      - name: espflash
        uses: ./.github/actions/espflash
      - name: Lint and build
        working-directory: shells/xteink
        # Linted with remote control over USB, as for testing, and
        # without, as released; built as released.
        # Without the job's RUSTFLAGS (-D warnings): they would replace the
        # flags of shells/xteink/.cargo/config.toml (no jump tables, frame
        # pointers), which the frame budgets are measured with. Clippy denies
        # the warnings itself; build.rs fails the build if the flags are missing.
        # The build remaps the runner's paths as the release's does
        # (tools/ci/firmware-remap.sh): the image here is the released one's
        # size (shells/xteink/size-budget.txt).
        run: |
          env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE,remote" -- -D warnings
          env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE" -- -D warnings
          remap="$("$GITHUB_WORKSPACE/tools/ci/firmware-remap.sh" "$FIRMWARE_TARGET" "$FIRMWARE_TOOLCHAIN")"
          env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" build $FIRMWARE_CARGO --config "$remap" --features "$DEVICE"
      # The released build's install image against its size budget
      # (shells/xteink/size-budget.txt, ticket #258). Measured here, before the
      # next step rebuilds the same file with `ppn5` and legacy symbol names on
      # the S3: the later install-image step packs that build, not this one.
      # Fails when the image is over its line, and when the image or the line
      # is missing (tools/size-report.py).
      - name: The install image stays within its size budget
        uses: ./.github/actions/install-image
        with:
          out: ${{ runner.temp }}/released.bin
      - name: The released image against shells/xteink/size-budget.txt
        run: python3 -I tools/size-report.py check --device "$DEVICE" --image "$RUNNER_TEMP/released.bin"
      # The loader's S3 code (format-5 files in PSRAM, `ppn5`) is off by
      # default and so not in the lint and build above; the X4's own job
      # (firmware-host-frames) covers the X4. Without the job's RUSTFLAGS,
      # as above.
      - name: Lint and build the S3 with interface-7 plugins
        if: matrix.device == 'x4-pro' || matrix.device == 'x4-classic'
        working-directory: shells/xteink
        run: |
          env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE,ppn5" -- -D warnings
          # Built with legacy symbol mangling (espup's compiler defaults to v0,
          # which the scan's paths do not name: shells/xteink/frame-budget-s3.txt);
          # the names are the only difference from the release's build.
          env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" build $FIRMWARE_CARGO --features "$DEVICE,ppn5" \
            --config 'target.xtensa-esp32s3-none-elf.rustflags=["-Z","unstable-options","-C","symbol-mangling-version=legacy"]'
      # What a plugin's code can call into on the S3, as for the X4 below: the
      # host table's entries and what they reach (every direct call, and every
      # call through an `l32r` literal), each held under the 2 KiB band; the calls
      # it cannot follow are listed one by one in the budget, with their reasons
      # (`shells/xteink/frame-budget-s3.txt`, and `-classic.txt` for the X4 Classic).
      - name: The S3's host frames and calls fit under the band
        if: matrix.device == 'x4-pro' || matrix.device == 'x4-classic'
        run: |
          # The X4 Pro and the X4 Classic are two builds with their own symbols:
          # one budget each.
          budget=shells/xteink/frame-budget-s3.txt
          [[ "$DEVICE" == x4-classic ]] && budget=shells/xteink/frame-budget-s3-classic.txt
          cargo run -q --release -p paperpaw-sign -- frames-s3 \
            shells/xteink/target/xtensa-esp32s3-none-elf/release/paperpaw-xteink \
            --budget "$budget"
      # As the release makes it: the build fails when CrossPoint's menu
      # could no longer install it.
      - name: The install image fits CrossPoint's slot
        uses: ./.github/actions/install-image
        with:
          out: ${{ runner.temp }}/install.bin
      # For the update path (job update-path).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-image-${{ matrix.device }}
          path: ${{ runner.temp }}/install.bin
          retention-days: 1
      - name: The sample code plugin fits the firmware
        id: native
        uses: ./.github/actions/native-sample
      # The panic handler's frames stay within what the stack band keeps
      # for it (`shells/xteink/frame-budget.txt`).
      - name: The panic path's stack frames fit the reserve
        if: matrix.device == 'x4' || matrix.device == 'x3'
        run: |
          cargo run -q --release -p paperpaw-sign -- frames \
            shells/xteink/target/riscv32imc-unknown-none-elf/release/paperpaw-xteink \
            --budget shells/xteink/frame-budget.txt
      # A code plugin's file is the same wherever it is built, as the
      # plugin library's rebuild needs: the sample, as its author's
      # repository has it (the SDK from a registry), built in two folders
      # for each chip and compared byte for byte.
      - name: Code plugins are the same in any folder
        if: matrix.device == 'x4-pro'
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' samples/hello-native/rust-toolchain.toml)" \
            --profile minimal --target riscv32imc-unknown-none-elf
          tools/plugin-files/anywhere.sh x4 "$RUNNER_TEMP/anywhere-x4"
          tools/plugin-files/anywhere.sh x4-pro "$RUNNER_TEMP/anywhere-x4-pro"
      # PaperPaw's own plugins that the store offers, as the release
      # builds them (unsigned here): each packs, for this chip, with the
      # firmware's fingerprint.
      # Signed with a key made for this run, and their catalogue entries
      # made, as the release does.
      # The X3 takes the X4's builds (the same chip and fingerprint).
      - name: The store's first-party plugins fit the firmware
        if: matrix.device != 'x3'
        env:
          FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: |
          out="$RUNNER_TEMP/plugins"
          tools/plugin-files/build.sh "$DEVICE" "$out" --fingerprint "$FINGERPRINT"
          cargo build -q --release -p paperpaw-sign
          target/release/paperpaw-sign key "$RUNNER_TEMP/ci.key" > /dev/null
          tools/plugin-files/sign.sh "$out" target/release/paperpaw-sign --key "$RUNNER_TEMP/ci.key"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          python3 tools/plugin-files/catalogue.py "$out" "$version" https://example.invalid/ci
      # Interface 7 (decision 142): every first-party plugin with a native
      # entry builds and links for the ESP32-S3 (espup's compiler, the
      # release's core libraries). Packing waits for the target-9 profile of
      # abi/ppn5.md; until then this is the build, not the file. The X4 Classic
      # runs the X4 Pro's code, so one device builds it.
      - name: The interface-7 plugins build for the S3
        if: matrix.device == 'x4-pro'
        run: |
          # Exit 4 is "pending": the S3's generated ABI metadata does not exist
          # yet. Shown as a notice, never as a pass; every other failure fails.
          rc=0
          tools/plugin-files7/build.sh x4-pro "$RUNNER_TEMP/plugins7-s3" || rc=$?
          if [[ $rc = 4 ]]; then
            echo "::notice title=S3 interface-7 plugins::NOT BUILT: the target-9 metadata profile is not there yet (decision 142)"
          fi
          [[ $rc = 0 || $rc = 4 ]]
      # espup's toolchain is cached between runs (xteink-tools): the core
      # libraries installed into it go again, so that no run finds those
      # of another commit.
      - name: The core libraries out of the cached toolchain
        if: always() && matrix.device != 'x4' && matrix.device != 'x3'
        run: rm -rf "$(rustc +esp --print sysroot)/lib/rustlib/xtensa-esp32s3-none-elf"

  # The whole update path on a computer, with the real files
  # (crates/paperpaw-x4/tests/update_path.rs): for each device, the
  # update of the release before (its SHA-256 checked) flashed on a flash
  # with the table PaperPaw ships, this run's firmware (signed with a key
  # made for the run) installed over it online by the update plugin,
  # started, its trial run and kept, then once more to a higher version;
  # and a damaged update, a download cut short, one too large and a trial
  # that fails, none of which may take the device's firmware. `check`
  # runs the same test with images made in it.
  #
  # What it proves: the release before's image parses and boots as the
  # running firmware, and this build's installer
  # (crates/paperpaw-x4/src/updates.rs) accepts and installs this build's
  # file. What it does not: that the release before's own installer
  # installs this build's file, as devices in the field will do. From the
  # first release that contains `paperpaw_x4::updates`, add a step that
  # checks out the previous tag's `crates/paperpaw-x4` (git worktree) and
  # runs that tag's installer on this run's file; the harness takes the
  # run's key as a built-in key, so the old code needs only that hook.
  # The job fails when the x4's update is missing from the release before
  # or no device was tested (tools/ci/update-path.sh).
  update-path:
    name: Update path (this build's installer, from the release before's image)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: [firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          key: update-path
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: install-image-*
          path: ${{ runner.temp }}/images
      - name: Built once
        run: |
          cargo build -q --release -p paperpaw-sign
          cargo test -q --release -p paperpaw-x4 --test update_path --no-run
      - name: Each device, from the release before's image
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/update-path.sh "$RUNNER_TEMP/images" "$RUNNER_TEMP/update-path"

  native:
    name: Native plugins
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          workspaces: |
            .
            crates/paperpaw-core/tests/native-plugin
      - name: A plugin from another workspace, in a kernel
        run: |
          cargo build --release --manifest-path crates/paperpaw-core/tests/native-plugin/Cargo.toml
          cargo test -p paperpaw-core --test native_plugin -- --ignored
          # The preflight accepts the real -nostartfiles plugin (guards the default-deny rules)
          cargo test -p paperpaw-native --test real_plugin -- --ignored
      - name: The SDK keeps no mutable statics
        # A plugin file has no writable data, and a plugin has its own
        # copy of the SDK code it uses. Without LTO, each crate's objects
        # are seen apart.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo build --release --target riscv32imc-unknown-none-elf -p paperpaw-sdk --target-dir target/statics
          cargo run --release -p paperpaw-sign -- statics \
            target/statics/riscv32imc-unknown-none-elf/release/deps/*.rlib
      - name: The notices name every crate that ships
        # NOTICE and the app's licences (plugins/about), from the lockfiles
        # by tools/licences/build.py: a crate added, removed or updated
        # without them fails here.
        run: python3 tools/licences/build.py --check
      - name: Every Cargo.lock agrees with its manifests
        # `cargo metadata --locked` at the root reads the root's lock only.
        # tools/check-lockfiles.py runs it for each lockfile in git and also
        # finds entries nothing needs any more (a bumped plugin or a removed
        # crate left in shells/xteink, tools/plugin-files or fuzz).
        run: python3 tools/check-lockfiles.py
      - name: A plugin's own stage codec is its schema's
        # plugins/about/src/stages.rs from plugins/about/stages/*.def by
        # tools/stage-codec.py (needs rustfmt, which this job has).
        run: |
          python3 tools/stage-codec.py plugins/about/stages plugins/about/src/stages.rs --check
          python3 tools/stage-codec.py plugins/reader/stages plugins/reader/src/stages.rs --check --plugin reader
          # aids subscribes to the reader's reader.filter@1: its copy of the schema is the reader's.
          python3 tools/stage-codec.py plugins/aids/stages plugins/aids/src/reader_filter/stages.rs --check --plugin reader
          cmp 'plugins/aids/stages/reader.filter@1.def' 'plugins/reader/stages/reader.filter@1.def'
          python3 tools/stage-codec.py plugins/readwise/stages plugins/readwise/src/stages.rs --check
          cmp plugins/reader/stages/reader.notes-exported@1.def plugins/readwise/stages/reader.notes-exported@1.def
      - name: A subscriber's stage codec is its copy of the owner's schema
        # plugins/wikipedia/src/stages.rs from the copy of about.lines@1.def (a test holds
        # the copy to the owner's file); no --plugin: the stage is About's.
        run: python3 tools/stage-codec.py plugins/wikipedia/stages/subscribed plugins/wikipedia/src/stages.rs --check
      - name: Joplin's copy of the reader's export stage codec is the schema's
        run: python3 tools/stage-codec.py plugins/joplin/stages plugins/joplin/src/stages.rs --check
      - name: The plugin store's rules are the site's
        # tools/publish/store-rules.json, which paperpaw-dev and
        # paperpaw-sign check by, against paperpaw.org's own (where it
        # serves them).
        run: |
          if curl -sSf --max-time 20 https://paperpaw.org/api/v1/store-rules.json -o "$RUNNER_TEMP/store-rules.json"; then
            cargo run --release -p paperpaw-sign -- store-rules "$RUNNER_TEMP/store-rules.json"
          else
            echo "::notice::paperpaw.org serves no store rules (yet): not compared"
          fi
      - name: The sample and the CI templates name the firmware's compilers
        run: |
          x4="$(sed -n 's/^channel = "\(.*\)"/\1/p' shells/xteink/rust-toolchain.toml)"
          . shells/xteink/versions.env
          template=samples/hello-native/.github/workflows/build.yml
          release=tools/dev/templates/.github/workflows/paperpaw-release.yml
          status=0
          for found in \
            "samples/hello-native/rust-toolchain.toml:channel = \"$x4\"" \
            "$template:RUST_X4: \"$x4\"" \
            "$template:RUST_X4_PRO: \"$ESP_RUST_VERSION\"" \
            "$template:ESP_GCC: \"$ESP_GCC_VERSION\"" \
            "$release:RUST_X4: \"$x4\"" \
            "$release:RUST_X4_PRO: \"$ESP_RUST_VERSION\"" \
            "$release:ESP_GCC: \"$ESP_GCC_VERSION\""; do
            if ! grep -qF -- "${found#*:}" "${found%%:*}"; then
              echo "::error file=${found%%:*}::should say ${found#*:}, as shells/xteink does"
              status=1
            fi
          done
          exit $status

  table-compat:
    name: Old plugins, new firmware (shared function tables)
    # A plugin built at the last interface raise calls the firmware's
    # shared functions by index (ADR 0026): the tables only grow, and a
    # body changed since then must keep what those plugins expect. See
    # tools/table-compat.sh; `crates/paperpaw-table/table-baseline.txt`
    # names the raise's commit (the raise changes it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          workspaces: |
            .
            crates/paperpaw-core/tests/native-plugin
      - name: The list is only appended to, and old plugins still agree (or, of an older interface or draft, are refused)
        # The baseline from table-baseline.txt, `none` refused once an
        # interface with tables is tagged: in the script, as ci-local runs it.
        run: tools/table-compat.sh
      - name: This tree's own plugin runs, built with its own copies and in host table mode
        # While the interface is a draft the step above only asserts that
        # the interface-6 baseline is refused; the baseline HEAD (this
        # tree) is of the same interface and draft, so both builds must
        # run and agree, as they will against the frozen baseline.
        run: tools/table-compat.sh HEAD

  architecture:
    name: Architecture rules
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags, for the plugins' versions.
          fetch-depth: 0
      - name: Plugins depend on the SDK only
        # Their tests may run them in a kernel (dev-dependencies).
        run: |
          status=0
          for manifest in plugins/*/Cargo.toml samples/*/Cargo.toml; do
            if awk '/^\[/ { part = $0 } part == "[dependencies]" && /^paperpaw-core/' "$manifest" | grep -q .; then
              echo "::error file=$manifest::plugins must depend on paperpaw-sdk, not paperpaw-core"
              status=1
            fi
          done
          exit $status
      - name: The store's first-party folders carry How it works
        run: |
          python3 -m unittest discover -s tools/plugin-files
          python3 -m unittest discover -s tools -p "test_x4_remote.py"
      # Devices update a plugin only to a newer version: one changed since
      # the last release has one (or says no reader sees the change).
      - name: A store plugin that changed has a newer version
        run: python3 tools/plugin-files/versions.py
      - name: The size gate fails when an image is over its budget or a file is missing
        run: python3 -m unittest discover -s tools -p "test_size_report.py"
      - name: The handbook holds the SDK and PaperPaw's own plugins, without tests
        run: python3 -m unittest discover -s tools -p "test_handbook.py"
      - name: CI tool setup verifies binaries and keeps its missing-tool fallback
        run: python3 -m unittest discover -s tools -p "test_ci_tools.py"
      - name: The local check script fails when a step fails
        run: python3 -m unittest discover -s tools -p "test_check_local.py"
      - name: The lockfile check finds a stale version and a left-over entry
        run: python3 -m unittest discover -s tools -p "test_check_lockfiles.py"
      - name: Android takes each version over the ones before it, as the update plugin orders them
        # The order itself against compare_versions: crates/paperpaw-sdk/tests/android_codes.rs.
        run: |
          for pair in "0.4.0-dev 40050" "0.5.0-beta.1 50001" "0.5.0-beta.2 50002" \
            "0.5.0-beta.10 50010" "0.6.0-beta.1 60001" "0.6.0-beta.2 60002" "0.5.0-dev 50050" "0.5.0-rc.1 50051" "0.5.0 50099" \
            "0.5.1-beta.1 50101"; do
            set -- $pair
            got="$(shells/android/version-code.sh "$1")"
            [[ "$got" == "$2" ]] || { echo "::error::$1 has version code $got, not $2"; exit 1; }
          done

  emulator:
    name: Emulator (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # A PR runs Linux; Windows and macOS run on main and integration.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - run: cargo build -p paperpaw-emulator
      - name: Headless smoke test on every profile
        shell: bash
        run: |
          emu="cargo run -q -p paperpaw-emulator --"
          for profile in $($emu --list-profiles | cut -d' ' -f1); do
            $emu --headless --profile "$profile" --script "wait:600" --screenshot "out/$profile.png"
          done
          # Open a sample book from the library and read a few pages.
          $emu --headless --profile xteink-x4 \
            --script "confirm,right,confirm,page-forward,page-forward,page-back,wait:2000" \
            --screenshot out/xteink-x4-reading.png
          # An EPUB within the X4 heap budget: contents, jump to chapter II.
          $emu --headless --profile xteink-x4 \
            --set reader.open-last=off --set slots.core.home=files.browser \
            --script "confirm,wait:500,confirm,confirm,right,right,right,right,confirm,wait:300" \
            --screenshot out/xteink-x4-epub-chapter.png
          $emu --headless --profile kobo-clara-bw --set core.language=de \
            --script "tap:500:480,tap:500:190,swipe:900:700:100:700,tap:100:700,long-tap:500:700" \
            --screenshot out/kobo-clara-bw-reading.png
          # Reader menu (long confirm), larger text, settings screen.
          $emu --headless --profile xteink-x4 --script "long:confirm,confirm,wait:300" \
            --screenshot out/xteink-x4-larger-text.png
          $emu --headless --profile xteink-x4 \
            --script "long:confirm,right,right,right,right,right,confirm,right,confirm" \
            --screenshot out/xteink-x4-settings.png
          # Only two buttons: open a book, the menu and the settings, edit a value.
          $emu --headless --profile two-buttons \
            --script "long:page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward,page-forward,page-forward,page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward" \
            --screenshot out/two-buttons-settings.png
          # What a release hands the workshop: the registry, --stdio, the
          # handbook.
          $emu --registry out/registry.json
          printf '%s\n' '{"op": "quit"}' | $emu --stdio | grep -q '"event": "ready"'
          py="$(command -v python3 || command -v python)"
          "$py" tools/handbook.py out/registry.json ci out/handbook.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: emulator-screenshots
          path: out/*.png

  android:
    name: Android APK
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head)
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
      - run: cargo install cargo-ndk --locked
      # The runner's variables are not in the `env` context, so the NDK
      # path is passed on through GITHUB_ENV.
      - name: Find the NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - name: Lint the Android shell
        run: cargo ndk -t arm64-v8a --platform 26 clippy -p paperpaw-android
      - name: Build the APK
        run: shells/android/build-apk.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paperpaw-android-apk
          path: target/android/paperpaw.apk

  fuzz:
    name: Fuzz parsers
    # The long run on main and integration; a PR gets it when it merges.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly (branch head)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: One minute per target, seeded with the sample books
        run: |
          mkdir -p fuzz/corpus/epub fuzz/corpus/txt
          cp samples/library/books/*.epub fuzz/corpus/epub/
          cp samples/library/books/*.txt fuzz/corpus/txt/
          mkdir -p fuzz/corpus/image
          cp crates/paperpaw-image/tests/data/*.jpg crates/paperpaw-image/tests/data/*.png fuzz/corpus/image/
          # `+nightly` overrides rust-toolchain.toml, which pins stable.
          for target in epub txt xml hyphen image lua bidi wrap; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=1024
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts

  deny:
    name: Licenses and advisories
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny runs on the runner, not in EmbarkStudios/cargo-deny-action's
      # container: the firmware pins its own compiler (rust-toolchain.toml),
      # which that container cannot install, and its image build pipes an
      # unchecked `curl | tar` (a broken download failed this job). The
      # install action checks the release archive against its published
      # checksum; if GitHub's release downloads are down, cargo-deny is built
      # from crates.io instead (the cargo-tool action, which also caches
      # it). The version is the one the container had.
      - uses: ./.github/actions/cargo-tool
        with:
          tool: cargo-deny
          version: 0.20.2
      - name: The workspace's dependencies
        run: cargo deny --log-level warn --manifest-path Cargo.toml --all-features check
      - name: The X4 firmware's dependencies too
        run: cargo deny --manifest-path shells/xteink/Cargo.toml --all-features check
      - name: Bluetooth host-test dependencies too
        run: cargo deny --manifest-path tools/bluetooth-tests/Cargo.toml --all-features check

  # What a plugin's code can call into on the X4 (the interface-7 host entries,
  # the dispatch, the loader's x4 module) exists in the firmware built with
  # `ppn5`, which is off by default and so not in the `firmware` jobs' builds.
  # Its own job, beside them, builds the X4 with it and holds those functions'
  # stack frames under the 2 KiB band at the main stack's end
  # (`shells/xteink/frame-budget-ppn5.txt`).
  firmware-host-frames:
    name: Firmware interface-7 host frames (x4, ppn5)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVICE: x4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/xteink-tools
        with:
          device: x4
          clang-fallback: "true"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/abi7/integration' || github.ref == 'refs/heads/main') }}
          workspaces: |
            shells/xteink
            .
          key: x4-ppn5
      - name: Lint the X4 with interface-7 plugins
        working-directory: shells/xteink
        # The `ppn5` code sites are not in the other jobs' lint.
        run: env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE,ppn5" -- -D warnings
      - name: Build the X4 with interface-7 plugins
        working-directory: shells/xteink
        # As above: the config's flags, not the job's RUSTFLAGS.
        run: env -u RUSTFLAGS cargo +"$FIRMWARE_TOOLCHAIN" build $FIRMWARE_CARGO --features "$DEVICE,ppn5"
      - name: The plugins' host frames fit under the band
        run: |
          cargo run -q --release -p paperpaw-sign -- frames \
            shells/xteink/target/riscv32imc-unknown-none-elf/release/paperpaw-xteink \
            --budget shells/xteink/frame-budget-ppn5.txt

  # After a push to a branch that saves caches: the newest Rust cache entry of
  # each prefix stays, the older ones go. Every Cargo.lock change otherwise
  # leaves a stale ~1 GB entry per firmware build, the 10 GB quota fills, and
  # GitHub then evicts by last use, the small entries that save the most
  # (the Xtensa toolchain: 5 minutes on each S3 job) included. It runs after
  # everything else has saved its own entry, is no required check, and a
  # failure of it changes nothing.
  prune-caches:
    name: Old Rust caches removed
    if: ${{ always() && github.event_name == 'push' }}
    needs: [check, test, screens, msrv, sdk, abi7, embedded, firmware, update-path, native, table-compat, architecture, emulator, android, fuzz, deny, firmware-host-frames]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I tools/ci/prune_caches.py "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
