name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fragments:
    name: Changelog fragments
    # A draft is not checked on every push; the check runs when it is made
    # ready for review (`ready_for_review`) and on every push after that.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check format and collection
        run: python3 -m unittest discover -s tools -p test_changelog.py
      - name: Fragments are well formed
        run: python3 tools/changelog.py check
