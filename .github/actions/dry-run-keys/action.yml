name: Throw-away keys
description: >
  For a dry run of release.yml or store-plugin.yml (a workflow_dispatch, never
  a tag): makes new signing keys for the job, so that the signing steps run
  without the real ones, and puts them into the job's environment. Does
  nothing for a real release (DRY_RUN is not "true"). The keys exist for this
  job only and are worth nothing: nothing signed with them is published.
runs:
  using: composite
  steps:
    - name: Throw-away keys (a dry run only)
      shell: bash
      run: |
        [[ "$DRY_RUN" == true ]] || exit 0
        cargo build -q --release -p paperpaw-sign
        for name in PAPERPAW_SIGNING_KEY PAPERPAW_PLUGIN_KEY; do
          file="$RUNNER_TEMP/dry-$name.key"
          target/release/paperpaw-sign key "$file" > /dev/null
          echo "$name=$(cat "$file")" >> "$GITHUB_ENV"
          rm -f "$file"
        done
        echo "::notice::dry run: signing keys made for this job only; nothing is published"
