# What a reader's plugin store shows of the plugin. Only the list of the
# source is made of store/; it is no part of what readers install.
# Comments go on lines of their own, never after a value.

[store]
# One of: reading, formats, library, sync, home, look, notes, learning, news, tools, games, languages, system.
group = tools
# How it works, shown on the plugin's page: a few sentences.
description = "Hello paw adds an entry to the tools menu. It opens a screen that greets you by the name you set in the settings, and counts the books opened since the device started."
# An SPDX identifier.
licence = MIT
# The PaperPaw (its SDK) the plugin is made for.
sdk = 0.6
# Where its source is.
source = https://github.com/your-name/your-source
